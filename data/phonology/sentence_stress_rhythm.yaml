activities:
- description: 'Say sentences aloud and tap on each stressed syllable. The taps should
    be roughly evenly spaced. Start with simple sentences and progress to more complex
    ones. Learners feel the regular beat of English rhythm.

    '
  level: A1-B2
  name: Beat tapping for stress-timing
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-59'
  type: awareness, production
- description: 'Give learners a list of words and have them sort into content words
    (stressed) and function words (unstressed). Then present sentences and have learners
    identify which words are stressed and which are reduced.

    '
  level: A2-B1
  name: Content word / function word sorting
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-60'
  type: awareness
- description: 'Play recordings of natural speech. Learners identify whether function
    words are pronounced in their strong or weak form. Discuss why the speaker chose
    one form or the other.

    '
  level: B1-C2
  name: Strong/weak form identification
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 60-68'
  type: discrimination, awareness
- description: 'Provide a neutral sentence and a context that requires contrastive
    stress. Learners produce the sentence with the appropriate stress shift. Example:
    Neutral: ''I want to go.'' Context: ''Not stay?'' -> ''I want to GO.''

    '
  level: B1-C2
  name: Contrastive stress drill
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 60-68'
  type: production
- description: 'Teacher says a sentence with natural rhythm. Learners repeat, focusing
    on matching the rhythm (not just the individual sounds). Use choral drilling to
    build the feel of English rhythm.

    '
  level: A1-B2
  name: Rhythm imitation
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-59'
  type: production
assessment:
  methods:
  - Learners identify stressed and unstressed words in spoken sentences
  - Learners produce sentences with appropriate stress and rhythm
  - Learners use weak forms of function words in connected speech
  - Learners shift stress for contrastive purposes
  - Learners tap the rhythmic beat of English sentences
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-68'
cefr_range: A1-C2
teaching:
  methodology: Discovery-based (Underhill)
  tips:
  - 'Underhill (1994) Sound Foundations Level 2-3: English is stress-timed —
    stressed syllables occur at roughly equal intervals, unstressed syllables compress
    between them. Word stress has primary (strongest) and secondary patterns. Weak
    forms: function words (to, of, for, and) reduce to schwa in connected speech.
    Cuisenaire rods can visualize stress patterns.'
citations:
- claim: 'Core meaning: Sentence stress refers to the pattern of stressed and
    regular intervals, while unstressed syllables are compressed between them, giving
    English its characteristic rhythm'
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Part 1 Level 2: Words in
    Isolation, sections on Word Stress and Sentence Stress'
  tier: 1
- claim: Content words (nouns, main verbs, adjectives, adverbs) carry sentence stress;
