- claim: McManus (2022) documents that prosodic transfer from syllable-timed L1s
    to stress-timed English is among the most persistent CLI patterns. Prosodic systems
    are deeply entrenched in L1 acquisition and resist modification even at advanced
    proficiency levels, making sentence-level rhythm a long-term challenge for learners
    from syllable-timed language backgrounds.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
definition: 'Sentence stress refers to the pattern of stressed and unstressed syllables
  across a phrase or sentence. In English, content words are stressed and function
  words are unstressed. English is stress-timed: the stressed syllables tend to occur
  at roughly equal intervals, creating a rhythmic pattern. This is in contrast to
  syllable-timed languages (like French or Spanish), where each syllable receives
  roughly equal duration. The stress-timing of English means that unstressed syllables
  are compressed and reduced to fit the intervals between stressed syllables.

  '
description: 'English is a stress-timed language: stressed syllables tend to occur
  at roughly regular intervals, regardless of the number of unstressed syllables between
  them. This creates the characteristic rhythm of English. In connected speech, content
  words (nouns, verbs, adjectives, adverbs) are typically stressed, while function
  words (articles, prepositions, conjunctions, pronouns, auxiliary verbs) are typically
  unstressed and often reduced to their weak forms. The interplay of stressed and
  unstressed syllables creates the rhythm of English sentences.

  '
key_principles:
- explanation: 'In stress-timed languages, the interval between stressed syllables
    is roughly constant, regardless of how many unstressed syllables fall between
    them. In syllable-timed languages, each syllable takes roughly the same time.
    This means that in English, unstressed syllables are compressed — the more unstressed
    syllables between two stressed syllables, the faster they are spoken. This is
    why function words are reduced and vowels are weakened in connected speech.

    '
  principle: English is stress-timed, not syllable-timed
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-68'
- explanation: 'Content words carry the main meaning: nouns, main verbs, adjectives,
    adverbs. These are stressed in connected speech. Function words serve grammatical
    purposes: articles (a, the), prepositions (in, on, at), conjunctions (and, but,
    or), pronouns (he, she, it), auxiliary verbs (be, have, do, can, will). These
    are typically unstressed and often reduced to weak forms.

    '
  principle: Content words are stressed; function words are unstressed
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-60'
- explanation: 'Many function words have two pronunciations: a strong form (used when
    the word is stressed or in final position) and a weak form (used in connected
    speech when the word is unstressed). The weak form typically has a reduced vowel
    (schwa /ə/) or a shortened vowel. Examples: ''from'' /frɒm/ (strong) -> /frəm/
    (weak); ''to'' /tu:/ (strong) -> /tə/ (weak); ''and'' /ænd/ (strong) -> /ənd/
    or /ən/ or /n/ (weak).

    '
  principle: Weak forms are the reduced pronunciation of function words
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 60-68'
- explanation: 'The stressed syllables in a sentence create a rhythmic beat, like
    the beat in music. The unstressed syllables fill in between the beats. This beat
    is roughly regular, giving English its characteristic ''Morse code'' rhythm. Learners
    can feel this beat by tapping on the stressed syllables of a sentence.

    '
  principle: The rhythm of English creates a 'beat' on stressed syllables
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-59'
- explanation: 'Every English word has a fixed stress pattern (its "accent") when
    spoken in isolation — for example, "PHO-to-graph," "pho-TOG-ra-pher," "photo-GRAPH-ic."
    In connected speech, sentence stress acts as a filter: it selects which syllables
    receive prominence based on meaning, leaving the rest unstressed. When a content
    word is chosen for sentence stress, its primary word-stressed syllable typically
    carries the sentence-level prominence. For example, in "She''s a pho-TOG-ra-pher,"
    the primary stress of "photographer" aligns with the sentence stress. Sentence
    stress can also override normal word stress for contrastive emphasis — stressing
    an otherwise unstressed syllable, as in "Not pho-TOG-ra-pher, but PHO-to-graph."
    Understanding this relationship helps learners see that sentence stress is not
    arbitrary; it builds on the word stress patterns they have already learned.

    '
  principle: Sentence stress selects from word stress patterns
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-68; Chapter 3: Word Stress, pp 32-42'
- explanation: 'Connected speech is organized into rhythm units (also called "stress
    groups" or "feet"), each built around one stressed syllable. A rhythm unit consists
    of a stressed syllable plus any unstressed syllables attached to it. For example,
    the sentence "The big cat sat on the mat" can be divided as: "The BIG | cat SAT
    | on the MAT" — three rhythm units, each with one beat. Similarly, "I want to
    go to the shops" breaks into "I WANT | to go to the SHOPS" — two rhythm units.
    The boundaries between rhythm units often correspond to grammatical phrase boundaries,
    which helps listeners parse the stream of speech. Learners benefit from explicitly
    practicing these chunks: producing one rhythm unit at a time helps internalize
    the compression of unstressed syllables and the regular beat. Laying out Cuisenaire
    rods — one rod per rhythm unit — can make the structure visible and physical.

    '
  principle: Rhythm units organize speech into manageable chunks
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-59; Chapter 7: Connected Speech'
phonological_features:
- articulation: 'Content words are produced with the full stress pattern: louder,
    longer, higher pitch, clearer vowel. Function words are produced rapidly, quietly,
    with reduced vowels. The stressed content words create the rhythmic beat; the
    unstressed function words fill in between the beats.

    '
  common_errors:
  - description: Reduce function words; stress only content words
    error: Stressing all words equally (syllable-timed rhythm)
    explanation: Syllable-timed languages give equal weight to each syllable.
    l1_groups:
    - French
    - Spanish
    - Italian
    - Japanese
    - Korean
    - Hindi
  - description: Keep function words unstressed in connected speech
    error: Stressing function words unnecessarily
    explanation: Learners may use the strong form of function words in all positions.
    l1_groups:
    - All L1s
  description: 'In connected speech, content words (nouns, main verbs, adjectives,
    adverbs) receive stress. Function words (articles, prepositions, conjunctions,
    pronouns, auxiliary verbs) are typically unstressed. This distinction is fundamental
    to English rhythm.

    '
  examples:
  - The 'cat is on the 'mat. (cat, mat = content words, stressed)
  - I 'want to 'go to the 'shops. (want, go, shops = content words)
  - She 'can 'sing 'beautifully. (can, sing, beautifully = content words)
  - They 'have been 'waiting for an 'hour. (have, waiting, hour = content words)
  - He 'gave it to 'her. (gave = content word; it, to, her = function words, usually
    unstressed)
  feature: Content words vs. function words — stress assignment
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-60'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Say a sentence and tap on each stressed syllable. The taps should
      be roughly evenly spaced. For ''The ''cat is on the ''mat'', tap on ''cat''
      and ''mat''. The unstressed syllables ''the'', ''is'', ''on'', ''the'' are compressed
      between the taps.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, pp 58-59'
    technique: Beat tapping
  - description: 'Describe the rhythm of English as similar to Morse code: a pattern
      of strong beats with weak syllables in between. Tap out the rhythm of sentences,
      emphasizing the regular beat on stressed syllables.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, p 59'
    technique: Morse code rhythm
- articulation: 'Weak forms are produced rapidly, quietly, with reduced vowels (typically
    schwa /ə/ or a shortened vowel). The consonant may also be reduced (e.g., /h/
    dropping in ''him'' -> /im/). Strong forms are produced with full vowel quality
    and normal stress.

    '
  common_errors:
  - description: Use weak forms for function words in connected speech
    error: Using strong forms in all positions
    explanation: Learners tend to use the citation form of every word.
    l1_groups:
    - All L1s
  - description: Reduce naturally but maintain enough clarity for comprehension
    error: Over-reducing and losing intelligibility
    explanation: Excessive reduction can make speech unintelligible.
    l1_groups:
    - All L1s
  description: 'Many English function words have two pronunciations: a strong form
    (citation form) and a weak form (reduced form used in connected speech). The weak
    form is the norm in natural speech; the strong form is used only for emphasis
    or in final position. Learning weak forms is essential for natural-sounding English.

    '
  examples:
  - a /eɪ/ -> /ə/
  - an /æn/ -> /ən/
  - the /ðiː/ -> /ðə/ (before consonants)
  - and /ænd/ -> /ənd/, /ən/, /n/
  - but /bʌt/ -> /bət/
  - that /ðæt/ -> /ðət/ (as conjunction)
  - was /wɒz/ -> /wəz/
  - were /wɜː/ -> /wə/
  - can /kæn/ -> /kən/
  - have /hæv/ -> /həv/, /əv/, /v/
  - has /hæz/ -> /həz/, /əz/, /z/
  - had /hæd/ -> /həd/, /əd/, /d/
  - must /mʌst/ -> /məst/
  - shall /ʃæl/ -> /ʃəl/
  - should /ʃʊd/ -> /ʃəd/
  - would /wʊd/ -> /wəd/, /d/
  - could /kʊd/ -> /kəd/
  - from /frɒm/ -> /frəm/
  - of /ɒv/ -> /əv/
  - to /tuː/ -> /tə/ (before consonants)
  - at /æt/ -> /ət/
  - for /fɔː/ -> /fə/
  - him /hɪm/ -> /ɪm/
  - her /hɜː/ -> /ə/, /ɜː/
  - them /ðem/ -> /ðəm/, /ðm/
  - us /ʌs/ -> /əs/
  - his /hɪz/ -> /ɪz/
  - she /ʃiː/ -> /ʃi/
  - he /hiː/ -> /hi/, /iː/
  - we /wiː/ -> /wi/
  - you /juː/ -> /jə/
  - your /jɔː/ -> /jə/
  - some /sʌm/ -> /səm/
  - there /ðeə/ -> /ðə/ (existential)
  feature: Weak forms of function words
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 60-68'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Present function words in isolation (strong form) and in sentences
      (weak form). Contrast: ''What did he GIVE?'' (strong ''give'') vs. ''He gave
      it to her'' (weak ''to'' /tə/, ''her'' /ə/). Practice switching between strong
      and weak forms in context.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, pp 60-68'
    technique: Strong/weak form drills
  - description: 'Play or dictate natural speech with weak forms. Learners write what
      they hear. This raises awareness of how function words sound in connected speech.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, pp 60-68'
    technique: Dictation of reduced speech
- articulation: 'The speaker maintains a roughly regular beat on stressed syllables.
    Unstressed syllables are squeezed in between the beats. The more unstressed syllables,
    the faster they are produced. This requires reducing vowels (to schwa) and sometimes
    eliding consonants.

    '
  common_errors:
  - description: Compress unstressed syllables; maintain regular beat on stressed
      syllables
    error: Giving equal time to each syllable
    explanation: Syllable-timed languages do not compress unstressed syllables.
    l1_groups:
    - French
    - Spanish
    - Italian
    - Japanese
    - Korean
  description: 'In stress-timed English, the time between stressed syllables is roughly
    constant. If there are many unstressed syllables between two stressed syllables,
    they are compressed (spoken faster). If there are few, they are spoken more slowly.
    This creates the characteristic ''terse'' quality of English rhythm.

    '
  examples:
  - '''I ''want to ''go. (3 stressed syllables, few unstressed)'
  - '''I ''want you to ''go. (3 stressed syllables, more unstressed — ''you'' and
    ''to'' compressed)'
  - '''I ''want you to have ''gone. (3 stressed syllables, even more unstressed —
    ''you'', ''to'', ''have'' compressed)'
  - The 'cat sat on the 'mat. (cat, sat, mat = stressed; the, on, the = compressed)
  - The 'big 'cat sat on the 'mat. (big, cat, sat, mat = stressed)
  feature: Stress-timed rhythm — compression of unstressed syllables
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 58-59'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Stretch a rubber band on the stressed syllables and let it snap
      back on the unstressed syllables. This physical metaphor helps learners feel
      the compression of unstressed syllables.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, pp 58-59'
    technique: Rubber band rhythm
  - description: 'Set a metronome to a slow beat. Say sentences so that each stressed
      syllable falls on a beat. The unstressed syllables must fit between the beats,
      regardless of how many there are.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, pp 58-59'
    technique: Metronome beat
- articulation: 'The speaker places extra prominence (louder, longer, higher pitch)
    on the word they want to emphasize. This word receives the main stress of the
    sentence, regardless of whether it is a content or function word.

    '
  common_errors:
  - description: Shift stress to create emphasis and contrast
    error: Always using neutral stress patterns
    explanation: Learners may not know how to use stress for emphasis.
    l1_groups:
    - All L1s
  examples:
  - I 'want to 'go. (neutral statement)
  - '''I want to go. (not someone else — contrastive stress on ''I'')'
  - I 'want to go. (I really do — contrastive stress on 'want')
  - I want to 'go. (not stay — contrastive stress on 'go')
  - I want 'you to go. (not someone else — contrastive stress on 'you')
  - She 'can do it. (emphatic 'can' — strong form /kæn/)
  - '''Was he there? (emphatic ''was'' — strong form /wɒz/)'
  explanation: 'While content words are normally stressed and function words unstressed,
    speakers can shift stress to any word to create a contrast or focus. This is called
    contrastive or emphatic stress. When a function word is stressed, it takes its
    strong form.

    '
  feature: Contrastive sentence stress — shifting the focus
  source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
    Rhythm, pp 60-68'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Ask a question that requires contrastive stress in the answer: ''Did
      SHE give you the book?'' -> ''No, HE gave me the book.'' ''Did she TAKE the
      book?'' -> ''No, she GAVE me the book.'' This drills the stress shift in a meaningful
      context.

      '
    source: 'Underhill, A. (1994). Sound Foundations, Chapter 6: Sentence Stress and
      Rhythm, pp 60-68'
    technique: Question-and-answer stress shift
skill_area: suprasegmentals
skill_name: Sentence Stress and Rhythm — Stress-Timed English
sources:
  primary: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann.'
