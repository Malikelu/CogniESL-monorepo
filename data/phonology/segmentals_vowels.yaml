activities:
- description: 'Draw the vowel sound puzzle on the board with A, B placed in columns.
    Learners place remaining letters in columns by vowel sound, testing them aurally
    until they discover the rule: letters are grouped by the vowel sound in their
    name. Excellent for initial phonemic awareness and discriminating English vowel
    sounds.

    '
  level: A1-B1
  name: Alphabet vowel sounds puzzle
  source: Underhill 1994, Classroom activity 12, pp 122-123
  type: discrimination, discovery
- description: 'Point to a vowel sound on the chart. Learners search memory and write
    words containing that sound. Then sort words into correct and incorrect columns
    on board. Practice words with the target sound pointed out on the chart. Can point
    to two or three sounds simultaneously for more challenge.

    '
  level: A2-C2
  name: Finding words with a given sound
  source: Underhill 1994, Classroom activity 25, p 150
  type: production, discrimination
- description: 'Present a list of words containing two or three easily confused vowels
    (e.g., /a:/, /a/, /ɒ/ → cut, cart, cot, cough). Learners group by vowel sound,
    first by internal criteria, then negotiate, then check dictionary. Finish by pointing
    out on chart and identifying surprising spellings.

    '
  level: A2-C2
  name: Minimal pairs and triplets sorting
  source: Underhill 1994, Classroom activity 26, p 151
  type: discrimination, awareness
- description: 'Learner glides slowly between any two neighboring vowel sounds on
    the chart. Find intermediate sounds. Discover that tiny muscular adjustments create
    different phonemes. Particularly useful for finding the mid vowels between high
    and low, e.g., /i/ and /u/ between /i:/ and /u:/. Deepens awareness of fine muscular
    control.

    '
  level: B1-C2
  name: Continuum glide discovery
  source: Underhill 1994, Discovery activity 22, p 21
  type: awareness, production
cefr_range: A1-C2
teaching:
  methodology: Discovery-based (Underhill)
  tips:
  - 'Underhill (1994) Sound Foundations. The phonemic chart organizes 44 phonemes
    visually — layout encodes tongue position and lip position. Seven modes of chart
    usage: pointing in sequence, pointing at random, teacher points/learners identify,
    learner points/class produces, peer practice, dictation, correction. Four ways
    of giving models: say the sound, say it in a word, mime without speaking, point
    to chart only.'
citations:
- claim: 'Core meaning: English vowel sounds are divided into short vowels, long
    phonemic chart by tongue position: front/central/back and close/open'
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. The Phonemic Chart: vowel
    section and Discovery Toolkit'
  tier: 1
- claim: The length distinction (long/short vowels) and tense/lax contrast are critical
    for comprehensibility — many L1s lack these distinctions entirely
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Classroom Toolkit: Vowel
    discrimination activities'
  tier: 1
- claim: Singleton's CLI research shows that vowel transfer is particularly persistent
    because vowel systems are acquired early in L1 and resist restructuring. L1 vowel
    inventory size (e.g., Spanish 5 vowels vs. English 11+) predicts specific vowel
    quality and quantity transfer patterns.
  source: 'Singleton, D. (2016). Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters. Ch. 4: Phonological transfer'
  tier: 2
definition: 'Vowels are produced with the vocal tract open and no obstruction to airflow
  escaping over the tongue. Monophthongs maintain a single stable tongue/lip posture
  throughout, while diphthongs involve a glide from one vowel posture to another within
  a single syllable. Each phoneme has a variety of allophones (context-dependent variations
  that do not change meaning).

  '
description: 'The English vowel system contains twelve monophthongs (single vowel
  sounds) and eight diphthongs (gliding vowel sounds). Vowel quality is determined
  by tongue position (horizontal and vertical), lip position (rounded-neutral-spread),
  and length. English has a notably large vowel inventory compared to most languages,
  requiring learners to fit more discrete vowel sounds into the same mouth space.

  '
key_principles:
- explanation: 'The raised part of the tongue may be the front (toward the hard palate),
    the centre (toward the junction of hard and soft palate), or the back (toward
    the soft palate). These yield front, centre, and back vowels respectively. Vertical
    position (high-mid-low) further specifies how close the tongue is to the roof
    of the mouth.

    '
  principle: Tongue position is the most important variable determining vowel quality
  reliability: B
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs, pp 5-8'
- explanation: 'Lip rounding (as for /u:/ and /o:/) modifies the resonant space, while
    lip spreading (as for /i:/) does the same for front vowels. Front vowels typically
    have spread lips; back vowels typically have rounded lips. This correspondence
    does not hold in all languages, which is a source of difficulty for learners.

    '
  principle: Lip position acoustically tunes the vowel sound
  reliability: B
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs, Lip position, pp 13-15'
- explanation: 'English traditionally has five ''long'' vowels marked with a colon
    (/i:, u:, 3:, o:, a:/) and seven ''short'' vowels. However, length is modified
    by phonemic context: vowels shorten in stressed syllables closed by fortis (unvoiced)
    consonants and lengthen in stressed syllables closed by lenis (voiced) consonants.
    With the exception of /a/ and /3:/, no vowel pairs are distinguished solely by
    length — quality differences are equally or more important.

    '
  principle: Vowel length is relative, not absolute
  reliability: B
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs, Vowel length, pp 16-20'
- explanation: 'A diphthong glides from a first element toward a second element within
    a single syllable. The first element is typically longer and more stressed. The
    total duration is about that of a long vowel. The eight English diphthongs group
    into three centring (gliding toward /a/) and five closing (gliding toward /i/
    or /u/).

    '
  principle: Diphthongs are perceived as one syllable with stress on the first element
  reliability: B
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs, pp 22-28'
phonological_features:
- articulation: 'Tongue front high and forward, close to alveolar ridge. Lips spread
    in a half-smile with muscular tension. Jaw is fairly closed. Sound can be sustained.
    Can be introduced by gliding slowly from /i:/ to /u:/ and back, drawing attention
    to both lip and tongue movement. Use a finger on the lips to detect the spread,
    or glide from /i:/ to a pencil in contact with the tongue tip.

    '
  common_errors:
  - correction: Lengthen and raise tongue, spread lips, increase muscular tension
      at lip corners
    error: Replacing /i:/ with a shorter /i/-like sound of insufficient length and
      quality
    explanation: 'Many languages do not have this vowel. Learners may undervalue the
      length and the peripheral tongue position.

      '
    l1_groups:
    - Spanish
    - Portuguese
    - Japanese
    - Arabic
  - correction: Maintain stable tongue position; do not glide to /i/
    error: Confusing /i:/ with /ei/ (say for say)
    explanation: The diphthong /ei/ may be substituted for the monophthong.
    l1_groups:
    - Spanish
    - Italian
  description: 'The high front vowel with lips spread. The front of the tongue is
    raised as close to the hard palate as possible without causing audible friction.
    This is the highest and most front of all English monophthongs.

    '
  examples:
  - tea /ti:/
  - see /si:/
  - key /ki:/
  - heat /hi:t/
  - bead /bi:d/
  - beat /bi:t/
  feature: /i:/ — long close front unrounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - ee (see, tree)
  - ea (tea, heat, bead)
  - ie (believe, field)
  - ei (receive, ceiling)
  - i (machine, police)
  - e (me, she, these)
  teaching_techniques:
  - description: 'Spread lips in half-smile visible to class. Pull sound from mouth
      with hand gesture, exaggerating the length. Reverse gesture to ''pull'' the
      sound from learners. Invite the class to watch each other''s lip position in
      mirrors.

      '
    source: Underhill 1994, Classroom activity 6-7, pp 115-116
    technique: Mime with lip-spread gesture
  - description: 'Alternate /i:/ and /u:/ slowly, noticing lip and tongue movement.
      Then glide continuously between them, stopping at intermediate points to discover
      /i/ and /u/. Use pencil-finger contact with tongue to track backward tongue
      movement.

      '
    source: Underhill 1994, Discovery activity 3-5, pp 5-7
    technique: Continuum glide from /i:/ to /u:/
- articulation: 'Tongue front high but slightly lower than /i:/. Lips are neutrally
    spread, less muscular tension than /i:/. Jaw slightly more open. Distinguished
    from /i:/ primarily by quality (centralization) rather than by length alone —
    length is relative and context-dependent.

    '
  common_errors:
  - correction: Shorten and centralize — tongue slightly lower, less lip spread
    error: Producing /i/ with the full quality and length of /i:/
    explanation: Spanish has only a single close front vowel, intermediate to English
      /i:/ and /i/.
    l1_groups:
    - Spanish
    - French
  - correction: Maintain some i-quality even when shortened
    error: Reducing /i/ to /e/ or /a/ in unstressed positions
    explanation: Languages with fewer vowels may merge /i/ into neighboring sounds.
    l1_groups:
    - Arabic
    - Portuguese
  description: 'The shorter counterpart of /i:/. The tongue is slightly lower and
    more central than for /i:/. Lips are less spread. Found in unstressed syllables
    and in closed syllables.

    '
  examples:
  - sit /sit/
  - hit /hit/
  - bit /bit/
  - happy /hæpi/
  - wanted /wɒntɪd/
  - because /bɪkɒz/
  feature: /i/ — short close front unrounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - i (sit, bit, hit)
  - y (happy, city)
  - e (decide, become)
  - u (busy, minute)
  - ui (build, guitar)
  teaching_techniques:
  - description: 'Start with /i:/ and glide toward /æ/. Stop approximately one-third
      of the way down. Make the sound short and slightly centralized. Contrast with
      /i:/ and /e/.

      '
    source: Underhill 1994, Discovery activity 7, pp 8-10
    technique: Continuum glide from /i:/ to /æ/ to locate /i/
- articulation: 'Tongue back raised toward soft palate, slightly lower than for /u:/.
    Lips rounded but more relaxed and less pushed forward than /u:/. Jaw slightly
    more open than for /u:/.

    '
  common_errors:
  - correction: Reduce length, relax lip rounding, lower tongue slightly
    error: Confusing /u/ with /u:/ (put vs boot)
    explanation: These languages have a single close back rounded vowel.
    l1_groups:
    - German
    - Dutch
  - description: Keep lips rounded, jaw fairly closed
    error: Spreading lips instead of rounding
    explanation: Front vowel habits interfere with the back rounded position.
    l1_groups:
    - Spanish
    - French
  description: 'The shorter counterpart of /u:/. Tongue back is high toward the soft
    palate. Lips are rounded but less tightly than /u:/.

    '
  examples:
  - put /pʊt/
  - book /bʊk/
  - foot /fʊt/
  - good /gʊd/
  - could /kʊd/
  - woman /wʊmən/
  feature: /u/ — short close back rounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - oo (book, foot, good)
  - u (put, full, pull)
  - ou (could, should, would)
  - o (wolf, woman)
  teaching_techniques:
  - description: 'Mime the tight forward rounding of /u:/, then visibly relax lip
      position to arrive at /u/. Use a short tug gesture to indicate the shorter duration.
      Contrast in word pairs: pool-pull, fool-full.

      '
    source: Underhill 1994, Classroom activity 9, p 120
    technique: Contrast /u:/ vs /u/ through forward lip relaxation
- articulation: 'Tongue back high, near soft palate. Lips tightly rounded and pushed
    forward (whistling position). Jaw fairly closed. One of the five traditionally
    long vowels.

    '
  common_errors:
  - correction: Exaggerate lip rounding and forward push; compare with /i:/
    error: Pronouncing /u:/ with insufficient lip rounding or without pushing lips
      forward
    explanation: These languages lack a high back rounded vowel like /u:/.
    l1_groups:
    - Spanish
    - Italian
    - French
  - correction: 'Distinguish by length and quality: /u:/ is longer, tighter, more
      forward'
    error: Confusing /u:/ with /u/ (fool for full)
    explanation: Single back rounded vowel habits in these L1s.
    l1_groups:
    - Japanese
    - Chinese
  description: 'The high back vowel with tight lip rounding. The back of the tongue
    is raised toward the soft palate. Lips are rounded and pushed forward as for whistling.

    '
  examples:
  - two /tu:/
  - food /fu:d/
  - room /ru:m/
  - boot /bu:t/
  - rude /ru:d/
  - blue /blu:/
  feature: /u:/ — long close back rounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - oo (food, room, boot)
  - u (rude, June)
  - ue (blue, true)
  - ew (new, flew)
  - o (do, who)
  - ou (soup, group)
  - ui (juice, fruit)
  teaching_techniques:
  - description: 'Alternate /i:/ and /u:/ slowly. Notice lips move from spread to
      rounded, and tongue moves from front to back. Exaggerate both positions. Use
      finger on lips to feel the change in lip tension and position.

      '
    source: Underhill 1994, Discovery activities 3-4, pp 5-7
    technique: Contrast /u:/ with /i:/ on the front-back continuum
  - description: 'Round and push lips forward visibly. ''Extrude'' the sound from
      the mouth with hands. First show /u:/, then relax to /u/ to contrast the two.

      '
    source: Underhill 1994, Classroom activity 9, p 120
    technique: Mime with lip-rounding gesture
- articulation: 'Tongue front and mid — halfway between /i:/ and /æ/ vertically. Jaw
    half-open. Lips in a neutral spread position.

    '
  common_errors:
  - correction: Keep the tongue stable; do not glide
    error: Replacing /e/ with /ei/ or an over-diphthongized version
    explanation: These languages have diphthongization tendencies in mid vowels.
    l1_groups:
    - Italian
    - Spanish
  - correction: Raise the tongue slightly; keep the jaw more closed than for /æ/
    error: Confusing /e/ with /æ/ (pen vs pan)
    explanation: Many languages do not distinguish these two vowels.
    l1_groups:
    - Arabic
    - Korean
    - Japanese
  description: 'The mid front vowel. Tongue is in mid position vertically and front
    horizontally. Lips are neutrally spread. Found only in stressed syllables; unstressed
    vowels do not reduce to /e/ but to /a/ or /i/.

    '
  examples:
  - pen /pen/
  - bed /bed/
  - head /hed/
  - friend /frend/
  - said /sed/
  - many /meni/
  feature: /e/ — short mid front unrounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - e (pen, bed, head)
  - ea (head, bread, dead)
  - ai (said, again)
  - ie (friend,
  - a (many, any)
  - eo (leopard
  teaching_techniques:
  - description: 'Glide slowly from /i:/ to /æ/. Stop halfway — approximately mid
      position. This yields /e/. Contrast it with both neighbors.

      '
    source: Underhill 1994, Discovery activity 7, p 9
    technique: Locate /e/ on the /i:/-/æ/ continuum
- articulation: 'Tongue in relaxed neutral position, slightly further back than /j/.
    Lips neutral. This requires relaxation of jaw, tongue, and lips — excess muscular
    tension is the most common learning problem. One of the five traditionally long
    vowels.

    '
  common_errors:
  - description: Keep everything relaxed and neutral; no tongue retraction, no lip
      rounding
    error: Adding tongue retraction or lip rounding, creating a non-English sound
    explanation: These languages tend toward more peripheral articulation.
    l1_groups:
    - French
    - German
  - correction: Center the tongue; relax all tension
    error: Producing /3:/ as /a:/ (hurt as heart)
    explanation: No central vowel in these languages; learners select nearest equivalent.
    l1_groups:
    - Spanish
    - Italian
    - Arabic
  description: 'The central vowel, longer and stressed version of /a/. Tongue is in
    the centre, relaxed and in neutral position. Lips are neutral. Found in stressed
    syllables only.

    '
  examples:
  - her /h3:/
  - sir /s3:/
  - bird /b3:d/
  - word /w3:d/
  - learn /l3:n/
  - fur /f3:/
  - burnt /b3:nt/
  - first /f3:st/
  feature: /3:/ — long mid central unrounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - er (her, term, verse)
  - ir (sir, bird, first)
  - ur (fur, burn, turn)
  - or (word, work, world)
  - ear (learn, heard, early)
  teaching_techniques:
  - description: 'Show the floppiness of jaw, lips, and tongue. Pull a long relaxed
      /3:/ from the mouth. Use gesture to convey ''letting go'' of muscular tension.
      Contrast with the tension of /i:/ and /u:/.

      '
    source: Underhill 1994, Classroom activity 9, p 120
    technique: Relaxation mime
- articulation: 'Tongue back and mid — pulled toward the back of the mouth. Lips rounded,
    somewhat pushed forward. Jaw moderately open. One of the five traditionally long
    vowels.

    '
  common_errors:
  - correction: Keep position stable; do not glide
    error: Replacing /o:/ with /au/ or /ou/
    explanation: These languages diphthongize mid back vowels.
    l1_groups:
    - Spanish
    - German
  - correction: Round the lips, pull tongue back
    error: Confusing /o:/ with /a:/ (bore vs bar)
    explanation: No rounded mid back vowel; /a:/ selected instead.
    l1_groups:
    - French
    - Arabic
  description: 'The mid-back vowel with lip rounding. Tongue back is raised toward
    the soft palate in mid position. Lips are rounded but not as tightly as /u:/ and
    not pushed as far forward.

    '
  examples:
  - door /dɔ:/
  - bore /bɔ:/
  - born /bɔ:n/
  - four /fɔ:/
  - more /mɔ:/
  - walk /wɔ:k/
  - caught /kɔ:t/
  - doorway /dɔ:wei/
  feature: /o:/ — long mid back rounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - or (door, more, born)
  - aw (law, saw, caught)
  - au (autumn, cause)
  - a (walk, talk, call)
  - or (four, your)
  teaching_techniques:
  - description: 'Between /u:/ and /a:/ vertically, find the mid position. Round lips
      well but keep tongue mid-back, not low-back. Contrast with /u:/ (tight rounding)
      and /a:/ (no rounding).

      '
    source: Underhill 1994, Discovery activity 7, p 9
    technique: Locate /o:/ on the /u:/-/a:/ continuum
- articulation: 'Tongue low and front. Jaw open. Lips open and slightly spread. Notably
    longer when followed by lenis consonants (bad, man, rag) than when followed by
    fortis consonants (map, sat, back).

    '
  common_errors:
  - description: Open jaw fully; lower the tongue; feel the spread at mouth corners
    error: Producing /æ/ as /e/ or /a/ (cat as ket or cot)
    explanation: Spanish and Italian have /a/ (low central) which falls between English
      /æ/ and /a:/. Learners must learn to front and raise it slightly. Valencia (2022)
      notes that Spanish speakers specifically confuse /æ/, /ʌ/, and /ɑ:/ -- the three
      sound the same to Spanish ears (e.g., bad, but, and bar are all perceived with
      Spanish /a/) because Spanish has only one low vowel phoneme (Gist Education
      and Learning Research Journal, No. 25, p. 147).
    l1_groups:
    - Spanish
    - Italian
    - Arabic
    - Portuguese
  - description: Use forefinger on nose and thumb on chin to monitor jaw opening
    error: Insufficient jaw opening for /æ/
    explanation: Jaw tends to be more closed in these languages.
    l1_groups:
    - German
    - French
  description: 'The low front vowel. Tongue is low in the mouth, front part raised
    slightly. Jaw is open. Lips are slightly spread. A distinctive English vowel with
    few equivalents in other languages.

    '
  examples:
  - cat /kæt/
  - man /mæn/
  - bad /bæd/
  - back /bæk/
  - sad /sæd/
  - map /mæp/
  - dance /dɑːns/
  - laugh /lɑːf/
  feature: /æ/ — short low front unrounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - a (cat, bad, map)
  - au (aunt, laugh)
  teaching_techniques:
  - description: 'Place forefinger on bridge of nose, thumb on chin. Say /i:/ and
      glide to /æ/, noticing increased distance between thumb and finger. Pull the
      sound from the mouth with a firm, short gesture. Indicate slight tension at
      corners of mouth and top of throat.

      '
    source: Underhill 1994, Classroom activity 9, pp 120; Discovery activity 9, p
      11
    technique: Jaw-opening mime with finger monitoring
  - description: 'Compare man-maen, map-maep, bad-baet, sat-saet. Notice that /æ/
      is longer before lenis consonants. This is unique among the ''short'' vowels.

      '
    source: Underhill 1994, Discovery activity 21, pp 20
    technique: Length contrast before fortis vs lenis consonants
- articulation: 'Tongue central and relaxed in neutral position. Jaw neutral. Lips
    neutral. Minimal muscular energy. This is the ''smallest'' English vowel — it
    requires near-zero articulatory energy.

    '
  common_errors:
  - description: Relax tongue, jaw, and lips; minimize energy
    error: Pronouncing unstressed vowels with full vowel quality instead of reducing
      to /ə/
    explanation: 'Languages such as Spanish and Italian tend to preserve full vowel
      quality in all positions. Failure to reduce unstressed vowels is one of the
      strongest signals of a foreign accent in English.

      '
    l1_groups:
    - Spanish
    - Italian
    - French
    - Arabic
    - German
  - correction: Ignore the spelling; use minimal-energy central vowel
    error: Adding a trace of the spelled vowel where /ə/ should be used
    explanation: The link to spelling can override phonemic awareness.
    l1_groups:
    - All L1s with spelling-based reading habits
  description: 'The most frequent vowel in continuous speech and the only phoneme
    with its own name (schwa). It is never stressed. The tongue, lips, and jaw are
    all in a relaxed neutral position. Crucial for the rhythmic quality of spoken
    English: "You can''t have stress without unstress."

    '
  examples:
  - about /əbaʊt/
  - teacher /ti:tʃə/
  - ago /əgəʊ/
  - sofa /səʊfə/
  - doctor /dɒktə/
  - over /əʊvə/
  - allow /əlaʊ/
  - again /əgen/
  feature: /a/ — short mid central unrounded vowel (schwa)
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - a (about, ago)
  - e (the, taken)
  - i (possible, aunt)
  - o (doctor, observe)
  - u (upon, autumn)
  - ou (famous, jealous)
  teaching_techniques:
  - description: 'Begin with /aː/, gradually shorten it with hand gesture until only
      the barest minimum of energy remains. Mime and gesture the sound as an almost
      imperceptible movement. Relax everything.

      '
    source: Underhill 1994, Classroom activity 9, p 120
    technique: Almost-imperceptible energy mime
  - description: 'Say sentences like "You and me — I wish you would tell me" at speed,
      noting how the unstressed vowels reduce. The contrast between the clear and
      reduced versions reveals the rhythm system.

      '
    source: Underhill 1994, Discovery activity 62, pp 62
    technique: Practice rapid connected speech with vowel reduction
- articulation: 'Tongue low and toward the back. Jaw well open (doctor-looking-down-
    throat position). Lips open but neither rounded nor spread. One of the five traditionally
    long vowels.

    '
  common_errors:
  - description: Lower and pull tongue back; open jaw wider
    error: Confusing /a:/ with /æ/ (cart vs cat)
    explanation: 'Most languages have a low vowel but more central or front than English
      /a:/. The English back and long quality is distinctive.

      '
    l1_groups:
    - French
    - German
    - Spanish
    - Italian
  - description: Lengthen and lower the tongue; maximize jaw opening
    error: Confusing /a:/ with /a/ (cart vs cut)
    explanation: These languages have /a/ as the nearest vowel but without length.
    l1_groups:
    - Various L1s with a mid-central vowel
  description: 'The low vowel. Tongue is low and toward the back. Jaw is well open.
    Lips are open but neither rounded nor spread. Found in stressed syllables only.

    '
  examples:
  - bar /bɑː/
  - father /fɑːðə/
  - car /kɑː/
  - heart /hɑːt/
  - calm /kɑːm/
  - bath /bɑːθ/
  - grass /grɑːs/
  - class /klɑːs/
  feature: /a:/ — long low (back) unrounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - a (father, calm, bath)
  - ar (bar, car, far)
  - al (calm, half)
  - ear (heart, hearth)
  teaching_techniques:
  - description: 'Open mouth wide as if doctor examining throat. Indicate ''full open''
      throat with two hands. Pull a long sound from the mouth. Use gesture of saying
      or sighing /aːaː/ to get the quality right.

      '
    source: Underhill 1994, Classroom activity 9, p 120
    technique: Wide open mouth mime
- articulation: 'Tongue low and back. Jaw open. Lips slightly rounded (not as tight
    as /o:/). Distinguishing feature from /a:/ is the lip rounding and from /u:/ is
    the low tongue position.

    '
  common_errors:
  - description: Round the lips slightly, keep the tongue low and back
    error: Replacing /ɒ/ with /ɑː/ (pot as part) or /a/ (pot put)
    explanation: American English merges /ɒ/ with /ɑː/; French and German have no
      low rounded vowel.
    l1_groups:
    - American English speakers
    - French
    - German
  - correction: Add lip rounding and shorten
    error: Confusing /ɒ/ with /a:/ in words like want, was
    explanation: Spelling 'a' triggers the more common /a:/ sound.
    l1_groups:
    - Various L1s
  description: 'The low back rounded vowel. Tongue is low and back. Jaw is open. Lips
    are rounded but more relaxed than /u:/.

    '
  examples:
  - pot /pɒt/
  - hot /hɒt/
  - lot /lɒt/
  - gone /gɒn/
  - want /wɒnt/
  - what /wɒt/
  - wash /wɒʃ/
  - quality /kwɒləti/
  feature: /ɒ/ — short low back rounded vowel
  source: 'Underhill 1994, Chapter 2: Vowels: monophthongs'
  spelling_patterns:
  - o (pot, hot, lot, gone)
  - a (was, what, want, wash)
  - ou (cough)
  - au (because)
  teaching_techniques:
  - description: 'Start with /a:/ and move forward in mouth. Stop before reaching
      /æ/. Add lip rounding. The position is between /a:/ and /æ/ with rounded lips.

      '
    source: Underhill 1994, Discovery activity 7, p 9
    technique: Locate /ɒ/ on the /ɒ/-/æ/ continuum
- articulation: 'Start with tongue in mid-front position (as for /e/) with lips fairly
    spread. Glide upward and close the jaw, tongue staying in place but moving closer
    to the roof of mouth. Lips remain fairly spread. The first element is longer;
    total duration equals a long vowel.

    '
  common_errors:
  - description: Ensure a clear glide toward /i/; close the jaw midway through
    error: Producing /ei/ as a monophthong /e/ (late as let)
    explanation: Spanish and Italian tend toward monophthongs; the glide is weakened.
    l1_groups:
    - Spanish
    - Italian
  - description: Lengthen and stress the first element; the second is shorter and
      unstressed
    error: Putting more stress/length on the second element, making it sound un-English
    explanation: The un-English quality comes from shifting stress to second element.
    l1_groups:
    - Various L1s
  description: 'The closing diphthong gliding from mid-front /e/ up to high-front
    /i/. The first element is longer and more stressed. Found in stressed syllables
    such as name, day, rain. All diphthongs are one syllable, not two.

    '
  examples:
  - name /neim/
  - day /dei/
  - rain /rein/
  - take /teik/
  - late /leit/
  - eight /eit/
  - they /ðei/
  - make /meik/
  feature: Diphthong /ei/ — glide from /e/ to /i/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - a_e (name, take, late)
  - ai (rain, wait, train)
  - ay (day, say, play)
  - ei (eight, weight, veil)
  - ea (great, break)
  - ey (they, grey)
  teaching_techniques:
  - description: 'Point to /e/ on chart, then /i/. Have class say each separately,
      then slide pointer from /e/ to /i/ inviting the class to say the glide. Speed
      up. When acceptable, touch /ei/ box on diphthong section.

      '
    source: Underhill 1994, Classroom activity 11, p 122
    technique: Build from component monophthongs
  - description: 'Start with /e/ mouth posture, visibly close jaw while gliding to
      the high-front position. Exaggerate slightly; slow down the glide to make the
      two positions and the movement between visible.

      '
    source: Underhill 1994, Classroom activity 10, pp 121-122
    technique: Mime the jaw-closing glide
- articulation: 'Start with tongue low and central, slightly forward of /a:/. Lips
    neutral. Glide upward to /i/, with jaw closing and lips spreading slightly.

    '
  common_errors:
  - description: Start with tongue low but centered, not as far back as /a:/
    error: Starting too far back (/a:/-/i/ instead of /a/-/i/)
    explanation: The first element /a/ is between /æ/ and /a:/, not identical to /a:/.
    l1_groups:
    - Various L1s
  - description: Keep the tongue low at the start; do not raise it prematurely
    error: Palatalizing the initial element with too much /j/-like quality
    explanation: L1 influence adds palatal quality to open vowels.
    l1_groups:
    - Spanish
    - Italian
  description: 'The closing diphthong gliding from a low central position (symbolized
    /a/, between /æ/ and /a:/) up to high-front /i/. The first element is stressed.

    '
  examples:
  - my /mai/
  - high /hai/
  - five /faiv/
  - buy /bai/
  - white /wait/
  - nice /nais/
  - time /taim/
  - eye /ai/
  feature: Diphthong /ai/ — glide from low central /a/ to /i/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - i_e (five, time, nice)
  - igh (high, light, night)
  - ie (lie, die, tie)
  - y (my, by, try)
  - ye (bye, dye)
  - eye (eye,)
  - ai (aisle)
  teaching_techniques:
  - description: 'Establish /a/ and /i/ separately on the monophthong section. Slide
      pointer between them to form the glide. Note that the first element /a/ is not
      on the chart as an English phoneme — it lies between /æ/ and /a:/.

      '
    source: Underhill 1994, Discovery activity 24, pp 23
    technique: Build from /a/ to /i/ on the monophthong chart
- articulation: 'Start with tongue mid-back and lips rounded (as for /o:/). Glide
    forward and upward to /i/: lips un-round and spread; tongue moves forward and
    up; jaw closes. The first element is longer and stressed.

    '
  common_errors:
  - description: Ensure the glide continues fully to the high-front position
    error: Confusing /ɔi/ with /ɔ:/ (boy vs bore)
    explanation: Spanish tends to monophthongize or shorten the second element.
    l1_groups:
    - Spanish
    - Portuguese
  - description: Start with rounded mid-back lips and tongue, not low central
    error: Starting with /au/ instead of /ɔi/
    explanation: Perceptual confusion between starting positions.
    l1_groups:
    - Various L1s without a comparable diphthong
  description: 'The closing diphthong gliding from mid-back rounded /o:/ to high-front
    /i/. The first element loses its length mark in the diphthong symbol.

    '
  examples:
  - boy /bɔi/
  - coin /kɔin/
  - noise /nɔiz/
  - toy /tɔi/
  - join /dʒɔin/
  - choice /tʃɔis/
  - oil /ɔil/
  - enjoy /indʒɔi/
  feature: Diphthong /ɔi/ — glide from /o:/ to /i/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - oy (boy, toy, enjoy)
  - oi (coin, noise, join)
  teaching_techniques:
  - description: 'Establish /o:/ and /i/ on monophthong chart. Glide from one to other.
      Note that lip rounding changes to spreading and tongue moves forward. Exaggerate
      the lip movement.

      '
    source: Underhill 1994, Discovery activity 23, pp 22-23
    technique: Build from /o:/ to /i/
- articulation: 'Start with tongue low and central, lips neutral (like /a/, slightly
    forward of /a:/). Glide to /u/: tongue rises and moves back; lips round and push
    forward; jaw closes. The first element is longer and stressed.

    '
  common_errors:
  - description: Ensure a visible lip-rounding glide; start with neutral lips
    error: Producing /əʊ/ as /o:/ (a monophthong)
    explanation: These languages tend toward monophthongs in this position.
    l1_groups:
    - Spanish
    - Chinese
    - Japanese
  - description: First element has neutral lips; rounding happens during the glide
    error: Starting with rounded lips from the first element
    explanation: Anticipating the rounding too early distorts the diphthong.
    l1_groups:
    - Various L1s
  description: 'The closing diphthong gliding from a low central position /a/ (between
    /a/ and /a:/) to high-back rounded /u/. Often spelled ''ou'' or ''ow''. One of
    the perceptually clearest diphthongs due to large visible mouth movement.

    '
  examples:
  - no /nəʊ/
  - go /gəʊ/
  - so /səʊ/
  - home /həʊm/
  - phone /fəʊn/
  - boat /bəʊt/
  - show /ʃəʊ/
  - know /nəʊ/
  feature: Diphthong /au/ — glide from /a/ to /u/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - o_e (home, phone, nose)
  - ow (show, know, grow)
  - oa (boat, road, coat)
  - ou (though, soul)
  - ew (sew)
  teaching_techniques:
  - description: 'Establish /a/ and /u/ separately. Slide pointer between them. Note
      the tongue moves up and back, lips change from neutral to rounded and forward.
      Exaggerate the lip-rounding movement. Use mirror.

      '
    source: Underhill 1994, Discovery activity 25-26, pp 24-25
    technique: Build from /a/ to /u/ with visible lip-rounding glide
  - description: 'Alternate /nəʊ/ and /nau/. Focus on internal muscular sensation
      and relate to acoustic difference. /əʊ/ starts with mid-central relaxed tongue;
      /au/ starts with low open tongue and jaw.

      '
    source: Underhill 1994, Discovery activity 27, p 25
    technique: Contrast /əʊ/ vs /au/ (no vs now)
- articulation: 'Start with tongue low and central-open, jaw more open than for /a/.
    Lips neutral and relaxed. Glide to /u/: tongue rises and back; jaw closes; lips
    round and push forward. First element longer and stressed.

    '
  common_errors:
  - description: Open jaw wider at start; feel the lower tongue position
    error: Confusing /au/ with /əʊ/ (now vs no)
    explanation: Many languages have only one of these diphthongs.
    l1_groups:
    - French
    - German
    - Spanish
  - description: Ensure the glide moves clearly from low-central to high-back-rounded
    error: Replacing /au/ with a monophthong /a/ or /u/
    explanation: L1 vowel systems may not include this glide.
    l1_groups:
    - Arabic
    - Portuguese
  description: 'The closing diphthong gliding from low central-open /a/ (same symbol
    as in /ai/) to high-back rounded /u/. Spelled ''ou'' or ''ow''. Distinct from
    /əʊ/ by starting from a lower, more open position with more jaw opening.

    '
  examples:
  - now /nau/
  - how /hau/
  - town /taun/
  - out /aut/
  - found /faund/
  - house /haus/
  - down /daun/
  - about /əbaut/
  feature: Diphthong /au/ — glide from /a/ to /u/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - ou (out, found, house)
  - ow (now, how, down)
  teaching_techniques:
  - description: 'Start with /a/ (jaw open, lips neutral), glide toward /u/ (jaw closes,
      lips round and forward). Use all-round gesture to indicate wide mouth opening
      at start, then jaw closing and lip rounding.

      '
    source: Underhill 1994, Classroom activity 10-11, pp 121-122
    technique: Build from /a/ to /u/ with wide-open-jaw start
- articulation: 'Start with tongue high and front (as for /i/), lips slightly spread.
    Lower and center the tongue, relaxing to /ə/. The glide is very slight. Lips spread
    to neutral.

    '
  common_errors:
  - description: Ensure a small but distinct movement toward the center; start clearly
      from /i/
    error: Monophthongizing /iə/ to /i:/, losing the centering glide
    explanation: The glide is subtle, and /i/ is a more natural resting position for
      many learners.
    l1_groups:
    - Various L1s
  - description: No /e/ — the glide is directly from /i/ to /ə/
    error: Replacing /iə/ with /eiə/ (adding an extra element)
    explanation: Spanish diphthong habits insert mid-element glides.
    l1_groups:
    - Spanish
  description: 'The centring diphthong gliding from high-front /i/ down to central
    /ə/. Involves very short glide since /i/ and /ə/ are neighbors on the vowel chart.
    One of the three centring diphthongs. Frequently heard as monophthongized in modern
    RP.

    '
  examples:
  - here /hiə/
  - near /niə/
  - beard /biəd/
  - ear /iə/
  - dear /diə/
  - clear /kliə/
  - idea /aidiə/
  - serious /sɪəriəs/
  feature: Centring Diphthong /iə/ — glide from /i/ to /ə/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - ear (near, dear, clear)
  - eer (beer, deer)
  - ere (here, mere)
  - ea (idea, area)
  teaching_techniques:
  - description: 'Because the /i/ to /a/ glide is very slight, exaggerate the movement
      so learners can perceive it. Use the monophthong chart as a worktable to plot
      the two components.

      '
    source: Underhill 1994, Discovery activity 28, pp 26-27
    technique: Magnify the small glide
- articulation: 'Start with tongue mid-front (as for /e/). Move the raised part of
    the tongue back toward the center. Tongue height is mid for both elements. Very
    slight movement. Frequently monophthongized in RP.

    '
  common_errors:
  - description: The tongue does not rise to /i/; keep it mid and move back, not up
    error: Replacing /eə/ with /ei/ (hair as hay-er)
    explanation: The rise to /i/ is more natural than the centering glide.
    l1_groups:
    - Various L1s
  - description: Direct glide from /e/ to /ə/; no /i/ element
    error: Replacing /eə/ with /eiə/ (adding a third element)
    explanation: Tendency to add palatal elements to front vowels.
    l1_groups:
    - Spanish
    - Italian
  description: 'The centring diphthong gliding from mid-front /e/ back to central
    /ə/. Another centring diphthong with a subtle glide. The movement is back toward
    the centre, not a change in tongue height.

    '
  examples:
  - air /eə/
  - hair /heə/
  - care /keə/
  - dare /deə/
  - there /ðeə/
  - where /weə/
  - chair /tʃeə/
  - fair /feə/
  feature: Centring Diphthong /eə/ — glide from /e/ to /ə/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - air (hair, fair, chair)
  - are (care, dare, share)
  - ear (bear, wear)
  - ere (there, where)
  - eir (heir)
  teaching_techniques:
  - description: 'Put finger or pen on tongue while making the glide from /e/ to /ə/.
      Feel the tongue moving back but not up. This can make the subtle movement perceptible.

      '
    source: Underhill 1994, Discovery activity 28, p 26
    technique: Use pen on tongue to trace the glide
- articulation: 'Start with tongue high and back (as for /u/), lips rounded. Lower
    and center the tongue, relaxing to /ə/. Lips change from rounded to neutral. Very
    slight movement.

    '
  common_errors:
  - description: Ensure a small centering glide after the high-back position
    error: Replacing /uə/ with /u:/ or /oː/
    explanation: The monophthong is simpler; the glide is frequently lost even in
      native RP.
    l1_groups:
    - Various L1s
  - description: The /j/ belongs to the onset; the diphthong is just /uə/
    error: Adding a /j/ element before /uə/ (confusing pure with pewer)
    explanation: Perceptual confusion about the initial consonant glide.
    l1_groups:
    - Various L1s
  description: 'The centring diphthong gliding from high-back rounded /u/ down and
    forward to central /ə/. There is an ongoing tendency in RP to replace /uə/ with
    /oː/. Another centring diphthong with a very subtle glide.

    '
  examples:
  - pure /pjuə/
  - cure /kjuə/
  - tour /tuə/
  - sure /ʃuə/
  - poor /puə/
  - moor /muə/
  - furious /fjuəriəs/
  - jury /dʒuəri/
  feature: Centring Diphthong /uə/ — glide from /u/ to /ə/
  source: 'Underhill 1994, Chapter 3: Vowels: diphthongs'
  spelling_patterns:
  - ure (pure, cure)
  - our (tour, your)
  - oor (poor, moor)
  - ure (sure)
  teaching_techniques:
  - description: 'Contrast words like /pjuə/, /kjuə/ with /pɔː/, /kɔː/. Help learners
      keep the back-rounded start and hear the centering offglide. Note that in modern
      RP the monophthongized version is also common.

      '
    source: Underhill 1994, Discovery activity 28, p 26
    technique: Contrast with /ɔː/ to preserve the centring glide
skill_area: segmentals
skill_name: English Vowel System — Monophthongs and Diphthongs
sources:
  primary: Underhill, A. (1994). Sound Foundations. Heinemann.
