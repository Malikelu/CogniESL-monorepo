activities:
- description: 'Learners use Cuisenaire rods to build the stress pattern of words.
    Long rods for stressed syllables, short rods for unstressed. For example: ''about
    = short + long; ''beautiful = long + short + short; ˌinter''national = medium
    + short + long + short + short. This makes the abstract concept of stress visible
    and physical.

    '
  level: A1-B2
  name: Cuisenaire rod stress patterns
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Classroom
    activity 18, pp 151-159'
  type: awareness, production
- description: 'Say words aloud and clap (or tap the desk) on the stressed syllable.
    For two-syllable words: clap on the first or second syllable. For longer words:
    clap loudly for primary stress, softly for secondary stress, and don''t clap for
    unstressed syllables.

    '
  level: A1-B1
  name: Clap and tap stress marking
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Classroom
    activity 18, p 151'
  type: awareness, production
- description: 'Present pairs like ''record/re''cord, ''permit/per''mit, ''insult/in''sult.
    Provide sentence contexts and have learners practice the stress shift. ''I want
    to re''cord a song'' vs. ''Keep a ''record of the meeting.''

    '
  level: A2-B2
  name: Noun/verb stress contrast drill
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 52-53'
  type: production, awareness
- description: 'Present minimal pair contrasts: ''blackbird vs. black ''bird; ''greenhouse
    vs. green ''house. Discuss the meaning difference. Have learners identify the
    stress pattern and the meaning in context.

    '
  level: B1-C2
  name: Compound vs. phrase discrimination
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 55-56'
  type: discrimination, awareness
- description: 'Give learners a list of base words and suffixes. Have them predict
    the stress pattern of the derived word. For example: economy + ic = economic (stress
    shifts to ''no''); happy + ness = happiness (stress stays on ''hap''). Discuss
    which suffixes shift stress and which don''t.

    '
  level: B1-C2
  name: Suffix stress prediction
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 53-54'
  type: awareness, production
assessment:
  methods:
  - Learners identify the stressed syllable in spoken words
  - Learners produce words with correct stress patterns
  - Learners distinguish noun/verb pairs by stress
  - Learners predict stress in derived words using suffix rules
  - Learners use Cuisenaire rods to represent stress patterns
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 51-56'
cefr_range: A1-C2
teaching:
  methodology: Discovery-based (Underhill)
  tips:
  - 'Underhill (1994) Sound Foundations Level 2: Word stress in English is variable, making it a major learning challenge. Stressed syllables are louder, longer, higher in pitch, and have full vowel quality. Unstressed syllables reduce to schwa. Discovery activities include finger correction technique.'

citations:
- claim: English word stress is lexical and unpredictable — it must be learned as
    part of each word. Stress placement can distinguish nouns from verbs (RE-cord
    vs. re-CORD)
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Part 1 Level 2: Words in
    Isolation, Word Stress patterns'
  tier: 1
- claim: 'Teaching word stress involves developing awareness through the phonemic
    chart and multisensory techniques: listening for prominence, feeling stress with
    hand movements, visual marking'
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Multisensory approach: visual,
    aural, spatial, kinesthetic modalities'
  tier: 1
- claim: McManus (2022) shows that word stress transfer patterns differ based on L1
    stress system type. Learners from fixed-stress L1s (e.g., French with final stress,
    Polish with penultimate stress) produce different English stress placement errors
    than learners from free-stress L1s (e.g., Spanish, Russian), because the degree of
    stress mobility in the L1 influences how learners perceive and produce variable
    English word stress.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
definition: 'Word stress is the name given to the accent or emphasis given to a particular
  syllable within a word. In English, word stress is variable (free): its position
  is not fixed and must be learned for each word. The effect of stress is created
  by the combination of five acoustic variables: loudness, length, pitch, clarity,
  and visual movement. Stressed syllables are louder, longer, higher in pitch, clearer
  in vowel quality, and accompanied by more visible mouth movement. Unstressed syllables
  are typically reduced, with vowels moving toward schwa /ə/.

  '
description: 'Word stress refers to the pattern of stressed and unstressed syllables
  within a word. English has variable (free) word stress: the position of stress is
  not fixed and must be learned for each word. Stressed syllables are produced with
  greater loudness, length, pitch prominence, and clarity. Unstressed syllables are
  typically reduced, often to schwa /ə/. Word stress is phonemic in English — changing
  the stress can change the word (e.g., ''record noun vs. re''cord verb). Underhill
  identifies five acoustic variables that combine to create the effect of stress:
  loudness, length, pitch, clarity, and visual movement.

  '
key_principles:
- explanation: 'Underhill identifies five variables that combine to produce the perception
    of stress: (1) loudness — the stressed syllable is louder; (2) length — the stressed
    syllable is longer; (3) pitch — the stressed syllable is higher in pitch or has
    a pitch movement; (4) clarity — the vowel in the stressed syllable is clear and
    full, while unstressed vowels are reduced; (5) visual movement — the mouth opens
    wider and more visibly on the stressed syllable. These five variables work together;
    no single one is sufficient alone.

    '
  principle: Five acoustic variables create the effect of stress
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 51-56'
- explanation: 'Underhill emphasizes that "you can''t have stress without unstress."
    Stress and unstress exist only in relation to each other — a syllable is perceived
    as stressed precisely because neighboring syllables are unstressed, and vice versa.
    Unstressed syllables have less volume, shorter duration, less pitch change, and
    reduced vowel quality (typically moving toward schwa /ə/). This contrast between
    stress and unstress creates the rhythmical nature of English. For example, in
    ''about'' (ə''baʊt), the first syllable is reduced to schwa — short, quiet, and
    neutral — which makes the second syllable stand out as prominent. In ''comfortable''
    (''kʌmftəbəl), the first syllable carries the stress while the remaining syllables
    are compressed and reduced. Learners from syllable-timed language backgrounds
    (French, Spanish, Japanese) often struggle because they give equal weight to each
    syllable, losing the stress-unstress contrast that defines English rhythm.

    '
  principle: Unstress is the necessary counterpart to stress
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, p 53'
- explanation: 'Words with both primary and secondary stress may shift their stress
    pattern in connected speech when followed by a more strongly stressed word. This
    is a natural feature of fluent English and helps maintain the rhythm of the utterance.
    For example, ''frontbench'' is normally pronounced /ˌfrʌntˈbentʃ/ (secondary on
    ''front'', primary on ''bench''), but in "the frontbench MP" the stress may shift
    to avoid two adjacent stressed syllables. Similarly, ''regimental'' /ˌredʒɪˈmentl/
    may shift in "the regimental colours." Another common example is ''thirteen''
    — normally /ˌθɜːˈtiːn/ — but in "thirteen men" the primary stress may move to
    avoid clashing with the stress on ''men." Teachers should raise awareness of this
    phenomenon so learners are not confused when they hear stress patterns in natural
    speech that differ from dictionary citation forms.

    '
  principle: Stress shift in connected speech
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, p 55'
- explanation: 'Underhill states: "A word spoken with not-quite-right sounds, but
    with correct stress pattern, is more easily understood than one with more or less
    correct sounds but incorrect stress pattern." This is one of the most important
    insights in his approach to pronunciation teaching. It means that getting the
    stress right is more critical for being understood than getting every vowel and
    consonant perfect. For example, if a learner says "PHO-to-graph" (stress on the
    first syllable) instead of "pho-TO-graph," a listener may not recognize the word
    at all, even if every individual sound is clear. Conversely, if a learner says
    "pho-TO-graph" with a slightly foreign-sounding /t/ or /r/, the word is still
    immediately recognizable. This principle argues for prioritizing word stress work
    in pronunciation teaching, especially at lower levels, because correct stress
    patterns carry more communicative weight than individual sound accuracy.

    '
  principle: Correct stress matters more than correct sounds for intelligibility
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, p 56'
- explanation: 'Changing the stress pattern can change the meaning of a word. Examples:
    ''record (noun) vs. re''cord (verb); ''permit (noun) vs. per''mit (verb); ''insult
    (noun) vs. in''sult (verb); ''present (noun) vs. pre''sent (verb). This makes
    word stress a meaning-bearing feature, not merely a matter of pronunciation style.

    '
  principle: Word stress is phonemic in English
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 51-52'
- explanation: 'In connected speech, unstressed syllables are typically reduced. The
    most common reduced vowel is schwa /ə/, the most frequent vowel sound in English.
    Other vowels may be reduced to /ɪ/ or a shortened version of their full quality.
    This reduction is a natural consequence of the stress-timing of English and is
    essential for natural-sounding speech.

    '
  principle: Unstressed syllables undergo vowel reduction
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 53-54'
- explanation: 'Words of three or more syllables may have both primary stress (the
    strongest) and secondary stress (stronger than unstressed but weaker than primary).
    Secondary stress is marked in transcription with a low mark: ˌ. Example: ˌinter''national
    (primary stress on ''na'', secondary stress on ''in'').

    '
  principle: Primary and secondary stress in longer words
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 54-55'
- explanation: 'Compound nouns typically have primary stress on the first element:
    ''blackbird, ''greenhouse, ''bus stop, ''running shoes. Adjective + noun phrases
    typically have stress on the second element: a black ''bird (any bird that is
    black), a green ''house (a house that is painted green). The stress difference
    signals the compound vs. phrase distinction.

    '
  principle: Stress patterns in compounds vs. phrases
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 55-56'
phonological_features:
- articulation: 'The speaker produces the stressed syllable with: (1) greater loudness;
    (2) longer duration; (3) higher pitch or a pitch movement; (4) a clear, full vowel
    quality (not reduced); (5) more visible mouth opening. The combination of all
    five variables creates the perception of stress.

    '
  common_errors:
  - description: Learn the stress pattern as part of the word's identity
    error: Placing stress on the wrong syllable
    explanation: 'English has free word stress; many languages have fixed stress (e.g.,
      French on the last syllable, Polish on the penultimate).

      '
    l1_groups:
    - All L1s
  - description: Reduce unstressed syllables; make stressed syllables prominent
    error: Equal stress on all syllables (syllable-timed rhythm)
    explanation: Syllable-timed languages give equal weight to each syllable.
    l1_groups:
    - French
    - Spanish
    - Italian
    - Japanese
    - Korean
  description: 'Primary stress is the most prominent syllable in a word, produced
    with the greatest combination of loudness, length, pitch, clarity, and visual
    movement. In transcription, it is marked with a high vertical mark before the
    stressed syllable: ''happy, a''bout, ''beautiful.

    '
  examples:
  - happy /'hæpi/ — stress on first syllable
  - about /ə'baʊt/ — stress on second syllable
  - beautiful /'bjuːtɪfəl/ — stress on first syllable
  - understand /ˌʌndə'stænd/ — primary stress on third syllable
  - photograph /'fəʊtəgrɑːf/ — stress on first syllable
  feature: Primary stress — the strongest syllable
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 51-56'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Use Cuisenaire rods (small colored wooden blocks of different lengths)
      to represent syllables. A long rod represents the stressed syllable; short rods
      represent unstressed syllables. For ''about'', use a short rod + a long rod.
      For ''beautiful'', use a long rod + two short rods. Learners physically build
      the stress pattern, making the abstract concept visible and tangible.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Classroom activity 18, pp 151-159'
    technique: Cuisenaire rods for stress visualization
  - description: 'Use physical movement to mark the stressed syllable: clap, tap the
      desk, nod the head, or make a larger gesture. The physical action reinforces
      the acoustic prominence. For ''about'', the clap comes on the second syllable.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Classroom activity 18, p 151'
    technique: Physical movement to mark stress
  - description: 'Analyze a stressed syllable by asking: Is it louder? Longer? Higher
      in pitch? Clearer in vowel quality? More visible in mouth movement? This helps
      learners understand what creates the effect of stress and how to produce it.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Chapter 5: Word Stress, pp 51-56'
    technique: Five-variable analysis
- articulation: 'The secondary stress syllable is produced with moderate prominence
    — more than an unstressed syllable but less than the primary stress. It typically
    has a fuller vowel quality than unstressed syllables but is shorter and less prominent
    than the primary stress.

    '
  common_errors:
  - description: Give moderate prominence to the secondary stress syllable
    error: Omitting secondary stress entirely
    explanation: Learners may focus only on primary stress and reduce all other syllables.
    l1_groups:
    - All L1s
  - description: Keep secondary stress weaker than primary
    error: Making secondary stress equal to primary stress
    explanation: Over-emphasizing secondary stress distorts the rhythm.
    l1_groups:
    - All L1s
  description: 'In words of three or more syllables, there may be a secondary stress
    — stronger than an unstressed syllable but weaker than the primary stress. Marked
    with a low mark in transcription: ˌ. Secondary stress often occurs two syllables
    before or after the primary stress.

    '
  examples:
  - international /ˌɪntə'næʃənəl/ — secondary on 'in', primary on 'na'
  - pronunciation /prəˌnʌnsi'eɪʃən/ — secondary on 'nun', primary on 'na'
  - examination /ɪgˌzæmɪ'neɪʃən/ — secondary on 'za', primary on 'na'
  - photographic /ˌfəʊtə'græfɪk/ — secondary on 'pho', primary on 'gra'
  - understanding /ˌʌndə'stændɪŋ/ — secondary on 'un', primary on 'stan'
  feature: Secondary stress in longer words
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 54-55'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Use three rod lengths: long for primary stress, medium for secondary
      stress, short for unstressed. For ''international'': medium + short + long +
      short + short. This makes the three-level stress system visible.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Classroom activity 18, pp 151-159'
    technique: Three-level rod system
- articulation: 'For noun/adjective use: stress the first syllable (louder, longer,
    higher pitch, clearer vowel). For verb use: stress the second syllable. The unstressed
    syllable in each case is reduced (often to schwa).

    '
  common_errors:
  - description: Shift stress to the second syllable for verb use
    error: Using noun stress for verbs (saying 'record for the verb)
    explanation: This pattern is not predictable from spelling; it must be learned.
    l1_groups:
    - All L1s
  examples:
  - '''record (noun) vs. re''cord (verb)'
  - '''permit (noun) vs. per''mit (verb)'
  - '''insult (noun) vs. in''sult (verb)'
  - '''present (noun) vs. pre''sent (verb)'
  - '''produce (noun) vs. pro''duce (verb)'
  - '''object (noun) vs. ob''ject (verb)'
  - '''subject (noun) vs. sub''ject (verb)'
  - '''conflict (noun) vs. con''flict (verb)'
  - '''export (noun) vs. ex''port (verb)'
  - '''import (noun) vs. im''port (verb)'
  - '''increase (noun) vs. in''crease (verb)'
  - '''decrease (noun) vs. de''crease (verb)'
  explanation: 'Many two-syllable words can be both nouns and verbs. When used as
    nouns (or adjectives), they typically have stress on the first syllable; when
    used as verbs, stress shifts to the second syllable. This is a systematic pattern
    in English.

    '
  feature: Two-syllable nouns and verbs — stress distinction
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 52-53'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Provide sentence contexts: ''I want to re''cord a song'' vs. ''Keep
      a ''record of the meeting.'' Learners practice the stress shift in meaningful
      contexts, not in isolation.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Chapter 5: Word Stress, pp 52-53'
    technique: Sentence context drill
- articulation: 'Stress the first element of the compound noun with full prominence.
    The second element is less prominent. The two words are perceived as a single
    unit.

    '
  common_errors:
  - description: Stress the first element; treat the compound as a single unit
    error: Stressing the second element of compound nouns
    explanation: Learners may treat compounds as phrases and stress the second element.
    l1_groups:
    - All L1s
  description: 'Compound nouns (two words functioning as a single noun) typically
    have primary stress on the first element. This distinguishes them from adjective
    + noun phrases, which have stress on the second element.

    '
  examples:
  - '''blackbird (a species) vs. a black ''bird (any black bird)'
  - '''greenhouse (a building) vs. a green ''house (a house painted green)'
  - '''bus stop (a place)'
  - '''running shoes (shoes for running)'
  - '''washing machine'
  - '''post office'
  - '''fire engine'
  - '''swimming pool'
  feature: Compound noun stress
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 55-56'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Present minimal pair contrasts: ''blackbird (compound) vs. black
      ''bird (phrase). The first refers to a specific species; the second describes
      any bird that is black. The stress difference signals the meaning difference.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Chapter 5: Word Stress, pp 55-56'
    technique: Compound vs. phrase contrast
- articulation: 'When adding a stress-attracting suffix, the primary stress moves
    to the syllable immediately before the suffix. The base word''s stress pattern
    changes.

    '
  common_errors:
  - description: Shift stress to the syllable before the stress-attracting suffix
    error: Keeping the base word's stress pattern after adding a suffix
    explanation: Learners may not know which suffixes attract stress.
    l1_groups:
    - All L1s
  examples:
  - e'conomy -> eco'nomic
  - pho'tograph -> pho'tography
  - de'mo'cracy -> demo'cratic
  - a'ttribute -> a'ttribution
  - com'pete -> compe'tition
  - ad'vise -> ad'visory
  - re'fer -> re'ference
  - dif'fer -> dif'ference
  explanation: 'Certain suffixes systematically shift the stress of the base word.
    Knowing these patterns helps learners predict stress in derived words. Suffixes
    that attract stress to the syllable before them: -tion, -sion, -ic, -ical, -ity,
    -graphy, -metry.

    '
  feature: Stress in derived words — suffixes that shift stress
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 53-54'
  spelling_patterns:
  - '-tion/-sion: stress on preceding syllable (education, decision)'
  - '-ic/-ical: stress on preceding syllable (economic, political)'
  - '-ity: stress on preceding syllable (possibility, electricity)'
  - '-graphy: stress on preceding syllable (photography, geography)'
  - '-metry: stress on preceding syllable (geometry, symmetry)'
  teaching_techniques:
  - description: 'Group words by suffix and have learners identify the stress pattern.
      For -tion: edu''cation, infor''mation, situa''tion. For -ic: e''conomic, po''litical,
      scien''tific. Learners discover the pattern that stress always falls on the
      syllable before the suffix.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Chapter 5: Word Stress, pp 53-54'
    technique: Suffix family sorting
- articulation: 'The stress pattern of the base word is preserved when these suffixes
    are added. The suffix itself is unstressed.

    '
  common_errors:
  - description: Keep the same stress pattern as the base word
    error: Shifting stress when adding neutral suffixes
    explanation: Learners may assume all suffixes affect stress.
    l1_groups:
    - All L1s
  examples:
  - happy -> happiness (stress remains on first syllable)
  - care -> careless (stress remains on first syllable)
  - beautiful -> beautifully (stress remains on first syllable)
  - develop -> development (stress remains on second syllable)
  - interest -> interesting (stress remains on first syllable)
  explanation: 'Some suffixes do not affect the stress of the base word. These include:
    -ness, -less, -ful, -ment, -ing, -ed, -er, -est, -ly, -able, -ous. The stress
    remains on the same syllable as in the base word.

    '
  feature: Stress in derived words — suffixes that do not shift stress
  source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann, Chapter
    5: Word Stress, pp 53-54'
  spelling_patterns:
  - '-ness: no stress shift (happiness, darkness)'
  - '-less: no stress shift (careless, hopeless)'
  - '-ful: no stress shift (beautiful, wonderful)'
  - '-ment: no stress shift (development, government)'
  - '-ing: no stress shift (interesting, developing)'
  teaching_techniques:
  - description: 'Create a two-column chart: suffixes that shift stress vs. suffixes
      that don''t. Have learners sort new words into the correct column and predict
      the stress pattern.

      '
    source: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann,
      Chapter 5: Word Stress, pp 53-54'
    technique: Suffix comparison chart
skill_area: suprasegmentals
skill_name: Word Stress — Primary, Secondary, and Stress Patterns
sources:
  primary: 'Underhill, A. (1994). Sound Foundations: Living Phonology. Heinemann.'
