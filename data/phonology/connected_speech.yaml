  tier: 2
definition: "Connected speech is the term for the way sounds change when words are\
  \ spoken together in natural, fluent speech. The main processes are:\n    (1) Assimilation\
  \ — a sound changes to become more like a neighboring\n    sound. (2) Elision —\
  \ a sound is dropped. (3) Linking — sounds are\n    joined across word boundaries\
  \ (including linking /r/, intrusive /r/,\n    intrusive /w/ and /j/). (4) Vowel\
  \ reduction — unstressed vowels\n    become schwa /ə/. (5) Weak forms — function\
  \ words are reduced in\n    connected speech. (6) Juncture — the boundary between\
  \ words affects\n    pronunciation. These processes are systematic and predictable,\
  \ not\n    random or careless.\n"
description: 'Connected speech refers to the way sounds change when words are spoken
  together in natural, fluent speech. In isolation, words have their citation form;
  in connected speech, they undergo various modifications: assimilation (sounds change
  to become more like neighboring sounds), elision (sounds are dropped), linking (sounds
  are joined across word boundaries), vowel reduction (unstressed vowels become schwa),
  and weak forms (function words are reduced). These processes are not careless speech
  — they are systematic features of natural English. Underhill organizes connected
  speech into Level 3 of his three-level phonological study: Level 1 (individual sounds),
  Level 2 (words in isolation), Level 3 (connected speech).

  '
key_principles:
- explanation: 'The changes that occur in connected speech are not random or a sign
    of lazy pronunciation. They are systematic processes that follow predictable patterns.
    Native speakers apply these processes automatically. Learners need to understand
    these processes to comprehend natural speech and to produce natural-sounding English.

    '
  principle: Connected speech processes are systematic, not careless
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68; see also Underhill 1994, "Connected speech" section (Kindle
    loc. 2685-3000)'
- explanation: 'Assimilation occurs when a sound changes to become more like a neighboring
    sound, making the transition between sounds easier to articulate. For example,
    in ''good boy'', the /d/ at the end of ''good'' may become /b/ (bilabial) before
    the /b/ in ''boy'', because both sounds are now bilabial. This is called progressive
    or regressive assimilation depending on the direction of influence.

    '
  principle: Assimilation makes articulation easier
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- explanation: 'Elision is the omission of a sound that would otherwise be present
    in the citation form. It typically occurs in consonant clusters that are difficult
    to pronounce. For example, ''next day'' may be pronounced as /neks deɪ/ (elision
    of /t/), and ''last time'' as /lɑːs taɪm/ (elision of /t/). Elision is a natural
    feature of fluent speech.

    '
  principle: Elision drops sounds that are difficult to articulate in clusters
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- explanation: 'In connected speech, words are not separated by pauses. The final
    sound of one word links smoothly to the initial sound of the next. This includes:
    consonant-to-vowel linking (e.g., ''turn off'' -> /tɜːnɒf/), vowel-to-vowel linking
    with intrusive /r/, /w/, or /j/ (e.g., ''go away'' -> /gəʊwəweɪ/), and linking
    /r/ in non-rhotic varieties (e.g., ''far away'' -> /fɑːrəweɪ/).

    '
  principle: Linking creates smooth transitions between words
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- explanation: 'About 50 high-frequency function words (articles, auxiliaries, conjunctions,
    prepositions, pronouns) have two pronunciations: a strong form used when stressed
    or spoken in isolation, and a weak form used in connected speech when unstressed.
    Crucially, weak forms are the DEFAULT pronunciation — strong forms are the exception.
    Underhill illustrates this with examples like "and" (/ænd/ → /ənd/, /ən/, /n/),
    "the" (/ði:/ → /ðə/), "can" (/kæn/ → /kən/), "have" (/hæv/ → /həv/, /əv/, /v/),
    and "not" (/nɒt/ → /nt/, /n/). Appropriate use of weak forms is essential for
    smooth, rhythmical speaking, and is part of careful colloquial speech, not just
    rapid speech. Learners who use strong forms in every position sound stilted and
    over-meticulous. '
  principle: Weak forms are the default, not the exception
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68 (Section 4.4: Strong and Weak Forms)'
- explanation: 'Coalescent assimilation is a type of assimilation where two adjacent
    sounds merge into a single third sound — one that shares features of both. The
    classic English examples involve alveolar consonants meeting the palatal glide
    /j/: /t/ + /j/ → /tʃ/ and /d/ + /j/ → /dʒ/. For instance, in "don''t you know,"
    the /t/ at the end of "don''t" and the /j/ at the start of "you" coalesce into
    /tʃ/, yielding /dəʊntʃuː/. Similarly, "how d''you do" produces /haʊdʒuː/ as /d/
    and /j/ merge into /dʒ/. Underhill notes that learners should not be taught rules
    for assimilation — instead, their attention should be drawn to examples when they
    arise in speech or on recordings. '
  principle: Coalescent assimilation merges two sounds into a third
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68 (Section 4.1: Assimilation — coalescence patterns)'
- explanation: 'Connected speech exists on a continuum of simplification, and Underhill
    defines two pronunciation targets for learners. The speaking target is "careful
    colloquial speech" — moderate simplification, closer to dictionary pronunciation,
    widely understood (e.g., BBC World Service announcers). The listening target is
    "rapid colloquial speech" — extensive simplification, words further from dictionary
    form, preparing learners for the widest range of native speaker interaction. Underhill
    emphasizes that a learner''s "listening menu should contain a wider range of phonological
    variants than his speaking menu." His simplification exercise with "What is the
    time?" demonstrates this beautifully: from full /wɒt ɪz ðə taɪm/ through five
    progressively reduced forms to the most rapid /wɒz taɪm/. '
  principle: Careful colloquial and rapid colloquial are both targets
  reliability: B
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68; Chapter 10: Pronunciation Targets, pp. 80-82'
phonological_features:
- articulation: 'The speaker anticipates the place of articulation of the following
    sound and adjusts the current sound accordingly. For example, in ''good boy'',
    the /d/ (alveolar) becomes /b/ (bilabial) before /b/ (bilabial), because it is
    easier to produce two bilabial sounds in sequence.

    '
  common_errors: []
  description: 'Assimilation is the process by which a sound changes to become more
    like a neighboring sound. In English, assimilation is typically regressive (the
    earlier sound is influenced by the later one), though progressive assimilation
    also occurs. Common assimilations involve place of articulation: alveolar consonants
    (/t, d, n, s, z/) may change to bilabial before bilabial consonants, or to velar
    before velar consonants.

    '
  examples:
  - good boy /gʊb bɔɪ/ (d -> b before bilabial b)
  - good girl /gʊg gɜːl/ (d -> g before velar g)
  - ten cups /teŋ kʌps/ (n -> ŋ before velar k)
  - in Paris /ɪm pærɪs/ (n -> m before bilabial p)
  - don't care /dəʊŋ keə/ (t -> ŋ before velar k — also elision of /t/)
  - this shop /ðɪʃ ʃɒp/ (s -> ʃ before palato-alveolar ʃ)
  - those shops /ðəʊʒ ʃɒps/ (z -> ʒ before palato-alveolar ʃ)
  - handbag /hæmbæg/ (n -> m before bilabial b; also elision of /d/)
  - cupboard /kʌbəd/ (p -> b before voiced b; also elision of /p/)
  feature: Assimilation — sounds change to match neighbors
  l1_challenges:
  - explanation: 'Learners may not expect sounds to change across word boundaries.
      They may try to pronounce each word in its citation form, which sounds unnatural
      and can impede comprehension.

      '
    language: All L1s
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'The speaker simplifies the consonant cluster by omitting one sound,
    typically the middle consonant in a three-consonant cluster. This makes the sequence
    easier to articulate at normal speed.

    '
  common_errors: []
  description: 'Elision is the omission of a sound that would be present in the citation
    form. It occurs most commonly in consonant clusters, particularly when three consonants
    come together across word boundaries. The middle consonant is often dropped. Elision
    also occurs within words (e.g., ''Wednesday'' -> /wenzdeɪ/).

    '
  examples:
  - next day /neks deɪ/ (elision of /t/)
  - last time /lɑːs taɪm/ (elision of /t/)
  - first class /fɜːs klɑːs/ (elision of /t/)
  - hand made /hæn meɪd/ (elision of /d/)
  - grand prix /grɒ̃ preɪ/ (elision of /d/)
  - acts /æks/ (elision of /t/ in the cluster /kts/)
  - months /mʌns/ (elision of /θ/ in the cluster /nθs/)
  - clothes /kləʊz/ (elision of /ð/)
  - friends /frenz/ (elision of /d/)
  - Wednesday /wenzdeɪ/ (elision of /d/)
  - castle /kɑːsəl/ (elision of /t/)
  - Christmas /krɪsməs/ (elision of /t/)
  feature: Elision — sounds are dropped in difficult clusters
  l1_challenges:
  - explanation: 'Learners may try to pronounce every sound in the citation form,
      which sounds over-careful and unnatural. They may also not recognize elided
      forms in listening.

      '
    language: All L1s
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'The final consonant of the first word is released directly into the
    initial vowel of the next word. There is no glottal stop or pause. The consonant
    functions as the onset of the following syllable.

    '
  common_errors: []
  description: 'In connected speech, when a word ends in a consonant and the next
    word begins with a vowel, the consonant links to the vowel as if it were the onset
    of the next syllable. This creates a smooth transition with no pause between words.

    '
  examples:
  - turn off /tɜːnɒf/ (n links to o)
  - come in /kʌmɪn/ (m links to i)
  - get out /getaʊt/ (t links to ou)
  - pick up /pɪkʌp/ (k links to u)
  - take it /teɪkɪt/ (k links to i)
  - put on /pʊtɒn/ (t links to o)
  - look at /lʊkæt/ (k links to a)
  - find out /faʊndaʊt/ (d links to ou)
  feature: Linking — consonant to vowel across word boundaries
  l1_challenges:
  - explanation: 'Learners may insert a glottal stop or pause between words, breaking
      the smooth linking. This makes speech sound stilted.

      '
    language: All L1s
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'The /r/ is pronounced only when the following word begins with a
    vowel. The tongue moves to the post-alveolar position for /r/ as the word ends,
    linking smoothly to the following vowel.

    '
  common_errors: []
  description: 'In non-rhotic varieties of English (RP, Australian, etc.), the letter
    ''r'' at the end of a word is not pronounced when the word is followed by a consonant
    or a pause. However, when the next word begins with a vowel, the /r/ is pronounced
    as a linking sound. This is called linking /r/. Example: ''far away'' -> /fɑːrəweɪ/;
    ''for ever'' -> /fərevə/.

    '
  examples:
  - far away /fɑːrəweɪ/
  - for ever /fərevə/
  - better off /betərɒf/
  - here and there /hɪərənðeə/
  - mother and father /mʌðərən fɑːðə/
  - later on /leɪtərɒn/
  - near it /nɪərɪt/
  feature: Linking /r/ — non-rhotic linking
  l1_challenges:
  - explanation: 'Rhotic speakers may pronounce /r/ in all positions, which is correct
      in their variety but not in RP. Non-rhotic learners may forget to link /r/ before
      vowels.

      '
    language: Rhotic L1s (American English speakers learning RP)
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'The speaker inserts an /r/ sound between the two vowels to create
    a smooth transition. The tongue moves to the post-alveolar position for /r/ as
    the first word ends.

    '
  common_errors: []
  description: 'In non-rhotic varieties, an /r/ sound may be inserted between two
    words when the first ends in a vowel (particularly /ə/, /ɑː/, /ɔː/) and the second
    begins with a vowel. This is called intrusive /r/. It has no historical basis
    in spelling — it is inserted purely for ease of articulation. Examples: ''law
    and order'' -> /lɔːrən ɔːdə/; ''China and Japan'' -> /tʃaɪnərən dʒəpæn/; ''idea
    of'' -> /aɪdɪərəv/.

    '
  examples:
  - law and order /lɔːrən ɔːdə/
  - China and Japan /tʃaɪnərən dʒəpæn/
  - idea of /aɪdɪərəv/
  - drawing /drɔːrɪŋ/ (intrusive r within a word)
  - Shah of Persia /ʃɑːrəv pɜːʃə/
  - vanilla ice cream /vənɪlər aɪs kriːm/
  feature: Intrusive /r/ — vowel-to-vowel linking
  l1_challenges:
  - explanation: 'Learners may not expect an /r/ sound where there is no ''r'' in
      the spelling. They may also insert intrusive /r/ in rhotic varieties where it
      is not appropriate.

      '
    language: All L1s
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'For intrusive /w/: the lips round as the first word ends, creating
    a /w/ glide into the next vowel. For intrusive /j/: the tongue moves toward the
    hard palate as the first word ends, creating a /j/ glide.

    '
  common_errors: []
  description: 'When a word ends in a rounded vowel (/uː/, /ʊ/, /əʊ/, /aʊ/) and the
    next word begins with a vowel, a /w/ glide may be inserted. When a word ends in
    a spread or front vowel (/iː/, /ɪ/, /eɪ/, /aɪ/, /ɔɪ/) and the next word begins
    with a vowel, a /j/ glide may be inserted. These glides ease the transition between
    vowels.

    '
  examples:
  - go away /gəʊwəweɪ/ (intrusive w after /əʊ/)
  - do it /duːwɪt/ (intrusive w after /uː/)
  - how about /haʊwəbaʊt/ (intrusive w after /aʊ/)
  - two eggs /tuːweɡz/ (intrusive w after /uː/)
  - me and /miːjən/ (intrusive j after /iː/)
  - she asked /ʃiːjɑːskt/ (intrusive j after /iː/)
  - my own /maɪjəʊn/ (intrusive j after /aɪ/)
  - boy and /bɔɪjən/ (intrusive j after /ɔɪ/)
  feature: Intrusive /w/ and /j/ — glide insertion
  l1_challenges:
  - explanation: 'Learners may not insert glides, creating a hiatus (two vowels in
      sequence) that sounds unnatural. Or they may over-insert glides where they are
      not needed.

      '
    language: All L1s
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'The speaker produces the unstressed vowel with less articulatory
    effort: the tongue moves to a central, neutral position (schwa), the lips are
    neutral, and the sound is shorter and quieter.

    '
  common_errors: []
  description: 'In connected speech, vowels in unstressed syllables are typically
    reduced. The most common reduced vowel is schwa /ə/, the most frequent vowel sound
    in English. Other vowels may be reduced to /ɪ/ or a shortened version of their
    full quality. This reduction is a natural consequence of the stress-timing of
    English.

    '
  examples:
  - about /əbaʊt/ (first syllable reduced to schwa)
  - today /tədeɪ/ (first syllable reduced to schwa)
  - police /pəliːs/ (first syllable reduced to schwa)
  - support /səpɔːt/ (first syllable reduced to schwa)
  - photograph /fəʊtəgrɑːf/ (first syllable reduced to schwa)
  - comfortable /kʌmftəbəl/ (vowels in unstressed syllables reduced)
  - interesting /ɪntrəstɪŋ/ (vowels in unstressed syllables reduced)
  - vegetable /vedʒtəbəl/ (vowels in unstressed syllables reduced)
  feature: Vowel reduction in unstressed syllables
  l1_challenges:
  - explanation: 'Learners from syllable-timed languages tend to give full vowel quality
      to all syllables, which distorts the rhythm of English and can impede comprehension.

      '
    language: Syllable-timed L1s (French, Spanish, Italian, Japanese)
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
- articulation: 'The speaker signals word boundaries through subtle cues: the length
    of consonants, the presence or absence of aspiration, and the timing of the utterance.
    These cues help the listener parse the stream of speech into individual words.

    '
  common_errors: []
  description: 'Juncture refers to the way the boundary between words affects pronunciation
    and meaning. The same sequence of sounds can be perceived as different words depending
    on where the word boundary is placed. Examples: ''ice cream'' vs. ''I scream'';
    ''a name'' vs. ''an aim''; ''night rate'' vs. ''nitrate''; ''grade A'' vs. ''gray
    day''.

    '
  examples:
  - ice cream /aɪs kriːm/ vs. I scream /aɪ skriːm/
  - a name /ə neɪm/ vs. an aim /ən eɪm/
  - night rate /naɪt reɪt/ vs. nitrate /naɪtreɪt/
  - grade A /greɪdeɪ/ vs. gray day /greɪ deɪ/
  - keep sticking /kiːp stɪkɪŋ/ vs. keeps ticking /kiːps tɪkɪŋ/
  - all that glitters is not gold /ɔːl ðæt glɪtəz/ vs. all that glitters...
  feature: Juncture — word boundaries affect meaning
  l1_challenges:
  - explanation: 'Learners may not perceive the subtle cues that signal word boundaries,
      leading to miscomprehension. They may also not produce these cues, making their
      speech harder to understand.

      '
    language: All L1s
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
skill_area: connected_speech
skill_name: Connected Speech — Assimilation, Elision, Linking, and Weak Forms
sources:
  primary: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech (pp. 58-68); Chapter 10: Pronunciation Targets (pp. 80-82)'
  secondary: 'Underhill, A. (1994). Sound Foundations. Heinemann. Introduction: Three
    levels of study (pp. viii-ix); Seven modes of chart usage (pp. 100-106); Four
    ways of giving models (pp. 110-113)'
underhill_teaching_framework:
  description: Underhill's Sound Foundations approach — holistic, multisensory methodology
    using the phonemic chart as the central classroom tool
  four_modeling_ways:
  - Say the sound clearly and naturally
  - Say the sound in a word
  - Mime the sound without speaking
  - Point to the chart only (no oral model)
  multisensory: Pronunciation engages body, breath, muscles, acoustic vibration. Teaching
    uses visual, aural, spatial, kinesthetic modalities.
  phonemic_chart: 44 phonemes on permanent classroom display. Used as a map, not a
    list. Keep sparse — no sample words in boxes. Each symbol represents a family
    of allophones.
  primary: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech (pp. 58-68); Chapter 10: Pronunciation Targets (pp. 80-82); Kindle loc.
    2685-3000'
  seven_chart_modes:
  - Point then speak (drill, sequence)
  - Point then speak (random)
  - Learner points, class produces
  - Two learners point to each other
  - Dictation — teacher dictates, learners point
  - Correction — teacher points to correct sound
  - Identification — teacher produces, learners point
  source: Underhill, A. (1994). Sound Foundations. Heinemann.
  three_levels:
    level_1: Sounds — awareness of vocal musculature and internal sensation of sound
      production
    level_2: Words — neighboring sounds modify each other; energy profile creates
      word stress
    level_3: Connected speech — sounds simplify and reduce; prominence and intonation
      form tone units
