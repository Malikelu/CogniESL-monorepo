    join across word boundaries), catenation (consonant-to-vowel linking), and intrusion
    (extra sounds inserted between words)'
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Part 1 Level 3: Connected
