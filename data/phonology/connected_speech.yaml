    builds on the previous'
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Three-Level Framework: Discovery
    Toolkit + Classroom Toolkit'
  tier: 1
- claim: Singleton's CLI research shows that connected speech transfer patterns vary
    cross-linguistically — L1 phonological systems with different syllable structure
    rules (e.g., CV vs. CVC) produce different connected speech interference patterns
    in English assimilation, elision, and linking.
  source: 'Singleton, D. (2016). Crosslinguistic Influence in Second Language Acquisition.
