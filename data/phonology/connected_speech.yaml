activities:
- description: 'Present phrases and have learners identify where assimilation occurs.
    For example: ''good boy'' -> /gʊb bɔɪ/; ''ten cups'' -> /teŋ kʌps/. Discuss the
    direction of assimilation (regressive) and the place of articulation change.

    '
  level: B1-C2
  name: Assimilation identification
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
  type: awareness, discrimination
- description: 'Present phrases and have learners identify which sounds are elided.
    For example: ''next day'' -> /neks deɪ/ (elision of /t/); ''last time'' -> /lɑːs
    taɪm/ (elision of /t/). Discuss why elision occurs (simplification of consonant
    clusters).

    '
  level: B1-C2
  name: Elision spotting
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
  type: awareness, discrimination
- description: 'Present pairs of words and have learners link them smoothly: ''turn
    off'' -> /tɜːnɒf/; ''come in'' -> /kʌmɪn/. Practice consonant-to-vowel linking,
    linking /r/, and intrusive sounds.

    '
  level: A2-C2
  name: Linking practice
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
  type: production
- description: 'Present ambiguous sequences and have learners identify the word boundary:
    ''ice cream'' vs. ''I scream''; ''a name'' vs. ''an aim''. Discuss the subtle
    phonetic cues that distinguish them.

    '
  level: B2-C2
  name: Juncture discrimination
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
  type: discrimination, awareness
- description: 'Play or dictate natural speech containing assimilation, elision, linking,
    and weak forms. Learners write what they hear, then compare with the transcript.
    This raises awareness of connected speech processes.

    '
  level: B1-C2
  name: Connected speech dictation
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
  type: discrimination, awareness
assessment:
  methods:
  - Learners identify assimilation, elision, and linking in spoken phrases
  - Learners produce connected speech with appropriate linking and reduction
  - Learners distinguish juncture pairs (ice cream vs. I scream)
  - Learners transcribe connected speech accurately
  - Learners explain why connected speech processes occur
  source: 'Underhill, A. (1994). Sound Foundations. Heinemann. Chapter 8: Connected
    Speech, pp. 58-68'
cefr_range: A1-C2
teaching:
  methodology: Discovery-based
  tips:
  - 'Underhill (1994) Sound Foundations. Level 3: Connected speech phenomena include
    assimilation (sounds change under influence of neighbors), elision (sounds disappear),
    liaison (sounds appear between words), and weak forms (function words reduce to
    schwa). English is stress-timed — stressed syllables carry the beat, unstressed
    syllables compress. Five intonation patterns: fall, rise, fall-rise, rise-fall, level.'
citations:
- claim: 'Core meaning: Connected speech describes how sounds change in natural
