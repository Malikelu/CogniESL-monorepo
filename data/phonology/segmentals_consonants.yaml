activities:
- description: 'Choose a voiced/unvoiced pair (e.g., /s, z/). Alternate the pointer
    between them, prompting learners to say the sounds. Ask learners to touch the
    fronts of their throats and feel the presence and absence of voice vibrations.
    Link to the ''voice switch'' gesture.

    '
  level: A1-B1
  name: Voiced/unvoiced clarification using chart layout
  source: Underhill 1994, Classroom activity 14-15, pp 126
  type: discrimination, production
- description: 'Learners hold a sheet of paper 2-3 cm in front of the mouth and say
    pairs like /pi:/ and /bi:/. The unvoiced fortis /pi:/ moves the paper noticeably;
    the voiced lenis /bi:/ hardly moves it. Apply to other pairs: /p, b/, /t, d/,
    /k, g/, /f, v/, /θ, ð/.

    '
  level: A1-B1
  name: Fortis/lenis paper test
  source: Underhill 1994, Classroom activity 16, p 127
  type: awareness, discrimination
- description: 'Keep manner of articulation constant and change place by sliding pointer
    horizontally along a row. For fricatives: /f... θ... s... ʃ.../. Focus on maintaining
    friction quality while changing where the friction is produced.

    '
  level: A2-C2
  name: Horizontal consonant slide
  source: Underhill 1994, Classroom activity 13, p 125
  type: discrimination, production
- description: 'Point to the first element on the monophthong chart, have class say
    it. Point to the second element, have class say it. Then slide the pointer slowly
    between them, inviting the class to say the glide. Speed up. Touch the diphthong
    symbol on the chart.

    '
  level: A2-B2
  name: Building diphthongs from monophthongs
  source: Underhill 1994, Classroom activity 11, p 122
  type: production, awareness
cefr_range: A1-C2
teaching:
  methodology: Discovery-based (Underhill)
  tips:
  - 'Underhill (1994) Sound Foundations Level 1: Consonants taught through articulatory awareness — place of articulation, manner, and voicing. The phonemic chart organizes consonants in a visual system. Mime and gesture help learners feel articulation before producing sounds.'

citations:
- claim: English consonants are classified by place of articulation (bilabial, labiodental,
    dental, alveolar, palatal, velar, glottal) and manner (stop, fricative, affricate,
    nasal, approximant)
  flagged: false
  reliability: B
  source: Underhill (1994) Sound Foundations. Heinemann. The Phonemic Chart and Discovery
    Toolkit
  tier: 1
- claim: The phonemic chart organizes the 24 consonants of English in a visual layout
    that helps learners understand articulation relationships
  flagged: false
  reliability: B
  source: Underhill (1994) Sound Foundations. Heinemann. Seven modes of chart usage
    for teaching consonant distinctions
  tier: 1
- claim: Singleton's CLI framework predicts that consonant transfer patterns depend
    on the phonological distance between L1 and L2 consonant inventories. L1s with
    smaller consonant inventories (e.g., Japanese) show more transfer effects than
    L1s with larger inventories (e.g., German).
  source: 'Singleton, D. (2016). Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters. Ch. 4: Phonological transfer'
  tier: 2
definition: 'Consonant sounds are made by restricting or blocking the airflow in some
  physical way; this restriction, or the release of the restriction, gives each consonant
  its characteristic sound. Consonants, singly or in clusters, mark the beginnings
  and ends of syllables, while vowels occur as the centres of syllables. English has
  twenty-four consonant phonemes. The three descriptive variables are: (1) voiced
  or unvoiced, (2) place of articulation, and (3) manner of articulation.

  '
description: 'The English consonant system comprises twenty-four consonant phonemes
  organized by three variables: voicing (voiced/unvoiced), place of articulation (where
  the restriction occurs in the vocal tract), and manner of articulation (how the
  restriction is made). Consonants mark the beginnings and ends of syllables and are
  produced by restricting or blocking the airflow in some physical way. The phonemic
  chart arranges consonants to convey this information visually: horizontally by place
  (front to back) and vertically by manner (plosives/affricates, fricatives, nasals/others).

  '
key_principles:
- explanation: 'In English, voiced consonants (/b, d, g, v, ð, z, dʒ/) are produced
    with weaker breath force (lenis/gentle), while unvoiced consonants (/p, t, k,
    f, θ, s, tʃ/) are produced with stronger breath force (fortis/strong). This coincidence
    is not universal — some languages have voiced fortis consonants. When whispering
    removes voicing, the fortis/lenis distinction remains as the only contrast.

    '
  principle: Voiced/unvoiced distinction coincides with lenis/fortis in English
  reliability: B
  source: 'Underhill 1994, Chapter 4: Consonants, Discovery activities 33-35, pp 30-32'
- explanation: 'Consonants articulated at the front of the mouth (/p, m, v/) appear
    on the left; those at the back (/k, g, ŋ/) on the right. Plosives and affricates
    are in the top row, fricatives in the second row, and nasals/others in the bottom
    row. This visual arrangement helps learners relate the internal muscular sensation
    of each sound to its position on the chart.

    '
  principle: The chart layout encodes place (horizontal) and manner (vertical)
  reliability: B
  source: 'Underhill 1994, Chapter 4: Consonants, pp 30, 124-125'
- explanation: 'Bilabial group: /m, p, b, w/. Alveolar group: /n, s, z, t, d, l/.
    Palato-alveolar group: /ʃ, tʃ, dʒ/ (with /r/ close behind). Velar group: /ŋ, k,
    g/. Each group shares a place of articulation but varies in manner. This is useful
    for discovering new sounds by molding familiar ones.

    '
  principle: Consonants can be grouped by place of articulation into four vertical
    groups
  reliability: B
  source: 'Underhill 1994, Chapter 4: Consonants, p 125'
- explanation: 'The two affricates /tʃ/ and /dʒ/ begin with a build-up of air pressure
    (like plosives) but release more slowly, producing audible friction (like fricatives).
    The symbols show this: /tʃ/ = /t/ + /ʃ/; /dʒ/ = /d/ + /z/. They are perceived
    as single phonemes, not sequences.

    '
  principle: Affricates are mergers of plosive + fricative, not glides
  reliability: B
  source: 'Underhill 1994, Chapter 4: Consonants, Discovery activity 37, pp 33-34'
phonological_features:
- articulation: 'Both lips come together to block the airstream. Air pressure builds
    up behind the closure. The lips part suddenly, releasing the air in a small explosion.
    For /p/, there is a strong puff of air (fortis); for /b/, the vocal cords vibrate
    and the aspiration is weaker (lenis). Hold a sheet of paper 2-3 cm in front of
    the mouth: /pi:/ moves the paper noticeably, /bi:/ hardly moves it.

    '
  common_errors:
  - description: Increase breath force; feel the puff of air on hand
    error: Insufficient aspiration on /p/ — sounds like /b/
    explanation: These languages have less aspiration on unvoiced plosives.
    l1_groups:
    - Arabic
    - French
    - Spanish
  - description: Maintain voicing through the closure and release
    error: Devoicing /b/ in final position, making it sound like /p/
    explanation: Final devoicing is a rule in these languages.
    l1_groups:
    - German
    - Russian
    - Polish
  description: 'The bilabial plosives are produced by blocking the airflow with both
    lips, then releasing explosively. /p/ is unvoiced and fortis (strong aspiration);
    /b/ is voiced and lenis (weaker aspiration). Both can occur in initial and final
    position.

    '
  examples:
  - pie /pai/
  - bee /bi:/
  - pen /pen/
  - bed /bed/
  - cap /kæp/
  - cab /kæb/
  - lip /lip/
  - nib /nib/
  feature: /p/ — unvoiced bilabial plosive and /b/ — voiced bilabial plosive
  source: 'Underhill 1994, Chapter 4: Consonants, Row 1 plosives'
  spelling_patterns:
  - p (pen, cap, lip)
  - pp (happy, supper)
  - b (bed, cab, nib)
  - bb (rabbit, ribbon)
  teaching_techniques:
  - description: 'Hold paper 2-3 cm from mouth. Say /pi:/ — paper moves. Say /bi:/
      — paper barely moves. Learners feel the difference in breath force. Whisper
      the pair to show that aspiration alone distinguishes them.

      '
    source: Underhill 1994, Classroom activity 16, p 127
    technique: Paper test for aspiration
  - description: 'Both forefingers just below chin make a definite forward movement
      of about 5 cm as the air is released. Touch front of throat to indicate voicing
      for /b/.

      '
    source: Underhill 1994, Classroom activity 17, p 128
    technique: Mime with both-forefingers forward movement
- articulation: 'The blade (front part) of the tongue makes contact with the alveolar
    ridge. Air pressure builds up behind the closure. The tongue releases suddenly.
    For /t/, strong aspiration; for /d/, voicing and weaker aspiration. The place
    is further back than /p, b/.

    '
  common_errors:
  - description: Place tongue blade on alveolar ridge, not on teeth
    error: Using dental /t̪/ (tongue on teeth) instead of alveolar /t/
    explanation: Many languages have dental rather than alveolar plosives. In Spanish,
      /t/ and /d/ are produced with the tongue touching the back of the upper teeth
      (dental), whereas in English the tongue touches the alveolar ridge behind the
      teeth. This results in a noticeably different sound quality (Silva Valencia
      2022, Gist Education and Learning Research Journal, No. 25, p. 147).
    l1_groups:
    - French
    - Spanish
    - Italian
    - Hindi
  - description: Maintain voicing for final /d/; use aspiration for final /t/
    error: Confusing /t/ with /d/ in final position
    explanation: Final devoicing rule in L1 interferes.
    l1_groups:
    - German
    - Russian
  description: 'The alveolar plosives are produced by blocking the airflow with the
    blade of the tongue against the alveolar ridge (the bony ridge behind the upper
    front teeth). /t/ is unvoiced and fortis; /d/ is voiced and lenis.

    '
  examples:
  - too /tu:/
  - do /du:/
  - ten /ten/
  - den /den/
  - cat /kæt/
  - cad /kæd/
  - let /let/
  - led /led/
  feature: /t/ — unvoiced alveolar plosive and /d/ — voiced alveolar plosive
  source: 'Underhill 1994, Chapter 4: Consonants, Row 1 plosives'
  spelling_patterns:
  - t (ten, cat, let)
  - tt (better, letter)
  - ed (walked, talked — pronounced /t/)
  - d (den, cad, led)
  - dd (riddle, sudden)
  teaching_techniques:
  - description: 'Point to the alveolar ridge just before the mime. Then a small but
      definite jerk forwards of the fingers below the chin as the sound is released.

      '
    source: Underhill 1994, Classroom activity 17, p 129
    technique: Locate alveolar ridge by pointing behind top front teeth
  - description: 'Whisper pairs of consonants; another learner listens and points
      them out on the chart. Even without voicing, the fortis/lenis distinction remains
      audible.

      '
    source: Underhill 1994, Classroom activity 16, p 127
    technique: Whispering game
- articulation: 'The blade of the tongue makes contact with the junction between the
    alveolar ridge and the hard palate. The body of the tongue is slightly raised
    toward the hard palate. Air pressure builds up (as for plosives) but the release
    is slower, producing a fricative noise. /tʃ/ has strong aspiration; /dʒ/ has voicing.

    '
  common_errors:
  - description: Begin with a clear plosive closure before the fricative release
    error: Replacing /tʃ/ with /ʃ/ (cheer as sheer)
    explanation: These languages have /ʃ/ but not /tʃ/ as a distinct phoneme.
    l1_groups:
    - French
    - Portuguese
  - description: Begin with a clear /d/ closure before the fricative
    error: Replacing /dʒ/ with /ʒ/ (just as zhust)
    explanation: French has /ʒ/ but not /dʒ/.
    l1_groups:
    - French
  description: 'The affricates begin with a plosive closure at the junction of the
    alveolar ridge and hard palate, but release more slowly, producing audible friction.
    /tʃ/ is unvoiced and fortis; /dʒ/ is voiced and lenis. They are single phonemes,
    not sequences.

    '
  examples:
  - cheer /tʃɪə/
  - jeer /dʒɪə/
  - chin /tʃɪn/
  - gin /dʒɪn/
  - cheese /tʃiːz/
  - just /dʒʌst/
  - church /tʃɜːtʃ/
  - judge /dʒʌdʒ/
  feature: /tʃ/ — unvoiced palato-alveolar affricate and /dʒ/ — voiced palato-alveolar
    affricate
  source: 'Underhill 1994, Chapter 4: Consonants, Row 1 affricates'
  spelling_patterns:
  - ch (cheer, chin, cheese)
  - tch (match, watch)
  - j (just, judge)
  - g (gin, general, giant)
  - dge (judge, bridge)
  teaching_techniques:
  - description: 'Say "tease" vs. "cheese"; "pin" vs. "chin"; "boy" vs. "joy"; "dump"
      vs. "jump". Notice the build-up is the same, but after release the plosive is
      finished while the affricate has audible friction to follow.

      '
    source: Underhill 1994, Discovery activity 37, pp 33-34
    technique: Contrast plosive vs. affricate
  - description: 'Locate position just behind the tooth ridge. Then a small but definite
      slide forwards of the fingers as the sound is released (slower than for /t,
      d/).

      '
    source: Underhill 1994, Classroom activity 17, p 130
    technique: Mime with slower release gesture
- articulation: 'The back of the tongue rises to make contact with the soft palate
    (the soft tissue at the back of the roof of the mouth). Air pressure builds up.
    The tongue releases suddenly. For /k/, strong aspiration; for /g/, voicing and
    weaker aspiration.

    '
  common_errors:
  - description: Keep the back of the tongue raised to the soft palate even before
      /i:/
    error: Fronting /k/ and /g/ to palatal or alveolar position before front vowels
    explanation: Many languages front velars before front vowels.
    l1_groups:
    - Various L1s
  - description: Increase breath force; contrast with /g/ using paper test
    error: Insufficient aspiration on /k/
    explanation: Less aspiration on unvoiced plosives in these languages.
    l1_groups:
    - French
    - Spanish
  - description: Maintain voicing through the velar closure and release
    error: Devoicing or difficulty producing /g/ in word-final positions
    explanation: Mandarin lacks voiced stops entirely, utilizing a contrast between
      aspirated and unaspirated voiceless stops instead. /g/ is difficult to hear,
      distinguish, or produce especially in word-final positions. Somali lacks a direct
      equivalent to English /g/ in certain phonotactic positions, leading to devoicing,
      modification, or omission in specific environments. (L1 Interference ESL Teacher
      Resources, Consonantal Sound Transfer Matrix).
    l1_groups:
    - Mandarin Chinese
    - Somali
  description: 'The velar plosives are produced by blocking the airflow with the back
    of the tongue against the soft palate (velum). /k/ is unvoiced and fortis; /g/
    is voiced and lenis. Both can occur in initial and final position.

    '
  examples:
  - course /kɔːs/
  - gorse /gɔːs/
  - can /kæn/
  - game /geɪm/
  - back /bæk/
  - bag /bæg/
  - lick /lɪk/
  - leg /leg/
  feature: /k/ — unvoiced velar plosive and /g/ — voiced velar plosive
  source: 'Underhill 1994, Chapter 4: Consonants, Row 1 plosives'
  spelling_patterns:
  - c (can, course, back)
  - k (king, back, like)
  - ck (black, pocket)
  - g (game, bag, leg)
  - gg (bigger, egg)
  - ch (chorus, chemist)
  teaching_techniques:
  - description: 'Touch the back of the lower jaw bone just below the ears to show
      where the closure happens. Then draw the sound from the mouth with hands while
      miming.

      '
    source: Underhill 1994, Classroom activity 17, p 130
    technique: Indicate velar location by touching back of jaw below ears
- articulation: 'Bottom lip presses lightly against the edge of the upper front teeth.
    Air is forced through the narrow gap, producing audible friction. For /f/, no
    voicing and stronger breath force; for /v/, vocal cords vibrate and breath force
    is weaker. Can draw out the sound: /ffff/ or /vvvv/.

    '
  common_errors:
  - description: Maintain lip-teeth contact; do not close the lips fully
    error: Replacing /v/ with /b/ or /f/ (very as berry; vine as fine)
    explanation: Spanish, Arabic, and Tagalog lack /v/; /b/ or /f/ is the nearest
      equivalent. In Spanish, /b/ and /v/ are pronounced identically as [b] or [β]
      depending on position; the letters "b" and "v" represent the same phoneme. This
      merger causes lexical ambiguity in English (very/berry, vest/best, vine/bine)
      (Silva Valencia 2022, Gist Education and Learning Research Journal, No. 25,
      p. 144). Tagalog (and other Philippine languages) also lack the /v/ phoneme
      in their standard inventories, substituting /b/ or /f/. (L1 Interference ESL
      Teacher Resources, Consonantal Sound Transfer Matrix).
    l1_groups:
    - Spanish
    - Arabic
    - Tagalog
  - description: Ensure lip-teeth contact and continuous airflow
    error: Replacing /f/ with /p/ or insufficient friction
    explanation: Some languages lack labio-dental fricatives.
    l1_groups:
    - Various L1s without /f/
  description: 'The labio-dental fricatives are produced by pressing the bottom lip
    lightly against the edge of the upper front teeth, creating friction as air escapes.
    /f/ is unvoiced and fortis; /v/ is voiced and lenis. Fricatives can be sustained
    indefinitely, unlike plosives.

    '
  examples:
  - fire /faɪə/
  - via /vaɪə/
  - five /faɪv/
  - very /veri/
  - leaf /liːf/
  - leave /liːv/
  - laugh /lɑːf/
  - love /lʌv/
  feature: /f/ — unvoiced labio-dental fricative and /v/ — voiced labio-dental fricative
  source: 'Underhill 1994, Chapter 4: Consonants, Row 2 fricatives'
  spelling_patterns:
  - f (fire, five, leaf)
  - ff (coffee, off)
  - gh (laugh, enough)
  - ph (phone, photo)
  - v (via, very, love)
  teaching_techniques:
  - description: 'Adopt the posture for /f/ and inhale instead of exhale. The incoming
      air helps locate where the friction occurs. Alternate /f/ and /v/, noticing
      only the voicing changes.

      '
    source: Underhill 1994, Discovery activity 40, p 39
    technique: Inhale to locate friction point
  - description: 'Exaggerate the lower lip against upper teeth contact. Move fingers
      slowly forward for the length of the mime. Use voicing/unvoicing gesture (voice
      switch) to distinguish /f/ from /v/.

      '
    source: Underhill 1994, Classroom activity 17, p 129
    technique: Mime with lip-teeth contact gesture
- articulation: 'The tip of the tongue presses lightly against the inside edge of
    the upper front teeth (or slightly between the teeth). Air flows through the gap,
    producing friction. For /θ/, no voicing and stronger breath; for /ð/, voicing
    and weaker breath. Can be sustained: /θθθθ/ or /ðððð/.

    '
  common_errors:
  - description: Place tongue tip on/between teeth; maintain friction
    error: Replacing /θ/ with /t/ or /s/ (think as tink or sink)
    explanation: 'Most European and Asian languages lack dental fricatives. /t/ is
      the most common substitution (dental stop for dental fricative).

      '
    l1_groups:
    - French
    - German
    - Italian
    - Chinese
    - Japanese
  - description: Place tongue on teeth; maintain voicing and friction
    error: Replacing /ð/ with /d/ or /z/ (this as dis or zis)
    explanation: Same L1 gap as for /θ/; /d/ is the nearest equivalent.
    l1_groups:
    - French
    - German
    - Italian
    - Chinese
  description: 'The dental fricatives are produced by pressing the tip of the tongue
    lightly against the inside edge of the upper front teeth. Air escapes between
    tongue and teeth, producing friction. /θ/ is unvoiced and fortis; /ð/ is voiced
    and lenis. These sounds are rare among the world''s languages and are among the
    most difficult for most learners.

    '
  examples:
  - think /θɪŋk/
  - this /ðɪs/
  - three /θriː/
  - there /ðeə/
  - both /bəʊθ/
  - bathe /beɪð/
  - thin /θɪn/
  - then /ðen/
  feature: /θ/ — unvoiced dental fricative and /ð/ — voiced dental fricative
  source: 'Underhill 1994, Chapter 4: Consonants, Row 2 fricatives'
  spelling_patterns:
  - th (think, this, both, there)
  teaching_techniques:
  - description: 'Initially exaggerate by having the tongue clearly visible between
      the teeth. Point to the position of the tongue between the teeth. Indicate the
      duration of the mime with hands moving slowly forward. Later show a more natural,
      less visible version.

      '
    source: Underhill 1994, Classroom activity 17, p 129
    technique: Exaggerated tongue-between-teeth mime
  - description: 'Whisper the pairs. Even without voicing, the aspiration difference
      remains. This proves that fortis/lenis is a separate variable from voiced/unvoiced.

      '
    source: Underhill 1994, Classroom activity 16, p 127
    technique: Whispering game to isolate fortis/lenis
- articulation: 'The blade of the tongue presses lightly against the alveolar ridge
    (same place as /t, d, n/). Air is forced through the narrow channel between the
    tongue and the ridge, producing a hissing friction. For /s/, no voicing and stronger
    breath; for /z/, voicing and weaker breath.

    '
  common_errors:
  - description: Raise tongue blade to alveolar ridge; do not place tongue on teeth
    error: Confusing /s/ with /θ/ (sink vs think)
    explanation: These languages have /θ/ but may lack /s/ in certain positions.
    l1_groups:
    - Greek
    - Icelandic
  - description: Maintain voicing through the fricative
    error: Devoicing final /z/ to /s/ (eyes as ice)
    explanation: Final devoicing rule in L1.
    l1_groups:
    - German
    - Russian
    - Polish
  description: 'The alveolar fricatives are produced by pressing the blade of the
    tongue lightly against the alveolar ridge. Air escapes over the centre of the
    tongue, producing friction. /s/ is unvoiced and fortis; /z/ is voiced and lenis.

    '
  examples:
  - sue /suː/
  - zoo /zuː/
  - see /siː/
  - zest /zest/
  - bus /bʌs/
  - buzz /bʌz/
  - ice /aɪs/
  - eyes /aɪz/
  feature: /s/ — unvoiced alveolar fricative and /z/ — voiced alveolar fricative
  source: 'Underhill 1994, Chapter 4: Consonants, Row 2 fricatives'
  spelling_patterns:
  - s (sue, see, bus)
  - ss (class, less)
  - c (ice, city, nice)
  - z (zoo, zest)
  - zz (buzz, fuzzy)
  - se (please, rise)
  teaching_techniques:
  - description: 'For /s/, mime the hissing of a snake with a snaky, wiggling hand
      movement. For /z/, mime the buzzing of a bee with a hand gesture indicating
      its unpredictable flight. These vivid associations help learners remember the
      distinction.

      '
    source: Underhill 1994, Classroom activity 17, p 130
    technique: Snake and bee gestures
  - description: 'Keep fricative quality constant while sliding pointer horizontally
      along the fricative row: /f... θ... s... ʃ.../. Focus on maintaining friction
      while changing the place where it is produced.

      '
    source: Underhill 1994, Classroom activity 13, p 125
    technique: Horizontal fricative slide
- articulation: 'The blade of the tongue is at the palato-alveolar position (slightly
    behind /s, z/). The centre of the tongue is raised toward the hard palate. Air
    flows with friction between the raised tongue and the hard palate. For /ʃ/, no
    voicing; for /ʒ/, voicing. Lips may be slightly rounded.

    '
  common_errors:
  - description: Sustain the fricative without a plosive onset
    error: Replacing /ʃ/ with /tʃ/ (ship as chip)
    explanation: These languages have /tʃ/ but not /ʃ/ in many positions.
    l1_groups:
    - Spanish
    - Italian
  - description: Maintain voicing and friction; do not add a plosive onset
    error: Replacing /ʒ/ with /dʒ/ or /ʃ/
    explanation: French has /ʒ/ but learners may confuse it with /dʒ/.
    l1_groups:
    - French
  - description: Retract the tongue slightly from alveolar /s/ to palato-alveolar
      /ʃ/; add slight lip rounding
    error: Replacing /ʃ/ with /s/ (ship as sip)
    explanation: Dholuo lacks the voiceless palato-alveolar fricative /ʃ/ in its native
      phonology. Learners substitute the nearest available phoneme, alveolar /s/.
      (L1 Interference ESL Teacher Resources, Consonantal Sound Transfer Matrix).
    l1_groups:
    - Dholuo
  description: 'The palato-alveolar fricatives are produced with the blade of the
    tongue at a point slightly further back from /s, z/, roughly opposite the join
    between the alveolar ridge and the palate. The centre of the tongue is raised
    toward the hard palate. /ʃ/ is unvoiced and fortis; /ʒ/ is voiced and lenis. /ʒ/
    does not occur initially in native English words and very rarely finally.

    '
  examples:
  - she /ʃiː/
  - show /ʃəʊ/
  - ship /ʃɪp/
  - pleasure /pleʒə/
  - vision /vɪʒən/
  - measure /meʒə/
  - fashion /fæʃən/
  - garage /gærɑːʒ/
  feature: /ʃ/ — unvoiced palato-alveolar fricative and /ʒ/ — voiced palato-alveolar
    fricative
  source: 'Underhill 1994, Chapter 4: Consonants, Row 2 fricatives'
  spelling_patterns:
  - sh (she, show, ship)
  - ti (station, nation, action)
  - ci (special, musician)
  - ssi (mission, discussion)
  - ch (chef, machine)
  - s (sure, sugar)
  - ge (garage, beige)
  - si (vision, occasion)
  teaching_techniques:
  - description: 'Mime /ʃ/ by rounding lips while holding forefinger to lips to indicate
      ''hush''. Then derive /ʒ/ from /ʃ/ by using the voice switch gesture (turning
      Adam''s apple on).

      '
    source: Underhill 1994, Classroom activity 17, p 130
    technique: Hush gesture and voice switch
- articulation: 'The tongue, lips, and jaw adopt the posture required for the following
    vowel. A strong burst of unvoiced air (fortis) is expelled, causing friction throughout
    the vocal tract. There is no single articulatory target — /h/ takes the shape
    of whatever vowel follows it.

    '
  common_errors:
  - description: Add a strong breath onset before the vowel
    error: Dropping /h/ in initial position (house as 'ouse)
    explanation: These languages do not have initial /h/; it is systematically dropped.
      Haitian Creole phonology entirely lacks the glottal fricative /h/, leading to
      consistent omission. (L1 Interference ESL Teacher Resources, Consonantal Sound
      Transfer Matrix).
    l1_groups:
    - French
    - Italian
    - Spanish
    - Portuguese
    - Haitian Creole
  - description: Keep the friction at the glottis, not in the mouth
    error: Replacing /h/ with /x/ or /χ/ (a uvular or velar fricative)
    explanation: Many languages have velar/uvular fricatives where English has glottal
      /h/.
    l1_groups:
    - German
    - Scottish English
    - Arabic
    - Spanish (j)
  description: 'The glottal fricative is unique among English consonants in having
    no single tongue/lip posture of its own. It is produced with the mouth shaped
    for the following vowel, with a strong expulsion of air (fortis) causing friction
    in the vocal tract. It occurs only initially, never finally. Underhill describes
    it as ''like the cuckoo — it has no place of its own, but finds its home in the
    nests of others.''

    '
  examples:
  - hat /hæt/
  - heat /hiːt/
  - hot /hɒt/
  - hoot /huːt/
  - house /haʊs/
  - her /hɜː/
  - happy /hæpi/
  - who /huː/
  feature: /h/ — unvoiced fortis fricative onset
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 /h/'
  spelling_patterns:
  - h (hat, heat, hot)
  - wh (who, whole)
  teaching_techniques:
  - description: 'Mime a sigh, then add the vowel. The sigh IS the /h/. For ''hat'',
      sigh then say ''at''. For ''heat'', sigh then say ''eat''. The mouth posture
      for /h/ is identical to the following vowel.

      '
    source: Underhill 1994, Classroom activity 17, p 131
    technique: Sigh into the vowel
- articulation: 'Both lips come together to close off the mouth. The soft palate (velum)
    is lowered, allowing air to flow through the nose. Vocal cords vibrate. Can be
    sustained: /mmmm/. Feel vibration in the lips.

    '
  common_errors:
  - description: /m/ exists in virtually all languages
    error: No significant errors for most learners
    explanation: This sound is nearly universal.
    l1_groups: []
  description: 'Produced by closing both lips (as for /p, b/) but diverting the airflow
    through the nose. Voiced. The air stream is blocked at the lips and redirected
    upward through the nasal cavity.

    '
  examples:
  - me /miː/
  - may /meɪ/
  - man /mæn/
  - come /kʌm/
  - time /taɪm/
  - summer /sʌmə/
  feature: /m/ — voiced bilabial nasal
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 nasals'
  spelling_patterns:
  - m (me, may, man)
  - mm (summer, common)
  - mb (comb, lamb)
  - mn (autumn, hymn)
  teaching_techniques:
  - description: 'Indicate the closed lips with forefingers. Take a breath and exhale
      rather obviously. ''Pull'' the airflow from the nose with a gesture. This is
      vivid, amusing, and usually successful.

      '
    source: Underhill 1994, Classroom activity 17, p 129
    technique: Pull the sound from the nose
- articulation: 'The blade of the tongue makes contact with the alveolar ridge, blocking
    airflow through the mouth. The velum is lowered, allowing air through the nose.
    Vocal cords vibrate. Can be sustained: /nnnn/. Feel vibration in the tongue and
    the bone at the top of the mouth.

    '
  common_errors:
  - description: Place tongue blade on the ridge behind the teeth
    error: Dentalizing /n/ (tongue on teeth instead of alveolar ridge)
    explanation: These languages have dental /n/.
    l1_groups:
    - French
    - Spanish
    - Italian
  description: 'Produced by pressing the blade of the tongue against the alveolar
    ridge (same place as /t, d/) and diverting the airflow through the nose. Voiced.

    '
  examples:
  - no /nəʊ/
  - nine /naɪn/
  - sun /sʌn/
  - many /meni/
  - know /nəʊ/
  - dinner /dɪnə/
  feature: /n/ — voiced alveolar nasal
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 nasals'
  spelling_patterns:
  - n (no, nine, sun)
  - nn (dinner, sunny)
  - kn (know, knee)
  - gn (gnaw, sign)
  teaching_techniques:
  - description: 'Point to the alveolar ridge behind the top teeth. Place tongue there
      conspicuously. As you exhale, ''pull'' the airflow from the nose.

      '
    source: Underhill 1994, Classroom activity 17, p 130
    technique: Indicate ridge and pull air from nose
- articulation: 'The back of the tongue rises to make contact with the soft palate,
    blocking airflow through the mouth. The velum is lowered, allowing air through
    the nose. Vocal cords vibrate. Can be sustained: /ŋŋŋŋ/.

    '
  common_errors:
  - description: Raise the back of the tongue to the soft palate; feel the velar closure
    error: Replacing /ŋ/ with /n/ (sing as sin)
    explanation: These languages do not have /ŋ/ as a distinct phoneme.
    l1_groups:
    - Spanish
    - Italian
    - Chinese
  - description: Do not release the velar closure; just lower the velum
    error: Adding /g/ after /ŋ/ (sing as sing-g)
    explanation: The tendency to release the velar closure adds an extra /g/.
    l1_groups:
    - Various L1s
  description: 'Produced by pressing the back of the tongue against the soft palate
    (same place as /k, g/) and diverting the airflow through the nose. Voiced. Does
    not occur initially in English. Common in final position and before /k/ and /g/.

    '
  examples:
  - sing /sɪŋ/
  - long /lɒŋ/
  - think /θɪŋk/
  - finger /fɪŋgə/
  - bank /bæŋk/
  - sung /sʌŋ/
  - anger /æŋgə/
  feature: /ŋ/ — voiced velar nasal
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 nasals'
  spelling_patterns:
  - ng (sing, long, sung)
  - n before k (think, bank)
  - n before g (finger, anger)
  teaching_techniques:
  - description: 'Press the side of the hand against the angle between throat and
      chin to indicate the block to airflow at the velum. Mouth open, tongue visibly
      back. Then ''pull the sound'' from the nose.

      '
    source: Underhill 1994, Classroom activity 17, p 130
    technique: Indicate velar block with hand at throat-chin angle
- articulation: 'The blade of the tongue makes contact with the alveolar ridge. Air
    escapes over the sides of the tongue (lateral). Vocal cords vibrate. Can be sustained:
    /llll/. For clear /l/, the tongue has a front vowel quality; for dark /l/, the
    back of the tongue is raised toward the soft palate, giving a ''back vowel quality''.

    '
  common_errors:
  - description: Ensure tongue tip touches alveolar ridge; air escapes over sides
    error: Confusing /l/ with /r/ (light as right, long as wrong)
    explanation: These languages do not distinguish /l/ and /r/.
    l1_groups:
    - Japanese
    - Korean
    - Chinese
  - description: Raise the back of the tongue for dark /l/ in final position
    error: Using only clear /l/ in all positions (including after vowels)
    explanation: These languages have only clear /l/.
    l1_groups:
    - French
    - German
    - Spanish
  description: 'Produced by pressing the blade of the tongue against the alveolar
    ridge while air escapes over the sides of the tongue. Voiced. Two allophones:
    ''clear /l/'' (before vowels, tongue has front vowel quality) and ''dark /ɫ/''
    (after vowels and before consonants, tongue has back vowel quality with back raised
    toward soft palate). Underhill prefers to show dark /l/ with the vowel /ə/ in
    transcription: /metəl/ rather than /metl/.

    '
  examples:
  - lay /leɪ/
  - low /ləʊ/
  - love /lʌv/
  - all /ɔːl/
  - little /lɪtəl/
  - milk /mɪɫk/
  - feel /fiːɫ/
  - cold /kəʊɫd/
  feature: /l/ — voiced alveolar lateral
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 /l/'
  spelling_patterns:
  - l (lay, low, love)
  - ll (all, little, feel)
  teaching_techniques:
  - description: 'Form the tongue position for /l/ and draw air in through the mouth.
      Feel the cold air on each side of the tongue. This confirms the lateral airflow.

      '
    source: Underhill 1994, Discovery activity 44, p 44
    technique: Draw air in to feel lateral escape
  - description: 'Observe in a mirror saying /læ læ læ/. There is a definite tongue
      movement. Hold the initial position of tongue against the ridge, and as the
      tongue breaks contact, make a corresponding downward flick with the palm of
      the hand.

      '
    source: Underhill 1994, Classroom activity 17, p 131
    technique: Mirror observation of tongue movement
- articulation: 'The tip of the tongue is raised close to the rear part of the alveolar
    ridge (post-alveolar), but not touching. The central part of the tongue is lowered,
    giving the sensation of the tongue being curled upward. Air escapes freely without
    friction. Voiced. Can be sustained: /rrrr/. Similar to /ʃ, ʒ, tʃ, dʒ/ tongue position
    but with the tip further back and no friction.

    '
  common_errors:
  - description: Curl the tongue without any contact or friction; no trilling
    error: Replacing /r/ with a trill /r/ or tap /ɾ/ (Spanish-style)
    explanation: These languages have trilled or tapped /r/.
    l1_groups:
    - Spanish
    - Italian
    - Arabic
  - description: Raise tongue tip toward post-alveolar ridge; do not round lips
    error: Replacing /r/ with /w/ (red as wed)
    explanation: These languages lack the English /r/; /w/ is the nearest approximation.
    l1_groups:
    - Japanese
    - Chinese
  description: 'Produced with the tip of the tongue raised close to the rear part
    of the alveolar ridge, but far enough from it to produce no friction. The tongue
    is curled upward. Voiced. In RP (non-rhotic), /r/ occurs only before vowel sounds;
    in rhotic varieties (American, Scottish, Irish), it occurs in all positions.

    '
  examples:
  - rare /reə/
  - raw /rɔː/
  - ray /reɪ/
  - row /rəʊ/
  - red /red/
  - right /raɪt/
  - very /veri/
  - area /eəriə/
  feature: /r/ — voiced post-alveolar frictionless continuant
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 /r/'
  spelling_patterns:
  - r (rare, red, very)
  - rr (sorry, hurry)
  - wr (write, wrong)
  - rh (rhythm, rhyme)
  teaching_techniques:
  - description: 'Begin with /z/ (blade at alveolar ridge) and move the tip of the
      tongue slightly further back. This increases the distance from the roof of the
      mouth, ensuring no friction. Sustain the initial sound while asking learners
      to move the tongue up, down, forward, or back.

      '
    source: Underhill 1994, Classroom activity 17, p 131
    technique: Start from /z/ and move tongue back
- articulation: 'Get ready to say the word but don''t. The starting sound is close
    to /u/, with lips rounded and tongue back. This is /u/ of very short duration,
    gliding rapidly to the following vowel. The exact starting position depends on
    the following vowel.

    '
  common_errors:
  - description: Round the lips and push them forward; do not bring teeth to lip
    error: Replacing /w/ with /v/ or /b/ (wet as vet)
    explanation: These languages have /v/ but not /w/; the lip-teeth contact of /v/
      is substituted.
    l1_groups:
    - German
    - Hindi
    - Urdu
  description: 'A semi-vowel: phonetically similar to a very short /u/ gliding rapidly
    to the following vowel, but functioning as a consonant by preceding the main vowel
    of a syllable. The starting position has rounded lips and the tongue back. Occurs
    initially but not finally.

    '
  examples:
  - wet /wet/
  - west /west/
  - woo /wuː/
  - war /wɔː/
  - were /wɜː/
  - yes /jes/
  - you /juː/
  - year /jɪə/
  feature: /w/ — voiced bilabial semi-vowel
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 /w/'
  spelling_patterns:
  - w (wet, west, war)
  - wh (what, when, which)
  - u (quick, queen)
  - o (one, once)
  teaching_techniques:
  - description: 'Repeat /wi:/ rapidly, then /ui:/ rapidly. They should sound very
      similar. This shows that /w/ is essentially a very short /u/.

      '
    source: Underhill 1994, Discovery activity 47, p 46
    technique: Rapid /wi:/ vs /ui:/ comparison
- articulation: 'Get ready to say the word but don''t. The starting sound is close
    to /i/, with lips neutral or slightly spread and tongue slightly closer to the
    alveolar ridge, creating almost a hint of friction. This is /i/ of very short
    duration, gliding rapidly to the following vowel.

    '
  common_errors:
  - description: Keep the glide smooth; do not add a plosive onset
    error: Replacing /j/ with /dʒ/ (yes as jes with affricate)
    explanation: The affricate /dʒ/ is substituted for the frictionless glide /j/.
    l1_groups:
    - Arabic
    - Various L1s
  description: 'A semi-vowel: phonetically similar to a very short /i/ gliding rapidly
    to the following vowel, but functioning as a consonant. The starting position
    has the tongue close to the hard palate. Occurs initially but not finally.

    '
  examples:
  - yes /jes/
  - you /juː/
  - year /jɪə/
  - yet /jet/
  - young /jʌŋ/
  - use /juːz/
  - beauty /bjuːti/
  - cure /kjʊə/
  feature: /j/ — voiced palatal semi-vowel
  source: 'Underhill 1994, Chapter 4: Consonants, Row 3 /j/'
  spelling_patterns:
  - y (yes, you, year)
  - u (use, cure, beauty)
  - ew (few, new)
  - eu (Europe, feud)
  teaching_techniques:
  - description: 'Repeat /jɔː/ rapidly, then /iɔː/ rapidly. They should sound very
      similar. This shows that /j/ is essentially a very short /i/.

      '
    source: Underhill 1994, Discovery activity 48, p 46
    technique: Rapid /jɔː/ vs /iɔː/ comparison
skill_area: segmentals
skill_name: English Consonant System — Place, Manner, and Voicing
sources:
  primary: Underhill, A. (1994). Sound Foundations. Heinemann.
