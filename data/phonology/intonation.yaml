activities:
- description: 'Present a dialogue and have learners identify the tone used by each
    speaker. Discuss why a particular tone was chosen (proclaiming new information,
    referring to shared knowledge, asking a question).

    '
  level: B1-C2
  name: Tone identification from context
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-93'
  type: discrimination, awareness
- description: 'Learners use hand movements to show the pitch contour while saying
    sentences. Falling tone: hand falls. Fall-rise: hand falls then rises. Rising
    tone: hand rises. This links physical movement to vocal pitch and helps learners
    internalize the patterns.

    '
  level: A2-C2
  name: Physical pitch gesture practice
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-78'
  type: production, awareness
- description: 'Present a sentence spoken with different tones. Learners match each
    version to a meaning or context. For example: ''It''s nice'' with falling tone
    = genuine compliment; with fall-rise = reservation; with rising tone = checking/uncertain.

    '
  level: B1-C2
  name: Tone and meaning matching
  source: 'Underhill 1994, Chapter 7: Intonation, pp 78-88'
  type: discrimination, awareness
- description: 'Learners practice short dialogues, focusing on appropriate tone choice.
    Example: A: ''Are you coming?'' (rise) B: ''I might.'' (fall-rise). A: ''Where
    are you going?'' (fall) B: ''To the shops.'' (fall). Focus on natural intonation
    in context.

    '
  level: B1-C2
  name: Dialogue intonation practice
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-93'
  type: production
- description: 'Say the same sentence in high, mid, and low key. Learners identify
    the key and discuss the meaning difference. Then learners produce the sentence
    in different keys to convey different attitudes.

    '
  level: B2-C2
  name: Key variation drill
  source: 'Underhill 1994, Chapter 7: Intonation, pp 88-93'
  type: production, awareness
assessment:
  methods:
  - Learners identify the tonic syllable in spoken sentences
  - Learners identify tone patterns (fall, rise, fall-rise) in speech
  - Learners produce sentences with appropriate intonation for context
  - Learners explain the meaning difference between different tone choices
  - Learners use key (high/mid/low) to convey different attitudes
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-93'
cefr_range: A1-C2
teaching:
  methodology: Discovery-based (Underhill)
  tips:
  - 'Underhill (1994) Sound Foundations Level 3: Five basic intonation patterns — fall (statements, wh-questions), rise (yes/no questions), fall-rise (uncertainty), rise-fall (emphasis), level (routine). Each communicates different meaning and attitude.'

citations:
- claim: Intonation patterns convey attitude, discourse function, and grammatical
