definition: 'Intonation is the pitch pattern of speech — the way the voice rises and
  falls. In English, intonation carries meaning: it can indicate whether information
  is new or shared, whether a speaker is certain or uncertain, whether a sentence
  is complete or incomplete. The basic unit of intonation is the tone unit, which
  consists of: pre-head (unstressed syllables before the first stressed syllable)
  + head (stressed syllable up to the tonic syllable) + tonic syllable (the syllable
  with the main pitch movement) + tail (any syllables after the tonic syllable). The
  two main tones are falling (proclaiming) and falling-rising (referring).

  '
description: 'Intonation is the melody of speech — the way the pitch of the voice
  rises and falls during utterance. In English, intonation is a crucial carrier of
  meaning. The same words can express different attitudes, intentions, and meanings
  depending on the intonation pattern used. Underhill''s framework centers on the
  tone unit: a unit of speech containing a tonic syllable (the syllable with the main
  pitch movement), preceded by a pre-head and head, and followed by a tail. The two
  fundamental tone patterns are falling (proclaiming tone — new information) and falling-rising
  (referring tone — shared or assumed information).

  '
key_principles:
- explanation: 'The tonic syllable is the most prominent syllable in a tone unit —
    it is where the main pitch movement occurs. In English, the tonic syllable is
    typically the last stressed syllable in the tone unit. The placement of the tonic
    syllable determines the focus of the utterance and can change the meaning. All
    syllables after the tonic syllable (the tail) continue in the direction of the
    tone.

    '
  principle: The tonic syllable carries the main pitch movement
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-93'
- explanation: 'The falling tone (a fall in pitch on the tonic syllable) is used to
    proclaim new information. It signals: ''This is new; you may not know this.''
    It is the most common tone in English, used in statements, wh-questions, commands,
    and exclamations. It gives a sense of completeness and finality. In its wider
    form, it can convey definiteness, decisiveness, and seriousness. In its narrower
    form, it can sound bored or uninterested.

    '
  principle: Falling tone = proclaiming (new information)
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 78-82'
- explanation: 'The falling-rising tone (a fall then rise in pitch on the tonic syllable)
    is used to refer to information that is shared or assumed between speaker and
    listener. It signals: ''We both know this; I am referring to something already
    in our shared awareness.'' It is used to be polite, tentative, to imply reservations,
    or to soften a statement. It gives a sense of incompleteness or uncertainty. In
    its wider form, it can convey warmth, sympathy, or encouragement. In its narrower
    form, it can sound doubtful or grudging.

    '
  principle: Falling-rising tone = referring (shared information)
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 82-86'
- explanation: 'The rising tone (a rise in pitch on the tonic syllable) is distinct
    from the falling-rising tone. It is used in yes/no questions, echo questions,
    and to express surprise, disbelief, or to check information. It gives a sense
    of openness or questioning. Underhill notes that the rising tone is common in
    greetings and informal exchanges.

    '
  principle: Rising tone = a third pattern distinct from fall-rise
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 86-88'
- explanation: 'Key refers to the relative pitch level of the head of the tone unit
    (the stressed syllables before the tonic syllable). High key starts above the
    normal pitch range and conveys surprise, excitement, or interest. Mid key starts
    in the normal range and is neutral. Low key starts below the normal range and
    conveys resignation, seriousness, or lack of interest. Key works together with
    tone choice to create the full meaning of an utterance.

    '
  principle: Key (high, mid, low) modifies the meaning of tones
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 88-93'
- explanation: 'Underhill''s discourse approach to intonation centers on the concept
    of common ground: the shared knowledge between speaker and listener. Tone choice
    signals whether the speaker is adding to or referring to this common ground. The
    falling tone (p tone, proclaiming) adds new information: "This is new; you may
    not know this." The falling-rising tone (r tone, referring) points to shared knowledge:
    "We both know this; I am referring to something already in our shared awareness."
    Underhill also identifies marked variants: the rising tone (r+ tone, marked referring)
    is a stronger appeal to common ground, while the rise-fall (p+ tone, marked proclaiming)
    is a more emphatic, dominant way of introducing new information. For example,
    saying "Alice" with an r tone (fall-rise) appeals to shared understanding, while
    "Alice" with a p+ tone (rise-fall) delivers an emphatic warning. The choice between
    these four options — r, r+, p, p+ — is driven by the speaker''s assessment of
    what is already in common ground and what needs to be proclaimed as new.

    '
  principle: Common ground — tone choice signals shared vs. new information
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 78-86'
- explanation: 'In Underhill''s framework, key is the pitch level of a tone unit relative
    to the previous tone unit''s first prominence, and it carries specific discourse
    meaning. High key is contrastive — it signals that the information contrasts with
    what might be expected or with what was just said. For example, "On Sunday it
    SNOWED" in high key implies surprise or contradiction of an assumption. Mid key
    is additive — it presents information as a neutral addition, with no special contrast:
    "On Sunday it snowed" as a straightforward report. Low key is equative — it signals
    that the information follows naturally, "goes without saying," or is already given:
    "On Sunday it snowed" in low key treats this as expected or obvious. Key operates
    independently of tone choice, so a speaker can combine any key with any tone (fall,
    fall-rise, rise, rise-fall) to create nuanced meaning. This three-way key system
    is one of the most powerful tools for helping learners move beyond flat, monotonous
    intonation.

    '
  principle: Key choices (high/mid/low) signal contrastive, additive, or equative
    meaning
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 88-93'
- explanation: 'Underhill strongly favors the discourse approach to intonation over
    the grammatical approach. The grammatical approach teaches rules like "statements
    fall, questions rise, wh-questions fall, commands fall." While these tendencies
    exist, Underhill warns they are NOT reliable rules — almost any sentence can carry
    a range of intonations, each imparting a different nuance or meaning within the
    context. For example, a wh-question like "Where are you going?" typically falls,
    but it could rise to express surprise or fall-rise to refer to shared knowledge.
    The discourse approach, by contrast, links intonation choices to the communicative
    function of the utterance: Is the speaker proclaiming new information or referring
    to shared knowledge? Is the key contrastive, additive, or equative? This approach
    is more powerful because it explains why a speaker chooses a particular intonation
    pattern in a given context, rather than prescribing a fixed pattern for a given
    sentence type. Teachers should help learners see intonation as a meaning-making
    resource, not a grammatical decoration.

    '
  principle: The discourse approach vs. the grammatical approach to intonation
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 78-88'
- explanation: 'The tonic syllable is the focal point of the tone unit — the syllable
    carrying the main pitch movement and prominence. While the tonic syllable typically
    falls on the last stressed syllable in a tone unit, speakers can move it earlier
    to shift the focus and change the meaning of the utterance. For example, "I didn''t
    say HE stole the money" (tonic on "he") implies someone else said it. "I didn''t
    say he STOLE the money" (tonic on "stole") implies he did something else with
    it. "I didn''t say he stole the MONEY" (tonic on "money") implies he stole something
    else. Each placement of the tonic syllable creates a different focus and a different
    presupposition. Underhill emphasizes that tonic placement is a speaker choice
    driven by communicative intent — the speaker decides what needs to be highlighted
    as new or contrastive. This variability is why the same sentence can convey very
    different meanings depending on which syllable receives the tonic stress. Learners
    need practice not only in identifying the tonic syllable in what they hear but
    also in deliberately placing it to express their intended focus.

    '
  principle: Variable tonic placement changes meaning and focus
  reliability: B
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-78'
phonological_features:
- articulation: 'The speaker produces the tone unit as a single phrase. The pre-head
    and head are at a relatively level pitch. The tonic syllable is where the pitch
    movement happens (fall, rise, or fall-rise). The tail follows the direction of
    the tone: if the tone falls, the tail stays low; if the tone rises, the tail continues
    to rise.

    '
  common_errors:
  - description: Place the tonic syllable on the last stressed word (usually)
    error: Not identifying the tonic syllable correctly
    explanation: Learners may place the tonic syllable on the wrong word.
    l1_groups:
    - All L1s
  - description: Produce clear pitch movement on the tonic syllable
    error: Flat intonation with no pitch movement
    explanation: Some languages do not use pitch for sentence-level meaning.
    l1_groups:
    - Japanese
    - Korean
    - Mandarin (though Mandarin has lexical tone)
  description: 'The tone unit is the basic unit of intonation. It consists of: (1)
    Pre-head — any unstressed syllables before the first stressed syllable. (2) Head
    — the stretch from the first stressed syllable up to and including the tonic syllable.
    (3) Tonic syllable — the most prominent syllable, carrying the main pitch movement.
    (4) Tail — any syllables after the tonic syllable, continuing in the direction
    of the tone.

    '
  examples:
  - '`The cat sat on the ''mat. (cat = head start, mat = tonic, no tail)'
  - '`She''s ''gone to the `doctor. (She''s = pre-head, gone = head, doc = tonic,
    tor = tail with fall)'
  - '`I ''told you `so. (I = pre-head, told = head, so = tonic, fall)'
  - '`Were you ''there on `Tuesday? (Were = pre-head, there = head, Tues = tonic,
    day = tail with fall-rise)'
  feature: 'Tone unit structure: pre-head + head + tonic syllable + tail'
  source: 'Underhill 1994, Chapter 7: Intonation, pp 74-78'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Write a sentence on the board and mark the tone unit boundaries
      with slashes. Identify the pre-head, head, tonic syllable, and tail. Draw the
      pitch contour above the sentence. Learners see the structure visually before
      hearing it.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 74-78'
    technique: Tone unit mapping on the board
  - description: 'Use hand movements to show the pitch contour: hand falls for falling
      tone, hand falls then rises for fall-rise, hand rises for rising tone. Learners
      mirror the gesture while saying the sentence, linking the physical movement
      to the vocal pitch.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 74-78'
    technique: Physical pitch gesture
- articulation: 'The voice falls on the tonic syllable. The degree of fall varies:
    a wide fall conveys strong definiteness and seriousness; a narrow fall can sound
    bored or routine. The tail stays low. The fall typically starts at or above the
    mid level and drops to the bottom of the speaker''s range.

    '
  common_errors:
  - description: Use a falling tone for statements and wh-questions
    error: Using rising tone for statements (sounding uncertain)
    explanation: Some languages use rising intonation where English uses falling.
    l1_groups:
    - Various L1s
  - description: Use a wider fall to sound engaged and interested
    error: Over-narrow fall (sounding bored)
    explanation: Learners may use very narrow pitch range.
    l1_groups:
    - All L1s
  description: 'The falling tone is the most common tone in English. It falls in pitch
    on the tonic syllable and continues low through the tail. It is used for statements,
    wh-questions, commands, exclamations, and to convey new information, completeness,
    and finality.

    '
  examples:
  - 'statement: `She''s ''gone. (new information, complete)'
  - 'wh-question: `Where are you ''going?'
  - 'command: `Sit ''down.'
  - 'exclamation: `That''s ''wonderful!'
  - 'routine statement: `It''s ''Friday. (narrow fall, bored)'
  - 'serious announcement: `The ''plane has `crashed. (wide fall)'
  feature: Falling tone (proclaiming)
  source: 'Underhill 1994, Chapter 7: Intonation, pp 78-82'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Contrast wh-questions (falling) with yes/no questions (rising):
      `Where are you ''going? (fall) vs. Are you ''going home? (rise). Drill both
      types to help learners feel the difference.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 78-82'
    technique: Statement and question drill
  - description: 'Say the same sentence with a wide fall and a narrow fall. `It''s
      Friday` (wide fall = excited; narrow fall = bored/routine). Learners practice
      both and discuss the meaning difference.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 78-82'
    technique: Wide vs. narrow fall demonstration
- articulation: 'The voice falls on the tonic syllable and then rises. The fall-rise
    is a single movement, not two separate parts. A wide fall-rise conveys warmth,
    sympathy, or encouragement; a narrow fall-rise can sound grudging or doubtful.
    The tail follows the direction: after the rise, the tail stays relatively high.

    '
  common_errors:
  - description: Use fall-rise for shared information and politeness
    error: Using falling tone where fall-rise is needed (sounding abrupt)
    explanation: Learners may not distinguish between proclaiming and referring tones.
    l1_groups:
    - All L1s
  - description: Fall-rise falls THEN rises; rise only rises
    error: Confusing fall-rise with rise
    explanation: The two patterns are distinct and carry different meanings.
    l1_groups:
    - All L1s
  examples:
  - 'shared knowledge: A: `Are you ''coming? B: I `might. (fall-rise on ''might''
    = shared awareness)'
  - 'reservation: It''s `nice... (fall-rise on ''nice'' = but I have reservations)'
  - 'polite contradiction: A: `He''s ''clever. B: He''s `clever at some things. (fall-rise
    = partial agreement)'
  - 'tentative: I `think so. (fall-rise = not certain)'
  - 'encouraging: `Well `done! (wide fall-rise = warm, encouraging)'
  - 'grudging: `If you `say so. (narrow fall-rise = reluctant agreement)'
  explanation: 'The falling-rising tone falls then rises on the tonic syllable. It
    is used to refer to shared or assumed information, to be polite, tentative, or
    to imply reservations. It gives a sense of incompleteness or uncertainty. Common
    afterthoughts, softening statements, and polite contradictions use this tone.

    '
  feature: Falling-rising tone (referring)
  source: 'Underhill 1994, Chapter 7: Intonation, pp 82-86'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Present a dialogue and have learners decide which tone to use based
      on the context. A: ''Are you coming tonight?'' B: ''I might.'' The fall-rise
      on ''might'' signals shared awareness and tentativeness. Contrast with a falling
      tone: ''I might.'' (more definite, proclaiming).

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 82-86'
    technique: Contextualized tone choice
  - description: 'Have learners respond to compliments or statements with a fall-rise
      to imply reservations: ''It''s nice...'' (but...), ''He''s clever...'' (but...).
      This practices the pragmatic use of the fall-rise tone.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 82-86'
    technique: Reservation drill
- articulation: 'The voice rises on the tonic syllable. The tail continues to rise
    or stays at a high level. The rise typically starts at the mid level and goes
    to the top of the speaker''s range.

    '
  common_errors:
  - description: Use rising tone for yes/no questions
    error: Using falling tone for yes/no questions
    explanation: Some languages use falling intonation for all questions.
    l1_groups:
    - Various L1s
  - description: Rise only rises; fall-rise falls then rises
    error: Confusing rise with fall-rise
    explanation: The two patterns are distinct.
    l1_groups:
    - All L1s
  description: 'The rising tone rises in pitch on the tonic syllable. It is used for
    yes/no questions, echo questions, expressions of surprise or disbelief, and in
    greetings. It gives a sense of openness or questioning.

    '
  examples:
  - 'yes/no question: Are you ''going home?'
  - 'echo question: She ''did what? (surprise, disbelief)'
  - 'greeting: `Hello! (rise = friendly, open)'
  - 'checking: `Really? (rise = checking information)'
  - 'encouraging continuation: `And then? (rise = go on, tell me more)'
  feature: Rising tone
  source: 'Underhill 1994, Chapter 7: Intonation, pp 86-88'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Drill pairs: `Are you ''going? (rise = yes/no question) vs. `Where
      are you ''going? (fall = wh-question). Learners practice the tone difference
      in parallel.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 86-88'
    technique: Yes/no vs. wh- question contrast
- articulation: 'For high key, the head starts at a higher pitch than normal. For
    mid key, the head starts at the speaker''s normal pitch level. For low key, the
    head starts lower than normal. The key is set at the beginning of the tone unit
    and affects the overall pitch level of the head.

    '
  common_errors:
  - description: Vary key to convey different attitudes
    error: Using only mid key (sounding flat or monotonous)
    explanation: Learners may not use pitch level to convey attitude.
    l1_groups:
    - All L1s
  examples:
  - 'high key: `SURprise! (excitement, surprise)'
  - 'mid key: `She''s gone to the doctor. (neutral statement)'
  - 'low key: `It''s Friday. (resignation, lack of interest)'
  - 'high key question: `REALLY? (surprise, disbelief)'
  - 'low key statement: `I see. (resignation, acceptance)'
  explanation: 'Key refers to the pitch level at which the head of the tone unit begins.
    High key starts above the normal range and conveys surprise, excitement, or strong
    interest. Mid key starts in the normal range and is neutral. Low key starts below
    the normal range and conveys resignation, seriousness, or lack of interest. Key
    modifies the meaning of the tone choice.

    '
  feature: Key (high, mid, low) — pitch level of the head
  source: 'Underhill 1994, Chapter 7: Intonation, pp 88-93'
  spelling_patterns: []
  teaching_techniques:
  - description: 'Say the same sentence in high, mid, and low key. Discuss the meaning
      difference. `It''s Friday` in high key = excited; mid key = neutral; low key
      = bored or resigned.

      '
    source: 'Underhill 1994, Chapter 7: Intonation, pp 88-93'
    technique: Key contrast drill
