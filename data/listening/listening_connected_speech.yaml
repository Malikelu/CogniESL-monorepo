activities:
- description: 'Play a 1-minute clip of natural speech. Learners receive a checklist
    of connected speech features (assimilation, elision, weak form, linking, contraction).
    They tally each instance they hear. Compare results as a class.

    '
  level: A2-B1
  name: Connected speech feature hunt
  source: Underhill, Sound Foundations, pp. 60-68
- description: 'Give learners a bingo card with weak forms (/ən/, /jə/, /mi/, /ʃi/,
    /wəd/, /həv/, /məs/). Play a short dialogue. Learners mark each weak form they
    hear. First to complete a row wins.

    '
  level: A2-B1
  name: Weak form bingo
  source: Underhill, Sound Foundations, pp. 63-64, 2851-2890
- description: 'Play 10 juncture pairs (ice cream/I scream, grey tapes/great apes,
    etc.). Learners write which phrase they heard. Then discuss the phonological cues
    that distinguish each pair.

    '
  level: B1-B2
  name: Juncture minimal pair discrimination
  source: Underhill, Sound Foundations, pp. 67-68, 3006-3031
- description: 'Give learners phrases written in "dictionary" form (e.g., "ten pin
    bowling," "good boy," "this shop"). They predict how the boundary consonants will
    assimilate, then listen to a recording to check.

    '
  level: B1-B2
  name: Assimilation prediction exercise
  source: Underhill, Sound Foundations, pp. 60, 2696-2752
- description: 'Play sentences containing elided /t/ and /d/. Learners write what
    they hear. Then show the "full form" version and ask: "Which sounds disappeared?
    Why?"

    '
  level: B1-B2
  name: Elision dictation
  source: Underhill, Sound Foundations, pp. 61, 2753-2790
- description: 'Give learners the sentence "You are obviously unhappy about the idea
    of it." They listen and mark all linking/intrusive sounds (/w/, /r/, /j/). Then
    they count the total number of words vs. the number of linking sounds.

    '
  level: B2-C1
  name: Liaison linking analysis
  source: Underhill, Sound Foundations, pp. 65-67, 2995-3003
cefr_range: A2-C1
citations:
- claim: Connected speech simplifications (assimilation, elision, linking, weak forms,
    catenation, intrusion) are systematic phonological processes, not random speech
    errors
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Part 1 Level 3: Connected
    Speech, pp. 58-68; Part 2 Level 3: Connected Speech, pp. 171-204'
  tier: 1
- claim: 'Teaching connected speech requires a three-level progression: awareness
    (hearing the features), discrimination (distinguishing variants), and production
    (using them naturally)'
  flagged: false
  reliability: B
  source: Underhill (1994) Sound Foundations. Heinemann. Discovery Toolkit + Classroom
    Toolkit methodology
  tier: 1
- claim: Swan & Smith (2001) document how L1 phonological systems affect English listening
    comprehension. Their cross-linguistic analysis shows that listeners from different
    L1 backgrounds misperceive English sounds in predictable patterns based on their
    L1 phonological inventory and phonotactic constraints.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_difficulties:
- difficulty: Learners cannot identify word boundaries in rapid speech due to liaison
  explanation: 'Underhill''s four types of liaison (linking /r/, intrusive /r/, intrusive
    /w/, intrusive /j/) fuse words together seamlessly. Learners from languages with
    clear syllable boundaries (Japanese mora, Chinese syllables, Korean syllable blocks)
    expect to hear where one word ends and the next begins. Liaison obscures these
    boundaries.

    '
  l1_groups:
  - Japanese
  - Mandarin Chinese
  - Korean
  - Thai
  source: Underhill, Sound Foundations, pp. 65-67, 2908-3003
  teaching_strategy: 'Start with linking /r/ (the most transparent, since it relates
    to spelling). Play "her English" vs. "her Spanish" and ask learners to count the
    words. Then progress to intrusive sounds. Use Underhill''s full sentence: "You
    are obviously unhappy about the idea of it" → /ju w ɑːr ɒbviəsli j ʌnʰæpi j əbaʊt
    ði j aɪdiə r əv ɪt/ (p. 67). Have learners identify the 11 words in this seamless
    stream.

    '
- difficulty: Learners expect to hear the same pronunciation they learned in isolation
  explanation: 'Underhill notes that learners often remark on the way English speakers
    "swallow" sounds. What they are observing is the combined effect of assimilation,
    elision, and vowel reduction (p. 62). Learners who have been taught dictionary
    pronunciation may feel that native speakers are being "lazy" or "careless."

    '
  l1_groups:
  - Spanish
  - Italian
  - Portuguese
  - German
  source: Underhill, Sound Foundations, pp. 58-59, 2658-2682, 2791-2794
  teaching_strategy: 'Explicitly teach the distinction between careful colloquial
    speech and rapid colloquial speech (Underhill, pp. 58-59). Play the same sentence
    in both styles. Ask learners: "Which is ''correct''?" Reveal that both are correct
    — they serve different communicative purposes. Then explain that rapid colloquial
    speech is the default for native-native conversation and the target for listening
    skill.

    '
- difficulty: Learners cannot distinguish minimal pairs differentiated only by juncture
  explanation: 'Underhill''s juncture pairs (ice cream/I scream, grey tapes/great
    apes, mice pies/my spies) are distinguished by subtle allophonic variations rather
    than different phonemes. Learners who are trained to listen for phonemic contrasts
    may miss these sub-phonemic cues entirely.

    '
  l1_groups:
  - French
  - Arabic
  - Russian
  - Turkish
  source: Underhill, Sound Foundations, pp. 67-68, 3006-3031
  teaching_strategy: 'Use Underhill''s discovery activity 71 (p. 68): play the pairs
    and ask learners to distinguish them. Then reveal the cues: vowel length, consonant
    timing, and stress differences. Practice with a set of 5 juncture pairs, gradually
    increasing speed. This is a perceptual training exercise, not a production exercise.

    '
definition: 'Connected speech is not a degraded form of careful pronunciation but
  a systematic reorganization of sounds driven by the demands of real-time production.
  Underhill identifies seven major categories of simplification: assimilation (sounds
  change to become more like neighbors), elision (sounds are omitted), vowel reduction
  (unstressed vowels centralize toward schwa), strong and weak forms (function words
  have dual pronunciations), liaison (words are linked at boundaries), contractions
  (two words merge into one syllable), and juncture (boundary cues distinguish otherwise
  identical sequences). These features are not optional — they are essential to natural-sounding
  English and a major source of listening difficulty.

  '
description: 'Learners develop perceptual awareness of the systematic phonological
  changes that occur when words flow together in connected English speech: assimilation,
  elision, vowel reduction, weak forms, linking, intrusion, contractions, and juncture.
  Based entirely on Underhill''s "Sound Foundations" Level 3 connected speech analysis.

  '
key_principles:
- explanation: 'Underhill emphasizes that the building blocks of connected speech
    form "a system that is on the whole regular and predictable" (p. 68). Assimilation
    follows identifiable patterns (alveolars assimilate to bilabials, /s/ assimilates
    to /ʃ/). Elision targets /t/ and /d/ between consonants. Vowel reduction moves
    most monophthongs toward /ə/. These are not exceptions — they are the operating
    principles of fluent English.

    '
  principle: Connected speech simplifications are systematic, not random
  reliability: B
  source: Underhill, Sound Foundations, pp. 60-68, 2685-3041
- explanation: 'Underhill defines "careful colloquial speech" (closer to dictionary
    pronunciation, moderate simplification, used in formal settings and BBC World
    Service) and "rapid colloquial speech" (extensive simplification, words far from
    dictionary form, used in informal native-native conversation). Both contain all
    types of simplification; the difference is one of degree. Careful colloquial speech
    is a useful target for learner production; rapid colloquial speech is a necessary
    target for learner reception.

    '
  principle: Careful colloquial speech and rapid colloquial speech are two ends of
    a continuum
  reliability: B
  source: Underhill, Sound Foundations, pp. 58-59, 2658-2682
- explanation: 'About fifty high-frequency monosyllabic function words have both strong
    forms (used when stressed or spoken in isolation) and weak forms (used in normal
    connected speech). Underhill states clearly: "The weak forms occur in speech only
    and are not (usually) shown in writing" (p. 63). Learners who only know the strong
    forms will not recognize the most common spoken realizations of these words.

    '
  principle: Weak forms are the default, strong forms are the exception
  reliability: B
  source: Underhill, Sound Foundations, pp. 63-64, 2851-2890
- explanation: 'Underhill identifies four types of liaison: linking /r/, intrusive
    /r/, intrusive /w/, and intrusive /j/. These linking sounds fuse words together
    at boundaries, making it difficult for learners to identify word boundaries. The
    sentence "You are obviously unhappy about the idea of it" can be rendered as one
    seamless stream: /ju w ɑːr ɒbviəsli j ʌnʰæpi j əbaʊt ði j aɪdiə r əv ɪt/ (Underhill,
    p. 67).

    '
  principle: Liaison creates seamless word boundaries that obscure where one word
    ends and the next begins
  reliability: B
  source: Underhill, Sound Foundations, pp. 65-67, 2908-3003
- explanation: 'Even when two words are fully linked, the boundary between them is
    marked by allophonic variations: vowel lengthening/shortening on either side of
    the boundary, delayed or advanced articulation of boundary consonants, and differences
    in syllable stress. Underhill''s examples include "mice pies" vs. "my spies,"
    "ice cream" vs. "I scream," and "grey tapes" vs. "great apes" (p. 68).

    '
  principle: Juncture provides subtle cues that distinguish otherwise identical sound
    sequences
  reliability: B
  source: Underhill, Sound Foundations, pp. 67-68, 3006-3031
- principle: 'Biber et al. (1999) GSWE Ch. 14: Connected speech phenomena are pervasive
    in conversation — function words reduce to weak forms, content words carry stress.
    English stress-timed rhythm means unstressed syllables compress. L1s with syllable-timed
    rhythm (Romance, Slavic) struggle with compression.'
phonological_features:
- description: 'A phoneme changes its quality due to the influence of a neighboring
    sound, becoming more like or identical to it. Most common at word boundaries,
    affecting mainly consonant sounds. Alveolar consonants /t, d, n/ are most susceptible.

    '
  examples:
  - '"ten pin →" /tɛm pɪm/ (regressive assimilation: /n/ → /m/ before bilabial /p/)'
  - '"in bed →" /ɪm bɛd/ (/n/ → /m/ before bilabial /b/)'
  - '"good girl →" /ɡʊɡ ɡɜːl/ (regressive: /d/ → /g/ before velar /g/)'
  - '"this shop →" /ðɪʃ ʃɒp/ (progressive: /s/ → /ʃ/ before /ʃ/)'
  - '"have to →" /hæf tuː/ (regressive: /v/ → /f/ before unvoiced /t/)'
  - '"don''t you →" /dəʊntʃuː/ (coalescence: /t/ + /j/ → /tʃ/)'
  - '"how d''you do →" /haʊdʒuː duː/ (coalescence: /d/ + /j/ → /dʒ/)'
  feature: Assimilation
  l1_challenges:
  - explanation: Japanese has limited consonant clusters and no word-final consonants
      (except /n/). Assimilation at word boundaries is unfamiliar.
    language: Japanese
  - explanation: Spanish has different assimilation patterns (e.g., /n/ assimilates
      to following consonant place, but /s/ does not palatalize before /ʃ/). Spanish
      speakers may apply L1 patterns. Additionally, Spanish is syllable-timed with
      no vowel reduction, so connected speech features like weak forms, elision, and
      linking are particularly challenging (Silva Valencia 2022, Gist Education and
      Learning Research Journal, No. 25, pp. 145-146).
    language: Spanish
  - explanation: Arabic has its own assimilation rules for sun and moon letters, but
      these do not map onto English patterns. English alveolar assimilation is novel.
    language: Arabic
  source: Underhill, Sound Foundations, pp. 60, 2696-2752
- description: 'A sound present in the word spoken in isolation is omitted in connected
    speech. Mainly affects /t/ and /d/ when they occur between two other consonants.
    The speech organs "cut corners" at word boundaries.

    '
  examples:
  - '"next please →" /nɛks pliːz/ (/t/ between /k/ and /p/)'
  - '"I don''t know →" /aɪ dəʊn nəʊ/ (/t/ between /n/ and /n/)'
  - '"post the letter →" /pəʊs ðə lɛtə/ (/t/ between /s/ and /ð/)'
  - '"old man →" /əʊl mæn/ (/d/ between /l/ and /m/)'
  - '"sandwich →" /sænwɪtʃ/ (/d/ between /n/ and /w/)'
  - '"stand there →" /stæn ðeə/ (/d/ between /n/ and /ð/)'
  feature: Elision
  l1_challenges:
  - explanation: German has final devoicing but not the same elision patterns. German
      speakers may produce the elided consonants, sounding over-precise.
    language: German
  - explanation: French has liaison (adding sounds between words), the opposite of
      elision. French speakers may expect linking rather than omission.
    language: French
  - explanation: Mandarin syllables are mostly CV structure with no consonant clusters.
      Elision of consonants between other consonants is unfamiliar.
    language: Mandarin Chinese
  source: Underhill, Sound Foundations, pp. 61, 2753-2790
- description: 'Unaccented vowels become shorter and less distinct, moving toward
    /ə/ (schwa). Most monophthongs centralize; /iː/ reduces toward /ɪ/ and /uː/ reduces
    toward /ʊ/. Diphthongs lose their glide quality. This is essential for English
    stress timing.

    '
  examples:
  - 'you /juː/ → /jə/: "Tell you" → /tɛl jə/'
  - 'to /tuː/ → /tə/: "going to" → /ɡənə/'
  - 'and /ænd/ → /ən/ or /n/: "bread and butter" → /brɛd n bʌtə/'
  - 'a /eɪ/ → /ə/: "a book" → /ə bʊk/'
  - 'of /ɒv/ → /əv/: "lot of" → /lɒt əv/'
  - 'was /wɒz/ → /wəz/: "He was going" → /hi wəz ɡəʊɪŋ/'
  feature: Vowel reduction
  l1_challenges:
  - explanation: Spanish has five pure vowels with no reduction. Every vowel is fully
      pronounced regardless of stress. Spanish speakers may not reduce unstressed
      vowels.
    language: Spanish
  - explanation: Japanese vowels are not reduced in the same way, though devoicing
      occurs. The concept of schwa is unfamiliar.
    language: Japanese
  - explanation: Arabic short vowels may be dropped in some dialects, but the systematic
      centralization to /ə/ is not a feature of Arabic phonology.
    language: Arabic
  source: Underhill, Sound Foundations, pp. 62-63, 2795-2848
- description: 'About fifty high-frequency monosyllabic function words have two pronunciations:
    a strong form (stressed/isolated) and a weak form (unstressed/connected). The
    weak form is the default in connected speech. The strong form is used only for
    emphasis or contrast.

    '
  examples:
  - 'and — strong /ænd/, weak /ən/: "You and me" → /juː ən miː/'
  - 'of — strong /ɒv/, weak /əv/: "a lot of people" → /ə lɒt əv ˈpiːpl/'
  - 'you — strong /juː/, weak /jə/: "I told you" → /aɪ təʊld jə/'
  - 'me — strong /miː/, weak /mi/: "Tell me" → /tɛl mi/'
  - 'she — strong /ʃiː/, weak /ʃi/: "She knows" → /ʃi nəʊz/'
  - 'would — strong /wʊd/, weak /wəd/ or /d/: "I would" → /aɪd/'
  - 'have — strong /hæv/, weak /həv/ or /əv/: "could have" → /kʊdəv/'
  - 'must — strong /mʌst/, weak /məst/ or /məs/: "You must" → /ju məs/'
  feature: Weak forms
  l1_challenges:
  - explanation: Korean does not have a comparable weak/strong form system for function
      words. Korean speakers may produce full vowels in all positions.
    language: Korean
  - explanation: Turkish has vowel harmony but not vowel reduction to schwa. Turkish
      speakers may not reduce unstressed function words.
    language: Turkish
  - explanation: Italian function words do have some reduction (e.g., elision with
      apostrophe in writing), but the English weak form system is far more extensive.
    language: Italian
  source: Underhill, Sound Foundations, pp. 63-64, 2851-2890
- description: 'Four types of liaison fuse words together at boundaries: (1) linking
    /r/ — final spelling ''r'' is pronounced before a vowel; (2) intrusive /r/ — /r/
    inserted after /ə/ or /ɔː/ before a vowel; (3) intrusive /w/ — inserted after
    /uː/ or /ʊ/ before a vowel; (4) intrusive /j/ — inserted after /iː/ or /ɪ/ before
    a vowel.

    '
  examples:
  - '"Linking /r/: "her English" /hɜːr ɪŋɡlɪʃ/ vs. "her Spanish" /hɜː spænɪʃ/"'
  - '"Intrusive /r/: "America and Canada" → /əmɛrɪkər ən kænədə/; "law and order"
    → /lɔːr ənd ɔːdə/"'
  - '"Intrusive /w/: "you are" → /juːwɑː/; "go off" → /ɡəʊwɒf/; "Sue always wants
    to eat" → /suːwɔːlweɪz wɒnts tuːwiːt/"'
  - '"Intrusive /j/: "he is" → /hiːjɪz/; "they are" → /ðeɪjɑː/; "she always takes
    my arm" → /ʃiːjɔːlweɪz teɪks maɪjɑːm/"'
  feature: Liaison (linking and intrusion)
  l1_challenges:
  - explanation: Japanese does not have linking or intrusive consonants between words.
      Each mora is relatively separate. The concept of inserting sounds between words
      is unfamiliar.
    language: Japanese
  - explanation: Mandarin syllables are tightly bounded. Inserting /w/, /j/, or /r/
      between syllables is not a feature of Mandarin phonology.
    language: Mandarin Chinese
  - explanation: German has glottal stops at vowel-initial word boundaries, the opposite
      of linking. German speakers may insert glottals where English uses linking.
    language: German
  source: Underhill, Sound Foundations, pp. 65-67, 2908-3003
- description: 'Two single-syllable words combine and are pronounced as one, often
    occupying a single syllable. Involves both phonological reduction and orthographic
    elision (marked by apostrophe). Personal pronoun + auxiliary and verb + not are
    the most common patterns.

    '
  examples:
  - 'Pronoun + be: "I''m" /aɪm/, "they''re" /ðeə/, "it''s" /ɪts/, "she''s" /ʃiːz/,
    "he''s" /hiːz/, "we''re" /wɪə/, "you''re" /jʊə/"'
  - 'Pronoun + will: "I''ll" /aɪl/, "they''ll" /ðeɪl/, "he''ll" /hiːl/, "she''ll"
    /ʃiːl/, "we''ll" /wiːl/, "you''ll" /juːl/"'
  - 'Pronoun + have: "I''ve" /aɪv/, "they''ve" /ðeɪv/, "we''ve" /wiːv/, "you''ve"
    /juːv/"'
  - 'Pronoun + had/would: "I''d" /aɪd/, "he''d" /hiːd/, "she''d" /ʃiːd/, "they''d"
    /ðeɪd/, "we''d" /wiːd/, "you''d" /juːd/"'
  - 'Verb + not: "can''t" /kɑːnt/, "don''t" /dəʊnt/, "wasn''t" /wɒznt/, "couldn''t"
    /kʊdnt/, "hasn''t" /hæznt/, "isn''t" /ɪznt/"'
  - 'Triple contractions: "wouldn''t''ve" /wʊdəntəv/, "can''t''ve" /kɑːntəv/"'
  feature: Contractions
  l1_challenges:
  - explanation: Arabic does not have contractions in the same way. Arabic pronouns
      and auxiliaries remain separate words. The concept of merging two words into
      one syllable is unfamiliar.
    language: Arabic
  - explanation: Korean verb endings are agglutinative but do not contract in the
      English sense. Korean speakers may not recognize contracted forms.
    language: Korean
  - explanation: Polish has some contractions (e.g., "nie" + verb), but the English
      system of pronoun+auxiliary contraction is different and more extensive.
    language: Polish
  source: Underhill, Sound Foundations, pp. 64-65, 2893-2907
- description: 'Phonological features at word boundaries that distinguish otherwise
    identical sound sequences. Includes vowel lengthening/shortening, delayed/advanced
    consonant articulation, and stress differences on either side of the boundary.

    '
  examples:
  - mice pies vs. "my spies" — vowel length in /aɪ/ differs; stress pattern differs
  - ice cream vs. "I scream" — /aɪ/ longer in "I scream"; stress on "scream" vs. equal
    stress
  - grey tapes vs. "great apes" — /eɪ/ longer in "great"; /t/ articulation differs
  - car pit vs. "carpet" — vowel length and stress pattern differ at the boundary
  - it's an aim vs. "it's a name" — article stress and vowel length differ
  - send the maid vs. "send them aid" — consonant timing at boundary differs
  feature: Juncture
  l1_challenges:
  - explanation: Japanese does not use juncture cues in the same way. Mora timing
      is more regular, and word boundaries are often marked by pitch rather than segmental
      cues.
    language: Japanese
  - explanation: French has enchaînement (linking) but not the same juncture contrasts.
      French speakers may not attend to vowel length differences at word boundaries.
    language: French
  - explanation: Spanish syllable boundaries are clearer and more regular. The subtle
      allophonic variations that mark English juncture are not a feature of Spanish.
    language: Spanish
  source: Underhill, Sound Foundations, pp. 67-68, 3006-3031
skill_area: connected_speech
skill_name: Connected Speech Features in Listening
sources:
  primary: 'Underhill, Adrian. Sound Foundations (1994), Part 1 Level 3: Connected
    Speech, pp. 58-68 (Discovery Toolkit); Part 2 Level 3: Connected Speech, pp. 171-204
    (Classroom Toolkit)'
  secondary: ''
sub_skills:
- description: 'Learners recognize when consonant sounds change their quality under
    the influence of a neighboring sound at word boundaries.

    '
  examples:
  - '"ten pin bowling" /ten pɪn/ → /tɛm pɪm/ (alveolar /n/ assimilates to bilabial
    /m/ before /p/)'
  - '"in bed" /ɪn bɛd/ → /ɪm bɛd/ (/n/ → /m/ before bilabial /b/)'
  - '"good boy" /ɡʊd bɔɪ/ → /ɡʊb bɔɪ/ (/d/ → /b/ before bilabial /b/)'
  - '"this shop" /ðɪs ʃɒp/ → /ðɪʃ ʃɒp/ (/s/ → /ʃ/ before /ʃ/)'
  - '"have to go" /hæv tuː ɡəʊ/ → /hæf tuː ɡəʊ/ (/v/ → /f/ before unvoiced /t/)'
  - '"don''t you" /dəʊnt juː/ → /dəʊntʃuː/ (coalescence of /t/ + /j/ → /tʃ/)'
  name: Perceiving assimilation at word boundaries
  source: Underhill, Sound Foundations, pp. 60, 2696-2752
- description: 'Learners recognize when /t/ or /d/ is omitted in connected speech,
    particularly when surrounded by other consonants.

    '
  examples:
  - '"next please" /nɛks pliːz/ (/t/ elided between /k/ and /p/)'
  - '"I don''t know" /aɪ dəʊn nəʊ/ (/t/ elided between /n/ and /n/)'
  - '"old man" /əʊl mæn/ (/d/ elided between /l/ and /m/)'
  - '"sandwich" /sænwɪtʃ/ (/d/ elided between /n/ and /w/)'
  - '"stand there" /stann ðeə/ (/d/ elided between /n/ and /ð/)'
  name: Perceiving elision of /t/ and /d/ between consonants
  source: Underhill, Sound Foundations, pp. 61, 2753-2790
- description: 'Learners recognize that unstressed vowels become shorter and less
    distinct, moving toward /ə/ (schwa). Most monophthongs reduce toward the center;
    /iː/ reduces toward /ɪ/ and /uː/ reduces toward /ʊ/.

    '
  examples:
  - '"you and me" /juː ænd miː/ → /jə ən miː/ (full vowels reduced in unstressed positions)'
  - I wish you would tell me — unstressed "you" and "would" reduce dramatically
  - a /eɪ/ → /ə/ in "a book" /ə bʊk/
  - to /tuː/ → /tə/ in "going to" → /ɡənə/
  - and /ænd/ → /ən/ or /n/ in "bread and butter" → /brɛd n bʌtə/
  name: Perceiving vowel reduction and centralization
  source: Underhill, Sound Foundations, pp. 62-63, 2795-2848
- description: 'Learners distinguish between the strong (stressed/isolated) and weak
    (unstressed/connected) forms of about fifty high-frequency function words.

    '
  examples:
  - 'and — strong /ænd/ vs. weak /ən/: "You and me" → /juː ən miː/'
  - 'of — strong /ɒv/ vs. weak /əv/: "a lot of people" → /ə lɒt əv ˈpiːpl/'
  - 'you — strong /juː/ vs. weak /jə/: "I told you so" → /aɪ təʊld jə səʊ/'
  - 'me — strong /miː/ vs. weak /mi/: "Tell me" → /tɛl mi/'
  - 'she — strong /ʃiː/ vs. weak /ʃi/: "She knows" → /ʃi nəʊz/'
  - 'would — strong /wʊd/ vs. weak /wəd/ or /d/: "I would go" → /aɪd ɡəʊ/'
  - 'have — strong /hæv/ vs. weak /həv/ or /əv/: "could have" → /kʊdəv/'
  - 'must — strong /mʌst/ vs. weak /məst/ or /məs/: "You must try" → /ju məs traɪ/'
  name: Recognizing strong and weak forms of function words
  source: Underhill, Sound Foundations, pp. 63-64, 2851-2890
- description: 'Learners recognize the four types of liaison that fuse words together
    at boundaries.

    '
  examples:
  - '"Linking /r/: "her English" → /hɜːr ɪŋɡlɪʃ/ (r pronounced before vowel); "her
    Spanish" → /hɜː spænɪʃ/ (r not pronounced before consonant)"'
  - '"Intrusive /r/: "law and order" → /lɔːr ənd ɔːdə/ (r inserted between /ɔː/ and
    vowel)"'
  - '"Intrusive /w/: "go off" → /ɡəʊwɒf/ (w inserted after /uː/ or /ʊ/ before vowel);
    "you are" → /juːwɑː/"'
  - '"Intrusive /j/: "he is" → /hiːjɪz/ (j inserted after /iː/ or /ɪ/ before vowel);
    "they are" → /ðeɪjɑː/"'
  name: Perceiving liaison — linking and intrusive sounds
  source: Underhill, Sound Foundations, pp. 65-67, 2908-3003
- description: 'Learners recognize that contractions often merge two words into a
    single syllable and that the written form (with apostrophe) does not reveal the
    actual pronunciation.

    '
  examples:
  - I'm /aɪm/, "I've" /aɪv/, "I'll" /aɪl/, "I'd" /aɪd/
  - they're /ðeə/, "they've" /ðeɪv/, "they'll" /ðeɪl/, "they'd" /ðeɪd/
  - can't /kɑːnt/, "couldn't" /kʊdnt/, "don't" /dəʊnt/, "wasn't" /wɒznt/
  - '"wouldn''t''ve" /wʊdəntəv/ — triple contraction in rapid speech'
  name: Perceiving contractions as single syllables
  source: Underhill, Sound Foundations, pp. 64-65, 2893-2907
- description: 'Learners use subtle phonological cues (vowel length, consonant timing,
    stress differences) to distinguish between phrases that sound nearly identical.

    '
  examples:
  - mice pies vs. "my spies" — vowel length and stress pattern differ at the boundary
  - ice cream vs. "I scream" — the /aɪ/ diphthong is longer in "I scream" and stress
    falls differently
  - grey tapes vs. "great apes" — the /eɪ/ diphthong is longer in "great" and the
    /t/ articulation differs
  - it's an aim vs. "it's a name" — vowel length and stress on the article differ
  - send the maid vs. "send them aid" — consonant timing at the boundary differs
  name: Using juncture cues to distinguish word boundaries
  source: Underhill, Sound Foundations, pp. 67-68, 3006-3031
- description: 'Learners develop the ability to recognize the weak (reduced) forms
    of approximately fifty high-frequency monosyllabic function words that dominate
    connected English speech. Underhill emphasizes that weak forms are "the default"
    in connected speech and that "the weak forms occur in speech only and are not
    (usually) shown in writing" (p. 63). Learners who only know the strong (dictionary/isolated)
    forms will fail to recognize the most common spoken realizations of these words.
    This sub-skill focuses on perceptual training: hearing /ən/ and recognizing it
    as "and," hearing /jə/ and recognizing "you," hearing /kəd/ and recognizing "could."
    Underhill''s insight is that "working on the production of weak forms gives learners
    insight into the speech of native speakers, and helps to improve their listening
    skill and confidence" (p. 64).

    '
  examples:
  - 'and — strong /ænd/ vs. weak /ən/ or /n/: "bread and butter" → /brɛd n bʌtə/ —
    learners must recognize /n/ as "and"'
  - 'you — strong /juː/ vs. weak /jə/: "I told you so" → /aɪ təʊld jə səʊ/ — learners
    must recognize /jə/ as "you"'
  - 'have — strong /hæv/ vs. weak /həv/, /əv/, or /v/: "could have gone" → /kəd əv
    ɡɒn/ — learners must recognize /əv/ as "have"'
  - 'the — strong /ðiː/ vs. weak /ðə/ or /ði/: "in the office" → /ɪn ði ɒfɪs/ — learners
    must recognize /ði/ before a vowel'
  - 'not — strong /nɒt/ vs. weak /nt/ or /n/: "I don''t know" → /aɪ dəʊn nəʊ/ — learners
    must recognize /n/ as "not"'
  - 'can — strong /kæn/ vs. weak /kən/: "I can see it" → /aɪ kən siː ɪt/ — learners
    must recognize /kən/ as "can"'
  - 'was — strong /wɒz/ vs. weak /wəz/: "He was going" → /hi wəz ɡəʊɪŋ/ — learners
    must recognize /wəz/ as "was"'
  - 'are — strong /ɑː/ vs. weak /ə/: "They are here" → /ðeə hɪə/ — learners must recognize
    /ə/ as "are"'
  name: Perceiving weak forms of the 50+ high-frequency function words
  source: Underhill, Sound Foundations, pp. 63-64, 2851-2890
- description: 'Learners develop awareness of the continuum between careful colloquial
    speech (closer to dictionary pronunciation, moderate simplification, used in formal
    settings and BBC World Service) and rapid colloquial speech (extensive simplification,
    words far from dictionary form, used in informal native-native conversation).
    Underhill states that both registers contain all types of simplification — assimilation,
    elision, weak forms, linking — but the degree differs (pp. 58-59). Careful colloquial
    speech is a useful target for learner production; rapid colloquial speech is a
    necessary target for learner reception. Underhill''s key insight: "A learner''s
    listening menu should contain a wider range of phonological variants than his
    speaking menu" (p. 59). Learners who only prepare for careful speech will be unprepared
    for the reality of natural conversation.

    '
  examples:
  - '"What is the time?" — careful: /wɒt ɪz ðə taɪm/; rapid: /wɒz taɪm/ (Underhill''s
    five-level simplification demonstration, p. 59)'
  - '"I don''t know" — careful: /aɪ dəʊnt nəʊ/; rapid: /aɪ dəʊn nəʊ/ or even /ə dəʊn
    nəʊ/'
  - '"You and me" — careful: /juː ænd miː/; rapid: /jə ən mi/ or even /jən mi/'
  - '"I would have gone" — careful: /aɪ wʊd hæv ɡɒn/; rapid: /aɪd ə ɡɒn/ (triple reduction:
    would→d, have→ə, gone reduced)'
  - '"going to" — careful: /ɡəʊɪŋ tuː/; rapid: /ɡənə/ ("gonna") — Underhill notes
    this as a key listening target'
  - '"want to" — careful: /wɒnt tuː/; rapid: /wɒnə/ ("wanna")'
  - '"have to" — careful: /hæv tuː/; rapid: /hæftə/ (with assimilation of /v/ to /f/
    before /t/)'
  name: Distinguishing careful colloquial speech from rapid colloquial speech
  source: Underhill, Sound Foundations, pp. 58-59, 2658-2682
teaching_approach:
  stages:
  - activities:
    - 'Introduce one connected speech feature at a time. Start with the most impactful:
      weak forms and contractions.'
    - 'Say a phrase in careful pronunciation, then in connected speech. Ask: ''What
      changed?'''
    - Give learners a short phrase and ask them to predict how it will sound in rapid
      speech.
    source: Underhill, Sound Foundations, pp. 60, 2749-2752
    stage: pre-listening
    teacher_tips: 'Underhill recommends starting with awareness-raising rather than
      rule-teaching. "I don''t think it is necessarily helpful for learners to learn
      the rules governing assimilation. What is much more important is that you, the
      teacher, draw your learners'' attention to examples of assimilation when they
      arise" (p. 60). Use the phonemic chart to point out the sounds before and after
      the change.

      '
  - activities:
    - Play a short clip (30 seconds) of natural speech. Learners mark on a transcript
      where they notice connected speech features.
    - 'Dictation with connected speech: play a sentence. Learners write what they
      hear. Then show the ''dictionary'' version and compare.'
    - 'Minimal pair juncture exercise: play ''ice cream'' / ''I scream''. Learners
      identify which they heard.'
    - 'Weak form identification: play a sentence. Learners circle all the function
      words and write their weak forms.'
    source: Underhill, Sound Foundations, pp. 68, 3039-3041
    stage: while-listening
    teacher_tips: 'Underhill recommends "regular class analysis of very small samples
      of English (one or two sentences), selected from whatever taped materials are
      available" (p. 68). This close analysis of brief extracts is more productive
      than extended listening with no analytical focus.

      '
  - activities:
    - 'Transcript annotation: learners receive the transcript and mark all instances
      of assimilation, elision, weak forms, linking, and contractions.'
    - 'Production practice: learners say the same sentences first carefully, then
      at natural speed, applying the connected speech features they identified.'
    - 'Reflection: ''Which connected speech feature caused you the most difficulty?
      Why?'''
    source: Underhill, Sound Foundations, pp. 64, 2885-2890
    stage: post-listening
    teacher_tips: 'Underhill emphasizes that "working on the production of weak forms
      gives learners insight into the speech of native speakers, and helps to improve
      their listening skill and confidence" (p. 64). Production and perception are
      complementary.

      '
