activities:
- description: 'Learners listen to two versions of the same information: one in conversational
    style, one in academic lecture style. They note in two columns how the grammatical
    structures differ (e.g., simple vs. complex noun phrases, add-on vs. embedded
    structure). Then they discuss which style was harder to follow and why.

    '
  level: B1-B2
  name: Register comparison note-taking
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.2, 8.1.1, 8.2.1
- description: 'Give learners a transcript with all discourse markers removed. They
    listen and insert the missing markers. Then they classify each inserted marker
    by function: topic transition, stance, response, clarification.

    '
  level: B1-C1
  name: Discourse marker gap-fill
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 14.3.3.3
- description: 'Give learners a list of 10 common lexical bundles from a lecture they
    are about to hear. While listening, they note the order in which bundles appear
    and what content follows each one. After listening, they discuss how bundles helped
    them predict structure.

    '
  level: B2-C1
  name: Bundle identification and prediction
  source: Biber et al., Grammar of Spoken and Written English, 13.2.1.1, Table 13.2
- description: 'Learners listen to a 3-minute conversation and draw a "topic map":
    each new topic as a node, with arrows showing links between topics. They annotate
    each arrow with the discourse marker or feature that triggered the shift.

    '
  level: B2-C1
  name: Topic shift mapping
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.2, 14.3.2.1
- description: 'Play the first half of a cooperative completion sequence. Stop the
    audio. Learners predict what the completing speaker will say. Then play the remainder.
    Discuss what cues helped prediction.

    '
  level: B2-C1
  name: Cooperative completion prediction
  source: Biber et al., Grammar of Spoken and Written English, 14.2.4C
cefr_range: B1-C1
citations:
- claim: Listening sub-skills include phonemic discrimination, word segmentation,
    syntactic parsing, stress recognition, and pragmatic interpretation
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Three-level framework: Level
    1 (sounds), Level 2 (words), Level 3 (connected speech)'
  tier: 2
- claim: Conversation uses a linear incremental structure with lexical bundles providing
    structural frames — this differs from the embedded structure of academic prose
  flagged: false
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins.
    Ch. 10, 13: Lexical Bundles and Discourse'
  tier: 1
- claim: Swan & Smith (2001) document how L1 phonological systems affect English listening
    comprehension. Their cross-linguistic analysis shows that listeners from different
    L1 backgrounds misperceive English sounds in predictable patterns based on their
    L1 phonological inventory and phonotactic constraints.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_difficulties:
- difficulty: Learners cannot follow conversational topic shifts because they expect
    linear, academic-style structure
  explanation: 'Biber shows that conversation topics shift dynamically and often rely
    on shared knowledge. In the "Damn chilli" extract, topics range from dinner serving
    to grandpa to a dog named Pie to Sarah''s sister''s baby within a few turns (GSWE
    14.1.1, 14.1.2.2). Learners accustomed to academic prose (linear argumentation
    with explicit transitions) may be confused by these rapid, context-dependent shifts.

    '
  l1_groups:
  - Chinese
  - Korean
  - Japanese
  - Arabic
  source: Biber et al., Grammar of Spoken and Written English, 14.1.1, 14.1.2.2, 14.3.2.1
  teaching_strategy: 'Use transcripts to map topic shifts visually. Draw arrows between
    turns showing how each new topic connects (or doesn''t connect) to the previous
    one. Teach learners to recognize discourse markers that signal shifts: "Oh that
    reminds me" (association-triggered shift), "Going back to" (return to earlier
    topic), and vocatives that redirect the conversation to a new participant.

    '
- difficulty: Learners miss indirect speech acts because they only process literal
    meaning
  explanation: 'Biber documents that polite directives in conversation often take
    interrogative form: "Would you get those chips in there" and "Could you put them
    with the crackers" are requests disguised as questions (GSWE 14.1.2.5). "Let''s
    serve the chilli" is a softened imperative using first-person plural. Learners
    who process only literal meaning may miss these indirect speech acts.

    '
  l1_groups:
  - Japanese
  - Korean
  - Thai
  - Vietnamese
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.5
  teaching_strategy: 'Give learners a set of conversational directives in context.
    For each one, they identify: (a) the grammatical form (question/imperative/declarative),
    (b) the pragmatic function (request/suggestion/warning), (c) the politeness strategy
    used. Contrast with explicit imperatives: "Give it a rest."

    '
- difficulty: Learners cannot filter out non-clausal material when listening for key
    information
  explanation: 'Biber shows that non-clausal units (inserts, elliptic fragments) account
    for 38.6% of all units in conversation, with an average length of only 1.95 words
    (GSWE Table 14.7). Learners who try to process every unit as potentially significant
    information will be overwhelmed. They must learn to classify units: Is this a
    content-bearing clause or a pragmatic insert?

    '
  l1_groups:
  - German
  - French
  - Russian
  - Hebrew
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.4, Table 14.7,
    14.3.3
  teaching_strategy: 'Play a 1-minute conversational exchange. Give learners two colored
    pens: one for content clauses, one for non-clausal inserts. They mark the transcript
    in real time. After listening, compare which units are content- bearing and which
    are discourse management. Discuss: which ones did we need to understand the gist,
    and which could we ignore?

    '
definition: 'Listening sub-skills are the micro-processes that underpin successful
  comprehension across registers. Biber''s research demonstrates that conversation
  and academic prose have very different structural characteristics. Conversation
  favors simple clauses with the add-on strategy, non-clausal inserts (38.6% of all
  units), adjacency pairs, and high-frequency lexical bundles (GSWE 14.3.1.2, 14.3.1.4,
  13.2). Academic prose favors complex noun phrase elaboration through pre- and post-modification,
  embedded clauses, and passive voice (GSWE 8.1.1, 6.4.1). Effective listeners adjust
  their strategies to the register they are hearing.

  '
description: 'Learners develop specific sub-skills that support effective listening
  in both conversational and academic contexts: extracting and recording key information
  (note-taking), anticipating content from discourse structure (predicting), recognizing
  conversational and expository discourse markers, and tracking topic management.
  Grounded in Biber''s corpus analysis of conversation and written registers.

  '
key_principles:
- explanation: 'Biber shows that conversation builds meaning through the add-on strategy:
    clauses are strung together linearly with coordination and juxtaposition rather
    than embedding (GSWE 14.3.1.2). Subjects are typically simple single pronouns.
    Academic prose packs complexity into attributive adjectives, noun modifiers, and
    relative clauses (GSWE 8.2.1, 8.6.1). Note-taking strategies must differ: for
    conversation, note the sequence of additive points; for lectures, note the hierarchical
    relationship between main points and supporting details.

    '
  principle: Conversation uses a linear, incremental structure; academic prose uses
    an embedded, hierarchical structure
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.2, 8.1.1, 8.2.1,
    8.6.1
- explanation: 'Biber documents that four-word lexical bundles are far more common
    in conversation (424 per million words) than in academic prose (277 per million
    words) (GSWE 13.2.1.1, Table 13.2). Common conversational bundles include "I don''t
    know what," "do you want to," "I mean I think." Academic bundles include "on the
    other hand," "as a result of," "it is important to." Recognizing these bundles
    helps listeners segment the input and predict upcoming structure.

    '
  principle: Lexical bundles provide structural frames for both conversation and lectures
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 13.2.1.1, Table 13.2
- explanation: 'Biber shows that linking adverbials (anyway, so, then) and stance
    adverbials (just, now, though) are exceptionally frequent in conversation (GSWE
    14.1.2.4, 10.3.1.5). Discourse markers (well, right, now, I mean, you know) have
    a "discourse management" function, signaling how the upcoming utterance relates
    to the ongoing exchange (GSWE 14.1.2.4, 14.3.3.3). Single-word inserts (oh, okay,
    yeah) signal topic receipts and transitions.

    '
  principle: Topic management in conversation is signaled by discourse markers and
    inserts
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 10.3.1.5,
    14.3.3.3
- explanation: 'Biber shows that questions are three to four times more common in
    conversation than in writing, and about one in four conversational questions are
    question tags — a proportion that drops to one in 15 in fiction and one in 100
    in academic prose (GSWE 3.13.2.6, 14.1.2.4). Question tags combine assertion with
    a request for confirmation, which Biber calls the characteristic "negotiation
    or co-construction of meaning between interlocutors."

    '
  principle: Questions and question tags signal different expectations about listener
    response
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 3.13.2.6, 14.1.2.4
- explanation: 'Biber documents cases where the hearer rather than the speaker repairs
    an incomplete utterance by finishing it (GSWE 14.2.4C). For example: "It''s just
    a —" / "a hunch." These co-constructions are syntactically independent but discoursally
    interdependent. Skilled listeners anticipate possible completions based on the
    fragment and context.

    '
  principle: Cooperative completion is a normal feature of conversational listening
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.2.4C, 14.3.2
- principle: 'Biber et al. (1999) GSWE Ch. 14: Listening sub-skills include bottom-up
    processing (decoding phonemes, words, syntactic structure) and top-down processing
    (using context, prior knowledge, genre expectations). Conversation requires real-time
    processing of ellipsis, inserts, and discourse markers.'
phonological_features:
- description: 'Biber documents several types of utterance-initial elements that signal
    the direction of the upcoming utterance: fronting (topicalization), noun phrase
    prefaces co-referential with pronouns, discourse markers (well, right, now, so),
    and multi-word overtures ("I would have thought," "The question is," "Like I say").

    '
  examples:
  - Car numbers I remember more by the letters than the numbers — fronted object for
    topicalization (GSWE 14.3.2.1)
  - This little shop — it's lovely — noun phrase preface co-referential with "it"
    (GSWE 14.3.2.1)
  - I would have thought there was a lot more — polite disagreement overture (GSWE
    14.3.2.1)
  - The question is how many people are willing to spend... — issue-presenting overture
    (GSWE 14.3.2.1)
  feature: Prefaces and utterance launchers
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 11.5
- description: 'Biber documents 7 types of retrospective tags: retrospective comment
    clauses, vagueness hedges ("sort of thing"), question tags ("isn''t she?"), noun
    phrase tags for clarification, other non-clausal reinforcements, self-supplied
    answers, and vocatives. These enable speakers to qualify or elaborate what they
    have just said.

    '
  examples:
  - And then they're open seven days a week, you say — retrospective comment clause
    tag (GSWE 14.3.2.4)
  - It was her second car that she'd ever had, sort of thing — vagueness hedge tag
    (GSWE 14.3.2.4)
  - The one I was gonna have — noun phrase tag clarifying reference of "the only one"
    (GSWE 14.3.2.4)
  - no not at all — non-clausal reinforcement of preceding negative (GSWE 14.3.2.4)
  - What time are they due back — early? — self-supplied answer converting wh-question
    to yes-no question (GSWE 14.3.2.4)
  feature: Tags and retrospective qualification
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.4
skill_area: listening_sub_skills
skill_name: Listening Sub-Skills — Note-Taking, Predicting, and Discourse Structure
  Recognition
sources:
  primary: Biber, Johansson, Leech, Conrad & Finegan. Grammar of Spoken and Written
    English (1999), Chapters 10, 13 & 14
  secondary: ''
sub_skills:
- description: 'Learners extract key information from extended monologic speech and
    record it in a structured format (outline, table, or concept map). Lectures combine
    conversational features (add-on structure, simple subjects) with academic features
    (complex noun phrases, embedded clauses).

    '
  examples:
  - Listen to a 5-minute lecture segment. Write down the 3 main subtopics and one
    supporting detail for each.
  - Listen to a talk about cause-and-effect. Fill in a diagram showing causes, processes,
    and effects.
  - 'Listen to a presentation and distinguish: (a) the speaker''s main claim, (b)
    two pieces of evidence, (c) the conclusion.'
  name: Note-taking from lectures and presentations
  source: Biber et al., Grammar of Spoken and Written English, 13.2.1.1, 8.1.1, 6.4.1,
    14.3.1.2
- description: 'Learners record the key points of a conversation, following the additive,
    non-hierarchical structure of conversational discourse documented by Biber.

    '
  examples:
  - 'Listen to a phone conversation about making plans. Note: who, what, when, where.'
  - Listen to two people discussing a TV show. Note each person's opinion and one
    reason for it.
  name: Note-taking from conversations
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.2, 14.3.2
- description: 'Learners use discourse markers and repeated lexical bundles to anticipate
    upcoming content and segment the discourse.

    '
  examples:
  - anyway — signals a return to a previous topic (GSWE 10.4.3.1)
  - so — signals a result or conclusion is coming (GSWE 10.4.3.1)
  - I mean — signals a clarification or reformulation (GSWE 14.3.2.2)
  - The question is — signals an issue will be presented explicitly (GSWE 14.3.2.1)
  - on the other hand — academic bundle signaling a contrast (GSWE 13.2.1.1)
  - as a result of — academic bundle signaling a consequence (GSWE 13.2.1.1)
  name: Predicting content from discourse markers and lexical bundles
  source: Biber et al., Grammar of Spoken and Written English, 10.4.3.1, 14.3.2.1,
    14.3.2.2, 13.2.1.1
- description: 'Learners track how speakers introduce, shift, return to, and close
    topics using discourse markers, inserts, and bundle frames.

    '
  examples:
  - Going back to... — return to an earlier topic (GSWE 14.3.2.1)
  - But anyway — closing a side sequence, returning to the main thread (GSWE 10.4.3.1)
  - The other thing is — new subtopic in an additive list (GSWE 14.1.2.3)
  - Oh that reminds me — sudden topic shift triggered by association (GSWE 14.3.3.1)
  - 'Vocatives as topic/participant managers: "Michael, could you..." — the vocative
    both identifies the addressee and marks an attitude (GSWE 14.4.1)'
  name: Recognizing and following topic management
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 10.4.3.1,
    14.1.2.3, 14.3.3.1, 14.4.1
- description: 'Learners identify how speakers express certainty, doubt, emotion,
    and evaluation through adverbials, interjections, and inserts.

    '
  examples:
  - I guess / "I suppose" — hedge signaling uncertainty (GSWE 14.3.2.2)
  - 'just — minimizer: "It''s just a thought" (GSWE 14.1.2.7)'
  - oh — surprise or news-receipt (GSWE 14.3.3.1)
  - wow — impressed reaction (GSWE 14.3.3.1)
  - ah — emotional involvement, stronger than "oh" (GSWE 14.3.3.1)
  - 'Conversational intensifying coordination: "nice and strong," "good and fresh"
    (GSWE 14.1.2.5)'
  - 'Vagueness hedges: "sort of thing," "in a way" as retrospective qualification
    tags (GSWE 14.3.2.4)'
  name: Recognizing stance and attitude markers
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.2, 14.1.2.7,
    14.3.3.1, 14.1.2.5, 14.3.2.4
- description: 'Learners anticipate possible completions of incomplete utterances,
    respond to question tags, and recognize cooperative completion patterns.

    '
  examples:
  - 'Speaker: "It''s just a —" / Listener supplies: "a hunch" (GSWE 14.2.4C)'
  - That little girl's cute, isn't she? — question tag invites confirmation (GSWE
    14.3.2.4)
  - You had a nice trip though, yeah? — rising tag after assertion seeks confirmation
    (GSWE 14.3.2.4)
  - Here, I'll come and serve it honey if you want me to — / "Oh wait, we still have
    quite a few." — listener elaborates on the shared context (GSWE 14.1.2.2)
  name: Co-constructing meaning in interactive listening
  source: Biber et al., Grammar of Spoken and Written English, 14.2.4C, 14.3.2.4,
    14.1.2.4, 14.1.2.2
- description: 'Learners follow direct speech reporting in conversation, including
    non-standard patterns like "be + like" ("I was like...") and "go" ("and he goes...")
    that are characteristic of conversational narrative (GSWE 14.4.4).

    '
  examples:
  - And she's like 'no way!' I was like 'get out of here!' — "be + like" as reporting
    clause (GSWE 14.4.4.4)
  - And he goes 'you're kidding!' — "go" as reporting verb (GSWE 14.4.4.3)
  - I told him 'I'm not doing it' and he said 'yes you are' — standard reporting clause
    with "said" (GSWE 14.4.4.2)
  name: Recognizing reporting clauses and quoted speech
  source: Biber et al., Grammar of Spoken and Written English, 14.4.4
- description: 'Learners develop the three-level perceptual framework that Underhill
    identifies as essential for listening: Level 1 (individual sounds), Level 2 (words
    spoken in isolation/citation form), and Level 3 (the connected speech stream with
    all its simplifications). Underhill''s key innovation is enabling teachers and
    learners to move "elegantly and immediately" between all three levels in response
    to listening difficulties as they arise. When a learner cannot understand a stretch
    of natural speech, the teacher can "zoom in" to the problematic sound (Level 1),
    "zoom out" to check whether the word is recognized in isolation (Level 2), or
    "zoom out" further to examine how connected speech processes have modified the
    target word in context (Level 3). This sub-skill trains learners to diagnose their
    own listening difficulties by identifying which perceptual level is causing the
    problem.

    '
  examples:
  - 'Level 1 focus: A learner cannot distinguish /æ/ from /e/ in "cat" vs. "ket."
    The teacher isolates the sound on the phonemic chart and trains minimal pair perception.'
  - 'Level 2 focus: A learner recognizes /bʊk/ as "book" when spoken alone but cannot
    recognize it in context because of connected speech changes.'
  - 'Level 3 focus: A learner who knows "and" as /ænd/ in isolation hears /n/ in "bread
    and butter" and must learn to recognize /n/ as the connected speech form of "and."'
  - 'Diagnostic exercise: Play "I can''t believe it." A learner who hears "I can believe
    it" has a Level 1 problem (missing the /t/ in "can''t"). A learner who hears "I
    can''t [blank]" has a Level 3 problem (not recognizing "believe it" after elision
    and weak forms).'
  - 'Underhill''s connected speech analysis activity: Play a taped sentence → learners
    write it in spelling → mark stressed syllables → write dictionary pronunciation
    → say it in "dictionary pronunciation" → compare with tape → write what they actually
    hear → discuss differences (Underhill, Sound Foundations, Connected Speech activities).'
  name: Connected speech perception — sounds to words to connected stream
  source: Underhill, Sound Foundations, pp. 58-68, 2658-3041
- description: 'Learners develop the ability to use intonation patterns to interpret
    meaning, focusing on two key systems from Underhill''s discourse approach: (1)
    the proclaiming/referring tone distinction, where falling tone (p) adds new information
    to common ground and fall-rise tone (r) refers to shared knowledge, and (2) the
    tonic syllable, which marks the informational focus of a tone unit. Underhill''s
    insight is that "almost any sentence can carry a range of intonations, each one
    imparting a different nuance or meaning within the context." The same words —
    "It''s eight o''clock" — can mean hurry up, you''re late, you''re early, plenty
    of time, or I''m hungry depending on intonation alone. Learners must attend not
    just to what is said but to how pitch choices signal what the speaker treats as
    new vs. shared information.

    '
  examples:
  - 'Proclaiming vs. referring: "Alice" with falling tone (p) adds new information
    — a warning. "Alice" with fall-rise tone (r) appeals to shared understanding —
    reminding the listener of what they both know (Underhill, Sound Foundations, pp.
    76-77).'
  - 'Tonic syllable placement: "I''ll PHONE you toMORrow" (new information: when)
    vs. "I''ll phone YOU toMORrow" (new/contrastive information: who). The same words
    communicate different meanings depending on which syllable carries the main pitch
    change.'
  - 'Key choice: "On Sunday it snowed" with high key (contrastive — surprisingly),
    mid key (additive — also on Sunday), or low key (equative — as expected). Learners
    must distinguish these to interpret speaker stance.'
  - 'Question tag intonation: "It''s nice, isn''t it?" with falling tag (expects confirmation
    — speaker is certain) vs. rising tag (genuine question — speaker is uncertain).
    Learners must detect whether the speaker is asserting or asking.'
  - 'Same sentence, different meanings: Practice with "It''s eight o''clock!" conveying
    hurry up (falling, sharp), you''re late (falling, with emphasis), plenty of time
    (fall-rise, reassuring), I''m hungry (rising, suggesting). Underhill uses this
    exercise to demonstrate that intonation is not decorative but meaning-bearing.'
  name: Intonation and phrasal meaning — perceiving pitch choice and information focus
  source: Underhill, Sound Foundations, pp. 76-77, 3369-3396
teaching_approach:
  stages:
  - activities:
    - 'Register identification: ''You will hear a university lecture / two friends
      chatting / a news report.'' Discuss which structural features to expect.'
    - 'Preview discourse markers: give learners 5 discourse markers they will hear.
      Ask them to predict what each one signals.'
    - 'For note-taking: provide the skeleton outline (main topic headings) before
      listening. Learners fill in details while listening.'
    source: Biber et al., Grammar of Spoken and Written English, 14.3.1.4, 14.1.2.4,
      8.1.1
    stage: pre-listening
    teacher_tips: 'Biber''s research shows that conversation and academic prose have
      very different grammatical profiles. Make this explicit: lectures use complex
      noun phrases and embedded clauses (academic features) combined with the add-on
      strategy and simple subjects (conversational features). Conversation is dominated
      by non-clausal inserts (38.6% of units) and adjacency pairs (GSWE 14.3.1.4,
      14.1.2.4). Adjust expectations accordingly.

      '
  - activities:
    - 'Note-taking: learners use a two-column format. Left column: main points. Right
      column: details. After listening, compare notes with a partner.'
    - 'Discourse marker tracking: learners place a tick next to each discourse marker
      on their checklist every time they hear one.'
    - 'Pause-and-predict at boundaries: stop the audio at major discourse markers
      (so, anyway, well). Ask: ''What comes next?'' Then play to check.'
    source: Biber et al., Grammar of Spoken and Written English, 14.1.2.7
    stage: while-listening
    teacher_tips: 'Use Biber''s finding that conversation relies on a restricted,
      repetitive repertoire. The most common verbs across all conversation are give,
      think, mean, be, serve, get, put, have, see (GSWE 14.1.2.7). The four most common
      modals — will, would, can, could — are the only ones that appear in many conversational
      extracts. Alert learners to these high-frequency items so they develop expectations
      about what they will hear.

      '
  - activities:
    - 'Discourse marker analysis: give learners the transcript. They underline all
      discourse markers and explain each one''s function.'
    - 'Bundle identification: learners find repeated 3-4 word sequences (lexical bundles)
      in the transcript and discuss what structural role each plays.'
    - 'Strategy reflection: ''Which strategy helped you most? Predicting from discourse
      markers? Recognizing bundles? Filtering out inserts?'''
    source: Biber et al., Grammar of Spoken and Written English, 14.3.1.4, 14.3.3
    stage: post-listening
    teacher_tips: 'Biber shows that non-clausal units (inserts) account for 38.6%
      of all units in conversation, and nearly half of these are single-word inserts
      (interjections, response forms) (GSWE 14.3.1.4). Use the transcript to highlight
      these and discuss their pragmatic functions: Which inserts signal agreement
      (yeah, okay)? Which signal surprise (oh, wow)? Which mark topic transitions
      (well, now)? This builds pragmatic awareness that transfers to future listening.

      '
