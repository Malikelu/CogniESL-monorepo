activities:
- description: 'Learners listen to a 3-minute text three times. Listen 1: answer one
    gist question. Listen 2: answer 3 detail questions. Listen 3: answer 2 inference
    questions. Discuss which strategies helped at each level.

    '
  level: A2-B1
  name: Gist-first listening pyramid
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.1-4
- description: 'Play 10 short utterances. Learners mark the syllable with the greatest
    pitch movement (the tonic). Then they answer: "What is the new information in
    each utterance?"

    '
  level: B1-B2
  name: Tonic syllable identification
  source: Underhill, Sound Foundations, pp. 76-77, 3369-3396
- description: 'Give learners 15 discourse markers extracted from a listening text
    (well, so, anyway, I mean, you know, right, now, oh, okay, yeah). After listening,
    they sort each into: (a) topic transition, (b) stance marker, (c) response/backchannel,
    (d) clarification signal.

    '
  level: B1-C1
  name: Discourse marker function sort
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 14.3.3.3
- description: 'Give learners a transcript with all dysfluencies (repeats, false starts,
    repairs) intact. They listen and follow along, crossing out disfluencies. Then
    they read the "cleaned" version and compare comprehension.

    '
  level: B2-C1
  name: Dysfluency filter training
  source: Biber et al., Grammar of Spoken and Written English, 14.2
- description: 'Play a conversation where speakers use deictic reference and situational
    ellipsis. Learners must identify: (a) what "this" and "that" refer to, (b) what
    words are omitted in elliptic turns, (c) what is implied but not stated.

    '
  level: B2-C1
  name: Inference from shared context
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.2, 14.3.5
cefr_range: A2-C1
citations:
- claim: Effective listening strategies include prediction, selective attention (focusing
    on stressed syllables and key content words), inferencing, and note-taking
  flagged: false
  reliability: B
  source: Underhill (1994) Sound Foundations. Heinemann. Part 1, sections on Rhythm
    and Intonation
  tier: 2
- claim: Top-down listening (using prior knowledge) and bottom-up listening (decoding
    sounds and words) work together — teaching both strategies is essential
  flagged: false
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins.
    Ch. 10, 14: Register and spoken grammar'
  tier: 1
- claim: Swan & Smith (2001) document how L1 phonological systems affect English listening
    comprehension. Their cross-linguistic analysis shows that listeners from different
    L1 backgrounds misperceive English sounds in predictable patterns based on their
    L1 phonological inventory and phonotactic constraints.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_difficulties:
- difficulty: Learners try to understand every word and panic when they miss one
  explanation: 'Biber shows that conversation has low lexical density (55% nominal
    elements vs. 80% in news writing) and relies heavily on implicit reference, ellipsis,
    and deictic items (GSWE 14.1.2.2-3). Learners who approach listening as a word-by-word
    decoding task will be overwhelmed. Underhill''s stress-timing principle means
    many syllables are deliberately reduced and unclear.

    '
  l1_groups:
  - Spanish
  - German
  - Japanese
  - Korean
  source: Underhill, Sound Foundations, p. 73; Biber et al., 14.1.2.2-3
  teaching_strategy: 'Train learners to focus on prominent (stressed) syllables and
    content words. Use Underhill''s volume-reduction technique: turn the volume down
    until only the stressed syllables are audible, then ask learners to reconstruct
    the gist from those syllables alone (Underhill, p. 73). This builds confidence
    that understanding is possible without catching every word.

    '
- difficulty: Learners cannot distinguish new information from given information
  explanation: 'Underhill explains that the tonic syllable (carrying the main pitch
    change) marks the focus of new information in a tone unit (pp. 76-77). English
    tends to place new information at the end of the sentence. Learners who are not
    attuned to prominence patterns may miss which information is new and which is
    already established.

    '
  l1_groups:
  - Chinese
  - Arabic
  - Russian
  - Thai
  source: Underhill, Sound Foundations, pp. 76-77, 3369-3396
  teaching_strategy: 'Play short utterances and ask learners to identify the syllable
    with the most pitch movement. Then ask: "What is the NEW information in this sentence?"
    Practice with minimal pairs: "I''ll PHONE you tomorrow" vs. "I''ll phone YOU tomorrow"
    — same words, different tonic placement, different meaning focus.

    '
- difficulty: Learners are confused by normal dysfluency (repeats, false starts, repairs)
  explanation: 'Biber documents that repeats of function words (especially nominative
    pronouns and articles) are common dysfluencies, with the definite article "the"
    having a repeat rate of approximately 1-2% of all occurrences (GSWE 14.2.2.2,
    Table 14.5). Retrace-and-repair sequences ("that''s why the [all my] labor") are
    also normal. Learners may interpret these as errors or lose track of the message.

    '
  l1_groups:
  - French
  - Italian
  - Polish
  - Turkish
  source: Biber et al., Grammar of Spoken and Written English, 14.2, 14.2.2.2, 14.2.3
  teaching_strategy: 'Play a short conversational excerpt. Give the transcript with
    dysfluencies marked. Ask learners to read along and notice: "How many repeats?
    How many repairs? Did they stop you from understanding?" Normalize dysfluency
    as a feature of all spontaneous speech, not a sign of poor language ability.

    '
definition: 'Listening strategies are conscious techniques learners apply before,
  during, and after listening to compensate for the limitations of real-time processing.
  Biber''s research shows that online speech production imposes severe constraints:
  subjects are typically very simple (single pronouns), coordination and the add-on
  strategy replace complex embedding, and speakers use false starts, repeats, and
  retrace-and-repair sequences as normal dysfluencies (GSWE 14.2, 14.3.1). Effective
  listeners learn to extract signal from this inherently noisy channel by predicting,
  selecting, and inferring.

  '
description: 'Learners develop and apply specific cognitive strategies for different
  listening purposes: extracting global meaning (gist), locating specific information
  (detail), and deriving implied meaning (inference). Grounded in Biber''s analysis
  of conversational grammar, underlining how real-time processing constraints shape
  what speakers say and what listeners hear.

  '
key_principles:
- explanation: 'Biber shows that conversation follows adjacency pair structures (question-answer,
    greeting-greeting, offer-acceptance) that create predictability. About one in
    four conversational questions are question tags (GSWE 14.1.2.4), which signal
    that the speaker expects confirmation. Learners can prepare for likely next utterances
    by anticipating these structures. Additionally, Biber documents that speakers
    rely on a restricted, repetitive repertoire of high-frequency items (GSWE 14.1.2.7),
    so the range of likely next words is narrower than learners might expect.

    '
  principle: Prediction compensates for real-time processing limitations
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 14.1.2.7,
    3.13.2.6
- explanation: 'Underhill explains that English stress timing concentrates information
    on prominent syllables while reducing everything else (pp. 69-70, 3099-3110).
    Prominent syllables carry the main pitch change (tonic syllable) and signal new
    or important information. Function words are typically in weak forms. Effective
    listeners focus attention on stressed/content words (nouns, main verbs, adjectives,
    adverbs) and treat unstressed material as secondary. Underhill''s "turn the volume
    down" technique (p. 73) trains exactly this skill.

    '
  principle: Selective attention follows stress and prominence patterns
  reliability: B
  source: Underhill, Sound Foundations, pp. 69-73, 3064-3110
- explanation: 'Biber demonstrates that conversation has a very low lexical density
    compared to writing — nominal elements make up only 55% of conversation vs. 80%
    of newspaper language (GSWE 14.1.2.3). Speakers rely on shared physical context,
    deictic reference (this, that, those chips in there), situational ellipsis (omitting
    retrievable subjects and operators), and anaphoric pronouns. Effective listeners
    must actively reconstruct the unstated referents from what is available in the
    discourse and situation.

    '
  principle: Inference fills gaps from shared context and deictic reference
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.2, 14.1.2.3,
    3.7.5
- explanation: 'Biber documents that repeats (e.g., "the the"), retrace-and-repair
    sequences ("that''s why the [all my] labor"), false starts, syntactic blends,
    and incomplete utterances are all normal features of conversation, not signs of
    error to be corrected (GSWE 14.2). Nominative pronouns (I, she, we, they) are
    especially prone to repeats because they occur at clause beginnings where planning
    pressure is greatest (GSWE 14.2.2.2). Effective listeners learn to recognize these
    phenomena and continue processing the intended message.

    '
  principle: Monitoring dysfluency and filtering disfluencies in real time
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.2, 14.2.1, 14.2.2.2
- explanation: 'Biber shows that spoken utterances typically follow a linear, incremental
    structure (the add-on strategy) rather than the embedded clause structure of writing
    (GSWE 14.3.1.2). Speakers add information retrospectively through tags: retrospective
    comment clauses ("you say"), vagueness hedges ("sort of thing"), question tags
    ("isn''t she?"), noun phrase tags for clarification ("the one I was going to have"),
    self-supplied answers ("early?"), and vocatives ("Rudy, my knitting"). Listeners
    who recognize this structure can use tags to clarify or verify their understanding.

    '
  principle: Use the body-add-on-retrofit structure of spoken utterances
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.2, 14.3.2.4,
    14.3.2
- principle: 'Biber et al. (1999) GSWE Ch. 14: Listening comprehension in English
    requires processing reduced forms (gonna, wanna, gotta), weak forms (to, of, and
    as schwa), elision (disappearing sounds), and assimilation (sound changes at word
    boundaries). These features make spoken English different from written and require
    explicit listening instruction.'
phonological_features:
- description: 'The tonic syllable carries the main pitch change in a tone unit and
    marks the focus of information. Underhill explains that prominence is determined
    by the speaker (not the language), while accent is a fixed property of the word.
    The tonic syllable is often the last lexical item in the tone unit, following
    English''s tendency to place new information at the end of a sentence.

    '
  examples:
  - 'I''ll PHONE you toMORrow — tonic on MOR (new information: when)'
  - 'I''ll phone YOU tomorrow — tonic on YOU (new information: who, contrastive)'
  - YES — a single tonic syllable can constitute a complete tone unit (Underhill,
    p. 76)
  feature: Prominence and the tonic syllable
  source: Underhill, Sound Foundations, pp. 76-77, 3369-3396
- description: 'English is stress-timed: stressed syllables tend to occur at roughly
    equal intervals regardless of the number of unstressed syllables between them.
    This means unstressed syllables are compressed and reduced. Underhill demonstrates
    this with "You and me" (2 syllables, 2 stresses) vs. "You and then it''s him and
    her" (8 syllables, 2 stresses) — both take approximately the same time to say.

    '
  examples:
  - Put it down (3 syllables, 2 stresses) vs. "Put it over there" (5 syllables, 2
    stresses) — same duration
  - You and me → "You and then me" → "You and then it's me" — each version takes roughly
    the same time
  feature: Stress timing and the compression of unstressed syllables
  source: Underhill, Sound Foundations, pp. 71-72, 3132-3163
- description: 'Biber documents that contractions with ''s/''re/''m occur over 20,000
    times per million words in conversation. These are not optional shortcuts but
    the default form in connected speech. Learners who only recognize full forms ("I
    am," "they are," "it is") will miss the most common spoken realizations.

    '
  examples:
  - I'm /aɪm/ — occurs ~20,000+ times per million words in conversation (GSWE 14.2.2.3)
  - it's /ɪts/ — among the most repeated contraction forms (GSWE Table 14.6)
  - gonna /ɡənə/ — reduced form of "going to" (GSWE 14.1.2.9)
  - gotta /ɡɒtə/ — reduced form of "got to" (GSWE 14.1.2.9)
  - cos /kɒz/ or "cause" /kɔːz/ — reduced form of "because" (GSWE 14.1.2.7)
  feature: Contractions and reduced forms in rapid speech
  source: Biber et al., Grammar of Spoken and Written English, 14.2.2.3, 14.1.2.9,
    Table 14.6
skill_area: listening_strategies
skill_name: Listening Strategies — Gist, Detail, and Inference
sources:
  primary: Biber, Johansson, Leech, Conrad & Finegan. Grammar of Spoken and Written
    English (1999), Chapters 10 & 14
  secondary: 'Underhill, Adrian. Sound Foundations (1994), Part 1 Level 3: Connected
    Speech, sections on Rhythm and Intonation'
sub_skills:
- description: 'Learners activate background knowledge, scan visual/contextual clues,
    and formulate expectations before hearing the text.

    '
  examples:
  - Look at the photograph accompanying a news story. Predict 5 words or phrases you
    expect to hear.
  - 'Read the question prompts before listening. Identify: (a) what type of information
    you need, (b) what part of the speech is likely to contain it.'
  name: Predicting before listening
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 14.1.2.7
- description: 'Learners identify the overall topic, purpose, and speakers'' attitudes
    without attending to specific details.

    '
  examples:
  - 'Listen to a 2-minute conversation between two friends and answer: What are they
    talking about? Are they agreeing or disagreeing?'
  - 'Listen to the first 60 seconds of a podcast. Identify: the main topic and whether
    the speaker is positive, negative, or neutral about it.'
  name: Listening for gist (global comprehension)
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.1-4
- description: 'Learners locate specific pieces of information (names, numbers, places,
    times, reasons) from within a longer text.

    '
  examples:
  - 'Listen to an airport announcement and write down: flight number, gate, departure
    time.'
  - Listen to a story and list the events in the order they happened.
  - Listen to someone giving directions and trace the route on a map.
  name: Listening for detail (selective listening)
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 14.1.2.6
- description: 'Learners derive implied meaning by combining explicit statements with
    contextual knowledge, speaker stance markers, and awareness of conversational
    structure.

    '
  examples:
  - 'Speaker says: ''Well, there''s nothing in the garage.'' Learner infers: the first
    speaker assumed something was in the garage, and B is contradicting that assumption
    (GSWE 14.3.2.1).'
  - 'Speaker says: ''Oh, did she?'' with rising intonation. Learner infers: surprise
    or interest at new information (GSWE 14.3.3.1).'
  - 'Speaker says: ''North and south London — they''re two different worlds, aren''t
    they? in a way.'' The tag ''in a way'' retrospectively hedges the assertion —
    the speaker is not fully committing to the claim (GSWE 14.3.2.4).'
  name: Listening for inference (pragmatic comprehension)
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 14.3.3.1,
    14.3.2.4
- description: 'Learners identify discourse markers (well, right, now, so, anyway,
    I mean, you know) that signal transitions, topic changes, and stance, using them
    to segment the listening into manageable units.

    '
  examples:
  - well signals a qualification, disagreement, or correction is coming (GSWE 14.3.2.1,
    14.1.2.4)
  - so signals a result or transition to a new subtopic (GSWE 10.4.3.1)
  - I mean signals that a clarification or reformulation follows (GSWE 14.3.2.2, 14.1.2.4)
  - you know signals appeal to shared knowledge or experience (GSWE 14.3.2.2)
  - anyway signals a return to a prior topic or a shift in direction (GSWE 10.4.3.1)
  name: Recognizing and using discourse markers to segment speech
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 14.3.2.2,
    14.3.3.3, 10.4.3.1
- description: 'Learners use stress patterns to identify which words carry the main
    informational load. Biber notes that lexical words (nouns, main verbs, adjectives,
    adverbs) are typically stressed, while grammatical words (articles, prepositions,
    conjunctions, pronouns, auxiliaries) typically occur in weak forms (GSWE 14.1.2.3,
    2.3.5).

    '
  examples:
  - In 'I saw a BIG DOG in the PARK,' the lexical words (BIG, DOG, PARK) carry the
    informational content.
  - In 'I DON'T THINK it SHOULD BE ALLOWED,' the negatives and modal auxiliaries ARE
    stressed because they carry meaning.
  name: Distinguishing lexical (content) words from grammatical (function) words by
    stress
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.3; Underhill,
    pp. 69-70, 3111-3123
- description: 'Stance adverbials are exceptionally frequent in conversation (GSWE
    10.3.1.5). Single-word adverbs like just, so, then, anyway, though, and now account
    for a large percentage of all stance markers (GSWE 14.1.2.7). Interjections like
    oh, ah, wow convey emotional reactions. Learners must decode these to understand
    speaker attitude.

    '
  examples:
  - 'just — minimizer indicating something is less significant than expected: "It''s
    just a thought" (GSWE 14.1.2.7)'
  - I guess — stance marker signaling uncertainty or tentativeness (GSWE 14.3.2.2)
  - oh wow — interjection expressing surprised admiration (GSWE 14.3.3.1)
  name: Understanding speaker stance through adverbials and inserts
  source: Biber et al., Grammar of Spoken and Written English, 10.3.1.5, 14.1.2.7,
    14.3.2.2, 14.3.3.1
- description: 'Learners develop what Underhill calls "the essence of this approach":
    becoming sensitive to the experience of what is happening in the vocal tract "as
    it is happening — to know it from the inside, not just from the outside" (Underhill,
    Introduction, p. x). This sub-skill translates Underhill''s awareness philosophy
    directly into listening practice. Rather than treating listening as passive reception,
    learners engage in regular close analysis of very small samples of English — one
    or two sentences — selected from taped materials (Underhill, Sound Foundations,
    p. 68). Underhill''s insight is that "this close analysis of brief extracts is
    more productive than extended listening with no analytical focus." Learners develop
    an internal catalogue of phonological patterns (weak forms, assimilation, linking,
    elision) that they can draw on automatically in future listening. The goal is
    to move from "I can''t hear anything" to "I can hear exactly what''s happening
    in the stream."

    '
  examples:
  - 'Minimal sample analysis: Take one sentence from a podcast. Listen three times:
    first for gist, second for stressed syllables, third for weak forms and connected
    speech features. Underhill recommends "regular class analysis of very small samples"
    (p. 68).'
  - 'The "say it in English!" challenge: After detailed phonological analysis, learners
    re-immerse in natural-speed audio. The contrast between analytical listening and
    flowing comprehension builds the awareness Underhill describes.'
  - 'Internal imaging for listening: After hearing a model once, learners wait 2-3
    seconds in silence to hear the sound again internally in their "mind''s ear" before
    producing it. This develops the natural faculty of internal auditory representation
    that supports real-time listening (Underhill, Internal Imaging technique).'
  - 'Feature spotting: Play 30 seconds. Learners note: How many weak forms? How many
    assimilations? How many elisions? This builds the "inside" knowledge that helps
    future automatic recognition.'
  name: Awareness-based listening — training the ear through conscious phonological
    attention
  source: 'Underhill, Sound Foundations, Introduction (pp. ix-x); Part 1 Level 3:
    Connected Speech, pp. 68, 3039-3041'
- description: 'Learners use the phonemic chart — designed by Underhill as "pronunciation
    territory to explore, not items to memorize" — as an active listening support
    tool. When learners cannot identify what they are hearing, the chart provides
    a systematic way to narrow down possibilities: Is the sound in question a vowel
    or consonant? Front, central, or back? Voiced or unvoiced? Underhill''s seven
    modes of chart usage all apply to listening: "speak then point" (Mode 3) trains
    learners to identify what the speaker said; "point then speak" (Mode 2) trains
    them to produce what they think they heard. The chart also supports connected
    speech analysis: pointing to the sound before and after an assimilation (e.g.,
    /n/ → /m/) makes the change visible and memorable. Underhill recommends the chart
    be "permanently displayed at the front of the classroom for instant reference
    during any lesson, for any purpose" — including listening lessons.

    '
  examples:
  - 'Sound identification: Play a difficult sound in context. Learners point to the
    chart box where they think the sound lives. This provides a visual-spatial framework
    for categorizing what they hear.'
  - 'Assimilation tracking: Teacher points to /n/ on the chart, then /m/. Learners
    hear "ten pin" → /tɛm pɪm/ and physically see the shift from alveolar to bilabial
    on the chart. Underhill recommends using the chart "to point out the sounds before
    and after the change" (p. 60).'
  - 'Vowel reduction awareness: When a learner hears /ə/ but expected /ænd/ ("and"),
    the teacher points to schwa in the chart. The learner now understands the systematic
    relationship between full and reduced vowels.'
  - 'Minimal pair discrimination on the chart: Play "ice cream" vs. "I scream." Learners
    point to the phonemic boundaries on the chart, using the visual layout to attend
    to subtle juncture cues (vowel length, consonant timing) that distinguish the
    pair.'
  name: Using the phonemic chart as a listening support tool
  source: 'Underhill, Sound Foundations, Introduction (chart design principles); Part
    1 Level 3: Connected Speech, pp. 60, 68; Part 2 Level 3: Connected Speech, Discovery
    Activities'
- description: 'Learners systematically develop the ability to process rapid colloquial
    speech — Underhill''s recommended listening target, where "a learner''s listening
    menu should contain a wider range of phonological variants than his speaking menu"
    (p. 59). This sub-skill is built on the principle that speech exists on a continuum
    from careful colloquial (moderate simplification) to rapid colloquial (extensive
    simplification), and that learners need graded exposure across the full range.
    Underhill provides a concrete pedagogical tool: the "degrees of simplification"
    exercise, where learners first hear careful pronunciation, then progressively
    more reduced versions, training their ear to recognize the same words at each
    level. The goal is to make the most reduced forms as recognizable as the dictionary
    forms, preparing learners for the reality of natural native-native conversation.

    '
  examples:
  - '"What is the time?" at five simplification levels: /wɒt ɪz ðə taɪm/ → /wɒs ɪz
    ðə taɪm/ → /wɒs ə taɪm/ → /wɒz ə taɪm/ → /wɒz taɪm/. Learners practice identifying
    and producing all five levels, building a graded perceptual map. Underhill''s
    demonstration (p. 59) makes the systematic nature of simplification visible.'
  - 'BBC World Service to informal conversation: Listen to the same news story first
    from a formal radio broadcast (careful colloquial), then from a YouTube vlog or
    podcast (rapid colloquial). Compare: which weak forms differ? Which assimilation
    patterns? How many words per second?'
  - 'Intelligibility threshold exercise: Play rapid speech at full speed. Learners
    note where comprehension breaks down. Then replay the difficult section three
    times, each time with teacher guidance pointing out the connected speech features
    causing difficulty. Gradually increase speed across sessions.'
  - '"Dictionary form vs. natural form" comparison: Give learners the written sentence
    before listening. After hearing the rapid version, they mark on the written transcript
    every place where the actual pronunciation diverged from the dictionary form.
    Underhill calls this "regular class analysis of very small samples" (p. 68).'
  name: Working with authentic rapid colloquial speech — expanding the listening menu
  source: 'Underhill, Sound Foundations, pp. 58-59, 2658-2682; Part 2 Level 3: Connected
    Speech activities'
teaching_approach:
  stages:
  - activities:
    - 'Prediction task: show the title/image. Ask ''What do you think you will hear?
      Make a list of 5 words you expect.'''
    - 'Question scanning: give learners the comprehension questions BEFORE listening.
      They identify what type of information they''re listening for.'
    - 'Activating conversational knowledge: ''In the text, someone will disagree with
      another speaker. What language do you expect them to use?'''
    source: Biber et al., Grammar of Spoken and Written English, 14.1.2.2-4
    stage: pre-listening
    teacher_tips: 'Emphasize prediction based on what Biber documents about adjacency
      pair structures in conversation. If the prompt says "Listen to someone asking
      for directions," learners should expect: a request adjacency pair, possible
      clarifying questions, spatial deictic language, and if/then clause structures
      (GSWE 14.1.2.4, 14.1.2.2).

      '
  - activities:
    - 'First listen: gist question only (What is this about? How does the speaker
      feel?).'
    - 'Second listen: detail questions (Who? When? Where? How many?).'
    - 'Third listen: inference questions (Why does the speaker say ''well'' here?
      What does ''sort of'' tell us about the speaker''s commitment?).'
    - 'Pause-and-predict: stop the audio at key discourse markers (well, so, anyway).
      Ask learners what they expect to hear next.'
    source: Underhill, Sound Foundations, pp. 76-77; Biber et al., 14.1.2.4
    stage: while-listening
    teacher_tips: 'Use Underhill''s principle that prominent syllables carry the main
      information. Train learners to focus on stressed content words and treat unstressed
      function words as background. For detail listening, replay short segments and
      ask learners to identify the tonic syllable (the syllable carrying the main
      pitch change) in key utterances (Underhill, pp. 76-77, 3369-3396).

      '
  - activities:
    - 'Strategy reflection: ''Which strategy helped you most? Prediction? Stress patterns?
      Discourse markers?'''
    - 'Transcript analysis: give the transcript. Learners underline all discourse
      markers and explain their function.'
    - 'Dysfluency identification: learners circle all repeats, false starts, and repairs
      in the transcript. Discuss: did these interfere with understanding?'
    source: Underhill, Sound Foundations, p. 68; Biber et al., 14.2
    stage: post-listening
    teacher_tips: 'Post-listening is the stage for making Underhill''s connected speech
      features visible. Select 2-3 sentences from the transcript and work through
      them phonologically: identify elision, assimilation, weak forms, and linking.
      This builds the "insight" that Underhill says helps both production and reception
      (Underhill, p. 68).

      '
