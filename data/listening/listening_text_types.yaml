activities:
- description: 'Play 4 short audio clips (conversation, lecture, news, narrative).
    Learners identify the register and list 3 grammatical or phonological features
    that confirm their identification.

    '
  level: B1-B2
  name: Register identification challenge
  source: Biber et al., Grammar of Spoken and Written English, 1.5, 2.3.5, 4.1.1
- description: 'Learners listen to a conversation and complete a table: Column 1 =
    first part of adjacency pair (question, offer, greeting), Column 2 = second part
    (answer, acceptance, greeting). They note any inserted sequences.

    '
  level: A2-B1
  name: Conversation adjacency pair tracking
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4
- description: 'Learners listen to a 5-minute lecture excerpt and fill in a hierarchical
    outline (main point -> sub-point -> example). They compare outlines with a partner
    after listening.

    '
  level: B2-C1
  name: Lecture outline reconstruction
  source: Biber et al., Grammar of Spoken and Written English, 8.1.1, 6.4.1, 13.2.1.1
- description: 'Learners listen to a 2-minute news bulletin and complete a table for
    each story: Who? What? When? Where? Why? They compare with a partner and then
    check against the transcript.

    '
  level: A2-B1
  name: News 5-W extraction
  source: Biber et al., Grammar of Spoken and Written English, 4.1.1
- description: 'Learners listen to a personal anecdote containing direct speech. They
    identify each reporting clause and classify it as: (a) standard (said/asked),
    (b) vernacular "be + like," (c) vernacular "goes/went."

    '
  level: B1-B2
  name: Narrative reporting clause identification
  source: Biber et al., Grammar of Spoken and Written English, 14.4.4
cefr_range: A2-C2
citations:
- claim: Each spoken register (conversation, lectures, news broadcasts, narratives)
    has a distinctive grammatical profile requiring different listening strategies
  flagged: false
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins.
    Ch. 1, 2, 4-6, 8, 13-14: Register Distribution'
  tier: 1
- claim: Careful colloquial speech and rapid colloquial speech define a continuum
    — learners must be exposed to both to develop real-world listening ability
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Part 1 Level 3: Connected
    Speech, pp. 58-59'
  tier: 1
- claim: Swan & Smith (2001) document how L1 phonological systems affect English listening
    comprehension. Their cross-linguistic analysis shows that listeners from different
    L1 backgrounds misperceive English sounds in predictable patterns based on their
    L1 phonological inventory and phonotactic constraints.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_difficulties:
- difficulty: Learners expect news broadcasts to sound like written news
  explanation: 'Biber shows that written news has the highest lexical density of any
    register (GSWE 4.1.1). Learners who have read news in English may expect spoken
    news to have the same density. However, spoken news uses Underhill''s careful
    colloquial speech with moderate simplification, making it more accessible. The
    challenge is the speed of proper nouns, numbers, and place names.

    '
  l1_groups:
  - Spanish
  - French
  - German
  - Italian
  source: Underhill, Sound Foundations, pp. 58-59; Biber et al., 4.1.1
  teaching_strategy: 'Start with slow news broadcasts (BBC Learning English, VOA Learning
    English) and progress to authentic speed. Pre-teach proper nouns and numbers.
    Use the "careful colloquial speech" model: learners should expect moderate simplification,
    not dictionary pronunciation.

    '
- difficulty: Learners cannot follow lectures because they expect conversation-style
    grammar
  explanation: 'Biber shows that academic prose uses complex noun phrases with both
    pre- and post-modification, passive voice, and nominalizations (GSWE 8.1.1, 6.4.1).
    Learners who are comfortable with conversational grammar (simple clauses, add-on
    structure) may be overwhelmed by the density of academic noun phrases. They need
    to learn to extract the head noun from complex noun phrases.

    '
  l1_groups:
  - Japanese
  - Korean
  - Chinese
  - Thai
  source: Biber et al., Grammar of Spoken and Written English, 8.1.1, 6.4.1, 2.3.5
  teaching_strategy: 'Pre-teach the structure of academic noun phrases. Give learners
    practice identifying the head noun in complex phrases: "the range of differentiated
    tissues formed in such an experimental teratoma" — head noun is "range." Use Biber''s
    finding that academic prose has a much higher proportion of nouns to verbs than
    conversation (GSWE 2.3.5) to set expectations.

    '
- difficulty: Learners cannot follow conversational narrative because of vernacular
    reporting clauses
  explanation: 'Biber documents that conversational narratives use non-standard reporting
    clauses: "be + like" ("I was like ''no way!''"), "go" ("and he goes ''you''re
    kidding''"), and the past progressive with reporting verbs (GSWE 14.4.4). Learners
    who only know "said" and "asked" as reporting verbs may not recognize these vernacular
    forms.

    '
  l1_groups:
  - Arabic
  - Russian
  - Polish
  - Turkish
  source: Biber et al., Grammar of Spoken and Written English, 14.4.4
  teaching_strategy: 'Explicitly teach the three most common conversational reporting
    patterns: (1) "said/asked" (standard), (2) "was like" (informal, very common in
    AmE), (3) "goes/went" (informal, for dramatic effect). Play short narrative excerpts
    and ask learners to identify which reporting pattern was used.

    '
definition: 'Listening text types correspond to what Biber calls "registers" — situationally
  defined varieties of language. Biber''s LSWE Corpus (over 40 million words) compares
  four major registers: conversation, fiction, newspaper language, and academic prose
  (GSWE 1.4). Each register has characteristic frequencies of core grammatical features:
  conversation has more pronouns, verbs, adverbs, and inserts; academic prose has
  more nouns, complex noun phrases, and passive voice; news writing has high lexical
  density and elaborated noun phrases; fiction combines narrative past tense with
  conversational dialogue (GSWE 2.3.5, 6.4.1, 8.1.1). Learners who understand these
  register profiles can adjust their listening strategies to the type of text they
  encounter.

  '
description: 'Learners develop the ability to identify and adjust to different spoken
  text types, each with characteristic grammatical and discourse features. Based on
  Biber''s register analysis in the LSWE Corpus: conversation, fiction, news, and
  academic prose as four major register categories (GSWE 1.5), each with distinctive
  frequencies of grammatical features. Underhill''s connected speech analysis supplements
  this with phonological features that distinguish registers.

  '
key_principles:
- explanation: 'Biber''s corpus analysis reveals striking quantitative differences
    across registers. Conversation has the highest frequency of personal pronouns
    (especially I and you), verbs (especially primary and modal auxiliaries), and
    inserts. Academic prose has the highest frequency of nouns, attributive adjectives,
    and prepositional phrases. News writing has the highest lexical density (proportion
    of content words to function words). Fiction falls between conversation and news
    in many features (GSWE 2.3.5, 2.4.14, 4.1.1). These differences create distinct
    listening challenges for each text type.

    '
  principle: Each register has a distinctive grammatical profile
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 1.5, 2.3.5, 2.4.14,
    4.1.1
- explanation: 'Underhill distinguishes two landmarks on the casual-formal speech
    continuum. "Careful colloquial speech" (BBC World Service, news announcements)
    uses moderate simplification and remains closer to dictionary pronunciation. "Rapid
    colloquial speech" (friends talking informally) uses extensive simplification
    with all connected speech features at maximum. Learners should be exposed to both,
    starting with careful colloquial speech for production and progressing to rapid
    colloquial speech for receptive skill.

    '
  principle: Careful colloquial speech and rapid colloquial speech define a continuum
    for casual conversation
  reliability: B
  source: Underhill, Sound Foundations, pp. 58-59, 2658-2682
- explanation: 'Biber''s analysis of supplementary registers shows that classroom
    teaching and public speaking blend conversational features (add-on structure,
    simple subjects, stance adverbials, inserts) with academic features (complex noun
    phrases, nominalizations, passive voice). This hybrid register creates unique
    listening challenges: the delivery is conversational but the content is dense
    and hierarchically organized.

    '
  principle: Lectures and presentations combine conversational delivery with academic
    grammar
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 1.5, 10.3.1.5, 8.1.1
- explanation: 'News writing (Biber''s third register) is characterized by high lexical
    density, elaborated noun phrases with both pre- and post-modification, and time
    and place adverbials (GSWE 4.1.1, 8.1.1, 8.6.1). Spoken news broadcasts tend toward
    Underhill''s "careful colloquial speech" — moderate simplification, clear pronunciation.
    This makes them more accessible to learners than informal conversation, despite
    the dense content.

    '
  principle: News broadcasts and public announcements favor careful colloquial speech
    with high lexical density
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 4.1.1, 8.1.1; Underhill,
    pp. 58-59
- explanation: 'Biber shows that fiction has high frequencies of past tense verbs,
    third person pronouns, and time adverbials (GSWE 5.1.2, 6.2.2). Conversational
    narratives follow the add-on structure: events are strung together with "and then"
    and the past progressive with reporting verbs ("he goes," "I was like") (GSWE
    14.4.4). Learners listening to stories and anecdotes must integrate chronological
    sequencing with dialogue and evaluation.

    '
  principle: Narrative (fiction and anecdote) uses past tense, temporal conjunctions,
    and direct speech
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 5.1.2, 6.2.2, 14.4.4
- principle: 'Biber et al. (1999) GSWE Ch. 1-2: Register affects listening difficulty.
    Conversation has repetition, negotiation, and clarification available. Academic
    lectures have denser information, less redundancy, and more complex syntax. News
    broadcasts have fast delivery and dense information.'
phonological_features:
- description: 'Spoken conversation typically exhibits rapid colloquial speech features:
    extensive assimilation, elision, vowel reduction, weak forms, contractions, and
    liaison. Underhill notes this is the default mode for native-native informal interaction.
    Stress timing compresses unstressed syllables to the point where they may be nearly
    inaudible.

    '
  examples:
  - I don't know what you're talking about → /aɪ dəʊn nəʊ wɒt jə tɔːkɪŋ əbaʊt/ (with
    elision of /t/, reduction of "you're" and "about")
  - We were going to have done it anyway → /wɪ wə ɡənə həf dʌn ɪt ənɪweɪ/ (with multiple
    contractions and reductions)
  feature: Conversation — maximum connected speech simplification
  source: Underhill, Sound Foundations, pp. 58-68, 2658-2890
- description: 'Public spoken academic language uses Underhill''s careful colloquial
    speech model: moderate simplification, clearer word boundaries, but still with
    stress timing and connected speech features. The speaker''s use of intonation
    (tone units, tonic syllables, heads, preheads) is more deliberate and structured
    to support the hierarchical organization of academic content.

    '
  examples:
  - On the one hand... on the other hand — academic linking bundle with moderate connected
    speech simplification
  - The results suggest that... — careful pronunciation of content words, moderate
    reduction of function words
  - Tone unit structure is more clearly marked: longer tonic syllables, more deliberate
      pitch movement to signal new information"
  feature: Lectures and presentations — careful colloquial with academic prosody
  source: Underhill, Sound Foundations, pp. 58-59, 76-81; Biber et al., 1.5, 13.2.1.1
- description: 'News broadcasters use the clearest form of careful colloquial speech
    (Underhill''s example: BBC World Service). Connected speech features are present
    but moderate. Word boundaries are clearer. Stress timing is maintained but unstressed
    syllables are not as reduced as in informal conversation. This makes news broadcasts
    the most accessible spoken text type for learners.

    '
  examples:
  - The Prime Minister has announced... — moderate simplification, clear word boundaries
  - Flight BA287 to London is now boarding at gate 12 — careful pronunciation of proper
    nouns and numbers
  feature: News broadcasts and announcements — careful colloquial with standardized
    pronunciation
  source: Underhill, Sound Foundations, pp. 58-59, 2664-2674
skill_area: text_types
skill_name: Listening Text Types — Conversation, Lectures, Announcements, and Narratives
sources:
  primary: Biber, Johansson, Leech, Conrad & Finegan. Grammar of Spoken and Written
    English (1999), Chapters 1, 2, 4, 5, 6, 8, 13 & 14
  secondary: 'Underhill, Adrian. Sound Foundations (1994), Part 1 Level 3: Connected
    Speech, pp. 58-59'
sub_skills:
- description: 'Learners comprehend informal dialogues between two or more speakers,
    recognizing the features Biber documents: adjacency pairs, non-clausal inserts
    (38.6% of units), simple add-on clause structure, high-frequency lexical bundles,
    discourse markers, and normal dysfluency.

    '
  examples:
  - 'Listen to two friends deciding what to do Saturday. Note: (a) each person''s
    preference, (b) how they negotiate, (c) the final plan.'
  - 'Listen to a conversation at a dinner table (like Biber''s ''Damn chilli'' extract).
    Identify: who is speaking, what they are referring to, what shared knowledge they
    rely on.'
  name: Listening to face-to-face conversation
  source: Biber et al., Grammar of Spoken and Written English, Chapter 14, 14.3.1.4,
    14.1.2.4, 13.2
- description: 'Learners comprehend extended academic monologue with dense noun phrases,
    hierarchical organization, and a blend of conversational delivery with academic
    grammar.

    '
  examples:
  - 'Listen to a 5-minute university lecture excerpt. Identify: the main thesis, 3
    supporting points, and 2 examples the speaker gives.'
  - 'Listen to a TED-style talk. Fill in an outline: introduction (problem), body
    (solution + evidence), conclusion (implication).'
  name: Listening to lectures and academic presentations
  source: Biber et al., Grammar of Spoken and Written English, 8.1.1, 8.2.1, 6.4.1,
    10.3.1.5, 13.2.1.1
- description: 'Learners comprehend scripted or semi-scripted news delivery in Underhill''s
    "careful colloquial speech" style, with high lexical density (nouns, complex noun
    phrases) and standardized discourse structure (lead + details).

    '
  examples:
  - 'Listen to a BBC news bulletin. Write: who, what, where, when for each news item.'
  - 'Listen to an airport/flight announcement. Note: flight number, gate, departure
    time, delay reason.'
  name: Listening to news broadcasts and public announcements
  source: Biber et al., Grammar of Spoken and Written English, 4.1.1, 8.1.1; Underhill,
    pp. 58-59
- description: 'Learners follow chronological narrative sequences, identify speaker
    evaluation in narratives, and follow direct speech reporting using both standard
    ("said") and vernacular ("was like," "goes") reporting clauses.

    '
  examples:
  - 'Listen to a personal anecdote. Identify: the setting (who/where/when), the problem/event,
    the resolution, and the speaker''s evaluation.'
  - 'Listen to a story that contains direct speech. Identify: who said what, and which
    reporting verb was used (said, was like, goes).'
  name: Listening to narrative (stories, anecdotes, fiction excerpts)
  source: Biber et al., Grammar of Spoken and Written English, 5.1.2, 6.2.2, 14.4.4
- description: 'Learners comprehend goal-oriented exchanges with predictable structure:
    greeting/request/information/confirmation/closing. Biber''s adjacency pair framework
    applies directly: question-answer, request-compliance, offer-acceptance/refusal.

    '
  examples:
  - 'Listen to a conversation at a doctor''s office. Note: the patient''s complaint,
    the doctor''s questions, the diagnosis/recommendation.'
  - 'Listen to someone ordering food at a restaurant. Note: what they order, any modifications,
    and the server''s confirmation.'
  name: Listening to transactional exchanges (shopping, appointments, information)
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 14.1.2.5
teaching_approach:
  stages:
  - activities:
    - 'Register priming: ''You will hear a research lecture / two friends chatting
      / a news report.'' Ask: What grammatical features do you expect? What connected
      speech features?'
    - 'For conversation: activate schema for the situation (ordering food, making
      plans, family dinner). Predict 5 expressions you might hear.'
    - 'For academic monologue: provide key vocabulary. Show the lecture title and
      3 questions the talk will answer.'
    - 'For news: look at a headline. Predict the 5 Ws (who, what, when, where, why).'
    source: Biber et al., Grammar of Spoken and Written English, 1.5, 2.3.5, 8.1.1,
      14.3.3
    stage: pre-listening
    teacher_tips: 'Use Biber''s register profiles as a teaching tool before listening.
      For conversation, tell learners: "Expect lots of I, you, questions, and inserts
      like oh and yeah" (GSWE 14.3.3). For lectures: "Expect complex noun phrases,
      passive constructions, and academic linking adverbials like ''on the other hand''"
      (GSWE 8.1.1, 13.2.1.1). Setting expectations about register-specific features
      reduces listening anxiety.

      '
  - activities:
    - 'First listen for gist: register identification + main message. ''What kind
      of text is this? What is it about?'''
    - Second listen for specific information using task-based comprehension questions.
    - 'Third listen for language features: learners tally occurrences of register-specific
      features (e.g., count questions in conversation; count complex noun phrases
      in a lecture).'
    source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 6.4.1,
      8.1.1
    stage: while-listening
    teacher_tips: 'For conversation listening, use a three-phase approach aligned
      with Biber''s findings: first gist, then adjacency pair tracking (questions
      matched to answers), then insert/discourse marker identification. For academic
      listening, use an outline-filling task that mirrors the hierarchical structure
      of academic prose (GSWE 6.4.1, 8.1.1).

      '
  - activities:
    - 'Register comparison: ''How was this different from [a conversation/a lecture/a
      news report]? Which grammatical features confirmed the register?'''
    - 'Feature analysis: give learners the transcript. They identify register-specific
      features (e.g., passive voice in academic text; adjacency pairs in conversation;
      time adverbials in news).'
    source: Underhill, Sound Foundations, p. 68; Biber et al., 1.5, 2.3.5
    stage: post-listening
    teacher_tips: 'Use Underhill''s post-listening "classroom analysis" technique
      with short extracts from the listening text. Select 2-3 sentences and analyze
      them for connected speech features: assimilation, elision, weak forms, linking
      (Underhill, p. 68). This makes the phonological features of the register visible
      and builds the "insight" that improves both production and reception.

      '
