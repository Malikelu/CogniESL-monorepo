activities:
- description: 'Learners listen to a 3-5 minute podcast segment weekly and write a
    3-sentence summary (topic, speaker stance, one detail). No transcript provided
    initially.

    '
  level: A2-B1
  name: Podcast gist journal
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.1-4
- description: 'Learners listen to a 30-second clip of natural speech 3 times. First
    time: underline stressed syllables. Second time: circle function words and write
    their weak forms. Third time: mark contractions and assimilations they can hear.

    '
  level: B1-B2
  name: Connected speech detective
  source: Underhill, Sound Foundations, pp. 60-67, 2685-2890
- description: 'Give learners a transcript of a conversation with discourse markers
    removed (well, so, anyway, I mean, you know, right). Learners listen and insert
    the missing markers, then explain the function of each.

    '
  level: B1-C1
  name: Discourse marker mapping
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 14.3.3.3
- description: 'Learners listen to a conversational excerpt and list all vague expressions
    (kind of, sort of, or something, stuff, like, you know). Then they categorize
    each as either (a) lexical hedge, (b) coordination tag, or (c) approximator.

    '
  level: B2-C1
  name: Tolerance of vagueness exercise
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.3, 10.3.3
cefr_range: A2-C1
citations:
- claim: Extensive listening develops automaticity through exposure to large quantities
    of comprehensible spoken input at or slightly below the learner's level
  flagged: false
  reliability: B
  source: 'Underhill (1994) Sound Foundations. Heinemann. Part 1, Level 3: Connected
    Speech, pp. 58-68'
  tier: 1
- claim: 'Conversation grammar differs substantially from written grammar: higher
    frequency of ellipsis, inserts, discourse markers, and vague language'
  flagged: false
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins.
    Ch. 14: Conversation Grammar'
  tier: 1
- claim: Swan & Smith (2001) document how L1 phonological systems affect English listening
    comprehension. Their cross-linguistic analysis shows that listeners from different
    L1 backgrounds misperceive English sounds in predictable patterns based on their
    L1 phonological inventory and phonotactic constraints.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_difficulties:
- difficulty: Learners expect dictionary pronunciation from every word
  explanation: 'Learners from syllable-timed language backgrounds (Spanish, Japanese,
    French) expect each syllable to receive roughly equal duration and clarity. English
    stress timing reduces unstressed syllables to the point where they become nearly
    inaudible. Underhill notes that "you can''t have stress without unstress" (p.
    73) \u2014 learners must train perception of prominent syllables and let the unstressed
    material remain unclear.

    '
  l1_groups:
  - Spanish
  - Japanese
  - French
  - Italian
  source: Underhill, Sound Foundations, pp. 71-72, 3132-3163
  teaching_strategy: 'Use Underhill''s volume-reduction technique: turn the volume
    down until only the high-energy (stressed) syllables are audible (p. 73). This
    reveals the rhythmic skeleton of the utterance. Then gradually restore volume
    and ask learners to identify which words correspond to the clearly-heard syllables.

    '
- difficulty: Learners cannot parse non-clausal inserts interspersed with clauses
  explanation: "Biber shows that non-clausal units (inserts like yeah, okay, oh, really?)\
    \ account for 38.6% of all units in conversation (Table 14.7). Learners who are\n\
    \ trained primarily on written text expect complete clauses and may be confused\n\
    by stand-alone interjections or fragments that are not grammatically connected\
    \ to surrounding sentences.\n"
  l1_groups:
  - Arabic
  - Chinese
  - Korean
  - Russian
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.4, 14.3.3
  teaching_strategy: 'Provide a transcript with all inserts highlighted. Play a short
    conversational exchange and ask learners to identify what each highlighted insert
    does: Does it show agreement? Surprise? Hesitation? Topic change? This builds
    pragmatic awareness of non-clausal material.

    '
- difficulty: Learners mistake rapid colloquial speech for fast careful speech
  explanation: 'Underhill distinguishes rapid colloquial speech (heavy simplification,
    words far from dictionary form) from careful colloquial speech (moderate simplification,
    closer to dictionary form). Learners who have studied with careful models may
    panic when exposed to natural rapid speech because they expect to hear forms they
    learned in isolation.

    '
  l1_groups:
  - Portuguese
  - Polish
  - Thai
  - Vietnamese
  source: Underhill, Sound Foundations, pp. 58-59, 2658-2680
  teaching_strategy: 'Graduated exposure: start with BBC World Service-style careful
    colloquial speech, then progress to TV interviews, then to informal vlogs/podcasts
    with friends talking casually. At each stage, replay a short segment at reduced
    speed first, then normal speed, so learners can hear the relationship between
    careful and rapid forms.

    '
definition: 'Extensive listening involves engaging with long-form or authentic spoken
  English for general comprehension, enjoyment, and exposure. It requires tolerance
  of ambiguity, the ability to use contextual clues, and familiarity with connected
  speech simplifications (Underhill 1994). Learners build receptive fluency by regularly
  listening to texts where the goal is global understanding rather than word-by-word
  decoding (Biber et al. 1999).

  '
description: 'Learners develop the ability to extract overall meaning from extended
  spoken texts (podcasts, interviews, stories, TV shows, YouTube videos) without needing
  to understand every word. Grounded in Biber''s finding that conversation relies
  on implicit contextual reference and Underhill''s distinction between careful and
  rapid colloquial speech.

  '
key_principles:
- explanation: 'Biber''s corpus research shows that conversation has a restricted,
    repetitive repertoire: a small number of extremely high-frequency items dominate.
    The modals will, can, would, and could are far more common than must, might, shall,
    or may (GSWE 6.6.2). Common lexical verbs like think, say, know, want dominate
    complement clauses (GSWE 9.2.2.3, 9.4.2.9). Extensive listening materials should
    expose learners to these high-frequency patterns in natural contexts so they develop
    expectations about what they will hear.

    '
  principle: Use authentic materials with high-frequency conversational features
  reliability: B
  source: Biber et al. Grammar of Spoken and Written English, 6.6.2, 9.2.2.3, 14.1.2.7
- explanation: 'Underhill identifies two useful landmarks for learners. "Careful colloquial
    speech" is slower, more deliberate, closer to dictionary pronunciation, and typical
    of settings like BBC World Service broadcasts or educational podcasts. "Rapid
    colloquial speech" contains more extensive simplifications: assimilation, elision,
    vowel reduction, and contractions. Learners should begin with careful colloquial
    models and gradually extend to rapid colloquial speech for receptive skill.

    '
  principle: Distinguish between careful colloquial speech and rapid colloquial speech
  reliability: B
  source: Underhill, Sound Foundations, pp. 59, 2658-2682
- explanation: 'Biber shows that conversation avoids elaboration and specification.
    Speakers use vague hedges (kind of, sort of, like), approximators (eightish, forty
    odd), and coordination tags (or something, stuff, and things like that) (GSWE
    14.1.2.3). Pronouns replace full noun phrases at very high frequency because speakers
    rely on shared context. Learners must be trained NOT to seek precise referents
    for every pronoun or hedge.

    '
  principle: Tolerate ambiguity and vagueness as normal features of spoken English
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.3, 10.3.3
- explanation: 'Over one-third of C-units in conversation are non-clausal (inserts,
    elliptic phrases, interjections), averaging only 1.95 words each (GSWE 14.3.1.4,
    Table 14.7). Extensive listening materials should include authentic passages where
    learners must parse a mix of clausal and non-clausal units \u2014 isolated "Yeah,"
    "Okay," "Oh no," "Really?" \u2014 and understand their discourse function without
    treating them as incomplete sentences.

    '
  principle: Build listening stamina with texts that contain non-clausal material
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.3.1.4, Table 14.7
- explanation: 'Conversation is fundamentally interactive. Biber documents that questions
    are three to four times more common in conversation than in writing, and imperatives
    are more than five times as common (GSWE 14.1.2.4, 3.13.2.5). Adjacency pairs
    (question-answer, greeting-greeting, offer-acceptance) create predictable discourse
    frames. Extensive listening practice should train learners to anticipate the second
    part of common adjacency pairs.

    '
  principle: Predict content using adjacency pairs and interactive speech patterns
  reliability: B
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.4, 3.13.2.5
- principle: 'Biber et al. (1999) GSWE Ch. 14: Extensive listening (large quantities
    of comprehensible spoken input) builds automaticity in processing connected speech
    features. Learners benefit from exposure to multiple registers (conversation,
    lectures, news, entertainment) to develop register-flexible listening.'
phonological_features:
- description: 'About fifty high-frequency function words have strong (stressed/isolated)
    and weak (unstressed/connected) forms. In connected speech, the weak forms dominate.
    Underhill shows that /\u00e6nd/ becomes /\u0259n/, /ju\u02d0/ becomes /j\u0259/,
    /h\u00e6v/ becomes /\u0259v/, and so on. These reductions are systematic and essential
    for English rhythm.

    '
  examples:
  - '"and" — strong form /ænd/ vs. weak form /ən/: "You and me" → /juː ən miː/'
  - '"of" — strong form /ɒv/ vs. weak schwa form: "a lot of people" → /ə lɒt əv piːpl/'
  - '"to" — strong form /tuː/ vs. weak form /tə/: "I want to go" → /aɪ wɒnə ɡəʊ/'
  - '"have" — strong form /hæv/ vs. weak form /əv/: "could have" → /kʊdəv/'
  - '"would" — strong form /wʊd/ vs. weak form /wəd/ or /d/: "I would go" → /aɪd ɡəʊ/'
  feature: Weak forms in connected speech
  source: Underhill, Sound Foundations, pp. 63-64, 2851-2890
- description: 'Weak forms combine with adjacent words to form single-syllable contractions.
    Pronoun+auxiliary contractions (I''m, I''ve, I''ll, I''d, they''re, they''ve,
    they''ll, can''t, don''t, wasn''t) are under-represented by their spelling. Biber
    documents that contractions with ''s/''re/''m occur over 20,000 times per million
    words in conversation.

    '
  examples:
  - '"I''m" /aɪm/, "they''re" /ðeə/, "it''s" /ɪts/, "she''s" /ʃiːz/'
  - '"I''ll" /aɪl/, "we''ll" /wiːl/, "he''ll" /hiːl/'
  - '"I''ve" /aɪv/, "we''ve" /wiːv/, "they''ve" /þev/'
  - 'Negative contractions: "can''t" /káːnt/, "don''t" /dəʊnt/, "wasnə" /wɒznt/'
  feature: Connected speech contractions
  source: Underhill, Sound Foundations, pp. 64-65; Biber et al., 14.2.2.3, Table 14.6
- description: 'Unaccented vowels reduce toward /\u0259/ (schwa). Most monophthongs
    centralize to /\u0259/ when unstressed: /i\u02d0/ \u2192 /\u026a/, /u\u02d0/ \u2192
    /\u028a/. Diphthongs lose their glide quality. This is intimately linked to English
    stress timing \u2014 reduced unstressed vowels allow speakers to compress syllables
    between stressed beats.

    '
  examples:
  - '"you and me" /juː ænd miː/ → reduced to /jə ən miː/'
  - '"I wish you would tell me" — the unstressed function words reduce dramatically'
  - Unstressed "was" → /wəz/, "from" → /frəm/, "are" → /ə/
  feature: Vowel reduction and centralization
  source: Underhill, Sound Foundations, pp. 62-63, 2795-2848
skill_area: extensive_listening
skill_name: Extensive Listening for Gist and Global Understanding
sources:
  primary: Biber, Johansson, Leech, Conrad & Finegan. Grammar of Spoken and Written
    English (1999), Chapters 13 & 14
  secondary: 'Underhill, Adrian. Sound Foundations (1994), Part 1 Level 3: Connected
    Speech'
sub_skills:
- description: 'Learners identify the main topic, speaker''s purpose, and general
    attitude from extended monologue or dialogue without catching every word.

    '
  examples:
  - 'Listen to a 5-minute podcast segment and identify: (a) the main topic, (b) whether
    the host agrees or disagrees with the guest, (c) one specific detail mentioned.'
  - Listen to a YouTube video about a daily routine and list the 4 main activities
    described.
  name: Listening for gist in podcasts and interviews
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.1-4
- description: 'Learners understand meaning from speech containing assimilation, elision,
    vowel reduction, weak forms, and contractions \u2014 all features Underhill identifies
    as systematic in connected speech.

    '
  examples:
  - '"Would you" in rapid speech becomes /wudzu/; learner understands the meaning
    despite the reduced form.'
  - '''Morning (elided from "Good morning") — learner recognizes the greeting from
    context.'
  - '"must" in "You must try it" reduces from /mʊst/ to /məs/ — learner still understands
    obligation meaning.'
  name: Tolerating connected speech reduction
  source: Underhill, Sound Foundations, pp. 60-67, 2685-2848
- description: 'Learners identify and interpret discourse markers (well, so, anyway,
    I mean, you know, right, now) that organize conversation transitions and stance,
    as Biber documents in GSWE 14.3.3.3 and 14.3.2.1.

    '
  examples:
  - '"Well" — signals a qualification or disagreement is coming ("Well, I''m not sure
    about that") (GSWE 14.3.2.1)'
  - '"So" — marks a transition to a result or new subtopic in conversation (GSWE 10.4.3.1)'
  - '"Anyway" — signals a return to a previous topic or a change of direction (GSWE
    10.4.3.1)'
  name: Recognizing high-frequency conversational discourse markers
  source: Biber et al., Grammar of Spoken and Written English, 14.3.2.1, 14.3.3.3,
    10.4.3.1
- description: 'Learners interpret interjections and response forms (oh, ah, wow,
    ooh, yeah, okay, uh huh, mm, really?) that express emotion, surprise, agreement,
    or politeness, as documented in Biber''s treatment of inserts (GSWE 14.3.3.1).

    '
  examples:
  - '"Oh" conveys surprise or news-receipt ("Oh, I didn''t know that") (GSWE 14.3.3.1)'
  - '"wow" signals surprised or impressed reaction (GSWE 14.3.3.1)'
  - '"uh huh" functions as a backchannel signal indicating the listener is following
    (GSWE 14.3.3.6)'
  name: Understanding speaker stance and attitude from inserts
  source: Biber et al., Grammar of Spoken and Written English, 14.3.3.1, 14.3.3.6
- description: 'Conversation relies heavily on contextual reference. Biber notes that
    deictic items (this, that, these, those, there, then, now) are particularly common
    in conversation because speakers share physical space and can point to things.
    Learners must use the available context \u2014 visual, prosodic, or discourse
    \u2014 to resolve deictic reference.

    '
  examples:
  - '"this damn chilli" — the speaker can physically indicate the referent (GSWE 14.1.2.2)'
  - '"those chips in there" — spatial deixis relies on shared situational knowledge
    (GSWE 14.1.2.2)'
  name: Following deictic and situational reference
  source: Biber et al., Grammar of Spoken and Written English, 14.1.2.2
teaching_approach:
  stages:
  - activities:
    - 'Activate schema: show a picture or title from the podcast/video. Ask learners
      to predict 3 things they might hear.'
    - Pre-teach 3-5 key vocabulary items that are essential for gist but cannot be
      inferred from context.
    - 'Set a gist task: ''Listen and decide if the speaker is positive or negative
      about the topic.'''
    source: Underhill, Sound Foundations, pp. 69-73; Biber et al., 14.1.2.3
    stage: pre-listening
    teacher_tips: 'Do NOT pre-teach all difficult vocabulary. The goal is to build
      tolerance of ambiguity. Underhill''s stress-timing principle means learners
      must accept that many unstressed syllables will be unclear. Focus attention
      on prominent (stressed) syllables where information is concentrated (Underhill,
      p. 70).

      '
  - activities:
    - 'First listen: answer the gist question only. No pausing.'
    - 'Second listen: identify the main sub-topics or events in order.'
    - 'Third listen: capture 2-3 specific details (names, numbers, places).'
    - 'In pairs: compare what each person understood. Fill in gaps collaboratively.'
    source: Biber et al., Grammar of Spoken and Written English, 14.2; Underhill,
      pp. 59, 73
    stage: while-listening
    teacher_tips: 'Use the three-listen progression to move from gist to detail. Biber
      shows that conversation contains significant dysfluency (false starts, repeats,
      retrace-and-repair) and learners need to hear the same material multiple times
      to develop strategies for filtering out disfluencies (GSWE 14.2).

      '
  - activities:
    - 'Discussion: ''What surprised you? What was difficult to follow and why?'''
    - 'Transcript analysis: give learners the transcript. Underline 5 examples of
      connected speech features (weak forms, contractions, elision).'
    - 'Reflection: learners note 3 discourse markers from the text and explain their
      function.'
    source: Underhill, Sound Foundations, p. 68; Biber et al., 14.3.3
    stage: post-listening
    teacher_tips: 'Post-listening is where Underhill''s recommended "classroom analysis
      of small samples" (one or two sentences from the listening) can make connected
      speech features visible. Point out assimilation, elision, and vowel reduction
      that affected comprehension (Underhill, p. 68).

      '
