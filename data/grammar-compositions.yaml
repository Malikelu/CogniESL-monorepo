        level_min: B1
        label: Negative Questions — Future Will
        cross_cutting_source: negative_questions
        structure: Won't + subject + base verb?
        examples:
          - Won't you come?
          - Won't she join us?
          - Won't they arrive on time?
          - Why won't he help?
      - topic: subject_object_questions
        level_min: A2
        label: Subject & Object Questions — Future Will
        cross_cutting_source: subject_questions
        structure: 'Subject: Who/What + will + verb? / Object: Who/What + will + subject
          + verb?'
        examples:
          - 'Subject: Who will come? / Object: Who will you invite?'
          - 'Subject: What will happen? / Object: What will you do?'
          - 'Subject: Which team will win? / Object: Which team will you support?'
      - topic: passive_voice
        level_min: A2
        label: Passive Voice — Future Will
        cross_cutting_source: passive_basic
        structure: Subject + will + be + past participle (by agent)
        examples:
          - The house will be sold.
          - The letters will be sent tomorrow.
          - The work will be completed by Friday.
          - All tickets will be reserved.
      - topic: indirect_questions
        level_min: B2
        label: Indirect Questions — Future Will
        cross_cutting_source: indirect_questions
        structure: Question word + subject + will + verb (statement order)
        examples:
          - Can you tell me where he will go?
          - Do you know what she will do?
          - I wonder why they will leave.
          - Could you explain how it will work?
