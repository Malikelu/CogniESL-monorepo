  # ─── MODALS (GENERAL) ─────────────────────────────────────────────────────
      - topic: negative_questions
        level_min: B1
        label: Negative Questions — Will/Would for Habits
        cross_cutting_source: negative_questions
        structure: Wouldn't + subject + base verb?
        examples:
          - Wouldn't he always arrive late?
          - Wouldn't she always call at midnight?
          - Wouldn't they always sit together?
          - Why wouldn't he ever help?
      - topic: subject_object_questions
        level_min: A2
        label: Subject & Object Questions — Will/Would for Habits
        cross_cutting_source: subject_questions
        structure: 'Subject: Who/What + would + verb? / Object: Who/What + would +
          subject + verb?'
        examples:
          - 'Subject: Who would always arrive first? / Object: Who would you always
            meet?'
          - 'Subject: What would happen? / Object: What would you do when that happened?'
      - topic: passive_voice
        level_min: A2
        label: Passive Voice — Will/Would for Habits
        cross_cutting_source: passive_basic
        structure: Subject + would + be + past participle (habitual passive — 
          rare)
        examples:
          - The car would always be parked outside.
          - The door would always be locked by 10pm.
      - topic: indirect_questions
        level_min: B2
        label: Indirect Questions — Will/Would for Habits
        cross_cutting_source: indirect_questions
        structure: Question word + would + subject + verb (statement order)
        examples:
          - Can you tell me where he would always go?
          - I wonder what she would do when it rained.
          - Do you know why they would always fight?
  - base: modals
    topics:
      - topic: wh_questions
        level_min: A1
        label: "WH Questions — Modals"
        cross_cutting_source: question_forms
        structure: "Wh- word + modal + subject + base verb?"
        examples:
          - "What can you do?"
          - "Where should she go?"
          - "When must you leave?"
          - "Who could help us?"
          - "Why might he be late?"
          - "How should they respond?"
      - topic: short_answers
        level_min: A1
        label: "Short Answers — Modals"
        cross_cutting_source: question_forms
        structure: "Yes/No, subject + modal / modal + not."
        examples:
          - "Can you swim? — Yes, I can. / No, I can't."
          - "Should she go? — Yes, she should. / No, she shouldn't."
          - "Must you leave? — Yes, I must. / No, I don't have to."
          - "Could they help? — Yes, they could. / No, they couldn't."
      - topic: question_tags
        level_min: A2
        label: "Question Tags — Modals"
        cross_cutting_source: question_tags
        structure: "Positive statement + modal + n't + pronoun? / Negative statement
          + modal + pronoun?"
        examples:
          - "You can swim, can't you?"
          - "She should call, shouldn't she?"
          - "They could help, couldn't they?"
          - "He won't forget, will he?"

