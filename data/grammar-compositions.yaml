# grammar-compositions.yaml
# Cross-cutting grammar structures registry for CogniESL
#
# Maps each base grammar point to the cross-cutting structures that belong in its lesson:
#   - wh_questions   (A1): WH question formation specific to this tense
#   - short_answers  (A1): Short answer formation specific to this tense
#   - question_tags  (A2): Question tag formation specific to this tense
#
# DESIGN PRINCIPLE (Solution C):
#   - This file is the ONLY place composition mappings live. Never add them to individual
#     grammar YAML files — that would scatter the same concept across 20+ files.
#   - The tense-specific structure and examples live HERE.
#   - The pedagogical depth (CCQs, teaching tips, common errors) lives in the
#     cross-cutting YAML files: question_forms.yaml and question_tags.yaml.
#   - slide_plan.py reads this registry and merges both sources into each task brief.
#
# To add a new cross-cutting structure (e.g., passive, reported speech):
#   1. Create or confirm the cross-cutting YAML exists in data/grammar/
#   2. Add a new topic entry to each affected base grammar point below
#   3. No changes needed to any existing grammar YAML or to slide_plan.py logic
#
# cross_cutting_source values must match filenames in data/grammar/ (without .yaml)

compositions:

  # ─── PRESENT SIMPLE ───────────────────────────────────────────────────────
  - base: present_simple
    topics:
      - topic: wh_questions
        level_min: A1
        label: "WH Questions — Present Simple"
        cross_cutting_source: question_forms
        structure: "Wh- word + do/does + subject + base verb?"
        examples:
          - "What do you eat for breakfast?"
          - "Where does she work?"
          - "Who do you live with?"
          - "When does the train leave?"
          - "Why does he study English?"
          - "How do they get to school?"
      - topic: short_answers
        level_min: A1
        label: "Short Answers — Present Simple"
        cross_cutting_source: question_forms
        structure: "Yes/No, subject + do/does / don't/doesn't."
        examples:
          - "Do you like coffee? — Yes, I do. / No, I don't."
          - "Does she work here? — Yes, she does. / No, she doesn't."
          - "Do they speak French? — Yes, they do. / No, they don't."
          - "Does he drive? — Yes, he does. / No, he doesn't."
      - topic: question_tags
        level_min: A2
        label: "Question Tags — Present Simple"
        cross_cutting_source: question_tags
        structure: "Positive statement + don't/doesn't + pronoun? / Negative statement
          + do/does + pronoun?"
        examples:
          - "You like coffee, don't you?"
          - "She works here, doesn't she?"
          - "They don't eat meat, do they?"
          - "He doesn't drive, does he?"

  # ─── PAST SIMPLE ──────────────────────────────────────────────────────────
      - topic: negative_questions
        level_min: B1
        label: Negative Questions — Present Simple
        cross_cutting_source: negative_questions
        structure: Don't/Doesn't + subject + base verb?
        examples:
          - Don't you like coffee?
          - Doesn't she work here?
          - Don't they speak English?
          - Why doesn't he study harder?
      - topic: subject_object_questions
        level_min: A2
        label: Subject & Object Questions — Present Simple
        cross_cutting_source: subject_questions
        structure: 'Subject: Who/What + verb (no auxiliary) / Object: Who/What + do/does
          + subject + verb?'
        examples:
          - 'Subject: Who lives here? / Object: Who do you live with?'
          - 'Subject: What happened? / Object: What do you want?'
          - 'Subject: Which bus goes downtown? / Object: Which bus do you take?'
      - topic: passive_voice
        level_min: A2
        label: Passive Voice — Present Simple
        cross_cutting_source: passive_basic
        structure: Subject + am/is/are + past participle (by agent)
        examples:
          - Rice is grown in many countries.
          - English is spoken worldwide.
          - The window is cleaned every week.
          - These books are sold in shops.
      - topic: indirect_questions
        level_min: B2
        label: Indirect Questions — Present Simple
        cross_cutting_source: indirect_questions
        structure: Question word + subject + verb (statement order)
        examples:
          - Can you tell me where he lives?
          - Do you know what she does?
          - I wonder why they leave so early.
          - Could you explain how this works?
