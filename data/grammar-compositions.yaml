# grammar-compositions.yaml
# Cross-cutting grammar structures registry for CogniESL
#
# Maps each base grammar point to the cross-cutting structures that belong in its lesson:
#   - wh_questions   (A1): WH question formation specific to this tense
#   - short_answers  (A1): Short answer formation specific to this tense
#   - question_tags  (A2): Question tag formation specific to this tense
#
# DESIGN PRINCIPLE (Solution C):
#   - This file is the ONLY place composition mappings live. Never add them to individual
#     grammar YAML files — that would scatter the same concept across 20+ files.
#   - The tense-specific structure and examples live HERE.
#   - The pedagogical depth (CCQs, teaching tips, common errors) lives in the
#     cross-cutting YAML files: question_forms.yaml and question_tags.yaml.
#   - slide_plan.py reads this registry and merges both sources into each task brief.
#
# To add a new cross-cutting structure (e.g., passive, reported speech):
#   1. Create or confirm the cross-cutting YAML exists in data/grammar/
#   2. Add a new topic entry to each affected base grammar point below
#   3. No changes needed to any existing grammar YAML or to slide_plan.py logic
#
# cross_cutting_source values must match filenames in data/grammar/ (without .yaml)

compositions:

  # ─── PRESENT SIMPLE ───────────────────────────────────────────────────────
  - base: present_simple
    topics:
      - topic: wh_questions
        level_min: A1
        label: "WH Questions — Present Simple"
        cross_cutting_source: question_forms
        structure: "Wh- word + do/does + subject + base verb?"
        examples:
          - "What do you eat for breakfast?"
          - "Where does she work?"
          - "Who do you live with?"
          - "When does the train leave?"
          - "Why does he study English?"
          - "How do they get to school?"
      - topic: short_answers
        level_min: A1
        label: "Short Answers — Present Simple"
        cross_cutting_source: question_forms
        structure: "Yes/No, subject + do/does / don't/doesn't."
        examples:
          - "Do you like coffee? — Yes, I do. / No, I don't."
          - "Does she work here? — Yes, she does. / No, she doesn't."
          - "Do they speak French? — Yes, they do. / No, they don't."
          - "Does he drive? — Yes, he does. / No, he doesn't."
      - topic: question_tags
        level_min: A2
        label: "Question Tags — Present Simple"
        cross_cutting_source: question_tags
        structure: "Positive statement + don't/doesn't + pronoun? / Negative statement + do/does + pronoun?"
        examples:
          - "You like coffee, don't you?"
          - "She works here, doesn't she?"
          - "They don't eat meat, do they?"
          - "He doesn't drive, does he?"

  # ─── PAST SIMPLE ──────────────────────────────────────────────────────────
  - base: past_simple
    topics:
      - topic: wh_questions
        level_min: A1
        label: "WH Questions — Past Simple"
        cross_cutting_source: question_forms
        structure: "Wh- word + did + subject + base verb?"
        examples:
          - "What did you do yesterday?"
          - "Where did she go last night?"
          - "Who did you meet at the party?"
          - "When did it happen?"
          - "Why did he leave early?"
          - "How did they get here?"
      - topic: short_answers
        level_min: A1
        label: "Short Answers — Past Simple"
        cross_cutting_source: question_forms
        structure: "Yes/No, subject + did / didn't."
        examples:
          - "Did you go to school? — Yes, I did. / No, I didn't."
          - "Did she call you? — Yes, she did. / No, she didn't."
          - "Did they finish? — Yes, they did. / No, they didn't."
          - "Did he win? — Yes, he did. / No, he didn't."
      - topic: question_tags
        level_min: A2
        label: "Question Tags — Past Simple"
        cross_cutting_source: question_tags
        structure: "Positive statement + didn't + pronoun? / Negative statement + did + pronoun?"
        examples:
          - "You went to school yesterday, didn't you?"
          - "She called you, didn't she?"
          - "They left early, didn't they?"
          - "He didn't come, did he?"

  # ─── PRESENT CONTINUOUS ───────────────────────────────────────────────────
  - base: present_continuous
    topics:
      - topic: wh_questions
        level_min: A1
        label: "WH Questions — Present Continuous"
        cross_cutting_source: question_forms
        structure: "Wh- word + am/is/are + subject + verb-ing?"
        examples:
          - "What are you doing right now?"
          - "Where is she going?"
          - "Who are they meeting?"
          - "Why are you crying?"
          - "When are they leaving?"
          - "How are you feeling?"
      - topic: short_answers
        level_min: A1
        label: "Short Answers — Present Continuous"
        cross_cutting_source: question_forms
        structure: "Yes/No, subject + am/is/are / 'm not/isn't/aren't."
        examples:
          - "Are you working? — Yes, I am. / No, I'm not."
          - "Is she coming? — Yes, she is. / No, she isn't."
          - "Are they waiting? — Yes, they are. / No, they aren't."
          - "Am I interrupting? — Yes, you are. / No, you aren't."
      - topic: question_tags
        level_min: A2
        label: "Question Tags — Present Continuous"
        cross_cutting_source: question_tags
        structure: "Positive statement + isn't/aren't + pronoun? / Negative statement + is/are + pronoun?"
        examples:
          - "You're leaving, aren't you?"
          - "She's working, isn't she?"
          - "They aren't coming, are they?"
          - "He isn't sleeping, is he?"

  # ─── PAST CONTINUOUS ──────────────────────────────────────────────────────
  - base: past_continuous
