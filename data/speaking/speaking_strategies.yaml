activities:
- name: Communication Strategy Training
  description: 'Teach students strategies for dealing with communication breakdowns:
    paraphrase, appeal for help, approximation.'
  level: B1-C2
  source: Peregoy & Boyle (2023) Ch. 6
  type: speaking
- name: Compensation Strategy Practice
  description: Students describe objects whose name they do not know, practicing circumlocution.
  level: A2-B2
  source: Swan (2016) PEU
  type: speaking
assessment:
  rubric_criteria:
  - Strategy use effectiveness
  - Communication repair ability
  - Compensation strategy range
  task_types:
  - Communication breakdown scenarios
  - Structured problem-solving tasks
  source: Peregoy & Boyle (2023) Ch. 6
cefr_range: A2-C2
citations:
- claim: develops speaking competence through structured speaking strategies tasks
  flagged: false
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
  tier: 2
- claim: Swan & Smith (2001) document L1-specific speaking patterns
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
  tier: 2
common_difficulties:
- difficulty: Overuse of avoidance
  cause: Changing or abandoning the message instead of using compensation strategies
  solution: Explicit strategy training with modeling and practice
- difficulty: L1-based strategies
  cause: Transferring L1 communication strategies that dont work in English
  solution: Raise awareness of strategy appropriateness across cultures
definition: Speaking strategies are the techniques learners use to maintain communication
  despite limitations in their linguistic knowledge.
description: 'Strategic competence enables learners to compensate for gaps in knowledge.
  Key strategies include: paraphrasing, using fillers, asking for clarification, appealing
  for help, and adjusting the message. Dornyei (1995) categorizes these into avoidance,
  achievement, and stalling strategies.'
key_principles:
- principle: Balance fluency with accuracy in speaking instruction
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Provide models of natural speech before production
  reliability: B
  source: Swan (2016) PEU
- principle: Use task-based approaches for meaningful communication
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Give feedback on both fluency and accuracy
  reliability: B
  source: Parrott (2010) Grammar for English Language Teachers
- principle: 'Biber et al. (1999) GSWE Ch. 14: Conversation strategies include topic
    management (topic initiation, shift, and closure), turn-taking (turn construction,
    transition relevance places, overlap management), and backchanneling (uh-huh,
    yeah, right, okay). These are crucial for communicative competence.'
l1_interference: []
l1_profiles: []
pronunciation_focus: []
skill_area: speaking_strategies
skill_name: Speaking Strategies
sources:
  primary: Peregoy & Boyle (2023) Ch. 6
  secondary:
  - Dornyei, Z. (1995). On the teachability of communication strategies. TESOL Quarterly,
      29(1), 55-85.
sub_skills:
- Circumlocution
- Appeal for assistance
- Fillers and hesitation devices
- Self-repair
- Message adjustment
teaching_approach: Teach strategies explicitly. Model their use in context. Provide
  scaffolded practice from recognition to production.
