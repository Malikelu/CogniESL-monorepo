teaching_approach: 'Use a fluency-first approach with gradual accuracy focus. Start
  with timed

  repeated tasks on familiar topics (4/3/2 technique). Teach and model hesitation

  devices and discourse markers explicitly. Provide models of natural speech.

  Gradually introduce accuracy requirements as fluency develops.'
