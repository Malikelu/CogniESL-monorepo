common_difficulties:
- difficulty: Students pause excessively while searching for words
  cause: Limited lexical access speed
  solution: Practice timed retrieval activities and lexical chunk learning
- difficulty: Students produce short, hesitant turns
  cause: Lack of discourse management skills
  solution: Teach gambits (Well, Actually, The thing is) and turn-taking strategies
definition: Oral fluency is the ability to speak smoothly, at natural speed, with
  minimal hesitation or pausing. It is distinct from accuracy — a fluent speaker may
  still make errors but maintains communicative flow.
description: 'Fluency development focuses on helping learners speak at a natural pace
  with minimal pausing. Key approaches include: (1) repeated practice on the same
  topic under time pressure (4/3/2 technique), (2) extensive speaking opportunities
  on familiar topics, (3) teaching of hesitation devices and fillers, and (4) developing
  automaticity in lexical retrieval. Peregoy & Boyle (2023) emphasize that fluency
  is best developed through meaningful communicative tasks rather than mechanical
  drills.'
key_principles:
- principle: 'Biber et al. (1999) GSWE Ch. 2.5: Inserts (well, oh, yeah, uh-huh, hm)
    are a newly recognized word category. They do not form syntactic structures but
    carry emotional and interactional meanings. They are especially frequent in
    conversation and are more varied than traditional interjections.'
- principle: Balance fluency activities (free production) with accuracy
    (controlled practice)
  reliability: B
  source: 'Nation, I.S.P. (2013). Learning Vocabulary in Another Language, 2nd ed.
    Cambridge University Press.'
- principle: 'Teach spoken discourse features: turn-taking, hesitation devices, and
    back-channeling'
  reliability: B
  source: 'McCarthy, M. & O''Dell, F. (2017). English Vocabulary in Use, 4th ed.
    Cambridge University Press.'
- principle: Provide models of natural speech before asking learners to produce
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- principle: Encourage self-correction and peer feedback through structured speaking
    tasks
  reliability: B
  source: Parrott (2010) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
- principle: 'Biber et al. (1999) GSWE Ch. 14: Conversation grammar features ellipsis
    (dropped subjects, reduced forms), inserts (well, oh, uh, um), hesitation devices
    (I mean, you know, like), and discourse markers (well, so, anyway). These features
    are unique to spoken English and rarely taught in written-focused grammar instruction.'
