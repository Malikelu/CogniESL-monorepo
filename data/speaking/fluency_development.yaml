activities:
- name: Reader's Theater
  description: Students rehearse and perform a script based on a book they have read,
    focusing on expressive oral reading.
  level: A2-C1
  source: Peregoy and Boyle (2023) Ch.5, pp. 150-155
  type: fluency, reading
- name: Drama and Role Play
  description: Students act out scenarios using functional language appropriate to
    the context. Develops fluency through repeated practice in meaningful contexts.
  level: A1-B2
  source: Peregoy and Boyle (2023) Ch.5, pp. 145-150
  type: fluency, functional
- name: Choral Reading and Recitation
  description: Groups read aloud together, focusing on rhythm, intonation, and expression.
    Builds confidence and oral fluency through supportive group practice.
  level: A1-B1
  source: Peregoy and Boyle (2023) Ch.5, pp. 140-145
  type: fluency, pronunciation
- description: Students speak for 1-2 minutes on a familiar topic without pauses.
    Track words per minute and reduce pauses over repeated attempts.
  level: A2-B2
  name: 4/3/2 Technique (Maurice 1983)
  source: 'Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed. Pearson.
    Ch. 5: Oral English Development for Multilingual Learners'
  type: fluency
- description: Students discuss a familiar topic in pairs. Each student speaks for
    1 minute while partner listens. Rotate partners.
  level: A2-B1
  name: Timed Pair Discussions
  source: Peregoy & Boyle (2023) Ch. 5, pp. 170-185
  type: fluency
- description: Students retell a story or sequence of events from prompts. Focus on
    smooth delivery rather than accuracy.
  level: A2-C1
  name: Story Retelling
  source: Peregoy & Boyle (2023) Ch. 6
  type: fluency, narrative
assessment:
- source: 'Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
    Pearson. Ch. 5: Oral English Development for Multilingual Learners, pp. 155-168'
  task_types:
  - 'Fluency rating scales: rate speed, pause frequency, hesitation patterns on a
    1-5 scale'
  - Words per minute counts in timed speaking samples
  - Pause-to-speech ratio analysis
  rubric_criteria:
  - Speaking rate and flow
  - Pause frequency and duration
  - Use of fillers and hesitation devices
  - Ability to sustain extended turns
cefr_range: A1-C2
