activities:
- name: Oral Proficiency Interview
  description: Teacher conducts a structured interview following ACTFL guidelines
    to assess overall speaking ability.
  level: B1-C2
  source: Peregoy & Boyle (2023) Ch. 5, pp. 192-200
  type: speaking
- name: Peer Assessment Rubric
  description: Students assess each other's presentations using a simple rubric covering
    content, delivery, and language.
  level: A2-C1
  source: Peregoy & Boyle (2023) Ch. 6
  type: speaking
assessment:
  rubric_criteria:
  - Comprehension — ability to understand classroom speech
  - Fluency — smoothness, flow, and naturalness of speech
  - Vocabulary — range and precision of word choice
  - Pronunciation — clarity, intelligibility, and accent
  - Grammar — accuracy of morphological and syntactic forms
  task_types:
  - Oral interviews
  - Role-plays
  - Presentations
  - Group discussions
  - Peer assessment
  source: 'Peregoy and Boyle (2023) Ch.5, pp. 160-168: SOLOM (Student Oral Language
    Observation Matrix)'
cefr_range: A1-C2
citations:
- claim: develops speaking competence through structured speaking assessment tasks
  flagged: false
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 5, pp. 192-200
  tier: 2
- claim: Swan & Smith (2001) document L1-specific speaking patterns
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
  tier: 2
common_difficulties:
- difficulty: Anxiety affects performance
  cause: Test anxiety lowers speaking performance
  solution: Use familiar topics and provide warm-up time
- difficulty: Assessor bias
  cause: Subjective ratings vary across assessors
  solution: Use rubrics with clear descriptors and calibrate assessors
definition: 'Speaking assessment evaluates a learner''s ability to communicate orally
  across multiple dimensions: fluency, accuracy, range, coherence, and interactional
  competence.'
description: 'Speaking assessment covers both formative (ongoing classroom observation)
  and summative (formal testing) approaches. Key considerations include: (1) distinguishing
  fluency from accuracy, (2) assessing interactional competence, (3) using task-based
  assessment, and (4) providing constructive feedback.'
key_principles:
- principle: Balance fluency with accuracy in speaking instruction
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Provide models of natural speech before production
  reliability: B
  source: Swan (2016) PEU
- principle: Use task-based approaches for meaningful communication
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Give feedback on both fluency and accuracy
  reliability: B
  source: Parrott (2010) Grammar for English Language Teachers
- principle: 'Biber et al. (1999) GSWE Ch. 14: Speaking assessment criteria should
    evaluate conversation-specific features: fluency (smoothness, rate, hesitation
    patterns), interactional competence (turn-taking, topic management), and register
    awareness (formal vs informal choices). These differ from written assessment criteria.'
l1_interference: []
l1_profiles: []
pronunciation_focus: []
skill_area: speaking_assessment
skill_name: Speaking Assessment
sources:
  primary: Peregoy & Boyle (2023) Ch. 5, pp. 192-200
sub_skills:
- Oral fluency rating
- Accuracy assessment
- Interactional competence
- Pronunciation evaluation
teaching_approach: 'Use task-based assessment with clear rubrics. Assess speaking
  in multiple contexts: individual, paired, and group. Separate fluency from accuracy
  scores.'
