activities:
- name: Functional Language Drills
  description: Students practice specific speech acts (requesting, apologizing, inviting)
    in controlled then freer practice.
  level: A2-B2
  source: Peregoy & Boyle (2023) Ch. 6
  type: speaking
- name: Role-Play Scenarios
  description: Students act out common social situations requiring specific language
    functions (ordering food, making appointments).
  level: A2-B2
  source: Swan (2016) PEU
  type: speaking
assessment:
  rubric_criteria:
  - Function appropriateness
  - Register awareness
  - Politeness strategies
  task_types:
  - Role-play assessment
  - Discourse completion tasks
  source: Peregoy & Boyle (2023) Ch. 6
cefr_range: A1-C2
citations:
- claim: develops speaking competence through structured speaking functions tasks
  flagged: false
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
  tier: 2
- claim: Swan & Smith (2001) document L1-specific speaking patterns
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
  tier: 2
common_difficulties:
- difficulty: Register confusion
  cause: Using informal language in formal contexts
  solution: Explicitly teach formal/informal distinctions with examples
- difficulty: Pragmatic transfer
  cause: L1 politeness strategies transferred to English
  solution: Contrastive pragmatics awareness activities
definition: 'Speaking functions are the communicative purposes for which language
  is used: requesting, apologizing, inviting, refusing, complaining, complimenting,
  and advising.'
description: Teaching speaking functions involves helping learners map language forms
  to communicative purposes. Each function has typical exponents ranging from formal
  to informal. Learners need to understand appropriacy — which form to use in which
  social context.
key_principles:
- principle: Balance fluency with accuracy in speaking instruction
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Provide models of natural speech before production
  reliability: B
  source: Swan (2016) PEU
- principle: Use task-based approaches for meaningful communication
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Give feedback on both fluency and accuracy
  reliability: B
  source: Parrott (2010) Grammar for English Language Teachers
- principle: 'Biber et al. (1999) GSWE Ch. 14: Speech functions in conversation include
    questions (interrogative tags, declarative questions), directives (imperatives,
    let''''s, why don''''t), commissives (offers, promises), and expressives (thanks,
    apologies, compliments). Register varies by participant relationship and setting.'
l1_interference: []
l1_profiles: []
pronunciation_focus: []
skill_area: speaking_functions
skill_name: Speaking Functions
sources:
  primary: 'Halliday, M.A.K. (1975). Learning How to Mean. London: Edward Arnold.
    Cited in Peregoy and Boyle (2023) Ch.5'
sub_skills:
- Instrumental — language to get things done (I want, I need)
- Regulatory — language to control behavior (Stop that, Follow me)
- Interactional — language to form relationships (Hello, Thank you)
- Personal — language to express identity (I think, I feel)
- Heuristic — language to explore and learn (What is, Why does)
- Imaginative — language to create and pretend (Let us pretend)
- Representational — language to convey information (The fact is)
- Divertive — language for humor and entertainment
teaching_approach: Teach functions through contextualized examples. Start with the
  most frequent functions (requesting, apologizing). Progress from controlled to free
  practice.
