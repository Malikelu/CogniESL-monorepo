activities:
- name: Contrastive Pronunciation Drills
  description: Target specific phonemes that L1 speakers find difficult (e.g., minimal
    pairs for /b/ vs /v/ for Spanish speakers).
  level: A2-C1
  source: Underhill (1994) Sound Foundations
  type: speaking
- name: L1-Aware Feedback Sessions
  description: Record students speaking and provide feedback focused on L1-specific
    interference patterns.
  level: B1-C2
  source: Swan & Smith (2001) Learner English
  type: speaking
assessment:
  rubric_criteria:
  - L1 interference awareness
  - Self-correction ability
  - Target-like production
  task_types:
  - Error analysis journals
  - Recorded speech analysis
  source: Swan & Smith (2001)
cefr_range: A2-C2
citations:
- claim: develops speaking competence through structured l1 interference in speaking
    tasks
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: Swan & Smith (2001) document L1-specific speaking patterns
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
  tier: 2
common_difficulties:
- difficulty: Phonemic substitution
  cause: Using L1 phonemes for non-existent L2 phonemes
  solution: Use minimal pair drills and articulatory descriptions
- difficulty: Prosodic transfer
  cause: L1 intonation patterns carried to English
  solution: Teach English stress-timed rhythm explicitly
definition: L1 interference in speaking refers to the transfer of phonological, syntactic,
  and discourse patterns from a learner's native language to their spoken English.
description: Each L1 group faces different speaking challenges. Spanish speakers struggle
  with /b/ vs /v/, Japanese speakers with /l/ vs /r/, Mandarin speakers with final
  consonants. Systematic contrastive analysis helps teachers anticipate and address
  these patterns.
key_principles:
- principle: Balance fluency with accuracy in speaking instruction
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Provide models of natural speech before production
  reliability: B
  source: Swan (2016) PEU
- principle: Use task-based approaches for meaningful communication
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Give feedback on both fluency and accuracy
  reliability: B
  source: Parrott (2010) Grammar for English Language Teachers
- principle: 'Biber et al. (1999) GSWE Ch. 14: L1 transfer in speaking manifests in
    pause placement, intonation patterns, discourse marker usage, and turn-taking
    conventions. These are harder to remediate than grammar errors because they operate
    below conscious awareness and vary significantly across L1s.'
