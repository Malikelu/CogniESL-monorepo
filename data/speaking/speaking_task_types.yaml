activities:
- name: Information Gap
  description: Each student has different information. They must speak to complete
    the task.
  level: A2-B2
  source: Peregoy & Boyle (2023) Ch. 6
  type: speaking
- name: Debate and Discussion
  description: Students take positions on topics and defend them using argumentative
    discourse.
  level: B2-C2
  source: Peregoy & Boyle (2023) Ch. 5, pp. 185-190
  type: speaking
- name: Presentation with Q&A
  description: Students prepare and deliver short presentations, then answer audience
    questions.
  level: B1-C2
  source: Peregoy & Boyle (2023) Ch. 6
  type: speaking
assessment:
  rubric_criteria:
  - Task completion
  - Interaction management
  - Coherence
  - Fluency
  task_types:
  - Information gap tasks
  - Role-plays
  - Presentations
  - Debates
  - Interviews
  source: Peregoy & Boyle (2023) Ch. 6
cefr_range: A1-C2
citations:
- claim: develops speaking competence through structured speaking task types tasks
  flagged: false
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
  tier: 2
- claim: Swan & Smith (2001) document L1-specific speaking patterns
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
  tier: 2
common_difficulties:
- difficulty: Task avoidance
  cause: Students revert to L1 during pair work
  solution: Set clear English-only time limits and monitor actively
- difficulty: Uneven participation
  cause: One student dominates pair/group work
  solution: Assign specific roles and rotate them
definition: Speaking task types are the different formats and activity structures
  used to elicit spoken language from learners.
description: 'Different task types elicit different kinds of speaking: presentation
  (monologic), discussion (dialogic), role-play (interactive). Each develops different
  sub-skills. A balanced speaking curriculum includes all types.'
key_principles:
- principle: Balance fluency with accuracy in speaking instruction
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Provide models of natural speech before production
  reliability: B
  source: Swan (2016) PEU
- principle: Use task-based approaches for meaningful communication
  reliability: B
  source: Peregoy & Boyle (2023) Ch. 6
- principle: Give feedback on both fluency and accuracy
  reliability: B
  source: Parrott (2010) Grammar for English Language Teachers
- principle: 'Biber et al. (1999) GSWE Ch. 14: Conversation tasks in pedagogical contexts
    should reflect real spoken language features: information gap tasks (requiring
    negotiation), opinion gap tasks (requiring justification), and reasoning gap tasks
    (requiring inference). These promote authentic interaction patterns.'
l1_interference: []
l1_profiles: []
pronunciation_focus: []
skill_area: speaking_task_types
skill_name: Speaking Task Types
sources:
  primary: Peregoy & Boyle (2023) Ch. 6
sub_skills:
- Presentation skills
- Discussion management
- Role-play performance
- Negotiation of meaning
teaching_approach: Select task types based on learner level and objective. Progress
  from controlled (drills) to freer (discussions). Provide clear task frames and language
  support.
