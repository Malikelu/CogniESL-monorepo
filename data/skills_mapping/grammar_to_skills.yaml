      - suggesting
      - speculating
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/might.yaml
  grammar_point: might
  l1_notes:
  - language: German
    skill_impact: German 'könnte' maps onto 'might.' German speakers may understand
      the concept.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - '''Might'' is often interchangeable with ''may'' in speech'
      relevance: Appears in conversation for speculation. 'Might' reduces to /maɪt/
        in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in academic writing, news, and formal texts. 'Might' for possibility
        and hedging.
      source: Biber et al., GSWE 6.6.2
      text_types:
      - academic
      - news
      - formal writing
    speaking:
      functions:
      - expressing possibility
      - hedging
      - speculating
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - academic essays
      - news
      - formal reports
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/will_would_habits.yaml
  grammar_point: will_would_habits
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses present tense for habits. Spanish speakers may not
      recognize 'will' for habitual meaning.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - '''Will'' for habits vs. future must be distinguished by context'
      relevance: Appears in conversation for describing habits.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Found in narrative and descriptive writing. 'Will' for present habits,
        'would' for past habits.
      source: Biber et al., GSWE 6.3.2
      text_types:
      - narrative
      - descriptive writing
    speaking:
      functions:
      - describing habits
      - characterizing behavior
      - reminiscing
      source: Biber et al., GSWE 6.3.2
    writing:
      genres:
      - narrative
      - descriptive writing
      source: Biber et al., GSWE 6.3.2
- grammar_file: data/grammar/would_like.yaml
  grammar_point: would_like
  l1_notes:
  - language: French
    skill_impact: French 'voudrais' maps onto 'would like.' Positive transfer helps
      production.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - '''Would like'' vs. ''like'' must be distinguished: desire vs. enjoyment'
      relevance: Very common in conversation for polite requests.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in dialogue, informal writing, and service contexts. 'Would
        like' for polite requests and desires.
      source: Biber et al., GSWE 6.6.2
      text_types:
      - dialogue
      - informal writing
      - service contexts
    speaking:
      functions:
      - making polite requests
      - expressing desires
      - ordering
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - dialogue
      - informal writing
      - service contexts
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/another_other_others.yaml
  grammar_point: another_other_others
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'otro' covers both 'another' and 'other.' Spanish speakers
      may confuse the two.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - '''Another'' vs. ''other'' must be distinguished by position and meaning'
      relevance: Appears in conversation for referring to additional or different
        items.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'Another' (one more), 'other' (different),
        'others' (additional).
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - referring to additional items
      - contrasting
      - generalizing
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/some_any.yaml
  grammar_point: some_any
  l1_notes:
  - language: French
    skill_impact: French 'des' covers both 'some' and 'any.' French speakers may not
      distinguish the two.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - '''Some'' in questions (offers/requests) vs. ''any'' must be distinguished
        by context'
      relevance: Very common in conversation. Weak forms may obscure the distinction.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'Some' in affirmative, 'any' in negative
        and questions.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - quantifying
      - offering
      - requesting
      - negating
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/much_many.yaml
  grammar_point: much_many
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin does not distinguish 'much' and 'many.' Mandarin speakers
      may use 'much' with count nouns.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - '''Much'' vs. ''many'' depends on countability; ''a lot of'' is used for both
        in informal speech'
      relevance: Very common in conversation. Weak forms may obscure the distinction.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'Much' for uncountable, 'many' for countable
        nouns.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - quantifying
      - asking about amounts
      - comparing
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/collocations.yaml
  grammar_point: collocations
  l1_notes:
  - language: German
    skill_impact: German collocations often differ from English. German speakers may
      transfer L1 collocations.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Learners may not recognize collocations as fixed chunks; word-by-word processing
        slows comprehension
      relevance: Very common in conversation. Collocations are processed as chunks
        by native speakers.
      source: Underhill, Sound Foundations, pp. 60-67
    reading:
      relevance: Common in all text types. Collocations (make a decision, heavy rain)
        are essential for natural language.
      source: Biber et al., GSWE 8.2.1
      text_types:
      - all text types
    speaking:
      functions:
      - natural-sounding speech
      - fluency
      - precision
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/idiomatic_expressions.yaml
  grammar_point: idiomatic_expressions
  l1_notes:
  - language: Spanish
    skill_impact: Spanish has many idioms that do not translate directly. Literal
      translations may be incomprehensible.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Idioms cannot be understood from individual words; learners must know the
        expression as a whole
      relevance: Very common in conversation. Non-literal meaning must be inferred
        from context.
      source: Underhill, Sound Foundations, pp. 60-67
    reading:
      relevance: Common in all text types. Idioms are culturally specific and non-compositional.
      source: Biber et al., GSWE 8.2.1
      text_types:
      - all text_types
    speaking:
      functions:
      - natural-sounding speech
      - cultural fluency
      - humor
      - emphasis
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - informal writing
      - fiction
      - dialogue
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/figurative_language.yaml
  grammar_point: figurative_language
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin has rich figurative traditions. Mandarin speakers may understand
      metaphor but struggle with English-specific idioms.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Non-literal meaning must be inferred; learners may interpret figurative language
        literally
      relevance: Appears in conversation for emphasis and humor. Non-literal meaning
        must be inferred from context.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Common in literary, academic, and persuasive texts. Metaphor, simile,
        and other figurative devices.
      source: Biber et al., GSWE 8.2.1
      text_types:
      - literary
      - academic
      - persuasive
      - news
    speaking:
      functions:
      - expressing creativity
      - emphasizing
      - being humorous
      - persuasive speech
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - literary
      - creative writing
      - persuasive essays
      source: Biber et al., GSWE 8.2.1
sources:
  primary: Biber, Johansson, Leech, Conrad & Finegan. Grammar of Spoken and Written
    English (1999)
  secondary: Underhill, Adrian. Sound Foundations (1994); Swan & Smith, Learner English
    (2001)
