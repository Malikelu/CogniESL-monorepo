citations:
- claim: Maps grammar points to language skills, showing how grammatical knowledge
    transfers to communicative competence
  flagged: false
  reliability: B
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 1
  tier: 2
- claim: Skills mapping links curriculum content to language learning outcomes, enabling
    teachers to track which skills are developed through specific activities and grammar
    points.
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
  tier: 2
  reliability: B
  flagged: false
mappings:
- grammar_file: data/grammar/present_simple.yaml
  grammar_point: present_simple
  l1_notes:
  - language: Spanish
    skill_impact: Spanish speakers may overuse present continuous for habitual actions
      (transferring Spanish present use). In listening, the weak form /dəz/ in 'does'
      may be missed, leading to subject-verb confusion.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Weak forms of auxiliary 'do' (/də/) are hard to hear
      - Contracted 's in third person may be inaudible in rapid speech
      relevance: Frequently heard in everyday conversation for habitual actions, general
        truths, and narrative present. Connected speech forms (does→/dəz/, was→/wəz/)
        may obscure recognition.
      source: Underhill, Sound Foundations, pp. 63-64; Biber et al., GSWE 14.1.2.7
    reading:
      relevance: Most common tense in news headlines, instructions, academic texts,
        and narrative. Learners encounter it in virtually every text type.
      source: Biber et al., GSWE 5.1.2, 6.3.1
      text_types:
      - news
      - academic
      - instructions
      - fiction
      - blogs
    speaking:
      functions:
      - describing_routines
      - stating_facts
      - narrating live_events
      - expressing_preferences
      relevance: 'Essential for describing routines, facts, preferences, and giving
        instructions. Functions: describing, explaining, narrating (in sports/live
        commentary).'
      source: Biber et al., GSWE 14.1.2.1, 5.1.2
    writing:
      genres:
      - academic essays
      - news articles
      - instructions
      - narrative
      relevance: Dominant tense in academic writing for stating claims and facts.
        Used in news leads, instruction manuals, and narrative.
      source: Biber et al., GSWE 5.1.2, 8.2.1
- grammar_file: data/grammar/present_continuous.yaml
  grammar_point: present_continuous
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin has no morphological present continuous; speakers use context
      or adverbs. In writing, learners may omit the auxiliary entirely (*'I working').
      In listening, contracted auxiliaries are hard to perceive.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Contracted auxiliary ('s, 're, 'm) reduced to single consonant in connected
        speech
      - -ing ending may be reduced to /ɪn/ in rapid speech
      relevance: Very common in conversation for describing current activities and
        temporary situations. Contractions (I'm, he's, they're) dominate; bare -ing
        form may be the only audible signal.
      source: Underhill, Sound Foundations, pp. 64-65; Biber et al., GSWE 14.2.2.3
    reading:
      relevance: Common in narrative, fiction, and conversational readings. Used for
        ongoing actions and temporary situations.
      source: Biber et al., GSWE 5.1.2, 6.3.1
      text_types:
      - fiction
      - dialogue
      - personal emails
      - social media
    speaking:
      functions:
      - describing current actions
      - making future arrangements
      - expressing temporary situations
      relevance: 'Essential for describing what is happening now, temporary situations,
        and future arrangements (Biber GSWE 6.3.2). Functions: describing, explaining
        plans, complaining about temporary situations.'
      source: Biber et al., GSWE 6.3.2, 14.1.2.1
    writing:
      genres:
      - personal correspondence
      - fiction
      - narrative essays
      relevance: Used in personal emails, fiction writing, and informal narrative.
        Less common in academic writing except for describing data or processes.
      source: Biber et al., GSWE 5.1.2
- grammar_file: data/grammar/present_perfect.yaml
  grammar_point: present_perfect
  l1_notes:
  - language: German
    skill_impact: German Perfekt maps roughly onto present perfect but is used more
      broadly (for spoken past). German speakers may overuse present perfect in writing
      where past simple is needed (e.g., 'I have seen him yesterday').
    source: Swan & Smith, Learner English, German chapter
  - language: French
    skill_impact: French passé composé maps partially. French speakers may use present
      perfect where English requires past simple with specific past time reference.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - In perfect tenses, auxiliary 'have' reduces to /əv/ or disappears entirely
      - Past participle may be identical to past simple for regular verbs (-ed)
      relevance: Common in conversational experience narratives ('I've been to...').
        Auxiliary 'have' almost always reduces to /əv/ or /v/, making it hard to detect.
      source: Underhill, Sound Foundations, pp. 63-64; Biber et al., GSWE 14.2.2.3
    reading:
      relevance: 'Extremely common in news (breaking news: ''has announced''), academic
        writing, and GSWE 6.4.1.'
      source: Biber et al., GSWE 5.1.2, 6.4.1
      text_types:
      - news
      - academic
      - formal reports
    speaking:
      functions:
      - reporting experience
      - describing recent events
      - expressing duration with for/since
      relevance: 'Key for sharing life experiences, recent events, and unfinished
        time periods (Biber GSWE 6.4.1). Functions: narrating experience, reporting
        recent news, describing unfinished situations.'
      source: Biber et al., GSWE 6.4.1, 14.1.2.7
    writing:
      genres:
      - academic essays
      - news reports
      - formal emails
      - reports
      relevance: Standard in academic introductions ('Research has shown...'), news
        leads, and formal reports. Essential for academic writing at B2+.
      source: Biber et al., GSWE 8.2.1, 5.1.2
- grammar_file: data/grammar/past_simple.yaml
  grammar_point: past_simple
  l1_notes:
  - language: Japanese
    skill_impact: Japanese has a single past tense marker (-ta) applied uniformly.
      Japanese speakers may struggle with English irregular past forms in all four
      skills, producing regularized forms (*'goed', *'eated'). In listening, the -ed
      morpheme may be missed entirely.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Regular past -ed is frequently elided in connected speech
      - Many common verbs are irregular, requiring memorization
      relevance: Very common in conversation for storytelling and reporting past events.
        Regular -ed endings are often inaudible in connected speech (elision after
        /t/ or /d/).
      source: Underhill, Sound Foundations, pp. 60-67; Biber et al., GSWE 5.1.2
    reading:
      relevance: Dominant narrative tense in fiction, news reports, and historical
        writing. Most common tense in storytelling and recounts.
      source: Biber et al., GSWE 5.1.2, 6.2.2
      text_types:
      - fiction
      - news
      - history
      - biography
    speaking:
      functions:
      - narrating stories
      - reporting past events
      - describing completed actions
      relevance: 'Essential for telling stories, describing completed past events,
        and reporting. Functions: narrating, reporting, describing past habits (with
        ''used to'').'
      source: Biber et al., GSWE 5.1.2, 14.1.2.1
    writing:
      genres:
      - narrative
      - news
      - biography
      - academic methods sections
      - personal recounts
      relevance: Primary tense for narrative, news reports, biographical writing,
        and personal recounts. Also used in academic writing for describing research
        methods.
      source: Biber et al., GSWE 5.1.2, 8.2.1
- grammar_file: data/grammar/past_continuous.yaml
  grammar_point: past_continuous
  l1_notes:
  - language: Arabic
    skill_impact: Arabic has a morphological past progressive but it is less commonly
      used than in English. Arabic speakers may default to past simple where English
      requires past continuous.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - '''Was'' and ''were'' reduce to weak forms /wəz/, /wə/ in connected speech'
      - Longer verb phrases create more connected speech reduction
      relevance: Appears in conversational storytelling for background clauses ('I
        was walking home when...'). 'Was' reduces to /wəz/, auxiliary may be hard
        to hear.
      source: Underhill, Sound Foundations, pp. 63-64; Biber et al., GSWE 5.1.2
    reading:
      relevance: Used in narrative for background actions and setting scenes. Common
        in fiction and conversational narratives.
      source: Biber et al., GSWE 5.1.2, 6.2.2
      text_types:
      - fiction
      - narrative
      - dialogue
    speaking:
      functions:
      - setting narrative scene
      - describing interrupted actions
      - making polite background statements
      relevance: 'Used for narrative background, interrupted actions, and polite requests.
        Functions: setting scenes in stories, describing simultaneous actions, softening
        requests.'
      source: Biber et al., GSWE 5.1.2, 6.2.2
    writing:
      genres:
      - fiction
      - narrative essays
      - creative writing
      - dialogue
      relevance: Important for fiction, creative writing, and narrative essays. Sets
        the scene and provides background in stories.
      source: Biber et al., GSWE 5.1.2
- grammar_file: data/grammar/past_perfect.yaml
  grammar_point: past_perfect
  l1_notes:
  - language: Korean
    skill_impact: Korean does not have a morphological past perfect equivalent. Speakers
      may express anteriority through context or time adverbs rather than verb morphology,
      leading to underuse in speaking and writing.
    source: Swan & Smith, Learner English, Korean chapter
  skills:
    listening:
      challenges:
      - '''Had'' may be fully reduced and nearly inaudible'
      - In narrative, backshifting to past perfect is often optional; speakers use
        simple past even when past perfect is 'correct'
      relevance: Relatively rare in casual conversation; more common in lectures,
        presentations, and formal speech. 'Had' reduces to /əd/ or /d/.
      source: Underhill, Sound Foundations, p. 63; Biber et al., GSWE 14.2.2.3
    reading:
      relevance: Used in narrative for flashbacks and events before the main timeline.
        Common in fiction and academic writing.
      source: Biber et al., GSWE 5.1.2, 6.4.1
      text_types:
      - fiction
      - academic
      - formal reports
      - news background
    speaking:
      functions:
      - sequencing past events
      - backshifting in reported speech
      - academic narration
      relevance: 'Used for backshifting in reported speech, describing earlier past
        events, and academic narration. Functions: sequencing past events, reporting,
        flashback narration.'
      source: Biber et al., GSWE 6.4.1, 14.1.2
    writing:
      genres:
      - academic essays
      - fiction
      - formal reports
      - literary analysis
      relevance: Essential for academic writing (literature review, describing earlier
        research), fiction, and formal narrative. Important for C1-level writing.
      source: Biber et al., GSWE 8.2.1, 5.1.2
- grammar_file: data/grammar/future_will.yaml
  grammar_point: future_will
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin does not mark future tense morphologically; future is indicated
      by time adverbs. Speakers may omit 'will/going to' in both speaking and writing,
      relying on temporal adverbs alone.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Contracted 'll is a single consonant after pronouns — very hard to hear
      - Going to and will are often interchangeable in casual speech; learners may
        not distinguish them auditorily
      relevance: Very common in conversation for spontaneous decisions, predictions,
        and promises. 'Will' reduces to /əl/ or /l/; 'll cliticizes onto pronouns.
      source: Underhill, Sound Foundations, pp. 64-65; Biber et al., GSWE 14.2.2.3
    reading:
      relevance: Common in news for predictions, academic writing for forecasting,
        and everyday texts for promises and offers.
      source: Biber et al., GSWE 6.6.2, 8.2.1
      text_types:
      - news
      - academic
      - advertisements
      - everyday texts
    speaking:
      functions:
      - spontaneous decisions
      - promises
      - predictions
      - offers
      - requests
      relevance: 'Core future form for spontaneous decisions, promises, predictions,
        and offers. Functions: offering, promising, predicting, deciding on the spot.'
      source: Biber et al., GSWE 6.6.2, 14.1.2
    writing:
      genres:
      - academic essays
      - news
      - formal proposals
      - business forecasts
      relevance: Used in academic writing for forecasts and predictions, news for
        planned events, and formal proposals.
      source: Biber et al., GSWE 8.2.1, 6.6.2
- grammar_file: data/grammar/future_going_to.yaml
  grammar_point: future_going_to
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'ir a + infinitive' maps closely onto 'going to.' This positive
      transfer helps production but may lead to overuse at the expense of 'will' for
      spontaneous decisions.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - '''Going to'' → /gənə/ in rapid speech; ''want to'' → /wɒnə/ — learners may
        confuse the two'
      - Reduced form sounds like 'gonna' which may not be in learners' mental dictionary
      relevance: Extremely common in informal conversation. 'Going to' reduces to
        /gənə/ or even /gən/ in rapid speech — a major listening challenge.
      source: Underhill, Sound Foundations, pp. 60-67; Biber et al., GSWE 14.2.2.3
    reading:
      relevance: Common in informal and semi-formal texts for plans and intentions.
        Less common in formal academic writing.
      source: Biber et al., GSWE 6.6.2
      text_types:
      - personal emails
      - blogs
      - informal writing
    speaking:
      functions:
      - expressing plans
      - predicting from current evidence
      - announcing intentions
      relevance: 'Used for expressing plans, intentions, and predictions based on
        present evidence. Functions: planning, predicting from evidence, announcing
        intentions.'
      source: Biber et al., GSWE 6.6.2, 14.1.2
    writing:
      genres:
      - personal emails
      - informal writing
      - blogs
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/modals_possibility.yaml
  grammar_point: modals_possibility
  l1_notes:
  - language: German
    skill_impact: German modal system (konnen, mussen, durfen, etc.) maps partially
      onto English. German speakers may overuse 'must' for logical deduction where
      English prefers 'must have + pp' or use 'can' where English requires 'may'.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Weak forms of modals are hard to distinguish auditorily
      - Epistemic vs. deontic meaning must be inferred from context
      relevance: 'Frequent in conversation for speculation and advice. Modals reduce
        in connected speech: ''might'' → /maɪt/, ''could'' → /kəd/, ''may'' → /meɪ/
        (often unclear).'
      source: Underhill, Sound Foundations, pp. 63-64; Biber et al., GSWE 14.2.2.3
    reading:
      relevance: Common in academic hedging, news speculation, and everyday advice.
        'May,' 'might,' 'could' express epistemic modality across all text types.
      source: Biber et al., GSWE 6.6.2, 8.2.1
      text_types:
      - academic
      - news
      - advice columns
      - everyday texts
    speaking:
      functions:
      - expressing possibility
      - hedging claims
      - speculating
      - giving cautious advice
      relevance: 'Essential for expressing possibility, probability, and speculation.
        Functions: hedging, advising, speculating, expressing uncertainty.'
      source: Biber et al., GSWE 6.6.2, 14.1.2
    writing:
      genres:
      - academic essays
      - news
      - formal advice
      - reports
      relevance: Critical for academic hedging ('This may suggest...'), news speculation,
        and formal advice. Overuse or underuse signals non-native writing.
      source: Biber et al., GSWE 8.2.1, 6.6.2
- grammar_file: data/grammar/obligation_must_haveto.yaml
  grammar_point: obligation_must_haveto
  l1_notes:
  - language: French
    skill_impact: French 'devoir' covers both obligation and probability, leading
      to confusion. French speakers may say 'He must be at home' when they mean 'He
      has to be at home' (obligation vs. deduction).
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - '''Have to'' reduces to /hæftə/ — sounds like ''hafta'''
      - '''Must'' in ''You must try it'' reduces from /mʌst/ to /məs/'
      relevance: Frequent in transactional exchanges (doctor-patient, teacher-student).
        'Have to' → /hæftə/ in rapid speech; 'must' → /məst/ or /məs/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in rules, regulations, instructions, and advice texts. 'Must'
        for internal obligation, 'have to' for external rules.
      source: Biber et al., GSWE 6.6.2
      text_types:
      - rules
      - instructions
      - advice
      - signs
      - formal notices
    speaking:
      functions:
      - giving advice
      - stating rules
      - making strong recommendations
      - commanding
      relevance: 'Used for giving strong advice, expressing rules, and making requests.
        Functions: advising, commanding, insisting, recommending.'
      source: Biber et al., GSWE 6.6.2, 14.1.2
    writing:
      genres:
      - rules
      - instructions
      - advice
      - persuasive essays
      relevance: Used in formal rules, instructions, advice columns, and persuasive
        writing. 'Must' is stronger and more formal than 'have to.'
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/first_conditional.yaml
  grammar_point: first_conditional
  l1_notes:
  - language: Arabic
    skill_impact: Arabic conditional system uses different particles (ʾin, law). Arabic
      speakers may struggle with the English present-after-if rule (*'If I will go...').
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - '''If'' may reduce to /ɪf/ or even /əf/ in rapid speech'
      - Contracted 'll is hard to hear after 'if' clauses
      relevance: Frequent in conversation for making plans, promises, and threats.
        'If' may be reduced; 'will' → /əl/ or /l/.
      source: Underhill, Sound Foundations, pp. 63-65
    reading:
      relevance: Common in advice texts, instructions, and everyday communication.
        'If + present, will + infinitive' for real future possibilities.
      source: Biber et al., GSWE 6.6.2, 10.2.1
      text_types:
      - advice
      - instructions
      - everyday texts
      - blogs
    speaking:
      functions:
      - making promises
      - giving warnings
      - bargaining
      - predicting
      relevance: 'Used for making promises, threats, warnings, and predictions about
        the future. Functions: promising, warning, bargaining, planning.'
      source: Biber et al., GSWE 10.2.1, 14.1.2
    writing:
      genres:
      - advice columns
      - informal writing
      - instructions
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/second_conditional.yaml
  grammar_point: second_conditional
  l1_notes:
  - language: Japanese
    skill_impact: Japanese conditionals use different forms (-tara, -ba, -nara, -to)
      with nuanced meanings. Japanese speakers may overgeneralize one conditional
      pattern to all English hypotheticals.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - '''Would'' reduces to /wəd/ or /d/ — hard to distinguish from past tense'
      - Hypothetical meaning must be inferred from context, not morphology alone
      relevance: Appears in conversational hypotheticals and advice. 'Would' → /wəd/
        or /d/; 'if' clause may be the only signal.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in advice, hypothetical discussions, and imaginative fiction.
        'If + past simple, would + infinitive' for unreal present/future.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - advice
      - fiction
      - opinion pieces
      - blogs
    speaking:
      functions:
      - giving advice
      - imagining hypotheticals
      - making polite requests
      - expressing wishes
      relevance: 'Used for giving advice, imagining hypothetical situations, and polite
        requests. Functions: advising, imagining, softening requests.'
      source: Biber et al., GSWE 10.2.1, 14.1.2
    writing:
      genres:
      - opinion essays
      - advice
      - creative writing
      - formal hypotheticals
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/third_conditional.yaml
  grammar_point: third_conditional
  l1_notes:
  - language: Korean
    skill_impact: Korean has conditional forms but the hypothetical past is expressed
      differently. Korean speakers may avoid third conditional in speaking, using
      simpler constructions.
    source: Swan & Smith, Learner English, Korean chapter
  skills:
    listening:
      challenges:
      - '''Would have'' reduces to /wədə/ — sounds like ''woulda'''
      - Three-part structure (if + past perfect, would + have + pp) is complex to
        parse auditorily
      relevance: Rare in casual conversation; more common in lectures and formal speech.
        'Would have' → /wədəv/ or /wədə/ — very reduced.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Found in reflective writing, literary analysis, and academic discussion
        of past events. Relatively rare in everyday texts.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - academic
      - literary analysis
      - reflective writing
    speaking:
      functions:
      - expressing regret
      - criticizing past decisions
      - speculating about alternative pasts
      relevance: 'Used for expressing regret, criticizing past actions, and imagining
        alternative pasts. Functions: expressing regret, criticizing, speculating
        about the past.'
      source: Biber et al., GSWE 10.2.1, 14.1.2
    writing:
      genres:
      - reflective essays
      - academic writing
      - literary analysis
      - formal reports
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/passive_voice.yaml
  grammar_point: passive_voice
  l1_notes:
  - language: Japanese
    skill_impact: Japanese passive has additional adversative meaning (suffering passive)
      not present in English. Japanese speakers may avoid English passive or use it
      incorrectly in writing.
    source: Swan & Smith, Learner English, Japanese chapter
  - language: Arabic
    skill_impact: Arabic uses passive voice less frequently and with different constraints.
      Arabic speakers may underuse passive in academic English writing.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Passive constructions are longer and harder to parse in real-time listening
      - Agent ('by...') is often omitted, making meaning ambiguous
      relevance: More common in lectures, news broadcasts, and formal speech than
        in casual conversation. 'Was/were + past participle' — 'was' reduces to /wəz/.
      source: Underhill, Sound Foundations, pp. 63-64; Biber et al., GSWE 8.1.1
    reading:
      relevance: 'Dominant in academic prose (Biber GSWE 8.1.1: academic prose has
        highest passive frequency). Common in news, scientific writing, and formal
        reports.'
      source: Biber et al., GSWE 8.1.1, 6.4.1
      text_types:
      - academic
      - news
      - scientific
      - formal reports
    speaking:
      functions:
      - focusing on process
      - depersonalizing statements
      - formal reporting
      - scientific description
      relevance: 'Used in formal presentations, academic discussions, and when the
        agent is unknown or unimportant. Functions: focusing on process/result, depersonalizing,
        formal reporting.'
      source: Biber et al., GSWE 8.1.1, 14.1.2
    writing:
      genres:
      - academic essays
      - scientific reports
      - news
      - formal reports
      - process descriptions
      relevance: Essential for academic writing, scientific reports, news, and formal
        prose. Biber shows academic prose has significantly more passives than conversation
        (GSWE 8.1.1).
      source: Biber et al., GSWE 8.1.1, 6.4.1
- grammar_file: data/grammar/relative_clauses.yaml
  grammar_point: relative_clauses
  l1_notes:
  - language: Korean
    skill_impact: Korean relative clauses are pre-nominal (before the noun), unlike
      English post-nominal relatives. Korean speakers may produce head-final relative
      clauses or avoid them entirely.
    source: Swan & Smith, Learner English, Korean chapter
  - language: Japanese
    skill_impact: Japanese relative clauses are also pre-nominal. Japanese speakers
      may struggle with English post-nominal relative clauses in both production and
      comprehension.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Relative pronouns (who, which, that) may be reduced or omitted in speech
      - Long relative clauses create complex noun phrases that are hard to parse in
        real-time
      relevance: 'Less common in casual conversation (Biber GSWE 14.1.2: conversation
        prefers simple clauses). When they occur, relative pronouns may be reduced
        or omitted.'
      source: Biber et al., GSWE 14.1.2, 8.6.1
    reading:
      relevance: Extremely common in academic prose, news, and formal writing. Biber
        shows academic prose has the highest frequency of relative clauses (GSWE 8.1.1,
        8.6.1).
      source: Biber et al., GSWE 8.1.1, 8.6.1
      text_types:
      - academic
      - news
      - formal writing
      - fiction
    speaking:
      functions:
      - defining
      - adding information
      - identifying referents
      - formal description
      relevance: Used for adding information, defining, and identifying. More common
        in formal speech and presentations than in casual conversation.
      source: Biber et al., GSWE 8.6.1, 14.1.2
    writing:
      genres:
      - academic essays
      - formal reports
      - descriptive writing
      - news
      relevance: Essential for academic writing, formal descriptions, and complex
        prose. Defining vs. non-defining relative clauses are a key B2-C1 writing
        skill.
      source: Biber et al., GSWE 8.1.1, 8.6.1
- grammar_file: data/grammar/reported_speech.yaml
  grammar_point: reported_speech
  l1_notes:
  - language: Russian
    skill_impact: Russian reported speech does not require backshifting. Russian speakers
      may not backshift tenses in English reported speech (*'She said she is tired').
    source: Swan & Smith, Learner English, Russian chapter
  skills:
    listening:
      challenges:
      - Backshifting may not occur in casual speech
      - Vernacular reporting verbs ('was like,' 'goes') may not be recognized by learners
        who only know 'said'
      relevance: Appears in conversation for reporting what others said. Biber documents
        vernacular reporting clauses ('was like,' 'goes') alongside standard 'said'
        (GSWE 14.4.4).
      source: Biber et al., GSWE 14.4.4
    reading:
      relevance: Common in news (reporting what officials said), fiction (dialogue
        reporting), and academic writing (citing sources).
      source: Biber et al., GSWE 8.2.1, 14.4.4
      text_types:
      - news
      - fiction
      - academic
      - formal reports
    speaking:
      functions:
      - reporting speech
      - narrating conversations
      - gossiping
      - summarizing what others said
      relevance: 'Used for telling stories, reporting conversations, and gossip. Functions:
        reporting, narrating, gossiping, summarizing.'
      source: Biber et al., GSWE 14.4.4, 14.1.2
    writing:
      genres:
      - academic essays
      - news
      - narrative
      - formal reports
      relevance: Essential for academic writing (citing sources), news reporting,
        and narrative. Formal reported speech with backshifting is a B2+ writing skill.
      source: Biber et al., GSWE 8.2.1, 14.4.4
- grammar_file: data/grammar/articles.yaml
  grammar_point: articles
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin has no article system. Mandarin speakers consistently omit
      or misuse articles in all four skills. This is one of the most persistent errors.
    source: Swan & Smith, Learner English, Mandarin chapter
  - language: Korean
    skill_impact: Korean has no articles. Korean speakers struggle with article use
      in writing and may not perceive articles in listening.
    source: Swan & Smith, Learner English, Korean chapter
  - language: Japanese
    skill_impact: Japanese has no article system. Japanese speakers have persistent
      article errors in writing and may miss articles in listening.
    source: Swan & Smith, Learner English, Japanese chapter
  - language: Russian
    skill_impact: Russian has no articles. Russian speakers must learn the entire
      article system from scratch, affecting all four skills.
    source: Swan & Smith, Learner English, Russian chapter
  skills:
    listening:
      challenges:
      - Articles are function words with weak forms — nearly inaudible in connected
        speech
      - Learners must infer article presence from context and noun phrase structure
      relevance: 'Articles are almost always in weak form: ''a'' → /ə/, ''an'' → /ən/,
        ''the'' → /ðə/. They are among the hardest words to hear in connected speech.'
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Articles appear in every English text. Correct interpretation depends
        on article use (definite vs. indefinite vs. zero article signals given vs.
        new information).
      source: Biber et al., GSWE 2.3.5, 4.1.1
      text_types:
      - all text types
    speaking:
      functions:
      - introducing referents
      - referring back
      - generalizing
      - specifying
      relevance: 'Article errors are among the most persistent in L1s without articles.
        Functions: introducing new referents (a/an), referring back (the), generalizing
        (zero article).'
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      relevance: Article use is a key marker of writing quality at all levels. Errors
        in article use are common even at C1 for speakers of article-less L1s.
      source: Biber et al., GSWE 2.3.5, 8.2.1
- grammar_file: data/grammar/complex_noun_phrases.yaml
  grammar_point: complex_noun_phrases
  l1_notes:
  - language: Japanese
    skill_impact: Japanese noun phrases are head-final with pre-nominal modifiers.
      Japanese speakers may produce head-final English noun phrases or avoid complex
      pre-modification.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Multiple modifiers before the head noun are hard to parse in real-time
      - Post-modification (prepositional phrases, relative clauses) adds length
      relevance: Complex noun phrases in lectures and presentations are challenging
        because all information is packed into a single noun phrase with no visual
        support.
      source: Biber et al., GSWE 8.1.1
    reading:
      relevance: Biber shows academic prose has the most complex noun phrases with
        pre- and post-modification (GSWE 8.1.1, 8.6.1). Key for reading academic texts.
      source: Biber et al., GSWE 8.1.1, 8.6.1
      text_types:
      - academic
      - news
      - formal reports
    speaking:
      functions:
      - precise description
      - academic argumentation
      - technical explanation
      relevance: 'Used in formal presentations and academic discussion. Functions:
        precise description, academic argumentation, technical explanation.'
      source: Biber et al., GSWE 8.1.1
    writing:
      genres:
      - academic essays
      - formal reports
      - scientific writing
      relevance: Essential for academic writing. Biber shows academic prose has significantly
        more complex noun phrases than other registers (GSWE 8.1.1).
      source: Biber et al., GSWE 8.1.1, 8.6.1
- grammar_file: data/grammar/countable_uncountable.yaml
  grammar_point: countable_uncountable
  l1_notes:
  - language: French
    skill_impact: French 'information' is countable (des informations) but English
      'information' is uncountable. French speakers may say *'an information' or *'informations.'
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Plural -s may be inaudible in connected speech
      - Quantifiers like 'much' vs. 'many' depend on countability
      relevance: Plurals and quantifiers must be perceived in connected speech. Final
        -s on plurals is often reduced or elided.
      source: Underhill, Sound Foundations, pp. 60-67
    reading:
      relevance: Affects interpretation of noun phrases. Many nouns have different
        countability in English vs. L1 (e.g., 'information,' 'furniture,' 'advice').
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - quantifying
      - describing amounts
      - making requests
      relevance: 'Errors in countability affect article use, quantifier choice, and
        verb agreement. Functions: quantifying, describing amounts, requesting.'
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      relevance: Countability errors affect article use, subject-verb agreement, and
        quantifier choice. Common even at B2.
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/prepositions_time.yaml
  grammar_point: prepositions_time
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'en' covers both 'in' and 'on.' Spanish speakers may confuse
      'in' and 'on' (*'on the morning,' *'in the table').
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Prepositions are function words — weak forms, often inaudible
      - Choice of preposition must be inferred from context when the preposition itself
        is unclear
      relevance: Prepositions are function words with weak forms. 'In' → /ɪn/ or /ən/,
        'on' → /ɒn/, 'at' → /ət/. Very hard to hear in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Prepositions of time (in, on, at) appear in all text types. Correct
        interpretation is essential for understanding temporal references.
      source: Biber et al., GSWE 2.3.5, 8.6.1
      text_types:
      - all text types
    speaking:
      functions:
      - specifying time
      - indicating location
      - expressing manner
      relevance: 'Preposition errors are persistent and common. Functions: specifying
        time, place, manner.'
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      relevance: Preposition errors are among the most persistent in writing. Collocations
        with prepositions (dependent prepositions) must be learned as chunks.
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/discourse_markers_advanced.yaml
  grammar_point: discourse_markers_advanced
  l1_notes:
  - language: Arabic
    skill_impact: Arabic discourse markers (e.g., 'fa-', 'wa-') do not map directly
      onto English. Arabic speakers may underuse discourse markers in English writing.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Discourse markers in conversation are often reduced and may be inaudible
      - Function must be inferred from discourse context
      relevance: Biber documents discourse markers in conversation (well, so, anyway,
        I mean, you know) (GSWE 14.3.2.1, 14.3.3.3). They signal transitions and stance.
      source: Biber et al., GSWE 14.3.2.1, 14.3.3.3
    reading:
      relevance: Discourse markers (however, therefore, moreover, nevertheless) signal
        text organization. Essential for understanding academic and formal texts.
      source: Biber et al., GSWE 13.2.1.1, 10.4.3.1
      text_types:
      - academic
      - formal writing
      - news
    speaking:
      functions:
      - signaling transitions
      - hedging
      - emphasizing
      - managing conversation
      - expressing stance
      relevance: 'Essential for organizing speech, signaling transitions, and managing
        conversation. Functions: transitioning, hedging, emphasizing, managing turn-taking.'
      source: Biber et al., GSWE 14.3.2.1, 14.3.3.3
    writing:
      genres:
      - academic essays
      - formal reports
      - argumentative writing
      relevance: Critical for academic writing cohesion. Biber shows academic prose
        uses elaborate linking adverbials (GSWE 13.2.1.1).
      source: Biber et al., GSWE 13.2.1.1
- grammar_file: data/grammar/gerunds_infinitives.yaml
  grammar_point: gerunds_infinitives
  l1_notes:
  - language: Spanish
    skill_impact: Spanish tends to use infinitive where English uses gerund (after
      prepositions, as subject). Spanish speakers may say *'I am interested in learn'
      or *'To swim is fun' (acceptable but less common than 'Swimming is fun').
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - '''To'' before infinitives reduces to /tə/ — may be inaudible'
      - Gerund vs. present participle may be indistinguishable in speech
      relevance: The -ing ending and 'to' before infinitives may be reduced. 'To'
        → /tə/ in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Gerunds and infinitives appear in all text types. Correct interpretation
        depends on knowing which form follows which verb.
      source: Biber et al., GSWE 9.2.2.3, 9.4.2.9
      text_types:
      - all text types
    speaking:
      functions:
      - expressing purpose
      - describing activities
      - reporting
      - expressing preferences
      relevance: 'Choice between gerund and infinitive after verbs is a major source
        of error. Functions: expressing purpose, describing activities, reporting.'
      source: Biber et al., GSWE 9.2.2.3, 14.1.2
    writing:
      genres:
      - all writing genres
      relevance: Errors in gerund/infinitive choice are common in writing. Some verbs
        change meaning depending on complementation (stop, remember, try).
      source: Biber et al., GSWE 9.2.2.3
- grammar_file: data/grammar/comparatives_superlatives.yaml
  grammar_point: comparatives_superlatives
  l1_notes:
  - language: German
    skill_impact: German comparative formation is similar (-er suffix) but superlative
      differs. German speakers may produce double comparatives (*'more bigger') by
      combining L1 and L2 patterns.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Comparative suffix -er may be inaudible
      - '''More'' reduces to /mə/ in connected speech'
      relevance: Used in conversation for comparisons. '-er' and 'more' may be reduced
        in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in academic writing (comparing theories, data), news (comparing
        statistics), and everyday texts (product comparisons).
      source: Biber et al., GSWE 2.3.5, 8.2.1
      text_types:
      - academic
      - news
      - advertisements
      - reviews
    speaking:
      functions:
      - comparing things
      - evaluating options
      - making recommendations
      - expressing preferences
      relevance: 'Used for comparing, evaluating, and expressing preferences. Functions:
        comparing, evaluating, recommending, expressing preferences.'
      source: Biber et al., GSWE 14.1.2
    writing:
      genres:
      - academic essays
      - reviews
      - evaluative writing
      - advertisements
      relevance: Essential for academic comparison essays, product reviews, and evaluative
        writing.
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/nominalization.yaml
  grammar_point: nominalization
  l1_notes:
  - language: French
    skill_impact: French academic writing also uses nominalization, providing positive
      transfer. However, the specific nominalization patterns differ.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Nominalized verbs packed into noun phrases increase information density
      - Listeners must unpack the verbal meaning from nominal forms
      relevance: Nominalizations create dense noun phrases that are hard to parse
        in real-time listening, especially in lectures.
      source: Biber et al., GSWE 8.1.1
    reading:
      relevance: Biber shows academic prose has the highest frequency of nominalizations
        (GSWE 8.1.1). Key for understanding dense academic text.
      source: Biber et al., GSWE 8.1.1, 6.4.1
      text_types:
      - academic
      - news
      - formal reports
    speaking:
      functions:
      - academic argumentation
      - formal reporting
      - abstract description
      relevance: 'Used in formal presentations and academic discussion. Functions:
        academic argumentation, formal reporting, abstract description.'
      source: Biber et al., GSWE 8.1.1
    writing:
      genres:
      - academic essays
      - formal reports
      - scientific writing
      relevance: Essential for academic writing. Nominalization is a key feature of
        academic register (Biber GSWE 8.1.1).
      source: Biber et al., GSWE 8.1.1, 6.4.1
- grammar_file: data/grammar/hedging.yaml
  grammar_point: hedging
  l1_notes:
  - language: Japanese
    skill_impact: Japanese communication culture values indirectness, which may lead
      to over-hedging in English academic writing. Japanese speakers may hedge more
      than necessary.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Hedging expressions may be subtle and reduced in speech
      - Cultural differences in directness may affect recognition
      relevance: Hedging expressions in lectures and presentations signal uncertainty.
        Must be recognized to understand the speaker's stance.
      source: Biber et al., GSWE 10.3.1
    reading:
      relevance: Common in academic writing and news. Hedging language (seem, appear,
        tend to, it appears that) signals the writer's stance.
      source: Biber et al., GSWE 8.2.1, 10.3.1
      text_types:
      - academic
      - news
      - formal reports
    speaking:
      functions:
      - softening claims
      - expressing uncertainty
      - being diplomatic
      - avoiding overgeneralization
      relevance: 'Used for softening claims, expressing uncertainty, and being polite.
        Functions: hedging claims, expressing uncertainty, being diplomatic.'
      source: Biber et al., GSWE 10.3.1, 14.1.2
    writing:
      genres:
      - academic essays
      - formal reports
      - research papers
      relevance: Essential for academic writing. Overuse or underuse of hedging signals
        non-native writing style.
      source: Biber et al., GSWE 8.2.1, 10.3.1
- grammar_file: data/grammar/linking_words.yaml
  grammar_point: linking_words
  l1_notes:
  - language: Arabic
    skill_impact: Arabic uses 'wa-' (and) very frequently, leading to overuse of 'and'
      in English writing (and...and...and...).
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Coordinating conjunctions are function words — weak forms
      - In casual speech, connectors may be omitted entirely
      relevance: Connectors in speech may be reduced or omitted. Learners must infer
        relationships between clauses from context.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Connectors (and, but, or, so, because, although, however) signal
        text organization. Essential for understanding relationships between ideas.
      source: Biber et al., GSWE 10.4.3.1, 13.2.1.1
      text_types:
      - all text types
    speaking:
      functions:
      - adding information
      - contrasting
      - explaining cause
      - sequencing
      - concluding
      relevance: 'Used for organizing speech, showing relationships between ideas,
        and managing conversation. Functions: adding, contrasting, explaining cause,
        sequencing.'
      source: Biber et al., GSWE 14.1.2
    writing:
      genres:
      - all writing genres
      relevance: Essential for all writing genres. Range and accuracy of connectors
        is a key assessment criterion.
      source: Biber et al., GSWE 13.2.1.1
- grammar_file: data/grammar/cleft_sentences.yaml
  grammar_point: cleft_sentences
  l1_notes:
  - language: French
    skill_impact: French uses cleft sentences frequently ('C'est... que...'). This
      positive transfer may help French speakers use English clefts.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Cleft structure may be hard to parse in real-time
      - The focused element is prosodically prominent — learners must recognize this
      relevance: It-clefts and wh-clefts in speech signal focus and emphasis. The
        stressed element carries new information.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Common in academic and formal writing for emphasis. 'It was... that...'
        and 'What... is...' structures.
      source: Biber et al., GSWE 8.2.1, 10.2.1
      text_types:
      - academic
      - formal writing
      - news
    speaking:
      functions:
      - emphasizing
      - correcting
      - focusing attention
      - contrasting
      relevance: 'Used for emphasis, contrast, and correcting. Functions: emphasizing,
        correcting, focusing attention.'
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - academic essays
      - formal writing
      - argumentative essays
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/subjunctive.yaml
  grammar_point: subjunctive
  l1_notes:
  - language: Spanish
    skill_impact: Spanish has a fully productive subjunctive mood. Spanish speakers
      may overuse English subjunctive or use it in contexts where English prefers
      indicative.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Subjunctive is morphologically identical to base form — no auditory signal
      - Only recognizable from context (after specific verbs/adjectives)
      relevance: Rare in casual speech. When it occurs, the subjunctive form is identical
        to the base form, making it indistinguishable from present simple.
      source: Biber et al., GSWE 8.2.1
    reading:
      relevance: Found in formal writing, legal texts, and fixed expressions. 'I suggest
        he go,' 'If I were you,' 'It is essential that she be informed.'
      source: Biber et al., GSWE 8.2.1
      text_types:
      - formal writing
      - legal
      - academic
    speaking:
      functions:
      - recommending
      - demanding
      - expressing necessity
      - formal suggestion
      relevance: 'Used in formal speech and fixed expressions. Functions: recommending,
        demanding, expressing necessity.'
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - formal writing
      - legal
      - academic
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/phrasal_verbs.yaml
  grammar_point: phrasal_verbs
  l1_notes:
  - language: German
    skill_impact: German has separable prefix verbs that partially map onto English
      phrasal verbs. German speakers may understand the concept but struggle with
      specific meanings.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Particle may be reduced or inaudible
      - Separable phrasal verbs split the components across the clause
      relevance: Very common in conversation. The particle may be separated from the
        verb by connected speech features.
      source: Underhill, Sound Foundations, pp. 60-67
    reading:
      relevance: Common in fiction, informal writing, and news. Biber shows conversation
        has high frequency of phrasal verbs (GSWE 14.1.2.7).
      source: Biber et al., GSWE 14.1.2.7
      text_types:
      - fiction
      - informal writing
      - news
      - conversation transcripts
    speaking:
      functions:
      - everyday communication
      - informal narration
      - casual requests
      - describing actions
      relevance: 'Essential for natural-sounding conversation. Functions: everyday
        communication, informal narration, casual requests.'
      source: Biber et al., GSWE 14.1.2.7
    writing:
      genres:
      - informal writing
      - fiction
      - personal emails
      - blogs
      source: Biber et al., GSWE 14.1.2.7
- grammar_file: data/grammar/ellipsis_advanced.yaml
  grammar_point: ellipsis_advanced
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin allows extensive ellipsis (pro-drop, topic-drop). This
      positive transfer may help in conversation but may lead to under-specification
      in writing.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Learners must recover elided material from context
      - Non-clausal units (Yeah, Okay, Really?) are not 'incomplete sentences' — they
        are the default
      relevance: Biber shows 38.6% of conversation units are non-clausal (GSWE 14.3.1.4).
        Ellipsis is the norm in conversation, not the exception.
      source: Biber et al., GSWE 14.3.1.4, 14.3.3
    reading:
      relevance: Common in dialogue, informal writing, and conversational texts. Learners
        must recover elided material from context.
      source: Biber et al., GSWE 14.3.1.4
      text_types:
      - fiction
      - dialogue
      - informal writing
    speaking:
      functions:
      - responding
      - agreeing
      - confirming
      - backchanneling
      - natural conversation
      relevance: 'Used for natural conversation. Functions: responding, agreeing,
        confirming, backchanneling.'
      source: Biber et al., GSWE 14.3.1.4, 14.3.3
    writing:
      genres:
      - informal writing
      - dialogue
      - fiction
      source: Biber et al., GSWE 14.3.1.4
- grammar_file: data/grammar/inversion_negative.yaml
  grammar_point: inversion_negative
  l1_notes:
  - language: German
    skill_impact: German has verb-second (V2) word order, which creates inversion
      in many contexts. This positive transfer may help German speakers with English
      inversion.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Inverted word order is unexpected and may cause processing difficulty
      - Only occurs after specific negative/restrictive adverbials
      relevance: Rare in casual speech. When it occurs, the inverted structure may
        be hard to parse in real-time.
      source: Biber et al., GSWE 8.2.1
    reading:
      relevance: Found in formal and literary writing. 'Never have I...,' 'Not only...
        but also...,' 'Seldom...'
      source: Biber et al., GSWE 8.2.1
      text_types:
      - formal writing
      - literary
      - academic
    speaking:
      functions:
      - emphasizing
      - formal speech
      - dramatic effect
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - formal writing
      - literary
      - academic
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/wishes_regrets.yaml
  grammar_point: wishes_regrets
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses subjunctive after 'ojala' (I wish). Spanish speakers
      may try to map subjunctive onto English 'wish' constructions.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Hypothetical meaning must be inferred from context
      - '''Wish'' + past tense for present unreal may be confused with past simple'
      relevance: Appears in conversation for expressing regrets and wishes. 'Wish'
        + past tense/hypothetical.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in fiction, personal writing, and conversational texts. 'I
        wish I had...,' 'If only I could...'
      source: Biber et al., GSWE 10.2.1
      text_types:
      - fiction
      - personal writing
      - dialogue
    speaking:
      functions:
      - expressing regret
      - expressing wishes
      - complaining
      - imagining alternatives
      source: Biber et al., GSWE 10.2.1, 14.1.2
    writing:
      genres:
      - personal writing
      - fiction
      - reflective essays
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/fronting.yaml
  grammar_point: fronting
  l1_notes:
  - language: Arabic
    skill_impact: Arabic allows fronting for emphasis (topic-comment structure). This
      positive transfer may help Arabic speakers understand English fronting.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Fronted word order is unexpected
      - The fronted element carries emphasis — must be recognized prosodically
      relevance: Rare in casual speech. When it occurs, the fronted element is prosodically
        prominent.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Found in literary and formal writing for emphasis. Fronted elements
        create dramatic or literary effect.
      source: Biber et al., GSWE 8.2.1
      text_types:
      - literary
      - formal writing
    speaking:
      functions:
      - emphasizing
      - creating dramatic effect
      - focusing attention
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - literary
      - creative writing
      - formal writing
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/register_variation.yaml
  grammar_point: register_variation
  l1_notes:
  - language: Japanese
    skill_impact: Japanese has elaborate honorific system (keigo) that marks formality
      grammatically. Japanese speakers may expect similar grammatical marking in English
      and struggle with lexical/register variation.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Casual conversation has maximum connected speech reduction
      - Academic lectures blend conversational delivery with academic grammar
      relevance: Underhill's careful vs. rapid colloquial speech continuum (pp. 58-59).
        Learners must adjust listening strategies to register.
      source: Underhill, Sound Foundations, pp. 58-59; Biber et al., GSWE 1.5
    reading:
      relevance: 'Biber''s core finding: each register has a distinctive grammatical
        profile (GSWE 1.5, 2.3.5). Learners must recognize register from grammatical
        features.'
      source: Biber et al., GSWE 1.5, 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - adjusting register
      - formal speech
      - informal conversation
      - academic discussion
      source: Biber et al., GSWE 1.5, 14.1.2
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 1.5, 8.2.1
- grammar_file: data/grammar/zero_conditional.yaml
  grammar_point: zero_conditional
  l1_notes:
  - language: Arabic
    skill_impact: Arabic conditionals use different particles. Arabic speakers may
      struggle with the present-after-if rule.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - May be confused with first conditional if context is unclear
      relevance: Appears in conversation for general truths and habitual results.
        Both clauses use present simple, making it straightforward to parse.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in scientific texts, instructions, and general truth statements.
        'If + present, present' for universal truths and cause-effect.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - scientific
      - instructions
      - everyday texts
    speaking:
      functions:
      - stating general truths
      - explaining cause-effect
      - giving instructions
      relevance: 'Used for stating general truths, scientific facts, and habitual
        results. Functions: explaining, stating facts, giving instructions.'
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - scientific writing
      - instructions
      - general essays
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/mixed_conditionals.yaml
  grammar_point: mixed_conditionals
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin does not mark conditional time morphologically. Mandarin
      speakers may struggle with the tense mixing in mixed conditionals.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Two different time frames in one sentence create processing load
      relevance: Rare in casual speech; more common in lectures and formal discussion.
        The mixed time reference adds processing complexity.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Found in reflective and academic writing. Mixed time references (past
        condition → present result, or vice versa).
      source: Biber et al., GSWE 10.2.1
      text_types:
      - academic
      - reflective writing
      - literary
    speaking:
      functions:
      - expressing hypothetical mixed-time situations
      - reflecting on past decisions
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - reflective essays
      - academic writing
      - literary analysis
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/future_continuous.yaml
  grammar_point: future_continuous
  l1_notes:
  - language: Spanish
    skill_impact: Spanish has a parallel structure (estar + gerundio) for future continuous.
      Positive transfer helps production.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Contracted forms may be hard to distinguish from other future forms
      relevance: Appears in conversation for describing future plans and arrangements.
        'Will be' → /wɪl biː/ or /əl biː/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Found in narrative, fiction, and informal writing for actions in
        progress at a future time.
      source: Biber et al., GSWE 6.3.2
      text_types:
      - fiction
      - narrative
      - informal writing
    speaking:
      functions:
      - describing future actions in progress
      - polite inquiries about plans
      source: Biber et al., GSWE 6.3.2
    writing:
      genres:
      - fiction
      - narrative
      - informal writing
      source: Biber et al., GSWE 6.3.2
- grammar_file: data/grammar/future_perfect.yaml
  grammar_point: future_perfect
  l1_notes:
  - language: German
    skill_impact: German Futur II maps partially onto English future perfect. German
      speakers may understand the concept but struggle with the reduced forms in listening.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Reduced auxiliary forms are hard to perceive
      relevance: Rare in casual speech; more common in lectures and formal presentations.
        'Will have' → /wɪl hæv/ or /ələv/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Found in academic writing, formal reports, and news for actions completed
        before a future reference point.
      source: Biber et al., GSWE 6.4.1
      text_types:
      - academic
      - formal reports
      - news
    speaking:
      functions:
      - projecting completion
      - setting deadlines
      - academic discussion
      source: Biber et al., GSWE 6.4.1
    writing:
      genres:
      - academic essays
      - formal reports
      - project plans
      source: Biber et al., GSWE 6.4.1
- grammar_file: data/grammar/future_perfect_continuous.yaml
  grammar_point: future_perfect_continuous
  l1_notes:
  - language: French
    skill_impact: French does not have an exact equivalent. French speakers may avoid
      this structure entirely.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Long auxiliary chain is nearly impossible to perceive in connected speech
      relevance: Very rare in speech. When it occurs, the long auxiliary chain ('will
        have been doing') is heavily reduced.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Rare; found in formal and academic writing for duration of actions
        up to a future point.
      source: Biber et al., GSWE 6.4.1
      text_types:
      - academic
      - formal writing
    speaking:
      functions:
      - projecting duration
      - formal academic discussion
      source: Biber et al., GSWE 6.4.1
    writing:
      genres:
      - academic essays
      - formal reports
      source: Biber et al., GSWE 6.4.1
- grammar_file: data/grammar/past_perfect_continuous.yaml
  grammar_point: past_perfect_continuous
  l1_notes:
  - language: Arabic
    skill_impact: Arabic does not have a morphological past perfect continuous. Arabic
      speakers may use past continuous instead.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Reduced 'had' may be inaudible; the -ing form may be the only audible signal
      relevance: Rare in casual conversation; more common in storytelling and formal
        speech. 'Had been' → /həd biːn/ or /əd biːn/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Used in narrative for duration of actions before another past event.
        Common in fiction and biographical writing.
      source: Biber et al., GSWE 6.4.1
      text_types:
      - fiction
      - biography
      - narrative
    speaking:
      functions:
      - describing duration before a past event
      - explaining background circumstances
      source: Biber et al., GSWE 6.4.1
    writing:
      genres:
      - fiction
      - narrative
      - academic writing
      source: Biber et al., GSWE 6.4.1
- grammar_file: data/grammar/present_perfect_continuous.yaml
  grammar_point: present_perfect_continuous
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin uses time adverbs rather than verb morphology for duration.
      Mandarin speakers may omit the auxiliary or use simple present.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Reduced auxiliaries may be hard to detect
      relevance: Appears in conversation for describing ongoing situations. 'Have
        been' → /hæv biːn/ or /əv biːn/; 'has been' → /həz biːn/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in news, academic writing, and informal texts for actions
        continuing up to the present.
      source: Biber et al., GSWE 6.4.1
      text_types:
      - news
      - academic
      - informal writing
    speaking:
      functions:
      - describing ongoing actions
      - explaining recent activities
      - expressing duration
      source: Biber et al., GSWE 6.4.1
    writing:
      genres:
      - academic essays
      - news
      - informal writing
      source: Biber et al., GSWE 6.4.1
- grammar_file: data/grammar/modals_past.yaml
  grammar_point: modals_past
  l1_notes:
  - language: German
    skill_impact: German modal past forms (konnte, musste, durfte) map partially.
      German speakers may overuse 'could' for past ability where English prefers 'was
      able to' for single events.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - '''Might have'' → /maɪtəv/ sounds like ''mighta''; ''should have'' → /ʃʊdə/
        sounds like ''shoulda'''
      relevance: Appears in conversation for past habits ('would'), past ability ('could'),
        and speculation about the past ('might have').
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in news, academic writing, and fiction for past possibility,
        ability, and obligation. 'Could,' 'would,' 'might have,' 'should have.'
      source: Biber et al., GSWE 6.6.2
      text_types:
      - news
      - academic
      - fiction
    speaking:
      functions:
      - expressing past ability
      - past habits
      - speculation about the past
      - regret
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - narrative
      - academic writing
      - reflective essays
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/modals_perfect.yaml
  grammar_point: modals_perfect
  l1_notes:
  - language: French
    skill_impact: French 'aurait pu,' 'aurait dû' map onto 'could have,' 'should have.'
      French speakers may understand the concept but struggle with reduced forms in
      listening.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Heavily reduced forms are hard to distinguish auditorily
      relevance: 'Appears in conversation for speculation and criticism. All modal+have
        forms reduce heavily: ''must have'' → /mʌstəv/, ''could have'' → /kʊdə/.'
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in academic hedging, news speculation, and formal writing.
        'May have,' 'could have,' 'must have,' 'should have.'
      source: Biber et al., GSWE 6.6.2
      text_types:
      - academic
      - news
      - formal writing
    speaking:
      functions:
      - speculating about the past
      - expressing regret
      - criticizing
      - deducing
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - academic essays
      - formal reports
      - reflective writing
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/deduction_speculation.yaml
  grammar_point: deduction_speculation
  l1_notes:
  - language: German
    skill_impact: German 'müssen' covers both obligation and deduction. German speakers
      may confuse the two meanings in English.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Deduction vs. obligation meaning of 'must' must be inferred from context
      relevance: Appears in conversation for speculation and deduction. 'Must' → /məst/
        or /məs/; 'can't' → /kɑːnt/ or /kænt/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in academic writing and news for logical deduction. 'Must'
        for positive deduction, 'can't' for negative deduction.
      source: Biber et al., GSWE 6.6.2
      text_types:
      - academic
      - news
      - formal writing
    speaking:
      functions:
      - deducing
      - speculating
      - expressing certainty
      - expressing impossibility
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - academic essays
      - formal reports
      - analytical writing
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/wish_if_only_past.yaml
  grammar_point: wish_if_only_past
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses subjunctive after 'ojala.' Spanish speakers may try
      to map subjunctive onto English 'wish' constructions.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Hypothetical meaning must be inferred from context
      relevance: Appears in conversation for expressing wishes and regrets. 'Wish'
        + past tense for present unreal.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in fiction, personal writing, and conversational texts for
        expressing wishes about the present.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - fiction
      - personal writing
      - dialogue
    speaking:
      functions:
      - expressing wishes about the present
      - complaining
      - imagining alternatives
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - personal writing
      - fiction
      - reflective essays
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/would_rather_prefer.yaml
  grammar_point: would_rather_prefer
  l1_notes:
  - language: French
    skill_impact: French 'je préférerais' maps onto 'I would prefer.' Positive transfer
      helps production.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Contracted forms may be hard to distinguish
      relevance: Common in conversation for expressing preferences. 'Would rather'
        → /wʊd ˈrɑːðə/; 'would prefer' → /wʊd prɪˈfɜː/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Found in informal and semi-formal texts for expressing preferences.
      source: Biber et al., GSWE 6.6.2
      text_types:
      - personal emails
      - blogs
      - informal writing
      - dialogue
    speaking:
      functions:
      - expressing preferences
      - making polite suggestions
      - declining offers
      source: Biber et al., GSWE 6.6.2
    writing:
      genres:
      - personal emails
      - informal writing
      source: Biber et al., GSWE 6.6.2
- grammar_file: data/grammar/stative_dynamic_verbs.yaml
  grammar_point: stative_dynamic_verbs
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'saber/conocer' both map to 'know' but with different uses.
      Spanish speakers may overuse progressive forms with stative verbs.
    source: Swan & Smith, Learner English, Spanish chapter
  - language: Mandarin
    skill_impact: Mandarin does not distinguish stative/dynamic verbs morphologically.
      Mandarin speakers may use progressive with stative verbs (*'I am knowing').
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Some verbs can be both stative and dynamic with meaning changes (think, have,
        see)
      relevance: Stative verbs in progressive forms (e.g., 'I'm understanding') signal
        non-native speech. Learners must recognize standard forms.
      source: Biber et al., GSWE 6.3.1
    reading:
      relevance: Understanding stative vs. dynamic distinction is essential for interpreting
        verb use in all text types. Stative verbs resist progressive forms.
      source: Biber et al., GSWE 6.3.1
      text_types:
      - all text types
    speaking:
      functions:
      - using verbs correctly in progressive/non-progressive forms
      - avoiding stative-in-progressive errors
      source: Biber et al., GSWE 6.3.1
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 6.3.1
- grammar_file: data/grammar/substitution_advanced.yaml
  grammar_point: substitution_advanced
  l1_notes:
  - language: Japanese
    skill_impact: Japanese allows extensive ellipsis, reducing the need for substitution
      pro-forms. Japanese speakers may omit pro-forms where English requires them.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Pro-forms are function words — weak forms, often inaudible
      relevance: Substitution in speech ('I think so,' 'I hope not') is extremely
        common. Biber shows conversation relies heavily on substitution (GSWE 14.3.1.4).
      source: Biber et al., GSWE 14.3.1.4
    reading:
      relevance: Substitution pro-forms (do so, so, not, one/ones, that/those) are
        essential for text cohesion. Common in all text types.
      source: Biber et al., GSWE 10.4.3.1
      text_types:
      - all text types
    speaking:
      functions:
      - avoiding repetition
      - maintaining cohesion
      - natural conversation
      source: Biber et al., GSWE 14.3.1.4
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 10.4.3.1
- grammar_file: data/grammar/topic_comment.yaml
  grammar_point: topic_comment
  l1_notes:
  - language: Japanese
    skill_impact: Japanese is a topic-prominent language (wa/ga). Japanese speakers
      may overuse topic-comment structures in English.
    source: Swan & Smith, Learner English, Japanese chapter
  - language: Korean
    skill_impact: Korean is also topic-prominent. Korean speakers may transfer topic-marking
      strategies to English.
    source: Swan & Smith, Learner English, Korean chapter
  skills:
    listening:
      challenges:
      - Non-standard word order may cause processing difficulty
      relevance: Rare in casual speech. When it occurs, the topicalized element is
        prosodically prominent.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Found in literary and academic writing. Topic-comment structure manipulates
        information flow for emphasis.
      source: Biber et al., GSWE 8.2.1
      text_types:
      - literary
      - academic
      - formal writing
    speaking:
      functions:
      - topicalizing
      - emphasizing
      - managing information flow
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - literary
      - academic writing
      - formal essays
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/unless.yaml
  grammar_point: unless
  l1_notes:
  - language: German
    skill_impact: German 'es sei denn' maps onto 'unless.' German speakers may understand
      the concept but use it less frequently than native speakers.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Negative condition meaning must be inferred; 'unless' is less frequent than
        'if'
      relevance: Appears in conversation for conditions and warnings. 'Unless' → /ənˈlɛs/
        in connected speech.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in formal writing, rules, and conditions. 'Unless' = 'if not'
        for negative conditions.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - formal writing
      - rules
      - academic
      - everyday texts
    speaking:
      functions:
      - setting conditions
      - giving warnings
      - making exceptions
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - formal writing
      - rules
      - academic essays
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/verbs_followed_by_to_infinitive.yaml
  grammar_point: verbs_followed_by_to_infinitive
  l1_notes:
  - language: Spanish
    skill_impact: Spanish tends to use infinitive after verbs where English sometimes
      uses gerund. Spanish speakers may say *'I want leaving' instead of 'I want to
      leave.'
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Reduced 'to' may be inaudible; learners must infer the infinitive from context
      relevance: The 'to' before infinitives reduces to /tə/ in connected speech.
        Learners must recognize the infinitive pattern.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Extremely common in all text types. Correct interpretation depends
        on knowing which verbs take to-infinitive complements.
      source: Biber et al., GSWE 9.2.2.3
      text_types:
      - all text types
    speaking:
      functions:
      - expressing intention
      - making plans
      - reporting
      - requesting
      source: Biber et al., GSWE 9.2.2.3
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 9.2.2.3
- grammar_file: data/grammar/verbs_followed_by_ing.yaml
  grammar_point: verbs_followed_by_ing
  l1_notes:
  - language: French
    skill_impact: French uses infinitive after most verbs (éviter de, finir de). French
      speakers may say *'I enjoy to swim' instead of 'I enjoy swimming.'
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Reduced -ing may be confused with present participle
      relevance: The -ing ending may be reduced to /ɪn/ in rapid speech. Learners
        must recognize the gerund pattern.
      source: Underhill, Sound Foundations, pp. 60-67
    reading:
      relevance: Common in all text types. Verbs like 'enjoy,' 'avoid,' 'mind,' 'finish'
        take gerund complements.
      source: Biber et al., GSWE 9.2.2.3
      text_types:
      - all text types
    speaking:
      functions:
      - expressing enjoyment
      - avoidance
      - completion
      - suggestion
      source: Biber et al., GSWE 9.2.2.3
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 9.2.2.3
- grammar_file: data/grammar/verbs_followed_by_bare_infinitive.yaml
  grammar_point: verbs_followed_by_bare_infinitive
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses bare infinitive after most verbs. Spanish speakers
      may omit 'to' where English requires it (*'I want go').
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - No 'to' marker means learners must recognize the bare infinitive from context
      relevance: Bare infinitives lack the 'to' marker, making them harder to identify
        in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. Modal verbs and causatives (let, make,
        help) take bare infinitives.
      source: Biber et al., GSWE 9.2.2.3
      text_types:
      - all text types
    speaking:
      functions:
      - expressing permission
      - causation
      - obligation
      - suggestion
      source: Biber et al., GSWE 9.2.2.3
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 9.2.2.3
- grammar_file: data/grammar/causative_have_get.yaml
  grammar_point: causative_have_get
  l1_notes:
  - language: Arabic
    skill_impact: Arabic uses a different causative morphology. Arabic speakers may
      use active voice where English requires causative.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Causative meaning must be distinguished from possessive 'have'
      relevance: Appears in conversation for describing services. 'Have' → /hæv/ or
        /əv/; 'get' → /gɛt/.
      source: Biber et al., GSWE 9.2.2.3
    reading:
      relevance: Common in formal and informal writing for describing services and
        arrangements. 'Have/get something done.'
      source: Biber et al., GSWE 9.2.2.3
      text_types:
      - formal writing
      - informal writing
      - service contexts
    speaking:
      functions:
      - arranging services
      - describing things done by others
      - reporting
      source: Biber et al., GSWE 9.2.2.3
    writing:
      genres:
      - formal writing
      - informal writing
      - service descriptions
      source: Biber et al., GSWE 9.2.2.3
- grammar_file: data/grammar/purpose_clauses.yaml
  grammar_point: purpose_clauses
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'para + infinitive' maps onto 'to + infinitive.' Positive
