      source: Biber et al., GSWE 10.2.1
      text_types:
      - academic
      - instructions
      - formal writing
    speaking:
      functions:
      - explaining purpose
      - giving reasons
      - making plans
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - academic essays
      - instructions
      - formal writing
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/result_clauses.yaml
  grammar_point: result_clauses
  l1_notes:
  - language: German
    skill_impact: German 'so...dass' maps onto 'so...that.' Positive transfer helps
      production.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - '''So'' as result marker vs. discourse marker must be distinguished'
      relevance: Appears in conversation and lectures for describing consequences.
        'So' → /səʊ/ in connected speech.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in academic and formal writing. 'So...that,' 'such...that,'
        'so that' for expressing results.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - academic
      - formal writing
      - news
    speaking:
      functions:
      - describing consequences
      - explaining results
      - emphasizing outcomes
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - academic essays
      - formal reports
      - analytical writing
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/contrast_clauses.yaml
  grammar_point: contrast_clauses
  l1_notes:
  - language: Arabic
    skill_impact: Arabic uses 'wa-' (and) for addition, not contrast. Arabic speakers
      may underuse contrast markers in English writing.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Multiple contrast markers with subtle meaning differences
      relevance: Appears in conversation and lectures for contrasting ideas. 'Although'
        → /ɔːlˈðəʊ/ in connected speech.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in academic and formal writing. 'Although,' 'even though,'
        'while,' 'whereas,' 'despite,' 'in spite of.'
      source: Biber et al., GSWE 10.2.1
      text_types:
      - academic
      - formal writing
      - news
    speaking:
      functions:
      - contrasting ideas
      - conceding points
      - showing unexpected results
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - academic essays
      - formal reports
      - argumentative writing
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/reason_clauses.yaml
  grammar_point: reason_clauses
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin 'yīnwèi' maps onto 'because.' However, Mandarin allows
      reason clauses after the main clause more freely than English.
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - Reduced 'because' → /kɒz/ may be hard to hear
      relevance: Very common in conversation for explaining. 'Because' → /bɪˈkɒz/
        or /kɒz/ in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'Because,' 'since,' 'as,' 'now that,' 'seeing
        that' for expressing reasons.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - all text types
    speaking:
      functions:
      - explaining reasons
      - justifying
      - giving causes
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/time_clauses.yaml
  grammar_point: time_clauses
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses subjunctive in future time clauses. Spanish speakers
      may overuse subjunctive-like structures in English time clauses.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Present tense after time clauses referring to future (*'when I will go') is
        a common error
      relevance: Very common in conversation for sequencing events. Time conjunctions
        may be reduced in connected speech.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in all text types. 'When,' 'while,' 'before,' 'after,' 'until,'
        'as soon as' for temporal relationships.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - all text types
    speaking:
      functions:
      - sequencing events
      - describing routines
      - making plans
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/indirect_questions.yaml
  grammar_point: indirect_questions
  l1_notes:
  - language: Japanese
    skill_impact: Japanese indirect questions use different particles. Japanese speakers
      may use question word order in indirect questions (*'I wonder where is it').
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Learners must recognize that indirect questions use statement word order,
        not question word order
      relevance: Appears in conversation for polite requests and information-seeking.
        Word order change (subject before verb) is key.
      source: Biber et al., GSWE 10.2.1
    reading:
      relevance: Common in formal writing, academic texts, and reported speech. 'I
        wonder if,' 'Do you know where,' 'I'm not sure how.'
      source: Biber et al., GSWE 10.2.1
      text_types:
      - formal writing
      - academic
      - reported speech
    speaking:
      functions:
      - asking politely
      - reporting questions
      - seeking information
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - formal writing
      - academic essays
      - reported speech
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/question_tags.yaml
  grammar_point: question_tags
  l1_notes:
  - language: French
    skill_impact: French uses 'n'est-ce pas' as a universal tag. French speakers may
      overuse 'isn't it' for all tags.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Intonation pattern changes meaning; learners must recognize the difference
      relevance: Extremely common in conversation. Tags are usually said with rising
        intonation (genuine question) or falling (seeking agreement).
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Common in dialogue, fiction, and informal writing. Tags seek confirmation
        or express attitude.
      source: Biber et al., GSWE 14.1.2
      text_types:
      - fiction
      - dialogue
      - informal writing
    speaking:
      functions:
      - seeking confirmation
      - showing interest
      - softening statements
      - managing conversation
      source: Biber et al., GSWE 14.1.2
    writing:
      genres:
      - fiction
      - dialogue
      - informal writing
      source: Biber et al., GSWE 14.1.2
- grammar_file: data/grammar/imperatives.yaml
  grammar_point: imperatives
  l1_notes:
  - language: Japanese
    skill_impact: Japanese has elaborate imperative forms with different politeness
      levels. Japanese speakers may struggle with the directness of English imperatives.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Imperatives can sound rude without softening ('please,' intonation)
      relevance: Very common in conversation for giving directions, instructions,
        and advice. Stress pattern is key.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Common in instructions, recipes, signs, and informal writing. Direct
        commands and requests.
      source: Biber et al., GSWE 10.2.1
      text_types:
      - instructions
      - recipes
      - signs
      - informal writing
    speaking:
      functions:
      - giving instructions
      - making requests
      - giving advice
      - warning
      source: Biber et al., GSWE 10.2.1
    writing:
      genres:
      - instructions
      - recipes
      - signs
      - informal writing
      source: Biber et al., GSWE 10.2.1
- grammar_file: data/grammar/existential.yaml
  grammar_point: existential
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'hay' covers both 'there is' and 'there are.' Spanish speakers
      may use 'there is' with plural nouns (*'there is many people').
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Contracted 'there's' is used even with plural nouns in casual speech
      relevance: Very common in conversation. 'There's' → /ðɛːz/ or /ðəz/; 'there
        are' → /ðɛːr ɑː/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types for introducing new information. 'There
        is/are' signals the existence or presence of something.
      source: Biber et al., GSWE 8.2.1
      text_types:
      - all text types
    speaking:
      functions:
      - introducing new information
      - describing existence
      - presenting
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/demonstratives.yaml
  grammar_point: demonstratives
  l1_notes:
  - language: Japanese
    skill_impact: Japanese has a three-way demonstrative system (ko-/so-/a-). Japanese
      speakers may overuse 'that' where English prefers 'this.'
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Learners must infer the referent from context and gesture
      relevance: Demonstratives are function words with weak forms. 'This' → /ðɪs/,
        'that' → /ðæt/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'This/that/these/those' signal proximity
        and reference.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - pointing
      - referring
      - introducing
      - contrasting
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/possessive_adjectives.yaml
  grammar_point: possessive_adjectives
  l1_notes:
  - language: Portuguese
    skill_impact: Portuguese possessives agree with the noun, not the possessor. Portuguese
      speakers may confuse 'his' and 'her.'
    source: Swan & Smith, Learner English, Portuguese chapter
  skills:
    listening:
      challenges:
      - 'Weak forms are hard to distinguish: ''his'' vs. ''is,'' ''your'' vs. ''you'''
      relevance: Possessive adjectives are function words with weak forms. 'Your'
        → /jə/, 'their' → /ðɛː/.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'My, your, his, her, its, our, their' signal
        possession and relationships.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - showing possession
      - describing relationships
      - referring
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/reflexive_pronouns.yaml
  grammar_point: reflexive_pronouns
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses reflexive verbs more extensively (irse, lavarse). Spanish
      speakers may overuse reflexive pronouns in English.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Reflexive vs. emphatic use must be distinguished by stress and context
      relevance: Reflexive pronouns in connected speech may be reduced. Stress pattern
        distinguishes reflexive from emphatic use.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Common in all text types. 'Myself, yourself, himself, herself, itself,
        ourselves, themselves.'
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - referring back to subject
      - emphasizing
      - expressing self-action
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/reciprocal_pronouns.yaml
  grammar_point: reciprocal_pronouns
  l1_notes:
  - language: German
    skill_impact: German uses 'einander' for reciprocals. German speakers may understand
      the concept but confuse 'each other' and 'one another.'
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Distinction between 'each other' (two) and 'one another' (three+) is often
        ignored in speech
      relevance: Appears in conversation for describing mutual actions. 'Each other'
        → /iːtʃ ˈʌðə/ in connected speech.
      source: Biber et al., GSWE 2.3.5
    reading:
      relevance: Found in all text types. 'Each other' and 'one another' for mutual
        actions.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - describing mutual actions
      - relationships
      - interactions
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/indefinite_pronouns.yaml
  grammar_point: indefinite_pronouns
  l1_notes:
  - language: Spanish
    skill_impact: Spanish allows double negatives (*'No vi nada'). Spanish speakers
      may produce *'I didn't see nothing' in English.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Negative indefinite pronouns with negative verbs create double negatives in
        some L1s
      relevance: Very common in conversation. Indefinite pronouns may be reduced in
        connected speech.
      source: Biber et al., GSWE 2.3.5
    reading:
      relevance: Common in all text types. 'Someone, anybody, nobody, everyone, something,
        nothing, etc.'
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - referring to non-specific people/things
      - generalizing
      - negating
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/quantifiers.yaml
  grammar_point: quantifiers
  l1_notes:
  - language: Mandarin
    skill_impact: Mandarin does not distinguish 'much' and 'many' (都 = dōu). Mandarin
      speakers may use 'much' with count nouns (*'much people').
    source: Swan & Smith, Learner English, Mandarin chapter
  skills:
    listening:
      challenges:
      - '''Much'' vs. ''many'' distinction depends on countability; ''few'' vs. ''a
        few'' changes meaning'
      relevance: Very common in conversation. Quantifiers are function words with
        weak forms.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. 'Some, any, much, many, a lot of, few,
        little, several, plenty of.'
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - quantifying
      - describing amounts
      - comparing quantities
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/prepositions_of_movement.yaml
  grammar_point: prepositions_of_movement
  l1_notes:
  - language: Spanish
    skill_impact: Spanish 'en' covers both 'in' and 'on.' Spanish speakers may confuse
      prepositions of movement (*'go in the bus' vs. 'go on the bus').
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Weak forms are often inaudible; meaning must be inferred from context
      relevance: Prepositions of movement are function words with weak forms. Hard
        to perceive in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in narrative, instructions, and descriptive writing. 'Into,
        onto, through, across, along, towards.'
      source: Biber et al., GSWE 2.3.5
      text_types:
      - narrative
      - instructions
      - descriptive writing
    speaking:
      functions:
      - describing movement
      - giving directions
      - narrating
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - narrative
      - instructions
      - descriptive writing
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/dependent_prepositions.yaml
  grammar_point: dependent_prepositions
  l1_notes:
  - language: French
    skill_impact: French preposition collocations often differ from English (intéressé
      par vs. interested in). French speakers may transfer L1 collocations.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Preposition collocations must be learned as chunks; no rules predict the correct
        preposition
      relevance: Dependent prepositions are function words with weak forms. Hard to
        perceive in connected speech.
      source: Underhill, Sound Foundations, pp. 63-64
    reading:
      relevance: Common in all text types. Prepositions that are fixed with specific
        verbs, adjectives, and nouns (interested in, good at, reason for).
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - using correct preposition collocations
      - natural-sounding speech
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/compound_nouns.yaml
  grammar_point: compound_nouns
  l1_notes:
  - language: German
    skill_impact: German forms compound nouns by concatenation (Schreibtisch). German
      speakers may understand the concept but struggle with English stress patterns.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Stress on first element vs. second element changes meaning (greenhouse vs.
        green house)
      relevance: Compound nouns in connected speech may be hard to segment. Stress
        pattern (usually on first element) helps identification.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Very common in academic and news writing. Biber shows academic prose
        has high frequency of compound nouns (GSWE 8.1.1).
      source: Biber et al., GSWE 8.1.1
      text_types:
      - academic
      - news
      - everyday texts
    speaking:
      functions:
      - precise description
      - technical vocabulary
      - everyday communication
      source: Biber et al., GSWE 8.1.1
    writing:
      genres:
      - academic essays
      - news
      - technical writing
      source: Biber et al., GSWE 8.1.1
- grammar_file: data/grammar/adjective_order.yaml
  grammar_point: adjective_order
  l1_notes:
  - language: French
    skill_impact: French adjective order differs from English (usually after the noun).
      French speakers may place adjectives after the noun in English.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Adjective order rules are complex and largely intuitive for native speakers
      relevance: Multiple adjectives before a noun create a complex noun phrase that
        may be hard to parse in real-time.
      source: Biber et al., GSWE 2.3.5
    reading:
      relevance: Common in descriptive writing, fiction, and everyday texts. Opinion-size-age-shape-color-origin-material-purpose
        order.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - descriptive writing
      - fiction
      - everyday texts
    speaking:
      functions:
      - describing objects
      - people
      - places; precise description
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - descriptive writing
      - fiction
      - everyday texts
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/ed_vs_ing_adjectives.yaml
  grammar_point: ed_vs_ing_adjectives
  l1_notes:
  - language: Spanish
    skill_impact: Spanish uses different forms for -ed/-ing adjectives (aburrido/aburriendo).
      Spanish speakers may confuse the two in English.
    source: Swan & Smith, Learner English, Spanish chapter
  skills:
    listening:
      challenges:
      - Learners must distinguish 'bored' (feeling) from 'boring' (cause) from context
        alone
      relevance: The difference between '-ed' and '-ing' adjectives is not audible;
        meaning must be inferred from context.
      source: Biber et al., GSWE 2.3.5
    reading:
      relevance: Common in all text types. '-ed' adjectives describe feelings; '-ing'
        adjectives describe causes.
      source: Biber et al., GSWE 2.3.5
      text_types:
      - all text types
    speaking:
      functions:
      - describing feelings
      - describing causes
      - expressing opinions
      source: Biber et al., GSWE 2.3.5
    writing:
      genres:
      - all writing genres
      source: Biber et al., GSWE 2.3.5
- grammar_file: data/grammar/narrative_tenses.yaml
  grammar_point: narrative_tenses
  l1_notes:
  - language: Arabic
    skill_impact: Arabic narrative uses different tense patterns. Arabic speakers
      may overuse past simple where English requires past perfect for flashbacks.
    source: Swan & Smith, Learner English, Arabic chapter
  skills:
    listening:
      challenges:
      - Tense shifts in narrative may be hard to follow in real-time
      relevance: Very common in conversational storytelling. Tense shifts signal foreground/background
        information.
      source: Biber et al., GSWE 6.2.2
    reading:
      relevance: Essential for understanding fiction, news reports, and biographical
        writing. Past simple, past continuous, past perfect in narrative.
      source: Biber et al., GSWE 6.2.2
      text_types:
      - fiction
      - news
      - biography
      - narrative
    speaking:
      functions:
      - telling stories
      - reporting events
      - describing past experiences
      source: Biber et al., GSWE 6.2.2
    writing:
      genres:
      - fiction
      - narrative
      - news
      - biography
      source: Biber et al., GSWE 6.2.2
- grammar_file: data/grammar/passive_with_reporting_verbs.yaml
  grammar_point: passive_with_reporting_verbs
  l1_notes:
  - language: French
    skill_impact: French uses 'on dit que' for impersonal reporting. French speakers
      may overuse 'people say' instead of passive reporting structures.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Complex structure with passive + infinitive is challenging in real-time listening
      relevance: Appears in lectures and news broadcasts. The passive reporting structure
        is formal and may be hard to parse.
      source: Biber et al., GSWE 8.1.1
    reading:
      relevance: Common in academic writing and news. 'It is said that...,' 'He is
        believed to...,' 'It has been reported that...'
      source: Biber et al., GSWE 8.1.1
      text_types:
      - academic
      - news
      - formal writing
    speaking:
      functions:
      - reporting information
      - academic discussion
      - formal presentation
      source: Biber et al., GSWE 8.1.1
    writing:
      genres:
      - academic essays
      - news
      - formal reports
      source: Biber et al., GSWE 8.1.1
- grammar_file: data/grammar/pseudo_clefts.yaml
  grammar_point: pseudo_clefts
  l1_notes:
  - language: French
    skill_impact: French uses cleft sentences ('C'est... que...') frequently. Positive
      transfer may help French speakers use English pseudo-clefts.
    source: Swan & Smith, Learner English, French chapter
  skills:
    listening:
      challenges:
      - Focus structure may be hard to parse in real-time
      relevance: Appears in conversation and lectures for emphasis. The wh-clause
        carries old information; the focus is on the new information.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Found in academic and formal writing for emphasis. 'What I need is...,'
        'What happened was...'
      source: Biber et al., GSWE 8.2.1
      text_types:
      - academic
      - formal writing
      - news
    speaking:
      functions:
      - emphasizing
      - correcting
      - focusing attention
      - clarifying
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - academic essays
      - formal writing
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/litotes.yaml
  grammar_point: litotes
  l1_notes:
  - language: German
    skill_impact: German uses litotes less frequently. German speakers may interpret
      litotes literally, missing the intended meaning.
    source: Swan & Smith, Learner English, German chapter
  skills:
    listening:
      challenges:
      - Non-literal meaning must be inferred from context and intonation
      relevance: Appears in conversation for politeness and understatement. The intended
        meaning is the opposite of the literal meaning.
      source: Underhill, Sound Foundations, pp. 76-81
    reading:
      relevance: Found in formal and literary writing. Understatement through negation
        of the opposite ('not bad' = good).
      source: Biber et al., GSWE 8.2.1
      text_types:
      - formal writing
      - literary
      - academic
    speaking:
      functions:
      - being polite
      - understating
      - being diplomatic
      - expressing irony
      source: Biber et al., GSWE 8.2.1
    writing:
      genres:
      - formal writing
      - literary
      - academic
      source: Biber et al., GSWE 8.2.1
- grammar_file: data/grammar/politeness_continuous.yaml
  grammar_point: politeness_continuous
  l1_notes:
  - language: Japanese
    skill_impact: Japanese has elaborate honorific system (keigo) for politeness.
      Japanese speakers may not recognize that English uses tense for politeness.
    source: Swan & Smith, Learner English, Japanese chapter
  skills:
    listening:
      challenges:
      - Politeness meaning must be inferred from context; the past tense does not
        refer to past time
      relevance: Very common in conversation for polite requests. The past continuous
        softens the request.
      source: Biber et al., GSWE 14.1.2
