grammar_point: bare_genitive
level: C2
meaning:
  ccqs:
  - answer: Yes, bare genitives are always fixed idiomatic expressions.
    purpose: Tests whether the learner understands that bare genitives are fixed idiomatic expressions. This is important
      because these are fossilized forms from older English and cannot be created with new expressions.
    question: Is this a fixed expression?
  - answer: No, these are fossilized forms without apostrophes.
    purpose: Tests whether the learner knows that these fixed forms do not use apostrophes. This is important because the
      lack of apostrophe in these expressions is a historical artifact that learners must simply memorize.
    question: Does it have an apostrophe?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with bare genitive and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: These are fossilized forms from older English where the possessive was written without an apostrophe. The s in
      goodness sake and old times sake reflects an archaic genitive endings pattern that has been preserved unchanged for
      centuries. Modern English possessives always use apostrophes, but these fixed expressions are historical exceptions
      that learners must simply memorize.
    purpose: Tests whether the learner understands that bare genitives are historical relics of Middle English genitive endings,
      not modern possessives. This is important because applying modern rules (adding apostrophes) would be incorrect in these
      specific fossilized phrases.
    question: For goodness sake and for old times sake -- why is there no apostrophe before the s in these expressions?
  contrast: Regular possessive = the dog's bone vs Bare genitive = for goodness sake (no apostrophe)
  core_meaning: The bare genitive is a fixed expression where the possessive 's is used without an apostrophe in certain idiomatic
    phrases. These are fossilized expressions from older forms of English.
  example_generator:
    contexts:
    - fixed expressions
    - idiomatic English
    - formal/literary English
    cultural_notes:
    - These are very advanced, rare expressions
    - Most native speakers are not aware of the term bare genitive
    min_examples: 3
  timeline: Timeless — fixed expressions.
