sub_rules:
- examples:
  - Walking down the street, I saw an old friend (I was walking)
  - Having finished the work, she went home (she finished)
  - Sitting at her desk, she wrote a letter (she was sitting)
  rule: Present participle clauses (-ing) have an active meaning — the subject of the main clause performs the action
  type: grammatical
- examples:
  - Built in 1900, the house is very old (the house was built)
  - Seen from above, the city looks beautiful (the city is seen)
  - Written by Shakespeare, the play is a classic (the play was written)
  rule: Past participle clauses (-ed/-en) have a passive meaning — the subject of the main clause receives the action
  type: grammatical
- examples:
  - Having studied hard, she passed the exam (she studied first, then passed)
  - Having been informed of the decision, we proceeded (we were informed first)
  rule: Perfect participle clauses (having + past participle) show that the action was completed before the main clause action
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Give students two simple sentences. They combine them using a participle clause: ''I walked down the
      street. I saw a friend.'' → ''Walking down the street, I saw a friend.'''
    duration: 15
    name: Clause Combining
  - adaptation_notes: Students identify whether to use present participle (active) or past participle (passive).
    duration: 10
    name: Active or Passive
  tips:
  - Start with full clauses ('Because I was tired...') and show how to reduce them to participle clauses.
  - Use the 'dangling participle' error as a fun exercise — show absurd examples.
  - 'Practice identifying active vs passive: ''The man running'' (he runs) vs ''The car driven by John'' (someone drives it).'
  - 'Swan PEU: Participle clauses with conjunctions — ''After finishing dinner, we went for a walk.'' ''Before leaving, turn
    off the lights.'' ''On hearing the news, she burst into tears.'' = ''When she heard the news.'''
title: Participle Clauses (-ing and -ed clauses)
use:
- description: Explains why something happened.
  examples:
  - Feeling hungry, I made a sandwich.
  - Not having any money, she couldn't buy the ticket.
  - Being a vegetarian, he doesn't eat meat.
  key_point: The subject of the participle clause must be the same as the main clause.
  name: Reason (replaces 'because/since/as')
- description: Shows when something happened.
  examples:
  - Walking home, I listened to music.
  - Having finished dinner, we watched a film.
  - Opening the door, she saw a surprise.
  key_point: Perfect participle (having + past participle) shows the action was completed before the main clause.
  name: Time (replaces 'while/when/after')
- description: Describes a noun with a past participle.
  examples:
  - The car parked outside is mine.
  - Built in the 1800s, the bridge is a historic landmark.
  - The letter written by the president was published.
  key_point: Past participle (-ed) has a passive meaning — something was done to the subject.
  name: Passive Description (replaces 'which was...')
