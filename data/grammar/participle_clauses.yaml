common_errors:
- correction: The man standing there is my teacher. / The man who is standing there is my teacher.
  error: '*The man who standing there is my teacher.*'
  explanation: Participle clauses replace relative clauses with 'who/which + be'. 'Standing there' = 'who is standing there'.
    Do not mix the two structures.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: Replaces a subordinate clause with a participle to make sentences more concise. -ing for active meaning, -ed
  for passive meaning.
dialectal_variation: []
discourse_notes:
- note: Participle clauses (present, past, and perfect) function as reduced adverbials. They express time, reason, condition,
    or accompanying circumstance in compact form.
form:
  affirmative:
    example_generator:
      contexts:
      - education and school
      min_examples: 4
    structure: '-ing clause (active): "Walking down the street, I saw a friend." (= While I was walking...)

      -ed clause (passive): "Built in 1920, the house is very old." (= The house was built in 1920...)

      '
  negative:
    example_generator:
      contexts:
      - entertainment and media
      - social interactions
      min_examples: 4
    structure: 'Add ''not'' before the participle: ''Not knowing what to say, she stayed silent.'''
  questions:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: Participle clauses are not used in questions directly. The main clause can be a question.
grammar_point: participle_clauses
level: B1
meaning:
  ccqs:
  - answer: A clause using a participle (ing or ed) that modifies the main clause.
    purpose: Tests understanding of participle clauses and their structure
    question: What do we call a clause like 'Having finished, she left'? What type of clause is it?
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that participle clauses is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can distinguish between active meaning (present participle -ing) and passive meaning
      (past participle -ed) in participle clauses. This distinction is foundational because choosing the wrong form changes
      who performs the action and can produce a dangling modifier.
    question: What is the difference in meaning between these two forms?
  - answer: '''Walking down the street, I saw beautiful trees.'' The participle clause subject must match the main clause
      subject.'
    purpose: Tests whether the learner avoids dangling participles (Swan PEU 2016, entry 108.3).
    question: Which is correct? *'Walking down the street, the trees were beautiful' or 'Walking down the street, I saw beautiful
      trees'?
  contrast: 'Full clause: "Because I was walking down the street, I saw a friend."

    Participle clause: "Walking down the street, I saw a friend."

    Same meaning, more concise.

    '
  core_meaning: Combines two clauses into one by using a participle. Shows reason, time, or result more concisely.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: The participle clause usually happens at the same time as or just before the main clause.
phonetics:
- example_generator:
    contexts:
    - participle clause pauses
  l1_issue: Many L1 speakers do not pause after participle clauses. Teach the pause for clarity.
  note: 'Participle clauses are usually followed by a pause (comma) in speech: ''Walking down the street, / pause / I saw
    an old friend.'' The pause helps distinguish the clause.'
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Participial clauses (-ing, -ed as adverbials): more common in written registers than in conversation.
    Academic prose uses more participial subordination. Ch. 10.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2
