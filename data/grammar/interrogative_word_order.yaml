common_errors:
- error: '*You like what?* (direct translation)'
  correction: What do you like?
  explanation: English questions require subject-auxiliary inversion (do you like),
    not the statement order used in many L1s.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  - Korean
  - Dutch
  - German
  reliability: D
  flagged: true
- error: See Swan & Smith (2001) for L1-specific patterns
  correction: ''
  explanation: Swan & Smith (2001). Dutch (no subject-aux inversion), German (verb-second),
    French (est-ce que), Spanish (VSO possible, freer word order), Chinese (no wh-movement,
    topic-prominent), Japanese (wh-in-situ).
  l1_groups:
  - Dutch
  - German
  - French
  - Spanish
  - Chinese
  - Japanese
  source: 'Swan & Smith (2001) Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  reliability: B
  flagged: false
register_notes:
- note: Question formation is consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, intonation can turn a statement into a question: ''You''re
    leaving?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Interrogative structures (wh-questions, yes/no questions):
    overwhelmingly conversational. Direct questions are among the strongest markers
    of spoken language; academic prose uses almost no direct questions. Ch. 3.13.2'
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 3.13.2
  reliability: C
dialectal_variation: []
discourse_notes:
- note: 'In conversation, questions are the primary way to seek information: ''How
    are you?'' ''What do you think?'''
- note: 'In academic writing, rhetorical questions engage the reader: ''What are the
    implications of these findings?'''
- note: In interviews, question formation is critical for data collection.
