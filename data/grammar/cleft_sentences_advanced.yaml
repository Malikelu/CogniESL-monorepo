citations:
- claim: 'Core meaning: Advanced cleft sentences divide a single clause into two parts
    for emphasis'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 30:
    Information Packaging'
  tier: 1
- claim: Common error '*It was John which broke the window.*' for Portuguese, Spanish,
    Chinese speakers
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  tier: 1
common_errors:
- correction: It was John who broke the window.
  error: '*It was John which broke the window.*'
  explanation: Use 'who' for people and 'that' for things in cleft sentences. 'Which'
    is not standard in cleft sentences for people.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: What I need is a holiday that I have been desperate for.
  error: '*What I need is a holiday I was desperate.* (missing relative clause)'
  explanation: Advanced wh-cleft sentences require a complete relative clause. The
    relative pronoun (that/which/who) and any prepositions must be included.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Relative clauses'
- correction: It was in Paris that we met.
  error: '*It was in Paris where we met.* (less standard)'
  explanation: In standard English, it-cleft sentences use 'that' (not 'where/when/how')
    after the emphasized element, even when emphasizing place, time, or manner.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: D
description: 'Advanced cleft structures for emphasis: it-clefts, wh-clefts, and reversed
  wh-clefts.'
dialectal_variation: []
discourse_notes:
- note: Cleft constructions allow speakers to highlight specific elements of a clause
    for contrastive focus or thematic organization.
form:
  affirmative:
    example_generator:
      contexts:
      - it-cleft
      - wh-cleft
      min_examples: 4
    structure: 'It-cleft: It + be + focused element + who/that + clause / Wh-cleft:
      What + subject + do/be + is/was + focused element'
  negative:
    example_generator:
      contexts:
      - negative emphasis
      min_examples: 3
    structure: 'Same patterns: It was not John who broke the window. / What John did
      not do was break the window.'
  questions:
    example_generator:
      contexts:
      - question formation
      min_examples: 3
    structure: 'Can appear in questions: Was it John who broke the window?'
grammar_point: cleft_sentences_advanced
level: C1
meaning:
  ccqs:
  - answer: It was John who broke the window. The speaker is correcting the assumption
      that someone else broke it. The cleft structure puts focus on John as the person
      responsible.
    purpose: Tests whether the learner understands that it-cleft sentences (It was
      X who/that...) are used to focus attention on a specific element, often to correct
      misinformation or highlight the true subject.
    question: It was John who broke the window. What is the speaker emphasizing, and
      why use a cleft instead of a simple sentence?
  - answer: What I need is a holiday. The speaker needs a holiday, not anything else.
      The wh-cleft structure puts the focus (a holiday) at the end of the sentence,
      after the be verb.
    purpose: Tests whether the learner understands that wh-cleft sentences (What X
      is...) emphasize the element that comes after the be verb, making it the focal
      point of the sentence.
    question: In the sentence What I need is a holiday, what is the most important
      information, and how does the cleft structure signal this?
  - answer: A good night's sleep is what I need. This is a reversed wh-cleft. The
      focused element (a good night's sleep) is at the beginning instead of the end,
      giving it even more prominence as the topic of the sentence.
    purpose: Tests whether the learner can identify reversed wh-clefts and understand
      how moving the focused element to the beginning changes the information structure.
    question: How does A good night's sleep is what I need differ in emphasis from
      What I need is a good night's sleep?
  - answer: It was in Paris that we met. The speaker is using an it-cleft to emphasize
      the location (Paris). In standard English, it-clefts always use that (not where
      or when) after the emphasized element, even for places and times.
    purpose: Tests whether the learner understands the fixed rule that it-clefts use
      that (not where, when, or how) after the emphasized element, and can explain
      why this is a common error for learners.
    question: Why is It was in Paris that we met correct but It was in Paris where
      we met considered non-standard?
  contrast: Simple = John broke the window. vs It-cleft = It was John who broke the
    window. vs Wh-cleft = What John did was break the window.
  core_meaning: Advanced cleft sentences divide a single clause into two parts for
    emphasis. It-clefts emphasize one element. Wh-clefts (pseudo-clefts) put the focus
    at the end. Reversed wh-clefts put the focus at the beginning.
  example_generator:
    contexts:
    - emphasis
    - contrast
    - correcting misunderstandings
    - formal writing
    - academic English
    cultural_notes:
    - Cleft sentences are very common in spoken English for emphasis
    - Overuse can sound unnatural — teach appropriate contexts
    min_examples: 5
  timeline: Depends on the tense used.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Many L1 speakers do not use cleft sentences, missing opportunities for
    natural emphasis
  note: Stress on the focused element in cleft sentences
register_notes:
- note: 'Biber et al. (2021) — Advanced cleft constructions: it-clefts, wh-clefts,
    and reversed wh-clefts have different register distributions. Wh-clefts are more
    common in conversation; it-clefts in writing. Ch. 11.6'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 11.6
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 30:
    Information Packaging'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - It was Mary who called. (not John)
  - It was yesterday that she arrived. (not today)
  - It is the price that matters most. (not the quality)
  rule: It-cleft — emphasizes one element of the sentence
  type: grammatical
- examples:
  - What I need is a good night's sleep.
  - What she did was incredible.
  - What matters most is your health.
  rule: Wh-cleft (pseudo-cleft) — puts focus at the end
  type: grammatical
- examples:
  - A good night's sleep is what I need.
  - Incredible is what she did.
  rule: Reversed wh-cleft — puts focus at the beginning
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students rewrite simple sentences using cleft structures for
      emphasis.
    duration: 15
    name: Emphasis Practice
  tips:
  - Use contrastive contexts (I thought it was X, but it was actually Y)
  - Practice all three types: it-cleft, wh-cleft, reversed wh-cleft
  - Record students and have them identify emphasis patterns
  - 'Swan PEU: Pseudo-cleft — ''What I need is a holiday.'' ''The thing I like about
    Rome is the food.'' Wh-cleft (pseudo-cleft) for focus. The wh-clause is the topic;
    the other clause is the comment/focus.'
title: Cleft Sentences (Advanced)
use:
- context: Emphasis
  description: Highlighting specific information
  examples:
  - It was the teacher who explained it best.
  - What I appreciate most is your honesty.
- context: Correcting misunderstandings
  description: Clarifying what actually happened
  examples:
  - It was not me who broke the window — it was John.
  - What happened was an accident, not intentional.
