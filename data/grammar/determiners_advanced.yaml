  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17:
    Partitives, Collectives, and Quantifiers'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - All students must attend.
  - All of the students must attend.
  - They all passed the exam.
  - The students all passed the exam.
  rule: '''All'' refers to every member of a group of three or more. It can precede
    a noun directly or be used with ''of''.'
  type: grammatical
- examples:
  - Both my parents are teachers.
  - Both of the answers are wrong.
  - They both agreed.
  - I like them both.
  rule: '''Both'' refers to two items together. It is always followed by a plural
    noun or ''of the + plural noun''.'
  type: grammatical
- examples:
  - Neither answer is correct. (formal, singular)
  - Neither of them have arrived. (informal, plural)
  - 'NOT: Neither answer isn''t correct. (double negative)'
  rule: '''Neither'' is negative in meaning and takes a singular verb in formal English,
    though plural verbs are common in informal usage.'
  type: grammatical
- examples:
  - None of the food was left. (singular — formal)
  - None of the students have finished. (plural — common)
  - None of the emails were answered. (plural)
  rule: '''None'' means ''not any'' and can take either singular or plural verbs.
    Plural is more common in modern English.'
  type: grammatical
- examples:
  - Half the cake was eaten. (uncountable — singular verb)
  - Half the students were absent. (countable — plural verb)
  - Half of the water is gone.
  - Half of the guests have arrived.
  rule: '''Half'' can be used with countable and uncountable nouns. Verb agreement
    depends on the noun that follows ''of''.'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students survey classmates and report findings using all/both/half/neither/none:
      ''All of us like pizza. Neither of us has been to Japan.'''
    duration: 15
    name: Class Survey
  - adaptation_notes: Show a picture with multiple objects/people. Students describe
      what they see using the target determiners.
    duration: 10
    name: Picture Description
  - adaptation_notes: Create dominoes with determiners on one side and noun phrases
      on the other. Students match correctly.
    duration: 15
    name: Determiner Dominoes
  tips:
  - 'Use Venn diagrams to visually show the relationships: all (whole circle), both
    (two circles), neither (none of two), none (empty set)'
  - 'Practice with real class data: ''All of us are...'', ''Both of us have...'',
    ''Neither of us has...'', ''None of us have...'''
  - Emphasise that 'neither' is already negative — no double negative with 'not'
  - Use real objects (fruit, books, etc.) to demonstrate all/both/half/neither/none
    physically
  - Swan Entry 133-142 (articles), 146-172 (quantifiers) — the definitive Swan coverage
    of determiners. Review articles for specific/known reference; quantifiers for
    amount distinctions. Register varies widely.
title: Advanced Determiners (all/both/half/neither/none)
use:
- description: Referring to every member of a group of three or more.
  examples:
  - All students must submit their assignments by Friday.
  - All of the food was eaten at the party.
  - They all agreed with the proposal.
  - I've read all the books on the reading list.
  key_point: All = every member of a group (3+). Can go before the noun or after the
    subject pronoun.
  name: Totality with all
- description: Referring to two items or people together.
  examples:
  - Both my parents are doctors.
  - Both of the answers are correct.
  - I like both options equally.
  - They both passed the driving test.
  key_point: Both = the two together. Always refers to exactly two items.
  name: Pair reference with both
- description: Referring to 50% of a group or amount.
  examples:
  - Half the class failed the test.
  - Half of the budget has already been spent.
  - I only need half the time you need.
  - Half the guests arrived late.
  key_point: Half = 50%. Verb agreement depends on the noun (singular for uncountable,
    plural for countable).
  name: Partial quantity with half
- description: Not one and not the other — negating both options in a pair.
  examples:
  - Neither answer is correct.
  - Neither of them wanted to go.
  - I like neither option.
  - Neither restaurant was open when we arrived.
  key_point: Neither = not one and not the other (of two). Already negative — do not
    add 'not'.
  name: Negation of one of two with neither
- description: Not any — zero members of a group.
  examples:
  - None of the students passed the exam.
  - None of the shops were open.
  - I have none left.
  - None of the applicants had the right qualifications.
  key_point: None = not any (of 3+). Can take singular or plural verb.
  name: Complete negation with none
