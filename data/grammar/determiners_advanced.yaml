description: Sophisticated determiners for expressing quantity, distribution, and
  selection across groups of two or more items.
dialectal_variation: []
discourse_notes:
- note: Advanced determiners (all/both/half/neither/none) signal quantity and distribution
    in discourse. 'All' and 'both' presuppose a specific set; 'neither' and 'none'
    negate membership. In formal writing, these determiners require careful verb agreement.
form:
  affirmative:
    example_generator:
      contexts:
      - education and school
      - family and relationships
      - shopping and commerce
      min_examples: 4
    structure: 'All + plural noun / All of the + noun: ''All students passed.'' /
      Both + plural noun / Both of the + noun: ''Both answers are correct.'' / Half
      + noun / Half of the + noun: ''Half the class was absent.'' / Neither + singular
      noun / Neither of the + plural noun: ''Neither option works.'' / None of the
      + plural noun: ''None of the answers are right.'''
  negative:
    example_generator:
      contexts:
      - education and school
      - work and professional life
      - everyday situations
      min_examples: 4
    structure: 'Not all + noun (partial negation): ''Not all students passed.'' /
      Not both + noun: ''Not both answers are correct.'' / Neither (already negative
      — do NOT add ''not''): ''Neither answer is correct.'' NOT: ''Neither answer
      isn''t correct.'''
  questions:
    example_generator:
      contexts:
      - education and school
      - planning and organising
      min_examples: 3
    structure: 'All/Both/Half/Neither/None + of + determiner + noun: ''Are all of
      the students here?'' / ''Did both of them agree?'' / ''Is half of the work done?''
      / ''Did neither of them call?'' / ''Are any coming?'' (note: ''none'' is not
      typically used in questions — use ''any'' instead)'
grammar_point: determiners_advanced
level: B1
meaning:
  ccqs:
  - answer: No — 'all' refers to three or more; 'both' refers to exactly two.
    purpose: Tests whether the learner can distinguish between 'both' (two together),
      'either' (one of two), and 'neither' (not one of two). These quantifiers have
      distinct meanings and grammatical requirements.
    question: Do 'all' and 'both' mean the same thing?
  - answer: No, 'neither' is only for two items. For three or more, use 'none of the
      students'.
    purpose: Tests whether the learner understands that 'neither' is exclusively binary
      (two items only). For three or more, 'none' must be used. This is a common overgeneralization
      error.
    question: Can we say 'neither of the three students'?
  - answer: It depends — 'half of the cake is gone' (singular noun) but 'half of the
      students are here' (plural noun).
    purpose: Tests whether the learner understands that 'half' agrees with the noun
      that follows 'of.' 'Half of the cake' → singular verb. 'Half of the students'
      → plural verb. This agreement rule applies to all partitive quantifiers.
    question: Is 'half' followed by a singular or plural verb?
  - answer: No — 'neither' is already negative, so adding 'not' creates a double negative.
      The correct form is 'Neither of the answers IS correct.' The single negative
      in 'neither' negates both options.
    purpose: Tests whether the learner understands that 'neither' carries inherent
      negative meaning and must not be paired with another negation like 'not' or
      'aren't.' The double negative error ('*neither...isn't...') is extremely common
      across L1 groups and must be explicitly taught with advanced determiners.
    question: Can you say 'Neither of the answers aren't correct'?
  contrast: All = every member of a group (3+). Both = the two together. Half = 50%
    of a group. Neither = not one and not the other (of two). None = not any (of 3+).
  core_meaning: Expressing totality, distribution, or negation across groups — referring
    to every member, a pair, a portion, or no members of a group.
  example_generator:
    contexts:
    - education and school
    - family and relationships
    - shopping and commerce
    - travel and transport
    cultural_notes:
    - 'In British English, collective nouns with ''all/both'' can take plural verbs:
      ''All the team are playing well'''
    - '''Neither'' is used for exactly two items in standard English, though some
      dialects extend it to more'
    min_examples: 5
  timeline: Timeless — these determiners describe quantity and distribution, not time.
    They can be used with any tense.
phonetics:
- example_generator:
    contexts:
    - spoken English
    - presentations
  l1_issue: L1 speakers may struggle with the /θ/ sound in 'neither', substituting
    /s/ or /t/.
  note: '''Neither'' has two common pronunciations: /ˈnaɪðər/ (NY-ther, more common
    in American English) and /ˈniːðər/ (NEE-ther, more common in British English).
    Both are correct.'
- example_generator:
    contexts:
    - spoken English
    - everyday conversation
  l1_issue: L1 speakers may mispronounce 'none' as /noʊn/ (like 'own'), which can
    cause confusion.
  note: '''None'' is pronounced /nʌn/ — it rhymes with ''fun'', not ''own''.'
register_notes:
- note: 'Biber et al. (1999) — Determiner distribution: academic prose uses more definite
    articles (generic reference) and zero articles (abstract non-count nouns); conversation
    uses more indefinite articles and demonstratives. Ch. 4.4, 4.5'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 4.4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
