citations:
- claim: 'Core meaning: The passive voice is used when the focus is on the action or the object of the action, rather than
    o'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 18: Passive Voice-8.5'
  tier: 1
- claim: 'Register distribution: In academic writing, passive voice is standard in methodology and results sections.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 18: Passive Voice-8.5'
  tier: 1
- claim: 'Discourse function: In academic writing, passive voice is standard in methodology and results sections.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 18: Passive Voice-8.5'
  tier: 1
- claim: Common error '*The book wrote by Shakespeare.*' for Portuguese, Spanish, Chinese speakers
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  tier: 1
- claim: CGEL analyzes passive as an information packaging device for topicalizing the patient (Ch.16).
  reliability: A
  source: Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 16
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents how transfer effects are non-linear,
    determined by functional fit between L1 and L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects are non-linear — determined by functional
    fit between L1 and L2 systems rather than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning. Routledge.
