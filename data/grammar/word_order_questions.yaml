citations:
- claim: Word order in questions follows specific patterns that differ from declarative
    word order — the auxiliary verb precedes the subject in most question types.
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 11:
    Yes/No Questions'
  tier: 1
- claim: Swan (2016) documents common word order errors in questions across L1 groups,
    particularly in subject-auxiliary inversion and wh-question formation.
  source: Swan, M. (2016). Practical English Usage, 4th ed. Oxford University Press.
  tier: 2
common_errors:
- correction: Where does she live?
  error: 'Using statement word order in questions: *Where she lives?'
  explanation: English questions require subject-auxiliary inversion. The auxiliary
    (do, does, did) comes before the subject.
  l1_groups:
  - Spanish
  - Portuguese
  - Italian
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: Why did you leave?
  error: 'Omitting auxiliary in wh-questions: *Why you left?'
  explanation: Wh-questions with verbs other than be require do-support in present
    and past simple.
  l1_groups:
  - Chinese
  - Japanese
  - Korean
  - Thai
  reliability: B
  source: Swan (2016) Entry 57
description: Word order in English questions requires subject-auxiliary inversion,
  which differs from many other languages. Yes/no questions invert the auxiliary,
  wh-questions front the wh-word AND invert.
grammar_point: word_order_questions
level: A2
meaning:
  ccqs:
  - answer: The auxiliary verb (do/does/did) comes before the subject. "She lives"
      becomes "Does she live?"
    purpose: Tests understanding of subject-auxiliary inversion in questions.
    question: How does word order change when forming a yes/no question from "She
      lives here"?
  - answer: 'The wh-word comes first, then the auxiliary, then the subject: "Where
      does she live?"'
    purpose: Tests understanding of wh-question word order.
    question: What is the correct word order for "Where / she / does / live"?
  core_meaning: Question word order in English uses subject-auxiliary inversion. The
    auxiliary verb precedes the subject, unlike declarative sentences.
  timeline: Present and past tense question formation patterns.
form:
  affirmative:
    structure: 'Yes/No: Auxiliary + Subject + Main Verb? (Do you like it?). Wh-: Wh-word
      + Auxiliary + Subject + Verb? (Where do you live?). Subject questions: Who +
      Verb? (Who called?)'
  negative:
    structure: 'Yes/No: Auxiliary + Subject + not + Verb? (Don''t you like it?). Wh-:
      Wh-word + Auxiliary + Subject + not + Verb? (Why don''t you come?)'
  questions:
    structure: 'Tag questions: Statement + auxiliary + subject? (You are coming, aren''t
      you?)'
teaching:
  methodology: PPP
  tips:
  - 'Swan (2016) PEU 4th ed. Entries 472-478: Question word order requires inversion
    of subject and auxiliary verb. Yes/no questions invert: Are you ready? Wh-questions
    front the question word: Where are you going? In informal English, questions can
    be formed with just rising intonation (You are ready?).'
  - 'Teach the Do-Support rule explicitly: in questions, add do/does/did before the
    subject.'
  - Practice wh-question formation by giving students answers and asking them to write
    the question.
  - Contrast subject questions (Who called?) with object questions (Who did you call?)
    — one does not invert.
  recommended_activities:
  - adaptation_notes: Students rearrange scrambled question words into correct order.
    duration: 10
    name: Question Word Order Scramble
  - adaptation_notes: Give answers, students write the correct question for each one.
    duration: 15
    name: Question Formation Drill
register_notes:
- note: Subject-auxiliary inversion is required in all standard English question forms.
    Wh-in-situ is not grammatical in English, unlike some other languages.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) GSWE Ch. 11: Wh-questions are more common in conversation;
    yes/no question inversion patterns are consistent across all registers.'
  reliability: D
  source: Team observation
  tier: 4
dialectal_variation:
- note: 'Biber et al. (2021) GSWE Ch. 1.3.2/1.3.4: Question word order is stable across
    English dialects. Minor variation exists in tag question formation (innit in BrE
    colloquial, right? in AmE).'
title: Word Order in Questions
use:
- context: Yes/no questions
  examples:
  - Do you like coffee?
  - Is she coming?
  - Have they arrived?
- context: Wh-questions
  examples:
  - Where do you live?
  - What time does the train leave?
  - Why did you call?
