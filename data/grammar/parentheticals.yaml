  tier: 1
  reliability: B
- claim: 'Discourse function: In conversation, this structure is used in everyday communication.'
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries and Related Phrasal Forms-9.6'
  tier: 1
  reliability: B
