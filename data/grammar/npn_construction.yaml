grammar_point: npn_construction
level: B1
meaning:
  ccqs:
  - answer: Yes, it is an N-P-N construction.
    purpose: Tests understanding that the first noun in noun-preposition-noun construction is the unit/measure
    question: In 'a glass of water', which noun is the unit of measurement? Is it 'glass' or 'water'?
  - answer: The first noun (glass, piece, cup, etc.).
    purpose: Tests whether the learner understands that in N-P-N constructions, the first noun functions as a unit of measurement
      or container. 'A glass of water' = the glass is the unit. Different nouns specify different units (a piece of, a cup
      of, a slice of).
    question: What is the unit of measurement?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with N-P-N constructions and explain why they
      are incorrect. This tests error recognition and metalinguistic awareness.
    question: What is the difference in meaning between these two forms?
  - answer: Two slices of bread. Bread is uncountable in English, so you cannot say 'two breads.' You need an N-P-N construction
      like 'two slices of bread' or 'two loaves of bread.' Similarly, 'two pieces of advice' not 'two advices.'
    purpose: Tests whether the learner can apply N-P-N constructions to solve a real communication problem -- how to quantify
      uncountable nouns. This tests productive knowledge of the structure, going beyond identification to actual use in context.
    question: How would you ask for an unspecified amount of bread or advice -- 'two breads' or 'two slices of bread'?
  contrast: Direct = some water vs N-P-N = a glass of water (specific quantity)
  core_meaning: N-P-N constructions use a noun + preposition + noun to quantify or describe non-count nouns. The first noun
    is a unit or quantity, the preposition is usually 'of'.
  example_generator:
    contexts:
    - food and drink
    - measurements
    - quantities
    - everyday objects
    cultural_notes:
    - Different languages use different units — a piece of advice not a bit of advice
    - Some N-P-N are fixed expressions that must be memorized
    min_examples: 5
  timeline: Timeless — describes quantities, not time.
phonetics:
- example_generator:
    contexts:
    - sentence stress
  l1_issue: Some L1 speakers use direct translation (a water instead of a glass of water)
  note: 'Stress on the unit noun: a GLASS of water'
register_notes:
- note: 'Biber et al. (2021) — NPN constructions (day by day, step by step): register distribution varies; more common in
    narrative and formal prose. Conversation uses simpler temporal/sequential expressions. Ch. 8.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 8.1
