teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students create shopping lists using N-P-N constructions.
    duration: 10
    name: Shopping List
  tips:
  - Teach as fixed expressions
  - Use real objects for demonstration
  - Practice with food and drink contexts
  - 'Swan PEU: N-P-N — ''a cup of tea,'' ''a glass of water,'' ''a piece of advice,'' ''a slice of bread.'' Measure/container
    words with ''of.'' Important for countable/uncountable distinction: ''a piece of information'' (NOT ''an information'').'
title: N-P-N Construction
use:
