common_errors:
- correction: Can you tell me where the station is?
  error: '*Can you tell me where is the station?*'
  explanation: Indirect questions use statement order (where the station is), not question order (where is the station). This
    is a very common error.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Chinese
  reliability: D
- correction: Can you tell me where the station is?
  error: 'Inverting subject/verb in indirect question: *''Can you tell me where is the station?'''
  explanation: 'Swan PEU: After question words in indirect questions, use statement word order (subject + verb), NOT question
    word order.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  - Japanese
  reliability: B
  source: Swan Entry 372. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I wonder whether he will come.
  error: 'Using ''if'' instead of ''whether'' (formal): *''I wonder if he will come.'' (formal/written)'
  explanation: 'Swan PEU: "Whether" is preferred in formal writing. "If" is common in speech. "Whether" suggests two alternatives;
    "if" suggests a condition.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 373. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Polite ways to ask questions by embedding them in a statement, using question word + subject + verb (no inversion).
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - weather and nature
      - asking for directions
      - customer service
      min_examples: 4
    structure: 'Introduction + question word + subject + verb: "Can you tell me where the station is?"


      Yes/No indirect: If/whether + subject + verb: "Do you know if he is coming?"


      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      - negation
      min_examples: 4
    structure: 'Negative in the embedded question: ''Can you tell me where the station isn''t?'' (rare), more common: ''I
      don''t know where the station is.'''
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Invert introduction verb: ''Could you tell me where the station is?'''
grammar_point: indirect_questions
level: B2
meaning:
  ccqs:
  - answer: 'No — it uses normal statement word order: subject + verb.'
    purpose: Tests whether the learner understands that indirect questions use statement word order (subject + verb), not
      question word order (auxiliary + subject).
    question: Does the embedded question use question word order (verb before subject)?
  - answer: More polite — it softens the request.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Is an indirect question more or less polite than a...' checks conceptual understanding, not just memorization.
    question: Is an indirect question more or less polite than a direct question?
  - answer: Both — 'if' and 'whether' are interchangeable in indirect yes/no questions.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Do we use 'if' or 'whether' for yes/no indirect qu...' checks conceptual understanding, not just memorization.
    question: Do we use 'if' or 'whether' for yes/no indirect questions?
  - answer: no — it should be 'Can you tell me where the station is?' (no inversion in the embedded part).
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Does 'Can you tell me where is the station?' follo...' checks conceptual understanding, not just memorization.
    question: Does 'Can you tell me where is the station?' follow the correct pattern?
  contrast: '''Direct Question'' = Inverted, direct: "Where is the station?"


    ''Indirect Question'' = No inversion, polite: "Can you tell me where the station is?"


    ''Yes/No Indirect'' = If/whether: "Do you know if he is coming?"


    '
  core_meaning: Ask questions indirectly to be more polite, less direct, or when embedding a question in a statement.
  example_generator:
    contexts:
    - everyday situations
    - asking for directions
    - customer service
    - workplace communication
    cultural_notes:
    - Indirect questions are essential for polite English, especially with strangers and in professional settings
    - Direct questions can sound rude or demanding in British English culture
    min_examples: 5
  timeline: N/A (Applies to all tenses; embedded question matches the time of the action).
phonetics:
- example_generator:
    contexts:
    - question intonation
  l1_issue: Learners may use question intonation throughout, making 'where is he?' sound like a direct question even within
    an indirect structure.
  note: The introduction phrase often has rising intonation, while the embedded question falls
- example_generator:
    contexts:
    - connected speech
  l1_issue: Learners may pronounce 'whether' too carefully, making it stand out unnaturally in casual speech.
  note: '''Whether'' is often reduced to /ˈwɛð.ər/ in fast speech, sometimes sounding like ''wether'''
