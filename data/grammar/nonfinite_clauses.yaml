description: Clauses using non-finite verb forms (infinitives, gerunds, participles) instead of finite verbs with subjects.
  They make sentences more concise and are essential for sophisticated English.
dialectal_variation: []
discourse_notes:
- note: Non-finite clauses (infinitival, participial, gerund-participial) allow compact information packaging, especially
    common in written academic registers. a marker of proficient writing.
- note: In conversation, defining relative clauses are more common than non-defining.
- note: In formal writing, 'whom' is used for object relative clauses.
form:
  affirmative:
    example_generator:
      contexts:
      - infinitive clauses
      - gerund clauses
      - participle clauses
      min_examples: 4
    structure: 'Infinitive: to + base verb / Gerund: verb + -ing / Participle: verb + -ing (active) or verb + -ed/-en (passive).
      The non-finite clause attaches to a main (finite) clause.'
  negative:
    example_generator:
      contexts:
      - negative non-finite
      - warnings
      - advice
      min_examples: 3
    structure: 'Not + non-finite form: ''not to go'' / ''not going'' / ''not having finished''. ''Not'' precedes the non-finite
      verb.'
  questions:
    example_generator:
      contexts:
      - questions containing non-finite clauses
      min_examples: 3
    structure: 'Non-finite clauses are not used as standalone questions. They appear within questions: ''Do you want to come?''
      / ''Is it worth waiting?'''
grammar_point: nonfinite_clauses
level: B2
meaning:
  ccqs:
  - answer: No — it is non-finite.
    purpose: Tests whether the learner understands that non-finite clauses (infinitive, gerund, participle) have no tense
      and their subject is usually the same as the main clause subject.
    question: Does this clause have its own subject?
  - answer: No — infinitives, gerunds, and participles do not show tense.
    purpose: Tests understanding of nonfinite_clauses.
    question: Can you find a tense marker in the non-finite part?
  - answer: To be more concise and combine ideas smoothly.
    purpose: Tests understanding of nonfinite_clauses.
    question: Why use a non-finite clause instead of a finite one?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with nonfinite clauses. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: Finite clause = 'I want him to go.' (two clauses, each with subject and tense) vs Non-finite clause = 'I want
    to go.' (one finite clause + one non-finite clause with no separate subject).
  core_meaning: Non-finite clauses do not have their own subject or tense. They use infinitives (to + verb), gerunds (verb
    + -ing), or participles (verb + -ing/-ed). They allow speakers to combine ideas concisely without starting a new clause.
  example_generator:
    contexts:
    - complex sentences
    - formal writing
    - academic English
    - concise expression
    - reduced relative clauses
    cultural_notes:
    - Non-finite clauses are essential for sophisticated written English
    - Many L1 speakers avoid them, making speech sound simplistic or overly casual
    - Academic and professional English relies heavily on participle clauses
    min_examples: 5
  timeline: 'Timeless — non-finite forms do not show tense. The time reference comes from the main clause: ''I want to leave''
    (present desire about future) vs ''I wanted to leave'' (past desire).'
phonetics:
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may over-pronounce 'to' as /tu:/, making speech sound unnatural and stilted.
  note: 'In infinitive clauses, ''to'' is weakly pronounced as /tə/ in connected speech: ''I want to go'' → /aɪ wɒnt tə gəʊ/.'
- example_generator:
    contexts:
    - reading aloud
    - formal speech
  l1_issue: Learners may not pause before or after participle clauses when reading aloud, making long sentences difficult
    to follow.
  note: Participle clauses in writing are often set off by commas, which correspond to brief pauses in formal speech.
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I want to help.
  - She decided to leave.
  - It is important to study.
  - He is easy to work with.
  - I have nothing to wear.
  rule: Infinitive clauses — to + base verb, used after adjectives, nouns, and certain verbs
  type: grammatical
- examples:
  - Swimming is fun. (subject)
  - I enjoy reading. (object)
  - She is good at cooking. (after preposition)
  - I am looking forward to meeting you. (after phrasal preposition)
  rule: Gerund clauses — verb + -ing, used as subject, object, or after prepositions
  type: grammatical
- examples:
  - The woman sitting next to me is my sister. (= who is sitting)
  - Walking down the street, I saw an old friend. (= while I was walking)
  - The man talking to the teacher is my father.
  rule: Present participle clauses — verb + -ing, used to reduce relative clauses or show simultaneous action
  type: grammatical
- examples:
  - The book written by Shakespeare is famous. (= which was written)
  - The car parked outside is mine. (= which is parked)
  - Built in 1900, the house needs renovation. (= which was built)
  rule: Past participle clauses — verb + -ed/-en, used to reduce passive relative clauses
  type: grammatical
- examples:
  - Having finished the work, she went home. (= after she had finished)
  - Having been told the news, he was shocked. (= after he had been told)
  rule: Perfect participle clauses — having + past participle, showing action completed before the main clause
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: 'Students combine pairs of simple sentences using non-finite clauses. Example: ''I finished my work.
      I went home.'' → ''Having finished my work, I went home.'''
    duration: 15
    name: Sentence Combining
  - adaptation_notes: 'Students rewrite sentences with relative clauses using participle clauses. Example: ''The man who is
      standing by the door'' → ''The man standing by the door.'''
    duration: 15
    name: Relative Clause Reduction
  - adaptation_notes: Provide sentences with common errors (e.g., 'I enjoy to swim', 'Having finish the work, he left'). Students
      identify and correct them.
    duration: 10
    name: Error Correction
  tips:
  - 'CGEL Ch. 3: Finiteness is a syntactic property, not a morphological one. Primary tense (present/past) and subject agreement
    distinguish finite from non-finite clauses. Non-finite clauses include infinitival, gerund-participial, and past-participial
    forms.'
  - Start with simple infinitives and gerunds that students already know (I want to go, I enjoy reading).
  - Progress to participle clauses by showing how they replace relative clauses.
  - 'Use sentence-combining exercises: give two simple sentences and have students combine them using a non-finite clause.'
  - Use authentic academic texts to show participle clauses in context.
  - 'Highlight the negative form: ''not to go'' (not ''to not go'' — split infinitive is debated but ''not to'' is safer for
    learners).'
  - 'Swan PEU: Participle clauses — ''Walking down the street, I saw an old friend.'' The subject of the participle must be
    the same as the main clause subject. Dangling participles occur when they do not match.'
  - 'Swan PEU: Perfect participle — ''Having finished my work, I went home.'' Shows the action was completed before the main
    clause action.'
title: Non-finite Clauses
use:
- context: Academic and formal writing
  description: Non-finite clauses are essential for concise, sophisticated writing. They allow the writer to pack more information
    into fewer words.
  examples:
  - To understand this concept, one must first study the basics.
  - Having been informed of the decision, we proceeded accordingly.
  - The data collected during the study supports the hypothesis.
- context: Everyday spoken English
  description: Infinitive and gerund clauses are common in speech; participle clauses are more formal.
  examples:
  - I want to go home.
  - I enjoy cooking dinner for my friends.
  - It is nice to see you.
- context: Reducing relative clauses
  description: Participle clauses replace relative clauses to make sentences less wordy.
  examples:
  - The people who live next door are friendly. → The people living next door are friendly.
  - The letter that was sent yesterday arrived today. → The letter sent yesterday arrived today.
