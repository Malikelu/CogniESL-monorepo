    happen or causes someone to do something'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 18:
    Passive Voice (causative constructions)'
  tier: 1
- claim: 'Discourse function: In conversation, this structure is used in everyday
    communication.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 18:
    Passive Voice (causative constructions)'
  tier: 1
- claim: Common error '*I did my hair cut yesterday.* (arranged for someone)' for
    Portuguese, Spanish speakers
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 18: Causative
    structures'
  tier: 1
- claim: 'Causative structures function in discourse to express different types of
    causation: arranging services (have/get something done), forcing (make someone
    do), and allowing (let someone do).'
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 18:
    Passive Voice (causative constructions)'
  tier: 2
common_errors:
- correction: I had my hair cut yesterday.
  error: '*I did my hair cut yesterday.* (arranged for someone)'
  explanation: The causative uses 'have/get + object + past participle' to express
    arranging a service. Using 'do' changes the meaning to performing the action yourself.
    'Do' is not used as a causative verb for services.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: I made him apologize.
  error: '*I made him to apologize.*'
  explanation: After 'make' (causative meaning 'force'), use the bare infinitive (without
    'to'). 'Make + person + base verb' is a fixed structure. Adding 'to' before the
    verb is influenced by other causative patterns like 'ask him to apologize'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
- correction: She let me borrow her car.
  error: '*She let me to borrow her car.*'
  explanation: After 'let', use the bare infinitive (without 'to'). 'Let + person
    + base verb' is the fixed pattern. Adding 'to' occurs because most other causatives
    ('ask', 'tell', 'want') do take 'to'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: I had my car repaired by the mechanic.
  error: '*I had repaired my car by the mechanic.*'
  explanation: In causative 'have', the object (what is done) comes immediately after
    'have', not at the end. 'Had my car repaired' (not 'had repaired my car'). The
    past participle modifies the object.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: 'Structures showing that someone causes something to happen: have something
  done, get something done, make someone do something.'
dialectal_variation: []
discourse_notes:
- 'Causative structures express different types of causation: arranging a service
  (have/get something done), forcing (make someone do), allowing (let someone do),
  and experiencing an event (had my wallet stolen). Source: Celce-Murcia & Larsen-Freeman
  (2015) GB3 Ch. 18.'
form:
  affirmative:
    example_generator:
      contexts:
      - services
      - obligations
      - permissions
      min_examples: 4
    structure: 'Have/get + object + past participle: I had my hair cut. / Make/let/have
      + person + base verb: She made him apologize.'
  negative:
    example_generator:
      contexts:
      - negative causatives
      min_examples: 3
    structure: 'Same patterns with negation: I did not have my hair cut. / She did
      not make him apologize.'
  questions:
    example_generator:
      contexts:
      - question formation
      min_examples: 3
    structure: 'Did + subject + have + object + past participle?: Did you have your
      hair cut?'
grammar_point: causative
level: B2
meaning:
  ccqs:
  - answer: No, someone else did it (causative).
    purpose: Tests whether the learner understands the causative structure (have/get
      something done) for arranging services, and the difference between 'have' (neutral/formal)
      and 'get' (informal).
    question: Did the subject do the action themselves?
  - answer: Arrange = have/get, Force/Allow = make/let/have.
    purpose: Tests whether the learner can distinguish arranging a service (have/get
      something done) from forcing or allowing someone to do something (make/let/have
      someone do something).
    question: Is this about arranging or forcing?
  - answer: No. This is the "experience" use of causative "have" — something unpleasant
      happened to the subject without their arrangement or control.
    purpose: Tests whether the learner understands the "experience/happen to" use
      of causative "have/get" (I had my wallet stolen, She had her leg broken), which
      describes things that happen to someone without their control. This is a distinct
      meaning from the "arrange a service" use (I had my hair cut), and confusing
      them leads to absurd interpretations in context.
    question: What is the difference in meaning between these two forms?
  - answer: '''I had my hair cut.'' Causative ''have'' uses: have + object + past
      participle (no ''to'').'
    purpose: 'Tests whether the learner knows the causative structure: have + object
      + past participle (Swan PEU 2016, entry 105.10).'
    question: Which is correct? *'I had my hair to cut' or 'I had my hair cut'?
  contrast: Causative = I had my hair cut. (someone else cut it) vs Active = I cut
    my hair. (I did it myself)
  core_meaning: Causative structures show that someone causes something to happen
    or causes someone to do something. Have/get something done = arrange for someone
    else to do it. Make/let/have someone do = cause/allow someone to do it.
  example_generator:
    contexts:
    - services and arrangements
    - obligations and permissions
    - everyday situations
    - formal contexts
    cultural_notes:
    - Causative structures are used very frequently in English
    - Some L1 speakers avoid them, making speech sound unnatural
    min_examples: 5
  timeline: Depends on the tense used.
phonetics:
- example_generator:
    contexts:
    - sentence stress
  l1_issue: Many L1 speakers avoid causative structures, using longer paraphrases
    instead
  note: Stress on the causative verb (have/get/make/let) to show who is causing the
    action
register_notes:
- note: 'Biber et al. (2021) — Causative constructions: register distribution differs.
    ''Get'' causative is strongly conversational; ''have'' causative is neutral; ''make''
    causative appears across registers. Ch. 5.2.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 5.2.4
