- correction: The train leaves at 6pm.
  error: '*The train will leave at 6pm.* (timetable)'
  explanation: For scheduled events (timetables, programs), use present simple, not 'will'. 'The train leaves at 6pm' NOT
    'The train will leave at 6pm'.
  flagged: true
  l1_groups:
  - Portuguese
