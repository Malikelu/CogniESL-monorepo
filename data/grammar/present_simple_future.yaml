  - French
  reliability: D
description: Using the present simple tense to talk about fixed, scheduled future events — timetables, programmes, and official
  arrangements that are not personal plans.
dialectal_variation: []
discourse_notes:
- note: In conversation, this structure is used for everyday communication and is among the most frequent patterns in spoken
    English.
- note: In academic writing, this structure appears in discussions of established knowledge, methodology, and findings.
- note: In news reports, this structure is used for reporting events and attributing statements.
form:
  affirmative:
    example_generator:
      contexts:
      - transport
      - entertainment
      - education
      - business hours
      min_examples: 4
    structure: 'Subject + present simple verb (base form, with -s/-es for third person): ''The train leaves at 6pm.'' / ''The
      film starts at 8.'' / ''School finishes at 3:30.'''
  negative:
    example_generator:
      contexts:
      - closed days
      - cancellations
      - exceptions to schedules
      min_examples: 3
    structure: 'Subject + do not/does not + base verb: ''The shop does not open on Sundays.'' / ''The bus doesn''t stop here.''
      / ''The class doesn''t start until 10.'''
  questions:
    example_generator:
      contexts:
      - asking about schedules
      - planning around timetables
      - checking opening times
      min_examples: 3
    structure: 'Do/Does + subject + base verb: ''What time does the train leave?'' / ''Does the bank open on Saturdays?''
      / ''When does the film start?'''
grammar_point: present_simple_future
level: A2
meaning:
  ccqs:
  - answer: A fixed schedule — it is set by an organisation or system.
    purpose: Tests whether the learner can distinguish between fixed scheduled events (which use present simple for future)
      and personal plans (which use ''going to'' or present continuous). This is the primary contextual factor governing this
      use.
    question: Is this a personal plan or a fixed schedule?
  - answer: No — it is a published or official schedule.
    purpose: Tests whether the learner understands that present simple for future is used when the event is outside the speaker's
      control and governed by an external timetable or institutional arrangement.
    question: Can the speaker easily change this time?
  - answer: No — we use the present simple because the schedule is fixed.
    purpose: Tests whether the learner understands that present simple can express future meaning in specific contexts, and
      that using ''will'' or ''going to'' for fixed schedules, while not ungrammatical, sounds unnatural to native speakers.
    question: Are we using a future form (will/going to)?
  - answer: '''The train leaves at 8.'' For scheduled future events (timetables, programs), we use present simple, not ''will''.'
    purpose: Tests whether the learner knows that present simple expresses scheduled future events (Swan PEU 2016, entries
      36-37).
    question: Which is correct for a scheduled timetable? *'The train will leave at 8' or 'The train leaves at 8'?
  contrast: '''The train leaves at 6pm.'' (Present Simple — fixed timetable, decided by the railway.) vs ''I am going to leave
    at 6pm.'' (Going to — personal plan, my decision.) vs ''I will leave at 6pm.'' (Will — decision made at the moment of
    speaking.)'
  core_meaning: Fixed schedules and timetables that are set by an organisation or system, not by personal choice. The event
    is certain to happen at the scheduled time.
  timeline: Future time, but using the present simple form because the schedule is fixed and unchangeable. The speaker has
    no control over the timing.
phonetics:
- example_generator:
    contexts:
    - connected speech
    - preposition reduction
  l1_issue: 'Learners may stress ''at'' unnecessarily: ''AT 6pm'' instead of the natural weak form.'
  note: 'Time expressions with ''at'' use the weak form /ət/: ''at 6pm'' → /ət sɪks piː em/.'
- example_generator:
    contexts:
    - third-person -s
  l1_issue: The third-person -s is one of the most persistent errors for ESL learners. Drilling with timetable contexts provides
    meaningful practice.
  note: 'Third-person -s is often overlooked in speech: learners may say ''The train leave at 6'' instead of ''The train leaves
    at 6''.'
register_notes:
- note: 'Biber et al. (2021) — Present simple for future (timetables/schedules): more common in news and information registers
    than in conversation. Ch. 6.2.1.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.1.1
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7: The Tense-Aspect System-7.5'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - The train leaves at 6:15.
  - The bus arrives at 8:30.
  - The flight departs at noon.
  - The ferry leaves from Dover at 10am.
  rule: Use for transport timetables — trains, buses, flights, ferries
  type: grammatical
- examples:
  - The film starts at 7:30.
  - The concert begins at 8pm.
  - The match kicks off at 3pm.
  - The play finishes at 10:15.
  rule: Use for entertainment and event schedules — cinema, theatre, concerts, sports
  type: grammatical
- examples:
  - School starts at 8:45.
  - The meeting begins at 2pm.
  - The bank opens at 9am.
  - The restaurant closes at 11pm.
  rule: Use for institutional schedules — school, work, business hours
  type: grammatical
- examples:
  - The train leaves at 6pm every day.
  - The museum opens on Tuesdays at 10am.
  - The bus runs every 15 minutes.
  rule: 'Common time expressions: at + time, on + day, every + frequency'
  type: lexical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: One student is a ticket office clerk; the other is a traveller. The traveller asks about departure times,
      platforms, etc. using 'What time does...?'
    duration: 15
    name: Timetable Information Role-Play
  - adaptation_notes: 'Students design their dream school timetable and present it: ''On Monday, English starts at 10. Maths
      begins at 11:15.'' Great for practising time-telling and present simple.'
    duration: 15
    name: My Ideal School Timetable
  - adaptation_notes: 'Give students a cinema listings page. They must answer questions: ''What time does the 7:30 film finish?''
      ''Which film starts latest?'''
    duration: 10
    name: Cinema Programme Challenge
  tips:
  - 'GB3 Ch. 7: Simple present for future is most common with motion verbs (especially ''go'') and scheduled events: ''We
    get paid next Friday,'' ''They return home tomorrow.'' It is more formal and impersonal than present progressive for future
    plans: ''Aunt Jeanne arrives today'' (formal/scheduled) vs ''Aunt Jeanne is arriving today'' (personal plan). Source:
    Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch. 7 §7.5 (citing Torres Cacoullos & Walker 2009).'
  - Use real timetables (bus, train, cinema) as authentic material — print them or display on screen.
  - 'Contrast with ''going to'' for personal plans: ''The train leaves at 6'' (timetable) vs ''I am going to leave at 6''
    (personal plan).'
  - 'Practice question forms: ''What time does...?'' is the most useful question for real-life situations.'
  - Have students create their own timetables (school, ideal day, holiday itinerary) and present them.
  - Emphasise that this is NOT a general future form — it is only for fixed, scheduled events.
  - 'Swan PEU: Present simple for future events on a schedule: ''The train leaves at 6pm tomorrow.'' ''The meeting starts
    at 9am.'' Fixed timetables, not personal arrangements.'
title: Present Simple for Future (Timetables and Schedules)
use:
- context: Transport and travel
  description: The most common use — talking about when buses, trains, planes, and ferries depart and arrive.
  examples:
  - What time does the next train to Manchester leave?
  - The flight arrives at 9:45 local time.
  - The last bus leaves at midnight.
- context: Entertainment and events
  description: Talking about when films, shows, concerts, and sports events begin and end.
  examples:
  - The film we want to see starts at 6:15.
  - The concert finishes at 10pm, so we can catch the last train.
- context: Daily schedules and routines
  description: Describing the fixed times of institutions and services.
  examples:
  - The library opens at 10 and closes at 6.
  - My first class starts at 9am.
  - The supermarket is open from 7am to 11pm.
