common_errors:
- correction: The letter was sent yesterday.
  error: '*The letter is send yesterday.*'
  explanation: Passive tense is determined by the form of 'be'. 'Yesterday' requires past tense (was sent), not present (is
    sent).
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: Describes actions where the focus is on the action or the receiver, not the doer. Used across all major tenses.
dialectal_variation: []
discourse_notes:
- note: In conversation, this structure is used for everyday communication and is among the most frequent patterns in spoken
    English.
- note: In academic writing, this structure appears in discussions of established knowledge, methodology, and findings.
- note: In news reports, this structure is used for reporting events and attributing statements.
form:
  affirmative:
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
    structure: 'Subject + appropriate ''be'' form + past participle (V3)

      Present Simple: am/is/are + V3: "The letter is written."

      Past Simple: was/were + V3: "The letter was written."

      Present Continuous: am/is/are + being + V3: "The letter is being written."

      Past Continuous: was/were + being + V3: "The letter was being written."

      Present Perfect: have/has + been + V3: "The letter has been written."

      Future Simple: will + be + V3: "The letter will be written."

      Modal: ''modal + be + V3: "The letter should be written."''

      ''

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Add 'not' after the first auxiliary verb.
  questions:
    example_generator:
      contexts:
      - travel and places
      min_examples: 4
    structure: Move the first auxiliary verb before the subject.
grammar_point: passive_voice_all_tenses
level: B1
meaning:
  ccqs:
  - answer: Yes. The tense of 'be' changes to match the tense.
    purpose: Tests whether the learner understands that passive voice is not limited to one tense -- it can be formed in all
      tenses by changing the form of 'be' (is/was/will be/has been/etc.). This is essential for academic and professional
      writing.
    question: Can we use passive in all tenses?
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that passive voice all tenses is the only appropriate structure for this
      meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with passive voice all tenses and explain why
      they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with passive voice all tenses. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: 'Active: "The chef cooked the meal." (focus on the chef)

    Passive: "The meal was cooked by the chef." (focus on the meal)

    Passive (agent omitted): "The meal was cooked." (we don''t care who cooked it)

    '
  core_meaning: The focus shifts from the doer (agent) to the action or the receiver of the action. The agent may be unknown,
    obvious, or unimportant.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: All tenses. The passive can be used in any tense by changing the form of 'be'.
phonetics:
- example_generator:
    contexts:
    - passive stress
  l1_issue: 'Many L1 speakers struggle with past participle pronunciation. Drill common irregular forms: written, spoken,
    built, made, taken, given.'
  note: 'In passive sentences, the past participle is usually stressed: ''The letter is WRITTEN'', ''The building was DESTROYED.'''
register_notes:
- note: In formal writing, passive voice is used to depersonalize and focus on the process.
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, passive voice is less common; active voice is preferred.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Passive voice across all tenses: academic prose has highest frequency; conversation has lowest.
    Short passive is preferred over long passive by a wide margin. Ch. 6.4.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.4.1
