sub_rules:
- examples:
  - If I had studied harder, I would have passed the exam.
  - If she had accepted the job, she would have moved to London.
  - If they had saved money, they would have bought a house.
  rule: Third conditional for regret about the past
  type: semantic
- examples:
  - If the Titanic hadn't sunk, it would have reached New York.
  - If I had been born in another country, I would have spoken a different language.
  - If the internet had never been invented, life would have been very different.
  rule: Third conditional for imagining alternative past scenarios
  type: semantic
- examples:
  - If you had listened, you wouldn't have made a mistake.
  - If he had followed the rules, this wouldn't have happened.
  - If she had been more careful, she wouldn't have had an accident.
  rule: Third conditional for indirect criticism
  type: pragmatic
- examples:
  - If I had studied medicine, I would be a doctor now.
  - If she had accepted that job, she would be living in Paris now.
  - If they had saved money, they would own a house now.
  rule: 'Mixed conditional: if + past perfect, would + base verb (past condition → present result)'
  type: grammatical
- examples:
  - If I had studied, I could have passed.
  - If she had left earlier, she could have caught the train.
  - If they had known, they could have helped.
  rule: Third conditional with 'could have' for ability/possibility
  type: grammatical
teaching:
  methodology: Guided discovery with regret scenarios
  recommended_activities:
  - adaptation_notes: 'Students write 5 sentences about regrets using third conditional: ''If I had studied harder, I would
      have passed.'' Then share with a partner.'
    duration: 15
    name: Regret Stories
  - adaptation_notes: 'Teacher gives past scenarios. Students imagine alternative outcomes: ''You missed the bus.'' → ''If
      I hadn''t missed the bus, I wouldn''t have been late.'''
    duration: 15
    name: What If?
  - adaptation_notes: 'Students discuss alternative history scenarios: ''If World War II hadn''t happened...'' ''If the internet
      had never been invented...'' Practices third conditional with imaginative scenarios.'
    duration: 15
    name: Alternative History
  - adaptation_notes: 'Teacher says a situation. Students decide: second or third conditional? ''I don''t have a car.'' (second
      — present) ''I didn''t have a car yesterday.'' (third — past). Practices distinguishing the two.'
    duration: 10
    name: Second or Third?
  tips:
  - 'Start with the structure: if + past perfect, would have + past participle. Drill this until it becomes automatic.'
  - 'Use regret scenarios: ''If I had studied harder, I would have passed.'' This is the most common and relatable use.'
  - 'Contrast with second conditional: ''If I won (now/future) vs If I had won (past).'' Use timelines to show the difference.'
  - 'Teach mixed conditional as an extension: ''If I had studied medicine (past), I would be a doctor now (present).'''
  - 'Use alternative history scenarios to make it fun: ''If dinosaurs hadn''t become extinct...'' ''If the internet had never
    been invented...'''
  - 'Swan PEU: Third conditional = past unreal. "If I had studied harder, I would have passed the exam." (I did not study,
    I did not pass).'
  - 'Swan PEU: "Had had" in the if-clause is correct when the past perfect requires "had" as the main verb. "If I had had
    more time, I would have finished."'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'COUNTERFACTUAL MEANING: Third conditionals (''If I had known, I would have helped'') are not purely about past time
    — they express COUNTERFACTUAL meaning (the speaker DIDN''T know and DIDN''T help). The past perfect in the if-clause signals
    hypothetical distance from reality, not just past time. Same for mixed conditionals: present result of past condition
    (''If I had studied harder, I would be in medical school now''). Source: Ch.27 p.420-422.'
title: Third Conditional (Unreal Past)
use:
- context: Regret
  description: Expressing regret about past actions or inactions
  examples:
  - If I had studied harder, I would have passed the exam.
  - If she had accepted the job offer, she would be living in London now.
  - If they had saved more money, they would have bought a house.
  - If I had known you were coming, I would have cooked dinner.
- context: Hypothetical past scenarios
  description: Imagining what would have happened if the past had been different
  examples:
  - If the Titanic hadn't sunk, it would have reached New York safely.
  - If I had been born in Japan, I would have spoken Japanese.
  - If the internet had never been invented, we would have communicated by letter.
  - If dinosaurs hadn't become extinct, humans might never have existed.
- context: Indirect criticism
  description: Criticizing past actions indirectly by imagining alternatives
  examples:
  - If you had listened to me, you wouldn't have made that mistake.
  - If he had followed the instructions, the project wouldn't have failed.
  - If she had been more careful, she wouldn't have had an accident.
  - If they had planned better, the event would have been a success.
