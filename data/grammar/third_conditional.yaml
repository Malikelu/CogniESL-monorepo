common_errors:
- correction: If I had studied, I would have passed.
  error: 'Using ''would have'' in the if-clause: *''If I would have studied, I would have passed.'''
  explanation: In third conditional, the if-clause uses past perfect (had + past participle), not 'would have'. 'Would have'
    only appears in the main clause.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I had studied, I would have passed.
  error: 'Using past simple instead of past perfect: *''If I studied, I would have passed.'''
  explanation: Third conditional requires past perfect in the if-clause to show the unreal past condition.
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I had studied harder, I would have passed.
  error: 'Omitting ''had'': *''If I studied harder, I would have passed.'''
  explanation: Past perfect requires 'had' + past participle. Omitting 'had' makes it second conditional.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I had studied, I would have passed.
  error: 'Using ''had have'': *''If I had have studied, I would have passed.'''
  explanation: 'Swan PEU: "Had have" in the if-clause is a common error. The correct form is past perfect: "had studied".'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 37.4. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Used to talk about hypothetical situations in the past that did not happen, and their imagined results. Expresses
  regret or hypothetical past scenarios.
dialectal_variation:
- note: In informal speech, 'would have' is often contracted to 'would've' /wʊdəv/.
- note: 'In some dialects, ''had'' may be reduced to /əd/ or even omitted in fast speech: ''If I''d studied'' or ''If I studied''
    (non-standard).'
discourse_notes:
- note: 'Third conditional creates counterfactual narratives: ''If I had taken that job, I would have moved to London. My
    whole life would have been different.'''
- note: 'Third conditional is used for expressing regret about past decisions: ''If I had studied harder, I would have passed
    the exam.'''
- note: 'In academic writing, third conditional is used for discussing alternative research outcomes: ''If the methodology
    had been different, the results might have varied.'''
- note: 'Third conditional can be used for indirect criticism: ''If you had listened to me, this wouldn''t have happened.'''
form:
  affirmative:
    example_generator:
    - If I had studied, I would have passed the test.
    - If she had left earlier, she would have caught the train.
    - If they had known, they would have helped.
    min_examples: 4
    structure: If + past perfect, would have + past participle
  negative:
    example_generator:
    - If I hadn't eaten so much, I wouldn't have felt sick.
    - If she hadn't missed the bus, she wouldn't have been late.
    - If they hadn't spent so much, they would have saved money.
    min_examples: 4
    structure: If + past perfect (negative), would not have (wouldn't have) + past participle
  questions:
    example_generator:
    - Would you have passed if you had studied?
    - Would she have caught the train if she had left earlier?
    - Would they have helped if they had known?
    min_examples: 4
    structure: Would + subject + have + past participle if + past perfect?
grammar_point: third_conditional
level: B2
meaning:
  ccqs:
  - answer: No — it is hypothetical. The past was different.
    purpose: Tests whether the learner understands that third conditional describes past situations that did NOT happen. This
      is the fundamental distinction from first and second conditional (which refer to present/future).
    question: Did this situation actually happen?
  - answer: No — that is why we use third conditional. We are imagining an alternative past.
    purpose: Tests whether the learner understands the counterfactual nature of third conditional. The past is fixed; we are
      only imagining what would have been different.
    question: Can we change the past?
  - answer: It could be any of these. Third conditional is used for all three.
    purpose: Tests whether the learner understands the range of communicative functions of third conditional. It is not just
      about regret -- it can express criticism ("If you had studied harder, you would have passed") or pure imagination ("If
      dinosaurs had survived, humans would not exist").
    question: Is this about regret, criticism, or imagination?
  - answer: '''If I had known, I would have told you.'' In the third conditional, the if-clause uses past perfect (had + past
      participle), NOT ''would have''.'
    purpose: Tests whether the learner knows that third conditional if-clause uses past perfect, not 'would have' (Swan PEU
      2016, entries 277-278).
    question: Which is correct? *'If I would have known, I would have told you' or 'If I had known, I would have told you'?
  contrast: '''Second Conditional'' = ''If I won, I would travel.'' (unreal present/future) vs ''Third Conditional'' = ''If
    I had won, I would have traveled.'' (unreal past — it did not happen)'
  core_meaning: Describes past situations that were contrary to fact — they did NOT happen. We imagine what WOULD HAVE happened
    if the past had been different. Used for regret, criticism, or imagining alternative past scenarios. The past cannot be
    changed — this is purely hypothetical.
  example_generator:
    contexts:
    - regret
    - hypothetical past scenarios
    - criticism
    - alternative history
    cultural_notes:
    - Use diverse scenarios (career, education, travel, relationships)
    - Avoid examples that may trigger strong emotional responses
    - Keep examples imaginative but respectful
    min_examples: 5
  timeline: 'Past: Refers to past situations that did not happen. Both the condition and the result are in the past. The situation
    is impossible to change.'
phonetics:
- example_generator:
  - would have → would've /wʊdəv/
  - wouldn't have /wʊdəntəv/
  - had → /əd/ or /d/
  l1_issue: Many L1 speakers over-pronounce 'would have' as /wʊd hæv/. Teach the contracted form /wʊdəv/ for natural speech.
  note: 'Contractions are essential: ''would have'' → ''would''ve'' /wʊdəv/, ''would not have'' → ''wouldn''t have'' /wʊdəntəv/,
    ''had'' → /əd/ or /d/.'
- example_generator:
  - if I had → /ɪf aɪd/
  - if she had → /ɪf ʃiːd/
  l1_issue: Portuguese and Spanish speakers often over-pronounce 'had' in third conditional. Teach the reduced form.
  note: In connected speech, 'if I had' often reduces to /ɪf aɪd/ or even /ɪfəd/. 'If I had studied' sounds like /ɪf aɪd stʌdid/.
