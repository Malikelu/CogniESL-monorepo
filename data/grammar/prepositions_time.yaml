- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents
    how transfer effects are non-linear, determined by functional fit between L1 and
    L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects
    are non-linear — determined by functional fit between L1 and L2 systems rather
    than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
- claim: Swan & Smith (2001) provide the definitive cross-linguistic reference for
    L1-specific error patterns in English. Their learner English framework documents
    how each L1 group produces characteristic errors in this grammatical domain, enabling
    teachers to anticipate and address transfer errors before they fossilize.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_errors:
- correction: I will meet you on Monday.
  error: '*I will meet you in Monday.*'
  explanation: '''On'' is for days and dates (on Monday, on July 4th). ''In'' is for
    months, years, and parts of day (in July, in 2023, in the morning). ''At'' is
    for exact times (at 5pm, at noon).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entries 209-214. Swan (2016) Practical English Usage, 4th ed. Oxford
    University Press.
description: 'Prepositions used to talk about when something happens: at (specific
  time), in (months/years/seasons), on (days/dates).'
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - schedules and appointments
      - daily routines
      - holidays and special dates
      min_examples: 4
    structure: 'at + specific time: ''at 3pm'', ''at noon'' / in + month/year/season:
      ''in July'', ''in 2024'' / on + day/date: ''on Monday'', ''on July 4th'''
  negative:
    example_generator:
      contexts:
      - schedules and appointments
      - daily routines
      - holidays and special dates
      min_examples: 4
    structure: 'Same preposition, negated verb: ''The class doesn''t start at 9am.'''
  questions:
    example_generator:
      contexts:
      - schedules and appointments
      - daily routines
      - holidays and special dates
      min_examples: 4
    structure: 'When + be/auxiliary?: ''When is the meeting?'' → ''At 3pm.'''
grammar_point: prepositions_time
key_principles: []
level: A1
meaning:
  ccqs:
  - answer: Use 'at' (at 3pm)
    purpose: 'Tests whether the learner can distinguish between the three main time
      prepositions: at (exact time), on (days/dates), in (months/years/periods).'
    question: Is it a specific clock time?
  - answer: Use 'on' (on Monday)
    purpose: Tests understanding of prepositions_time.
    question: Is it a day or date?
  - answer: Use 'in' (in July)
    purpose: Tests understanding of prepositions_time.
    question: Is it a month, year, or season?
  - answer: '''I have been waiting for two hours.'' Use ''for'' with a period of time
      and ''since'' with a starting point.'
    purpose: Tests whether the learner distinguishes 'for' (duration) from 'since'
      (starting point) (Swan PEU 2016, entries 51-52).
    question: Which is correct? *'I have been waiting since two hours' or 'I have
      been waiting for two hours'?
  contrast: '''At'' = specific time (at 3pm) vs ''In'' = longer periods (in July)
    vs ''On'' = days/dates (on Monday)'
  core_meaning: Prepositions of time tell us WHEN something happens. Each preposition
    is used with different time expressions.
  example_generator:
    contexts:
    - schedules and appointments
    - daily routines
    - holidays and special dates
    - telling time
    cultural_notes: []
    min_examples: 5
  timeline: Specific to the time expression used with each preposition.
phonetics:
- contexts:
  - connected speech
  example_generator:
    contexts:
    - connected speech
  l1_issue: Prepositions are often omitted or confused by L1 speakers
  note: 'Weak forms: /æt/ → /ət/, /ɪn/ → /ən/, /ɒn/ → /ən/'
register_notes:
- note: 'Biber et al. (1999) — Time prepositions: register distribution varies. Academic
    prose uses more precise and complex temporal prepositions; conversation uses simpler
    markers. Ch. 5.3.3'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman Publishing
    Company. Ch. 5.3.3
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I wake up at 7am.
  - We rest at night.
  rule: 'at: at 3pm, at noon, at night, at the weekend'
  type: grammatical
- examples:
  - I was born in 1990.
  - We swim in summer.
  rule: 'in: in the morning, in July, in 2024, in summer'
  type: grammatical
- examples:
  - The class is on Monday.
  - We celebrate on Christmas Day.
  rule: 'on: on Monday, on July 4th, on my birthday'
  type: grammatical
- examples:
  - I study every day. (not 'on every day')
  - See you tomorrow. (not 'on tomorrow')
  rule: 'No preposition with: today, tomorrow, yesterday, last, next, this, every'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students sort time expressions into at/in/on columns.
    duration: 10
    name: Time Preposition Sort
  tips:
  - Use a timeline to visualize at/in/on
  - Create a chart with time expressions
  - 'Swan PEU: Time and place prepositions — at precise points, in enclosed spaces/periods,
    on surfaces/days. This distinction underlies most time and place preposition usage
    in English.'
title: Prepositions of Time (At, In, On)
use:
- context: Making appointments
  description: Scheduling meetings and events
  examples:
  - Let's meet at 3pm.
  - The party is on Saturday.
- context: Talking about routines
  description: Describing when things happen regularly
  examples:
  - I exercise in the morning.
  - We have class on Mondays.
