common_errors:
- correction: I did it myself. / I hurt myself.
  error: '*I myself did it.* (emphasis) vs *I hurt me.* (reflexive)'
  explanation: Reflexive pronouns are used when subject and object are the same (I hurt myself) or for emphasis (I did it
    myself). 'I hurt me' is incorrect.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Pronouns'
- correction: Please contact me.
  error: 'Using reflexive when not needed: *''Please contact myself.'''
  explanation: 'Swan (2016) PEU Entry 178: Reflexive pronouns are used when subject and object are the same person. "I hurt
    myself" (OK). "Contact me" (NOT "contact myself").'
  l1_groups: &id001
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 72. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: They did it by themselves.
  error: 'Using ''hisself'' / ''theirselfs'': *''They did it by theirselfs.'''
  explanation: 'Swan PEU: Correct reflexives -- myself, yourself, himself, herself, itself, ourselves, yourselves, themselves.
    "Hisself" and "theirself" are non-standard.'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 72. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Pronouns that refer back to the subject of the sentence, indicating the subject and object are the same person
  or thing.
