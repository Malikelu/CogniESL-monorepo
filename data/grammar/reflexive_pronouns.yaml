teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students identify if a reflexive pronoun is needed: ''I cut ___'' (myself), ''She cut ___'' (herself),
      ''I cut him'' (NOT himself — different person).'
    duration: 10
    name: Reflexive or Not
  - adaptation_notes: 'Students memorize the complete list using a chant: ''Myself, yourself, himself, herself, itself, ourselves,
      yourselves, themselves.'''
    duration: 10
    name: Reflexive Pronoun List
  tips:
  - 'GB3 Ch. 16: Reflexive pronouns replace NP objects that refer back to the subject. Exception: object pronouns, NOT reflexives,
    are used after prepositions of place: ''He set his briefcase down next to him'' (not *next to himself). But reflexives
    ARE used after other prepositions: ''He was angry with himself.'' Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd
    ed. Ch. 16 §16.1.'
  - 'Week 1: Basic reflexive pronouns (match to subject: I → myself, you → yourself).'
  - 'Week 2: Emphatic use and placement.'
  - 'Week 3: Idiomatic expressions (help yourself, make yourself at home).'
  - 'Use mirror activity: Students point to themselves and say ''I see myself'' to reinforce the concept.'
  - 'Swan PEU: Reflexives for emphasis. "I made it myself" (emphasis). "The mayor herself opened the building" (emphatic).'
  - 'Swan PEU: "Each other" vs "one another". Traditionally: "each other" for two people, "one another" for three+. In practice,
    they are interchangeable in modern English.'
title: Reflexive Pronouns (myself, yourself, himself, herself, itself, ourselves, yourselves, themselves)
use:
- description: Action is done to the subject by the subject.
  examples:
  - She washed herself.
  - We introduced ourselves.
  key_point: Reflexive pronoun must match the subject's person/number.
  name: Same Subject/Object
- description: Emphasize the subject did the action alone (no help).
  examples:
  - I built this house myself.
  - She fixed the car herself.
  key_point: Placed after the verb or at the end of the sentence for emphasis.
  name: Emphasis
- description: Fixed phrases using reflexive pronouns.
  examples:
  - Help yourself to food.
  - Make yourself at home.
  - Behave yourself.
  key_point: Memorize common idiomatic uses.
  name: Idiomatic Expressions
