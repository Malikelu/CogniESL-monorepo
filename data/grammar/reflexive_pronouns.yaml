grammar_point: reflexive_pronouns
level: A2
meaning:
  ccqs:
  - answer: Yes — the subject does the action to itself.
    purpose: 'Tests whether the learner understands the fundamental condition for using reflexive pronouns: the subject and
      object must be the same entity.'
    question: Does the subject and object refer to the same person?
  - answer: Yes — without it, the sentence would be ungrammatical or have a different meaning.
    purpose: Tests whether the learner can distinguish when a reflexive pronoun is required (subject = object) vs when a regular
      pronoun is needed.
    question: Is the reflexive pronoun necessary here?
  - answer: Yes — it emphasizes that I did it personally, not someone else.
    purpose: 'Tests whether the learner understands the emphatic use: ''I did it myself'' (emphasis) vs ''I hurt myself''
      (reflexive).'
    question: Is this reflexive pronoun used for emphasis?
  - answer: When the subject and object refer to the same person, English requires a reflexive pronoun (myself, yourself,
      himself, etc.), not a regular object pronoun. 'I cut me' uses the object pronoun 'me' which implies a different person
      from the subject 'I'. 'I cut myself' correctly shows that the subject and object are the same person.
    purpose: Tests whether the learner understands the grammatical rule that reflexive pronouns must be used when the object
      of a verb is the same as the subject. This is a fundamental rule of English grammar at A2 level, and using a regular
      object pronoun (me, him, her) instead of a reflexive pronoun (myself, himself, herself) when subject and object are
      identical is a common error across many L1 backgrounds.
    question: Why is 'I cut myself' correct but 'I cut me' incorrect?
  contrast: 'Non-reflexive: "I cut the bread." (object = bread, different from subject)

    Reflexive: "I cut myself." (object = myself, same as subject)

    '
  core_meaning: Reflexive pronouns indicate the action of the verb is performed on the subject itself (subject = object).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Reflexive pronouns are not tense-based; they match the subject's person and number.)
