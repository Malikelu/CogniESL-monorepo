  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals'
  tier: 1
- claim: 'Register distribution: I wish and if only are most common in conversation
    (expressing immediate regrets) and literary/fiction writing (character reflection).
    They are rare in academic prose.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals'
  tier: 1
- claim: 'Discourse function: Wish and if only express counterfactual desires about
    the present, past, or future, using past tense forms to signal unreality.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals'
  tier: 1
- claim: Common error '*I wish I can speak English fluently.*' for Portuguese, Spanish,
