- correction: He scores! The goalkeeper dives but he misses it.
  error: 'He scored! The goalkeeper dived but he missed it. (using past tense for live commentary)'
  explanation: Live commentary uses present tenses to describe actions as they happen. Using past tense (scored, dived, missed) sounds like a news report after the event, not live commentary.
