grammar_point: verbs_followed_by_to_infinitive
title: Verbs Followed by To-Infinitive (want, decide, hope)
description: Verbs that must be followed by 'to + verb' (infinitive). Essential for accurate verb patterns.
level: A2
meaning:
  core_meaning: These verbs require 'to + verb' as their complement. Expresses intention, decision, or future-related action.
  timeline: The 'to' infinitive often refers to future actions from the perspective of the main verb.
  contrast: '''Want + to'' (correct) vs ''want + -ing'' (wrong)

    ''Decide + to'' (correct) vs ''decide + -ing'' (wrong)

    These are MEMORIZED patterns - no logic rule

    '
  ccqs:
  - question: Which verbs are followed by to infinitive
    answer: Want, need, decide, plan, hope, agree, refuse, promise, offer.
    purpose: Tests whether the learner understands a key concept of verbs_followed_by_to_infinitive. This is fundamental for
      correct use of this grammar point.
  - question: Can we use a different structure here with the same meaning?
    answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that verbs followed by to infinitive is the only appropriate structure
      for this meaning/context.
  - question: What is the difference in meaning between these two forms?
    answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with verbs followed by to infinitive and explain
      why they are incorrect.
  - question: Which is correct? *'She made him to clean his room' or 'She made him clean his room'?
    answer: '''She made him clean his room.'' After ''make'' (causative), use the bare infinitive (no ''to'').'
    purpose: Tests whether the learner knows that 'make' takes the bare infinitive, not the to-infinitive (Swan PEU 2016,
      entry 105.3).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
form:
  affirmative:
    structure: 'Verb + to + base verb: "I want to go."

      Verb + object + to + base verb: "I told him to go."

      Common verbs: want, need, decide, hope, plan, expect, promise, agree, offer, refuse

      '
    example_generator:
      contexts:
      - education and school
      - travel and places
      min_examples: 4
  negative:
    structure: 'Verb + not + to + base verb: ''I told him not to go.'''
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
  questions:
    structure: Question word + auxiliary + subject + verb + to + base verb?
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
sub_rules:
- rule: Want, need, decide, plan, hope, agree, refuse, promise, offer followed by to infinitive
  type: grammatical
  examples:
  - I want to study
  - She needs to work
  - He decided to leave
  - They plan to travel
  - We hope to see you
- rule: Would like, would love, would hate, would prefer followed by to infinitive
  type: grammatical
  examples:
  - I would like to go
  - She would love to visit
  - He would hate to miss it
  - They would prefer to stay
- rule: Learn, teach, manage, afford, seem, appear followed by to infinitive
  type: grammatical
  examples:
  - I learned to swim when I was 5
  - She taught me to cook
  - He managed to finish on time
  - They cannot afford to buy a house
use:
- name: Wants/Needs (want, need, would like)
  description: Verbs about desires and necessities.
  examples:
  - I want to sleep.
  - She needs to go.
  - I'd like to help.
  key_point: Most common group - everyday communication.
- name: Decisions/Plans (decide, plan, hope, expect)
  description: Verbs about future intentions.
  examples:
  - I decided to go.
  - We plan to visit.
  - He expects to win.
  key_point: These all look toward future actions.
- name: Communication/Orders (tell, ask, invite, remind)
  description: Verbs that tell others what to do.
  examples:
  - I told him to wait.
  - She asked me to help.
  - They invited us to come.
  key_point: 'These take object + to + verb: ''tell SOMEONE to do''.'
phonetics:
- note: 'The to in to infinitives is usually reduced to /tə/ in connected speech: ''I want to go'' → /aɪ wɒnt tə ɡəʊ/. The
    to is never pronounced as /tuː/ in connected speech.'
  example_generator:
    contexts:
    - to infinitive reduction
  l1_issue: Learners may over-pronounce 'to' as /tuː/ before infinitives. Teach the reduced form /tə/ for natural speech.
teaching:
  methodology: PPP
  tips:
  - 'Use ''to'' as arrow pointing to future: ''want → to go''.'
  - 'Group: ''want, need, decide, plan'' as ''future intention'' group.'
  - Practice 'tell/ask someone to...' with classroom commands.
  - 'Swan PEU: Verbs followed by to-infinitive — agree, arrange, ask, begin, choose, continue, decide, expect, fail, forget,
    happen, help, hope, intend, learn, manage, offer, plan, prefer, pretend, promise, refuse, seem, start, try, want, wish.
    Teach as a frequency-ranked list, starting with most common: want to, try to, need to.'
  - 'Swan PEU: Some verbs take an object before the infinitive: help, allow, encourage, enable, teach, train. ''She encouraged
    me to apply.'' ''They helped me to move.'' The bare infinitive is also possible after help: ''They helped me move.'''
  - 'Swan PEU: Passive infinitive after verbs: ''She was asked to leave.'' ''He seems to have forgotten.'' Review connections
    with passive voice after modal and cognitive verbs.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 14: CGEL (Ch.14) analyzes infinitival ''to'' as a preposition
    (not an infinitive marker). In ''I want to leave,'' ''to'' heads a prepositional phrase whose complement is a bare infinitival
    clause. This analysis unifies ''to'' across its uses: ''to London'' (preposition + NP), ''to leave'' (preposition + clause).
    Controversial but internally consistent.'
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle. Ch. 14: GB3 Ch. 14 distinguishes
    CONTROL and RAISING in infinitival complements: SUBJECT CONTROL: ''I want to leave'' — ''I'' is the subject of BOTH ''want''
    and ''leave.'' OBJECT CONTROL: ''I want him to leave'' — ''him'' is object of ''want'' but subject of ''leave.'' RAISING:
    ''She seems to be happy'' — ''she'' is NOT the semantic subject of ''seems'' but is raised to matrix subject position.
    This matters for error analysis: *''She seems that she is happy'' (attempting a raising structure with a that-clause)
    is ungrammatical.'
  recommended_activities:
  - name: Verb Sorting
    duration: 10
    adaptation_notes: 'Students sort verbs into groups: to infinitive only, ing only, and both.'
  - name: Future Plans
    duration: 15
    adaptation_notes: 'Students describe their future plans using want, plan, hope, decide: ''I want to travel to Japan. I
      plan to save money.'''
sources:
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
common_errors:
- error: '*I want that he comes.*'
  correction: I want him to come.
  explanation: Want + person + to + verb.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  source: Swan Entries 97-98. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
  reliability: B
register_notes: []
dialectal_variation: []
discourse_notes: []
