common_errors:
- correction: I like both coffee and tea.
  error: 'Using ''either'' for two positive items: *''I like either coffee or tea.''
    (both)'
  explanation: '''Both'' = two together. ''Either'' = one of two. ''Neither'' = not
    one or the other.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: I like neither coffee nor tea.
  error: 'Using ''neither'' without ''nor'': *''I like neither coffee.'''
  explanation: '''Neither'' must be paired with ''nor''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
description: 'Quantifiers used to talk about two people or things: both (two together),
  either (one of two), neither (not one of two).'
dialectal_variation: []
discourse_notes:
- note: 'These determiners specify quantity: ''Both books are good.'' / ''Either option
    works.'' / ''Neither answer is correct.'''
- 'In discourse, both/either/neither quantify reference to two items: both = inclusive
  (the two together), either = selective (one of the two), neither = exclusive negative
  (not one and not the other). Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch.
  17.'
form:
  affirmative:
    example_generator:
    - Both students are here.
    - Either option works.
    - Neither student came.
    min_examples: 4
    structure: Both + plural noun / Either + singular noun / Neither + singular noun
  negative:
    example_generator:
    - I do not like either.
    - I like neither.
    - Neither option suits me.
    min_examples: 4
    structure: Not + either / Neither (already negative, never add not)
  questions:
    example_generator:
    - Are both students coming?
    - Do both of you agree?
    - Is either option acceptable?
    min_examples: 4
    structure: Are both...? / Do both...? / Is either...?
grammar_point: both_either_neither
level: A2
meaning:
  ccqs:
  - answer: Two. Both always means the two together.
    purpose: Tests whether the learner can distinguish between 'both' (two together),
      'either' (one of two), and 'neither' (not one of two). These quantifiers have
      distinct meanings and grammatical requirements.
    question: Both students passed the exam. Did one pass or two pass?
  - answer: No. Either means one of the two, not both.
    purpose: Tests whether the learner understands that 'either' means one of two
      (a choice), not both. Learners often confuse 'either' with 'both'.
    question: You can take either road. Can you take both roads?
  - answer: No. Neither restaurant is open. Both are closed.
    purpose: Tests whether the learner understands that 'neither' means both options
      are negative. This is a key concept for using 'neither' correctly.
    question: Neither restaurant is open. Is the first restaurant open? Is the second?
  - answer: No. I do not like either is a negative verb plus either. I like neither
      uses a negative quantifier with a positive verb (neither = not one or the other).
      Both sentences express the same meaning (disliking both options), but their
      grammar differs. A common error is I do not like neither, which creates a double
      negative.
    purpose: Tests whether the learner understands the different grammatical patterns
      for expressing negative agreement with two items. Learning neither with a positive
      verb (rather than double negation) is essential because I do not like neither
      is grammatically incorrect in standard English, despite being common in some
      dialects.
    question: I do not like either versus I like neither -- are these sentences grammatically
      the same?
  contrast: Both = two together. Either = one of two. Neither = not one of two.
  core_meaning: Both means two things together. Either means one of two (a choice).
    Neither means not one of two (negative choice).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes:
    - Me neither is extremely common in informal spoken English
    - Either and neither take singular verbs in formal English
    min_examples: 5
  timeline: N/A — these are quantifiers showing quantity or choice between two items.
phonetics:
- example_generator:
  - both → /bəʊð/
  - either → /ˈaɪðə/
  - neither → /ˈnaɪðə/
  l1_issue: Many learners substitute /d/ or /z/ for /ð/. Spanish speakers may use
    /d/; French and German speakers may use /z/ or /s/.
  note: The th in both, either, neither is the voiced dental fricative /ð/. The tongue
    tip touches the back of the upper teeth.
- example_generator:
  - either → /ˈaɪðə/
  - neither → /ˈnaɪðə/
  l1_issue: Some learners use second-syllable stress /aɪˈðə/, which is a regional
    variant but can confuse.
  note: 'Either and neither have first-syllable stress: /ˈaɪðə/ and /ˈnaɪðə/. The
    second syllable is reduced to a schwa.'
register_notes:
- note: '''Both/either/neither'' are neutral in register.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Correlative and distributive quantifiers (''both'',
    ''either'', ''neither''): academic prose uses these more for precise logical coordination;
    conversation uses simpler additive expressions. Ch. 4.4.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 4.4.4
