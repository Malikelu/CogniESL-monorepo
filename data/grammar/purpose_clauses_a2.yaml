common_errors:
- correction: I went to the store to buy milk.
  error: '*I went to the store for to buy milk.*'
  explanation: Use 'to + base verb' for purpose, not 'for to + verb'. This archaic form ('for to') does not exist in modern
    standard English. The error comes from overgeneralizing 'for' as a purpose marker before infinitives.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: I study English to get a better job.
  error: '*I study English for get a better job.*'
  explanation: Purpose is expressed with 'to + infinitive', not 'for + base verb'. 'For' is followed by a noun (for a job),
    not a verb. This error directly translates the structure from Portuguese/Spanish 'para conseguir'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: She called him so that he could come early.
  error: '*She called him so that he can come early.*'
  explanation: '''So that'' purpose clause requires a modal that matches the tense of the main verb. If the main verb is past
    (''called''), the modal should be ''can'' to ''could''. Tense harmony between clauses is expected.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Korean
  reliability: D
- correction: I am saving money in order to buy a car.
  error: '*I am saving money in order I can buy a car.*'
  explanation: '''In order to'' (not ''in order'' alone) introduces a purpose infinitive. The full form requires ''to'' before
    the verb. Dropping ''to'' creates an incomplete structure. Same rule applies to ''so as to''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
description: Simple structures to express why someone does something. At A2, we focus on 'to + verb', 'in order to', and 'so
  that' to explain reasons and goals.
dialectal_variation: []
discourse_notes:
- note: Purpose clauses at A2 level focus on basic to-infinitive structures (I study to learn), progressing to more complex
    patterns.
form:
  affirmative:
    example_generator:
      contexts:
      - education and school
      - shopping and commerce
      - health and wellbeing
      min_examples: 4
    structure: 'to + verb: "I went to buy milk."

      in order to + verb: "I went in order to buy milk."

      so that + subject + can/will: "I went so that I can buy milk."

      '
  negative:
    example_generator:
      contexts:
      - education and school
      min_examples: 4
    structure: 'in order not to + verb: "I left early in order not to be late."

      so that + subject + won''t/can''t: "I left early so that I won''t be late."

      '
  questions:
    example_generator:
      contexts:
      - social interactions
      min_examples: 4
    structure: Why + auxiliary + subject + verb? 'Why did you go?' 'To buy milk.'
grammar_point: purpose_clauses_a2
level: A2
meaning:
  ccqs:
  - answer: When the purpose clause has a different subject.
    purpose: Tests whether the learner can identify the purpose or goal of an action. Purpose clauses require specific structures
      (to, in order to, so that) that differ from reason clauses.
    question: When do we use so that instead of to
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that purpose clauses a2 is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner knows the mandatory modal verb slot after 'so that'. At A2, learners frequently produce
      'so that everyone understand' without a modal, which is ungrammatical. The 'so that' purpose clause requires a modal
      (can, will, could, would) to be complete.
    question: What is the difference in meaning between these two forms?
  - answer: '''I study hard to pass the exam.'' For purpose, use ''to + infinitive'', NOT ''for to''.'
    purpose: Tests whether the learner uses 'to + infinitive' (not 'for to') for purpose clauses (Swan PEU 2016, entry 113.2).
    question: Which is correct? *'I study hard for to pass the exam' or 'I study hard to pass the exam'?
  contrast: '''To + verb'' = simple purpose (same subject): "I went to buy milk."

    ''In order to'' = more formal/emphatic: "I went in order to buy milk."

    ''So that'' = purpose with different subjects or modals: "I went so that I could buy milk."

    '
  core_meaning: Expresses the goal or intention behind an action -- answers 'Why?' with intention, not cause.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Present or past form shows when the intention existed.
phonetics:
- example_generator:
    contexts:
    - purpose clause pronunciation
  l1_issue: Portuguese speakers may say 'for buy' instead of 'to buy'. Teach the correct form.
  note: 'To is weak before verbs: ''to buy'' → /tə baɪ/, ''to study'' → /tə ˈstʌdi/.'
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Purpose clauses: academic prose uses more explicit purpose markers (in order to, so that);
    conversation uses simpler markers (to-infinitive). Ch. 10.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2
