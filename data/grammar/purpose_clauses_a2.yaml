  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24: Coordination (purpose clauses)'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 27: Coordination'
