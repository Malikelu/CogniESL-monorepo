common_errors:
- correction: I go to school on foot. / I walk to school.
  error: '*I go to school by foot.*'
  explanation: Some prepositional phrases are fixed expressions. 'On foot' (not 'by foot') is the fixed expression for walking.
    'By bus/by car/by train' use 'by', but 'on foot' is an exception.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entries 209, 212. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- error: Finnish L1 omits prepositions due to case inflection transfer (covert transfer) (Odlin Ch.3)
  explanation: 'Odlin (Ch.3): Jarvis & Odlin (2000). Finnish uses case inflections (15 cases), not prepositions. "nurmikolle"
    = stem + allative -lle = "on(to) the grass". Example: "go to sit the grass" (missing "on"). COVERT transfer: ABSENCE reflects
    L1 influence. Occurred ONLY among Finnish learners.'
  l1_groups:
  - Finnish
  reliability: C
  source: Odlin, T. Explorations of Language Transfer, Ch. 3; Jarvis & Odlin (2000)
description: Multi-word prepositions and complex prepositional phrases that express relationships of time, place, cause, manner,
  and other semantic roles in formal and informal English.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - formal writing
      - academic essays
      - business communication
      min_examples: 4
    structure: Preposition (simple or complex) + Noun Phrase. Complex prepositions can be two words (in spite of, due to,
      apart from) or three+ words (in addition to, with regard to, by means of, in the event of). The noun phrase may include
      its own determiners and modifiers.
  negative:
    example_generator:
      contexts:
      - formal negation
      - legal language
      - academic writing
      min_examples: 3
    structure: 'Negation within a prepositional phrase typically involves ''no'' or ''not'' in the noun phrase: ''in the absence
      of any evidence,'' ''with no regard for safety,'' ''without consideration of the consequences.'''
  questions:
    example_generator:
      contexts:
      - formal enquiries
      - academic discussion
      - business meetings
      min_examples: 3
    structure: 'Prepositional phrases in questions often use fronted prepositions (formal) or stranded prepositions (informal):
      ''With regard to what are you writing?'' (formal) vs ''What are you writing with regard to?'' (less common). More naturally:
      ''What are you writing about?'''
grammar_point: prepositional_phrases
key_principles: []
level: B2
meaning:
  ccqs:
  - answer: It functions as a single complex preposition — it has one meaning (despite) and cannot be broken apart.
    purpose: Tests whether the learner understands that prepositional phrases (in the morning, at home, by bus) function as
      adverbials to express time, place, manner, and other circumstances.
    question: Is 'in spite of' one preposition or three separate words?
  - answer: In most cases, yes, but 'with regard to' is more formal and precise. 'About' can be vaguer.
    purpose: Tests understanding of prepositional_phrases.
    question: Can we replace 'with regard to' with 'about'?
  - answer: '''In front of'' means outside and before something (in front of the house = on the street). ''In the front of''
      means inside the front part (in the front of the house = in the front room).'
    purpose: Tests understanding of prepositional_phrases.
    question: Can you explain the difference between 'in front of' and 'in the front of' by giving an example of when to use
      each?
  - answer: '''I look forward to seeing you.'' After ''look forward to'', use the -ing form. ''To'' here is a preposition,
      not an infinitive marker.'
    purpose: Tests whether the learner knows that 'to' can be a preposition (followed by -ing) (Swan PEU 2016, entry 104).
    question: Which is correct? *'I look forward to see you' or 'I look forward to seeing you'?
  contrast: 'Simple preposition: ''because of the rain'' vs Complex preposition: ''on account of the rain.'' Simple: ''about
    the problem'' vs Complex: ''with regard to the problem.'' Complex prepositions are generally more formal.'
  core_meaning: Prepositional phrases consist of a preposition (simple or complex) followed by a noun phrase. Complex prepositions
    are multi-word units that function as a single preposition (e.g., 'in spite of,' 'with regard to,' 'by means of'). They
    express more precise relationships than simple prepositions alone.
  example_generator:
    contexts:
    - formal writing
    - academic essays
    - business communication
    - legal documents
    - everyday conversation
    cultural_notes:
    - Complex prepositions are far more common in formal British English than in casual American English, where simpler alternatives
      are preferred.
    - 'Legal and bureaucratic English relies heavily on complex prepositions: ''in accordance with,'' ''in the event of,''
      ''subject to.'''
    min_examples: 5
  timeline: Timeless — prepositional phrases are not tied to any tense.
phonetics:
- example_generator:
    contexts:
    - spoken English
    - formal presentations
  l1_issue: Learners may give equal stress to all words in a complex preposition, making speech sound unnatural and difficult
    to follow.
  note: 'In complex prepositions, stress typically falls on the content word within the phrase, not the function words: ''in
    spite of'' (stress on ''spite''), ''with regard to'' (stress on ''gard''), ''by means of'' (stress on ''means'').'
- example_generator:
    contexts:
    - casual speech
    - connected speech
  l1_issue: Learners who pronounce every word fully and separately may sound overly formal or stilted in casual conversation.
  note: 'In connected speech, complex prepositions often reduce: ''because of'' becomes /bɪˈkɒzəv/ or even /bɪˈkɒz/; ''in
    front of'' may reduce to /ɪn ˈfrʌntəv/.'
register_notes:
- note: 'Biber et al. (2021) — Prepositional phrases: academic prose uses more PPs (as noun phrase postmodifiers and as adverbial
    adjuncts). Conversation uses fewer and simpler prepositional phrases. PP density is a register correlate. Ch. 5.3.3, 8.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 5.3.3
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21: Prepositions'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - The flight was delayed due to fog.
  - Owing to unforeseen circumstances, the event has been cancelled.
  - Thanks to her hard work, the project was a success.
  - On account of the strike, all trains have been cancelled.
  rule: Complex prepositions of cause and reason (due to, owing to, because of, on account of, thanks to)
  type: grammatical
- examples:
  - In spite of the heavy rain, the match went ahead.
  - Despite having no experience, she got the job.
  - Regardless of the cost, we must proceed.
  - Notwithstanding the objections, the plan was approved.
  rule: Complex prepositions of contrast and concession (in spite of, despite, regardless of, notwithstanding)
  type: grammatical
- examples:
  - With regard to your enquiry, we are unable to help at this time.
  - In addition to English, she speaks Mandarin and Arabic.
  - As for the budget, that has already been approved.
  - As regards your second point, I disagree entirely.
  rule: Complex prepositions of reference and addition (with regard to, with respect to, in addition to, as for, as regards)
  type: grammatical
- examples:
  - The data was collected by means of a questionnaire.
  - By way of introduction, let me outline the main issues.
  - She succeeded by virtue of her determination.
  - In terms of value for money, this is the best option.
  rule: Complex prepositions of means and instrument (by means of, by way of, by virtue of, in terms of)
  type: grammatical
- examples:
  - In case of fire, break the glass.
  - In the event of a tie, a penalty shootout will decide the winner.
  - This offer is subject to availability.
  - But for your help, I would have failed.
  - Apart from the weather, everything was perfect.
  rule: Complex prepositions of condition and exception (in case of, in the event of, subject to, but for, apart from, except
    for)
  type: grammatical
teaching:
  methodology: PPP (Presentation, Practice, Production) — present complex prepositions grouped by function, then practise
    with gap-fills and matching, then produce in writing tasks.
  recommended_activities:
  - adaptation_notes: 'Give learners two lists: simple meanings and complex prepositions. They match ''despite'' to ''in spite
      of,'' ''about'' to ''with regard to,'' etc.'
    duration: 15
    name: Complex Preposition Matching
  - adaptation_notes: 'Give learners informal sentences using simple prepositions. They rewrite them for a formal context
      using complex prepositions: ''Because of the rain...'' -> ''Owing to the inclement weather...'''
    duration: 20
    name: Register Upgrade
  - adaptation_notes: Provide a text with gaps where complex prepositions should go. Learners choose from a bank, considering
      meaning and register.
    duration: 15
    name: Gap-fill with Complex Prepositions
  - adaptation_notes: Display sentences with common errors ('despite of,' 'in spite,' 'regardless to'). Learners identify
      and correct each error.
    duration: 10
    name: Preposition Error Hunt
  tips:
  - Group complex prepositions by function (cause, contrast, reference, means, condition) to make them easier to learn.
  - 'Teach the formality spectrum: ''because of'' (neutral) -> ''due to'' (formal) -> ''owing to'' (very formal) -> ''on account
    of'' (most formal).'
  - 'Highlight common errors: ''*despite of'' (incorrect — ''despite'' stands alone), ''*in despite of'' (archaic).'
  - 'Use substitution exercises: replace simple prepositions with complex ones to upgrade register.'
  - Provide authentic texts (news articles, business emails) and have learners identify complex prepositions.
  - Warn learners not to overuse complex prepositions in casual speech — it can sound pompous.
  - 'Swan PEU: Prepositions are one of the hardest areas of English grammar because there are no universal rules. Teach as
    collocations and meaningful chunks rather than abstract rules.'
  - 'Swan PEU: Complex prepositional phrases — ''in front of,'' ''in the middle of,'' ''at the end of,'' ''on top of,'' ''next
    to,'' ''in addition to,'' ''on behalf of.'' These function as single semantic units.'
title: Complex Prepositional Phrases (Multi-word Prepositions and Extended Phrases)
use:
- context: Formal and academic writing
  description: Complex prepositions are essential for precise, formal expression in essays, reports, and research papers.
  examples:
  - In terms of methodology, the study has several limitations.
  - With regard to the findings, further research is needed.
  - In addition to the primary data, supplementary interviews were conducted.
- context: Business and professional communication
  description: Business emails and reports use complex prepositions for clarity and formality.
  examples:
  - With respect to your proposal, we have the following comments.
  - In the event of a delay, please notify the client immediately.
  - Subject to board approval, the merger will proceed in June.
- context: Legal and official documents
  description: Legal language relies on complex prepositions for precision and unambiguity.
  examples:
  - In accordance with Section 3 of the Act, all applicants must provide identification.
  - The tenant shall not, without the prior written consent of the landlord, make alterations.
  - In the event of breach, the injured party is entitled to compensation.
- context: Everyday conversation (simpler complex prepositions)
  description: 'Some complex prepositions are common in spoken English: ''because of,'' ''instead of,'' ''in front of,'' ''out
    of.'''
  examples:
  - We stayed in because of the rain.
  - She ordered tea instead of coffee.
  - He parked in front of the building.
- context: Expressing nuanced relationships
  description: Complex prepositions allow speakers to express subtle distinctions that simple prepositions cannot.
  examples:
  - Regardless of what anyone says, I believe you.
  - By virtue of his position, he had access to classified information.
  - Thanks to modern technology, we can work from anywhere.
