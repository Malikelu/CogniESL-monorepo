common_errors:
- correction: I wish I spoke English.
  error: 'Using present tense after ''wish'': *''I wish I speak English.'''
  explanation: '''Wish'' for present situations requires past simple, not present simple. The past tense shows unreality.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: I wish I spoke English.
  error: 'Using ''would'' for present wishes about oneself: *''I wish I would speak English.'''
  explanation: '''Wish + would'' is used for complaints about other people''s behavior, not for oneself. Use ''wish + past
    simple'' for one''s own wishes.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: I wish I had studied harder.
  error: 'Using past simple for past regrets: *''I wish I studied harder.'''
  explanation: For past regrets, use 'wish + past perfect' (had + past participle), not past simple.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: I wish I spoke English.
  error: 'Using ''wish + would'' for oneself: *''I wish I would speak English.'''
  explanation: 'Swan PEU: ''Wish + would'' is used for complaints about OTHER people''s behavior, not for oneself. For one''s
    own wishes, use ''wish + past simple''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I wish it would stop raining.
  error: 'Using ''wish + will'': *''I wish it will stop raining.'''
  explanation: 'Swan PEU: After ''wish'', use ''would'' (not ''will'') for desires about the future. ''Wish + will'' is non-standard.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I wish I had studied harder.
  error: 'Using ''wish + past simple'' for past regrets: *''I wish I studied harder.'' (meaning: past)'
  explanation: 'Swan PEU: For past regrets, use ''wish + past perfect''. ''Wish + past simple'' is for present wishes only.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Using wish and if only with past tenses to express wishes about the present and regrets about the past.
dialectal_variation:
- note: 'In formal English, ''were'' is used for all persons after ''wish'': ''I wish I were.'' In informal English, ''was''
    is common: ''I wish I was.'''
- note: 'In some dialects, ''would'' is used after ''wish'' for present wishes: ''I wish he would come.'' (standard for complaints
    about behavior)'
discourse_notes:
- note: '''Wish'' and ''if only'' express strong emotions — regret, longing, or frustration.'
- note: '''If only'' is more emotional and dramatic than ''wish'': ''If only I had known!'' (strong regret)'
- note: 'In conversation, ''wish + would'' is used for complaints: ''I wish you would stop making so much noise.'''
- note: 'In narratives, ''wish'' creates emotional depth: ''She wished she had made a different choice.'''
form:
  affirmative:
    example_generator:
      contexts:
      - present wishes
      - past regrets
      min_examples: 4
    structure: I wish + past simple (present wish) / I wish + past perfect (past regret) / If only + past simple/past perfect
  negative:
    example_generator:
      contexts:
      - negative wishes
      min_examples: 3
    structure: I wish + did not + verb (present) / I wish + had not + past participle (past)
  questions:
    example_generator:
      contexts: []
    min_examples: 0
    structure: Not typically used in questions.
grammar_point: wish_if_only_past
level: B2
meaning:
  ccqs:
  - answer: No — 'spoke' is past tense, but we are talking about NOW. The past tense after 'wish' shows unreality, not past
      time. I do not speak French now, but I wish I did.
    purpose: Tests whether the learner understands that the past tense after "wish" shows unreality about the present, not
      past time. This is one of the most confusing aspects of English grammar for learners because the past tense form does
      not refer to past time.
    question: I wish I spoke French. Am I talking about the past?
  - answer: Yes — 'had studied' refers to a past event. I did not study hard in the past, and I regret it now.
    purpose: Tests whether the learner understands that "wish + past perfect" expresses regret about the past. This is important
      because it is the standard structure for expressing "I am sorry I did not do that" in English.
    question: I wish I had studied harder. Am I talking about the past?
  - answer: The first is a wish about the present (I don't speak French now). The second is a regret about the past (I didn't
      study hard then).
    purpose: Tests whether the learner can distinguish between wishes about the present (wish + past simple) and regrets about
      the past (wish + past perfect). This time distinction is essential for clear communication of regrets and desires.
    question: Can you explain the difference between 'I wish I spoke French' and 'I wish I had studied harder' by giving an
      example of when to use each?
  - answer: '''I wish I could swim.'' After ''wish'' for present regrets, use past tense: wish + past simple.'
    purpose: Tests whether the learner knows that 'wish' takes past tenses to express present/future regrets (Swan PEU 2016,
      entries 654-655).
    question: Which is correct? *'I wish I can swim' or 'I wish I could swim'?
  contrast: Wish + past simple = I wish I spoke French. (I do not speak French now) vs Wish + past perfect = I wish I had
    studied harder. (I did not study hard in the past)
  core_meaning: Wish and if only are used with past tenses to express wishes about the present (things you want to be different
    now) and regrets about the past. The past tense does not refer to past time — it shows unreality.
  example_generator:
    contexts:
    - expressing wishes
    - expressing regrets
    - complaining
    - imagining alternatives
    cultural_notes:
    - If only is stronger and more emotional than wish
    - Very common in everyday English
    min_examples: 5
  timeline: Wish + past simple = present wish. Wish + past perfect = past regret.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Many L1 speakers use present tense instead of past after wish
  note: Stress on wish/if only and the verb
