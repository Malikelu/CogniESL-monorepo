  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 15: Time clauses'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24: Coordination (time clauses)'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 15: Coordination'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 12: Time clauses'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(time clauses: when, while, before, after)'
sub_rules:
- examples:
  - When I arrive, I will call
  rule: Never use will in a time clause
  type: grammatical
- examples:
  - When I arrive, I will call you
  rule: Use a comma when the time clause comes first
  type: punctuation
- examples:
  - When I wake up, I brush my teeth
  rule: For habits both clauses use present simple
  type: grammatical
- examples:
  - While I was cooking, she was setting the table
  rule: While describes simultaneous actions
  type: grammatical
teaching:
  methodology: PPP with timeline visualization
  recommended_activities:
  - adaptation_notes: Students build chains about their daily routine
    duration: 15
    name: Time Clause Chain
  - adaptation_notes: Students correct sentences with will in time clauses
    duration: 10
    name: Correct the Error
  tips:
  - 'Teach the golden rule: NO WILL after WHEN, BEFORE, AFTER, WHILE'
  - Use a timeline to show event order
  - 'Swan PEU: Time clauses — ''when,'' ''while,'' ''before,'' ''after,'' ''until,'' ''as soon as.'' Use present tense in
    time clauses referring to future: ''I''''ll call you when I arrive'' (not ''when I will arrive'').'
  - 'Swan PEU: ''While'' = during the time that (with durative verbs). ''When'' = at the time that (with point events). ''While
    I was cooking, the phone rang'' (during). ''When the phone rang, I answered it'' (at that moment).'
title: Time Clauses (when, before, after, while)
use:
- context: Future time clauses
  examples:
  - When I arrive, I will call you
  - We will leave before it rains
- context: Habits and routines
  examples:
  - When I wake up, I brush my teeth
  - After dinner, we watch TV
