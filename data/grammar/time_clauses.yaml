common_errors:
- correction: When I arrive, I will call you.
  error: '*When I will arrive, I will call you.*'
  explanation: Never use 'will' after 'when' in a time clause. Use present simple for future reference. This is the single
    most important rule for time clauses and is violated across all L1 backgrounds because many L1s use future tense after
    temporal conjunctions.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  - Arabic
  - Korean
  reliability: D
- correction: Before she leaves, she will lock the door.
  error: '*Before she will leave, she will lock the door.*'
  explanation: Time clauses introduced by 'before', 'after', 'when', 'while', 'until' use present simple to refer to the future
    -- never 'will'. This rule applies regardless of the main clause tense.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Arabic
  reliability: D
- correction: After I finish, I will call you.
  error: '*After I will finish, I will call you.*'
  explanation: In time clauses referring to the future, use present simple (not 'will') after time conjunctions. This applies
    to 'after', 'before', 'when', 'while', 'until', 'as soon as', and 'by the time'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - French
  reliability: D
- correction: I will wait here until the bus comes.
  error: '*I will wait here until the bus will come.*'
  explanation: The time clause (after 'until') uses present simple for future meaning. The future meaning is understood from
    the main clause. 'Until' never takes 'will' in standard English time clauses.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
description: Clauses that show when something happens.
dialectal_variation: []
discourse_notes:
- note: Time clauses (when, after, before, while) sequence events in discourse, critical for narrative and procedural writing.
form:
  affirmative:
    example_generator:
    - When I arrive, I will call you.
    - Before she leaves, she will lock the door.
    min_examples: 4
    structure: Conjunction + subject + present, subject + will + verb
  negative:
    example_generator:
    - When I don't understand, I ask.
    min_examples: 3
    structure: Conjunction + subject + don't/doesn't + verb
  questions:
    example_generator:
    - What will you do when you arrive
    min_examples: 3
    structure: What will happen when + subject + present
grammar_point: time_clauses
level: A2
meaning:
  ccqs:
  - answer: No. Never use will. Use present simple.
    purpose: Tests whether the learner understands the time reference of the situation. Correct temporal identification is
      essential for selecting the right grammatical structure.
    question: Can we use will in a time clause
  - answer: The main clause uses future. The time clause uses present simple.
    purpose: Tests whether the learner understands the time reference of the situation. Correct temporal identification is
      essential for selecting the right grammatical structure.
    question: Which clause uses future tense
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with time clauses and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''When I arrive, I will call you.'' In time clauses, use present simple for future meaning, NOT ''will''.'
    purpose: Tests whether the learner knows that time clauses use present simple, not 'will', for future reference (Swan
      PEU 2016, entry 280).
    question: Which is correct? *'When I will arrive, I will call you' or 'When I arrive, I will call you'?
  contrast: 'Wrong: When I will arrive. Correct: When I arrive.'
  core_meaning: 'A time clause tells us WHEN the main action happens. The key rule is: NEVER use will in a time clause. Use
    present simple even for future meaning.'
  example_generator:
    contexts:
    - daily routines
    - future plans
    cultural_notes:
    - This is one of the most important rules at A2 level
    min_examples: 5
  timeline: Time clause uses present tense. Main clause uses future or present.
phonetics:
- example_generator:
  - when as /wen/
  l1_issue: Portuguese and Spanish speakers often use future tense in time clauses
  note: Time conjunctions are usually unstressed
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Temporal clauses and connectors: register distribution varies. Academic prose uses more complex
    temporal subordinators; conversation uses simpler markers (when, before, after). Ch. 10.2.1.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.1.2
