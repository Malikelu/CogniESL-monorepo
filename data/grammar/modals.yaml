description: Auxiliary verbs that express ability, permission, possibility, obligation, or prediction. Used with the base
  form of the main verb (no -s, -ing, -ed).
dialectal_variation:
- note: '''Shall'' is used in BrE for first person questions. AmE uses ''should''.'
- note: '''Mustn''t'' is used in BrE for prohibition. AmE uses ''can''t''.'
- note: 'BrE vs AmE (Biber corpus): In fiction and conversation, obligation modals (must, should) and prediction modals (will,
    would, shall) are more common in BrE. Semi-modals have to and be going to are more common in AmE. (Had) better and (have)
    got to (gotta) are considerably more common in BrE conversation.'
- note: 'Historical development (OED data in Biber): semi-modals developed recently — need to/ought to/used to attested before
    1400; have to/be going to 1400-1650; be supposed to 1650-1800; (have) got to after 1800. Linguistic novelty appears in
    conversation first, then spreads to writing.'
discourse_notes:
- note: 'Modals are used for politeness strategies: "Could you...?" is more polite than "Can you...?"'
- note: 'Modals express degrees of certainty: "must" (certain) vs "might" (possible).'
- note: 'In academic writing, hedging modals are common: "This could suggest that..."'
- note: 'Biber corpus finding: verbs most associated with modals (over 60%) include mental/emotional verbs (imagine, cope,
    tolerate, fathom, abide) — these co-occur with modals because they express personal stance.'
form:
  affirmative:
    example_generator:
    - I can swim.
    - She must go.
    - They should study.
    - He might come.
    min_examples: 4
    structure: Subject + modal + base verb (no to, no -s, no -ing, no -ed)
  negative:
    example_generator:
    - I cannot (can't) swim.
    - She must not (mustn't) go.
    - They should not (shouldn't) study.
    - He might not (mightn't) come.
    min_examples: 4
    structure: 'Subject + modal + not + base verb (contractions: can''t, couldn''t, mustn''t, shouldn''t, won''t, wouldn''t,
      mightn''t)'
  questions:
    example_generator:
    - Can you swim?
    - Must she go?
    - Should they study?
    - Might he come?
    min_examples: 4
    structure: Modal + subject + base verb?
grammar_point: modals
level: A2
meaning:
  ccqs:
  - answer: Ability = can/could. Permission = can/may/could.
    purpose: Tests understanding that must not = prohibition; do not have to = absence of obligation
    question: Is 'must not' the same as 'do not have to'? What is the difference?
  - answer: Certain = will. Possible = may/might/could. Obligation = must/should.
    purpose: Tests whether the learner can identify the semantic categories that different modals express. This helps them
      choose the correct modal for the intended meaning.
    question: Is this about something that is certain, possible, or obligatory?
  - answer: No — modals never change form. 'He can' NOT 'He cans'. 'She must' NOT 'She musts'.
    purpose: Tests whether the learner knows that modals are invariable -- they never take -s, -ing, or -ed. This is a structural
      rule that applies to ALL modals and is one of the most common errors at A2 level.
    question: Does the modal change form for he/she/it (add -s)?
  - answer: The negative form is must not (mustn't). However, must not (prohibition -- you are forbidden) does not mean the
      same as do not have to (no obligation -- it is optional). You must not smoke here means it is forbidden. You do not
      have to smoke here means it is your choice.
    purpose: Tests whether the learner understands that must and do not have to are not opposites. Must not expresses prohibition
      while do not have to expresses lack of obligation. This is one of the most important semantic distinctions for modal
      verbs and a frequent source of confusion across all proficiency levels.
    question: What is the negative form of must, and does must not mean the same as do not have to?
  contrast: '''Can'' = present ability/permission (I can drive.) vs ''Could'' = past ability/polite request (I could drive
    when I was 18.) vs ''Must'' = strong obligation (You must wear a seatbelt.)'
  core_meaning: Modal verbs express the speaker's attitude toward an action — whether it is possible, permitted, obligatory,
    or likely. They do not describe the action itself but the speaker's judgment about it. All modals are followed by the
    base form of the main verb (no to, no -s, no -ing).
  example_generator:
    contexts:
    - ability and skills
    - permission and requests
    - obligation and rules
    - possibility and predictions
    - advice and recommendations
    cultural_notes:
    - Use diverse scenarios (workplace, school, travel, daily life)
    - Be mindful of cultural differences in politeness — 'may' is more formal than 'can' for permission
    - Avoid examples with alcohol, gambling, or illegal activities
    min_examples: 5
  timeline: 'Varies by modal: can (present ability), could (past ability), will (future prediction), must (present obligation),
    might (future possibility).'
phonetics:
- example_generator:
  - I can /aɪ kən/
  - She could /ʃiː kəd/
  - You should /juː ʃəd/
  l1_issue: Portuguese and Spanish speakers often pronounce modals with full vowel sounds. Teach weak forms for natural speech.
  note: 'Weak forms in connected speech: ''can'' → /kən/, ''could'' → /kəd/, ''should'' → /ʃəd/, ''would'' → /wəd/, ''might''
    → /maɪt/ (no reduction).'
- example_generator:
  - can't /kɑːnt/
  - won't /wəʊnt/
  - shouldn't /ʃʊdnt/
  l1_issue: Many L1 speakers struggle with 'won't' pronunciation /wəʊnt/. It does not rhyme with 'don't'. Drill explicitly.
  note: 'Contractions are essential in spoken English: can''t /kɑːnt/, couldn''t /kʊdnt/, mustn''t /mʌsnt/, shouldn''t /ʃʊdnt/,
    won''t /wəʊnt/, wouldn''t /wʊdnt/.'
register_notes:
- note: '''May'' is more formal than ''can'' for permission. Biber et al. corpus: may is extremely common in academic prose
    but rare in conversation, where it typically marks logical possibility rather than permission.'
  reliability: D
  source: Team observation
  tier: 4
- note: '''Shall'' is formal and primarily used in BrE. Corpus data: shall is the rarest modal; in academic prose it marks
    volition more often than prediction (e.g., "We shall deal with...").'
  reliability: D
  source: Team observation
  tier: 4
- note: '''Must'' is strong and direct. ''Should'' is more polite. Corpus finding: must in conversation is used mostly for
    logical necessity ("It must have fallen out"), while in academic prose it more often marks personal obligation ("Care
    must be taken...").'
  reliability: D
  source: Team observation
  tier: 4
- note: Semi-modals (have to, be going to, need to) are 5x more common in conversation than in written registers. Have to
    is the only semi-modal common across all four registers.
  reliability: D
  source: Team observation
  tier: 4
- note: Be going to is the most common semi-modal in conversation, used mainly for personal volition. It is many times more
    frequent in conversation than in academic prose.
  reliability: D
  source: Team observation
  tier: 4
- note: Can and could are relatively common across all registers. Can is extremely common in conversation and academic prose;
    could is particularly common in fiction.
  reliability: D
  source: Team observation
  tier: 4
- note: Will is extremely common in conversation and news reportage. Would is extremely common in conversation and fiction.
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (2021) — Modals comprise only 10-15% of all finite verb phrases across ALL registers. Each modal has
    distinct register distribution patterns. Ch. 6.6.2
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6.2
- note: 'GB 2nd ed. (Ch.9) notes that academic writing uses modal hedging (may, might, could) to express caution and avoid
    overgeneralization: ''This may be the case,'' ''The results could suggest...''  Academic hedging is a pragmatic use of
    modality, not just epistemic possibility. Hard sciences tend toward weaker modals (it is possible that...) while humanities
    use stronger assertions.'
  source: Team observation
  reliability: D
  tier: 4
sources:
  corpus_evidence: 'Biber et al. (1999) LSWE Corpus: 4-register comparison (conversation, fiction, news, academic prose).
    Key findings: modals are most common in conversation, least common in news and academic prose; semi-modals are 5x more
    common in conversation than in written expository registers.'
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Swan (2016) Practical English Usage, 4th ed.(modal auxiliary verbs: can, could, may, might, must, should, will,
    would, shall, ought)'
  secondary: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.6
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 8: Modals'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(modals: can, could, may, might, must, should, will, would)'
sub_rules:
- examples:
  - He can swim. (NOT He cans)
  - She must go. (NOT She musts)
  - They should study. (NOT They shoulds)
  rule: Modals never change form — no -s for third person, no -ing, no -ed
  type: grammatical
- examples:
  - I can swim. (NOT I can to swim)
  - She must go. (NOT She must to go)
  rule: Modals are always followed by the base verb (no 'to')
  type: grammatical
- examples:
  - I can speak English. (ability)
  - Can I leave early? (permission)
  - You cannot park here. (prohibition)
  rule: Can/cannot for ability and permission
  type: semantic
- examples:
  - It might rain. (possibility)
  - May I come in? (formal permission)
  - She may be late. (possibility)
  rule: May/might for possibility and formal permission
  type: semantic
- examples:
  - You must wear a seatbelt. (strong obligation)
  - You should study more. (advice)
  - We must not be late. (prohibition)
  rule: Must/should for obligation and advice
  type: semantic
- examples:
  - It will rain tomorrow. (prediction)
  - Would you help me? (polite request)
  - I would like some coffee. (polite desire)
  rule: Will/would for predictions and polite requests
  type: semantic
- examples:
  - I could run fast when I was young. (past ability)
  - Could you open the window? (polite request)
  - Could I borrow your pen? (polite request)
  rule: Could for past ability and polite requests
  type: semantic
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: 'Students ask classmates about abilities: ''Can you swim?'' ''Can you play guitar?'' Then report: ''Pedro
      can swim. Maria can''t play guitar.'''
    duration: 10
    name: Can You...?
  - adaptation_notes: 'Students practice asking for permission in different situations: classroom, office, restaurant. ''Can
      I...?'' ''May I...?'' ''Could I...?'' Focus on polite forms.'
    duration: 15
    name: Permission Role Play
  - adaptation_notes: 'Teacher says a situation. Students choose ''must'' or ''should'': ''Wear a seatbelt.'' (must) ''Study
      more.'' (should) ''Be kind to others.'' (should) ''Stop at a red light.'' (must)'
    duration: 10
    name: Must or Should?
  - adaptation_notes: 'Show pictures of situations (dark clouds, someone studying hard, a job interview). Students make predictions:
      ''It might rain.'' ''She might pass the exam.'' ''He might get the job.'''
    duration: 15
    name: What Might Happen?
  tips:
  - 'Biber et al. (2021) GSWE. John Benjamins. Ch. 6.6.4.1: Permission/possibility modals differ by register. In academic
    prose, could, may, and might are used almost exclusively for logical possibility. Permission is rarely expressed in academic
    writing. May is rarely used in conversation; when it occurs it marks logical possibility. Can is the most multifunctional
    — marking permission, ability, and possibility across all registers. Might is the most restricted — only logical possibility.'
  - 'GB3 Ch. 8: Three types of modal meaning — logical probability (epistemic: may/might/must for inference), social interaction
    (deontic: can/may/should/must for permission, advice, obligation), and ability/tendency (can/could/would for ability,
    past habit). Each modal has at least two of these meanings. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch.
    8 §8.2.'
  - 'GB3 Ch. 8: Core meaning framework (Sweetser 1990, Tyler 2012) — each modal expresses a force-dynamic relationship: can
    = potential force, could = weakened potential, must = irresistible force, should = weakened obliging force, will = force
    of commitment, would = weakened force of commitment. These core meanings extend across all three domains (logical, social,
    ability). Source: GB3 3rd ed. Ch. 8 §8.2.'
  - 'GB3 Ch. 8: Modal advice scale (from weakest to strongest) — might/could (tentative suggestion) < should/ought to/had
    better (stronger advice) < must/have to/have got to/need to (strong obligation). Modal request scale — Can/Could/Will/Would/May
    (increasing politeness). Past modals (could, would) are more polite than present forms. Source: GB3 3rd ed. Ch. 8 §8.3.'
  - 'Parrott (2000) Ch. 11: Modal verbs are used far more in spoken than in written English, because communicative functions
    are more common in face-to-face interaction. Pure modals (can, could, may, might, must, shall, should, will, would) have
    five formal characteristics: no 3rd person -s, followed by bare infinitive, negated with not, inverted for questions,
    no past form. Semi-modals (ought, had better, have got to) share meaning but not all formal features. Source: Parrott
    (2000) Grammar for English Language Teachers, 2nd ed. Ch. 11: Modal verbs, 11.1-11.8.'
  - 'Start with ''can'' for ability — this is the most intuitive modal for A2 students. Use real examples: ''I can swim. I
    can''''t fly.'''
  - 'Move from ability to permission: ''I can swim (ability) vs Can I go to the bathroom? (permission).'' Same word, different
    meaning.'
  - 'Teach must/should as a pair: must = strong obligation (rules), should = advice (recommendations).'
  - 'Use real-life scenarios for permission: ''Can I leave early?'' ''May I open the window?'' ''Could I borrow your pen?'''
  - Drill contractions explicitly — they are essential for natural spoken English.
  - 'Contrast ''may'' and ''might'' for possibility: may = more likely, might = less certain.'
  - 'Swan PEU: Modals have no infinitives, participles, or past tenses. Drill: ''I can swim'' NOT ''I cans swim'' or ''I can
    to swim''.'
  - 'Swan PEU: For deduction, ''must'' = certain, ''should'' = probable, ''may/might/could'' = possible, ''can''t'' = impossible.
    Teach as a certainty scale.'
  - 'Swan PEU: ''Must'' vs ''have to'' — in conversation, ''must'' is mostly used for logical necessity (''It must have fallen
    out''), not personal obligation.'
  - 'Swan PEU: ''Will'' for willingness/offers: ''I''ll help you'' (spontaneous decision). Contrast with ''going to'' for
    pre-planned intentions.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3) classifies core modals (can, could, may,
    might, shall, should, will, would, must) as a CLOSED class — no new members. Semi-modals (ought to, need to, have to,
    be able to, be going to, be supposed to) are an OPEN class. This distinction matters for teaching: core modals have no
    -s form (*he cans), no infinitive (*to can), no past participle (*have canned for modal meaning).'
  - 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: GB3 analyzes modal remoteness: past tense modals
    express politeness by creating interpersonal distance. ''Could you help me?'' is more polite than ''Can you help me?''
    because the past tense modal ''could'' signals remoteness from immediate insistence. ''Would you,'' ''Might you'' follow
    the same pattern. This is the MODAL remoteness use of past tense discourse — not past time reference.'
title: Modal Verbs (can, could, may, might, will, would, shall, should, must)
use:
- context: Ability (can/could)
  description: Expressing what someone is or was able to do
  examples:
  - She can play the piano.
  - He could run fast as a child.
  - I can speak three languages.
  - They could not find the address.
- context: Permission (can/may/could)
  description: Asking for or giving permission
  examples:
  - Can I leave early?
  - May I use your phone?
  - Could I borrow your pen?
  - You cannot park here.
- context: Obligation (must/should)
  description: Expressing duty, rules, or advice
  examples:
  - You must wear a seatbelt.
  - We should study more.
  - Students must not cheat.
  - You should see a doctor.
- context: Possibility (may/might/could)
  description: Expressing likelihood
  examples:
  - It might rain tomorrow.
  - She may be late.
  - This could be the answer.
  - It may not be true.
- context: Predictions and polite requests (will/would)
  description: Talking about the future or making polite requests
  examples:
  - It will rain tomorrow.
  - Would you help me with this?
  - I would like some coffee.
  - Will you marry me?
