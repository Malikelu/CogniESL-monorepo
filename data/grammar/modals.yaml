  reliability: D
- correction: You should go to the doctor tomorrow.
  error: 'Using ''must'' for future obligation: *''You must go to the doctor tomorrow.'' (when giving advice, not a rule)'
  explanation: 'Swan PEU: ''Must'' expresses strong obligation (rules, laws). For advice or recommendations, use ''should''.
    ''Must'' for future obligation sounds like a command.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: You don't have to come tomorrow.
  error: 'Using ''mustn''t'' to mean ''don''t have to'': *''You mustn''t come tomorrow'' (meaning it''s optional)'
  explanation: 'Swan PEU: ''Mustn''t'' (prohibition) does NOT mean the same as ''don''t have to'' (no obligation). ''You mustn''t
    come'' = you are forbidden. ''You don''t have to come'' = it''s your choice.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: Might it rain this afternoon? / Do you think it will rain this afternoon?
  error: 'Using ''may'' for possibility in questions: *''May it rain this afternoon?'''
  explanation: 'Swan PEU: ''May'' is not normally used in questions about possibility. Use ''might'' or ''do you think...
    will'' instead.'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I could run fast when I was young.
  error: 'Using ''can'' for past ability (general): *''I could run fast when I was young'' (when meaning general ability,
    not specific occasion)'
  explanation: 'Swan PEU: ''Could'' is used for general past ability (''I could swim at age 5''). For a specific past occasion,
    use ''was able to'' or ''managed to''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: You had better hurry up. / You'd better hurry up.
  error: 'Using ''had better'' with ''have'': *''You have better hurry up.'''
  explanation: 'Swan PEU: ''Had better'' is a fixed expression — it does not use ''have''. The negative is ''had better not''
    (not ''hadn''t better'').'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I have to go. (external rule/requirement) / I must go. (personal, internal sense of obligation)
  error: 'Confusing ''must'' (internal obligation) with ''have to'' (external obligation): *''I must go'' when meaning a rule
    or requirement imposed from outside'
  explanation: 'Parrott’s rule of thumb: must = the speaker feels the obligation internally (I must phone her — I feel I should).
    have to = an external source imposes the obligation (I have to wear a uniform — the school requires it). Many native speakers
    do not consistently distinguish these, but the distinction is useful for learners, especially in formal and written English.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - German
  - Japanese
  - Chinese
  - Korean
  - Arabic
  - Russian
  - Polish
  - Turkish
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 11: Modal verbs'
- correction: You don't have to come. (absence of obligation — it is your choice)
  error: 'Treating ''mustn''t'' and ''don''t have to'' as equivalent negatives of ''must'': *''You mustn''t come'' (when meaning
    it is optional, not forbidden)'
  explanation: Parrott highlights this as a completely different meaning pair, not just negation. mustn’t = prohibition (it
    is forbidden). don’t have to = absence of obligation (you are free to choose). These are among the most frequently confused
    modal pairs across all L1 groups.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - German
  - Japanese
  - Chinese
  - Korean
  - Arabic
  - Russian
  - Polish
  - Turkish
  - Thai
  - Farsi
  - Hindi
  reliability: A
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 11: Modal verbs'
- correction: 'Use the deduction scale according to certainty: must (certain — He must be home, the lights are on) / should/ought
    to (likely — He should be home by now) / could/might (possible — He might be at the shops) / can''t (impossible — He can''t
    be home, his car is gone).'
  error: 'Misusing epistemic (logical deduction) modals — treating ''must'', ''should/ought to'', ''could/might'', and ''can''t''
    as interchangeable for logical deduction: *''He might be the manager'' (when the speaker is certain from evidence)'
  explanation: 'Parrott’s epistemic scale: must = speaker is certain from evidence; should/ought to = likely from expectation;
    could/might = possible but uncertain; can’t = speaker is certain it is impossible. This deontic–epistemic distinction
    (obligation vs deduction) is one of the hardest aspects of modal meaning for learners.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - German
  - Japanese
  - Chinese
  - Korean
  - Arabic
  - Russian
  - Polish
  - Turkish
  reliability: A
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 11: Modal verbs'
- correction: He must have been tired yesterday. / You should have told her last week.
  error: 'Using a bare modal for past modal meaning other than past ability: *''He must be tired yesterday'' / *''You should
    tell her last week'''
  explanation: 'Parrott: could is used for general past ability (I could swim when I was five). For all other past modal meanings
    — logical deduction, obligation, advice, possibility — use modal + have + past participle: must have been, should have
    gone, could have done, might have seen, would have known.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - German
  - Japanese
  - Chinese
  - Korean
  - Arabic
  - Russian
  - Polish
  - Turkish
