  - Farsi
  - Hindi
  reliability: A
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 11: Modal verbs'
- correction: Shall I open the window? / Shall we go?
  error: 'Using ''will'' for first-person offers or suggestions: *''Will I open the window?'' / *''Will we go now?'''
  explanation: 'Parrott: shall (not will) is the correct modal for offers and suggestions with I/we in BrE. "Shall I...?"
    = offering to do something for someone. "Shall we...?" = suggesting a joint action. "Will I...?" in this context is non-standard
    and sounds unnatural to most BrE speakers.'
  l1_groups:
