citations:
- claim: 'Core meaning: Modal verbs express the speaker''s attitude toward an action — whether it is possible, permitted,
    obl'
  reliability: B
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.6
  tier: 1
- claim: 'Register distribution: ''May'' is more formal than ''can'' for permission. Biber et al. corpus: may is extremely
    common in acad'
  reliability: B
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.6
  tier: 1
- claim: 'Discourse function: Modals are used for politeness strategies: "Could you...?" is more polite than "Can you...?"'
  reliability: B
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.6
  tier: 1
- claim: 'Common error ''Using ''to'' after modals: *''I can to swim.'''' for Portuguese, Spanish, French speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 8: Modal Auxiliaries
    and Related Phrasal Forms'
  tier: 1
- claim: 'Dialectal variation: ''Shall'' is used in BrE for first person questions. AmE uses ''should''.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries and Related Phrasal Forms'
  tier: 1
- claim: L1 transfer in modals varies significantly across language backgrounds — Swan & Smith document contrastive patterns
    for speakers of different L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents how transfer effects are non-linear,
    determined by functional fit between L1 and L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects are non-linear — determined by functional
    fit between L1 and L2 systems rather than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 2
