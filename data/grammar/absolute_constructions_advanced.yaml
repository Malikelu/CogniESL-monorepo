common_errors:
- correction: All the necessary preparations having been made and the guests having arrived, the ceremony began.
  error: '*All the necessary preparations having been made, and the guests having arrived, the ceremony began.* (comma splice)'
  explanation: In advanced absolute constructions with multiple elements, do not use a comma between the elements within the
    absolute phrase. The comma comes only before the main clause.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - German
  reliability: D
- correction: The children having played outside, the parents watched TV.
  error: '*The children been playing outside, the parents watched TV.*'
  explanation: 'Advanced absolute constructions require a participle (having played), not a finite verb (been playing). The
    structure is: noun + participle phrase.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
