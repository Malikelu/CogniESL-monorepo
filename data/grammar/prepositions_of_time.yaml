citations:
- claim: 'Core meaning: Prepositions of time answer the question ''When?'' They show
    the relationship between an action and a time period.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: 'Register distribution: Prepositions of time are consistent across registers.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: 'Discourse function: Prepositions of time create temporal cohesion: ''In
    2020, the pandemic began. By March, schools had closed.'''
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: 'Common error ''Using ''in'' with days: *''I see him in Monday.'''' for Portuguese,
    Spanish, French speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 14: Prepositions'
  tier: 1
- claim: 'Dialectal variation: BrE uses ''at the weekend''; AmE uses ''on the weekend''.'
  reliability: B
  source: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Ch. 7: Prepositions and Prepositional Phrases (temporal prepositions)'
  tier: 1
- claim: 'Prepositions of time (AT, IN, ON, DURING, SINCE, FOR, BY, UNTIL) establish
    temporal relationships: AT for clock time, IN for periods, ON for days/dates'
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: L1 transfer in prepositions of time varies significantly across language
    backgrounds — Swan & Smith document contrastive patterns for speakers of different
    L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents
    how transfer effects are non-linear, determined by functional fit between L1 and
    L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects
    are non-linear — determined by functional fit between L1 and L2 systems rather
    than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
common_errors:
- correction: I see him on Monday.
  error: 'Using ''in'' with days: *''I see him in Monday.'''
  explanation: Use 'on' with days, 'in' with months/years, 'at' with times.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Dutch
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Korean
  - Thai
  - Farsi
  - Hindi
  - Swahili
  - Malay
  - Chinese
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I was born in January.
  error: 'Using ''at'' with months: *''I was born at January.'''
  explanation: 'Swan PEU: ''In'' for months, years, seasons, parts of day. ''At''
    for clock times, mealtimes, night, weekend (BrE).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  - Thai
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I saw her last Monday.
  error: 'Using ''on'' with ''last/next/every'': *''I saw her on last Monday.'''
  explanation: 'Swan PEU: No preposition with ''last'', ''next'', ''this'', ''every'',
    ''yesterday'', ''tomorrow''. ''Last Monday'' not ''on last Monday''.'
  l1_groups:
  - Portuguese
