common_errors:
- correction: She is much taller than me. / She is a lot taller than me.
  error: '*She is very taller than me.*'
  explanation: Comparatives are modified by 'much', 'far', 'a lot', 'a little' --
    NOT 'very'. 'Very' is used with base adjectives (very tall).
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: D
description: Using adverbs and other modifiers to strengthen, weaken, or specify comparative
  adjectives and adverbs.
dialectal_variation: []
discourse_notes:
- note: Modifiers of comparatives (much, far, a lot, a little, slightly) express degree
    of difference between the compared items.
form:
  affirmative:
    example_generator:
      contexts:
      - shopping comparisons
      - describing differences
      - sports commentary
      min_examples: 4
    structure: 'Modifier + comparative adjective/adverb (+ than + comparison): ''much
      better'', ''far more interesting'', ''a bit cheaper'', ''slightly faster'',
      ''three years older'', ''way more exciting'' (informal). With ''than'': ''She
      is much taller than her brother.'' ''This car is far more expensive than that
      one.'''
  negative:
    example_generator:
      contexts:
      - negative comparisons
      - downplaying differences
      min_examples: 3
    structure: 'Modifier + less + adjective/adverb (+ than): ''much less expensive'',
      ''far less interesting'', ''slightly less popular''. ''This phone is much less
      expensive than the latest model.'' ''He is far less experienced than his colleague.'''
  questions:
    example_generator:
      contexts:
      - asking about degree of difference
      - shopping enquiries
      min_examples: 3
    structure: 'How much + comparative: ''How much taller is she?'' ''How much more
      expensive is it?'' Also: ''Is it much better?'' ''Is it a bit cheaper?'''
grammar_point: modification_comparatives
level: B1
meaning:
  ccqs:
  - answer: No — 'much taller' indicates a large difference; 'slightly taller' indicates
      a small difference.
    purpose: Tests whether the learner understands a key concept of modification_comparatives.
      This is fundamental for correct use of this grammar point.
    question: Does 'much taller' mean the same as 'slightly taller'?
  - answer: No — we use 'much', 'far', 'a lot', 'a bit', 'slightly', 'a little', 'way'
      (informal), or a specific measurement. 'Very' is used with base adjectives,
      not comparatives.
    purpose: Tests whether the learner understands a key concept of modification_comparatives.
      This is fundamental for correct use of this grammar point.
    question: Can we use 'very' before a comparative?
  - answer: 'Before the comparative: ''much better'', ''far more expensive'', ''a
      bit slower''.'
    purpose: Tests whether the learner understands a key concept of modification_comparatives.
      This is fundamental for correct use of this grammar point.
    question: Where does the modifier go?
  - answer: No. Very, so, and too cannot modify comparative forms. Use much, far,
      a lot, way, or considerably for strengthening comparatives, and a bit, slightly,
      a little, or marginally for weakening them. Very, so, and too are used with
      base adjectives only (very fast, so expensive, too expensive).
    purpose: Tests whether the learner knows which modifiers are grammatical with
      comparatives versus base adjectives. The error very + comparative is extremely
      common across L1 groups because many languages use the same word for both very
      and much, making this a critical distinction for natural-sounding English.
    question: Can we use very, so, or too before a comparative form such as very faster
      or so more expensive?
  contrast: 'Unmodified comparative: "She is taller than me." (simply states a difference)

    Strengthened: "She is much/far/a lot taller than me." (large difference)

    Weakened: "She is a bit/slightly/a little taller than me." (small difference)

    Specific: "She is three centimetres taller than me." (exact difference)

    '
  core_meaning: Modifiers are placed before comparative forms to indicate the degree
    of difference — whether it is large, small, or specific. Without modification,
    comparatives simply state that a difference exists; with modification, they quantify
    or qualify that difference.
  example_generator:
    contexts:
    - comparing products
    - describing people
    - sports and competition
    - academic performance
    - weather and climate
    - travel and transport
    cultural_notes:
    - 'In British English, ''a bit'' is extremely common as a modifier and can also
      function as an understatement: ''It''s a bit cold'' may mean ''It''s very cold'''
    - 'In American English, ''way'' is commonly used as an informal intensifier: ''way
      better'', ''way more fun'''
    min_examples: 5
  timeline: Timeless — modification of comparatives is not tense-dependent.
phonetics:
- example_generator:
    contexts:
    - natural conversation
    - emphatic speech
  l1_issue: Many languages use a single word for both 'much' and 'very', which leads
    to errors like 'very better' or 'very more expensive'. Students need to learn
    that 'much' (not 'very') modifies comparatives.
  note: 'Modifiers like ''much'', ''far'', and ''a lot'' are typically stressed in
    speech to emphasise the degree of difference: ''It''s MUCH better.'' ''She''s
    FAR more talented.'' In contrast, diminishers like ''a bit'' and ''slightly''
    are often unstressed: ''It''s a bit cold.'''
register_notes:
- note: In formal writing, conditionals appear in discussions of likely outcomes and
    theoretical scenarios.
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, conditionals are used for hypothetical scenarios and polite
    requests.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, conditionals express logical relationships between propositions.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Comparative modification (''much better'', ''slightly
    taller'', ''far more important''): register distribution varies. Academic prose
    uses more precise comparative modification; conversation uses more intensifiers.
    Ch. 7.7.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 7.7.3
