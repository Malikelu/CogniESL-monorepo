teaching:
  methodology: PPP — present the modifiers in context, practise with controlled exercises,
    then produce in free comparison activities
  recommended_activities:
  - adaptation_notes: 'Give students comparative sentences with gaps and a bank of
      modifiers. Students choose the most appropriate modifier for each context: ''The
      exam was ___ harder than expected.'' (much/slightly)'
    duration: 10
    name: Modifier matching
  - adaptation_notes: 'Students survey classmates about preferences and habits, then
      report findings using modified comparatives: ''Maria reads much more than Pedro.''
      ''Ana is slightly taller than Sofia.'''
    duration: 20
    name: Comparison survey
  - adaptation_notes: 'Give students information about two products (phones, cars,
      laptops). Students write a comparison paragraph using a range of modifiers:
      ''Phone A is slightly cheaper, but Phone B is far more powerful.'''
    duration: 15
    name: Product comparison
  - adaptation_notes: 'Give students a list of modifiers and have them rank them from
      weakest to strongest: a bit, much, slightly, far, a lot, marginally, way, considerably.
      Discuss register (formal vs. informal).'
    duration: 10
    name: Scale ranking
  tips:
  - 'Start with a visual: draw two people of very different heights and two of similar
    heights. Use these to introduce ''much taller'' vs. ''slightly taller''.'
  - 'Create a modifier scale on the board: ''a bit — slightly — a little — much —
    far — a lot — way''. Have students place modifiers on the scale from weakest to
    strongest.'
  - 'Drill the error ''very + comparative'' explicitly: ''very better'' → ''much better''.'
  - 'Use real-world comparisons: mobile phones, cars, cities, celebrities — things
    students can relate to.'
  - Introduce 'way' as informal and note that it is common in American English but
    should be avoided in formal writing.
  - 'Swan PEU: Modifying comparatives — ''much taller,'' ''a lot bigger,'' ''far better,''
    ''a little warmer,'' ''somewhat cheaper,'' ''considerably faster.'' NOT ''very
    taller'' — ''very'' cannot modify comparatives.'
  - 'Swan PEU: ''No/not any + comparative'' — ''He''''s no smarter than before.''
    ''This car is not any faster than the other.'' Idiomatic negative comparison.'
title: Modification of Comparatives
use:
- description: Use 'much', 'far', 'a lot', 'considerably', or 'significantly' to show
    that the difference between two things is substantial.
  examples:
  - This restaurant is much better than the last one.
  - The new model is far more efficient.
  - She is considerably more experienced than the other candidates.
  key_point: These modifiers are common in both spoken and written English. 'Much'
    and 'far' are the most versatile.
  name: Emphasising a large difference
- description: Use 'a bit', 'a little', 'slightly', or 'marginally' to show that the
    difference is small or minimal.
  examples:
  - This one is a bit cheaper.
  - The weather is slightly warmer today.
  - He is marginally taller than his brother.
  key_point: Diminishers are useful for being diplomatic or understated. In British
    English, 'a bit' is extremely common.
  name: Minimising a small difference
- description: Use a specific measurement or number to quantify the difference precisely.
  examples:
  - She is three years older than me.
  - This laptop is twice as fast as the old one.
  - The journey takes an hour longer by bus.
  key_point: This is the most precise way to compare and is common in academic, scientific,
    and technical contexts.
  name: Specifying an exact difference
- description: Use 'even' or 'still' before a comparative to add emphasis, often when
    the difference is surprising or continues a trend.
  examples:
  - The second exam was even harder than the first.
  - She is still more qualified than anyone else on the team.
  - It's even worse than I thought.
  key_point: '''Even'' suggests surprise; ''still'' suggests continuation of a previous
    state.'
  name: Emphasising with 'even' and 'still'
