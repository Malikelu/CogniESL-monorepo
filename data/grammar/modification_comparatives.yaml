  - a lot cheaper
  - way more fun
  - considerably faster
  - significantly higher
  rule: 'Intensifiers (large difference): much, far, a lot, way (informal), considerably,
    significantly, a great deal'
  type: grammatical
- examples:
  - a bit taller
  - a little more expensive
  - slightly faster
  - marginally better
  - a touch warmer
  rule: 'Diminishers (small difference): a bit, a little, slightly, marginally, a
    touch (informal)'
  type: grammatical
- examples:
  - three years older
  - ten centimetres taller
  - twice as fast
  - five pounds heavier
  - an hour earlier
  rule: 'Specific measurements: number + unit + comparative'
  type: grammatical
