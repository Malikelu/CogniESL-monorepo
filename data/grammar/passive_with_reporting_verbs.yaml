sub_rules:
- examples:
  - It is said that the company is closing.
  - It is believed that the earth is round.
  - It was reported that three people were injured.
  rule: 'Structure 1: It + be + reporting verb (past participle) + that + clause'
  type: grammatical
- examples:
  - The company is said to be closing.
  - The earth is believed to be round.
  - Three people were reported to be injured.
  rule: 'Structure 2: Subject + be + reporting verb (past participle) + to + infinitive (present/future meaning)'
  type: grammatical
- examples:
  - The company is said to have closed.
  - He is believed to have left the country.
  - She is thought to have stolen the money.
  rule: 'Structure 3: Subject + be + reporting verb (past participle) + to have + past participle (past meaning)'
  type: grammatical
- examples:
  - It is said that...
  - It is reported that...
  - It is claimed that...
  - It is believed that...
  - It is expected that...
  rule: 'Common reporting verbs in passive: say, report, claim, believe, think, expect, know, allege, understand, estimate'
  type: lexical
- examples:
  - It is said that he is rich. (written)
  - He is said to be rich. (more concise)
  rule: Structure 1 is more common in written English; Structure 2 is more concise
  type: stylistic
teaching:
  methodology: Guided discovery with news headlines
  recommended_activities:
  - adaptation_notes: 'Give students active news sentences. They transform them into passive reporting structures: ''People
      say the president will resign'' → ''The president is said to be going to resign.'''
    duration: 15
    name: News Headline Transformation
  - adaptation_notes: 'Give students Structure 1 sentences. They rewrite them using Structure 2: ''It is believed that...''
      → ''Subject is believed to...'''
    duration: 10
    name: Structure 1 or Structure 2?
  - adaptation_notes: 'Students match reporting verbs to their meanings: ''claim'' = state without proof, ''allege'' = accuse
      without proof, ''estimate'' = calculate approximately.'
    duration: 10
    name: Reporting Verb Matching
  - adaptation_notes: 'Students write sentences using passive reporting structures for academic writing: ''It is argued that...''
      ''Studies suggest that...'' ''It is estimated that...'''
    duration: 15
    name: Academic Writing Practice
  tips:
  - 'Start with news headlines: rewrite active news sentences into passive reporting structures. ''People say the company
    is closing'' → ''The company is said to be closing.'''
  - Contrast Structure 1 and Structure 2 with the same content to show they mean the same thing.
  - 'Create a reference list of common reporting verbs for passive structures: say, report, claim, believe, think, expect,
    know, allege.'
  - 'Practice transforming active to passive reporting: ''People believe he is guilty'' → ''He is believed to be guilty.'''
  - Use authentic news articles as examples. This structure is extremely common in journalism.
  - 'Swan PEU: Reporting verb passive — ''He is said to be rich'' = People say he is rich. ''She was thought to have left.''
    Also: ''It is said/thought/believed that...'' These structures are common in news and academic writing.'
title: Passive Voice with Reporting Verbs
use:
- context: Formal reporting in news and academic writing
  description: Presenting information objectively without naming the source
  examples:
  - It is claimed that the new drug is effective.
  - The new drug is claimed to be effective.
  - It is reported that unemployment is falling.
  - Unemployment is reported to be falling.
- context: Unknown or unimportant agent
  description: When the original speaker is unknown, irrelevant, or obvious
  examples:
  - It is thought that the ancient ruins are 2000 years old.
  - The ruins are thought to be 2000 years old.
  - It is known that smoking causes cancer.
  - Smoking is known to cause cancer.
- context: Objective tone
  description: Removing personal bias by not focusing on the speaker
  examples:
  - It is expected that the economy will grow.
  - The economy is expected to grow.
  - It is estimated that 1000 people attended.
  - 1000 people are estimated to have attended.
