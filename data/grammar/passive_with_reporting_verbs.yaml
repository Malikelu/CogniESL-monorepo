common_errors:
- correction: It is said that he is rich. / He is said to be rich.
  error: '*People say that he is rich.* (passive)'
  explanation: 'Reporting verbs (say, believe, think, report) have a special passive structure: ''It is said that...'' or
    ''He is said to be...''. This is essential for academic writing.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: A formal structure to report information using reporting verbs (say, report, claim, believe) in passive voice,
  often removing focus from the original speaker. Common in news and academic writing.
dialectal_variation: []
discourse_notes:
- note: In academic writing, passive voice is standard in methodology and results sections.
- note: In news reports, passive voice is used when the agent is unknown or irrelevant.
- note: In conversation, passive voice is less common; active voice is preferred.
form:
  affirmative:
    example_generator:
    - It is said that the company is closing. (Structure 1)
    - The company is said to be closing. (Structure 2)
    - The company is said to have closed. (Structure 3 — past action)
    min_examples: 4
    structure: 'Structure 1 (that-clause): It + be + past participle of reporting verb + that + clause / Structure 2 (infinitive):
      Subject + be + past participle + to + infinitive / Structure 3 (perfect infinitive): Subject + be + past participle
      + to have + past participle'
  negative:
    example_generator:
    - It is not believed that the story is true.
    - The story is not believed to be true.
    - He is not thought to have been involved.
    min_examples: 4
    structure: It + be + not + past participle + that / Subject + be + not + past participle + to + infinitive
  questions:
    example_generator:
    - Is it said that the company is closing?
    - Is the company said to be closing?
    - Was he thought to have been involved?
    min_examples: 4
    structure: Be + it + past participle + that...? / Be + subject + past participle + to + infinitive?
grammar_point: passive_with_reporting_verbs
level: C1
meaning:
  ccqs:
  - answer: On the information — the speaker is unknown, unimportant, or obvious.
    purpose: Tests whether the learner understands the key communicative motivation for using passive reporting verbs — to
      shift attention from the source to the information being reported, creating an objective tone.
    question: Is the focus on who said it, or on the information itself?
  - answer: Formal — news reports, academic writing, official statements. Rare in casual conversation.
    purpose: Tests whether the learner is aware of the register distribution of passive reporting structures, which helps
      them choose these forms appropriately in academic and professional writing.
    question: Is this structure more common in formal or informal English?
  - answer: '''Subject is said to...'' is more concise. Both are correct and mean the same thing.'
    purpose: Tests whether the learner can identify and produce both structural variants of passive reporting and understands
      that they are semantically equivalent but differ in conciseness.
    question: 'Which structure is more concise: ''It is said that...'' or ''Subject is said to...''?'
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with passive with reporting verbs.
      Recognizing typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: '''Active'' = ''People say the company is closing.'' (focus on people) vs ''Passive'' = ''The company is said
    to be closing.'' (focus on company, more formal and objective)'
  core_meaning: Reports information from an unspecified or unimportant source, making the statement seem more objective and
    formal. The focus is on the INFORMATION, not on WHO said it. This structure is very common in news reports, academic writing,
    and official statements.
  timeline: Covers present (is said), past (was said), future (is expected to), and past completed actions (is said to have
    done). The tense of 'be' determines the time reference.
phonetics:
- example_generator:
  - is said /ɪz sed/
  - is believed /ɪz bɪˈliːvd/
  - to be /tə biː/
  l1_issue: 'Many L1 speakers struggle with the passive reporting structure. Drill the pattern: ''Subject + is/are + past
    participle + to + infinitive''.'
  note: 'In passive reporting structures, the reporting verb is usually stressed: ''is SAID'', ''is beLIEVED'', ''is rePORTED''.
    The ''to'' in infinitive structures is weak: /tə/.'
- example_generator:
  - It is said that... /ɪt ɪz sed ðət/
  l1_issue: Portuguese and Spanish speakers may over-pronounce 'it' in 'It is said that...'. Teach the weak form.
  note: 'In Structure 1, ''it'' is unstressed: /ɪt ɪz sed ðət/. The stress falls on the reporting verb and the content of
    the that-clause.'
register_notes:
- note: In formal writing, passive voice is used to depersonalize and focus on the process.
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, passive voice is less common; active voice is preferred.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Reporting verb passives (It is said that...): academic prose uses these structures extensively
    for impersonal reporting. Conversation rarely uses impersonal passives. Ch. 6.4.1, 9.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.4.1
