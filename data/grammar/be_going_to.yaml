common_errors:
- correction: I am going to study.
  error: 'Using ''going to'' without ''be'': *''I going to study.'''
  explanation: '''Going to'' requires the verb ''be'' (am/is/are).'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I am going to go to the store tomorrow.
  error: 'Confusing ''going to'' with present continuous: *''I am going to the store tomorrow.'' (intention)'
  explanation: Present continuous for future requires context showing it's a plan. 'Going to' is clearer for intentions.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: There is the doorbell. I'll get it.
  error: 'Using ''going to'' for spontaneous decisions: *''There is the doorbell. I am going to get it.'''
  explanation: 'Swan Entries 35-36: Spontaneous decisions and offers use "will", not "going to". "Going to" implies prior
    intention.'
  l1_groups: &id001
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entries 35-36. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I am seeing Jake tonight.
  error: 'Using ''will'' for fixed arrangements: *''I will see Jake tonight.'' (fixed plan)'
  explanation: 'Swan PEU: For personal arrangements with time/place decided, use present progressive. "Will" suggests a spontaneous
    decision.'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 36. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: A future tense structure used to talk about planned actions or predictions based on present evidence.
dialectal_variation:
- note: In informal speech, 'going to' is often reduced to 'gonna'.
discourse_notes:
- note: '''Going to'' expresses prior intention: ''I''m going to study medicine.'' (decided before speaking)'
- note: '''Going to'' can also express prediction based on evidence: ''Look at those clouds. It''s going to rain.'''
form:
  affirmative:
    example_generator:
    - I am going to travel to Japan next year.
    - She is going to study medicine.
    - They are going to move to a bigger house.
    min_examples: 4
    structure: Subject + am/is/are + going to + base verb
  negative:
    example_generator:
    - I am not going to eat meat anymore.
    - She is not going to come to the party.
    - They are not going to watch the game.
    min_examples: 4
    structure: Subject + am/is/are + not + going to + base verb
  questions:
    example_generator:
    - Are you going to finish that report today?
    - Is she going to apply for the job?
    - Are they going to visit us next week?
    min_examples: 4
    structure: Am/Is/Are + subject + going to + base verb?
grammar_point: be_going_to
level: A2
meaning:
  ccqs:
  - answer: Before. Be going to is for plans made before the moment of speaking.
    purpose: Tests whether the learner understands that "be going to" expresses plans made BEFORE the moment of speaking,
      not spontaneous decisions. This is the key distinction between "be going to" and "will".
    question: She is going to study medicine. Did she decide now, or before?
  - answer: A prediction based on present evidence (the clouds).
    purpose: Tests whether the learner understands that "be going to" can also express predictions based on present evidence
      (not just plans). This dual use is important because it shows the structure is more versatile than just expressing intentions.
    question: Look at those dark clouds! Is this a plan or a prediction?
  - answer: No. For spontaneous decisions, use will instead.
    purpose: Tests whether the learner knows that "be going to" cannot be used for spontaneous decisions made at the moment
      of speaking. This is important because using "going to" for a just-made decision sounds unnatural to native speakers.
    question: Can we use be going to for a decision you just made right now?
  - answer: I am going to go to the store tomorrow uses going to as a future tense (intention). I am going to the store tomorrow
      uses present continuous for a future arrangement. The first has going to plus base verb (future), while the second has
      going to plus place (present continuous with future meaning).
    purpose: 'Tests whether the learner can distinguish between be going to plus verb (future intention) and be going to plus
      place (present continuous for future). This is important because the two structures look similar but convey different
      meanings: one expresses intention, the other expresses a fixed plan or arrangement.'
    question: I am going to the store tomorrow versus I am going to go to the store tomorrow -- which one uses going to as
      a future tense?
  contrast: Be going to = pre-planned actions or evidence-based predictions. Will = spontaneous decisions or predictions without
    evidence.
  core_meaning: Expresses future plans (intentions made before speaking) or predictions based on current evidence (dark clouds
    mean rain is coming).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes:
    - Be going to is one of the most common ways to talk about the future in spoken English
    - The contraction gonna is extremely common in informal speech but should not be used in writing
    min_examples: 5
  timeline: Refers to future time, near or distant, relative to the present moment.
phonetics:
- example_generator:
  - going to → gonna /ˈɡʌnə/
  l1_issue: Learners whose first language does not reduce function words (Spanish, Japanese) may always pronounce the full
    going to, which sounds overly formal.
  note: In connected speech, going to is very commonly reduced to gonna. The ing syllable is lost entirely in casual speech.
- example_generator:
  - to → /tə/
  l1_issue: French and Italian speakers may be tempted to pronounce a clear vowel, which sounds stilted.
  note: The word to in going to is almost always pronounced as a schwa /tə/, never as a clear /tuː/.
register_notes:
- note: '''Going to'' is neutral in register. In formal writing, ''will'' or ''intend to'' may be preferred.'
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, 'gonna' is common but non-standard in writing.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Future expression distribution: ''be going to'' is strongly conversational; ''will'' dominates
    in academic prose and news. Register-appropriate future expression is important for natural-sounding English. Ch. 6.2.1.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.1.3
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Future Tenses-8.6'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I am going to paint my room this weekend (plan decided earlier)
  - She is going to fall — she is walking on ice (prediction based on what we see)
  rule: 'Be going to has two main uses: plans made before speaking, and predictions based on visible evidence'
  type: semantic
- examples:
  - I am gonna call you later (informal speech)
  - I am going to call you later (written and formal)
  rule: In informal speech, going to is often pronounced as gonna — not appropriate in formal writing
  type: phonological
- examples:
  - I am going to travel to Japan next year (correct — time expression is fine)
  - She is going to start her new job next Monday (correct)
  rule: Unlike be about to, be going to can be used with future time expressions
  type: grammatical
- examples:
  - They are not going to come to the party
  - I am not going to eat meat anymore
  - She is not going to apply for the job
  rule: Negation is formed by adding not after the be verb
  type: grammatical
- examples:
  - Are you going to finish that report today?
  - Is she going to apply for the job?
  rule: Questions are formed by inverting the subject and the be verb
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students mingle and ask each other 'What are you going to do this weekend?' They find classmates with
      similar plans.
    duration: 15
    name: Weekend Plans Survey
  - adaptation_notes: 'Show weather maps. Students play weather reporters: ''It is going to rain in the north, and it is going
      to be sunny in the south.'''
    duration: 15
    name: Weather Reporter
  - adaptation_notes: Show images (dark clouds, packed suitcase, crying baby). Students decide if each image shows evidence
      for a prediction, then make sentences.
    duration: 10
    name: Evidence or Opinion
  tips:
  - 'Use real class examples: ''I am going to teach you grammar today'' (plan).'
  - 'Show evidence for predictions: point to a broken chair and say ''It is going to break.'''
  - 'Practice with timelines: mark past (plan made), present, and future (action).'
  - 'Contrast with will using role-plays: spontaneous offers vs pre-planned actions.'
  - 'Swan PEU: Present progressive for future = fixed arrangements. "I am seeing Larry on Tuesday" (arrangement exists now).'
  - 'Swan PEU: "Going to" for intentions AND predictions with evidence. "I am going to study tonight" (intention). "Look at
    those clouds -- it is going to rain" (evidence).'
  - 'GB3 Ch. 7: Be going to — conveys intention/prior plan or prediction based on present evidence. Torres Cacoullos & Walker
    (2009): four future constructions (simple present, present progressive, will, going to) form a ''construction family''
    — related but differentiated by use context. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.2 (citing Torres
    Cacoullos & Walker 2009; Bergs 2010).'
title: Be going to (future plans and predictions)
use:
- context: Future plans and intentions
  examples:
  - I am going to learn Spanish next semester.
  - We are going to move to a bigger house.
  - She is going to apply for a new job.
- context: Evidence-based predictions
  examples:
  - She is going to fail the test; she has not studied at all.
  - The baby is going to wake up soon; it is crying.
  - Look at those clouds! It is going to rain.
