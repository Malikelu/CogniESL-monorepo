level: C2
meaning:
  ccqs:
  - answer: Yes, collocations and binomials must be learned as chunks — individual words cannot be swapped freely.
    purpose: Tests whether the learner understands that advanced collocations (pay lip service to, take umbrage at) are fixed
      expressions whose meaning cannot be deduced from individual words. They must be learned as chunks.
    question: Is this a fixed word combination that cannot be changed?
  - answer: No, binomials have a fixed order that native speakers follow unconsciously.
    purpose: Tests whether the learner understands that binomials (give and take, odds and ends, back and forth) have a fixed,
      arbitrary order. Swapping the order sounds unnatural even though the meaning is the same.
    question: Can we say 'take and give' instead of 'give and take'?
  - answer: No, it is an idiom meaning to express support insincerely.
    purpose: Tests whether the learner understands that idiomatic collocations (pay lip service to, give short shrift to)
      have figurative meanings that cannot be translated literally. This is essential for advanced comprehension of academic
      and journalistic texts.
    question: Does 'pay lip service to' literally mean paying with lips?
  - answer: No, these binomials have a fixed arbitrary order. "Later or sooner" and "less or more" sound unnatural to native
      speakers even though the meaning would be the same.
    purpose: Tests whether the learner understands that binomials joined by any conjunction ("and," "or," or "to") have a
      fixed, arbitrary order that cannot be predicted by meaning. "Give and take" (not "take and give"), "more or less" (not
      "less or more"), and "back to front" (not "front to back") must all be memorized as fixed chunks — this is a defining
      property of binomials at C2 level.
    question: In binomials joined by "or" like "sooner or later" and "more or less," can the word order be reversed to "later
      or sooner" or "less or more"?
  contrast: Basic collocations = 'make a decision' vs Advanced collocations = 'make a concerted effort'. Binomials = fixed-order
    pairs like 'give and take' (not 'take and give').
  core_meaning: Fixed word combinations and paired expressions that advanced learners must master to sound natural and fluent
    in English.
  example_generator:
    contexts:
    - academic writing
    - professional communication
    - formal speeches
    - news reporting
    cultural_notes:
    - Binomials like 'law and order' and 'bits and bobs' are deeply embedded in British English culture
    - Many advanced collocations originate from legal, nautical, or military language
    min_examples: 5
  timeline: Timeless — collocations are not tied to a specific time frame; they are lexical chunks used across all tenses
    and contexts.
phonetics:
- example_generator:
    contexts:
    - spoken English
    - formal speeches
  l1_issue: Speakers of syllable-timed languages (e.g., Spanish, French) may give equal stress to both elements, sounding
    unnatural.
  note: 'In binomials, primary stress typically falls on the first element, with secondary stress on the second: GIVE and
    TAKE, BACK and FORTH.'
- example_generator:
    contexts:
    - spoken English
    - presentations
  l1_issue: L1 speakers may over-stress the verb (MAKE a concerted effort) instead of the noun.
  note: 'In collocations, stress falls on the content word, not the delexicalised verb: make a conCERTed EFfort.'
register_notes:
- note: 'Biber et al. (2021) — Lexical bundles: conversation uses pronoun + verb bundles (I was going to, I thought that was);
    academic prose uses noun phrase + of-phrase bundles (the end of the, the purpose of the). Ch. 13.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 13.2
