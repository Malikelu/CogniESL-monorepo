common_errors:
- correction: I stayed because of the rain.
  error: 'Using ''because'' with a noun: *''I stayed because the rain.'''
  explanation: '''Because'' introduces a clause (subject + verb). ''Because of'' introduces a noun.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: Because I was tired, I slept.
  error: 'Using ''so'' and ''because'' together: *''Because I was tired so I slept.'''
  explanation: Don't use 'so' and 'because' in the same sentence. Choose one.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: Because it was raining, we stayed home.
  error: 'Using ''because of'' + clause: *''Because of it was raining, we stayed home.'''
  explanation: 'Swan PEU: "Because of" is a preposition (takes noun). "Because" is a conjunction (takes clause).'
  l1_groups: &id001
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 75. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: The reason is that I was tired.
  error: 'Using ''the reason is because'': *''The reason is because I was tired.'''
  explanation: 'Swan PEU: "The reason is because" is widely used but considered redundant. Formal English prefers "the reason
    is that".'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 75. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Conjunction that introduces the reason for something. Essential for explaining why.
dialectal_variation:
- note: 'In informal speech, ''cos'' replaces ''because'': ''I stayed cos it was raining.'''
discourse_notes:
- note: '''Because'' creates causal relationships: ''I stayed home because it was raining.'''
form:
  affirmative:
    example_generator:
    - I stayed home because it rained.
    - Because it rained, I stayed home.
    - She cried because she was sad.
    min_examples: 4
    structure: Main clause + because + reason clause / Because + reason clause + comma + main clause
  negative:
    example_generator:
    - I did not go because I was sick.
    - She did not call because she was busy.
    - They did not come because they had to work.
    min_examples: 4
    structure: Main clause in negative + because + reason clause
  questions:
    example_generator:
    - Why did you go?
    - Why is she crying?
    - Why were they late?
    min_examples: 4
    structure: Why + auxiliary + subject + main verb?
grammar_point: because
level: A1
meaning:
  ccqs:
  - answer: No. The reason was the rain.
    purpose: Tests whether the learner can identify the reason/cause in a sentence. Understanding causal relationships is
      essential for using reason conjunctions correctly.
    question: I stayed home because it rained. Did I stay home for no reason?
  - answer: A reason. It answers the question 'why?'
    purpose: Tests whether the learner can identify the reason/cause in a sentence. Understanding causal relationships is
      essential for using reason conjunctions correctly.
    question: Is because used to give a reason or a result?
  - answer: No. Use because with a clause (subject + verb) or because of with a noun.
    purpose: Tests whether the learner understands the difference between present ability (can) and past ability or polite
      possibility (could). This is important for expressing ability and making requests.
    question: Can you say 'because of it rained'?
  - answer: 'This sentence is ambiguous without context or intonation. It could mean (1) I did not go, and the reason was
      that it was boring, or (2) I did go, but not because it was boring (I went for another reason). In speech, intonation
      and stress clarify the meaning. In writing, rephrasing is needed: "It was because it was boring that I did not go" (meaning
      1) or "I went, but not because it was boring" (meaning 2).'
    purpose: Tests whether the learner understands the ambiguity that arises when "because" follows a negated main clause.
      This is a well-known source of miscommunication in English, and recognizing this ambiguity helps learners write more
      clearly by restructuring sentences to avoid confusion.
    question: I did not go because it was boring — does this mean I stayed home due to boredom, or I went for a different
      reason?
  contrast: Because introduces a reason (effect because cause). So introduces a result (cause so result). Because of is followed
    by a noun, not a clause.
  core_meaning: Explains the cause or reason for an action or situation. Answers the question 'why?'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes:
    - Because is one of the most common conjunctions in English
    - The weak form /kəz/ is extremely common in spoken English
    min_examples: 5
  timeline: Because clause can be past, present, or future depending on the main clause.
phonetics:
- example_generator:
  - because → /kəz/ or /kz/
  l1_issue: Learners may over-pronounce because as /bɪkɒz/ in all contexts, missing the natural reduction that native speakers
    use.
  note: Because is often reduced to /kəz/ or even /kz/ in connected speech, especially before consonants.
- example_generator:
  - because of → /kəzəv/
  l1_issue: Speakers of syllable-timed languages (Spanish, French) may insert a glottal stop between the words, breaking the
    natural flow.
  note: 'In because of, the words link smoothly together: /kəzəv/. The final sound of because connects directly to the vowel
    of of.'
register_notes:
- note: '''Because'' is neutral in register. In formal writing, ''due to'' or ''owing to'' may be preferred.'
  reliability: D
  source: Team observation
  tier: 4
- note: '''Because of'' + noun is more formal than ''because'' + clause in some contexts.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Causal subordinators: ''because'' is common across all registers; ''since'' (causal) is more
    formal/written. Academic prose uses more explicit causal connectors. Ch. 10.2.1.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.1.4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I stayed because I was tired (correct)
  - I stayed because tired (WRONG — missing subject and verb)
  rule: Because must be followed by a full clause with a subject and a verb
  type: grammatical
- examples:
  - I stayed because of the rain (correct — rain is a noun)
  - I stayed because of it rained (WRONG — use because with a clause)
  rule: Because of is followed by a noun or noun phrase, not a full clause
  type: grammatical
- examples:
  - Because it was cold, I wore a coat (comma needed)
  - I wore a coat because it was cold (no comma needed)
  rule: When the because clause comes first, use a comma before the main clause
  type: punctuation
- examples:
  - I was tired, so I slept (cause → result)
  - I slept because I was tired (effect ← reason)
  rule: Because introduces a reason; so introduces a result — they go in opposite directions
  type: semantic
- examples:
  - 'I did not go because it was boring (ambiguous: maybe I went for another reason, or maybe I did not go at all)'
  - 'I did not go. It was because it was boring (clear: the reason I did not go was the boredom)'
  rule: Negation with because can be ambiguous — context and intonation clarify meaning
  type: pragmatic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Teacher says a result. Student A gives a reason using because. Student B gives a reason for that reason,
      creating a chain.
    duration: 10
    name: Why Chain
  - adaptation_notes: 'Students sort sentences into two groups: because + clause and because of + noun. Then convert sentences
      from one form to the other.'
    duration: 15
    name: Because vs Because Of Sorting
  - adaptation_notes: 'Students connect clues using because to explain what happened: ''The window was open because someone
      broke in.'''
    duration: 20
    name: Detective Game
  tips:
  - 'Use ''Why?'' questions constantly: ''Why are you here? Because...'''
  - 'Practice reason-result pairs: ''It rained → I stayed home'' (so/because).'
  - 'Draw arrows: reason → result (so) vs result ← reason (because).'
  - 'Swan PEU: "Because" (conjunction) + clause. "Because of" (preposition) + noun. Simple rule: if what follows has a verb,
    use "because". If it is just a noun, use "because of".'
title: Because (Reason Clauses)
use:
- context: Giving reasons
  examples:
  - I am late because of traffic.
  - She cried because she was sad.
  - He failed because he did not study.
- context: Justifying actions
  examples:
  - I quit because the job was boring.
  - We left because it was noisy.
  - She apologized because she was wrong.
- context: Because vs because of
  examples:
  - I stayed home because it rained (because + clause)
  - I stayed home because of the rain (because of + noun)
