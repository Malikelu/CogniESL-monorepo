grammar_point: generic_pronouns
level: B1
meaning:
  ccqs:
  - answer: People in general — it is a generic pronoun.
    purpose: Tests whether the learner understands that generic pronouns (one, you, they) refer to people in general, not
      specific individuals.
    question: Does this pronoun refer to a specific person or people in general?
  - answer: '''One'' is formal; ''you'' is informal; ''they'' is neutral.'
    purpose: Tests whether the learner can choose the appropriate generic pronoun for the register.
    question: Is this formal or informal generic reference?
  - answer: It sounds very formal. In conversation, 'you' is more natural for generic reference.
    purpose: Tests whether the learner understands the register difference between 'one' (formal) and 'you' (informal) for
      generic reference.
    question: Can we use 'one' in conversation?
  - answer: An unspecified group of people — generic 'they.' It does not refer to specific individuals the speaker knows.
      It is equivalent to 'people in general' or 'the word around town.'
    purpose: Tests whether the learner understands generic 'they' as a vague source reference. Unlike specific 'they' (which
      points to known people), generic 'they' refers to an unnamed group and is commonly used for rumours, common knowledge,
      and general opinions.
    question: In the sentence "They say the new restaurant is excellent," who are "they"?
  contrast: 'Generic you = Informal general reference (not the listener specifically)


    Generic one = Formal general reference (rare in spoken English)


    Generic they = Neutral, refers to an unspecified group/source


    Specific you = Refers to the listener directly

    '
  core_meaning: Refer to people in general (all people, or an unspecified group) without naming specific individuals. Not
    tied to the listener (you) or speaker (I).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Generic pronouns are not tense-based; they describe general truths.)
phonetics:
- example_generator:
    contexts:
    - generic you reduction
  l1_issue: Learners may over-pronounce generic you as /juː/ in all contexts, sounding unnatural.
  note: 'Generic you is often reduced in connected speech: ''You should'' → /jə ʃʊd/, ''You never'' → /jə ˈnevə/. The pronoun
    reduces to /jə/ in unstressed positions.'
register_notes:
- note: 'Generic pronouns vary by register: ''one'' (formal), ''you'' (informal), ''they'' (singular they, increasingly accepted).'
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, 'one' is preferred for generic reference.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, ''you'' is the most common generic pronoun: ''You have to be careful.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Generic pronouns (''you'', ''one'', ''they'' for generic reference): conversation uses more
    ''you'' and ''they'' for generic reference; formal academic prose may use ''one''. Ch. 4.1.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 4.1.2
