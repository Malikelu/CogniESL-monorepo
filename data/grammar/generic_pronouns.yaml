description: 'Pronouns used to refer to people in general (not specific individuals) for advice, proverbs, or unspecified
  sources: generic you (informal), generic one (formal), generic they (neutral).'
dialectal_variation: []
discourse_notes:
- note: 'In conversation, ''you'' is used generically: ''You never know what might happen.'''
- note: 'In academic writing, ''one'' is used for generic reference: ''One should always cite one''s sources.'' (formal)'
- note: 'In informal speech, singular ''they'' is increasingly accepted: ''Someone left their bag.'''
