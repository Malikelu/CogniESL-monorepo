common_errors:
- correction: She is really smart, my sister.
  error: 'Omitting the pronoun at the beginning: *''Is really smart, my sister.'''
  explanation: Right-dislocation requires a pronoun in the subject position to serve as the grammatical subject. The full
    noun phrase appears only at the end. Omitting the pronoun creates an ungrammatical sentence.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: She is really smart, my sister.
  error: 'Using wrong pronoun case: *''Her is really smart, my sister.'''
  explanation: The right-dislocation structure requires a subject pronoun (she/he/they) in the initial position, not an object
    pronoun. The pronoun functions as the grammatical subject of the sentence.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Korean
  reliability: D
- correction: She is really smart, my sister.
  error: 'Forgetting the comma: *''She is really smart my sister.'''
  explanation: A comma is essential to signal the right-dislocation structure without it, the sentence reads as if 'my sister'
    is an appositive but without proper punctuation, it becomes confusing or ungrammatical.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: D
description: 'Moving a noun phrase to the end of a sentence for emphasis or clarification, with a pronoun in the normal subject
  position: ''She is really smart, my sister.'''
