grammar_point: right_dislocation
level: C1
meaning:
  ccqs:
  - answer: Yes, that is right-dislocation.
    purpose: Tests whether the learner can identify the structural signature of right-dislocation -- a pronoun in the subject
      position with the full noun phrase appearing after a comma at the end of the clause.
    question: Is there a pronoun at the beginning and a noun at the end?
  - answer: Informal — used in spoken English.
    purpose: Tests the learner's awareness that right-dislocation is a feature of informal spoken English and would be inappropriate
      in formal writing, helping them match structure to register.
    question: Is this formal or informal?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with right dislocation and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: The first is right-dislocation — the pronoun 'she' comes first in a normal clause, and the full noun 'my sister'
      is added at the end for clarification. The second is left-dislocation — the noun 'my sister' is fronted to the beginning,
      and the pronoun 'she' appears in the main clause. Both are informal spoken structures, but right-dislocation adds the
      noun at the end, while left-dislocation places it at the start.
    purpose: Tests whether the learner can distinguish between right-dislocation and left-dislocation as two different information-packaging
      structures in spoken English. Right-dislocation (pronoun first, noun at end) is used to clarify who a pronoun refers
      to after the clause has begun, while left-dislocation (noun first, pronoun in clause) establishes the topic before commenting
      on it. Both are informal and serve different discourse functions.
    question: Can you explain the difference between 'She is really smart, my sister' and 'My sister, she is really smart'
      by giving an example of when to use each?
  contrast: Standard = My sister is really smart. vs Right-dislocation = She is really smart, my sister.
  core_meaning: A structure where a noun phrase is moved to the end of a sentence and replaced by a pronoun. Used for emphasis
    or clarification in spoken English.
  timeline: Present — the dislocated element refers to the present.
