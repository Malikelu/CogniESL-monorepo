grammar_point: it_cleft
level: B2
meaning:
  ccqs:
  - answer: Yes, it is an it-cleft.
    purpose: Tests whether the learner understands that 'it-cleft' sentences (It was John who...) are used to emphasize a
      specific element. This is common in both spoken and written English.
    question: Is this sentence dividing information into two parts?
  - answer: The element after it was.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'What element is being emphasized?...' checks conceptual understanding, not just memorization.
    question: What element is being emphasized?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with it cleft and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: The price. In an it-cleft sentence (It + be + FOCUS + that/who + clause), the focused element immediately follows
      'it was.' Here, 'the price' is being highlighted as the central concern, in contrast to other possible factors like
      quality or brand.
    purpose: Tests whether the learner can identify and correctly place the focused element in an it-cleft structure. The
      it-cleft formula (It + be + focused element + that-clause) front-loads emphasis, and learners must be able to determine
      which element to highlight for the intended communicative purpose.
    question: '"It was the price that mattered most to the buyers." Which element is the speaker focusing on — the buyers,
      the price, or something else?'
  contrast: Simple = John broke the window. vs It-cleft = It was John who broke the window.
  core_meaning: It-cleft sentences divide a single clause into two parts for emphasis. The focused element comes after it
    was/who/that.
  example_generator:
    contexts:
    - emphasis
    - contrast
    - correcting misunderstandings
    - formal writing
    cultural_notes: []
    min_examples: 5
  timeline: Depends on the tense used.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Many L1 speakers do not use cleft sentences, missing opportunities for natural emphasis.
  note: Stress on the focused element
register_notes:
- note: 'Biber et al. (2021) — It-cleft distribution: register-dependent. More frequent in conversation and news. Academic
    prose uses fewer clefts. Ch. 11.6.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 11.6.4
