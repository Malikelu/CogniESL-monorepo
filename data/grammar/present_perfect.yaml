citations:
- claim: 'Core meaning: Describes a past action that has a connection to the present moment'
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.2-6.5: Perfect aspect, passive, and combinations
    (register distribution)'
  tier: 1
- claim: 'Register distribution: Present perfect is more common in BrE than AmE. AmE often uses past simple where BrE uses
    present perfect'
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.2-6.5: Perfect aspect, passive, and combinations
    (register distribution)'
  tier: 1
- claim: 'Discourse function: Present perfect is used to introduce a topic that is then developed with past simple: ''I have
    visited'
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.2-6.5: Perfect aspect, passive, and combinations
    (register distribution)'
  tier: 1
- claim: 'Common error ''Using present perfect with specific past time: *''I have eaten'' for Portuguese, Spanish, French
    speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 8: Perfect tenses-8.4'
  tier: 1
- claim: 'Dialectal variation: BrE/AmE difference: BrE strongly prefers present perfect with ''just'', ''already'', ''yet'':
    ''I''ve just arrived.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7: Perfect Aspect-7.4'
  tier: 1
- claim: L1 transfer in present perfect varies significantly across language backgrounds — Swan & Smith document contrastive
    patterns for speakers of different L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents how transfer effects are non-linear,
    determined by functional fit between L1 and L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects are non-linear — determined by functional
    fit between L1 and L2 systems rather than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 2
common_errors:
- correction: I have eaten lunch.
  error: 'Omitting the auxiliary ''have/has'': *''I eaten lunch.'''
  explanation: English requires the auxiliary 'have/has' in present perfect. Many L1s (Portuguese, Spanish, Chinese) do not
    use an auxiliary for this tense.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  - Korean
  reliability: D
- correction: I have already eaten lunch.
  error: 'Using past simple when present perfect is needed: *''I already ate lunch.'''
  explanation: With 'already', 'just', 'yet', 'ever', 'never', English typically uses present perfect, not past simple. AmE
    sometimes uses past simple here, but BrE and standard teaching materials use present perfect.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: I have lived here for 10 years.
  error: 'Confusing ''for'' and ''since'': *''I have lived here since 10 years.'''
  explanation: '''For'' is used with a period of time (10 years, 3 months, 2 hours). ''Since'' is used with a point in time
    (2015, January, last Monday). This is a very common error across all L1 groups.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Dutch
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  - Thai
  - Farsi
  - Hindi
  - Swahili
  - Malay
  reliability: D
- correction: Today I finished work early because I started at seven o'clock this morning.
  error: 'Using present perfect with time-when adverbials: *''Today I''ve finished work early because I''ve started at seven
    o''clock this morning.'''
  explanation: 'Swan & Smith (2001) Ch. 22: Catalan and some Spanish dialects use present perfect with time-when adverbials
    (today, this morning). In English, present perfect cannot be used with specific past time references.'
  l1_groups:
  - Spanish
  reliability: B
  source: 'Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press. Ch. 22: Spanish speakers, Time tense and
    aspect section.'
- correction: I saw that film yesterday.
  error: 'Using present perfect with specific past time: *''I have seen that film yesterday.'''
  explanation: 'Swan Entry 47-48: Present perfect cannot be used with specific past time expressions (yesterday, last week,
    in 2010). For specific times, use past simple.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Dutch
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  - Thai
  - Farsi
  - Hindi
  - Swahili
  - Malay
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: Shakespeare wrote many plays.
  error: 'Using present perfect for completed historical events: *''Shakespeare has written many plays.'''
  explanation: 'Swan PEU: Present perfect requires a connection to the present. For dead historical figures or completed past
    periods, use past simple.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: This is the first time I have heard her sing.
  error: 'Using past simple when present perfect is needed with ''this is the first time'': *''This is the first time I hear
    her sing.'''
  explanation: 'Swan PEU: After ''this is the first/second/best/worst'' we use present perfect, not simple present or past
    simple.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Dutch
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  - Thai
  - Farsi
  - Hindi
  - Swahili
  - Malay
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I've only known her for two days.
  error: 'Using present perfect with stative verbs in progressive: *''I''ve only been knowing her for two days.'''
  explanation: 'Swan PEU: Stative verbs (know, believe, want) are not used in perfect progressive forms. Use present perfect
    simple instead.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I have known her for years. / How long have you been studying English?
  error: 'Using past simple for unfinished time: *''I know her for years.'' / *''How long are you studying English?'''
  explanation: 'Swan PEU: To say how long something has been going on, use a perfect tense, not a present or past tense.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Dutch
  - Italian
  - Russian
