  - Malay
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- error: Present perfect especially challenging for L1s lacking this category (Golden et al. Ch.3)
  explanation: 'Golden et al. (2017) Ch.3 (Helland Gujord): L1s without a perfect construction entirely (Somali, Vietnamese,
    Mandarin, Korean, Japanese, Thai, Indonesian) show the most difficulty with Norwegian present perfect. When L1 has temporal/aspectual
    morphology that superficially resembles perfect but is functionally different, learners overuse present perfect in preterite
    contexts. The challenge is not just L1 presence/absence but functional fit between L1 and L2 systems.'
  l1_groups:
  - Vietnamese
  - Mandarin
  - Korean
  - Japanese
  - Thai
  - Indonesian
  - Somali
  - Tagalog
  reliability: C
  source: Golden et al. (2017), Ch. 3
description: Connects past actions to the present. No specific past time given. Shows experience, change, or unfinished time.
  One of the most important A2 grammar points.
dialectal_variation:
- note: 'BrE/AmE difference: BrE strongly prefers present perfect with ''just'', ''already'', ''yet'': ''I''ve just arrived.''
    AmE often uses past simple: ''I just arrived.'' Both are correct in their respective dialects.'
- note: 'BrE/AmE difference: BrE uses present perfect for recent news: ''The Prime Minister has resigned.'' AmE may use past
    simple: ''The Prime Minister resigned.'''
- note: In some Irish and Scottish dialects, present perfect is used more broadly than in standard BrE.
- note: 'In African American Vernacular English, present perfect may be formed differently: ''I done finished'' (completive
    aspect).'
discourse_notes:
- note: 'Present perfect is used to introduce a topic that is then developed with past simple: ''I have visited Paris three
    times. The first time was in 2015...'' (present perfect opens the topic, past simple gives details)'
- note: 'In conversation, present perfect is used for ''hot news'': ''I''ve passed my exam!'' (recent, relevant to now)'
- note: 'Present perfect creates cohesion in narratives by connecting past events to the present moment of telling: ''I have
    never felt so scared.'' (the feeling is still relevant)'
- note: 'In academic writing, present perfect is used for the literature review section, while past simple is used for describing
    specific studies: ''Smith (2020) found that...'' vs ''Several studies have shown that...'''
- note: 'GB 2nd ed. (Ch.9) identifies a discourse function of the present perfect: SCENE-SETTING in narrative. Narrators use
    the present perfect to establish background/orientation before shifting to past tenses for the main events: ''She has
    never been so lucky as she was one day last May. She was walking home from school that day when she ran into a friend.''
    The present perfect sets the scene; past tenses drive the narrative forward.'
  source: Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle. Ch. 9
form:
  affirmative:
    example_generator:
    - I have eaten lunch.
    - She has gone to Paris.
    - They have finished the project.
    - He has lost his keys.
    min_examples: 4
    structure: Subject + have/has + past participle (V3)
  negative:
    example_generator:
    - I haven't eaten lunch.
    - She hasn't gone to Paris.
    - They haven't finished the project.
    - He hasn't lost his keys.
    min_examples: 4
    structure: Subject + have not (haven't) / has not (hasn't) + past participle (V3)
  questions:
    example_generator:
    - Have you eaten lunch?
    - Has she gone to Paris?
    - Have they finished the project?
    - Has he lost his keys?
    min_examples: 4
    structure: Have/Has + subject + past participle (V3)?
grammar_point: present_perfect
level: A2
meaning:
  ccqs:
  - answer: No — the exact time is not important. What matters is the result or experience now.
    purpose: 'Tests whether the learner understands the core concept of present perfect: a past action with a connection to
      the present moment, where the exact time is not important.'
    question: Do we know exactly when this happened?
  - answer: Yes — the past action affects the present in some way (experience, result, or unfinished time period).
    purpose: Tests whether the learner can identify the present relevance component.
    question: Is there a connection to the present moment?
  - answer: No — specific past time expressions (yesterday, last week, in 2020) require past simple.
    purpose: 'Tests whether the learner understands time expression incompatibility with present perfect: specific past time
      expressions (yesterday, last week, in 2020) require past simple.'
    question: Can we say 'yesterday' or 'last week' with this tense?
  - answer: '''I saw that film yesterday.'' Present perfect cannot be used with specific past time expressions (yesterday,
      last week, in 2010). Use past simple.'
    purpose: Tests whether the learner knows that present perfect cannot be used with specific past time references (Swan
      PEU 2016, entries 47-48).
    question: Which is correct? *'I have seen that film yesterday' or 'I saw that film yesterday'?
  contrast: '''Present Perfect'' = ''I have eaten.'' (no specific time, connection to now) vs ''Past Simple'' = ''I ate yesterday.''
    (specific time, finished)'
  core_meaning: Describes a past action that has a connection to the present moment. The exact time is not important — what
    matters is the result or experience NOW. Contrast with Past Simple where the specific time IS important.
  example_generator:
    contexts:
    - life experiences
    - travel and places
    - work and career
    - recent events
    - unfinished time periods
    cultural_notes:
    - Use diverse travel destinations and cultural contexts
    - Avoid examples that assume specific cultural knowledge
    - Include both positive and negative experiences
    min_examples: 5
  timeline: Past action → present result. The time period extends from some point in the past up to NOW. The action may be
    finished or may continue.
phonetics:
- example_generator:
  - I have → I've /aɪv/
  - She has → she's /ʃiːz/
  - They have → they've /ðeɪv/
  l1_issue: Portuguese and Spanish speakers often omit 'have/has' in speech because their languages do not use an auxiliary
    for this tense. Drill 'I have eaten' NOT 'I eaten'.
  note: 'Contractions are essential: I have → I''ve, she has → she''s, they have → they''ve. Full forms sound overly formal
    in spoken English.'
- example_generator:
  - have /həv/ or /əv/
  - has /həz/ or /əz/
  l1_issue: Many L1 speakers over-pronounce 'have' as /hæv/. Teach the weak form for natural speech.
  note: 'Weak form of ''have'' in connected speech: /həv/ or /əv/. ''I have eaten'' sounds like /aɪv ɪtən/ or /aɪ həv ɪtən/.'
register_notes:
- note: 'Present perfect is more common in BrE than AmE. AmE often uses past simple where BrE uses present perfect: BrE ''I''ve
    just arrived'' vs AmE ''I just arrived.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In news reporting, present perfect is used for recent events: ''The Prime Minister has announced a new policy.''
    (headline or lead sentence)'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, present perfect is used for reviewing previous research: ''Several studies have found that...''
    (connecting past research to present discussion)'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, contractions (I''ve, she''s) are typically avoided: ''I have completed the report'' rather than
    ''I''ve completed the report.'''
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (1999) — Present perfect aspect distribution varies across registers. Used to relate past events to present
    situation; frequency differences between conversation, news, academic prose. Ch. 6.3.2
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.3.2
sources:
  corpus_evidence: Biber et al. (1999) LSWE Corpus — Present perfect is most common in conversation and news, considerably
    less common in academic prose and fiction. Present perfect passive occurs over 1,000 times per million words in academic
    prose and news. Past perfect is most frequent in fiction (about 500 per million). Perfect progressives with modals are
    more common in fiction (past tense) than other registers.
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 8: Perfect tenses-8.4'
  primary: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.2-6.5: Perfect aspect, passive, and
    combinations (register distribution)'
  secondary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7: Perfect Aspect-7.4'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 5: Present perfect'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(present perfect: experience, for/since, just, already, yet)'
sub_rules:
- examples:
  - Have you ever been to Japan?
  - Has she ever tried sushi?
  - Have they ever seen snow?
  rule: Use 'ever' in questions about life experience
  type: lexical
- examples:
  - I have never flown.
  - She has never eaten raw fish.
  - They have never been abroad.
  rule: Use 'never' for negative life experience
  type: lexical
- examples:
  - I have lived here for 10 years. (period)
  - I have lived here since 2015. (point)
  - She has worked here for 3 months.
  - He has studied English since January.
  rule: Use 'for' with a period of time, 'since' with a point in time
  type: grammatical
- examples:
  - I have just arrived.
  - She has just finished lunch.
  - They have just left.
  rule: Use 'just' for very recent actions
  type: lexical
- examples:
  - I have already finished my homework.
  - She has already left.
  - They have already eaten.
  rule: Use 'already' for actions completed before now (often earlier than expected)
  type: lexical
- examples:
  - Have you finished yet?
  - I haven't finished yet.
  - Has she arrived yet?
  - They haven't called yet.
  rule: Use 'yet' in questions and negatives for actions expected to happen
  type: lexical
- examples:
  - I have gone to Paris.
  - She has eaten sushi.
  - They have seen that movie.
  rule: 'Common irregular past participles: go → gone, eat → eaten, see → seen, do → done, write → written, speak → spoken,
    take → taken, give → given, make → made'
  type: irregular
teaching:
  methodology: Guided discovery with contrastive analysis
  recommended_activities:
  - adaptation_notes: 'Students ask classmates ''Have you ever...?'' questions to find people who match. Great for practicing
      questions and short answers: ''Yes, I have.'' ''No, I haven''t.'''
    duration: 15
    name: Find Someone Who
  - adaptation_notes: 'Teacher says a time expression. Students decide: ''for'' or ''since''? ''10 years'' (for), ''2015''
      (since), ''3 months'' (for), ''January'' (since). Then students make full sentences: ''I have lived here for 10 years.'''
    duration: 10
    name: For or Since?
  - adaptation_notes: 'Students survey classmates about life experiences: ''Have you ever been to another country?'' ''Have
      you ever tried an extreme sport?'' Then report: ''Pedro has been to Argentina. Maria has never tried bungee jumping.'''
    duration: 15
    name: Life Experience Survey
  - adaptation_notes: 'Teacher describes a situation. Students choose the correct word: ''I am at the door. I have ___ arrived.''
      (just) ''The homework is finished. I have ___ done it.'' (already) ''The bus has not come. It has ___ come.'' (yet)'
    duration: 10
    name: Just, Already, or Yet?
  - adaptation_notes: 'Students write a news report using present perfect for the headline and lead: ''Scientists have discovered
      a new species of frog in the Amazon.'' Then they switch to past simple for details: ''The team found the frog during
      an expedition in March.'''
    duration: 15
    name: News Report
  - adaptation_notes: 'Give students pairs of sentences. They choose the correct tense and explain why: ''I (have visited/visited)
      Paris last year.'' (visited — specific time) ''I (have visited/visited) Paris three times.'' (have visited — life experience)'
    duration: 15
    name: Present Perfect or Past Simple?
  tips:
  - 'Parrott (2000) Ch. 16: Present perfect links the past to the present, focusing on effect or result at time of speaking.
    Teaching approach: deal with uncompleted and completed actions separately. Present perfect continuous is the basic form
    for duration (for/since/How long). Present perfect simple emphasises long-term/non-short-term duration. Learners often
    want to use a present tense instead of present perfect continuous. Source: Parrott (2000) Grammar for English Language
    Teachers, 2nd ed. Ch. 16: The present perfect, 16.1-16.6.'
  - 'GB3 Ch. 9: Present perfect serves a discourse-framing function — it opens a topic or introduces a narrative, while the
    simple past (or simple present) then provides the details. Examples: ''I''ve been bit once already by a German shepherd.
    And that was something. It was really scary...'' (present perfect frames, simple past elaborates). Teaching insight: present
    perfect is often a discourse opener, not just a time-reference choice. Source: Celce-Murcia & Larsen-Freeman (2015) GB3
    3rd ed. Ch. 9 §9.3 (citing Suh 1992).'
  - 'GB3 Ch. 7: Present perfect vs. progressive with current relevance'' rather than through rules about ''unspecified time''
    or lists of uses. The BrE/AmE distribution differs significantly — AmE accepts simple past with just/already/yet where
    BrE requires present perfect.'
  - 'Parrott (2000): The present perfect is most effectively introduced through its core meaning of ''past with present relevance''
    rather than through rules about unspecified time. Learners confuse it with past simple when both are possible in their
    L1 (French passe compose, German Perfekt).'
  - 'Start with the contrast: Present Perfect (no specific time) vs Past Simple (specific time). Use a timeline on the board
    to visualize the difference.'
  - 'Use real-life questions: ''Have you ever been to Paris?'' ''Have you ever eaten sushi?'' This makes the grammar personal
    and meaningful.'
  - Drill for/since explicitly. This is one of the most common errors at A2 level. Use a calendar to visualize the difference.
  - Teach just/already/yet as a set. They all relate to the present moment and are very common in everyday English.
  - Practice irregular past participles systematically. Students need to memorize these — there is no rule.
  - Use the 'life experience' context first (ever/never). This is the most intuitive use of Present Perfect for A2 students.
  - 'Teach the BrE/AmE difference early: ''I''ve just arrived'' (BrE) vs ''I just arrived'' (AmE). This prevents confusion
    when students encounter both forms.'
  - 'Use the ''news report'' context to practice present perfect for recent events: ''Scientists have discovered a new species.'''
  - 'Swan PEU: Use a timeline on the board. Show that present perfect connects past to NOW, while past simple is fully in
    the past. Have students place time expressions on the triangle.'
  - 'Swan PEU: The present perfect is used for ''hot news'': ''I''ve passed my exam!'' (recent, relevant). Then switch to
    past simple for details: ''I got 85%.'''
  - 'Swan Entry 50-51: Present perfect progressive emphasizes the activity/continuation. ''I''ve been reading all day'' (I
    might continue). Present perfect simple emphasizes completion: ''I''ve read three books.'''
  - 'Swan PEU: For dead people, use past simple. For living people, present perfect is possible: ''Einstein has shown...''
    (if connecting to present relevance) vs ''Einstein showed...'' (historical fact).'
  - 'GB3 Ch. 7: Present perfect vs. progressive — PP emphasizes prior event/completion (''I have visited my grandmother''
    = prior event(s)). PP progressive emphasizes ongoing activity (''I have been visiting my grandmother'' = possibly still
    ongoing). PP progressive strongly implies continuation unless contradicted. Source: Celce-Murcia & Larsen-Freeman (2015)
    GB3 Ch. 7 §7.5 (point 2).'
  - 'GB3 Ch. 7: Simple past vs. present perfect — this distinction is EXTREMELY difficult for many learners. NOT about time
    of event (truth values identical). Best sorted at discourse level (see GB3 Ch. 9). Key: present perfect connects to specific
    teaching of boundaries. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.5 (point 3).'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3) analyzes the perfect as a SECONDARY tense
    system (past-within-past, present-perfect = past-within-present). The present perfect (''I have seen it'') locates a situation
    in a time-span that extends up to and includes the present. CGEL distinguishes: continuative perfect (situation continues
    to present: ''I''ve lived here for years''), experiential perfect (situation occurred at least once: ''I''ve been to Paris''),
    resultative perfect (present state results from past event: ''I''ve lost my keys'').'
title: Present Perfect (have/has + past participle)
use:
- context: Life experience (ever/never)
  description: Talking about things you have or have not done in your life up to now
  examples:
  - I have never flown.
  - Have you ever been to Japan?
  - She has visited 20 countries.
  - They have never tried Indian food.
- context: Unfinished time (for/since)
  description: Actions that started in the past and continue to the present
  examples:
  - I have lived here for 10 years.
  - She has worked at this company since 2020.
  - They have known each other for 5 years.
  - He has studied English since he was a child.
- context: Recent actions with present result (just)
  description: Actions that have just finished, with a visible result now
  examples:
  - I have just arrived. (I am here now)
  - She has just finished the report. (it is done now)
  - They have just left. (they are not here now)
- context: Actions completed before now (already/yet)
  description: Actions that are completed or expected to be completed
  examples:
  - I have already done my homework. (it is finished)
  - Have you done your homework yet? (expecting an answer)
  - She hasn't arrived yet. (we are waiting)
