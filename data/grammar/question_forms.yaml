description: Structures used to ask for information, confirmation, or clarification
  in English, including yes/no questions, wh- questions, subject questions, and object
  questions.
dialectal_variation:
- note: 'In informal speech, rising intonation can form questions without inversion:
    ''You like coffee?'''
discourse_notes:
- note: 'Questions serve different functions: information-seeking, confirmation, rhetorical.'
- note: 'In conversation, questions maintain interaction: ''How are you? What did
    you do?'''
form:
  affirmative:
    example_generator:
    - Do you like coffee? (yes/no)
    - Where do you live? (wh-)
    - Who likes coffee? (subject)
    - What do you like? (object)
    min_examples: 4
    structure: 'Yes/No: Auxiliary + Subject + Main Verb / Wh-: Wh- word + Auxiliary
      + Subject + Main Verb / Subject: Wh- word + Verb (no auxiliary)'
  negative:
    example_generator:
    - You don't like coffee. (statement)
    - Don't you like coffee? (negative question — expressing surprise)
    min_examples: 4
    structure: Subject + Auxiliary + not + Main Verb (statements) / Auxiliary + Subject
      + not + Main Verb (questions — less common)
  questions:
    example_generator:
    - Do you like coffee?
    - Where do you live?
    - Who called you?
    min_examples: 4
    structure: This IS the question form — see above.
grammar_point: question_forms
level: A1
meaning:
  ccqs:
  - answer: Yes/no questions start with an auxiliary (do, can, are). Wh- questions
      start with a wh- word (what, where, when).
    purpose: Tests whether the learner can distinguish yes/no questions (start with
      auxiliary) from wh- questions (start with a wh- word). This is fundamental because
      these two question types require different structures and elicit different types
      of information.
    question: Is this a yes/no question or a wh- question?
  - answer: No — subject questions do not use an auxiliary. 'Who likes tea?' NOT 'Who
      does like tea?'
    purpose: Tests whether the learner can form yes/no questions (inversion) and wh-questions
      (wh-word + inversion).
    question: Do we need an auxiliary verb in subject questions?
  - answer: 'Between the auxiliary and the main verb: ''Who did you call?'' NOT ''Who
      you did call?'''
    purpose: Tests whether the learner knows the correct word order for object questions
      (wh- word + auxiliary + subject + main verb). This is important because using
      statement word order in questions is a very common beginner error.
    question: Where does the pronoun go in a separable question?
  - answer: '''Who called you?'' is a subject question — ''who'' is the subject (the
      person who called), so no auxiliary ''did'' is needed. ''Who did you call?''
      is an object question — ''who'' is the object (the person you called), so we
      need the auxiliary ''did'' before the subject ''you''.'
    purpose: Tests whether the learner can distinguish between subject questions and
      object questions, which is one of the most important structural distinctions
      at A1-A2 level. Subject questions (Who called?) keep normal statement word order
      with no auxiliary, while object questions (Who did you call?) require wh-word
      + auxiliary + subject + main verb, and confusing these two patterns leads to
      very common errors.
    question: Can you explain the difference between 'Who called you' and 'Who did
      you call' by giving an example of when to use each?
  contrast: '''Statements'' = Subject + Verb (''You like tea.'') vs ''Yes/No Questions''
    = Auxiliary + Subject + Verb (''Do you like tea?'') vs ''Wh- Questions'' = Wh-
    word + Auxiliary + Subject + Verb (''What do you like?'')'
  core_meaning: 'Question forms reverse standard statement word order to request information.
    The type of question depends on what information is needed: yes/no questions for
    confirmation, wh- questions for specific information, subject questions about
    who/what did the action, and object questions about who/what received the action.'
  example_generator:
    contexts:
    - everyday conversations
    - asking for information
    - interviews
    cultural_notes:
    - Use diverse scenarios and contexts
    - Avoid assuming specific cultural knowledge
    - Keep examples simple and concrete for A1 level
    min_examples: 5
  timeline: N/A — question forms are not tense-based, but use the same tense as the
    statement they derive from.
phonetics:
- example_generator:
  - Do you like coffee? ↗ (rising)
  - Where do you live? ↘ (falling)
  l1_issue: Portuguese and Spanish speakers often use falling intonation for all questions.
    Teach rising intonation for yes/no questions.
  note: 'Questions typically have rising intonation at the end: ''Do you like coffee?
    ↗'' Yes/no questions rise. Wh- questions usually fall: ''Where do you live? ↘'''
- example_generator:
  - do you → /də juː/
  - does she → /dəz ʃiː/
  - did they → /dɪd ðeɪ/
  l1_issue: Many L1 speakers over-pronounce 'do', 'does', 'did' in questions. Teach
    weak forms for natural speech.
  note: 'Weak forms in questions: ''do'' → /də/, ''does'' → /dəz/, ''did'' → /dɪd/.
    ''Do you'' → /də juː/.'
register_notes:
- note: Question forms are consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, indirect questions are preferred: ''I would like to know
    whether...'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Question formation: direct questions are overwhelmingly
    conversational; academic prose and news use almost no direct questions. Indirect
    questions are more common in formal registers. Ch. 3.13.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 3.13.2
