  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 29:
    Focus and Emphasis'
  tier: 1
- claim: Common error '*The man who I saw him yesterday was tall.*' for Arabic, Hebrew,
    Persian speakers
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
