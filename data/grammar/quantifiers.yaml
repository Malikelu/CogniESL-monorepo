sub_rules:
- examples:
  - many students
  - a few cookies
  - few chances
  - several options
  - a lot of people
  rule: 'Countable nouns: many, a few, few, several, a lot of'
  type: grammatical
- examples:
  - much time
  - a little sugar
  - little money
  - a lot of water
  rule: 'Uncountable nouns: much, a little, little, a lot of'
  type: grammatical
- examples:
  - I have a few friends. (some friends — positive)
  - I have few friends. (almost no friends — negative)
  rule: 'A few vs few: a few = some (positive), few = almost none (negative)'
  type: semantic
- examples:
  - I have a little money. (some money — positive)
  - I have little money. (almost no money — negative)
  rule: 'A little vs little: a little = some (positive), little = almost none (negative)'
  type: semantic
- examples:
  - I have some bread. (affirmative)
  - I don't have any bread. (negative)
  - Do you have any bread? (question)
  rule: 'Some vs any: some in affirmative, any in negative and questions'
  type: grammatical
- examples:
  - Can I have some water? (polite question)
  - Would you like some tea? (offer)
  rule: 'Exception: some in polite questions and offers'
  type: pragmatic
- examples:
  - a lot of books (countable)
  - a lot of water (uncountable)
  rule: A lot of works with both countable and uncountable nouns
  type: grammatical
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: 'Teacher says a noun. Students hold up ''C'' (countable) or ''U'' (uncountable) cards. Then students
      say the correct quantifier: ''many books'' or ''much water''.'
    duration: 10
    name: Countable or Uncountable?
  - adaptation_notes: 'Teacher says a sentence frame. Students complete with ''some'' or ''any'': ''I have ___ bread.'' (some)
      ''Do you have ___ milk?'' (any) ''I don''t have ___ money.'' (any)'
    duration: 10
    name: Some or Any?
  - adaptation_notes: 'Students practice shopping dialogues: ''Do you have any apples?'' ''Yes, I have some.'' ''How many
      do you want?'' ''I need a lot of apples.'' Practices quantifiers in authentic context.'
    duration: 15
    name: Shopping Role Play
  - adaptation_notes: 'Show two pictures: one person with a few friends (happy) and one with few friends (sad). Students describe
      the pictures using ''a few'' and ''few''. Reinforces the meaning difference.'
    duration: 10
    name: A Few vs Few
  tips:
  - 'Parrott (2000) Ch. 3: Quantifiers are determiners that signal quantity. Each time we use a noun we must decide if a quantifier
    is needed and which one. Choice involves meaning, grammatical factors, and formality. Quantifiers include all, another,
    any, both, each, either/neither, enough, every, few/a few, little/a little, many, much, more, no, several, some, a lot
    of. They appear at the beginning of noun phrases.'
  - 'Parrott (2000): Parrott (2000) Ch. 3: Each/every take singular verbs. Neither takes singular verb. Formality affects
    quantifier choice — much in affirmative is formal only. Some (stressed) vs any (stressed) marks speaker attitude toward
    quantity. Each emphasizes individuals; every emphasizes the group.'
  - 'Use real objects to demonstrate countable vs uncountable: count apples (countable) vs pour water (uncountable). This
    makes the concept physical and memorable.'
  - Drill the a few/few and a little/little distinction explicitly. This is a common source of confusion even at higher levels.
  - 'Teach the some/any rule early: some for affirmative, any for negative and questions. Then teach the exception (polite
    questions with some).'
  - 'Use visual aids: show a glass with a little water (positive) vs a glass with little water (almost empty, negative).'
  - 'Practice with shopping role-plays: ''Do you have any...?'' ''I need some...'' This gives authentic context.'
  - 'Swan PEU: In informal style, much/many are mostly used in questions and negatives. In affirmative clauses, use ''a lot
    of/lots of/plenty of''. Formal style allows much: ''Much has been written about unemployment.'''
  - 'Swan PEU: The ''a'' makes all the difference. ''few'' = not many (negative); ''a few'' = some (positive). ''little''
    = not much (negative); ''a little'' = some (positive). ''Quite a few'' = considerable number (informal).'
  - 'Swan PEU: some in affirmatives, any in questions/negatives. Exception: some in offers/requests (''Would you like some
    tea?''). any after negative words (never, hardly, without).'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'THE TWO CONTINUUM MODEL: Quantifiers should be taught on positive and negative continua. A few / a little (positive)
    vs. few / little (negative) — the presence/absence of the indefinite article signals a completely different connotation.
    ESL/EFL students who drop the article in ''a few'' accidentally signal a negative meaning (e.g., ''I have few friends''
    = not many, vs. ''I have a few friends''  = some positive number). Also: much is unacceptable in short positive answers
    (*''Much.'' → ''A little.''/''Quite a lot.''), and native speakers prefer ''many'' over ''a lot of'' in formal affirmative
    writing. Source: Ch.17 p.328-337.'
title: Quantifiers (some, any, much, many, a lot of)
use:
- context: Talking about quantity in everyday life
  description: Describing how much or how many of something
  examples:
  - I have many books.
  - There is much traffic today.
  - She has a lot of friends.
  - We need some milk.
- context: Shopping and food
  description: Asking about and describing quantities
  examples:
  - Do you have any apples?
  - I need some bread.
  - There isn't much rice left.
  - Can I have a little sugar?
- context: Describing people and experiences
  description: Talking about amounts in personal life
  examples:
  - I have few close friends.
  - She has a little free time.
  - They have many hobbies.
  - He has much experience.
- context: Polite questions and offers
  description: Using 'some' in questions to sound polite
  examples:
  - Can I have some water?
  - Would you like some coffee?
  - Could I have some help?
