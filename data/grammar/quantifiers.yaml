  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 10: Determiners-10.8'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17: Partitives, Collectives and Quantifiers'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 5: Nouns and Noun Phrases (quantification)'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 7: Quantifiers'
  validation: Swan (2016) Practical English Usage, 4th ed.(some/any), 165 (much/many), 168 (a few/few, a little/little), 172
