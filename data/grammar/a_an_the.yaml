common_errors:
- correction: an apple
  error: 'Using ''a'' before vowel sounds: *''a apple'''
  explanation: 'Swan PEU: The choice between a and an depends on pronunciation, not spelling. We use an before a vowel sound,
    even if written as a consonant (an hour, an MP). We use a before a consonant sound, even if written as a vowel (a university,
    a one-pound coin). Learners who rely on spelling rather than sound will consistently make this error.'
  l1_groups:
  - Portuguese (tend to look at the written letter, not the sound)
  - Spanish (similar reliance for article choice)
  - French (different article system leads to overcorrection)
  reliability: B
  source: Swan Entry 137.7. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I have a car. / She is a teacher.
  error: 'Omitting articles with singular countable nouns: *''I have car.'' / *''She is teacher.'''
  explanation: 'Swan Entry 135.2 (rule 4): In English, singular countable nouns cannot stand alone — they require a determiner
    (a, an, the, my, this, etc.). You can say "a cat, the cat, my cat, this cat" but NOT just "cat". This is one of the most
    persistent errors for speakers of languages without articles.'
  l1_groups:
  - Chinese (no article system in Mandarin)
  - Japanese (no articles; uses context/particles instead)
  - Korean (no article system)
  - Russian (no articles whatsoever)
  - Turkish (no indefinite article; definite article is a suffix)
  reliability: B
  source: Swan Entry 135.2. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I love music. / Dogs are loyal animals.
  error: 'Using ''the'' for general statements: *''I love the music.'' / *''The dogs are loyal animals.'' (when meaning all
    dogs)'
  explanation: 'Swan PEU: "The" does not mean "all." We do not use the with uncountable or plural nouns to talk about things
    in general. "Life is complicated" (not "The life is complicated"). "Books are expensive" (not "The books are expensive").
    Many languages use the definite article for generalizations, so learners transfer this pattern.'
  l1_groups:
  - Spanish ("Me encanta la música" → literal transfer)
  - French ("J''aime la musique" → direct translation)
  - Portuguese ("Eu amo a música" → article transfer)
  - Greek (uses definite article for general statements)
  - Arabic (uses definite article الـ for generalizations)
  reliability: B
  source: Swan Entry 140.1. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I need information. / She gave me advice. Use "a piece of advice" for singular count.
  error: 'Using ''a/an'' with uncountable nouns: *''I need an information.'' / *''She gave me an advice.'''
  explanation: 'Swan PEU: Some nouns that are countable in other languages are uncountable in English. "Information" and "advice"
    are uncountable — they cannot take a/an. Swan PEU: a/an is only for singular countable nouns. Teach the "a piece of" construction
    for making uncountables countable: "a piece of advice", "a piece of information". Also: never use a/an with "weather"
    or "English".'
  l1_groups:
  - Spanish ("información" is countable in Spanish)
  - French ("conseil" is countable)
  - Portuguese ("uma informação" is natural in Portuguese)
  - German ("eine Information" is acceptable)
  reliability: B
  source: Swan Entries 137.1, 138.2. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: Yesterday I saw a man in the park.
  error: 'Using ''the'' for first mention: *''Yesterday I saw the man in the park.'' (first mention, unknown person)'
  explanation: Use a/an when introducing a noun for the first time and the listener does not yet know which specific one.
    Switch to "the" on second mention. Learners who default to "the" for all references sound as if they are referring to
    someone the listener already knows, which can be confusing in narratives.'
  flagged: true
  l1_groups:
  - Arabic (uses definite article more broadly)
  - Hindi (context determines definiteness; no article system)
  - Thai (no article system; definiteness inferred from context)
  reliability: D
description: 'Words that come before nouns to define them as specific or general: a, an, the, or no article (zero article).
  Essential for noun phrase clarity.'
dialectal_variation:
- note: 'BrE uses zero article with institutional nouns where AmE uses "the": "in hospital" (BrE) vs "in the hospital" (AmE);
    "at university" (BrE) vs "at the university" (AmE); "in prison" (BrE, as a prisoner) vs "in the prison" (AmE or BrE, as
    a visitor).'
- note: BrE says "at the weekend" while AmE says "on the weekend." Both are standard in their respective varieties.
- note: 'In some Irish and Northern English dialects, "the" is used with body parts and family members: "the leg" (my leg),
    "the mother" (my mother). This is non-standard but regionally systematic.'
discourse_notes:
- note: The a/an → the shift is one of the most important cohesion devices in English discourse. First mention introduces
    a referent with a/an ("A woman walked into the bar"), and subsequent mentions use the ("The woman ordered a drink"). This
    pattern structures narratives, news reports, and academic writing alike.
- note: '''The" signals shared knowledge between speaker and listener. "Did you lock the door?" presupposes both speakers
    know which door. "Did you lock a door?" would imply any door, which changes the meaning entirely. This pragmatic function
    of "the" is essential for natural conversation.'
- note: 'Zero article with plural and uncountable nouns creates generic reference, which is the default for proverbs, scientific
    statements, and general truths: "Water boils at 100°C," "Birds fly," "Honesty is the best policy." Using "the" in these
    sentences would change the meaning to specific reference.'
form:
  affirmative:
    example_generator:
      contexts:
      - family and relationships
      - social interactions
      min_examples: 4
    structure: 'A + singular countable noun (consonant sound): "a book", "a university" (starts with "y" sound). An + singular
      countable noun (vowel sound): "an apple", "an hour" (silent "h"). The + singular/plural/uncountable noun (specific):
      "the book", "the books", "the water". Zero article + plural/uncountable noun (general): "books are expensive", "water
      is wet".'
  negative:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Articles themselves don''t have negative forms; negation applies to the verb: "I don''t have a dog" (not "I
      have no a dog").'
  questions:
    example_generator:
      contexts:
      - entertainment and media
      - shopping and commerce
      min_examples: 4
    structure: 'Articles stay in same position in questions: "Is there a book?" "Did you see the movie?"'
grammar_point: a_an_the
level: A1
meaning:
  ccqs:
  - answer: No, it was the first mention — any dog, not a specific one.
    purpose: Tests understanding that a/an = first mention, not specific
    question: I saw a dog in the park. Was it a specific dog that both the speaker and listener already knew about?
  - answer: Because the car has already been mentioned — now it is specific and known to both speaker and listener.
    purpose: Tests understanding that the = specific/known reference
    question: I bought a car. The car is red. Why do we use "the" in the second sentence?
  - answer: Because we are talking about water in general (all water), not a specific amount. Uncountable nouns use zero article
      for general statements.
    purpose: Tests understanding of zero article for general uncountable nouns
    question: '"Water is essential." Why is there no article before "water"?'
  - answer: A specific one. Using "the" before hospital signals that both the speaker and listener know which hospital is
      meant. For a general reference with no specific hospital in mind, we would say "I went to a hospital."
    purpose: Tests understanding that the definite article signals shared knowledge between speaker and listener, not just
      any member of a category. This pragmatic dimension is often overlooked by learners who treat the as simply a marker
      of specific reference.
    question: If someone says "I went to the hospital," does this imply a specific hospital or any hospital in general?
  contrast: 'A/AN = First mention or any single item: "I bought a car." (any car). THE = Specific, previously mentioned, or
    unique: "The car I bought is red." (that specific car). ZERO = General plural/uncountable: "Cars are expensive." (cars
    in general).'
  core_meaning: Articles signal whether a noun is specific (known to both speaker and listener) or general (any member of
    a class).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Articles are not tense-based; they describe noun specificity, not time.)
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Many L1 speakers (e.g., Spanish, Arabic, Mandarin) pronounce a as /eɪ/ or /a/ with full vowel quality instead
    of the weak schwa /ə/. This sounds unnatural in connected speech. An /ən/ is similarly over-pronounced as /æn/.
  note: The schwa sound /ə/ for a and an
  practice: Drill a book as /ə bʊk/ and an apple as /ən æpəl/ with reduced, unstressed articles.
- example_generator:
    contexts:
    - connected speech
  l1_issue: L1 speakers whose languages lack the voiced dental fricative /ð/ (e.g., French, German, Japanese, Korean) often
    substitute /d/, /z/, or a dental stop.
  note: 'The has two pronunciations: /ðə/ (before consonant sounds) and /ðiː/ (before vowel sounds or for emphasis)'
  practice: Contrast the book /ðə bʊk/ vs the apple /ðiː æpəl/. Have students practise tongue placement between teeth.
register_notes:
- note: 'Articles are omitted in headline English and note-taking: "Prime Minister Visits Hospital" / "Go to store, buy milk."
    This telegraphic style is specific to headlines, titles, instructions, and informal notes — not standard prose.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic and formal writing, article usage becomes more complex with abstract nouns. Compare: "The study of history"
    (specific field) vs "History teaches us" (general, zero article). Learners need explicit instruction on this distinction.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'The indefinite article carries an implicit "one" meaning, which affects register. In formal contexts, "a" can sound
    imprecise: "The patient experienced a pain" (clinical) vs "The patient experienced pain" (more natural).'
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (2021) — Article distribution varies by register. Academic prose has highest definite article frequency;
    conversation has highest indefinite article frequency. Generic reference patterns differ across registers. Ch. 4.4.1.6
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 4.4.1.6
