  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 10: Determiners-10.5'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 15: Articles-15.5'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 5: Nouns and Noun Phrases-5.7'
