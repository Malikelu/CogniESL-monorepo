citations:
- claim: 'Core meaning: Continuous forms can soften statements, making them less direct
    and more polite. The past continuous (I was wondering) creates social distance,
    which increases politeness.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7:
    The Tense-Aspect System (past tense remoteness = social distance)'
  tier: 1
- claim: 'Register distribution: Polite continuous forms (I was wondering, I was hoping)
    are standard in formal/professional communication, especially in emails. Direct
    forms (I want, I need) are appropriate in informal contexts but can sound
    demanding in formal ones.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7:
    The Tense-Aspect System'
  tier: 1
- claim: Common error '*I want to ask you something.* (direct)' for Portuguese, Spanish,
    Japanese speakers
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 6: Politeness'
  tier: 1
common_errors:
- correction: I was wondering if I could ask you something. / I was hoping you could
    help me.
  error: 'I want to ask you something. (grammatically correct but pragmatically direct;
    may sound blunt in formal contexts)'
  explanation: Continuous forms (was wondering, was hoping) soften requests and make
    them more polite. Direct forms (I want, I need) can sound demanding to English
    ears, especially in formal or professional contexts. The continuous form is not
    grammatically required but is pragmatically preferred.
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  - Korean
  reliability: D
description: 'Using continuous forms to make statements more polite and less direct:
  I was wondering, I am hoping, I am looking forward to.'
dialectal_variation: []
discourse_notes:
- 'The past continuous for politeness (I was wondering, I was hoping) leverages the
  remoteness meaning of past tense to create social distance. This is distinct from
  the temporal use of past tense. Source: Celce-Murcia & Larsen-Freeman (2015) GB3
  Ch. 7: The Tense-Aspect System, §7.2.'
form:
  affirmative:
    example_generator:
      contexts:
      - polite requests
      - expressing hopes
      - tentative suggestions
      min_examples: 4
    structure: 'Subject + be (present or past) + verb-ing + complement: ''I was wondering
      if you could help.'' / ''I am hoping to hear from you soon.'' / ''We were wondering
      whether you might be free.'''
  negative:
    example_generator:
      contexts:
      - negative politeness
      - softening disagreement
      - managing expectations
      min_examples: 3
    structure: 'Subject + be + not + verb-ing: ''I am not expecting a reply immediately.''
      / ''I was not suggesting that you were wrong.'' / ''We are not looking to change
      the arrangement.'''
  questions:
    example_generator:
      contexts:
      - polite enquiries
      - offering help
      - checking intentions
      min_examples: 3
    structure: 'Was/Were + subject + verb-ing + complement: ''Were you looking for
      something?'' / ''Was there anything you needed?'' / ''Were you hoping to speak
      to me?'''
grammar_point: politeness_continuous
level: B2
meaning:
  ccqs:
  - answer: Indirect — they are being polite.
    purpose: Tests whether the learner knows that English uses continuous forms (I
      was wondering, I was hoping) to make requests more polite and less direct.
    question: Is this speaker being direct or indirect?
  - answer: Yes — it sounds less demanding and more tentative.
    purpose: Tests understanding of politeness_continuous.
    question: Does the continuous form make the request softer?
  - answer: More polite — the past continuous creates more distance.
    purpose: Tests whether the learner knows that past continuous (I was wondering)
      creates more politeness than present continuous (I wonder) through greater social
      distance.
    question: Is 'I was wondering' more or less polite than 'I wonder'?
  - answer: "I was wondering if you could possibly help me with this report. The combination of past continuous (was wondering) + modal (could) + adverb (possibly) creates maximum politeness through layered indirectness."
    purpose: Tests whether the learner can construct a highly polite request by
      combining past continuous with modal verbs and softening adverbs.
    question: Which is more polite -- 'Can you help me?' or 'I was wondering if you
      could possibly help me with this report'? Why?
  contrast: Direct = 'I want to ask you something.' vs Polite continuous = 'I was
    wondering if I could ask you something.' / Direct = 'Can you help me?' vs Polite
    = 'I was wondering if you could help me.'
  core_meaning: Continuous forms can soften statements, making them less direct and
    more polite. The continuous aspect creates a sense of tentativeness or ongoing
    process, which sounds less demanding and more considerate of the listener.
  example_generator:
    contexts:
    - making requests
    - expressing hopes
    - softening statements
    - formal communication
    - email writing
    cultural_notes:
    - Essential for polite communication in English — directness can sound rude in
      many contexts
    - Some L1 speakers are too direct, sounding blunt or demanding to English ears
    - British English tends to use more indirect/polite forms than American English
    - In emails, polite continuous forms are the standard for requests
    min_examples: 5
  timeline: Present — the politeness applies to the current interaction. Past continuous
    forms (I was wondering) add even more distance and therefore more politeness.
phonetics:
- example_generator:
    contexts:
    - intonation patterns
  l1_issue: Speakers whose L1 does not use continuous forms for politeness may sound
    too direct or blunt. The intonation pattern (softer, more tentative) is as important
    as the grammar.
  note: Polite continuous forms are typically spoken with softer, lower intonation
    than direct statements. The overall tone should sound tentative, not demanding.
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may over-pronounce 'was' as /wɒz/, making the phrase sound less
    natural and more emphatic than intended.
  note: 'In ''I was wondering'', the ''was'' is often reduced to /wəz/ in connected
    speech: /aɪ wəz wʌndərɪŋ/.'
register_notes:
- note: 'Biber et al. (1999) — Progressive for politeness (''I was hoping...'', ''I
    was wondering...''): more common in conversation than academic prose. Past continuous
    softens requests. Ch. 6.3'
  reliability: B
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.3
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch.
    6: Politeness'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7:
    The Tense-Aspect System (past tense remoteness = social distance)'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Ch. 3: The Verb'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners.
    Ch. 3: Politeness'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(politeness:
