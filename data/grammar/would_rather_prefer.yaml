grammar_point: would_rather_prefer
title: Would Rather and Would Prefer (Preferences)
description: Expressing preferences using 'would rather' (followed by base verb) and
  'would prefer' (followed by to + verb or -ing) for present/future choices.
level: B1
meaning:
  core_meaning: Express personal preferences for one option over another in present/future
    situations.
  timeline: 'Present/Future: Refers to current or future preferences (not past).'
  contrast: 'Would Rather: followed by base verb: "I''d rather go."

    Would Prefer: followed by to + verb/-ing: "I''d prefer to go." / "I''d prefer
    going."

    '
  ccqs:
  - question: 'Which is more informal: ''I would rather go'' or ''I would prefer to
      go''?'
    answer: '''I would rather go'' is more informal. ''I would prefer to go'' is more
      formal and polite.'
    purpose: Tests whether the learner understands the register difference between
      'would rather' (informal) and 'would prefer' (formal/polite).
  - question: 'Which is more informal: ''I would rather go'' or ''I would prefer to
      go''?'
    answer: '''I would rather go'' is more informal. ''I would prefer to go'' is more
      formal and polite.'
    purpose: 'Tests whether the learner knows the key structural difference: ''would
      rather'' takes the base verb without ''to'', while ''would prefer'' takes ''to
      + verb''.'
  - question: Can we say 'I would rather to go'?
    answer: No — 'would rather' is followed by the base verb WITHOUT to. 'I would
      rather go' NOT 'I would rather to go.'
    purpose: Tests whether the learner can identify the redundancy error of combining
      'would rather' and 'would prefer' in the same sentence.
  - question: Is *'I would rather prefer tea' correct?
    answer: 'No — ''would rather'' and ''would prefer'' mean the same thing. Use one
      or the other, not both: ''I would rather have tea'' OR ''I would prefer tea''.'
    purpose: Tests whether the learner knows that 'would rather' takes the bare infinitive
      without 'to' (following the same pattern as other modal expressions).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
form:
  affirmative:
    structure: 'Would Rather: Subject + would rather + Base Verb: "I would rather
      stay home than go out."

      Would Prefer: Subject + would prefer + to + Verb (or -ing): "I would prefer
      to stay home." / "I would prefer staying home."

      Contraction: ''d rather / ''d prefer (I''d rather, She''d prefer)

      '
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
  negative:
    structure: 'Would Rather: Subject + would rather + not + Base Verb: "I would rather
      not go."

      Would Prefer: Subject + would prefer + not + to + Verb: "I would prefer not
      to go."

      '
    example_generator:
      contexts:
      - work and professional life
      - food and daily routines
      min_examples: 4
  questions:
    structure: 'Would Rather: Would + Subject + rather + Base Verb: "Would you rather
      stay or go?"

      Would Prefer: Would + Subject + prefer + to + Verb: "Would you prefer to stay
      or go?"

      '
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
sub_rules:
- rule: Would rather is more informal than would prefer
  type: register
  examples:
  - I would rather go (informal)
  - I would prefer to go (formal)
  - She would rather stay (informal)
  - She would prefer to stay (formal)
- rule: Would rather + base verb (without to)
  type: grammatical
  examples:
  - I would rather go
  - She would rather stay
  - They would rather wait
- rule: Would prefer + to + base verb
  type: grammatical
  examples:
  - I would prefer to go
  - She would prefer to stay
  - They would prefer to wait
use:
- name: Present/Future Preferences
  description: Express what you want to do now or in the future.
  examples:
  - I'd rather drink coffee than tea.
  - She'd prefer to go to the beach.
  key_point: Both refer to present/future, not past.
- name: Choice Between Two Options
  description: 'Use ''than'' after would rather, ''to'' after would prefer: ''I''d
    rather A than B'' / ''I''d prefer A to B''.'
  examples:
  - I'd rather read than watch TV.
  - I'd prefer reading to watching TV.
  key_point: Than (would rather) vs To (would prefer) for comparisons.
- name: Polite Preferences
  description: Soften requests or preferences in social situations.
  examples:
  - I'd rather not discuss this now.
  - We'd prefer to sit inside, please.
  key_point: More polite than 'I want' or 'I like'.
phonetics:
- note: 'Would rather is often contracted: ''I''d rather'' /aɪd ˈrɑːðə/. Would prefer
    is contracted: ''I''d prefer'' /aɪd prɪˈfɜː/.'
  example_generator:
    contexts:
    - would rather prefer contraction
  l1_issue: Learners may confuse would rather and would prefer. Teach that rather
    takes the base verb (no to) while prefer takes to + verb.
teaching:
  methodology: PPP
  tips:
  - 'Week 1: Would rather + base verb (I''d rather stay).'
  - 'Week 2: Would prefer + to + verb/-ing (I''d prefer to stay).'
  - 'Week 3: Comparisons (than vs to) and polite use.'
  - 'Use role-play: Students order food using ''I''d rather'' and ''I''d prefer''.'
  - 'Swan PEU: ''Would rather'' vs ''would prefer'' — ''I''''d rather swim than run.''
    ''I''''d prefer to swim.'' ''Would rather'' takes bare infinitive; ''would prefer''
    takes to-infinitive or noun. Slight difference in structure.'
  recommended_activities:
  - name: Formal or Informal
    duration: 10
    adaptation_notes: 'Students rewrite sentences changing the level of formality:
      ''I would rather go'' (informal) → ''I would prefer to go'' (formal).'
  - name: Preference Practice
    duration: 15
    adaptation_notes: 'Students practice expressing preferences: ''Would you rather
      stay in or go out?'' ''I would rather stay in.'''
sources:
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8:
    Modal Auxiliaries and Related Phrasal Forms'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
common_errors:
- error: '*I would rather to go.*'
  correction: I would rather go.
  explanation: '"Would rather" takes the bare infinitive (no "to").'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
  flagged: true
- error: '*I would prefer to don''t go.*'
  correction: I would prefer not to go.
  explanation: '"Would prefer" + "not to" + verb. Not "to don''t".'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
  flagged: true
- error: '*I would rather prefer tea.*'
  correction: I would rather have tea. / I would prefer tea.
  explanation: '"Would rather" and "would prefer" mean the same thing. Use one or
    the other, not both.'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
  flagged: true
register_notes:
- note: 'Biber et al. (2021) — ''Would rather/prefer'' patterns: more common in conversation
    for polite expression of preference. Academic prose uses more explicit and impersonal
    structures. Ch. 6.6'
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.6
  reliability: C
dialectal_variation:
- note: Both 'would rather' and 'would prefer' are used in BrE and AmE. 'Would prefer'
    is more common in formal/polite contexts in both dialects. Some learners over-use
    'would prefer' in casual speech, sounding overly formal.
discourse_notes: []
citations:
- claim: 'Core meaning: Express personal preferences for one option over another in
    present/future situations'
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal
    Auxiliaries and Related Phrasal Forms'
  tier: 1
  reliability: B
- claim: 'Register distribution: "Would rather" is more informal; "would prefer" is
    more formal and polite'
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal
    Auxiliaries and Related Phrasal Forms'
  tier: 1
  reliability: B
- claim: 'Discourse function: Expressing preferences in social situations, softening
    requests and choices'
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal
    Auxiliaries and Related Phrasal Forms'
  tier: 1
  reliability: B
- claim: Common error '*I would rather to go.*' for Portuguese, Spanish, French speakers
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  tier: 1
  reliability: B
- flagged: false
  reliability: B
  claim: Swan & Smith (2001) document L1-specific transfer patterns in modal and preference
