common_errors:
- correction: If it rains, I will stay home.
  error: 'Using ''will'' in the if-clause: *''If it will rain, I will stay home.'''
  explanation: In first conditional, the if-clause uses present simple, not will.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If it rains, I will stay home.
  error: 'Using ''would'' in first conditional: *''If it would rain, I would stay home.'''
  explanation: 'Swan PEU: "Would" in the if-clause is non-standard. Use present simple in the if-clause of first conditional.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan Entry 37. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: 'Structure used to talk about real, possible future situations and their consequences: If + present simple, will
  + base verb.'
dialectal_variation:
- note: 'In some dialects, ''shall'' may replace ''will'' in first person: ''If I study, I shall pass.'' (formal BrE)'
- note: 'In informal speech, ''will'' is often contracted to ''ll: ''If it rains, I''ll stay home.'''
discourse_notes:
- note: 'First conditional is used for making promises and threats: ''If you study hard, you will pass.'' (promise) ''If you
    don''t leave, I will call the police.'' (threat)'
- note: 'First conditional is used for giving warnings: ''If you don''t wear sunscreen, you will get burned.'''
- note: 'First conditional is used for making offers: ''If you''re tired, I''ll drive.'''
- note: 'In academic writing, first conditional creates hypothetical scenarios for discussion: ''If we accept this premise,
    then...'''
form:
  affirmative:
    example_generator:
    - If it rains, I will stay home.
    - If you study, you will pass.
    - If we finish early, we will go to the park.
    min_examples: 4
    structure: If + present simple, will + base verb
  negative:
    example_generator:
    - If it doesn't rain, I won't stay home.
    - If you don't study, you won't pass.
    - If she doesn't hurry, she won't catch the bus.
    min_examples: 4
    structure: If + don't/doesn't + present simple, won't + base verb
  questions:
    example_generator:
    - Will you stay home if it rains?
    - Will she pass if she studies?
    - Will they come if we invite them?
    min_examples: 4
    structure: Will + subject + base verb if + present simple?
grammar_point: first_conditional
level: B1
meaning:
  ccqs:
  - answer: Possible — first conditional is for real, possible future situations.
    purpose: Tests whether the learner can distinguish between real future possibilities (first conditional) and hypothetical/unlikely
      situations (second conditional). This is the most important distinction between the two.
    question: Is this situation possible in the future, or is it hypothetical?
  - answer: No — the if-clause always uses present simple. Never 'will' in the if-clause.
    purpose: Tests whether the learner knows the structural rule that 'will' never appears in the if-clause. This is one of
      the most common structural errors at B1 level.
    question: Do we use 'will' in the if-clause?
  - answer: It could be a promise or encouragement. General truths use zero conditional.
    purpose: Tests whether the learner can distinguish between first conditional (specific future situation) and zero conditional
      (general truth). Both use present simple in the if-clause, but the main clause differs (will vs present simple).
    question: Is this a promise, warning, or general truth?
  - answer: Not directly — 'unless' means 'if...not.' So 'Unless you study, you will fail' = 'If you do not study, you will
      fail.' Replacing 'unless' with 'if' without adding 'not' would reverse the meaning. 'Unless' is a negative conditional
      conjunction unique to first conditional structures.
    purpose: Tests whether the learner understands that 'unless' is equivalent to 'if...not' in first conditional sentences
      and cannot be substituted with 'if' alone. This is important because 'unless' is frequently confused with 'if,' leading
      to reversed meanings. The distinction between 'unless' (negative condition) and 'if' (neutral condition) is essential
      for accurate communication of consequences.
    question: '"Unless you study, you will fail." Can we replace "unless" with "if"?'
  contrast: '''First Conditional'' = ''If I study, I will pass.'' (real, possible future) vs ''Second Conditional'' = ''If
    I studied, I would pass.'' (hypothetical, unlikely)'
  core_meaning: Expresses real, possible future situations and their likely results. The condition is possible — it might
    happen. The main clause shows what will happen IF the condition is met.
  example_generator:
    contexts:
    - future plans and predictions
    - promises and warnings
    - instructions
    - consequences
    cultural_notes:
    - Use diverse scenarios (workplace, school, travel, daily life)
    - Avoid examples with alcohol, gambling, or illegal activities
    - Include both positive and negative conditions
    min_examples: 5
  timeline: Future time frame. The if-clause uses present simple (not future), and the main clause uses will + base verb.
phonetics:
- example_generator:
  - if /ɪf/
  - if you /ɪf juː/
  l1_issue: Spanish speakers may use 'will' in the if-clause. Chinese speakers may omit 'if' entirely. Drill the correct structure
    explicitly.
  note: 'Weak form of ''if'' in connected speech: /ɪf/ or even /ə/. ''If you study'' sounds like /ɪf juː stʌdi/.'
- example_generator:
  - I'll /aɪl/
  - you'll /juːl/
  - he'll /hiːl/
  l1_issue: Many L1 speakers over-pronounce 'will' as /wɪl/. Teach the contracted forms for natural speech.
  note: 'Contraction of ''will'': I will → I''ll /aɪl/, you will → you''ll /juːl/, he will → he''ll /hiːl/. Full forms sound
    overly formal.'
register_notes:
- note: 'In formal writing, first conditional is used for predictions and hypotheses: ''If the temperature rises, the ice
    will melt.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, first conditional is common for making offers and suggestions: ''If you''re hungry, I''ll make dinner.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, first conditional is used for research hypotheses: ''If the intervention is effective, scores
    will improve.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, first conditional is used for real future possibilities: ''If it rains, we''ll stay home.'''
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, first conditional appears in discussions of likely outcomes.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In negotiations and planning, first conditional sets conditions: ''If you can deliver by Friday, we''ll accept.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — First conditional (real future) patterns: frequency varies by register. Common in conversation
    and planning discourse. Formal alternatives (should, were to) are rare and literary. Ch. 10.2.8.12'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.8.12
