sub_rules:
- examples:
  - If it rains, I will stay. (correct)
  - If it will rain, I will stay. (incorrect)
  rule: No 'will' in the if-clause — always present simple
  type: grammatical
- examples:
  - If it rains, I will stay home. (comma)
  - I will stay home if it rains. (no comma)
  rule: 'Comma rule: when if-clause comes first, use a comma. When it comes second, no comma.'
  type: punctuation
- examples:
  - If you don't study, you will fail.
  - Unless you study, you will fail.
  rule: Unless = if not
  type: grammatical
- examples:
  - If it rains, we can stay inside.
  - If you study, you should pass.
  - If she asks, I might help.
  rule: Other modals can replace 'will' in the main clause
  type: grammatical
- examples:
  - If the alarm goes off, press the red button.
  - If you get lost, call me.
  - If it hurts, stop.
  rule: Imperative in the main clause for instructions and warnings
  type: grammatical
teaching:
  methodology: Structured input-to-output progression
  recommended_activities:
  - adaptation_notes: 'Students build a chain: ''If I study, I will pass.'' Next student: ''If I pass, I will celebrate.''
      Continues around the class. Practices the structure in a fun, memorable way.'
    duration: 10
    name: Chain Conditionals
  - adaptation_notes: 'Students draw scenario cards and create promises or warnings: ''If you help me with my homework, I
      will buy you lunch.'' ''If you don''t wear a coat, you will get cold.'''
    duration: 15
    name: Promise and Warning Cards
  - adaptation_notes: 'Students write 5 first conditional sentences about their own plans: ''If I get a good job, I will buy
      a car.'' ''If it rains tomorrow, I will stay home.'' Pair work for lower levels.'
    duration: 10
    name: Real-Life First Conditional
  - adaptation_notes: 'Teacher asks questions: ''What will you do if it rains tomorrow?'' Students answer with first conditional.
      Practices question form.'
    duration: 15
    name: What Will You Do If...?
  tips:
  - Start with affirmative first conditional. Master this before introducing negative and question forms.
  - Emphasize the 'no will in the if-clause' rule through error correction. This is the most common mistake.
  - 'Use future plan scenarios: ''If I get a raise, I will buy a gift.'' Makes the grammar personal and meaningful.'
  - 'Contrast with second conditional: ''If I study, I will pass'' (possible) vs ''If I studied, I would pass'' (unlikely).'
  - 'Practice with promises and warnings: ''If you help me, I will help you.'' ''If you don''t study, you will fail.'''
  - 'Swan PEU: Zero conditional (if + present + present) = general truths. First conditional (if + present + will) = real
    future possibility.'
  - 'Swan PEU: In if-clauses and time clauses (when, until, before, after), use present tenses NOT will for future reference.'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'FUTURE CONDITIONAL WITH WEAKENED FORMS: Standard first conditional: ''If it rains, I''ll stay home.'' Weakened if-clause
    with ''should'': ''If it SHOULD rain, I''ll stay home'' (lower probability). Weakened with ''happen to'': ''If it HAPPENS
    to rain'' (even more tentative). These are useful hedging strategies. Source: Ch.27 p.420-422.'
title: First Conditional (Real Future)
use:
- context: Real future plans
  description: Talking about possible future actions and their results
  examples:
  - If I save money, I will buy a car.
  - If we finish early, we will go to the park.
  - If she gets the job, she will move to London.
- context: Promises and warnings
  description: Making promises or giving warnings based on conditions
  examples:
  - If you help me, I will pay you back.
  - If you touch that, you will get hurt.
  - If you don't hurry, you will miss the bus.
- context: Instructions
  description: Giving instructions for future situations
  examples:
  - If the alarm goes off, press the red button.
  - If you get lost, call me.
  - If the light is red, stop.
