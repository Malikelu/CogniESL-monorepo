      min_examples: 4
    structure: Will + subject + definitely/probably + base verb?
grammar_point: definitely_probably
level: B1
meaning:
  ccqs:
  - answer: No — "definitely" means 100% certainty, no doubt at all.
    purpose: Tests whether the learner understands that 'definitely' expresses absolute certainty (100%) on the probability
      scale. It is the strongest certainty adverb, eliminating all doubt.
    question: '"She will definitely pass the exam." Does this mean there is some doubt?'
  - answer: More certain — "probably" (70-80%) is stronger than "might" (30-50%).
    purpose: 'Tests whether the learner can rank certainty adverbs on a probability scale: definitely (100%) > probably (70-80%)
      > possibly (30-50%) > might (30-50%). Choosing the correct adverb reflects the speaker''s degree of certainty.'
    question: '"It will probably rain" — is this more or less certain than "It might rain"?'
  - answer: Both — "She is definitely at home" (present) and "She will definitely come" (future).
    purpose: Tests whether the learner understands that 'definitely' can modify both present and future statements. It expresses
      certainty regardless of time reference.
    question: Can you use "definitely" to talk about the present, or only the future?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with definitely probably. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: 'Definitely = 100% sure: "I will definitely come" (no doubt)

    Probably = 70-80% sure: "I will probably come" (very likely)

    Possibly = 30-50% sure: "I might possibly come" (maybe)

    '
  core_meaning: Definitely = 100% certainty; probably = 70-80% probability that something will happen.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Refers to future events; can also refer to present certainty.
phonetics:
- example_generator:
    contexts:
    - adverb reduction
  l1_issue: Learners may over-pronounce every syllable, sounding unnatural. Teach the reduced forms.
  note: Definitely is pronounced /ˈdefɪnətli/ with stress on the first syllable. Probably is /ˈprɒbəbli/ and is often reduced
    to /ˈprɒbli/.
register_notes:
- note: 'Biber et al. (2021) — Stance adverbs for certainty (''definitely'', ''probably''): conversation uses more certainty
    adverbs for emphasis; academic prose uses more hedged/mitigated certainty expressions. Ch. 12.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 12.5
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25: Adverbs-14.8'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - She will definitely pass the exam
  - It will definitely rain tomorrow
  - He is definitely coming to the party
  rule: Definitely expresses 95-100% certainty — the speaker has no doubt
  type: semantic
- examples:
  - She will probably pass the exam
  - It will probably rain tomorrow
  - He is probably coming to the party
  rule: Probably expresses 70-90% certainty — the speaker thinks it is likely but is not sure
  type: semantic
- examples:
  - She will definitely come (before main verb)
  - She is definitely coming (after be)
  - She has definitely come (after auxiliary)
  rule: 'Position: these adverbs go before the main verb but be and after the first auxiliary'
  type: word_order
teaching:
  methodology: Use a communicative approach with real-life contexts (weather forecasts, promises, predictions). Begin with
    a contextualised presentation using a short dialogue or video clip, then move to controlled drills (sentence completion)
    and freer practice (role-plays and surveys). Emphasise the probability scale as a visual scaffold throughout.
  recommended_activities:
  - adaptation_notes: 'Draw a line from 0% to 100%. Students place expressions: definitely (95%), probably (70%), maybe (50%),
      probably not (30%), definitely not (5%).'
    duration: 10
    name: Probability Line
  - adaptation_notes: Students make predictions about the weekend, next year, or classmates using definitely and probably.
    duration: 15
    name: Prediction Game
  tips:
  - Use probability scales (0-100%) to contrast definitely (100), probably (70-80), possibly (30-50).
  - 'Role-play: Student makes promises using ''definitely''.'
  - 'Practice weather predictions: ''It will probably rain''.'
  - Contrast with 'might' and 'could' for lower probability.
  - 'Swan PEU: Probability adverbs — definitely/certainly (100%), probably (80%), possibly/maybe/perhaps (50%), unlikely (20-30%).
    More precise than modals alone. In writing, ''probably'' and ''possibly'' are preferred over spoken ''maybe.'''
title: Definitely / Probably (certainty, probability)
use:
- description: Make promises or state absolute certainty.
  examples:
  - I will definitely finish the work by Friday.
  - She will definitely get the job.
  key_point: No doubt; 100% sure.
  name: Certain Promises (Definitely)
- description: State something is very likely to happen.
  examples:
  - It will probably take 2 hours to get there.
  - We will probably see higher prices.
  key_point: 70-80% chance; very likely.
  name: High Probability (Probably)
- description: Express certainty about present situations.
  examples:
  - She is definitely at home now.
  - This is probably the best option.
  key_point: Based on current knowledge.
  name: Present Certainty
