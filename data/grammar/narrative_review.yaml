sub_rules:
- examples:
  - It was raining and the wind was howling.
  - The sun was shining and birds were singing.
  - People were chatting quietly in the background.
  rule: Past continuous for scene-setting
  type: discourse
- examples:
  - She walked in, sat down, and opened her laptop.
  - He grabbed his coat and ran out of the door.
  - The car swerved, hit a lamp post, and came to a stop.
  rule: Past simple for the main sequence of events
  type: discourse
- examples:
  - She had never seen him before that day.
  - They had been planning the trip for months.
  - He realised he had left his keys at home.
  rule: Past perfect for flashbacks and earlier events
  type: grammatical
- examples:
  - When I arrived, the meeting had already started.
  - While she was cooking, the phone rang.
  - After he had finished his homework, he went out to play.
  rule: Time clauses with 'when', 'while', 'before', 'after'
  type: grammatical
- examples:
  - I was walking home when suddenly I heard a scream. Someone had broken into the
    house next door.
  - She opened the letter. Her hands were trembling. She had been dreading this moment
    for weeks.
  rule: Mixing tenses for dramatic effect
  type: discourse
teaching:
  methodology: PPP (Presentation, Practice, Production)
  recommended_activities:
  - adaptation_notes: Give students 8-10 sentences from a story, each using a different
      past tense. Students arrange them on a timeline and then retell the story in
      the correct order, explaining why each tense is used.
    duration: 20
    name: Timeline story
  - adaptation_notes: Provide students with a set of facts about an event (some background,
      some main events). Students write a short news report using past simple, past
      continuous, and past perfect appropriately.
    duration: 25
    name: News report writing
  - adaptation_notes: In pairs, one student is a police officer and the other is a
      witness. The 'witness' describes what happened using all three past tenses.
      The 'officer' asks follow-up questions. Swap roles.
    duration: 15
    name: Witness interview
  - adaptation_notes: Give students a simple three-sentence story in the past simple.
      They must expand it by adding background (past continuous) and earlier events
      (past perfect) to make it more vivid and detailed.
    duration: 15
    name: Story expansion
  tips:
  - Start with a short story told entirely in the past simple. Then retell it, adding
    past continuous for scene-setting and past perfect for earlier events. Ask students
    which version sounds more vivid.
  - Use a timeline diagram on the board to show the relationship between the three
    past tenses. Draw arrows to show which events came first.
  - Give students a jumbled set of sentences and ask them to put them in order, identifying
    which tense each one uses and why.
  - Use film clips or short stories as listening/reading material. Students identify
    and categorise the past tenses used.
  - Practice with 'when', 'while', 'before', and 'after' to show how these conjunctions
    determine tense choice.
  - 'Swan narrative toolkit: past simple (events), past continuous (background), past
    perfect (flashback), ''would/used to'' (habits), historic present (vividness).
    Mix of tenses creates rich narrative texture.'
title: Narrative Review (Using Past Simple, Past Continuous, and Past Perfect Together)
use:
- context: Personal storytelling and anecdotes
  description: When telling stories about personal experiences, speakers naturally
    combine past tenses to create a vivid, layered account.
  examples:
  - I was walking to work when I saw this man. He had lost his dog and was asking
    everyone if they'd seen it. I helped him look for about twenty minutes. Eventually
    we found it hiding under a car.
  - We were having dinner when the power went out. The storm had been getting worse
    all evening, but we didn't expect it to be that bad.
- context: News reports and journalism
  description: News reports frequently use the past perfect to provide background
    context before describing the main events in the past simple.
  examples:
  - A 45-year-old man has been arrested in connection with the robbery. Police said
    the suspect had been living in the area for several months. The robbery took place
    at around 3pm yesterday.
  - The building had been evacuated before the fire spread to the upper floors. Firefighters
    arrived within ten minutes.
- context: Witness statements and police interviews
  description: Witnesses use narrative tenses to describe what they saw, what was
    happening, and what had already occurred.
  examples:
  - I was standing at the bus stop when I heard a loud bang. A car had crashed into
    the lamp post. The driver wasn't moving, so I called 999.
  - I saw two men running down the street. They had just come out of the shop. One
    of them was carrying a bag.
- context: Creative writing and fiction
  description: Fiction writers use the full range of past tenses to create atmosphere,
    build suspense, and manage the timeline of their stories.
  examples:
  - The house had been empty for years. Now, as she pushed open the creaking door,
    dust was floating in the air and the floorboards groaned under her feet.
  - He had waited his whole life for this moment. Now it was here, and he couldn't
    believe it.
