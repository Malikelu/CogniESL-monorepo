description: Combining past simple, past continuous, and past perfect tenses to tell
  coherent stories with clear time relationships.
dialectal_variation: []
discourse_notes:
- note: Narrative tenses are the backbone of storytelling across all registers. Fiction
    writers, journalists, and everyday speakers all use the past simple/past continuous/past
    perfect system, though fiction makes the most varied use (including historic present
    for vividness).
- note: 'GB3 Ch. 7: In conversational narrative, speakers use past simple for main
    events, past continuous for scene-setting ("It was raining, the wind was howling"),
    and past perfect for flashbacks ("I had never seen anything like it"). The historic
    present ("So he walks up to me and says...") is a deliberate rhetorical choice
    for vividness, not a tense error.'
form:
  affirmative:
    example_generator:
      contexts:
      - storytelling
      - news reports
      - witness accounts
      min_examples: 4
    structure: 'Past simple (main events): Subject + past verb — ''She walked into
      the room.'' | Past continuous (background): Subject + was/were + -ing — ''It
      was raining heavily.'' | Past perfect (earlier events): Subject + had + past
      participle — ''He had left an hour earlier.'' These three are combined within
      a single narrative.'
  negative:
    example_generator:
      contexts:
      - describing what didn't happen
      - negative events in stories
      min_examples: 3
    structure: 'Past simple negative: Subject + didn''t + base verb — ''She didn''t
      see the sign.'' | Past continuous negative: Subject + wasn''t/weren''t + -ing
      — ''They weren''t listening.'' | Past perfect negative: Subject + hadn''t +
      past participle — ''He hadn''t noticed the mistake.'''
  questions:
    example_generator:
      contexts:
      - police interviews
      - asking about past events
      - clarifying timelines
      min_examples: 3
    structure: 'Past simple questions: Did + subject + base verb? — ''Did you hear
      the noise?'' | Past continuous questions: Was/Were + subject + -ing? — ''Were
      you sleeping at the time?'' | Past perfect questions: Had + subject + past participle?
      — ''Had she already left when you arrived?'''
grammar_point: narrative_review
level: B2
meaning:
  ccqs:
  - answer: Past simple — it moves the narrative forward event by event.
    purpose: Tests whether the learner understands a key concept of narrative_review.
      This is fundamental for correct use of this grammar point.
    question: Which tense do we use for the main events in a story?
  - answer: Past continuous — it provides background and atmosphere.
    purpose: Tests whether the learner understands a key concept of narrative_review.
      This is fundamental for correct use of this grammar point.
    question: Which tense sets the scene or describes what was already happening?
  - answer: Past perfect — it reaches back to an earlier time.
    purpose: Tests whether the learner understands a key concept of narrative_review.
      This is fundamental for correct use of this grammar point.
    question: Which tense shows something happened before the main story events?
  - answer: Yes, but it sounds flat. Using all three tenses adds depth, clarity, and
      dramatic effect.
    purpose: Tests whether the learner understands a key concept of narrative_review.
      This is fundamental for correct use of this grammar point.
    question: Can we tell a good story using only the past simple?
  contrast: 'Past simple only: "I arrived at the station. The train left. I missed
    it." (flat, no time depth)

    Narrative review: "I arrived at the station. The train had already left. I had
    been waiting for over an hour, and now I was going to be late." (rich, layered
    timeline)

    Without past perfect: "She opened the door. She saw the mess. Someone broke in."
    (unclear sequence)

    With past perfect: "She opened the door and saw the mess. Someone had broken in."
    (clear: the break-in happened before she arrived)

    '
  core_meaning: 'Narrative review refers to the coordinated use of past tenses — past
    simple, past continuous, and past perfect — to construct clear, well-structured
    narratives. Each tense plays a specific role: the past simple for main events,
    the past continuous for background actions and scene-setting, and the past perfect
    for events that happened before the main narrative timeframe.'
  example_generator:
    contexts:
    - personal anecdotes
    - news reports
    - witness statements
    - short stories
    - film summaries
    - accident descriptions
    cultural_notes:
    - All languages tell stories, but not all use three past tenses in this way. Speakers
      of languages without a past perfect equivalent (e.g., Mandarin) may struggle
      with the concept of 'past in the past'.
    - In spoken English, the past perfect is sometimes replaced by the past simple
      with 'already' or 'just', but in writing and formal speech, the past perfect
      is expected.
    min_examples: 5
  timeline: Past perfect (earliest events) → Past continuous (background/ongoing actions)
    → Past simple (main events in sequence). The past perfect pushes events further
    back, the past continuous sets the scene, and the past simple drives the story
    forward.
phonetics:
- example_generator:
    contexts:
    - natural storytelling
    - dramatic narration
  l1_issue: Learners whose languages have fewer past tense distinctions may overuse
    the past simple. Speakers of Slavic languages, which have aspectual rather than
    temporal distinctions, may find the English system of layered past tenses conceptually
    challenging.
  note: 'In spoken narratives, the past continuous often has a longer, more drawn-out
    delivery to create atmosphere: ''It was RAIning... the wind was HOWling...'' The
    past simple events are delivered more briskly to move the story forward.'
- example_generator:
    contexts:
    - connected speech
    - listening comprehension
  l1_issue: The contracted form 'd (had) can be confused with 'd (would) in speech.
    Context usually clarifies, but learners should be aware of the distinction.
  note: 'The past perfect ''had'' is often reduced to /əd/ or even /d/ in connected
    speech: ''He''d already left'' /hiːd ɔːlˈredi left/. Learners may miss this in
    listening.'
register_notes:
- note: 'Biber et al. (2021) — Narrative tense patterns: fiction uses more past tense
    with strategic present-tense shifts for vividness. Conversation uses past tense
    for past narrative. Register determines narrative tense choice. Ch. 6.2.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.2.2
