teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students identify and classify aspect in authentic texts.
    duration: 15
    name: Aspect Identification
  tips:
  - 'GB3 Ch. 7: Core meanings — simple aspect = events as complete wholes (no room for further development). Perfect aspect
    = ''prior'' (retrospective point of view). Progressive aspect = imperfective (incomplete, limited duration). Perfect progressive
    = combination of prior + incomplete. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch. 7 §7.1-7.2.'
  - 'GB3 Ch. 7: The 12 tense-aspect combinations are a system of 5 building blocks: 3 tenses (present, past, future in simple
    form) + 2 aspects (perfect, progressive). Only the ''northwest'' combinations (present progressive, simple present, simple
    past) are high frequency. Southeast combinations (past perfect progressive, future perfect progressive) are rare. Source:
    GB3 Ch. 7 §7.1.'
  - Use timelines to visualize aspects
  - Contrast perfective vs progressive explicitly
  - Use authentic texts for analysis
  - 'Swan aspect coverage: perfect (have + pp) marks anteriority/relevance; progressive (be + -ing) marks ongoing action;
    simple (no auxiliary) marks punctual/habitual. The choice of aspect is a separate choice from tense.'
