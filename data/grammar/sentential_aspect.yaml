grammar_point: sentential_aspect
level: C1
meaning:
  ccqs:
  - answer: Completed = perfective, ongoing = progressive
    purpose: Tests whether the learner can distinguish between the two primary sentential aspects (perfective and progressive),
      which is fundamental to understanding how English conveys the internal structure of events.
    question: Is the action completed or ongoing?
  - answer: Yes = habitual aspect.
    purpose: Tests whether the learner can identify the habitual aspect as a distinct category from perfective and progressive,
      which helps them understand how English encodes repeated or customary actions.
    question: Does this happen regularly?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with sentential aspect and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: It is progressive aspect (specifically present perfect progressive). Even though 'present perfect' is the tense,
      the aspect is progressive because the verb phrase 'has been writing' focuses on the ongoing, uncompleted nature of the
      action over a period of time. The -ing form (present participle) is the marker of progressive aspect, and 'for two hours'
      emphasises the duration of the ongoing activity.
    purpose: Tests whether the learner can separate the concept of tense from the concept of aspect when analysing sentential
      aspect. A single sentence can combine any tense with any aspect — 'has been writing' is present tense + perfect aspect
      + progressive aspect. At C1 level, learners need to identify that the progressive aspect is signalled by the be + -ing
      structure regardless of the tense used, and that aspect describes how the event unfolds in time rather than when it
      occurs.
    question: Is 'She has been writing a letter for two hours' perfective, progressive, or habitual aspect?
  contrast: Perfective = I wrote a letter. (completed) vs Progressive = I was writing a letter. (ongoing)
  core_meaning: Sentential aspect describes how an action relates to time. Perfective = completed action. Progressive = ongoing
    action. Habitual = repeated action.
  timeline: Varies by aspect — perfective = completed, progressive = ongoing, habitual = repeated.
