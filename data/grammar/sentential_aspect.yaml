common_errors:
- correction: I write letters every day.
  error: 'Using progressive for habitual actions: *''I am writing letters every day.'''
  explanation: The progressive aspect describes an ongoing action at a specific moment, not a repeated or customary action.
    Habitual actions use the present simple, not the present continuous.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: He was writing the report at 3pm yesterday.
  error: 'Using perfective for ongoing actions: *''He wrote the report at 3pm yesterday'' (meaning he was in the process)'
  explanation: The perfective (past simple) suggests a completed action. To describe an action in progress at a specific past
    time, use the progressive (past continuous) instead.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: D
- correction: Past simple can be progressive (was writing). Present can be perfective (I write now). Aspect and tense are
    independent.
  error: 'Confusing tense with aspect: treating ''past tense'' and ''perfective aspect'' as the same concept.'
  explanation: Tense locates an event in time (past, present, future). Aspect describes how the event unfolds in time (completed,
    ongoing, repeated). A past tense sentence can have progressive aspect, and a present tense sentence can have perfective
    aspect. Learners from aspect-prominent languages may find this distinction difficult.
  flagged: true
  l1_groups:
  - Russian
  - Arabic
  - Chinese
  reliability: D
