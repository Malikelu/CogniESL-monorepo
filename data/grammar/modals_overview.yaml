grammar_point: modals_overview
level: A2-C1
meaning:
  ccqs:
  - answer: Modals express ability, permission, obligation, possibility, and advice.
    purpose: Tests whether the learner understands a key concept of modals_overview.
      This is fundamental for correct use of this grammar point.
    question: What do modal verbs express
  - answer: No. Modals never add -s for third person singular.
    purpose: Tests whether the learner understands a key concept of modals_overview.
      This is fundamental for correct use of this grammar point.
    question: Do modals change form for he/she/it
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with
      modals overview and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Must. Must expresses positive logical deduction (near certainty based
      on evidence). For negative deduction, use can't (she can't be at home -- her
      car is not here). This is distinct from must for obligation (you must wear a
      seatbelt) and requires the learner to recognise the same modal serving different
      functions.
    question: Which modal is used for logical deduction about the present, such as
      she must be at home because her car is outside?
  contrast: Each modal has unique functions; no two modals are identical in all contexts.
  core_meaning: 'Modals express speaker attitude: ability, permission, possibility,
    obligation, prediction, deduction, or request.'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present: can, may, will, must; Past: could, might, would, should; Future:
    will, shall'
phonetics:
- example_generator:
    contexts:
    - modal reduction
  l1_issue: Learners may over-pronounce modals, making their speech sound unnatural.
    Teach the weak forms.
  note: 'Modal verbs are usually unstressed in connected speech: ''I can go'' → /aɪ
    kən ɡəʊ/, ''She must leave'' → /ʃi məst liːv/. The stress falls on the main verb.'
processing_note: 'McManus (2022): Modals are a clear case of complex form-meaning
  mappings. The same modal verb can express multiple meanings (epistemic, deontic,
  dynamic) — these are construction-level mappings that vary crosslinguistically.
  Learners must build new mappings for each use, not assume 1:1 L1-L2 correspondence.
  Processing Instruction helps learners attend to modal meaning distinctions in input.'
register_notes:
- note: 'Biber GSWE: Modals are most frequent in conversation and least frequent in
    academic prose. The only exception is ''may'' which is more common in academic
    writing. Semi-modals (have to, be going to) are 5x more common in conversation
    than their single-modal equivalents.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, modals are essential for politeness: ''Could you pass the
    salt?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal language, ''must'' expresses strong obligation: ''All passengers
    must wear seatbelts.'''
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (2021) — Modal verbs make up just 10-15% of finite verb phrases
    in all registers. Absence of a modal signals 'unquestioned validity' stance. Distinct
    distribution patterns for each modal across conversation, fiction, news, academic
    prose. Ch. 6.6
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.6
- note: CGEL (Ch.3) notes that modals comprise only 10-15% of finite verb phrases
    across all registers. The remaining 85-90% are tensed lexical verbs. This means
    modals, while functionally important, are statistically infrequent in natural
    discourse.
  source: Team observation
  reliability: D
  tier: 4
