sub_rules:
- examples:
  - He can swim (NOT He cans swim)
  - She must go (NOT She musts go)
  - It will rain (NOT It wills rain)
  rule: Modals never change form for third person singular — no -s ending
  type: grammatical
- examples:
  - I can swim (NOT I can to swim)
  - She must go (NOT She must to go)
  - They should study (NOT They should to study)
  rule: Modals are followed by the base form of the verb without to
  type: grammatical
- examples:
  - I can help you
  - She could swim when she was 5
  - You may leave now
  - It might rain
  - I will call you
  - I would go if I had time
  - Shall we dance?
  - You should study
  - You must wear a seatbelt
  rule: 'Common modals: can (ability), could (past ability), may (permission), might
    (possibility), will (future), would (conditional), shall (suggestion), should
    (advice), must (obligation)'
  type: lexical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students sort modals by function: ability, permission, obligation,
      possibility, advice.'
    duration: 10
    name: Modal Verb Sorting
  - adaptation_notes: 'Students complete sentences with the correct modal: ''You ___
      wear a seatbelt.'' (must) ''She ___ swim when she was 5.'' (could).'
    duration: 15
    name: Modal Gap Fill
  tips:
  - 'Biber et al. (2021) GSWE. John Benjamins. Ch. 6.6.1: Modals and semi-modals are
    most common in conversation, least common in academic prose. Semi-modals are five
    times more common in conversation than in written registers. Can, will, would
    are the most frequent modals; shall is rare. In fiction and conversation, modals
    are more common in BrE than AmE.'
  - 'GB3 Ch. 8: Three types of modal meaning — logical probability (epistemic), social
    interaction (deontic), and ability/tendency (dynamic). Each modal has at least
    two meanings. Example: can = ability (''I can swim''), permission (''Can I go?''),
    possibility (''It can''t be raining''). Source: Celce-Murcia & Larsen-Freeman
    (2015) GB3 3rd ed. Ch. 8 §8.2.'
  - 'GB3 Ch. 8: Core meaning (force-dynamic) framework — can = potential force, could
    = weakened potential, must = irresistible force, should = weakened obliging force,
    will = force of commitment, would = weakened force of commitment. These extend
    across logical, social, and ability domains. Source: GB3 3rd ed. Ch. 8 §8.2 (citing
    Sweetser 1990, Tyler 2012).'
  - 'GB3 Ch. 8: Modal advice scale — might/could < should/ought to/had better < must/have
    to/have got to/need to. Request scale — Can/Could/Will/Would/May (increasing politeness).
    Logical probability scale — must/has to (high) > will/would > should/ought to
    > may > could/might (low). Source: GB3 3rd ed. Ch. 8 §8.3.'
  - 'CGEL Ch. 3: Auxiliaries have NICE properties — Negation (can''t, won''t), Inversion
    (Can you?), Code (I can too), Emphasis (I DO like it). These properties distinguish
    auxiliaries from lexical verbs and explain why do-support is required for lexical
    verbs in questions and negatives.'
  - 'CGEL Ch. 3: English has three kinds of modality — epistemic (factual probability:
    She must be home), deontic (obligation: You must go), and dynamic (ability/willingness:
    She can swim). These are distinguished by their logical properties, not just meaning.'
  - Map modals by function and level for staged teaching.
  - 'Use color-coded charts: green for ability, blue for permission, etc.'
  - Practice deduction modals (must/can't) with mystery scenarios.
  - 'Swan PEU: Modal auxiliaries — can, could, may, might, must, shall, should, will,
    would. Core properties: (1) no -s on 3rd person singular, (2) followed by bare
    infinitive, (3) form questions by inversion (no do-support), (4) form negatives
    with ''not.'''
  - 'Swan PEU: Semi-modals — need, dare, used to, have (got) to, be able to, had better.
    These behave partially like modals and partially like full verbs.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3)
    analyzes auxiliaries as a SUBCLASS of lexical verbs (not a separate part of speech).
    The defining properties are NICE: Negation (She can''t come), Inversion  (Can
    she come?), Code (She can come and so can he), Emphasis (She CAN come). This explains
    why auxiliaries pattern together without positing a separate category.'
  - 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: GB3 analyzes
    modality along three dimensions: EPISTEMIC (possibility/necessity: ''She may be
    there''), DEONTIC (permission/obligation: ''You must leave''), and DYNAMIC (ability/willingness:
    ''She can swim''). The same modal verb can express different modality types depending
    on context: ''She must be there'' (epistemic deduction) vs ''She must leave''
    (deontic obligation). This three-way distinction helps learners interpret ambiguous
    modal uses.'
title: Modal Verbs Overview (All Functions & Levels)
use:
- description: Present/past ability.
  examples:
  - I can swim.
  - I could swim when I was 10.
  key_point: Could for past ability, can for present.
  level: A2
  name: Ability (can, could)
- description: Ask/give permission.
  examples:
  - Can I go?
  - May I enter?
  key_point: May is more formal than can.
  level: A2
  name: Permission (can, may, could)
- description: Likelihood of events.
  examples:
  - It may rain.
  - It could be true.
  key_point: Might is less certain than may.
  level: B1
  name: Possibility (may, might, could)
- description: Duty/necessity.
  examples:
  - You must wear a helmet.
  - You should study.
  key_point: Must is stronger than should.
  level: A2-B1
  name: Obligation (must, should, ought to)
- description: Future events.
  examples:
  - It will rain tomorrow.
  - We shall overcome.
  key_point: Shall is formal, mostly British English.
  level: A2
  name: Prediction (will, shall)
- description: Logical conclusion.
  examples:
  - He must be tired.
  - She can't be at home.
  key_point: Must = positive deduction, can't = negative deduction.
  level: B2
  name: Deduction (must, can't)
