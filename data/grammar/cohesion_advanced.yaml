grammar_point: cohesion_advanced
level: C1
meaning:
  ccqs:
  - answer: '''However'' is more formal and is preferred in academic writing. ''But'' is more common in speech and informal
      writing.'
    purpose: Tests whether the learner understands the register distinction between 'however' (formal/academic) and 'but'
      (informal/spoken). Advanced cohesion requires using appropriate linking devices for the register.
    question: '''However'' and ''but'' both show contrast. Which is more formal and suitable for academic writing?'
  - answer: '''These'' refers to ''significant results.'' This is an example of reference as a cohesive device — using a pronoun
      to refer back to something already mentioned.'
    purpose: Tests whether the learner understands reference as a cohesive device. Pronouns (this, these, that, those) and
      determiners (the, such) create cohesion by linking back to previously mentioned information.
    question: In the sentence 'The study found significant results. These were published in a journal,' what does 'These'
      refer to?
  - answer: Both show result, but 'as a result' is more formal and is preferred in academic writing. 'So' is more common in
      speech.
    question: Can you explain the difference between 'so' and 'as a result' by giving an example of when to use each?
    purpose: 'Tests whether the learner can identify and use advanced cohesion devices appropriately (CCQ #3).'
  - answer: '''I am one of them who agrees.'' After ''one of + plural noun + who/that'', the verb is singular if it refers
      to ''one''.'
    purpose: Tests subject-verb agreement after 'one of + plural noun + relative clause' (Swan PEU 2016, entry 119.4).
    question: Which is correct? *'I am one of them who agree' or 'I am one of them who agrees'?
  contrast: Basic cohesion = and, but, so vs Advanced cohesion = nevertheless, furthermore, in contrast, as a result
  core_meaning: Advanced cohesion refers to the linguistic devices that connect ideas across sentences and paragraphs. This
    includes discourse markers (however, moreover), lexical cohesion (repetition, synonyms), substitution (do so, so does
    he), ellipsis (omission of understood words), and reference (this, that, the former).
  example_generator:
    contexts:
    - academic writing
    - formal essays
    - professional communication
    - extended discourse
    cultural_notes:
    - Cohesion patterns vary across languages
    - English academic writing values explicit cohesive devices
    min_examples: 5
  timeline: Timeless — applies to all texts regardless of tense.
phonetics:
- example_generator:
    contexts:
    - pausing
    - reading aloud
  l1_issue: Many L1 speakers underuse cohesive devices, making writing sound choppy
  note: Discourse markers are typically followed by a pause (comma) in speech
register_notes:
- note: 'Biber et al. (2021) — Cohesion devices: academic prose uses more explicit lexical cohesion (linking adverbials, lexical
    bundles); conversation uses more implicit cohesion (shared context, pronouns). Ch. 10.4, 4.1.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24: Coordination-16.7'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - The results were promising. However, more research is needed.
  - On the other hand, there are significant drawbacks.
  rule: 'Discourse markers for contrast: however, nevertheless, on the other hand, conversely'
  type: discourse
- examples:
  - The plan is expensive. Furthermore, it is risky.
  rule: 'Discourse markers for addition: furthermore, moreover, in addition, besides'
  type: discourse
- examples:
  - The results were inconclusive. This suggests that more research is needed.
  - Both methods have advantages. The former is cheaper; the latter is faster.
  rule: 'Reference words: this, that, these, those, the former, the latter'
  type: reference
- examples:
  - She asked him to leave, and he did so.
  - I enjoy reading, and so does my sister.
  rule: 'Substitution: do so, so does/did + subject'
  type: substitution
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students identify and categorize cohesive devices in academic texts.
    duration: 15
    name: Cohesion Analysis
  tips:
  - 'CGEL Ch. 16: Information packaging includes the given-before-new principle: English prefers to place given (known) information
    before new information. This explains passive choice (The window was broken by John) and inversion (On the table stood
    a lamp).'
  - Use authentic academic texts as examples
  - Have students identify cohesive devices in texts
  - Practice adding cohesion to student writing
  - 'Swan PEU: Cohesion devices in writing — conjunctions, adverbials, discourse markers. Formal texts make logical relationships
    explicit through these devices. Informal writing can leave more implicit.'
title: Advanced Cohesion
use:
- context: Academic writing
  description: Connecting ideas in essays and reports
  examples:
  - The data suggests a correlation. However, causation cannot be inferred.
  - Furthermore, the sample size was small. This limits the generalizability of the findings.
- context: Professional communication
  description: Formal emails and reports
  examples:
  - I have reviewed the proposal. While it has merit, I have several concerns.
  - The deadline is approaching. As such, we need to accelerate our efforts.
