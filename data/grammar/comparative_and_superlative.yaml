common_errors:
- correction: She is the tallest girl in the class.
  error: '*She is the most tallest girl in the class.*'
  explanation: 'Double superlative: adding both ''-est'' and ''most'' to the same adjective. One marker is sufficient. This
    happens when learners are uncertain which form to use and add both for emphasis. Common across many L1 backgrounds.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Arabic
  reliability: D
- correction: This book is better than that one.
  error: '*This book is more better than that one.*'
  explanation: Using 'more' + '-er' form creates a double comparative. Short adjectives (one syllable) take '-er', not 'more'.
    This overgeneralization comes from applying the 'more + adjective' pattern used with longer adjectives to all adjectives.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Comparatives'
- correction: He is the most intelligent student in the class.
  error: '*He is the more intelligent student in the class.*'
  explanation: Superlative form required for comparing 3+ items. For long adjectives (3+ syllables), use 'most' rather than
    '-er'. Using 'more' here creates a comparative where a superlative is needed for the group context.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: This is the biggest of the three options.
  error: '*This is the bigger of the three options.*'
  explanation: Superlative required when comparing three or more items. 'Bigger' is comparative (for two items). Learners
    often default to comparative forms even when the context explicitly requires superlative.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: John is taller than Peter.
  error: '*John is more tall than Peter.*'
  explanation: One-syllable adjectives take '-er' for comparatives, not 'more'. Languages like Portuguese and Spanish always
    use a separate word for comparison (mais alto, mas alto), which leads to this persistent transfer error.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
description: 'Forms used to compare two or more things: comparative (comparing two) and superlative (comparing three or more,
  showing the most/least). Essential for making comparisons.'
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      - sports
      - food
      min_examples: 4
    structure: 'Short adjectives (1 syllable, some 2): Comparative = -er, Superlative = -est

      "tall → taller → tallest", "big → bigger → biggest" (double final consonant)

      Long adjectives (2+ syllables): Comparative = more + adj, Superlative = most + adj

      "careful → more careful → most careful", "interesting → more interesting → most interesting"

      Irregular: "good → better → best", "bad → worse → worst", "far → farther/further → farthest/furthest"

      '
  negative:
    example_generator:
      contexts:
      - family and relationships
      - opinions
      min_examples: 4
    structure: 'Comparative: "less + adj" or "not as + adj + as"

      Superlative: "least + adj" or "not the most + adj"

      '
  questions:
    example_generator:
      contexts:
      - everyday situations
      - quizzes
      min_examples: 4
    structure: 'Comparative: "Is X more/er than Y?" "Which is more/er?"

      Superlative: "What''s the most/est?" "Who is the most/est?"

      '
grammar_point: comparative_and_superlative
level: A2
meaning:
  ccqs:
  - answer: Two = comparative (-er / more). Three or more = superlative (-est / most).
    purpose: Tests whether the learner understands when to use comparative vs. superlative forms. This distinction depends
      on how many items are being compared.
    question: Are we comparing two things or more than two?
  - answer: Yes, if it is a comparative (taller than, more interesting than).
    purpose: Tests whether the learner knows that 'than' (not 'that') follows comparative adjectives. This is a common spelling/usage
      error across L1 backgrounds.
    question: Do we use 'than' after the adjective?
  - answer: Yes, if it is a superlative (the tallest, the most interesting).
    purpose: Tests whether the learner knows that superlatives require the definite article 'the'. Omitting the article is
      a common error, especially for learners from article-less L1s.
    question: Do we use 'the' before the adjective?
  - answer: Short = add -er/-est. Long = use more/most.
    purpose: Tests whether the learner understands when to use comparative vs. superlative forms. This distinction depends
      on how many items are being compared.
    question: Is the adjective short (one syllable) or long (two or more syllables)?
  contrast: '"COMPARATIVE" = Two items: "John is taller than Paul." (John vs Paul)


    "SUPERLATIVE" = Three+ items: "John is the tallest in the class." (John vs everyone)


    "EQUALITY" = Same level: "John is as tall as Paul." (same height)

    '
  core_meaning: Comparative = comparing two things (higher degree). Superlative = comparing three or more (highest degree
    among group).
  example_generator:
    contexts:
    - everyday situations
    - shopping
    - describing people
    - travel comparisons
    cultural_notes:
    - Some languages do not change the adjective form for comparison — they use a separate word like 'more'
    - Irregular forms (good/better/best) must be memorised
    min_examples: 5
  timeline: N/A (Not tense-based; these are adjective forms showing degree of comparison.)
phonetics:
- example_generator:
    contexts:
    - sentence stress
  l1_issue: Some L1 speakers stress 'than' instead of the adjective
  note: 'Stress on the adjective: She is TALLER than him. She is the TALLest.'
- example_generator:
    contexts:
    - connected speech
  l1_issue: Speakers of languages without dental fricatives may substitute /d/ or /z/ for 'th' in 'than'
  note: Weak form of 'than' /ðæn/ → /ðən/ in connected speech
register_notes:
- note: 'Biber et al. (2021) — Inflectional vs. phrasal comparison: inflectional (-er/-est) is more common in conversation
    and news; phrasal (more/most) is more common in academic prose. Register and adjective length interact. Ch. 7.7.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.7.3
