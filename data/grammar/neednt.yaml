  - French
  reliability: D
- correction: You don't need to worry.
  error: Using 'needn't' in American English
  explanation: 'Swan PEU: ''Needn''t'' is primarily British English. American English uses ''don''t need to''.'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Semi-modal verb used to express that something is not necessary or required, equivalent to 'don't need to'.
