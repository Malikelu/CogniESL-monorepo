description: 'Structures used to make logical guesses about situations based on evidence, with varying degrees of certainty:
  must (90%+ sure), might/could (50% sure), can''t (0% sure).'
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission: ''All passengers must wear seatbelts.'''
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      - social interactions
      min_examples: 4
    structure: 'Present deduction: Modal + base verb: "He must be tired. (90% sure)", "He might be tired. (50% sure)", "He
      can''t be tired. (0% sure)"

      Past deduction: Modal + have + past participle: "He must have gone. (90% sure past)", "He might have gone. (50% sure
      past)", "He can''t have gone. (0% sure past)"

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Use ''can''t'' for negative certainty; ''might not/could not'' for negative possibility: ''He can''t be here.''
      ''He might not come.'''
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Invert modal and subject: ''Must he be tired?'' ''Could she have left?'''
grammar_point: deduction_speculation
level: B2
meaning:
  ccqs:
  - answer: Yes — you would say "She must be intelligent" (high certainty based on evidence).
    purpose: Tests whether the learner can use 'must' to make logical deductions from evidence. When the evidence strongly
      supports the conclusion (PhD in physics → intelligent), 'must be' expresses high certainty about a present state.
    question: She has a PhD in physics. Is it possible she is intelligent?
  - answer: No — you would say "He might not be at home" or "He can't be at home" depending on how strong the evidence is.
    purpose: Tests whether the learner can distinguish between different degrees of negative deduction. 'Can't be' = near-certainty
      from evidence (lights off at 3pm suggests absence). 'Might not be' = possibility without certainty. Choosing the correct
      modal reflects the strength of the evidence.
    question: The lights are off at his house at 3pm. Is he definitely not at home?
  - answer: The past — "must have + past participle" refers to a past deduction.
    purpose: Tests whether the learner understands that 'modal + have + past participle' shifts the deduction from present
      to past. 'He must be at the gym' = present deduction. 'He must have gone to the gym' = past deduction. This structural
      distinction is essential for accurate speculation about past events.
    question: '"He must have gone to the gym" — are we talking about now or the past?'
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with deduction speculation. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: '''Must'' = High certainty (90%+): "He must be rich (seen his car)"

    ''Might/Could'' = Medium certainty (50%): "He might be rich (not sure)"

    ''Can''t'' = No certainty (0%): "He can''t be rich (seen his small apartment)"

    ''Past'' = Add ''have + past participle'': "Must have been rich"

    '
  core_meaning: Make logical inferences about present or past situations based on evidence, not direct knowledge.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present deduction: Modal + base verb. Past deduction: Modal + have + past participle.'
phonetics:
- example_generator:
    contexts:
    - deduction stress patterns
  l1_issue: Learners may not stress the modal sufficiently, making the deduction sound uncertain.
  note: 'In deduction sentences, the modal verb is usually stressed: ''She MUST be tired.'' ''He CAN''T have finished.'''
register_notes:
- note: 'In conversation, modals are essential for politeness: ''Could you pass the salt?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal language, ''must'' expresses strong obligation: ''All passengers must wear seatbelts.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Deduction modals (''must'', ''might'', ''could''): academic prose uses more tentative speculation
    markers for hedging claims; conversation uses more direct deduction modals. Ch. 6.6.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6.2
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
