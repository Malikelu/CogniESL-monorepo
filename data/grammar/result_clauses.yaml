common_errors:
- correction: It was such a hot day that...
  error: 'Confusing ''so'' and ''such'': *''It was so a hot day that...'''
  explanation: '''So'' is used before adjectives/adverbs (so hot), while ''such''
    precedes noun phrases (such a hot day). Learners frequently confuse these two
    patterns.'
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
- correction: It was so cold that...
  error: 'Using ''so much'' before an adjective: *''It was so much cold that...'''
  explanation: '''So much'' is used before uncountable nouns (so much rain), not before
    adjectives. Before a bare adjective, use ''so'' alone.'
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - Italian
  reliability: B
- correction: It was so hot that we left.
  error: 'Omitting ''that'' in formal writing without adjusting structure: *''It was
    so hot we left'' in an academic essay.'
  explanation: In formal and written English, the conjunction 'that' should be included
    in result clauses. While dropping 'that' is acceptable in informal speech, it
    should be included in academic and professional writing.
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
description: Structures that show the consequence or outcome of an action. Essential
  for showing cause-effect relationships.
dialectal_variation: []
discourse_notes:
- note: 'In spoken discourse, result clauses add dramatic emphasis and emotional weight:
    ''The food was so good that I ordered seconds'' (restaurant review among friends).
    In academic and scientific writing, they structure cause-effect arguments: ''The
    temperature was so elevated that the enzyme denatured.'' In film and book reviews,
    ''such...that'' is particularly common: ''It was such a compelling story that
    I finished it in one sitting.'' Teachers can use authentic review excerpts (TripAdvisor,
    Goodreads, academic abstracts) to show learners how result clauses function across
    different text types, and to highlight the register-appropriate connector choices.'
example_generator:
  contexts:
  - everyday situations
  cultural_notes: []
  min_examples: 5
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      - health and wellbeing
      min_examples: 4
    structure: 'So + adjective/adverb + that + clause: "It was so hot that we left."
      Such + (a/an) + noun + that + clause: "It was such a hot day that we left."
      Main clause + therefore + clause: "It was hot; therefore, we left." '
  negative:
    example_generator:
      contexts:
      - weather and nature
      min_examples: 4
    structure: Negative in either part.
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Questions less common; use 'so' in statement questions.
grammar_point: result_clauses
level: B2
meaning:
  ccqs:
  - answer: 'Both so...that and such...that express result, but the grammar after
      each connector differs: so takes an adjective/adverb, such takes a noun phrase.'
    purpose: Tests whether the learner understands the structural difference between
      so and such - that so modifies adjectives/adverbs while such modifies noun phrases.
    question: '''It was so hot that we left'' - why ''so'' and not ''such''? What
      determines whether we use ''so'' or ''such''?'
  - answer: No. Without the that clause, the result is incomplete. 'It was so hot'
      but we do not know what happened. The that clause is necessary to express the
      consequence.
    purpose: Tests whether the learner understands that result clauses require both
      a cause and a consequence to express complete meaning.
    question: Can we omit the that clause in so...that and still express a complete
      result?
  - answer: Formal writing uses therefore and consequently as result connectors. Informal
      speech and writing use so...that and such...that.
    purpose: Tests whether the learner understands the register differences between
      informal and formal result connectors.
    question: When should I use therefore instead of so...that?
  - answer: '''so'' + adjective (so hot that) vs ''such'' + noun phrase (such a hot
      day that). A common error is *so a hot day that.'
    purpose: Tests whether the learner can identify and correct the most common error
      with result clauses - using so before a noun phrase instead of such.
    question: What is wrong with this sentence? *It was so a hot day that we left.*
  contrast: '''So + adj + that'' = result (emphasis on degree) ''Such + noun + that''
    = result (emphasis on noun) ''Therefore'' = formal result connector ''So'' (simple)
    = result without ''that'' clause '
  core_meaning: Shows the consequence or outcome that results from a situation or
    action. This grammar point is essential for expressing result clauses in English.
    Learners at this level need to understand both the form and the appropriate contexts
    for use. Common errors include confusion with related structures and inappropriate
    register use.
  timeline: N/A (Result clauses show logical relationships, not time sequence.)
phonetics:
- example_generator:
    contexts:
    - result clause stress
  l1_issue: 'Portuguese speakers may use ''so much'' instead of ''so'' before adjectives.
    Teach: ''so cold'' NOT ''so much cold.'''
  note: 'So is stressed in result clauses: ''It was SO cold that...'' ''Such'' is
    also stressed: ''It was SUCH a cold day that...'''
register_notes:
- note: '''So...that'' and ''such...that'' are neutral in register and work in both
    speech and writing: ''It was so cold that we left'' (spoken anecdote) and ''The
    results were so significant that the study was published'' (academic). However,
    ''therefore'' and ''consequently'' are restricted to formal writing and academic
    discourse: ''The sample was contaminated; therefore, the data were discarded.''
    In very formal prose, ''to such a degree that'' and ''to the extent that'' replace
    ''so...that'': ''The damage was to such a degree that the building was condemned.''
    Teachers should note that ''so'' used alone as a result connector (''It was cold,
    so we left'') is informal and should be upgraded to ''therefore'' or ''as a result''
    in academic essays.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Result clauses (so...that, such...that): register distribution
    varies. Academic prose uses more explicit result connectors; conversation uses
    more implicit result expressions. Ch. 10.2'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 10.2
