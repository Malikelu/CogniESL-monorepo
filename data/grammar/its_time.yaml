common_errors:
- correction: It's time you went to the doctor.
  error: '*It''s time to go to the doctor.* (less urgent)'
  explanation: '''It''s time + subject + past tense'' expresses urgency/that something is overdue. ''It''s time to + verb''
    is more neutral.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: A structure used to indicate that an action is due to happen now, often with a sense of urgency or that it is
  overdue.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
    - It is time to wake up.
    - It is time for class to start.
    - It is time we cleaned the garage.
    min_examples: 4
    structure: 'It is time to base verb or It is time subject past simple

      '
  negative:
    example_generator:
    - It is time not to worry so much.
    min_examples: 3
    structure: It is time not to base verb
  questions:
    example_generator:
    - Is it time to leave
    - Is it time we went home
    min_examples: 3
    structure: 'Is it time to base verb or Is it time subject past simple

      '
grammar_point: its_time
level: B2
meaning:
  ccqs:
  - answer: It is time to X = general. It is time you + past simple = specific person.
    purpose: Tests whether the learner understands that 'it's time' is followed by a past tense verb to express that something
      should have already happened. This is a very unusual structure.
    question: Is this a general reminder or about a specific person
  - answer: Past simple, even though we mean now or the future.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'What tense follows the subject in it is time you...' checks conceptual understanding, not just memorization.
    question: What tense follows the subject in it is time you
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with its time and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Both express that something is overdue, but it is high time is stronger and more emphatic, while it is about time
      often carries a tone of frustration or impatience. Both are followed by subject + past simple.
    purpose: Tests whether the learner understands the register and pragmatic difference between it is high time and it is
      about time. Both structures use past simple for present meaning, but the emotional force differs, which affects when
      each is appropriate to use in spoken and written English.
    question: Can you explain the difference between it is high time and it is about time by giving an example of when to
      use each?
  contrast: It is time to X = general reminder. It is time subject + past simple = personal, specific.
  core_meaning: Signals that an action is due, expected, or overdue, often with mild urgency or reproach.
  example_generator:
    contexts:
    - everyday situations
    - giving advice
    cultural_notes:
    - The past simple after it is time is subjunctive
    min_examples: 5
  timeline: Refers to present time. The action should happen now or very soon.
phonetics:
- example_generator:
  - time as /taɪm/
  l1_issue: Many L1 speakers use present tense after it is time you. Teach that past simple is required.
  note: The word time is stressed. The past simple verb is usually unstressed.
register_notes:
- note: 'Biber et al. (2021) — ''It''s time'' + past subjunctive: conversational and informal written register. Academic prose
    uses more explicit temporal framing. Ch. 6.2.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.2
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 9: It-constructions'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27: Conditionals (it is time + past subjunctive)'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 8: Conditionals'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 8: It is time'
  validation: Swan (2016) Practical English Usage, 4th ed.(it is time)
sub_rules:
- examples:
  - It is time to wake up
  - It is time to go home
  rule: It is time to base verb for general reminders
  type: grammatical
- examples:
  - It is time you apologized
  - It is time we left
  rule: It is time subject past simple for specific people
  type: grammatical
- examples:
  - It is high time you got a job
  rule: It is high time subject past simple for strong emphasis
  type: grammatical
- examples:
  - It is about time you visited your parents
  rule: It is about time subject past simple for frustration
  type: grammatical
teaching:
  methodology: Guided discovery with real-life scenarios
  recommended_activities:
  - adaptation_notes: Students create reminders using It is time to.
    duration: 10
    name: Daily Routine Reminders
  - adaptation_notes: Students write sentences about overdue actions.
    duration: 15
    name: Overdue Actions
  tips:
  - Start with daily routines using It is time to X.
  - 'Contrast the two structures: general vs specific.'
  - 'Swan PEU: ''It''s time + past tense'' — ''It''s time we left.'' = we should leave now. The past tense here does NOT refer
    to past time; it expresses urgency/recommendation. Subjunctive-like construction.'
  - 'Swan PEU: ''It''s time + to-infinitive'' — ''It''s time to go.'' ''It''s time for + noun'' — ''It''s time for bed.''
    Similar meaning, different structure.'
title: It is Time (Due or Overdue Actions)
use:
- context: Routine reminders
  examples:
  - It is time to wake up
  - It is time for class to start
- context: Overdue actions
  examples:
  - It is time we cleaned the garage
  - It is time you apologized
