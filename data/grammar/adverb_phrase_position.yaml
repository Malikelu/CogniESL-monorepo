grammar_point: adverb_phrase_position
level: B2
meaning:
  ccqs:
  - answer: Different positions have different emphasis.
    purpose: Tests whether the learner understands that adverbs can occupy different
      positions (front, mid, end) with different emphasis. This is important because
      adverb position affects the focus and naturalness of a sentence.
    question: Is the adverb at the beginning, middle, or end?
  - answer: Manner, frequency, time, or place — each has preferred positions.
    purpose: Tests whether the learner can identify the type of adverb (manner, frequency,
      time, place) and knows its preferred position. This is important because different
      adverb types follow different placement rules.
    question: What type of adverb is it?
  - answer: End position is neutral and most common in everyday English. Front position
      ('Suddenly, the door opened') adds emphasis or narrative drama. Mid-position
      with a time adverb ('I yesterday went to the store') sounds unnatural in modern
      English. Position depends on adverb type and intended effect.
    purpose: Tests whether the learner can identify common errors associated with
      adverb phrase position and explain why they are incorrect.
    question: Which sounds more natural — 'Yesterday I went to the store', 'I yesterday
      went to the store', or 'I went to the store yesterday'?
  - answer: Never have I seen such talent is more emphatic because fronting a negative
      adverb (Never) triggers subject-auxiliary inversion, which draws attention to
      the dramatic statement. The neutral version I have never seen such talent states
      the fact without special emphasis. Inversion after fronted negatives is a formal
      and literary device.
    purpose: Tests whether the learner understands the relationship between fronted
      negative adverbs and subject-auxiliary inversion. This grammatical rule is essential
      for producing formal, emphatic English and for recognizing why sentences like
      Never have I seen have a different impact than their neutrally-ordered counterparts.
    question: Never have I seen such talent versus I have never seen such talent --
      which is more emphatic and why?
  contrast: Front position = Yesterday, I went to the store. (emphasis) vs End position
    = I went to the store yesterday. (neutral)
  core_meaning: Adverbs can go in different positions in a sentence. The position
    depends on the type of adverb and what you want to emphasize. Front position adds
    emphasis, end position is neutral.
  example_generator:
    contexts:
    - sentence structure
    - emphasis
    - formal writing
    - spoken English
    cultural_notes:
    - Word order errors with adverbs are very common across L1 groups
    - Some L1 speakers put all adverbs at the end
    min_examples: 5
  timeline: Depends on the tense used.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Many L1 speakers put all adverbs at the end, sounding unnatural
  note: Stress changes with position — front position gets more emphasis
register_notes:
- note: 'Biber et al. (2021) — Adverbial position: fronting (initial position) is
    more common in written registers (news, fiction); medial position dominates conversation.
    Academic prose uses more carefully placed stance adverbials. Ch. 11.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 11.2
