sub_rules:
- examples:
  - walk → walked
  - play → played
  - cook → cooked
  - clean → cleaned
  rule: 'Regular verbs: add -ed to the base form'
  type: spelling
- examples:
  - live → lived
  - love → loved
  - dance → danced
  - hope → hoped
  rule: 'Verbs ending in -e: just add -d'
  type: spelling
- examples:
  - study → studied
  - carry → carried
  - try → tried
  - cry → cried
  rule: 'Verbs ending in consonant + y: change y to i, add -ed'
  type: spelling
- examples:
  - play → played
  - enjoy → enjoyed
  - stay → stayed
  rule: 'Verbs ending in vowel + y: just add -ed'
  type: spelling
- examples:
  - stop → stopped
  - plan → planned
  - drop → dropped
  rule: 'Short verbs ending in consonant-vowel-consonant: double the final consonant, add -ed'
  type: spelling
- examples:
  - go → went
  - buy → bought
  - eat → ate
  - see → saw
  - have → had
  rule: Irregular verbs must be memorized. There is no rule for these.
  type: irregular
- examples:
  - I went to the cinema yesterday.
  - She visited London last year.
  - They moved here two years ago.
  rule: 'Common time expressions: yesterday, last night, last week, last month, last year, in 2020, two days ago, when I was
    young'
  type: lexical
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: Students tell the class what they did yesterday using Past Simple. Teacher writes key verbs on the board,
      highlighting regular and irregular forms.
    duration: 10
    name: Yesterday I...
  - adaptation_notes: Students fill a bingo grid with irregular past tense forms. Teacher calls out base forms; students mark
      the past tense. First to complete a line wins.
    duration: 15
    name: Irregular Verb Bingo
  - adaptation_notes: 'Teacher starts a story: ''Yesterday I went to the park.'' Each student adds a sentence using Past Simple.
      Practices narrative sequencing and irregular verbs.'
    duration: 15
    name: Story Chain
  - adaptation_notes: Students write 5-8 sentences about what they did last weekend. Teacher checks for correct use of regular
      and irregular past tense forms.
    duration: 15
    name: Past Simple Diary
  tips:
  - 'Parrott (2000) Ch. 15: Learners need extensive practice with past simple question and negative forms, irregular past
    tense forms, and spelling of regular past tense. Teaching approach: choose between past tenses according to when events
    take place relative to a fixed past time. Past continuous and past perfect have narrative functions that learners find
    easier to grasp as rules of thumb. Speakers of European languages with similar past perfect forms find it easier to understand.
    Source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 15: The past, 15.1-15.5.'
  - 'GB3 Ch.7: Past simple conveys remoteness — not just past time. This remoteness extends to social distance (Would you
    like?), hypothetical meaning (If I had), and backshift in reported speech. Teaching this unifying principle helps learners
    connect these seemingly unrelated uses.'
  - Start with regular verbs and the -ed endings. Master these before introducing irregular verbs.
  - 'Teach the most common irregular verbs early: go/went, have/had, buy/bought, eat/ate, see/saw, come/came, take/took, make/made,
    get/got, know/knew.'
  - 'Drill time expressions: yesterday, last week, in 2020, two days ago. These signal Past Simple.'
  - 'Use story sequencing: ''First I..., then I..., finally I...'' This practices the narrative function of Past Simple.'
  - 'Contrast with Present Perfect: ''I went to Paris (last year, finished) vs I have been to Paris (experience, no specific
    time).'''
  - 'Swan PEU: Teach the pronunciation of -ed endings (/t/, /d/, /ɪd/) early. Many L1 speakers add a full syllable: ''walk-ed''
    instead of ''walked'' /wɔːkt/.'
  - 'Swan PEU: Past progressive for background + simple past for events: ''I was walking down the road when I saw James.''
    Use timelines to visualize.'
  - 'Swan PEU: Past progressive can make things seem less important: ''I was having lunch with the President'' (casual) vs
    ''I had lunch with the President'' (important news).'
  - 'GB3 Ch. 7: Simple past core meaning = remoteness. Uses: (a) definite completed event, (b) habitual past, (c) duration
    with implication no longer applies (''Professor Nelson taught at Yale for 30 years''), (d) states in past, (e) imaginative
    conditional (''If he took better care...''), (f) social distancing/politeness (''Did you want to sit down?''). Source:
    Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.2.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3) analyzes the past tense as marking a
    situation as BOUNDED (completed) and located before the present. The past tense is the default tense for narrative (fiction,
    news) because narratives describe completed events. CGEL notes that the past tense can also be used for modal remoteness
    (''If I had time'' — unreal present, not past time) and politeness (''I wanted to ask...'' — less direct than ''I want'').'
title: Past Simple (V2/ed)
use:
- context: Completed past action at a specific time
  description: An action that started and finished at a named past time
  examples:
  - I graduated in 2018.
  - She called me last night.
  - We visited Paris in 2019.
  - He arrived at 3pm.
- context: Past habits
  description: Regular actions in the past that are now finished
  examples:
  - I played football every weekend when I was a child.
  - She walked to school every day.
  - They always ate dinner at 7pm.
- context: Sequence of events
  description: A list of past actions in chronological order
  examples:
  - I woke up, brushed my teeth, and went to work.
  - She came home, cooked dinner, and watched TV.
  - We arrived at the hotel, checked in, and went to the pool.
- context: Biographies and life stories
  description: Talking about someone's life in the past
  examples:
  - She was born in 1990.
  - He studied medicine at university.
  - They lived in Japan for five years.
