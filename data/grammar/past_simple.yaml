citations:
- claim: 'Core meaning: Describes an action that started and finished at a specific time in the past'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 6: Past Tenses-6.3'
  tier: 1
- claim: 'Register distribution: Past simple is neutral in register — used equally in formal and informal contexts.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 6: Past Tenses-6.3'
  tier: 1
- claim: 'Discourse function: Past simple is the primary narrative tense — it moves stories forward.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 6: Past Tenses-6.3'
  tier: 1
- claim: 'Common error ''Using past simple with ''since'': *''I lived here since 2020.'''' for Portuguese, Spanish, French
    speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 7: Past tenses-7.3'
  tier: 1
- claim: 'Dialectal variation: Some irregular verbs differ: BrE "learnt, dreamt" vs AmE "learned, dreamed". Both acceptable.'
  reliability: B
  source: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 3: The Verb-3.6'
  tier: 1
- claim: L1 transfer in past simple varies significantly across language backgrounds — Swan & Smith document contrastive patterns
    for speakers of different L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents how transfer effects are non-linear,
    determined by functional fit between L1 and L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects are non-linear — determined by functional
    fit between L1 and L2 systems rather than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 2
common_errors:
- correction: I have lived here since 2020.
  error: 'Using past simple with ''since'': *''I lived here since 2020.'''
  explanation: '''Since'' requires present perfect, not past simple.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: I went to school.
  error: 'Using regular -ed for irregular verbs: *''I goed to school.'''
  explanation: Many common verbs are irregular. These must be memorized.
  flagged: true
  l1_groups:
  - All L1 groups
  reliability: D
- correction: I walked to school yesterday.
  error: 'Omitting -ed: *''I walk to school yesterday.'''
  explanation: Regular past simple requires -ed.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: D
- correction: Who broke the window?
  error: 'Using ''did'' in questions with ''who'' as subject: *''Who did break the window?'''
  explanation: 'Swan PEU: When ''who'' (or ''what'') is the subject of the question, we do not use ''did''. Compare: ''Who
    broke the window?'' (who = subject) vs ''Who did you see?'' (who = object).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: When I was a child, we walked to school every day.
  error: 'Using past progressive for repeated past actions: *''When I was a child, we were walking to school every day.'''
  explanation: 'Swan PEU: The past progressive is NOT the normal tense for repeated/habitual past actions. Use simple past
    for habits.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: She said she didn't believe me.
  error: 'Using past progressive with stative verbs: *''She said she wasn''t believing me.'''
  explanation: 'Swan PEU: Stative verbs (believe, know, want) are not normally used in progressive forms, even in past.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- error: Tense-aspect errors reflect L1-TL functional fit, not just L1 presence/absence (Golden et al. Ch.3)
  explanation: 'Golden et al. (2017) Ch.3 (Helland Gujord): Somali learners of Norwegian (no perfect counterpart) substitute
    preterite ↔ perfect interchangeably. Vietnamese learners (has temporal markers) overuse present perfect in simple past
    contexts. Error patterns differ not by accuracy rate but by error distribution — reflecting how L1 temporal/aspectual
    categories interact with L2 equivalents.'
  l1_groups:
  - Somali
  - Vietnamese
  - Arabic
  - Turkish
  - Hindi
  reliability: C
  source: Golden et al. (2017), Ch. 3
description: Describes completed actions at a specific past time, past habits, or sequence of past events. The most common
  past tense.
dialectal_variation:
- note: 'Some irregular verbs differ: BrE "learnt, dreamt" vs AmE "learned, dreamed". Both acceptable.'
discourse_notes:
- note: Past simple is the primary narrative tense — it moves stories forward.
- note: 'Past simple creates chronological sequencing: "First I woke up. Then I had breakfast."'
- note: In academic writing, past simple is used for describing research methods and results.
- note: 'GB3 (Ch.9) describes a systematic tense-shifting pattern in English narrative: (1) PRESENT PERFECT for scene-setting/orientation,
    (2) PAST PROGRESSIVE for background actions, (3) SIMPLE PAST for main/foregrounded events, (4) PAST PERFECT for flashbacks/events
    before the main timeline. This is a discourse system, not random tense choice. Learners who don''t control this system
    produce narratives that sound ''flat'' (all simple past) or incoherent (random shifting).'
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 9
form:
  affirmative:
    example_generator:
    - I walked to school yesterday.
    - She went to the store.
    - They bought a new car.
    - He ate lunch at noon.
    min_examples: 4
    structure: 'Subject + past tense verb (V2). Regular verbs: V1 + ed. Irregular verbs: must be memorized (go → went, buy
      → bought).'
  negative:
    example_generator:
    - I didn't walk to school.
    - She didn't go to the store.
    - They didn't buy a new car.
    - He didn't eat lunch.
    min_examples: 4
    structure: Subject + did not (didn't) + base verb (V1). The past tense is carried by 'did', so the main verb stays in
      base form.
  questions:
    example_generator:
    - Did you walk to school?
    - Did she go to the store?
    - Did they buy a new car?
    - Did he eat lunch?
    min_examples: 4
    structure: Did + subject + base verb (V1)?
grammar_point: past_simple
level: A1
meaning:
  ccqs:
  - answer: Yes — it started and finished in the past.
    purpose: Tests understanding that after did/didn't, we use base verb form, not past tense
    question: 'Which is correct: ''She didn''t went to school yesterday'' or ''She didn''t go to school yesterday''? Why?'
  - answer: Yes — there is a specific past time (yesterday, last week, in 2020).
    purpose: Tests whether the learner can identify the time markers that signal past simple. Specific past time expressions
      (yesterday, last week, in 2020) are the key lexical signal for this tense.
    question: Do we know exactly when this happened?
  - answer: No — the action is completely in the past.
    purpose: Tests whether the learner understands that past simple verbs are formed with -ed (regular) or have irregular
      forms, and that the verb form does not change for person or number.
    question: Is there a connection to the present moment?
  - answer: It should be 'She didn't go to school yesterday.' After 'didn't' (the past tense auxiliary), the main verb stays
      in its base form, not the past tense. Only the auxiliary 'did' carries the past tense.
    purpose: Tests whether the learner understands that in past simple negative and question forms, the auxiliary 'did' carries
      the past tense and the main verb remains in its base form. This is a very common error -- using 'didn't went' or 'didn't
      ate' instead of 'didn't go' or 'didn't eat'.
    question: What is wrong with this sentence -- 'She didn't went to school yesterday'?
  contrast: '''Past Simple'' = ''I worked yesterday.'' (completed, specific time) vs ''Present Perfect'' = ''I have worked.''
    (no specific time, connection to present)'
  core_meaning: Describes an action that started and finished at a specific time in the past. The action is complete — it
    has no connection to the present moment. Can also describe past habits or a sequence of past events.
  example_generator:
    contexts:
    - completed past actions
    - past habits and routines
    - sequences of events
    - biographies and life stories
    cultural_notes:
    - Use diverse names and cultural contexts
    - Avoid sensitive topics (war, death, trauma)
    - Keep examples age-appropriate
    min_examples: 5
  timeline: 'Specific past time: yesterday, last week, in 2020 → action completed. The time period is finished.'
phonetics:
- example_generator:
  - walked /wɔːkt/ (voiceless /k/ → /t/)
  - played /pleɪd/ (voiced /eɪ/ → /d/)
  - wanted /wɒntɪd/ (/t/ → /ɪd/)
  l1_issue: Portuguese and Spanish speakers often pronounce -ed as a full syllable /ed/ in all cases. Drill the three pronunciations
    explicitly.
  note: '-ed pronunciation: /t/ after voiceless sounds (walked, stopped, cooked), /d/ after voiced sounds (played, lived,
    cleaned), /ɪd/ after /t/ or /d/ sounds (wanted, needed, decided)'
- example_generator:
  - I went / she went / they went (NOT she goes for past)
  l1_issue: Some L1 speakers add -s to third person in the past tense (she goed, he wented). This is a common overgeneralization
    error.
  note: 'Irregular verbs: the past tense form is the same for all persons (I went, you went, he went, she went, we went, they
    went). There is no -s in the third person.'
register_notes:
- note: 'Biber GSWE: Past simple dominates fiction and narrative writing at ~50% of verb phrases. In conversation and academic
    prose, present simple dominates. Speakers switch tenses for discourse purposes, not just time reference.'
  reliability: D
  source: Team observation
  tier: 4
- note: Past simple is neutral in register — used equally in formal and informal contexts.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, past simple is used for describing completed research procedures.
  reliability: D
  source: Team observation
  tier: 4
- note: In news reporting, past simple is the default tense for reporting completed events.
  reliability: D
  source: Team observation
  tier: 4
- note: In storytelling, past simple is the "narrative tense" — it moves the story forward.
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (2021) — Past tense is the dominant tense in fiction (narrative), roughly equal to present in news, and
    less common than present in conversation and academic prose. Ch. 6.2.2
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.2
