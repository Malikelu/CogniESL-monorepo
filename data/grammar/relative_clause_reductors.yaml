common_errors:
- correction: The man I saw yesterday was my friend. (omit pronoun only, no participle reduction)
  error: 'Reducing when the relative pronoun is the object: *''The man I saw yesterday was my friend'' → *''The man seen yesterday
    was my friend'' (incorrect reduction).'
  explanation: Relative clause reduction to a participle is only possible when the relative pronoun is the SUBJECT of the
    clause. When the pronoun is the object (''I saw the man''), you can omit the pronoun but cannot reduce to a participle.
    Only subject relative clauses with ''be'' can be reduced.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Relative clauses'
- correction: The man who lives next door is my friend. (full form — cannot reduce)
  error: 'Reducing a clause without auxiliary ''be'': *''The man who lives next door'' → *''The man living next door'' (incorrect
    — no ''be'' to remove).'
  explanation: Reduction requires the relative clause to contain a form of ''be'' (''who is living'' → ''living''). When the
    relative clause has a simple tense without ''be'' (''who lives''), reduction to a participle is not possible. The pronoun
    can be omitted only if it is the object.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Arabic
  - Hindi
  reliability: D
- correction: The letter written by the manager was clear.
  error: 'Using present participle for passive meaning: *''The letter written by the manager'' → *''The letter writing by
    the manager'' (incorrect).'
  explanation: For passive meaning, the reduced form uses the past participle (''written''), not the present participle (''writing'').
    Using the present participle for passive meaning is grammatically incorrect and changes the meaning to active voice.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: D
description: The process of reducing relative clauses to participial phrases, prepositional phrases, or appositives by omitting
  the relative pronoun and auxiliary verb.
dialectal_variation: []
discourse_notes:
- note: In academic writing, relative clauses are essential for precision and are a marker of proficient writing.
- note: In conversation, defining relative clauses are more common than non-defining.
- note: In formal writing, 'whom' is used for object relative clauses.
form:
  affirmative:
    example_generator:
      contexts:
      - describing people
      - describing objects
      - academic writing
      min_examples: 4
    structure: 'Active reduction: omit relative pronoun + be, keep present participle: ''The woman who lives next door'' →
      ''The woman living next door''. Passive reduction: omit relative pronoun + be, keep past participle: ''The letter that
      was sent yesterday'' → ''The letter sent yesterday''.'
  negative:
    example_generator:
      contexts:
      - exclusions
      - negative descriptions
      - formal writing
      min_examples: 4
    structure: 'Negative reduction: ''The people who do not have tickets'' → ''The people not having tickets.'' / ''The items
      that were not included'' → ''The items not included.'''
  questions:
    example_generator:
      contexts: []
      min_examples: 0
    structure: 'Relative clause reduction is not used in questions. The full relative clause form is retained: ''Is the man
      who is standing there your brother?'' (not reduced in questions).'
grammar_point: relative_clause_reductors
level: C1
meaning:
  ccqs:
  - answer: Yes — if the relative pronoun is the subject and the clause is active (for present participle) or passive (for
      past participle).
    purpose: Tests whether the learner understands the structural conditions under which relative clause reduction is possible
      — specifically that the relative pronoun must be the subject of the clause and the clause must contain a form of ''be''
      as an auxiliary.
    question: Can the relative pronoun and auxiliary be removed without changing the meaning?
  - answer: The reduced form is typically more formal and concise.
    purpose: Tests whether the learner is aware of the register implications of relative clause reduction — that reduced forms
      are characteristic of formal, academic, and literary writing, and are less common in casual speech.
    question: Is the reduced form more formal or less formal than the full relative clause?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with relative clause reductors and explain why
      they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: No, we cannot. The relative clause 'who lives next door' has a simple present tense verb ('lives') without an
      auxiliary 'be', so it cannot be reduced to a participle. Reduction is only possible when the relative pronoun is the
      subject AND the clause contains a form of 'be' (e.g., 'who is living' → 'living', 'which was written' → 'written').
    purpose: Tests whether the learner knows the precise structural conditions for relative clause reduction. A clause can
      only be reduced to a participle when the relative pronoun is the subject and the verb phrase contains a form of 'be'
      (progressive aspect for present participle reduction, passive voice for past participle reduction). Clauses with simple
      tenses and no auxiliary 'be' cannot be reduced this way.
    question: Can we reduce 'The man who lives next door is friendly' to 'The man living next door is friendly'?
  contrast: 'Full relative clause: "The man who is standing by the door is my uncle."

    Reduced: "The man standing by the door is my uncle."

    Full: "The book that was published last year became a bestseller."

    Reduced: "The book published last year became a bestseller."

    '
  core_meaning: Relative clause reduction is the process of shortening a relative clause by removing the relative pronoun
    (who, which, that) and any auxiliary verb, leaving a participial phrase or other reduced form. This creates more concise,
    formal-sounding sentences. The reduction is only possible when the relative pronoun is the subject of the relative clause.
  example_generator:
    contexts:
    - academic writing
    - formal reports
    - news articles
    - legal documents
    - literary prose
    cultural_notes:
    - Relative clause reduction is a hallmark of formal written English
    - Overuse can make text dense and difficult to read — balance is important
    min_examples: 5
  timeline: Timeless — reduction can be applied to relative clauses in any tense.
phonetics:
- example_generator:
    contexts:
    - reading aloud
    - formal speech
  l1_issue: Learners may not recognise reduced relative clauses in reading, parsing them as main verbs instead of modifiers.
  note: 'Reduced relative clauses are spoken without a pause where the relative pronoun would have been: ''The man standing
    by the door'' flows as one phrase. The participle takes its normal stress pattern.'
