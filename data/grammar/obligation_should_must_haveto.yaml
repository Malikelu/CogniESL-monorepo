description: Comparing and contrasting should (advice), must (strong obligation), and have to (external obligation) to express
  different degrees of necessity.
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission: ''All passengers must wear seatbelts.'''
form:
  affirmative:
    example_generator:
      contexts:
      - giving advice
      - expressing obligation
      - stating rules
      min_examples: 4
    structure: 'Should: Subject + should + base verb — "You should study more." Must: Subject + must + base verb — "You must
      study more." Have to: Subject + have/has to + base verb — "You have to study more." All three are followed by the base
      form of the verb (no -s, no to).'
  negative:
    example_generator:
      contexts:
      - negative advice
      - prohibitions
      - lack of obligation
      min_examples: 3
    structure: 'Should not (shouldn''t): Subject + shouldn''t + base verb — "You shouldn''t eat so much sugar." Must not (mustn''t):
      Subject + mustn''t + base verb — "You mustn''t touch that." Don''t have to: Subject + don''t/doesn''t have to + base
      verb — "You don''t have to pay now."'
  questions:
    example_generator:
      contexts:
      - asking for advice
      - checking obligations
      - clarifying rules
      min_examples: 3
    structure: 'Should: Should + subject + base verb? — "Should I see a doctor?" Must: Must + subject + base verb? — "Must
      I finish this today?" Have to: Do/Does + subject + have to + base verb? — "Do I have to finish this today?"'
grammar_point: obligation_should_must_haveto
level: A2
meaning:
  ccqs:
  - answer: No. You are giving advice. It is a recommendation, not a requirement.
    purpose: 'Tests whether the learner understands the three-way distinction: should (advice), must (strong obligation),
      have to (external requirement). All three express obligation but with different sources and strengths.'
    question: If I say 'You should see a doctor,' am I forcing the person?
  - answer: Yes. "Must" shows strong obligation — the speaker believes it is very important or necessary.
    purpose: Tests understanding of obligation_should_must_haveto.
    question: If I say 'You must see a doctor,' is it stronger than 'should'?
  - answer: It could be an external reason — perhaps the clinic requires it, or your boss insists. The obligation comes from
      outside.
    purpose: Tests understanding of obligation_should_must_haveto.
    question: If I say 'I have to see a doctor,' who is making me go?
  - answer: '"Must not" means parking is forbidden. "Don''t have to" means parking is optional — you can park elsewhere if
      you prefer.'
    purpose: Tests understanding of obligation_should_must_haveto.
    question: Can you explain the difference between 'You must not park here' and 'You don't have to park here' by giving
      an example of when to use each?
  contrast: 'Should (advice): "You should eat more vegetables." (It would be a good idea, but it is your choice.)

    Have to (external rule): "I have to wear a uniform." (The company requires it; I have no choice.)

    Must (strong obligation): "You must stop at a red light." (It is essential — a law or a moral duty.)

    No obligation: "You don''t have to come if you don''t want to." (It is optional.)

    '
  core_meaning: '"Should" expresses advice or recommendation — it is a good idea, but there is no requirement. "Must" expresses
    strong obligation — it is necessary and the speaker feels strongly about it. "Have to" expresses external obligation —
    a rule, law, or another person requires it. The strength increases: should < have to < must.'
  example_generator:
    contexts:
    - health advice
    - workplace rules
    - travel requirements
    - everyday recommendations
    - legal obligations
    cultural_notes:
    - 'In British English, "should" is very commonly used for polite advice: "You should try the fish." It is softer than
      "must" and less direct. In many cultures, direct advice can sound rude, so "should" is a useful softening device.'
    - Learners often confuse "must" and "should" because both can translate to the same word in their L1. Emphasise the strength
      difference with clear contexts.
    min_examples: 5
  timeline: 'All three can express present or future meaning: "You should rest." / "You have to rest." / "You must rest."
    For past advice, use "should have + past participle": "You should have rested." For past obligation, use "had to": "I
    had to work."'
phonetics:
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may over-pronounce "should" as /ʃuːld/ with a full vowel. Drill the reduced form in natural sentences.
  note: '"Should" is pronounced /ʃʊd/ in its strong form but is often reduced to /ʃəd/ or even /ʃd/ in connected speech: "You
    should go" /ju ʃəd ɡəʊ/. "Shouldn''t" is pronounced /ˈʃʊdənt/.'
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may drop the /t/ in "mustn't," making it sound like "musn't." Practice the full pronunciation.
  note: '"Must" in connected speech: /məs/ — "You must try it" /ju məs traɪ ɪt/. "Mustn''t" is /ˈmʌsənt/ with a clear /t/
    at the end.'
register_notes:
- note: 'In conversation, modals are essential for politeness: ''Could you pass the salt?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal language, ''must'' expresses strong obligation: ''All passengers must wear seatbelts.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Obligation modals (''should'', ''must'', ''have to''): register distribution varies significantly.
    Conversation favors ''have to''; formal/academic writing favors ''must'' and ''should''. Ch. 6.6.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6.2
- note: 'Biber et al. (2021) — Obligation modals and semi-modals: conversation favors ''have to''; formal/academic writing
    favors ''must'' and ''should''. Register choice signals formality level. Ch. 6.6.2, 6.6.4.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6.2
