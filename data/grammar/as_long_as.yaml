grammar_point: as_long_as
level: B2
meaning:
  ccqs:
  - answer: No. The condition is arriving on time. If you arrive late, we will not leave.
    purpose: Tests understanding that as long as sets a necessary condition
    question: As long as you arrive on time, we will leave. Will we leave if you arrive late?
  - answer: No. The speaker is saying since you are already here, you should help. The person is already present.
    purpose: Tests understanding of the since meaning of as long as
    question: As long as you are here, help me set the table. Is the speaker asking the person to leave?
  - answer: No. The condition is driving carefully. If you do not drive carefully, you cannot borrow the car.
    purpose: Tests understanding that breaking the condition removes the result
    question: You can borrow my car as long as you drive carefully. Can you drive fast?
  - answer: 'No. In the first sentence, as long as refers to duration (for the entire time you need me). In the second sentence,
      as long as sets a condition (on the condition that you pay me). Context determines which meaning is intended: when the
      main clause describes a continuous state, it is duration; when it describes a contingent action, it is a conditional.'
    purpose: 'Tests whether the learner can distinguish between the two meanings of as long as: duration (how long something
      lasts) versus condition (on the condition that). This dual meaning is unique to this expression and learners who only
      know one sense may misinterpret sentences that use the other.'
    question: I will stay as long as you need me versus I will stay as long as you pay me -- does as long as mean the same
      thing in both sentences?
  contrast: 'As long as = Positive condition: "As long as you study, you pass" (if you study)

    Provided that = Formal positive condition: "Provided that you study, you pass" (stricter)

    Since = Cause: "As long as you''re here, help me" (since you''re here)

    '
  core_meaning: Sets a positive condition that must be met for the main action to happen; also means since (cause).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Used in first conditional (future) and zero conditional (general truths).
phonetics:
- example_generator:
    contexts:
    - connected speech
