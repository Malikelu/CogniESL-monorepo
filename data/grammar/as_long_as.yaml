register_notes:
- note: '''As long as'' is neutral in register. In formal writing, ''provided that'' may be preferred.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — ''As long as'' as conditional connector: formal conditional connectors are more common in academic
    prose and news; conversation uses simpler alternatives (''if''). Ch. 10.2.8'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.8
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - As long as it rains, we will stay. (correct)
  - As long as it will rain, we will stay. (incorrect)
  explanation: Like if and unless, as long as uses present tense to refer to future conditions.
  rule: Do NOT use will after as long as — use present tense for future meaning
  type: grammar
- examples:
  - As long as you study, you will pass. Means the same as On the condition that you study, you will pass.
  - You can go as long as you are back by 10. Means the same as You can go on the condition that you are back by 10.
  explanation: The main clause result only happens if the condition is met. It is a strong condition.
  rule: As long as means on the condition that (positive condition)
  type: meaning
- examples:
  - As long as you are here, you might as well help. (since you are here)
  - As long as we are on the topic, let me ask you something. (since we are on the topic)
  explanation: When the condition is already true, as long as means since — the speaker uses the existing situation.
  rule: As long as can also mean since or given that
  type: meaning
- examples:
  - As long as you pay on time, we will hold your booking. (neutral)
  - Provided that you pay on time, we shall hold your booking. (formal/business)
  explanation: Both mean the same thing, but provided that is preferred in formal writing and contracts.
  rule: Provided that is more formal than as long as
  type: register
- examples:
  - You can stay as long as you want. (duration — for any length of time)
  - I will help you for as long as it takes. (duration — until it is done)
  explanation: 'As long as has two uses: condition (on the condition that) and duration (for the length of time). Context
    determines the meaning.'
  rule: As long as can also refer to duration (length of time)
  type: usage
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students role-play negotiations using ''as long as'': ''I will help you as long as you promise to study.''
      ''I will lend you my car as long as you return it by 5pm.'''
    duration: 15
    name: Condition Negotiation Role-Play
  - adaptation_notes: 'Students rewrite sentences using both structures: ''As long as you study, you will pass'' = ''Unless
      you study, you will not pass.'' Discuss the meaning equivalence.'
    duration: 10
    name: As Long As vs Unless Contrast
  - adaptation_notes: 'Students identify whether ''as long as'' expresses a condition or a duration: ''I will stay as long
      as you need me'' (duration) vs ''I will stay as long as you pay me'' (condition).'
    duration: 10
    name: Duration or Condition?
  tips:
  - 'Contrast with provided that for formality: as long as (neutral) vs provided that (formal).'
  - 'Practice with since meaning: As long as you are here, help me.'
  - 'Role-play: Student sets positive conditions using as long as.'
  - Explain no future tense after as long as.
  - 'Swan PEU: ''As long as'' = condition — ''As long as you promise to be careful, you can go.'' Similar to ''provided that.''
    Emphasizes the requirement. Informal compared to ''provided/providing that.'''
title: As long as (positive condition)
use:
- description: Set positive conditions for future actions.
  examples:
  - As long as you arrive on time, we will leave.
  - I will sign as long as you read the terms.
  key_point: As long as + present simple, will + verb.
  name: First Conditional (Positive Conditions)
- description: Set positive conditions for general truths/habits.
  examples:
  - Plants grow as long as you water them.
  - I go out as long as it is sunny.
  key_point: As long as + present simple, present simple.
  name: Zero Conditional (General Truths)
- description: Means since (because you are already in a state).
  examples:
  - As long as you are here, help me.
  - As long as we are talking, tell me about it.
  key_point: Means since in casual speech.
  name: Cause (Since)
