common_errors:
- correction: I saw her.
  error: 'Using subject pronouns as objects: *''I saw she.'''
  explanation: Use object pronouns (me, you, him, her, it, us, them) after verbs and prepositions.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: John and I went.
  error: 'Confusing ''I'' and ''me'': *''Me and John went.'''
  explanation: Use subject pronouns (I, you, he, she, we, they) as the subject of a sentence.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
description: 'Pronouns that replace the object of a sentence: me, you, him, her, it, us, them.'
dialectal_variation:
- note: 'In informal speech, ''me'' is sometimes used as subject: ''Me and him went.'' (non-standard)'
discourse_notes:
- note: 'In conversation, object pronouns avoid repetition: ''I saw John. I spoke to him.'''
- note: 'In academic writing, object pronouns create cohesion: ''The participants were interviewed. They were asked about
    their experiences.'''
- note: 'In informal speech, object pronouns are common in phrasal verbs: ''Pick it up.'' ''Throw them away.'''
