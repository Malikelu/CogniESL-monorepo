grammar_point: object_pronouns
level: A1
meaning:
  ccqs:
  - answer: Yes — the object pronoun is the receiver of the action.
    purpose: Tests whether the learner can identify the object of a sentence and choose the correct object pronoun (me, you,
      him, her, it, us, them).
    question: Does the pronoun receive the action in this sentence?
  - answer: After the verb (or after a preposition).
    purpose: Tests whether the learner understands that object pronouns follow the verb or preposition, unlike subject pronouns
      which precede the verb.
    question: Does the pronoun come before or after the verb?
  - answer: Object position — the pronoun receives the action.
    purpose: Tests whether the learner can distinguish subject position (before verb) from object position and choose the
      correct pronoun form.
    question: Is this a subject or object position?
  - answer: After a preposition ('to'), we must use object pronouns (him, her, them, us), not subject pronouns (he, she, they,
      we). 'Him' is the object form required after the preposition 'to.'
    purpose: Tests whether the learner understands that object pronouns must be used after prepositions, not just after verbs.
      Many learners correctly use object pronouns after verbs but forget this rule when a preposition is involved.
    question: In the sentence 'She gave it to him,' why can we not say 'She gave it to he'?
  contrast: '''Subject pronoun'' = ''I see her.'' (I do the action) vs ''Object pronoun'' = ''She sees me.'' (I receive the
    action)'
  core_meaning: Object pronouns receive the action of the verb. They come after the verb or preposition.
  example_generator:
    contexts:
    - daily activities
    - interactions
    - requests
    - describing relationships
    cultural_notes: []
    min_examples: 5
  timeline: Timeless — applies to all tenses.
phonetics:
- contexts:
  - connected speech
  example_generator:
    contexts:
    - connected speech
  l1_issue: Some L1 speakers use subject pronouns in object position
  note: 'Weak forms: /hiːm/ → /ɪm/ (him), /hɜːr/ → /ər/ (her)'
register_notes:
- note: Object pronouns are neutral in register.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, ''whom'' is used as an object pronoun: ''The candidate whom we interviewed was impressive.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, ''who'' often replaces ''whom'': ''Who did you see?'' (informal)'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Object pronoun use: much higher in conversation than academic prose. Academic prose avoids
    pronouns in favor of full noun phrases for explicitness. Pronoun density is one of the strongest conversation vs. writing
    discriminators. Ch. 4.1.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 4.1.2
