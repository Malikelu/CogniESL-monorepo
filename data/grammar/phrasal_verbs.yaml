  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch.
    5: Phrasal verbs and multi-word verbs (register distribution)'
  tier: 1
- claim: 'Discourse function: Phrasal verbs in conversation serve as informal alternatives
