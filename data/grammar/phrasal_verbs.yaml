citations:
- claim: 'Core meaning: A phrasal verb is a verb + particle (preposition or adverb)
    that together have a meaning different from the individual words. The meaning
    is often idiomatic — you cannot guess it from the parts.'
  reliability: B
  source: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch.
