sub_rules:
- examples:
  - He said (that) he was tired.
  - She believed (that) it was true.
  - They reported (that) the situation was improving.
  rule: 'Category 1: Verb + (that) + clause (say, think, believe, report, claim, state, argue, explain, mention, notice, realize,
    suggest)'
  type: grammatical
- examples:
  - She told me (that) she was leaving.
  - He informed us (that) the meeting was cancelled.
  - They warned us (that) it was dangerous.
  rule: 'Category 2: Verb + object + (that) + clause (tell, inform, remind, warn, assure, convince, persuade)'
  type: grammatical
- examples:
  - He agreed to help.
  - She promised to call.
  - They refused to pay.
  - He offered to drive.
  rule: 'Category 3: Verb + to-infinitive (agree, promise, refuse, offer, decide, hope, plan, threaten, demand, claim)'
  type: grammatical
- examples:
  - She asked me to help.
  - He told me to wait.
  - They ordered us to leave.
  - She advised me to study more.
  rule: 'Category 4: Verb + object + to-infinitive (ask, tell, order, advise, invite, allow, encourage, warn, instruct, persuade)'
  type: grammatical
- examples:
  - He suggested going to the cinema.
  - She recommended reading this book.
  - He denied stealing the money.
  - She admitted making a mistake.
  rule: 'Category 5: Verb + gerund (suggest, recommend, deny, admit, avoid, enjoy, finish, imagine, mind, practice)'
  type: grammatical
teaching:
  methodology: Categorization and pattern recognition
  recommended_activities:
  - adaptation_notes: Give students a list of 20 reporting verbs. They categorize them into 5 groups based on their grammatical
      structure. Then check as a class.
    duration: 10
    name: Reporting Verb Categorization
  - adaptation_notes: 'Show real news headlines. Students rewrite them using different reporting verbs: ''The president says...''
      → ''The president claims/argues/states...'' Practices formal reporting.'
    duration: 15
    name: News Headline Reporting
  - adaptation_notes: 'Give students direct speech. They rewrite using appropriate reporting verbs: ''I will help you.'' →
      He promised to help. ''Don''t touch that!'' → She warned me not to touch it.'
    duration: 15
    name: Direct to Reported
  - adaptation_notes: 'Students choose the correct structure: ''He suggested ___ (to go/going).'' ''She asked me ___ (to help/helping).''
      Practices the 5 categories.'
    duration: 10
    name: Verb Structure Quiz
  tips:
  - Teach reporting verbs in 5 categories based on their grammatical structure. This makes the patterns clear and memorable.
  - Create a reference list of common reporting verbs with their structures. Students should keep this as a study aid.
  - 'Practice matching verbs to contexts: formal academic writing (state, argue, claim) vs casual conversation (say, tell).'
  - Drill the difference between 'suggest going' (gerund) and 'suggest that...' (that-clause). This is a common error.
  - 'Use news headlines as authentic examples: ''The president claims that...'' ''Scientists report that...'''
  - 'Swan PEU: ''Say'' vs ''tell'' — ''say'' does NOT take indirect object: ''She said that...'' ''She said to me that...''
    BUT ''tell'' requires indirect object: ''She told me that...'' Common error: ''She said me'' is wrong.'
  - 'Swan PEU: ''Whether'' for indirect questions — same function as ''if'' for yes/no questions. ''Whether'' is slightly
    more formal. ''Whether or not'' is emphatic: ''I don''t know whether or not he''ll come.'''
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'REPORTING VERB COMPLEMENT PATTERNS: Each reporting verb has specific complementation: say requires to + indirect object
    (''She said TO me that...'' NOT *''She said me that...''); tell requires indirect object but no to (''She told me that...'');
    inform requires that-clause, NOT infinitive (*''informed them to go'' → ''informed them that...''); ask takes if/whether
    for yes/no questions and wh- for information questions. Source: Ch.24 p.452-458.'
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'SAY vs. TELL vs. ASK complement patterns: say + to + recipient (''She said TO me that...''). Tell + recipient without
    to (''She told me that...''). Ask + if/whether (yes/no Q) or wh-word. Inform + that-clause ONLY (*''informed them to go'').
    Tell does not take to + recipient (*''tell to me''). Source: Ch.24 p.452-458.'
title: Reporting Verbs (Beyond Say and Tell)
use:
- context: Speech reporting with nuance
  description: Reporting what someone said with specific meaning about their intent
  examples:
  - He admitted that he had made a mistake.
  - She promised to call me the next day.
  - They refused to accept the offer.
  - He threatened to call the police.
  - She offered to help with the project.
- context: Thought and opinion reporting
  description: Reporting what someone thinks or believes
  examples:
  - I think that this is a good idea.
  - They believe the project will succeed.
  - She argued that the policy was unfair.
  - He claimed that he had been at home all evening.
- context: Formal and academic reporting
  description: Using formal reporting verbs in professional or academic contexts
  examples:
  - The study states that climate change is accelerating.
  - Smith (2020) argues that this theory is correct.
  - The report claims that unemployment is falling.
  - The authors suggest that further research is needed.
- context: Requests and commands
  description: Reporting requests, orders, and advice
  examples:
  - She asked me to help with the project.
  - He told the students to be quiet.
  - The doctor advised him to exercise more.
  - They invited us to the party.
  - She warned me not to go alone.
