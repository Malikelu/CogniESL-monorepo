common_errors:
- correction: He suggested going. / He suggested that we go.
  error: 'Using wrong structure after reporting verb: *''He suggested to go.'''
  explanation: '''Suggest'' takes a gerund or a that-clause, NOT a to-infinitive. Many learners incorrectly pair it with the
    infinitive because other reporting verbs (like ''agree'' or ''promise'') take the infinitive.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: He told me that he was tired. / He said that he was tired.
  error: 'Using ''say'' with object + that-clause: *''He said me that he was tired.'''
  explanation: '''Say'' cannot take a direct object before a that-clause. Use ''tell'' when the person being addressed is
    specified. This is one of the most common reporting verb errors.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: D
- correction: She asked me to help.
  error: 'Using gerund after Category 4 verbs: *''She asked me helping.'''
  explanation: '''Ask'' is a Category 4 verb (object + to-infinitive), not a gerund verb. Using a gerund after ''ask'' is
    ungrammatical. Learners often confuse Category 4 and Category 5 patterns.'
  l1_groups:
  - Portuguese
  - Spanish
  - Korean
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Gerunds and infinitives'
description: Verbs used to report what someone said, thought, or felt, with different grammatical structures depending on
  the verb's meaning and register. More precise and formal than 'say' and 'tell'.
dialectal_variation: []
discourse_notes: []
example_generator:
  contexts:
  - everyday conversations
  - news reports
  - academic writing
  - workplace communication
  - legal contexts
  cultural_notes:
  - Formal reporting verbs (state, argue, claim) are common in academic writing and news reports
  - Informal reporting verbs (say, tell) are more common in everyday conversation
  - Some reporting verbs have cultural implications (admit, deny, claim)
  min_examples: 5
form:
  affirmative:
    example_generator:
    - He said (that) he was tired. (Category 1)
    - She told me (that) she was leaving. (Category 2)
    - He promised to help. (Category 3)
    - She asked me to help. (Category 4)
    - He suggested going to the cinema. (Category 5)
    min_examples: 4
    structure: 'Category 1: Verb + (that) + clause / Category 5: Verb + gerund'
  negative:
    example_generator:
    - He said (that) he wasn't tired.
    - She told me (that) she wasn't leaving.
    - He refused to help.
    - She asked me not to tell anyone.
    - He denied stealing the money.
    min_examples: 4
    structure: Verb + not + (structure) depending on category
  questions:
    example_generator:
    - He asked if I was tired.
    - She asked me whether I wanted to come.
    - He wanted to know what I thought.
    min_examples: 4
    structure: Verb + if/whether/wh-word + (structure) depending on category
grammar_point: reporting_verbs
level: B2
meaning:
  ccqs:
  - answer: The verb adds meaning — it tells us whether the speaker was promising, refusing, suggesting, admitting, etc.
    purpose: Tests whether the learner understands that reporting verbs are not just alternatives for 'say' but carry specific
      meaning about the speaker's intention, attitude, or the speech act being performed.
    question: Is this a neutral report, or does the verb add meaning about the speaker's intent?
  - answer: 'It depends on the verb: that-clause, to-infinitive, gerund, or object + to-infinitive. Each verb has its own
      pattern.'
    purpose: Tests whether the learner knows that different reporting verbs require different syntactic patterns after them,
      which is a common source of errors at B2 level.
    question: What grammatical structure follows this reporting verb?
  - answer: Some reporting verbs are formal (state, argue, claim) and others are neutral (say, tell). Choose based on context.
    purpose: Tests the learner's awareness of the register of reporting verbs, helping them select the appropriate verb for
      the context (formal writing vs casual conversation).
    question: Is this verb formal or informal?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with reporting verbs. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: '''Say'' = neutral, general reporting (He said that...) vs ''Promise'' = commitment (He promised to...) vs ''Suggest''
    = proposal (He suggested going...) vs ''Admit'' = confession (He admitted that...)'
  core_meaning: Reporting verbs convey not just WHAT was said, but HOW and WHY it was said. Each verb carries a specific nuance
    — whether the speaker is promising, refusing, suggesting, admitting, etc. The grammatical structure changes depending
    on the verb (that-clause, to-infinitive, gerund, etc.).
  timeline: 'Follows standard tense rules: reporting verb tense determines the tense of the following clause (backshift for
    past reporting verbs).'
phonetics:
- example_generator:
  - report /rɪˈpɔːt/
  - suggest /səˈdʒest/
  - recommend /rekəˈmend/
  l1_issue: Portuguese speakers may stress the wrong syllable in multi-syllable reporting verbs. Drill correct stress patterns.
  note: 'Many reporting verbs have stress on the second syllable: re''PORT, sug''GEST, re''COMMEND, a''DMIT, de''NY, a''GREE,
    pro''MISE, re''FUSE.'
- example_generator:
  - that /ðət/
  l1_issue: Many L1 speakers over-pronounce 'that' as /ðæt/. Teach the weak form for natural speech.
  note: 'Weak form of ''that'' in reported speech: /ðət/. ''He said that he was tired'' sounds like /hiː sed ðət hiː wəz taɪəd/.'
register_notes:
- note: Formal reporting verbs (state, argue, claim) are preferred in academic and journalistic writing.
  reliability: D
  source: Team observation
  tier: 4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
