teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Give students a list of 20 verbs and adjectives. In pairs, they race to write the correct nominal form
      for each one. Check answers and discuss spelling changes.
    duration: 15
    name: Word-formation race
  - adaptation_notes: Provide a short informal paragraph. Students rewrite it in a formal academic style using nominalizations.
      Compare versions and discuss the effect on tone.
    duration: 20
    name: Style transformation
  - adaptation_notes: Students read a short academic text and highlight every nominalization. They categorise each one by
      suffix (-tion, -ment, -ness, etc.) and identify the original verb or adjective.
    duration: 15
    name: Nominalization hunt
  - adaptation_notes: Students write a short academic paragraph (80-100 words) on a given topic, using at least six different
      nominalizations. Peer review for appropriate use and variety.
    duration: 25
    name: Academic paragraph writing
  tips:
  - Start with a paragraph written in a verbal style. Ask students to identify the main actions and transform them into nominalizations.
    Compare the two versions for tone and formality.
  - 'Create a word-formation table: verb → noun, adjective → noun. Have students complete it as a vocabulary-building exercise.'
  - Use authentic academic texts (journal abstracts, news articles) and ask students to highlight all nominalizations. Discuss
    why the author chose this style.
  - 'Practice transforming verbal sentences into nominal ones: ''The company expanded rapidly'' → ''The rapid expansion of
    the company...'''
  - Warn students about overuse — too much nominalization makes writing heavy and difficult to follow. Balance is key.
  - 'Swan PEU: Nominalization — turning verbs/adjectives into nouns: discover → discovery, develop → development, intelligent
    → intelligence. Academic writing uses more nominalizations: ''The destruction of the city'' vs ''The city was destroyed.'''
title: 'Nominalization (Verb/Adjective → Noun: the discovery of, the importance of)'
use:
- context: Academic writing
  description: Nominalization is a defining feature of academic discourse, allowing writers to present ideas objectively and
    concisely.
  examples:
  - The implementation of the new policy led to significant improvements.
  - The study examined the relationship between education and economic development.
  - Further research is needed to determine the effectiveness of the treatment.
- context: Scientific papers
  description: Scientists use nominalization to describe processes and findings in an impersonal, objective way.
  examples:
  - The observation of the phenomenon was recorded over a period of six months.
  - The analysis of the data revealed a statistically significant correlation.
  - The development of the vaccine took approximately eighteen months.
- context: News reports and journalism
  description: News writing uses nominalization to report events concisely and objectively.
  examples:
  - The announcement of the merger surprised investors.
  - The investigation into the allegations is ongoing.
  - The destruction of the rainforest has accelerated in recent years.
- context: Business and professional communication
  description: Business reports and professional documents use formal nominal style.
  examples:
  - The management has approved the expansion of operations into new markets.
  - The completion of the project is scheduled for March.
  - A review of the company's performance revealed several areas for improvement.
- context: Legal language
  description: Legal documents rely heavily on nominalization for precision and formality.
  examples:
  - The breach of contract resulted in legal proceedings.
  - The enforcement of the regulation is the responsibility of the local authority.
  - The determination of liability will depend on the evidence presented.
