grammar_point: reported_questions
level: B1
meaning:
  ccqs:
  - answer: No. Reported questions use statement word order.
    purpose: Tests whether the learner understands that reported questions lose subject-auxiliary inversion and become statement-ordered
      clauses, which is the most critical structural change from direct to reported questions.
    question: Do we use question word order in reported questions
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that reported questions is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with reported questions and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: No. In reported questions, the word order must be statement order (subject before verb), not question order. The
      correct form is 'She asked me where I was going'. The auxiliary 'was' does not invert with the subject. Reported questions
      are statements about a question, so they follow normal subject + verb word order.
    purpose: Tests whether the learner understands that reported questions must always use statement word order, never question
      inversion. This is the most critical structural rule for reported questions — learners frequently retain the inverted
      word order of the direct question (where was I going) instead of switching to statement order (where I was going), which
      is one of the most common reported speech errors at B1 level.
    question: Is 'She asked me where was I going' a correct reported question?
  contrast: 'Direct question: ''Where are you going?'' (inverted, question mark) Reported question: He asked where I was going
    (no inversion, no question mark) ''Say'' is used for statements; ''ask''/''inquire'' is used for questions. '
  core_meaning: Reports a question that was asked in the past, paraphrasing the original question without using its exact
    words or question structure.
  timeline: 'Same backshift rules as reported statements: tenses shift to past relative to the past reporting verb.'
phonetics:
- example_generator:
    contexts:
    - reported question intonation
  l1_issue: Many L1 speakers use rising intonation for reported questions. Teach falling intonation — they are statements,
    not questions.
  note: 'Reported questions typically have falling intonation (not rising like direct questions): ''He asked where I lived
    ↘'' NOT ''He asked where I lived ↗.'''
