common_errors:
- correction: He asked where I lived.
  error: 'Keeping question word order in reported questions: *''He asked where did I live.'''
  explanation: Reported questions use statement word order (subject before verb), not question word order. The auxiliary 'did'
    is removed and the verb takes the appropriate past tense form.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Word order'
- correction: He asked if/whether I was hungry.
  error: 'Using ''that'' instead of ''if/whether'' for yes/no questions: *''He asked that I was hungry.'''
  explanation: Yes/no questions in reported speech require 'if' or 'whether', not 'that'. 'That' is used for reported statements,
    not questions.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: He asked where I lived.
  error: 'Forgetting tense backshift: *''He asked where I live.'''
  explanation: When the reporting verb is in the past tense, the verb in the reported clause must be backshifted. Present
    simple becomes past simple.
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Reported speech'
description: A structure to paraphrase questions someone asked in the past, with tense backshifting and no question inversion
  or question marks.
