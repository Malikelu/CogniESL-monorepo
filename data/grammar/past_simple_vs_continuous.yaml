common_errors:
- correction: I went to the store yesterday.
  error: '*I was going to the store yesterday.* (single completed trip)'
  explanation: Past simple is for completed actions. Past continuous is for actions
    in progress at a specific past moment. 'Yesterday' with a single trip requires
    past simple.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: 'Two past tenses with different uses: Past Simple for completed actions,
  Past Continuous for ongoing actions in the past. Essential for telling stories and
  describing past events.'
dialectal_variation: []
discourse_notes:
- note: In conversation, past simple and past continuous are among the most frequent
    tense-aspect patterns. Past continuous provides narrative backgrounding; past
    simple reports main events (Biber et al. 1999, Ch. 6.2-6.3).
- note: In academic writing, past simple dominates in methodology and findings sections.
    Past continuous is rare outside of narrative examples.
- note: In news reports, past simple is standard for reporting events. Past continuous
    appears in eyewitness accounts and scene-setting.
form:
  affirmative:
    example_generator:
      contexts:
      - food and daily routines
      - entertainment and media
      min_examples: 4
    structure: 'Past Simple: Subject + V2 (ed): "I walked. She ate."

      Past Continuous: Subject + was/were + V-ing: "I was walking. She was eating."

      '
  negative:
    example_generator:
      contexts:
      - food and daily routines
      - entertainment and media
      min_examples: 4
    structure: 'Past Simple: Subject + didn''t + V1: "I didn''t walk."

      Past Continuous: Subject + wasn''t/weren''t + V-ing: "I wasn''t walking."

      '
  questions:
    example_generator:
      contexts:
      - food and daily routines
      - entertainment and media
      min_examples: 4
    structure: 'Past Simple: Did + subject + V1: "Did you walk?"

      Past Continuous: Was/Were + subject + V-ing: "Were you walking?"

      '
grammar_point: past_simple_vs_continuous
level: A2
meaning:
  ccqs:
  - answer: Past simple. Past continuous describes actions in progress.
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
    purpose: Tests whether the learner can distinguish between the fundamental function
      of past simple (completed actions) and past continuous (ongoing actions) in
      a narrative context.
    question: Which tense describes a completed past action
  - answer: No — changing the structure would change the meaning or make the sentence
      ungrammatical.
    purpose: Tests whether the learner understands that past simple vs continuous
      is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with
      past simple vs continuous and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: No. Verbs like 'know', 'believe', 'belong', 'love', 'hate', and 'understand'
      are stative verbs. They describe states, not actions, and are not normally used
      in continuous forms. We say 'I knew the answer', not 'I was knowing the answer'.
    purpose: Tests whether the learner understands that stative verbs (know, believe,
      belong, love, hate, understand, want, need) are not normally used in continuous
      tenses. This is a common error because some languages allow equivalent expressions
      in continuous forms, and learners must know which verbs are excluded from progressive
      aspect in English.
    question: Can we use past continuous with stative verbs like 'know', 'believe',
      or 'belong' -- for example, 'I was knowing the answer'?
  contrast: '''Past Simple'' = "I ate dinner (finished)."

    ''Past Continuous'' = "I was eating dinner (in progress, not finished)."

    '
  core_meaning: Past Simple = finished action in the past. Past Continuous = action
    in progress at a past moment.
  timeline: 'Past Simple: completed point in the past. Past Continuous: ongoing period
    in the past.'
phonetics:
- example_generator:
    contexts:
    - past continuous weak forms
  l1_issue: Portuguese and Spanish speakers often use past simple where English requires
    past continuous. Teach the distinction.
  note: 'Past continuous often uses weak forms: ''I was eating'' → /aɪ wəz iːtɪŋ/.
    The was is reduced to /wəz/.'
register_notes:
- note: 'Biber et al. (1999) — Past simple vs. past continuous: fiction uses more
    past continuous for narrative backgrounding; conversation uses both for different
    aspectual meanings. Ch. 6.2.2, 6.3.1'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.2.2
