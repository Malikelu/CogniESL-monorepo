common_errors:
- correction: Although it was raining, we went out.
  error: '*Although it was raining but we went out.*'
  explanation: English does not use 'although' and 'but' together. Use one or the other.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: It was raining. However, we went out.
  error: 'Using ''however'' with comma splice: *''It was raining, however, we went out.'''
  explanation: 'Swan PEU: "However" is a conjunctive adverb, not a conjunction. It cannot join two independent clauses with
    just a comma. Use a period or semicolon.'
  l1_groups: &id001
  - Portuguese
  - Spanish
  - French
  - French
  reliability: B
  source: Swan Entry 75. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: Despite the rain, we went out.
  error: 'Using ''despite'' + clause: *''Despite it was raining, we went out.'''
  explanation: 'Swan PEU: "Despite" and "in spite of" are prepositions. They must be followed by a noun or gerund, NOT a clause.
    For clauses, use "although".'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 75. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: Because it was raining, we stayed.
  error: 'Using ''because of'' + clause: *''Because of it was raining, we stayed.'''
  explanation: 'Swan PEU: "Because of" is a preposition (takes noun). "Because" is a conjunction (takes clause). Use the right
    one for the structure.'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 75. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: It was expensive. However, I bought it.
  error: 'Using ''on the contrary'' for contrast: *''It was expensive. On the contrary, I bought it.'''
  explanation: 'Swan PEU: "On the contrary" means "the opposite is true", not "despite that". "It was not expensive — on the
    contrary, it was very cheap."'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - French
  - German
  reliability: B
  source: Swan Entry 75. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Connectors that express contrast and concession between clauses, including subordinating conjunctions, conjunctive
  adverbs, and prepositions.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - weather and nature
      - personal experiences
      - travel stories
      min_examples: 4
    structure: 'Although + subject + verb, + main clause: ''Although it was cold, we went for a walk.'' / Despite/In spite
      of + noun/gerund, + main clause: ''Despite the cold, we went for a walk.'' / Main clause. However, + contrasting clause:
      ''It was cold. However, we went for a walk.'''
  negative:
    example_generator:
      contexts:
      - education and school
      - work challenges
      - personal achievements
      min_examples: 4
    structure: 'Although + subject + negative verb, + main clause: ''Although she didn''t study, she passed.'' / Despite +
      not + gerund, + main clause: ''Despite not studying, she passed.'''
  questions:
    example_generator:
      contexts:
      - discussion and debate
      - problem-solving
      min_examples: 3
    structure: 'Although is not typically used in questions. However can introduce a contrasting question: ''The plan seems
      good. However, have we considered the cost?'''
grammar_point: connectors_advanced
level: B1
meaning:
  ccqs:
  - answer: With a clause -- 'Although it was raining' (subject + verb).
    purpose: Tests whether the learner understands that 'although' is a conjunction and must be followed by a full clause
      (subject + verb), not just a noun. This is the most common structural error with 'although'.
    question: Do we use 'although' with a clause or a noun?
  - answer: No, 'despite' is a preposition, so it must be followed by a noun or gerund -- 'Despite the rain' or 'Despite being
      tired'.
    purpose: Tests whether the learner can distinguish between conjunctions (although + clause) and prepositions (despite
      + noun). This is a very common error at B2 level.
    question: Can we say 'Despite it was raining'?
  - answer: No, 'however' needs a semicolon or a new sentence -- 'It was raining. However, we went out.'
    purpose: Tests whether the learner understands that 'however' is a conjunctive adverb, not a conjunction. It cannot join
      two clauses with a comma alone (comma splice error). This is essential for academic writing.
    question: Does 'however' join two clauses like 'but'?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with connectors advanced. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: Although (conjunction + clause) = Despite (preposition + noun/gerund). However (conjunctive adverb, needs new
    sentence or semicolon) = But (coordinating conjunction, joins clauses).
  core_meaning: Expressing contrast or unexpected results between two situations — showing that one thing is surprising given
    the other.
  example_generator:
    contexts:
    - everyday situations
    - academic writing
    - news reporting
    - formal speeches
    cultural_notes:
    - In British English, 'in spite of' and 'despite' are equally common; American English prefers 'despite'
    - '''However'' in formal writing signals a sophisticated level of argumentation valued in academic contexts'
    min_examples: 5
  timeline: Timeless — connectors of contrast can be used with any tense. The contrast exists between two ideas, not tied
    to a specific time.
phonetics:
- example_generator:
    contexts:
    - spoken English
    - presentations
  l1_issue: Some L1 speakers pronounce 'however' with equal stress on both syllables, making it sound stilted.
  note: 'However is typically pronounced with stress on the second syllable: how-EV-er. In connected speech, the ''h'' may
    be dropped in rapid speech.'
- example_generator:
    contexts:
    - informal spoken English
  l1_issue: L1 speakers may over-pronounce 'although' in casual conversation, sounding overly formal.
  note: 'Although is often reduced in connected speech to ''tho'' in informal contexts: sounds like /ðəʊ/.'
register_notes:
- note: 'Biber et al. (2021) — Advanced connectors: formal additive, causative, and contrastive connectors are strongly associated
    with academic prose. Conversation uses more implicit cohesion. Ch. 10.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25: Adverbs-14.8'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - Although he tried hard, he failed.
  - He tried hard, though.
  - Though it was late, we stayed.
  rule: Although and though are interchangeable in most contexts. 'Though' is more informal and can appear at the end of a
    sentence.
  type: grammatical
- examples:
  - Despite the rain (noun), we went out.
  - Despite being tired (gerund), she finished.
  - 'NOT: Despite it was raining'
  rule: Despite and In spite of are prepositions — they must be followed by a noun, pronoun, or gerund, never a finite clause.
  type: grammatical
- examples:
  - It was raining. However, we went out. (full stop)
  - It was raining; however, we went out. (semicolon)
  - 'NOT: It was raining, however we went out. (comma splice)'
  rule: However is a conjunctive adverb, not a conjunction. It cannot join two clauses with a comma alone.
  type: grammatical
- examples:
  - Although she was late, she caught the bus.
  - She caught the bus although she was late.
  rule: Although can go at the beginning or middle of a sentence. When it starts the sentence, use a comma before the main
    clause.
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students rewrite sentences using 'although' as 'despite + noun' and vice versa. Works well as a pair
      activity.
    duration: 15
    name: Connector Transformation
  - adaptation_notes: Teams race to identify and fix punctuation errors with 'however' and 'although' in a text.
    duration: 10
    name: Error Correction Race
  - adaptation_notes: Students debate a topic, required to use at least 5 different contrast connectors in their arguments.
    duration: 25
    name: Debate with Connectors
  tips:
  - 'Show the pattern: Although + clause = Despite + noun. Practice transforming between the two structures.'
  - 'Use a substitution table: Although it was raining = Despite the rain = Despite the fact that it was raining'
  - Practice punctuation with however — emphasise the semicolon or full stop, not a comma splice
  - Have students identify and correct comma splice errors with 'however' in sample texts
  - 'Swan PEU: The "however rule" — Conjunctive adverbs (however, therefore, moreover, nevertheless) need a semicolon or new
    sentence. They cannot join clauses with a comma.'
  - 'Swan PEU: "Because of" (preposition) vs "because" (conjunction). "Despite" (preposition) vs "although" (conjunction).
    Teach the grammar category.'
  - 'Swan PEU: "On the contrary" = the previous statement is FALSE. "On the other hand" = a different perspective. Do not
    confuse them.'
title: Advanced Connectors (however/although/despite/in spite of)
use:
- description: Introducing a contrasting fact that makes the main clause surprising.
  examples:
  - Although he's rich, he's not happy.
  - Although I studied all night, I failed the exam.
  - Although the restaurant was expensive, the food was mediocre.
  - Although she had never met him before, she recognised his voice.
  key_point: Although = despite the fact that. Goes at start or middle of sentence. Followed by a full clause (subject + verb).
  name: Concession with although
- description: Connecting two independent clauses with a formal contrast marker.
  examples:
  - It was raining heavily. However, we decided to go out.
  - She was extremely tired. However, she finished the project on time.
  - The plan seemed perfect. However, there were several hidden problems.
  key_point: However = but more formal. Needs semicolon or new sentence. Often followed by a comma.
  name: Contrast with however
- description: Expressing contrast using prepositions followed by nouns or gerunds.
  examples:
  - Despite the heavy rain, we went for a walk.
  - In spite of being exhausted, she completed the marathon.
  - Despite his lack of experience, he got the job.
  - In spite of not having a degree, she became a successful entrepreneur.
  key_point: Despite/In spite of = prepositions, followed by noun or gerund, NOT a finite clause.
  name: Prepositional contrast with despite/in spite of
- description: Using advanced connectors to build sophisticated arguments in essays and reports.
  examples:
  - Although the data supports the hypothesis, further research is needed.
  - Despite significant investment, the project failed to meet its targets.
  - The results were promising. However, several limitations must be acknowledged.
  key_point: Advanced connectors are essential for academic writing and formal argumentation.
  name: Formal writing and argumentation
