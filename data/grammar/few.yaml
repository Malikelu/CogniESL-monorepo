common_errors:
- correction: I have a few friends here.
  error: '*I have few friends here.* (intended: some friends)'
  explanation: Without 'a', 'few' has a negative meaning (almost none). With 'a',
    'a few' has a positive meaning (some, enough).
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: D
- correction: I have little time.
  error: '*I have few time.*'
  explanation: '''Few'' is only for countable nouns. ''Time'' is uncountable, so use
    ''little/a little''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
- correction: I have a few friends.
  error: 'Using ''few'' when meaning ''some'': *''I have few friends.'' (meaning:
    some friends)'
  explanation: 'Swan PEU: "Few" = not many (negative meaning, "not enough"). "A few"
    = some (positive meaning, "enough").'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  - Japanese
  reliability: B
  source: Swan Entry 138.2. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: 'Quantifiers for countable plural nouns: few means ''almost no'' (negative
  meaning); a few means ''a small but sufficient number'' (positive meaning).'
dialectal_variation: []
discourse_notes:
- note: Few and a few (with count nouns) and little and a little (with non-count nouns)
    express subtle quantity distinctions with evaluative overtones.
form:
  affirmative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Few + countable plural noun (negative): "Few students passed the exam."

      A few + countable plural noun (positive): "A few students passed the exam."

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Few/a few follow negative verbs: ''I don''t have few friends'' (unnatural)
      / ''I don''t have a few friends'' (unnatural); better to use ''I have few friends''
      (negative) or ''I have a few friends'' (positive).'
  questions:
    example_generator:
      contexts:
      - social interactions
      min_examples: 4
    structure: 'Few/a few follow auxiliary verbs in questions: ''Are there few options?''
      ''Are there a few options?'''
grammar_point: few
level: A2
meaning:
  ccqs:
  - answer: Disappointed — 'few' has a negative meaning. Almost no one came.
    purpose: Tests whether the learner understands the emotional connotation of 'few'
      (negative/disappointing) vs 'a few' (positive/relieved).
    question: '''Few people came to the party.'' Are you happy or disappointed?'
  - answer: Relieved — 'a few' has a positive meaning. Some people came.
    purpose: Tests whether the learner can distinguish between 'few' (almost none,
      negative) and 'a few' (some, positive). The article 'a' completely changes the
      meaning.
    question: '''A few people came to the party.'' Are you happy or disappointed?'
  - answer: No — 'few' is only for countable nouns. Use 'little' for uncountable.
    purpose: Tests whether the learner knows that 'few/a few' only work with countable
      plural nouns, while 'little/a little' work with uncountable nouns.
    question: Can you say 'few water'?
  - answer: A relatively large number — 'quite a few' is an idiomatic understatement
      meaning 'surprisingly many' or 'more than expected.' Despite using 'few,' the
      expression is positive. This is different from 'very few' (small number) and
      'a few' (some). The idiomatic meaning takes learners by surprise.
    purpose: Tests whether the learner understands that 'quite a few' is an idiomatic
      expression meaning 'a fairly large number,' not 'almost none.' The combination
      of 'quite' + 'a few' creates an understatement (litotes) that actually signals
      a quantity larger than the literal 'few' would suggest. This is a common source
      of confusion because the words appear negative but the function is positive.
    question: '"Quite a few people came to the party." Is this a small number or a
      relatively large number?'
  contrast: 'Few = Negative: "Few people came" (disappointing, almost no one)

    A few = Positive: "A few people came" (relieved, some people came)

    Few vs Little: Few = countable; Little = uncountable (same meaning)

    '
  core_meaning: 'Few = Negative: almost no countable items (emphasizes lack). A few
    = Positive: a small number of countable items (emphasizes existence). Both only
    pair with countable plural nouns.'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Quantifiers are not tense-based; they describe quantity regardless
    of time.)
phonetics:
- example_generator:
    contexts:
    - few vs a few
  l1_issue: Learners may not hear the difference between few and a few in connected
    speech. Teach them to listen for the article.
  note: The difference between few and a few is not phonetic but grammatical. In speech,
    a few is often reduced to /ə fjuː/ while few is pronounced /fjuː/.
register_notes:
- note: In formal writing, conditionals appear in discussions of likely outcomes and
    theoretical scenarios.
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, conditionals are used for hypothetical scenarios and polite
    requests.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, conditionals express logical relationships between propositions.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Quantifier distribution: ''few/a few'' patterns differ
    by register. Academic prose uses more precise quantification; conversation uses
    more vague quantifiers. Ch. 4.4.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 4.4.4
