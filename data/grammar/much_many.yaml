    many quantifies countable plural'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17:
    Partitives, Collectives and Quantifiers'
  tier: 1
- claim: 'Register distribution: ''Much'' and ''many'' are standard in academic prose
    and formal writing. In conversation, ''a lot of'' replaces both in affirmative
    sentences.'
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17:
    Partitives, Collectives, and Quantifiers'
  tier: 1
- claim: 'Discourse function: In conversation, ''much'' and ''many'' appear mainly
    in questions and negatives. ''A lot of'' is the default affirmative quantifier
