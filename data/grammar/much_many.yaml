common_errors:
- correction: I have much time.
  error: '*I have many time.*'
  explanation: Many is for countable nouns. Time is uncountable, so use much.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: Do you have many books?
  error: '*Do you have much books?*'
  explanation: Much is for uncountable nouns. Books are countable, so use many.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I have many friends here.
  error: '*I have much friends here.*'
  explanation: Much is for uncountable nouns. Friends are countable, so use many.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: D
- correction: many people
  error: 'Using ''much'' with countable nouns: *''much people'''
  explanation: 'Swan PEU: "Much" for uncountable, "many" for countable. "Much information"
    (OK). "Many books" (OK).'
  l1_groups: &id001
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 138. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: much information
  error: 'Using ''many'' with uncountable nouns (in questions/negatives): *''many
    information'''
  explanation: 'Swan PEU: Use "much" with uncountable nouns even in questions and
    negatives. "How much time?" NOT "How many time?"'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 138. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: 'Quantifiers to ask about or describe quantity: much (uncountable nouns),
  many (countable plural nouns). Used mainly in questions and negatives; less common
  in affirmative sentences (replaced by a lot of).'
dialectal_variation: []
discourse_notes:
- note: Much and many express large quantity. Much is used with non-count nouns, many
    with count nouns. Both are more common in questions and negatives.
form:
  affirmative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Much + uncountable noun (formal affirmative): "I don''t have much
      time." (negative) / "I have much work to do." (formal affirmative)

      Many + countable plural noun: "Many students passed the exam." (affirmative)
      / "I don''t have many friends." (negative)

      '
  negative:
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
    structure: 'Much/many follow negative verbs: ''We don''t have much money.'' ''They
      don''t have many options.'''
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: How much + uncountable noun? How many + countable plural noun?
grammar_point: much_many
level: A2
meaning:
  ccqs:
  - answer: Much with uncountable nouns. Many with countable plural nouns.
    purpose: Tests whether the learner can distinguish between much (uncountable)
      and many (countable). This is one of the most fundamental quantifier rules at
      A2 level.
    question: When do we use much and when do we use many
  - answer: Yes, but a lot of is more common in informal speech.
    purpose: Tests whether the learner knows that much/many are mainly used in questions
      and negatives, while a lot of is preferred in affirmative sentences. This affects
      natural-sounding speech.
    question: Can we use much and many in affirmative sentences
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with
      much many and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Advice is uncountable in English. Use much, a lot of, or a piece of with
      it, not many. Say I do not have much advice or I have a lot of advice, not I
      have many advices. This is a common error because many languages treat advice
      as countable.
    purpose: Tests whether the learner can apply the much/many distinction to specific
      nouns that are often miscategorised. Advice is one of the most frequently misused
      nouns with many because learners assume it is countable. Understanding that
      English treats it as uncountable (requiring much, not many) is essential for
      accurate quantifier use.
    question: Is advice a countable or uncountable noun, and which quantifier should
      we use with it?
  contrast: 'Much = Uncountable nouns: water, time, money, information

    Many = Countable plural nouns: books, people, cars, ideas

    Affirmative: Use a lot of instead of much/many in informal speech: "I have a lot
    of time" (not "I have much time")

    '
  core_meaning: Much quantifies uncountable nouns (cannot be counted individually);
    many quantifies countable plural nouns (can be counted individually). Both refer
    to large quantities.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Quantifiers are not tense-based; they describe quantity regardless
    of time.)
phonetics:
- example_generator:
    contexts:
    - much vs many pronunciation
  l1_issue: 'Learners may confuse much and many. Teach the clear distinction: much
    + uncountable, many + countable.'
  note: Much is pronounced /mʌtʃ/ and many is pronounced /ˈmeni/. In connected speech,
    much is often reduced.
register_notes:
- note: In formal writing, conditionals appear in discussions of likely outcomes and
    theoretical scenarios.
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, conditionals are used for hypothetical scenarios and polite
    requests.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, conditionals express logical relationships between propositions.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Quantifier distribution: ''much/many'' patterns differ
    by register. Academic prose uses more ''many'' with countable nouns; conversation
    uses more ''a lot of'' as a general quantifier. Ch. 4.4.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 4.4.4
