description: Demonstrative determiners and pronouns used to point to specific people or things based on distance (near/far)
  and number (singular/plural). Essential for spatial and temporal reference.
dialectal_variation: []
discourse_notes:
- note: 'Demonstratives create spatial reference: ''This book (near) is better than that one (far).'''
form:
  affirmative:
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
    structure: 'This + singular (near): "this book" (here)

      That + singular (far): "that book" (there)

      These + plural (near): "these books" (here)

      Those + plural (far): "those books" (there)

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'This/That/These/Those + noun + isn''t/aren''t: "This isn''t mine."

      As pronouns: "That isn''t true." "Those aren''t ready."

      '
  questions:
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
    structure: 'Is this/that...? Are these/those...?

      What is this/that? What are these/those?

      '
grammar_point: this_that_these_those
level: A1
meaning:
  ccqs:
  - answer: This for near. That for far.
    purpose: Tests whether the learner understands the basic near/far distinction between "this" (near) and "that" (far).
      This is the foundational concept for all demonstrative reference in English.
    question: Do we use this or that for something near the speaker
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that this that these those is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with this that these those and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''These books are mine.'' Use ''this/that'' for singular, ''these/those'' for plural.'
    purpose: Tests whether the learner chooses the correct demonstrative for singular vs plural (Swan PEU 2016, entry 560).
    question: Which is correct? *'This books are mine' or 'These books are mine'?
  contrast: '''THIS/THESE'' = Near (here): "This phone" (in my hand), "These shoes" (on my feet)

    ''THAT/THOSE'' = Far (there): "That building" (over there), "Those stars" (in the sky)

    Time: ''THIS'' = current/recent, ''THAT'' = distant past/future

    '
  core_meaning: This/These = near the speaker (physically or psychologically). That/Those = far from speaker. Singular vs
    Plural based on count.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present-focused, but can refer to past (that) or future (this) in time: ''This morning'' (near past), ''That
    day'' (far past).'
phonetics:
- example_generator:
    contexts:
    - demonstrative stress
  l1_issue: Portuguese speakers may confuse 'this' and 'that' because Portuguese uses a three-way distance system. Teach the
    simple English two-way system.
  note: 'This and that are usually unstressed: ''This is'' → /ðɪs ɪz/, ''That was'' → /ðæt wəz/. They are stressed only when
    contrasting: ''THIS one, not THAT one.'''
register_notes:
- note: Demonstratives are consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: In formal writing, 'the former/the latter' may replace 'this/that'.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Demonstrative pronouns/determiners: conversation uses more demonstratives (especially ''this'')
    for deictic/exophoric reference; academic prose uses more demonstratives for text-internal anaphoric reference. Ch. 4.1.2,
    12.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 4.1.2
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - This book is mine (near)
  - That book is yours (far)
  - This is my car (near)
  - That is your car (far)
  rule: This for singular near, that for singular far
  type: grammatical
- examples:
  - These are my friends (near)
  - Those are your friends (far)
  - These apples are fresh (near)
  - Those apples are old (far)
  rule: These for plural near, those for plural far
  type: grammatical
- examples:
  - This is a good idea
  - That was a great movie
  - I like this
  - I do not like that
  rule: This/that can also refer to ideas or situations (not just physical objects)
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Teacher points to objects near and far. Students say: ''This is a pen. That is a book. These are my
      keys. Those are your glasses.'''
    duration: 10
    name: Point and Say
  - adaptation_notes: 'Show pictures of objects at different distances. Students choose the correct demonstrative: near =
      this/these, far = that/those.'
    duration: 10
    name: Near or Far
  tips:
  - 'Use real objects at different distances: hold one (this), point far (that), show group near (these), point to far group
    (those).'
  - 'Practice with classroom: ''This desk'' (teacher''s), ''That desk'' (far corner), ''These students'' (near), ''Those students''
    (far side).'
  - 'Teach time expressions early: this morning, that day, these days.'
  - 'Role-play phone calls: ''Who is that?'' (formal) vs ''Is that Maria?'' (informal checking).'
  - 'Swan PEU: ''That'' and ''those'' in comparisons — ''My car is faster than that one.'' ''Those in the corner are mine.''
    ''That'' can replace a singular noun, ''those'' replaces a plural noun.'
title: This / That / These / Those
use:
- description: Point to objects based on physical distance from speaker.
  examples:
  - This cup (in hand)
  - That car (across street)
  - These apples (here)
  - Those mountains (far)
  key_point: 'Physical proximity determines choice: near = this/these, far = that/those.'
  name: Physical Distance (Near/Far)
- description: Refer to time periods as near or far.
  examples:
  - This week (current)
  - That year (long ago)
  - These days (now)
  - Those times (past)
  key_point: This/These = recent/current time; That/Those = distant past or future.
  name: Temporal Reference (Current/Distant)
- description: Show involvement (this) or detachment (that).
  examples:
  - This idea of yours (familiar)
  - That problem over there (distant)
  key_point: This shows speaker involvement; that creates distance/detachment.
  name: Psychological Distance (Known/Unknown)
