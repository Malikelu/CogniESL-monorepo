sub_rules:
- examples:
  - I understand. (not 'I am understanding')
  - She loves music. (not 'She is loving music')
  rule: 'Common stative verbs: know, believe, understand, love, hate, want, need,
    prefer, own, belong, seem, appear'
  type: grammatical
- examples:
  - I think it's great. (opinion = stative) / I'm thinking about it. (process = dynamic)
  - I have a car. (possession = stative) / I'm having lunch. (action = dynamic)
  rule: Some verbs can be both stative and dynamic with different meanings
  type: semantic
- examples:
  - I see a bird. (not 'I am seeing')
  - This tastes good. (not 'This is tasting')
  rule: 'Sense verbs are usually stative: see, hear, smell, taste, feel'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students classify verbs and create sentences.
    duration: 10
    name: Stative or Dynamic?
  tips:
  - Create a list of common stative verbs
  - Use the "Can I see someone doing this?" test (if no, it's stative)
  - 'Swan PEU: Common stative verbs -- know, believe, understand, remember, forget,
    love, hate, want, prefer, see (understand), hear (understand), seem, mean.'
  - 'Swan PEU: Some verbs change meaning in stative vs dynamic use. "Have" (possess
    vs eat/do), "think" (opinion vs consider), "see" (perceive vs meet).'
  - 'GB3 Ch. 7: Lexical aspect (Vendler categories) — Activity, Accomplishment, Achievement
    (punctual), State. These four verb types interact with grammatical aspect. Activity
    verbs take progressive naturally. Achievement verbs in progressive = iteration
    or inception (''He''s nodding'' / ''Joe is realizing''). Stative verbs resist
    progressive BUT progressive statives are possible for specific effects: (a) intensify
    emotion (''I''m hating this''), (b) current behavior vs general (''He''s being
    rude'' vs ''He''s rude''), (c) change over time (''I''m understanding less and
    less''), (d) limited duration, vividness, personal involvement, mitigate criticism,
    avoid imposition. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.3
    (citing Kesner Bland 1988, Gavis 1997).'
  - 'GB3 Ch. 7: Aspect hypothesis — learners acquire tense-aspect in stages: past
    tense first with achievement/accomplishment verbs (clear completion); progressive
    first with activity verbs (no endpoint). Cross-linguistically robust (Andersen
    & Shirai 1994, Collins 2007). Teaching implication: don''t expect uniform acquisition
    — some verb types will trigger correct earlier. Source: Celce-Murcia & Larsen-Freeman
    (2015) GB3 Ch. 7 §7.3.'
  - 'GB3 Ch. 7: Stative ''meanings'' not stative ''verbs'' — many stative verbs have
    nonstative counterparts: ''The steak weighs 12 oz'' (state) vs ''The butcher is
    weighing the steak'' (action). ''You are a fool'' vs ''You''re being a fool.''
    Teach meanings, not verb lists. Source: Celce-Murcia & Larsen-Freeman (2015) GB3
    Ch. 7 §7.3.'
title: Stative vs. Dynamic Verbs
use:
- context: Describing feelings and opinions
  description: Using stative verbs for emotions and thoughts
  examples:
  - I love this song.
  - She believes in God.
  - I don't understand.
- context: Describing actions in progress
  description: Using dynamic verbs in continuous tenses
  examples:
  - I am reading a book.
  - She is cooking dinner.
