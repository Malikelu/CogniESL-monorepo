register_notes:
- note: 'The stative/dynamic distinction is most rigidly observed in formal writing,
    where stative verbs in continuous tenses are treated as errors: academic prose
    demands ''The results suggest...'' not *''The results are suggesting...'' However,
    spoken English and informal registers frequently bend this rule for expressive
    effect. The progressive with statives can signal temporariness or emphasis: ''I''m
    loving it'' (McDonald''s slogan, deliberate dynamic use), ''You''re being rude''
    (dynamic interpretation of ''be'' to mean temporary behavior, not permanent trait),
    ''I''m thinking about your offer'' (active deliberation vs. fixed opinion: ''I
    think it''). Advertising and casual speech exploit this shift systematically:
    ''We''re wanting the best for you'' (service encounter, softening). Teachers should
    explain that while formal writing requires strict adherence, learners will encounter
    stative progressives in authentic speech and media, and that the meaning often
    shifts subtly (temporary vs. permanent, active process vs. fixed state).'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Stative vs. dynamic verb distinction: register distribution
    of progressive with stative verbs differs. Conversation uses more progressive
    statives (I''m loving it) as a trend. Ch. 6.3.3.1'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.3.3.1
