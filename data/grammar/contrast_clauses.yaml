common_errors:
- correction: When I was young, I lived in London.
  error: '*While I was young, I lived in London.* (ambiguous)'
  explanation: '''While'' with past simple can be ambiguous between contrast and time meanings. For background time periods,
    ''when'' is clearer. ''While'' is best with continuous tenses for simultaneous actions rather than background time.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: My sister likes coffee, whereas I prefer tea.
  error: '*Whereas my sister likes coffee but I prefer tea.*'
  explanation: '''Whereas'' already signals contrast; adding ''but'' creates redundancy. Also, ''whereas'' joins two clauses
    within one sentence -- it is not used as a sentence-initial connector like ''however''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I like writing. In contrast, my sister likes reading.
  error: '*I like writing. In contrast, my sister, she likes reading.*'
  explanation: '''In contrast'' already introduces the contrasting element. Adding a pronoun (''she'') after the noun (''my
    sister'') creates a double subject. ''In contrast'' does not require dislocation of this type.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Arabic
  reliability: D
- correction: While it is cold outside, I wear a coat.
  error: '*While is cold outside, I wear a coat.*'
  explanation: Missing subject and verb after 'while'. 'While' introduces a dependent clause requiring both subject and verb.
    This fragment error occurs when learners treat 'while' like a preposition rather than a conjunction.
  flagged: true
  l1_groups:
  - Chinese
  - Japanese
  - Arabic
  reliability: D
description: Structures that show differences between two ideas or facts. Essential for comparative writing.
dialectal_variation: []
discourse_notes:
- note: Contrast clauses (while, whereas, but) highlight differences between two propositions and structure comparative argumentation.
form:
  affirmative:
    example_generator:
      contexts:
      - work and professional life
      - comparing opinions
      - cultural differences
      min_examples: 4
    structure: 'While + clause, + clause: "While I like coffee, she likes tea."

      Clause + whereas + clause: "I like coffee, whereas she likes tea."

      Sentence. In contrast, + sentence: "I like coffee. In contrast, she likes tea."

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      - opinions
      min_examples: 4
    structure: Either clause can be negative.
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Questions less common; use 'while' as conjunction.
grammar_point: contrast_clauses
level: B2
meaning:
  ccqs:
  - answer: Yes, it is a contrast clause.
    purpose: Tests whether the learner can identify a contrast clause and distinguish it from other types of subordinate clauses.
    question: Does this sentence show a difference between two things?
  - answer: If it means 'during', it is a time clause. If it means 'but/however', it is a contrast clause.
    purpose: Tests whether the learner can distinguish the dual meaning of 'while' (time vs contrast) and identify which meaning
      is intended in context.
    question: Is the meaning about time ('during') or contrast ('but/however')?
  - answer: '''Whereas'' and ''in contrast'' are formal (writing). ''While'' works in both. ''But'' is informal.'
    purpose: Tests whether the learner understands the formality spectrum of contrast connectors and can choose the appropriate
      register.
    question: Is this formal or informal?
  - answer: Yes, in most cases — but 'while' is less formal and can also mean 'during'.
    purpose: Tests whether the learner understands the formality differences between contrast connectors (whereas/in contrast
      = formal; while/but = less formal).
    question: Can we replace 'whereas' with 'while' without changing the meaning?
  contrast: '"While" = during time OR contrast (context determines)


    "Whereas" = formal contrast only


    "In contrast" = sentence connector (formal)


    "On the other hand" = informal alternative

    '
  core_meaning: Highlights differences or unexpected contrasts between two ideas, people, or situations.
  example_generator:
    contexts:
    - academic writing
    - comparing cultures
    - debates
    - formal discussions
    cultural_notes:
    - Contrast clauses are essential in academic and professional English
    - Overusing 'but' in formal writing is a common learner error — 'whereas' and 'while' are preferred
    min_examples: 5
  timeline: N/A (Contrast clauses show relationships, not time — though 'while' can also mean 'during'.)
phonetics:
- example_generator:
    contexts:
    - punctuation
    - reading aloud
  l1_issue: Learners may not pause at the comma, making the contrast less clear
  note: 'Comma pause after the contrast clause: ''While I like coffee [pause], she likes tea.'''
- example_generator:
    contexts:
    - word stress
  l1_issue: Many learners mispronounce 'whereas' as two equal stresses or stress the first syllable
  note: '''Whereas'' is pronounced /weərˈæz/ — stress on the second syllable'
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Contrast clauses: formal connectors (''whereas'', ''while'') are more common in academic prose;
    informal (''but'', ''though'') dominate conversation. Ch. 10.4.1.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.4.1.5
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 26: Logical Connectors'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
