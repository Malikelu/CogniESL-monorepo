citations:
- claim: Prepositions in English form a closed class that establish spatial, temporal,
    and abstract relationships between entities in discourse
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: L1 transfer in prepositions varies significantly across language backgrounds
    — Swan & Smith document contrastive patterns for speakers of different L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents
    how transfer effects are non-linear, determined by functional fit between L1 and
    L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects
    are non-linear — determined by functional fit between L1 and L2 systems rather
    than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
common_errors:
- correction: I went home. / I arrived at school. / She is good at English.
  error: '*I went to home.* / *I arrived to school.* / *She is good in English.*'
  explanation: English prepositions are often idiomatic and do not translate directly
    from L1. Many L1s use different prepositions or no preposition for these expressions.
  flagged: false
  l1_groups:
  - Spanish
  - French
  - Italian
  - Portuguese
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  - Thai
  reliability: B
  source: Swan & Smith (2001). All these L1s have preposition systems that differ
    from English. Spanish (preposition transfer), French (preposition transfer), Italian
    (preposition transfer), Portuguese (preposition transfer), Russian (case system
    replaces prepositions), Polish (case system replaces prepositions), Arabic (preposition
    transfer), Turkish (postpositions instead of prepositions), Japanese (postpositions),
    Chinese (preposition differences), Korean (postpositions), Thai (preposition differences).
- correction: I listen to music.
  error: '*I listen music.* (missing preposition)'
  explanation: Some L1s use direct objects where English requires prepositional phrases.
    Spanish escuchar musica (listen music) transfers to English as *I listen music.
  flagged: false
  l1_groups:
  - Spanish
  - French
  reliability: B
  source: Swan & Smith (2001). Spanish (direct object where English needs preposition),
    French (similar pattern).
- correction: I have been here since Monday. / I have been here for three days.
  error: '*I am here since Monday.* (since/for confusion)'
  explanation: Many L1s use a single word for both since and for. English requires
    since + point in time, for + duration.
  flagged: false
  l1_groups:
  - Spanish
  - French
  - Italian
  - Portuguese
  - German
  reliability: B
  source: Swan & Smith (2001). Spanish (desde = since/for), French (depuis = since/for),
    Italian (da = since/for), Portuguese (desde = since/for), German (seit = since/for).
- error: Somali uses only 4 native postpositions with broad semantic ranges, leading
    to preposition substitution and postposed forms in English (e.g., *"the table
    on" instead of "on the table")
  explanation: 'Swan & Smith (2001) Ch. 13: Somali has no prepositions — only postpositions
    with broad meanings. Learners transfer the postpositional word order to English,
    producing structures like *"the house in" instead of "in the house." Somali also
    uses fewer spatial distinctions than English, leading to overuse of "at" and "in."'
  l1_groups:
  - Somali
  reliability: B
  source: 'Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. 13: Somali speakers.'
  tier: 1
- error: Direct translation of multi-functional Spanish preposition "en" (in/on/at)
    produces *"not in home" instead of "not at home"
  explanation: 'Whitley (2002) Ch. 5: Spanish preposition "en" covers the semantic
    territory of English "in," "on," and "at." Spanish speakers transfer this broad
    category to English, producing errors like *"in the corner" for support/surface
    contexts requiring "on," or *"enclosing" errors for point-location requiring "at."
    Whitley recommends teaching the three-way distinction (at/on/in) explicitly through
    spatial prototypicality.'
  l1_groups:
  - Spanish
  reliability: B
  source: 'Whitley (2002) Spanish-English Contrasts: A Course in Spanish Linguistics,
    2nd ed. Georgetown University Press. Ch. 5: Prepositions and prepositional phrases.'
  tier: 1
- correction: I am interested in sports. / I have been here for three days.
  error: '*I am interested for sports.* / *I have been here since three days.*'
  explanation: 'Parrott (2000) Ch. 16: Prepositional collocations are best taught
    as fixed chunks, not as individually selected prepositions. The "adjective + preposition"
    pattern (interested in, good at, afraid of) should be taught as whole units rather
    than asking learners to choose prepositions by semantic reasoning, since English
    preposition choice is often arbitrary from the learner''s perspective. Parrott
    recommends teaching these as vocabulary items, not grammar rules.

    '
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 7: Prepositions.'
- correction: I look forward to seeing you.
  error: '*I look forward to see you.* (to + infinitive after preposition)'
  explanation: 'Parrott (2000) Ch. 16: "To" can be a particle (part of the infinitive:
    want to go) or a preposition (look forward to + noun/gerund). This causes persistent
    errors because learners learn "to + verb" as a default pattern. Parrott recommends
    explicitly teaching verb patterns (verb + to-infinitive vs verb + preposition
    + gerund) as a separate learning area rather than trying to teach the to distinction
    directly.

    '
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Japanese
  - Chinese
  - Korean
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 16: ''To'' as particle vs preposition.'
description: English prepositions are a major difficulty area for nearly all L1 groups.
  Prepositions often do not translate 1:1 across languages, and many languages use
  case endings, postpositions, or serial verb constructions where English uses prepositions.
dialectal_variation:
- note: 'Biber et al. (2021) GSWE: Preposition usage shows register variation. Preposition
    stranding is more common in conversation, less in academic prose. BrE and AmE
    differ in specific collocations: different from (AmE) vs different to/than (BrE),
    write to (both) vs write (no preposition in AmE for direct object). BrE at the
    weekend vs AmE on the weekend.'
discourse_notes:
- 'Prepositions establish spatial, temporal, and abstract relationships between entities
  in discourse. Biber et al. (2021) Ch. 2.4.5: Prepositional phrases are far more
  common in academic prose than conversation — academic prose uses complex multi-word
  prepositions ("in terms of," "with respect to") and prepositional postmodifiers
  ("the use of X by Y") as compact information-packaging devices.'
grammar_point: prepositions
level: A2
meaning:
  ccqs:
  - answer: I arrive at the airport. Arrive takes at (for specific locations), not
      to.
    purpose: Tests preposition collocation knowledge
    question: I arrive AT the airport vs I arrive TO the airport. Which is correct?
  - answer: She is good at maths. Good + at + activity.
    purpose: Tests adjective + preposition collocation
    question: She is good IN maths vs She is good AT maths. Which is correct?
  contrast: 'Time: at 3pm, on Monday, in January | Place: at the door, on the table,
    in the room | Direction: go to school, get into the car'
  core_meaning: Prepositions show relationships of time (at, on, in), place (at, on,
    in, to, from), direction (to, into, onto), and manner (by, with, like). English
    prepositions are often idiomatic and must be learned as part of collocations.
  timeline: N/A (prepositions are not tense-based).
form:
  affirmative:
    structure: 'Preposition + noun phrase (NP): in the house, on the table, at noon,
      by car, with a friend. Prepositions of time: at (specific time), on (day/date),
      in (month/year/period). Prepositions of place: at (point), on (surface), in
      (enclosed space). Prepositions of movement: to (destination), into (entering),
      onto (moving to surface), through (passing inside), across (from side to side).'
  negative:
    structure: 'Not + preposition: not in the house, not on time. Prepositions cannot
      be negated directly — negation applies to the verb or noun phrase.'
  questions:
    structure: 'Preposition stranding in questions: Who did you go with? What is this
      used for? Formal: With whom did you go? For what is this used?'
register_notes:
- note: Biber et al. (2021) — Preposition distribution is register-sensitive. Academic
    prose uses more complex prepositions and prepositional phrases; conversation uses
    fewer and simpler prepositions. Ch. 2.4.5, 5.3.3
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 2.4.5, 5.3.3
sources:
- Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
- 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University
  Press. Ch. 7: Prepositions.'
- 'L1 Interference ESL Teacher Resources — Comparative Analysis of Cross-Linguistic
  Influence: Best-in-Class Resources and L1 Interference Databases for English Language
  Educators.'
sub_rules:
- examples:
  - at 3 o'clock, on Monday, in January, in the morning
  - at the corner, on the corner, in the corner
  rule: 'Time prepositions: at (precise time), on (day/date), in (longer periods).
    Place prepositions have distinct meanings based on dimensionality.'
  type: semantic
- examples:
  - in the car, on the bus, by car
  - at the door, on the door, in the door
  rule: 'Transport prepositions: in (enclosed vehicle), on (large vehicle stand on),
    by (means, no article)'
  type: lexical
- examples:
  - interested in, afraid of, good at, depend on, wait for
  rule: Many verbs, adjectives, and nouns require specific prepositions — these must
    be learned as collocations, not by semantic rules alone.
  type: lexical
- examples:
  - Who did you speak to? (informal) / To whom did you speak? (formal)
  - This is the house I lived in.
  rule: Preposition stranding (ending sentence with preposition) is grammatical in
    English, especially informal. Formal English prefers no stranding.
  type: register
phonetics:
- example_generator:
  - in_the -> /ɪn ðə/ (weak form of the)
  - on_a -> /ɒn ə/ (weak form of a)
  l1_issue: Spanish speakers may give full stress to prepositions. English prepositions
    are typically unstressed in connected speech.
  note: Prepositions are function words and typically receive weak stress. They link
    smoothly to following words.
- example_generator:
  - at -> /ət/ (strong form /æt/)
  - for -> /fə/ (strong form /fɔː/)
  l1_issue: Learners who learned prepositions only in their strong/citation form may
    not understand them in connected speech.
  note: Most common prepositions have weak forms used in normal speech.
use:
- context: Location and position
  examples:
  - The book is on the table.
  - She lives in London.
  - He is waiting at the bus stop.
- context: Time and duration
  examples:
  - The meeting is at 3 pm on Friday.
  - I have been here since January.
  - She stayed for two hours.
- context: Direction and movement
  examples:
  - Walk to the station.
  - The cat jumped onto the roof.
  - Drive through the tunnel.
- context: Abstract relationships
  examples:
  - He is afraid of spiders.
  - She succeeded in her career.
  - They argued about politics.
teaching:
  recommended_activities:
  - adaptation_notes: Give students sentences with missing prepositions. They choose
      from at, in, on, by, for, with.
    duration: 10
    name: Preposition Gap-Fill
  - adaptation_notes: Students describe the location of objects in a room or on a
      map using prepositional phrases.
    duration: 15
    name: Describe and Place
  - adaptation_notes: Students mime actions while others describe using prepositions
      (e.g., He is jumping over the chair).
    duration: 15
    name: Preposition Charades
  tips:
  - 'Parrott (2000) Ch. 7: Prepositions are a major problem for learners because English
    has many more than most languages, and choices often have little to do with meaning.
    Mistake rarely cause communication problems. Teach prepositions in longer phrases,
    not single words. Teach dependent prepositions linked to verbs, adjectives, and
    nouns in related meaning groups.'
  - 'Swan (2016) PEU 4th ed. Swan (2016) PEU 4th ed. Entries 444-480: Prepositions
    have both literal (spatial/temporal) and metaphorical meanings. At, in, on have
    specific uses for time and place that vary from many other languages. Prepositions
    are often idiomatic (insist on, arrive at, depend on) and should be learned as
    part of collocations.'
  - 'GB3 Ch. 21: Prepositions prototypically deal with locating objects in space.
    Core spatial meanings extend to abstract domains through polysemy networks (Tyler
    & Evans 2003). Most frequent English prepositions: of, in, to, for, with, on,
    at, by, from. Anchor abstract meanings in spatial schemas first. Source: Celce-Murcia
    & Larsen-Freeman (2015) GB3 3rd ed. Ch. 21 §21.1-21.2.'
  - Use real objects (look at, wait for, depend on) rather than as isolated vocabulary
    items. Learners need to see prepositions in context, not memorized from lists.
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 7: CGEL (Ch.7)
    EXPANDS the preposition category to include: (1) traditional prepositions (in,
    on, at), (2) subordinators (since, while, although — analyzed as prepositions
    taking clausal complements), (3) particles (up, out, down in phrasal verbs — analyzed
    as intransitive prepositions), (4) infinitival ''to.'' CGEL''s test for prepositionhood:
    can be modified by ''right/straight'' (''right into the room''). This is controversial
    but internally consistent.'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s
    Course, 2nd ed. Heinle & Heinle.'
  tip: 'PREPOSITION CLASSIFICATION: Celce-Murcia & Larsen-Freeman classify prepositions
    into types: verb+preposition co-occurrence (rely ON, adapt TO), deletable preposition
    (go (to) home), complex preposition (because of, at the bottom of), source (from,
    out of), metaphorical spatial (in a bad mood), genitive of (on the advice of),
    and collocations (loan for the purpose of). Note: discuss requires NO preposition
    (unlike talk about). Because of takes NP, not clause. Source: Ch.21 p.382-386.'
title: Prepositions (Time, Place, Direction, and Collocations)
