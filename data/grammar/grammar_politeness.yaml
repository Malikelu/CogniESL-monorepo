common_errors:
- correction: Could you pass the salt? / I was wondering if you could pass the salt.
  error: '*Give me the salt.* (impolite) vs *Can you give me the salt?* (polite)'
  explanation: English uses past tense modals (could, would), conditionals, and indirect
    questions to soften requests. Direct imperatives can sound rude.
  l1_groups:
  - All L1 groups
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.'
description: Grammaticised strategies for expressing politeness, deference, and social
  distance in English, including modal remoteness, past tense hedging, and indirect
  requests.
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of
    certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results
    may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission:
    ''All passengers must wear seatbelts.'''
form:
  affirmative:
    example_generator:
      contexts:
      - asking favours
      - making requests
      - seeking permission
      - offering help
      min_examples: 4
    structure: Could/Would + Subject + (possibly) + bare infinitive? / Would + Subject
      + mind + -ing? / I was wondering + if + Subject + could/would... / Do you think
      + Subject + could...?
  negative:
    example_generator:
      contexts:
      - tentative requests
      - soft refusals
      - diplomatic disagreement
      min_examples: 3
    structure: Couldn't/Wouldn't + Subject + (possibly) + bare infinitive? / Would
      + Subject + mind + not + -ing? / I don't suppose + Subject + could...?
  questions:
    example_generator:
      contexts:
      - asking permission
      - making suggestions
      - negotiating arrangements
      min_examples: 3
    structure: Is it + (adjective) + if + Subject + Verb...? / Would it be + (adjective)
      + if + Subject + Verb...? / Do you think + it would be + (adjective) + to...?
grammar_point: grammar_politeness
level: B2
meaning:
  ccqs:
  - answer: Yes — 'could' creates modal distance, making the request less direct.
    purpose: Tests whether the learner knows that English uses grammatical structures
      (past tense, conditionals, indirect questions) to express politeness, not just
      vocabulary.
    question: Is 'Could you help me?' more polite than 'Can you help me?'
  - answer: The past tense creates psychological distance, making the request feel
      less demanding.
    purpose: Tests whether the learner understands that past tense modals create
      psychological distance to soften requests — the past tense doesn't indicate past time.
    question: Why do we use past tense ('I was wondering') for a present request?
  - answer: No — it is a polite request. 'No, I wouldn't mind' means 'Yes, I'll do
      it.'
    purpose: Tests whether the learner understands that 'Would you mind...?' is a
      polite request formula, not a genuine question about the listener's preferences.
      The negative answer 'No' means agreement to comply.
  - answer: They are asking you to review their report. The past continuous 'I was
      wondering' and the modal 'might' are grammatical politeness strategies that
      soften the request. It is not a real question about what they were thinking.
    purpose: Tests whether the learner can decode indirect polite requests in English.
      Structures like 'I was wondering if you might...' or 'I don't suppose you could...'
      are formulaic politeness routines, not literal questions about the speaker's
      thoughts.
    question: A colleague says "I was wondering if you might have time to review my
      report." What are they actually doing — wondering, or asking you to do something?
  contrast: 'Direct: ''Give me the salt.'' / Polite: ''Could you possibly pass the
    salt?'' / Very polite: ''I was wondering if you might be able to pass the salt.''
    — Each step adds grammatical distance and politeness.'
  core_meaning: 'English uses specific grammatical structures to encode politeness,
    deference, and social awareness. These include: (1) modal remoteness (using past
    forms of modals to soften requests), (2) past continuous for tentativeness, (3)
    negative questions for suggestions, and (4) conditional structures for hypothetical
    politeness. These strategies create social distance that signals respect.'
  example_generator:
    contexts:
    - restaurant service
    - workplace requests
    - customer service
    - formal invitations
    - asking favours
    cultural_notes:
    - British English relies heavily on grammatical politeness strategies. Direct
      requests can sound rude in British culture, whereas in some cultures (e.g.,
      German, Dutch, Israeli) directness is valued differently.
    min_examples: 5
  timeline: Politeness structures often use past tense forms (would, could, was wondering)
    to create psychological distance, even when referring to present or future situations.
phonetics:
- example_generator:
    contexts:
    - intonation in polite requests
  l1_issue: Speakers from cultures where falling intonation is standard for requests
    (e.g., German, Dutch) may sound abrupt in English if they don't use rising intonation.
  note: Politeness is also conveyed through intonation — rising intonation on requests
    makes them sound more tentative and polite.
- example_generator:
    contexts:
    - stress patterns in hedging language
  l1_issue: Learners may over-stress hedging words, making them sound sarcastic rather
    than polite.
  note: Hedging words like 'possibly', 'just', and 'perhaps' are typically unstressed
    and spoken quickly, creating a sense of minimisation.
register_notes:
- note: 'Biber et al. (1999) — Politeness grammar: conversation uses more indirect
    speech acts; academic prose uses hedging for epistemological caution (different
    function). Politeness strategies are register-sensitive. Ch. 12.5'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 12.5
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8:
    Modal Auxiliaries and Related Phrasal Forms'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - Could you help me? (more polite than 'Can you help me?')
  - Would you mind waiting? (more polite than 'Do you mind waiting?')
  - Might I suggest an alternative? (very formal, more polite than 'May I suggest?')
  rule: Modal remoteness (past forms of modals for politeness)
  type: grammatical
- examples:
  - I was wondering if you could help me. (more polite than 'I wonder if...')
  - I was hoping you might have time to look at this. (more polite than 'I hope...')
  - I was thinking we could meet on Friday. (more polite than 'Let's meet on Friday.')
  rule: Past continuous for tentativeness
  type: grammatical
- examples:
  - Wouldn't it be better to wait? (suggestion framed as a question)
  - Couldn't we just ask him directly? (suggestion with 'couldn't')
  - Don't you think we should reconsider? (seeking agreement)
  rule: Negative questions for polite suggestions
  type: pragmatic
- examples:
  - If you could send me the file, I'd be very grateful.
  - I'd appreciate it if you would keep this confidential.
  - It would be wonderful if you could join us.
  rule: Conditional structures for hypothetical politeness
  type: grammatical
- examples:
  - Could you possibly give me a hand? ('possibly' softens the request)
  - Would you mind just checking this for me? ('just' minimises the imposition)
  - I was wondering if perhaps you might be free. ('perhaps' and 'might' add layers
    of tentativeness)
  rule: Softening adverbs and hedging
  type: lexical
teaching:
  methodology: PPP (Presentation, Practice, Production)
  recommended_activities:
  - adaptation_notes: Give students 10 requests. They rank them from most direct to
      most polite and discuss the grammatical features that create politeness.
    duration: 15
    name: Politeness Scale Ranking
  - adaptation_notes: Students work in pairs with scenario cards (e.g., 'Ask your
      boss for a day off', 'Refuse an invitation politely'). They must use appropriate
      politeness structures.
    duration: 25
    name: Role-Play Scenarios
  - adaptation_notes: Give students 5 direct requests. They must 'upgrade' each one
      to be progressively more polite, writing 3-4 versions of increasing politeness.
    duration: 15
    name: Politeness Upgrade
  - adaptation_notes: Students discuss how requests and refusals work in their L1
      compared to English. This raises awareness of cross-cultural pragmatic differences.
    duration: 20
    name: Cultural Comparison Discussion
  tips:
  - Present the concept of 'grammatical distance' — the more grammatical distance,
    the more polite.
  - 'Use a politeness scale: direct → could → would → would you mind → I was wondering
    if.'
  - 'Role-play scenarios: asking a stranger for directions, asking a boss for time
    off, refusing an invitation.'
  - Highlight the 'Would you mind...' trap — 'No' means 'I don't mind' (i.e., 'Yes,
    I'll do it').
  - Compare politeness across cultures — what sounds polite in English may sound excessive
    in other languages, and vice versa.
  - 'Practice intonation: polite requests typically have a rising or level intonation,
    not falling.'
  - 'Swan PEU: Generic reference — ''the tiger is endangered'' (species in general),
    ''a tiger is dangerous'' (any individual), ''tigers are dangerous'' (plurals general).
    The article choice signals different types of general statements.'
  - 'Swan PEU: Grammaticalizing politeness — past tense modals (could, would)
    create politeness through psychological distance. Past continuous (''I was wondering
    if...'') is more polite than present (''I wonder if...'').'
title: Grammatical Politeness (Would you mind..., Could I possibly..., I was wondering
  if)
use:
- context: Workplace and professional communication
  description: Politeness strategies are essential in professional settings to maintain
    good working relationships.
  examples:
  - Could you possibly review this report by Friday?
  - I was wondering if you might have time for a brief meeting.
  - Would you mind cc'ing me on that email?
- context: Customer service and service encounters
  description: Service staff use politeness structures to be helpful without being
    presumptuous.
  examples:
  - Would you like me to check availability for you?
  - Could I possibly take your name and number?
  - Might I suggest the special today? It's excellent.
- context: Asking favours
  description: When asking for a favour, speakers use increasingly polite structures
    to minimise the imposition.
  examples:
  - I don't suppose you could lend me a hand, could you?
  - Would you mind terribly if I asked you for a favour?
  - If it's not too much trouble, could you possibly water my plants while I'm away?
- context: Formal invitations and requests
  description: Formal events and written communication use the most elaborate politeness
    structures.
  examples:
  - We would be delighted if you could join us for dinner.
  - I would be most grateful if you could confirm your attendance.
  - Would it be convenient if we rescheduled to Thursday?
- context: Refusing and disagreeing politely
  description: Politeness strategies are also used when refusing or disagreeing to
    avoid causing offence.
  examples:
  - I'm afraid I won't be able to make it. (softened refusal)
  - That's a lovely idea, but I wonder if we might consider an alternative. (softened
    disagreement)
  - I see your point, though I can't help feeling we should look at other options.
