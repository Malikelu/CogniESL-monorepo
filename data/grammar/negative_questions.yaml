common_errors:
- correction: Why don't you like coffee?
  error: '*Why you don''t like coffee?*'
  explanation: Negative questions use auxiliary + subject order (don't you), not statement
    order (you don't). This is a common error across all L1 groups.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  - Korean
  - French
  - Italian
  - German
  - Dutch
  - Russian
  - Polish
  - Arabic
  - Turkish
  - Thai
  - Farsi
  - Hindi
  - Swahili
  - Malay
  reliability: D
- correction: I didn't see anybody. / She doesn't help him ever. / She never helps
    him.
  error: 'Using double negatives: *''I didn''t see nobody.'' / *''She doesn''t help
    him never.'''
  explanation: 'Swan & Smith (2001) Ch. 22: Spanish and French (among others) allow
    double negatives as standard grammatical constructions. In English, only one negative
    element is permitted per clause. Double negatives in English create a positive
    meaning, leading to confusion.'
  l1_groups:
  - Spanish
  - Portuguese
  - French
  - Italian
  - Russian
  - Polish
  - Arabic
  - Dutch
  - German
  reliability: B
  source: 'Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. 22: Spanish speakers, Negatives section; Ch. 26: French speakers.'
- correction: Do you like coffee?
  error: 'Using negative question for neutral question: *''Do not you like coffee?''
    (neutral)'
  explanation: 'Swan PEU: Negative questions express surprise, expectation, or invitation.
    "Do not you like coffee?" = "I am surprised you do not like it."'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 44.2. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: '''Do not you like coffee?'' ''No, I do not.'' / ''Yes, I do.'''
  error: 'Answering negative questions wrong: *''Do not you like coffee?'' ''Yes''
    (meaning: I do not like it)'
  explanation: 'Swan PEU: Yes/no answers to negative questions follow the FACT, not
    the question form. "Yes" = I do like it. "No" = I do not like it.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Japanese
  reliability: B
  source: Swan Entry 44.2. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: Questions that start with a negative auxiliary (n't or not) to express
  surprise, check assumptions, or confirm expectations.
dialectal_variation: []
discourse_notes:
- note: 'Negative questions serve pragmatic functions in discourse: expressing surprise,
    seeking confirmation, and making suggestions. The form carries different illocutionary
    force than positive questions.'
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      - social interactions
      min_examples: 4
    structure: 'Yes/No negative questions: Auxiliary + n''t + subject + verb / Auxiliary
      + subject + not + verb (less common)

      Wh- negative questions: Wh-word + auxiliary + n''t + subject + verb

      Auxiliary matches the tense (do/does/did for present/past, is/are/was/were for
      be)

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Double negative is incorrect: ''Don''t you not like coffee?'' is wrong'
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Same as affirmative, with question mark
grammar_point: negative_questions
level: B1
meaning:
  ccqs:
  - answer: To express surprise, make suggestions, or check information.
    purpose: Tests whether the learner understands that negative questions (Don't
      you like it?) are used to express surprise or seek confirmation, not to ask
      a genuine question.
    question: When do we use negative questions
  - answer: Answer based on the fact, not the question form.
    purpose: Tests understanding of negative_questions.
    question: How do we answer negative questions
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with
      negative questions and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: It is a suggestion. 'Why don't you...?' is a fixed polite suggestion structure,
      not a genuine negative question asking for a reason.
    purpose: Tests whether the learner can distinguish between true negative questions
      (used to express surprise or check assumptions, like 'Don't you like coffee?')
      and the fixed suggestion structure 'Why don't you...?' which functions as a
      polite imperative rather than a real question.
    question: Is 'Why don't you sit down?' a real question or a suggestion?
  contrast: 'Positive question: ''Do you like coffee?'' (neutral information)

    Negative question: ''Don''t you like coffee?'' (surprise that you don''t, or assumes
    you do)

    ''Why don''t you X?'' = Suggestion: ''Why don''t you sit down?'' (not a real negative
    question)

    '
  core_meaning: Expresses surprise at something unexpected, checks an assumption the
    speaker has, or confirms a shared expectation. 'Why don't you X?' is a fixed suggestion
    structure, not a true negative question.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Uses the same auxiliary tenses as positive questions (present, past, etc.).
phonetics:
- example_generator:
    contexts:
    - negative question intonation
  l1_issue: Portuguese and Spanish speakers often use rising intonation for all questions.
    Teach falling intonation for negative questions expecting agreement.
  note: 'Negative questions often have rising intonation when expressing surprise:
    ''Do not you like coffee? ↗'' Falling intonation when expecting agreement: ''Do
    not you like coffee? ↘'''
register_notes:
- note: 'Biber et al. (1999) — Negative questions and negation: register distribution
    differs markedly. Contracted negatives (don''t, can''t) dominate in conversation;
    full forms more common in academic prose. Ch. 3.8'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 3.8
