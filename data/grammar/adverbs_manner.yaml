common_errors:
- correction: She drives carefully.
  error: 'Using adjective instead of adverb: *''She drives careful.'''
  explanation: 'Swan PEU: Adverbs of manner modify verbs. ''She danced happily'' NOT
    ''She danced happy.'' Use adverbs (not adjectives) to describe how an action is
    performed.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: She drives carefully.
  error: 'Placing manner adverb between verb and object: *''She speaks fluently English.'''
  explanation: 'Swan PEU: Manner adverbs must not be placed between the verb and its
    direct object. End position (after the object) is the standard slot. This is a
    common cross-linguistic error — learners insert the adverb directly after the
    verb following L1 patterns where verb-adverb adjacency is normal.'
  l1_groups:
  - French
  - Italian
  - Spanish
  - Portuguese
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 5: Adverbs.'
description: 'Words that tell us how something is done: quickly, slowly, carefully,
  well, badly, quietly, loudly.'
dialectal_variation:
- note: 'In informal speech, ''real'' is sometimes used instead of ''really'': ''She
    drives real careful.'' (non-standard)'
discourse_notes:
- note: 'Manner adverbs describe how actions are performed: ''She spoke quietly.'''
- note: Manner adverbs help create vivid description in narratives and precise instructions
    in procedural texts.
