grammar_point: adverbs_manner
level: A1
meaning:
  ccqs:
  - answer: The message is the same, but the focus is different. 'She drove carefully'
      puts the focus on the manner (how she drove). 'Carefully, she drove' puts the
      focus on the carefulness itself — it sounds more formal or literary.
    purpose: Tests whether the learner understands that adverb position affects emphasis
      and register, not just grammaticality. This matters because choosing the wrong
      position can sound unnatural or overly formal in casual conversation.
    question: '''She drove carefully to the store'' versus ''Carefully, she drove
      to the store'' — do these mean the same thing? Which sounds more natural in
      everyday conversation?'
  - answer: '''I spoke quietly to the baby'' sounds natural. ''I quietly spoke to
      the baby'' sounds slightly more formal or literary. Both are correct but the
      end position is more common in conversation.'
    purpose: Tests understanding that adverb position is not just a fixed rule but
      a matter of naturalness and register. Most L1 transfer errors come from applying
      L1 position rules without awareness of English naturalness patterns.
    question: You want to tell someone you lowered your voice when talking to a baby.
      Which sounds more natural in everyday English — 'I spoke quietly to the baby'
      or 'I quietly spoke to the baby'?
  - answer: '''She spoke quiet'' is wrong. We need an adverb (carefully, quietly,
      fast) not an adjective (careful, quiet, fast-as-adjective) to describe how an
      action is done. English uses -ly to turn most adjectives into adverbs of manner.'
    purpose: Tests the adjective-vs-adverb distinction in a communicative context
      (would the listener understand?), not as a labeling exercise.
    question: A student writes 'She spoke quiet to the baby.' Is this clear to an
      English listener? What's the difference between 'quiet' and 'quietly' here?
  - answer: '''He runs fast'' — fast is an adverb here (not an adjective). Some words
      like fast, hard, early, late have the same form for both adjective and adverb.
      You do NOT need to add -ly. ''He runs fastly'' would be incorrect.'
    purpose: Tests whether the learner knows that not all adverbs end in -ly, and
      that adding -ly to words like ''fast'' or ''hard'' creates non-existent words.
      This is a genuine learner confusion — some learners overgeneralize the -ly rule.
    question: A student wants to say someone runs quickly. They write 'He runs fastly.'
      Is 'fastly' a word? What should they say instead?
  contrast: '''Adverb of manner'' = ''She sings beautifully.'' (how?) vs ''Adverb
    of frequency'' = ''She always sings.'' (how often?)'
  core_meaning: Adverbs of manner describe HOW an action is performed. They usually
    go after the verb.
  example_generator:
    contexts:
    - describing actions
    - giving instructions
    - telling stories
    - describing people's behavior
    cultural_notes: []
    min_examples: 5
  timeline: Timeless — describes the manner of an action in any tense.
phonetics:
- contexts:
  - pronunciation
  example_generator:
    contexts:
    - connected speech
  l1_issue: Some L1 speakers omit the -ly ending
  note: -ly ending pronounced as /li/
register_notes:
- note: Manner adverbs are neutral in register.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, adverbs add precision: ''The data were carefully analyzed.'''
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (1999) — Manner adverb distribution varies by register. Fiction
    uses more manner adverbs for vivid description; academic prose uses fewer manner
    adverbs and more degree/intensifying adverbs. Ch. 12.5
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 12.5
- note: 'GB 2nd ed. (Ch.25) notes that adverb placement varies by register: formal
    writing prefers mid-position adverbs (''The results clearly show...''); informal
    speech prefers end-position (''The results show... clearly''). Fronted manner
    adverbs are formal/literary: ''Quickly, she left the room'' (literary) vs ''She
    quickly left the room'' (standard).'
  source: Team observation
  reliability: D
  tier: 4
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch.
    14: Adverbs'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25:
    Adverbs'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Ch. 6: Adverbs (adverbs of manner)'
