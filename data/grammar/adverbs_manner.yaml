sub_rules:
- examples:
  - quick → quickly
  - careful → carefully
  - quiet → quietly
  rule: 'Most adverbs of manner: adjective + -ly'
  type: spelling
- examples:
  - She sings well. (not goodly)
  - He runs fast. (not fastly)
  rule: 'Irregular: good → well, fast → fast, hard → hard'
  type: irregular
- examples:
  - She speaks English fluently.
  - He drove carefully.
  rule: 'Position: after the verb or at the end of the sentence'
  type: word_order
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students act out actions, others describe using adverbs.
    duration: 10
    name: Act and Describe
  tips:
  - Use actions and demonstrations
  - Contrast adjective vs adverb (quick vs quickly)
  - 'Swan PEU: Adverbs of manner should not be confused with adjectives. ''She danced
    happily'' (adverb修饰verb) NOT ''She danced happy.'' Some adjective forms are used
    as adverbs in informal AmE: ''She talks funny.'''
  - 'Swan PEU: Adverbs of manner can also modify adjectives, past participles, other
    adverbs, and prepositional phrases: ''terribly cold,'' ''badly cooked,'' ''unusually
    fast,'' ''madly in love.'''
  - 'Swan PEU: Confusing cases — some -ly words are adjectives not adverbs (friendly,
    lively, lovely, ugly). Don''t say ''she spoke friendly''; say ''she spoke in a
    friendly way'' OR ''she was friendly.'''
title: Adverbs of Manner
use:
- context: Describing how people do things
  description: Talking about the quality of actions
  examples:
  - She speaks English very well.
  - He drives too fast.
- context: Giving instructions
  description: Telling someone how to do something
  examples:
  - Listen carefully.
  - Speak slowly and clearly.
