common_errors:
- correction: Well, I think that... / So, I think that... / Actually, I think that...
  error: '*Well, I think that...* (overuse of ''well'')'
  explanation: Pragmatic particles (well, so, actually, you know) have specific discourse functions. 'Well' signals a qualification
    or disagreement. Overusing 'well' sounds unnatural.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: D
description: Words and short expressions that convey speaker attitude, emphasis, hedging, or pragmatic nuance rather than
  core lexical meaning. They subtly shape how a message is received.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - casual conversation
      - professional emails
      - academic discussion
      min_examples: 4
    structure: 'Particle inserted before or after the element it modifies. Common positions: before adjectives/adverbs (really
      good), before verbs (just wanted), after ''be'' (It''s actually quite nice), or at the end of a clause for discourse
      markers (basically,).'
  negative:
    example_generator:
      contexts:
      - expressing disagreement
      - softening criticism
      - hedging in negative statements
      min_examples: 3
    structure: 'Particles can appear in negative sentences, typically before the negated element or after the auxiliary: ''It''s
      not really a problem,'' ''I just don''t understand,'' ''She simply wouldn''t listen.'''
  questions:
    example_generator:
      contexts:
      - checking understanding
      - polite requests
      - expressing surprise
      min_examples: 3
    structure: 'Particles in questions often soften or add nuance: ''Are you really sure?'' (surprise/doubt), ''Could you
      just help me?'' (politeness), ''Do you actually mean that?'' (seeking confirmation).'
grammar_point: pragmatic_particles
level: C1
meaning:
  ccqs:
  - answer: No — 'I was wondering' has the same factual content. 'Just' softens the request, making it less imposing.
    purpose: Tests whether the learner understands that English uses pragmatic particles (well, you know, I mean, like, actually)
      to manage conversation, express attitude, and signal discourse functions.
    question: If I remove 'just' from 'I was just wondering,' does the core meaning change?
  - answer: No — it intensifies the speaker's emotional reaction but does not change the proposition.
    purpose: Tests understanding of pragmatic_particles.
    question: In 'That's really incredible,' does 'really' add new information?
  - answer: Yes — they are pragmatically optional, not grammatically required.
    purpose: Tests understanding of pragmatic_particles.
    question: Can pragmatic particles be removed without making the sentence ungrammatical?
  - answer: '''I have not finished yet.'' ''Yet'' goes at the end of negative sentences and questions.'
    purpose: Tests whether the learner places 'yet' correctly at the end of negative sentences (Swan PEU 2016, entry 468).
    question: Which is correct? *'I have yet finished' or 'I have not finished yet'?
  contrast: Unlike adverbs of manner (e.g., 'quickly', 'carefully'), pragmatic particles do not describe how an action is
    performed; they comment on the speaker's attitude toward the proposition. Removing a pragmatic particle does not change
    the truth conditions of the sentence.
  core_meaning: Pragmatic particles are words inserted into utterances to signal the speaker's stance — such as emphasis,
    surprise, hedging, solidarity, or impatience — without changing the factual content of the sentence.
  example_generator:
    contexts:
    - casual conversation
    - professional emails
    - academic discussion
    - customer service interactions
    - social media
    cultural_notes:
    - British English uses 'quite' as a downtoner (quite good = moderately good), whereas American English often uses it as
      an intensifier (quite good = very good).
    - '''Just'' is one of the most overused pragmatic particles in English and can sound dismissive if overused.'
    min_examples: 5
  timeline: Timeless — pragmatic particles can be used with any tense.
phonetics:
- example_generator:
    contexts:
    - spoken emphasis
    - presentations
  l1_issue: Speakers of languages with less prosodic variation (e.g., French, Japanese) may under-stress emphasising particles,
    losing the intended effect.
  note: 'Emphasising particles (really, absolutely, simply) carry strong stress and often a higher pitch: ''That''s ABsolutely
    FANtastic.'''
- example_generator:
    contexts:
    - casual speech
    - polite requests
  l1_issue: Learners may over-pronounce downtoning particles, making requests sound more emphatic than intended.
  note: 'Downtoning particles (just, a bit, sort of) are typically unstressed and spoken quickly, almost blending into surrounding
    words: ''I was just wondering'' reduces to something like /dʒəsˈwʌndərɪŋ/.'
- example_generator:
    contexts:
    - conversation management
    - presentations
  l1_issue: Learners may not use pauses before discourse markers, making topic shifts feel abrupt.
  note: Discourse markers (basically, anyway) are often preceded by a brief pause and spoken with falling intonation, signalling
    a topic shift.
register_notes:
- note: 'Biber et al. (2021) — Pragmatic particles/discourse markers (''well'', ''oh'', ''you know''): overwhelmingly conversational.
    Among the strongest markers of spoken language. Ch. 14'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 14
