sub_rules:
- examples:
  - That's absolutely brilliant!
  - I simply can't believe what happened.
  - She really outdid herself this time.
  - It was just perfect.
  rule: Emphasising particles (really, absolutely, simply, just)
  type: pragmatic
- examples:
  - I was just wondering if you had a moment.
  - It's quite cold today, actually.
  - I'm a bit tired, actually.
  - It's rather expensive, isn't it?
  rule: Downtoning/hedging particles (just, quite, rather, a bit)
  type: pragmatic
- examples:
  - Basically, we need to start over.
  - Actually, I think you're right.
  - Anyway, let's move on to the next point.
  - Obviously, that wasn't the plan.
  rule: Discourse-organising particles (basically, actually, anyway, obviously)
  type: discourse
- examples:
  - It was, you know, one of those days.
  - I mean, I understand where she's coming from.
  - It's sort of hard to explain.
  - I was kind of hoping you'd be there.
  rule: Solidarity and rapport particles (you know, I mean, sort of, kind of)
  type: interactional
teaching:
  methodology: Guided discovery — present authentic dialogues and have learners identify particles, then discuss what would
    change if each particle were removed.
  recommended_activities:
  - adaptation_notes: Give learners a dialogue rich in pragmatic particles. They remove all particles and compare the tone
      of the original vs. the stripped version. Discuss how the tone changes.
    duration: 15
    name: Particle Removal
  - adaptation_notes: 'Give learners a neutral sentence (e.g., ''I want to ask a question''). They must add different particles
      to make it sound: polite, enthusiastic, uncertain, and dismissive.'
    duration: 20
    name: Tone Shifting
  - adaptation_notes: Play a short podcast clip or dialogue. Learners tally each pragmatic particle they hear and discuss
      its function in context.
    duration: 15
    name: Listening for Particles
  - adaptation_notes: Present sentences with 'quite' in both British and American contexts. Learners identify whether the
      speaker means 'very' or 'moderately' and discuss potential misunderstandings.
    duration: 10
    name: British vs American Quite
  tips:
  - 'Start with the most common particles: just, really, quite, actually, basically.'
  - 'Use minimal pairs: ''I like it'' vs ''I really like it'' vs ''I just like it'' to show how particles change tone.'
  - Teach the British/American difference for 'quite' explicitly to avoid confusion.
  - Record learners in conversation and have them notice their own particle use.
  - Warn learners that overusing 'just' can sound dismissive or apologetic.
  - 'Swan PEU: Pragmatic particles in spoken English — ''well,'' ''you know,'' ''I mean,'' ''like,'' ''sort of,'' ''kind of,''
    ''actually.'' These manage conversation flow and signal speaker stance. They have grammatical functions: hedging, focusing,
    politeness.'
  - 'Swan PEU: ''Like'' as a pragmatic particle — ''It was, like, amazing.'' NOT the same as the verb ''like'' or preposition
    ''like.'' Very common in informal speech, especially among younger speakers. Grammaticalized discourse function.'
title: Pragmatic Particles (just, really, quite, simply, actually, basically)
use:
- context: Softening requests and suggestions
  description: Particles like 'just' and 'a bit' make requests sound less demanding and more polite.
  examples:
  - Could you just send me the file when you get a chance?
  - I was just thinking we might try a different approach.
  - Would you mind waiting a bit longer?
- context: Expressing emphasis or strong emotion
  description: Particles like 'really,' 'absolutely,' and 'simply' intensify the speaker's emotional response.
  examples:
  - That was really impressive.
  - I absolutely loved the presentation.
  - She simply refused to give up.
- context: Hedging and showing uncertainty
  description: Particles like 'sort of,' 'kind of,' and 'quite' allow speakers to avoid committing fully to a statement.
  examples:
  - I sort of agree with you, but I have some reservations.
  - It's kind of a difficult situation.
  - The results are quite promising, actually.
- context: Managing conversation flow
  description: Discourse particles like 'basically,' 'actually,' and 'anyway' help organise and steer conversation.
  examples:
  - Basically, the whole system needs an overhaul.
  - Actually, I wanted to ask you something.
  - Anyway, that's enough about me. How are you?
- context: Expressing surprise or disbelief
  description: Particles like 'really' and 'actually' signal that the speaker is surprised or seeking confirmation.
  examples:
  - Are you really moving to Japan?
  - He actually said that to your face?
  - You're quite serious, aren't you?
