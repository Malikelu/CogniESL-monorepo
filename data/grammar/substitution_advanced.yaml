common_errors:
- correction: I want to. / I do.
  error: 'Using ''so'' with non-mental verbs: *''I want so.'''
  explanation: '''So'' as a clause substitute only works with specific mental process verbs (think, believe, hope, expect,
    suppose, imagine, guess). It cannot be used with verbs like ''want'', ''need'', or ''like''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I ate the cake and she did too.
  error: 'Using ''do so'' for single-verb replacement: *''I ate the cake and she did so too.'''
  explanation: '''Did too'' (or ''did as well'') is the correct substitute for a single verb phrase. ''Do so'' is used for
    more complex verb phrases or actions, particularly in formal contexts. Using ''do so'' for simple actions sounds overly
    formal.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: D
- correction: I'd like some ice cream. Which flavor? / I'd like an ice cream. Which one?
  error: 'Using ''one'' with uncountable nouns: *''I''d like some ice cream. Which one?'''
  explanation: '''One/ones'' can only replace countable nouns. For uncountable nouns, use other strategies (repeating the
    noun, using ''some'', or rephrasing). This is a common error when learners overgeneralize the ''one'' substitution rule.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Korean
  reliability: D
description: Using pro-forms (do so, so, not, one/ones, that/those) to avoid repetition and create cohesion in discourse.
dialectal_variation: []
discourse_notes:
- note: Substitution is essential for creating natural, cohesive discourse in both writing and speech. It is a key marker
    of advanced proficiency.
example_generator:
  contexts:
  - academic discussion
  - professional meetings
  - casual conversation
  - written discourse
  cultural_notes:
  - Mastery of substitution is a key indicator of advanced proficiency and natural-sounding English.
  min_examples: 5
form:
  affirmative:
    example_generator:
      contexts:
      - formal writing
      - spoken discourse
      min_examples: 4
    structure: do so (replaces verb phrase) / so (replaces that-clause after mental verbs) / one/ones (replaces countable
      noun) / that/those (replaces noun phrase or clause)
  negative:
    example_generator:
      contexts:
      - negative responses
      - denying assumptions
      min_examples: 3
    structure: do not do so / think not / hope not / not + one/ones
  questions:
    example_generator:
      contexts:
      - confirming information
      - clarifying choices
      min_examples: 3
    structure: Do you think so? / Is that so? / Will they do so? / Which one?
grammar_point: substitution_advanced
level: B2
meaning:
  ccqs:
  - answer: A whole action or activity -- it's a clause substitute.
    purpose: Tests whether the learner understands that 'do so' is a clause-level substitute (replacing an entire verb phrase),
      not a single-verb substitute, which helps them use it correctly in context.
    question: Does 'do so' replace a single verb or a whole action/activity?
  - answer: No -- 'so' as a substitute works with certain verbs like 'think', 'believe', 'hope', 'expect', 'suppose'.
    purpose: Tests whether the learner knows that 'so' substitution is limited to specific mental process verbs and cannot
      be used with any verb, which prevents overgeneralization errors.
    question: Can we use 'so' after any verb?
  - answer: A whole clause -- 'that' substitutes for the previous statement.
    purpose: Tests whether the learner understands that 'that' can function as a clause substitute (referring back to an entire
      proposition), which is essential for advanced cohesion in both writing and speech.
    question: Is 'that' in 'That's true' replacing a noun or a clause?
  - answer: '''I don''t think she will come.'' English prefers to transfer negation to the main clause: ''I don''t think...'''
    purpose: Tests whether the learner uses negation transfer with 'think', 'believe', 'suppose' (Swan PEU 2016, entry 222.4).
    question: Which is correct? 'I don't think she will come' or *'I think she will not come'?
  contrast: 'Compare with ellipsis (omission): ''I like tea and she does too'' (substitution with ''does'') vs. ''I like tea
    and she ___ too'' (ellipsis). Both avoid repetition but use different mechanisms.'
  core_meaning: Substitution replaces previously mentioned words or clauses with shorter forms to avoid repetition and maintain
    fluency. Advanced substitution involves 'do so', 'so' with mental process verbs, and 'that/those' as clause substitutes.
  timeline: Applies across all tenses; the substitute form adapts to the tense of the original clause.
phonetics:
- example_generator:
    contexts:
    - conversational fluency drills
  l1_issue: Speakers of languages that don't use pro-forms extensively (e.g., Japanese) may over-repeat nouns and verbs instead
    of substituting.
  note: '''Do so'' is often reduced in speech: /də soʊ/. ''So'' in ''think so'' is stressed for emphasis.'
register_notes:
- note: Substitution is used across all registers. 'Do so' and 'that/those' are more formal; 'so/not' and 'one/ones' are neutral.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Substitution (do so, do it, do that): register distribution varies. Academic prose uses more
    ''do so''; conversation uses more ''do it/that''. Ch. 12.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 12.2
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24: Coordination-16.7'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - They promised to deliver on time, and they did so.
  - I told her to revise the report, and she did so carefully.
  rule: '''Do so'' replaces a verb phrase: ''She asked him to leave, and he did so immediately.'''
  type: grammatical
- examples:
  - Will it rain? I think so.
  - Is she coming? I believe so.
  - Was it expensive? I'm afraid so.
  rule: '''So'' replaces a that-clause after verbs of thinking/believing: ''I think so'', ''I hope so'', ''I''m afraid so.'''
  type: grammatical
- examples:
  - Is it finished? I think not.
  - Will there be trouble? I trust not.
  rule: '''Not'' replaces a negative that-clause: ''Will they come? I think not.'' / ''I hope not.'''
  type: grammatical
- examples:
  - Which dress do you prefer? The red one.
  - I don't like these shoes. Do you have any cheaper ones?
  rule: '''One/ones'' replaces a countable noun: ''I''d like the blue one.'' / ''These ones are better.'''
  type: grammatical
- examples:
  - Her writing style is similar to that of Austen.
  - The cost of living here is lower than that in London.
  rule: '''That/those'' replaces a noun phrase with post-modification: ''The population of London is greater than that of
    Paris.'''
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students read a text and underline all substitution devices, identifying what each replaces.
    duration: 10
    name: Substitution identification
  - adaptation_notes: Students fill gaps with appropriate pro-forms (do so, so, one, that, etc.).
    duration: 10
    name: Gap-fill exercise
  - adaptation_notes: Students rewrite a repetitive text using substitution to improve flow.
    duration: 15
    name: Rewriting for cohesion
  tips:
  - Start with 'one/ones' as it is the most concrete and visual substitution type.
  - Move to 'so/not' with mental verbs, then 'do so' for verb phrase substitution.
  - Introduce 'that/those' in comparative structures last as it is the most abstract.
  - Use gap-fill exercises where students must choose the correct pro-form.
  - Encourage students to identify substitution in authentic texts.
  - 'Swan PEU: Substitution with ''do so'' — ''She asked me to leave, and I did so.'' Formal version. Also: ''She said she
    would call, and she did.'' ''Do'' substitutes for the main verb. ''One'' substitutes for a noun: ''a big one.'''
title: Advanced Substitution (pro-forms)
use:
- context: Academic and formal writing
  description: Creating cohesion and avoiding repetition in essays and reports.
  examples:
  - The results were significant, and they do so consistently across trials.
  - The economy of Japan is stronger than that of Italy.
- context: Professional communication
  description: Efficient and clear workplace discourse.
  examples:
  - Please complete the form and return it. If you have not done so, please do so by Friday.
  - We expected resistance, and we were right to think so.
- context: Everyday conversation
  description: Natural, fluent spoken English.
  examples:
  - Are you coming tonight? I think so.
  - Which bag is yours? The leather one.
  - I hope so. I really hope so.
- context: Comparative structures
  description: Using 'that/those' to avoid repeating the head noun in comparisons.
  examples:
  - The climate here is milder than that of the north.
  - Her test scores were higher than those of her classmates.
