sub_rules:
- examples:
  - a delicious meal (opinion) vs. a French meal (fact)
  - an ugly building (opinion) vs. a brick building (material)
  rule: Opinion before fact
  type: grammatical
- examples:
  - a big old house
  - a small young puppy
  - a tiny new-born baby
  rule: Size before age
  type: grammatical
- examples:
  - an old round table
  - a new square box
  - a young slender model
  rule: Age before shape
  type: grammatical
- examples:
  - a round red ball
  - a flat blue screen
  - a long black dress
  rule: Shape before colour
  type: grammatical
- examples:
  - a red Italian sports car
  - a blue Japanese motorbike
  - a green Egyptian cotton shirt
  rule: Colour before origin
  type: grammatical
- examples:
  - a French silk scarf
  - a Brazilian leather bag
  - a Chinese porcelain vase
  rule: Origin before material
  type: grammatical
- examples:
  - a wooden cooking spoon
  - a plastic gardening pot
  - a stainless steel frying pan
  rule: Material before purpose
  type: grammatical
- examples:
  - a beautiful old house (3 is natural)
  - a beautiful large old round red Italian wooden dining table (grammatically correct but unwieldy in speech)
  rule: Maximum of three adjectives is most natural
  type: pragmatic
teaching:
  methodology: Mnemonic-based explicit instruction with practice
  recommended_activities:
  - adaptation_notes: 'Teach the mnemonic: Opinion, Size, Age, Shape, Colour, Origin, Material, Purpose. Have students memorise
      it and apply it to example sentences.'
    duration: 10
    name: OSASCOMP mnemonic
  - adaptation_notes: Give students sets of jumbled adjectives and a noun. They must arrange them in the correct order. Works
      well as a team competition.
    duration: 15
    name: Adjective ordering game
  - adaptation_notes: Show pictures of objects and have students describe them using at least three adjectives in the correct
      order. Peer correction encouraged.
    duration: 15
    name: Picture description
  - adaptation_notes: Provide sentences with incorrect adjective order and have students identify and correct them. Good for
      individual or pair work.
    duration: 10
    name: Error correction
  tips:
  - 'Parrott (2000) Ch. 4: Adjective order rule of thumb — general before specific, opinion before description. Detailed order:
    size, shape/age, colour, origin, material, purpose. When three or more adjectives appear before a noun, use commas between
    them and and before the final one (a dark, gloomy and terrifying forest). Source: Parrott (2000) Grammar for English Language
    Teachers, 2nd ed. Ch. 4: Adjectives, 4.5.'
  - Teach the OSASCOMP mnemonic (Opinion, Size, Age, Shape, Colour, Origin, Material, Purpose) as a memory aid.
  - Point out that native speakers follow this order intuitively but cannot always explain why.
  - Limit practice to 2-3 adjectives at a time; more than three sounds unnatural in most contexts.
  - Contrast with the student's L1 adjective order to raise awareness of differences.
  - 'Swan PEU: Order of adjectives — the canonical order is: opinion-size-age-shape-color-origin-material-purpose. For example:
    ''a beautiful small old round brown Italian leather traveling bag.'' Teach the mnemonic ''OSAShCOMP'' (Opinion, Size,
    Age, Shape, Color, Origin, Material, Purpose).'
  - 'Swan PEU: Native speakers follow this order intuitively but rarely can explain it. Learners should practice with real
    examples. Multiple adjectives of the same category go together: ''a kind, generous person'' (two opinion adjectives).
    Use commas between same-category adjectives, no comma between different categories.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 6: CGEL (Ch.6) notes that some adjectives are ATTRIBUTIVE-ONLY
    (''former,'' ''main,'' ''mere,'' ''very,'' ''alleged'') or PREDICATIVE-ONLY (''afraid,'' ''alive,'' ''alone,'' ''asleep,''
    ''aware''). Some change meaning by position: ''the present members'' = members who are here now; ''the members present''
    = members who are here (postposed, reduced relative). ''The late queen'' = deceased (not ''former''). L1s with obligatory
    pre/post-nominal adjective distinction (French, Spanish) may transfer this pattern.'
title: Adjective Order
use:
- description: Used when giving detailed descriptions of items, especially in shopping, catalogues, and reviews.
  examples:
  - She bought a beautiful small silver Swiss watch.
  - He drives a fast new black German car.
  - I'd like a large round wooden dining table.
  key_point: Essential for natural-sounding descriptions in both speech and writing.
  name: Describing objects and products
- description: Used in creative writing, travel writing, and journalism to create vivid descriptions.
  examples:
  - They lived in a charming little old stone cottage.
  - The museum displayed a rare ancient Egyptian gold necklace.
  - We sat at a long white marble bar.
  key_point: Good adjective ordering makes writing sound fluent and native-like.
  name: Writing and storytelling
- description: Used when describing someone's appearance to help identify them.
  examples:
  - I saw a tall young blonde woman.
  - He's a short middle-aged bald man.
  - She was carrying a small brown leather handbag.
  key_point: Common in police descriptions, lost-person reports, and everyday conversation.
  name: Identifying people
