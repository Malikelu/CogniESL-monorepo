- error: '[See Adjective Placement transfer patterns]'
  explanation: Native syntax places adjectives after nouns; this word order is directly transferred to English (e.g., "I read
    a book interesting")
  l1_groups:
  - Arabic
  - Spanish
  - Vietnamese
  reliability: C
  source: 'L1 Interference ESL Teacher Resources — Comparative Analysis of Cross-Linguistic Influence: Best-in-Class Resources
    and L1 Interference Databases for English Language Educators.'
  tier: 4
- correction: 'When all adjectives qualify the same noun before it, separate with commas: "a terrifying, dark, gloomy clearing".
    With three or more pre-noun adjectives, use AND before the final one: "a dark, gloomy and terrifying clearing". After
    the noun, also use AND before the last: "The clearing was dark, gloomy and terrifying."'
  error: Missing commas and AND with multiple pre-noun adjectives (e.g., *"a terrifying dark gloomy clearing" or *"a dark
    gloomy terrifying clearing")
  explanation: 'Parrott distinguishes two comma/AND rules for adjectives: (1) pre-noun adjectives that all qualify the same
    noun are comma-separated; (2) when three or more adjectives precede a noun, AND is required before the final adjective.
    The same AND-before-last rule applies when adjectives follow the noun in predicative position. Learners often omit both
    commas and AND, producing unnatural strings.'
  l1_groups:
  - Spanish
  - French
  - Italian
  - Portuguese
  - Chinese
  - Japanese
  reliability: A
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 4: Adjectives-4.7.'
- correction: '"absolutely fantastic" / "very big" / "quite amazing = completely amazing"'
  error: '*"very fantastic" / *"absolutely big" / *"quite amazing = rather amazing"'
  explanation: 'Parrott distinguishes gradable adjectives (big, good, tired — can vary in degree) from ungradable/extreme
    adjectives (fantastic, enormous, exhausted, freezing — already at an extreme). The adverb choice must match: very/fairly/rather
    collocate only with gradable adjectives ("very big", "fairly good", "rather tired"); absolutely/completely/totally collocate
    only with ungradable adjectives ("absolutely fantastic", "completely wrong", "totally exhausted"). "Quite" behaves differently
    depending on adjective type: with a gradable adjective it is a downtowner meaning less than ''very'' ("quite good" = not
    very good); with an ungradable adjective it is an intensifier meaning completely ("quite amazing" = absolutely amazing).
    Mixing these (e.g., *"very fantastic", *"absolutely big") is a persistent learner error.'
  l1_groups:
  - Spanish
  - French
  - Italian
  - Portuguese
  - German
  - Chinese
  - Japanese
  - Arabic
  reliability: A
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 4: Adjectives-4.7.'
- correction: '"The lecture was boring." / "The students were bored."'
  error: '*"The lecture was bored." / *"The students were boring."'
  explanation: 'Parrott identifies the -ing/-ed participial adjective distinction as a core learner difficulty: the -ing form
    describes the cause or source of a feeling (a boring lecture — the lecture causes boredom; an interesting book — the book
    causes interest); the -ed form describes the effect on the experiencer (bored students — the students experience boredom;
    interested learners — the learners experience interest). Confusion between these forms is one of the most frequent adjective
    errors across all L1 groups. This is distinct from adjective ordering: it is a meaning/form selection error, not a sequence
    error.'
  l1_groups:
  - Spanish
  - French
  - Italian
  - Portuguese
  - German
  - Chinese
  - Japanese
  - Arabic
  - Korean
  - Turkish
  reliability: A
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press. Ch. 4: Adjectives-4.7.'
description: The fixed sequence in which multiple adjectives appear before a noun in English, following a set order of opinion,
  size, age, shape, colour, origin, material and purpose.
dialectal_variation: []
discourse_notes:
- note: 'In conversation, adjective order is rarely tested directly but errors sound unnatural: *''a red big car'' (incorrect
    order)'
- note: 'In academic writing, adjective order appears in descriptions: ''A large-scale longitudinal study was conducted.'''
- note: 'In creative writing, adjective order creates vivid imagery: ''The old wooden house stood at the end of the lane.'''
form:
  affirmative:
    example_generator:
      contexts:
      - describing products
      - estate agent descriptions
      - museum catalogues
      - travel writing
      min_examples: 4
    structure: 'Determiner + opinion + size + age + shape + colour + origin + material + purpose + noun. Example: ''a lovely
      small old rectangular brown French oak writing desk'''
  negative:
    example_generator:
      contexts:
      - complaints
      - expressing dissatisfaction
      - negative reviews
      min_examples: 4
    structure: 'The same adjective order applies in negative sentences. Example: ''It wasn''t a beautiful large old house.''
      / ''I don''t want a cheap plastic Chinese phone.'''
  questions:
    example_generator:
      contexts:
      - asking for descriptions
      - identifying people
      - shopping questions
      min_examples: 3
    structure: 'Questions follow the same order. Example: ''Is this a genuine Italian leather bag?'' / ''Did you see the tall
      young blonde woman?'''
grammar_point: adjective_order
level: B2
meaning:
  ccqs:
  - answer: Opinion adjectives (beautiful, ugly, nice) come before material adjectives (wooden, plastic, silk).
    purpose: 'Tests whether the learner understands the standard adjective order in English: opinion → size → age → shape
      → color → origin → material → purpose.'
    question: Does this adjective describe what someone thinks of the thing, or what it is made of?
  - answer: No - size comes before colour, so it should be 'a big red car'.
    purpose: 'Tests whether the learner can apply the order rule to multiple-adjective noun phrases: ''a beautiful old Italian
      leather bag.'''
    question: Can you say 'a red big car'?
  - answer: A beautiful old Italian leather bag. The order is opinion, age, origin, material. Violating this order sounds
      unnatural to native speakers.
    purpose: Tests whether the learner can apply the standard adjective order (Swan PEU 2016, entries 261-270).
    question: 'Which sounds natural: ''a beautiful old Italian leather bag'' or *''a leather Italian old beautiful bag''?'
  - answer: 'A big red car. Size comes before colour in adjective order (OSASCOMP: Opinion, Size, Age, Shape, Colour, Origin,
      Material, Purpose).'
    purpose: Tests whether the learner can apply the size-before-colour rule (Swan PEU 2016, entry 261).
    question: 'Which comes first: size or colour? ''A big red car'' or *''a red big car''?'
  contrast: 'Correct order: "a beautiful large old round red Italian wooden dining table"

    Incorrect order: "a red beautiful Italian old large wooden round dining table"

    '
  core_meaning: When two or more adjectives modify the same noun, they must follow a specific order that native speakers use
    intuitively. Violating this order sounds unnatural even if grammatically understandable.
  example_generator:
    contexts:
    - describing objects
    - shopping
    - writing descriptions
    - travel
    - home and furniture
    cultural_notes:
    - This order is intuitive for native speakers but must be learned explicitly by L2 speakers
    - Some languages place adjectives after the noun
    - making pre-noun ordering challenging
    min_examples: 5
  timeline: Timeless - the order rule applies regardless of tense.
phonetics:
- example_generator:
    contexts:
    - natural conversation
    - descriptions
  l1_issue: Speakers of languages where adjectives follow the noun (e.g., Spanish, Arabic, French) may struggle with both
    the order and the pre-noun placement.
  note: 'When multiple adjectives precede a noun, stress typically falls on the noun and the first (opinion) adjective: ''a
    BEAUTIFUL BIG house''. Later adjectives receive progressively less stress.'
