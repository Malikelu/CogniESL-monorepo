  - French
  - Italian
  reliability: B
  source: Swan Entry 185. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- error: Adjective agreement difficulty depends on L1 morphology (Golden et al. Ch.5)
  explanation: 'Golden et al. (2017) Ch.5 (Janik): English-speaking learners of Norwegian (no adjective inflection in English)
    have more difficulty with Norwegian adjective agreement than German or Polish speakers. German learners are additionally
    disadvantaged in predicative position (German leaves adjectives uninflected predicatively; Norwegian inflects). Polish
    learners perform well because Polish has similar predicative adjective inflection to Norwegian. This shows positive AND
    negative transfer can coexist in the same L1 for the same grammatical feature.'
  l1_groups:
  - English
  - German
  - Polish
  - Norwegian
  - Czech
  - Russian
  reliability: C
  source: Golden et al. (2017), Ch. 5
