  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — "Supposing" as conditional marker: primarily conversational;
    rare in academic prose and formal writing. Ch. 10.2.8'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
