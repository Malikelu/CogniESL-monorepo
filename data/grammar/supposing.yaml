citations:
- claim: 'Core meaning: "Supposing" introduces a hypothetical scenario to prompt discussion,
    speculation, or evaluate possible outcomes. It is equivalent in meaning to "what
    if" but more formal.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals, 10.6'
  tier: 1
- claim: 'Register distribution: "Supposing" is slightly more formal than "what if"
    but less formal than inverted conditionals. It is common in both spoken and written
    English.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals, 10.6'
  tier: 1
- claim: 'Discourse function: "Supposing" is common in spoken English when discussing
    hypothetical scenarios, making speculations, or introducing suggestions in a tentative
    way.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals, 10.6'
  tier: 1
- claim: 'Common error ''Using ''would'' in the supposing clause: *''Supposing it
    would '' for Portuguese, Spanish, French speakers'
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  tier: 1
- claim: 'In conditional sentences, "supposing" follows the same tense rules as "if":
    past simple for hypothetical present/future, past perfect for hypothetical past.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals, 10.6'
  tier: 1
common_errors:
- correction: Supposing it rained, what would we do?
  error: 'Using ''would'' in the supposing clause: *''Supposing it would rain, what
    would we do?'''
  explanation: The 'supposing' clause follows the same rules as an 'if' clause in
    conditionals. 'Would' is not used in the conditional clause -- it appears only
    in the main clause. The supposing clause uses past simple for hypothetical situations.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If it rains tomorrow, I'll take an umbrella.
  error: 'Using ''supposing'' for real/likely conditions: *''Supposing it rains tomorrow,
    I''ll take an umbrella.'''
  explanation: '''Supposing'' introduces hypothetical or imagined scenarios, not real
    or likely conditions. For real conditions (type 1 conditional), use ''if''. ''Supposing''
    implies the speaker thinks the scenario is unlikely or purely imaginary.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: Supposing we cancel the trip? / Suppose we cancel the trip. (different
    meanings)
  error: 'Confusing ''supposing'' with ''suppose'': *''Suppose we cancel the trip?'''
  explanation: '''Supposing'' introduces hypothetical conditionals. ''Suppose'' can
    mean ''imagine'' or function as a suggestion (''Suppose we try...''). While sometimes
    interchangeable, ''supposing'' is specifically conditional, whereas ''suppose''
    is broader.'
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
description: A conjunction used to introduce hypothetical scenarios for discussion,
  speculation, or suggestion.
