common_errors:
- correction: Both are correct.
  error: '*To whom did you talk?* (formal) vs *Who did you talk to?* (informal)'
  explanation: English allows preposition stranding at the end of sentences (Who did you talk to?). This is informal but completely
    grammatical. Fronting the preposition (To whom did you talk?) is formal.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan Entry 209. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- error: Spatial preposition errors reflect conceptual transfer, not just formal L1-L2 mapping (Golden et al. Ch.4)
  explanation: 'Golden et al. (2017) Ch.4 (Szymańska): Conceptualization of objects as containers vs. surfaces varies crosslinguistically
    and affects preposition choice even when L1 and L2 are genealogically related. Counter-intuitively, English-speaking learners
    performed NO BETTER than Slavic learners on Norwegian spatial prepositions despite shared Germanic origin. English "in/on"
    conceptual mapping differs from Norwegian "i/pa": Norwegian uses "på" extensively for institutional/social activities
    where English uses "at" or "on". De在学习者语料库中, spatial preposition accuracy is driven by conceptual fit, not formal similarity.'
  l1_groups:
  - All L1s — conceptual transfer affects all learners
  reliability: C
  source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns of Language Learning, Ch. 4
- error: English L1 advantage in preposition stranding ONLY in L1-L2 congruent structures (Golden et al. Ch.7)
  explanation: 'Golden et al. (2017) Ch.7 (Tenfjord & Kinn): Preposition stranding is typologically rare, found mainly in
    Germanic languages. English learners of Norwegian show an advantage ONLY in stranding contexts that are identical in English
    — NOT in Norwegian-only stranding patterns. This confirms transfer is structure-specific, not a general processing advantage.
    English learners should not be expected to perform natively on all stranding constructions.'
  l1_groups:
  - English
  reliability: C
  source: Golden et al. (2017), Ch. 7
