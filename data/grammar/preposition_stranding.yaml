level: C1
meaning:
  ccqs:
  - answer: Yes, that is preposition stranding.
    purpose: Tests whether the learner knows that English allows prepositions at the end of sentences (Who did you talk to?),
      which is considered formal in some L1s but completely natural in English.
    question: Is the preposition at the end of the sentence?
  - answer: Informal — stranding is common in speech and informal writing.
    purpose: Tests understanding of preposition_stranding.
    question: Is this formal or informal?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with preposition stranding and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Both are correct. 'Who did you speak to?' (preposition at end) is natural in conversation. 'To whom did you speak?'
      is formal.
    purpose: Tests whether the learner knows that prepositions can go at the end of questions in English (Swan PEU 2016, entry
      8.2).
    question: Which is correct in informal English? 'Who did you speak to?' or 'To whom did you speak'?
  contrast: Stranding (informal) = Who did you talk to? vs Pied-piping (formal) = To whom did you talk?
  core_meaning: In informal English, prepositions can go at the end of questions and relative clauses. In formal English,
    they come before the relative pronoun or question word.
  example_generator:
    contexts:
    - informal questions
    - relative clauses
    - everyday conversation
    - spoken English
    cultural_notes:
    - Some grammar purists incorrectly consider stranding wrong — it is fully acceptable in modern English
    - Formal writing may prefer pied-piping
    min_examples: 5
  timeline: Timeless — a structural choice, not time-related.
phonetics:
- example_generator:
    contexts:
    - sentence stress
  l1_issue: Some L1 speakers avoid stranding entirely, sounding overly formal. Others overuse it in formal writing.
  note: Stress on the preposition at the end of the sentence
register_notes:
- note: 'Biber et al. (2021) — Preposition stranding (vs. pied-piping): register distribution shows stranding is more common
    in conversation; pied-piping is more formal/written. Ch. 3.13.2.4, 9.3.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 3.13.2.4
