common_errors:
- correction: These books are mine.
  error: 'Using ''this'' for plural: *''This books are mine.'''
  explanation: Use 'this/that' for singular, 'these/those' for plural.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
description: 'Words that point to specific things based on distance: this (near), that (far), these (near plural), those (far
  plural).'
dialectal_variation: []
discourse_notes:
- note: 'Demonstratives create spatial and discourse reference: ''This idea (near) vs that idea (far).'''
form:
  affirmative:
    example_generator:
      contexts:
      - classroom objects
      - shopping
      - pointing at things
      min_examples: 4
    structure: 'This/That + singular noun: ''This book is mine.'' / These/Those + plural noun: ''These books are mine.'''
  negative:
    example_generator:
      contexts:
      - classroom objects
      - shopping
      - pointing at things
      min_examples: 4
    structure: 'This/That + be + not: ''This is not my book.'''
  questions:
    example_generator:
      contexts:
      - classroom objects
      - shopping
      - pointing at things
      min_examples: 4
    structure: 'Is this/that...?: ''Is this your bag?'' / Are these/those...?: ''Are those your shoes?'''
grammar_point: demonstratives
level: A1
meaning:
  ccqs:
  - answer: Near = this/these, Far = that/those
    purpose: 'Tests whether the learner understands the two-way distinction: ''this/these'' (near speaker) vs ''that/those''
      (far from speaker).'
    question: Is the thing near or far?
  - answer: One = this/that, More = these/those
    purpose: Tests whether the learner can choose singular ('this/that') vs plural ('these/those') based on the noun.
    question: Is it one thing or more than one?
  - answer: 'Yes — demonstratives can be used alone as pronouns: ''''This is nice.'''' Or as determiners before a noun: ''''This
      book is nice.'''''
    purpose: Tests whether the learner understands that demonstratives function as both pronouns and determiners (Swan PEU
      2016, entries 560-565).
    question: Can you say 'This is nice' without a noun after 'this'?
  - answer: These books are mine. Use ''this/that'' for singular, ''these/those'' for plural.
    purpose: Tests whether the learner can choose the correct demonstrative for singular vs plural nouns (Swan PEU 2016, entry
      560).
    question: 'Which is correct: *''This books are mine'' or ''These books are mine''?'
  contrast: '''This'' = near (this book here) vs ''That'' = far (that book there)'
  core_meaning: Demonstratives point to specific things. This/these = near the speaker. That/those = far from the speaker.
  example_generator:
    contexts:
    - classroom objects
    - shopping
    - pointing at things
    - describing locations
    cultural_notes: []
    min_examples: 5
  timeline: Present — refers to things visible or known in the current context.
phonetics:
- contexts:
  - emphasis
  example_generator:
    contexts:
    - connected speech
  l1_issue: Some L1 speakers use 'this' for both singular and plural
  note: Strong /ðiːs/ when emphasizing vs weak /ðɪs/ in connected speech
register_notes:
- note: Demonstratives are consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Demonstrative pronouns/determiners: conversation uses more ''this'' for exophoric reference;
    academic prose uses demonstratives more for anaphoric/textual cohesion. Ch. 4.1.2, 12.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 4.1.2
