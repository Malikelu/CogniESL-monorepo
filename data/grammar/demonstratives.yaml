sub_rules:
- examples:
  - this book / these books
  - that car / those cars
  rule: This/That for singular, These/Those for plural
  type: grammatical
- examples:
  - This is nice. (no noun)
  - I want that. (no noun)
  rule: Can be used alone as pronouns
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students point to objects and describe them with demonstratives.
    duration: 10
    name: Point and Say
  tips:
  - 'GB3 Ch. 16: Demonstratives vary along two dimensions — proximity (near/far) and number (singular/plural). This/these
    = near, that/those = far. Demonstratives function as both determiners (''this form'') and pronouns (''please fill this
    out''). The wh-word ''which'' is the associated interrogative. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed.
    Ch. 16 §16.2.'
  - Use real objects at different distances
  - Gesture to reinforce near/far concept
  - 'Swan PEU: demonstratives — this/these (near speaker), that/those (far from speaker). ''This'' for introducing people:
    ''This is my friend Anna.'' ''That'' for identifying: ''That''''s my car over there.'''
  - 'Swan PEU: Demonstratives in time reference — ''this week'' (current), ''that week'' (past). ''This morning'' (if still
    morning), ''that morning'' (narrating past). Portuguese speakers often confuse this/that for time.'
title: Demonstratives (This, That, These, Those)
use:
- context: Pointing at objects
  description: Identifying things near or far
  examples:
  - This is my pen.
  - That is a beautiful painting.
- context: Shopping
  description: Referring to items
  examples:
  - I'd like this one.
  - How much are those?
