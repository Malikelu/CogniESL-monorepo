common_errors:
- correction: It was raining; however, we went out. / It was raining. However, we
    went out.
  error: '*It was raining, however we went out.*'
  explanation: '''However'' cannot join two clauses with a comma (comma splice). Use
    a semicolon or start a new sentence.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: D
- correction: It was raining. However, we went out.
  error: 'Using ''however'' as conjunction with comma: *''It was raining, however
    we went out.'''
  explanation: 'Swan PEU: "However" is a conjunctive adverb, not a coordinating
    conjunction. It needs a semicolon or new sentence -- not just a comma.'
  l1_groups:
