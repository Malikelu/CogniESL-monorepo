common_errors:
- correction: The food was not bad. (= the food was quite good, not just acceptable)
  error: 'The food was not bad. (interpreted literally: the food was merely acceptable)'
  explanation: Litotes expresses understatement through negation. 'Not bad' means
    'quite good' in English, not just 'acceptable'. Learners from some L1 backgrounds
    may miss the pragmatic force and interpret it literally.
  flagged: true
  l1_groups:
  - German
  - Dutch
  - Chinese
  reliability: D
description: A figure of speech using deliberate understatement by negating the opposite,
  often to express moderate praise, soften criticism, or create irony.
dialectal_variation: []
discourse_notes:
- 'Litotes is a hallmark of British English understatement. In formal writing, it serves as hedging and diplomatic softening (''not without merit'', ''not inconsistent with''). In conversation, it frequently carries ironic force (''not the brightest bulb''). Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 30: Focus and Emphasis.'

form:
  affirmative:
    example_generator:
      contexts:
      - giving moderate praise
      - softening criticism
      - diplomatic language
      min_examples: 4
    structure: 'Subject + be/not + un-/in-/im-/non- + adjective (negating the opposite):
      ''She is not unintelligent.'' (= she is quite intelligent) / ''It was not a
      bad meal.'' (= it was a good meal) / ''He is not without charm.'' (= he is charming)'
  negative:
    example_generator:
      contexts:
      - expressing possibility
      - cautious optimism
      - diplomatic language
      min_examples: 4
    structure: 'Litotes is inherently a negative structure (it negates the opposite).
      A ''negative litotes'' would be a double negative affirming the positive: ''It
      is not impossible.'' (= it is possible)'
  questions:
    example_generator:
      contexts: []
      min_examples: 0
    structure: 'Litotes is not typically used in questions. Direct questions are preferred:
      ''Was it good?'' rather than ''Was it not bad?'''
grammar_point: litotes
level: C2
meaning:
  ccqs:
  - answer: Yes — litotes affirms by negating the opposite.
    purpose: Tests whether the learner understands that litotes works by affirming through negation \u2014 saying something positive by negating its opposite.
    question: Is the speaker saying something positive by using a negative?
  - answer: Understated — litotes deliberately says less than the full meaning.
    purpose: Tests whether the learner understands that litotes deliberately understates \u2014 the speaker says less than they mean, creating a hedged or ironic effect.
    question: Is the speaker being direct or understated?
  - question: "'He is not unintelligent' — Is the speaker saying he is stupid or intelligent?"
    answer: "Intelligent. 'Not unintelligent' is litotes — the speaker uses double negation (not + un-) to understate a positive quality."
    purpose: 'Tests whether the learner can decode litotes with negative prefixes (un-, in-, im-, non-) and understand that the surface negative conveys a positive meaning.'
  - question: "'She is not unattractive' — Is the speaker saying she is ugly, average, or attractive?"
    answer: "'Attractive. ''Not unattractive'' is litotes — the speaker uses a negative (not) plus a negative prefix (un-) to understate a positive quality.'"
    purpose: 'Tests whether the learner can decode the meaning of litotes with negative prefixes (un-, in-, im-, non-). Understanding that ''not unattractive'' means ''attractive'' (not just ''okay'') is essential for C2-level pragmatic comprehension.'
  - answer: Criticising. Not the most brilliant is an ironic understatement meaning
      the student is not very intelligent. The litotes softens the criticism but the
      intended meaning is clearly negative.
    purpose: Tests whether the learner can detect the ironic or sarcastic use of litotes.
      Not the most + positive adjective is a common pattern for veiled criticism,
      and understanding the speaker's true intent is essential for C2-level pragmatic
      comprehension of litotes in context.
    question: Is the speaker in not the most brilliant student praising or criticising
      the student?
  contrast: 'Direct statement: "She is very talented."

    Litotes: "She is not without talent." (same meaning, but understated)

    Direct: "It was a good performance."

    Litotes: "It was not a bad performance." (understated praise)

    '
  core_meaning: Litotes is a rhetorical device that affirms something by negating
    its opposite. Instead of saying something is 'good', litotes says it is 'not bad'.
    Instead of saying someone is 'attractive', it says they are 'not unattractive'.
    The effect is understatement — the speaker deliberately says less than they mean,
    often for politeness, irony, or emphasis.
  example_generator:
    contexts:
    - literary analysis
    - formal speech
    - diplomatic language
    - British English conversation
    - academic writing
    - humour and irony
    cultural_notes:
    - Litotes is extremely common in British English and is a hallmark of British
      understatement
    - In American English, litotes is less common and may sound overly formal or indirect
    - Overuse can sound evasive or insincere in cultures that value directness
    min_examples: 5
  timeline: Timeless — litotes can be used in any tense.
phonetics:
- example_generator:
    contexts:
    - natural conversation
    - formal speech
  l1_issue: Speakers from cultures that value directness (e.g., German, Dutch) may
    find litotes confusing or evasive. Speakers from cultures that value indirectness
    (e.g., Japanese) may find it natural.
  note: 'In litotes, the negative element (''not'') is often stressed for emphasis:
    ''It was NOT a bad performance.'' The understated quality comes from the contrast
    between the stress on the negative and the modesty of the claim.'
register_notes:
- note: 'Biber et al. (1999) — Litotes and understatement: register distribution varies.
    Academic prose uses understatement for hedging; conversation for ironic/litotic
    effect. Ch. 12.5'
  reliability: C
  source: Biber et al. (1999) Longman Grammar of Spoken and Written English. Longman
