sub_rules:
- examples:
  - not unkind (= kind)
  - not unattractive (= attractive)
  - not impossible (= possible)
  - not insignificant (= significant)
  - not uncommon (= fairly common)
  rule: Negating a negative adjective prefix (un-, in-, im-, non-)
  type: morphological
- examples:
  - not without merit (= has merit)
  - not without difficulty (= with some difficulty)
  - not without reason (= with good reason)
  - not without charm (= charming)
  rule: Negating 'without' + noun
  type: grammatical
- examples:
  - not a bad idea (= a good idea)
  - not a bad performance (= a good performance)
  - not bad at all (= quite good)
  rule: Negating 'bad' or 'poor' for moderate praise
  type: semantic
- examples:
  - not the worst (= quite good)
  - not the best (= not very good — ironic)
  - not the most brilliant (= not very clever — ironic criticism)
  rule: Negating 'the' + superlative for emphasis
  type: semantic
- examples:
  - '''Not the brightest bulb in the box.'' (= not very intelligent — sarcastic)'
  - Not exactly a masterpiece. (= it is quite bad — ironic understatement)
  rule: Litotes for irony or sarcasm
  type: pragmatic
teaching:
  methodology: Awareness-raising through authentic texts and cultural discussion
  recommended_activities:
  - adaptation_notes: Provide a text (literary extract, film transcript) and have
      students identify examples of litotes. Discuss the intended meaning.
    duration: 15
    name: Litotes identification
  - adaptation_notes: 'Students rewrite direct statements as litotes and vice versa:
      ''She is talented'' → ''She is not without talent.'''
    duration: 15
    name: Direct vs. litotes rewriting
  - adaptation_notes: Discuss the role of understatement in different cultures. How
      does litotes compare to communication styles in students' L1 cultures?
    duration: 20
    name: Cultural discussion
  - adaptation_notes: Provide sentences using litotes and have students determine
      whether the speaker is being sincere, ironic, or sarcastic.
    duration: 15
    name: Irony detection
  tips:
  - This is a receptive skill at C2 — students should understand litotes when they
    encounter it, not necessarily produce it.
  - Use authentic British English texts (literature, film, journalism) to illustrate
    litotes in context.
  - Discuss the cultural dimension — litotes is a key feature of British communication
    style.
  - Contrast litotes with hyperbole (exaggeration) to show different rhetorical strategies.
  - 'Swan PEU: Litotes — understatement through negative of the opposite: ''not
    bad'' = good, ''not untypical'' = typical, ''not impossible'' = possible. Common
    in British English. Often conveys ironic or moderate evaluation.'
title: Litotes
use:
- description: Litotes is a hallmark of British understatement, used to give praise
    without appearing too enthusiastic.
  examples:
  - '''How was the meal?'' — ''Not bad, actually.'' (= quite good)'
  - '''She''s not unpretty.'' (= she is attractive)'
  - '''It was not a bad performance.'' (= it was good)'
  key_point: The speaker deliberately understates to avoid appearing too effusive.
  name: Moderate praise in British English
- description: Litotes can soften a negative comment by expressing it indirectly.
  examples:
  - '''I''m not convinced by his argument.'' (= I disagree)'
  - '''That was not the wisest decision.'' (= it was a foolish decision)'
  - '''He is not the most reliable person.'' (= he is unreliable)'
  key_point: The understatement makes the criticism less direct and more polite.
  name: Softening criticism
- description: Used in diplomatic, legal, and academic language to express positions
    cautiously.
  examples:
  - '''The results are not inconsistent with our hypothesis.'' (= they support it)'
  - '''This is not without precedent.'' (= there are precedents)'
  - '''The proposal is not without merit.'' (= it has merit)'
  key_point: Common in formal registers where directness may be inappropriate.
  name: Diplomatic and formal language
- description: Litotes can be used for ironic or humorous effect.
  examples:
  - '''Winning the lottery was not the worst thing that ever happened to me.'' (=
    it was the best thing)'
  - '''He''s not exactly a genius.'' (= he is not very clever)'
  - '''It''s not the Ritz, but it''ll do.'' (= it is basic but acceptable)'
  key_point: The gap between the understatement and the reality creates humour.
  name: Irony and humour
