sub_rules:
- examples:
  - It is obvious that she is talented.
  - It is unlikely that he will come.
  - It is surprising that no one noticed.
  - It is clear that changes are needed.
  rule: 'Adjective + that-clause: It is clear/obvious/evident/likely/unlikely/certain/surprising/strange + that...'
  type: grammatical
- examples:
  - It is a pity that you cannot come.
  - It is no wonder that she is exhausted.
  - It is a fact that the climate is changing.
  - It came as a surprise that he was promoted.
  rule: 'Noun + that-clause: It is a pity/a shame/a wonder/a fact/a surprise + that...'
  type: grammatical
- examples:
  - It is important to read the instructions carefully.
  - It is impossible to predict the outcome.
  - It was nice to meet you.
  - It has become increasingly difficult to find affordable housing.
  rule: 'Adjective + to-infinitive: It is difficult/easy/important/necessary/impossible + to...'
  type: grammatical
- examples:
  - It is said that she is the best in her field.
  - It was reported that three people were injured.
  - It is believed that the building dates from the 12th century.
  - It has been suggested that the policy should change.
  rule: 'Reporting verbs in passive: It is said/believed/reported/thought/rumoured/claimed + that...'
  type: grammatical
- examples:
  - It happens that I know the answer.
  - It turned out that he was right all along.
  - It seems that no one was informed.
  - It transpired that the documents had been falsified.
  rule: 'Verbs of occurrence: It happens/turns out/appears/seems/transpires + that...'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students judge whether sentences sound natural and rewrite any that use fronted subject clauses.
    duration: 10
    name: Natural or Unnatural?
  - adaptation_notes: Students rewrite direct statements using passive extraposition (It is reported that... It is believed
      that...).
    duration: 15
    name: News Report Rewrite
  - adaptation_notes: Students categorise adjectives by the pattern they take (adj + that, adj + to-infinitive, etc.).
    duration: 10
    name: Adjective Sort
  tips:
  - 'GB3 Ch. 23: Extraposition it (anticipatory it) anticipates the real subject (to-infinitive or that-clause) which is defered
    to end position for end-weight. Unlike ambient it (weather/time), extraposition it has a discourse management function.
    Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch. 23 23.1.'
  - 'CGEL Ch. 16: Extraposition moves a heavy subject (clausal or infinitival) to the end of the clause and inserts dummy
    it in subject position. This follows the principle of end-weight: longer constituents are placed later for easier processing.'
  - 'Start with the most common pattern: It + be + adj + that-clause, using high-frequency adjectives (clear, obvious, likely,
    surprising).'
  - 'Show how fronted that-clauses sound unnatural by comparing: ''That he left is strange'' vs. ''It is strange that he left.'''
  - Introduce passive reporting structures (It is said that...) as a separate but related pattern.
  - Practice transforming fronted clauses into extraposed structures.
  - 'Swan PEU: Extraposition with ''it'' — ''It seems that she left.'' = ''That she left seems.'' ''It appears he lied.''
    Heavy subject goes to the end for readability. The ''it'' serves as dummy subject in the front position.'
title: Extraposition
use:
- context: Expressing certainty and likelihood
  description: Extraposition with adjectives of certainty is extremely common in both speech and writing.
  examples:
  - It is certain that the election will go ahead.
  - It is likely that temperatures will continue to rise.
  - It is doubtful that the project will be completed on time.
- context: Expressing evaluation and reaction
  description: Adjectives of evaluation (surprising, strange, interesting, worrying) are frequently used with extraposition.
  examples:
  - It is interesting that so few people responded.
  - It is worrying that crime rates are increasing.
  - It is remarkable that she recovered so quickly.
- context: Reporting and hearsay
  description: Passive reporting verbs with extraposition are standard in journalism and academic writing.
  examples:
  - It has been reported that negotiations are underway.
  - It is widely believed that the economy will recover.
  - It was later discovered that the data had been corrupted.
- context: Expressing necessity and importance
  description: Extraposition with to-infinitive is the natural way to express necessity, importance, or difficulty.
  examples:
  - It is essential to act now.
  - It is worth noting that the results are preliminary.
  - It remains to be seen whether the plan will work.
