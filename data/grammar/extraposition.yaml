grammar_point: extraposition
level: C1
meaning:
  ccqs:
  - answer: Yes, this is extraposition of the subject.
    purpose: Tests whether the learner understands that 'it' can stand in for a heavy subject clause. 'It is surprising that...'
      = 'That... is surprising.' Extraposition moves the heavy subject to the end for processing ease.
    question: Does 'it' stand in for a clause that appears at the end of the sentence?
  - answer: Yes, English strongly prefers extraposed structures for heavy subjects.
    purpose: Tests whether the learner understands the end-weight principle. Heavy subjects at the beginning of a sentence
      feel awkward. Extraposition ('It is clear that...' instead of 'That... is clear') is strongly preferred in English.
    question: Would the sentence sound unnatural with the clause at the beginning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with extraposition and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: They mean the same thing but use different structures. The first is an extraposed subject ('It' = dummy subject,
      'that she is the best...' = extraposed clause). The second is a personal passive distancing structure with subject +
      passive verb + to-infinitive. Both are grammatically correct; the 'It is said that...' pattern is slightly more common
      in journalism.
    purpose: Tests whether the learner understands extraposition with passive reporting verbs (It is said/believed/reported
      that...) and can distinguish it from equivalent personal passive structures (She is said to be...). Recognizing both
      forms helps learners vary their sentence patterns in formal writing and comprehend both structures in reading.
    question: '"It is said that she is the best in her field." What is the difference in meaning between this and "She is
      said to be the best in her field"?'
  contrast: Fronted subject = That she passed the exam is wonderful. Extraposed = It is wonderful that she passed the exam.
  core_meaning: Extraposition involves moving a heavy subject clause (usually a that-clause or to-infinitive clause) to the
    end of the sentence and placing 'it' in the subject position. This is the most common way to express complex subjects
    in English, as fronted clauses sound unnatural.
  example_generator:
    contexts:
    - everyday situations
    - news reporting
    - academic writing
    - expressing opinions
    cultural_notes:
    - Extraposition is the default pattern in English — fronted that-clauses are rare and literary
    - Almost all sentences with 'it + be + adj + that...' use extraposition
    min_examples: 5
  timeline: Varies — depends on the tense of the main verb.
phonetics:
- example_generator:
    contexts:
    - spoken opinions
    - news reading
  l1_issue: Learners may place the that-clause at the beginning, producing unnatural-sounding sentences.
  note: 'The dummy ''it'' is always unstressed and reduced in speech. The main stress falls on the adjective or noun: It is
    OBVIOUS that she is talented.'
- example_generator:
    contexts:
    - news broadcasts
    - academic lectures
  l1_issue: Speakers may confuse extraposition with cleft sentences (It is... that...), which have a different function.
  note: 'In passive reporting structures, the past participle carries stress: It is beLIEVED that...'
