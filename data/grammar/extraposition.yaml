description: Moving a long subject clause to the end of the sentence and using 'it' as a dummy subject, for better sentence
  balance and naturalness.
dialectal_variation:
- note: 'Biber et al. (2021) Grammar of Spoken and Written English, Ch. 1.3.2/1.3.4: distribution rather than core grammatical
    structure. Most grammatical features show quantitative rather than qualitative variation between the two major national
    varieties.'
discourse_notes:
- note: In conversation, this structure is used in everyday communication.
- note: In academic writing, this structure appears in formal contexts and is a marker of proficient English.
- note: In professional contexts, correct use of this structure is expected in formal writing.
