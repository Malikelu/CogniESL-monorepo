description: '''Too + adjective + to'' means something is excessive and the action is impossible. ''Adjective + enough + to''
  means sufficient and the action is possible.'
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - weather and nature
      min_examples: 4
    structure: 'too + adjective + to + V1: "It''s too hot to drink."

      adjective + enough + to + V1: "It''s cool enough to drink."

      '
  negative:
    example_generator:
      contexts:
      - sports and hobbies
      min_examples: 4
    structure: 'too + adjective + to + V1 (already implies impossibility — no extra negation needed).

      not + adjective + enough + to + V1: "It''s not cool enough to drink."

      '
  questions:
    example_generator:
      contexts:
      - food and daily routines
      - weather and nature
      min_examples: 4
    structure: Use standard question forms with the adjective.
grammar_point: too_enough_infinitive
level: B1
meaning:
  ccqs:
  - answer: Too means more than needed. Enough means sufficient.
    purpose: Tests whether the learner understands the semantic opposition between 'too' (excess, beyond what is acceptable)
      and 'enough' (sufficiency, meeting the requirement). 'Too hot to drink' = excessively hot. 'Cool enough to drink' =
      sufficiently cool.
    question: Can you explain the difference between too and enough by giving an example of when to use each?
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that too enough infinitive is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with too enough infinitive and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I am too old to retire.'' After ''too + adjective'', use the to-infinitive.'
    purpose: Tests whether the learner uses the to-infinitive after 'too + adjective' (Swan PEU 2016, entry 630).
    question: Which is correct? *'I am too old to retiring' or 'I am too old to retire'?
  contrast: '''too hot to drink'' = It is so hot that I CANNOT drink it.

    ''cool enough to drink'' = It is sufficiently cool that I CAN drink it.

    '
  core_meaning: '''Too'' = more than needed/wanted (negative result). ''Enough'' = as much as needed (positive result). Both
    followed by infinitive to show the consequence.'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Present or general time. The result (infinitive) is a consequence of the degree (too/enough).
phonetics:
- example_generator:
    contexts:
    - too enough pronunciation
  l1_issue: 'Learners may confuse ''too'' and ''two''. Teach the difference: ''too'' = excessive, ''two'' = the number 2.'
  note: 'Too is pronounced /tuː/ and is usually stressed: ''It is TOO heavy.'' Enough is pronounced /ɪˈnʌf/ with stress on
    the second syllable: ''It is big e-NOUGH.'''
register_notes: []
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
