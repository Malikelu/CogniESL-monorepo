description: Structures used to report information without the speaker committing to its truth, often found in journalism,
  academic writing, and formal speech.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - news reports
      - academic writing
      - formal statements
      min_examples: 4
    structure: 'It + be + past participle + that + clause: It is believed that... / Subject + be + past participle + to-infinitive:
      He is said to...'
  negative:
    example_generator:
      contexts:
      - denying rumours
      - correcting misinformation
      min_examples: 3
    structure: 'It + be + not + past participle + that + clause: It is not thought that... / Subject + be + not + past participle
      + to-infinitive: He is not believed to...'
  questions:
    example_generator:
      contexts:
      - checking information
      - expressing doubt
      min_examples: 3
    structure: Is it true that...? / Is it believed that...? / Is he thought to...?
grammar_point: distancing
level: B2
meaning:
  ccqs:
  - answer: No, the speaker is distancing themselves from the claim.
    purpose: Tests whether the learner understands the key concept of distancing. This is important because mastering this
      distinction is essential for accurate and natural English at B2 level.
    question: Does the speaker confirm that this information is true?
  - answer: Yes, that is the function of distancing structures.
    purpose: Tests whether the learner understands the difference between present ability (can) and past ability or polite
      possibility (could). This is important for expressing ability and making requests.
    question: Could you add 'according to some people' or 'reportedly' to this sentence?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with distancing and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Last week — the perfect infinitive 'to have resigned' shows the action happened before the time of reporting.
      Compare with 'He is said to be resigning' (present/future) and 'He is said to have resigned' (past). The infinitive
      form encodes the time relationship.
    purpose: Tests whether the learner understands that the perfect infinitive (to have + past participle) in distancing structures
      indicates the reported event occurred before the act of reporting. This tense distinction within passive distancing
      structures is essential for accurate news reporting and academic hedging.
    question: '"He is said to have resigned last week." Did he resign last week or this week?'
  contrast: Direct = The economy is improving. Distanced = It is said that the economy is improving. / The economy is said
    to be improving.
  core_meaning: Distancing structures allow speakers and writers to present information as hearsay, rumour, or general belief
    without personally vouching for its accuracy. The speaker distances themselves from the claim.
  example_generator:
    contexts:
    - news reporting
    - academic hedging
    - gossip and rumour
    - formal announcements
    cultural_notes:
    - Distancing is a key feature of journalistic objectivity
    - In academic writing, distancing structures help writers avoid overgeneralisation
    min_examples: 5
  timeline: Varies — distancing can refer to past, present, or future events depending on the tense used.
phonetics:
- example_generator:
    contexts:
    - news broadcasts
    - formal announcements
  l1_issue: Learners may not use distancing structures, making their statements sound overly direct or committed.
  note: Distancing structures in speech are often accompanied by a slight pause and a change in intonation, signalling the
    speaker's detachment.
- example_generator:
    contexts:
    - spoken news
    - gossip
  l1_issue: Speakers may place these adverbs in the wrong position within the sentence.
  note: Words like 'allegedly' and 'reportedly' carry stress to emphasise the unverified nature of the information.
register_notes:
- note: 'Biber et al. (2021) — Distancing strategies (past tense for tentativeness): conversation uses past tense for politeness
    (''I was wondering if...''); academic prose uses impersonal structures for objectivity. Ch. 6.2.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.2
