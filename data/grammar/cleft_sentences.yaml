  explanation: 'Odlin (Ch.5, Ch.6): Jarvis (1998): 23/70 Swedes used clefts vs. 9/140
    Finns. Native Swedes: 24/36; native Finns: 1/66 (chi2=22.1, p<.001). Celtic English
