description: 'Using ''the'' + adjective to refer to a group of people: the rich, the poor, the elderly. Essential for talking
  about groups in society.'
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - shopping and commerce
      min_examples: 4
    structure: 'The + adjective (no noun) = plural meaning, refers to group of people

      "the rich" (rich people), "the poor" (poor people), "the young" (young people)

      Some can be used alone as nouns: "rich and poor" (without ''the'' in some contexts)

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Negation with verb, not adjective:

      "The rich aren''t paying enough." "The poor don''t have access."

      '
  questions:
    example_generator:
      contexts:
      - shopping and commerce
      min_examples: 4
    structure: '"Do the rich...?" "Should the government help the poor?"

      '
grammar_point: adjectives_without_nouns
level: B2
meaning:
  ccqs:
  - answer: All old people as a group. The plus adjective always refers to the whole group.
    purpose: Tests understanding that the plus adjective means entire group (plural meaning)
    question: The elderly need more support. Does this mean one old person or all old people?
  - answer: No. The rich is plural (it means rich people), so we say The rich are happy.
    purpose: Tests understanding that the plus adjective takes a plural verb
    question: Can we say The rich is happy? Why or why not?
  - answer: No. It means French people as a whole group or nationality.
    purpose: Tests understanding of nationality use with the plus adjective
    question: The French are known for their cuisine. Does this mean one French person?
  - answer: 'No. "The tall" is not a standard expression. Only certain categories work with "the + adjective" to refer to
      groups: primarily social or economic groups (the rich, the poor, the unemployed), age groups (the young, the elderly),
      and nationalities ending in specific sounds (the French, the Chinese). Physical characteristic adjectives like tall,
      beautiful, or short do not work this way.'
    purpose: Tests whether the learner knows that not all adjectives can be used with "the" to mean a group of people. Understanding
      this restriction prevents errors like "the beautiful need help" or "the tall play basketball," which sound unnatural
      to native speakers.
    question: Can we say "the tall" to mean tall people? Why or why not?
  contrast: '''THE + ADJ'' = Group of people: "The rich" (all rich people)

    ''ADJ + NOUN'' = Specific people: "Rich people" (same meaning, less formal)

    ''NOUN'' = Different meaning: "The rich man" (one person) vs "The rich" (all rich people)

    '
  core_meaning: '''The + adjective'' refers to ALL people who have that characteristic. It means ''people who are [adjective]''.
    Always plural.'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Not tense-based; refers to a category of people, can be past/present/future.)
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Some L1 speakers stress the equally or more than the adjective. In natural English, the is reduced and the adjective
    carries the primary stress.
  note: Stress on the adjective in the plus adjective constructions
  practice: Drill the rich, the poor, the elderly with stress on the adjective.
- example_generator:
    contexts:
    - connected speech
  l1_issue: Speakers whose first language lacks this sound (e.g., French, Italian, Japanese) may substitute a different sound.
  note: The voiced dental fricative sound in the before consonant sounds
  practice: Practise tongue-between-teeth position for the before common adjectives.
register_notes:
- note: 'Biber et al. (2021) — Nominalized adjectives (the poor, the elderly, the impossible): more common in academic prose
    and news than in conversation. Academic prose uses more adjective-to-noun conversion for generic reference. Ch. 7.2.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.2.1
