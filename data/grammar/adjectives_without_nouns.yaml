sub_rules:
- examples:
  - The poor are struggling. (not The poor is struggling.)
  - The young have more energy. (not The young has more energy.)
  explanation: Even though there is no visible plural ending, the meaning is always plural (a group of people).
  rule: The plus adjective takes a plural verb
  type: grammar
- examples:
  - the rich
  - the poor
  - the elderly
  - the young
  - the disabled
  - the homeless
  - the unemployed
  explanation: You cannot use any adjective this way. The tall or the beautiful do not work to mean tall people or beautiful
    people.
  rule: Only certain adjectives work this way — mainly social, economic, or age groups
  type: usage
- examples:
  - the French
  - the English
  - the Spanish
  - the Chinese
  - the Japanese
  - the Irish
  explanation: These nationality adjectives can function as group nouns with the.
  rule: Nationalities ending in certain sounds can use the plus adjective
  type: usage
- examples:
  - the disabled — prefer people with disabilities
  - the handicapped — prefer people with disabilities
  explanation: Person-first language (people with...) is generally preferred in modern English.
  rule: Some the plus adjective forms are considered outdated or offensive
  type: register
- examples:
  - The poor need help. (formal, written) is the same as Poor people need help. (neutral)
  - The elderly were evacuated. (news) is the same as Elderly people were evacuated. (neutral)
  explanation: Both mean the same thing, but the plus adjective is more formal and common in news and political writing.
  rule: The plus adjective vs adjective plus people or noun
  type: contrast
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students analyze news headlines that use adjectives without nouns: ''The rich, the poor, the unemployed.''
      They identify the implied noun and discuss why the adjective alone is used.'
    duration: 15
    name: News Headline Analysis
  - adaptation_notes: 'Students discuss social issues using adjectives as nouns: ''The elderly need more support. The homeless
      need shelter.'' Practice in pairs or small groups.'
    duration: 20
    name: Debate — Social Issues
  - adaptation_notes: Students sort sentences into formal and informal registers. Discuss when adjectives without nouns are
      appropriate (formal writing, news headlines).
    duration: 10
    name: Register Sorting
  tips:
  - 'Start with common pairs: the rich/the poor, the young/the old, the sick/the healthy.'
  - Compare 'rich people' (informal) vs 'the rich' (formal) to show register difference.
  - 'Discuss people-first language: ''people with disabilities'' vs ''the disabled'' (more respectful).'
  - 'Practice with news headlines: ''The unemployed rise by 5%.'''
  - 'Swan PEU: Adjectives as nouns — the + adjective can represent a group of people: ''the poor'', ''the rich'', ''the old'',
    ''the young'', ''the sick'', ''the blind'', ''the disabled'', ''the unemployed'', ''the French'', ''the British''. These
    take plural verbs: ''The poor are suffering.'''
  - 'Swan PEU: This does NOT work with all adjectives. We say ''the British'' but NOT ''the selfemployed'' or ''the anxious.''
    The pattern is mostly for nationalities and groups defined by social/economic/health conditions. Nationalities ending
    in -sh/-ch/-ss take this form: the French, the Dutch, the Swiss.'
  - 'Swan PEU: Superlatives without nouns: ''the biggest (one)'', ''the best (one)''. These are common in comparative/superlative
    contexts where the noun is understood from context.'
title: Adjectives Without Nouns (The + Adjective)
use:
- description: Talk about groups based on wealth, age, or social status.
  examples:
  - the rich and the poor
  - the young and the elderly
  - the working class
  key_point: Common in news, politics, and social discussions.
  name: Social and Economic Groups
- description: Refer to groups with specific conditions or traits.
  examples:
  - the disabled
  - the blind
  - the deaf
  - the injured
  - the homeless
  key_point: 'Often used in formal/political contexts; some consider ''people-first'' language better: ''people with disabilities''.'
  name: People with Conditions or Characteristics
- description: 'Some nationalities use the + adjective: the French, the English, the Dutch.'
  examples:
  - the Spanish
  - the Chinese
  - the Irish
  key_point: 'Not all nationalities work this way; some use plural noun: ''the French'' vs ''the Americans'' (plural noun,
    not adjective).'
  name: Nationalities (The + Adjective from Country)
