common_errors:
- correction: Because he was tired, he went to bed.
  error: '*Because of he was tired, he went to bed.*'
  explanation: '''Because of'' is followed by a noun or noun phrase; ''because'' introduces a full clause with subject + verb.
    This confusion is extremely common because the two forms are similar but require different complementation.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: Because the traffic was heavy, I was late.
  error: '*Because of the traffic was heavy, I was late.*'
  explanation: '''Because of'' requires a noun phrase, not a clause. ''The traffic was heavy'' is a clause and needs ''because''
    (without ''of''). This is one of the most persistent at B1-B2 level across all L1 backgrounds.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: D
- correction: Since you are here, let us start.
  error: '*Since you are here, so let us start.*'
  explanation: '''Since'' (reason) and ''so'' (result) should not appear in the same sentence. Both signal a causal relationship;
    using both is redundant. Choose one: ''Since X, Y'' or ''X, so Y''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I was late because of the rain.
  error: '*I was late because the rain.*'
  explanation: '''The rain'' is a noun, not a clause. Use ''because of + noun'' (not ''because + noun''). Learners often know
    ''because'' but forget the ''of'' variant needed before noun phrases, producing an incomplete causal expression.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
description: Structures that explain why something happened. Essential for giving explanations.
dialectal_variation: []
discourse_notes:
- note: Reason clauses (because, since, as) provide causal explanations, essential for argumentation and expository writing
    at all levels.
form:
  affirmative:
    example_generator:
      contexts:
      - food and daily routines
      - weather and nature
      min_examples: 4
    structure: 'Main clause + because + clause: "I went because I was bored."

      Since/As + clause, + main clause: "Since I was bored, I went out."

      Main clause + because of + noun: "I went because of boredom."

      '
  negative:
    example_generator:
      contexts:
      - health and wellbeing
      - social interactions
      min_examples: 4
    structure: Negative in either clause.
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Why + auxiliary + subject + verb?
grammar_point: reason_clauses
level: B1
meaning:
  ccqs:
  - answer: Because introduces the reason. So introduces the result.
    purpose: Tests whether the learner can identify the reason/cause in a sentence. Understanding causal relationships is
      essential for using reason conjunctions correctly.
    question: Can you explain the difference between because and so by giving an example of when to use each?
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that reason clauses is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with reason clauses and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: 'The first uses ''because + clause'' (subject + verb: ''I was sick''), which gives a full reason. The second uses
      ''because of + noun'' (a noun phrase: ''the sickness''), which is more concise. Both express the same reason, but ''because''
      needs a full clause while ''because of'' needs only a noun phrase.'
    purpose: Tests whether the learner can distinguish between 'because + clause' and 'because of + noun' as two parallel
      ways to express reason. This distinction is essential because 'because of' cannot be followed by a clause with a finite
      verb, and learners frequently produce errors like 'because of I was sick' or 'because the sickness'.
    question: Can you explain the difference between 'I stayed home because I was sick' and 'I stayed home because of the
      sickness' by giving an example of when to use each?
  contrast: '''Because'' = most common, neutral (all registers)

    ''Since/As'' = more formal, often at sentence start

    ''Because of'' + noun (not clause)

    ''Due to'' = very formal, usually after ''be''

    '
  core_meaning: Provides the cause or reason for an action or situation. Answers 'Why?' This grammar point is essential for
    expressing reason clauses in English. Learners at this level need to understand both the form and the appropriate contexts
    for use. Common errors include confusion with related structures and inappropriate register use.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Reason clause tense matches main clause tense (usually).
phonetics:
- example_generator:
    contexts:
    - because reduction
  l1_issue: Many L1 speakers over-pronounce 'because' as /bɪˈkɒz/. Teach the reduced forms.
  note: 'Because is often reduced in connected speech: /kəz/ or /kɒz/. ''I stayed home because I was sick'' → /aɪ steɪd həʊm
    kəz aɪ wəz sɪk/.'
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Reason/causal clauses: academic prose uses more explicit causal connectors; conversation uses
    more implicit causation. Ch. 10.2.1.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.1.4
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 15: Reason clauses'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24: Coordination (reason clauses)'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 15: Coordination'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 12: Reason'
