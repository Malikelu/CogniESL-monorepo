grammar_point: extraposed_object
level: C1
meaning:
  ccqs:
  - answer: Yes, this is extraposition of the object.
    purpose: Tests whether the learner understands that 'it' can stand in for a heavy object clause that appears later. 'I
      find it hard to believe that...' = 'I find that... hard to believe.' The 'it' placeholder makes the sentence easier
      to process.
    question: Does 'it' stand in for a clause that appears later in the sentence?
  - answer: Yes, heavy objects are typically extraposed for naturalness.
    purpose: Tests whether the learner understands the processing motivation for extraposition. English prefers to move heavy
      elements to the end of the sentence. 'I find it difficult to accept his explanation' is more natural than 'I find to
      accept his explanation difficult.'
    question: Would the sentence sound awkward without extraposition?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with extraposed object and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I find it difficult to understand grammar.'' Use ''it'' as preparatory object when the real object is an infinitive.'
    purpose: Tests whether the learner uses 'it' as preparatory object with infinitives (Swan PEU 2016, entry 264.3).
    question: Which is more natural? *'I find to understand grammar difficult' or 'I find it difficult to understand grammar'?
  contrast: Normal order = I find that he is honest difficult. Extraposed = I find it difficult that he is honest. / I find
    it difficult to believe.
  core_meaning: Extraposition of the object involves moving a long object clause (usually a that-clause or to-infinitive clause)
    to the end of the sentence and placing 'it' in the original object position. This improves sentence flow by avoiding a
    heavy object between the verb and its complement.
  example_generator:
    contexts:
    - expressing opinions
    - reporting beliefs
    - formal writing
    - academic discussion
    cultural_notes:
    - Extraposed objects are very common in English and sound more natural than the non-extraposed version
    - Some verbs almost always take extraposed objects (e.g. find it difficult to, make it clear that)
    min_examples: 5
  timeline: Varies — depends on the tense of the main verb.
phonetics:
- example_generator:
    contexts:
    - formal speech
    - everyday conversation
  l1_issue: Learners may place stress on 'it', making the sentence sound unnatural.
  note: The word 'it' in extraposed object structures is always unstressed and reduced in speech.
- example_generator:
    contexts:
    - spoken opinions
    - presentations
  l1_issue: Speakers may struggle with the word order, placing the clause before the complement.
  note: 'The complement (adjective or noun) after ''it'' carries the main stress: I find it DIFFICULT to believe.'
register_notes:
- note: 'Biber et al. (2021) — Extraposition (it + be + adjective + that-clause): more common in academic prose and formal
    written English than in conversation. Ch. 11.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 11.5
