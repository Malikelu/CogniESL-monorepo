common_errors:
- correction: The report must have been finished yesterday.
  error: '*The report must been finished yesterday.*'
  explanation: Modal perfect passive requires 'have been + past participle' after the modal, not 'been + past participle'
    alone.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: A complex verb structure combining a modal verb, perfect aspect (have + past participle), and passive voice (be
  + past participle), used to express speculation, obligation, or criticism about past events.
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission: ''All passengers must wear seatbelts.'''
form:
  affirmative:
    example_generator:
      contexts:
      - formal writing
      - news reports
      - academic texts
      min_examples: 4
    structure: 'Subject + modal (must/should/could/might/may) + have + been + past participle. Examples: The documents should
      have been filed. The mistake must have been noticed.'
  negative:
    example_generator:
      contexts:
      - criticism
      - negative deductions
      min_examples: 3
    structure: 'Subject + modal + not + have + been + past participle. Examples: The warning should not have been ignored.
      The data might not have been verified.'
  questions:
    example_generator:
      contexts:
      - formal enquiries
      - questioning past decisions
      min_examples: 3
    structure: 'Modal + subject + have + been + past participle? Examples: Should the report have been submitted earlier?
      Could the accident have been prevented?'
grammar_point: modal_perfect_passive
level: C1
meaning:
  ccqs:
  - answer: No. The structure implies it was NOT sent, but it should have been.
    purpose: Tests whether the learner understands a key concept of modal_perfect_passive. This is fundamental for correct
      use of this grammar point.
    question: In The letter should have been sent, was the letter sent?
  - answer: Must have been expresses a strong logical conclusion. Might have been expresses a possibility.
    purpose: Tests whether the learner understands a key concept of modal_perfect_passive. This is fundamental for correct
      use of this grammar point.
    question: Can you explain the difference between must have been and might have been by giving an example of when to use
      each?
  - answer: Yes. It means it was possible to finish the report (but it may or may not have been finished).
    purpose: Tests whether the learner understands a key concept of modal_perfect_passive. This is fundamental for correct
      use of this grammar point.
    question: Is The report could have been finished correct?
  - answer: 'Not standardly. We use would for past willingness or hypotheticals: The work would have been completed if we
      had more time.'
    purpose: Tests whether the learner understands a key concept of modal_perfect_passive. This is fundamental for correct
      use of this grammar point.
    question: Can we use will in the modal perfect passive?
  contrast: 'Modal perfect active: He must have taken the money. (speculation about who did it) Modal perfect passive: The
    money must have been taken. (speculation about what happened to it) Simple passive: The money was taken. (neutral statement)
    Modal passive: The money should be taken. (present/future obligation) Modal perfect passive: The money should have been
    taken. (past obligation not fulfilled)'
  core_meaning: 'The modal perfect passive combines three grammatical elements: a modal verb (must, should, could, might,
    may), the perfect infinitive (have + past participle), and the passive voice (been + past participle). It is used to speculate
    about past events, express criticism or regret about what was or was not done, or indicate logical conclusions about past
    situations.'
  example_generator:
    contexts:
    - academic writing
    - news reporting
    - formal complaints
    - speculation and deduction
    cultural_notes:
    - This structure is common in formal written English and academic discourse
    - It allows speakers to express criticism indirectly and diplomatically
    - Understanding it is essential for advanced reading comprehension
    min_examples: 5
  timeline: Always refers to the past. The modal perfect passive looks back from the present at a past event and makes a judgement,
    speculation, or deduction about it.
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Learners may over-pronounce have as a full syllable, making the structure sound unnatural
  note: 'The have in modal perfect structures is typically reduced to /əv/ or even /v/ in connected speech: should-uv-been,
    must-av-been'
- example_generator:
    contexts:
    - stress patterns
  l1_issue: Stressing been can make the sentence sound emphatic when neutral delivery is intended
  note: 'The been following have is typically unstressed: should have BEN done'
