common_errors:
- correction: Although he studied hard, he failed. / He studied hard, but he failed.
  error: '*Although he studied hard, but he failed.*'
  explanation: 'English does not use ''although'' and ''but'' together. Choose one:
    ''although'' (conjunction) or ''but'' (coordinating conjunction).'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - French
  reliability: D
- correction: Although it was raining, we went out.
  error: 'Using ''although'' and ''but'' together: *''Although it was raining, but
    we went out.'''
  explanation: 'Swan PEU: "Although" and "but" do the same job. Use one or the other,
    not both. English uses ONE conjunction per pair.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  - Arabic
  reliability: B
  source: Swan Entry 151. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: Although it was raining, we went out.
  error: 'Using ''although'' with ''however'': *''Although it was raining, however
    we went out.'''
  explanation: 'Swan PEU: "However" is also a contrast connector. Using BOTH "although"
    and "however" creates redundancy.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 151. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: Conjunction that introduces a contrasting idea despite expectations.
  Essential for complex contrast.
dialectal_variation: null
discourse_notes:
- note: Concessive clauses (although, though, even though) signal unexpected contrast
    between two clauses. Although is more formal than though, and even though is emphatic.
- note: In English, although and but cannot co-occur in the same sentence. Choose
    one.
form:
  affirmative:
    example_generator:
      contexts:
      - education and school
      - weather and nature
      min_examples: 4
    structure: 'Main clause + although + contrast clause: "I went although I was tired."

      Although + contrast clause + , + main clause: "Although I was tired, I went."

      '
  negative:
    example_generator:
      contexts:
      - social interactions
      min_examples: 4
    structure: 'Either clause can be negative: ''Although I wasn''t ready, I went.'''
  questions:
    example_generator:
      contexts:
      - health and wellbeing
      min_examples: 4
    structure: Questions use although in same position.
grammar_point: although
level: B1
meaning:
  ccqs:
  - answer: Yes. Despite the rain, she still went. The rain did not stop her.
    purpose: Tests understanding that the main clause action happens despite the contrast
    question: Although it was raining, she went for a walk. Did she go for a walk?
  - answer: No. Even though he studied (which should help), he still failed. The result
      is unexpected.
    purpose: Tests understanding that although sets up an expectation that is contradicted
    question: Although he studied hard, he failed the exam. Did he pass the exam?
  - answer: No, she was upset. But she smiled anyway — the smile is surprising given
      her feelings.
    purpose: Tests understanding that the two clauses show opposing ideas
    question: She smiled although she was upset. Was she happy?
  - answer: Both sentences convey the same basic meaning, but although is more formal
      and emphasizes the surprise or concession more strongly. But is neutral and
      more common in spoken English. Additionally, although can begin a sentence (Although
      it was cold, we went out), while but cannot start a sentence in formal writing.
    purpose: Tests whether the learner understands the register difference between
      although and but for expressing contrast. This is important because choosing
      the wrong conjunction for the context can make writing sound too casual or speech
      sound overly stiff.
    question: Although it was cold, we went out versus It was cold, but we went out
      -- is there a difference?
  contrast: '''Although'' = unexpected contrast (surprising)

    ''But'' = simple contrast (direct)

    ''Even though'' = stronger emphasis than ''although''

    ''Though'' = informal version of ''although''

    '
  core_meaning: Shows contrast where the second idea is surprising or unexpected given
    the first idea.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Both clauses can be past, present, or future - doesn't change meaning.
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Many L1 speakers stress the first syllable equally. Natural English has
    weak first syllable and primary stress on the second. Speakers of languages without
    the voiced dental fricative (e.g., French, Japanese) may substitute /d/ or /z/.
  note: Although — the first syllable is often reduced to a schwa
  practice: Drill although it was with stress on the second syllable.
- example_generator:
    contexts:
    - connected speech
  l1_issue: Speakers may confuse though with tough or through. The vowel in though
    is a diphthong, not a short vowel.
  note: Though — single syllable, often reduced in connected speech
  practice: Contrast though vs tough vs through to avoid confusion.
register_notes:
- note: 'Biber et al. (1999) — Concessive connectors (''although'', ''though''): ''although''
    is more formal and more common in academic prose and news; ''though'' is more
    conversational. Register distribution is a key teaching point. Ch. 10.4.1.5'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 10.4.1.5
