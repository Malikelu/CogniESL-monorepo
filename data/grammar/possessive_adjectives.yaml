sub_rules:
- examples:
  - The dog wagged its tail. (possessive)
  - It's raining. (it is)
  rule: '''Its'' (possessive) vs ''it''s'' (it is)'
  type: spelling
- examples:
  - my book / my books
  - her car / her cars
  rule: Possessive adjectives don't change for plural nouns
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students guess ownership of classroom objects.
    duration: 10
    name: Whose Is It?
  tips:
  - Use real objects to demonstrate possession
  - Contrast with possessive 's
  - 'Swan PEU: These are technically pronouns (not adjectives), though often called
    ''possessive adjectives'' in older grammars. They function as determiners.'
  - 'Swan PEU: Possessive determiners are NOT used with other determiners (the, a/an,
    this). Use ''... of mine/yours'' structure instead: ''a friend of mine'' NOT ''a
    my friend''.'
  - 'Swan PEU: Spelling — ''its'' and ''whose'' have NO apostrophe as possessives.
    ''It''s'' and ''who''s'' are contractions (it is/has, who is/has).'
  - 'Swan PEU: Articles replace possessives in body part expressions after prepositions:
    ''hit him on the head'' (NOT ''on his head''), ''pain in the stomach''. Exception
    NOT the rule.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 5: CGEL (Ch.5)
    uses the term GENITIVE (not ''possessive'') for the -''s inflection. CGEL: -''s
    is an INFLECTION (ending), not a clitic. Evidence: it attaches to the LAST word
    of the NP, not the head: ''the King of Spain''s daughter'' (not *''the King''s
    of Spain daughter''). The genitive expresses a range of meanings beyond possession:
    subjective (''the teacher''s recommendation'' = the teacher recommended), objective
    (''the prisoner''s release'' = someone released the prisoner), temporal (''today''s
    news''), etc.'
title: Possessive Adjectives
use:
- context: Family and relationships
  description: Describing family members
  examples:
  - My mother is a teacher.
  - His brother lives in London.
- context: Personal belongings
  description: Talking about possessions
  examples:
  - This is my phone.
  - Where is your bag?
