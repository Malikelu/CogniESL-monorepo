common_errors:
- correction: Your book is here.
  error: 'Confusing ''your'' and ''you''re'': *''You''re book is here.'''
  explanation: 'Swan PEU: ''Your'' is a possessive determiner (= belonging to you).
    ''You''re'' is a contraction of ''you are''. ''Your book'' NOT ''You''re book''.'
  l1_groups:
  - All L1 groups
  reliability: B
  source: Swan Entry 143. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: The dog wagged its tail.
  error: 'Confusing ''its'' and ''it''s'': *''The dog wagged it''s tail.'''
  explanation: 'Swan PEU: The possessive ''its'' has NO apostrophe. ''It''s'' is a
    contraction meaning ''it is'' or ''it has''. ''The dog wagged its tail'' NOT ''it''s
    tail''.'
  l1_groups:
  - All L1 groups
  reliability: B
  source: Swan Entry 143. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: Mary lost her keys.
  error: 'Using ''his'' for female possessors: *''Mary lost his keys.'''
  explanation: 'Swan PEU: Possessive determiners agree with the possessor, not the
    thing owned. ''Mary lost her keys'' (Mary = female → her). ''John lost his keys''
    (John = male → his).'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan Entry 143. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: 'Words that show ownership or relationship: my, your, his, her, its,
  our, their.'
dialectal_variation: []
discourse_notes:
- note: 'Possessive adjectives create cohesion: ''John lost his keys. He was upset.'''
- note: '''Its'' vs ''it''s'' is one of the most common spelling errors in English.'
- note: Possessive adjectives are used consistently across all registers and are among
    the most frequent determiners in English.
