grammar_point: saxon_genitive_time
level: B1
meaning:
  ccqs:
  - answer: No, it works best with common time nouns like today, yesterday, tomorrow,
      tonight, and with expressions like last week, this month, next year.
    purpose: Tests whether the learner understands that not all time expressions can
      take the Saxon genitive, and that the pattern is most natural with specific,
      short time expressions.
    question: Can we use the Saxon genitive with any time expression?
  - answer: They are very similar in meaning, but 'today's news' treats 'today' as
      a possessor, while 'the news today' uses 'today' as an adverb.
    purpose: Tests whether the learner can distinguish between the genitive (possessive)
      and adverbial (adverb) use of time expressions, which helps them choose the
      appropriate structure for different contexts.
    question: Is 'today's news' the same as 'the news today'?
  - answer: Yes, for example 'two weeks' notice' or 'three days' holiday' — the apostrophe
      comes after the plural s.
    purpose: Tests whether the learner knows the rule for plural time genitives (apostrophe
      after the -s), which differs from singular genitives and is a common source
      of punctuation errors.
    question: Do we use the Saxon genitive with plural time expressions?
  - answer: Yes, this is perfectly correct and common. What makes it notable is that
      'yesterday' and 'tomorrow' are typically adverbs, not nouns, yet in these expressions
      they take the Saxon genitive as if they were nouns. This is a fixed pattern
      in English where certain time adverbs can behave like nouns to show possession
      with the apostrophe-s. It works with 'today', 'yesterday', 'tomorrow', and 'tonight'
      but not with other time adverbs like 'now' or 'then'.
    purpose: Tests whether the learner understands that the Saxon genitive with time
      expressions extends to time adverbs like 'yesterday' and 'tomorrow', which normally
      function as adverbs but can take possessive -'s in this construction. This is
      an unusual grammatical phenomenon — adverbs becoming noun-like for possession
      — and learners need to know which time expressions allow this pattern and which
      do not.
    question: Can we use the Saxon genitive with 'yesterday's meeting' or 'tomorrow's
      weather'? Why is this unusual?
  contrast: Today's weather (Saxon genitive) vs. The weather today (adverbial). Both
    are correct, but the genitive form is more common with nouns like news, meeting,
    paper, events, decision.
  core_meaning: The Saxon genitive can be used with time expressions to indicate that
    something belongs to or is associated with a particular time period. This is a
    natural and common pattern in English.
  timeline: 'The time expression determines the temporal reference: today''s news
    (now), yesterday''s events (past), tomorrow''s meeting (future).'
phonetics:
- example_generator:
    contexts:
    - spoken English
    - presentations
  l1_issue: Learners whose L1 does not use possessive markers may omit the apostrophe
    s entirely, saying 'today news' instead of 'today's news'.
  note: The 's in the Saxon genitive is pronounced as /s/ after voiceless consonants
    and /z/ after voiced sounds, including vowels.
- example_generator:
    contexts:
    - fast speech
    - informal conversation
  l1_issue: Learners may be confused by the apparent mismatch between the plural form
    and the pronunciation.
  note: 'In plural time genitives, the extra syllable is often dropped in rapid speech:
    ''two weeks'' notice'' sounds like ''two week''s notice''.'
register_notes:
- note: 'The Saxon genitive with time is natural and neutral in everyday contexts
    (''today''s weather'', ''yesterday''s match''), but the ''of''-phrase alternative
    carries a formal or literary tone: compare ''yesterday''s news'' (journalistic,
    conversational) with ''the news of yesterday'' (elevated, literary). Time genitives
    are standard in headlines for brevity (''PM Announces Today''s Decision'') and
    dominate BrE journalistic style. For duration expressions, note the BrE/AmE split:
    ''a week''s holiday'' (BrE, genitive) vs ''a week of holidays'' (AmE, prepositional).
    In academic and legal writing, the genitive is also standard: ''last quarter''s
    results'', ''the following day''s proceedings''. Teachers should make learners
    aware that avoiding the genitive in favor of ''of'' in casual speech can sound
    stilted, just as overusing formal alternatives in conversation sounds unnatural.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Time expressions with Saxon genitive: register distribution
    varies. News uses more time genitives (today''s news, yesterday''s meeting); conversation
    uses simpler time expressions. Ch. 2.10.5.2'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 2.10.5.2
