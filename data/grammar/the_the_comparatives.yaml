description: 'Parallel comparative structure showing that two things change together: ''The more you study, the better you
  do.'' Essential for showing proportional relationships.'
dialectal_variation: []
discourse_notes:
- note: The comparative correlative (the more X, the more Y) expresses proportional relationships between two variables. It
    is common in academic and persuasive discourse.
form:
  affirmative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'The + comparative adjective/adverb, the + comparative adjective/adverb

      "The + adj/adv-er, the + adj/adv-er"

      "The more + adj/adv, the more + adj/adv"

      Subject and verb often inverted in first clause (formal): "The harder you try, the better..."

      '
  negative:
    example_generator:
      contexts:
      - food and daily routines
      min_examples: 4
    structure: 'Use less + adjective in negative correlation:

      "The less you worry, the happier you''ll be."

      "The fewer people come, the quieter it gets."

      '
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Rare as direct questions. Used in rhetorical questions or explanations:

      "Do you know the saying ''The more, the merrier''?"

      '
grammar_point: the_the_comparatives
level: B2
meaning:
  ccqs:
  - answer: The plus comparative clause, the plus comparative clause.
    purpose: Tests understanding of the parallel structure and meaning of 'the more...the more' comparatives
    question: 'Which structure is correct: ''The more, the more'' or ''The more X, the more Y''? What is the difference in
      meaning?'
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that the the comparatives is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with the the comparatives and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''The more you study, the more you learn.'' In ''the more... the more...'' structures, do NOT add an extra ''more''
      after ''the''.'
    purpose: Tests whether the learner uses the correlative comparative structure correctly (Swan PEU 2016, entries 196-197).
    question: Which is correct? *'The more you study, the more you learn more' or 'The more you study, the more you learn'?
  contrast: '''THE + COMP, THE + COMP'' = Proportional: "The richer he gets, the greedier he becomes." (both change together)

    ''SIMPLE COMPARATIVE'' = One comparison: "He is richer than his brother." (static comparison)

    ''AS...AS'' = Equality: "He is as rich as his brother." (same level)

    '
  core_meaning: 'Shows a proportional relationship: as one thing increases/decreases, another thing increases/decreases at
    the same time.'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Can express general truths (present), past habits, or future predictions. Often timeless.
phonetics:
- example_generator:
    contexts:
    - comparative stress
  l1_issue: Portuguese speakers may stress 'the' in this structure. Teach that 'the' is always weak here.
  note: 'Both ''the'' are weak: /ðə/. Stress falls on the comparatives: ''The MORE you STUDY, the MORE you LEARN.'''
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Correlative comparatives (''the more...the more...''): register distribution varies. More common
    in academic prose and formal/literary writing than in conversation. Ch. 7.7.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.7.3
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - The more you study the more you learn
  - The faster you work the sooner you finish
  - The harder you try the better the result
  rule: The + comparative clause, the + comparative clause
  type: grammatical
- examples:
  - The faster the better
  - The bigger the better
  rule: Short adjectives add -er (faster, harder, bigger)
  type: grammatical
- examples:
  - The more interesting the book the more I enjoy it
  - The more expensive the car the more prestige
  rule: Long adjectives use more + adjective (more interesting, more expensive)
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students create sentences: ''The more I practice, the better I get.'' ''The faster I work, the more
      tired I get.'''
    duration: 15
    name: The More The More
  - adaptation_notes: 'Students build chains: ''The more I study, the more I learn. The more I learn, the more I earn.'''
    duration: 10
    name: Comparative Chain
  tips:
  - 'Start with common sayings: ''The more, the merrier'' and ''The sooner, the better''.'
  - 'Use visuals: graph showing X increasing as Y increases.'
  - 'Practice with cause-effect: ''If you study more, you get better grades'' → ''The more you study, the better your grades''.'
  - 'Contrast with simple comparatives: ''She is taller'' vs ''The taller she gets, the more confident she feels''.'
  - 'Swan PEU: ''The more...the more...'' — correlative comparison: ''The more, the merrier.'' ''The sooner, the better.''
    ''The more I study, the more I learn.'' Parallel structure required.'
title: The...the... Comparatives (Correlative Comparatives)
use:
- description: Show that as X increases, Y also increases.
  examples:
  - The more you learn, the more you know.
  - The longer you wait, the more expensive it gets.
  key_point: Both clauses show parallel increase.
  name: Proportional Change (Both Increase)
- description: Show that as X increases, Y decreases.
  examples:
  - The more you rush, the worse the results.
  - The older I get, the less energy I have.
  key_point: Use 'less/fewer' in second clause for decrease.
  name: Inverse Proportional Change (One Increases, One Decreases)
- description: Express timeless wisdom or cause-effect relationships.
  examples:
  - The sooner, the better.
  - The more, the merrier.
  - The bigger, the better.
  key_point: Often used as short sayings without full clauses.
  name: General Truths and Sayings
