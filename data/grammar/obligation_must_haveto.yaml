common_errors:
- correction: I must study every day. / I have to study every day.
  error: '*I must to study every day.*'
  explanation: Modal 'must' is followed by the base verb (no 'to'). 'Have to' requires 'to'. This is a very common structural
    error.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Modal verbs'
description: Expressing obligation, necessity, and rules using must and have to, and understanding the difference between
  internal and external obligation.
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission: ''All passengers must wear seatbelts.'''
form:
  affirmative:
    example_generator:
      contexts:
      - rules and laws
      - work obligations
      - health advice
      - school requirements
      min_examples: 4
    structure: 'Subject + must/have to + base verb: "I must go." / "She has to work." / "They have to study." Note: "must"
      does not change form (no -s for third person). "Have to" conjugates: I/you/we/they HAVE to; he/she HAS to.'
  negative:
    example_generator:
      contexts:
      - prohibitions
      - optional situations
      - exemptions from rules
      min_examples: 3
    structure: 'Must not: Subject + must not (mustn''t) + base verb — expresses prohibition: "You must not park here." Don''t
      have to: Subject + don''t/doesn''t have to + base verb — expresses lack of obligation: "You don''t have to pay now."'
  questions:
    example_generator:
      contexts:
      - asking about rules
      - checking obligations
      - clarifying requirements
      min_examples: 3
    structure: 'Must: Must + subject + base verb? "Must I wear a tie?" Have to: Do/Does + subject + have to + base verb? "Do
      I have to wear a tie?" / "Does she have to work on Saturday?"'
grammar_point: obligation_must_haveto
level: A2
meaning:
  ccqs:
  - answer: You decided. "Must" often shows the speaker's own feeling of obligation.
    purpose: 'Tests whether the learner can distinguish between three levels of obligation: must (strong/personal), have to
      (external/rule), should (advice/recommendation).'
    question: If I say 'I must study tonight,' who decided — me or someone else?
  - answer: Probably someone else — a teacher, a parent, or a rule. "Have to" often shows external obligation.
    purpose: Tests understanding of obligation_must_haveto.
    question: If I say 'I have to study tonight,' who decided — me or someone else?
  - answer: '"Must not" means it is prohibited (you are not allowed). "Don''t have to" means it is not necessary (you can
      if you want, but it is not required).'
    purpose: Tests understanding of obligation_must_haveto.
    question: Can you explain the difference between 'must not' and 'don't have to' by giving an example of when to use each?
  - answer: 'No. "Must" has no past form. For the past, use "had to": "I had to leave early yesterday."'
    purpose: Tests understanding of obligation_must_haveto.
    question: Can we use 'must' to talk about the past?
  contrast: 'Must (internal obligation): \"I must call my mother.\" (I feel it is important; my own decision.)

    Have to (external obligation): "I have to wear a uniform at work." (The rule comes from outside; the company requires
    it.)

    Must not (prohibition): "You must not smoke here." (It is forbidden.)

    Don''t have to (no obligation): "You don''t have to wear a tie." (It is optional; no one is forcing you.)

    '
  core_meaning: '"Must" and "have to" both express obligation or necessity — something that is required or compulsory. "Must"
    often suggests the speaker''s personal authority or feelings, while "have to" suggests an external rule, law, or someone
    else''s authority. Both are used when there is no choice about doing something.'
  example_generator:
    contexts:
    - everyday situations
    - workplace rules
    - school requirements
    - laws and regulations
    - health advice
    cultural_notes:
    - In British English, "have to" is much more common in everyday speech than "must." "Must" can sound quite formal or strong.
      In American English, "have to" is also preferred in casual conversation.
    - Learners from languages with no equivalent distinction may overuse "must" because it is taught first. Emphasise that
      "have to" is the safer, more neutral choice for general obligations.
    min_examples: 5
  timeline: '"Must" and "have to" express present or future obligation: "I must finish this today." / "I have to finish this
    today." For past obligation, "had to" is used: "I had to work yesterday." "Must" has no past form.'
phonetics:
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may pronounce every word with full stress, making speech sound unnatural. Drill the reduced form /məs/
    in natural sentences.
  note: '"Must" is pronounced /mʌst/ in its strong form but is often reduced to /məs/ in connected speech: "I must go" /aɪ
    məs ɡəʊ/. "Mustn''t" is pronounced /ˈmʌsənt/.'
- example_generator:
    contexts:
    - connected speech
    - assimilation
  l1_issue: Learners often say /hæv tuː/ clearly, which sounds overly careful. Teach the natural pronunciation /hæf tə/ early.
  note: '"Have to" in connected speech is pronounced /ˈhæf tə/ (not /hæv tuː/). The /v/ becomes /f/ because the following
    /t/ is voiceless. "Has to" is pronounced /ˈhæs tə/.'
register_notes:
- note: 'In conversation, modals are essential for politeness: ''Could you pass the salt?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal language, ''must'' expresses strong obligation: ''All passengers must wear seatbelts.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Obligation modals and semi-modals (''must'', ''have to'', ''should'', ''ought to''): register
    distribution varies by text type. Conversation uses more ''have to''; formal writing uses more ''must''. Ch. 6.6.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6.2
