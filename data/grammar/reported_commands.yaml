common_errors:
- correction: He told me to sit down.
  error: 'Omitting ''to'' in reported commands: *''He told me sit down.'''
  explanation: The infinitive marker 'to' is required between the object and the base verb in reported commands. Many L1s
    that use bare infinitives after verbs (e.g., Portuguese, Spanish) drop 'to' here.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: He told me to leave.
  error: 'Using ''say'' instead of ''tell'': *''He said me to leave.'''
  explanation: Use 'tell' (for orders) or 'ask' (for requests) with the object + to-infinitive pattern. 'Say' cannot take
    an object + to-infinitive and is used for reported statements, not commands.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: He told me not to worry.
  error: 'Wrong word order in negatives: *''He told me to not worry.'''
  explanation: In reported commands, 'not' comes before 'to' (not to + verb), not split between 'to' and the verb. The standard
    order is 'told someone not to do something'.
  l1_groups:
  - Portuguese
  - Spanish
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Word order'
description: A structure to paraphrase orders, requests, or advice given in the past, using reporting verbs followed by an
  infinitive.
