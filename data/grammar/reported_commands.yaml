teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Teacher gives direct commands. Students report them: ''Sit down!'' → ''He told us to sit down.'' ''Do
      not talk!'' → ''She told us not to talk.'''
    duration: 15
    name: Command Reporting
  - adaptation_notes: 'Students match reporting verbs to situations: ''Be quiet!'' (order), ''Please help me'' (ask), ''You
      should study'' (advise).'
    duration: 10
    name: Reporting Verbs
  tips:
  - Start with simple 'tell' commands, then add 'ask' and 'order'.
  - Contrast direct imperatives with reported commands side by side.
  - Practice negative commands early to avoid 'to not' errors.
  - 'Swan PEU: Commands in reported speech — ''He told me to leave.'' ''She asked him to wait.'' Infinitive form for imperative
    reporting. Negative: ''He told me not to go.'''
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'INDIRECT IMPERATIVES: Reported commands use to-infinitive: ''Finish the homework by Monday'' → ''He told us to finish
    the homework.'' NOT *''that we finish'' (except with mandative verbs like demand/insist, which DO take subjunctive that-clauses).
    Source: Ch.24 p.452.'
title: Reported Commands, Requests, and Advice
use:
- description: Report commands from people in authority (bosses, teachers, parents).
  examples:
  - The teacher told the students to open their books.
  - The boss ordered the team to finish the project.
  key_point: Use 'tell' or 'order' for direct commands.
  name: Authority Orders
- description: Report polite requests or favors asked in the past.
  examples:
  - He asked me to pick up some groceries.
  - 'She asked if I could wait (wait, no – that''s a question. For requests: ''She asked me to wait''.)'
  key_point: Use 'ask' for polite, non-authoritative requests.
  name: Polite Requests
- description: Report advice or recommendations given to you.
  examples:
  - My doctor advised me to exercise more.
  - She advised me not to quit my job.
  key_point: Use 'advise' for professional or personal recommendations.
  name: Advice Reporting
