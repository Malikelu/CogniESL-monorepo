grammar_point: reported_commands
level: B1
meaning:
  ccqs:
  - answer: Use tell or ask or order plus person plus to plus base verb.
    purpose: Tests whether the learner knows the correct reporting verb + object + to-infinitive structure for commands, and
      understands that 'say' cannot be used for commands.
    question: How do we report a command
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that reported commands is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with reported commands and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: No. 'Say' cannot be used with an object + to-infinitive for commands. The correct form is 'She told me to leave'.
      'Tell' requires an object (tell someone to do something), while 'say' does not take a direct object before the that-clause
      (She said that I should leave). 'Say' is for reported statements, not commands.
    purpose: Tests whether the learner can distinguish between 'say' and 'tell' in the context of reported commands. 'Tell'
      takes an object + to-infinitive (tell someone to do something), while 'say' cannot be used with this pattern. This is
      one of the most persistent errors in reported commands because many learners default to 'say' as their all-purpose reporting
      verb.
    question: Is 'She said me to leave' correct for reporting a command?
  contrast: 'Direct command: ''Sit down!'' (imperative, exclamation mark) Reported command: He told me to sit down (infinitive,
    no exclamation) ''Tell'' = Order (direct); ''ask'' = Polite request; ''advise'' = Advice ''Say'' is never used for commands
    – use ''tell'', ''ask'', or ''order''. '
  core_meaning: Reports orders, polite requests, or advice given in the past, using an infinitive structure instead of the
    original imperative.
  timeline: The reporting verb is in past tense; the infinitive (to + base verb) does not change tense (no backshift).
phonetics:
- example_generator:
    contexts:
    - reported speech pronunciation
  l1_issue: 'Portuguese speakers may omit ''to'' in reported commands. Teach the full structure: ''told me to sit'' NOT ''told
    me sit.'''
  note: 'To is weak before verbs: ''told me to sit'' → /təʊld miː tə sɪt/. The to reduces to a schwa.'
