common_errors:
- correction: It is widely believed that...
  error: 'Using active voice in ''It'' construction: *''It is widely believes that...'''
  explanation: The complex passive reporting structure requires a past participle after 'be'. Using the third-person '-s'
    form ('believes') is incorrect because the structure demands the passive voice (be + past participle).
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Passive reporting structures'
- correction: He is said to have left the country.
  error: 'Using present infinitive for past events: *''He is said to leave the country.'''
  explanation: When the reported event happened before the reporting time, the perfect infinitive (to have + past participle)
    must be used, not the present infinitive. Present infinitive implies simultaneous or future events.
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Reported speech'
- correction: It is said that... / It has been reported that...
  error: 'Using non-compatible verbs: *''It is apologized that...'''
  explanation: Not all reporting verbs work in the 'It + passive + that' pattern. Only verbs that can take a clausal complement
    in the passive (say, believe, think, report, etc.) are compatible. Verbs like 'apologize' or 'congratulate' do not work
    in this structure.
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Passive reporting structures'
description: Advanced passive reporting structures used in formal, academic, and journalistic English to report information
  while distancing the writer from the claim.
dialectal_variation: []
discourse_notes:
- note: This structure is used almost exclusively in written discourse and formal spoken contexts such as news broadcasts.
example_generator:
  contexts:
  - news reporting
  - academic writing
  - official statements
  - legal documents
  cultural_notes:
  - This structure is extremely common in BBC news and quality newspapers
  - It can be used to present opinions as facts, so critical readers should be cautious
  min_examples: 5
form:
  affirmative:
    example_generator:
      contexts:
      - news headlines
      - academic introductions
      - official announcements
      min_examples: 4
    structure: 'It + passive reporting verb + that + clause. For example: It is believed that... / It has been reported that...
      / It was announced that...'
  negative:
    example_generator:
      contexts:
      - refuting claims
      - expressing doubt
      - legal denials
      min_examples: 3
    structure: 'It + passive reporting verb + not + that + clause. For example: It is not believed that... / Subject + passive
      reporting verb + not + to-infinitive. For example: He is not considered to be...'
  questions:
    example_generator:
      contexts:
      - journalistic enquiry
      - academic questioning
      - legal cross-examination
      min_examples: 3
    structure: 'Is/Was it + past participle + that...? For example: Is it believed that...? / Is/Was + subject + past participle
      + to-infinitive? For example: Is he known to have...?'
grammar_point: reporting_complex
level: C1
meaning:
  ccqs:
  - answer: No, the speaker distances themselves and does not take responsibility for the claim.
    purpose: Tests whether the learner understands the key pragmatic function of complex passive reporting -- distancing the
      writer/speaker from the claim being reported, which is why this structure is preferred in journalism and academic writing.
    question: Does the speaker necessarily agree with the reported information?
  - answer: Formal — especially in journalism, academic writing, and official reports.
    purpose: Tests the learner's awareness of the register of this structure, helping them avoid using it in casual contexts
      and recognize it in news and academic texts.
    question: Is this structure more common in formal or informal English?
  - answer: No, only certain verbs work such as say, believe, think, consider, know, report, allege, expect, understand, and
      claim.
    purpose: Tests whether the learner knows which verbs are compatible with complex passive reporting structures and cannot
      be used randomly with any reporting verb.
    question: Can we use this structure with any reporting verb?
  - answer: The first uses the 'It + passive + that-clause' pattern, which reports a general belief without specifying who
      holds it. The second uses 'subject + passive + perfect infinitive' where the subject ('Scientists') is specified and
      the perfect infinitive ('to have predicted') shows the reported action (predicting) happened before the reporting. Both
      are impersonal passive reporting structures with different sentence patterns.
    purpose: Tests whether the learner can distinguish between the two main patterns of complex passive reporting — the 'It
      + passive + that-clause' impersonal construction versus the 'subject + passive + to-infinitive' construction. The choice
      depends on whether the source of the reported information is specified, and the infinitive form (present vs. perfect)
      signals whether the reported event is simultaneous with or prior to the reporting.
    question: Can you explain the difference between 'It is believed that the climate is changing' and 'Scientists are believed
      to have predicted this change' by giving an example of when to use each?
  contrast: 'Direct reporting: Scientists believe that the climate is changing. Complex passive: It is believed that the climate
    is changing. Or: Scientists are believed to have predicted this.'
  core_meaning: Complex reporting structures allow speakers and writers to report beliefs, opinions, and information without
    stating who holds them, creating an impression of objectivity or general consensus.
  timeline: The tense of the reporting verb indicates when the reporting occurred; the tense in the that-clause or infinitive
    reflects the time of the reported event.
phonetics:
- example_generator:
    contexts:
    - news broadcasts
    - formal presentations
  l1_issue: Learners may over-stress the passive verb, making the sentence sound unnatural.
  note: In the 'It + passive + that' pattern, the reporting verb is typically unstressed, with the main stress falling on
    the that-clause content.
- example_generator:
    contexts:
    - spoken English
    - interviews
  l1_issue: Learners may produce the full form where native speakers would use the weak form.
  note: In the 'subject + passive + to-infinitive' pattern, the auxiliary is or was is often reduced in connected speech.
register_notes: []
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 33: Reported Speech and Writing'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - It is widely believed that artificial intelligence will transform the workplace.
  - It has been reported that the company is facing financial difficulties.
  - It was announced that the prime minister would resign.
  - It is thought that the ancient city was destroyed by an earthquake.
  rule: It + passive reporting verb + that-clause — the most common pattern for impersonal reporting.
  type: grammatical
- examples:
  - She is said to be the best surgeon in the country.
  - He was believed to have fled the country.
  - They are known to have donated millions to charity.
  - The building is considered to be unsafe.
  rule: Subject + passive reporting verb + to-infinitive — used when the subject of the reporting is specified.
  type: grammatical
- examples:
  - She is thought to have left the country last week.
  - He was reported to have been involved in the scandal.
  - The painting is believed to have been stolen in the 1970s.
  rule: Perfect infinitive (to have + past participle) is used when the reported event happened before the reporting.
  type: grammatical
- examples:
  - He is said to be working on a new novel.
  - They are believed to be living abroad.
  - The company is thought to be considering a merger.
  rule: Continuous infinitive (to be + -ing) is used when the reported event is ongoing.
  type: grammatical
- examples:
  - It is estimated that over a million people attended the march.
  - He was alleged to have accepted bribes.
  - The project is expected to be completed by June.
  rule: 'Common reporting verbs used in this structure: say, believe, think, consider, know, report, allege, claim, expect,
    understand, estimate, assume, suppose.'
  type: lexical
- examples:
  - It seems that the meeting has been cancelled.
  - She appears to have changed her mind.
  - It appears that no one was injured in the accident.
  rule: 'The structure can be used with seem and appear in a similar pattern: It seems/appears that... / Subject + seems/appears
    + to-infinitive.'
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students rewrite direct quotes from news articles using complex reporting structures.
    duration: 15
    name: Headline Rewrite
  - adaptation_notes: Given a sentence in present reporting, students transform it to past reporting with perfect infinitive.
    duration: 10
    name: Tense Transformation
  - adaptation_notes: Students read a news article and identify all complex reporting structures, then discuss why the journalist
      chose this pattern.
    duration: 15
    name: Source Detective
  - adaptation_notes: Students write a short academic paragraph about a topic, using at least three different complex reporting
      structures.
    duration: 20
    name: Academic Paragraph Writing
  tips:
  - Start by showing authentic news headlines and asking students to identify the reporting pattern.
  - Contrast direct speech with complex reporting to show the distancing effect.
  - 'Drill the most common verbs first: say, believe, think, consider, know, report.'
  - 'Use a tense-matching exercise: present reporting with to-infinitive; past reporting with to have + past participle.'
  - Warn students that overuse in IELTS essays can sound unnatural — it should be used sparingly and appropriately.
  - 'Swan PEU covers reported speech comprehensively. The pattern is: backshift tenses + shift pronouns/time words + use infinitive
    for commands + use if/whether for questions.'
title: Complex Reporting Structures (It is widely believed that...)
use:
- context: Journalism and news reporting
  description: Complex reporting is the backbone of news writing, allowing journalists to report claims without endorsing
    them.
  examples:
  - It is understood that the two sides are close to reaching an agreement.
  - It has been claimed that the evidence was fabricated.
  - The president is said to be considering a cabinet reshuffle.
- context: Academic writing
  description: Scholars use these structures to report findings and theories while maintaining an objective tone.
  examples:
  - It has been argued that social media has a negative impact on mental health.
  - This theory is widely considered to be outdated.
  - The results are believed to be statistically significant.
- context: Legal and official contexts
  description: Legal documents use these structures to report allegations and findings without prejudice.
  examples:
  - The defendant is alleged to have committed the offence on the night of 14 June.
  - It was reported that the suspect had been seen near the scene.
  - The building is known to contain asbestos.
- context: Everyday formal conversation
  description: Even in conversation, these structures appear when discussing rumours or second-hand information.
  examples:
  - He is supposed to be incredibly rich.
  - She is said to speak five languages.
  - It is thought that they are moving to Canada.
