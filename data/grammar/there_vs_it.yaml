common_errors:
- correction: There is a book on the table.
  error: 'Using ''it'' instead of ''there'' for existence: *''It is a book on the table.'''
  explanation: 'Swan PEU: "there is/are" introduces existence of something. "It" does not work this way. "There''s a hole
    in my sleeve" is natural; "A hole is in my sleeve" is not. Use there + be for existential meaning; use it for weather/time/distance.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Dutch
  reliability: B
  source: Swan Entry 20.1. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: It is cold today.
  error: 'Using ''there'' instead of ''it'' for weather/time: *''There is cold today.'''
  explanation: 'Swan PEU: "it" is used as a dummy subject for weather ("it is raining"), time ("it is Monday"), distance ("it
    is 10km to Paris"). "There" is only for existence. Portuguese and Spanish use one construction for both — the distinction
    must be taught explicitly.'
  l1_groups:
  - Portuguese
  - Spanish
  - Dutch
  reliability: B
  source: Swan Entry 20. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: There are many people.
  error: 'Using ''there is'' with plural nouns: *''There is many people.'''
  explanation: 'Swan PEU: "There are" is used with plural subjects; "there is" with singular/uncountable. Swan PEU: In informal
    speech, "there''s" is very commonly used with both singular and plural ("There''s two men at the door") — this is widespread
    but non-standard.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Dutch
  reliability: B
  source: Swan Entries 20.1, 20.2. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: The book is there on the table.
  error: 'Confusing location ''there'' and existential ''there'': *''The book is there are on the table.'''
  explanation: 'Swan PEU: There are TWO different words spelled "there": (1) Existential "there" (preparatory subject) goes
    before the verb: "There is a book." (2) Location "there" (adverb) goes after the verb: "The book is there on the table."
    Pronunciation note: existential "there" is usually weak /ðə(r)/.'
  l1_groups:
  - Portuguese
  - Spanish
  - Dutch
  reliability: B
  source: Swan Entry 20. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: ''
  error: See Swan & Smith (2001) for L1-specific patterns
  explanation: Swan & Smith (2001). Dutch (overuse of 'er' - broader than English 'there'; *It are the Joneses), Spanish (there/it
    transfer).
  flagged: false
  l1_groups:
  - Dutch
  - Spanish
  reliability: B
  source: 'Swan & Smith (2001) Learner English: A Teacher''s Guide to Interference and Other Problems, 2nd ed. Cambridge University
    Press.'
description: Using 'there' and 'it' as dummy subjects when the real subject comes later or is unknown. Essential for existential
  and introductory structures.
dialectal_variation:
- note: 'In informal speech, ''there''s'' is used with both singular and plural: ''There''s many people here.'' (non-standard
    but extremely common)'
- note: 'In some dialects, ''it''s'' replaces ''there''s'' in casual speech: ''It''s a problem with the engine.'''
discourse_notes:
- note: '''There is/are'' introduces new information into discourse: ''There is a problem. The problem is serious.'' (new
    → given)'
- note: '''It'' refers to known information: ''It is a serious problem.'' (both speaker and listener know which problem)'
- note: 'In narratives, ''there'' introduces new elements: ''There was a castle on the hill. The castle was ancient.'''
- note: '''It'' creates cohesion by referring back: ''I bought a book. It was very interesting.'''
form:
  affirmative:
    example_generator:
    - There is a book on the table.
    - There are many people here.
    - It is raining.
    - It is Monday.
    min_examples: 4
    structure: There + be + noun (existential) / It + be + adjective/noun (weather/time/distance)
  negative:
    example_generator:
    - There isn't any milk.
    - There aren't any buses today.
    - It isn't raining.
    - It isn't cold today.
    min_examples: 4
    structure: There + be + not + noun / It + be + not + adjective/noun
  questions:
    example_generator:
    - Is there any water?
    - Are there any questions?
    - Is it cold outside?
    - Is it Friday today?
    min_examples: 4
    structure: Be + there + noun? / Be + it + adjective?
grammar_point: there_vs_it
level: A1
meaning:
  ccqs:
  - answer: Yes — use 'there is/are'.
    purpose: Tests whether the learner understands when to use "there" (existence) vs. "it" (weather/time/distance). This
      is important because confusing these two dummy subjects is a very common beginner error.
    question: Are we saying that something exists?
  - answer: Yes — use 'it is'.
    purpose: Tests whether the learner knows to use "it" for weather, time, and distance expressions. This is important because
      "it" as a dummy subject is used in many fixed expressions that learners must memorize.
    question: Are we talking about weather, time, or distance?
  - answer: No — 'there is' means 'exists'. 'The book is there' means 'in that place'. Different meanings.
    purpose: Tests whether the learner understands that existential "there" is different from location "there". This is important
      because "there is" (exists) and "it is there" (in that place) have completely different meanings.
    question: Is 'there' the same as the location word 'there'?
  - answer: '''There is a man at the door.'' Use ''there is'' to introduce/exist something new. ''It is'' is for identifying
      or describing something already mentioned.'
    purpose: 'Tests whether the learner distinguishes ''there is'' (existence/introduction) from ''it is'' (identification/description).
      Swan PEU: ''there is'' introduces existence; ''it'' is used for weather, time, distance as a dummy subject.'
    question: Which is correct to introduce something new? 'There is a man at the door' or 'It is a man at the door'?
  contrast: '''There is a book on the table.'' (existence — a book exists there) vs ''It is raining.'' (weather — no real
    subject, ''it'' is a placeholder)'
  core_meaning: '''There'' introduces the existence or presence of something (there is a book = a book exists). ''It'' is
    used for weather, time, distance, or as a dummy subject for clauses (it is raining, it is Monday, it is important to study).'
  example_generator:
    contexts:
    - describing rooms and places
    - weather and seasons
    - time and schedules
    - existence and presence
    cultural_notes:
    - Use diverse locations and contexts
    - Avoid politically sensitive locations
    - Keep examples concrete and visual for A1 level
    min_examples: 5
  timeline: 'Both can be used in any tense: there was, there will be, it was, it will be.'
phonetics:
- example_generator:
  - There is /ðər ɪz/ or /ðəz/
  - There are /ðər ɑː/ or /ðeər ɑː/
  l1_issue: Portuguese and Spanish speakers often pronounce 'there' as /ter/ or /tre/. Teach the correct pronunciation /ðər/
    with the voiced th sound.
  note: 'Weak form of ''there is'' in connected speech: /ðər ɪz/ or even /ðəz/. ''There is a book'' sounds like /ðər ɪz ə
    bʊk/ or /ðəz ə bʊk/.'
- example_generator:
  - It is /ɪts/ or /ɪt s/
  - It isn't /ɪt ɪzənt/
  l1_issue: Many L1 speakers separate 'it' and 'is' too clearly. Teach the contracted form /ɪts/ for natural speech.
  note: 'Weak form of ''it is'' in connected speech: /ɪts/ or /ɪt s/. ''It is raining'' sounds like /ɪts reɪnɪŋ/.'
register_notes:
- note: '''There is/are'' is neutral in register.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, ''there'' + be introduces topics: ''There are several reasons for this.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, ''there'' + be is common for presenting findings: ''There was a significant difference between
    groups.'''
  reliability: D
  source: Team observation
  tier: 4
- note: '''It'' for weather/time is universal across registers: ''It is 3 o''clock.'' / ''It is raining.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Existential ''there'' vs. dummy ''it'': register distribution differs. Existential ''there''
    is more common in conversation and fiction; dummy ''it'' (weather, distance) is distributed across registers. Ch. 11.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 11.4
