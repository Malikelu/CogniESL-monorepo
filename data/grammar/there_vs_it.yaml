sub_rules:
- examples:
  - There is a book on the table.
  - There are many problems.
  - There was an accident.
  - There will be a meeting tomorrow.
  rule: Existential 'there' — introduces new information or states that something exists
  type: grammatical
- examples:
  - It is raining.
  - It is 5pm.
  - It is 10km to Paris.
  - It is Monday.
  - It was sunny yesterday.
  rule: Weather/time/distance 'it' — used when there is no real subject
  type: grammatical
- examples:
  - It is clear that you are right.
  - It is important to study.
  - It seems that he left.
  - It is difficult to learn English.
  rule: Dummy 'it' for clauses — introduces that-clauses or to-infinitives
  type: grammatical
- examples:
  - There is a book. (existence)
  - The book is there. (location — in that place)
  rule: There vs location 'there' — different meanings
  type: semantic
- examples:
  - There is a book. (singular)
  - There are many books. (plural)
  - There is some water. (uncountable)
  - There are some people. (plural)
  rule: Singular/plural agreement with 'there'
  type: grammatical
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: 'Students describe the classroom using ''there is/are'': ''There is a board. There are 20 desks. There
      is a window.'' Practices existential ''there'' with real objects.'
    duration: 10
    name: Classroom Description
  - adaptation_notes: 'Students give a weather report for different cities: ''In London, it is raining. In Madrid, it is sunny.''
      Practices ''it is'' for weather.'
    duration: 10
    name: Weather Report
  - adaptation_notes: 'Put objects in a bag. Students ask: ''Is there any water?'' ''Are there any apples?'' Practices questions
      with ''there is/are''.'
    duration: 15
    name: What is in the Bag?
  - adaptation_notes: 'Students describe their town: ''There is a hospital. There are two schools. There is a park.'' Practices
      existential ''there'' with places.'
    duration: 15
    name: Town Description
  tips:
  - 'Use the classroom to demonstrate: ''There is a board. There are windows. There are 20 students.'' Makes the concept physical
    and immediate.'
  - 'Contrast existential ''there'' with location ''there'': ''There is a book (existence) vs The book is there on the table
    (location).'' This prevents confusion.'
  - 'Practice weather expressions daily: ''It is sunny today.'' This gives authentic daily practice.'
  - 'Use a map to practice distance: ''It is 50km from São Paulo to Campinas.'''
  - Introduce dummy 'it' for clauses gradually. Start with weather/time, then move to 'it is important to...' at A2 level.
  - 'Swan PEU: Use there as a "preparatory subject" to say something exists. "There''s a hole in my sleeve" is more natural
    than "A hole is in my sleeve."'
  - 'Swan PEU: There is especially used with indefinite subjects (a, some, any, no, somebody, nothing). "Is there anybody
    at home?" "There was dancing in the streets."'
  - 'Swan PEU: Complex structures — "There might be", "There must be", "There tends to be". Use for speculation: "There must
    be something we can do."'
  - 'Swan PEU: "There was", "There will be" — there works with all tenses.'
  - 'Swan PEU: Do NOT use there with definite subjects. "James was at the party" NOT "There was James at the party" — except
    when listing options: "Well, there''s James, or Anna..."'
title: There vs It (Dummy Subjects)
use:
- context: Describing existence and presence
  description: Saying that something exists or is present
  examples:
  - There is a park near my house.
  - There are many restaurants in this area.
  - There is a new student in our class.
  - There are three bedrooms in my house.
- context: Describing weather
  description: Talking about current weather conditions
  examples:
  - It is raining.
  - It is sunny today.
  - It was cold yesterday.
  - It will be hot tomorrow.
- context: Telling time and dates
  description: Talking about time, days, and dates
  examples:
  - It is 5 o'clock.
  - It is Monday.
  - It is January.
  - It was my birthday yesterday.
- context: Describing distance
  description: Talking about how far something is
  examples:
  - It is 10km to the airport.
  - It is a long way to my house.
  - It is not far from here.
