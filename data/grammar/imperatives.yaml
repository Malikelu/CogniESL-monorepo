grammar_point: imperatives
level: A1
meaning:
  ccqs:
  - answer: 'Don''t sit down'' is the negative imperative. We form it with ''don''t''
      + base verb: ''Don''t sit down,'' ''Don''t run,'' ''Don''t touch that.'''
    purpose: Tests whether the learner can identify the negative imperative form and
      state the rule for forming it (don't + base verb).
    question: 'What is the negative imperative: ''Sit down'' or ''Don''t sit down''?
      How do we form it?'
  - answer: No, it's implied.
    purpose: Tests whether the learner knows that imperatives have no stated subject
      — 'you' is implied but not written.
    question: Is the subject 'you' stated?
  - answer: 'Add ''''please'''': ''''Please sit down.'''' Or use ''''Do sit down''''
      for a warm, welcoming emphasis.'
    purpose: Tests whether the learner knows strategies for softening imperatives
      (Swan PEU 2016, entries 280-285).
    question: How can you make 'Sit down' more polite?
  - answer: Don't sit down. Negative imperatives use ''don't'' + base verb.
    purpose: Tests whether the learner can form a negative imperative correctly —
      don't + base verb.
    question: What is the negative of 'Sit down'?
  contrast: '''Imperative'' = "Sit down." (direct command)

    ''Present Simple'' = "You sit down." (statement of fact)

    '
  core_meaning: Direct commands, instructions, requests, or warnings. The subject
    'you' is implied but not stated.
  example_generator:
    contexts:
    - classroom instructions
    - recipes and cooking
    - directions and navigation
    - rules and warnings
    - advice and suggestions
    cultural_notes:
    - Use 'please' for polite requests
    - Avoid overly direct commands in conservative cultures
    min_examples: 5
  timeline: Immediate — the action should happen now or soon.
phonetics:
- example_generator:
    contexts:
    - commands
    - instructions
  l1_issue: Some L1 speakers may add an unnecessary subject pronoun
  note: Stress on the verb in short imperatives
register_notes:
- note: 'Imperatives can sound rude. In formal contexts, use ''please'' or indirect
    forms: ''Could you please sit down?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In instructions and recipes, imperatives are standard: ''Mix the ingredients.
    Bake for 30 minutes.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Imperative clauses: register distribution varies. Common
    in conversation (instructions, requests), instructional writing, and fiction dialogue.
    Rare in academic prose except instructional texts. Ch. 3.13.4.2'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 3.13.4.2
