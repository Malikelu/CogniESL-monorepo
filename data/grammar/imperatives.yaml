common_errors:
- correction: Sit down.
  error: 'Adding ''you'' before imperative: *''You sit down.'''
  explanation: Imperatives don't have a subject. The subject 'you' is implied.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: Sit down.
  error: 'Using ''to'' before the verb: *''To sit down.'''
  explanation: Imperatives use the base verb without 'to'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: Don't sit down.
  error: 'Using ''don''t'' for negative imperatives: *''Not sit down.'''
  explanation: Negative imperatives use 'don't' + base verb.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: Let's not go.
  error: 'Using negative of let''s incorrectly: *''Don''t let''s go.'''
  explanation: 'Swan PEU: The negative of ''let''s'' is ''let''s not'', NOT ''don''t
    let''s''. ''Let''s not argue'' is standard.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: Let's go.
  error: 'Using ''let you'' instead of ''let''s'': *''Let you and I go.'''
  explanation: 'Swan PEU: ''Let''s'' = ''let us'' (suggestion including speaker).
    ''Let you and I'' is not a standard form.'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Commands, requests, and instructions. The base form of the verb without
  a subject.
dialectal_variation:
- note: 'In some dialects, ''you'' is added for emphasis: ''You sit down right now!'''
discourse_notes:
- note: 'Imperatives create direct instructions: ''Turn left at the traffic lights.'''
- note: In academic writing, imperatives are rare. Use passive or indirect forms instead.
- note: 'GB 2nd ed. (Ch.12) identifies three grammatical negative imperative forms:
    (1) ''Don''t you run!'' (contracted, subject present), (2) ''Don''t run!'' (contracted,
    subject absent), (3) ''Do not run!'' (uncontracted, subject absent). Ungrammatical:
    *''Do not you run!'' — subject + uncontracted do not is impossible.'
  source: Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle &
    Heinle. Ch. 12
