sub_rules:
- examples:
  - Please sit down.
  - Please don't make noise.
  rule: Polite imperatives with 'please'
  type: pragmatic
- examples:
  - Let's go.
  - Let's have a break.
  rule: Let's for suggestions including the speaker
  type: pragmatic
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: Great for kids. For adults, use workplace instructions.
    duration: 10
    name: Simon Says
  - adaptation_notes: Students write or follow a simple recipe using imperatives.
    duration: 15
    name: Recipe Instructions
  tips:
  - 'Parrott (2000) Ch. 12: Imperatives use base verb form without subject. Used for
    commands, instructions, invitations, advice. Negative with do not/don''t. Emphatic
    with do. Let''s for first person plural suggestions. Polite imperatives with please
    at start or end.'
  - 'Start with classroom instructions: ''Open your book. Sit down. Listen.'' These
    is always the addressee (you). The negative imperative uses ''don''t'' uniformly:
    Don''t be late (be) vs Don''t go (lexical verb). ''Let''s'' imperatives are a
    distinct type with inclusive meaning (Let''s go = you and I).'
  - Use physical actions (TPR) for teaching imperatives to beginners
  - Contrast with 'please' for politeness
  - Use real classroom instructions as practice
  - 'Swan PEU: ''Let''s'' vs ''let''s not'' -- ''Let''s go'' (affirmative). ''Let''s
    not go'' (negative). NOT ''Don''t let''s go''.'
  - 'Swan PEU: ''Do'' for emphasis/warmth -- ''Do sit down'' (welcoming). ''Do be
    careful'' (sincere warning).'
  - 'Swan PEU: Softening imperatives -- ''Please close the door''. ''Could you close
    the door?'' (more polite). ''Close the door!'' (direct/rude).'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 10: CGEL (Ch.10)
    identifies THREE imperative types: (1) 2nd person (''Sit down'' — you is understood),
    (2) 1st person plural (''Let''s sit down'' — ''let''s'' is an imperative with
    overt subject), (3) 3rd person (''Somebody open the door'' — with explicit subject).
    CGEL notes that imperatives lack tense morphology — they are not ''present tense''
    but tenseless.'
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle.
    Ch. 12: GB 2nd ed. (Ch.12) provides syntactic evidence that imperatives have an
    underlying ''you'' subject: reflexive pronoun agreement shows only 2nd person
    is possible. ''Watch yourself!'' (correct — 2nd person reflexive). *''Watch myself!''
    / *''Watch himself!'' (incorrect — proves 1st/3rd person NOT the subject). Imperatives
    are TENSELESS: ''You be quiet!'' not *''You are quiet!'' — if imperatives had
    present tense, subject-verb agreement would produce ''are''.'
title: Imperatives
use:
- context: Classroom instructions
  description: Teachers use imperatives to give instructions
  examples:
  - Open your books.
  - Listen to the audio.
  - Work in pairs.
- context: Recipes and cooking
  description: Step-by-step instructions
  examples:
  - Mix the ingredients.
  - Bake for 30 minutes.
  - Add salt to taste.
- context: Directions
  description: Giving or asking for directions
  examples:
  - Turn left at the traffic lights.
  - Go straight ahead.
  - Take the second exit.
- context: Rules and warnings
  description: Prohibitions and safety instructions
  examples:
  - Don't smoke.
  - Keep off the grass.
  - Watch your step.
