common_errors:
- correction: So I'm waiting for the bus and a woman comes up to me and she asks me...
  error: 'Using only past tense throughout a spoken anecdote: *''So I waited for the
    bus and a woman came up to me and she asked me...'''
  explanation: In spoken English, the historical present is the default for vivid
    storytelling. Using only past tense throughout a spoken anecdote sounds flat and
    unnatural. The historical present brings the story to life.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: D
- correction: She arrived at the hotel. She had booked it weeks earlier.
  error: 'Using past simple instead of past perfect for flashbacks: *''She arrived
    at the hotel. She booked it weeks earlier.'''
  explanation: When going back to an earlier event in a narrative, past perfect is
    required to show that the event happened before the main past timeline. Using
    past simple for both events makes it unclear which happened first.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: She left the village. She would never return.
  error: 'Using ''will'' instead of ''would'' for flash-forwards: *''She left the
    village. She will never return.'''
  explanation: In a past-tense narrative, flash-forwards use 'would' (future-in-the-past),
    not 'will'. 'Will' breaks the past narrative frame and sounds like the narrator
    has jumped to the present.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: Understanding and using tense shifts in storytelling, including the historical
  present, flashbacks, and flash-forwards.
dialectal_variation:
- note: The historical present is more common in British English spoken narratives.
    American English uses it as well but may use past tense more frequently in some
    contexts.
discourse_notes:
- note: Tense shifts are a defining feature of English narrative style. They are essential
    for vivid storytelling, film summaries, and literary fiction.
- 'GB3 Ch.9: Tense serves discourse functions beyond time reference — historical present
  (vividness), backgrounding (past for supporting info), frame-elaboration (past perfect
  to simple past), interactive present perfect (topic-opening). Source: Celce-Murcia
  & Larsen-Freeman (1999) GB3 Ch.9: Tense-Aspect-Modality in Discourse.'
example_generator:
  contexts:
  - storytelling
  - novel writing
  - anecdotes
  - news reports
  - film summaries
  cultural_notes:
  - The historical present is extremely common in spoken English anecdotes, especially
    in British English. Comedians and storytellers use it extensively.
  min_examples: 5
form:
  affirmative:
    example_generator:
      contexts:
      - oral storytelling
      - written narrative
      - film summaries
      min_examples: 4
    structure: Past simple -> Present simple (historical present) / Past simple ->
      Past perfect (flashback) / Past simple -> Future-in-the-past (flash-forward)
  negative:
    example_generator:
      contexts:
      - negative events in stories
      - denying past actions
      min_examples: 3
    structure: 'Negative forms follow the tense being used: didn''t (past), don''t/doesn''t
      (present), hadn''t (past perfect)'
  questions:
    example_generator:
      contexts:
      - dialogue within stories
      - narrative questions
      min_examples: 3
    structure: 'Questions within narratives follow the tense of the section: ''What
      did he do?'' (past) / ''What does he do?'' (historical present)'
grammar_point: tense_shifts_narrative
level: B2
meaning:
  ccqs:
  - answer: No -- the tense shifts to show different time frames or create effect.
    purpose: Tests whether the learner understands that narratives in English commonly
      shift tenses for stylistic and structural purposes, rather than maintaining
      one tense throughout.
    question: Is the whole story in the same tense?
  - answer: To make the story more vivid and dramatic -- it's called the historical
      present.
    purpose: Tests whether the learner knows the term and function of the historical
      present -- the most common and accessible narrative tense shift in English.
    question: Why does the narrator switch to present tense in a past story?
  - answer: Past perfect -- to show it happened before the main past events.
    purpose: Tests whether the learner knows that past perfect is used for flashbacks
      in narrative, which is the standard way to signal a shift to an earlier time
      frame in storytelling.
    question: When we go back to an earlier event in a story, which tense do we use?
  - answer: '''He said he was tired.'' In reported speech, tenses shift back: present
      → past.'
    purpose: Tests whether the learner applies tense backshift in reported speech
      (Swan PEU 2016, entries 54-55).
    question: Which is correct in reported speech? *'He said he is tired' or 'He said
      he was tired'?
  contrast: 'Compare with consistent past tense narration: ''He walked in and sat
    down'' vs. shifted: ''He walks in and sits down'' (historical present for vividness).'
  core_meaning: Narrative tense shifts involve changing between past, present, and
    future tenses within a story to create dramatic effect, indicate time changes,
    or bring events to life. The most common shifts are from past to present (historical
    present) and from past to past perfect (flashback).
  timeline: Tense shifts move the listener/reader between different time frames within
    the narrative.
phonetics:
- example_generator:
    contexts:
    - storytelling practice
    - dramatic reading
  l1_issue: Speakers of languages with strict tense consistency rules (e.g., Japanese)
    may find tense shifting unnatural and may overuse one tense throughout narratives.
  note: The historical present often carries heightened intonation and faster pace,
    mimicking the excitement of live action.
register_notes:
- note: 'The historical present (or narrative present) is the dominant tense for vivid
    spoken anecdotes and storytelling: ''So I''m walking down the street and this
    guy comes up to me...'' It is standard in film and book summaries (''In The Godfather,
    Michael Corleone starts as an outsider but gradually becomes the family''s most
    ruthless member''), sports commentary (''She shoots and scores!''), and joke-telling.
    However, formal written narratives -- academic histories, legal depositions, and
    formal reports -- tend to maintain past tense consistently and avoid the historical
    present. Flashback (past perfect) and flash-forward (''would''-clauses) shifts
    are features of literary fiction and planned written narrative rather than spontaneous
    speech: ''She left the village. She would never return.'' Teachers should note
    that British English uses the historical present more freely in conversation than
    American English, and that learners whose L1 maintains strict tense consistency
    (e.g., Japanese, Turkish) may need explicit instruction and extensive listening
    practice to internalize this pattern.'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Tense shifts in narrative: fiction uses more tense
    variation (historical present, flashback); academic prose maintains consistent
    tense. Register determines acceptable tense shifting. Ch. 6.2.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.2.2
