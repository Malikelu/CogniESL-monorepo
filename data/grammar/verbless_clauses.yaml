description: 'Clauses without a verb, often with an adjective or prepositional phrase: Though tired, he continued. / When
  in Rome, do as the Romans do.'
dialectal_variation: []
discourse_notes:
- note: Verbless clauses (When a child, I...) are reduced adverbial structures that condense information, common in literary
    and journalistic writing. a marker of proficient writing.
- note: In conversation, defining relative clauses are more common than non-defining.
- note: In formal writing, 'whom' is used for object relative clauses.
