grammar_point: verbless_clauses
level: C1
meaning:
  ccqs:
  - answer: No, it is a verbless clause.
    purpose: Tests whether the learner understands a key concept of verbless_clauses. This is fundamental for correct use
      of this grammar point.
    question: Does this clause have a finite verb?
  - answer: Yes, that is how verbless clauses are formed.
    purpose: Tests whether the learner understands a key concept of verbless_clauses. This is fundamental for correct use
      of this grammar point.
    question: Can you add a subject and verb to make it a full clause?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with verbless clauses and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''When a child, I loved sweets.'' Verbless clauses omit the subject and ''be'': ''When a child'' = ''When I was
      a child''.'
    purpose: Tests whether the learner understands verbless clauses (Swan PEU 2016, entry 108.5).
    question: Which is correct? *'When I was a child, I loved sweets' or 'When a child, I loved sweets'?
  contrast: Full clause = Although he was tired, he continued. vs Verbless = Though tired, he continued.
  core_meaning: Verbless clauses are subordinate clauses that do not contain a finite verb. They typically consist of a conjunction
    followed by an adjective, noun phrase, or prepositional phrase. They are more concise than full clauses.
  example_generator:
    contexts:
    - formal writing
    - literary English
    - concise expression
    - academic prose
    cultural_notes:
    - Very formal — primarily a written form
    - Common in academic and literary English
    min_examples: 5
  timeline: Timeless — can be used with any tense.
phonetics:
- example_generator:
    contexts:
