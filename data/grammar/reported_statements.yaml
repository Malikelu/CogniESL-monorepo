citations:
- claim: 'Core meaning: Reports what someone said in the past by paraphrasing their words, with grammatical adjustments to
    fit the new context.'
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 33: Reported Speech and Writing'
  tier: 4
- claim: 'Common error ''Not backshifting tenses: *''He said he is happy.'''' for Portuguese, Spanish, Chinese speakers'
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  tier: 1
common_errors:
- correction: He said he was happy.
  error: 'Not backshifting tenses: *''He said he is happy.'''
  explanation: When the reporting verb is in the past tense, the verb in the reported clause must shift back. Present simple
    becomes past simple. This is the most common reported speech error at B1 level.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Reported speech'
- correction: He said that he was leaving. / He told me that he was leaving.
  error: 'Using ''tell'' without an object: *''He told that he was leaving.'''
  explanation: '''Tell'' requires a direct object (tell someone something). ''Say'' does not take a direct object before the
    that-clause. Learners often confuse these two reporting verbs.'
  l1_groups:
  - Portuguese
  - Spanish
  - Japanese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Say vs tell'
- correction: He said he was tired.
  error: 'Keeping original pronouns: *''He said I am tired.'''
  explanation: Pronouns must change to reflect the new speaker's perspective. 'I' becomes 'he/she', 'my' becomes 'his/her',
    etc. This is a backshift requirement alongside tense changes.
  l1_groups:
  - Portuguese
  - Spanish
  - Korean
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Reported speech'
description: A structure to paraphrase what someone said in the past, without using their exact words, with tense and pronoun
  changes (backshifting).
dialectal_variation: []
discourse_notes:
- note: In conversation, reported statements are used to retell what someone said, often with backshifted tenses. Native speakers
    frequently omit 'that' in informal speech.
- note: In academic writing, reported statements allow writers to paraphrase sources and integrate evidence. The conjunction
    'that' is more commonly retained in formal prose.
- note: In news reporting, reported statements convey what sources said. Direct quotes are used for impact, while reported
    speech summarizes.
example_generator:
  contexts:
  - everyday situations
  cultural_notes: []
  min_examples: 5
form:
  affirmative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: "Reporting verb (say/tell) + that + backshifted clause (tense changes apply)\nPronouns and time/place expressions\
      \ change to match the reporter's context\nTense backshift rules:\n  Present simple → Past simple\n  Present continuous\
      \ → Past continuous\n  Past simple → Past perfect\n  Present perfect → Past perfect\n  Will → Would\n  Can → Could\n\
      \  May → Might\nTime/place expression changes:\n  Now → Then, Today → That day, Yesterday → The day before, Tomorrow\
      \ → The next day, Here → There\n"
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Reporting verb + that + negative backshifted clause
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Reported statements do not have a questions section — questions are handled by reported questions (if/whether).
      For reported statements, the formation uses 'that' + backshifted clause.
grammar_point: reported_statements
level: B1
meaning:
  ccqs:
  - answer: Yes. Tenses shift back when the reporting verb is past.
    purpose: Tests whether the learner understands the backshift rule — the most fundamental concept in reported speech —
      where tenses move one step back into the past when the reporting verb is past tense.
    question: Do tenses change in reported speech
  - answer: No — reported statements paraphrase someone's words with backshifted tense, not direct speech with quotation marks.
    purpose: Tests whether the learner can distinguish reported statements (paraphrased, backshifted, no quotes) from direct
      speech (exact words in quotes). This is a common confusion at B1 level.
    question: Can we use direct speech (with quotation marks) to report someone's words, or must we use reported statements?
  - answer: In direct speech, we use the speaker's exact words with quotation marks ('I am tired'). In reported statements,
      we paraphrase with backshifted tense (He said he was tired).
    purpose: Tests whether the learner can explain the structural differences between direct speech and reported statements,
      including punctuation, tense, and pronoun changes.
    question: What is the difference in form between 'I am tired' (as direct speech) and He said he was tired (as reported
      speech)?
  - answer: Traditionally, yes — the rule says to always backshift when the reporting verb is past. However, in modern English,
      if the reported situation is still true at the time of reporting, backshift is optional. Both 'She said she was a doctor'
      and 'She said she is a doctor' are acceptable if she is still a doctor. In formal writing and exams, backshift is still
      preferred.
    purpose: Tests whether the learner understands that tense backshift in reported speech has an important exception for
      situations that remain true at the time of reporting. While the traditional grammar rule demands obligatory backshift,
      modern usage acknowledges that retaining the original tense is acceptable when the information is still current, and
      this distinction helps learners make appropriate choices in different contexts.
    question: Do we always need to backshift tenses when the reporting verb is past? What if the situation is still true?
  contrast: 'Direct speech: ''I am happy'' (exact words, quotes) Reported speech: He said he was happy (paraphrased, no quotes,
    backshifted) No backshift rule: If the reported statement is still true and the reporting verb is present tense: ''He
    says he likes coffee'' (no backshift) '
  core_meaning: Reports what someone said in the past by paraphrasing their words, with grammatical adjustments to fit the
    new context (reporter's time and perspective).
  timeline: All reporting verbs are in past tense (said, told, explained); the reported clause is backshifted to a past tense
    relative to the reporting verb.
phonetics:
- example_generator:
    contexts:
    - reported speech pronunciation
  l1_issue: Many L1 speakers over-pronounce 'that' in reported speech. Teach the weak form /ðət/.
  note: 'That is usually weak in reported speech: /ðət/. ''He said that he was tired'' → /hiː sed ðət hiː wəz taɪəd/.'
register_notes: []
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - '''I am happy.'' → He said he was happy'
  - '''I went to Paris.'' → She said she had gone to Paris'
  - '''I will come.'' → He said he would come'
  - '''I can swim.'' → She said she could swim'
  rule: 'Tense backshift: present → past, past → past perfect, will → would, can → could'
  type: grammatical
- examples:
  - '''I like my job.'' → He said he liked his job'
  - '''We finished our work.'' → They said they had finished their work'
  rule: 'Pronoun changes: I → he/she, my → his/her, we → they, our → their'
  type: grammatical
- examples:
  - '''I am leaving today.'' → He said he was leaving that day'
  - '''I came yesterday.'' → She said she had come the day before'
  rule: 'Time expression changes: today → that day, yesterday → the day before, tomorrow → the next day'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Give students direct speech sentences. They convert to reported speech with correct tense backshift:
      ''I am happy'' → ''He said he was happy.'''
    duration: 15
    name: Tense Shift Practice
  - adaptation_notes: 'Students practice changing pronouns in reported speech: ''I like my job'' → ''He said he liked his
      job.'''
    duration: 10
    name: Pronoun Changes
  tips:
  - 'GB3 Ch. 33: Three exceptions to backshifting rule: (1) state/event remains true at time of reporting (“He said government
    policy is not to sell arms”), (2) perceived general truths (“He said the earth moves around the sun”), (3) immediate reports.
    Backshift is optional when the reported information still holds. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd
    ed. Ch. 33 33.1.'
  - Start with simple present → past backshift, then add more complex tenses.
  - Use a timeline to show tense backshift visually.
  - Practice with 'say' vs 'tell' immediately to avoid confusion.
  - 'Swan PEU: Backshift of tenses — ''She said she was tired'' (was = backshifted from ''am''). Pronouns and time words also
    shift: ''I am happy now'' → ''He said he was happy then.'''
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 11: CGEL (Ch.11) notes that tense backshift in reported
    speech is NOT automatic — it depends on whether the reported situation still holds. ''She said she WAS tired'' (then,
    and maybe still now) vs ''She said she IS tired'' (still true now). CGEL analyzes this as a choice between past (distancing/backshifted)
    and present (current relevance) in the content clause.'
title: Reported Statements (Indirect Speech)
use:
- description: Summarize what someone said in a past conversation.
  examples:
  - She told me she was moving to London next month.
  - He said he had finished the project.
  key_point: Most common everyday use.
  name: Conversation Reporting
- description: Report statements from public figures or sources.
  examples:
  - The prime minister said that the economy was growing.
  - The report stated that temperatures would rise.
  key_point: 'Uses formal reporting verbs: state, announce, explain, claim.'
  name: News and Media
- description: Cite sources or report findings without direct quotes.
  examples:
  - Smith (2020) argued that climate change was accelerating.
  key_point: Avoids overusing direct quotes.
  name: Academic Writing
