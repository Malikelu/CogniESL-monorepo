- note: 'Biber et al. (2021) — ''Will/would'' for habitual aspect: conversation uses ''would'' for past habits again; academic
    prose uses present tense for generic statement. Register determines habitual expression choice. Ch. 6.2.2'
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.2
  reliability: C
