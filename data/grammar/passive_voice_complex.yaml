common_errors:
- correction: He is said to be the richest man.
  error: '*He is said that he is the richest man.*'
  explanation: 'Passive reporting verbs take ''to + infinitive'', not ''that + clause''. Use either active: ''People say that
    he is rich'' or passive: ''He is said to be rich'', but not a hybrid of both patterns.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: The building is expected to be completed soon.
  error: '*The building is expected that it will be completed soon.*'
  explanation: 'Double subject in passive reporting: ''the building'' is already the subject. Adding ''it'' creates a redundancy.
    The structure is ''subject + be + past participle + to-infinitive''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: D
- correction: The report is expected to be published soon.
  error: '*The report is expected to will be published soon.*'
  explanation: After 'to' infinitive, use the base form only -- never add 'will'. The passive infinitive 'to be published'
    already carries future meaning from 'is expected'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: She made him apologize for what he did.
  error: '*She made him to apologize for what he did.*'
  explanation: Causative 'make' takes the bare infinitive (without 'to'). Adding 'to' after 'make + person' is a very common
    error caused by other causative verbs that do take 'to' (ask, tell, want him to).
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
- correction: He is said to be rich.
  error: 'Using ''that'' instead of to-infinitive in passive reporting: *''He is said that he is rich.'''
  explanation: 'Swan PEU: Passive reporting verbs take to-infinitive, not that-clause.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Advanced passive structures including reporting verbs in the passive, double passives, passive with infinitives,
  and passive with modal verbs for formal and academic expression.
dialectal_variation: []
discourse_notes:
- note: In academic writing, passive voice is standard in methodology and results sections.
- note: In news reports, passive voice is used when the agent is unknown or irrelevant.
- note: In conversation, passive voice is less common; active voice is preferred.
form:
  affirmative:
    example_generator:
      contexts:
      - reporting verbs
      - double passives
      - formal announcements
      min_examples: 4
    structure: 'Reporting verb passive: Subject + be + said/believed/thought/known/reported/expected/considered + to-infinitive
      — ''She is known to be an expert.'' / With perfect infinitive (past meaning): Subject + be + said/believed + to have
      + past participle — ''He is said to have left the country.'' / Double passive: Subject + be + expected/required/ordered
      + to be + past participle — ''The work is expected to be finished by Monday.'''
  negative:
    example_generator:
      contexts:
      - negative reporting
      - denial
      - absence of expectation
      min_examples: 3
    structure: Subject + be + not + said/believed/known + to-infinitive — 'He is not known to have any criminal record.' /
      'She is not believed to be in danger.' / 'The project is not expected to be completed on time.'
  questions:
    example_generator:
      contexts:
      - checking rumours
      - confirming expectations
      - verifying reports
      min_examples: 3
    structure: Is/Are + subject + said/believed/known + to-infinitive? — 'Is he said to be the richest man?' / 'Are the results
      expected to be positive?' / 'Was she believed to have escaped?'
grammar_point: passive_voice_complex
level: B2
meaning:
  ccqs:
  - answer: We don't know exactly — it is a general belief or rumour. The passive reporting structure allows us to report
      what people say without naming the source.
    purpose: Tests whether the learner understands passive reporting structures (is said to, is believed to) and how they
      differ from active reporting (people say that).
    question: In 'He is said to be rich,' who says this?
  - answer: '"To be rich" means he is rich now. "To have been rich" means he was rich in the past (but may not be now).'
    purpose: Tests whether the learner understands how cleft sentences (it-clefts and wh-clefts) are used to emphasize specific
      information. The structure changes the focus of the sentence.
    question: Can you explain the difference between 'He is said to be rich' and 'He is said to have been rich' by giving
      an example of when to use each?
  - answer: Two. 'Is expected' (passive) + 'to be completed' (passive infinitive). This is called a double passive.
    purpose: Tests whether the learner can distinguish between existential 'there' (indicating existence) and dummy 'it' (used
      for weather, time, distance). Confusing these is a very common beginner error.
    question: In 'The building is expected to be completed by June,' how many passive structures are there?
  - answer: To create distance and objectivity. It allows them to report claims without confirming them as facts and without
      naming (or having to name) the source.
    purpose: Tests whether the learner can identify whether a sentence is active or passive. Understanding voice is essential
      for choosing the correct verb form and word order.
    question: Why do journalists use passive reporting instead of active?
  contrast: 'Active reporting: "People say that he is the richest man."

    Passive reporting: "He is said to be the richest man."

    Active reporting: "Experts believe that the economy will improve."

    Passive reporting: "The economy is believed to be improving."

    Simple passive: "The report was completed."

    Double passive: "The report is expected to be completed by Friday."

    '
  core_meaning: Complex passive structures go beyond the basic 'be + past participle' to include passive reporting verbs (is
    said to, is believed to), double passives (is expected to be completed), and passives with infinitives and modals. These
    structures are used in formal writing, academic discourse, and news reporting to create distance, objectivity, and conciseness.
  example_generator:
    contexts:
    - news reporting
    - academic writing
    - formal statements
    - rumours and speculation
    - official announcements
    cultural_notes:
    - Passive reporting structures are extremely common in quality journalism (BBC, The Guardian, The New York Times). They
      allow writers to attribute claims without endorsing them. This is a key skill for critical reading.
    - 'In academic writing, passive reporting is used to summarise research findings objectively: ''The results are thought
      to indicate...'' / ''The method is considered to be reliable.'''
    min_examples: 5
  timeline: 'Present reporting passive: is/are + said/believed/thought + to-infinitive — ''He is said to be the richest man
    in the world.'' / Past reporting passive: was/were + said/believed + to have + past participle — ''She was believed to
    have escaped.'' / Future passive: is/are + expected/likely + to-infinitive — ''The results are expected to be announced
    tomorrow.'''
phonetics:
- example_generator:
    contexts:
    - stress patterns
    - information focus
  l1_issue: Learners may stress the reporting verb equally, losing the natural focus on the new information. Practice with
    contrastive stress drills.
  note: 'In passive reporting structures, the reporting verb (said, believed, known) is usually unstressed, and the main information
    (the to-infinitive clause) carries the primary stress: ''He is said to be RICH.'' /hi ɪz sed tu bi rɪtʃ/.'
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may pronounce 'to' as /tuː/ and 'have' as /hæv/ in all contexts. Drill the reduced forms for natural-sounding
    speech.
  note: 'The word ''to'' in the to-infinitive is reduced to /tə/ in connected speech: ''He is said to be'' /hi ɪz sed tə bi/.
    The ''have'' in perfect infinitives is reduced to /əv/ or /ə/: ''She is said to have left'' /ʃi ɪz sed tə əv left/.'
register_notes:
- note: In formal writing, passive voice is used to depersonalize and focus on the process.
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, passive voice is less common; active voice is preferred.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Complex passive combinations (modal + passive, perfect + passive, progressive + passive): register
    distribution varies. Modal passives (should be done) span registers; perfect progressive passives are rare across all
    registers. Ch. 6.5'
