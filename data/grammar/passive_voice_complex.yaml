sub_rules:
- examples:
  - He is said to be a genius. (People say he is a genius.)
  - She is believed to live abroad. (People believe she lives abroad.)
  - They are thought to have fled the country. (People think they fled.)
  - The company is expected to announce record profits. (People expect this.)
  rule: Reporting verbs in the passive — say, believe, think, know, report, expect, consider, understand, allege, claim
  type: grammatical
- examples:
  - He is said to have resigned. (People say he resigned.)
  - She is believed to have been a spy. (People believe she was a spy.)
  - The painting is thought to have been destroyed. (People think it was destroyed.)
  rule: Perfect infinitive (to have + past participle) — for past events
  type: grammatical
- examples:
  - The building is expected to be completed by 2025.
  - The law is due to be passed next month.
  - The prisoners were ordered to be released.
  - The car is supposed to be repaired by Friday.
  rule: Double passive — passive verb + passive infinitive
  type: grammatical
- examples:
  - He got promoted last week. (He was promoted.)
  - She got fired for being late. (She was fired.)
  - They got invited to the wedding. (They were invited.)
  rule: Passive with 'get' — informal alternative
  type: grammatical
- examples:
  - The work must be completed by Friday.
  - This information should not be shared.
  - The problem can be solved easily.
  - The meeting might be postponed.
  rule: Passive with modals — modal + be + past participle
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: 'Give students 10 active reporting sentences. They transform each to passive reporting: ''People say
      that she is an expert.'' → ''She is said to be an expert.'' Include past events: ''People believe he stole the money.''
      → ''He is believed to have stolen the money.'''
    duration: 20
    name: Active to passive reporting transformation
  - adaptation_notes: 'Provide a short news article (200-250 words). Students underline all passive reporting structures and
      identify: (a) the reporting verb, (b) whether it refers to present or past, (c) what the active equivalent would be.'
    duration: 15
    name: News analysis
  - adaptation_notes: 'Students complete sentences using double passives: ''The new bridge is expected...'' → ''The new bridge
      is expected to be completed by 2026.'' Provide 8 sentence stems.'
    duration: 15
    name: Double passive practice
  - adaptation_notes: 'Students work in pairs. Student A makes a rumour about a famous person. Student B reports it using
      passive reporting: ''I heard that Brad Pitt is moving to London.'' → ''Brad Pitt is said to be moving to London.'' Rotate
      roles.'
    duration: 20
    name: Rumour mill
  tips:
  - 'Start with active reporting: ''People say that he is rich.'' Then show the transformation: ''He is said to be rich.''
    Use a step-by-step process: (1) Move the subject forward, (2) Make the reporting verb passive, (3) Change the that-clause
    to a to-infinitive.'
  - 'Create a reference chart of reporting verbs: say, believe, think, know, report, expect, consider, understand, allege,
    claim. Show which are most common in news vs. academic writing.'
  - Use real news headlines for analysis. Have students identify passive reporting structures and rewrite them in active voice
    to understand the transformation.
  - 'Teach the perfect infinitive (to have + past participle) for past events with a timeline: ''He is said to be rich'' (now)
    vs. ''He is said to have been rich'' (past).'
  - 'Practice double passives with workplace scenarios: ''The report is expected to be finished by...'' / ''The building is
    scheduled to be completed by...'''
  - 'Swan PEU: The passive reporting transformation -- Active: ''People say he is rich.'' -> Passive: ''He is said to be rich.''
    Three steps: move subject forward, make reporting verb passive, change that-clause to to-infinitive.'
  - 'Swan PEU: ''Is said to have + past participle'' for past events. ''He is said to have left the country.'''
  - 'Swan PEU: Double passive with ''expected'', ''required'', ''ordered''. ''The work is expected to be finished by Friday.'''
title: Complex Passive Voice (is said to / was believed to / is expected to)
use:
- context: News and journalism
  description: Passive reporting is a cornerstone of news writing, allowing journalists to report claims objectively.
  examples:
  - The president is said to be considering resignation.
  - Three people are believed to have been killed in the explosion.
  - The suspect is known to have connections to organised crime.
- context: Academic writing
  description: Used to summarise research findings and attribute claims to sources without direct quotation.
  examples:
  - The results are thought to support the hypothesis.
  - This method is considered to be the most reliable.
  - The data are expected to reveal significant patterns.
- context: Official and legal language
  description: Formal documents use complex passives for precision and objectivity.
  examples:
  - The defendant is alleged to have committed the crime in 2019.
  - The building is required to be inspected annually.
  - Applicants are expected to be informed of the decision within 28 days.
- context: Everyday speculation and rumour
  description: Used informally to report rumours or general beliefs.
  examples:
  - She is supposed to be the best doctor in the town.
  - He is meant to be very rich.
  - They are rumoured to be getting divorced.
