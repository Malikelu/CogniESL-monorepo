- note: Indefinite pronouns are neutral in register.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, singular indefinite pronouns take singular verbs: ''Everyone
    has...'''
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, 'somebody' and 'someone' are interchangeable.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Indefinite pronouns (''someone'', ''anyone'', ''nobody''):
    conversation uses more indefinite pronouns for vague reference; academic prose
    uses more specific reference. Ch. 4.1.2'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 4.1.2
