- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents how transfer effects are non-linear,
    determined by functional fit between L1 and L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects are non-linear — determined by functional
    fit between L1 and L2 systems rather than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 2
- claim: Swan & Smith (2001) provide the definitive cross-linguistic reference for L1-specific error patterns in English.
    Their learner English framework documents how each L1 group produces characteristic errors in this grammatical domain,
    enabling teachers to anticipate and address transfer errors before they fossilize.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference and Other Problems, 2nd ed. Cambridge
    University Press.'
  tier: 2
common_errors:
- correction: In spite of the rain, we went out.
  error: '*In spite the rain, we went out.*'
  explanation: 'Expanded prepositions are fixed: in spite of.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: Swan Entry 214. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- error: Finnish L1 omits prepositions due to case inflection transfer (covert transfer) (Odlin Ch.3)
  explanation: 'Odlin (Ch.3): Jarvis & Odlin (2000). Finnish uses case inflections (15 cases), not prepositions. "nurmikolle"
    = stem + allative -lle = "on(to) the grass". Example: "go to sit the grass" (missing "on"). COVERT transfer: ABSENCE reflects
    L1 influence. Occurred ONLY among Finnish learners.'
  l1_groups:
  - Finnish
  reliability: C
  source: Odlin, T. Explorations of Language Transfer, Ch. 3; Jarvis & Odlin (2000)
