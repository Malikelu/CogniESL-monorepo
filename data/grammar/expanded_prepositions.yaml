level: C1
meaning:
  ccqs:
  - answer: Yes, the words together act as one prepositional unit.
    purpose: Tests whether the learner understands that expanded prepositions (in spite of, with regard to, in front of) function
      as single prepositional units despite containing multiple words. They cannot be broken apart or translated word-by-word.
    question: Does this expression function as a single preposition?
  - answer: No, the expression is fixed.
    purpose: Tests whether the learner understands that expanded prepositions are fixed expressions. 'In spite of' cannot
      be changed to 'in despite of' or 'in the spite of.' Each expanded preposition must be learned as an immutable chunk.
    question: Can you change any of the words in the middle without changing the meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with expanded prepositions and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I am interested in learning English.'' After ''interested'', the fixed preposition is ''in'', not ''for''.'
    purpose: Tests whether the learner knows fixed adjective + preposition combinations (Swan PEU 2016, entries 83-85).
    question: Which is correct? *'I am interested for learning English' or 'I am interested in learning English'?
  contrast: Simple = on the table vs Expanded = in front of the television vs In spite of the rain, we went for a walk.
  core_meaning: Fixed multi-word units that function as single prepositions with idiomatic meanings that cannot be deduced
    from the individual words.
  example_generator:
    contexts:
    - formal writing
    - academic essays
    - business correspondence
    - legal documents
    cultural_notes:
    - More common in formal British English than casual American English
    - Avoid overusing in spoken conversation
    min_examples: 5
  timeline: Timeless — used across all tenses.
phonetics:
- example_generator:
    contexts:
    - formal speech
  l1_issue: Speakers of syllable-timed languages may give equal stress to all words in the expression
  note: Stress typically falls on the content word within the expanded preposition
register_notes:
- note: Biber et al. (2021) — Complex/expanded prepositions (in terms of, with respect to, in the case of) are overwhelmingly
    more common in academic prose. Conversation uses simple prepositions. The simple/complex preposition ratio is a strong
    register discriminator. Ch. 2.4.5, 5.3.3
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 2.4.5
