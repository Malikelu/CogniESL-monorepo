description: Alternative structures to talk about future events, including present continuous for fixed arrangements, future
  perfect for completed actions by a future time, and future continuous for ongoing future actions.
dialectal_variation: []
discourse_notes:
- note: In conversation, this structure is used for everyday communication and is among the most frequent patterns in spoken
    English.
- note: In academic writing, this structure appears in discussions of established knowledge, methodology, and findings.
- note: In news reports, this structure is used for reporting events and attributing statements.
form:
  affirmative:
    example_generator:
      contexts:
      - work and professional life
      - social interactions
      min_examples: 4
    structure: 'Present continuous (fixed arrangements): Subject + am/is/are + verb-ing (with future time marker)

      Future perfect: Subject + will + have + past participle

      Future continuous: Subject + will + be + verb-ing

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Present continuous: Subject + am/is/are + not + verb-ing

      Future perfect: Subject + will + not + have + past participle

      Future continuous: Subject + will + not + be + verb-ing

      '
  questions:
    example_generator:
      contexts:
      - health and wellbeing
      min_examples: 4
    structure: 'Present continuous: Am/Is/Are + subject + verb-ing?

      Future perfect: Will + subject + have + past participle?

      Future continuous: Will + subject + be + verb-ing?

      '
grammar_point: other_expressions
level: B1
meaning:
  ccqs:
  - answer: Common fixed expressions and idiomatic phrases.
    purpose: Tests whether the learner understands that many English expressions are fixed and cannot be translated literally
      or modified freely.
    question: What type of expressions are covered here
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that other expressions is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with other expressions and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Present continuous for future arrangements -- 'We are meeting next Tuesday.' This structure is used for fixed
      plans made with other people, not just personal intentions.
    purpose: Tests whether the learner can distinguish between present continuous (fixed arrangements with others), be going
      to (personal plans), and will (spontaneous decisions or predictions) when talking about future events. Choosing the
      correct future expression depends on whether the plan is fixed and arranged with others.
    question: Which future structure would you use to say that two people have already arranged and confirmed a meeting for
      next Tuesday?
  contrast: 'Present continuous (future) = Fixed arrangement with others: "I''m meeting John at 5" (arranged)

    Be going to = Personal plan: "I''m going to meet John next week" (personal plan, not fixed yet)

    Future perfect = Completed by X time: "I''ll have eaten by 7 PM"

    Future continuous = In progress at X time: "I''ll be eating at 7 PM"

    '
  core_meaning: 'Different future structures emphasize different aspects: fixed arrangements (present continuous), completed
    actions by a future time (future perfect), or ongoing actions at a future time (future continuous).'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present continuous: Future time with fixed plan (arranged with others)

    Future perfect: Action completed before a specific future time

    Future continuous: Action in progress at a specific future time

    '
phonetics:
- example_generator:
    contexts:
    - fixed expression chunks
  l1_issue: Learners may pronounce each word separately, sounding stilted. Teach fixed expressions as single units.
  note: 'Fixed expressions are often pronounced as chunks: ''by the way'' → /baɪ ðə weɪ/, ''as a matter of fact'' → /əz ə
    ˈmætər əv fækt/.'
register_notes:
- note: 'Biber et al. (2021) — General expression patterns: conversation uses more formulaic sequences and fixed expressions;
    academic prose uses more lexical bundles. Register determines formulaic language type. Ch. 13.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 13.2
