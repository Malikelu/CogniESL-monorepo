common_errors:
- correction: I enjoy reading.
  error: '*I enjoy to read.*'
  explanation: '''Enjoy'' must be followed by a gerund (-ing), not an infinitive. This is a common error because many verbs
    in other languages use infinitive after ''enjoy''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Gerunds and infinitives'
- correction: The movie was boring.
  error: '*The movie was bored.*'
  explanation: Use '-ing' form to describe what something does (The movie bores viewers → boring). Use '-ed' form to describe
    how someone feels (I was bored).
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  - Korean
  reliability: D
description: The -ing form of a verb used as a noun (gerund) or in continuous tenses (participle). After prepositions, certain
  verbs, and as the subject of a sentence.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - sports
      - hobbies
      - daily activities
      min_examples: 4
    structure: 'Gerund (noun): Verb + -ing as subject or object

      "Swimming is healthy." / "I enjoy swimming."

      Participle (continuous): be + verb + -ing

      "I am swimming." / "She was reading."

      '
  negative:
    example_generator:
      contexts:
      - prohibitions
      - negative statements
      min_examples: 4
    structure: 'Gerund: "not + verb + -ing" or "No + verb + -ing"

      "Not swimming is boring." / "No smoking."

      Participle: "be + not + verb + -ing"

      "I am not swimming." / "She wasn''t reading."

      '
  questions:
    example_generator:
      contexts:
      - asking about activities
      - current actions
      min_examples: 4
    structure: 'Gerund: "Is [activity] [adjective]?" / "Do you enjoy [activity]?"

      "Is swimming fun?" / "Do you enjoy cooking?"

      Participle: "Are you [activity]?" / "What are you doing?"

      "Are you swimming?" / "What are you reading?"

      '
grammar_point: gerund_participle
level: A2
meaning:
  ccqs:
  - answer: '''If yes, it''s a gerund (noun).'''
    purpose: Tests whether the learner understands that a gerund (-ing form) functions as a noun in the sentence, even though
      it looks like a verb.
    question: Is the -ing word the subject or object of the sentence?
  - answer: '''If yes, it''s a participle (continuous tense).'''
    purpose: 'Tests whether the learner can distinguish between a present participle (adjective: ''''The movie is boring'''')
      and a gerund (noun: ''''Watching movies is fun'''').'
    question: '''''''Is there a ''''be'''' verb before the -ing?'''''''
  - answer: '''The alternative form changes the meaning or creates an ungrammatical sentence.'''
    purpose: Tests whether the learner can identify common errors associated with gerund participle and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I am interested in learning.'' After any preposition (in, at, for, about, etc.), the verb must take the -ing
      form (gerund), never the infinitive.'
    purpose: Tests whether the learner knows the preposition + gerund rule. In English, every preposition must be followed
      by a noun or gerund (-ing form), never a bare infinitive. This is one of the most reliable rules for choosing between
      gerund and infinitive.
    question: After the preposition 'interested in,' do we say 'I am interested in to learn' or 'I am interested in learning'?
  contrast: '''Gerund (noun)'' = "I enjoy swimming." (activity as thing)

    ''Infinitive'' = "I want to swim." (purpose/intention)

    ''Participle'' = "I am swimming." (ongoing action)

    '
  core_meaning: 'The -ing form has two main uses: (1) as a gerund (noun) — ''Swimming is fun.'' (2) as a participle in continuous
    tenses — ''I am swimming.'''
  example_generator:
    contexts:
    - hobbies and interests
    - sports and activities
    - daily routines
    - likes and dislikes
    cultural_notes:
    - Some languages don't have an equivalent gerund form — explain the concept clearly
    min_examples: 5
  timeline: Depends on context — gerund is timeless, participle shows ongoing action.
phonetics:
- example_generator:
    contexts:
    - noun stress patterns
  l1_issue: Some L1 speakers may use infinitive where gerund is required
  note: Stress on the first syllable of gerunds used as nouns
register_notes: []
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
