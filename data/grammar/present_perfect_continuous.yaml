common_errors:
- correction: I have known him for years.
  error: '*I have been knowing him for years.*'
  explanation: 'Stative verbs (know, believe, love, hate) are not normally used in continuous forms. Use present perfect simple:
    ''I have known him'' NOT ''I have been knowing him''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: State and dynamic verbs'
- correction: I have been waiting for 2 hours.
  error: 'Using present perfect simple when duration matters: *''I have waited for 2 hours.'''
  explanation: 'Swan PEU: Use continuous when emphasizing duration/temporary situations. ''I have been waiting'' emphasizes
    the ongoing, potentially frustrating wait.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Action started in past, continues to present, emphasizes duration or recent activity with visible result.
dialectal_variation: []
discourse_notes:
- note: 'The present perfect progressive in discourse emphasizes the DURATION of a situation leading up to the present, often
    with an emotional or evaluative stance: ''I''ve been waiting for hours!'' (complaint), ''She''s been working so hard''
    (admiration). The combination of perfect (leading to present) + progressive (ongoing) creates a sense of accumulated experience.'
- note: 'In conversation, present perfect continuous is used to explain visible results: ''Why are you tired? I have been
    working all day.'' The continuous form emphasizes the ongoing effort, not just the completion.'
- note: 'Present perfect continuous is less common in academic writing, where the perfect simple is preferred for reporting
    completed research: ''Studies have shown...'' rather than ''Studies have been showing...'''
form:
  affirmative:
    example_generator:
      contexts:
      - education and school
      - food and daily routines
      min_examples: 4
    structure: 'Subject + have/has been + V-ing: ''I have been walking.'' ''She has been working.'''
  negative:
    example_generator:
      contexts:
      - work and professional life
      - health and wellbeing
      min_examples: 4
    structure: 'Subject + haven''t/hasn''t been + V-ing: ''I haven''t been walking.'' ''She hasn''t been working.'''
  questions:
    example_generator:
      contexts:
      - education and school
      - food and daily routines
      min_examples: 4
    structure: 'Have/has + subject + been + V-ing: ''Have you been walking?'' ''Has she been working?'''
grammar_point: present_perfect_continuous
level: B1
meaning:
  ccqs:
  - answer: Yes — present perfect continuous emphasizes that the action started in the past and continues now (or has just
      stopped with a visible result).
    purpose: Tests whether the learner understands the core temporal meaning of present perfect continuous — that the action
      is ongoing up to the present moment, which distinguishes it from present perfect simple which presents the action as
      completed.
    question: I have been studying for 3 hours. Am I still studying now?
  - answer: '''I have studied'' focuses on completion (the action is done). ''I have been studying'' focuses on duration (how
      long the action has been happening).'
    purpose: 'Tests whether the learner understands the aspectual distinction between the two forms: present perfect simple
      emphasizes the result/completion while present perfect continuous emphasizes the duration/ongoing process.'
    question: Can you explain the difference between 'I have studied' and 'I have been studying' by giving an example of when
      to use each?
  - answer: No — 'know' is a stative verb and is not normally used in continuous forms. We say 'I have known him for 5 years.'
    purpose: Tests whether the learner knows the stative verb restriction on continuous forms. Stative verbs describe states
      rather than actions and are grammatically incompatible with the progressive aspect, even when duration is being expressed.
    question: Can we say 'I have been knowing him for 5 years'?
  - answer: '''I have been waiting for two hours.'' The continuous form emphasizes the ongoing, temporary nature.'
    purpose: Tests whether the learner understands that present perfect continuous emphasizes duration and temporary situations
      (Swan PEU 2016, entry 50).
    question: Which emphasizes duration? 'I have been waiting for two hours' or 'I have waited for two hours'?
  contrast: '''Present Perfect'' = "I have eaten (completed, no duration)."

    ''Present Perfect Continuous'' = "I have been eating for 1 hour (duration)."

    '
  core_meaning: Past action continuing to present, emphasizes duration or recent activity with visible result.
  timeline: Past start → present (still ongoing or just finished with result).
phonetics:
- example_generator:
    contexts:
    - have been contraction
  l1_issue: Many L1 speakers do not contract 'have been' in speech. Teach the contracted forms.
  note: 'Have been is often contracted: ''I''ve been studying'' /aɪv biːn ˈstʌdɪɪŋ/. The contraction is very common in connected
    speech.'
