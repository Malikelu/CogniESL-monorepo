sub_rules:
- examples:
  - I have been studying for 3 hours
  - She has been working here since 2020
  - They have been living in London for 5 years
  rule: 'Structure: have/has been + verb-ing'
  type: grammatical
- examples:
  - I have been studying for 3 hours
  - She has been working since morning
  rule: Used with for and since to show duration
  type: grammatical
- examples:
  - I have been reading this book for weeks (still reading)
  - She has been working all day (focus on the long period)
  rule: Focuses on the duration or ongoing nature of an action, not its completion
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students ask each other 'How long have you been...?' 'How long have you been studying English?' 'I have
      been studying for 3 years.'
    duration: 15
    name: How Long
  - adaptation_notes: 'Students choose the correct form based on context: completed action vs ongoing action.'
    duration: 10
    name: Present Perfect or Present Perfect Continuous
  tips:
  - 'Contrast Present Perfect and Continuous with duration: ''I have eaten (done) vs I have been eating for 1 hour (ongoing)''.'
  - Practice with 'for'/'since' and 'how long'.
  - 'Drill visible result sentences: ''Why are you sweaty? I have been running.'''
  - 'Swan PEU: ''For/since'' with PPC. ''I have been studying for 3 hours'' (duration). ''I have been studying since 9am''
    (starting point).'
  - 'Swan PEU: PPC often has a visible result. ''Why are you wet?'' ''Because I have been walking in the rain.'' (visible
    result = wet clothes).'
  - 'Swan PEU: Contrast -- ''I have read 10 books this year'' (completed total) vs ''I have been reading all week'' (ongoing
    duration).'
  - 'GB3 Ch. 7: Present perfect progressive — combines ''prior'' (perfect) + ''incomplete'' (progressive). Used for: (a) situation
    beginning in past continuing to present (''Bart has been going out with Alicia''), (b) action not yet completed (''I have
    been reading that book''), (c) change over time (''The students have been getting better''), (d) evaluative comment triggered
    by evidence (''You''ve been drinking again!''). Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.2.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3) analyzes the present perfect progressive
    (''I have been waiting'') as combining perfect (past-within-present) with progressive (ongoing/unbounded). The combination
    emphasizes DURATION of an ongoing situation up to the present. CGEL notes that stative verbs resist the progressive (*''I
    have been knowing''), so the perfect progressive is only available with dynamic verbs.'
title: Present Perfect Continuous (have/has been + V-ing)
use:
- description: How long an action has been happening, still ongoing.
  examples:
  - I have been learning English for 5 years.
  - It has been raining all day.
  key_point: Use with 'for', 'since', 'how long'.
  name: Duration to Present
- description: Just finished, result visible now.
  examples:
  - I'm tired because I have been running.
  - She has been gardening (dirty hands).
  key_point: Result is obvious in present.
  name: Recent Activity with Visible Result
- description: Repeated action recently, may not be permanent.
  examples:
  - I have been going to the gym lately.
  - She has been calling me every day.
  key_point: Use with 'lately', 'recently'.
  name: Temporary Repeated Action
