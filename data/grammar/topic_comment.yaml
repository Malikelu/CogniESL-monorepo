description: 'Manipulating the topic (what is being talked about) and the comment (what is said about it) to organise information,
  create emphasis, and manage discourse flow. TYPOLOGICAL NOTE (Li & Luk 2017): Chinese is topic-prominent — its default sentence
  structure IS topic-comment, making over-topicalization in English a STRUCTURAL transfer error, not merely a register/formality
  issue. Manipulating the topic (what is being talked about) and the comment (what is said about it) to organise information,
  create emphasis, and manage discourse flow.'
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - emphasis
      - contrast
      - discourse management
      min_examples: 4
    structure: Topic + comment (standard order) / Fronted topic + subject + verb + resumptive pronoun (left dislocation) /
      It + be + focused element + that/who... (cleft) / What + subject + verb + be + comment (pseudo-cleft)
  negative:
    example_generator:
      contexts:
      - emphatic negation
      - formal rhetoric
      min_examples: 3
    structure: 'Negative elements can be fronted for emphasis: ''Never have I seen such beauty.'' / ''Not once did he apologise.'''
  questions:
    example_generator:
      contexts:
      - checking knowledge
      - expressing confusion
      min_examples: 3
    structure: 'Questions can also manipulate topic: ''That film — have you seen it?'' / ''What I don''t understand is why
      he left.'''
grammar_point: topic_comment
level: C1
meaning:
  ccqs:
  - answer: '''That book'' — it''s what we''re talking about.'
    purpose: Tests whether the learner understands a key concept of topic_comment. This is fundamental for correct use of
      this grammar point.
    question: In 'That book, I've read it twice', what is the topic?
  - answer: It's more common in spoken and informal English, though it appears in formal writing for rhetorical effect.
    purpose: Tests whether the learner understands a key concept of topic_comment. This is fundamental for correct use of
      this grammar point.
    question: Is topicalisation common in formal or informal English?
  - answer: The basic meaning stays the same, but the focus and emphasis change.
    purpose: Tests whether the learner understands a key concept of topic_comment. This is fundamental for correct use of
      this grammar point.
    question: Does changing the topic change the meaning of the sentence?
  - answer: '''That book — I read it yesterday.'' Topic-comment structure puts the topic first, then a comment.'
    purpose: Tests whether the learner can use topic-comment structures for emphasis (Swan PEU 2016).
    question: Which is correct? *'That book, I read it yesterday' or 'That book — I read it yesterday'?
  contrast: 'Compare with basic SVO order: ''I really enjoyed that movie'' (neutral) vs. ''That movie, I really enjoyed it''
    (topicalisation — the movie is the topic). Both convey the same information but with different focus.'
  core_meaning: Every sentence can be divided into a topic (what the sentence is about) and a comment (what is said about
    the topic). English normally follows a topic-comment order where the topic comes first. However, advanced speakers can
    manipulate this structure for emphasis, focus, or stylistic effect — using devices such as fronting, cleft sentences,
    left dislocation, and topicalisation.
  example_generator:
    contexts:
    - academic writing
    - spoken discourse
    - literary analysis
    - rhetorical emphasis
    - discourse management
    cultural_notes:
    - Topic-comment manipulation is a hallmark of advanced proficiency. It is used extensively in speeches, debates, and persuasive
      writing.
    min_examples: 5
  timeline: Not a tense-related concept — this is about information structure and how speakers organise what they say.
phonetics:
- example_generator:
    contexts:
    - spoken emphasis
    - presentation skills
  l1_issue: 'Li & Luk (2017): Mandarin is topic-prominent — structural transfer produces "*That matter I am responsible person."
    Green (1991): HK university students persistently produce "*According to X, it shows that..." — unnecessary topic-doubling.
    Korean and Japanese speakers: wa/ga system interferes with English information structure. Overuse of left dislocation
    in formal English is a MARKED error — not merely register.'
  note: Topicalised elements are typically spoken with a falling tone, followed by a pause (represented by a dash in writing).
    The comment then follows as a separate intonation unit.
- example_generator:
    contexts:
    - contrastive stress
    - emphasis practice
  l1_issue: Learners may not use stress and intonation to signal the focused element, making cleft sentences sound flat and
    unnatural.
  note: 'Cleft sentences place heavy stress on the focused element: ''It was JOHN who broke the window'' (not someone else).'
register_notes:
- note: 'Biber et al. (2021) — Topic-comment structures: conversation uses more topicalization (left dislocation, fronting).
    Academic prose uses more canonical subject-predicate order. Ch. 14'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 14
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  typological: 'Li & Luk (2017) Chinese-English Contrastive Grammar, Ch.7: Topic-prominence in Chinese; Kuno (1973) The Structure
    of the Japanese Language, Ch.2-4: wa/ga theme-marking in Japanese'
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - That new restaurant, we should try it.
  - His behaviour, I find it unacceptable.
  - The exam, she passed it easily.
  rule: 'Topicalisation (fronting): moving an element to the front of the sentence to make it the topic. ''That movie, I really
    enjoyed it.'' / ''The money, we don''t need it.'''
  type: grammatical
- examples:
  - My brother, he's a doctor.
  - The new restaurant, we went there yesterday.
  - That woman from the council, she called again.
  rule: 'Left dislocation: the topic is stated first, then referred to with a pronoun in the main clause. Common in spoken
    English.'
  type: grammatical
- examples:
  - He's very tall, that boy.
  - It was amazing, that concert.
  - They're lovely, those flowers.
  rule: 'Right dislocation: the topic is added after the main clause, often for clarification. ''She''s really clever, your
    daughter.'''
  type: grammatical
- examples:
  - It was John who broke the window.
  - It's the coffee that keeps me going.
  - It was in 1969 that they landed on the moon.
  rule: 'Cleft sentences (it-cleft): ''It + be + focused element + that/who clause.'' Used to highlight specific information.'
  type: grammatical
- examples:
  - What I need is a good night's sleep.
  - What she said was very upsetting.
  - What we should do is contact the police.
  rule: 'Pseudo-cleft (wh-cleft): ''What + subject + verb + be + comment.'' Puts the focus at the end.'
  type: grammatical
- examples:
  - Never have I seen such a beautiful sunset.
  - Not only did he fail the exam, but he also lost his textbook.
  - Rarely do we see such dedication.
  rule: 'Fronting with inversion: negative or restrictive adverbials moved to the front trigger subject-auxiliary inversion.
    ''Never have I...'', ''Not only did he...'', ''Rarely do we...'''
  type: grammatical
- examples:
  - Along the road came a procession of cars.
  - Round the corner came a group of children.
  - On the hill stood an ancient castle.
  rule: 'Fronting of adverbials for literary effect: ''Down came the rain.'' / ''Into the room walked a tall stranger.'''
  type: stylistic
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students read a text and label the topic and comment in each sentence, discussing how the structure
      affects meaning.
    duration: 10
    name: Topic-comment identification
  - adaptation_notes: Students rewrite neutral sentences using cleft structures, topicalisation, or fronting to create different
      emphases.
    duration: 15
    name: Rewriting for emphasis
  - adaptation_notes: Students watch a short political speech or TED talk and identify all topic-comment manipulations, discussing
      their effect.
    duration: 15
    name: Speech analysis
  - adaptation_notes: Students write a short descriptive paragraph (a scene, a person, a place) using at least 3 different
      topic-comment structures.
    duration: 20
    name: Creative writing
  tips:
  - Start by asking students to identify the topic and comment in simple sentences.
  - Use authentic examples from speeches, films, and literature to show topic-comment manipulation in context.
  - Introduce left dislocation first as it is the most common in spoken English.
  - Move to cleft sentences (it-cleft and pseudo-clear) for written and formal contexts.
  - Practise fronting with negative adverbials as a separate sub-skill due to the inversion rule.
  - Encourage students to experiment with these structures in writing tasks and presentations.
  - 'Swan PEU: Topic-comment structure — topic sets up what we''re talking about, comment says something about it. ''As for
    money, we have enough.'' ''That book, I''ve read it twice.'' These structures are common in informal English.'
title: Topic-Comment Structure
use:
- context: Spoken discourse management
  description: Using left and right dislocation to introduce or clarify topics in conversation.
  examples:
  - That meeting on Friday, I can't make it.
  - He's really nice, your new colleague.
  - The train to Manchester, when does it leave?
- context: Emphasis and contrast in writing
  description: Using cleft sentences and fronting to highlight key information in essays, reports, and articles.
  examples:
  - It is the government's responsibility to address this issue.
  - What matters most is the quality of education.
  - Not until the 20th century did women gain the right to vote.
- context: Rhetorical and persuasive language
  description: Politicians, speakers, and writers use topic-comment manipulation for dramatic effect.
  examples:
  - What we need is real leadership.
  - It is the people who must decide.
  - Never before has the world faced such a challenge.
- context: Literary and narrative style
  description: Authors use fronting and inversion to create atmosphere and vary sentence rhythm.
  examples:
  - Through the mist came the sound of footsteps.
  - Gone were the days of innocence.
  - Such was the fear in her eyes that he looked away.
