sub_rules:
- examples:
  - She speaks English fluently.
  - He drove carefully.
  rule: Adverbs of manner — after the verb or at the end
  type: word_order
- examples:
  - I always wake up early.
  - She is never late.
  rule: Adverbs of frequency — before the main verb, after be
  type: word_order
- examples:
  - Yesterday, I went to the store.
  - I went to the store yesterday.
  rule: Adverbs of time — beginning or end of sentence
  type: word_order
- examples:
  - I have already finished.
  - She is still waiting.
  rule: 'Mid-position adverbs: always, never, often, sometimes, usually, already,
    still, just'
  type: word_order
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students rearrange sentences with adverbs in different positions.
    duration: 10
    name: Adverb Shuffle
  tips:
  - 'CGEL Ch. 10: CGEL classifies adjuncts into semantic categories: temporal (then,
    yesterday), locative (here, outside), manner (carefully, slowly), degree (very,
    quite). The position of the adjunct affects its scope — initial adjuncts have
    clausal scope, final adjuncts have VP scope.'
  - Use the MIFF rule for position
  - Practice moving adverbs and noticing emphasis changes
  - Contrast with L1 adverb placement
  - 'Swan (2016) PEU: The ''mid position'' — after auxiliary/modal, before main verb:
    ''I have always wanted to go.'' ''She can never remember names.'' For ''be'':
    after the verb: ''He is always late.'''
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle.
    Ch. 25: GB 2nd ed. (Ch.25) classifies adverbials by DISCOURSE FUNCTION: ADJUNCT
    (integrated into clause: ''She left yesterday''), DISJUNCT (speaker comment: ''Frankly,
    I don''t care''), CONJUNCT (discourse connector: ''However, I disagree''). This
    distinction explains ordering constraints: adjuncts have flexible position; disjuncts
    are typically clause-initial or final; conjuncts are clause-initial.'
title: Adverb Placement
use:
- context: Natural speech
  description: Using adverbs in their natural positions
  examples:
  - I usually have coffee in the morning.
  - She speaks three languages fluently.
- context: Emphasis
  description: Moving adverbs to the front for emphasis
  examples:
  - Suddenly, everyone stopped talking.
  - Never have I seen such a beautiful sunset.
