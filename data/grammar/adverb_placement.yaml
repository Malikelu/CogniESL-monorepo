common_errors:
- correction: She runs home quickly.
  error: '*She quickly runs home.*'
  explanation: Manner adverbs typically go after the verb.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Turkish
  reliability: B
- correction: Teach adverbs by type position rules — manner (end), frequency (mid),
    degree (immediately before the word it modifies), focusing (flexible but meaning-sensitive),
    attitude markers (front/end/before complement).
  error: Teaching all adverbs as one unified category with a single placement rule.
  explanation: Parrott explicitly calls "adverb" a "dustbin term" — a label that groups
    many structurally different word types together. Treating them as one category
    misleads learners because the position rules differ sharply by type. Instructors
    should organise teaching around adverb subtypes rather than the overarching label.
  l1_groups: []
  pedagogical_note: true
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 5: Adverbs.'
  tier: 1
- correction: I like music very much.
  error: '*I like very much music.*'
  examples:
  - correct_form: I enjoy cooking very much.
    error_form: I enjoy very much cooking.
  - correct_form: She speaks English very well.
    error_form: She speaks very well English.
  explanation: Manner/degree adverbs must not be placed between the verb and its direct
    object. End position (after the object) is the standard slot. Parrott highlights
    this as a key cross-linguistic error — learners insert the adverb directly after
    the verb following L1 patterns where verb-adverb adjacency is normal.
  l1_groups:
  - French
  - Italian
  - Spanish
  - Portuguese
  - Arabic
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 5: Adverbs.'
  tier: 1
- correction: The position of even, only, and also must be placed immediately before
    (or as close as possible to) the constituent they focus on, because position changes
    meaning.
  error: Placing focusing adverbs (even / only / also) in a fixed or default position
    without regard for meaning.
  examples:
  - only_before_subject: Only I love her. (= no one else loves her)
  - only_before_verb: I only love her. (= I do nothing but love her / ambiguous in
      speech)
  - only_before_object: I love only her. (= I love no one else)
  - even_front: Even children understood the rule. (= children, who might not be expected
      to, understood)
  - even_mid: She even passed the hardest exam. (= the hardest exam was also passed)
  explanation: 'Parrott demonstrates that position of focusing adverbs is not decorative
    — it is semantic. Compare: "Only I love her" (no one else loves her) vs. "I only
    love her" (I don''t do anything else to her) vs. "I love only her" (no one else
    is loved). Each sentence conveys a different proposition. Learners often default
    to mid-position regardless of intended meaning.'
  l1_groups: []
  note: In spoken English only/even are often placed in mid-position; in formal written
    English strict proximity to the focused element is preferred and expected.
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 5: Adverbs.'
  tier: 1
- correction: Attitude markers are flexible — they can appear in front position (before
    the whole clause), end position (after the whole clause), or before a complement.
    All three are grammatical.
  error: Placing attitude markers (fortunately, luckily, surprisingly, etc.) only
    in mid-position or omitting them from front/end positions.
  examples:
  - end_position: We arrived on time, fortunately.
    front_position: Fortunately, we arrived on time.
    pre_complement: She was, fortunately, unharmed.
  - end_position: He refused the offer, surprisingly.
    front_position: Surprisingly, he refused the offer.
  explanation: 'Parrott identifies attitude markers as a distinct adverb subtype with
    front/end/pre-complement flexibility. Learners who know only mid-position placement
    or who have learned that adverbs go "before the verb" may either misplace attitude
    markers or avoid them entirely. Examples of all valid positions: "Fortunately,
    she passed." (front) / "She passed, fortunately." (end) / "She was, fortunately,
    unharmed." (before complement).'
  l1_groups: []
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 5: Adverbs.'
  tier: 1
- correction: English offers five distinct positions for adverbs depending on type
    and function. Learners should be taught each position explicitly.
  error: Unaware of the full range of grammatical sentence positions available for
    adverbs — defaulting to one or two positions for all adverb types.
  explanation: 'Parrott (Ch. 5) maps five sentence positions for adverbs: (a) before
    the whole clause — "Fortunately, we arrived on time." (attitude markers, time/place
    adverbs for emphasis); (b) before the main verb — "She always arrives on time."
    (frequency adverbs, relative time adverbs); (c) between auxiliary and main verb
    — "She has always arrived on time." (frequency, relative time); (d) end of clause
    — "She arrived on time, fortunately." / "He drove carefully." (manner, time, place,
    attitude markers); (e) before adverbials — "He drove carefully through the city."
    (manner before prepositional adverbials). Teaching position as a single rule or
    only two positions causes persistent systematic errors.'
  l1_groups: []
  positions:
  - adverb_types: attitude markers, time/place for emphasis
    example: Fortunately, we arrived on time.
    label: (a) Front — before the whole clause
  - adverb_types: frequency, relative time (just, still, already)
    example: She always arrives on time.
    label: (b) Before the main verb
  - adverb_types: frequency, relative time
    example: She has always arrived on time.
    label: (c) Between auxiliary and main verb
  - adverb_types: manner, time, place, attitude markers
    example: She arrived on time, fortunately. / He drove carefully.
    label: (d) End of clause
  - adverb_types: manner before prepositional adverbials
    example: He drove carefully through the city.
    label: (e) Before adverbials
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press. Ch. 5: Adverbs.'
  tier: 1
description: Rules for where adverbs are placed in sentences — before adjectives,
  after verbs, front position for emphasis.
