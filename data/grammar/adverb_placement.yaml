grammar_point: adverb_placement
level: B2
meaning:
  ccqs:
  - answer: If yes, the placement is correct.
    purpose: Tests whether the learner can judge whether an adverb sounds natural
      in a given position. This is important because adverb placement in English is
      often a matter of convention rather than strict rules, and learners need to
      develop an ear for natural-sounding sentences.
    question: Does this adverb sound natural in this position?
  - answer: Type determines placement.
    purpose: Tests whether the learner understands that adverb type determines placement.
      This is important because manner, frequency, and time adverbs each follow different
      placement rules.
    question: What type of adverb is it?
  - answer: The first sentence means she does nothing except love her (mid-position
      'only' modifies the verb). The second means she loves no one else (pre-object
      'only' modifies the object). Adverb placement changes the focused constituent
      and therefore the meaning.
    purpose: Tests whether the learner can identify common errors associated with
      adverb placement and explain why they are incorrect.
    question: What is the difference in meaning between 'I only love her' and 'I love
      only her'?
  - answer: She speaks English fluently sounds more natural. Manner adverbs like fluently
      typically go after the verb or at the end of the clause in English. Placing
      the manner adverb between the subject and verb (She fluently speaks) sounds
      unnatural and overly formal in most contexts.
    purpose: Tests whether the learner has internalized the natural position for manner
      adverbs. While basic grammar rules state that frequency adverbs go mid-position
      (before the main verb), manner adverbs behave differently and prefer end position.
      Confusing these two patterns is one of the most common word-order errors across
      all L1 groups.
    question: She speaks English fluently versus She fluently speaks English -- which
      sounds more natural in everyday English?
  contrast: Correct = She quickly ran. vs Emphatic fronting = Quickly she ran. (different
    emphasis — both grammatical)
  core_meaning: Adverb placement in English follows specific rules. Adverbs of manner
    usually go after the verb. Adverbs of frequency go before the main verb. Some
    adverbs can go at the beginning of a sentence for emphasis.
  example_generator:
    contexts:
    - sentence structure
    - emphasis
    - formal writing
    - spoken English
    cultural_notes:
    - Adverb placement varies across languages — many L1 speakers struggle with English
      word order
    min_examples: 5
  timeline: Timeless — placement rules apply to all tenses.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Word order — many L1 speakers place adverbs in positions that sound unnatural
    in English
  note: Stress on the adverb when it is fronted for emphasis
register_notes:
- note: 'Biber et al. (2021) — Adverbial position: conversation uses more clause-initial
    and clause-final adverbials; academic prose uses more medial position. Stance
    adverbials differ markedly between registers. Ch. 10.1.3, 12.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 10.1.3, 12.5
