common_errors:
- correction: I must go to the doctor. / I have to go to the doctor.
  error: '*I must to go to the doctor.*'
  explanation: Modal verbs (must, should, can) are followed by the base verb without 'to'. 'Need to' requires 'to' because
    'need' is a regular verb, not a modal.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Modal verbs'
- correction: I must go now.
  error: 'Using ''must to'': *''I must to go now.'''
  explanation: 'Swan PEU: Modal verbs (must, can, may, might, will, should, would, could) are followed by the bare infinitive
    without ''to''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I had to work yesterday.
  error: 'Using ''must'' for past obligation: *''I must work yesterday.'''
  explanation: 'Swan PEU: ''Must'' has no past form for obligation. Use ''had to'' for past obligation.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Express obligation, necessity, and requirement. Contrasts internal obligation (must) vs external obligation (have
  to) vs necessity (need).
dialectal_variation: []
discourse_notes:
- note: 'In legal and regulatory language, ''must'' expresses strong obligation: ''All visitors must present identification.'''
- note: 'In conversation, ''have to'' is more common than ''must'' for obligation: ''I have to go now.'' (not *''I must go
    now.'' in AmE)'
- note: 'In academic writing, ''must'' expresses logical deduction: ''The results must be interpreted with caution.'''
form:
  affirmative:
    example_generator:
      contexts:
      - work and professional life
      - food and daily routines
      - shopping and commerce
      min_examples: 4
    structure: 'Must + base verb: "I must go."

      Have to + base verb: "I have to go." (third person: has to)

      Need + to + verb: "I need to go." (negative: don''t need to)

      '
  negative:
    example_generator:
      contexts:
      - shopping and commerce
      min_examples: 4
    structure: 'Must not + base verb: "You must not smoke." (prohibition)

      Don''t have to + base verb: "You don''t have to come." (no obligation)

      Don''t need to + base verb: "You don''t need to worry." (no necessity)

      '
  questions:
    example_generator:
      contexts:
      - work and professional life
      - food and daily routines
      min_examples: 4
    structure: 'Must + subject + base verb: "Must I sign this?" (rare, formal)

      Do/Does + subject + have to + base verb: "Do you have to go?"

      Do/Does + subject + need to + base verb: "Do you need to leave?"

      '
grammar_point: must_have_to_need
level: A2
meaning:
  ccqs:
  - answer: Must = personal obligation. Have to = external obligation or rule.
    purpose: Tests whether learner understands that must not = prohibition, while do not have to = no obligation
    question: '''Must not'' and ''do not have to'' — are these the same? What is the difference?'
  - answer: '''Must not'' = prohibition. ''Do not have to'' = no obligation.'
    purpose: Tests understanding that must has no past form; must use 'had to'
    question: Can we say 'I musted go'? If not, what do we say instead for the past?
  - answer: Both! ''Must'' = the obligation comes from the speaker. ''Have to'' = the obligation comes from outside (rules,
      other people).
    purpose: Tests whether the learner understands the source-of-obligation distinction (Swan PEU 2016, entry 75).
    question: Which is correct? 'I must go now (I want to)' or 'I have to go now (the boss said so)'? Or both?
  - answer: 'No — must has no past form. Use ''''had to'''': ''''I had to go.'''''
    purpose: Tests whether the learner knows that must cannot express past obligation (Swan PEU 2016, entry 73.5).
    question: What is the past of 'I must go' — 'I musted go'?
  contrast: '''Must'' = internal rule: "I must study (I decided)."

    ''Have to'' = external rule: "I have to study (teacher said)."

    ''Don''t have to'' = no obligation: "You don''t have to come (optional)."

    '
  core_meaning: Must = internal obligation (speaker's rule); Have to = external obligation (law, boss, rule); Need = necessity
    (requirement).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present: must/have to/need to; Past: had to (no must in past); Future: will have to.'
phonetics:
- example_generator:
    contexts:
    - must pronunciation
  l1_issue: Learners may confuse must and must not in listening. The vowel length and the /nt/ ending are the key distinguishing
    features.
  note: 'Must is pronounced /mʌst/ in affirmative but often reduced to /məs/ in connected speech: ''I must go'' → /aɪ məs
    ɡəʊ/.'
