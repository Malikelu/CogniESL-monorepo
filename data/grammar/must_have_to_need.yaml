sub_rules:
- examples:
  - I must study harder (I feel this is necessary)
  - You must see this movie (I strongly recommend it)
  - She must be more careful (my opinion)
  rule: Must expresses personal obligation — the speaker feels it is necessary
  type: semantic
- examples:
  - I have to wear a uniform at work (rule)
  - You have to pay taxes (law)
  - She has to take medication (doctor's orders)
  rule: Have to expresses external obligation — rules, laws, or other people require it
  type: semantic
- examples:
  - You must not smoke here (prohibition)
  - You do not have to come if you do not want to (no obligation)
  - She must not park here (forbidden)
  - She does not have to work on Sundays (optional)
  rule: Must not expresses prohibition (forbidden). Do not have to expresses no obligation (optional)
  type: semantic
- examples:
  - I need to study for the exam
  - She needs to see a doctor
  - We need to leave early
  rule: Need to expresses necessity — something is necessary or important
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students choose: ''I ___ wear a seatbelt.'' (have to — law) ''I ___ study more.'' (must — personal
      feeling).'
    duration: 10
    name: Must or Have To
  - adaptation_notes: 'Students describe obligations in different contexts: school (have to), personal goals (must), health
      (need to).'
    duration: 15
    name: Obligation Scenarios
  tips:
  - 'GB3 Ch. 8: Core meanings — must = irresistible force (speaker authority), have to = external force imposing obligation
    (rules, circumstances), need to = internal force (personal necessity). Must not = prohibition (''you may not''). Don''t
    have to = choice (''you may, but it''s not necessary''). Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch.
    8 §8.2-8.3.'
  - 'GB3 Ch. 8: Frequency in spoken AmE — must 8%, have to 39%, (have) got to 53%. Reflects democratization: speakers avoid
    the authoritative must in favor of more egalitarian forms. Must is more common in BrE for social uses. Source: GB3 3rd
    ed. Ch. 8 §8.3 (citing Radden & Dirven 2007).'
  - Contrast must (internal) vs have to (external) with role plays vs boss (have to).'
  - Drill had to for past obligation with timeline activities.
  - 'Use real-life examples: ''You must wear a helmet (law) vs You have to wear a helmet (gym rule).'''
  - 'Swan PEU: ''Mustn''t'' vs ''don''t have to'' — a critical distinction. ''You mustn''t park here'' (prohibition) vs ''You
    don''t have to park here'' (no obligation).'
  - 'Swan PEU: ''Must'' for logical deduction vs obligation — ''You must be tired'' (deduction) vs ''You must leave now''
    (obligation). Context determines meaning.'
title: Must, Have to, Need (Obligation & Necessity)
use:
- description: Speaker's personal rule or strong advice.
  examples:
  - I must remember her birthday.
  - You must try this cake.
  key_point: Must is rarely used in questions/negatives in American English.
  name: Internal Obligation (must)
- description: Obligation from outside authority (law, boss, schedule).
  examples:
  - I have to wear a uniform at work.
  - She has to take the bus.
  key_point: Had to for past external obligation.
  name: External Obligation (have to)
- description: Requirement for a task.
  examples:
  - We need to buy eggs for the recipe.
  - You need to finish the report.
  key_point: Don't need to = no necessity, not prohibition.
  name: Necessity (need to)
