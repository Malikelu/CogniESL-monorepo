  tier: 1
common_errors:
- correction: You had better go.
  error: '*You had better to go.*'
  explanation: '''Had better'' is followed by the base verb (no ''to''). This is a common structural error.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
- correction: You should have studied yesterday.
  error: 'Using ''had better'' for past advice: *''You had better studied yesterday.'''
  explanation: 'Swan PEU: ''Had better'' refers to present/future only -- not past. For past advice that was not followed, use ''should have + past participle''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I would rather stay home.
  error: 'Confusing ''had better'' with ''would rather'': *''I had rather stay home.'''
  explanation: 'Swan PEU: ''Had better'' = strong advice/warning. ''Would rather'' = preference. They are not interchangeable.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: 'Structure used to give strong advice or warnings, similar to ''should'' but more urgent: had better + base verb.'
dialectal_variation: []
discourse_notes: []
