  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries and Related Phrasal Forms'
  tier: 1
- claim: 'Register distribution: ''Had better'' is primarily spoken and informal; rare in formal writing where ''should'' is preferred.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries and Related Phrasal Forms'
  tier: 1
- claim: 'Discourse function: In conversation, this structure is used in everyday communication.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries and Related Phrasal Forms'
  tier: 1
