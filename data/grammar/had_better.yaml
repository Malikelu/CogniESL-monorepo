    structure: 'Invert had and subject: Had you better go? (rare, more common: Do you think I had better go?)'
grammar_point: had_better
level: B2
meaning:
  ccqs:
  - answer: It is stronger. 'Had better' implies something bad will happen if you do not follow the advice, whereas 'should' is a milder suggestion.
    purpose: Tests whether the learner understands the relative strength of 'had better' compared to other advice modals.
    question: Is 'You had better' stronger or weaker than 'You should'?
  - answer: You are giving strong advice with an implied warning, not a formal rule. The speaker is suggesting negative consequences will follow if the advice is not followed.
    purpose: Tests whether the learner understands the implied warning and consequence function of 'had better'.
    question: If I say 'You had better not be late,' am I giving advice or making a threat?
  - answer: You had better study. Had better is followed by the base verb without to.
    purpose: Tests whether the learner knows that had better takes the bare verb form, unlike ought to or want to.
    question: Is it correct to say "You had better to study" or "You had better study"?
  contrast: 'Had Better = Strong advice (negative consequence): You had better go (or you''ll be late)


    Should = Mild advice: You should go (good idea)


    Must = Obligation: You must go (rule)

    '
  core_meaning: Had better expresses strong advice or a warning, implying negative consequences if not followed. It is stronger than 'should' but not as strong as 'must'. The form is fixed and restricted
    to present/future time reference.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present/future: Advice for current or future actions.'
phonetics:
- example_generator:
    contexts:
    - had better contraction
  l1_issue: Learners may write 'You better go' in formal contexts. Teach that the standard form is 'You had better go.'
  note: 'Had better is often contracted to better in informal speech: ''You better go'' /jə ˈbetə ɡəʊ/. The had is dropped in casual speech, though this is not standard in writing.'
register_notes:
- note: 'Biber et al. (1999) — Semi-modal expressions like ''had better'': register distribution skewed toward spoken/directive contexts. More common in conversation and informal writing. Ch. 6.6'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries and Related Phrasal Forms'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - You had better study for the exam (or you will fail)
  - We had better leave now (or we will be late)
  - He had better apologise (or she will be angry)
  rule: Had better expresses strong advice or a warning. It means it would be a good idea to do something, often with an implied negative consequence
  type: semantic
- examples:
  - You had better go (correct)
  - You had better to go (WRONG)
  rule: Had better is followed by the base form of the verb (without to)
  type: grammatical
- examples:
  - You had better not be late
  - We had better not forget the tickets
  - She had better not tell anyone
  rule: The negative form is had better not
  type: grammatical
- examples:
  - You had better go (advice — you should go)
  - I would rather go (preference — I prefer to go)
  rule: Had better is not the same as would rather. Had better = advice or warning. Would rather = preference
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Give students scenarios. They give advice using had better: ''My friend has an exam tomorrow.'' → ''He had better study tonight.'''
    duration: 15
    name: Advice Scenarios
  - adaptation_notes: 'Show warning signs (wet floor, high voltage). Students create sentences: ''You had better not touch that.'''
    duration: 10
    name: Warning Signs
  tips:
  - 'Parrott (2000) Ch. 11: Had better negative is had better not (not hadn''t better). In questions, subject goes after had: Hadn''t you better wear something warmer? Many people avoid had better in questions,
    preferring should. In speaking, had is sometimes dropped. Source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 11: Modal verbs, 11.5.'
  - 'Week 1: Affirmative had better (strong advice).'
  - 'Week 2: Negative had better (warnings).'
  - 'Week 3: Contrast with should/must, formal vs informal.'
  - 'Use warning scenarios: You had better not be late for the exam!'
  - 'Swan PEU: ''Had better'' is stronger than ''should'' but not as strong as ''must''. ''You''d better leave'' = strong warning. ''You should leave'' = advice. ''You must leave'' = order.'
  - 'Swan PEU: ''Had better'' has an ''if not'' implication. ''You''d better be careful'' = ''If you''re not careful (something bad will happen)''.'
  - 'Swan PEU: ''You''d better not'' for warnings. ''You''d better not touch that'' (implied: or something bad will happen).'
title: Had Better (Strong Advice)
use:
- description: Urgent advice with implied negative consequence.
  examples:
  - You had better apologise.
  - We had better hurry.
  key_point: Stronger than 'should'.
  name: Strong Advice
- description: Warn about negative outcomes.
  examples:
  - You had better not touch that (it's hot).
  - You had better be careful.
  key_point: Implies bad things will happen if ignored.
  name: Warnings
- description: Most common in spoken English, informal contexts.
  examples:
  - You'd better go now. (contraction)
  key_point: Contraction 'you'd better' is common in speech.
  name: Informal Use
