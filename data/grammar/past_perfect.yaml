common_errors:
- correction: I went to school yesterday.
  error: 'Using past perfect when past simple is sufficient: *''I had gone to school
    yesterday.'''
  explanation: Past perfect is only needed to clarify the order of two past events.
    If there's only one past event with a specific time, use past simple.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: I had eaten breakfast before he arrived.
  error: 'Using past simple instead of past perfect for the earlier event: *''I ate
    breakfast before he arrived.'''
  explanation: When emphasizing that one past event was completed before another,
    use past perfect for the earlier event. However, with 'before' and 'after', past
    simple is often acceptable because the order is clear.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I had finished before he arrived.
  error: 'Omitting ''had'': *''I finished before he arrived.'''
  explanation: Past perfect requires 'had' + past participle. Omitting 'had' makes
    it past simple.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: D
- correction: I arrived at 5pm.
  error: 'Using past perfect with only specific time: *''I had arrived at 5pm.'''
  explanation: 'Swan PEU: Past perfect requires a second past reference point. With
    only a specific time and no other past event, use simple past.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Describes an action that was completed before another past action or
  specific past time. Often called the 'past before the past' tense.
dialectal_variation:
- note: 'In informal speech, past perfect is often replaced by past simple, especially
    with ''already'', ''just'', ''before'': ''I already ate'' vs ''I had already eaten.'''
- note: In some dialects, 'had' may be reduced to /əd/ or even omitted in fast speech.
discourse_notes:
- note: 'Past perfect creates background information in narratives: ''The sun was
    shining. It had been a beautiful morning. Suddenly, the phone rang.'''
- note: 'Past perfect is used in reported speech for backshift: ''She said she had
    finished the report.'''
- note: 'In academic writing, past perfect establishes the timeline of prior research:
    ''Smith (2020) had argued that...'''
- note: 'Past perfect can create suspense in storytelling: ''Little did they know,
    the decision had already been made.'''
- note: 'GB3 Ch. 9: Past perfect in narrative — FLASHBACK function. The past perfect
    shifts the narrative timeline backward to events that occurred before the main
    past timeline: ''She had never been so lucky. She was walking home that day...''
    In narratives, past perfect is used briefly for flashbacks, then the narrator
    returns to simple past for the main timeline.'
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 9
form:
  affirmative:
    example_generator:
      contexts:
      - completed earlier actions
      - preparation
      - background events
      min_examples: 4
    structure: 'Subject + had + past participle (V3): ''I had eaten.'' / ''They had
      left.'' / ''She had finished.'''
  negative:
    example_generator:
      contexts:
      - things not done before a past moment
      - unfulfilled expectations
      min_examples: 3
    structure: 'Subject + had not (hadn''t) + past participle: ''I hadn''t eaten.''
      / ''They hadn''t left.'' / ''She hadn''t finished.'''
  questions:
    example_generator:
      contexts:
      - checking prior events
      - investigating causes
      - surprise or disbelief
      min_examples: 3
    structure: 'Had + subject + past participle: ''Had you eaten?'' / ''Had they left?''
      / ''Had she finished?'''
grammar_point: past_perfect
level: B1
meaning:
  ccqs:
  - answer: Yes — both are in the past.
    purpose: Tests whether the learner understands that both actions are in the past,
      but one happened before the other. This is the core concept of past perfect,
      the "past before the past".
    question: Did both actions happen in the past?
  - answer: The Past Perfect action happened first.
    purpose: Tests whether the learner understands that the past perfect action happened
      FIRST, before the past simple action. This is important because getting the
      order wrong changes the meaning of the narrative.
    question: Which happened first — the Past Perfect action or the Past Simple action?
  - answer: Not necessarily — the focus is on the order of events, not the specific
      time.
    purpose: Tests whether the learner understands that the focus is on the order
      of events, not the specific time. This is important because past perfect is
      used when the sequence matters more than the exact timing.
    question: Do we know the exact time it happened?
  - answer: Learners often make errors with this structure that change the intended
      meaning.
    purpose: Tests whether the learner can identify and correct a common error associated
      with past perfect. Recognizing typical mistakes helps learners self-edit and
      produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this
      grammar point?
  contrast: '''I had eaten before he came.'' (First: I ate. Then: he came. Both in
    the past, but eating happened first.) vs ''I ate before he came.'' (Both in past
    simple — order is clear from ''before'', but no emphasis on completion.)'
  core_meaning: An action that was completed before another past action or a specific
    point in the past. It clarifies the order of events when both are in the past.
  example_generator:
    contexts:
    - telling stories
    - explaining causes
    - describing past experiences
    - news reports
    - regrets about the past
    cultural_notes:
    - The Past Perfect is essential for clear storytelling in English
    - In informal speech, some native speakers use Past Simple where Past Perfect
      would be more precise
    - The Past Perfect is very common in written narratives and news reports
    min_examples: 5
  timeline: 'Past timeline: [Past Perfect (earlier)] → [Past Simple (later)] → [Now].
    The Past Perfect event is further back in the past than the Past Simple event.'
phonetics:
- example_generator:
    contexts:
    - connected speech
    - contractions
  l1_issue: Learners may not contract 'had' in speech, making it sound overly formal
    or unnatural. Practice with contractions is essential.
  note: '''Had'' is often contracted to /d/ or /əd/ in connected speech: ''I''d eaten''
    (/aɪd iːtn/), ''She''d left'' (/ʃiːd left/).'
- example_generator:
    contexts:
    - negative pronunciation
  l1_issue: Some learners may confuse 'hadn't' with 'haven't' in speech — the vowel
    and final consonant differ.
  note: In negative forms, 'hadn't' is pronounced /hædnt/ with a clear /t/ sound in
    careful speech, but the /t/ may be dropped in fast speech.
