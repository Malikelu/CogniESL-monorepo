common_errors:
- correction: She is a well-known author.
  error: '*She is a well known author.*'
  explanation: 'Compound adjectives before a noun are hyphenated: ''well-known'', ''short-lived'', ''ready-made''. The hyphen
    signals that the two words function as a single modifier. Without hyphens, the meaning can be ambiguous or misleading.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: He designs newly-built houses.
  error: '*He is a newly-built house designer.* (meaning: he designs newly built houses)'
  explanation: 'Misplaced modifier: ''newly-built'' modifies ''houses'', not ''designer''. The compound adjective must be
    adjacent to the noun it describes. Poor word order changes the meaning entirely.'
  l1_groups:
  - Portuguese
  - Spanish
  - Arabic
  - Chinese
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: This is a poorly written essay by a badly prepared student.
  error: '*This is a poorly-written essay by a badly prepared student.*'
  explanation: Hyphens in compound adjectives are needed before a noun ('poorly-written essay') but not after it ('the essay
    is poorly written'). The hyphen rule changes based on the adjective's position in the sentence.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: A three-year-old child was crying.
  error: '*A three-years-old child was crying.*'
  explanation: 'In compound adjectives with numbers, the measurement noun remains singular: ''three-year-old'' (not ''three-years-old'').
    This is a spelling rule that even advanced learners get wrong.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Adjectives formed by combining two or more words, usually hyphenated, that function as a single modifier before
  a noun.
