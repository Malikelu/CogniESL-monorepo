sub_rules:
- examples:
  - a well-known fact
  - a short-lived trend
  - a ready-made meal
  rule: 'Adjective + past participle: well-known, well-established, short-lived, ready-made'
  type: grammatical
- examples:
  - a long-lasting impression
  - a far-reaching decision
  - an eye-catching design
  rule: 'Adjective + present participle: good-looking, long-lasting, far-reaching, eye-catching'
  type: grammatical
- examples:
  - home-made bread
  - sun-dried tomatoes
  - a hand-made gift
  rule: 'Noun + past participle: home-made, sun-dried, hand-made, tongue-tied'
  type: grammatical
- examples:
  - ice-cold water
  - a dirt-cheap flight
  - a world-famous landmark
  rule: 'Noun + adjective: ice-cold, dirt-cheap, world-famous, blood-red'
  type: grammatical
- examples:
  - a well-behaved child
  - an ill-advised investment
  - a badly-dressed man
  rule: 'Adverb + past participle (where the adverb is not -ly): well-behaved, badly-dressed, ill-advised'
  type: grammatical
- examples:
  - a recently published article
  - a poorly constructed argument
  - a highly respected professor
  rule: 'No hyphen after an adverb ending in -ly: a newly built house, a beautifully designed garden'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Give students a list of compound adjectives and have them sort by pattern type (adj+pp, noun+adj, etc.).
    duration: 10
    name: Compound Adjective Sort
  - adaptation_notes: Students describe a product using at least five compound adjectives, practising hyphenation and stress.
    duration: 15
    name: Product Pitch
  - adaptation_notes: Students find and correct missing or incorrect hyphens in a text.
    duration: 10
    name: Hyphen Hunt
  tips:
  - Teach compound adjectives by pattern type (adj+pp, noun+pp, etc.) rather than as a random list.
  - 'Highlight the hyphenation rule: hyphenate before the noun, not after (a well-known author vs. the author is well known).'
  - Use real product descriptions and reviews as authentic material.
  - Practice converting compound adjectives to predicative position and back.
  - 'Swan PEU: Compound adjectives are formed from two or more words: ''a well-known actor,'' ''a part-time job,'' ''a home-made
    cake,'' ''a good-looking man.'' When formed with a number, the noun is singular: ''a five-year plan'' (not ''five-years'').'
  - 'Swan PEU: Common patterns include: noun + past participle (hand-made, home-grown), adjective + noun + -ed (blue-eyed,
    short-sighted), adjective + present participle (easy-going, good-looking), adverb + past participle (well-known, much-loved).
    Hyphenate when the compound comes before the noun: ''a well-known fact'' but ''the fact is well known.'''
  - 'Swan PEU: Warning — do NOT hyphenate when the compound comes after the noun. ''She is well known'' (no hyphen after verb).
    ''A home-made cake'' (hyphen before noun). This is a common error and one of the most visible mistakes in writing.'
title: Compound Adjectives (General)
use:
- context: Describing people and personalities
  description: Compound adjectives efficiently convey character traits and personal qualities.
  examples:
  - She is a strong-willed, quick-thinking woman.
  - He is a mild-mannered, soft-spoken gentleman.
- context: Product and service descriptions
  description: Marketing and reviews use compound adjectives for vivid, compact descriptions.
  examples:
  - This is a top-of-the-range, state-of-the-art laptop.
  - We offer a cost-effective, long-term solution.
- context: Professional and academic writing
  description: Compound adjectives allow precise, formal description in reports and papers.
  examples:
  - The study used a well-established, peer-reviewed methodology.
  - This is a little-known but highly significant historical event.
- context: Everyday conversation
  description: Common compound adjectives appear frequently in casual speech.
  examples:
  - That was a once-in-a-lifetime experience.
  - He told a laugh-out-loud funny story.
