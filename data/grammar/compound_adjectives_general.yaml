grammar_point: compound_adjectives_general
level: B2
meaning:
  ccqs:
  - answer: Yes, it is a compound adjective.
    question: Is this adjective made up of two or more words joined together?
    purpose: 'Tests whether the learner can correctly form and use compound adjectives (CCQ #1).'
  - answer: Yes, hyphenation before the noun is standard.
    question: Is it hyphenated when placed before the noun?
    purpose: 'Tests whether the learner can correctly form and use compound adjectives (CCQ #2).'
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with compound adjectives general and explain
      why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with compound adjectives general.
      Recognizing typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: Compound adj = a well-known author. Separate words = The author is well known. (predicative, no hyphen)
  core_meaning: Compound adjectives combine two or more words into a single descriptive unit that modifies a noun. They are
    typically hyphenated when placed before the noun to avoid ambiguity.
  example_generator:
    contexts:
    - product descriptions
    - character descriptions
    - professional profiles
    - travel writing
    cultural_notes:
    - Hyphenation rules for compound adjectives are a common source of confusion even for native speakers
    - British English tends to hyphenate more conservatively than American English
    min_examples: 5
  timeline: Timeless — compound adjectives describe qualities, not temporal relationships.
phonetics:
- example_generator:
    contexts:
    - spoken descriptions
    - presentations
  l1_issue: Speakers may incorrectly stress the second element or fail to hyphenate in writing.
  note: 'Compound adjectives carry primary stress on the first element: a WELL-known actor, a GOOD-looking design.'
- example_generator:
    contexts:
    - reading aloud
    - editing
  l1_issue: Languages without hyphenation conventions (e.g. Chinese, Japanese) may lead learners to omit hyphens.
  note: The hyphen signals to the reader that the two words function as one unit, preventing misreading.
