description: Moving elements to the beginning of a sentence for emphasis, dramatic
  effect, or stylistic purposes, often triggering subject-auxiliary inversion.
dialectal_variation: []
discourse_notes:
- note: Fronting moves a non-subject element to sentence-initial position for emphasis
    or discourse cohesion, creating marked word order.
form:
  affirmative:
    example_generator:
      contexts:
      - literary narrative
      - formal speech
      - news reporting
      - academic writing
      min_examples: 4
    structure: Negative/Restrictive Adverb + Auxiliary + Subject + Main Verb / Fronted
      Complement + Subject + Verb (no inversion) / Fronted Object + Subject + Verb
      (no inversion)
  negative:
    example_generator:
      contexts:
      - emphatic contrast
      - formal argumentation
      min_examples: 3
    structure: Negative Adverb + Auxiliary + Subject + not + Verb (double negation,
      rare) / Not only + Auxiliary + Subject + Verb + but also...
  questions:
    example_generator:
      contexts:
      - rhetorical questions
      - dramatic speech
      min_examples: 2
    structure: 'Fronting in questions is rare and mostly rhetorical: ''Never have
      you seen such a thing?'''
grammar_point: fronting
level: C1
meaning:
  ccqs:
  - answer: Yes — 'Never have I...', 'Seldom does he...', 'Hardly had she...'
    purpose: Tests whether the learner understands that English can move elements
      to the front of a sentence for emphasis or stylistic effect, often requiring
      inversion.
    question: Does fronting a negative adverb require inversion?
  - answer: Yes — 'A wonderful speaker she was' (no inversion needed, but literary).
    purpose: Tests whether the learner can identify and apply the correct form/meaning
      of this grammar point in context. The question 'Can we front a complement without
      inversion?...' checks conceptual understanding, not just memorization.
    question: Can we front a complement without inversion?
  - answer: Some types are (e.g., 'That I don't know'), but most fronting is formal
      or literary.
    purpose: Tests whether the learner can identify and apply the correct form/meaning
      of this grammar point in context. The question 'Is fronting common in everyday
      conversation?...' checks conceptual understanding, not just memorization.
    question: Is fronting common in everyday conversation?
  - answer: The fronted element is the adverbial phrase 'Only after the war.' Inversion
      is required because 'only' followed by a time expression at the beginning of
      a sentence triggers subject-auxiliary inversion. The auxiliary 'did' moves before
      the subject 'they.' This is different from 'only' in mid-position ('They only
      understood after the war'), which does not trigger inversion.
    purpose: Tests whether the learner understands that 'only' followed by a time/condition
      adverbial at the start of a sentence requires inversion, while 'only' in mid-sentence
      does not. This distinction between fronted 'only' phrases (requiring inversion)
      and mid-sentence 'only' (no inversion) is a common source of errors in formal
      writing and is essential for C1-level accuracy.
    question: '"Only after the war did they understand the cost." What is the fronted
      element, and why is inversion required?'
  contrast: 'Normal: ''I have never seen such a beautiful sunset.'' / Fronted: ''Never
    have I seen such a beautiful sunset.'' — The fronted version is more dramatic
    and emphatic.'
  core_meaning: Fronting is the movement of an element (adverbial, complement, or
    object) from its normal position to the beginning of the sentence for emphasis
    or dramatic effect. When negative or restrictive adverbs are fronted, subject-auxiliary
    inversion is required. Fronting of complements and objects does not always require
    inversion but creates a literary or dramatic tone.
  example_generator:
    contexts:
    - literary prose
    - formal speeches
    - news reporting
    - academic writing
    - everyday emphasis
    cultural_notes:
    - Fronting with inversion is a hallmark of formal British English. In American
      English, it is less common in speech but still appears in writing and formal
      contexts.
    min_examples: 5
  timeline: Applicable across all tenses; the auxiliary used in inversion matches
    the tense of the original sentence.
phonetics:
- example_generator:
    contexts:
    - stress patterns in negative fronting
  l1_issue: Speakers from languages without inversion (e.g., Korean, Turkish) may
    produce '*Never I have seen...' — the inversion rule must be explicitly taught.
  note: 'Fronted negative adverbs carry strong stress, and the inverted auxiliary
    is typically unstressed: ''NEVER have I...'', ''HARDLY had she...'''
- example_generator:
    contexts:
    - pausing and intonation after fronted elements
  l1_issue: Learners may run the fronted element into the clause without a pause,
    losing the dramatic effect.
  note: A slight pause (comma intonation) typically follows the fronted element before
    the inverted clause.
register_notes:
- note: 'Biber et al. (2021) — Fronting (preposing): distribution varies by register.
    More common in conversation and fiction; rare in academic prose. Fronted adverbials
    are more common than fronted objects. Ch. 11.2.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 11.2.1
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
