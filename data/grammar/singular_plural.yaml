description: The distinction between one (singular) and more than one (plural) noun, including regular and irregular forms.
dialectal_variation:
- note: 'Some nouns differ: BrE ''accommodation'' (uncountable), AmE ''accommodations'' (countable).'
discourse_notes:
- note: 'Singular/plural affects agreement: ''The book is...'' vs ''The books are...'''
form:
  affirmative:
    example_generator:
      contexts:
      - classroom
      - home
      - food
      - animals
      min_examples: 5
    structure: 'Singular: base noun (a book, an apple)

      Plural regular: noun + -s (books, apples)

      Plural -es: noun ending in s/sh/ch/x + -es (boxes, watches)

      Plural -ies: consonant + y → -ies (city → cities, baby → babies)

      Plural -ves: f/fe → -ves (knife → knives, leaf → leaves)

      Irregular: (man → men, child → children, person → people)

      '
  negative:
    example_generator:
      contexts: []
      min_examples: 0
    structure: Not applicable — singular/plural is a noun property, not a verb form.
  questions:
    example_generator:
      contexts:
      - identification exercises
      min_examples: 3
    structure: Is it singular or plural? How do you know?
grammar_point: singular_plural
level: A1
meaning:
  ccqs:
  - answer: Depends on the noun form.
    purpose: Tests whether the learner can distinguish between singular (one) and plural (more than one) nouns. This is a
      fundamental concept because English requires explicit plural marking on nouns.
    question: Is there one or more than one?
  - answer: Usually, but not always (e.g., children, men).
    purpose: Tests whether the learner knows that most plural nouns end in -s, but there are important exceptions (irregular
      plurals). This is important because irregular plurals like "children" and "men" are very common and must be memorized.
    question: Does the noun end in -s?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with singular plural and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''She has two children.'' ''Child'' has an irregular plural: children (not *childs).'
    purpose: 'Tests whether the learner knows irregular plural forms: child→children, person→people, etc. (Swan PEU 2016,
      entries 106-110).'
    question: Which is correct? *'She has two childs' or 'She has two children'?
  contrast: '''Singular'' = "one book" (just one)

    ''Plural'' = "two books" (more than one)

    '
  core_meaning: Singular = one item. Plural = more than one item. The form of the noun changes to show quantity.
  example_generator:
    contexts:
    - classroom objects
    - family members
    - animals
    - food items
    - everyday objects
    cultural_notes:
    - Some languages don't distinguish singular/plural — be explicit about the concept
    min_examples: 5
  timeline: Timeless — applies to all tenses.
phonetics:
- example_generator:
    contexts:
    - pronunciation drills
  l1_issue: Many L1 speakers struggle with /ɪz/ after sibilants (boxes, watches)
  note: 'Plural -s pronunciation: /s/, /z/, or /ɪz/'
register_notes:
- note: Singular/plural distinctions are consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Number marking (singular/plural): interacts with register through noun type distribution. Academic
    prose uses more non-count nouns (no plural); conversation uses more count nouns. Ch. 4.4, 8.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 4.4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 16: Reference and Possession'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - book → books
  - table → tables
  - pen → pens
  rule: 'Regular plural: add -s'
  type: spelling
- examples:
  - box → boxes
  - watch → watches
  - bus → buses
  rule: Add -es after s, sh, ch, x, z
  type: spelling
- examples:
  - city → cities
  - baby → babies
  - story → stories
  rule: Consonant + y → -ies
  type: spelling
- examples:
  - boy → boys
  - key → keys
  - day → days
  rule: Vowel + y → -ys (not -ies)
  type: spelling
- examples:
  - knife → knives
  - leaf → leaves
  - wife → wives
  rule: f/fe → -ves
  type: spelling
- examples:
  - man → men
  - woman → women
  - child → children
  - foot → feet
  - tooth → teeth
  - mouse → mice
  rule: Irregular plurals
  type: irregular
- examples:
  - sheep → sheep
  - fish → fish
  - deer → deer
  rule: Same singular and plural
  type: irregular
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: Teacher describes a scene, students draw and label with correct plural forms.
    duration: 10
    name: Picture Dictation
  - adaptation_notes: Students practice buying items using singular and plural forms.
    duration: 15
    name: Shopping Role Play
  tips:
  - Use real objects (realia) for concrete examples
  - Highlight irregular plurals explicitly — they must be memorized
  - Use picture dictation for practice
  - 'Swan PEU: Singular vs. plural nouns. Irregular plurals: children, feet, teeth, mice, men, women. Uncountable nouns with
    no plural: information, furniture, advice. ''-s'' ending but uncountable: news, mathematics, physics.'
title: Singular and Plural Nouns
use:
- context: Counting and quantifying
  description: Using numbers and quantifiers with nouns
  examples:
  - I have two cats.
  - There are many people in the room.
- context: Describing people and things
  description: Using adjectives with singular and plural nouns
  examples:
  - A big house.
  - Three small children.
- context: Shopping and commerce
  description: Buying and selling items
  examples:
  - I'd like three apples, please.
  - How much are these shoes?
