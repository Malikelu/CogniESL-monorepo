common_errors:
- correction: She is taller than her brother.
  error: '*She is more tall than her brother.*'
  explanation: One-syllable adjectives form comparatives with '-er', not 'more'. L1s that use a separate word for comparison
    (Portuguese 'mais', Spanish 'mas') often transfer this pattern to all adjectives indiscriminately.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Vietnamese
  reliability: D
- correction: This car is more expensive than the other one.
  error: '*This car is more expensive that the other one.*'
  explanation: '''Than'' (not ''that'') follows comparative adjectives. The error comes from confusing the conjunction ''that''
    with the comparative particle ''than''. This error is particularly common because the two words are sometimes pronounced
    the same way.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: He runs faster than me.
  error: '*He runs more faster than me.*'
  explanation: 'Double comparative: ''more'' + ''-er''. Only one comparative marker is needed. One-syllable adjectives and
    adverbs take ''-er'', not ''more''. The redundancy reflects uncertainty about the correct form.'
  l1_groups:
  - Portuguese
  - Spanish
  - Arabic
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Comparatives'
- correction: I am better at maths than at English.
  error: '*I am more better at maths than at English.*'
  explanation: '''Better'' is already the comparative form of ''good''. Adding ''more'' creates a double comparative. Irregular
    comparatives must be memorized as they do not follow the standard -er/more pattern. This error occurs across all L1 backgrounds.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Comparatives'
- correction: My house is bigger than yours.
  error: '*My house is biger than yours.*'
  explanation: 'Spelling error: one-syllable adjectives ending in consonant-vowel-consonant double the final consonant before
    ''-er'' (big → bigger). Learners may know the -er rule but not the spelling changes that accompany specific word endings.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: D
description: Structures used to compare two things, people, or situations, showing that one has more or less of a quality
  than the other.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - comparing people
      - comparing objects
      - comparing places
      min_examples: 4
    structure: 'Short adjectives (1 syllable): adjective + -er + than: ''taller than'', ''faster than'', ''bigger than''.
      Long adjectives (2+ syllables): more/less + adjective + than: ''more interesting than'', ''less expensive than''.'
  negative:
    example_generator:
      contexts:
      - saying something is less
      - softening comparisons
      - expressing equality
      min_examples: 4
    structure: 'not as + adjective + as: ''not as tall as'', ''not as expensive as''. This expresses that one thing has less
      of a quality.'
  questions:
    example_generator:
      contexts:
      - asking for comparisons
      - quizzes
      - finding information
      min_examples: 4
    structure: 'Which + be + comparative?: ''Which is bigger?'' / Be + subject + comparative + than...?: ''Is London bigger
      than Paris?'' / How + adjective + be + subject?: ''How tall is he?'''
grammar_point: comparatives
level: A2
meaning:
  ccqs:
  - answer: Yes — the comparative is used to show the difference between two items.
    question: Are we comparing two things?
    purpose: Tests whether the learner understands that comparatives are used to show the difference between exactly two items.
  - answer: Yes — the comparative shows which has more or less of a quality.
    purpose: Tests whether the learner understands that comparatives show which of two items has more or less of a quality.
    question: Is one thing more/less than the other?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify and correct the double comparative error (more + -er).
    question: What is the difference in meaning between these two forms?
  - answer: '"She is taller than me." Double comparatives (more + -er) are incorrect. Use either more + adjective (for long
      adjectives) or adjective + -er (for short adjectives), never both.'
    purpose: Tests whether the learner can distinguish between comparative and superlative forms and use the correct one for
      comparing two items.
    question: 'Which is correct: "She is more taller than me" or "She is taller than me"?'
  contrast: 'Positive (no comparison): "This book is interesting."

    Comparative: "This book is more interesting than that one."

    Superlative: "This is the most interesting book I have ever read."

    '
  core_meaning: Comparatives are used to compare two things and show the difference between them. They indicate that one thing
    has more, less, or a greater degree of a quality than the other. Comparatives are formed by adding '-er' to short adjectives
    or using 'more/less' before longer adjectives.
  example_generator:
    contexts:
    - shopping and prices
    - describing people
    - comparing places
    - sports and competitions
    - opinions and preferences
    cultural_notes:
    - Direct comparisons can be considered impolite in some cultures — soften with 'a bit' or 'slightly'
    - In some languages, comparison is expressed differently (e.g., 'more big' instead of 'bigger')
    min_examples: 5
  timeline: Timeless — comparatives can be used in any tense.
phonetics:
- example_generator:
    contexts:
    - natural conversation
    - shopping
  l1_issue: Speakers whose L1 uses 'more + adjective' for all comparisons (e.g., Spanish 'mas grande') may say 'more big'
    instead of 'bigger'.
  note: 'The ''-er'' ending is pronounced as a schwa /ə/ in connected speech: ''taller'' /tɔːlə/. ''Than'' is pronounced with
    a weak form /ðən/. Stress falls on the adjective, not the ending: ''more ex''PENsive''.'
register_notes:
- note: 'Biber et al. (2021) — Inflectional comparison (-er/-est) vs. phrasal comparison (more/most): distribution varies
    by register and adjective length. Academic prose uses more phrasal comparison. Ch. 7.7.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.7.3
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - tall → taller
  - fast → faster
  - cheap → cheaper
  - old → older
  - young → younger
  rule: 'One-syllable adjectives: add -er'
  type: spelling
- examples:
  - nice → nicer
  - safe → safer
  - large → larger
  - late → later
  rule: 'One-syllable adjectives ending in -e: add -r'
  type: spelling
- examples:
  - big → bigger
  - hot → hotter
  - thin → thinner
  - fat → fatter
  rule: 'One-syllable adjectives ending in consonant-vowel-consonant: double the consonant and add -er'
  type: spelling
- examples:
  - happy → happier
  - easy → easier
  - busy → busier
  - early → earlier
  rule: 'Two-syllable adjectives ending in -y: change y to i and add -er'
  type: spelling
- examples:
  - beautiful → more beautiful
  - expensive → more expensive
  - interesting → more interesting
  - comfortable → more comfortable
  rule: 'Adjectives with 2+ syllables (not ending in -y): use more/less'
  type: grammatical
- examples:
  - good → better
  - bad → worse
  - far → further/farther
  - little → less
  - much/many → more
  rule: Irregular comparatives
  type: irregular
- examples:
  - much taller (a big difference)
  - a bit taller (a small difference)
  - slightly more expensive
  - far more interesting
  rule: 'Modifiers with comparatives: much, a lot, a bit, slightly, far'
  type: grammatical
teaching:
  methodology: PPP with visual comparison
  recommended_activities:
  - adaptation_notes: 'Students compare people in the class: ''Maria is taller than Ahmed.'' Use real students for engagement.'
    duration: 10
    name: Classroom comparisons
  - adaptation_notes: 'Show pictures of products with prices. Students compare: ''The blue shirt is cheaper than the red one.'''
    duration: 15
    name: Shopping comparison
  - adaptation_notes: Give students base adjectives and have them write the comparative form as quickly as possible. Include
      spelling changes.
    duration: 10
    name: Comparative spelling race
  - adaptation_notes: Students compare two cities or countries using a table of information (population, size, temperature,
      etc.).
    duration: 15
    name: City/Country comparison
  tips:
  - 'Parrott (2000): Parrott (2000) Ch. 6: Comparatives are more complex in English than in many languages. Long adj: more/most.
    Short adj: -er/-est. Irregular: good/better/best. Than + clause. Double comparative error (more bigger) from applying
    two strategies. Not all languages distinguish comparatives from superlatives.'
  - 'CGEL Ch. 5: CGEL analyzes comparatives as degree expressions that can function as modifier (more expensive), complement
    (We need more), or fused head (More is better). The than-phrase is a comparative complement, not an adjunct.'
  - Use real objects, pictures, or people in the classroom to make comparisons tangible.
  - Teach the spelling rules explicitly — provide a clear chart of -er vs. more.
  - Practice irregular comparatives (good/better, bad/worse) early as they are very common.
  - Use 'much/a bit/slightly + comparative' to teach degrees of difference.
  - 'Swan PEU: Comparative forms — one-syllable adjectives: -er (taller, faster). Two+ syllables: more + adj (more beautiful).
    Irregular: good/better, bad/worse, far/further. Two-syllable adjectives ending in -y: easy/easier, happy/happier.'
  - 'Swan PEU: ''Than'' after comparatives — ''She is taller than me'' (informal) / ''taller than I'' (formal). ''Than'' can
    be followed by a clause: ''It cost more than I expected.'''
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 13: CGEL (Ch.13) analyzes ''than'' as a preposition
    (taking NP complement: ''taller than me'') or complementizer (taking clause: ''taller than I am''). Both ''than me'' and
    ''than I am'' are standard — CGEL explicitly rejects the prescriptive claim that ''than me'' is incorrect. Double comparatives
    (*''more taller'') occur because learners apply two comparative strategies simultaneously (synthetic -er + analytical
    more).'
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle. Ch. 20: GB3 Ch. 20 identifies
    discourse functions of comparatives: ARGUMENTATION ''Option A is better than Option B,'' POLITENESS ''I''d rather stay''
    (less direct demand), DEGREE BOOSTING ''far better, much worse, slightly better'' (degree modification of comparatives).
    The double comparative (*''more taller'') results from applying two comparative strategies simultaneously: syntactic -er
    + analytical more.'
title: Comparatives
use:
- description: Used to compare physical appearance, abilities, or personality.
  examples:
  - My brother is taller than me.
  - She is more outgoing than her sister.
  - He is a better swimmer than I am.
  key_point: Very common in everyday conversation.
  name: Comparing people
- description: Used when shopping or choosing between options.
  examples:
  - This phone is cheaper than that one.
  - The red dress is more beautiful than the blue one.
  - This car is less expensive to run.
  key_point: Essential for shopping and making decisions.
  name: Comparing things and products
- description: Used to compare cities, countries, or locations.
  examples:
  - London is bigger than Edinburgh.
  - Spain is warmer than England.
  - The countryside is more peaceful than the city.
  key_point: Common in travel discussions and geography.
  name: Comparing places
- description: Used to give opinions about which thing is better or worse.
  examples:
  - I think this film is better than the last one.
  - Coffee is more popular than tea in my country.
  - Winter is less enjoyable than summer.
  key_point: Softens opinions by framing them as comparisons.
  name: Expressing opinions and preferences
