  error: '*I have just arrived yesterday.*'
  explanation: Just cannot be used with specific past time.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
description: Using present perfect with just to talk about actions that have just been completed.
dialectal_variation: []
discourse_notes:
- note: In conversation, this structure is used for everyday communication and is among the most frequent patterns in spoken
    English.
- note: In academic writing, this structure appears in discussions of established knowledge, methodology, and findings.
- note: In news reports, this structure is used for reporting events and attributing statements.
form:
  affirmative:
    example_generator:
      contexts:
      - arrivals and departures
      - completed actions
      - news and announcements
      min_examples: 4
    structure: 'Subject + have/has + just + past participle: I have just arrived. / She has just finished.'
  negative:
    example_generator:
      contexts:
      - arrivals and departures
      - completed actions
      - news and announcements
      min_examples: 4
    structure: 'Subject + have/has + not + yet: I have not finished yet.'
  questions:
    example_generator:
      contexts:
      - arrivals and departures
      - completed actions
      - news and announcements
      min_examples: 4
    structure: 'Have/Has + subject + just + past participle?: Have you just arrived?'
grammar_point: present_perfect_recent
level: B1
meaning:
  ccqs:
  - answer: Yes, it is very recent.
    purpose: Tests whether the learner understands a key concept of present_perfect_recent. This is fundamental for correct
      use of this grammar point.
    question: Did this happen moments ago?
  - answer: Yes — just is commonly used with the present perfect to emphasize that something happened very recently.
    purpose: Tests whether the learner understands a key concept of present_perfect_recent. This is fundamental for correct
      use of this grammar point.
    question: Is just used?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with present perfect recent and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I have just seen him.'' After ''have/has'', use the past participle (seen), NOT the past tense (saw).'
    purpose: Tests whether the learner uses past participle (not past tense) with present perfect and 'just' (Swan PEU 2016,
      entry 47.3).
    question: Which is correct? *'I have just saw him' or 'I have just seen him'?
  contrast: Recent past = I have just arrived. (moments ago) vs Past simple = I arrived an hour ago. (specific time)
  core_meaning: Actions that have just finished — very recent past with present relevance. Usually with just.
  example_generator:
    contexts:
    - arrivals and departures
    - completed actions
    - news and announcements
    cultural_notes: []
    min_examples: 5
  timeline: Just now — moments before speaking.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Many L1 speakers use present simple when present perfect is needed.
  note: Stress on just for emphasis
register_notes:
- note: 'Biber et al. (2021) — Present perfect for recent events (''I have just arrived''): more common in conversation and
    news. Academic prose rarely uses perfect for recent events. Ch. 6.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.3
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 7: Perfect Aspect-7.5'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I have just eaten.
  - She has just left.
  rule: Just goes between have/has and the past participle
  type: word_order
- examples:
  - I have already done it.
  - Have you finished yet?
  rule: Also used with already and yet
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students report recent events using have just.
    duration: 10
    name: News Reporter
  tips:
  - Use real classroom events
  - Practice with just, already, yet
  - Contrast with past simple using timelines
  - 'Swan PEU: Recent events — ''I''ve just finished.'' ''She''s already left.'' ''Have you eaten yet?'' The present perfect
    emphasizes the present relevance of a recent past action. NOT with specific past time markers.'
  - 'GB3 Ch. 7: Recent completion with ''just'' — ''Don has just finished his homework.'' Just signals recent completion with
    present perfect. Note: American English also permits simple past with just (''Don just finished''), unlike BrE which requires
    present perfect. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.2 and §7.4 (AmE/BrE difference).'
title: Present Perfect of Recent Past
use:
- context: Arrivals and departures
  description: Talking about very recent events
  examples:
  - I have just arrived at the airport.
  - She has just left the office.
- context: Completed actions
  description: Reporting something that just finished
  examples:
  - I have just finished my homework.
  - We have just heard the news.
