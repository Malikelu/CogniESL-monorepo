description: Phrase used to express polite desires, preferences, or make polite requests (more formal than 'want').
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - travel and places
      min_examples: 4
    structure: Subject + would like (I'd like) + noun/to + base verb
  negative:
    example_generator:
      contexts:
      - food and daily routines
      - weather and nature
      min_examples: 4
    structure: Subject + wouldn't like + noun/to + base verb
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: Would + subject + like + noun/to + base verb?
grammar_point: would_like
level: A2
meaning:
  ccqs:
  - answer: Would like is more polite and formal than want.
    purpose: Tests whether the learner understands a key concept of would_like. This is fundamental for correct use of this
      grammar point.
    question: Can you explain the difference between would like and want by giving an example of when to use each?
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that would like is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with would like and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I would like to go to the cinema.'' ''Would like'' takes the to-infinitive, not the -ing form.'
    purpose: Tests whether the learner knows that 'would like' is followed by to-infinitive, not -ing (Swan PEU 2016).
    question: Which is correct? *'I would like going to the cinema' or 'I would like to go to the cinema'?
  contrast: 'Would like = Polite desire/request: "I''d like a coffee" (polite)

    Want = Casual desire: "I want a coffee" (casual)

    Would like to = Future plan: "I''d like to visit Rome" (plan)

    '
  core_meaning: Expresses polite desires, preferences, or requests; more formal and polite than 'want'.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Refers to present desires or future plans; never used for past desires (used 'wanted' instead).
phonetics:
- example_generator:
    contexts:
    - would like contraction
  l1_issue: Learners may not recognize 'I'd like' in listening. Teach the contraction as the standard form for offers and
    requests.
  note: 'Would like is often contracted: ''I''d like'' /aɪd laɪk/, ''She''d like'' /ʃiːd laɪk/. The contraction is very common
    in offers and requests.'
register_notes:
- note: 'Biber et al. (2021) — ''Would like'' (polite desire): conversational preference for polite expression of desire.
    Academic prose uses more explicit desiderative expressions. Ch. 6.6'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I would like to go
  - She would like to study
  - They would like to visit
  rule: Would like + to + base verb (more polite than want)
  type: grammatical
- examples:
  - I would like some coffee
  - She would like a new car
  - They would like more information
  rule: Would like + noun
  type: grammatical
- examples:
  - Would you like some tea (offer)
  - Would you like to come to dinner (invitation)
  - Would you like me to help (offer of assistance)
  rule: Would you like...? is used for offers and invitations
  type: pragmatic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students practice making polite requests: ''I would like some water, please.'' ''Would you like to
      sit down?'''
    duration: 10
    name: Polite Requests
  - adaptation_notes: 'Students role-play ordering food: ''I would like the pasta.'' ''Would you like anything to drink?'''
    duration: 15
    name: Restaurant Role Play
  tips:
  - 'Use restaurant scenarios: ''I would like a burger, please''.'
  - 'Role-play: Student orders food using ''would like''.'
  - 'Contrast with ''want'' using casual vs formal settings: ''I want a coffee'' (casual) vs ''I would like a coffee'' (formal).'
  - 'Practice invitations: ''Would you like to...?'''
  - 'Swan PEU: ''Would like'' = polite form of ''want.'' ''I would like a coffee'' is more polite than ''I want a coffee.''
    Use with to-infinitive for actions: ''I would like to book a room.'' NOT ''I would like that you come.'''
title: Would like (polite desires, requests)
use:
- description: Make polite requests for items or services.
  examples:
  - I would like the menu, please.
  - We would like to book a table.
  key_point: More polite than 'I want'.
  name: Polite Requests
- description: Express what you want in a polite way.
  examples:
  - I would like a new phone.
  - She would like to learn Spanish.
  key_point: Shows good manners in formal settings.
  name: Polite Desires
- description: Politely invite someone to do something.
  examples:
  - Would you like to come to my party?
  - Would you like to join us for dinner?
  key_point: More polite than 'Do you want to come?'
  name: Invitations
