citations:
- claim: 'Core meaning: Have got is an informal alternative to have used to express possession, relationships, characteristics, and obligation'
  flagged: false
  reliability: B
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  tier: 2
- claim: 'Register distribution: Have got is strongly conversational (especially British English); academic prose prefers simple have.'
  flagged: false
  reliability: B
  source: Biber et al. (1999) Grammar of Spoken and Written English. Ch. 5.2.1
  tier: 2
- claim: 'Discourse function: In conversation, have got is the default form for expressing possession in spoken British English.'
  flagged: false
  reliability: B
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  tier: 2
- claim: Common error '*I have got a car since 2020.*' for Portuguese, Spanish, Chinese speakers
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  tier: 1
common_errors:
- correction: I have had a car since 2020.
  error: '*I have got a car since 2020.*'
  explanation: '''Have got'' is present tense only and cannot be used with ''since'' to express duration. For possession continuing from past to present, use ''have had'' (present perfect).'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Have got vs present perfect'
- correction: Did you have any questions yesterday?
  error: '*Had you got any questions yesterday?*'
  explanation: '''Have got'' has no standard past form. For past tense questions about possession, use ''did you have''. Using ''had got'' is non-standard and considered incorrect in most formal contexts.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Have got — no past form'
- correction: She hasn't got time to meet.
  error: '*She hasn''t got a time to meet.*'
  explanation: '''Time'' in the sense of ''available time'' is uncountable and does not take the indefinite article ''a''. ''I have no time'' / ''I haven''t got time'' -- no article before ''time'' in this
    sense.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Articles'
- correction: I have got to go now.
  error: '*I have got to going now.* (confusion of forms)'
  explanation: '''Have got to'' (obligation) is followed by the base verb, not ''-ing''. Some learners confuse this with ''I am going to go'' or other future/obligation structures, producing a hybrid that
    doesn''t exist.'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Have got to + base verb'
description: The use of 'have got' as an alternative to 'have' for possession, obligation, and relationships, particularly in British English.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - describing possessions
      - talking about family
      - describing health
      - everyday situations
      min_examples: 4
    structure: 'Subject + have/has + got + noun phrase: ''I''ve got a new phone.'' / ''She''s got two brothers.'' / ''We''ve got a problem.'''
  negative:
    example_generator:
      contexts:
      - lacking possessions
      - absence of something
      - health symptoms
      min_examples: 3
    structure: 'Subject + haven''t/hasn''t + got + noun phrase: ''I haven''t got any money.'' / ''She hasn''t got a car.'' / ''We haven''t got time.'''
  questions:
    example_generator:
      contexts:
      - asking about possession
      - checking availability
      - health enquiries
      min_examples: 3
    structure: 'Have/Has + Subject + got + noun phrase?: ''Have you got a pen?'' / ''Has she got any children?'' / ''Have they got the tickets?'''
grammar_point: have_got
level: A2
meaning:
  ccqs:
  - answer: '''Yes, for possession and relationships — I''ve got a sister'' = ''I have a sister''.'
    purpose: Tests whether the learner understands the difference between 'have' and 'have got' for possession, and that 'have got' is present tense only with no past form.
    question: '''Is ''I''ve got'' the same as ''I have''?'''
  - answer: '''Not in standard English. Use ''I had'' for the past: ''I had a car when I was younger.'''
    purpose: Tests whether the learner understands the time reference of the situation. Correct temporal identification is essential for selecting the right grammatical structure.
    question: '''Can we say ''I had got'' for the past?'''
  - answer: '''Informal. In formal writing, use ''have'' without ''got''.'''
    purpose: Tests whether the learner understands the register difference between 'have' and 'have got' — 'have got' is conversational and informal, while 'have' is neutral and works in all registers.
    question: '''Is ''have got'' formal or informal?'''
  - answer: '''I must finish this today.'' ''Have got to'' expresses strong obligation or necessity, similar to ''must.'' It does not express possibility like ''might.'''
    purpose: Tests whether the learner understands the 'have got to' obligation structure as distinct from 'have got' for possession. 'Have got to + verb' (necessity) is grammatically and semantically different
      from 'have got + noun' (possession).
    question: '"I have got to finish this today" means the same as which modal: "I might finish this today" or "I must finish this today"?'
  contrast: 'Formal: ''I have a car.'' / Informal: ''I''ve got a car.'' — Same meaning, but ''have got'' is more common in spoken British English.'
  core_meaning: '''Have got'' is an informal alternative to ''have'' used to express possession, relationships, characteristics, and (in some contexts) obligation. It is extremely common in British English
    and increasingly common in spoken American English. The form is fixed: ''have/has + got'' (present only — there is no past form ''*had got'' in standard usage; ''had'' is used instead).'
  example_generator:
    contexts:
    - describing possessions
    - talking about family
    - describing symptoms
    - everyday conversation
    - informal writing
    cultural_notes:
    - '''Have got'' is far more common in British English than American English. In American English, ''have'' or ''got'' alone is more typical: ''I have a car'' or ''I got a car'' (informal).'
    min_examples: 5
  timeline: Present tense only. 'Have got' refers to current possession or state. For the past, use 'had' (not '*had got'). For the future, use 'will have' (not '*will have got').
phonetics:
- example_generator:
  - contexts:
    - connected speech with have got
  l1_issue: Learners may over-pronounce 'have' as /hæv/ instead of the weak form /əv/ or /v/, making their speech sound unnatural.
  note: 'In connected speech, ''have got'' is almost always contracted: /v gɒt/ or /əv gɒt/. The full form ''I have got'' sounds stilted.'
- example_generator:
  - contexts:
    - stress patterns in have got
  l1_issue: 'Learners may stress ''got'' too heavily: *''I''ve GOT a car'' instead of ''I''ve got a CAR''.'
  note: '''Got'' in ''have got'' is typically unstressed: ''I''ve GOT a car'' (stress on the object, not on ''got'').'
- example_generator:
  - contexts:
    - stress in negative have got
  l1_issue: Learners may struggle with the interaction between negation and stress placement.
  note: 'In negatives, the stress pattern shifts: ''I haven''t got ANY money'' (stress on ''any'').'
register_notes:
- note: 'Biber et al. (1999) — ''Have got'' vs. ''have'': register distribution shows ''have got'' is strongly conversational (especially British English); academic prose prefers simple ''have''. Ch. 5.2.1'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 5.2.1
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I've got a new laptop.
  - She's got a beautiful garden.
  - They've got three children.
  - We've got everything we need.
  rule: Have got for possession
  type: grammatical
- examples:
  - I've got two sisters and a brother.
  - She's got a lot of friends in London.
  - Have you got any family nearby?
  rule: Have got for relationships
  type: grammatical
- examples:
  - He's got blue eyes and dark hair.
  - She's got a lovely smile.
  - You've got a terrible cold — you should see a doctor.
  rule: Have got for characteristics
  type: grammatical
- examples:
  - I've got to go now — I'm late for work.
  - She's got to finish the report by Friday.
  - We've got to be there by six.
  rule: Have got to for obligation (informal)
  type: grammatical
- examples:
  - I've got (not 'I have got' — sounds unnatural in casual speech)
  - She's got (not 'She has got')
  - Haven't got / Hasn't got (contractions in negatives are standard)
  rule: Contractions are almost always used in speech
  type: phonological
teaching:
  methodology: PPP (Presentation, Practice, Production)
  recommended_activities:
  - adaptation_notes: 'Show a picture of a person. Students describe them using ''has got'': ''He''s got brown hair. He''s got a beard. He''s got blue eyes.'''
    duration: 15
    name: Picture Description
  - adaptation_notes: 'Students mingle and ask each other ''Have you got...?'' questions: ''Have you got a pet? Have you got any brothers or sisters?'' They report back to the class.'
    duration: 20
    name: Classroom Survey
  - adaptation_notes: 'Students fill a bingo grid with items (a red car, a big house, a pet cat, etc.). The teacher describes people: ''She''s got a pet cat.'' Students cross off matching items.'
    duration: 15
    name: Have Got Bingo
  - adaptation_notes: 'Students take turns saying what they''ve got to do today: ''I''ve got to go to work.'' Next student: ''She''s got to go to work, and I''ve got to do the shopping.'' Builds memory
      and grammar practice.'
    duration: 15
    name: Obligation Chain
  tips:
  - Introduce 'have got' early (A2) as it is extremely common in spoken English.
  - Emphasise that it is present tense only — no past form '*had got'.
  - 'Teach the contraction from the start: ''I''ve got'', not ''I have got''.'
  - 'Contrast with ''have'' to show register difference: ''I have a car'' (formal) vs ''I''ve got a car'' (informal).'
  - 'Use visual prompts (pictures of people, objects) for practice: ''Has she got long hair?'''
  - Introduce 'have got to' for obligation separately, as it is a different structure.
  - 'Swan PEU: ''Have got'' (BrE) = ''have'' (both) — ''I''ve got a car'' = ''I have a car.'' In BrE, ''have got'' is more common for possession. In AmE, ''have'' is preferred but ''have got'' is also used
    colloquially.'
  - 'Swan PEU: ''Have got to'' = ''must'' — ''I''ve got to go'' = ''I must go.'' More colloquial than ''must.'' In BrE, both are common; in AmE, ''have to'' is preferred over ''have got to.'''
title: Have Got (I've got, Have you got?, I haven't got)
use:
- context: Everyday conversation
  description: '''Have got'' is the default form for expressing possession in spoken British English.'
  examples:
  - Have you got the time?
  - I've got a headache.
  - We've got loads of food — don't bring anything.
- context: Describing people
  description: Used to describe physical characteristics and personal attributes.
  examples:
  - He's got the most amazing voice.
  - She's got her mother's eyes.
  - You've got paint in your hair!
- context: Health and symptoms
  description: Very common when describing illness or physical conditions.
  examples:
  - I think I've got a cold coming on.
  - She's got a temperature — she's staying home today.
  - Have you got any pain in your chest?
- context: Obligation (have got to)
  description: '''Have got to'' expresses necessity or obligation, similar to ''must'' but more informal.'
  examples:
  - I've got to pick up the kids at three.
  - You've got to see this film — it's brilliant.
  - We haven't got to decide today, have we?
- context: Informal writing
  description: Appropriate in emails, texts, and informal messages, but not in formal writing.
  examples:
  - I've got some news — I'm moving to Edinburgh!
  - Have you got the address? I've lost it.
  - Sorry, I haven't got time to explain now.
