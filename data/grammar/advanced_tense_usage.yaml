      - reported speech
      - complex narratives
      min_examples: 4
    structure: 'Mixed conditional: If + past perfect, would + base verb'
  negative:
    example_generator:
      contexts:
      - negative mixed conditionals
      min_examples: 3
    structure: If + past perfect, would not + base verb
  questions:
    example_generator:
    - Would you be happier now if you had chosen a different career?
    - Would she have passed the exam if she had studied harder?
    structure: Would + subject + base verb/have + past participle if + past perfect/past
      simple?
grammar_point: advanced_tense_usage
level: C1
meaning:
  ccqs:
  - answer: Yes, that is advanced tense usage.
    purpose: Tests whether the learner understands the time reference of the situation.
      Correct temporal identification is essential for selecting the right grammatical
      structure.
    question: Does this sentence mix different time references?
  - answer: Yes, that is a mixed conditional.
    purpose: Tests whether the learner understands the time reference of the situation.
      Correct temporal identification is essential for selecting the right grammatical
      structure.
    question: Is the condition in the past but the result in the present?
  - answer: '"If I had studied harder, I would pass the exam now" is a mixed conditional
      — the past condition affects the present result. "If I studied harder, I would
      pass the exam" is a second conditional about a present or future hypothetical.
      The key difference is the time reference of the condition.

      '
    purpose: Tests whether the learner can identify common errors associated with
      advanced tense usage and explain why they are incorrect.
    question: What is the difference in meaning between "If I had studied harder,
      I would pass the exam now" and "If I studied harder, I would pass the exam"?
  - answer: 'It means she was tired at the time she spoke. The backshift from "is"
      to "was" (after the past tense reporting verb "said") places the tiredness in
      the past. If she is still tired now, a speaker might choose not to backshift:
      "She said she is tired," which implies the situation continues.'
    purpose: Tests whether the learner understands tense harmony (backshift) in reported
      speech and the choice speakers have about whether to backshift. This distinction
      is crucial in advanced English because choosing not to backshift can signal
      that a past statement is still true or relevant in the present.
    question: She said she was tired — does this mean she was tired at the time of
      speaking, or she is still tired now?
  contrast: Basic = If I had money, I would buy a car. vs Advanced = If I had studied
    harder, I would be in a better job now.
  core_meaning: Advanced tense usage involves complex combinations of tenses to express
    subtle meanings, including mixed conditionals (past condition + present result),
    tense harmony in complex sentences, and nuanced temporal relationships.
  example_generator:
    contexts:
    - academic writing
    - formal communication
    - complex narratives
    - hypothetical reasoning
    cultural_notes:
    - Mastery of advanced tense usage distinguishes proficient speakers
    - Errors in tense harmony are common even at advanced levels
    min_examples: 5
  timeline: Varies — can mix past, present, and future references.
phonetics:
- example_generator:
    contexts:
    - temporal reference
  l1_issue: Tense harmony errors are very common — many L1 speakers keep the original
    tense in reported speech
  note: Stress on time reference words (now, then, yesterday) to clarify temporal
    relationships
register_notes:
- note: 'Biber et al. (2021) — Tense and aspect combinations across registers: academic
    prose favors present tense for general validity; fiction prefers past for narrative;
    conversation uses present for immediate context. Modals comprise only 10-15% of
    all finite verb phrases. Ch. 6.2.2, 6.6'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.2.2
