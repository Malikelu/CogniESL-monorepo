grammar_point: verbs_followed_by_bare_infinitive
title: Verbs Followed by Bare Infinitive (make, let, help)
description: Verbs that are followed by base form without 'to'. Essential for accurate verb patterns with causatives and modals.
level: B1
meaning:
  core_meaning: These verbs take the base form (no 'to', no -ing). Causatives (make/let) show cause; modals show ability/permission/obligation.
  timeline: 'Modal verbs don''t show tense (use context): ''I can go'' (present) vs ''I could go'' (past/polite).'
  contrast: '''Make/let'' + base (correct) vs ''make/let'' + to (wrong)

    ''Can/could'' + base (correct) vs ''can'' + to (wrong)

    ''Help'' can take base OR ''to'' (both correct)

    '
  ccqs:
  - question: Which verbs are followed by bare infinitive
    answer: Let, make, help, and modals (can, should, must, etc.).
    purpose: Tests whether the learner understands a key concept of verbs_followed_by_bare_infinitive. This is fundamental
      for correct use of this grammar point.
  - question: Can we use a different structure here with the same meaning?
    answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that verbs followed by bare infinitive is the only appropriate structure
      for this meaning/context.
  - question: What is the difference in meaning between these two forms?
    answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with verbs followed by bare infinitive and explain
      why they are incorrect.
  - question: Which is correct? *'Let me to go' or 'Let me go'?
    answer: '''Let me go.'' After ''let'', use the bare infinitive (no ''to''): let + object + base verb.'
    purpose: Tests whether the learner knows that 'let' takes the bare infinitive (Swan PEU 2016, entry 105.3).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
form:
  affirmative:
    structure: 'Verb + object + base verb: "I made him go."

      Modal verbs + base verb: "I can go."

      Common verbs: make, let, help (also: see, hear, watch, feel)

      Modal verbs: can, could, will, would, shall, should, may, might, must

      '
    example_generator:
      contexts:
      - sports and hobbies
      min_examples: 4
  negative:
    structure: 'Modal + not + base verb: ''I cannot swim.'' Verb + object + not + base verb: ''I made him not go.'''
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
  questions:
    structure: 'Modal verb first: ''Can you swim?'' Verb + object: ''Did you make him go?'''
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
sub_rules:
- rule: Let, make, help followed by bare infinitive (without to)
  type: grammatical
  examples:
  - Let me help you
  - She made him apologize
  - He helped me carry the bags
  - My parents let me stay out late
- rule: All modals (can, should, must, will, would, may, might, could, shall) followed by bare infinitive
  type: grammatical
  examples:
  - I can swim
  - You should study
  - He must leave
  - She will come
  - They might agree
- rule: Had better and would rather are also followed by bare infinitive
  type: grammatical
  examples:
  - You had better study
  - I would rather stay home
  - She had better not be late
use:
- name: Causatives (make, let, have)
  description: Cause someone to do something.
  examples:
  - I made him clean.
  - Let me try.
  - I had him fix it.
  key_point: Make = force; let = allow; have = arrange for (all + base form).
- name: Modals (can, must, should, etc.)
  description: Show ability, permission, obligation, possibility.
  examples:
  - I can swim.
  - You must go.
  - She should try.
  key_point: ALL modals take base form (no 'to', no -ing, no -s).
- name: Perception Verbs (see, hear, watch, feel)
  description: Verbs of sensing + object + base form.
  examples:
  - I saw him leave.
  - She heard him sing.
  - We watched them play.
  key_point: Base form = complete action; -ing = ongoing action.
phonetics:
- note: 'After bare infinitive verbs, the main verb carries the stress: ''Let me HELP you.'' ''She made him apoloGIZE.'' The
    causative verb is less stressed.'
  example_generator:
    contexts:
    - bare infinitive stress
  l1_issue: Learners may add 'to' after these verbs. Teach that let, make, help, and modals are followed by the base verb
    without to.
teaching:
  methodology: PPP
  tips:
  - 'Chant modals: ''can, could, will, would, shall, should, may, might, must'' - all + base form.'
  - 'Practice ''make/let'' with classroom: ''The teacher made us study.'' ''Let''s go!'''
  - 'Show ''see + base'' (complete) vs ''see + -ing'' (ongoing): ''I saw him cross'' vs ''I saw him crossing''.'
  - 'Swan PEU: Let and make + bare infinitive — ''let me go'' (allow), ''make me laugh'' (force/cause). After let/make, do
    NOT use to: ''let her speak'' not ''let her to speak''. In passive, make takes to-inf: ''She was made to wait.'''
  - 'Swan PEU: See/hear/feel + bare infinitive or -ing — ''I saw her cross the whole road'' (complete action) vs ''I saw her
    crossing the road'' (action in progress). Teach the aspect meaning difference.'
  - 'Swan PEU: Have + bare infinitive (causative): ''I had him fix my car'' — speaker arranged/asked, not forced. Different
    from ''make'' which implies force. American English prefers causative ''have'' over ''get''.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 14: CGEL (Ch.14) identifies bare infinitival clauses
    after modals (''She can leave''), do-support (''Did she leave?''), causatives (''She made him leave''), and perception
    verbs (''I saw her leave''). The bare infinitival lacks the ''to'' preposition that introduces to-infinitival clauses.'
  recommended_activities:
  - name: Bare or To
    duration: 10
    adaptation_notes: 'Students choose: ''She made him (to) apologize.'' (bare) ''She wanted him (to) apologize.'' (to).'
  - name: Classroom Commands
    duration: 15
    adaptation_notes: 'Students practice using let and make: ''Let us take a break.'' ''Make your partner repeat the sentence.'''
sources:
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
common_errors:
- error: '*I want that he comes.*'
  correction: I want him to come.
  explanation: Want + person + to + verb.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  source: Swan Entries 100-101. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
  reliability: B
