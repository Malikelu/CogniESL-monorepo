common_errors:
- correction: It was a three-hour journey.
  error: '*It was a three-hours journey.*'
  explanation: 'In compound adjectives with numbers, the unit noun is always singular: ''three-hour'', ''five-mile'', ''ten-year''.
    The number does not make the noun plural within the compound adjective.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  - Arabic
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: She is a twenty-year-old woman.
  error: '*She is a twenty years old woman.*'
  explanation: 'Before a noun, the compound adjective requires hyphens and singular form: ''a twenty-year-old woman''. After
    the noun: ''She is twenty years old'' (no hyphens, plural possible). The two forms have different rules.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: We took a two-litre bottle of water.
  error: '*We took a two-litres bottle of water.*'
  explanation: In number + noun compound adjectives, the noun is always singular before another noun. 'Two-litre bottle' (not
    two-litres). The singular form applies even with plural numbers.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: It was a five-mile walk to the station.
  error: '*It was a five-miles walk to the station.*'
  explanation: 'Compound adjectives with numbers use singular measurement nouns: ''five-mile'', ''ten-kilometre'', ''two-hour''.
    This rule is consistent but frequently violated by learners who apply regular pluralization.'
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: B
  source: Swan Entry 187. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Compound adjectives formed with a number and a noun (usually a unit of measurement) used before another noun,
  where the noun in the compound is always singular.
