teaching:
  methodology: PPP with visual and real-world examples
  recommended_activities:
  - adaptation_notes: 'Match compound adjectives to pictures or real objects: ''a five-pound note'', ''a two-litre bottle'',
      etc.'
    duration: 10
    name: Measurement matching
  - adaptation_notes: Give students a text and have them find and underline all compound adjectives with numbers. Check for
      correct hyphenation and singular nouns.
    duration: 10
    name: Hyphen hunt
  - adaptation_notes: 'Students describe their daily routines using compound adjectives: ''It''s a twenty-minute bus ride
      to school.'' ''I have a one-hour lunch break.'''
    duration: 15
    name: Real-world descriptions
  - adaptation_notes: Provide sentences with errors (e.g., 'a three-hours journey') and have students identify and correct
      them.
    duration: 10
    name: Error correction
  tips:
  - 'Use real objects and situations: ''This is a two-litre bottle.'' ''The journey is a three-hour drive.'''
  - Emphasise the singular noun rule — this is the most common error.
  - 'Practise the hyphen rule: hyphenated before the noun, no hyphen after the verb.'
  - Use timelines, maps, and shopping contexts for authentic practice.
  - 'Swan PEU: Number compound adjectives — ''a five-year-old child,'' ''a ten-mile walk,'' ''a three-hour journey,'' ''a
    two-day conference.'' Key rules: (1) The number is always singular; (2) The noun in the compound is always singular (''five-year,''
    not ''five-years''); (3) Hyphenate the whole compound before the noun.'
  - 'Swan PEU: Without hyphens, the meaning changes: ''a twenty pound note'' (a note weighing 20 pounds?) vs ''a twenty-pound
    note'' (a note of value 20 pounds, British currency). Context and hyphen placement prevent ambiguity.'
  - 'Swan PEU: Teach how to answer age questions: ''How old is the child?'' — ''She is five years old'' (predicative, no hyphens,
    plural ''years''). BUT: ''a five-year-old girl'' (attributive, hyphenated, singular ''year''). Two different structures
    for different positions.'
title: Compound Adjectives with Numbers
use:
- description: Used to describe how long something takes or lasts.
  examples:
  - It's a ten-minute drive to the airport.
  - We had a two-hour meeting.
  - She went on a three-week holiday.
  key_point: Very common when giving travel information or describing schedules.
  name: Describing duration
- description: Used to describe how far something is.
  examples:
  - It's a five-mile walk to the village.
  - They live on a fifty-acre farm.
  - The hotel is just a two-minute walk from the beach.
  key_point: Common in directions and travel descriptions.
  name: Describing distance
- description: Used to describe how old someone or something is.
  examples:
  - She's a fifteen-year-old student.
  - He bought a ten-year-old car.
  - The ceremony is a two-hundred-year-old tradition.
  key_point: 'The ''old'' is part of the compound: ''a five-year-old child''.'
  name: Describing age
- description: Used to describe physical properties or price.
  examples:
  - He ordered a sixteen-ounce steak.
  - She carries a two-litre bottle of water.
  - It was a fifty-pound fine.
  - He drives a two-seater sports car.
  key_point: Common in shopping, cooking, and product descriptions.
  name: Describing size, weight, or cost
