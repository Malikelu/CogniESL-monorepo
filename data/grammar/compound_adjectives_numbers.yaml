level: B1
meaning:
  ccqs:
  - answer: Yes — it is a compound adjective modifying the noun that follows.
    purpose: Tests whether the learner understands temporal relationships between events. Correct use of time conjunctions
      is essential for clear communication of sequence and duration.
    question: Is the number-noun combination being used before a noun to describe it?
  - answer: 'Always singular — even with numbers greater than one: ''a ten-minute walk'', not ''a ten-minutes walk''.'
    purpose: Tests whether the learner understands that '-ed' adjectives describe how someone feels (experiencer) while '-ing'
      adjectives describe what causes the feeling (stimulus).
    question: Is the noun in the compound singular or plural?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with compound adjectives numbers and explain
      why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with compound adjectives numbers.
      Recognizing typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: 'Separate words: "The journey took three hours." (noun phrase, no hyphen)

    Compound adjective: "It was a three-hour journey." (compound modifier before noun)

    Incorrect: "a three-hours journey" (the noun must be singular in the compound)

    '
  core_meaning: A compound adjective with a number is formed by combining a number, a hyphen, and a singular noun (usually
    a unit of time, distance, weight, or money). This compound adjective is placed before a noun to describe it. The noun
    in the compound is always singular, even if the number is plural.
  example_generator:
    contexts:
    - describing duration
    - describing distance
    - describing age
    - describing size
    - describing cost
    cultural_notes:
    - This structure is universal in English but the specific units may differ (miles vs kilometres, pounds vs kilos)
    - In American English, some measurements differ (e.g., 'two-by-four' for lumber)
    min_examples: 5
  timeline: Timeless — used across all tenses as a modifier before a noun.
phonetics:
- example_generator:
    contexts:
    - giving directions
    - describing products
  l1_issue: 'Speakers whose L1 uses plural forms in similar constructions (e.g., Spanish ''de tres horas'') may incorrectly
    pluralise the noun: ''a three-hours journey''.'
  note: 'The stress in compound adjectives with numbers typically falls on the first element: ''a FIVE-minute walk'', ''a
    THREE-hour journey''. The hyphenated elements are spoken as one unit.'
register_notes:
- note: 'Biber et al. (2021) — Number + noun compound adjectives: more common in news and academic prose than in conversation.
    Reflects information packaging differences across registers. Ch. 7.6'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.6
