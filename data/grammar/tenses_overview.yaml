sub_rules:
- examples:
  - I work every day
  - I am working now
  - I have worked here for 5 years
  - I have been working all day
  rule: 'Present tenses: simple (I work), continuous (I am working), perfect (I have
    worked), perfect continuous (I have been working)'
  type: grammatical
- examples:
  - I worked yesterday
  - I was working when he called
  - I had worked there for 5 years
  - I had been working all day
  rule: 'Past tenses: simple (I worked), continuous (I was working), perfect (I had
    worked), perfect continuous (I had been working)'
  type: grammatical
- examples:
  - I will work tomorrow
  - I will be working at 8pm
  - I will have worked here for 5 years by then
  - I will have been working all day
  rule: 'Future tenses: simple (I will work), continuous (I will be working), perfect
    (I will have worked), perfect continuous (I will have been working)'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students draw a timeline and place all 12 tenses on it. Visual
      support helps understanding.
    duration: 15
    name: Tense Timeline
  - adaptation_notes: Show sentences. Students identify the tense and explain why
      it is used.
    duration: 10
    name: Tense Identification
  tips:
  - 'GB3 Ch. 9: Bull Framework — three axes of orientation (present, past, future),
    each with before (perfect) and after times. Teach tenses one axis at a time, not
    one form at a time. Present axis: simple present (now) → present perfect (before)
    → be going to (after). Past axis: simple past (then) → past perfect (before then).
    Future axis: will (future) → future perfect (before future). Source: Celce-Murcia
    & Larsen-Freeman (2015) GB3 3rd ed. Ch. 9 §9.1.'
  - 'GB3 Ch. 9: Present perfect discourse functions — framing habitual narratives
    (present perfect → simple present) and transitioning to past narratives (present
    perfect → simple past). Present perfect is often a discourse opener, not just
    a tense choice. Source: GB3 3rd ed. Ch. 9 §9.3 (citing Suh 1992).'
  - 'Week 1: Present Simple vs Present Continuous.'
  - 'Week 2: Past Simple vs Present Perfect.'
  - 'Week 3: Future forms (will vs going to).'
  - 'Use timeline drawings: Visualize past/present/future on a line to show tense
    relationships.'
  - 'Swan systematic tense coverage: Present (30-34), Future (35-43), Past and Perfect
    (44-56). Each entry focuses on one specific tense/aspect difficulty. Essential
    reference for comprehensive tense teaching.'
  - 'GB3 Ch. 7: The tense-aspect system has 12 combinations but only 5 building blocks
    — learn 3 tenses (simple forms) + 2 aspects (perfect, progressive). High-frequency
    ''northwest'' (present progressive, simple present, simple past) should get more
    attention than low-frequency ''southeast'' (past perfect progressive, future perfect
    progressive). Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.1.'
  - 'GB3 Ch. 7: Core meaning of tenses — Present = immediate factuality (not just
    ''now''). Past = remoteness (in time, reality, OR social distance — explaining
    hypotheticals, politeness, reported speech). Future with will = strong prediction.
    These invariant meanings explain ALL uses of each tense. Source: Celce-Murcia
    & Larsen-Freeman (2015) GB3 Ch. 7 §7.2.'
  - 'GB3 Ch. 7: Form-Meaning-Use framework — every grammar teaching should address
    all three: Form (morphology+syntax), Meaning (semantic contribution), Use (when/why
    speakers choose this over alternatives). The three are interrelated — changing
    one changes others. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 1 §1.5.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3)
    analyzes English as having a TWO-TENSE system: present and past. There is NO morphological
    future tense in English — ''will'' is a modal verb, not a tense marker. The perfect
    and progressive are ASPECTS, not tenses. This means English has: present tense
    (simple/progressive/perfect/perfect-progressive) and past tense (simple/progressive/perfect/perfect-progressive),
    plus modal combinations. CGEL''s analysis is standard in modern linguistics.'
title: Tenses Overview (All 12 English Tenses)
use:
- description: 'Present Simple: habits, facts; Present Continuous: ongoing actions;
    Present Perfect: past actions with present relevance; Present Perfect Continuous:
    ongoing actions with duration.'
  examples:
  - I drink coffee. (habit)
  - I am drinking coffee. (now)
  - I have drunk coffee. (relevance)
  key_point: Present tenses refer to now or general time.
  name: Present Tenses
- description: 'Past Simple: completed past actions; Past Continuous: ongoing past
    actions; Past Perfect: past action before another past action; Past Perfect Continuous:
    ongoing past action before another past action.'
  examples:
  - I worked yesterday. (completed)
  - I was working when he called. (ongoing)
  key_point: Past tenses refer to time before now.
  name: Past Tenses
- description: 'Future Simple: predictions, promises; Future Continuous: ongoing future
    actions; Future Perfect: completed future actions; Future Perfect Continuous:
    ongoing future actions with duration.'
  examples:
  - I will work tomorrow. (prediction)
  - I will be working at 5 PM. (ongoing)
  key_point: Future tenses refer to time after now.
  name: Future Tenses
