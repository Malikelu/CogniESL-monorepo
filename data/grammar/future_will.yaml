grammar_point: future_will
level: A1
meaning:
  ccqs:
  - answer: No, you decided at that moment. It was not planned.
    purpose: Tests whether the learner understands that 'will' expresses predictions, spontaneous decisions, promises, and
      willingness.
    question: '''If I say ''''I will help you'''' right now, did I plan to help before?'''
  - answer: No, it is a general prediction without current evidence.
    purpose: Tests whether the learner can distinguish between predictions with evidence ('going to' -- dark clouds visible)
      and general predictions without evidence ('will' -- general belief about the future).
    question: '''If someone says ''''It will rain tomorrow,'''' do they see rain now?'''
  - answer: It is a promise -- a strong statement about the future.
    purpose: Tests whether the learner can distinguish between 'will' for promises (strong commitment) and 'will' for plans
      (spontaneous decisions). Both use the same form ('will' + base verb) but have different speaker intentions.
    question: '''Is ''''I will always love you'''' a promise or a plan?'''
  - answer: No. In time clauses (when, before, after, until, as soon as) referring to the future, we use present simple, not
      'will.' The correct form is 'When I see him tomorrow, I will call you.'
    purpose: 'Tests whether the learner knows the time clause rule: ''will'' is not used in the subordinate clause introduced
      by time conjunctions like ''when,'' ''before,'' or ''after'' -- even when referring to the future. Present simple replaces
      ''will'' in these clauses.'
    question: When I see him tomorrow, I will call you. Is this correct?
  contrast: 'Will = Spontaneous decision: I will help you! (decide now)

    Going To = Pre-made plan: I am going to help you (planned earlier)

    Present Continuous = Fixed arrangement: I am helping you tomorrow (booked)

    '
  core_meaning: Spontaneous decisions made at moment of speaking, general predictions, promises, and offers.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Future: Actions that will happen after the moment of speaking.'
phonetics:
- example_generator:
    contexts:
    - will reduction
  l1_issue: Learners may over-pronounce 'will' as /wɪl/ in all contexts. Teach the reduced form /l/ for natural speech.
  note: 'In connected speech, will is often reduced to /l/ after pronouns: ''I will'' → /aɪl/, ''She will'' → /ʃiːl/. The
    full form /wɪl/ is used only for emphasis.'
register_notes:
- note: '''Will'' is neutral in register. In formal writing, ''shall'' may be used for first person (BrE).'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In news reporting, ''will'' is used for predictions: ''The economy will grow by 2%.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — ''Will'' for future: register distribution shows academic prose and news use ''will'' for predictions;
    conversation uses ''will'' for spontaneous decisions and ''going to'' for plans. Ch. 6.2.1.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.1.3
