  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Future Tenses-8.3'
  tier: 1
- claim: 'Common error ''Using ''will'' for planned events: *''I will meet John tomorrow'' for Portuguese, Spanish speakers'
  reliability: B
