sub_rules:
- examples:
  - I will help you with that (just decided)
  - I will have the pasta, please (deciding now)
  - I will call her right now (spontaneous decision)
  rule: Will is used for spontaneous decisions made at the moment of speaking
  type: semantic
- examples:
  - I think it will rain tomorrow
  - She will probably pass the exam
  - I believe he will succeed
  rule: Will is used for predictions without specific evidence, often with I think, I believe, probably
  type: semantic
- examples:
  - I will always love you (promise)
  - I will carry that for you (offer)
  - Will you help me? (request)
  - Will you marry me? (proposal)
  rule: Will is used for promises, offers, and requests
  type: pragmatic
- examples:
  - He will leave his clothes on the floor (annoying habit)
  - She will sit and read for hours (typical behavior)
  - The cat will sleep all day (characteristic behavior)
  rule: Will is used for habits and typical behavior, often with a tone of annoyance or admiration
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Teacher creates scenarios. Students respond: ''It is cold.'' → ''I will close the window.'' ''You look
      tired.'' → ''I will make you some coffee.'''
    duration: 10
    name: Spontaneous Decisions
  - adaptation_notes: 'Students make predictions about the future using will: ''In 50 years, people will live on Mars.'''
    duration: 15
    name: Predictions
  tips:
  - 'Parrott (2000) Ch. 14: Will and going to both express futurity but with different bases. Will is used for predictions
    without present evidence, spontaneous decisions, and promises. Going to is for premeditated intentions and predictions
    based on present evidence. Rules of thumb for choosing between future forms are approximate — real usage is influenced
    by personal preference and stylistic factors that rules may not capture. Source: Parrott (2000) Grammar for English Language
    Teachers, 2nd ed. Ch. 14: The future, 14.1-14.7.'
  - 'Week 1: Affirmative will (spontaneous decisions).'
  - 'Week 2: Negative and questions, predictions.'
  - 'Week 3: Contrast with going to and present continuous.'
  - 'Use instant decision scenarios: You drop a pen, someone says I will pick it up!'
  - 'Swan PEU: "Will" for spontaneous decisions ("I will get it"), predictions without evidence ("I think it will rain"),
    promises, offers, requests.'
  - 'Swan PEU: Time clause rule -- after "when, if, until, before, after, as soon as", use present tense for future meaning.'
  - 'GB3 Ch. 7: Simple future with will — strong prediction. Uses: (a) definite future action, (b) future habitual (''After
    October, Marlena will take the 7:30 train''), (c) situation with future termination (''Nora will live in Caracas until
    she improves''), (d) result clause of conditionals (''If you go, you''ll be sorry''). Future progressive is more common
    in BrE. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 Ch. 7 §7.2.'
title: 'Future: Will (Spontaneous Decisions, Predictions, Promises)'
use:
- description: Decisions made at the moment of speaking.
  examples:
  - I will buy it! (decide now)
  - I will call you back.
  key_point: Decision happens when speaking.
  name: Spontaneous Decisions
- description: General predictions without current evidence.
  examples:
  - It will rain tomorrow. (general belief)
  - People will live on Mars.
  key_point: No current evidence, unlike going to.
  name: Predictions (No Evidence)
- description: Make promises or offers to help.
  examples:
  - I will help you.
  - Will you open the door? (request)
  key_point: Common in everyday conversation.
  name: Promises & Offers
- description: General facts that will happen.
  examples:
  - The sun will rise at 6am.
  key_point: Unchanging future facts.
  name: Facts About the Future
