common_errors:
- correction: I am meeting John tomorrow.
  error: 'Using ''will'' for planned events: *''I will meet John tomorrow.'' (planned)'
  explanation: Use present continuous for fixed plans. 'Will' is for spontaneous decisions.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: When I arrive, I will call you.
  error: 'Using ''will'' in time/condition clauses: *''When I will arrive, I will call you.'''
  explanation: In time and condition clauses (when, if, before, after), use present simple, not 'will'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: D
- correction: If it rains, I will stay home.
  error: 'Using ''will'' in if-clauses: *''If it will rain, I will stay home.'''
  explanation: 'Swan PEU: In time/condition clauses, use present tenses instead of "will" to refer to the future.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan Entry 37.2. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: I am seeing Jake tonight.
  error: 'Using ''will'' for fixed arrangements: *''I will see Jake tonight.'' (fixed plan)'
  explanation: 'Swan PEU: For personal arrangements, use present progressive. "Will" suggests spontaneous decision.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 36. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: 'Structure used for spontaneous decisions, predictions, promises, and offers: will + base verb.'
dialectal_variation:
- note: 'BrE uses ''shall'' for first person: ''I shall go.'' AmE uses ''will'' for all persons.'
discourse_notes:
- note: '''Will'' expresses spontaneous decisions: ''The phone is ringing. I''ll get it.'''
- note: '''Will'' is used for promises and offers: ''I will help you.'''
