common_errors: []
description: Manipulating sentence structure to highlight new, important, or contrastive
  information while backgrounding given or assumed knowledge.
dialectal_variation: []
discourse_notes:
- In formal writing, focus structures (clefts, passives, fronting) are used to foreground
  new or important information while backgrounding given knowledge. In conversation,
  prosodic stress and word order serve similar functions.
form:
  affirmative:
    example_generator:
      contexts:
      - news reporting
      - academic writing
      - everyday conversation
      - literary analysis
      min_examples: 4
    structure: It + be + FOCUS + who/that + rest of sentence (It-cleft) / Wh-clause
      + be + FOCUS (Wh-cleft or pseudo-cleft) / Subject + verb + complement (neutral,
      with end-focus on final element)
  negative:
    example_generator:
      contexts:
      - argumentation
      - correcting misunderstandings
      - formal debate
      min_examples: 3
    structure: It + be + not + FOCUS + who/that + rest of sentence (negative cleft)
      / It + be + FOCUS + who/that + not/n't + verb (negated clause)
  questions:
    example_generator:
      contexts:
      - interviewing
      - investigative questioning
      - classroom discussion
      min_examples: 3
    structure: Wh-clause + be + FOCUS? (pseudo-cleft question) / Is/Was it + FOCUS
      + who/that + clause? (cleft question)
grammar_point: focus_background
level: C2
meaning:
  ccqs:
  - answer: Yes — cleft sentences single out one element for focus.
    purpose: Tests whether the learner understands how English sentences structure
      information -- known information comes first, new information comes second.
      This affects word order and article choice.
    question: Do we use a cleft sentence when we want to emphasise one particular
      element?
  - answer: Yes — backgrounded information is typically given or assumed.
    purpose: Tests whether the learner can identify and apply the correct form/meaning
      of this grammar point in context. The question 'Is the background information
      usually something th...' checks conceptual understanding, not just memorization.
    question: Is the background information usually something the listener already
      knows?
  - answer: Yes — fronting moves an element to the beginning of the sentence for emphasis
      or contrast, while the rest of the sentence follows normal word order.
    purpose: Tests whether the learner understands that fronting is a focus strategy
      distinct from clefting, and that it changes the information structure without
      changing the core meaning.
    question: Can we move an element to the front of the sentence for emphasis without
      using a cleft structure?
  - answer: In a wh-cleft, the wh-clause comes first (packaging known/given info),
      and the focused element comes at the end. In an it-cleft, the focused element
      comes right after 'it is,' and the backgrounded info comes at the end. Both
      highlight different elements but package information differently.
    purpose: Tests whether the learner understands the information-flow difference
      between it-clefts and wh-clefts — not just the structural pattern but WHY a
      speaker/writer would choose one over the other.
    question: How does the information flow differ between 'It was Shakespeare who
      wrote the play' and 'What Shakespeare wrote was a masterpiece'?
  contrast: 'Neutral: ''Shakespeare wrote the play in 1599.'' / It-cleft: ''It was
    Shakespeare who wrote the play.'' (focus on agent) / Wh-cleft: ''What Shakespeare
    wrote was a masterpiece.'' (focus on creation) / Passive: ''The play was written
    in 1599.'' (focus on play/date)'
  core_meaning: English allows speakers to rearrange sentence elements so that the
    most important or newsworthy information receives prominence (focus), while known
    or less important information is backgrounded. This is achieved through cleft
    sentences, passives, fronting, and end-weight principles.
  example_generator:
    contexts:
    - academic writing
    - news reporting
    - everyday conversation
    - literary analysis
    - legal discourse
    cultural_notes:
    - English relies heavily on word order for focus, unlike languages that use particles
      or intonation alone.
    min_examples: 5
  timeline: Applicable across all tenses; the choice of focus structure depends on
    discourse context rather than time reference.
phonetics:
- example_generator:
  - contexts:
    - spoken emphasis in cleft sentences
  l1_issue: Speakers whose L1 uses particles for focus (e.g., Japanese 'wa', Arabic)
    may underuse English word-order focus strategies.
  note: Nuclear stress typically falls on the focused element in cleft sentences.
- example_generator:
  - contexts:
    - intonation patterns in pseudo-clefts
  l1_issue: Tonal language speakers (e.g., Mandarin, Vietnamese) may need practice
    with English intonation contours for focus.
  note: 'Wh-cleft sentences often have a two-tone pattern: rising on the wh-clause,
    falling on the focus.'
