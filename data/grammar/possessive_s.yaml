common_errors:
- correction: The dog's bone.
  error: 'Using ''s with plural nouns: *''The dogs'' bone.'' (one dog)'
  explanation: Use 's for singular possessors. Use s' for plural possessors.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: D
- correction: The dog wagged its tail.
  error: 'Confusing ''its'' and ''it''s'': *''The dog wagged it''s tail.'''
  explanation: '''Its'' shows possession. ''It''s'' = ''it is''.'
  flagged: true
  l1_groups:
  - All L1 groups
  - Spanish
  - French
  - Italian
  reliability: D
- correction: the wheel of the car / the leg of the table
  error: 'Using ''s with inanimate objects (German/French L1): *''the car''s wheel'' / *''the table''s leg'''
  explanation: 'Swan PEU: Saxon genitive (''s) is mainly used for people, animals, and time expressions. For things, use ''of''.
    ''My sister''s car'' (OK) vs ''the car''s wheel'' (better: ''the wheel of the car'').'
  l1_groups:
  - German
  - French
  - Portuguese
  - Spanish
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: the dog's bone / John's book
  error: 'Omitting the apostrophe: *''the dogs bone'' / *''Johns book'''
  explanation: 'Swan PEU: The apostrophe is essential. Without it, ''dogs bone'' could be misread as plural ''dogs''. ''s
    = singular possessive, s'' = plural possessive.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Arabic
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: ''
  error: See Swan & Smith (2001) for L1-specific patterns
  explanation: 'Swan & Smith (2001). Spanish (de-phrase: the book of Rosa), French (de-phrase instead of ''s), Italian (di-phrase
    instead of ''s).'
  flagged: false
  l1_groups:
  - Spanish
  - French
  - Italian
  reliability: B
  source: 'Swan & Smith (2001) Learner English: A Teacher''s Guide to Interference and Other Problems, 2nd ed. Cambridge University
    Press.'
description: Shows ownership or relationship between nouns. Added to singular and plural nouns (except irregular plurals ending
  in -s).
dialectal_variation: []
discourse_notes:
- note: 'Possessive ''s shows relationships: ''John''s car'', ''the company''s policy''.'
form:
  affirmative:
    example_generator:
    - the boy's book (singular)
    - the boys' book (regular plural)
    - the children's toys (irregular plural)
    - James' book or James's book (name ending in -s)
    min_examples: 4
    structure: 'Singular noun: noun + ''s / Plural noun ending in -s: noun + '' / Irregular plural: noun + ''s'
  negative:
    example_generator:
    - This is not my sister's car.
    - That's not the teacher's pen.
    - It's not the children's responsibility.
    min_examples: 4
    structure: 'No negative form for possessive ''s itself. Use ''not'' with the verb: This is not my sister''s car.'
  questions:
    example_generator:
    - Whose book is this?
    - Whose car is that?
    - Whose idea was it?
    min_examples: 4
    structure: Whose + noun + is/are...?
grammar_point: possessive_s
level: A1
meaning:
  ccqs:
  - answer: 'No — we just add an apostrophe: ''the boys'' books'' NOT ''the boys''s books.'''
    purpose: Tests whether the learner understands the rule for plural nouns ending in -s (just add an apostrophe, not 's).
      This is important because "the boys' books" (plural) vs. "the boy's book" (singular) changes meaning.
    question: Do we use 's with plural nouns ending in -s?
  - answer: '''Boy''s'' = one boy owns it. ''Boys'''' = multiple boys own it.'
    purpose: Tests whether the learner understands the difference between singular possessive (boy's) and plural possessive
      (boys'). This is important because the apostrophe position signals whether one or multiple people own something.
    question: Can you explain the difference between 'the boy's book' and 'the boys' book' by giving an example of when to
      use each?
  - answer: 'Yes — ''the company''s office'', ''the city''s population'', ''today''s news''. But for inanimate objects, ''of''
      is often more formal: ''the door of the building''.'
    purpose: Tests whether the learner understands that possessive 's can be used with things as well as people, though "of"
      is more formal for inanimate objects. This is important because it shows the flexibility and limitations of the possessive
      's structure.
    question: Can we use possessive 's with things as well as people?
  - answer: '''My brother''s friend''s house'' is correct but clumsy. Better: ''The house of my brother''s friend.'' Avoid
      stacking multiple ''s possessives.'
    purpose: Tests whether the learner can form double possessives and knows when to avoid stacking multiple 's (Swan PEU
      2016, entries 96-100).
    question: Which is correct? *'My brother's friend's house' — how do we show possession with two people?
  contrast: '''Possessive ''s'' = ''the girl''s dog'' (informal, common) vs ''of'' phrase = ''the dog of the girl'' (more
    formal, less common with people)'
  core_meaning: Shows ownership, relationship, or origin of a noun. Answers the question 'Whose?' It is formed by adding 's
    to singular nouns and most proper nouns, or just an apostrophe (') to regular plural nouns ending in -s.
  example_generator:
    contexts:
    - family and relationships
    - personal belongings
    - school and work
    - time expressions
    cultural_notes:
    - Use diverse family structures and relationships
    - Avoid assuming specific family configurations
    - Keep examples concrete and relatable
    min_examples: 5
  timeline: N/A — not tense-based. Describes noun relationships regardless of time.
phonetics:
- example_generator:
  - cat's /kæts/ (voiceless → /s/)
  - dog's /dɒɡz/ (voiced → /z/)
  - boss's /bɒsɪz/ (sibilant → /ɪz/)
  l1_issue: 'Portuguese and Spanish speakers often pronounce the ''s as a full syllable /es/. Teach the three pronunciations:
    /s/, /z/, /ɪz/.'
  note: 'The ''s ending has three pronunciations, the same as plural -s: /s/ after voiceless sounds (cat''s /kæts/), /z/ after
    voiced sounds (dog''s /dɒɡz/), /ɪz/ after sibilant sounds (boss''s /bɒsɪz/).'
- example_generator:
  - boy's book /bɔɪz bʊk/
  - girl's bag /ɡɜːlz bæɡ/
  l1_issue: Many L1 speakers separate the possessive 's too much from the following word. Teach blending for natural speech.
  note: 'In connected speech, the possessive ''s often blends with the following word: ''the boy''s book'' sounds like /ðə
    bɔɪz bʊk/.'
register_notes:
- note: Possessive 's is consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, ''of'' is sometimes preferred for inanimate objects: ''the roof of the house'' (not ''the house''s
    roof'').'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Saxon genitive vs. of-phrase: register distribution varies. News uses more Saxon genitive (especially
    with human/animal nouns); academic prose uses more of-phrases. Conversation uses both but favors simpler structures. Ch.
    2.10.5.2'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 2.10.5.2
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 16: Reference and Possession'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - the girl's bag
  - the dog's bone
  - the teacher's desk
  - the child's toy
  rule: 'Singular nouns: add ''s (the cat''s tail, my dad''s car, the company''s office)'
  type: grammatical
- examples:
  - the boys' books
  - the students' desks
  - the teachers' room
  - the dogs' bones
  rule: 'Regular plural nouns ending in -s: add just an apostrophe ('')'
  type: grammatical
- examples:
  - the children's toys
  - the women's room
  - the men's clothes
  - the people's choice
  rule: 'Irregular plural nouns not ending in -s: add ''s'
  type: grammatical
- examples:
  - James' book or James's book
  - Chris' car or Chris's car
  - the boss' office or the boss's office
  rule: 'Names ending in -s: add either '' or ''s (both are acceptable)'
  type: grammatical
- examples:
  - John and Mary's house (they share one house)
  - the cat and dog's food (they share food)
  rule: 'Joint possession: add ''s to the last noun only'
  type: grammatical
- examples:
  - John's and Mary's houses (each has their own)
  - the cat's and dog's bowls (separate bowls)
  rule: 'Separate possession: add ''s to each noun'
  type: grammatical
teaching:
  methodology: PPP with real objects and family trees
  recommended_activities:
  - adaptation_notes: 'Collect objects from students. Hold up each object: ''Whose is this?'' Students respond: ''It''s Maria''s.''
      ''It''s the teacher''s.'' Practices possessive ''s with real objects.'
    duration: 10
    name: Whose Is It?
  - adaptation_notes: 'Students draw a simple family tree and describe relationships using possessive ''s: ''This is my mother''s
      sister. She is my aunt.'' Practices possessive ''s with family relationships.'
    duration: 15
    name: Family Tree
  - adaptation_notes: 'Teacher says a possessive phrase. Students identify if it is singular or plural: ''the boy''s book''
      (singular) vs ''the boys'' book'' (plural). Practices the apostrophe position rule.'
    duration: 10
    name: Singular or Plural?
  - adaptation_notes: 'Students describe the classroom using possessive ''s: ''The teacher''s desk is here. The students''
      books are on the table. The children''s drawings are on the wall.'''
    duration: 10
    name: Classroom Possessives
  tips:
  - 'Start with singular nouns + ''s: ''the cat''s tail'', ''my dad''s car''. Master this before introducing plural possessives.'
  - 'Practice with family trees: ''my sister''s husband''s brother''. This makes the structure fun and memorable.'
  - 'Contrast singular and plural possessives explicitly: ''the student''s desk'' vs ''the students'' desks''. The position
    of the apostrophe changes the meaning.'
  - 'Use classroom objects: ''Whose pen is this? It''s Maria''s. It''s the teacher''s.'' Makes the grammar physical and immediate.'
  - 'Teach the irregular plural rule: ''children''s'', ''women''s'', ''men''s'' — these add ''s because they don''t end in
    -s.'
  - 'Swan PEU: ''s for people/animals/time, ''of'' for things. ''My brother''s friend'' (person) vs ''the end of the road''
    (thing). Exceptions: ''the car''s engine'', ''the earth''s surface'' — some inanimate ''s is acceptable.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 5: CGEL (Ch.5) uses the term GENITIVE (not ''possessive'')
    for the -''s inflection. CGEL: -''s is an INFLECTION (ending), not a clitic. Evidence: it attaches to the LAST word of
    the NP, not the head: ''the King of Spain''s daughter'' (not *''the King''s of Spain daughter''). The genitive expresses
    a range of meanings beyond possession: subjective (''the teacher''s recommendation'' = the teacher recommended), objective
    (''the prisoner''s release'' = someone released the prisoner), temporal (''today''s news''), etc.'
title: Possessive 's (Noun Ownership)
use:
- context: Ownership
  description: Showing who owns an object
  examples:
  - This is my friend's phone.
  - The company's office is downtown.
  - My sister's car is red.
  - The teacher's desk is in the front.
- context: Relationships
  description: Showing family or personal relationships
  examples:
  - My mother's sister is my aunt.
  - The boss's daughter works here.
  - My brother's friend is coming.
  - The children's teacher is very kind.
- context: Time expressions
  description: Showing time relationships
  examples:
  - Today's news is shocking.
  - Yesterday's meeting was cancelled.
  - Last week's homework was difficult.
  - Tomorrow's weather will be sunny.
- context: Origin or source
  description: Showing where something comes from
  examples:
  - The sun's rays are warm.
  - The city's population is growing.
  - The company's profits increased.
  - The school's reputation is excellent.
