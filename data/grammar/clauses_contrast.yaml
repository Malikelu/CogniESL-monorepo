citations:
- claim: 'Core meaning: Contrast clauses show that two ideas are different or surprising
    in relation to each other'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24:
    Coordination (contrastive clauses)'
  tier: 1
- claim: 'Register distribution: In formal writing, contrast clauses are essential
    for structured argumentation, presenting balanced viewpoints, and connecting opposing
    ideas. Informal contrast is more common in conversation.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24:
    Coordination (contrastive clauses)'
  tier: 1
- claim: 'Discourse function: Contrast clauses signal unexpected or opposing relationships
