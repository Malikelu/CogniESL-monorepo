common_errors:
- correction: Although he is rich, he is unhappy.
  error: '*Although he is rich, but he is unhappy.*'
  explanation: Using 'although' and 'but' together is redundant -- both signal contrast.
    Choose one. This is a transfer error from L1s where using both conjunctions is
    required or acceptable (Chinese 虽然...但是, Portuguese 'mas/porém' stacking).
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Korean
  reliability: D
- correction: Despite being tired, he kept working.
  error: '*Despite he was tired, he kept working.*'
  explanation: '''Despite'' must be followed by a noun or gerund, not a full clause
    with subject + verb. Use ''despite the fact that + clause'' or ''despite + -ing''.
    Confusion arises because ''although'' and ''despite'' have the same meaning but
    different grammar.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Arabic
  reliability: D
- correction: Although it was raining, we went out.
  error: '*Although the rain, we went out.*'
  explanation: '''Although'' introduces a full clause (subject + verb), not just a
    noun. ''The rain'' is a noun phrase; it needs a verb to form a clause. To express
    this with a noun, use ''Despite the rain, we went out''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: I went out, though it was raining.
  error: '*I went out. Though it was raining.* (as two sentences)'
  explanation: '''Though'' at the end of a sentence still connects to the previous
    sentence as a dependent clause. Starting a new independent sentence with ''though''
    creates a fragment in formal writing. Attach it with a comma.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: D
description: 'Structures used to show contrast between two ideas: although, even though,
  though, despite, in spite of, while, whereas.'
dialectal_variation: []
discourse_notes:
- note: Contrast clauses (although, even though, while, whereas, despite, in spite
    of) structure arguments by highlighting differences between propositions, essential
    in compare-contrast discourse across registers.
form:
  affirmative:
    example_generator:
      contexts:
      - contrast with clauses
      - contrast with nouns
      min_examples: 4
    structure: Although/Even though + clause, + main clause / Despite/In spite of
      + noun/-ing + comma + main clause
  negative:
    example_generator:
      contexts:
      - negative contrast
      min_examples: 3
    structure: 'Same structure: Although he did not study, he passed. / Despite not
      studying, he passed.'
  questions:
    example_generator:
      contexts: []
    min_examples: 0
    structure: Not typically used in questions.
grammar_point: clauses_contrast
level: B1
meaning:
  ccqs:
  - answer: Yes, that is contrast.
    purpose: Tests whether the learner understands that contrast clauses express a
      surprising or unexpected relationship between two ideas, where both are true
      but seem to oppose each other.
    question: Are these two ideas surprising together?
  - answer: No, that is cause, not contrast.
    purpose: Tests whether the learner understands the key concept of clauses contrast.
      This is important because mastering this distinction is essential for accurate
      and natural English at B1 level.
    question: Is one idea a cause and the other a result?
  - answer: Comparing two directly related items. "Whereas" is used for direct side-by-side
      comparison of two clauses, while "although/even though" express a surprising
      or concessive relationship.
    purpose: Tests whether the learner can distinguish "whereas" and "while" (direct
      comparison between parallel clauses) from "although/even though" (concessive
      contrast where one clause unexpectedly coexists with the other). "Whereas she
      is tall, her sister is short" compares two facts, whereas "Although she is short,
      she plays basketball" shows an unexpected contrast — a key distinction in clauses
      of contrast at B1 level.
    question: What is the difference in meaning between these two forms?
  - answer: Do not use 'but' with 'although/though' — choose one conjunction. 'Although
      it was raining, we went out' is correct. 'Although it was raining, but we went
      out' is incorrect because both words signal contrast, creating redundancy.
    purpose: Tests whether the learner understands that 'although' and 'but' cannot
      co-occur in standard English. This is a common error for learners whose L1s
      use both conjunctions together (e.g., Chinese 虽然...但是, Portuguese embora...mas).
    question: Why is 'Although it was raining, we went out' correct but 'Although
      it was raining, but we went out' wrong?
  contrast: Although = Although it was raining, we went out. (contrast) vs Because
    = Because it was raining, we stayed home. (cause)
  core_meaning: Contrast clauses show that two ideas are different or surprising in
    relation to each other. Although X, Y = X is true, but Y is also true (surprisingly).
  example_generator:
    contexts:
    - comparing and contrasting
    - expressing surprise
    - academic writing
    - balanced arguments
    cultural_notes:
    - Some languages use different structures for contrast
    - English has many options — choosing the right one depends on register
    min_examples: 5
  timeline: Depends on the tense used in each clause.
phonetics:
- example_generator:
    contexts:
    - contrastive stress
  l1_issue: Some L1 speakers use but instead of although in formal writing
  note: Stress on the contrasting element
register_notes:
- note: 'Biber et al. (2021) — Contrast/concession clauses: formal connectors (''whereas'',
    ''while'') are more common in academic prose; informal (''but'', ''though'') dominate
    conversation. Ch. 10.4.1.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 10.4.1.5
