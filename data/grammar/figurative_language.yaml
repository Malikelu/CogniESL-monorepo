  l1_issue: Learners from cultures that value literal accuracy may find hyperbole uncomfortable or dishonest.
  note: 'Hyperbole is typically spoken with exaggerated intonation and emphasis: I have told you a MILLION times!'
register_notes:
- note: 'Biber et al. (2021) — Figurative language: fiction and literary prose use far more figurative expressions; academic
    prose uses some conventional metaphors. Conversation uses more idioms. Ch. 7.2.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.2.1
