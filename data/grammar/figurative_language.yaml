grammar_point: figurative_language
level: C2
meaning:
  ccqs:
  - answer: Yes, it is figurative language.
    purpose: Tests whether the learner can distinguish between literal and figurative meanings. This is essential for understanding
      idioms, metaphors, and natural speech.
    question: Does this expression mean something different from its literal words?
  - answer: Yes, that is the function of figurative language.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Does it create a comparison, exaggeration, or imag...' checks conceptual understanding, not just memorization.
    question: Does it create a comparison, exaggeration, or image?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with figurative language and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: It is an idiom — a fixed expression whose meaning ('deeply insulting') cannot be deduced from the individual words.
      Unlike a metaphor where the comparison is transparent ("Time is money"), idioms must be learned as complete units. It
      also has metaphorical origins, but its fixedness and non-compositional meaning make it primarily idiomatic.
    purpose: 'Tests whether the learner can distinguish between different categories of figurative language. While metaphors
      allow compositional interpretation (A IS B), idioms are arbitrary fixed chunks. This distinction matters for language
      teaching: metaphors can be unpacked, but idioms must be memorized. Recognizing that an expression is both metaphorical
      in origin and idiomatic in function is a C2-level analysis skill.'
    question: '"The news was a slap in the face." Is this a metaphor, simile, hyperbole, or idiom?'
  contrast: Literal = She is very happy. Figurative = She is on cloud nine. / She is over the moon.
  core_meaning: Figurative language uses words and phrases in non-literal ways to create vivid imagery, emotional impact,
    and expressive depth. It goes beyond the dictionary meaning of words to convey complex ideas and feelings.
  example_generator:
    contexts:
    - literature and poetry
    - everyday conversation
    - advertising and media
    - political rhetoric
    cultural_notes:
    - Many figurative expressions are culture-specific and do not translate directly
    - Understanding figurative language is essential for advanced comprehension of English media and literature
    min_examples: 5
  timeline: Timeless — figurative language describes qualities and relationships, not temporal events.
phonetics:
- example_generator:
    contexts:
    - spoken idioms
    - literary reading
  l1_issue: Learners may try to translate figurative expressions literally from their L1, leading to confusion.
  note: Figurative expressions are often produced as fixed chunks with a specific stress pattern that should not be broken
    up.
- example_generator:
