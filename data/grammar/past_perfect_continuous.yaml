grammar_point: past_perfect_continuous
level: B1
meaning:
  ccqs:
  - answer: Past perfect = completed action. Past perfect continuous = ongoing action
      with focus on duration.
    purpose: Tests whether the learner understands that past perfect continuous emphasizes
      the duration of an activity leading up to a past moment, while past perfect
      presents the action as completed. This is the core distinction between the two
      forms.
    question: Can you explain the difference between past perfect and past perfect
      continuous by giving an example of when to use each?
  - answer: Yes — past perfect continuous emphasizes duration, often with ''for''
      or ''since''.
    purpose: Tests whether the learner can identify duration markers (for/since) that
      signal past perfect continuous, and distinguish this from past perfect which
      does not emphasize duration.
    question: Do we know how long the action had been happening?
  - answer: Yes — past perfect continuous describes an action that was ongoing up
      until (and possibly beyond) a specific past event.
    purpose: Tests whether the learner understands the temporal relationship between
      past perfect continuous and a second past event — the continuous action was
      in progress when the second event occurred.
    question: Does this action continue up to another past moment?
  - answer: Learners often make errors with this structure that change the intended
      meaning.
    purpose: Tests whether the learner can identify and correct a common error associated
      with past perfect continuous. Recognizing typical mistakes helps learners self-edit
      and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this
      grammar point?
  contrast: '''Past Perfect Continuous'' = "She had been studying for 3 hours when
    I arrived."

    ''Past Simple'' = "She studied for 3 hours."

    Emphasizes the duration leading up to a past moment.

    '
  core_meaning: An action that was in progress for a period of time before another
    action or a specific moment in the past.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Before-past. One ongoing past action is interrupted or referenced by another
    past event.
phonetics:
- example_generator:
    contexts:
    - had been contraction
  l1_issue: Many L1 speakers do not contract 'had been' in speech. Teach the contracted
    forms.
  note: 'Had been is often contracted in speech: ''I''d been waiting'' /aɪd biːn ˈweɪtɪŋ/.
    The contraction is very common.'
register_notes:
- note: 'Biber et al. (2021) — Past perfect progressive: rare across all registers;
    most common in fiction (narrative backgrounding) and planned discourse. Rare in
    conversation and academic prose. Register distribution of perfect progressive
    forms is skewed toward written narrative. Ch. 6.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 6.3
