description: Describes actions that were ongoing before another action or moment in
  the past. Emphasizes duration.
dialectal_variation: []
discourse_notes:
- note: Past perfect continuous is rare in conversation; it appears mainly in written
    narratives and planned discourse.
- note: In fiction writing, past perfect continuous provides narrative backgrounding
    — showing what had been ongoing before a key past event.
- 'GB3 Ch. 9: Past perfect in narrative — FLASHBACK function. The past perfect shifts
  the narrative timeline backward to events before the main past timeline: ''She had
  never been so lucky. She was walking home that day...'' In narratives, past perfect
  is used briefly for flashbacks, then the narrator returns to simple past for the
  main timeline. Source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd
  ed. Ch. 9.'
