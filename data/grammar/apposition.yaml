description: 'Noun phrases placed next to another noun to rename or explain it: My
  friend, a doctor, helped me.'
dialectal_variation: []
discourse_notes:
- note: Apposition structures provide additional identifying information about a noun
    phrase. They are common in academic writing for defining and elaborating concepts.
  affirmative:
    example_generator:
      contexts:
      - non-restrictive appositives
      - restrictive appositives
      min_examples: 4
    structure: 'Noun + comma + appositive + comma (non-restrictive): My friend, a
      doctor, helped me. / No commas (restrictive): My friend John helped me.'
  negative:
    example_generator:
      contexts:
      - negative sentences
      min_examples: 3
    structure: 'Same structure with negation: My friend, a doctor, could not help.'
  questions:
    example_generator:
      contexts:
      - question formation
      min_examples: 3
    structure: 'Can appear in questions: Is your friend, a doctor, available?'
grammar_point: apposition
level: B2
meaning:
  ccqs:
  - answer: Yes, it is an appositive.
    purpose: Tests whether the learner understands that appositives rename or identify
      a noun and that non-restrictive appositives require commas while restrictive
      ones do not.
    question: Does this noun phrase rename or explain another noun?
  - answer: Usually yes, if it is non-restrictive.
    purpose: Tests whether the learner understands the comma rule for appositives.
    question: Is it set off by commas?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with
      apposition and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: With commas (My friend, a doctor, helped me), a doctor is non-restrictive
      -- it adds extra information about one specific friend (the listener already
      knows which friend). Without commas (My friend a doctor helped me), it reads
      as restrictive, trying to identify which friend among several, but this version
      is ungrammatical.
    purpose: Tests whether the learner understands the critical role of commas in
      appositive constructions. The commas signal whether the appositive is extra
      information (non-restrictive) or essential for identification (restrictive).
      Omitting commas incorrectly can create ambiguous or ungrammatical sentences.
    question: My friend, a doctor, helped me versus My friend a doctor helped me --
      what difference do the commas make?
  contrast: Appositive = My friend, a doctor, helped me. (renames friend) vs Relative
    clause = My friend who is a doctor helped me.
  core_meaning: An appositive is a noun phrase placed next to another noun to rename,
    identify, or explain it. It provides additional information about the noun it
    follows.
  example_generator:
    contexts:
    - describing people
    - providing additional information
    - formal writing
    - academic English
    cultural_notes:
    - Appositives are more common in formal written English than in speech
    - Punctuation (commas) is essential for clarity
    min_examples: 5
  timeline: Timeless — describes a permanent or ongoing relationship.
phonetics:
- example_generator:
    contexts:
    - punctuation
    - reading aloud
  l1_issue: Punctuation — many L1 speakers do not use commas correctly with appositives
  note: Pause (comma) before and after non-restrictive appositives when speaking
register_notes:
- note: 'Biber et al. (2021) — Appositive noun phrases: more common in news and academic
    prose than in conversation. Written registers pack more information through apposition.
    Ch. 8.1.1.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 8.1.1.4
