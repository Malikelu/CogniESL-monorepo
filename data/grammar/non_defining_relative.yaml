description: Adds extra, non-essential information about a noun. The sentence still makes sense without the clause. Set off
  with commas.
dialectal_variation: []
discourse_notes:
- note: In academic writing, relative clauses are essential for precision and are a marker of proficient writing.
- note: In conversation, defining relative clauses are more common than non-defining.
- note: In formal writing, 'whom' is used for object relative clauses.
form:
  affirmative:
    example_generator:
      contexts:
      - family and relationships
      min_examples: 4
    structure: 'Noun + COMMA + who/which/where + clause + COMMA (or end of sentence).

      Who = people. Which = things/animals. Where = places.

      '
  negative:
    example_generator:
      contexts:
      - family and relationships
      - travel and places
      - weather and nature
      min_examples: 4
    structure: 'Negative inside the relative clause uses standard negation: ''who doesn''t...'', ''which isn''t...'''
  questions:
    example_generator:
      contexts:
      - family and relationships
      - travel and places
      min_examples: 4
    structure: Questions normally come in the main clause, not the relative clause.
grammar_point: non_defining_relative
level: B1
meaning:
  ccqs:
  - answer: Yes. That is how you know it is non-defining.
    purpose: Tests whether the learner can distinguish between defining relative clauses (essential information, no commas)
      and non-defining relative clauses (extra information, with commas).
    question: Can we remove a non-defining clause and the sentence still makes sense
  - answer: No. Only who or which.
    purpose: Tests understanding of non_defining_relative.
    question: Can we use that in non-defining clauses
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with non defining relative and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: One. The commas signal that 'who lives in Tokyo' is extra information, not needed to identify which brother. If
      you had more than one brother, there would be no commas.
    purpose: Tests whether the learner understands that the presence or absence of commas in non-defining relative clauses
      changes the meaning. A non-defining clause (with commas) implies the noun is already uniquely identified, while a defining
      clause (no commas) is needed to specify which one.
    question: If I say 'My brother, who lives in Tokyo, is a teacher,' how many brothers do I have?
  contrast: 'Defining (no commas): "The woman who called you is my boss." (Which woman? The one who called.)

    Non-defining (commas): "My mother, who is 65, lives in Lisbon." (We already know who — extra info only.)

    '
  core_meaning: Gives extra information that is NOT essential to identify the noun. The sentence works without it.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: Same time reference as the main clause. No special tense rules inside the relative clause.
phonetics:
- example_generator:
    contexts:
    - relative clause pauses
  l1_issue: Many L1 speakers do not pause for commas in relative clauses. Teach the pause to improve clarity.
  note: 'The commas in non-defining clauses create pauses in speech: ''My sister, / pause / who lives in Paris, / pause /
    is visiting.'' These pauses are essential for clarity.'
