grammar_point: mustnt
title: Mustn't (prohibition)
description: Modal verb used to express strong prohibition, meaning something is not allowed under any circumstances.
level: A2
meaning:
  core_meaning: Expresses absolute prohibition; something is forbidden by rule, law, or authority.
  timeline: Refers to present or future actions; prohibition applies to the time of speaking or future.
  contrast: 'Mustn''t = Strong prohibition (forbidden): "You mustn''t park here" (illegal)

    Don''t have to = No obligation (allowed but not required): "You don''t have to come" (optional)

    Can''t = Informal prohibition: "You can''t sit here" (casual)

    '
  ccqs:
  - question: Does must not mean the same as do not have to
    answer: No. Must not = prohibition (forbidden). Do not have to = no obligation (optional).
    purpose: Tests whether the learner understands a key concept of mustnt. This is fundamental for correct use of this grammar
      point.
  - question: Can we use a different structure here with the same meaning?
    answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that mustnt is the only appropriate structure for this meaning/context.
  - question: What is the difference in meaning between these two forms?
    answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with mustnt and explain why they are incorrect.
  - question: Use must not and do not have to to talk about school rules such as wear a uniform and bring your textbook every
      day.
    answer: You must not wear jeans (prohibition -- it is forbidden by the rules). You do not have to bring your textbook
      every day (no obligation -- it is optional, the school provides copies). Must not means it is against the rules. Do
      not have to means it is up to you.
    purpose: Tests whether the learner can apply the must not versus do not have to distinction in a realistic school-rules
      context. Using the wrong modal could cause genuine confusion -- telling a student you must not wear a uniform means
      uniforms are forbidden, while you do not have to wear a uniform means it is optional. The practical stakes make this
      distinction essential.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
form:
  affirmative:
    structure: Subject + mustn't (must not) + base verb
    example_generator:
      contexts:
      - health and wellbeing
      - weather and nature
      - social interactions
      min_examples: 4
  negative:
    structure: Mustn't is already negative; no additional negative forms.
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
  questions:
    structure: Must + subject + not + base verb? (rare, use 'Are we allowed to...?' instead)
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
sub_rules:
- rule: Must not expresses prohibition — something is forbidden or not allowed
  type: semantic
  examples:
  - You must not smoke here (it is forbidden)
  - You must not park on double yellow lines (it is prohibited)
  - Students must not use their phones in class (rule)
- rule: Must not is different from do not have to. Must not = forbidden. Do not have to = optional
  type: semantic
  examples:
  - You must not park here (prohibition — you are not allowed)
  - You do not have to park here (no obligation — you can park elsewhere)
  - You must not eat in the library (forbidden)
  - You do not have to eat in the cafeteria (optional — you can bring lunch)
- rule: Must not is often used in formal rules, signs, and official announcements
  type: register
  examples:
  - Visitors must not feed the animals (zoo sign)
  - You must not enter without authorization (official notice)
  - Passengers must not stand while the plane is moving (announcement)
use:
- name: Legal/Rule Prohibition
  description: Talk about actions forbidden by law, school rules, or official policies.
  examples:
  - You mustn't drive over 120 km/h.
  - Students mustn't use phones in class.
  key_point: Prohibition is enforced by authority.
- name: Safety Prohibition
  description: Forbid actions that are dangerous or harmful.
  examples:
  - You mustn't touch the electrical wires.
  - Children mustn't play with matches.
  key_point: Focuses on preventing harm.
- name: Strong Personal Prohibition
  description: Forbid actions in personal contexts (stronger than 'don't').
  examples:
  - You mustn't tell anyone my secret.
  - We mustn't forget her birthday.
  key_point: Speaker has strong authority or emotional investment.
phonetics:
- note: Must not is pronounced /mʌsnt/ or /mʌsənt/. The /t/ is often unreleased or a glottal stop in connected speech.
  example_generator:
    contexts:
    - must not pronunciation
  l1_issue: Learners may confuse must not and do not have to in listening. Teach the clear pronunciation of must not vs the
    reduced form of don't have to.
teaching:
  methodology: PPP
  tips:
  - 'Use real rules: School rules, traffic signs, safety warnings.'
  - 'Role-play: Teacher gives class rules using ''mustn''t''.'
  - 'Contrast with ''don''t have to'' using scenarios: ''You mustn''t cheat'' (forbidden) vs ''You don''t have to cheat''
    (optional, but don''t do it).'
  - Practice with safety and legal contexts.
  - 'Swan PEU: ''Must not = prohibition'' — ''You mustn''t park here.'' = it is forbidden. NOT the same as ''You don''t have
    to'' (no obligation). Swan Entry 83: ''Mustn''t'' in BrE is often ''can''t'' in AmE for prohibitions.'
  recommended_activities:
  - name: Sign Interpretation
    duration: 10
    adaptation_notes: Show students real-world signs (no smoking, no parking). Students explain the meaning using must not.
  - name: Must Not or Do Not Have To
    duration: 15
    adaptation_notes: 'Students choose: ''You ___ wear a uniform.'' (must not — forbidden) ''You ___ wear a tie.'' (do not
      have to — optional).'
sources:
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 8: Modal Auxiliaries'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
common_errors:
- error: '*You mustn''t wear a seatbelt.* (meaning: it''s optional)'
  correction: You don't have to wear a seatbelt. (= it's optional) / You mustn't drive without a seatbelt. (= it's forbidden)
  explanation: '''Mustn''t'' = prohibition (forbidden). ''Don''t have to'' = no obligation (optional). Confusing these can
    lead to dangerous misunderstandings.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: D
  flagged: true
register_notes:
- note: 'In conversation, modals are essential for politeness: ''Could you pass the salt?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal language, ''must'' expresses strong obligation: ''All passengers must wear seatbelts.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Prohibitive ''mustn''t'': register distribution differs from affirmative ''must''. More common
    in spoken directives and instructional contexts. Ch. 6.6.2'
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.6.2
  reliability: C
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission: ''All passengers must wear seatbelts.'''
