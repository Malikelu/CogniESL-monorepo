  error: 'Using infinitive after ''like'': *''I like to swim.'' (general preference)'
  explanation: For general preferences, use 'like + gerund'. 'Like + infinitive' is more common in AmE.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
- correction: I like swimming.
  error: 'Using base form: *''I like swim.'''
  explanation: '''Like'' is followed by a gerund (-ing), not the base form.'
