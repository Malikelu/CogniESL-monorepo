  tier: 1
- claim: 'Register distribution: Time adverbs are neutral in register.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25: Adverbs-14.8'
  tier: 1
- claim: 'Discourse function: Time adverbs create temporal cohesion: ''Yesterday I went to the store. Today I stayed home.'''
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25: Adverbs-14.8'
