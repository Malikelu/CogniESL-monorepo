  tier: 1
common_errors:
- correction: I went to the store yesterday.
  error: 'Placing time adverbs at the beginning only: *''Yesterday I went to the store.'' (only position)'
  explanation: Time adverbs can go at the beginning or end of a sentence.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
description: Adverbs that indicate when an action happens. Essential for temporal context in communication.
dialectal_variation: []
discourse_notes:
- note: 'Time adverbs create temporal cohesion: ''Yesterday I went to the store. Today I stayed home.'''
form:
  affirmative:
    example_generator:
      contexts:
      - food and daily routines
      - entertainment and media
      min_examples: 4
    structure: 'Time adverb at end (most common): "I went yesterday."

      Time adverb at beginning (for emphasis): "Yesterday, I went."

      Already/yet with perfect tenses: "I have already finished."

      '
  negative:
    example_generator:
      contexts:
      - social interactions
      min_examples: 4
    structure: 'Time adverb position unchanged in negatives: ''I haven''t finished yet.'''
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Time adverb at end: ''Did you go yesterday?'' ''Have you eaten yet?'''
grammar_point: time_adverbs
level: A1
meaning:
  ccqs:
  - answer: At the beginning or end of the sentence.
    purpose: Tests whether the learner understands a key concept of time_adverbs. This is fundamental for correct use of this
      grammar point.
    question: Where do time adverbs usually go
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that time adverbs is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with time adverbs and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''Yesterday I went to the store.'' Time adverbs go in front or end position, not mid-position.'
    purpose: Tests whether the learner places time adverbs in front or end position, not mid-position (Swan PEU 2016, entry
      196).
    question: Which is correct? *'I yesterday went to the store' or 'Yesterday I went to the store'?
  contrast: '''Already'' = earlier than expected (positive sentences)

    ''Yet'' = up to now (negative/questions)

    ''Still'' = continuing longer than expected

    ''Just'' = very recently

    '
  core_meaning: 'Specifies the time frame of an action: past, present, future, or relative time. This grammar point is essential
    for expressing time adverbs in English. Learners at this level need to understand both the form and the appropriate contexts
    for use. Common errors include confusion with related structures and inappropriate register use.'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Time adverbs anchor actions to specific points: past (yesterday), present (now), future (tomorrow).'
phonetics:
- example_generator:
    contexts:
    - time adverb stress
  l1_issue: 'Portuguese and Spanish speakers often place time adverbs in different positions. Teach the standard English position:
    end or beginning of sentence.'
  note: 'Time adverbs at the end of the sentence are usually stressed: ''I went to the store YESTERDAY.'' ''She is visiting
    NEXT WEEK.'''
register_notes:
- note: Time adverbs are neutral in register.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Time adverbs (''now'', ''then'', ''soon'', ''recently''): conversation uses more deictic time
    adverbs; academic prose uses more specific and complex temporal expressions. Ch. 12.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 12.5
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25: Adverbs-14.8'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I went yesterday
  - She visited last week
  - They moved 3 years ago
  - He called this morning
  rule: 'Past time expressions: yesterday, last week, last month, ago'
  type: lexical
- examples:
  - I am busy today
  - She is traveling this week
  - They are working this month
  rule: 'Present time expressions: today, this week, this month, this year'
  type: lexical
- examples:
  - I will go tomorrow
  - She is visiting next week
  - They are moving next year
  rule: 'Future time expressions: tomorrow, next week, next month, next year'
  type: lexical
- examples:
  - Yesterday I went to the store (beginning)
  - I went to the store yesterday (end)
  - Tomorrow we will leave (beginning)
  - We will leave tomorrow (end)
  rule: 'Position: time adverbs usually go at the end or beginning of the sentence'
  type: word_order
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Teacher says a time expression. Students identify: past, present, or future? ''Yesterday'' (past),
      ''This week'' (present), ''Next year'' (future).'
    duration: 10
    name: Past Present or Future
  - adaptation_notes: 'Students build sentences using time adverbs: ''I + go + yesterday'' → ''I went yesterday.'' Practices
      correct tense with time expressions.'
    duration: 15
    name: Sentence Building
  tips:
  - 'Create a classroom timeline: past on left, future on right, stick adverbs on it.'
  - 'Practice with personal calendars: ''What did you do yesterday? What will you do tomorrow?'''
  - Drill already/yet contrast with present perfect.
  - 'Swan PEU: Time adverbs — ''already'' (before expected), ''still'' (continuing), ''yet'' (not before expected, usually
    in questions/negatives). Position varies: ''I''ve already eaten,'' ''Are you still here?'' ''Have you finished yet?'''
  - 'GB3 Ch. 7: Adverbs of indefinite time and tense co-occurrence — already = prior completion (perhaps earlier than expected),
    just = recent completion, yet = non-completion in questions/negatives, soon = expected future completion, still = continuation,
    anymore = ceased. These semantic features (complete/incomplete/continuing) map to their tense co-occurrence. Source: Celce-Murcia
    & Larsen-Freeman (2015) GB3 Ch. 7 §7.4.'
title: Time Adverbs (now, yesterday, today, soon, already, yet)
use:
- description: Indicate when past actions occurred.
  examples:
  - I called yesterday.
  - She arrived last week.
  key_point: Past time adverbs trigger past tense verbs.
  name: Past Time Reference
- description: Indicate when future actions will occur.
  examples:
  - We'll leave tomorrow.
  - She is coming soon.
  key_point: Future time adverbs with will/going to.
  name: Future Time Reference
- description: Already, yet, just, ever, never with present perfect.
  examples:
  - I have already seen it.
  - Have you ever been there?
  key_point: Already = positive, yet = negative/questions.
  name: Perfect Tense Time Markers
