grammar_point: verbs_not_usually_used_in_continuous_forms
level: B1
meaning:
  ccqs:
  - answer: No — 'know' is a stative verb. We say 'I know the answer.' Stative verbs describe states, not actions, so they
      are not used in continuous forms.
    purpose: Tests whether the learner understands a key concept of verbs_not_usually_used_in_continuous_forms. This is fundamental
      for correct use of this grammar point.
    question: Can we say 'I am knowing the answer'? Why or why not?
  - answer: No — here 'think' is an active mental process, so continuous is fine. 'I think it is great' (opinion — stative)
      vs 'I am thinking about it' (process — active).
    purpose: Tests whether the learner understands a key concept of verbs_not_usually_used_in_continuous_forms. This is fundamental
      for correct use of this grammar point.
    question: I am thinking about the problem. Is 'think' a stative verb here?
  - answer: 'No — for possession, use simple: ''I have a car.'' But ''I am having lunch'' is correct because ''have'' here
      means ''eat,'' which is an action.'
    purpose: Tests whether the learner understands a key concept of verbs_not_usually_used_in_continuous_forms. This is fundamental
      for correct use of this grammar point.
    question: Can we say 'I am having a car' to talk about possession?
  - answer: '''I have a car.'' ''Have'' meaning ''possess'' is stative. But ''I am having lunch'' is correct as a dynamic
      activity.'
    purpose: 'Tests the stative/dynamic distinction: ''have'' = possess (stative, no progressive) vs ''have'' = eat/experience
      (dynamic, can be progressive) (Swan PEU 2016).'
    question: Which is correct? *'I am having a car' or 'I have a car'?
  contrast: '''I know'' (state - permanent) vs ''I am learning'' (action - ongoing)

    ''I have a car'' (possession state) vs ''I am having lunch'' (action - eating, special case)

    Some verbs can be both: ''I think'' (state) vs ''I''m thinking'' (action - mental process)

    '
  core_meaning: Describes a state of being, thinking, feeling, or possession that is not an active, ongoing action.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: States are not 'happening' - they simply exist. No 'start' or 'finish' to a state.
phonetics:
- example_generator:
    contexts:
    - stative verb stress
  l1_issue: Learners may use stative verbs in continuous forms because their native language allows it. Teach the clear distinction
    between stative and dynamic uses.
  note: 'Stative verbs in simple forms are usually unstressed: ''I KNOW the answer.'' ''She WANTS to go.'' The stress falls
    on the content words, not the stative verb.'
register_notes:
- note: 'Biber et al. (2021) — Stative verbs resisting progressive: conversation increasingly uses progressive with statives
    (''I''m loving it'', ''I''m understanding now'') as a register-driven innovation. Academic prose avoids progressive statives.
    Ch. 6.3.3.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.3.3.1
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 5-7: Tenses and Aspect'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
