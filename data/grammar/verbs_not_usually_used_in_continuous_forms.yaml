sub_rules:
- examples:
  - I know the answer (NOT I am knowing)
  - She believes in God (NOT She is believing)
  - He understands the problem (NOT He is understanding)
  rule: 'Stative verbs: know, believe, understand, remember, forget — describe mental states, not actions'
  type: lexical
- examples:
  - I like coffee (NOT I am liking)
  - She wants to go (NOT She is wanting)
  - He needs help (NOT He is needing)
  rule: 'Stative verbs: like, love, hate, want, need, prefer — describe emotions and desires'
  type: lexical
- examples:
  - I think it is great (opinion — stative)
  - I am thinking about the problem (process — continuous)
  - I have a car (possession — stative)
  - I am having lunch (action — continuous)
  - I see the problem (understand — stative)
  - I am seeing the doctor (meeting — continuous)
  rule: 'Some stative verbs can be continuous with a different meaning: think, have, see, taste, weigh'
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students identify whether verbs are being used as stative (simple form) or dynamic (continuous form):
      ''I think'' (opinion) vs ''I am thinking'' (process).'
    duration: 10
    name: Stative or Dynamic
  - adaptation_notes: 'Students correct sentences with stative verbs in continuous form: ''I am knowing the answer'' → ''I
      know the answer.'''
    duration: 15
    name: Correct the Error
  tips:
  - 'GB3 Ch. 7: Teach ''stative meanings'' not ''stative verbs'' — many stative verbs have dynamic counterparts that DO take
    progressive: ''The steak weighs 12 oz'' (state) vs ''The butcher is weighing the steak'' (action). ''You are a fool''
    vs ''You''re being a fool.'' Focus on the meaning, not the verb itself.'
  - 'GB3 Ch. 7: Vendler lexical aspect — four verb types: Activity (run, walk, no endpoint), Accomplishment (build a house,
    has endpoint), Achievement (recognize, punctual), State (know, want, no change). Stative verbs resist progressive because
    of a semantic conflict: progressive = limited duration, state = indefinite duration.'
  - 'GB3 Ch. 7: Progressive statives ARE possible for 9 specific effects — intensify emotion (''I''m hating this''), current
    behavior (''He''s being rude''), change (''I''m understanding less''), limited duration, emphasis, vividness, personal
    involvement, mitigate criticism, avoid imposition. These are NOT errors — they are advanced, deliberate uses.'
  - 'Draw a line: ''states'' on one side, ''actions'' on other. Sort verbs.'
  - 'Use timeline: states = horizontal line (ongoing); actions = dots (happen at time).'
  - 'Special cases: ''have lunch/dinner/shower'' = exceptions (can be continuous).'
  - 'Swan PEU: Stative vs dynamic verbs — know, believe, understand, like, love, hate, want, need, prefer, remember, forget,
    recognise, realise, suppose, mean, doubt, belong, contain, consist, depend, fit, involve, lack, own, owe, possess, resemble,
    seem, weigh. These are not typically used in progressive.'
  - 'Swan PEU: Some verbs have both stative and dynamic meanings: ''I have a car'' (possession, stative) vs ''I''m having
    lunch'' (eating, dynamic). ''I think it''s great'' (opinion) vs ''I''m thinking about it'' (process). Teach these as separate
    meanings.'
  - 'Swan PEU: Temporary vs permanent situations. ''She works in London'' (permanent job) vs ''She''s working in London''
    (temporary). Stative verbs resist this distinction and don''t take progressive even for temporary situations.'
title: Stative Verbs (not used in continuous forms)
use:
- description: Verbs about thoughts and knowledge.
  examples:
  - I know that.
  - She believes in ghosts.
  - We understand the problem.
  key_point: These are states of mind, not actions you 'do'.
  name: Mental States (know, believe, understand, think)
- description: Verbs about feelings and desires.
  examples:
  - I love you.
  - He hates cold weather.
  - We need help.
  key_point: Emotions are states, not ongoing actions.
  name: Emotions (love, hate, like, prefer, want, need)
- description: Verbs about ownership.
  examples:
  - I have a car.
  - This belongs to me.
  - They own this house.
  key_point: Possession is a state, not an action you perform.
  name: Possession/Belonging (have, belong, own, possess)
