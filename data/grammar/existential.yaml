grammar_point: existential
level: A2
meaning:
  ccqs:
  - answer: Yes — use there is/are.
    purpose: Tests whether the learner understands that 'there is/are' is used to state the existence of something. 'There
      is a book on the table' = a book exists on the table. This is the fundamental structure for introducing new information.
    question: Are we saying something exists?
  - answer: Yes — there is/are introduces new information.
    purpose: 'Tests whether the learner understands that ''there is/are'' is used for first mention (new information). Once
      introduced, use ''the'' for subsequent reference: ''There is a book on the table. The book is red.'''
    question: Is this new information?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with existential and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''There are many people here.'' Use ''there is/are'' to say that something exists.'
    purpose: Tests whether the learner uses 'there is/are' (not 'it is') to express existence (Swan PEU 2016, entry 593).
    question: Which is correct? *'It is many people here' or 'There are many people here'?
  contrast: There is = There is a book on the table. (existence) vs A book is on the table. (location)
  core_meaning: There is/are introduces the existence of something. There is not a place — it is a grammatical subject. The
    real subject comes after the verb.
  example_generator:
    contexts:
    - describing places
    - talking about what exists
    - introducing new information
    - describing scenes
    cultural_notes: []
    min_examples: 5
  timeline: Present (there is/are) or past (there was/were).
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Some L1 speakers omit there or it as dummy subjects.
  note: Weak form of there /ðeər/ → /ðər/
register_notes:
- note: 'Biber et al. (2021) — Existential there: much more common than locative inversion; distribution varies by register.
    Primarily used to introduce new information with indefinite subject. Very frequent in conversation. Ch. 11.4.8'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 11.4.8
sources:
  corpus_evidence: Biber et al. (1999) LSWE Corpus — Existential there is far more common in conversation and fiction than
    in academic prose and news. In conversation, it often introduces new referents in discourse. In academic prose, existential
    there is relatively rare; writers prefer other information-packaging structures (fronting, passives, nominalizations).
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 5-6: Existential there, register distribution'
  secondary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - There is a book.
  - There is some water.
  rule: Use is with singular nouns and non-count nouns
  type: grammatical
- examples:
  - There are many people.
  - There are three books.
  rule: Use are with plural nouns
  type: grammatical
- examples:
  - There is a book. (existence)
  - The book is there. (location)
  rule: There is not a place in this structure
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students describe what exists in different locations using there is/are.
    duration: 10
    name: What is in the Room?
  tips:
  - 'CGEL Ch. 16: CGEL distinguishes presentational there (There appeared a man) from existential there (There is a book).
    Presentational there introduces new entities into discourse and allows a wider range of verbs, while existential there
    asserts existence.'
  - Use real situations to demonstrate existence
  - Contrast with location (the book is there)
  - Practice with classroom objects and people
  - 'Swan PEU: Existential ''there'' — ''There is a book on the table.'' = ''a book exists on the table.'' Used to introduce
    new information, especially with indefinite subjects (a, some, any, no). Informal ''there''s'' is used even with plural
    subjects.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 16: CGEL (Ch.16) analyzes existential ''there'' as a
    DUMMY PRONOUN (not an adverb). It is a syntactic subject (satisfies subject-aux inversion: ''Is there a problem?'') but
    semantically empty. This explains why existential requires ''be'' (*''There have a problem'') — ''there'' needs a copula
    to link to the notional subject. CGEL rejects the traditional analysis of ''there'' as an adverb of place in existentials.'
title: Existential Constructions (There is/are)
use:
- context: Describing places
  description: Saying what exists in a location
  examples:
  - There is a park near my house.
  - There are many restaurants in this area.
- context: Introducing new information
  description: Presenting something for the first time
  examples:
  - There is a new student in our class.
  - There are some things I need to tell you.
