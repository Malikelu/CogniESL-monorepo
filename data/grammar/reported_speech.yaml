citations:
- claim: 'Core meaning: Reported speech (also called indirect speech) conveys someone else''s words in a new context'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 11: Reported Speech'
  tier: 1
- claim: 'Register distribution: Reported speech is common in formal writing, journalism, and academic prose.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 11: Reported Speech'
  tier: 1
- claim: 'Discourse function: Reported speech creates cohesion in narratives by integrating characters'' words into the story.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 11: Reported Speech'
  tier: 1
- claim: 'Common error ''Not backshifting tenses: *''She said she is happy.'''' for Portuguese, Spanish, French speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 13: Reported speech'
  tier: 1
- claim: Understanding reported speech is essential for academic writing — Oshima & Hogue emphasize how writers use these
    structures to create clear, coherent prose
  flagged: false
  reliability: B
  source: 'Oshima and Hogue (2006) Introduction to Academic Writing, 3rd ed. Pearson. Ch. 5: Complex Sentences in Academic
    Writing'
  tier: 2
common_errors:
- correction: She said she was happy.
  error: 'Not backshifting tenses: *''She said she is happy.'''
  explanation: In reported speech, tenses typically shift back.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Reported speech'
- correction: She said she was tired.
  error: 'Not backshifting tenses: *''She said she is tired.'' (when the situation has changed)'
  explanation: 'Swan PEU: In reported speech, tenses typically shift back (present → past, past → past perfect). Backshifting
    is required when reporting speech about a past situation.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: He told me that he was tired.
  error: 'Using ''say'' with an object: *''He said me that he was tired.'''
  explanation: 'Swan PEU: ''Say'' does NOT take a direct personal object (say something to someone). ''Tell'' requires a personal
    object (tell someone something). This is a basic distribution error.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: She said she would come today/the next day.
  error: 'Not changing time/place references: *''She said she will come tomorrow.'' (reported next day)'
  explanation: 'Swan PEU: Time and place references shift in reported speech. ''Tomorrow'' → ''the next day'', ''here'' →
    ''there'', ''this'' → ''that''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Retelling what someone said without using their exact words, with changes to tense, pronouns, and time/place
  expressions.
dialectal_variation:
- note: 'In informal speech, ''that'' is often omitted: ''She said she was tired'' (without ''that'').'
- note: 'In some dialects, backshift may be omitted when the situation is still true: ''She said she is a doctor'' (she is
    still a doctor).'
discourse_notes:
- note: Reported speech creates cohesion in narratives by integrating characters' words into the story.
- note: In news reporting, direct quotes are used for impact, while reported speech is used for summarizing.
- note: In academic writing, reported speech allows writers to engage with other researchers' ideas.
- note: 'Reported speech can be used to create distance or neutrality: ''The government claimed that...'' (the writer does
    not endorse the claim)'
form:
  affirmative:
    example_generator:
    - 'He said (that) he was tired. (Direct: ''I am tired.'')'
    - 'She told me (that) she liked pizza. (Direct: ''I like pizza.'')'
    - 'They said (that) they would come. (Direct: ''We will come.'')'
    min_examples: 4
    structure: Reporting verb (say/tell) + (that) + reported clause (with tense backshift)
  negative:
    example_generator:
    - 'She said (that) she didn''t like tea. (Direct: ''I don''t like tea.'')'
    - 'He told me (that) he hadn''t finished. (Direct: ''I haven''t finished.'')'
    - 'They said (that) they wouldn''t come. (Direct: ''We won''t come.'')'
    min_examples: 4
    structure: Reporting verb + (that) + subject + not + verb (with tense backshift)
  questions:
    example_generator:
    - 'He asked if I liked coffee. (Direct: ''Do you like coffee?'')'
    - 'She asked whether I had a car. (Direct: ''Do you have a car?'')'
    - 'He asked where I lived. (Direct: ''Where do you live?'')'
    - 'She asked why I was late. (Direct: ''Why are you late?'')'
    min_examples: 4
    structure: 'Yes/no questions: reporting verb + if/whether + subject + verb (statement order, no auxiliary inversion) /
      Wh- questions: reporting verb + wh- word + subject + verb (statement order)'
grammar_point: reported_speech
level: B1
meaning:
  ccqs:
  - answer: Paraphrasing -- that is reported speech.
    purpose: Tests whether the learner understands that reported speech involves backshifting tenses (present → past, past
      → past perfect).
    question: Are we using the speaker's exact words, or paraphrasing?
  - answer: Yes -- tenses shift one step back (present → past, past → past perfect).
    purpose: Tests whether the learner knows the tense backshift rule, which is the most important structural feature of reported
      speech. This rule applies in formal reported speech (though AmE sometimes omits it in informal contexts).
    question: Does the tense change in reported speech?
  - answer: No -- reported speech does not use quotation marks.
    purpose: Tests whether the learner can distinguish the punctuation difference between direct and reported speech. This
      is a common error -- learners often mix direct speech punctuation with reported speech structure.
    question: Do we use quotation marks in reported speech?
  - answer: It depends on the context. Some grammar references say 'tomorrow' should change to 'the next day' in reported
      speech. However, if 'tomorrow' is still the next day from the reporter's current perspective, it can remain unchanged.
      Both 'She said she was leaving the next day' (strict backshift) and 'She said she was leaving tomorrow' (if still future)
      are acceptable.
    purpose: Tests whether the learner understands the nuanced rules for time expression changes in reported speech, particularly
      the choice between strict backshift for formal writing and pragmatic retention when the time reference is still valid
      from the current speaker's perspective. This distinction is important in reported speech usage at B1 level and above.
    question: In the sentence 'She said she was leaving tomorrow', is 'tomorrow' correct or should it be changed?
  contrast: '''Direct Speech'' = ''I am happy.'' (exact words, in quotes) vs ''Reported Speech'' = ''He said (that) he was
    happy.'' (paraphrased, no quotes, tense shifted back)'
  core_meaning: Reported speech (also called indirect speech) conveys someone else's words in a new context. Instead of quoting
    exact words, we paraphrase what was said and adjust grammar (tense, pronouns, time expressions) to fit the current speaker's
    perspective.
  example_generator:
    contexts:
    - everyday conversations
    - news reports
    - workplace communication
    - storytelling
    cultural_notes:
    - Reported speech is essential for news reporting, academic writing, and everyday conversation
    - In informal speech, some native speakers do not always apply tense backshift, but it is expected in formal writing and
      exams
    - 'The word ''that'' is optional in reported statements: ''He said that he was tired'' = ''He said he was tired'''
    min_examples: 5
  timeline: 'Tense backshift moves the original tense one step back in time: present → past, past → past perfect, future →
    conditional. This reflects that the original statement was made earlier.'
phonetics:
- example_generator:
  - that /ðət/
  - said /sed/
  l1_issue: Many L1 speakers over-pronounce 'that' as /ðæt/. Teach the weak form for natural speech.
  note: 'Weak form of ''that'' in reported speech: /ðət/ not /ðæt/. ''He said that he was tired'' sounds like /hiː sed ðət
    hiː wəz taɪəd/.'
- example_generator:
  - he was /hiː wəz/
  - she had → she'd /ʃiːd/
  l1_issue: Portuguese and Spanish speakers often avoid contractions. Teach them for natural-sounding speech.
  note: 'Contractions are natural in spoken reported speech: ''He said he was...'' /hiː sed hiː wəz/, ''She said she''d...''
    /ʃiː sed ʃiːd/.'
register_notes:
- note: Reported speech is common in formal writing, journalism, and academic prose.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In news reporting, reported speech is used to convey what sources said: ''The minister stated that the policy would
    be reviewed.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, reported speech is used to discuss other researchers'' findings: ''Smith (2020) argued that...'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal contexts, reported speech is used for witness testimony: ''The defendant stated that he had not been present.'''
  reliability: D
  source: Team observation
  tier: 4
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 13: Reported speech'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 11: Reported Speech'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 12: Reported speech'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(reported speech: backshift, pronoun changes, time expressions)'
sub_rules:
- examples:
  - '''I am happy.'' → He said he was happy.'
  - '''I ate lunch.'' → She said she had eaten lunch.'
  - '''I will come.'' → They said they would come.'
  rule: 'Tense backshift: present → past, past → past perfect, future → conditional (will → would)'
  type: grammatical
- examples:
  - '''I like my job.'' → He said he liked his job.'
  - '''You need your passport.'' → She said I needed my passport.'
  rule: 'Pronoun changes: I → he/she, you → I/he/she, we → they, my → his/her, your → my/his/her'
  type: grammatical
- examples:
  - '''I am leaving today.'' → He said he was leaving that day.'
  - '''I will come tomorrow.'' → She said she would come the next day.'
  rule: 'Time/place expression changes: now → then, today → that day, yesterday → the day before, tomorrow → the next day,
    here → there'
  type: grammatical
- examples:
  - He said (that) he was tired. (no object)
  - 'He told me (that) he was tired. (with object: me)'
  rule: 'Say vs tell: ''say'' does not take an object; ''tell'' requires an object (tell someone)'
  type: grammatical
- examples:
  - '''Do you like coffee?'' → He asked if I liked coffee. (NOT ''did I like'')'
  - '''Where do you live?'' → She asked where I lived. (NOT ''where did I live'')'
  rule: Reported questions use statement word order (subject before verb), not question order
  type: grammatical
- examples:
  - He said that he was tired. = He said he was tired.
  rule: The word 'that' is optional in reported statements
  type: grammatical
teaching:
  methodology: PPP with transformation drills
  recommended_activities:
  - adaptation_notes: 'Student A says a sentence. Student B reports it to Student C: ''Maria said she was tired.'' Student
      C reports to Student D. Practices reported speech in a fun chain.'
    duration: 15
    name: Telephone Game
  - adaptation_notes: 'Give students direct speech sentences. They convert to reported speech: ''I am happy.'' → He said he
      was happy. Then check as a class.'
    duration: 10
    name: Direct to Reported
  - adaptation_notes: 'Students play the role of news reporters. They interview classmates about their weekend, then report
      to the class: ''Pedro said he had visited his grandmother.'' Practices past tense reporting.'
    duration: 15
    name: News Reporter
  - adaptation_notes: 'Teacher asks direct questions. Students report them: ''Where do you live?'' → The teacher asked where
      I lived. Practices question transformation.'
    duration: 10
    name: Reported Questions
  tips:
  - 'Parrott (2000) Ch. 18: Reported speech requires considering context — who the audience is, whether the original statement
    is still true. Direct and reported speech are rarely interchangeable: direct speech conveys exact words (dramatising),
    while reported speech summarises. Learners need multiple reporting verbs (say, tell, explain, suggest) and must know the
    clause patterns that follow them.'
  - 'Parrott (2000): Parrott (2000) Ch. 18: Direct to reported speech requires backshift (present to past), pronoun changes,
    and time/place word changes. Exceptions: still true facts, reporting verb in present, general truths. Say vs tell: tell
    + person. Reporting questions: if/whether (yes/no), wh-word (wh-questions), no inversion, no do/does/did.'
  - 'GB3 Ch. 24: Deictic shifts in reported speech — not just tense but also pronouns (I/we → she/they), time adverbials (tomorrow
    → the next day, yesterday → the day before), and place/demonstratives (this → that). There are two reference systems:
    speaker-time (current moment) and shifted-time (past reference point). Teaching insight: manage these systematically rather
    than teaching backshift alone. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch. 24 33.1.'
  - Start with direct to indirect transformations using a simple timeline' a mechanical tense-change exercise. In authentic
    communication, speakers often do NOT backshift when the reported situation is still true or relevant.
  - 'Teach tense backshift systematically: present → past, past → past perfect, future → would. Use a chart on the board.'
  - 'Practice pronoun changes explicitly: I → he/she, you → I, my → his/her. This is a common source of errors.'
  - 'Use direct speech cards: students convert direct quotes to reported speech in pairs. Start with statements, then move
    to questions.'
  - 'Teach the difference between ''say'' and ''tell'': ''say'' (no object) vs ''tell'' (with object). Drill: ''He said...''
    vs ''He told me...'''
  - Emphasize that reported questions use statement word order (no auxiliary inversion). This is one of the most common errors.
  - 'Swan PEU: Backshifting is OMMITTED when the situation is still true. ''She said she lives in London'' (she still does)
    vs ''She said she lived in London'' (ambiguous or no longer true).'
  - 'Swan PEU: ''Say'' vs ''tell'' — ''tell'' always has a personal object. ''Tell me'', ''tell her'', ''tell them''. ''Say''
    → ''He said that...'' / ''He said to me that...''.'
  - 'Swan PEU: Reporting questions — use ''ask'' + if/whether for yes/no questions. ''She asked if I was coming.'' NOT ''She
    asked was I coming.'''
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 11: CGEL (Ch.11) analyzes reported speech as CONTENT
    CLAUSE complementation. Direct speech: ''She said: "I am tired"'' (supplement — not syntactically integrated). Indirect
    speech: ''She said [that she was tired]'' (integrated content clause). CGEL distinguishes declarative content clauses
    (that-clauses), interrogative content clauses (whether/if/wh-), and other types. Backshift is not obligatory when the
    situation still holds: ''She said she is tired'' (still true now).'
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle. Ch. 24: GB3 Ch. 24 distinguishes
    DIRECT speech (supplement — not syntactically integrated: ''She said: "I am tired"'') from INDIRECT speech (integrated
    content clause: ''She said [that she was tired]''). Direct speech has no backshift requirement and preserves the original
    tense. Indirect speech requires backshift when the reporting verb is in the past: ''am'' → ''was.'' Backshift is NOT obligatory
    when the situation still holds: ''She said she is tired'' (still true now).'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'DEICTIC SHIFTS IN REPORTED SPEECH: Reported speech requires systematic deictic shifts: time (yesterday → the day before/the
    previous day), place (here → there), pronouns (you → I/he/she), demonstratives (this → that). However, with universal
    truths these shifts are optional: ''He said the earth IS round'' (still true now) vs. ''He said the earth WAS round''
    (backshifted). Source: Ch.24 p.452-455.'
title: Reported Speech (Indirect Speech)
use:
- context: Reporting statements
  description: Retelling what someone said
  examples:
  - She said (that) she was leaving.
  - He told me (that) he liked pizza.
  - They said (that) they would help us.
- context: Reporting yes/no questions
  description: Retelling questions that can be answered with yes or no
  examples:
  - He asked if I was hungry.
  - She asked whether I had a car.
  - They asked if we wanted to come.
- context: Reporting wh- questions
  description: Retelling questions that begin with what, where, when, why, who, how
  examples:
  - He asked where I lived.
  - She asked why I was late.
  - They asked how I knew.
- context: News reporting
  description: Journalists use reported speech to convey what sources said
  examples:
  - The president said that the economy was improving.
  - The spokesperson told reporters that the meeting had been postponed.
  - Witnesses said they had seen a man running from the scene.
