common_errors:
- correction: take a photo
  error: '*make a photo*'
  explanation: Collocations are fixed. We take photos, not make them.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: make a decision
  error: 'Using ''do'' with ''decision'': *''do a decision'''
  explanation: 'Swan PEU: Collocations are fixed in English. "Make a decision" not "do a decision". Other make/do pairs: make
    a mistake, do homework, make progress, do research.'
  l1_groups: &id001
  - Portuguese
  - Spanish
  - French
  - French
  reliability: B
  source: Swan Entry 57. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: fast food
  error: 'Using ''fast'' with ''food'' (BrE): *''quick food'''
  explanation: 'Swan PEU: "Fast food" is a fixed collocation. "Quick food" sounds unnatural despite being logical.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - French
  - German
  - Italian
  - Chinese
  - Japanese
  - Arabic
  - Russian
  reliability: B
  source: Swan Entry 57. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: heavy rain
  error: 'Using ''strong'' with ''rain'': *''strong rain'''
  explanation: 'Swan PEU: "Heavy rain" is the correct collocation. "Strong rain" is a literal translation from many L1s.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - French
  - Japanese
  reliability: B
  source: Swan Entry 57. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: serious problem / major problem
  error: 'Using ''big'' with ''problem'' for seriousness: *''big problem'' (formal context)'
  explanation: 'Swan PEU: While "big problem" is common in speech, "serious problem" or "major problem" are more precise collocations
    in formal/written English.'
  l1_groups: *id001
  reliability: B
  source: Swan Entry 57. Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Words that naturally go together in English, forming fixed or semi-fixed combinations that sound natural to native
  speakers (e.g., 'make a decision' not 'do a decision').
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - food and daily routines
      - weather and nature
      - social interactions
      min_examples: 4
    structure: 'Verb + Noun: "make a mistake", "take a photo", "do homework"

      Adjective + Noun: "heavy rain", "strong coffee", "bright idea"

      Adverb + Adjective: "deeply sorry", "highly likely", "completely wrong"

      Noun + Noun: "bus stop", "credit card", "weather forecast"

      '
  negative:
    example_generator:
      contexts:
      - work and professional life
      - education and school
      min_examples: 4
    structure: 'Collocations are negated by negating the verb or adjective: ''She didn''t make a mistake.'' ''It''s not heavy
      rain.'''
  questions:
    example_generator:
      contexts:
      - weather and nature
      min_examples: 4
    structure: 'Invert verb for questions: ''Did you make a mistake?'' ''Is it heavy rain?'''
grammar_point: collocations
key_principles: []
level: B1
meaning:
  ccqs:
  - answer: '''Make a decision'' is the correct collocation in English.'
    purpose: Tests whether the learner understands that collocations are fixed word combinations that cannot be predicted
      from individual word meanings. 'Make a decision' is correct; 'do a decision' sounds unnatural to native speakers even
      though 'do' and 'make' are similar verbs.
    question: Do we say 'make a decision' or 'do a decision'?
  - answer: '''Heavy rain''. ''Strong rain'' is a literal translation that sounds unnatural.'
    purpose: Tests whether the learner knows which words naturally combine in English. Collocations are arbitrary and must
      be learned as fixed chunks rather than translated from L1.
    question: '''Heavy rain'' and ''strong rain'' — which sounds natural to a native speaker?'
  - answer: '''Fast food'' is the fixed collocation. ''Quick food'' sounds unnatural.'
    purpose: Tests whether the learner understands that verb-noun collocations (make a mistake, take a photo, do homework)
      are arbitrary pairings that cannot be predicted from the meaning of the individual words. Choosing the correct verb
      (make vs. take vs. do) is one of the most persistent challenges for B1 learners and requires memorization of chunks
      rather than translation from L1.
    question: Can we say 'fast food' or 'quick food'?
  - answer: '''Take a photo'' and ''make a mistake.'' English collocations are fixed: take a photo (not *make), make a mistake
      (not *do).'
    purpose: Tests whether the learner knows common English collocations (Swan PEU 2016, entry 29).
    question: Which is correct? *'make a photo' or 'take a photo'? And *'do a mistake' or 'make a mistake'?
  contrast: '''Correct collocation'' = Natural: "make a decision"

    ''Incorrect literal translation'' = Unnatural: "do a decision"

    ''Strong collocation'' = Fixed: "fast food" (never "quick food")

    ''Weak collocation'' = Flexible: "big house" (also "large house")

    '
  core_meaning: Fixed or semi-fixed word combinations that are natural in English, not determined by grammar rules but by
    common usage.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Collocations are not tense-based; they apply to all tenses and word forms.)
phonetics:
- example_generator:
    contexts:
    - collocation chunks
  l1_issue: Learners may pronounce each word separately, sounding stilted. Teach collocations as single units.
  note: 'Collocations are often pronounced as chunks with connected speech: ''make a decision'' → /meɪk ə dɪˈsɪʒən/, ''take
    a break'' → /teɪk ə breɪk/.'
register_notes:
- note: Biber et al. (2021) — Lexico-grammatical patterns and lexical bundles differ markedly between registers. Conversation
    uses pronoun + verb bundles; academic prose uses noun phrase + of-phrase bundles. Teaching register-appropriate collocations
    is essential. Ch. 13.2
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 13.2
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - make a decision (NOT do a decision)
  - take a photo (NOT make a photo)
  - heavy rain (NOT strong rain)
  rule: Collocations are words that naturally go together in English. Using the wrong collocation sounds unnatural even if
    the grammar is correct
  type: lexical
- examples:
  - make a mistake
  - take a break
  - do homework
  - pay attention
  - catch a cold
  rule: Verb + noun collocations are the most common type and must be learned as chunks
  type: lexical
- examples:
  - fast food (NOT quick food)
  - strong coffee (NOT powerful coffee)
  - heavy smoker (NOT big smoker)
  rule: Adjective + noun collocations often have no logical pattern and must be memorized
  type: lexical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students match verbs to their correct nouns: make/do, take/pay, etc.'
    duration: 10
    name: Collocation Matching
  - adaptation_notes: Give students a text with deliberate collocation errors. Students identify and correct them.
    duration: 15
    name: Wrong Collocation Hunt
  - adaptation_notes: Students keep a diary of new collocations they encounter and share with the class.
    duration: 10
    name: Collocation Diary
  tips:
  - 'Week 1: Verb-noun collocations (do, make, take, have).'
  - 'Week 2: Adjective-noun and adverb-adjective collocations.'
  - 'Week 3: Noun-noun collocations and fluency practice.'
  - 'Use collocation cards: Write verb on one side, noun on the other, match them.'
  - 'Swan PEU: The make/do distinction is one of the most common collocation errors. Teach: make = create/produce (make a
    decision, make a mistake, make progress). Do = perform an action (do homework, do research, do the dishes).'
  - 'Swan PEU: Strong vs weak collocations. Strong = fixed (fast food, heavy rain). Weak = flexible (big/large house, good/nice
    day).'
title: Collocations (Natural Word Combinations)
use:
- description: Common verb and noun pairings (e.g., do, make, take, have).
  examples:
  - do the dishes
  - make breakfast
  - take a break
  - have a shower
  key_point: Memorize verb-noun pairs as single units.
  name: Verb-Noun Collocations
- description: Natural adjective and noun pairings.
  examples:
  - strong tea
  - bitter cold
  - false alarm
  - public transport
  key_point: Avoid literal translations from L1.
  name: Adjective-Noun Collocations
- description: Natural adverb and adjective pairings.
  examples:
  - utterly exhausted
  - tightly secured
  - well prepared
  - badly damaged
  key_point: These improve fluency and sound more native.
  name: Adverb-Adjective Collocations
- description: Two nouns combined to form a single concept.
  examples:
  - phone charger
  - bus driver
  - coffee cup
  - history book
  key_point: Often written as single words or hyphenated.
  name: Noun-Noun Collocations
