grammar_point: infinitive_of_purpose
level: B1
meaning:
  ccqs:
  - answer: Yes — it shows the purpose or reason.
    purpose: Tests whether the learner understands that 'to + base verb' expresses purpose (why someone does something). This
      is one of the most common uses of the infinitive.
    question: Does 'to + verb' explain why someone does something?
  - answer: Yes — 'to + verb' can stand alone as a short answer about purpose.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Can we answer 'Why did you go?' with 'To buy milk'...' checks conceptual understanding, not just memorization.
    question: Can we answer 'Why did you go?' with 'To buy milk'?
  - answer: No — 'for' must be followed by a noun (for milk), not a verb. Use 'to + verb' for purpose with a verb.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Is 'I went to the store to buy milk' the same as '...' checks conceptual understanding, not just memorization.
    question: Is 'I went to the store to buy milk' the same as 'I went to the store for buy milk'?
  - answer: Yes — 'I went to buy milk' means I buy the milk. For different subjects, use 'for + person + to'.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Does the subject of the main clause and the infini...' checks conceptual understanding, not just memorization.
    question: Does the subject of the main clause and the infinitive have to be the same person?
  contrast: '''I went to the store to buy milk.'' = purpose (why I went).


    ''I went to the store and bought milk.'' = sequence of actions (no purpose, just what happened).


    '
  core_meaning: Explains the reason or goal behind an action. The infinitive tells you the purpose.
  example_generator:
    contexts:
    - everyday situations
    - shopping and commerce
    - social interactions
    - work and professional life
    cultural_notes:
    - One of the first ways learners express purpose in English — simpler than 'so that' or 'in order to'
    - Common in instructions, recipes, and directions
    min_examples: 5
  timeline: The purpose comes after the action in the sentence, but logically it exists before (it's the reason you do the
    action).
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Learners may over-pronounce 'to' as /tuː/ in all positions, sounding unnatural in fluent speech.
  note: The 'to' in infinitive of purpose is often reduced to /tə/ in connected speech
- example_generator:
    contexts:
    - sentence stress
  l1_issue: Equal stress on all words makes the purpose less clear to listeners.
  note: 'Stress falls on the main verb of purpose, not on ''to'': I went to the shop to BUY milk.'
