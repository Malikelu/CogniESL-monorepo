grammar_point: continuous_perfect_infinitive
level: C1
meaning:
  ccqs:
  - answer: Ongoing = continuous, completed = perfect
    purpose: Tests whether the learner understands that '-ed' adjectives describe how someone feels (experiencer) while '-ing'
      adjectives describe what causes the feeling (stimulus).
    question: Is the action ongoing or completed?
  - answer: Yes — continuous or perfect infinitive.
    purpose: Tests whether the learner can distinguish between perfect and continuous infinitive forms in context.
    question: Does the infinitive show aspect?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with continuous perfect infinitive and explain
      why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with continuous perfect infinitive.
      Recognizing typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: Simple infinitive = I want to go. vs Continuous = I want to be going. (ongoing)
  core_meaning: Infinitives can show aspect. Continuous infinitive = ongoing action. Perfect infinitive = completed action.
    Perfect continuous = ongoing action completed before another point.
  example_generator:
    contexts:
    - after certain verbs
    - expressing regret
    - reporting
    - formal writing
    cultural_notes: []
    min_examples: 5
  timeline: Continuous = ongoing. Perfect = completed before reference point. Perfect continuous = ongoing and completed.
