common_errors:
- correction: He seems to work very hard.
  error: '*He seems to works very hard.*'
  explanation: After infinitive 'to', always use the base form of the verb (without -s). Adding third-person -s to an infinitive
    verb is a common agreement error.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: D
- correction: I would like to have travelled the world.
  error: '*I would like to have been travel the world.*'
  explanation: After 'to have', use the past participle (not base verb). Perfect infinitive = to have + past participle. Using
    the base form shows incomplete acquisition of the perfect infinitive structure.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
- correction: She is said to be the best doctor.
  error: '*She is said being the best doctor.*'
  explanation: After passive reporting verbs, use 'to + infinitive', not '-ing'. The structure is 'be said to be' or 'be said
    to do'. Learners who overgeneralize progressive forms might use '-ing' here.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: D
- correction: He seems to have finished the project.
  error: '*He seems to has finished the project.*'
  explanation: After infinitive 'to', use the base form 'have' (not 'has'). Third-person singular -s is never added to infinitive
    verbs.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Arabic
  reliability: D
description: 'Infinitive forms showing aspect: continuous (to be doing), perfect (to have done), perfect continuous (to have
  been doing).'
