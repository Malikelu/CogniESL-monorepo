citations:
- claim: 'Core meaning: Adverbs of frequency tell us how often something happens —
    from 100% (always) to 0% (never)'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25:
    Adverbs (frequency adverbs)'
  tier: 1
- claim: 'Register distribution: Frequency adverbs are neutral in register.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25:
    Adverbs (frequency adverbs)'
  tier: 1
- claim: 'Discourse function: Frequency adverbs create habitual meaning: ''I always
    wake up at 7.'''
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25:
    Adverbs (frequency adverbs)'
  tier: 1
- claim: 'Common error ''Placing frequency adverbs after the main verb: *''I go always''
    for Portuguese, Spanish, French speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 25: Adverbs'
  tier: 1
common_errors:
- correction: I always go to school.
  error: 'Placing frequency adverbs after the main verb: *''I go always to school.'''
  explanation: Place frequency adverbs before the main verb (but after 'be').
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
- correction: I am always happy.
  error: 'Placing frequency adverbs after ''be'': *''I always am happy.'''
  explanation: Place frequency adverbs after 'be', before other verbs.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
- correction: I am always late.
  error: 'Placing frequency adverb incorrectly: *''I always am late.'''
  explanation: 'Swan PEU: Frequency adverbs (always, usually, often, sometimes, never
    etc.) go AFTER ''be'' but BEFORE other verbs. ''She is always happy'' vs ''She
    always arrives early''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I never go there.
  error: 'Using ''never'' with negative verb: *''I don''t never go there.'''
  explanation: 'Swan PEU: ''Never'' is already negative. Don''t use ''not...never''.
    ''Never'' alone replaces ''not...ever''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: I sometimes go to the gym in the evening.
  error: '*I go sometimes to the gym in the evening.*'
  explanation: Frequency adverbs like 'sometimes' go before the main verb, not after.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: 'Words that tell us how often something happens: always, usually, often,
  sometimes, rarely, never.'
dialectal_variation: []
discourse_notes:
- note: 'Frequency adverbs create habitual meaning: ''I always wake up at 7.'''
- note: In narratives, frequency adverbs establish routine actions and habits that
    characterize people or situations over time.
form:
  affirmative:
    example_generator:
      contexts:
      - daily routines
      - habits and preferences
      - schedules and timetables
      min_examples: 4
    structure: 'Subject + adverb + verb: ''I always wake up early.'' / Subject + be
      + adverb: ''He is never late.'''
  negative:
    example_generator:
      contexts:
      - daily routines
      - habits and preferences
      - schedules and timetables
      min_examples: 4
    structure: 'Use ''never'' for negative meaning: ''I never eat meat.'' (not ''I
      don''t never'')'
  questions:
    example_generator:
      contexts:
      - daily routines
      - habits and preferences
      - schedules and timetables
      min_examples: 4
    structure: 'How often + do/does + subject + verb?: ''How often do you exercise?'''
grammar_point: adverbs_frequency
level: A1
meaning:
  ccqs:
  - answer: Yes = always, No = never
    purpose: Tests whether the learner understands that adverbs of frequency describe
      how often something happens, from always (100%) to never (0%).
    question: Does this happen all the time?
  - answer: More = usually/often, Less = sometimes/rarely
    purpose: Tests whether the learner can distinguish between high-frequency adverbs
      (always/often) and low-frequency adverbs (sometimes/rarely). This distinction
      is important because choosing the wrong frequency adverb can significantly change
      the meaning of a sentence.
    question: Is it more than 50% or less than 50%?
  - answer: I always get up early. Always goes in mid-position. Always/ever/rarely/seldom/never
      cannot normally go in front position.
    purpose: Tests whether the learner knows the front-position restriction for frequency
      adverbs (Swan PEU 2016, entry 198).
    question: Which is correct? 'I always get up early' or *'Always I get up early'?
  - answer: 'No — longer frequency phrases like ''''from time to time'''' cannot go
      in mid-position. They go in end position: ''''I visit my old school from time
      to time.'''''
    purpose: Tests whether the learner understands that longer adverbials do not go
      in mid-position (Swan PEU 2016, entry 198).
    question: Can you say *'I from time to time visit my old school'? Where does 'from
      time to time' go?
  contrast: '''Always'' = 100% of the time vs ''Never'' = 0% of the time'
  core_meaning: Adverbs of frequency tell us how often something happens — from 100%
    (always) to 0% (never).
  example_generator:
    contexts:
    - daily routines
    - habits and preferences
    - schedules and timetables
    - lifestyle
    cultural_notes: []
    min_examples: 5
  timeline: Timeless — describes habitual frequency.
phonetics:
- contexts:
  - pronunciation
  example_generator:
    contexts:
    - connected speech
  l1_issue: Word order — some L1 speakers put the adverb at the end of the sentence
  note: 'Stress on first syllable: /ˈɔːlweɪz/, /ˈjuːʒuəli/'
register_notes:
- note: Frequency adverbs are neutral in register.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Frequency adverbs: register distribution differs. Academic
    prose uses fewer frequency adverbs; conversation uses them more naturally. Ch.
    7.14.3'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 7.14.3
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch.
    14: Adverbs'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 25:
    Adverbs (frequency adverbs)'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Ch. 6: Adverbs (frequency expressions)'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners.
    Ch. 11: Adverbs of frequency'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(frequency adverbs: always,
    usually, often, sometimes, rarely, never)'
sub_rules:
- examples:
  - I always eat breakfast. (before verb)
  - She is always happy. (after be)
  rule: 'Position: before main verb, after ''be'''
  type: word_order
- examples:
  - I always brush my teeth. (100%)
  - I never eat insects. (0%)
  rule: 'Scale: always (100%) > usually > often > sometimes > rarely > never (0%)'
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students ask classmates 'How often do you...?' and report results.
    duration: 15
    name: Frequency Survey
  tips:
  - Use a frequency line (0%-100%) to visualize
  - Have students survey classmates about habits
  - 'Swan PEU: Adverb order — frequency adverbs before main verbs, after ''be''. Mid-position:
    subject + adverb + verb. ''She always wears black.'' / ''She is always happy.'''
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle.
    Ch. 25: GB 2nd ed. (Ch.25) explains frequency adverb position: mid-position (after
    auxiliary, before lexical verb) is the default: ''She always comes,'' ''She has
    always come.'' Initial position adds emphasis or contrast: ''Always, she comes
    on time'' (emphatic). Final position is less common for frequency adverbs and
    can sound unnatural: ? ''She comes always on time.'''
title: Adverbs of Frequency
use:
- context: Daily routines
  description: Describing how often you do things
  examples:
  - I always have breakfast.
  - She never drinks coffee.
- context: Habits and preferences
  description: Talking about regular activities
  examples:
  - We often go to the park on Sundays.
  - He rarely watches TV.
