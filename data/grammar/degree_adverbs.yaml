description: Adverbs that modify adjectives or other adverbs to show intensity. Essential for gradation and emphasis.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - sports and hobbies
      - weather and nature
      min_examples: 4
    structure: 'Degree adverb + adjective/adverb: "very hot", "quite quickly"

      Too + adjective + for + noun: "too hot for coffee"

      Adjective + enough (+ for + noun): "warm enough (for tea)"

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Degree adverb position unchanged: ''It''s not very hot.'''
  questions:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Degree adverb before adjective: ''Is it very cold?'' ''Is it too expensive?'''
grammar_point: degree_adverbs
level: A2
meaning:
  ccqs:
  - answer: No — 'very hot' means it has a high temperature, probably too hot to touch.
    purpose: 'Tests whether the learner understands degree adverbs and their different meanings: ''very'' (high degree), ''too''
      (excessive, negative), and ''enough'' (sufficient, positive).'
    question: Is 'very hot' comfortable to touch?
  - answer: No — 'too' means more than wanted or needed, with a negative meaning.
    purpose: 'Tests whether the learner understands degree adverbs and their different meanings: ''very'' (high degree), ''too''
      (excessive, negative), and ''enough'' (sufficient, positive).'
    question: Does 'too heavy' mean the weight is acceptable?
  - answer: Yes — 'enough' means sufficient.
    purpose: Tests whether the learner understands that 'enough' expresses sufficiency for a purpose. The structure 'adjective
      + enough + to + infinitive' means the degree is sufficient to achieve the result.
    question: If she is 'tall enough to reach the shelf,' can she reach it?
  - answer: Much' — we say 'much happier,' not 'very happier.' Degree adverbs like 'very' and 'extremely' go before base adjectives,
      but 'much,' 'a lot,' and 'far' go before comparatives.
    purpose: Tests whether the learner knows that degree adverbs have different distribution rules depending on adjective
      form. 'Very' modifies base adjectives ('very happy') while 'much' modifies comparatives ('much happier'). This is a
      common error with L1 speakers who say '*very happier.'
    question: Does 'very' or 'much' go before the comparative in the expression ___ happier?
  contrast: '''Very'' = high degree (neutral)

    ''Too'' = excessive (negative meaning)

    ''Enough'' = sufficient (positive meaning)

    ''Quite'' = moderate degree (UK: less; US: more)

    ''Extremely'' = highest degree

    '
  core_meaning: 'Indicates the intensity or degree of a quality: low (slightly) to high (extremely).'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Degree adverbs describe intensity, not time.)
phonetics:
- example_generator:
    contexts:
    - degree adverb stress
  l1_issue: Learners may not stress the degree adverb sufficiently, making the intensification less effective.
  note: 'Degree adverbs are usually stressed when they intensify: ''It was VERY hot.'' ''She is EXTREMELY talented.'''
register_notes:
- note: 'Biber et al. (2021) — Degree adverbs (''very'', ''really'', ''extremely'', ''quite''): conversation uses ''very''
    and ''really'' far more than academic prose; academic prose uses more formal intensifiers (''considerably'', ''substantially'').
    Ch. 12.5'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 12.5
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - very hot
  - extremely difficult
  - incredibly beautiful
  rule: Very, extremely, incredibly intensify adjectives and go before them
  type: grammatical
- examples:
  - fairly good (OK but not great)
  - quite nice (pleasant)
  - rather difficult (more than expected)
  rule: Fairly, quite, rather reduce or moderate adjectives
  type: grammatical
- examples:
  - much better
  - a lot more expensive
  - far more interesting
  rule: Much, a lot, far go before comparative adjectives to intensify them
  type: grammatical
teaching:
  methodology: Use a lexical-set approach grouped by function (intensifiers, excess, sufficiency). Present through visual
    scales and realia (thermometer, objects of different sizes). Controlled practice via gap-fills and sentence transformation,
    followed by communicative tasks (problem-solving scenarios, object comparisons). Contrastive analysis with L1 helps clarify
    the very/too/enough distinction.
  recommended_activities:
  - adaptation_notes: 'Students arrange adverbs on a scale from weak to strong: slightly, fairly, quite, very, extremely,
      incredibly.'
    duration: 10
    name: Intensity Scale
  - adaptation_notes: 'Show dramatic photos. Students describe them: ''The sunset is incredibly beautiful. The mountain is
      extremely tall.'''
    duration: 15
    name: Describe the Picture
  tips:
  - 'Use temperature scale: freezing → cold → cool → warm → hot → boiling with degree adverbs.'
  - 'Practice ''too'' vs ''enough'' with real objects: ''Is this book too heavy? Heavy enough?'''
  - 'Show ''very'' vs ''too'' difference: ''very hungry'' (good) vs ''too hungry'' (uncomfortable).'
  - 'Swan PEU: Degree adverbs modify adjectives and other adverbs. Scale (weakest to strongest): slightly < fairly < quite
    < pretty < very < extremely < absolutely. ''Very cold'' vs ''absolutely freezing.'' Teach the gradation explicitly.'
  - 'Swan PEU: ''Quite'' has two meanings: (1) ''fairly/rather'' with gradable adjectives: ''quite good'' (fairly good), ''quite
    big''; (2) ''completely'' with non-gradable adjectives: ''quite perfect,'' ''quite impossible,'' ''quite dead.'' Context
    determines which meaning applies.'
  - 'Swan PEU: ''Rather'' often has a negative/complaining connotation: ''rather cold'' implies uncomfortably cold. ''Fairly''
    is more neutral: ''fairly cold'' simply comments on degree. This pragmatic distinction is important for natural-sounding
    English.'
title: Degree Adverbs (very, quite, too, enough, extremely)
use:
- description: Make adjectives stronger or weaker.
  examples:
  - very tired
  - extremely difficult
  - slightly nervous
  key_point: Very is most common intensifier for adjectives.
  name: Intensifying Adjectives
- description: Show something is more than needed or wanted.
  examples:
  - too noisy
  - too expensive
  - too fast
  key_point: Too has negative meaning = 'more than good/necessary'.
  name: Expressing Excess
- description: Show something is adequate or sufficient.
  examples:
  - big enough
  - warm enough
  - experienced enough
  key_point: Enough comes AFTER adjective (different from very/too).
  name: Expressing Sufficiency
