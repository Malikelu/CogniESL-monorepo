sub_rules:
- examples:
  - go to school
  - come to my house
  - walk to the park
  - drive to work
  - fly to London
  rule: 'To: movement toward a destination (go to school, come to my house, walk to
    the park)'
  type: grammatical
- examples:
  - come from Spain
  - from the beginning
  - from here to there
  - from my house to school
  rule: 'From: starting point of movement (come from Spain, from the beginning, from
    here)'
  type: grammatical
- examples:
  - walk into the room
  - jump into the pool
  - get into the car
  - go into the building
  rule: 'Into: entering a 3D space (walk into the room, jump into the pool, get into
    the car)'
  type: grammatical
- examples:
  - walk out of the room
  - get out of the car
  - run out of the building
  - climb out of the window
  rule: 'Out of: exiting a 3D space (walk out of the room, get out of the car, run
    out of the building)'
  type: grammatical
- examples:
  - walk across the street
  - swim across the river
  - fly across the ocean
  - run across the field
  rule: 'Across: movement on a surface (walk across the street, swim across the river,
    fly across the ocean)'
  type: grammatical
- examples:
  - drive through the tunnel
  - walk through the forest
  - look through the window
  - go through the door
  rule: 'Through: movement inside or among something (drive through the tunnel, walk
    through the forest, look through the window)'
  type: grammatical
- examples:
  - go home (NOT go to home)
  - go to school
  - go to the park
  - go to work
  rule: 'Exception: ''go home'' (no preposition) vs ''go to school'' (with preposition)'
  type: grammatical
teaching:
  methodology: PPP with physical movement and maps
  recommended_activities:
  - adaptation_notes: 'Teacher gives commands: ''Walk to the door. Go into the hallway.
      Run across the room.'' Students physically perform the actions. Makes the grammar
      physical.'
    duration: 10
    name: Classroom Movement
  - adaptation_notes: 'Students give directions using a map: ''Go from the station
      to the park through the city center.'' Practices prepositions with real locations.'
    duration: 15
    name: Map Directions
  - adaptation_notes: 'Teacher says a destination. Students choose the correct preposition:
      ''___ school'' (to), ''___ Spain'' (from), ''___ the room'' (into).'
    duration: 10
    name: To, From, or Into?
  - adaptation_notes: 'Students write a short story about a journey using at least
      6 prepositions of movement: ''I went to the station. I came from home. I walked
      through the park...'''
    duration: 15
    name: Story Journey
  tips:
  - 'Use the classroom: students physically move ''to the door'', ''into the hallway'',
    ''across the front''. This makes the meaning physical and memorable.'
  - 'Draw arrows on the board: → (to), ← (from), ↗ (through), ↔ (across). Visual support
    helps.'
  - 'Practice with maps: ''Go from A to B through C.'' Uses prepositions in a real
    context.'
  - 'Teach the exception: ''go home'' (no preposition) vs ''go to school'' (with preposition).
    This is a very common error.'
  - 'Use action verbs: walk, run, drive, fly, swim, jump. These naturally pair with
    movement prepositions.'
  - 'Swan PEU: Direction prepositions — to (destination), into (entry to enclosed),
    onto (movement to surface), through (passing within), across (crossing), along
    (following), up/down, over/under, towards (direction without arrival).'
  - 'Swan PEU: Compare movement prepositions: ''walk across the road'' (cross surface),
    ''walk through the tunnel'' (pass within), ''walk along the beach'' (follow path).
    Each describes a different type of spatial relationship.'
title: Prepositions of Movement (to, from, into, out of, across, through)
use:
- context: Daily travel
  description: Talking about regular travel routes
  examples:
  - I go to school by bus.
  - She walks to work.
  - He drives to the office.
  - They come from the city center.
  - We go home at 5pm.
- context: Giving directions
  description: Telling someone how to get somewhere
  examples:
  - Go to the end of the street.
  - Turn left and walk across the park.
  - Go through the tunnel.
  - Come from the station and go into the building.
  - Walk along the road until you see the bank.
- context: Describing movement
  description: Talking about how someone or something moves
  examples:
  - The cat jumped into the box.
  - She ran across the street.
  - He walked through the door.
  - They swam across the river.
  - The bird flew through the window.
