common_errors:
- correction: I went into the park.
  error: 'Using ''to'' when ''into'' is needed: *''I went to the park.'' (meaning:
    entered the park)'
  explanation: Use 'into' for movement from outside to inside. 'To' for direction
    toward.
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan Entry 212. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: I walked into the room.
  error: 'Confusing ''in'' and ''into'': *''I walked in the room.'' (movement)'
  explanation: Use 'into' for movement. 'In' for location.
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan Entry 212. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- error: Spatial preposition errors reflect conceptual transfer, not just formal L1-L2
    mapping (Golden et al. Ch.4)
  explanation: 'Golden et al. (2017) Ch.4 (Szymańska): Conceptualization of objects
    as containers vs. surfaces varies crosslinguistically and affects preposition
    choice even when L1 and L2 are genealogically related. Counter-intuitively, English-speaking
    learners performed NO BETTER than Slavic learners on Norwegian spatial prepositions
    despite shared Germanic origin. English "in/on" conceptual mapping differs from
    Norwegian "i/pa": Norwegian uses "på" extensively for institutional/social activities
    where English uses "at" or "on". Spatial preposition accuracy is driven by conceptual
    fit, not similar.'
  l1_groups:
  - All L1s — conceptual transfer affects all learners
  reliability: C
  source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
    of Language Learning, Ch. 4
description: Words that show direction of movement from one place to another. Essential
  for describing travel and motion.
dialectal_variation: []
discourse_notes:
- note: 'Prepositions of movement create dynamic descriptions: ''She walked into the
    room and sat down.'''
- note: Prepositions of movement are among the most frequent words in English and
    are used across all registers, with spatial prepositions particularly common in
    narrative and fiction writing.
form:
  affirmative:
    example_generator:
    - I go to school.
    - She came from Spain.
    - He walked into the room.
    - They ran across the street.
    - We drove through the tunnel.
    min_examples: 4
    structure: Verb of movement + preposition + destination/source
  negative:
    example_generator:
    - I don't go to school on Sundays.
    - She didn't come from Spain.
    - He didn't walk into the room.
    min_examples: 4
    structure: Subject + don't/doesn't/didn't + verb + preposition + destination
  questions:
    example_generator:
    - Where did you go?
    - Where are you from?
    - Where does she go to school?
    min_examples: 4
    structure: Where + do/does/did + subject + go/come from?
grammar_point: prepositions_of_movement
key_principles: []
level: A1
meaning:
  ccqs:
  - answer: Movement — the preposition shows direction of travel.
    purpose: Tests whether the learner understands that prepositions of movement show
      direction of travel, not static position. This is important because confusing
      "in" (position) with "into" (movement) is a very common error.
    question: Is this about movement or static position?
  - answer: '''Go home'' — no preposition before ''home''. We say ''go to school''
      but ''go home''.'
    purpose: Tests whether the learner knows the exception "go home" (no preposition)
      vs. "go to school" (with preposition). This is important because "go to home"
      is one of the most frequent preposition errors at A1 level.
    question: Do we say 'go to home' or 'go home'?
  - answer: '''Across'' = on a surface (across the street). ''Through'' = inside something
      (through the tunnel).'
    purpose: Tests whether the learner understands the difference between "across"
      (surface movement) and "through" (movement inside something). This spatial distinction
      is important for giving and understanding directions.
    question: Can you explain the difference between 'across' and 'through' by giving
      an example of when to use each?
  - answer: '''She arrived in London.'' ''Arrive'' takes ''in'' for cities/countries
      and ''at'' for specific places. NOT *arrive to.'
    purpose: Tests whether the learner knows that 'arrive' takes in/at, not 'to' (Swan
      PEU 2016, entry 7.2).
    question: Which is correct? *'She arrived to London' or 'She arrived in London'?
  contrast: '''To'' = toward a destination (go to school) vs ''From'' = starting point
    (come from Spain) vs ''Into'' = entering a space (walk into the room) vs ''Across''
    = surface movement (walk across the street) vs ''Through'' = movement inside/among
    (drive through the tunnel)'
  core_meaning: Prepositions of movement show the direction or path of movement —
    where something or someone is going. They answer 'Where to?' or 'Where from?'
    The key idea is motion, not static position.
  example_generator:
    contexts:
    - daily travel
    - giving directions
    - describing movement
    cultural_notes:
    - Use diverse locations and contexts
    - Avoid assuming specific cultural knowledge
    - Keep examples concrete and visual
    min_examples: 5
  timeline: N/A — movement prepositions describe direction, not time. They can be
    used with any tense.
phonetics:
- example_generator:
  - to /tə/
  - from /frəm/
  - into /ɪntə/
  - across /əˈkrɒs/
  l1_issue: Portuguese and Spanish speakers often over-pronounce prepositions. Teach
    the weak forms for natural speech.
  note: 'Prepositions of movement are usually unstressed: ''to'' → /tə/, ''from''
    → /frəm/, ''into'' → /ɪntə/. ''I go to school'' sounds like /aɪ gəʊ tə skuːl/.'
- example_generator:
  - want to → wanna /wɒnə/
  - going to → gonna /ɡənə/
  l1_issue: Many L1 speakers are not aware of these reductions. Teach them for listening
    comprehension.
  note: 'Contractions with ''to'': ''want to'' → /wɒnə/, ''going to'' → /ɡənə/, ''got
    to'' → /ɡɒtə/.'
register_notes:
- note: Prepositions of movement are consistent across registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Prepositions of movement: register distribution reflects
    text type. Fiction uses more spatial prepositions (narrative movement); academic
    prose uses fewer. Ch. 5.3.3'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 5.3.3
