  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - Have you ever eaten snails?
  - Has she ever met a celebrity?
  - Have they ever been skiing?
  rule: '''Ever'' in questions — at any time in your life'
  type: semantic
- examples:
  - I have never flown in a helicopter.
  - He has never been abroad.
  - We have never seen a ghost.
  rule: '''Never'' in negatives — not at any time'
  type: semantic
- examples:
  - I have seen this film before.
  - Have you been here before?
  - She has done this kind of work before.
  rule: '''Before'' — at some unspecified time before now'
  type: semantic
- examples:
  - I have been to London three times.
  - She has called twice today.
  - We have watched this film several times.
  rule: '''Once'', ''twice'', ''several times'' — number of times'
  type: semantic
- examples:
  - 'Experiential: I have been to Japan. (life experience)'
  - 'Past simple: I went to Japan in 2019. (specific time)'
  rule: Contrast with past simple — specific time vs. life experience
  type: semantic
teaching:
  methodology: PPP with personalisation
  recommended_activities:
  - adaptation_notes: Students interview each other using 'Have you ever...?' questions. Provide a list of experiences to
      ask about.
    duration: 15
    name: Have you ever...? interview
  - adaptation_notes: Students draw a timeline of their life and write sentences about their experiences using the present
      perfect.
    duration: 15
    name: Life experiences timeline
  - adaptation_notes: Students create a 'bucket list' of things they want to do and things they have already done. Share with
      the class.
    duration: 15
    name: Bucket list
  - adaptation_notes: Give students sentences and have them classify as experiential present perfect or past simple. Discuss
      the difference.
    duration: 10
    name: Experiential vs. past simple sorting
  tips:
  - Use a timeline showing the person's life from birth to now, with an arrow for the experience at an unspecified point.
  - 'Contrast with past simple: ''I have been to Japan'' vs ''I went to Japan in 2019''.'
  - Use 'Have you ever...?' as a conversation starter — students ask each other about experiences.
  - Teach 'ever', 'never', 'before', and 'once/twice/three times' as common adverbs with this structure.
  - 'Swan PEU: Experiential — ''Have you ever been to Paris?'' ''I have visited three countries this year.'' Focus on life
    experience without specifying when. Contrast with past simple which specifies time.'
  - 'GB3 Ch. 7: Experiential use — ''I have visited three countries this year.'' Focus on life experience without specifying
    when. Co-occurs with ''ever'' in questions (''Have you ever been to Paris?''). Source: Celce-Murcia & Larsen-Freeman (2015)
    GB3 Ch. 7 §7.2.'
title: Present Perfect - Experiential (Actions occurring at least once)
use:
- description: Used to discuss places someone has visited or never visited.
  examples:
  - I have been to 15 countries.
  - Have you ever been to South America?
  - She has never left her home town.
  key_point: Very common in conversation and travel discussions.
  name: Talking about travel experiences
- description: Used to describe skills and experiences relevant to a job.
  examples:
  - I have managed a team of 20 people.
  - Have you ever worked abroad?
  - She has experience in project management.
  key_point: The experiential present perfect shows what someone has done in their career.
  name: Job interviews and CVs
- description: Used to ask about shared experiences and interests.
  examples:
  - Have you ever tried Korean food?
  - I have never been to a music festival.
  - Have you seen the new Marvel film?
  key_point: Great conversation starters — helps people find things in common.
  name: Making conversation and finding common ground
- description: Used to talk about significant things someone has done.
  examples:
  - He has climbed Mount Kilimanjaro.
  - She has published three novels.
  - They have raised over 1 million pounds for charity.
  key_point: Celebrates accomplishments without focusing on when they happened.
  name: Life achievements and milestones
