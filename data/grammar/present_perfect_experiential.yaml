grammar_point: present_perfect_experiential
level: B1
meaning:
  ccqs:
  - answer: Yes — the focus is on whether it has happened at all, not when.
    purpose: Tests whether the learner understands the experiential use of present perfect — that it describes actions that
      have occurred at some unspecified point in a person's life up to now, where the exact time is irrelevant.
    question: Is the speaker talking about a life experience without saying exactly when?
  - answer: No — with the experiential present perfect, we do not specify the time.
    contexts:
    - travel experiences
    - life achievements
    - food and culture
    - sports and hobbies
    - job interviews
    cultural_notes:
    - This is one of the most common uses of the present perfect and is essential from B1 onwards
    - In American English, the past simple is sometimes used for experiences ('Did you ever go to Japan?'), which differs
      from British English norms
    min_examples: 5
    purpose: Tests whether the learner knows that specifying a definite past time is incompatible with the experiential present
      perfect, because doing so shifts the focus from life experience to a completed past event (requiring past simple).
    question: Can we say exactly when it happened (e.g., in 2019, last Tuesday)?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with present perfect experiential and explain
      why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I have been to London three times.'' ''Have been to'' (experiential perfect) cannot be used with specific past
      time expressions.'
    purpose: Tests whether the learner distinguishes experiential perfect (have been to) from past simple with time references
      (Swan PEU 2016, entry 47).
    question: Which is correct? *'I have been to London last year' or 'I have been to London three times'?
  contrast: 'Experiential: "I have been to Japan." (at some point in my life — when is not important)

    Past Simple: "I went to Japan in 2019." (specific time — completed action)

    Resultative: "I have lost my keys." (past action with present result — I still cannot find them)

    '
  core_meaning: The experiential present perfect describes actions or events that have happened at least once (or never) in
    someone's life up to the present moment. The exact time is not specified or not important. The focus is on whether the
    experience has occurred at all during the person's lifetime.
  timeline: The time period is the person's entire life up to now. The action happened at some unspecified point within that
    period.
phonetics:
- example_generator:
    contexts:
    - natural conversation
    - interviews
  l1_issue: 'Speakers of languages without perfect tenses (e.g., Mandarin, Japanese) may use the past simple instead: ''I
    went to Japan'' when they mean ''I have been to Japan''.'
  note: '''Have'' is often reduced in connected speech: /əv/ or /v/ — ''I''ve been'' /aɪv biːn/. ''Has'' is reduced to /z/
    or /s/ — ''She''s been'' /ʃiːz biːn/. ''Never'' is stressed for emphasis: ''I have NEVER been there.'''
register_notes:
- note: 'Biber et al. (2021) — Present perfect experiential (''I have been to Paris''): more common in conversation and fiction.
    Academic prose uses fewer experientials and more resultative/completive perfects. Ch. 6.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.3
