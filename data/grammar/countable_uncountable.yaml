common_errors:
- correction: I need some advice. / I need a piece of advice.
  error: '*I need an advice.*'
  explanation: '''Advice'' is uncountable. Cannot use ''an''. Use ''some advice''
    or ''a piece of advice''.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
- correction: much information / a lot of advice
  error: 'Using ''many'' with uncountable nouns: *''many informations'' / *''many
    advice'''
  explanation: 'Swan PEU: ''Many'' for countable, ''much'' for uncountable. Some nouns
    that are countable in other languages (information, advice, progress, research,
    news, furniture, luggage) are uncountable in English.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: a piece of furniture / a piece of luggage
  error: 'Using ''a piece of'' incorrectly: *''a furniture'' / *''a luggage'''
  explanation: 'Swan PEU: Uncountable nouns need a ''measure word'' to express a single
    item. ''A piece of'', ''a bit of'', ''an item of'', ''a sheet of''.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Arabic
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: ''
  error: See Swan & Smith (2001) for L1-specific patterns
  explanation: 'Swan & Smith (2001), Ch. 22. Spanish mass nouns made plural: *furnitures,
    *informations. Also: singular for symmetrical things (*a trouser), irregular plural
    overgeneralization (*childs).'
  flagged: false
  l1_groups:
  - Spanish
  reliability: B
  source: 'Swan & Smith (2001) Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
- correction: accommodation / bread / research / travel / homework
  error: '*an accommodation / *a bread / *a research / *a travel / *a homework'
  explanation: 'Parrott (2000) Ch. 1: Several nouns surprise learners by being uncountable
    in English: accommodation, bread, information, money, news, rubbish, spaghetti,
    travel, weather, homework, research, knowledge. Hair is uncountable when referring
    to the mass (her hair is long) but countable for individual strands (a hair in
    my soup). Some originally-plural nouns are now commonly used as uncountable: data
    (the data is), media (the media is). Parrott recommends teaching these explicitly
    as vocabulary items rather than applying countability rules.

    '
  flagged: false
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  - Russian
  - Arabic
  - Chinese
  - Japanese
  - Korean
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
