description: 'Nouns that can be counted individually (countable: book, apple) vs nouns
  that cannot be counted (uncountable: water, information), with specific quantifiers
  for each.'
dialectal_variation: []
discourse_notes:
- note: The countable/uncountable distinction affects article use, quantifier choice
    (many vs much), and plural marking.
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      - food and drink
      - shopping
      min_examples: 4
    structure: 'Countable: Singular (a/an + noun), plural (noun + s/es): "a book",
      "two books"

      Uncountable: Singular only, no a/an: "water", "information"

      Quantifiers: Countable (many, few, a few, number of); Uncountable (much, little,
      a little, amount of)

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      - shopping
      min_examples: 4
    structure: 'Countable: ''I don''t have any books.'' Uncountable: ''I don''t have
      any water.'''
  questions:
    example_generator:
      contexts:
      - entertainment and media
      - food and drink
      min_examples: 4
    structure: 'Countable: ''Are there any books?'' Uncountable: ''Is there any water?'''
grammar_point: countable_uncountable
level: A1
meaning:
  ccqs:
  - answer: Yes = countable. No = uncountable.
    purpose: Tests whether the learner can apply the 'can you count it?' test to determine
      countability. This is the foundational skill for choosing correct quantifiers
      (many/much, a few/a little, etc.).
    question: Can we count this noun? Can we say 'one book, two books'?
  - answer: Yes = countable (a book). No = uncountable (not 'a water').
    purpose: Tests whether the learner knows that indefinite articles can only be
      used with singular countable nouns. This is a reliable test for countability
      that works for most nouns.
    question: Can we use 'a' or 'an' before this noun?
  - answer: '''Many'' = countable (many books). ''Much'' = uncountable (much water).'
    purpose: Tests whether the learner can choose the correct quantifier based on
      countability. This is essential for natural-sounding English -- saying 'many
      water' or 'much books' is a very common error.
    question: Do we use 'many' or 'much' with this noun?
  - answer: Yes = countable (books, apples). No = uncountable (not 'informations',
      'advices').
    purpose: Tests whether the learner knows that uncountable nouns cannot take plural
      -s. This is one of the most common errors across all L1 groups -- learners pluralize
      uncountable nouns like 'information', 'advice', 'furniture', 'luggage'.
    question: Can this noun have a plural -s?
  contrast: '"Countable" = Can be plural: "book → books"


    "Uncountable" = Always singular: "water (never waters)"


    "Quantifiers" = Many/few for countable; Much/little for uncountable.

    '
  core_meaning: Countable nouns are individual items that can be counted with numbers;
    Uncountable nouns are substances, concepts, or mass nouns that cannot be counted
    individually.
  example_generator:
    contexts:
    - everyday situations
    - food and drink
    - shopping
    - home
    cultural_notes:
    - Some nouns that are countable in other languages are uncountable in English
      (e.g., 'information', 'advice', 'furniture', 'luggage')
    - This is one of the most common sources of errors for beginner learners
    min_examples: 5
  timeline: N/A (Applies to all tenses; noun form does not change with tense).
phonetics:
- example_generator:
    contexts:
    - common errors
  l1_issue: Many languages treat these nouns as countable, leading to overgeneralisation
    of plural -s
  note: 'No phonetic difference, but learners may add plural -s to uncountable nouns:
    *''informations'', *''advices'', *''furnitures'''
- example_generator:
