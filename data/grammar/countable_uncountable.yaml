sub_rules:
- examples:
  - She gave me good advice.
  - The furniture is new.
  - I have too much homework.
  rule: 'Common uncountable nouns: advice, information, furniture, luggage, news,
    weather, traffic, homework, research, knowledge'
  type: lexical
- examples:
  - a piece of advice
  - a glass of water
  - a slice of bread
  - a item of news
  - a piece of furniture
  rule: 'Uncountable nouns can be made countable with a unit of measurement: a piece
    of advice, a glass of water, an item of furniture'
  type: grammatical
- examples:
  - Glass is made from sand. (uncountable material)
  - I drank a glass of water. (countable container)
  - I need some paper. (material)
  - I need a paper. (newspaper)
  rule: 'Some nouns can be both countable and uncountable with different meanings:
    ''glass'' (material) vs ''a glass'' (container)'
  type: lexical
- examples:
  - I have some books. (countable)
  - I have some water. (uncountable)
  - Do you have any apples? (countable)
  - Do you have any milk? (uncountable)
  rule: '''Some'' and ''any'' work with both countable and uncountable nouns'
  type: grammatical
- examples:
  - I have a few friends. (some — positive)
  - I have few friends. (almost none — negative)
  - I have a little time. (some — positive)
  - I have little time. (almost none — negative)
  rule: '''A few'' = some (positive); ''few'' = almost none (negative). ''A little''
    = some (positive); ''little'' = almost none (negative)'
  type: grammatical
teaching:
  methodology: PPP with realia
  recommended_activities:
  - adaptation_notes: Students sort a list of 20 nouns into countable and uncountable
      columns. Discuss any that can be both.
    duration: 10
    name: Sort the Nouns
  - adaptation_notes: Students write a shopping list using correct quantifiers (many
      apples, much rice, a few eggs, a little milk).
    duration: 15
    name: Shopping List
  tips:
  - 'Parrott (2000) Ch. 1: Nouns convey substantial information. Learners need to
    know countable/uncountable status and plural forms. Nouns modify other nouns (stone
    wall, football match).'
  - 'Parrott (2000): Some nouns are ''deceptively uncountable'' — they are uncountable
    in English but countable in many other languages: information, advice, news, furniture,
    homework, evidence, research, progress. This is a major source of L1 transfer
    errors.'
  - 'CGEL Ch. 5: Countability is determined by the sense, not a fixed property of
    nouns. Many nouns have both count and non-count uses — ''I like cake'' (non-count)
    vs ''She baked three cakes'' (count). Servings, varieties, and animal/meat pairs
    follow systematic polysemy patterns.'
  - 'Week 1: Countable nouns (singular/plural, a/an).'
  - 'Week 2: Uncountable nouns (common examples, no a/an/-s).'
  - 'Week 3: Quantifiers (many/much, few/little).'
  - 'Use real objects: Count books (countable), pour water (uncountable).'
  - 'Swan PEU: Make a list of ''false friends'' — nouns countable in L1 but uncountable
    in English: information, advice, progress, research, news, weather, traffic, homework,
    work, furniture, luggage, equipment.'
  - 'Swan PEU: Some nouns can be both countable and uncountable with different meanings:
    ''glass'' (material) vs ''a glass'' (container), ''coffee'' (substance) vs ''a
    coffee'' (cup of coffee).'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 5: CGEL (Ch.5)
    analyzes the count/mass distinction as a property of the NOUN (not the referent).
    Count nouns can be pluralized and take numerals (''two books''); mass nouns cannot
    (*''two waters''). Some nouns can be both with meaning shifts: ''coffee'' (mass:
    substance) vs ''a coffee'' (count: cup of coffee). CGEL notes that the count/mass
    distinction is LEXICAL, not semantic — ''furniture'' is mass in English but count
    in French (les meubles).'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s
    Course, 2nd ed. Heinle & Heinle.'
  tip: 'QUANTIFIER DISTRIBUTION ACROSS COUNT/NONCOUNT: Quantifiers follow two continua
    (positive/negative). Some, a lot of, enough work with both. Many/few/several are
    count-only; much/little are noncount-only. Increasingly ''less'' replaces ''fewer''
    with count nouns in informal English. Comparative: much→more, many→more, few→fewer,
    little→less. Superlative: most, most, fewest, least. Source: Ch.17 p.333-334.'
title: Countable & Uncountable Nouns
use:
- context: Countable Nouns (Objects, People, Animals)
  description: 'Physical items that can be counted: books, cars, students, dogs.'
  examples:
  - I bought two cars.
  - There are five students in the class.
  - She has three cats.
- context: Uncountable Nouns (Substances, Concepts, Abstract Nouns)
  description: 'Mass nouns: water, rice, money, information, advice, weather.'
  examples:
  - I need some rice.
  - She gave me good advice.
  - The weather is beautiful today.
- context: Quantifiers for Countable
  description: '''Many'' (a lot of), ''few'' (almost none), ''a few'' (some): ''many
    books'', ''few friends''.'
  examples:
  - I have many books.
  - There are few tickets left.
  - I have a few questions.
- context: Quantifiers for Uncountable
  description: '''Much'' (a lot of), ''little'' (almost none), ''a little'' (some):
    ''much water'', ''little time''.'
  examples:
  - I don't have much time.
  - There is a little milk left.
  - How much sugar do you want?
