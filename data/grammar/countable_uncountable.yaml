- correction: two pieces of wood / a fact / much furniture / a lot of furniture
  error: '*two woods (meaning pieces of wood) / *a truth (meaning a fact) / *many
    furnitures'
  explanation: 'Parrott (2000) Ch. 1: Some nouns can be both countable and uncountable
    with a meaning shift. wood [U] = material; wood [C] = a forest. truth [U] = abstract
    concept; truth [C] = a specific true fact (rare, formal). furniture, luggage,
    equipment are always uncountable — "a piece of furniture," "two items of luggage."
    L1s with gender/number agreement often transfer plural marking to English uncountable
    nouns systematically.

    '
  flagged: false
