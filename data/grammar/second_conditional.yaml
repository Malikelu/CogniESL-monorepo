  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, second conditional is used for discussing hypothetical
    research outcomes: ''If the sample were larger, the results would be more reliable.'''
  reliability: D
  source: Team observation
  tier: 4
- note: In formal writing, conditionals appear in discussions of likely outcomes and
