citations:
- claim: 'Core meaning: Describes hypothetical situations that are unlikely, impossible,
    or contrary to current fact, with imagined results.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals'
  tier: 1
- claim: 'Register distribution: In formal writing, second conditional is used for
    hypothetical scenarios: ''If the government were to raise taxes, the economy would
    suffer.'''
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals'
  tier: 1
- claim: 'Discourse function: Second conditional is used for polite requests and suggestions:
    ''If you could help me, I would be grateful.'''
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals'
  tier: 1
- claim: 'Common error ''Using ''would'' in the if-clause: *''If I would study, I
    would pass.'''' for Portuguese, Spanish, French speakers'
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  tier: 1
- claim: 'Dialectal variation: In formal English, ''were'' is used for all persons
    in second conditional: ''If I were you'', ''If he were here.'' In informal English,
    ''was'' is common: ''If I was you'', ''If he was here.'''
  reliability: B
  source: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
common_errors:
- correction: If I studied, I would pass.
  error: 'Using ''would'' in the if-clause: *''If I would study, I would pass.'''
  explanation: In second conditional, the if-clause uses past simple, not 'would'.
    'Would' only appears in the main clause.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I studied, I would pass.
  error: 'Using present tense in the if-clause: *''If I study, I would pass.'''
  explanation: Second conditional requires past simple in the if-clause to show unreality,
    not present simple.
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I were you, I would study.
  error: 'Using ''was'' instead of ''were'' in formal English: *''If I was you, I
    would study.'''
  explanation: In formal English, 'were' is used for all persons in second conditional.
    'Was' is common in informal speech but considered non-standard.
  l1_groups:
  - All L1 groups
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I had time, I would go.
  error: 'Using ''would'' in both clauses: *''If I would have time, I would go.'''
  explanation: 'Swan PEU: In second conditional, use past simple in the if-clause,
    "would" in the main clause. "Would" in the if-clause is non-standard.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- correction: If I were you...
  error: 'Using ''was'' instead of ''were'' (formal): *''If I was you...'' (formal
    context)'
  explanation: 'Swan PEU: In formal English, "were" is used for all persons in hypothetical
    conditionals. "Was" is informal but very common.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
description: Used to talk about unreal, hypothetical, or unlikely situations in the
  present or future, and their probable results.
dialectal_variation:
- note: 'In formal English, ''were'' is used for all persons in second conditional:
    ''If I were you, If he were here.'' In informal English, ''was'' is common: ''If
    I was you, If he was here.'''
- note: 'Some dialects use ''would'' in both clauses: ''If I would study, I would
    pass.'' This is non-standard.'
- note: 'In some varieties of English, ''should'' replaces ''would'' in first person:
    ''If I studied, I should pass.'' (formal BrE)'
discourse_notes:
- note: 'Second conditional is used for polite requests and suggestions: ''If you
    could help me, I would be grateful.'''
- note: 'Second conditional is used for giving advice: ''If I were you, I would talk
    to the teacher.'''
- note: 'Second conditional creates hypothetical scenarios in academic writing: ''If
    this theory were correct, we would expect to see...'''
- note: 'In conversation, second conditional is used for imagining alternatives: ''If
    I won the lottery, I would travel the world.'''
form:
  affirmative:
    example_generator:
    - If I won the lottery, I would travel the world.
    - If I had more time, I would learn another language.
    - If she studied harder, she would pass the exam.
    min_examples: 4
    structure: If + past simple, would + base verb
  negative:
    example_generator:
    - If I didn't like coffee, I wouldn't drink it.
    - If she didn't have a car, she wouldn't drive to work.
    - If they didn't live far away, they would visit more often.
    min_examples: 4
    structure: If + past simple (negative), would not (wouldn't) + base verb
  questions:
    example_generator:
    - Would you travel if you won the lottery?
    - Would she pass if she studied harder?
    - Would they come if we invited them?
    min_examples: 4
    structure: Would + subject + base verb if + past simple?
grammar_point: second_conditional
level: B1
meaning:
  ccqs:
  - answer: Hypothetical — it is not real. We are imagining.
    purpose: Tests whether the learner understands that second conditional describes
      unreal/hypothetical situations, not real possibilities. This is the fundamental
      distinction from first conditional.
    question: Why do we use past tense in second conditional even when we are talking
      about the present or future?
  - answer: No — we use past tense to show unreality, not past time. We are talking
      about now or the future.
    purpose: Tests whether the learner understands that the past tense in the if-clause
      is a grammatical marker of unreality, not a reference to past time. This is
      the most conceptually difficult aspect of second conditional.
    question: Are we talking about the past when we use past tense in the if-clause?
  - answer: No — it is unlikely or impossible. That is why we use second conditional.
    purpose: Tests whether the learner can identify the semantic component of unlikelihood
      that triggers second conditional. If the situation is likely, use first conditional.
      If unlikely or impossible, use second conditional.
    question: Is this likely to happen?
  - answer: Yes. 'Would' expresses a definite result ('If I had more time, I would
      learn piano' — I definitely would). 'Could' expresses possibility or ability
      ('If I had more time, I could learn piano' — it would be possible for me, but
      I might not). 'Might' expresses uncertainty ('If I had more time, I might learn
      piano' — maybe, maybe not). All three are grammatically correct in second conditional,
      but they convey different degrees of certainty.
    purpose: Tests whether the learner understands that 'would' is not the only modal
      verb possible in the main clause of second conditional. 'Could' (ability/possibility)
      and 'might' (uncertainty) are also grammatically correct and change the meaning
      of the result clause. This distinction is important at B1 level because it allows
      learners to express nuanced hypothetical outcomes rather than just definite
      ones.
    question: Can we use 'could' instead of 'would' in the main clause of a second
      conditional? What changes?
  contrast: '''First Conditional'' = ''If I win the lottery, I will travel.'' (real,
    possible future) vs ''Second Conditional'' = ''If I won the lottery, I would travel.''
    (unlikely, hypothetical)'
  core_meaning: Describes hypothetical situations that are unlikely, impossible, or
    contrary to current fact, with imagined results. The situation in the if-clause
    is NOT real — it is imaginary. We use past tense in the if-clause, but we are
    talking about the present or future, not the past.
  example_generator:
    contexts:
    - hypothetical situations
    - giving advice
    - imagining alternatives
    - dreams and wishes
    cultural_notes:
    - Use diverse scenarios (travel, career, lifestyle)
    - Avoid examples that assume wealth or privilege
    - Keep examples imaginative and fun for students
    min_examples: 5
  timeline: 'Present/Future: Refers to current or future situations that are not real.
    The past tense in the if-clause shows unreality, not past time.'
phonetics:
- example_generator:
  - I'd /aɪd/
  - you'd /juːd/
  - he'd /hiːd/
  l1_issue: Many L1 speakers over-pronounce 'would' as /wʊd/. Teach the contracted
    forms for natural speech.
  note: 'Contraction of ''would'': I would → I''d /aɪd/, you would → you''d /juːd/,
    he would → he''d /hiːd/. Full forms sound overly formal in casual speech.'
- example_generator:
  - if /ɪf/
  - if I /ɪf aɪ/
  l1_issue: Portuguese speakers may pronounce 'if' as /ifi/. Teach the short form
    /ɪf/.
  note: 'Weak form of ''if'' in connected speech: /ɪf/. ''If I won'' sounds like /ɪf
    aɪ wʌn/.'
