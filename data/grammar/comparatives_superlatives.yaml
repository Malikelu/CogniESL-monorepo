common_errors:
- correction: She is taller.
  error: 'Using double comparative: *''She is more taller.'''
  explanation: Use either -er OR more, never both.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Comparatives'
- error: '[See Comparatives/Superlatives transfer patterns]'
  explanation: More + adjective for comparatives; más + adjective for superlatives (no inflection)
  l1_groups:
  - Spanish
  - Vietnamese
  reliability: C
  source: 'L1 Interference ESL Teacher Resources — Comparative Analysis of Cross-Linguistic Influence: Best-in-Class Resources
    and L1 Interference Databases for English Language Educators.'
  tier: 4
description: 'Forms used to compare two or more people/things: comparatives (compare two, -er/more) and superlatives (compare
  three+, -est/most).'
dialectal_variation:
- note: 'In AmE, ''gotten'' is the past participle of ''get'': ''She has gotten better.'' BrE uses ''got'': ''She has got
    better.'''
- note: 'In some dialects, double comparatives are used for emphasis: ''more bigger'' (non-standard).'
- note: 'In informal speech, ''way'' replaces ''much'' as an intensifier: ''way better'' (informal).'
discourse_notes:
- note: 'Comparatives create cohesion by linking two items: ''I bought two shirts. The red one was cheaper than the blue one.'''
- note: 'Superlatives establish a ranking within a group: ''Of all the students, Maria is the most diligent.'''
- note: 'In academic writing, hedged comparatives are common: ''somewhat better'', ''slightly more effective''.'
- note: 'Comparatives can be used for persuasion: ''Our product is better than the competition.'''
form:
  affirmative:
    example_generator:
      contexts:
      - family and relationships
      - entertainment and media
      - sports
      min_examples: 4
    structure: 'Short adjectives (1 syllable): Comparatives add -er, superlatives add -est: "taller", "tallest"

      Long adjectives (2+ syllables): Comparatives use more/less, superlatives use most/least: "more beautiful", "most beautiful"

      Irregular adjectives: "good → better → best", "bad → worse → worst"

      Adverb comparatives/superlatives: "faster", "fastest" (regular adverbs); "more carefully", "most carefully" (adverbs
      ending in -ly)

      '
  negative:
    example_generator:
      contexts:
      - entertainment and media
      - opinions
      min_examples: 4
    structure: 'Use less/least for negative comparisons: ''less interesting'', ''least popular''. Negate verb: ''She isn''t
      taller than him.'''
  questions:
    example_generator:
      contexts:
      - family and relationships
      - quizzes
      min_examples: 4
    structure: 'Invert verb for questions: ''Is she taller than him?'' ''What''s the most popular sport?'''
grammar_point: comparatives_superlatives
level: A2
meaning:
  ccqs:
  - answer: Two = comparative. Three or more = superlative.
    purpose: Tests whether the learner understands the difference between comparative (comparing two items) and superlative
      (comparing one item to a group).
    question: Are we comparing two things or a group of three or more?
  - answer: Short adjectives (1 syllable) always use -er. Many 2-syllable adjectives also use -er (happier, simpler, narrower).
      Adjectives with 3+ syllables use more. Some 2-syllable adjectives can use either (e.g., cleverer or more clever).
    purpose: Tests whether the learner knows the spelling rules for comparative formation. The -er vs more distinction is
      one of the most common errors at A2-B1 level.
    question: Is the comparative form using -er or more?
  - answer: Yes, for superlatives (the tallest, the most beautiful). Not for comparatives.
    purpose: Tests whether the learner knows that superlatives require the definite article 'the', while comparatives do not.
      This is a reliable structural rule that helps learners self-correct.
    question: Do we need 'the' before the adjective?
  - answer: Good/better/best, bad/worse/worst, far/further/furthest are irregular -- they do not follow the -er/-est pattern.
    purpose: Tests whether the learner knows the most common irregular comparative/superlative forms. These three sets (good,
      bad, far) are extremely common and must be memorized.
    question: Is this an irregular form?
  contrast: '"Comparative" = Two items: "taller than" (A vs B)


    "Superlative" = Three+ items: "tallest" (A vs B vs C)


    "Regular" = -er/-est/more/most: "happy → happier → happiest"


    "Irregular" = Special forms: "good → better → best"

    '
  core_meaning: Compare differences between two (comparative) or more than two (superlative) people/things in terms of quality,
    quantity, or manner.
  example_generator:
    contexts:
    - everyday situations
    - shopping
    - sports
    - describing people
    cultural_notes:
    - Many languages use a separate word for comparison rather than changing the adjective form
    - Irregular forms are very common and must be memorised early
    min_examples: 5
  timeline: N/A (Applies to all tenses; form of adjective/adverb does not change with tense).
phonetics:
- example_generator:
    contexts:
    - sentence stress
  l1_issue: Some L1 speakers give equal stress to all syllables, losing the contrastive emphasis
  note: 'Stress on the comparative/superlative adjective: She is TALLER. She is the TALLest.'
- example_generator:
    contexts:
    - connected speech
  l1_issue: Speakers whose L1 lacks dental fricatives may substitute /d/, /z/, or /t/ for the 'th' sound
  note: Weak form of 'than' /ðæn/ → /ðən/; 'the' before superlative is often reduced to /ðə/
register_notes:
- note: Comparatives and superlatives are used in all registers.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, comparatives are used for analysis: ''Group A performed better than Group B.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In advertising, superlatives are common: ''The best coffee in town.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, ''more'' is preferred over ''-er'' for longer adjectives: ''more significant'' (not ''significanter'').'
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Comparative and superlative constructions: register distribution varies. Inflectional comparison
    more common in conversation and news; phrasal comparison more common in academic prose. Ch. 7.7.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.7.3
- note: 'GB3 Ch. 20 notes that superlatives in academic writing serve hedging and boosting functions: ''One of the
    most important factors'' (boosting while avoiding absolute claim), ''This is among the most significant findings'' (superlative
    as academic hedge). The definite article is typically required with superlatives: ''the tallest building,'' but predicative
    superlatives can occur with indefinite articles: ''This method is most effective'' (= very effective, not THE most effective).'
  source: Team observation
  reliability: D
  tier: 4
