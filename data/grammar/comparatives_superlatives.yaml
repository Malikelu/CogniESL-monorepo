sub_rules:
- examples:
  - big → bigger → biggest
  - sad → sadder → saddest
  - thin → thinner → thinnest
  rule: 'Spelling: double the final consonant after a short vowel (big → bigger, sad → sadder)'
  type: grammatical
- examples:
  - happy → happier → happiest
  - dry → drier → driest
  - pretty → prettier → prettiest
  rule: 'Spelling: change y to i after a consonant (happy → happier, dry → drier)'
  type: grammatical
- examples:
  - nice → nicer → nicest
  - large → larger → largest
  - simple → simpler → simplest
  rule: 'Spelling: just add -r/-st to adjectives ending in -e (nice → nicer, large → larger)'
  type: grammatical
- examples:
  - good → better → best
  - bad → worse → worst
  - far → further → furthest
  rule: 'Irregular forms: good → better → best; bad → worse → worst; far → farther/further → farthest/furthest'
  type: lexical
- examples:
  - carefully → more carefully → most carefully
  - quickly → more quickly → most quickly
  rule: Adverbs ending in -ly always use more/most (more carefully, most quickly)
  type: grammatical
- examples:
  - the tallest building in the city
  - my best friend
  - her worst nightmare
  rule: Superlative with 'the' — except before possessives (the tallest girl / my best friend)
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Students pick two objects from a bag and make comparative sentences. Then add a third for superlatives.
    duration: 10
    name: Object Comparison Game
  - adaptation_notes: Students vote on class superlatives (the funniest, the most talkative, the tallest) and write sentences
      about the results.
    duration: 15
    name: Class Superlatives
  tips:
  - 'Parrott (2000) Ch. 6: Comparatives and superlatives are more complex in English than in many languages. Teach bit by
    bit — comparative and superlative forms separately, more separately from -er. Coursebooks teach idealised patterns, but
    real usage includes many variations. One-syllable adjectives sometimes require more/most with past participles (more tired,
    most lost) and non-gradable adjectives (more dead). Source: Parrott (2000) Grammar for English Language Teachers, 2nd
    ed. Ch. 6: Comparatives and superlatives, 6.1-6.3.'
  - 'Week 1: Short adjectives (-er/-est), comparatives with ''than''.'
  - 'Week 2: Long adjectives (more/most), superlatives with ''the''.'
  - 'Week 3: Irregular adjectives, adverb comparisons.'
  - 'Use real objects: Compare two pencils (longer/shorter), three students (tallest/shortest).'
  - 'Swan PEU: Double comparatives and superlatives — use EITHER -er OR more, not both: ''more better'' is wrong, ''more intelligent''
    is right. Higher register avoids double comparison entirely.'
  - 'Swan PEU: ''The + comparative..., the + comparative'' — ''The more, the merrier.'' ''The sooner, the better.'' This correlative
    structure is idiomatic and common.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 13: CGEL (Ch.13) notes that superlatives typically require
    a definite determiner (''the tallest building'') because they pick out a unique referent. However, superlatives can occur
    with indefinite determiners in predicative position ''This method is most effective'' (not *''a most effective'' in attributive).
    CGEL also notes the metalinguistic use: ''She''s the most intelligent'' (elliptical for ''most intelligent person'').'
title: Comparatives & Superlatives (Adjectives & Adverbs)
use:
- context: Compare Two Items (Comparatives)
  description: Show difference between two people/things using 'than'.
  examples:
  - My car is faster than yours.
  - She is more experienced than him.
  - This book is cheaper than that one.
- context: Compare Three+ Items (Superlatives)
  description: Show the highest/lowest degree among three or more, use 'the' before superlative.
  examples:
  - He is the tallest in the class.
  - This is the most delicious cake I've ever eaten.
  - That was the worst film of the year.
- context: Negative Comparisons
  description: Use less/least to show lower degree.
  examples:
  - This task is less difficult than I thought.
  - He is the least prepared student.
  - She is less outgoing than her sister.
- context: Adverb Comparisons
  description: Compare how actions are performed.
  examples:
  - She speaks more quietly than her sister.
  - He works the hardest in the team.
  - I drive more carefully than my brother.
