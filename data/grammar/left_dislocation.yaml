grammar_point: left_dislocation
level: C1
meaning:
  ccqs:
  - answer: That book. It has been moved to the front for emphasis.
    purpose: Tests whether the learner understands that English can move a topic to the beginning of a sentence and refer
      back to it with a pronoun. This is common in informal speech.
    question: In the sentence That book, I really enjoyed it, what is the topic?
  - answer: It is more common in speech and informal writing. In formal writing, cleft sentences are preferred.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'Is left-dislocation grammatically correct in forma...' checks conceptual understanding, not just memorization.
    question: Is left-dislocation grammatically correct in formal writing?
  - answer: A pronoun such as it, he, she, they, this, or that.
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'What replaces the dislocated noun in the main clau...' checks conceptual understanding, not just memorization.
    question: What replaces the dislocated noun in the main clause?
  - answer: Left-dislocation leaves a pronoun in the main clause (That book, I enjoyed it). Topicalisation moves the element
      without leaving a pronoun (That book I enjoyed). Both front the topic, but only left-dislocation has a resumptive pronoun.
    purpose: Tests whether the learner can distinguish left-dislocation from the related structure of topicalisation. The
      key diagnostic is the presence or absence of a pronoun referring back to the fronted element, which is a crucial structural
      difference at the C1 discourse level.
    question: Can you explain the difference between left-dislocation and topicalisation by giving an example of when to use
      each?
  contrast: 'Standard: I love that new restaurant on the corner. Left-dislocation: That new restaurant on the corner, I love
    it. Same meaning, different focus. Cleft sentence: It is that new restaurant on the corner that I love. Different emphasis.
    Right-dislocation: I love it, that new restaurant on the corner. Topic comes after.'
  core_meaning: Left-dislocation involves taking a noun phrase (the topic) from inside a sentence and placing it at the front,
    leaving a pronoun or pro-form in the original position. This highlights the topic and creates a clear topic-comment structure.
  example_generator:
    contexts:
    - casual conversation
    - spoken narratives
    - informal writing
    - discourse analysis
    cultural_notes:
    - Left-dislocation is extremely common in spoken English across all dialects
    - It is a natural feature of topic-prominent discourse
    - Learners may not encounter it in textbooks but will hear it constantly
    min_examples: 5
  timeline: Can be used with any tense. The structure is about discourse organisation, not time reference.
phonetics:
- example_generator:
    contexts:
    - spoken English
  l1_issue: Learners from topic-prominent languages such as Japanese, Korean, or Turkish may find this structure natural but
    overuse it in formal writing
  note: The dislocated element is spoken with a distinct intonation contour, followed by a pause before the main clause
- example_generator:
    contexts:
    - connected speech
  l1_issue: Learners may stress the pronoun, making the sentence sound redundant or unnatural
  note: The pronoun referring back to the dislocated element is typically unstressed
register_notes:
- note: 'Biber et al. (2021) — Left dislocation (topic-comment): overwhelmingly conversational; rare in written registers.
    Feature of online spoken production. Ch. 14'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 14
