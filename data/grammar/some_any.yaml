citations:
- claim: 'Core meaning: ''Some'' is used in affirmative sentences to indicate a positive quantity'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17: Partitives, Collectives and Quantifiers'
  tier: 1
- claim: 'Register distribution: ''Some'' and ''any'' are neutral in register.'
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17: Partitives, Collectives, and Quantifiers'
  tier: 1
- claim: 'Discourse function: ''Some'' implies an unspecified quantity: ''I need some help.'' (the speaker doesn''t specify
    how much)'
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17: Partitives, Collectives, and Quantifiers'
  tier: 1
- claim: 'Common error ''Using ''some'' in questions: *''Do you have some water?'''' for Portuguese, Spanish, French speakers'
  reliability: B
  source: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 10: Determiners (some and any)'
  tier: 1
- claim: L1 transfer in some any varies significantly across language backgrounds — Swan & Smith document contrastive patterns
    for speakers of different L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
common_errors:
- correction: Do you have any water?
  error: 'Using ''some'' in questions: *''Do you have some water?'''
  explanation: 'Use ''any'' in questions and negatives. ''Some'' is for affirmative sentences and offers/requests. Exception:
    use ''some'' in questions when offering or requesting: ''Would you like some tea?'''
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Dutch
  - Italian
  reliability: D
- correction: I have some books.
  error: 'Using ''any'' in affirmative sentences: *''I have any books.'''
  explanation: Use 'some' in affirmative sentences. 'Any' is for questions and negatives.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Dutch
  - Italian
  reliability: D
- correction: I don't have any money.
  error: 'Using ''some'' with uncountable nouns in negatives: *''I don''t have some money.'''
  explanation: In negative sentences, always use 'any', not 'some'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - French
  - Dutch
  - Italian
  reliability: D
- correction: I don't have any money.
  error: 'Using ''some'' in negative sentences: *''I don''t have some money.'''
  explanation: 'Swan PEU: ''Any'' is the negative/question form of ''some''. In negative sentences, use ''any'' (not ''some'').
    Exception: offers/requests with ''some'' — ''Would you like some tea?'''
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Dutch
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: Do you want any coffee?
  error: 'Using ''some'' in questions expecting ''yes'': *''Do you want some coffee?'' (neutral question)'
  explanation: 'Swan PEU: ''Some'' in questions implies expecting ''yes'' (offer/invitation). ''Any'' is neutral. ''Would
    you like some tea?'' (offer) vs ''Do you have any tea?'' (genuine question).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Dutch
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: ''
  error: See Swan & Smith (2001) for L1-specific patterns
  explanation: Swan & Smith (2001). Spanish (no some/any distinction transfer), Portuguese (similar), French (quelque/autre
    transfer), Dutch (sommige/sige distinction different), Italian (alcuno/qualche distinction differs).
  flagged: false
  l1_groups:
  - Spanish
  - Portuguese
  - French
  - Dutch
  - Italian
  reliability: B
  source: 'Swan & Smith (2001) Learner English: A Teacher''s Guide to Interference and Other Problems, 2nd ed. Cambridge University
    Press.'
description: 'Quantifiers for countable plural and uncountable nouns: some (affirmative sentences, offers, requests); any
  (negative sentences, questions, general statements).'
dialectal_variation: []
discourse_notes:
- note: '''Some'' implies an unspecified quantity: ''I need some help.'' (the speaker doesn''t specify how much)'
- note: '''Any'' is used in questions and negatives: ''Do you have any questions?'''
- note: '''Some'' in questions makes them sound like offers: ''Would you like some coffee?'' vs ''Do you have any coffee?''
    (neutral question)'
form:
  affirmative:
    example_generator:
    - I have some books.
    - There is some water.
    - She has some friends.
    - We need some milk.
    min_examples: 4
    structure: Some + countable plural noun / Some + uncountable noun
  negative:
    example_generator:
    - I don't have any books.
    - There isn't any water.
    - She doesn't have any friends.
    - We don't need any milk.
    min_examples: 4
    structure: Any + countable plural noun / Any + uncountable noun (with don't/doesn't/isn't/aren't)
  questions:
    example_generator:
    - Do you have any books?
    - Is there any water?
    - Does she have any friends?
    - Do we need any milk?
    min_examples: 4
    structure: Any + countable plural noun / Any + uncountable noun (with do/does/is/are)
grammar_point: some_any
level: A1
meaning:
  ccqs:
  - answer: Affirmative = some. Negative/Question = any.
    purpose: Tests whether the learner understands that 'some' is used in affirmative statements and offers/requests, while
      'any' is used in negatives and questions.
    question: Is this an affirmative sentence, negative sentence, or question?
  - answer: 'Yes — in polite offers and requests: ''Would you like some tea?'''
    purpose: Tests whether the learner knows the exception where "some" is used in questions, specifically in polite offers
      and requests. This is important because using "any" in offers can sound less polite and less natural.
    question: Can we use 'some' in questions?
  - answer: Yes — both work with countable plural (some books) and uncountable (some water).
    purpose: 'Tests whether the learner understands exceptions: ''some'' in requests and offers (''Would you like some tea?''),
      ''any'' in affirmatives meaning ''it doesn''t matter which'' (''Take any seat.'').'
    question: Do 'some' and 'any' work with both countable and uncountable nouns?
  - answer: '''I don''t have any money.'' After negation, use ''any'', not ''no'' or ''some''. Standard English does not use
      double negatives.'
    purpose: Tests whether the learner uses 'any' (not 'some' or double negatives) in negative contexts (Swan PEU 2016, entry
      309.4).
    question: Which is correct? *'I don't have no money' or 'I don't have any money'?
  contrast: '''Some'' = affirmative (I have some books.) vs ''Any'' = questions/negatives (Do you have any books? / I do not
    have any books.)'
  core_meaning: '''Some'' is used in affirmative sentences to indicate a positive quantity. ''Any'' is used in negative sentences
    and questions to indicate a neutral or unknown quantity. Both work with countable plural and uncountable nouns.'
  example_generator:
    contexts:
    - food and drink
    - shopping
    - everyday situations
    - offers and requests
    cultural_notes:
    - Use diverse food examples from different cultures
    - Avoid alcohol references
    - Keep examples simple and concrete for A1 level
    min_examples: 5
  timeline: N/A — quantifiers are not tense-based. They describe quantity in any tense.
phonetics:
- example_generator:
  - some water /səm wɔːtə/
  - some friends /səm frendz/
  l1_issue: Many L1 speakers over-pronounce 'some' as /sʌm/. Teach the weak form for natural-sounding speech.
  note: 'Weak form of ''some'' in connected speech: /səm/ not /sʌm/. ''Some books'' sounds like /səm bʊks/.'
- example_generator:
  - any water /əni wɔːtə/
  - any friends /əni frendz/
  l1_issue: Portuguese speakers may pronounce 'any' as /eni/. Teach the weak form /əni/.
  note: 'Weak form of ''any'' in connected speech: /əni/ not /eni/. ''Any books'' sounds like /əni bʊks/.'
register_notes:
- note: '''Some'' and ''any'' are neutral in register.'
  reliability: D
  source: Team observation
  tier: 4
- note: '''Some'' in questions implies an offer or request: ''Would you like some tea?'' (more polite than ''any'')'
  reliability: D
  source: Team observation
  tier: 4
- note: 'In formal writing, ''some'' can express an unspecified amount: ''Some researchers have argued that...'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Assertive vs. non-assertive forms: register distribution differs. Conversation uses more ''some''
    contexts; academic prose has specific non-assertive patterns. Ch. 3.8.6'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 3.8.6
sources:
  pedagogical: 'Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 10: Determiners (some and any)'
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 17: Partitives, Collectives and Quantifiers'
  secondary: 'Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Ch. 5: Nouns and Noun Phrases (quantifiers)'
  teaching_practice: 'Folse (2009) Keys to Teaching Grammar to English Language Learners. Ch. 7: Some and any'
  validation: 'Swan (2016) Practical English Usage, 4th ed.(some/any: affirmative, negative, questions)'
sub_rules:
- examples:
  - I have some bread. (affirmative)
  - Do you have any bread? (question)
  - I don't have any bread. (negative)
  rule: 'Default rule: some in affirmative, any in negative and questions'
  type: grammatical
- examples:
  - Would you like some tea? (offer)
  - Can I have some help? (request)
  - Could you give me some advice? (request)
  rule: 'Exception: some in polite offers and requests'
  type: pragmatic
- examples:
  - some books (countable)
  - some water (uncountable)
  - any books (countable)
  - any water (uncountable)
  rule: Some and any work with both countable plural and uncountable nouns
  type: grammatical
- examples:
  - I have some money. → I don't have any money.
  - There is some milk. → There isn't any milk.
  rule: In negative sentences, 'any' replaces 'some'
  type: grammatical
teaching:
  methodology: PPP (Present-Practice-Produce)
  recommended_activities:
  - adaptation_notes: 'Teacher says a sentence frame. Students complete with ''some'' or ''any'': ''I have ___ bread.'' (some)
      ''Do you have ___ milk?'' (any) ''I don''t have ___ money.'' (any)'
    duration: 10
    name: Some or Any?
  - adaptation_notes: 'Students practice ordering in a cafe: ''Would you like some coffee?'' ''Yes, please. Can I have some
      sugar?'' ''Do you have any cake?'' Practices some/any in authentic context.'
    duration: 15
    name: Cafe Role Play
  - adaptation_notes: 'Students survey classmates: ''Do you have any pets?'' ''Do you have any brothers or sisters?'' Then
      report: ''Pedro has some cats. Maria doesn''t have any pets.'''
    duration: 15
    name: Classroom Survey
  - adaptation_notes: 'Students have a shopping list. They ask classmates: ''Do you have any apples?'' Classmates respond:
      ''Yes, I have some.'' or ''No, I don''t have any.'' Practices question and answer forms.'
    duration: 10
    name: Shopping List Game
  tips:
  - 'Parrott (2000): Parrott (2000) Ch. 3: Some (unstressed /s@m/) = indefinite small quantity, new info, offers/requests.
    Some (stressed /sVm/) = restricted/limited quantity. Any (unstressed) = existence in Q/NEG. Any (stressed) = unrestricted
    quantity/choice. Key for learners: stressed vs unstressed some/any changes meaning. Another vs other confusion common
    across L1s.'
  - 'Teach the default rule first: some = affirmative, any = questions/negatives. Master this before introducing the exception.'
  - Introduce the exception (some in offers/requests) in week 2, after students are comfortable with the default rule.
  - 'Use real objects: show some books (affirmative), ask ''Do you have any books?'' (question), say ''I don''t have any books.''
    (negative).'
  - 'Practice with shopping role-plays: ''Do you have any apples?'' ''Yes, I have some.'' ''I don''t have any oranges.'''
  - Explain that 'some' in questions sounds more polite than 'any'. 'Would you like some tea?' is more polite than 'Would
    you like any tea?'
  - 'Swan PEU: The ''some/any'' rule has exceptions. ''Some'' in questions for offers (''Can I have some?'') and requests
    (''Could you give me some?'') sounds more polite than ''any''.'
title: Some and Any
use:
- context: Affirmative statements
  description: Describing positive quantities
  examples:
  - I have some friends in London.
  - There is some sugar in the bowl.
  - She has some free time today.
- context: Questions
  description: Asking about quantity
  examples:
  - Do you have any questions?
  - Is there any milk in the fridge?
  - Are there any buses today?
- context: Negative statements
  description: Describing lack of quantity
  examples:
  - I don't have any plans for the weekend.
  - There isn't any sugar left.
  - She doesn't have any experience.
- context: Polite offers and requests
  description: Using 'some' in questions to sound polite
  examples:
  - Would you like some tea?
  - Can I have some help?
  - Could you give me some advice?
