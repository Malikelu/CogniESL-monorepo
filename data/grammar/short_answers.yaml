  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - Do you like coffee? -> Yes, I do. (not 'Yes, I like.')
  - Can she swim? -> Yes, she can. (not 'Yes, she swims.')
  - Are you tired? -> Yes, I am.
  - Have you finished? -> Yes, I have. (not 'Yes, I finished.')
  rule: The auxiliary in the answer must match the auxiliary in the question
  type: grammatical
- examples:
  - No, I don't. (not 'No, I do not.')
  - No, she can't.
  - No, they aren't.
  - No, he hasn't.
  rule: Use contractions in negative short answers
  type: grammatical
- examples:
  - Are you happy? -> Yes, I am. / No, I'm not.
  - Is she a teacher? -> Yes, she is. / No, she isn't.
  - Are they coming? -> Yes, they are. / No, they aren't.
  rule: With 'be', use the same form as the question
  type: grammatical
- examples:
  - Have you been to Paris? -> Yes, I have. / No, I haven't.
  - Has she finished? -> Yes, she has. / No, she hasn't.
  rule: With 'have' (as auxiliary), use 'have' in the answer
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Teacher fires yes/no questions at students one after another.
      Students must respond with a short answer within 2 seconds. Great for building
      automaticity.
    duration: 5
    name: Rapid-Fire Questions
  - adaptation_notes: Students receive cards with questions and cards with answers.
      They must match them correctly. Can be done as a memory game or relay race.
    duration: 10
    name: Auxiliary Matching Game
  - adaptation_notes: Students circulate asking yes/no questions and record short
      answers. They then report findings to the class.
    duration: 15
    name: 'Information Gap: Find Someone Who...'
  tips:
  - 'Drill with rapid-fire questions: teacher asks, students respond with short answers
    only.'
  - 'Emphasise the auxiliary matching rule: ''Do? -> do. Can? -> can. Are? -> am/is/are.'''
  - 'Practice contractions in negative answers from the start: ''don''t'', ''can''t'',
    ''aren''t'', ''hasn''t''.'
  - Role-play service encounters (shop, restaurant) where short answers are natural.
  - Contrast with full answers to show when each is appropriate.
  - 'Swan PEU: Short answers use the first auxiliary: ''Can you swim?'' ''Yes, I can.''
    NOT ''Yes, I swim.'' ''Do you like it?'' ''Yes, I do'' (not ''Yes, I like'').
    Be careful with: ''Yes, I am,'' ''Yes, I have,'' etc.'
title: Short Answers
use:
- context: Everyday conversation
  description: Short answers are the natural, default way to respond to yes/no questions
    in spoken English.
  examples:
  - Do you want tea? -> Yes, please. / No, thanks.
  - Can you help me? -> Yes, of course. / No, sorry, I can't.
  - Are you coming tonight? -> Yes, I am. / No, I'm not.
- context: Classroom interaction
  description: Teachers use short answers to confirm understanding and encourage natural
    responses.
  examples:
  - Do you understand? -> Yes, I do.
  - Can you repeat that? -> Yes, I can.
  - Have you done your homework? -> Yes, I have. / No, I haven't.
- context: Service encounters
  description: In shops, restaurants, and other service situations, short answers
    are standard.
  examples:
  - Do you have a reservation? -> Yes, I do. / No, I don't.
  - Can I pay by card? -> Yes, you can. / No, I'm afraid not.
