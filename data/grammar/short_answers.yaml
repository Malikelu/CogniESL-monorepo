common_errors:
- correction: '''Do you like coffee?'' ''Yes, I do.'''
  error: 'Using full sentence for short answers: *''Do you like coffee?'' ''Yes, I
    like coffee.'''
  explanation: Short answers use the auxiliary verb, not the full sentence.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: '''Can you swim?'' ''Yes, I can.'''
  error: 'Using wrong auxiliary: *''Can you swim?'' ''Yes, I can swim.'' (full)'
  explanation: Short answers repeat only the auxiliary, not the main verb.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  reliability: D
description: Brief responses to yes/no questions that avoid repeating the full sentence.
  Uses the auxiliary verb from the question.
dialectal_variation: []
discourse_notes:
- note: 'Short answers maintain conversational flow: ''Do you like it?'' ''Yes, I
    do.'''
form:
  affirmative:
    example_generator:
      contexts:
      - do/does questions
      - can questions
      - be questions
      - have questions
      min_examples: 4
    structure: 'Yes, subject + auxiliary verb: ''Yes, I do.'' / ''Yes, she can.''
      / ''Yes, they are.'' / ''Yes, he has.'''
  negative:
    example_generator:
      contexts:
      - negative responses
      - disagreeing
      - correcting
      min_examples: 3
    structure: 'No, subject + auxiliary + n''t (contracted): ''No, I don''t.'' / ''No,
      she can''t.'' / ''No, they aren''t.'' / ''No, he hasn''t.'''
  questions:
    example_generator:
      contexts:
      - yes/no questions
      min_examples: 3
    structure: 'Short answers respond to questions but are not questions themselves.
      The question form is: Auxiliary + subject + ...?: ''Do you like coffee?'' /
      ''Can she swim?'' / ''Are they ready?'''
grammar_point: short_answers
level: A1
meaning:
  ccqs:
  - answer: No — we use a short answer with just the subject and auxiliary.
    purpose: Tests whether the learner understands that short answers use only the
      subject and auxiliary, not the full sentence. This is important because short
      answers are the natural, default way to respond in spoken English.
    question: Do we repeat the whole sentence in the answer?
  - answer: Yes — if the question uses 'do', the answer uses 'do'.
    purpose: Tests whether the learner knows that the auxiliary in the answer must
      match the auxiliary in the question. This is important because using the wrong
      auxiliary sounds unnatural.
    question: Does the auxiliary in the answer match the auxiliary in the question?
  - answer: No — it is grammatically correct, but 'Yes, I do' is more natural in conversation.
    purpose: Tests whether the learner understands that while full answers are grammatically
      correct, short answers are more natural in conversation. This is important because
      always using full answers can sound overly formal or emphatic.
    question: Is 'Yes, I like coffee' wrong?
  - answer: '''Yes, I can.'' Short answers use subject + auxiliary only: Yes, I can
      / No, I can''t.'
    purpose: Tests whether the learner can form short answers correctly (Swan PEU
      2016, entry 216.5).
    question: Which is the correct short answer to 'Can you swim?' — *'Yes, I can
      swim' or 'Yes, I can'?
  contrast: 'Full answer: ''Yes, I like coffee.'' / Short answer: ''Yes, I do.'' /
    Full answer: ''No, she cannot swim.'' / Short answer: ''No, she can''t.'' The
    short answer is more natural in conversation.'
  core_meaning: Short, natural responses to yes/no questions. Instead of repeating
    the whole sentence ('Yes, I like coffee'), we use just the subject and the auxiliary
    verb ('Yes, I do'). This is how native speakers typically respond in conversation.
  example_generator:
    contexts:
    - everyday conversation
    - classroom interaction
    - meeting people
    - ordering food
    - making plans
    cultural_notes:
    - Short answers are the default in spoken English — full answers can sound overly
      formal or emphatic
    - In British English, short answers are almost always used in casual conversation
    - Answering only 'Yes' or 'No' without the auxiliary can sound blunt or rude in
      English
    min_examples: 5
  timeline: Present time — responding to a question about now or in general. The tense
    of the short answer matches the tense of the question.
phonetics:
- example_generator:
    contexts:
    - stress and emphasis
  l1_issue: Learners may produce flat, unstressed short answers that sound uncertain
    or unnatural.
  note: 'In affirmative short answers, the auxiliary is stressed: ''Yes, I DO.'' /
    ''Yes, she CAN.'' This gives a confident, natural sound.'
- example_generator:
    contexts:
    - negative pronunciation
  l1_issue: Some learners may say 'No, I do not' in full, which sounds overly formal
    in casual conversation.
  note: In negative short answers, the contraction carries the stress. The final t
    sound in negative contractions is often clearly pronounced.
register_notes:
- note: Short answers are common in conversation. In formal writing, full sentences
    are preferred.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (1999) — Short answers and elliptic responses: overwhelmingly
    conversational. Academic prose and news avoid ellipsis in favor of full clauses.
    Short answers are a strong marker of spoken language. Ch. 14'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 14
