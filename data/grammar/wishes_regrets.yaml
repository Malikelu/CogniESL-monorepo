description: Expressing wishes about present/future (unreal past) and regrets about past (past perfect), including 'should
  have' for past regrets.
dialectal_variation: []
discourse_notes:
- note: In conversation, modals are essential for politeness, expressing degrees of certainty, and making requests.
- note: 'In academic writing, modals express hedging and caution: ''These results may suggest...'' ''It could be argued that...'''
- note: 'In legal and regulatory language, modals express obligation and permission: ''All passengers must wear seatbelts.'''
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      - social interactions
      min_examples: 4
    structure: 'Present/Future Wishes: I wish/If only + Past Simple: "I wish I was/were taller." "If only I had more time."

      Past Regrets: I wish/If only + Past Perfect: "I wish I had studied." "If only I hadn''t eaten so much."

      Should Have (Regret): Subject + should have + Past Participle: "I should have studied." "You should have listened."

      '
  negative:
    example_generator:
      contexts:
      - weather and nature
      min_examples: 4
    structure: 'Present/Future: I wish + Past Simple negative: "I wish I didn''t have to work."

      Past: I wish + Past Perfect negative: "I wish I hadn''t been rude."

      Should have negative: shouldn''t have + Past Participle: "I shouldn''t have eaten that."

      '
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Wishes: "Do you wish you were taller?"

      Should have: "Should I have apologized?"

      '
grammar_point: wishes_regrets
level: B2
meaning:
  ccqs:
  - answer: I wish plus past simple for present wishes.
    purpose: Tests whether the learner understands a key concept of wishes_regrets. This is fundamental for correct use of
      this grammar point.
    question: What structure do we use for present wishes
  - answer: No — changing the structure would change the meaning or make the sentence ungrammatical.
    purpose: Tests whether the learner understands that wishes regrets is the only appropriate structure for this meaning/context.
    question: Can we use a different structure here with the same meaning?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with wishes regrets and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: '''I wish I had studied harder.'' For regrets about the PAST, use ''wish + had + past participle''.'
    purpose: Tests whether the learner distinguishes wish + past (present regret) from wish + past perfect (past regret) (Swan
      PEU 2016-655).
    question: Which is correct for a past regret? 'I wish I studied harder' or 'I wish I had studied harder'?
  contrast: 'Wish (present): "I wish I was tall." (present unreal)

    Wish (past): "I wish I had been tall." (past unreal)

    Should have: "I should have been tall." (regret about past)

    '
  core_meaning: Wishes express desire for different present/future situations (unreal past). Regrets express sadness about
    past actions/inactions (past perfect or should have).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present/Future Wishes: Now/Future (unreal). Past Regrets: Past (unreal, didn''t happen).'
phonetics:
- example_generator:
    contexts:
    - wish contractions
  l1_issue: Learners may not recognize the contracted forms in listening. Teach both full and contracted forms.
  note: 'In wish sentences, the auxiliary verb is often contracted: ''I wish I''d studied harder'' /aɪ wɪʃ aɪd ˈstʌdɪd ˈhɑːdə/.
    The contraction is very common in speech.'
register_notes:
- note: 'In conversation, modals are essential for politeness: ''Could you pass the salt?'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In legal language, ''must'' expresses strong obligation: ''All passengers must wear seatbelts.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Wishes and regrets (I wish..., If only...): primarily conversational (expressing immediate
    feelings) and fiction/ literary prose (character interiority). Rare in academic prose. Ch. 10.2.8.12'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.8.12
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27: Conditionals-10.6'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - I wish I had more money (but I do not)
  - I wish she were here (but she is not)
  - I wish I could speak French (but I cannot)
  rule: I wish + past simple for present wishes (things you want to be different now)
  type: grammatical
- examples:
  - I wish I had studied harder (but I did not)
  - I wish she had come to the party (but she did not)
  - I wish I had known earlier (but I did not)
  rule: I wish + past perfect for past regrets (things you wish had been different)
  type: grammatical
- examples:
  - If only I had more money
  - If only she were here
  - If only I had studied harder
  rule: If only is a more emphatic form of I wish
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students write 5 wishes about their present life: ''I wish I had more free time.'' ''I wish I could
      play an instrument.'''
    duration: 15
    name: Present Wishes
  - adaptation_notes: 'Students write 5 regrets about the past: ''I wish I had studied harder at school.'' ''I wish I had
      traveled more when I was young.'''
    duration: 15
    name: Past Regrets
  tips:
  - 'Week 1: Present/future wishes with Past Simple (I wish I had...).'
  - 'Week 2: Past regrets with Past Perfect (I wish I had studied...).'
  - 'Week 3: Should have for past regrets (I should have studied...).'
  - 'Use regret prompts: Students write 3 past regrets with ''I wish'' and ''should have''.'
  - 'Swan PEU: ''Wish + past simple'' — for present regrets: ''I wish I had more money.'' = I don''t have but I want to. ''Wish
    + past perfect'' — for past regrets: ''I wish I hadn''''t said that.'' = I said it and I regret it.'
title: Wishes and Regrets (I wish, If only, Should have)
use:
- description: Desire for different current or future situations.
  examples:
  - I wish I spoke French.
  - If only it wasn't Monday.
  key_point: Use Past Simple for present/future unreal situations.
  name: Present/Future Wishes
- description: 'Sadness about past actions/inactions: ''I wish I had studied.'''
  examples:
  - I wish I hadn't eaten so much.
  - If only I had listened.
  key_point: Use Past Perfect for past regrets with 'I wish/If only'.
  name: Past Regrets (I wish)
- description: 'Regret about past actions: ''I should have studied.'' (I didn''t study, regret it).'
  examples:
  - You should have told me.
  - I shouldn't have trusted him.
  key_point: Should have = regret about past action/inaction.
  name: Past Regrets (Should have)
