grammar_point: future_going_to
level: A2
meaning:
  ccqs:
  - answer: '''Before now — ''''going to'''' is for plans made before speaking.'''
    purpose: Tests whether the learner understands that 'going to' expresses prior plans and intentions, as well as predictions
      based on present evidence.
    question: '''''''I am going to travel next month.'''' Did I decide just now or before'
  - answer: '''The dark clouds — ''''going to'''' is for predictions based on visible evidence.'''
    purpose: Tests whether the learner can identify the 'evidence-based prediction' component of 'going to'. Unlike 'will'
      (general prediction), 'going to' requires visible current evidence.
    question: '''''''Look at those clouds! It is going to rain.'''' What evidence do I have?'''
  - answer: '''No — it is a plan. For spontaneous decisions, use ''''will.'''''''
    purpose: Tests whether the learner can apply the evidence-based prediction rule for 'going to' in a real context. When
      the speaker can see signs that something is about to happen, 'going to' is required rather than 'will.'
    question: '''''''I am going to eat pizza tonight.'''' Is this a spontaneous decision?'''
  - answer: '''Is going to rain'' is correct because there is visible present evidence (dark clouds). ''Will it rain'' would
      be a general prediction without evidence.'
    purpose: Tests whether the learner can apply the evidence-based prediction rule for 'going to' in a real context. When
      the speaker can see signs that something is about to happen, 'going to' is required rather than 'will.'
    question: Look at those dark clouds! Is it going to rain or will it rain -- which is correct here?
  contrast: '''Going To'' = Plan/prediction with evidence: "I''m going to travel (plan)", "Look at the clouds, it''s going
    to rain (evidence)"

    ''Will'' = Spontaneous decision: "I will travel (decide now)"

    ''Present Continuous'' = Fixed arrangement: "I''m traveling tomorrow (booked)"

    '
  core_meaning: Planned future actions (intentions) and predictions based on current evidence. This grammar point is essential
    for expressing future going to in English. Learners at this level need to understand both the form and the appropriate
    contexts for use. Common errors include confusion with related structures and inappropriate register use.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Future: Plans made before speaking, predictions based on what you see now.'
phonetics:
- example_generator:
    contexts:
    - gonna reduction
  l1_issue: Learners may over-pronounce 'going to' in all contexts, sounding overly formal. Teach gonna for natural speech
    but emphasize it is informal.
  note: In informal speech, going to is often reduced to gonna /ˈɡʌnə/. This is extremely common in American English. However,
    gonna should not be used in formal writing.
register_notes:
- note: 'In conversation, ''going to'' is used for plans and intentions: ''I''m going to study medicine.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In informal speech, ''gonna'' is the reduced form of ''going to'': ''I''m gonna go now.'''
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, 'going to' is less common; 'will' or present continuous is preferred for future reference.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — ''Going to'' for future: more common in conversation (plans, intentions); academic prose and
    news use more ''will'' (predictions). Register-appropriate future expression is important for natural-sounding English.
    Ch. 6.2.1.3'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 6.2.1.3
