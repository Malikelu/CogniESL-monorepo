sub_rules:
- examples:
  - I am going to study medicine (plan made earlier)
  - We are going to move to a bigger house (intention)
  - She is going to learn to drive this summer (plan)
  rule: Be going to expresses plans and intentions made before the moment of speaking
  type: semantic
- examples:
  - 'Look at those clouds — it is going to rain (evidence: dark clouds)'
  - 'She is going to have a baby (evidence: she is pregnant)'
  - 'He is going to fall — he is walking on ice (evidence: dangerous situation)'
  rule: Be going to also expresses predictions based on present evidence
  type: semantic
- examples:
  - I am going to buy a car next month (plan)
  - I will help you with that (spontaneous decision)
  - 'It is going to rain (evidence: dark clouds)'
  - I think it will rain tomorrow (general prediction)
  rule: 'Contrast with will: going to = plan or evidence-based prediction. Will = spontaneous decision or general prediction'
  type: semantic
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students sort sentences into two groups: plans (going to) and evidence-based predictions (going to).
      Then they create their own examples.'
    duration: 15
    name: Plans and Evidence
  - adaptation_notes: 'Students choose between going to and will in context: ''I just decided — I ___ help you.'' (will) ''I
      planned this morning — I ___ help you.'' (going to).'
    duration: 10
    name: Going To or Will
  tips:
  - 'Parrott (2000) Ch. 14: Going to has two main uses — planned future events (premeditated intention) and predictions based
    on present or past evidence. The two are closely related: both have a basis in present or past evidence (a decision we
    have made, or evidence that helps predict external events). Rules of thumb for future forms are approximate, influenced
    by personal preference and style. Source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Ch. 14: The future,
    14.1-14.7.'
  - 'Week 1: Affirmative going to (plans).'
  - 'Week 2: Negative and questions, predictions with evidence.'
  - 'Week 3: Contrast with will and present continuous.'
  - 'Use real plans: ''What are you going to do this weekend?'''
  - 'Swan PEU: ''Be going to'' — used for intentions (plans the speaker already has) and predictions based on present evidence:
    ''Look at those clouds — it''s going to rain.'' NOT for spontaneous decisions (use ''will'').'
  - 'Swan PEU: Comparison — ''going to'' = prior intention/evidence-based prediction. ''Will'' = spontaneous decision, promises,
    offers. ''Shall'' (BrE) = suggestions with I/we.'
  - 'CGEL Ch. 3: English has no future tense. Will is a modal auxiliary expressing prediction, not a tense marker. Future
    time is expressed through multiple constructions.'
title: 'Future: Going To (Plans & Predictions)'
use:
- description: Intentions and plans made before speaking.
  examples:
  - I am going to study medicine.
  - They are going to get married.
  key_point: Plan exists before the moment of speaking.
  name: Planned Future Actions
- description: Predict future based on what you see now.
  examples:
  - Look at the sky, it's going to rain.
  - He's going to fail; he never studies.
  key_point: Evidence is visible now.
  name: Predictions With Evidence
- description: Less common, but can be used for quick plans.
  examples:
  - I'm going to call him now.
  key_point: Will is more common for instant decisions.
  name: Instant Decisions (Rare)
