description: 'Structure used to talk about planned future actions and predictions based on current evidence: am/is/are going
  to + base verb.'
dialectal_variation: []
discourse_notes:
- note: 'In conversation, ''going to'' is used for plans and intentions: ''I''m going to study medicine.'' (prior plan)'
- note: 'In predictions with evidence, ''going to'' is preferred: ''Look at those clouds — it''s going to rain.'''
- note: 'In informal speech, ''gonna'' is the reduced form of ''going to'': ''I''m gonna go now.'''
