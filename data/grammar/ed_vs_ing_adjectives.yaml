sub_rules:
- examples:
  - I am bored (I feel boredom)
  - The lesson is boring (the lesson causes boredom)
  - She is interested (she feels interest)
  - The topic is interesting (the topic causes interest)
  rule: Ed adjectives describe how someone feels (the experiencer). Ing adjectives describe the thing or person that causes
    the feeling (the cause)
  type: semantic
- examples:
  - I was surprised by the news. The news was surprising.
  - She was embarrassed by her mistake. The situation was embarrassing.
  rule: 'Common pairs: bored/boring, interested/interesting, excited/exciting, surprised/surprising, tired/tiring, amazed/amazing,
    confused/confusing, embarrassed/embarrassing'
  type: lexical
teaching:
  methodology: Guided discovery with contextualised examples. Present contrasting pairs (bored/boring, excited/exciting) in
    authentic contexts, then elicit the rule from students through concept-checking. Follow with controlled practice (gap-fills,
    sentence transformation) and freer production (personalised speaking activities).
  recommended_activities:
  - adaptation_notes: 'Students choose the correct form: ''I was very (bored/boring) in class.'' ''The movie was (excited/exciting).'''
    duration: 10
    name: Ed or Ing
  - adaptation_notes: Students describe their feelings about different topics using ed adjectives, then describe the topics
      using ing adjectives.
    duration: 15
    name: Describe Your Feelings
  tips:
  - 'Use the formula: ''I''m -ed'' (person) vs ''It''s -ing'' (thing).'
  - 'Practice with surveys: ''What do you find interesting?'' ''What bores you?'''
  - 'Drill common pairs: bore/bored/boring, excite/excited/exciting, interest/interested/interesting.'
  - 'Act out emotions: Teacher acts bored → students say ''You''re bored'' and ''The class is boring''.'
  - 'Swan PEU: -ed = feeling (I''m interested), -ing = cause (The book is interested → WRONG. The book is interesting).'
  - 'Swan PEU: Common pairs: boring/bored, exciting/excited, interesting/interested, surprising/surprised, frightening/frightened,
    disappointing/disappointed.'
title: -ed vs -ing Adjectives (Participial Adjectives)
use:
- description: Describe how a person feels about something.
  examples:
  - I'm confused about the rules.
  - We were disappointed with the result.
  key_point: -ed adjectives describe the experiencer's feelings (usually a person).
  name: Describing Feelings (-ed Adjectives)
- description: Describe the thing or person that causes the feeling.
  examples:
  - The explanation is confusing.
  - It was a disappointing result.
  key_point: -ing adjectives describe the stimulus (thing/person causing the feeling).
  name: Describing Things That Cause Feelings (-ing Adjectives)
- description: Some people can be described as -ing if they cause that feeling in others.
  examples:
  - He's a boring teacher.
  - She's an exciting speaker.
  - He's so annoying!
  key_point: People can be -ing if they consistently cause that feeling in others.
  name: 'Advanced: People as Stimuli (-ing for People)'
