grammar_point: ed_vs_ing_adjectives
level: B1
meaning:
  ccqs:
  - answer: Causing it — 'I am boring' means I make other people feel bored.
    purpose: Tests whether the learner understands the fundamental -ed/-ing distinction. '-ing' adjectives (boring, exciting,
      tiring) describe what causes the feeling. '-ed' adjectives (bored, excited, tired) describe how someone feels. 'I am
      boring' = I cause boredom in others.
    question: '''I am boring.'' Am I feeling boredom or causing it?'
  - answer: No — films don't feel emotions. It should be 'The film was exciting.'
    purpose: Tests whether the learner can apply the -ed/-ing rule to inanimate subjects. Only beings that can feel emotions
      take '-ed' adjectives. Inanimate things (films, books, songs) cause feelings and take '-ing' adjectives.
    question: Is 'The film was excited' correct?
  - answer: She feels interest — 'interested' describes her feeling.
    purpose: Tests whether the learner understands that prepositional phrases with '-ed' adjectives (interested in, bored
      by, excited about) describe the experiencer's feeling. 'Interested in music' = she feels interest toward music.
    question: '''She is interested in music.'' Does she feel interest or cause it?'
  - answer: '''I am bored in this class.'' ''-ed'' adjectives describe how you FEEL. ''-ing'' adjectives describe the THING.'
    purpose: Tests whether the learner distinguishes -ed (feeling) from -ing (causing the feeling) adjectives (Swan PEU 2016,
      entry 193.4).
    question: Which is correct? *'I am boring in this class' or 'I am bored in this class'?
  contrast: '''-ED'' = Person''s feeling: "I''m bored." (I feel...), "He''s tired." (He feels...)

    ''-ING'' = Causes feeling: "It''s boring." (It causes...), "He''s tiring." (He causes tiredness)

    ''SAME ROOT'' = Related meaning: "bore → bored/boring", "excite → excited/exciting"

    '
  core_meaning: -ed = feeling experienced by a person (I am bored = I feel boredom). -ing = thing/person causing the feeling
    (The movie is boring = causes boredom).
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Not tense-based; these are adjective forms, not verb tenses. Can be past, present, or future.)
phonetics:
- example_generator:
  - contexts: null
  - ed adjective pronunciation
  l1_issue: Learners may not distinguish between the three pronunciations of the -ed ending. Drill all three patterns explicitly.
  note: 'The -ed ending in adjectives has three pronunciations: /t/ after voiceless sounds, /d/ after voiced sounds, and /ɪd/
    after /t/ or /d/ sounds.'
register_notes:
- note: 'Biber et al. (2021) — Participial adjectives (-ed/-ing): attributive vs. predicative distribution varies by register.
    Academic prose uses more participial premodifiers. Ch. 7.9.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 7.9.1
