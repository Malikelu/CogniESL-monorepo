description: Clauses that complete the meaning of abstract nouns, introduced by 'that', 'whether', or a wh-word, functioning
  as the complement to the noun.
dialectal_variation: []
discourse_notes:
- note: Noun complement clauses (the fact that, the idea that) complete the meaning of certain nouns. They are common in academic
    and formal writing.
form:
  affirmative:
    example_generator:
      contexts:
      - academic writing
      - formal reports
      - news
      min_examples: 4
    structure: 'Noun + that + clause: ''The fact that he was late didn''t surprise anyone.'' / ''The idea that we could fail
      never occurred to her.'' / ''There is evidence that the treatment is effective.'' The noun is usually abstract (fact,
      idea, belief, hope, suggestion, possibility, risk, evidence, claim, rumour, feeling, impression, etc.).'
  negative:
    example_generator:
      contexts:
      - negative complement clauses
      - denial and absence
      min_examples: 3
    structure: 'The complement clause itself can be negative: ''The fact that she didn''t attend the meeting was noted.''
      / ''The possibility that the project might not be completed on time is a concern.'' / ''There is no evidence that the
      drug has any side effects.'''
  questions:
    example_generator:
      contexts:
      - academic discussion
      - policy debates
      - formal questions
      min_examples: 3
    structure: 'Noun-complement clauses can follow question nouns: ''The question of whether the government should intervene
      remains open.'' / ''The issue of how the money should be spent has not been resolved.'' / ''The debate over whether
      the policy is effective continues.'''
grammar_point: noun_complement_clauses
level: C1
meaning:
  ccqs:
  - answer: A relative clause describes or identifies a noun (which one?). A noun-complement clause tells us the content of
      an abstract noun (what is the fact/idea/belief?).
    purpose: Tests whether the learner knows that certain nouns (fact, idea, suggestion, recommendation) can be followed by
      a 'that' clause with base verb (subjunctive) in formal English.
    question: Can you explain the difference between a relative clause and a noun-complement clause by giving an example of
      when to use each?
  - answer: 'No — only certain abstract nouns, typically those related to thought, knowledge, emotion, or communication: fact,
      idea, belief, hope, suggestion, possibility, risk, danger, evidence, claim, etc.'
    purpose: Tests understanding of noun_complement_clauses.
    question: Can any noun take a complement clause?
  - answer: 'In formal writing, ''that'' is usually included. In informal speech, it is sometimes omitted: ''The fact she
      left early was strange'' (informal) vs. ''The fact that she left early was strange'' (formal).'
    purpose: Tests understanding of noun_complement_clauses.
    question: Is 'that' always necessary in a noun-complement clause?
  - answer: 'Yes, when the complement involves uncertainty or a question: ''The question of whether he would come remained
      unanswered.'' / ''The possibility that/whether she might change her mind cannot be ruled out.'''
    purpose: Tests understanding of noun_complement_clauses.
    question: Can we use 'whether' instead of 'that'?
  contrast: 'Without complement: "The news surprised everyone." (What news? We don''t know.)

    With complement: "The news that the factory would close surprised everyone." (Now we know the content of the news.)

    Relative clause (modifies noun): "The news that he announced was shocking." (Which news? The one he announced.)

    Complement clause (completes noun): "The news that the war was over was shocking." (What was the news? That the war was
    over.)

    '
  core_meaning: A noun-complement clause is a subordinate clause that completes the meaning of a noun, just as a verb complement
    completes the meaning of a verb. The clause tells us WHAT the fact, idea, belief, etc., actually is. These clauses typically
    follow abstract nouns related to thought, knowledge, emotion, or communication, and are most commonly introduced by 'that'.
  example_generator:
    contexts:
    - academic writing
    - formal reports
    - news writing
    - legal language
    - IELTS/CAE essays
    cultural_notes:
    - Noun-complement clauses are a hallmark of formal written English. They are essential for academic essays, research papers,
      and professional reports. In many languages, the equivalent structure uses a different conjunction or word order, so
      learners may need explicit practice.
    - 'In American English, the subjunctive is sometimes used after nouns of suggestion/demand: ''The recommendation that
      he be promoted was approved.'' In British English, ''should'' is more common: ''The recommendation that he should be
      promoted was approved.'''
    min_examples: 5
  timeline: The tense in the complement clause depends on the meaning, not on the main clause tense. 'The fact that she left
    is undeniable.' (past) / 'The fact that she is leaving is undeniable.' (present) / 'The fact that she will leave is undeniable.'
    (future).
phonetics:
- example_generator:
    contexts:
    - connected speech
    - weak forms
  l1_issue: Learners may pronounce 'that' as /ðæt/ (the demonstrative form), making the sentence sound unnatural. Drill the
    weak form /ðət/ in context.
  note: 'The word ''that'' as a complementiser is almost always reduced to /ðət/ in connected speech, with a very short, unstressed
    vowel: ''The fact that he left'' /ðə fækt ðət hi left/. It should not be stressed.'
- example_generator:
    contexts:
    - pausing in complex sentences
    - spoken academic English
  l1_issue: Learners may rush through the structure without pausing, making it difficult for listeners to follow. Practice
    with deliberate pausing.
  note: 'When the complement clause is long, speakers often pause briefly after the noun: ''The fact... that he had been lying
    all along... was shocking.'' This helps the listener process the structure.'
register_notes:
- note: In conversation, defining relative clauses are more common than non-defining.
  reliability: D
  source: Team observation
  tier: 4
- note: In academic writing, both defining and non-defining relative clauses are used extensively.
  reliability: D
  source: Team observation
  tier: 4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
