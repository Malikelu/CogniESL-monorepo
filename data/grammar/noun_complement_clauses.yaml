sub_rules:
- examples:
  - The evidence that he was at the scene is overwhelming.
  - There was no sign that anything was wrong.
  - The fact that the earth is round is undisputed.
  rule: Nouns of fact and knowledge (fact, evidence, proof, sign, indication)
  type: grammatical
- examples:
  - The belief that hard work leads to success is deeply ingrained.
  - The theory that the universe is expanding has been widely accepted.
  - The assumption that all students have internet access is flawed.
  rule: Nouns of thought and belief (idea, belief, notion, assumption, theory, suspicion)
  type: grammatical
- examples:
  - The claim that the product is 100% natural has been disputed.
  - The suggestion that we should postpone the meeting was rejected.
  - There are rumours that the CEO is resigning.
  rule: Nouns of communication (claim, suggestion, proposal, recommendation, rumour, report)
  type: grammatical
- examples:
  - The hope that peace would prevail kept them going.
  - The concern that children are spending too much time online is growing.
  - The disappointment that the team had lost was visible on their faces.
  rule: Nouns of emotion and attitude (hope, fear, concern, worry, disappointment, surprise)
  type: grammatical
- examples:
  - The possibility that the flight might be delayed cannot be ruled out.
  - The risk that the virus could mutate is a serious concern.
  - There is a chance that the weather will improve by tomorrow.
  rule: Nouns of possibility and risk (possibility, risk, chance, danger, likelihood)
  type: grammatical
- examples:
  - It is a fact that the population is ageing.
  - It is my belief that education can change lives.
  - It was rumoured that the minister would resign.
  rule: Postponing the complement clause with 'it'
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Give students 10 sentences, some with relative clauses and some with noun-complement clauses. Students
      identify which is which and explain the difference.
    duration: 15
    name: Clause identification
  - adaptation_notes: 'Give students pairs of simple sentences. They must combine them using a noun-complement clause: ''The
      earth is round. This is a fact.'' → ''The fact that the earth is round is undisputed.'''
    duration: 20
    name: Sentence combining
  - adaptation_notes: Students write a short academic paragraph (80-100 words) on a given topic, using at least four noun-complement
      clauses. Peer review for accuracy and appropriateness.
    duration: 25
    name: Academic writing practice
  - adaptation_notes: Provide sentences with common errors (wrong conjunction, missing 'that', confusion with relative clauses).
      Students identify and correct the errors.
    duration: 15
    name: Error correction
  tips:
  - 'Start by showing the difference between a relative clause and a noun-complement clause. Use minimal pairs: ''The news
    that he announced'' (relative) vs. ''The news that the war was over'' (complement). Ask: ''Which one tells us the content
    of the news?'''
  - Provide a list of nouns that take complement clauses and have students categorise them (fact, belief, emotion, communication,
    possibility).
  - 'Practice transforming sentences: ''He was late. This fact surprised everyone.'' → ''The fact that he was late surprised
    everyone.'''
  - Use authentic texts (news articles, academic abstracts) and have students identify noun-complement clauses.
  - 'Introduce the ''it'' extraposition structure as an alternative: ''It is a fact that...'' / ''It was rumoured that...'''
  - 'Swan PEU: Noun complement clauses — the fact THAT, the idea THAT, the belief THAT. Many abstract nouns take that-clauses
    as complements. Often reduced to infinitive: ''the decision to leave'' = ''the decision that we should leave.'''
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'NOUN COMPLEMENT TAXONOMY: That-clauses (''The fact THAT he left''), infinitives (''Her desire TO WIN''), gerunds (''The
    idea OF LEAVING'') can all function as noun complements. The choice is governed by the head noun. Factive nouns (fact,
    knowledge) presuppose truth of complement; nonfactive nouns (claim, belief) do not. Source: Ch.31/33 p.442-459.'
title: Noun-Complement Clauses (The fact that..., The idea that..., The possibility that...)
use:
- context: Academic writing
  description: Noun-complement clauses are essential in academic discourse for presenting arguments, evidence, and theories.
  examples:
  - The fact that global temperatures are rising is supported by extensive data.
  - The hypothesis that sleep deprivation affects cognitive function was confirmed by the study.
  - There is growing evidence that early intervention improves outcomes.
- context: News and journalism
  description: Journalists use noun-complement clauses to report claims, rumours, and findings.
  examples:
  - The claim that the minister had misled parliament was denied by Downing Street.
  - Reports that the company is planning to lay off staff have been dismissed as speculation.
  - The announcement that interest rates would be cut surprised the markets.
- context: Legal and official documents
  description: Legal language uses noun-complement clauses for precision and formality.
  examples:
  - The allegation that the defendant had acted fraudulently was not upheld.
  - The recommendation that the licence be revoked was accepted by the committee.
  - There is no proof that the contract was signed under duress.
- context: Professional and business communication
  description: Business reports and professional documents use noun-complement clauses to present findings and recommendations.
  examples:
  - The suggestion that we restructure the department was well received.
  - The possibility that the merger might fall through cannot be ignored.
  - The board acknowledged the risk that the new product might not succeed.
