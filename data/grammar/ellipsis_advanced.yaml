    example_generator:
      contexts:
      - follow-up questions
      - information gaps
      min_examples: 3
    structure: 'Sluicing: Someone called, but I do not know who. / Elliptical questions: She left. Why?'
grammar_point: ellipsis_advanced
level: C2
meaning:
  ccqs:
  - answer: Yes, this is ellipsis.
    purpose: Tests whether the learner understands ellipsis as the omission of words that are recoverable from context. 'She
      can play the piano and he can too' omits 'play the piano' because it is recoverable from the previous clause.
    question: Can the missing words be recovered from the previous clause?
  - answer: Yes, ellipsis is natural and expected in these contexts.
    purpose: Tests whether the learner understands that advanced ellipsis (gapping, sluicing, VP-ellipsis) produces natural-sounding
      sentences. Overusing full forms sounds unnatural; omitting recoverable elements is expected in fluent English.
    question: Does the sentence sound natural without the omitted words?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can distinguish sluicing from other types of advanced ellipsis. Sluicing specifically
      involves a wh-word followed by omission of a recoverable clause, and it is the only ellipsis type that occurs in subordinate
      clauses after verbs like 'know,' 'remember,' and 'understand.'
    question: What is the difference in meaning between these two forms?
  - answer: '''She can play the piano and he can too.'' In ellipsis, repeat only the auxiliary, not the full verb phrase.'
    purpose: Tests whether the learner uses ellipsis correctly (Swan PEU 2016, entry 178).
    question: Which is correct? *'She can play the piano and he can play the piano too' or 'She can play the piano and he
      can too'?
  contrast: Full form = John likes coffee and Mary likes tea. Elliptical = John likes coffee and Mary tea. (gapping)
  core_meaning: Advanced ellipsis involves the systematic omission of words or phrases that can be recovered from the surrounding
    context. This creates more concise, natural-sounding English in both speech and writing.
  example_generator:
    contexts:
    - academic writing
    - casual conversation
    - comparative structures
    - coordinated clauses
    cultural_notes:
    - Ellipsis is a hallmark of native-like fluency
    - Overuse can make speech sound clipped or unclear
    min_examples: 5
  timeline: Varies — ellipsis works with any tense or aspect.
phonetics:
- example_generator:
    contexts:
    - spoken coordination
    - presentations
  l1_issue: Learners from languages with less ellipsis (e.g. Japanese, Korean) may produce full forms where ellipsis is expected.
  note: Elliptical structures are produced with a slight pause where the omitted material would have been, helping the listener
    recover the missing information.
- example_generator:
    contexts:
    - follow-up questions
    - expressing uncertainty
  l1_issue: Learners may fail to omit the redundant clause after the wh-word.
  note: 'In sluicing, the wh-word carries strong stress and rising intonation: Someone called — I do not know WHO?'
register_notes:
- note: 'Biber et al. (2021) — Ellipsis: overwhelmingly conversational. Academic prose and formal writing avoid ellipsis in
    favor of explicit, complete clauses. Ch. 14'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 14
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed.
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - John likes coffee and Mary tea.
  - She can play piano and he guitar.
  - I will cook dinner and she wash up.
  rule: 'Gapping: the verb (and sometimes other elements) is omitted from the second of two coordinated clauses'
  type: grammatical
- examples:
  - John likes coffee, and Mary too.
  - She can play piano, but not he.
  - I have finished, and she has too.
  rule: 'Stripping (bare argument ellipsis): only one element remains in the second clause, with the rest omitted'
  type: grammatical
- examples:
  - Someone called, but I do not know who.
  - He left, but why is unclear.
  - She is going somewhere, but she will not say where.
  rule: 'Sluicing: after a wh-word, the rest of the clause is omitted because it is recoverable'
  type: grammatical
- examples:
  - She can play the piano and he can too.
  - I have finished and so has she.
  - John will cook and Mary might too.
  rule: 'VP ellipsis: an auxiliary or modal stands in for the entire verb phrase'
  type: grammatical
- examples:
  - She earns more than I do.
  - He is taller than she is.
  - I have read more books than she has.
  rule: 'Comparative ellipsis: elements are omitted in the than-clause when recoverable'
  type: grammatical
- examples:
  - John likes coffee more than Mary does tea.
  - She plays piano better than he does guitar.
  rule: 'Pseudo-gapping: the verb is omitted but an auxiliary remains, often with a contrastive element'
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students identify the omitted words in elliptical sentences and explain the type of ellipsis.
    duration: 10
    name: What is Missing?
  - adaptation_notes: Students rewrite full sentences as elliptical ones, and vice versa.
    duration: 15
    name: Ellipsis Transformation
  - adaptation_notes: Students complete dialogues using appropriate ellipsis (sluicing, stripping, VP ellipsis).
    duration: 15
    name: Dialogue Completion
  tips:
  - 'Parrott (2000) Ch. 24: Ellipsis and substitution pose comprehension problems for learners. They may avoid using them,
    creating overly formal/repetitive speech. Draw attention to these features in materials from early stages.'
  - Start with gapping as the most common and accessible type of ellipsis.
  - Use sentence-completion exercises where students must identify what has been omitted.
  - Compare full and elliptical versions to show how ellipsis creates conciseness.
  - Introduce sluicing through authentic dialogue and news headlines.
  - 'Swan PEU: Ellipsis — leaving out understood material: ''She went to the shop and bought some milk.'' (she is omitted
    from second clause). ''Come in!'' (you is omitted). Fris (jokes), short answers, tag questions all rely on ellipsis.'
title: Advanced Ellipsis
use:
- context: Coordinated clauses
  description: Gapping and stripping are extremely common in coordinated structures to avoid repetition.
  examples:
  - Some people prefer tea, others coffee.
  - She was reading and he watching television.
  - I will take the bus and she the train.
- context: Question and answer sequences
  description: Sluicing is natural in follow-up questions where the context is already established.
  examples:
  - Something happened. I am not sure what.
  - He is leaving. Do you know why?
  - Someone took my pen. I wonder who.
- context: Comparative structures
  description: Ellipsis in than-clauses is standard and expected.
  examples:
  - This book is more interesting than that one is.
  - She works harder than he does.
  - I have more experience than she has.
- context: Academic and formal writing
  description: Ellipsis creates concise, elegant prose in formal contexts.
  examples:
  - The first group received the treatment; the second, a placebo.
  - Some studies support the theory; others, the alternative.
