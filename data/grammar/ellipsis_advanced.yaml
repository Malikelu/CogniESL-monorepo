description: Omitting words that are recoverable from context, including gapping, stripping, sluicing, and other advanced
  ellipsis types beyond basic omission.
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - coordinated clauses
      - comparative sentences
      - question-answer pairs
      min_examples: 4
    structure: 'Various patterns depending on ellipsis type: gapping omits the verb, stripping omits everything but one element,
      sluicing omits after a wh-word.'
  negative:
    example_generator:
      contexts:
      - negative coordination
      - disagreement
