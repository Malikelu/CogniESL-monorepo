common_errors:
- correction: It is said that he is the richest man in the world.
  error: '*It is said that he is the richest man is in the world.*'
  explanation: 'Double ''is'': the passive reporting verb (''is said'') and the main verb (''is the richest'') must not be
    duplicated. The ''that'' clause contains one complete sentence with one main verb.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  reliability: D
- correction: She asked me where the station was.
  error: '*She asked me where was the station.*'
  explanation: Reported questions use statement word order (subject + verb), not question word order (verb + subject). This
    is one of the most persistent reported errors at B2-C1 level across all L1 backgrounds.
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Arabic
  - Korean
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Word order'
- correction: Experts claim that the study is flawed.
  error: '*Experts claim the study is flawed that.*'
  explanation: The 'that' complementizer must come immediately after the reporting verb, not at the end of the clause. In
    English, complementizer 'that' begins the complement clause; it does not close it. Germanic L1 speakers transfer verb-final
    patterns.
  flagged: true
  l1_groups:
  - German
  - Dutch
  - Portuguese
  reliability: D
- correction: Scientists deny that there was a problem.
  error: '*Scientists deny there was a problem that existed.*'
  explanation: Doubling the clause content with a relative ('that existed') after 'deny that' creates redundancy. The 'that'
    clause after 'deny' already expresses what is denied. This is a processing error from monitoring multiple clauses.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
