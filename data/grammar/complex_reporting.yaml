grammar_point: complex_reporting
level: C1
meaning:
  ccqs:
  - answer: Someone else's — that is reporting.
    question: Is the speaker reporting their own words or someone else's?
    purpose: 'Tests whether the learner can correctly use complex reporting structures (CCQ #1).'
  - answer: Passive = impersonal, Active = attributed.
    purpose: 'Tests whether the learner can correctly use complex reporting structures (CCQ #2).'
    question: Is the reporting verb active or passive?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with complex reporting and explain why they are
      incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with complex reporting. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: Simple reporting = He said that he was tired. vs Passive reporting = It is said that he is rich.
  core_meaning: Reporting what others said or thought using complex structures. Includes passive reporting (It is said that...),
    reporting verbs with that-clauses, and reported questions.
  example_generator:
    contexts:
    - news reporting
    - academic writing
    - formal communication
    - indirect speech
    cultural_notes: []
    min_examples: 5
  timeline: Depends on the tense of the reporting verb.
