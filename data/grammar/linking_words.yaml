sub_rules:
- examples:
  - I like coffee and tea
  - She is smart. Moreover, she is kind
  rule: 'Addition: and (informal), moreover and furthermore (formal)'
  type: grammatical
- examples:
  - I like coffee but not tea
  - However, I prefer tea
  rule: 'Contrast: but (informal), however and although (formal)'
  type: grammatical
- examples:
  - I drink coffee because I like it
  - Due to the rain, we stayed home
  rule: 'Cause: because (common), due to (formal with noun)'
  type: grammatical
- examples:
  - I like coffee, so I drink it daily
  - It rained. Therefore, we stayed home
  rule: 'Result: so (informal), therefore (formal)'
  type: grammatical
teaching:
  methodology: PPP with paragraph building
  recommended_activities:
  - adaptation_notes: Students sort linking words into categories.
    duration: 10
    name: Linking Word Sort
  - adaptation_notes: Students connect short sentences with linking words to create
      a coherent paragraph.
    duration: 15
    name: Paragraph Building
  - adaptation_notes: Students rewrite informal sentences using formal linking words.
    duration: 10
    name: Formal or Informal
  tips:
  - 'Week 1: Basic addition (and) and contrast (but).'
  - 'Week 2: Cause (because) and result (so).'
  - 'Week 3: Formal linking words (moreover, however, therefore).'
  - 'Swan PEU: ''Because'' + ''so'' = error. ''Although'' + ''but'' = error. English
    uses ONE conjunction per pair, unlike many L1s.'
  - 'Swan PEU: ''Despite'' (preposition) = noun/gerund. ''Although'' (conjunction)
    = clause. ''Despite the rain'' / ''Although it rained''.'
  - 'Swan PEU: ''So that'' for purpose with clause. ''In order to'' / ''to'' for purpose
    with infinitive.'
  - 'Swan PEU: Positioning of connecting adverbials — ''however,'' ''therefore,''
    ''moreover'' typically go at the start of a clause, set off by commas: ''She was
    tired. However, she continued.'''
  - 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book, 2nd ed. Heinle & Heinle.
    Ch. 26: GB 2nd ed. (Ch.26) classifies logical connectors (conjuncts) by discourse
    function: ADDITION (moreover, furthermore, in addition), CONTRAST (however, nevertheless,
    on the other hand), RESULT (therefore, consequently, as a result), CONCESSION
    (admittedly, granted, of course). Conjuncts are sentence-initial or mid-sentence,
    NOT sentence-final. They are more formal than coordinating conjunctions.'
title: Linking Words (Addition, Contrast, Cause, Result)
use:
- context: Addition
  examples:
  - I like coffee and tea
  - She is smart. Moreover, she is kind
- context: Contrast
  examples:
  - I like coffee but not tea
  - Although it rained, we went out
- context: Cause and reason
  examples:
  - I drink coffee because I like it
  - Due to the traffic, we were late
- context: Result
  examples:
  - I like coffee, so I drink it daily
  - It rained. As a result, we stayed home
