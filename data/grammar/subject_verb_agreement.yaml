common_errors:
- correction: She goes to school every day.
  error: '*She go to school every day.*'
  explanation: Third person singular (she/he/it) requires the verb to take -s in present simple. This is the most common subject-verb
    agreement error.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  - Japanese
  - Korean
  - Italian
  reliability: D
- correction: Everyone is here.
  error: '*Everyone are here.*'
  explanation: Everyone is an indefinite pronoun and takes a singular verb (is), even though it refers to multiple people.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Arabic
  - Italian
  reliability: D
- correction: The team is winning.
  error: '*The team are winning.* (in AmE context)'
  explanation: In American English, collective nouns (team, family, government) take singular verbs. In British English, both
    singular and plural are acceptable.
  flagged: true
  l1_groups:
  - British English learners
  - Spanish
  - Italian
  reliability: D
- correction: The price of the cars is high.
  error: 'Agreement with intervening phrases: *''The price of the cars are high.'''
  explanation: 'Swan PEU: The verb agrees with the REAL subject, not the nearest noun. ''The price... is'' (not ''cars...
    are''). Prepositional phrases between subject and verb don''t change agreement.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: Everyone is happy.
  error: 'Using plural verb with ''every/everyone'': *''Everyone are happy.'''
  explanation: 'Swan PEU: ''Every'', ''everyone'', ''everybody'', ''each'', ''nobody'', ''nothing'' are singular. They take
    singular verbs.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: The team is playing well. (AmE) / The team are playing well. (BrE)
  error: 'Using singular verb with collective nouns (AmE influence): *''The team are playing well.'' (BrE)'
  explanation: 'Swan PEU: Collective nouns (team, family, government, committee) take singular verbs in AmE, plural verbs
    in BrE when focusing on individual members.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: ''
  error: See Swan & Smith (2001) for L1-specific patterns
  explanation: 'Swan & Smith (2001). Spanish (subject pronouns dropped, no agreement: *Is Spanish), Dutch (word order: subject
    and finite verb inseparable).'
  flagged: false
  l1_groups:
  - Spanish
  - Dutch
  reliability: B
  source: 'Swan & Smith (2001) Learner English: A Teacher''s Guide to Interference and Other Problems, 2nd ed. Cambridge University
    Press.'
- error: '[See Zero Copula (be omission) transfer patterns]'
  explanation: Zero-copula constructions in present tense transfer to English (e.g., "She going school", "He a teacher")
  l1_groups:
  - Kiswahili (Swahili)
  - Mandarin
  - Russian
  reliability: C
  source: 'L1 Interference ESL Teacher Resources — Comparative Analysis of Cross-Linguistic Influence: Best-in-Class Resources
    and L1 Interference Databases for English Language Educators.'
  tier: 4
description: Rules for matching the form of the verb to the number (singular/plural) and person (1st/2nd/3rd) of the subject
  in a sentence.
dialectal_variation: []
discourse_notes:
- note: 'In academic writing, subject-verb agreement errors are considered serious: ''The data shows'' (incorrect) vs ''The
    data show'' (correct)'
- note: 'In conversation, agreement errors are common with collective nouns: ''The team are playing well.'' (BrE) vs ''The
    team is playing well.'' (AmE)'
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Singular Subject (he/she/it/单数名词) + Verb + s/es: "She works." "The dog runs."

      Plural Subject (we/you/they/复数名词) + Base Verb: "They work." "The dogs run."

      3rd Person Singular Present Simple: add s/es to verb (works, watches, goes).

      '
  negative:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Singular: Subject + doesn''t + Base Verb: "He doesn''t work."

      Plural: Subject + don''t + Base Verb: "They don''t work."

      '
  questions:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Singular: Does + Subject + Base Verb: "Does he work?"

      Plural: Do + Subject + Base Verb: "Do they work?"

      '
grammar_point: subject_verb_agreement
level: A2-B1
meaning:
  ccqs:
  - answer: is — 'everyone' is an indefinite pronoun and takes a singular verb, even though it refers to multiple people.
    purpose: Tests whether the learner knows that indefinite pronouns (everyone, everybody, each) take singular verbs despite
      referring to multiple people. This is one of the most common errors at A2-B1.
    question: Everyone ___ here. (is / are)
  - answer: Both can be correct. 'The team is playing' (American English — team as one unit). 'The team are playing' (British
      English — team as individual members).
    purpose: 'Tests whether the learner can identify the true subject in complex sentences: ''The box of chocolates is on
      the table.'' (subject: box, not chocolates)'
    question: The team ___ playing well. (is / are)
  - answer: goes — third person singular (she) requires the verb to take -s/-es in present simple.
    purpose: Tests whether the learner knows the third person singular -s rule. This is the most basic subject-verb agreement
      rule and one of the most persistent errors across all L1 groups.
    question: She ___ to the gym every day. (go / goes)
  - answer: '''The news is good.'' ''News'' looks plural but is uncountable and takes a singular verb.'
    purpose: Tests whether the learner knows that nouns like 'news', 'mathematics' are uncountable and take singular verbs
      (Swan PEU 2016, entry 119).
    question: Which is correct? *'The news are good' or 'The news is good'?
  contrast: 'Singular: "He works." (verb + s)

    Plural: "They work." (verb no s)

    Exception: "I/You work." (no s even for singular I/you)

    '
  core_meaning: The verb must agree with the subject in number (singular/plural) and person (1st/2nd/3rd) to form grammatically
    correct sentences.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: 'Present Simple only: Subject-verb agreement is most critical in present simple tense; past simple uses same verb
    for all subjects (worked).'
phonetics:
- example_generator:
    contexts:
    - verb ending pronunciation
  l1_issue: Portuguese and Spanish speakers often omit the third person -s. Drill this explicitly.
  note: 'The -s ending has three pronunciations: /s/ after voiceless sounds (works /wɜːks/), /z/ after voiced sounds (plays
    /pleɪz/), /ɪz/ after sibilant sounds (watches /wɒtʃɪz/).'
