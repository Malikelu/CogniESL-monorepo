sub_rules:
- examples:
  - He works
  - She watches
  - It goes
  rule: Third person singular (he/she/it) adds -s/-es to present simple verbs
  type: grammatical
- examples:
  - They work
  - We watch
  - The children play
  rule: Plural subjects use the base verb (no -s)
  type: grammatical
- examples:
  - I work
  - You study
  rule: I and you use the base verb (no -s) even though they are singular
  type: grammatical
- examples:
  - Everyone likes pizza
  - Someone is here
  - No one knows
  rule: Indefinite pronouns (everyone, someone, no one, anybody) are singular
  type: grammatical
- examples:
  - The team is winning (unit)
  - The team are arguing (members — BrE)
  rule: Collective nouns (team, family, group) can be singular (unit) or plural (members)
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Teacher holds up subject cards (he, they, everyone, the children). Students say the correct verb form:
      ''He works'', ''They work'', ''Everyone works'', ''The children work.'''
    duration: 10
    name: Subject Verb Match
  - adaptation_notes: 'Show sentences with agreement errors. Students identify and fix them: ''He work'' → ''He works'', ''They
      works'' → ''They work.'''
    duration: 10
    name: Error Correction
  - adaptation_notes: 'Students practice indefinite pronouns: ''Everyone likes...'' (NOT ''Everyone like''). Students create
      sentences with everyone, someone, no one, anybody.'
    duration: 10
    name: Everyone or Every One
  tips:
  - 'Week 1: Basic 3rd person singular s/es (he/she/it + verb s).'
  - 'Week 2: Indefinite pronouns (everyone, someone) = singular.'
  - 'Week 3: Collective nouns and exceptions (I/you no s).'
  - 'Use subject cards: Hold up ''he'' card, students say verb + s; hold up ''they'' card, students say base verb.'
  - 'Swan PEU: ''There is/are'' — the verb agrees with the noun that follows. ''There is a book'' vs ''There are books''.
    In informal speech, ''There''s'' is often used with plurals.'
  - 'Swan PEU: ''Each of'', ''every one of'' + plural noun → singular verb. ''Each of the students has a book.'''
  - 'Swan PEU: ''Neither...nor'' and ''either...or'' — verb agrees with the nearest subject. ''Neither the students nor the
    teacher is here.'''
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 3: CGEL (Ch.3) analyzes subject-verb agreement as a
    matter of FORM (notional vs formal). Formal agreement: ''The committee HAS decided'' (singular form). Notional agreement:
    ''The committee HAVE decided'' (plural meaning, BrE). CGEL notes that notional agreement is more common in BrE than AmE.
    With collective nouns, both are standard. With ''there'' existentials, formal agreement requires plural ''be'' with plural
    notional subject: ''There ARE several problems.'''
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'COLLECTIVE NOUN AGREEMENT: Collective nouns (team, committee, flock) may take singular OR plural subject-verb agreement.
    AmE strongly prefers singular; BrE allows plural more freely. The dual number is also reflected in reflexive pronouns
    and relative pronouns: ''The committee blamed itself'' (unit) vs. ''The committee blamed themselves'' (individuals). Three
    types of collectives: common (team, herd), unique (the Congress, the Vatican), generic (the clergy, the bourgeoisie).
    Adjective-derived collectives (the meek, the dead, the rich) ALWAYS take plural verbs. Source: Ch.17 p.328-330.'
title: Subject-Verb Agreement
use:
- description: Match verb to subject number in present simple.
  examples:
  - The cat sleeps.
  - The cats sleep.
  key_point: 3rd person singular (he/she/it) always takes verb + s/es.
  name: Basic Agreement
- description: 'Someone, anyone, no one, everyone are singular: ''Everyone likes pizza.'''
  examples:
  - Someone is here.
  - No one knows the answer.
  key_point: Indefinite pronouns ending in -one/-body/-thing are singular.
  name: Indefinite Pronouns
- description: 'Team, family, group can be singular (as a unit) or plural (individual members): ''The team is winning.'' (unit)
    vs ''The team are arguing.'' (members).'
  examples:
  - The family has a dog.
  - The family have different opinions.
  key_point: British English uses plural more often for collective nouns; American English uses singular.
  name: Collective Nouns
