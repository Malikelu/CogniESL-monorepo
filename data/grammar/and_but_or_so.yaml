common_errors:
- correction: I like coffee and tea.
  error: 'Using ''but'' when ''and'' is needed: *''I like coffee but tea.'''
  explanation: 'Swan PEU: ''and'' joins similar/related items; ''but'' joins contrasting
    items. ''I like coffee and tea'' (both are true together). ''I like coffee but
    not tea'' (contrast).'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan Entry 226. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: It rained, so we stayed home.
  error: 'Using ''so'' when ''because'' is needed: *''I stayed home so it rained.''
    (wrong direction)'
  explanation: 'Swan PEU: ''so'' shows result/consequence (''It rained, so we stayed
    home''). For reason, use ''because'' (''I stayed home because it rained''). With
    ''so'', the cause comes first and the result comes after.'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: Swan Entry 226. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: Words that join equal grammatical elements (words, phrases, clauses).
  Essential for sentence connection.
dialectal_variation: []
discourse_notes:
- note: 'Coordinating conjunctions link clauses: ''I woke up and had breakfast.'''
- note: In formal writing, 'however' and 'therefore' may replace 'but' and 'so' for
    more academic register.
form:
  affirmative:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Word + conjunction + word: "apples and oranges"

      Phrase + conjunction + phrase: "in the morning and in the evening"

      Clause + conjunction + clause: "I like tea, and she likes coffee."

      '
  negative:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Conjunction unchanged in negatives: ''I don''t like tea or coffee.'''
  questions:
    example_generator:
      contexts:
      - everyday situations
      min_examples: 4
    structure: 'Conjunction in same position: ''Do you want tea or coffee?'''
grammar_point: and_but_or_so
level: A1
meaning:
  ccqs:
  - answer: Both. And means both things are true — I like tea AND coffee.
    purpose: Tests understanding that and adds or combines items
    question: I like tea and coffee. Do I like only one drink or both?
  - answer: No. It is cold AND sunny. But shows these two ideas are surprising together.
    purpose: Tests understanding that but shows contrast between two true ideas
    question: It is cold but sunny. Is the weather only cold?
  - answer: Usually or means choose one. If you want both, you would say and instead.
    purpose: Tests understanding that or presents alternatives, not combinations
    question: Do you want tea or coffee? Can I choose both?
  - answer: In English negative sentences, or replaces and to connect items. Saying
      I do not like tea and coffee could be ambiguous (it might mean you do not like
      them together). I do not like tea or coffee is clear -- you dislike both. In
      negatives, or is the default connector.
    purpose: Tests whether the learner understands that or replaces and in negative
      sentences. This is a fundamental rule of English coordination that learners
      from many L1 backgrounds get wrong because their native languages often keep
      and in negative constructions.
    question: I like tea or coffee in a negative sentence becomes I do not like tea
      or coffee. Why do we use or instead of and here?
  contrast: '''And'' = addition (positive connection)

    ''But'' = contrast (opposite ideas)

    ''Or'' = choice/alternative

    ''So'' = result/consequence

    '
  core_meaning: 'Connects equal elements: addition (and), contrast (but), choice (or),
    result (so).'
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Conjunctions show relationships, not time.)
phonetics:
- example_generator:
    contexts:
    - connected speech
  l1_issue: Many L1 speakers pronounce and as a full word with a clear vowel. In natural
    speech, it reduces to a schwa or even just /n/.
  note: And is almost always reduced to a weak form in connected speech
  practice: Drill common pairs like fish and chips and salt and pepper with reduced
    and.
- example_generator:
    contexts:
    - connected speech
  l1_issue: Speakers may over-pronounce but with full stress. In natural speech, it
    is usually unstressed.
  note: But — the vowel reduces to schwa in connected speech
  practice: Drill but in phrases like cheap but good and small but strong.
register_notes:
- note: '''And'', ''but'', ''or'', ''so'' are neutral in register.'
  reliability: D
  source: Team observation
  tier: 4
- note: In formal writing, 'however' and 'therefore' may replace 'but' and 'so'.
  reliability: D
  source: Team observation
  tier: 4
- note: Biber et al. (1999) — Coordinating conjunctions ('and', 'but', 'or', 'so')
    are overwhelmingly more common in conversation than academic prose. 'And' is the
    most frequent in conversation; academic prose uses more subordination. Coordination
    tags (and stuff, and so on) are strongly conversational. Ch. 2.9.2, 14
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 2.9.2
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 24:
    Conjunction'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language.
    Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners.
    University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed.(and/but/or), 227 (not...or/nor).
sub_rules:
- examples:
  - bread and butter (common pair)
  - I cooked and she cleaned. (two related actions)
  explanation: And adds information. Both parts are true or desired together.
  rule: And joins similar or related ideas
  type: grammar
- examples:
  - She is smart but lazy. (positive and negative)
  - I called but she did not answer. (expected vs actual)
  explanation: But signals that the second idea contrasts with or surprises given
    the first.
  rule: But joins contrasting or unexpected ideas
  type: grammar
- examples:
  - Tea or coffee? (positive choice)
  - I do not like tea or coffee. (negative — or replaces and)
  explanation: In negative sentences, use or not and to connect items.
  rule: Or presents alternatives and in negatives it replaces and
  type: grammar
- examples:
  - It rained, so we stayed home. (rain is cause, staying home is result)
  - I was tired, so I went to bed. (tiredness is cause, bed is result)
  explanation: So answers what happened because of this. The clause before so is the
    cause.
  rule: So shows result or consequence (cause then effect)
  type: grammar
- examples:
  - I like tea, and she likes coffee. (comma before and)
  - It was late, so we left. (comma before so)
  - I like tea and coffee. (no comma — joining words, not clauses)
  explanation: When both sides of the conjunction can stand alone as sentences, use
    a comma.
  rule: Use a comma before the conjunction when joining two independent clauses
  type: punctuation
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: 'Students sort conjunctions by function: addition (and), contrast
      (but), choice (or), result (so). Then create sentences with each.'
    duration: 10
    name: Conjunction Sorting Game
  - adaptation_notes: 'Label four corners of the room: and, but, or, so. Teacher says
      a sentence stem. Students go to the corner with the correct conjunction to complete
      it.'
    duration: 10
    name: Four Corners
  - adaptation_notes: 'Students build a story together, each adding a sentence with
      a different conjunction: ''I woke up late. AND I missed the bus. SO I was late
      for work. BUT my boss was understanding.'''
    duration: 15
    name: Story Building with Conjunctions
  tips:
  - 'Use colored blocks: blue for and, red for but, green for or, yellow for so.'
  - 'Practice with shopping lists: I need apples and oranges (both), tea or coffee
    (choice).'
  - 'Act out but: I am happy (smile) plus but I am tired (yawn) equals contrast.'
  - 'Use cause-effect cards for so: match cause cards (It rained) with effect cards
    (We stayed home).'
  - 'Swan PEU: ''and'' joins grammatically similar expressions — words, phrases, or
    clauses. With more than two items, ''and'' usually goes only before the last:
    ''We drank, talked and danced.'' Fixed order in pairs: ''bread and butter'' NOT
    ''butter and bread''.'
  - 'Swan PEU: ''but'' joins contrasting ideas. ''They were poor but happy.'' Most
    often joins clauses: ''We wanted to stay but we simply didn''t have time.'''
  - 'Swan Entry 226.3/227: After a negative verb, use ''or'' NOT ''and'': ''He doesn''t
    smoke or drink'' NOT ''He doesn''t smoke and drink.'' Key rule for negatives.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 15: CGEL (Ch.15)
    analyzes ''and'' as SEMANTICALLY EMPTY — it takes its meaning from context: temporal
    (''He sat down and ate'' = and then), resultative (''He fell and hurt himself''
    = and as a result), contrastive (''He is short and powerful'' = but/and yet).
    This explains why L1s with different ''and'' semantics may overtransfer. ''But''
    is intrinsically adversative and cannot coordinate more than two elements easily.'
title: Coordinating Conjunctions (and, but, or, so)
use:
- description: Add similar ideas or items.
  examples:
  - I like tea and coffee.
  - She sings and dances.
  key_point: And joins equal elements (both nouns, both verbs, both clauses).
  name: Addition (and)
- description: Show opposite or unexpected ideas.
  examples:
  - It's cold but sunny.
  - He is rich but unhappy.
  key_point: But shows surprise or opposition between ideas.
  name: Contrast (but)
- description: Offer alternatives or choices.
  examples:
  - Tea or coffee?
  - Now or later?
  key_point: Or means choose one (not both).
  name: Choice (or)
- description: Show consequence of an action.
  examples:
  - It rained, so we stayed home.
  - I was hungry, so I ate.
  key_point: So means the result of what came before.
  name: Result (so)
