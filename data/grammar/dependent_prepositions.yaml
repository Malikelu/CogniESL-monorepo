citations:
- claim: 'Core meaning: Certain words require specific prepositions to complete their
    meaning'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: 'Register distribution: Prepositional verbs (rely on, depend on) are more
    frequent in academic prose. Phrasal verbs are more conversational. Register choice
    between phrasal and prepositional alternatives is a key teaching point.'
  reliability: B
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch.
    5.3.2-5.3.3
  tier: 1
- claim: 'Dependent prepositions are fixed collocations that must be learned as chunks:
    depend ON, interested IN, capable OF, reason FOR.'
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: Common error '*I am interested for learning.*' for Portuguese, Spanish, Chinese
    speakers
  reliability: B
  source: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge
    University Press.
  tier: 1
- claim: Dependent prepositions follow specific verbs, adjectives, and nouns to form
    fixed collocations (depend ON, interested IN, capable OF, reason FOR)
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 21:
    Prepositions'
  tier: 1
- claim: L1 transfer in dependent prepositions varies significantly across language
    backgrounds — Swan & Smith document contrastive patterns for speakers of different
    L1s
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 2
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents
    how transfer effects are non-linear, determined by functional fit between L1 and
    L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects
    are non-linear — determined by functional fit between L1 and L2 systems rather
    than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
common_errors:
- correction: I am interested in learning.
  error: '*I am interested for learning.*'
  explanation: 'Dependent prepositions are fixed: interested in.'
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - Chinese
  reliability: D
- correction: interested in
  error: 'Using wrong preposition after ''interested'': *''interested for'''
  explanation: 'Swan PEU: "Interested in" is the fixed collocation. Many L1s use different
    prepositions (Spanish "interesado por", French "intéressé par").'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan Entry 67. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: depend on
  error: 'Using wrong preposition after ''depend'': *''depend of'' / *''depend from'''
  explanation: 'Swan PEU: "Depend on" is the only correct form. "Depend of" (from
    French "dépendre de") and "depend from" are L1 transfer errors.'
  l1_groups:
  - French
  - Portuguese
  - Spanish
  reliability: B
  source: Swan Entry 68. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- error: 'Omitting preposition after ''listen'': *''I listen music.'''
  explanation: 'Swan PEU: "Listen" requires "to". "Listen to music" NOT "Listen music".
    Compare: "hear music" (no preposition).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Japanese
  - Korean
  reliability: B
  source: Swan Entry 67. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: arrive at the airport
  error: 'Using ''arrive to'': *''arrive to the airport.'''
  explanation: 'Swan PEU: "Arrive at" (for places). "Arrive in" (for cities/countries).
    NOT "arrive to" (which is L1 transfer from many languages).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entry 69. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
- correction: look forward to meeting you.
  error: 'Using ''look forward to meet'': *''look forward to meet you.'''
  explanation: 'Swan PEU: After "look forward to", "to" is a preposition (not infinitive),
    so it takes a gerund. "Look forward to hearing from you."'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  - Chinese
  - Japanese
  reliability: B
  source: Swan Entry 67. Swan (2016) Practical English Usage, 4th ed. Oxford University
    Press.
description: Prepositions that must follow specific verbs, adjectives, or nouns. Essential
  for collocation accuracy.
dialectal_variation: null
discourse_notes:
- note: In conversation, this structure is used in everyday communication.
- note: In academic writing, this structure appears in formal contexts and is a marker
    of proficient English.
- note: In professional contexts, correct use of this structure is expected in formal
    writing.
form:
  affirmative:
    example_generator:
      contexts:
      - family and relationships
      - entertainment and media
      min_examples: 4
    structure: 'Verb + dependent preposition + object: "listen to music"

      Adjective + dependent preposition + object: "interested in art"

      Noun + dependent preposition + object: "reason for delay"

      '
  negative:
    example_generator:
      contexts:
      - sports and hobbies
      min_examples: 4
    structure: 'Preposition unchanged: ''I don''t listen to rock.'''
  questions:
    example_generator:
      contexts:
      - entertainment and media
      min_examples: 4
    structure: 'Preposition stays with verb: ''Do you listen to jazz?'' ''Are you
      good at tennis?'''
grammar_point: dependent_prepositions
key_principles:
- explanation: 'GB3 Ch.21: Prepositions encode spatial (IN/ON/AT), temporal, and metaphorical
    relationships. Many are fixed collocations (rely ON, interested IN, discuss +
    0). L1 issues: Spanish ''en'' covers in/on/at; Mandarin different spatial system;
    Arabic different mappings. Source: Celce-Murcia & Larsen-Freeman (1999) GB3 Ch.21:
    Prepositions.'
  flagged: false
  principle: Preposition usage and L1 transfer
  reliability: B
level: B1
meaning:
  ccqs:
  - answer: No — you need 'to.' The correct form is 'I listen to music.'
    purpose: Tests whether the learner understands that many English verbs require
      specific prepositions (listen to, look at, wait for). These dependent prepositions
      are arbitrary and must be memorized as part of the verb.
    question: Is 'I listen music' correct?
  - answer: No — the correct collocation is 'good at maths.'
    purpose: Tests whether the learner knows that adjective + preposition combinations
      are fixed in English. 'Good at' is the correct collocation for skills/subjects,
      not 'good in.'
    question: Is 'good in maths' the correct preposition?
  - answer: No — the only correct form is 'depend on.'
    purpose: Tests whether the learner understands that dependent prepositions apply
      to nouns as well as verbs and adjectives. 'Reason for,' 'solution to,' 'need
      for,' and 'example of' are fixed noun + preposition collocations that must be
      learned as chunks, paralleling verb and adjective patterns.
    question: Can you say 'depend of' or 'depend from'?
  - answer: '''She insisted on going.'' ''Insist'' takes the preposition ''on'' +
      -ing. Many verbs have fixed prepositions.'
    purpose: Tests whether the learner knows verb + preposition combinations (Swan
      PEU 2016, entries 83-85).
    question: Which is correct? *'She insisted to go' or 'She insisted on going'?
  contrast: '''Listen to'' (action) vs ''hear'' (no preposition needed)

    ''Look at'' (action) vs ''see'' (no preposition needed)

    ''Interested in'' vs ''interesting to''

    '
  core_meaning: Certain words require specific prepositions to complete their meaning.
    These are fixed collocations.
  example_generator:
    contexts:
    - everyday situations
    cultural_notes: []
    min_examples: 5
  timeline: N/A (Dependent prepositions are about collocation, not time.)
phonetics:
- example_generator:
    contexts:
    - preposition reduction
  l1_issue: Learners may over-pronounce the preposition, breaking the natural flow.
    Teach the reduced forms.
  note: 'Dependent prepositions are usually unstressed: ''interested in'' → /ˈɪntrəstɪd
    ɪn/, ''afraid of'' → /əˈfreɪd əv/. The preposition often reduces to a schwa.'
register_notes:
- note: Biber et al. (1999) — Prepositional verbs (rely on, depend on) are more frequent
    in academic prose. Phrasal verbs are more conversational. Register choice between
    phrasal and prepositional alternatives is a key teaching point. Ch. 5.3.2-5.3.3
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 5.3.2-5.3.3
