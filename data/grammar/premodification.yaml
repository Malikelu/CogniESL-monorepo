sub_rules:
- examples:
  - a lovely little old rectangular green French silver whittling knife
  - a beautiful large round wooden table
  - an expensive new Italian sports car
  - a charming small antique shop
  rule: 'Adjective order (OSASCOMP: Opinion, Size, Age, Shape, Colour, Origin, Material,
    Purpose)'
  type: grammatical
- examples:
  - a shoe shop (a shop that sells shoes)
  - a toothbrush (a brush for teeth)
  - a bus stop (a stop for buses)
  - a history teacher (a teacher of history)
  rule: Noun as modifier (always singular, even if the meaning is plural)
  type: grammatical
- examples:
  - a boring lecture (the lecture bores people)
  - a bored student (the student is bored by something)
  - a broken window (the window has been broken)
  - a breaking wave (the wave is actively breaking)
  rule: Participial adjectives as pre-modifiers (-ing for active/ongoing, -ed for
    passive/completed)
  type: grammatical
- examples:
  - a well-known author
  - a part-time job
  - a high-speed train
  - a long-term investment
  rule: Compound pre-modifiers (hyphenated elements before the noun)
  type: orthographic
- examples:
  - a surprisingly good result
  - an incredibly tall building
  - a reasonably priced restaurant
  - a highly respected professor
  rule: Intensifiers and adverbs modifying pre-modifiers
  type: grammatical
teaching:
  methodology: PPP (Presentation, Practice, Production) — present the adjective order
    rule explicitly, then practise with sorting and building exercises, then produce
    descriptions in context.
  recommended_activities:
  - adaptation_notes: Give learners jumbled adjective sequences (e.g., 'Italian /
      beautiful / small / old'). They must rearrange them into correct order before
      a noun.
    duration: 15
    name: Adjective Order Sorting
  - adaptation_notes: Learners choose a product from a picture and write a detailed
      product description using at least four pre-modifiers in correct order. Peer
      review for accuracy.
    duration: 20
    name: Product Description Builder
  - adaptation_notes: Provide sentences with errors in noun modification ('a shoes
      shop,' 'a historical teacher' when 'a history teacher' is meant). Learners identify
      and correct.
    duration: 10
    name: Noun Modifier Error Correction
  - adaptation_notes: Show a detailed image (a room, a market, a landscape). Learners
      write a paragraph describing it, focusing on accurate and natural pre-modification.
    duration: 15
    name: Describe the Picture
  tips:
  - Teach the OSASCOMP mnemonic for adjective order (Opinion, Size, Age, Shape, Colour,
    Origin, Material, Purpose).
  - 'Use the ''remove and test'' method: if you can put ''and'' between two adjectives,
    their order is probably correct.'
  - 'Highlight the noun-modifier rule early: always singular (''a shoe shop,'' not
    ''a shoes shop'').'
  - 'Contrast -ing and -ed participial adjectives explicitly: ''boring vs bored,''
    ''interested vs interesting.'''
  - Use real product descriptions from online shops as authentic material.
  - 'Warn against over-stacking: more than four pre-modifiers usually sounds unnatural.'
  - 'Swan PEU: Order of premodifiers follows: determiners →形容词 (opinion) →尺寸 →年龄 →形状
    →颜色 →来源 →材料 →名词修饰语 →名词. Example: ''those three beautiful large antique Italian
    marble dining tables.'''
  - 'Swan PEU: Compound premodifiers before nouns are usually hyphenated: ''the never-to-be-forgotten
    experience,'' ''an out-of-date passport.'' But don''t over-hyphen: ''a well known
    actor'' can also be written ''a well-known actor'' — both acceptable.'
title: Pre-modification in Noun Phrases (Adjectives, Nouns, Participles, Compounds)
use:
- context: Descriptive and narrative writing
  description: Pre-modification allows writers to pack vivid detail into compact noun
    phrases, creating efficient and evocative descriptions.
  examples:
  - She walked into a dimly lit, dusty old bookshop.
  - The tall, dark stranger sat in the corner.
  - They lived in a charming little cottage by the sea.
- context: Product descriptions and advertising
  description: Marketing language stacks pre-modifiers to create appealing, specific
    product images.
  examples:
  - Introducing our new premium organic fair-trade coffee blend.
  - A sleek, modern, energy-efficient home appliance.
  - Handcrafted Italian leather messenger bags.
- context: News headlines and journalism
  description: Headlines use pre-modification to convey maximum information in minimal
    space.
  examples:
  - High-ranking government official resigns amid scandal.
  - Record-breaking heatwave hits southern Europe.
  - Controversial new immigration policy announced.
- context: Academic and technical writing
  description: Pre-modification creates precise, compact terminology for complex concepts.
  examples:
  - a peer-reviewed longitudinal study
  - a multi-phase randomised controlled trial
  - a high-resolution satellite image
- context: Everyday conversation
  description: Speakers use pre-modification naturally to specify and describe.
  examples:
  - I need a new phone charger.
  - She's wearing a gorgeous red silk dress.
  - We stayed in a lovely little bed and breakfast.
