- note: 'Biber et al. (2021) — Premodification in noun phrases: written registers
    (news, academic prose) use more heavy premodification; conversation uses simpler
    NPs. NP complexity is a register correlate. Ch. 8.1'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins
    Publishing Company. Ch. 8.1
