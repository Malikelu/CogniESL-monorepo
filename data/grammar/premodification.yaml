common_errors:
- correction: a wooden coffee table
  error: '*a coffee wooden table*'
  explanation: 'Material comes before purpose in English noun compounds. ''Wooden''
    (material) comes before ''coffee'' (purpose). The order is: material + purpose
    + head noun.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan Entries 185, 187. Swan (2016) Practical English Usage, 4th ed. Oxford
    University Press.
description: The placement of modifiers before the head noun in English noun phrases,
  including adjectives, noun modifiers, participial adjectives, and compound elements.
dialectal_variation: []
discourse_notes:
- note: Premodification structures (adjectives, nouns, participles before the head
    noun) allow dense information packaging in noun phrases.
form:
  affirmative:
    example_generator:
      contexts:
      - product descriptions
      - descriptive writing
      - news headlines
      min_examples: 4
    structure: 'Determiner + (Adjective/Noun/Participle/Compound) + Head Noun. Multiple
      pre-modifiers follow a fixed order: Opinion > Size > Age > Shape > Colour >
      Origin > Material > Purpose. Noun modifiers are always singular: ''a shoe shop,''
      not ''a shoes shop.'''
  negative:
    example_generator:
      contexts:
      - expressing negative qualities
      - product descriptions
      - academic writing
      min_examples: 3
    structure: 'Negation in pre-modification typically involves negative prefixes
      on the modifier: ''an unbelievable story,'' ''an unnecessary expense,'' ''a
      non-alcoholic drink.'' The determiner is not negated within the pre-modification
      itself.'
  questions:
    example_generator:
      contexts:
      - grammar exercises
      - editing and proofreading
      min_examples: 3
    structure: 'Questions about pre-modification usually test adjective order or modifier
      choice: ''Which sounds more natural: a big blue bag or a blue big bag?'' ''Is
      it a history teacher or a historical teacher?'''
grammar_point: premodification
level: B2
meaning:
  ccqs:
  - answer: '''Wooden'' — material adjectives go closest to the noun.'
    purpose: Tests whether the learner understands that English allows extensive premodification
      (multiple adjectives and nouns before the head noun), which is more restricted
      in many L1s.
    question: In 'a large red wooden box,' which modifier is closest to the noun?
  - answer: 'No — English has a fixed adjective order: opinion-size-age-shape-colour-origin-material-purpose.'
    purpose: Tests whether the learner can identify and apply the correct form/meaning
      of this grammar point in context. The question 'Can we say 'a wooden red large
      box'?...' checks conceptual understanding, not just memorization.
    question: Can we say 'a wooden red large box'?
  - answer: They mean the same thing, but the pre-modifying participle 'sleeping'
      is more concise and literary.
    purpose: Tests whether the learner can identify and apply the correct form/meaning
      of this grammar point in context. The question 'What is the difference in meaning
      between 'a sleep...' checks conceptual understanding, not just memorization.
    question: Can you explain the difference between What is the difference in meaning
      between 'a sleeping baby' and 'a baby who is sleeping' by giving an example
      of when to use each?
  - answer: '''A beautiful small old house.'' Before nouns, use adjectives (beautiful),
      not adverbs (beautifully).'
    purpose: Tests whether the learner uses adjectives (not adverbs) before nouns
      for premodification (Swan PEU 2016, entry 193).
    question: Which is correct? *'a beautifully small old house' or 'a beautiful small
      old house'?
  contrast: 'English: ''a beautiful old Italian painting'' (pre-modification) vs French:
    ''un beau vieux tableau italien'' (mixed) vs Spanish: ''una pintura italiana vieja
    y bonita'' (post-modification preferred). English allows stacking multiple pre-modifiers
    in a fixed order.'
  core_meaning: Pre-modification is the placing of descriptive or classifying elements
    before the head noun to build complex noun phrases. English relies heavily on
    pre-modification (unlike many Romance languages, which prefer post-modification).
  example_generator:
    contexts:
    - descriptive writing
    - product descriptions
    - news headlines
    - academic writing
    - everyday conversation
    cultural_notes:
    - 'English advertising and marketing language heavily exploits pre-modification:
      ''luxury handmade Italian leather bags.'''
    - Over-stacking pre-modifiers can sound unnatural even in English — three to four
      is usually the practical limit.
    min_examples: 5
  timeline: Timeless — pre-modification is a structural feature, not tied to any tense.
phonetics:
- example_generator:
    contexts:
    - spoken descriptions
    - presentations
  l1_issue: Speakers of languages with different stress patterns (e.g., French, Polish)
    may stress the final syllable of the phrase rather than the head noun.
  note: 'In multi-modifier noun phrases, the head noun carries the primary stress,
    with secondary stress on the first modifier: ''a BEAU-tiful OLD Italian PAINT-ing.'''
- example_generator:
    contexts:
    - spoken English
    - reading aloud
  l1_issue: Learners may insert pauses between hyphenated elements, breaking the compound
    into separate words.
  note: 'Hyphenated compound pre-modifiers are spoken as a single unit with primary
    stress on the second element: ''a well-KNOWN author,'' ''a part-TIME job.'''
