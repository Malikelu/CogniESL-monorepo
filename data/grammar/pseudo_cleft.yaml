form:
  affirmative:
    example_generator:
      contexts:
      - standard pseudo-cleft
      - reversed pseudo-cleft
      min_examples: 4
    structure: 'Standard: What + subject + verb + be + focused element / Reversed: Focused element + be + what + subject +
      verb'
  negative:
    example_generator:
      contexts:
      - negative pseudo-cleft
      min_examples: 3
    structure: 'Same patterns: What I do not need is more stress. / More stress is what I do not need.'
  questions:
    example_generator:
      contexts:
      - question formation
    min_examples: 3
    structure: 'Can appear in questions: What do you need?'
grammar_point: pseudo_cleft
level: B2
meaning:
  ccqs:
  - answer: Yes, it is a pseudo-cleft.
    purpose: Tests whether the learner understands that pseudo-cleft sentences (What I need is...) are used to emphasize a
      specific element by placing it after 'what'.
    question: Does this sentence use a what-clause for emphasis?
  - answer: The element after 'is/was' (standard) or before the what-clause (reversed).
    purpose: Tests whether the learner can identify and apply the correct form/meaning of this grammar point in context. The
      question 'What element is being emphasized?...' checks conceptual understanding, not just memorization.
    question: What element is being emphasized?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with pseudo cleft and explain why they are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Both are pseudo-clefts with the same meaning, but the first is standard pseudo-cleft (focus at the end after 'is')
      and the second is reversed pseudo-cleft (focus at the beginning before 'is'). The reversed form is more dramatic or
      rhetorical.
    purpose: Tests whether the learner can distinguish between standard and reversed pseudo-cleft structures. In pseudo-cleft
      sentences, the focused element can appear after 'be' (standard) or before the what-clause (reversed), and learners need
      to know both patterns are valid with different rhetorical effects.
    question: Can you explain the difference between 'What I need is a vacation' and 'A vacation is what I need' by giving
      an example of when to use each?
  contrast: Simple = I need a good night's sleep. vs Pseudo-cleft = What I need is a good night's sleep.
  core_meaning: Pseudo-cleft (wh-cleft) sentences divide a single clause into two parts for emphasis using a what-clause.
    The focused element can go at the end (standard) or beginning (reversed).
  example_generator:
    contexts:
    - emphasis
    - contrast
    - formal writing
    - academic English
    cultural_notes:
    - Pseudo-clefts are common in spoken and written English
    - They are more natural than it-clefts in many contexts
    min_examples: 5
  timeline: Depends on the tense used.
phonetics:
- example_generator:
    contexts:
    - emphasis
  l1_issue: Many L1 speakers do not use pseudo-clefts, missing opportunities for natural emphasis
  note: Stress on the focused element
register_notes:
- note: 'Biber et al. (2021) — Wh-clefts (pseudo-clefts): primarily conversational and journalistic; rare in academic prose.
    Reversed wh-clefts are especially conversational. Ch. 11.6.4'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 11.6.4
sources:
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 30: Information Packaging-16.5'
  secondary: Huddleston & Pullum (2002) The Cambridge Grammar of the English Language. Cambridge University Press.
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - What I need is a good night's sleep.
  - What she did was incredible.
  - What matters most is your health.
  rule: Standard pseudo-cleft puts focus at the end
  type: grammatical
- examples:
  - A good night's sleep is what I need.
  - Incredible is what she did.
  - Your health is what matters most.
  rule: Reversed pseudo-cleft puts focus at the beginning
  type: grammatical
- examples:
  - What I said was true. (what I said = subject)
  - What happened is unclear. (what happened = subject)
  rule: The what-clause functions as the subject
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students rewrite simple sentences using pseudo-cleft for emphasis.
    duration: 15
    name: Emphasis Practice
  tips:
  - Use contrastive contexts
  - Practice both standard and reversed forms
  - Contrast with simple sentences
  - 'Swan PEU: Pseudo-cleft (wh-cleft) — ''What I need is a holiday.'' ''The thing that bothers me is the noise.'' The wh-clause
    sets up topic; remainder gives focused information. Common in spoken English for emphasis.'
  - 'Huddleston & Pullum (2002) CGEL. Cambridge University Press. Ch. 16: CGEL (Ch.16) analyzes ''What we need is water''
    as a FUSED RELATIVE construction (''what we need'' = ''the thing that we need'') in an equative clause with ''water''.
    The wh-clause serves as theme (given/presupposed), and the post-copular element is the rheme (new/focused). Pseudo-clefts
    are common in conversation for thematic packaging.'
title: Pseudo-Cleft Sentences (Wh-Clefts)
use:
- context: Emphasis
  description: Highlighting specific information
  examples:
  - What I appreciate most is your honesty.
  - What we need now is a solution.
- context: Contrast
  description: Correcting or clarifying information
  examples:
  - What I said was not a criticism — it was a suggestion.
  - What happened was an accident, not intentional.
