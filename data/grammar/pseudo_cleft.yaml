common_errors:
- correction: What I need is a vacation.
  error: '*I need a vacation.* (emphasizing ''vacation'')'
  explanation: Pseudo-cleft sentences (What + clause + be + focus) emphasize one element. 'What I need is a vacation' emphasizes
    'vacation' more than 'I need a vacation'.
  flagged: true
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: D
description: 'Using what-clauses for emphasis: What I need is a good night''s sleep. / A good night''s sleep is what I need.'
