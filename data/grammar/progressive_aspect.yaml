  tier: 2
common_errors:
- correction: I know the answer.
  error: '*I am knowing the answer.*'
  explanation: Stative verbs (know, believe, love, hate, own) are not normally used in progressive forms. 'I know' NOT 'I
    am knowing'. This is a very common error.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Chinese
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: State and dynamic verbs'
description: The progressive (or continuous) aspect presents an event as ongoing, temporary, or in progress at a particular
  time, contrasting with the simple aspect which presents events as complete or habitual.
dialectal_variation:
- note: 'Biber et al. (2021) Grammar of Spoken and Written English, Ch. 1.3.2/1.3.4: distribution rather than core grammatical
    structure. Most grammatical features show quantitative rather than qualitative variation between the two major national
    varieties.'
discourse_notes:
- note: In conversation, this structure is used in everyday communication.
- note: In academic writing, this structure appears in formal contexts and is a marker of proficient English.
- note: In professional contexts, correct use of this structure is expected in formal writing.
form:
  affirmative:
    example_generator:
      contexts:
      - daily routines
      - current activities
      - temporary living situations
      min_examples: 5
    structure: "Subject + appropriate form of BE + verb-ing\n\nPresent progressive: am/is/are + -ing\n  'She is reading a\
      \ book.' / 'They are working.'\n\nPast progressive: was/were + -ing\n  'She was reading when the phone rang.' / 'They\
      \ were working all morning.'\n\nFuture progressive: will be + -ing\n  'I will be working at 8 p.m. tonight.'\n\nPresent\
      \ perfect progressive: have/has been + -ing\n  'I have been waiting for an hour.'\n\nPast perfect progressive: had been\
      \ + -ing\n  'She had been studying for three hours before the exam.'\n\nFuture perfect progressive: will have been +\
      \ -ing\n  'By December, I will have been working here for five years.'\n\nSpelling rules:\n  - Drop silent e: make →\
      \ making, write → writing\n  - Double final consonant (short vowel): run → running, sit → sitting\n  - No doubling (long\
      \ vowel or two consonants): read → reading, watch → watching\n  - ie → y + ing: die → dying, lie → lying"
  negative:
    example_generator:
      contexts:
      - explaining absence or unavailability
      - denying accusations
      - describing what was not happening
      min_examples: 4
    structure: 'Subject + BE + not + verb-ing


      Present: ''She is not (isn''t) working today.'' / ''They aren''t coming.''

      Past: ''He wasn''t listening.'' / ''We weren''t sleeping.''

      Future: ''I won''t be needing that.''

      Present perfect: ''I haven''t been feeling well.''

      Past perfect: ''She hadn''t been sleeping well.''


      Note: Contracted forms are standard in speech and informal writing.'
  questions:
    example_generator:
      contexts:
      - checking on someone's current activity
      - asking about future plans
      - enquiring about duration
      min_examples: 4
    structure: 'BE + subject + verb-ing?


      Present: ''Are you working?'' / ''Is she coming?''

      Past: ''Were you sleeping?'' / ''What were they doing?''

      Future: ''Will you be staying long?''

      Present perfect: ''Have you been waiting long?''

      Past perfect: ''Had she been running?''


      Wh-questions: ''What are you doing?'' / ''Where were they going?'' / ''How long have you been learning English?'''
grammar_point: progressive_aspect
level: B1
meaning:
  ccqs:
  - answer: The reading started before the call and was in progress when the call happened. The progressive sets the background;
      the simple past is the interrupting event.
    purpose: Tests whether the learner understands the narrative function of the past progressive — that it provides background
      context for an interrupting simple past event, and establishes which action was already in progress.
    question: If I say 'I was reading when she called,' which happened first?
  - answer: No — 'know' is a stative verb and is not normally used in the progressive. We say 'I know the answer.'
    purpose: Tests whether the learner understands the stative verb restriction on progressive aspect — that verbs describing
      states (know, believe, own, love) are grammatically incompatible with -ing forms because they do not describe dynamic,
      ongoing actions.
    question: Can we say 'I am knowing the answer'?
  - answer: '''I live in London'' suggests a permanent or long-term situation. ''I am living in London'' suggests a temporary
      arrangement — perhaps you plan to move.'
    purpose: Tests whether the learner understands how the progressive aspect conveys temporary meaning even with verbs that
      can be used in both simple and progressive forms (''live,'' ''work,'' ''study''), and how this contrasts with the permanent/habitual
      meaning of the simple aspect.
    question: Can you explain the difference between 'I live in London' and 'I am living in London' by giving an example of
      when to use each?
  - answer: '''I like this song.'' ''Like'' is a stative verb and is not normally used in progressive forms.'
    purpose: Tests whether the learner distinguishes stative verbs from dynamic verbs for progressive aspect (Swan PEU 2016,
      entry 32.4).
    question: Which is correct? *'I am liking this song' or 'I like this song'?
  contrast: 'Progressive (be + -ing) = event viewed from within, ongoing, temporary.


    Simple aspect = event viewed as a whole, complete, habitual, or permanent.


    ''I was reading'' (progressive) = in the middle of reading, focus on the process.

    ''I read'' (simple past) = completed action, focus on the fact.


    Stative verbs (know, believe, own, love) typically resist the progressive because they describe states, not dynamic events.'
  core_meaning: The progressive aspect views an action or state from within — as ongoing, in progress, or temporary at a reference
    point in time. It focuses on the internal structure of the event rather than its completion.
  timeline: 'The progressive always relates to a specific reference time:


    Present progressive: happening now, around now, or arranged for the future.

    Past progressive: in progress at a specific past moment, or background to another event.

    Future progressive: in progress at a specific future moment.

    Perfect progressive: duration of an activity leading up to a reference point.'
phonetics:
- example_generator:
  - She's reading /ʃiːz ˈriːdɪŋ/
  - They were playing /ðeɪ wə ˈpleɪɪŋ/
  - I'm working /aɪm ˈwɜːkɪŋ/
  l1_issue: Many languages (e.g., Spanish, French, German, Mandarin) do not have a progressive aspect, so learners may overuse
    the simple forms or avoid the progressive entirely. Arabic and Italian speakers may overgeneralise the progressive to
    stative verbs.
  note: 'The auxiliary ''be'' in progressive forms is typically reduced in connected speech: ''I''m'', ''she''s'', ''they''re'',
    ''was'' → /wəz/, ''were'' → /wə/. The -ing ending is pronounced /ɪŋ/ (not /ɪn/ in standard speech).'
register_notes:
- note: 'Biber et al. (2021) GSWE Ch. 6.3: Progressive aspect is most common in conversation and fiction, less common in news
    and academic prose. The progressive has expanded across all registers over the past century.'
  reliability: D
  source: Team observation
  tier: 4
sources:
  corpus_evidence: 'Biber et al. (1999) LSWE Corpus — Progressive aspect is most common in conversation, considerably less
    common in news and academic prose. Progressive with modals is generally rare, except: (1) obligation/necessity modals
    in conversation (e.g., "supposed to be coming in"), (2) volition/prediction modals in news (e.g., "will be going down").
    Stative verbs in progressive are rare but occur in conversation for special pragmatic effect (e.g., "I am loving it").'
  pedagogical: Parrott (2000) Grammar for English Language Teachers, 2nd ed. Cambridge University Press.
  primary: 'Biber et al. (1999) Grammar of Spoken and Written English. Longman. Ch. 6.3: Progressive aspect (register distribution,
    stative/dynamic combinations)'
  secondary: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 6: Present and Past Progressive-6.8'
  teaching_practice: Folse (2009) Keys to Teaching Grammar to English Language Learners. University of Michigan Press.
  validation: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
sub_rules:
- examples:
  - 'I know the answer. (NOT: I am knowing the answer.)'
  - 'She owns a car. (NOT: She is owning a car.)'
  - 'I believe you. (NOT: I am believing you.)'
  - 'This belongs to me. (NOT: This is belonging to me.)'
  rule: Stative verbs are not normally used in the progressive
  type: grammatical
- examples:
  - I think it's great. (opinion — stative) / I'm thinking about the problem. (mental process — dynamic)
  - She has a car. (possession — stative) / She's having lunch. (experiencing — dynamic)
  - I see what you mean. (understand — stative) / I'm seeing the doctor at 3. (meeting — dynamic)
  - The soup tastes good. (quality — stative) / She's tasting the soup. (action — dynamic)
  rule: Some verbs have both stative and dynamic meanings; the progressive is used for the dynamic meaning
  type: grammatical
- examples:
  - He is always losing his keys! (annoyance)
  - She is constantly interrupting me. (irritation)
  - They are forever arriving late. (exasperation)
  rule: The progressive with 'always' expresses annoyance or emphasis on frequency
  type: grammatical
- examples:
  - I am meeting Sarah tomorrow. (arranged)
  - We are flying to Paris next week. (planned)
  - She is starting a new job on Monday. (fixed plan)
  rule: The present progressive can express future arrangements (planned events)
  type: grammatical
- examples:
  - The sun was shining and the birds were singing. (scene-setting)
  - I was walking home when I saw an accident. (interrupted action)
  - While she was cooking, he was setting the table. (simultaneous actions)
  rule: The past progressive describes background scenes and interrupted actions
  type: grammatical
- examples:
  - I was wondering if you could help me. (more polite than 'I wonder')
  - I was hoping we could discuss this. (softer than 'I hope')
  - I'm just saying, it might not work. (hedging)
  rule: The progressive can soften requests and statements, making them less direct
  type: pragmatic
teaching:
  methodology: PPP (Presentation-Practice-Production) — demonstrate the form with clear timelines, then controlled practice,
    then free production.
  recommended_activities:
  - adaptation_notes: 'One student mimes an action; others guess using present progressive: ''You are swimming!'' Great for
      kinesthetic learners and lower levels.'
    duration: 15
    name: Mime and guess
  - adaptation_notes: Students write a short narrative opening using past progressive for the scene, then simple past for
      the main event. Works well at B1+.
    duration: 20
    name: Scene-setting story
  - adaptation_notes: Give students a list of verbs and have them sort into stative (no progressive) and dynamic (progressive
      OK). Discuss verbs that can be both.
    duration: 15
    name: Stative vs dynamic sorting
  - adaptation_notes: Students complain about a flatmate/partner using 'He is always...' and 'She is constantly...' Fun and
      memorable for B1-B2.
    duration: 15
    name: Annoyance role-play
  tips:
  - 'CGEL Ch. 3: The progressive has non-aspectual uses including future arrangement (We are leaving tomorrow), politeness
    (I was hoping you could help), and attitude (You are always complaining). These extend beyond the core meaning of ongoing
    activity.'
  - Use timelines to show the difference between simple (dot on timeline) and progressive (line/arrow on timeline).
  - 'Act out actions: ''What am I doing?'' to make the meaning of ''in progress'' physical and memorable.'
  - 'Contrast pairs: ''I live in London'' (permanent) vs ''I am living in London'' (temporary).'
  - Teach stative verbs early — give students a list of common ones that don't take -ing.
  - 'Use picture stories for past progressive: ''What was happening when...?'''
  - 'Role-play phone calls: ''Can I speak to John?'' ''He''s having a shower.'' (present progressive for current activity)'
  - 'Swan PEU: Progressive aspect foregrounds ongoing action. Contrast: ''I read a book last night'' (completed) vs ''I was
    reading at 8pm'' (ongoing). Stative verbs resist progressive: ''I know'' not ''I am knowing.'''
  - 'Swan PEU: ''Always'' with progressive for annoying habits: ''He''s always interrupting me.'' The progressive adds the
    emotional charge; without it, ''He always interrupts me'' is neutral.'
  - 'GB3 Ch. 7: Progressive core meaning = imperfective (incomplete, limited duration). Makes perfective verbs imperfective:
    ''He builds a house'' ✗ vs ''He is building a house'' ✓. Progressive can also highlight remarkable situations (historical/subjective
    use): ''He''s always delivering in a clutch'' (86% aspectual, 14% subjective in modern usage). Source: Celce-Murcia &
    Larsen-Freeman (2015) GB3 Ch. 7 §7.2 (citing Kranich 2013).'
  - 'GB3 Ch. 7: Progressive with stative verbs — 9 specific effects when stative verbs take progressive: (a) intensify, (b)
    current behavior, (c) change over time, (d) limited duration, (e) conscious involvement, (f) vividness, (g) personal involvement,
    (h) mitigate criticism, (i) avoid imposition. ''I was just wanting to invite you...'' (avoid imposition). Source: Celce-Murcia
    & Larsen-Freeman (2015) GB3 Ch. 7 §7.3 (citing Gavis 1997).'
title: Progressive Aspect (Focus on Internal Structure of Events)
use:
- context: Describing current activities and temporary situations
  description: The most basic use — to say what is happening right now or around the present time.
  examples:
  - I am reading a really good book at the moment.
  - She is studying for her exams this week.
  - They are staying with friends while their house is being renovated.
- context: Background scenes in narratives
  description: The past progressive sets the scene in stories, providing the backdrop against which main events (simple past)
    occur.
  examples:
  - It was raining and the wind was howling. Suddenly, there was a knock at the door.
  - The children were playing in the garden when the dog ran away.
  - I was sitting in the cafe, minding my own business, when she walked in.
- context: Future arrangements
  description: The present progressive expresses definite plans or arrangements, often with a time reference.
  examples:
  - We are having dinner with my parents on Sunday.
  - I am seeing the dentist at 10 a.m. tomorrow.
  - They are moving to Manchester next month.
- context: Expressing annoyance with 'always' or 'constantly'
  description: The progressive with frequency adverbs expresses irritation about repeated behaviour.
  examples:
  - He is always leaving his clothes on the floor!
  - She is constantly checking her phone during meetings.
  - My neighbour is forever playing music too loud.
- context: Polite and tentative language
  description: The progressive softens requests, opinions, and statements, making them sound less direct and more diplomatic.
  examples:
  - I was wondering if you might be available for a chat.
  - I'm just thinking out loud here.
  - We were hoping you could join us.
- context: Duration with perfect progressive
  description: The present perfect progressive emphasises the duration of an activity that started in the past and continues
    to the present, or has just stopped.
  examples:
  - I have been waiting for over an hour.
  - She has been working here since 2015.
  - They have been living with us while their flat is being repaired.
