citations:
- claim: Concession clauses (although, though, even though, while, whereas) express
    contrast between two propositions where one might be expected to negate the other.
  flagged: false
  reliability: B
  source: 'Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 27:
    Conditionals and Concession'
  tier: 1
- claim: Swan (2016) documents usage differences between although/though/even though
    and the rule against combining concession conjunctions with but.
  source: Swan, M. (2016). Practical English Usage, 4th ed. Entry 59
  tier: 2
common_errors:
- correction: Although it was raining, we went out.
  error: 'Using but and although together: *Although it was raining, but we went out.'
  explanation: Use either although or but, not both. They serve the same contrastive
    function.
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - Italian
  reliability: B
  source: Swan (2016) Entry 59
- correction: Despite the rain, we went out.
  error: 'Using despite with a clause: *Despite it was raining, we went out.'
  explanation: Despite is a preposition and takes a noun/gerund, not a clause. Use
    despite + noun or although + clause.
  l1_groups:
  - Spanish
  - French
  - Italian
  reliability: B
  source: Parrott (2000) Ch. 16
description: Concession clauses express contrast between an expected outcome and what
  actually happens. Although, though, even though, while, and whereas introduce a
  clause that concedes a point but does not prevent the main action.
grammar_point: concession_clauses
level: B2
meaning:
  ccqs:
  - answer: Although means despite the fact that. It introduces unexpected contrast.
    purpose: Tests understanding that although signals concession, not cause.
    question: In "Although it rained, we went out," does although mean because or
      despite?
  - answer: No. Although already carries the contrast meaning. Adding but creates
      redundancy.
    purpose: Tests understanding that although and but are not combinable.
    question: Can you use although and but in the same sentence?
  core_meaning: Concession clauses acknowledge a fact that might suggest the opposite
    outcome, then state what actually happened. The concessive relationship is one
    of unexpected contrast.
form:
  affirmative:
    structure: Although/Though/Even though + clause, + main clause. Despite/In spite
      of + noun/gerund, + main clause. While/Whereas + clause, + main clause (for
      direct contrast).
  negative:
    structure: 'Although/Though + negative clause, + main clause: Although he did
      not study, he passed.'
register_notes:
- note: 'Biber et al. (2021) GSWE Ch. 10: Concessive clauses are more common in academic
    prose and news than in conversation. Though is the most common concessive in conversation.'
  reliability: D
  source: Team observation
  tier: 4
teaching:
  methodology: PPP
  tips:
  - 'Swan (2016) PEU 4th ed. Entries 545-550: Although, though, even though introduce
    concession. Though is more common in informal English and can occur at end of
    clause. Even though is more emphatic than although. Do not use but after although
    in the same clause.'
