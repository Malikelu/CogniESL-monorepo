common_errors:
- correction: If I had studied, I would pass now.
  error: 'Mixing conditional types incorrectly: *''If I would have studied, I would pass.'''
  explanation: 'Mixed conditional Type 1: if + past perfect (past condition), would + base (present result). Don''t use ''would
    have'' in the if-clause.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: Had I known, I would have helped.
  error: 'Using ''if'' with inverted conditionals: *''If had I known, I would have helped.'''
  explanation: 'Inverted conditionals drop ''if'' and invert subject and auxiliary: ''Had I known'' (not ''If had I known'').'
  l1_groups:
  - Portuguese
  - Spanish
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If you study, you will pass.
  error: 'Using ''unless'' with negative verb: *''Unless you do not study, you will pass.'''
  explanation: 'Swan PEU: ''Unless'' = ''if not''. ''Unless you do not study'' = ''If you study'' (double negative), which
    reverses the intended meaning.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
- correction: If I were rich, I would travel.
  error: 'Using ''was'' instead of ''were'' in formal conditionals: *''If I was rich, I would travel.'' (formal context)'
  explanation: 'Swan PEU: In formal English, ''were'' is used for all persons in hypothetical conditionals. ''If I were'',
    ''If he were''. ''Was'' is informal.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Mixed conditionals, implied conditionals, inverted conditionals, and other complex conditional structures beyond
  the basic three types.
dialectal_variation:
- note: Inverted conditionals are more common in BrE formal writing than AmE.
- note: 'In some dialects, ''should'' is used for first person inverted conditionals: ''Should I be late...'' (formal BrE)'
discourse_notes:
- note: Advanced conditionals create sophisticated narratives that connect different time frames.
- note: Inverted conditionals add formality and emphasis to written arguments.
- note: 'Implied conditionals allow writers to set up hypotheticals concisely: ''Without X, Y would not have happened.'''
- note: In academic writing, advanced conditionals are used for discussing alternative research outcomes and theoretical implications.
form:
  affirmative:
    example_generator:
      contexts:
      - regret and reflection
      - formal writing
      - hypothetical reasoning
      min_examples: 4
    structure: 'Mixed: If + past perfect, would + base verb. Inverted: Had + subject + past participle, would + have + past
      participle.'
  negative:
    example_generator:
      contexts:
      - negative hypotheticals
      - formal alternatives to if
      min_examples: 3
    structure: 'If + had not + past participle, would not + have + past participle. Implied: But for + noun, would + base
      verb.'
  questions:
    example_generator:
      contexts:
      - formal questions
      - speculative questions
      min_examples: 3
    structure: Had + subject + past participle, would + subject + have + past participle? / What if + subject + had + past
      participle?
grammar_point: conditionals_advanced
level: C1
meaning:
  ccqs:
  - answer: Yes, it is a mixed conditional.
    purpose: Tests whether the learner can identify a mixed conditional (combining past and present time frames). This is
      important because recognizing mixed conditionals is a hallmark of advanced English proficiency.
    question: Does this conditional mix past and present time frames?
  - answer: Yes, this is an inverted conditional (formal register).
    purpose: Tests whether the learner can identify an inverted conditional (formal register where "if" is dropped and subject-auxiliary
      are inverted). This is important because inversion is a key feature of formal written English.
    question: Is the 'if' clause replaced by inversion?
  - answer: The alternative form changes the meaning or creates an ungrammatical sentence.
    purpose: Tests whether the learner can identify common errors associated with conditionals advanced and explain why they
      are incorrect.
    question: What is the difference in meaning between these two forms?
  - answer: Learners often make errors with this structure that change the intended meaning.
    purpose: Tests whether the learner can identify and correct a common error associated with conditionals advanced. Recognizing
      typical mistakes helps learners self-edit and produce more accurate English.
    question: Can you identify and correct the error in this sentence related to this grammar point?
  contrast: Standard 3rd conditional = If I had studied, I would have passed. Mixed = If I had studied, I would be a doctor
    now. Inverted = Had I studied, I would have passed.
  core_meaning: Advanced conditional structures allow speakers to express nuanced hypothetical situations that mix time frames,
    imply conditions without using 'if', or use formal inverted structures for stylistic effect.
  example_generator:
    contexts:
    - reflecting on past choices
    - formal arguments
    - hypothetical discussions
    - academic analysis
    cultural_notes:
    - Inverted conditionals are common in formal writing and literary English but rare in casual speech
    - Mixed conditionals are a hallmark of advanced proficiency
    min_examples: 5
  timeline: Varies — mixed conditionals combine different time frames; inverted conditionals follow the same time rules as
    standard conditionals.
phonetics:
- example_generator:
    contexts:
    - formal speeches
    - academic presentations
  l1_issue: Inverted word order is challenging for speakers from languages that do not use subject-auxiliary inversion in
    conditionals.
  note: Inverted conditionals are typically spoken with a formal, measured pace and clear pauses around the conditional clause.
- example_generator:
    contexts:
    - spontaneous speech
    - oral exams
  l1_issue: Learners often default to a single conditional pattern rather than mixing time frames.
  note: Mixed conditionals require careful attention to tense shifts in both clauses, which can be difficult to produce fluently.
register_notes:
- note: Advanced conditionals (mixed, inverted, implied) are primarily used in formal writing and academic prose.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Inverted conditionals are common in formal speeches and legal language: ''Had the defendant been present...'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Implied conditionals are used for sophisticated argumentation: ''Without this intervention, the outcome would have
    been different.'''
  reliability: D
  source: Team observation
  tier: 4
- note: In conversation, advanced conditionals are rare. Most speakers use standard first, second, and third conditionals.
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Advanced conditional structures: formal inversion conditionals (Had I known...) are rare in
    conversation, more common in literary/formal writing. Mixed conditionals appear in planned discourse. Ch. 10.2.8.12'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.8.12
