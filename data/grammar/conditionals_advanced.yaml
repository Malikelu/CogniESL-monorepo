sub_rules:
- examples:
  - If I had taken that job, I would be living in London now.
  - If she had accepted the offer, she would be the manager today.
  - If we had left earlier, we would not be stuck in traffic.
  rule: 'Mixed conditional (past condition, present result): If + past perfect, would + base verb'
  type: grammatical
- examples:
  - If I were braver, I would have confronted him at the time.
  - If she were more organised, she would have finished the project on time.
  - If he were taller, he would have made the basketball team.
  rule: 'Mixed conditional (present condition, past result): If + past simple, would have + past participle'
  type: grammatical
- examples:
  - Had I known, I would have helped. (If I had known...)
  - Were she here, she would agree. (If she were here...)
  - Should you need anything, please call. (If you should need...)
  rule: 'Inverted conditional (formal, replacing ''if''): Had/Were/Should + subject + complement'
  type: grammatical
- examples:
  - But for your help, I would have failed. (If it were not for your help...)
  - Without the rain, the match would have gone ahead. (If it had not rained...)
  - Otherwise, we would have been on time. (If the train had not been delayed...)
  - Supposing you won the lottery, what would you do?
  rule: 'Implied conditionals without ''if'': But for, without, otherwise, supposing'
  type: grammatical
- examples:
  - Unless you hurry, we will miss the train.
  - Unless she had reminded me, I would have forgotten.
  rule: 'Conditional with ''unless'' meaning ''if...not'': Unless + present/past, will/would + base verb'
  type: grammatical
teaching:
  methodology: Guided discovery
  recommended_activities:
  - adaptation_notes: Students match past conditions to present results using mixed conditionals, drawing timelines to support
      understanding.
    duration: 15
    name: Timeline Matching
  - adaptation_notes: Students rewrite standard conditional sentences using inversion and implied conditionals for a formal
      register.
    duration: 15
    name: Formal Rewrite
  - adaptation_notes: Students discuss hypothetical life choices using mixed conditionals in pairs or small groups.
    duration: 20
    name: What If Discussion
  tips:
  - 'Use timelines to visualise mixed conditionals: draw a past event arrow and a present result arrow.'
  - Introduce inversion as a formal alternative to 'if' — start with 'Had I...' and 'Were she...' as the most common patterns.
  - Practice transforming standard conditionals into inverted and implied forms.
  - Use real-life scenarios (career choices, travel decisions) to make mixed conditionals meaningful.
  - 'Swan PEU: ''Unless'' = ''if not''. ''Unless you hurry, you''ll miss the train'' = ''If you do not hurry, you''ll miss
    the train''. Do not use ''unless'' with a negative verb.'
  - 'Swan PEU: ''Were'' vs ''was'' in conditionals — ''If I were you'' (formal/correct) vs ''If I was you'' (informal). Both
    are used; ''were'' is more traditional.'
  - 'Swan PEU: Mixed conditionals — past condition + present result. ''If I had studied medicine, I would be a doctor now.''
    (past → present).'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. National Geographic Learning.'
  tip: 'CONDITIONAL TAXONOMY (BEYOND 3 TYPES): GB3 identifies factual (generic + implicit inference), future (1st conditional
    + weakened forms with ''happen to''/''should''), counterfactual/hypothetical (past and present unreal), sarcastic (''If
    you had any brains, you''d be dangerous''), and contrastive (''I''ll let you off, but if you do it again...''). The traditional
    ''zero/first/second/third'' 4-type system misses several important conditional types. Source: Ch.27 p.420-426.'
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. National Geographic Learning.'
  tip: 'WERE-SUBJUNCTIVE AND INVERSION: Subjunctive ''were'' occurs in counterfactual if-clauses: ''If I WERE rich, I would
    travel.'' This is NOT past tense. Subjunctive were is restricted to if-clauses (*''I were happy'' is ungrammatical in
    main clauses). Inversion: Had/Should/Were can front with subject deletion: ''Had we known...'', ''Were he here...'', ''Should
    you need help...'' Source: Ch.27 p.420-426.'
title: Advanced Conditionals
use:
- context: Expressing regret and reflection
  description: Mixed conditionals allow speakers to connect past decisions with present consequences.
  examples:
  - If I had studied medicine, I would be a doctor now.
  - If I had not moved to this city, I would never have met you.
- context: Formal and academic argumentation
  description: Inverted conditionals add formality and sophistication to written arguments.
  examples:
  - Had the government acted sooner, thousands of lives could have been saved.
  - Were this theory correct, we would expect to see different results.
- context: Hypothetical scenarios in discussion
  description: Implied conditionals allow speakers to set up hypotheticals concisely.
  examples:
  - Without the internet, modern business would be unrecognisable.
  - But for that one mistake, the whole project would have succeeded.
- context: Polite and tentative suggestions
  description: Should you... and were you to... are used for polite, formal suggestions.
  examples:
  - Should you wish to discuss this further, my door is always open.
  - Were you to reconsider, we would be happy to make a new offer.
