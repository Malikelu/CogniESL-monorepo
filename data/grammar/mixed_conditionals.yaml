sub_rules:
- examples:
  - If I had studied harder, I would have a better job now.
  - If she had accepted that offer, she would be living in London now.
  - If they had saved money, they would own a house now.
  rule: 'Type 1: Past condition → present result (If + past perfect, would + base verb)'
  type: grammatical
- examples:
  - If he were taller, he would have become a pilot.
  - If she weren't so shy, she would have made more friends.
  - If I were braver, I would have spoken up at the meeting.
  rule: 'Type 2: Present condition → past result (If + past simple, would have + past participle)'
  type: grammatical
- examples:
  - If I had chosen a different career, I would be happier now.
  - If she had moved to another city, she would have more opportunities now.
  - If they had invested earlier, they would be wealthy now.
  rule: Mixed conditional for regret about how past choices affect the present
  type: semantic
- examples:
  - If I were more confident, I would have applied for that job.
  - If she were more patient, she would have passed the driving test.
  - If he were more organized, he would have finished the project on time.
  rule: Mixed conditional for reflecting on how present traits would have changed the past
  type: semantic
teaching:
  methodology: Guided discovery with life reflection scenarios
  recommended_activities:
  - adaptation_notes: 'Students write 5 mixed conditional sentences about their own lives: ''If I had studied harder, I would
      have a better job now.'' Then share with a partner.'
    duration: 15
    name: Life Reflection
  - adaptation_notes: 'Teacher says a mixed conditional sentence. Students identify the time reference of each clause: ''If
      I had studied (past), I would have a better job now (present).'''
    duration: 10
    name: Past → Present or Present → Past?
  - adaptation_notes: 'Students discuss how their lives would be different now if they had made different choices: ''If I
      had learned English as a child, I would speak fluently now.'''
    duration: 15
    name: What Would Be Different?
  - adaptation_notes: 'Student A says the if-clause: ''If I had studied medicine...'' Student B completes: ''...I would be
      a doctor now.'' Then Student B starts a new if-clause.'
    duration: 10
    name: Mixed Conditional Chain
  tips:
  - Master pure second and third conditionals before introducing mixed. Students need a solid foundation.
  - 'Use clear time markers: ''now'' for present result, ''yesterday/last year'' for past result. This helps students see
    the time difference.'
  - 'Use life reflection scenarios: ''If you had chosen a different university, where would you live now?'' Makes the grammar
    personal and meaningful.'
  - 'Draw two timelines side by side: label each clause with its time reference. Visual support is essential.'
  - Teach Type 1 first (past → present) as it is more common and intuitive. Then introduce Type 2 (present → past).
  - 'Swan PEU: Mixed conditionals combine time frames. Type 1: past condition → present result (If + past perfect, would +
    base). Type 2: present condition → past result (If + past simple, would have + past participle).'
teaching_tips:
- source: 'Celce-Murcia & Larsen-Freeman (1999) The Grammar Book: An ESL/EFL Teacher''s Course, 2nd ed. Heinle & Heinle.'
  tip: 'MIXED CONDITIONALS: Past condition + present result: ''If I HAD studied harder [past], I WOULD BE in medical school
    now [present].'' NOT *''If I would have studied...'' The past perfect in the if-clause marks counterfactuality in the
    past; ''would be'' marks present unreal result. Source: Ch.27 p.420-424.'
title: Mixed Conditionals
use:
- context: Past choices affecting the present
  description: How a past decision or event affects the current situation
  examples:
  - If I had taken that job, I would be living in London now.
  - If she had learned English as a child, she wouldn't need a translator now.
  - If they had saved money, they wouldn't be in debt now.
  - If I had studied medicine, I would be a doctor now.
- context: Present traits affecting the past
  description: How a current characteristic or situation would have changed a past outcome
  examples:
  - If he were taller, he would have become a pilot.
  - If she weren't so stubborn, she would have apologized yesterday.
  - If I were more confident, I would have spoken up at the meeting.
  - If she were more careful, she wouldn't have had that accident.
- context: Regret and reflection
  description: Expressing how life would be different if the past had been different
  examples:
  - If I had made different choices, I would be in a different place now.
  - If she had been more careful with money, she would own a house now.
  - If they had listened to my advice, they wouldn't be in this situation now.
