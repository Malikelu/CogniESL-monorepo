common_errors:
- correction: If I had studied harder, I would have passed.
  error: 'Using wrong tense combination: *''If I studied harder, I would have passed.'''
  explanation: 'Mixed conditionals require specific tense combinations. Type 1 (past→present): if + past perfect, would +
    base. Type 2 (present→past): if + past simple, would have + past participle.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I had studied, I would pass now.
  error: 'Using ''would have'' in both clauses: *''If I would have studied, I would have passed.'''
  explanation: In Type 1 mixed conditional, only the if-clause uses past perfect. The main clause uses 'would + base verb'
    for the present result.
  l1_groups:
  - Portuguese
  - Spanish
  - German
  reliability: B
  source: 'Swan (2016) Practical English Usage, 4th ed.: Conditionals'
- correction: If I had studied, I would be a doctor now.
  error: 'Using ''would have'' in the if-clause of mixed conditional: *''If I would have studied, I would be a doctor now.'''
  explanation: 'Swan PEU: In mixed conditionals (past → present), the if-clause uses past perfect (NOT ''would have''). ''Would
    have'' in the if-clause is non-standard.'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  - German
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed.
description: Combines different conditional structures when the time in the if-clause is different from the time in the main
  clause. Past condition with present result, or present condition with past result.
dialectal_variation:
- note: In informal speech, 'would have' is often contracted to 'would've' /wʊdəv/.
discourse_notes:
- note: 'Mixed conditionals create complex narratives that connect past events to present consequences: ''If I had taken that
    job, I would be living in London now.'''
- note: Mixed conditionals are used for expressing regret about past decisions and their present consequences.
- note: In academic writing, mixed conditionals are used for discussing the present implications of past research decisions.
form:
  affirmative:
    example_generator:
    - If I had studied harder, I would have a better job now. (past → present)
    - If she had learned English as a child, she wouldn't need a translator now. (past → present)
    - If he were taller, he would have become a pilot. (present → past)
    - If she weren't so stubborn, she would have apologized yesterday. (present → past)
    min_examples: 4
    structure: 'Type 1 — Past condition → present result: If + past perfect, would + base verb / Type 2 — Present condition
      → past result: If + past simple, would have + past participle'
  negative:
    example_generator:
    - If I hadn't taken that job, I wouldn't be living in London now.
    - If she weren't so shy, she would have made more friends at the party.
    - If he had saved money, he wouldn't be in debt now.
    min_examples: 4
    structure: 'If clause negative: If + subject + hadn''t/weren''t... / Main clause negative: subject + wouldn''t + base
      verb / wouldn''t have + past participle'
  questions:
    example_generator:
    - Would you have a better job now if you had studied harder?
    - Would she have apologized yesterday if she weren't so stubborn?
    - Would he be living in London now if he had taken that job?
    min_examples: 4
    structure: Would + subject + base verb / would have + past participle + if + past perfect / past simple?
grammar_point: mixed_conditionals
level: B2
meaning:
  ccqs:
  - answer: No — that is what makes it mixed. The if-clause and main clause refer to different times.
    purpose: Tests whether the learner understands that mixed conditionals combine different time frames in the if-clause
      and main clause. This is important because it allows speakers to express complex cause-effect relationships across time.
    question: Do both clauses refer to the same time period?
  - answer: Yes — one type of mixed conditional shows how a past action changed the present situation.
    purpose: Tests whether the learner understands that one type of mixed conditional shows how a past choice affects the
      present situation. This is important because it is a common way to express regret about life decisions.
    question: Is this about how a past choice affects the present?
  - answer: Yes — the other type shows how a current characteristic would have affected a past outcome.
    purpose: Tests whether the learner understands that the other type shows how a present trait would have changed a past
      outcome. This is important because it allows reflection on how current characteristics influence past events.
    question: Or is it about how a present trait would have changed the past?
  - answer: The if-clause follows the third conditional pattern (if + past perfect) and the main clause follows the second
      conditional pattern (would + base verb). This is a Type 1 mixed conditional, combining a past condition with a present
      result two different conditional structures in one sentence.
    purpose: Tests whether the learner can identify the specific tense patterns in each clause of a mixed conditional. Recognising
      that the if-clause uses past perfect (third conditional form) while the main clause uses would + base verb (second conditional
      form) is essential for producing mixed conditionals accurately.
    question: In the sentence if I had taken that job, I would be living in London now, which conditional pattern does each
      clause follow?
  contrast: '''2nd Conditional'' = ''If I had money, I would buy a car.'' (present → present) vs ''3rd Conditional'' = ''If
    I had had money, I would have bought a car.'' (past → past) vs ''Mixed'' = ''If I had studied, I would have a better job
    now.'' (past → present)'
  core_meaning: Mixed conditionals combine second and third conditional structures when the time in the if-clause is different
    from the time in the main clause. The condition refers to one time period, the result to another. This reflects how past
    choices affect present situations, or how present characteristics would have changed past outcomes.
  example_generator:
    contexts:
    - past choices affecting present
    - present traits affecting past
    - regret and reflection
    - life decisions
    cultural_notes:
    - Use diverse scenarios (career, education, relationships, health)
    - Avoid examples that may trigger strong emotional responses
    - Keep examples relatable and thought-provoking
    min_examples: 5
  timeline: 'Mixed: past condition → present result, OR present condition → past result. The two clauses refer to different
    time periods.'
phonetics:
- example_generator:
  - would have → would've /wʊdəv/
  - had → /əd/ or /d/
  l1_issue: Many L1 speakers over-pronounce 'would have' and 'had' in mixed conditionals. Teach contracted forms for natural
    speech.
  note: 'Contractions are essential: ''would'' → /d/ in connected speech, ''would have'' → /wʊdəv/, ''had'' → /əd/ or /d/.'
- example_generator:
  - I would be → /aɪd biː/
  - she would have → /ʃiːd hæv/ or /ʃiːdəv/
  l1_issue: 'Portuguese and Spanish speakers often struggle with the mixed time references. Drill the structure with clear
    time markers: ''now'' for present result, ''yesterday'' for past result.'
  note: 'In Type 1 mixed conditionals, the present result clause uses the same pronunciation as second conditional: ''I would
    be'' → /aɪd biː/.'
register_notes:
- note: Mixed conditionals are more common in formal writing and academic prose than in casual conversation.
  reliability: D
  source: Team observation
  tier: 4
- note: 'In academic writing, mixed conditionals are used for discussing implications: ''If the theory had been correct, we
    would see different results now.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'In conversation, mixed conditionals are used for reflecting on life choices: ''If I had studied harder, I would have
    a better job now.'''
  reliability: D
  source: Team observation
  tier: 4
- note: 'Biber et al. (2021) — Mixed conditionals: primarily in planned/written discourse; rare in casual conversation. Register
    distribution skews toward formal contexts. Ch. 10.2.8.12'
  reliability: C
  source: Biber et al. (2021) Grammar of Spoken and Written English. John Benjamins Publishing Company. Ch. 10.2.8.12
