    / So yesterday I go to the store and I see this guy... (narrative present for
    drama)
  error: '*Yesterday I go to the store and I buy some milk.* (narrative present)'
  explanation: Narrative present is used for dramatic storytelling, not for simple
    past reporting. In standard reporting, use past simple.
