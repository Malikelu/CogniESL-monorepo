  tier: 1
- claim: McManus (2022) Crosslinguistic Influence and Second Language Learning documents
    how transfer effects are non-linear, determined by functional fit between L1 and
    L2 systems. His research shows that CLI operates at multiple linguistic levels
    (phonological, lexical, morphosyntactic, pragmatic) and that transfer effects
    are non-linear — determined by functional fit between L1 and L2 systems rather
    than mere formal similarity. McManus (2022) documents that the L1 is always active
    during L2 use and that transfer is a permanent feature of multilingual cognition.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 2
- claim: Swan & Smith (2001) provide the definitive cross-linguistic reference for
    L1-specific error patterns in English. Their learner English framework documents
    how each L1 group produces characteristic errors in this grammatical domain, enabling
    teachers to anticipate and address transfer errors before they fossilize.
  source: 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
    and Other Problems, 2nd ed. Cambridge University Press.'
  tier: 2
common_errors:
- correction: I am at the bus stop.
  error: '*I am in the bus stop.*'
  explanation: '''At'' is for specific points (at the bus stop, at the door). ''In''
    is for enclosed spaces (in the bus, in the building). ''On'' is for surfaces (on
    the bus, on the platform).'
  l1_groups:
  - Portuguese
  - Spanish
  - French
  reliability: B
  source: Swan (2016) Practical English Usage, 4th ed. Oxford University Press.
- error: Spatial preposition errors reflect conceptual transfer, not just formal L1-L2
    mapping (Golden et al. Ch.4)
  explanation: 'Golden et al. (2017) Ch.4 (Szymańska): Conceptualization of objects
    as containers vs. surfaces varies crosslinguistically and affects preposition
    choice even when L1 and L2 are genealogically related. Counter-intuitively, English-speaking
    learners performed NO BETTER than Slavic learners on Norwegian spatial prepositions
    despite shared Germanic origin. English "in/on" conceptual mapping differs from
    Norwegian "i/pa": Norwegian uses "på" extensively for institutional/social activities
    where English uses "at" or "on". Spatial preposition accuracy is driven by conceptual
    fit, not formal similarity.'
  l1_groups:
  - All L1s — conceptual transfer affects all learners
  reliability: C
  source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
    of Language Learning, Ch. 4
- error: Overgeneralizing 'in' for all locations from Spanish 'en' which covers in/on/at
  explanation: Spanish 'en' maps to multiple English prepositions. Direct transfer
    produces preposition errors.
  l1_groups:
  - Spanish
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
description: 'Prepositions used to talk about where something is: at (specific point),
  in (enclosed space), on (surface).'
dialectal_variation: []
discourse_notes: []
form:
  affirmative:
    example_generator:
      contexts:
      - giving directions
      - describing locations
      - talking about where things are
      min_examples: 4
    structure: 'at + specific point: ''at the door'', ''at the bus stop'' / in + enclosed
      space: ''in the room'', ''in London'' / on + surface: ''on the table'', ''on
      the wall'''
  negative:
    example_generator:
      contexts:
      - giving directions
      - describing locations
      - talking about where things are
      min_examples: 4
    structure: 'Same preposition, negated verb: ''The book isn''t on the table.'''
  questions:
    example_generator:
      contexts:
      - giving directions
      - describing locations
      - talking about where things are
      min_examples: 4
    structure: 'Where + be?: ''Where is the cat?'' → ''On the table.'''
grammar_point: prepositions_place
level: A1
meaning:
  ccqs:
  - answer: Use 'at' (at the bus stop)
    purpose: 'Tests whether the learner can distinguish between the three main place
      prepositions: in (enclosed space), on (surface), at (specific point).'
    question: Is it a specific point or address?
  - answer: Use 'in' (in the room)
    purpose: Tests understanding of prepositions_place.
    question: Is it inside an enclosed space?
  - answer: Use 'on' (on the wall)
    purpose: Tests understanding of prepositions_place.
    question: Is it on a surface?
  - answer: '''I am good at maths.'' The fixed preposition after ''good'' is ''at''.
      Many adjectives have fixed prepositions.'
    purpose: Tests whether the learner uses the correct preposition after adjectives
      (Swan PEU 2016, entries 83-85).
    question: Which is correct? *'I am good in maths' or 'I am good at maths'?
  contrast: '''At'' = specific point (at the door) vs ''In'' = enclosed space (in
    the box) vs ''On'' = surface (on the table)'
  core_meaning: Prepositions of place tell us WHERE something is located. Each preposition
    describes a different spatial relationship.
  example_generator:
    contexts:
    - giving directions
    - describing locations
    - talking about where things are
    - addresses
    cultural_notes: []
    min_examples: 5
  timeline: Timeless — describes location, not time.
phonetics:
- contexts:
  - connected speech
  example_generator:
    contexts:
    - connected speech
  l1_issue: Some L1 speakers use 'in' for all locations
  note: 'Weak forms: /æt/ → /ət/, /ɪn/ → /ən/, /ɒn/ → /ən/'
register_notes:
- note: 'Biber et al. (1999) — Place prepositions: register distribution varies. Conversation
    uses more deictic spatial expressions; academic prose uses more precise locative
    prepositions. Ch. 5.3.3'
  reliability: C
  source: Biber et al. (1999) Grammar of Spoken and Written English. Longman Publishing
    Company. Ch. 5.3.3
