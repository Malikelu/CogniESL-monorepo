sub_rules:
- examples:
  - I'm at home.
  - Wait at the traffic lights.
  rule: 'at: at the door, at home, at school, at work, at the bus stop'
  type: grammatical
- examples:
  - The keys are in my pocket.
  - I live in Brazil.
  rule: 'in: in the box, in the room, in London, in the park, in the car'
  type: grammatical
- examples:
  - The book is on the desk.
  - I'm on the bus.
  rule: 'on: on the table, on the wall, on the floor, on the bus, on Main Street'
  type: grammatical
teaching:
  methodology: PPP
  recommended_activities:
  - adaptation_notes: Hide objects and describe their location using prepositions.
    duration: 10
    name: Where Is It?
  tips:
  - Use real objects to demonstrate spatial relationships
  - Draw diagrams to show at/in/on
  - 'Swan PEU: Time and place prepositions — at precise points, in enclosed spaces/periods,
    on surfaces/days. This distinction underlies most time and place preposition usage
    in English.'
  - 'Locative nouns (home, downtown, overseas, here, there) never occur with ''to''
    with verbs of motion: ''go home'' not *''go to home''. When here/there occur with
    stative verbs and ''in'', they use ''in'' only with the core meaning of physical
    enclosure (''It''s in here'' = in this box). In broader senses, here/there appear
    alone. Source: Celce-Murcia & Larsen-Freeman (2015) GB3 3rd ed. Ch. 21: Prepositions.'
title: Prepositions of Place (At, In, On)
use:
- context: Giving directions
  description: Telling someone where to go or where something is
  examples:
  - Turn left at the bank.
  - The pharmacy is on Main Street.
- context: Describing locations
  description: Talking about where things are
  examples:
  - My phone is in my bag.
  - There's a picture on the wall.
