  questions:
    interference_patterns:
    - pattern: Use of mai/rue question particles
      example_l1: '[th] khun pay mai?'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: you go Q-particle
      example_wrong: He go?
      example_correct: Is he going? / Did he go?
      explanation: 'Transfer from L1: Thai forms questions with particles (e.g., mai,
        rue) at the end of the sentence. Swan & Smith note "a sentence is transformed
        into a question by the addition of a question word which is placed at the
        end of the sentence" (p. 349).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: He go?
      correct: Did he go? / Is he going?
    - wrong: When he go?
      correct: When did he go?
    - wrong: He go when?
      correct: When did he go?
    - wrong: How many the price that shirt?
      correct: How much is that shirt? / What is the price of that shirt?
    why_it_happens: 'Thai forms questions with particles or intonation. English requires
      do-support. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: Do/Does/Did + subject + base verb?'
      where_to_start: Start with the questions pattern.
      sequencing: 'Week 1: questions. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: questions Audit
        type: error-correction
        description: 20 sentences with questions errors.
        duration: 15
      - name: questions Translation
        type: translation
        description: Translate 15 sentences focusing on questions.
        duration: 15
      - name: questions Practice
        type: fill-in-the-blank
        description: 20 sentences practicing questions.
        duration: 10
      - name: questions Error Hunt
        type: error-correction
        description: A paragraph with 10 questions errors.
        duration: 15
