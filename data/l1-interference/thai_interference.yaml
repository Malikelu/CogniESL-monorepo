    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      location: Various chapters
      tier: 3
    source_count: 3
  serial_verbs:
    interference_patterns:
    - pattern: Serial verb constructions
      example_l1: '[th] khaw s-i-i aahǎan pay hây khruu (he buy food give teacher) - multiple verbs in sequence'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: he buy food give teacher (multiple verbs chained without conjunctions)
      example_wrong: He bought food gave the teacher.
      example_correct: He bought food for the teacher. / He bought food and gave it to the teacher.
      explanation: 'Transfer from L1: Thai uses serial verb constructions where multiple verbs appear in sequence without conjunctions. Hudak notes "complex verbal predicates consist of a collocation of verbs generally referred to as serial verbs" (Section 3.3). Secondary verbs modify the main verb as pre-verbs (mây "not", cà "shall/will", yàak "want") or post-verbs indicating direction (khîn "up", loŋ "down", pay "away", maa "toward"), completion (l´eew "already"), ability (dây "can"), or physical capability (waˇy "to be physically capable"). This differs from English which uses auxiliaries, prepositions, or separate clauses.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: A
    why_it_happens: 'Thai serial verb constructions allow multiple verbs in sequence without conjunctions. Hudak (1990) describes two classes of secondary verbs - pre-verbs (before main verb, functioning like modals/adverbs) and post-verbs (after main verb, indicating direction/completion/ability). English requires auxiliaries, prepositions, or subordinate clauses instead. Thai learners may chain English verbs directly, producing errors like "He bought food gave the teacher" instead of "He bought food for the teacher."'
    teacher_tips:
      how_to_explain: "Teach: English uses prepositions, not chained verbs. 'give to' (not 'give'), 'go to' (not 'go'). Use auxiliaries: will, can, should (not bare verb sequences)."
      where_to_start: Start with prepositional phrases replacing serial verbs. Teach auxiliary verb system.
      sequencing: "Week 1: Auxiliary verbs. Week 2: Prepositions of direction. Week 3: Complex verb phrases. Week 4: Review."
    flagged: false
    tier: 3
    exercises:
    - name: Serial Verb Correction
      type: sentence-rewrite
      description: Rewrite 10 sentences replacing serial verb patterns with English structures.
      duration: 15
    sources:
    - Swan & Smith (2001) Learner English
    - Hudak, T.J. (1990). Thai. In B. Comrie (ed.), The World's Major Languages, pp. 757-775. Oxford University Press.
    examples:
    - wrong: He bought food gave the teacher.
      correct: He bought food for the teacher.
    citations:
    - claim: Secondary verbs in Thai serial verb constructions function as modals (pre-verbs) or direction/result markers (post-verbs). English expresses these through auxiliaries, prepositions, and subordinate clauses.
      source: 'Hudak, T.J. (1990). Thai. In B. Comrie (ed.), The World''s Major Languages, pp. 757-775. Oxford University Press. Section 3.3: Verbal Predicate: Complex.'
      tier: 1
      reliability: A
    source_count: 2
  elaborate_expressions:
    interference_patterns:
    - pattern: Literal translation of Thai 4-syllable elaborate expressions
      example_l1: '[th] hǔu pàa taa th-ìan (ear forest eye forest) - 4-syllable expression'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: 'ear forest eye forest (meaning: to be ignorant of what is going on)'
      example_wrong: I have ear forest eye forest.
      example_correct: I am completely unaware of what is happening.
      explanation: 'Transfer from L1: Thai "elaborate expressions" are a Southeast Asian areal feature of 4-syllable compounds where part of a compound is reduplicated and a new part is added. Hudak (1990) notes they are "a special type of compounding achieved through the reduplication of part of a compound and the addition of a new part" (Section 3.4), usually with 4 syllables where the 1st and 3rd or 2nd and 4th syllables rhyme. Thai considers the ability to use these expressions "an essential quality of speaking well and fluently." English has no equivalent structure and Thai learners may translate them literally or struggle with English idiomatic expressions.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: A
    why_it_happens: Thai elaborate expressions (4-syllable reduplicative compounds) are a distinctive Southeast Asian literary/rhetorical form. Hudak (1990) notes they typically involve reduplication of one element with addition of a new rhyming element. Attempting to translate these literally into English produces incomprehensible output.
    teacher_tips:
      how_to_explain: "Teach: English idioms cannot be translated word-for-word. Learn the English equivalent as a whole phrase."
      where_to_start: Teach high-frequency English idioms that serve similar rhetorical functions.
      sequencing: "Week 1: Common English idioms. Week 2: Understanding idiom function. Week 3: Practice. Week 4: Review."
    flagged: false
    tier: 3
    exercises:
    - name: Idiom Translation
      type: matching
      description: Match 10 English idioms to their meanings.
      duration: 10
    sources:
    - Swan & Smith (2001) Learner English
    - Hudak, T.J. (1990). Thai. In B. Comrie (ed.), The World's Major Languages, pp. 757-775. Oxford University Press.
    examples:
    - wrong: I have ear forest eye forest.
      correct: I am completely unaware of what is happening.
    citations:
    - claim: Elaborate expressions in Thai are 4-syllable compounds formed by reduplication and addition of rhyming elements, a Southeast Asian areal feature with no English equivalent.
      source: 'Hudak, T.J. (1990). Thai. In B. Comrie (ed.), The World''s Major Languages, pp. 757-775. Oxford University Press. Section 3.4: Elaborate Expressions.'
      tier: 1
      reliability: A
    source_count: 2
  thai_particles:
    interference_patterns:
    - pattern: Transfer of Thai question particles to English
      example_l1: '[th] khun pay máy? / khun pay rue? (you go Q-particle?)'
      frequency: 5
      persistence: 4
      communicative_impact: 4
      example_gloss: you go Q-particle? (question formed with sentence-final particle)
      example_wrong: You go? / You go or not?
      example_correct: Are you going? / Do you go?
      explanation: 'Transfer from L1: Thai uses sentence-final particles (máy for yes-no questions, r-î-i for confirmation-seeking questions, chây máy for tag-question equivalents) rather than word order changes or do-support. Hudak (1990) describes three groups of particles (question, polite, mood) that are "a large class of particles that end an utterance" (Section 3.4). The question particles form yes-no questions by placement at the end of a statement. Máy has no speaker expectation, r-î-i expects confirmation, and chây máy functions like English tag questions. This directly transfers to English question formation errors.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: A
    why_it_happens: 'Thai question formation uses sentence-final particles rather than word order changes. Hudak (1990) identifies máy (neutral yes-no), r-î-i (confirmation-seeking) and chây máy (tag-question-like). Thai learners may transfer this pattern, producing "You go?" or "You go, right?" instead of "Are you going?"'
    teacher_tips:
      how_to_explain: "Teach: English uses auxiliaries at the START of questions. Are you going? Do you go? NOT: You go?"
      where_to_start: Start with yes/no questions using do/does/did. Then teach wh- questions.
      sequencing: "Week 1: Do/does questions. Week 2: Be-verb questions. Week 3: Tag questions. Week 4: Review."
    flagged: false
    tier: 2
    exercises:
    - name: Particle to Auxiliary
      type: sentence-rewrite
      description: Convert 10 Thai-style questions to correct English questions.
      duration: 15
    sources:
    - Swan & Smith (2001) Learner English
    - Hudak, T.J. (1990). Thai. In B. Comrie (ed.), The World's Major Languages, pp. 757-775. Oxford University Press.
    examples:
    - wrong: You go?
      correct: Are you going?
    - wrong: You go, right?
      correct: You're going, aren't you?
    citations:
    - claim: Thai forms questions with sentence-final particles (máy, r-î-i, chây máy) rather than do-support or subject-auxiliary inversion. Thai has three particle groups (question, polite, mood).
      source: 'Hudak, T.J. (1990). Thai. In B. Comrie (ed.), The World''s Major Languages, pp. 757-775. Oxford University Press. Section 3.4: Particles.'
      tier: 1
      reliability: A
    source_count: 2
etiology:
- claim: 'Jarvis & Pavlenko (2008) identify eight conceptual domains where crosslinguistic
    influence occurs: objects, emotions, personhood, gender, number, time, space,
    and motion. L1 conceptual categories influence how L2 learners perceive and categorize
    reality.'
  source: Jarvis & Pavlenko (2008) Crosslinguistic Influence in Language and Cognition.
    Routledge. Chapters 4-5.
  tier: 2
  reliability: B
  flagged: false
  conceptual_transfer: true
  factors_affecting_transfer:
  - proficiency_level
  - perceived_crosslinguistic_distance
  - recency_of_L2_use
  - markedness
  - L2_status_effect
  - cognitive_maturity
  - attention_to_language_form
writing_interference:
- area: argumentative_essay
  description: 'Thai argumentative writing is influenced by Buddhist rhetorical traditions
    that value harmony, indirectness, and the avoidance of confrontation. Thai writers
    tend to present multiple perspectives without explicitly favoring one, and thesis
    statements may be implied rather than directly stated. Thai essays often use a
    ''middle path'' approach, acknowledging all sides before gently suggesting a position.
    English argumentative essays require a clear, upfront thesis, direct claims, and
    explicit refutation of counter-arguments. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  common_errors:
  - error: '*There are many views on this topic. Some people think one way, others
      think another way. Both sides have good points. Perhaps we can find a middle
      way.'
    correction: I argue that [thesis] because [reason]. While [counter-argument] has
      merit, [rebuttal].
    explanation: Thai rhetorical tradition avoids taking a strong stance; English
      argumentation requires a clear, defensible thesis.
  - error: '*As the Buddha taught, ''All things are impermanent,'' which reminds us
      that change is natural.'
    correction: Historical evidence demonstrates that [specific change] is inevitable.
    explanation: Thai writing often cites Buddhist teachings as evidence; English
      academic writing requires empirical or scholarly citation.
  source: 'Swan & Smith (2001). Learner English, Ch. 21: Thai speakers. Cambridge
    University Press.'
- area: paragraph_structure
  description: 'Thai paragraphs tend to be shorter and more fragmented than English
    paragraphs, often consisting of a single sentence or a brief observation. Thai
    writers may not use topic sentences consistently, and paragraphs may lack explicit
    concluding sentences. The Thai preference for brevity and implication means that
    supporting details and logical connections may be left unstated, assuming the
    reader will infer them. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*A one-sentence paragraph: ''Education is important.'' with no supporting
      details.'
    correction: Education is important because [reason]. For example, [specific evidence].
      Therefore, [conclusion].
    explanation: Thai paragraphs may be brief and implicit; English paragraphs require
      a topic sentence, supporting details, and a concluding sentence.
  - error: '*A paragraph that presents an idea but does not explain or support it.'
    correction: Each idea must be supported with evidence, examples, or explanation.
    explanation: Thai writing assumes the reader will infer connections; English writing
      requires explicit development of each idea.
  source: 'Swan & Smith (2001). Learner English, Ch. 21: Thai speakers. Cambridge
    University Press.'
- area: cohesion_devices
  description: 'Thai is a paratactic language that relies on context and shared understanding
    rather than explicit connectors. Thai writers may underuse English transitional
    phrases (however, therefore, moreover) because Thai signals relationships through
    context and particles rather than conjunctions. Thai writers may also overuse
    ''and'' (lae) to chain ideas, producing run-on sentences. The Thai discourse marker
    ''lae'' (and/and then) is frequently overused in English compositions. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  common_errors:
  - error: '*The policy was good. The people were happy. The economy grew. The country
      prospered.'
    correction: The policy was effective because it made people happy, stimulated
      economic growth, and led to national prosperity.
    explanation: Thai relies on context to connect ideas; English requires explicit
      transitional devices to show relationships.
  - error: '*The government acted. Lae the people responded. Lae the situation improved.'
    correction: After the government acted, the people responded, and the situation
      improved.
    explanation: '''Lae'' (and/and then) is overused as a Thai discourse transfer;
      English uses varied subordinating and coordinating devices.'
  source: 'Swan & Smith (2001). Learner English, Ch. 21: Thai speakers. Cambridge
    University Press.'
- area: register_and_formality
  description: 'Thai has an elaborate system of politeness particles and honorifics
    (khrap/kha) that influences writing style. Thai learners may produce English writing
    that is excessively polite, indirect, or hedged, avoiding strong claims. The Thai
    cultural value of ''kreng jai'' (consideration/reluctance to impose) leads to
    understated arguments and reluctance to criticize. English academic writing expects
    confident, direct claims supported by evidence. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  common_errors:
  - error: '*It is possible that perhaps the data might suggest that there could be
      a trend, but I am not certain.'
    correction: 'The data clearly indicate a trend: [specific finding].'
    explanation: Thai politeness conventions produce excessive hedging; English academic
      writing expects confident, evidence-backed claims.
  - error: '*I think maybe the policy is not so good, but I do not want to say it
      is bad.'
    correction: The policy is ineffective because [specific evidence].
    explanation: Thai kreng jai leads to understated criticism; English academic writing
      requires direct evaluation based on evidence.
  source: 'Swan & Smith (2001). Learner English, Ch. 21: Thai speakers. Cambridge
    University Press.'
total_grammar_points: 59
