  comparatives:
    interference_patterns:
    - pattern: Comparative formation (thai)
      example_l1: '[th] suay kwaa (beautiful more) - analytic comparative'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: beautiful more (comparative formed with 'kwaa' = more than)
      example_wrong: This dress is beautiful more than that one. / I work the most
        hard of my brothers.
      example_correct: This dress is more beautiful than that one. / I work the hardest
        of my brothers.
      explanation: 'Transfer from L1: Thai forms comparatives analytically with "kwaa"
        (more than) and "thisut" (most). Swan & Smith note "The comparative and superlative
        degrees of adjectives and adverbs in Thai are formed by the addition of the
        equivalent of more than and (the) most respectively, immediately after the
        base word. As a result, the English suffixes -er and -est are frequently disregarded
        by Thai learners" (p. 351).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: This dress is beautiful more than that one.
      correct: This dress is more beautiful than that one.
    - wrong: I work the most hard of my brothers.
      correct: I work the hardest of my brothers.
    why_it_happens: 'Thai forms comparatives with separate words (kwaa = more than,
      thisut = most), not suffixes. English uses -er/-est for short adjectives. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: 1-2 syllable adjectives -> -er/-est. 3+ syllable adjectives
        -> more/most.'
      where_to_start: Start with the comparatives pattern.
