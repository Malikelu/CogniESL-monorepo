      example_wrong: '"^I ^am ^English" with glottal stops'
      example_correct: '"I am English" with smooth juncture'
      explanation: Thai speakers insert glottal stops before initial vowels. Swan
        & Smith note "The glottal stop is a phoneme in Thai, and Thai speakers will
        often insert one at the beginning of English words that have an initial vowel
        sound; this tends to create a staccato effect and preclude juncture" (p. 346).
      frequency: 3
      persistence: 3
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Lack of juncture linking
