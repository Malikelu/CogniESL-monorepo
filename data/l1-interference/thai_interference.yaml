language: Thai
language_code: th
schema_version: '4.0'
grammar_points:
  articles:
    interference_patterns:
    - pattern: Omission of all articles (Thai has no articles)
      example_l1: '[th] pen khon dii'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: is person good
      example_wrong: He is very nice man.
      example_correct: He is a very nice man.
      explanation: 'Transfer from L1: Thai has no articles. Swan & Smith note "errors
        of confusion between indefinite and definite articles, as well as when to
        omit articles, occur frequently" (p. 350).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Golden et al. (2017): L1s without articles show more difficulty —
        confirmed across typologically diverse L1s'
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_l1: 'Thai: no article system'
      example_gloss: Thai expresses definiteness through context, word order, or classifiers
      example_wrong: '''I went to school'' / ''the school'' (article choice difficulty)'
      example_correct: '''I went to school'' (zero article for institutions) / ''I
        went to the school'' (specific)'
      explanation: 'Golden et al. (2017): Confirmation that any L1 group without articles
        will have MORE difficulty with English articles than L1s with articles (Odlin
        Ch.3 prediction confirmed). Vietnamese learners omit articles more but are
        accurate when present (classifier compensation effect). This non-linear transfer
        pattern shows article acquisition is about functional fit, not just L1-L2
        formal similarity.'
      etiology: conceptual_transfer
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Golden et al. (2017): L1s without grammatical gender struggle with
        gender in gendered L2s — but may use compensating strategies'
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: 'Thai: no grammatical gender'
      example_gloss: Thai does not mark gender on articles/adjectives
      example_wrong: '''la libro'' / ''el mesa'' (Spanish gender assignment difficulty)'
      example_correct: '''el libro'' / ''la mesa'''
      explanation: 'Golden et al. (2017) Ch.6 (Ragnhildstveit): Vietnamese (no gender,
        but classifier system) omits articles MORE but is accurate for gender WHEN
        using them — showing partial compensation. Having no L1 gender system means
        learning gender from scratch, but compensating cognitive strategies (classifiers,
        semantic categorization) may partially support acquisition.'
      etiology: conceptual_transfer
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Thai L1 → English article difficulty: Odlin (Ch.3, Ch.5) group-level
        prediction confirmed'
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_l1: 'Thai: no article system'
      example_gloss: Thai has no articles; definiteness expressed through other means
      example_wrong: '''I went school'' / ''I like the life'' (article errors persistent)'
      example_correct: '''I went to school'' / ''I like life'''
      explanation: 'Odlin (Ch.3, Ch.5): Jarvis (1998) confirmed that L1 groups without
        articles (Finnish, Vietnamese, Korean, Japanese, etc.) have significantly
        MORE difficulty with English articles than groups with articles (Swedish,
        French, German). Group-level predictions hold: any L1 without articles will
        struggle. Golden et al. (2017) confirmed Vietnamese pattern: omit more but
        accurate when present.'
      etiology: negative_transfer
      flagged: true
      tier: 4
      reliability: B
    examples:
    - wrong: He is very nice man.
      correct: He is a very nice man.
    - wrong: What the food you like?
      correct: What food do you like?
    - wrong: The buffaloes are the important animals in Thailand.
      correct: Buffaloes are important animals in Thailand.
    why_it_happens: Thai has no article system. Definiteness is inferred from context
      or classifiers rather than grammatical markers. Thai learners often omit articles
      entirely in English, producing sentences like 'I bought book yesterday' instead
      of 'I bought a book.' This occurs because Thai does not require speakers to
      mark definiteness grammatically. McManus (2022) explains that L2 speakers can
      learn new form-meaning mappings (like articles) that don't exist in L1, but
      this requires extensive practice to become automatic. Online anticipatory processing
      (using articles to predict upcoming nouns) develops only with high proficiency
      and extended exposure, not from L1 transfer. McManus (2022) explains that L2
      speakers can learn new form-meaning mappings that don't exist in L1, but this
      requires extensive practice to become automatic. L2 learning involves creating
      new knowledge when L1-L2 differences exist AND developing selection mechanisms
      to manage competing knowledge sources (McManus 2022, Ch. 1). Online anticipatory
      processing develops only with high proficiency and extended exposure.
    teacher_tips:
      how_to_explain: 'Teach: English REQUIRES articles. ''A/an'' for first mention,
        ''the'' for specific.'
      where_to_start: Start with the articles pattern.
      sequencing: 'Week 1: articles. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: articles Audit
        type: error-correction
        description: 20 sentences with articles errors.
        duration: 15
      - name: articles Translation
        type: translation
        description: Translate 15 sentences focusing on articles.
        duration: 15
      - name: articles Practice
        type: fill-in-the-blank
        description: 20 sentences practicing articles.
        duration: 10
      - name: articles Error Hunt
        type: error-correction
        description: A paragraph with 10 articles errors.
        duration: 15
