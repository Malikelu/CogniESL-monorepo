  pronouns:
    interference_patterns:
    - pattern: Gender-neutral third-person pronoun
      example_l1: '[th] khaw (he/she/they) - single third-person pronoun'
      example_gloss: he/she/they (single gender-neutral third-person pronoun)
      example_wrong: My girlfriend, he is very nice. / The policeman she chase me.
      example_correct: My girlfriend, she is very nice. / The policeman chased me.
      explanation: Thai has a single gender-neutral third-person pronoun (khaw). Swan
        & Smith note "the most commonly used third-person pronoun makes no distinction
        between gender, with the result that Thai learners frequently use he and she
        interchangeably in English" (p. 352).
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Subject omission
      example_l1: '[th] mai dai arai (not get what) - subject omitted'
      example_gloss: not get what (subject omitted when context is clear)
      example_wrong: My brother was angry when came home.
      example_correct: My brother was angry when he came home.
      explanation: Thai commonly omits the subject when it is clear from context.
        Swan & Smith note "It is very common in Thai to omit the subject from a sentence
        if it is perfectly clear who or what is being talked about. This means that
        pronouns are frequently discarded in Thai sentences, a pattern sometimes carried
        over into English" (p. 352).
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Noun-pronoun duplication
      example_l1: '[th] phu-ying khon-nang... (woman that-clause...she...)'
      example_gloss: woman that-clause...she... (noun and pronoun both used)
      example_wrong: My girlfriend, he is very nice.
      example_correct: My girlfriend is very nice. / She is very nice.
      explanation: Thai commonly duplicates the noun and pronoun in spoken language.
        Swan & Smith note "the duplication of noun and pronoun which occurs commonly
        in spoken Thai" (p. 352).
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'Thai pronouns differ significantly from English. Swan & Smith
      note the Thai third-person pronoun (khaw) is gender-neutral and number-neutral,
      leading to he/she confusion and number errors like "My American friends are
      in Thailand. He stay at the hotel" (p. 352). McManus (2022): The L1 is always
      active during L2 use cross-language co-activation is constant. Managing L1-L2
      competition requires inhibitory control (Green 1998 Inhibitory Control Model).
      This means L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): L1s without article
      systems show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English requires gendered third-person pronouns (he/she).
        Always include the subject pronoun. Do not duplicate noun and pronoun.'
      where_to_start: Start with he/she distinction. Then teach subject pronoun requirement.
      sequencing: 'Week 1: He/she distinction. Week 2: Subject pronoun requirement.
        Week 3: Pronoun review. Week 4: Mixed practice.'
