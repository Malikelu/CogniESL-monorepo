  adverbs:
    interference_patterns:
    - pattern: Adjective vs adverb (thai)
      example_l1: '[th] khaw phaasaa thai dii (he speak Thai good) - no -ly'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: he speak Thai good (same form for adj/adv)
      example_wrong: You speak Thai very good.
      example_correct: You speak Thai very well.
      explanation: 'Transfer from L1: Thai does not distinguish adjective/adverb pairs.
        Swan & Smith note "In Thai, there is no distinction between adjective/adverb
        pairs as there is in English (e.g. good/well, clear/clearly). Thai learners
        tend to overuse the adjectival form in English" giving the example "You speak
        Thai very good" (p. 351).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: You speak Thai very good.
      correct: You speak Thai very well.
    - wrong: This car not good.
      correct: This car is not good.
    - wrong: This food very tasty.
      correct: This food is very tasty.
    why_it_happens: 'Thai does not distinguish adjectives from adverbs morphologically.
