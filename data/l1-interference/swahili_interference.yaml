    teacher_tips:
      exercises:
      - description: Give students 15 if-sentences. They sort them into real/possible
          (first conditional) and unreal/hypothetical (second conditional). Then write
          the correct main clause for each.
        duration: 15
        name: Conditional Sort
        type: matching
      - description: 'Give students 10 first conditional sentences. Students transform
          them into second conditional: If I have time, I will help -> If I had time,
          I would help.'
        duration: 15
        name: Conditional Transformation
        type: transformation
      - description: 'Provide 10 sentences with would in the if-clause: If I would
          have money, If she would come. Students correct: If I had money, If she
          came.'
        duration: 15
        name: Would in the If-Clause Fix
        type: error-correction
      - description: 'Students write a chain of conditional sentences: If I won the
          lottery, I would buy a house. If I bought a house, I would invite my friends.
          Minimum 8 sentences.'
        duration: 20
        name: Conditional Chain Story
        type: composition
      how_to_explain: 'Say: English has two types of if-sentences. Type 1: REAL possibilities
        -- If I HAVE time, I WILL call you. Type 2: UNREAL/HYPOTHETICAL -- If I HAD
        time, I WOULD call you. The difference is: Type 1 can really happen. Type
        2 is imaginary. For the subjunctive, say: In English, we say If I WERE you,
        not If I WAS you.'
      sequencing: 'Week 1: First conditional (real/possible). Week 2: Second conditional
        (unreal/hypothetical). Week 3: The subjunctive were. Week 4: Mixed conditionals
        and error correction.'
      where_to_start: 'Start with first conditional (real/possible): If it rains,
        I will stay home. Then introduce second conditional (unreal/hypothetical):
        If I were a bird, I would fly.'
    tier: 1
    why_it_happens: 'Swahili conditional sentences use the conditional marker -ng-
      in both the if-clause and the main clause. The same marker appears in both clauses,
      so learners may use would in both clauses in English. Additionally, Swahili
      does not distinguish grammatically between real/possible conditions (first conditional)
      and unreal/hypothetical conditions (second conditional) the way English does.
      English requires different verb forms: If I have... I will (real) vs. If I had...
      I would (unreal). The English subjunctive were (If I were you) is particularly
      challenging because Swahili has no subjunctive form that maps onto this pattern.
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present.'
