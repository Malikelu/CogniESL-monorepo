    persistence: 3
    source_count: 5
    source_rank: 1
    source_type: peer-reviewed
    sources:
    - 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
      and Other Problems. Cambridge University Press.'
    - Chimera, R. (2002). Modern Swahili Grammar. East African Educational Publishers.
    - 'Odlin, T. (1989). Language Transfer: Cross-Linguistic Influence in Language
      Learning. Cambridge University Press.'
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    teacher_tips:
      exercises:
      - description: 'Give students 15 sentences with adverbs in the wrong position:
          I eat never, She always is late. Students fix errors.'
        duration: 15
        name: Adverb Placement Drill
        type: transformation
      - description: 'Provide 15 sentences: He plays very ___ (good/well), She is
          a ___ singer (good/well). Students choose the correct form.'
        duration: 15
        name: Good vs. Well
        type: fill-in-the-blank
      - description: 'Give students 15 adjectives. Students form the adverb: quick
          -> quickly, careful -> carefully, fast -> fast, good -> well.'
        duration: 15
        name: Adverb Formation
        type: transformation
      - description: Students write a paragraph about their daily routine, using at
          least 8 different adverbs correctly.
        duration: 20
        name: Adverb Paragraph
        type: composition
      how_to_explain: 'Say: In English, words like always, never, often, usually,
        sometimes go BEFORE the main verb but AFTER the verb be. For good vs. well,
        good describes things (a good book), well describes actions (He speaks well).'
      sequencing: 'Week 1: Frequency adverbs. Week 2: Adjective vs. adverb. Week 3:
        Adverb placement. Week 4: Adverbs ending in -ly.'
      where_to_start: 'Start with frequency adverbs: always, never, often, usually,
        sometimes. Then move to adjective vs. adverb (good/well, fast/fast).'
    tier: 1
    why_it_happens: 'Swahili adverbs typically appear after the verb or at the end
      of the clause, while English adverbs of frequency (always, never, often, usually,
      sometimes) are placed BEFORE the main verb (but after be). Additionally, Swahili
      does not distinguish morphologically between adjectives and adverbs -- the same
      word (e.g., vizuri = good/well) serves both functions. English requires -ly
      for most adverbs (but has exceptions like fast, hard, well). McManus (2022):
      The L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present.'
