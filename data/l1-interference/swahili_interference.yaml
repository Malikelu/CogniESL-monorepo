language: swahili
schema_version: '4.0'
sources:
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Swahili
  relevance: Swahili phonological and grammatical transfer patterns — noun class system,
    verb morphology
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Education significantly improves economic outcomes. Research by [source]
      demonstrates that [specific finding].
    error: '*Long ago, people used to say that education is the key to success. My
      grandmother always told me stories about how education changed her life. Many
      people in my community have similar stories. So we can see that education is
      very important.'
    explanation: Swahili rhetorical tradition uses narrative and proverbs; English
      academic essays require a thesis statement with evidence from cited sources.
  - correction: Collaborative approaches to school improvement produce better outcomes.
      Evidence from [source] demonstrates that [specific finding].
    error: '*As the Swahili proverb says, ''Unity is strength'' -- and so we must
      all work together to improve our schools.'
    explanation: Swahili essays cite proverbs and communal wisdom; English academic
      writing references empirical research.
  description: 'Swahili rhetorical tradition, shaped by the oral storytelling tradition
    (hadithi) and the East African cultural value of communal harmony (ujamaa), favors
    a narrative, consensus-building approach to argumentation. Swahili essays often
    approach the main point gradually through storytelling, proverbs (methali), and
    communal perspectives rather than through direct thesis statements. Swahili writers
    may present multiple viewpoints before arriving at a conclusion, and may use proverbial
    wisdom and community experience as evidence rather than empirical data or cited
    sources. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Swahili speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Begin each paragraph with a clear topic sentence, then develop that
      single idea with evidence and analysis.
    error: '*A paragraph that tells a brief story, adds a related observation, includes
      a proverb, and ends with a general comment -- without a clear topic sentence
      or logical structure.'
    explanation: Swahili paragraphs may rely on thematic accumulation; English paragraphs
      require an explicit topic sentence and unified development.
  - correction: 'Develop each point fully within a paragraph of 5-10 sentences: topic
      sentence, evidence, analysis, connection to thesis.'
    error: '*Short paragraphs (2-3 sentences) that each make one brief point without
      sufficient development.'
    explanation: Swahili prose style may favor brevity; English academic paragraphs
      require substantive development.
  description: 'Swahili paragraphs tend to organize ideas through accumulation and
    thematic grouping rather than through a single-topic structure. Swahili writers
    may include multiple related ideas within a single paragraph, reflecting the Swahili
    oral tradition of elaborating a theme from multiple angles. Topic sentences may
    be absent or implicit, and Swahili writers may underdeveloped individual points
    in favor of breadth. The Swahili narrative tradition may produce paragraphs that
    read more like story episodes than structured arguments. McManus (2022): Writing
    interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Swahili speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: Although the government introduced the policy to help people, some
      did not benefit, and further action is needed.
    error: '*The government introduced the policy. And the policy was meant to help
      people. But some people did not benefit. And the government needs to do more.'
    explanation: Swahili coordinates between sentences with 'and' and 'but'; English
      uses subordination and varied connectors.
  - correction: The research team conducted interviews and found interesting results.
    error: '*The team conducted the research. The team used interviews. The team found
      interesting results.'
    explanation: Swahili writing repeats nouns for clarity; English combines sentences
      and uses pronouns.
  description: 'Swahili discourse relies on topic-comment structures and demonstrative
    reference for cohesion, which may transfer awkwardly to English. Swahili writers
    may overuse ''and'' (na), ''but'' (lakini), and ''so'' (kwa hiyo) as catch-all
    connectors in English, and may begin many sentences with these conjunctions. Swahili
    ''kwamba'' (that) and ''ila'' (except/but) constructions may produce awkward English.
    Swahili writers may also repeat nouns rather than using pronouns, reflecting Swahili
    discourse patterns. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Swahili speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: This essay contributes to the discussion about education by arguing
      that [specific claim].
    error: '*It is hoped that this humble attempt may contribute in some small way
      to the important discussion about education that our community values so dearly.'
    explanation: Swahili formal writing uses elaborate deference; English academic
      writing values confident, direct argumentation.
  - correction: The policy has failed to achieve its stated objectives [source].
    error: '*So like, the thing is, the policy just isn''t working, you know?'
    explanation: Swahili informal narrative style bleeds into English academic writing;
      English requires formal register.
  description: 'Swahili academic writing reflects East African cultural values of
    respect and communal harmony. Swahili writers may use elaborate politeness markers
    and indirect language that, when transferred to English, can sound vague or evasive.
    Conversely, the Swahili narrative tradition may produce prose that sounds too
    informal for English academic contexts. Swahili writers may struggle with the
    English convention of asserting a personal argument, preferring to present ideas
    as communal knowledge. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Swahili speakers. Cambridge
    University Press.'
