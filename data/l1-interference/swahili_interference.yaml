      example_wrong: '*He writes quick'
      explanation: 'Transfer from L1: Placing frequency adverbs after the main verb
        because Swahili adverbs typically follow the verb.'
      flagged: true
      frequency: 4
      pattern: Placing frequency adverbs after the main verb because Swahili adverbs
