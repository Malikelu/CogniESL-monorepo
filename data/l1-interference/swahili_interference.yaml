    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: Provide a short paragraph written by a fictional Swahili speaker
          with all articles removed. Students must insert a, an, the, or zero article
          in every appropriate position. Discuss each choice.
        duration: 20
        name: Article Audit
        type: error-correction
      - description: 'Show a picture scene (a park with one dog, one tree, some children).
          First mention: I see a dog (indefinite). Second mention: The dog is brown
          (now definite). Students practice the first-mention/second-mention pattern.'
        duration: 15
        name: A vs. The Picture Game
        type: oral-drill
      - description: Give 10 Swahili sentences without articles. Students translate
          to English, consciously deciding whether each noun needs a, an, the, or
          no article. Include both specific and generic contexts.
        duration: 20
        name: Swahili-to-English Translation with Articles
        type: translation
      - description: 'Give students a list of 20 nouns (half countable, half uncountable).
          Students sort them into two columns and write sentences using each correctly.
          Common Swahili trouble words: information, advice, furniture, luggage, research.'
        duration: 15
        name: Uncountable Noun Sort
        type: matching
      how_to_explain: 'Start by telling students: Swahili has no words for a or the.
        English does, and you need them. Write on the board: Ninataka kitabu and ask:
        Is this any book or a specific book? Students will say it depends on context.
        Then show: English forces you to choose: a book (any) or the book (specific
        one). Use a physical demonstration: hold up a random book and say I want a
        book, then point to a specific book and say I want the book.'
      sequencing: 'Week 1: Indefinite article a/an with singular countable nouns.
        Week 2: Definite article the for specific reference. Week 3: Zero article
        with uncountable and plural generic nouns. Week 4: Contrastive practice --
        when to use a, the, or nothing.'
      where_to_start: 'Begin with the indefinite article a/an using simple singular
        countable nouns. Use the one thing test: if you can put one before the noun,
        you need a. Show: I have one book = I have a book. Then move to the definite
        article the using the which one? test.'
    tier: 1
    why_it_happens: 'Swahili has no article system whatsoever. Definiteness and indefiniteness
      are inferred from context, word order, or demonstratives -- not from dedicated
      grammatical words. For example, Ninataka kitabu can mean I want a book or I
      want the book depending entirely on context. There is no Swahili word equivalent
      to a or the. When Swahili speakers learn English, they must acquire an entirely
      new grammatical category that has no counterpart in their L1. The indefinite
      article is typically harder to acquire than the definite article because the
      concept of marking indefiniteness is foreign. Additionally, Swahili speakers
      may use demonstratives like hii (this) or hiyo (that) to mark specificity, leading
      to confusion about when the is required in English. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
