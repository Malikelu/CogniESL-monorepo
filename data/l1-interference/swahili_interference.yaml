    teacher_tips:
      exercises:
      - description: Give students a list of 20 words with consonant clusters (street,
          blue, glass, problem, spring, clean, black, friend, dream). Students practice
          saying each word without epenthetic vowels. Teacher models first.
        duration: 15
        name: Cluster Buster
        type: oral-drill
      - description: Teacher says a word ending in a consonant (cat, desk, film, help,
          stop). Students repeat. Teacher listens for added final vowels and provides
          immediate correction.
        duration: 10
        name: Final Vowel Check
        type: oral-drill
      - description: 'Practice vowel contrasts that do not exist in Swahili: ship/sheep,
          bat/but, pull/pool, full/fool, look/luck. Students listen to recordings
          and identify which word they hear, then practice saying both.'
        duration: 15
        name: Minimal Pair Practice
        type: matching
      - description: 'Use tongue twisters targeting consonant clusters: She sells
          seashells, Red lorry, yellow lorry, Three free throws. Students practice
          at increasing speed.'
        duration: 10
        name: Tongue Twisters
        type: oral-drill
      how_to_explain: 'Say: Swahili syllables go consonant-vowel, consonant-vowel
        -- like a drum beat. English syllables can have clusters: str-, bl-, -sts.
        Your mouth wants to add a vowel between the consonants because that is what
        Swahili does. You need to train your mouth to say the consonants together.
        Demonstrate: say sssssss-treet slowly, then faster, then street. For final
        vowels, say: Swahili words end in vowels: meza, kiti, sahani. English words
        can end in consonants: cat, desk, film. Do not add a vowel at the end.'
      sequencing: 'Week 1: Initial consonant clusters (str, bl, kr, pl, fl). Week
        2: Final consonant clusters (sts, lks, mps, nds). Week 3: Final consonant
        words (cat, desk, film, help). Week 4: Vowel contrasts (ship/sheep, bat/but,
        pull/pool).'
      where_to_start: 'Start with initial consonant clusters: str-, bl-, kr-, pl-,
        fl-. Practice saying them without inserting vowels. Use the slow motion technique:
        say each sound separately, then gradually speed up.'
    tier: 1
    why_it_happens: 'Swahili has a strict CV (consonant-vowel) or V syllable structure
      -- consonant clusters like /str/, /bl/, /kt/ do not occur. Every syllable must
      end in a vowel (except in loanwords that have been adapted). When Swahili speakers
      encounter English words with consonant clusters, they insert epenthetic vowels
      to break them up: street becomes sitiriit, blue becomes bulu. This is a universal
      phonological process called epenthesis, and it occurs because the speakers L1
      phonotactic constraints are applied to L2 production. The Swahili vowel system
      has only five vowels (/a, e, i, o, u/) with no length distinction and no diphthongs,
      so English vowel contrasts like /ɪ/ vs. /i:/ (ship vs. sheep) and /ae/ vs. /ʌ/
      (bat vs. but) are also challenging. These patterns are persistent because phonological
      transfer operates below conscious awareness. McManus (2022): The L1 is always
      active during L2 use cross-language co-activation is constant. Managing L1-L2
      competition requires inhibitory control (Green 1998 Inhibitory Control Model).
      This means L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
