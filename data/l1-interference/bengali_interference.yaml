    why_it_happens: Bengali is strictly verb-final (SOV) with rigid NP ordering. Subjects
      first, objects before verbs, adjectives/genitives precede nouns. Contrasts with
      English SVO producing systematic word order errors.
  negation_postverbal:
    citations:
    - claim: Bengali negative particle na follows the sentential verb in independent
        clauses. In subjoined clauses na precedes. Opposite of English not which precedes
        the main verb with do-support.
      location: Ch.23 Syntax section
      source: Klaiman M.H. (1987) Bengali in B. Comrie (ed.) The World's Major Languages
      tier: 1
    communicative_impact: 3
