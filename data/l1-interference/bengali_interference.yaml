    teacher_tips:
      exercises:
      - description: Translate 15 Bengali SOV sentences to English SVO
        duration: 15
        name: SOV to SVO Translation
        type: translation
      how_to_explain: 'English is SVO: Subject + Verb + Object. Bengali is SOV. Verb
