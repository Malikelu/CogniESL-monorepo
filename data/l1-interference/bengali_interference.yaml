  aspiration_phonemic:
    citations:
    - claim: Bengali has a phonemic aspiration contrast for stops - unaspirated vs
        aspirated pairs p/ph t/th t./t.h k/kh b/bh d/dh d./d.h g/gh. Aspiration tends
        to be suppressed pre-consonantally especially in rapid speech.
      location: Ch.23 Sound System Table 23.2
      source: Klaiman M.H. (1987) Bengali in B. Comrie (ed.) The World's Major Languages
      tier: 1
    communicative_impact: 2
    examples:
    - correct: park
      wrong: bark (confusing voicing with aspiration)
    flagged: false
    frequency: 3
    interference_patterns:
    - communicative_impact: 2
      etiology: interlingual
      example_correct: pair (aspirated) vs bear (voiced)
      example_gloss: Bengali has separate phonemes; English uses allophones
      example_l1: BN /p/ vs /ph/ are separate phonemes
      example_wrong: '*[p] in park where English expects aspiration'
      explanation: English aspiration is allophonic (predictable by position) while
        Bengali aspiration is phonemic (changes meaning).
      flagged: true
      frequency: 3
      pattern: Aspiration phonemic vs allophonic transfer
      persistence: 2
      reliability: B
      tier: 1
    persistence: 2
    source_count: 1
    source_rank: 1
    source_type: reference_grammar
    sources:
    - Klaiman (1987) The World's Major Languages Ch.23
    teacher_tips:
      exercises:
      - description: Minimal pair listening for aspirated and unaspirated stops
        duration: 10
        name: Aspiration Pairs
        type: listening
      how_to_explain: In English voicing distinguishes /p/ from /b/. Hand in front
        of mouth - you feel puff of air with park but not bat. Bengali makes aspiration
        the key difference.
      sequencing: 'Week 1: Voicing vs aspiration. Week 2: Minimal pairs. Week 4: Review.'
      where_to_start: Start with the hand test for aspiration.
    tier: 1
    why_it_happens: Bengali treats aspiration as phonemic (changes meaning) while
      English uses it as allophonic (predictable by position). Bengali speakers map
      their two-way aspiration contrast onto English's two-way voicing contrast.
