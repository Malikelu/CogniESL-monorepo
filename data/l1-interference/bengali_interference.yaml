schema_version: '4.0'
sources:
- citation: 'Swan, M. & Smith (2001) Learner English, 2nd ed. Cambridge University
    Press. Ch. 19: South Asian languages'
  relevance: L1 interference patterns documented for this language group.
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Bengali
  relevance: Bengali phonological and grammatical transfer patterns in English
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Education systems require reform because current outcomes fail to
      meet workforce demands. Evidence from [source] demonstrates that targeted investment
      in [specific area] yields measurable improvements.
    error: '*After discussing many views from different angles and considering various
      aspects of the issue, finally I would like to say that education is very important
      and we should all work together to improve it.'
    explanation: Bengali rhetorical tradition builds toward the conclusion gradually
      with extensive context; English expects the thesis stated directly at the outset
      with evidence-based support.
  - correction: Research by [source] confirms that student-centered pedagogy produces
      better learning outcomes than traditional lecture-based instruction.
    error: '*As the great Rabindranath Tagore said, ''Education is not just filling
      a bucket but lighting a fire,'' so we can all agree that education matters greatly.'
    explanation: Bengali essays often cite literary or scriptural authority as evidence;
      English academic writing privileges empirical data and cited research.
  description: 'Bengali rhetorical tradition, influenced by Sanskrit literary conventions,
    favors a circular or spiral approach to argumentation. Bengali essays often build
    toward the thesis gradually, presenting multiple perspectives and extensive background
    context before stating the main claim. The influence of the Bengali ''prabandha''
    (essay) tradition values literary ornamentation, proverbs, and scriptural or poetic
    references as evidence. English argumentative essays expect a clear thesis in
    the introduction, linear progression, and evidence-based reasoning from cited
    sources. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 7: Bengali speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Society plays a significant role in shaping educational outcomes.
      For example, [one focused example with evidence].
    error: '*Paragraph begins with three examples about family life, then shifts to
      a detail about community, then ends with ''So we can see that society plays
      a big role in education.'''
    explanation: The topic sentence should open the paragraph, not close it. Each
      paragraph should develop one central idea.
  - correction: Split into multiple paragraphs of 80-150 words, each with a clear
      topic sentence and one main idea.
    error: '*A paragraph of 200+ words covering multiple loosely related points without
      a clear unifying idea.'
    explanation: Bengali paragraph structure allows broad, multi-topic development;
      English paragraphs demand unity around a single topic sentence.
  description: 'Bengali paragraphs often follow an inductive pattern, with the topic
    sentence appearing at the end after supporting details have been elaborated. Bengali
    writers may include multiple loosely related ideas within a single paragraph,
    whereas English expects one central idea per paragraph introduced by a clear topic
    sentence. The Bengali prose style values elaboration and tangential expansion,
    which can make English writing feel unfocused. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 7: Bengali speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: The government should invest more in schools. Additionally, teachers
      need better training, and the curriculum requires updating. Furthermore, parental
      involvement is essential.
    error: '*The government should invest more in schools. And also the teachers need
      better training. And also the curriculum should be updated. And also parents
      should be more involved.'
    explanation: Bengali coordinates with 'and' between sentences; English uses subordination,
      varied connectors, and pronoun reference.
  - correction: Since the policy was implemented last year, the results have been
      positive.
    error: '*The policy was implemented last year. To the results have been positive.'
    explanation: '''To'' (so/therefore) as a sentence opener is a Bengali discourse
      transfer; English requires subordinating conjunctions or semicolons.'
  description: 'Bengali writing tends toward overuse of coordinate conjunctions (especially
    ''and'' and ''but'') at the beginning of sentences, reflecting Bengali discourse
    patterns. Bengali writers may underuse subordination and lexical cohesion, creating
    long chains of coordinate clauses. The Bengali discourse marker ''to'' (so/therefore)
    and ''kintu'' (but) are frequently overused as sentence openers in English compositions.
    Bengali writers may also repeat nouns rather than using pronoun reference, making
    English writing feel repetitive. McManus (2022): Writing interference reflects
    learned attention from L1 discourse habits. L1 rhetorical patterns shape how writers
    organize and present arguments in L2. Restructuring these habits requires explicit
    attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 7: Bengali speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: This proposal warrants consideration because [evidence-based reason].
    error: '*It is humbly submitted that the aforementioned proposal may kindly be
      considered by the respected authorities.'
    explanation: Bengali formal writing uses elaborate deference; English academic
      writing values clarity and conciseness over ceremonial politeness.
  - correction: The current policy is ineffective because [specific evidence].
    error: '*The thing is, like, the policy just isn''t working, you know?'
    explanation: Bengali informal register bleeds into English academic writing; English
      requires neutral-to-formal tone.
  description: 'Bengali has a pronounced formal-informal distinction that does not
    map directly onto English register conventions. Bengali academic writing may employ
    elaborate, literary language with Sanskrit-derived vocabulary (tatsama words)
    that, when transferred to English, produces an overly ornate or archaic tone.
    Conversely, Bengali writers may inappropriately use casual language in academic
    contexts. The Bengali convention of using honorific verb forms and elaborate politeness
    markers has no direct English equivalent. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 7: Bengali speakers. Cambridge
    University Press.'
citations:
- claim: Bengali L1 speakers transfer SOV word order, postpositions, and the lack
    of articles from their L1 to English, producing characteristic errors in grammar
    and writing
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Bengali
  tier: 1
  reliability: B
  flagged: false
- claim: Bengali is an SOV language with postpositions, no articles, and a classifier
    system — these typological differences from English predict specific areas of
    learning difficulty
  source: Singleton (2016) Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters.
  tier: 1
  reliability: B
  flagged: false
- claim: Bengali L1 speakers exhibit systematic transfer errors in English article
    usage and verb morphology. James's error typology classifies these as interlingual
    errors arising from mother-tongue influence where the L1 lacks overt articles
    and uses different verbal morphology.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's corpus analysis shows that Bengali L1 transfer patterns differ by
    modality — speakers transfer different structural features in speech versus writing
    because register-specific frequency distributions differ. Understanding these
    register dimensions helps explain why some Bengali L1 errors persist in writing
    but not speech.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5: Description of
    the register categories'
  tier: 2
