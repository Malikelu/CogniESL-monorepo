      example_gloss: 'SOV: I him book gave'
      example_l1: 'BN: Ami take boi dilam (I him book gave)'
      example_wrong: '*I him book gave'
      explanation: 'Transfer from L1: Bengali SOV word order with sentence-final verb.
        English requires SVO.'
      flagged: true
