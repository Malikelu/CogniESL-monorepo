        type: translation
      how_to_explain: 'English questions need inversion: Are you...? Do you...? Bengali
        uses particle ki. Flip subject and auxiliary.'
      sequencing: 'Week 1: Yes/no with be and do. Week 2: Wh-questions. Week 4: Review.'
      where_to_start: 'Start with be-inversion: Are you...?'
