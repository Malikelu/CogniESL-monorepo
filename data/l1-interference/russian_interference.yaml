  articles_advanced:
    interference_patterns:
    - pattern: Definite article overgeneralization
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''Новый дом строится возле кинотеатра'''
      example_gloss: Novyy dom stroyotsya vozle kinoteatra
      example_wrong: New house is building near cinema that is near us.
      example_correct: A new house is being built near the cinema near us.
      explanation: 'Russian has no articles, so speakers omit them where English requires
        them or add them where English omits them (school, church, bed). frequency:
        4 persistence: 3 communicative_impact: 3 etiology: interlingual flagged: false
        tier: 3'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Article omission with abstract nouns
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''У вас есть мать?'''
      example_gloss: U vas yest' mat'?
      example_wrong: Have you mother?
      example_correct: Do you have a mother?
      explanation: 'Russian omits articles entirely. English requires a/an with singular
        countable nouns. frequency: 3 persistence: 2 communicative_impact: 2 etiology:
        interlingual flagged: false tier: 3 why_it_happens: Russian has no article
        system whatsoever. Definiteness is expressed through word order, context,
        and demonstrative pronouns. This makes articles one of the most persistent
        error patterns for Russian learners.'
      how_to_explain: '"Teach: English omits articles before school, church, bed,
        work, home (when used in their primary sense). First mention -> a/an. Listener
        knows which one -> the." where_to_start: Start with the most common article
        errors from Swan & Smith. sequencing: "Week 1: Articles with institutions.
        Week 2: Articles with abstract nouns. Week 3: Review." flagged: false tier:
        3'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: 'Difficulty hierarchy: textual-the easiest, referential-a hardest'
      frequency: 5
      persistence: 5
      communicative_impact: 3
      example_l1: 'PL: Książkę kupiłem yesterday'
      example_gloss: Book-Acc I-bought yesterday
      example_wrong: I bought book yesterday. *(referential a = hardest)
      example_correct: I bought a book yesterday.
      explanation: 'Ekiert & Han: Referential-a (1st mention of specific)
        is hardest for Slavic learners. Textual-the (anaphoric, already mentioned)
        is easiest because learners can track known referents in discourse.'
      etiology: conceptual_transfer
      flagged: true
      tier: 3
      reliability: B
    - pattern: Situational-the requires encyclopedic knowledge not available from
        L1
      frequency: 4
      persistence: 4
