    interference_patterns:
    - pattern: Possessive formation error
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''книга мальчика'''
      example_gloss: kniga mal'chika
      example_wrong: the book of the boy
      example_correct: the boy's book
      explanation: 'Russian uses the genitive case for possession (''''книга мальчика''''
        = book of the boy). English uses ''''s for people and proper nouns, ''''of''''
        for things. Russian speakers overuse ''''of''''-phrases where animate/proper
        noun possessives are the norm. frequency: 3 persistence: 2 communicative_impact:
        2 etiology: interlingual flagged: false tier: 3 why_it_happens: Russian uses
        the genitive case for possession (''''книга мальчика'''' = book of boy-genitive).
        English uses ''''s for people and proper nouns, ''''of'''' for things. Russian
        speakers overuse ''''of''''-phrases where animate/proper noun possessives
        are the norm in English.'
      how_to_explain: '"Teach: Use ''s for people (John''s book, the boy''s book).
