        Russian also lacks auxiliary ''''do'''' for negation, leading to ''''I no
        like it'''' instead of ''''I don''t like it.'''' Russian speakers also struggle
        with negative questions (''''Don''t you know...?'''' for ''''Do you know...?'''')
        and short answers.'
      how_to_explain: '"Teach: One negative per clause. I don''t have any (not I don''t
        have no). I have no money (correct single negation). Russian ''не'' goes before
        the verb; English needs ''do + not'' + verb." where_to_start: Start with not...any.
