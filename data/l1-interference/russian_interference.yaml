    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional fit'
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns of Language Learning
      location: Various chapters
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      source: Odlin, T. Explorations of Language Transfer
      location: Chapters 2-8
      tier: 4
    why_it_happens: 'Comrie (2009): Russian passive is much rarer than English. Where English uses passive for topicalization, Russian more freely uses free word order. Additionally, Russian requires impersonal constructions with force-of-nature subjects. The fit between semantic roles and grammatical relations is much closer in Russian than in English.'
