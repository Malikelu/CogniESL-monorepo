    - pattern: Literal translation of idioms
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''Он очень умный человек'' (lit. He very smart person)'
      example_gloss: On ochen' umnyy chelovek
      example_wrong: He is so clever man.
      example_correct: He is such a clever man.
      explanation: 'Russian idioms and collocations don''t translate literally. Swan
        & Smith note ''''so/such'''' confusion: ''''He is so clever man'''' instead
        of ''''He is such a clever man.'''' Also ''''It is such difficult'''' instead
