    why_it_happens: 'Comrie (2009): Russian has an additional parameter in nominal declension absent from English: animacy. The accusative case of animate nouns is identical to the genitive, creating homophony that does not exist for inanimates. Combined with adjective agreement in three categories (gender, number, case), this makes Russian nominal morphology far more complex than English.'
