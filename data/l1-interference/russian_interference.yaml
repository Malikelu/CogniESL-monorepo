    why_it_happens: 'Russian has no articles, so speakers omit them where English
      requires them or add them where English omits them (school, church, bed). frequency:
      4 persistence: 3 communicative_impact: 3 etiology: interlingual flagged: false
      tier: 3 Russian omits articles entirely. English requires a/an with singular
      countable nouns. McManus (2022) explains that L2 speakers can learn new form-meaning
      mappings that don''t exist in L1, but this requires extensive practice to become
      automatic. L2 learning involves creating new knowledge when L1-L2 differences
      exist AND developing selection mechanisms to manage competing knowledge sources
      (McManus 2022, Ch. 1). Online anticipatory processing develops only with high
      proficiency and extended exposure. Slavic speakers show a clear difficulty hierarchy
      for English articles: textual the (easiest) < structural the < nonreferential
      a < situational the < referential a (hardest). textual the is easiest because
      learners can track discourse referents; referential a is hardest because learners
      must conceptualize a specific entity new to the discourse; situational the is
      2nd hardest because it requires encyclopedic/real-world knowledge. Ekiert & Han. In Slavic languages, definiteness is expressed
      through word order, verbal aspect (perfective vs imperfective), case marking,
      demonstratives, possessives, and pragmatic context rather than through articles.
      This means Slavic learners must not only learn article forms but also restructure
      how they conceptualize and signal definiteness. What appears to be an article
      error may actually reflect conceptual differences in how referents are construed
      (Tabakowska 1993, cited in Ekiert & Han). Odlin (Ch.2): "Transfer" term predates
      behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation,
      automaticity, entrenchment — explain transfer patterns. Weinreich and Lado both
      focused on crosslinguistic similarities/differences; CAH (Contrastive Analysis
      Hypothesis) was coined by Wardhaugh (1970), not Lado or Fries. Odlin (Ch.3):
      Languages with rich case systems may show COVERT transfer — the absence of expected
      English prepositions reflects L1 influence. Finnish (15 cases) learners omit
      obligatory English prepositions because Finnish uses nominal case inflections
      instead. Similar patterns expected for other case-system L1s transferring case-based
      strategies to English preposition use.'
