    why_it_happens: 'Comrie (2009): In Russian, word order of major constituents is governed by pragmatic principles (topic-first, focus-last), not by grammatical relations. Russian case morphology nearly always provides unique recovery of grammatical relations, even with scrambled order. English relies on word order (SVO) to signal grammatical relations — a fundamental typological difference.'
