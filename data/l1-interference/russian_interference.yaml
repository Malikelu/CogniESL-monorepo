  zero_copula:
    interference_patterns:
    - pattern: Omitting "be" in present tense predications -> Include "is/am/are"
      example_wrong: Viktor student.
      example_correct: Viktor is a student.
      explanation: 'Comrie (2009): In Russian copular constructions in the present tense, there is usually a zero copula — no word for "is/am/are" in present tense. Example: "Viktor student" = "Viktor is a student." In other tenses, an overt copula appears: "Viktor was a student." (Comrie, Ch. 15, p. 274)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, p. 274.'
      reliability: B
    - pattern: Adding "be" with predicate adjective (unnecessary insertion) -> Use copula only where required
      example_wrong: He is be happy.
      example_correct: He is happy.
      explanation: 'Comrie (2009): Russian zero copula can cause overcompensation — once learners know "be" is required, they may insert it where English would omit it (e.g., with predicate adjectives in certain constructions).'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, p. 274.'
      reliability: B
    citations:
    - claim: Russian has zero copula in present tense
