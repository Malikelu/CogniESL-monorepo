  articles_absent:
    interference_patterns:
    - pattern: Omitting all articles -> Use a/an/the appropriately
      example_wrong: I bought book yesterday.
      example_correct: I bought a book yesterday.
      explanation: 'Comrie (2009): Russian lacks equivalents to English definite and indefinite articles. A Russian noun phrase like "sobaka" can mean "a dog" or "the dog" depending on context. Russian speakers must learn the entire English article system from scratch.'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 274-275.'
      reliability: B
    - pattern: Using article where Russian context would omit -> Use zero article
      example_wrong: I went to the school. (when meaning school as institution)
      example_correct: I went to school.
      explanation: 'Comrie (2009): Since Russian has no articles at all, speakers overgeneralize by adding "the" to all specific noun phrases (transferring definiteness marking), or omit articles where English requires them (e.g., indefinite reference).'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 274-275.'
      reliability: B
