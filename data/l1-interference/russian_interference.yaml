  pragmatic_word_order:
    interference_patterns:
    - pattern: Rearranging English word order for emphasis (like Russian) -> Use stress/intonation instead
      example_wrong: To the store went I yesterday. (attempting emphasis)
      example_correct: Yesterday I went to THE STORE. (stress for emphasis, SVO maintained)
      explanation: 'Comrie (2009): Russian word order is pragmatically determined: the topic comes first, the focus (new information) comes last. Any grammatical permutation of major constituents produces a grammatical sentence with the same truth conditions. English relies on stress and intonation for emphasis while generally maintaining SVO. (Comrie, Ch. 15, pp. 290-292)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 290-292.'
      reliability: B
    - pattern: Assuming any word order is acceptable in English -> Maintain SVO
      example_wrong: Book the I read yesterday.
      example_correct: I read the book yesterday.
      explanation: 'Comrie (2009): Russian morphology provides unique recovery of grammatical relations despite free word order (case endings show who does what). English morphology is insufficient to disambiguate — word order IS the grammar. "Viktor meets Lena" can be rearranged 6 ways in Russian (all grammatical with same meaning), but only SVO works in English. (Comrie, Ch. 15, pp. 290-291)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 290-291.'
      reliability: B
    citations:
    - claim: 'Russian word order is pragmatically determined: topic-first, focus-last'
