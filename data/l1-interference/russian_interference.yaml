      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional fit'
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns of Language Learning
      location: Various chapters
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      source: Odlin, T. Explorations of Language Transfer
      location: Chapters 2-8
