  animacy_case:
    interference_patterns:
    - pattern: Using subject pronouns for objects of animate beings -> Use object pronouns
      example_wrong: I saw he. (about a person)
      example_correct: I saw him.
      explanation: 'Comrie (2009): In Russian, animate nouns (humans and animals) and their adjectives have accusative case identical to genitive: "old elephant-accusative" = "old elephant-genitive." For inanimates, accusative = nominative. This animacy split in case marking means animates follow different transfer patterns from inanimates, making English pronoun case marking harder to learn. (Comrie, Ch. 15, pp. 268-269)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 268-269.'
      reliability: B
    - pattern: Confusing gender and case of adjectives -> English adjectives are invariant
      example_wrong: She is more beautifuler than him. (reflecting Russian adjective declension complexity)
      example_correct: She is more beautiful than him.
      explanation: 'Comrie (2009): Russian adjectives agree in gender, number, AND case — a triple agreement system. Attributive adjectives have 24+ forms. English adjectives never change. The loss of this entire agreement system in English causes overcorrection and simplification errors. (Comrie, Ch. 15, pp. 270-272)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 270-272.'
      reliability: B
    citations:
    - claim: Russian animate nouns have accusative=genitive; inanimates have accusative=nominative
