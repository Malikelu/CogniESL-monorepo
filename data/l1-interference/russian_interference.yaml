      explanation: 'Russian has no perfect or past progressive tenses. One simple
        past form covers both. English requires past perfect for sequencing in reported
        speech. frequency: 4 persistence: 4 communicative_impact: 3 etiology: interlingual
        flagged: false tier: 3 why_it_happens: Russian has only three tenses (past,
        present, future) and expresses completion through aspect (perfective/imperfective)
        via prefixes. English has 12+ tense-aspect combinations. Russian speakers
        default to simple past.'
      how_to_explain: '"Teach: yesterday/last week/in 2010 -> Simple Past. ever/never/already/yet
        -> Present Perfect. Russian packages completion into the verb prefix; English
        packages it into auxiliary structures (have + -ed)." where_to_start: Start
        with simple past. Then teach present perfect. Then contrast. sequencing: "Week
