  modal_verbs_advanced:
    interference_patterns:
    - pattern: Modal verb confusion
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''Я могу это сделать'''
      example_gloss: Ya mogu eto sdelat'
      example_wrong: I can to do it.
      example_correct: I can do it.
