      example_wrong: I have two book.
      example_correct: I have two books.
      explanation: 'Comrie (2009): Russian has complex case government after numerals. After "two," "three," "four," the noun goes into GENITIVE SINGULAR. After "five" and above, the noun is GENITIVE PLURAL. The Russian numerals 2-4 derive historically from the dual number. Since these Russian forms are singular, learners may transfer singular noun forms to English after all numerals. (Comrie, Ch. 15, pp. 288-290)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 288-290.'
      reliability: B
    - pattern: Overgeneralizing singular noun after numeral (transferring Russian genitive singular) -> Use plural after all English numerals
      example_wrong: five book, ten girl
      example_correct: five books, ten girls
      explanation: 'Comrie (2009): Russian numerals "five" and above govern genitive plural. Since this is already plural in Russian, speakers may not realize English also requires the plural marker. The historical origin explains the split: "five" and above behave as measure nouns in Russian. (Comrie, Ch. 15, pp. 288-290)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 288-290.'
      reliability: B
