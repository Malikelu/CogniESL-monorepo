  reflexive_constructions:
    interference_patterns:
    - pattern: Omitting "-self" or reflexive pronoun where English requires it -> Add reflexive
      example_wrong: The door closed. (indicating the door closed by itself)
      example_correct: The door closed itself.
      explanation: 'Comrie (2009): When English uses an intransitive verb with a patient subject ("the door closed"), Russian MUST mark this with the reflexive clitic -sja/-s'' ("dver'' zakrýlas''"). The Russian reflexive -sja is obligatory where English has no corresponding marker. (Comrie, Ch. 15, p. 294)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, p. 294.'
      reliability: B
    - pattern: Overusing "be + past participle" as passive -> Use active intransitive instead
      example_wrong: The book was appeared in 1990.
      example_correct: The book appeared in 1990. / The book was published in 1990.
      explanation: 'Comrie (2009): Russian marks intransitive-patient constructions with reflexive -sja while English leaves them unmarked. This causes confusion: learners may add unnecessary reflexives or miss that English has a distinct active-intransitive construction. The door closed (English) vs. dver'' zakrýlas'' (Russian, literally "door closed-itself"). (Comrie, Ch. 15, p. 294)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, p. 294.'
      reliability: B
    citations:
    - claim: Russian requires reflexive clitic -sja/-s'' on all intransitive patient-subject verbs where English has no marker
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge.'
      location: Ch. 15, p. 294
      tier: 1
      reliability: B
      flagged: false
    - claim: Russian semantics-to-syntax mapping is stricter than English
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge.'
      location: Ch. 15, pp. 292-294
      tier: 1
      reliability: B
      flagged: false
