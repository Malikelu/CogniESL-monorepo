        (many/much) is used for both countable and uncountable nouns. English distinguishes
        ''''many'''' (countable) from ''''much'''' (uncountable). Russian speakers
        also overuse ''''many'''' and ''''much'''' in affirmative sentences where
        English prefers ''''a lot of'''' or ''''plenty of.'''' Swan & Smith note:
