  passive_rare:
    interference_patterns:
    - pattern: Avoiding passive voice in contexts requiring it -> Use English passive
      example_wrong: People speak English all over the world.
      example_correct: English is spoken all over the world.
      explanation: 'Comrie (2009): Russian passive construction "Lena was met by Viktor" (Lena byla vstrechena Viktorom) is much less frequently used than English passive — it serves primarily as an indicator of literary style. Russian often uses active constructions or impersonal sentences where English requires passive. (Comrie, Ch. 15, pp. 292-293)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 292-293.'
      reliability: B
    - pattern: Using impersonal constructions where English requires passive -> Restructure as passive
      example_wrong: It killed the soldier by lightning.
      example_correct: The soldier was killed by lightning.
      explanation: 'Comrie (2009): Russian requires impersonal (subjectless) constructions for natural force subjects: "soldata ubilo molnej" (the soldier-acc killed neuter lightning-instrumental). Russian does the opposite of English — English allows "Lightning killed the soldier" but Russian forces the impersonal. This leads to overuse of impersonal constructions in English. (Comrie, Ch. 15, pp. 292-294)'
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge. Ch. 15, pp. 292-294.'
      reliability: B
    citations:
    - claim: Russian passive is much less frequently used than English; serves primarily as indicator of literary style
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge.'
      location: Ch. 15, pp. 292-293
      tier: 1
      reliability: B
      flagged: false
    - claim: Russian natural-force subjects require impersonal constructions; English allows nominative subjects
      source: 'Comrie, B. (1987). "Russian." In The World''s Major Languages, ed. B. Comrie. Routledge.'
      location: Ch. 15, pp. 292-294
      tier: 1
      reliability: B
      flagged: false
