  negation_advanced:
    interference_patterns:
    - pattern: Double negation
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''Я ничего не знаю'''
      example_gloss: Ya nichego ne znayu
      example_wrong: I don't know nothing.
      example_correct: I don't know anything. / I know nothing.
      explanation: 'Russian is a negative concord language: ''''Я ничего не знаю''''
        (I nothing not know) is perfectly grammatical. English follows single negation:
        only one negative element per clause. Russian speakers produce ''''I don''''t
        know nothing'''' and ''''I no like it'''' because Russian negation simply
        places ''''не'''' before the verb without auxiliary ''''do.'''' frequency:
