  relative_clauses_advanced:
    interference_patterns:
    - pattern: Use of 'what' as relative pronoun
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: 'Russian: ''Люди, которые пришли, мне не нравятся'''
      example_gloss: Lyudi, kotorye prishli, ne ne nravyatsya
      example_wrong: The people which came I no like.
      example_correct: I do not like the people who came.
      explanation: 'Russian uses ''''который'''' (kotoryy) for all relative clauses,
        declining for gender, number, and case. In informal Russian, ''''что'''' (what)
        is often used instead, leading to ''''the book what I read.'''' English distinguishes
        ''''who'''' (people), ''''which'''' (things), and ''''that'''' (both). frequency:
        3 persistence: 3 communicative_impact: 2 etiology: interlingual flagged: false
        tier: 3 why_it_happens: Russian uses ''''который'''' (kotoryy) for all relative
        clauses, declining for gender, number, and case. In informal Russian, ''''что''''
        (what) is often used instead. English distinguishes ''''who'''' (people),
        ''''which'''' (things), and ''''that'''' (both). Russian speakers may also
        use ''''which'''' for people because ''''который'''' covers both.'
      how_to_explain: '"Teach: Use ''that'' or ''which'' for things, ''who'' for people.
        Never use ''what'' as a relative pronoun. Russian ''который'' = all three,
        but English splits them up." where_to_start: Start with that/which/who. Then
        teach restrictive vs non-restrictive. sequencing: "Week 1: That/which/who.
        Week 2: Restrictive vs non-restrictive. Week 3: Omitting relative pronouns.
        Week 4: Review." flagged: false tier: 3'
