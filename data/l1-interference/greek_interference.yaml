  greek_negation:
    assessment: 'Expert-evaluated for L1 transfer severity - Greek. Negation is the
      highest-priority error category: high frequency, high persistence, and high
      communicative impact.'
    citations:
    - claim: Interference pattern for greek negation
      location: 'Chapter: Greek speakers, pp. 127-142'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: greek negation'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    communicative_impact: 4
    examples:
    - correct: I do not like coffee.
      explanation: Greek "Den mou aresei o kafes" places the negation particle directly
        before the verb. English requires the auxiliary "do" + "not" + base verb.
      wrong: I not like coffee.
    - correct: He did not come to the party.
      explanation: 'Greek "Den irthe" negates the past tense directly. English requires
        "did not" + base form (not past form). Note: "came" becomes "come" after "did."'
      wrong: He not came to the party.
    - correct: I did not see anybody at the store.
      explanation: Greek double negation "Den ida kanenan" (not + nobody) is grammatically
        correct. English requires "not + anybody" (single negation).
      wrong: I did not see nobody at the store.
    - correct: I never go there.
      wrong: I never goes there.
    flagged: false
    frequency: 5
    individually_assessed: true
    interference_patterns:
    - communicative_impact: 4
      etiology: interlingual
      example_correct: 'erroneous English: "I not eat meat" instead of "I do not eat
        meat'
      example_gloss: Not I-eat meat
      example_l1: 'Greek: ''Den troo kreas'''
      example_wrong: 'literal: "Not I-eat meat'
      explanation: 'Transfer from L1: Greek negation particle "den" attaches directly
        to verb without auxiliary -> do-support omission.'
      flagged: true
      frequency: 5
      pattern: Greek negation particle "den" attaches directly to verb without auxiliary
        -> do-support omission
      persistence: 4
      reliability: B
      tier: 3
    - communicative_impact: 3
      etiology: interlingual
      example_correct: '"I did not see anybody"'
      example_gloss: not I-saw nobody (double negation is standard)
      example_l1: 'Greek: "Den ida kanenan"'
      example_wrong: '"I did not see nobody"'
      explanation: 'Transfer from L1: Greek is a negative concord language where multiple
        negative elements reinforce rather than cancel each other (Den ida kanenan
        = standard, grammatical). English requires single negation (not + anybody).
        Swan & Smith 2001, Ch. "Greek speakers", § "Grammar", para on negation.'
      flagged: true
      frequency: 4
      pattern: Greek double negation is grammatical -> transfer to English double
        negation
      persistence: 4
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: '"I never go there"'
      example_gloss: never not I-go there (reinforced negation)
      example_l1: 'Greek: "Pote den pao ekei"'
      example_wrong: '"I go never there"'
      explanation: 'Transfer from L1: Greek uses reinforced negation with pote (never)
        + den + verb. English places negative adverbs before the main verb (I never
        go there). Swan & Smith 2001, Ch. "Greek speakers", § "Grammar", para on negation
        and time expressions.'
      flagged: true
      frequency: 3
      pattern: Greek negation with "pote/pouthen/tipota" (never/nothing/nowhere) requires
        "den" -> negative adverb placement errors
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: '"Don''t eat that!"'
      example_gloss: not you-eat (negated subjunctive for prohibition using "min"
        not "den")
      example_l1: 'Greek: "Min tros"'
      example_wrong: '"Not eat that!"'
      explanation: 'Transfer from L1: Greek uses "min" + subjunctive for prohibitions,
        a different negation particle from "den". English uses "don''t" + base verb
        for negative imperatives. Swan & Smith 2001, Ch. "Greek speakers", § "Grammar",
        para on negation.'
      flagged: true
      frequency: 3
      pattern: Greek "den" + subjunctive for prohibitions -> imperative negation errors
      persistence: 3
      reliability: B
      tier: 1
    notes: Greek negation particle "den" attaches directly to the verb with no auxiliary.
      Greek is a negative concord language (double negation is grammatical). These
      two features produce the most frequent and most persistent errors for Greek
      learners of English.
    persistence: 4
    source_count: 7
    source_rank: 1
    source_type: peer-reviewed
    sources:
    - 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
      and Other Problems (2nd ed.). Cambridge University Press. Greek section on negation
