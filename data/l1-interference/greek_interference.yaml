language: greek
language_code: el
schema_version: '4.0'
etiology:
- claim: 'Jarvis & Pavlenko (2008) identify eight conceptual domains where crosslinguistic
    influence occurs: objects, emotions, personhood, gender, number, time, space,
    and motion. L1 conceptual categories influence how L2 learners perceive and categorize
    reality.'
  conceptual_transfer: true
  factors_affecting_transfer:
  - proficiency_level
  - perceived_crosslinguistic_distance
  - recency_of_L2_use
  - markedness
  - L2_status_effect
  - cognitive_maturity
  - attention_to_language_form
  flagged: false
  reliability: B
  source: Jarvis & Pavlenko (2008) Crosslinguistic Influence in Language and Cognition.
    Routledge. Chapters 4-5.
  tier: 2
grammar_points:
  adverbs_advanced:
    citations:
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    examples:
    - correct: He speaks English well.
      wrong: He speaks English good.
    exercises:
    - description: 15 sentences choosing correct form.
      duration: 10
      name: Adjective or Adverb
      type: fill-in-the-blank
    flagged: false
    interference_patterns:
    - communicative_impact: 2
      etiology: interlingual
      example_correct: He speaks English well.
      example_gloss: null
      example_wrong: He speaks English good.
      explanation: Greek may not distinguish morphologically between adjectives and
        adverbs. English requires -ly for most adverbs.
      flagged: true
      frequency: 4
      pattern: Adjective used as adverb
      persistence: 3
      reliability: B
      tier: 3
    source_count: 4
    sources:
    - Swan & Smith (2001) Learner English
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      how_to_explain: 'Teach: Adjective describes a noun. Adverb describes a verb.
        Most adverbs add -ly. Good -> well (irregular).'
      sequencing: 'Week 1: -ly adverbs. Week 2: Exceptions (fast, hard, late). Week
        3: Good vs well. Week 4: Review.'
      where_to_start: Start with the -ly rule. Then teach exceptions.
    tier: 3
    why_it_happens: 'Greek may use the same form for adjectives and adverbs. English
      requires -ly for most adverbs. McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries. Odlin (Ch.5, Ch.6): Focus
      constructions (clefts, word-order shifts, focus particles) show crosslinguistic
      influence. Transfer depends on BOTH structural similarity AND frequency of L1
      use. Languages with productive focus-fronting or distinctive cleft patterns
      will show transfer in English cleft usage. Affective meanings in focus constructions
      may be language-specific and difficult to translate.'
  article_noun_agreement:
    assessment: Expert-evaluated for L1 transfer severity - Greek. Article-noun agreement
      transfer is high-frequency but moderate communicative impact; it is a persistent
      marker of Greek L1 in written English.
    citations:
    - claim: Interference pattern for article noun agreement
      location: 'Chapter: Greek speakers, pp. 127-142'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: article noun agreement'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    communicative_impact: 2
    examples:
    - correct: Love is the most important thing in life.
      explanation: Greek uses the definite article with abstract nouns (I agapi) and
        in generic statements. English uses zero article for abstract nouns used generically.
      wrong: The love is the most important thing in the life.
    - correct: Patience is a virtue.
      explanation: Greek "I ipomoni ine areti" uses the definite article with the
        abstract noun. English does not use "the" with abstract nouns in generic statements.
      wrong: The patience is a virtue.
    - correct: Water is essential for life.
      explanation: Greek "To nero ine aparaitito gia ti zoi" uses definite articles
        with both the uncountable noun and the abstract noun. English uses zero article
        for generic statements.
      wrong: The water is essential for the life.
    - correct: I went to school to pick up the children.
      explanation: Greek "Piga sto scholio" uses the definite article with institutions.
        English drops "the" when referring to the primary purpose of a place (go to
        school = as a student).
      wrong: I went to the school to pick up the children.
    flagged: false
    frequency: 4
    individually_assessed: true
    interference_patterns:
    - communicative_impact: 1
      etiology: interlingual
      example_correct: '"Gold is very expensive" / "Honesty is a great virtue"'
      example_gloss: the man (masc), the woman (fem), the child (neut) - article changes
        with gender
      example_l1: 'Greek: "o anthropos" (masc), "i gineka" (fem), "to pedi" (neut)'
      example_wrong: '"The gold is very expensive" / "The honesty is a great virtue"'
      explanation: 'Transfer from L1: Greek articles agree in gender (masc/fem/neuter),
        number, and case with nouns. Greek uses the definite article with abstract
        nouns and in generic statements where English uses zero article. Swan & Smith
        2001, Ch. "Greek speakers", § "Articles", point 1.'
      flagged: true
      frequency: 2
      pattern: Greek articles agree in gender/case/number with nouns -> over-differentiation
        of English "the"
      persistence: 2
      reliability: B
      tier: 1
    - communicative_impact: 2
      etiology: interlingual
      example_correct: '"Freedom is important"'
      example_gloss: the freedom is important (definite article with abstract noun)
      example_l1: 'Greek: "I eleftheria ine simantiki"'
      example_wrong: '"The freedom is important"'
      explanation: 'Transfer from L1: Greek uses the definite article with abstract
        nouns (I eleftheria = "the freedom"). English uses zero article for abstract
        nouns in generic statements. Swan & Smith 2001, Ch. "Greek speakers", § "Articles",
        point 1.'
      flagged: true
      frequency: 4
      pattern: Greek uses definite article with abstract/generic nouns -> overuse
        of "the" with English generics
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 2
      etiology: interlingual
      example_correct: '"The boy''s coat is on the chair"'
      example_gloss: the-of-boy the coat (genitive article + noun + nominative article
        + noun)
      example_l1: 'Greek: "Tu agoriou to palto"'
      example_wrong: '"Boy coat is on chair"'
      explanation: 'Transfer from L1: Greek article-noun agreement in all cases creates
        complex noun phrases with multiple articles (Tu agoriou to palto). Greek learners
        may omit articles in English complex noun phrases. Swan & Smith 2001, Ch.
        "Greek speakers", § "Articles", para on agreement.'
      flagged: true
      frequency: 3
      pattern: Greek article-noun agreement in all cases -> article omission in complex
        noun phrases
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 2
      etiology: interlingual
      example_correct: '"Peter is my friend"'
      example_gloss: the Peter is friend my (The Peter is my friend)
      example_l1: 'Greek: "O Petros ine filos mou"'
      example_wrong: '"The Peter is my friend"'
      explanation: 'Transfer from L1: Greek uses the definite article with proper
        names (o, i, to before names). Transferring this to English produces "The
        Peter is my friend." Swan & Smith 2001, Ch. "Greek speakers", § "Articles",
        point 2.'
      flagged: true
      frequency: 4
      pattern: Greek uses definite article with proper nouns and institutions -> overuse
        of "the"
      persistence: 3
      reliability: B
      tier: 1
    notes: Greek article-noun agreement (gender/case/number) leads to overuse of "the"
      in generic/abstract contexts and article omission in complex noun phrases. This
      is closely related to the definite_article_greek grammar point but focuses on
      the agreement mechanism rather than article selection rules.
    persistence: 3
    source_count: 7
    source_rank: 1
    source_type: peer-reviewed
    sources:
    - 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
      and Other Problems (2nd ed.). Cambridge University Press. Greek section on article
      and agreement transfer.'
    - Agathopoulou, E. (2005). The acquisition of the English article system by Greek
      learners of English. Journal of Greek Linguistics, 6(1), 45-62.
    - 'Ionin, T., Ko, H., & Wexler, K. (2004). Article semantics in L2 acquisition:
      The role of specificity. Language Acquisition, 12(1), 3-69.'
    - 'Master, P. (1997). The English article system: Acquisition, function, and pedagogy.
      System, 25(2), 215-232.'
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: Provide a 250-word text written by a fictional Greek learner,
          with 20 unnecessary "the" articles inserted (e.g., "The happiness is more
          important than the money. The people who live in the poverty need the help.").
          Students must identify and cross out every unnecessary "the." Compare answers
          and discuss each deletion.
        duration: 20
        name: The Deletion Game
        type: error-correction
      - description: 'Give students 20 sentences with "the" - some correct, some incorrect.
          Students must decide whether each sentence is correct or incorrect, and
          if incorrect, whether to add or remove "the." Example: "The coffee keeps
          me awake" (could be specific or generic - discuss the difference).'
        duration: 15
        name: Generic or Specific?
        type: matching
      - description: 'Students write a 100-word paragraph about an abstract concept
          (love, freedom, happiness, education, patience) WITHOUT using "the" before
          abstract nouns. Peer review: partners check for unnecessary "the" and discuss
          each case.'
        duration: 20
        name: Article-Free Abstracts
        type: composition
      - description: 'Provide 20 sentences with institutions/places where "the" must
          be added or removed. Examples: "She goes to ___ church every Sunday" (zero
          article), "I went to ___ church to fix the roof" (the = building). Students
          fill in "the" or zero article and explain their choice.'
        duration: 15
        name: Institution Article Rule
        type: fill-in-the-blank
      how_to_explain: 'Teach the "Greek Article Overload" concept: "Greek uses THE
        many more times than English. Your job is to DELETE unnecessary THEs." Create
        a checklist for when to REMOVE "the": (1) Abstract nouns used generally: "Love
        is blind" (not "The love"). (2) Uncountable nouns used generally: "Water is
        essential" (not "The water"). (3) Most proper nouns: "Maria" (not "The Maria").
        (4) Institutions for their primary purpose: "go to school/hospital/church"
        (not "go to the school"). Use a red pen exercise: students cross out unnecessary
        "the" in a Greek learner''s text.'
      sequencing: 'Week 1: Abstract/generic nouns - removing unnecessary "the." Week
        2: Uncountable nouns in generic statements. Week 3: Institutions and places
        (school, hospital, church, prison). Week 4: Proper nouns and geographical
        names. Week 5: Complex noun phrases and article omission. Week 6: Comprehensive
        article review covering all Greek-English article differences.'
      where_to_start: 'Begin with abstract nouns and generic statements, as these
        are the highest-frequency errors. Use the simple rule: "If you are talking
        about the concept in general, no THE." Then move to institutions and proper
        nouns.'
    tier: 1
    why_it_happens: 'The Greek article system requires agreement between the article
      and the noun in gender (masculine/feminine/neuter), number (singular/plural),
      and case (nominative/accusative/genitive). This creates a complex system of
      article forms (o, i, to, tou, tis, ton, tin, ton, tis, ta) that must match the
      noun in all three dimensions. English has a single definite article "the" and
      a single indefinite article "a/an" that do not change form. The complexity of
      the Greek system leads to two types of transfer errors: (1) overuse of "the"
      in contexts where Greek requires it but English does not (abstract nouns, generic
      statements, proper nouns, institutions); and (2) article omission in complex
      noun phrases where the Greek agreement system would require multiple articles.
      The generic use of "the" with abstract nouns is the most frequent and persistent
      error. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries. Odlin (Ch.5, Ch.6): Focus
      constructions (clefts, word-order shifts, focus particles) show crosslinguistic
      influence. Transfer depends on BOTH structural similarity AND frequency of L1
      use. Languages with productive focus-fronting or distinctive cleft patterns
      will show transfer in English cleft usage. Affective meanings in focus constructions
      may be language-specific and difficult to translate.'
