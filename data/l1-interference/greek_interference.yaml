        duration: 20
        name: Do-Support Surgery
        type: transformation
      - description: Set up a mock "court" where students prosecute double negation
          sentences. Provide 15 sentences with double negation (e.g., "I don't have
          no money," "She can't find nothing"). The "prosecutor" explains why the
          sentence is wrong (citing Greek negative concord), the "judge" delivers
          the corrected sentence.
        duration: 20
        name: Double Negation Court
        type: error-correction
      - description: Students work in teams of 4. Each team receives 10 Greek sentences
          (transliterated) with various negation patterns. Student 1 translates literally,
          Student 2 identifies the negation pattern, Student 3 produces correct English,
          and Student 4 checks against a model answer. Rotate roles for each sentence.
        duration: 25
        name: Negation Translation Relay
        type: translation
      - description: 'Provide 20 sentences with a negative adverb (never, hardly,
          seldom, rarely) that must be placed in the correct position. Students race
          to complete them correctly. Example: "I ___ go to that restaurant" (never)
          -> "I never go to that restaurant."'
        duration: 15
        name: Negative Adverb Placement Race
        type: fill-in-the-blank
      how_to_explain: 'Teach negation in three stages. Stage 1: Introduce "do-support"
        as English''s way of "carrying" negation. Use the metaphor: "In Greek, the
        verb wears its own negation badge (den + verb). In English, the verb needs
        a helper (do) to carry the negation." Write the formula: Subject + do/does/did
        + not + BASE VERB. Stage 2: Teach the double negation rule: "In English, one
        negative per clause is enough." Stage 3: Teach negative adverb placement:
        "never," "hardly," "seldom" go BEFORE the main verb.'
      sequencing: 'Week 1: Simple present negation with do/does. Week 2: Simple past
        negation with did. Week 3: Negative concord - fixing double negation errors.
        Week 4: Negative adverbs (never, hardly, seldom) and their placement. Week
        5: Prohibitions and imperatives (Don''t...). Week 6: Integration, error correction,
        and free production.'
      where_to_start: 'Start with simple present negation ("I do not like") as it
        is the most frequent error. Use contrastive pairs: Greek "Den troo" -> English
        "I do not eat" (NOT "I not eat"). Once students master do-support in present,
        extend to past ("did not") and then address double negation.'
    tier: 1
    why_it_happens: 'Greek negation is fundamentally different from English in three
      ways. First, Greek uses a preverbal negation particle "den" that attaches directly
      to the verb without any auxiliary support. English requires the periphrastic
      construction "do/does/did + not + base verb" for simple present and simple past
      negation. Second, Greek is a negative concord language: multiple negative elements
      in a sentence reinforce rather than cancel each other (e.g., "Den ida kanenan"
      = "Not I-saw nobody" is the standard, grammatical form). English is a non-negative-concord
      language where double negation is either ungrammatical or changes meaning. Third,
      Greek has two negation particles: "den" for indicative (statements/questions)
      and "min" for subjunctive/prohibitions, a distinction that has no parallel in
      English. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries. Odlin (Ch.5, Ch.6): Focus
      constructions (clefts, word-order shifts, focus particles) show crosslinguistic
      influence. Transfer depends on BOTH structural similarity AND frequency of L1
      use. Languages with productive focus-fronting or distinctive cleft patterns
      will show transfer in English cleft usage. Affective meanings in focus constructions
      may be language-specific and difficult to translate.'
