      reliability: B
      tier: 1
    source_count: 3
    sources:
    - Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
    teacher_tips:
      how_to_explain: Teach Greek has no infinitive. Greek uses that + verb (na + verb). English uses TO + verb (infinitive). Drill want to go (not want that I go), can swim (not can that I swim).
      sequencing: Week 1 -- verb plus to-infinitive (want, need, like). Week 2 -- modal verbs (can, should, must, try). Week 3 -- verb plus object plus to-infinitive (tell, ask). Week 4 -- review contrasting Greek na structure.
      where_to_start: Start with the most common verbs -- want, need, like, try, can.
    tier: 1
    why_it_happens: Modern Greek lost the infinitive completely by approximately the 16th century, replacing all infinitival complements with finite clauses introduced by the particle ma/na, which take verbs marked for person, number, and tense/aspect (Joseph Ch.19, Section 3). This makes Modern Greek a language where all complement verbs are fully finite -- a typological divergence from the Indo-European norm and convergence with other Balkan languages.

  clitic_doubling_el:
    citations:
    - claim: Modern Greek uses weak clitic pronouns to cross-index definite and specific objects; for some speakers this doubling is obligatory for indirect objects
      location: Ch.19 Section 3-Syntax, lines 26740-26767
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    - claim: Clitic pronoun doubling represents a Balkan areal feature shared with other Balkan languages, not found in English
      location: Ch.19 Section 3-Syntax, lines 26762-26767
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    examples:
    - correct: I saw John. / I gave the book to John.
      wrong: I him saw John. / I gave the book to him John.
    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I gave the book to John.
      example_l1: Greek tou edosa to vivlio ton Gianni (him-gave-I the-book the-John)
      example_wrong: I gave the book to him John.
      explanation: Transfer from L1 -- Greek cross-indexes definite objects with a weak clitic pronoun before the verb (clitic doubling). English places the object only once (Joseph Ch.19, Section 3).
      flagged: true
      frequency: 3
      pattern: Greek clitic pronoun doubling creates redundant object pronouns in English
      persistence: 3
      reliability: B
      tier: 1
    source_count: 2
    sources:
    - Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
    teacher_tips:
      how_to_explain: Teach that in English, the object appears ONCE. Greek doubles it with a small pronoun before the verb. English I saw John (one object). Greek-style WRONG in English -- I him saw John (two references to same person). Drill -- delete the extra pronoun.
      sequencing: Week 1 -- direct objects, no doubling. Week 2 -- indirect objects with to/for plus name. Week 3 -- review with contrastive Greek examples. Week 4 -- error correction.
      where_to_start: Begin with direct objects -- I saw John, not I him saw John.
    tier: 1
    why_it_happens: Modern Greek uses weak clitic pronouns cross-referenced with full noun phrases to mark definiteness and specificity of objects (Joseph Ch.19, Section 3, lines 26740-26767). This clitic doubling is a Balkan areal feature. For some speakers it is obligatory with indirect objects. Greek learners transfer this pattern to English.

  future_tense_el:
    citations:
    - claim: Modern Greek future is formed with the particle ha (from earlier ehei), ultimately derived from the verb have, replacing the ancient synthetic future
      location: Ch.19 Section 2-Morphology, lines 26497-26527
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    - claim: The Greek future periphrasis with have plus infinitive developed during the Hellenistic period and parallels habeo plus infinitive formations in Romance and Balkan Romance
      location: Ch.19 Section 2-Morphology, lines 26500-26527
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    examples:
    - correct: I will write tomorrow.
      wrong: I have that I write tomorrow.
    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I will write tomorrow.
      example_l1: Greek ha grapso (will-write-I)
      example_wrong: I have that I write tomorrow.
      explanation: Transfer from L1 -- Greek forms the future with ha (from have) plus subjunctive verb form, creating a finite-clause structure rather than English modal will plus base verb (Joseph Ch.19, Section 2).
      flagged: true
      frequency: 3
      pattern: Greek have-based future transfers to have that plus verb instead of will plus base verb
      persistence: 3
      reliability: B
      tier: 1
    source_count: 2
    sources:
    - Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
    teacher_tips:
      how_to_explain: Teach that English uses WILL plus base verb (no that, no infinitive marker). Greek uses have-derived particle ha plus a conjugated verb. Drill -- will write, will go, will eat (not have that I write).
      sequencing: Week 1 -- will plus base verb (all persons). Week 2 -- negative (will not/won't). Week 3 -- questions (Will you...). Week 4 -- contrast with Greek ha-structure.
      where_to_start: Start with affirmative -- will plus base verb.
    tier: 1
    why_it_happens: Ancient Greek had a synthetic future tense. In the Hellenistic period this was replaced by periphrastic constructions using have plus infinitive, giving the modern future marker ha plus subjunctive verb form (Joseph Ch.19, Section 2, lines 26497-26527). Greek learners try to map this onto English using have as the auxiliary.

  perfect_system_el:
    citations:
    - claim: Modern Greek formed a new periphrastic perfect -- echei (has) plus a continuation of the old infinitive, which originated from a pluperfect construction
      location: Ch.19 Section 2-Morphology, lines 26466-26495
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    - claim: The Greek perfect system parallels Latin/Romance habeo plus infinitive/participle formations, with possible Balkan Romance contact influence
      location: Ch.19 Section 2-Morphology, lines 26484-26495
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    examples:
    - correct: I have written the letter.
      wrong: I have wrote the letter. / I have written.
    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: She has eaten.
      example_l1: Greek echei fai (has eaten-form)
      example_wrong: She has eat. / She has ate.
      explanation: Transfer from L1 -- Greek perfect uses echei plus an old infinitive form that does not correspond to English past participles. Greek learners produce wrong participle forms (Joseph Ch.19, Section 2).
      flagged: true
      frequency: 4
      pattern: Greek echei-perfect leads to wrong English past participle forms
      persistence: 3
      reliability: B
      tier: 1
    source_count: 2
    sources:
    - Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
    teacher_tips:
      how_to_explain: Teach English perfect -- have/has plus past participle. Common irregulars -- written (not wrote), eaten (not eat/eat), gone (not went). Greek perfect is built differently (echei plus old infinitive), so the participle system must be learned from scratch.
      sequencing: Week 1 -- have/has plus regular past participle. Week 2 -- top 20 irregular participles. Week 3 -- present perfect versus past simple. Week 4 -- error correction.
      where_to_start: Begin with regular participles, then the top 10 irregulars.
    tier: 1
    why_it_happens: Modern Greek rebuilt its perfect system periphrastically -- present of have (echei) plus continuation of the ancient infinitive, originating from a pluperfect formation (Joseph Ch.19, Section 2, lines 26466-26495). This parallels Romance habeo/avere plus infinitive. The Greek perfect participle does not correspond to English past participles, leading to errors.

  indirect_object_el:
    citations:
    - claim: The Greek dative case was lost in the post-classical period; its functions were taken over by the genitive case and by prepositional phrases with se (in, at, to) plus accusative
      location: Ch.19 Section 2-Morphology, lines 26210-26230
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    - claim: Ancient Greek expressed indirect objects with the dative case alone; Modern Greek uses genitive case or se plus accusative prepositional phrases instead
      location: Ch.19 Section 3-Syntax, lines 26714-26715
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    examples:
    - correct: I gave the book to Maria. / I told John.
      wrong: I gave the book the Maria. / I told to John.
    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I gave it to her. / I told him.
      example_l1: Greek to edosa tis Marias (it I-gave the Mary-Gen) or to edosa stin Maria (I-gave to-the Maria)
      example_wrong: I gave it the Maria. / I told to him.
      explanation: Transfer from L1 -- Greek uses genitive case or se plus accusative for indirect objects, not English double-object or to/for patterns (Joseph Ch.19, Sections 2 and 3).
      flagged: true
      frequency: 4
      pattern: Greek genitive/se-plus-accusative for indirect objects creates wrong English indirect object constructions
      persistence: 3
      reliability: B
      tier: 1
    source_count: 2
    sources:
    - Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
    teacher_tips:
      how_to_explain: Teach English indirect objects TWO ways -- (1) verb plus indirect plus direct (gave him the book), (2) verb plus direct plus to/for plus indirect (gave the book to him). Greek uses genitive case or se plus accusative, which does not map directly to English patterns.
      sequencing: Week 1 -- give, tell, show, send (both patterns). Week 2 -- say, explain, describe (always need to). Week 3 -- Greek-English contrast. Week 4 -- error correction.
      where_to_start: Start with give/tell someone something and give/show something TO someone.
    tier: 1
    why_it_happens: Ancient Greek had a dative case for indirect objects. This was lost in the post-classical period; its functions were taken over by the genitive case and by prepositional phrases with se plus accusative (from Ancient Greek eis, into) (Joseph Ch.19, Sections 2 and 3). Neither maps cleanly onto English indirect object constructions.

  comparative_el:
    citations:
    - claim: Modern Greek forms comparatives analytically with the particle pio (more) before the adjective, replacing the ancient synthetic comparative suffix -teros
      location: Ch.19 Section 3-Syntax, lines 26710-26715
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    - claim: The shift from synthetic to analytic comparison is part of the general trend toward analytic expressions across all Modern Greek morphology
      location: Ch.19 Section 3-Syntax, lines 26710-26712
      source: Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
      tier: 1
    examples:
    - correct: This book is better. / She is more beautiful.
      wrong: This book is more good. / She is beautifuller.
    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: This is better. / She is more beautiful.
      example_l1: Greek afto ine pio kalo (this is pio good = more good)
      example_wrong: This is more good.
      explanation: Transfer from L1 -- Greek uses pio plus adjective for ALL comparatives (analytic). English uses -er for short adjectives and more plus adjective for long ones. Greek learners overgeneralize more (Joseph Ch.19, Section 3).
      flagged: true
      frequency: 4
      pattern: Greek analytic comparative (pio plus adj) leads to English overuse of more plus adjective for all comparatives
      persistence: 3
      reliability: B
      tier: 1
    source_count: 2
    sources:
    - Joseph, B. The Greek Language, Ch.19 in The World's Major Languages
    teacher_tips:
      how_to_explain: Teach English has two patterns -- short adjectives (1-2 syllables) get -er (bigger, faster). Long adjectives (2-3 plus syllables) get more plus adjective (more beautiful). Irregulars -- better (not more good), worse (not more bad). Greek uses pio for ALL comparatives, so English rules must be explicitly learned.
      sequencing: Week 1 -- -er comparatives (short adjectives). Week 2 -- more plus long adjectives. Week 3 -- irregulars (better, worse, further). Week 4 -- contrast with Greek pio structure.
      where_to_start: Start with the -er rule for short adjectives, then teach exceptions.
    tier: 1
    why_it_happens: Ancient Greek used synthetic comparative suffixes (-teros, -ion) and suppletive comparatives. Modern Greek shifted entirely to the analytic pattern pio (more) plus adjective for all comparatives (Joseph Ch.19, Section 3, lines 26710-26715), as part of the general move from synthetic to analytic morphology. Greek learners overgeneralize more plus adjective to all English comparatives.


language: greek
schema_version: '4.0'
sources:
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Greek
  relevance: Greek phonological and grammatical transfer patterns
total_grammar_points: 56
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Justice in modern society requires institutional reform. Evidence
      from [source] demonstrates that [specific policy] produces more equitable outcomes.
    error: '*Since the dawn of civilization, humans have grappled with the question
      of justice. Philosophers from Plato to the present have debated its meaning.
      In this essay, I will examine various perspectives on whether justice can be
      achieved in modern society.'
    explanation: Greek rhetorical tradition favors broad philosophical openings; English
      essays expect a clear, specific thesis in the first paragraph.
  - correction: Self-assessment tools in education improve learning outcomes. Research
      by [source] shows that students who engage in structured reflection perform
      [X]% better.
    error: '*As the ancient Greeks knew, ''Know thyself'' -- and so we must look within
      to solve the problems of education today.'
    explanation: Greek essays may invoke classical authority or proverbs as evidence;
      English academic writing requires empirical evidence from cited sources.
  description: 'Greek rhetorical tradition, rooted in classical Greek oratory and
    the Byzantine literary heritage, favors an elaborate, deductive style with extensive
    philosophical framing. Greek essays often begin with broad, abstract introductions
    that delay the thesis, and the Greek ''thesi-antithesi-synthesi'' (thesis-antithesis-synthesis)
    structure may produce essays that English readers perceive as indirect. Greek
    writers may employ rhetorical questions, proverbs, and literary references as
    argumentative strategies, which can seem overly ornate or off-topic in English
    academic writing. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 14: Greek speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Focus each paragraph on one main idea, stated in a topic sentence
      at the beginning, with supporting evidence that directly relates to that idea.
    error: '*A paragraph with multiple clauses connected by ''and,'' ''but,'' and
      ''while,'' covering several loosely related points without a clear unifying
      idea.'
    explanation: Greek paragraphs tolerate multi-strand development; English paragraphs
      demand unity around a single topic sentence.
  - correction: State the main point first, then provide context and supporting evidence.
    error: '*The main point of the paragraph appears in the middle or at the end,
      after several contextual sentences.'
    explanation: Greek paragraphs may build toward the main idea; English paragraphs
      state it upfront.
  description: 'Greek paragraphs tend to be syntactically complex, with multiple subordinate
    clauses and parenthetical insertions that reflect the Greek preference for hypotaxis
    (subordination). Greek writers may develop paragraphs through a series of loosely
    connected sub-points rather than focusing on a single unified idea. The topic
    sentence may appear anywhere in the paragraph, or may be implicit, which can make
    English writing feel disorganized. McManus (2022): Writing interference reflects
    learned attention from L1 discourse habits. L1 rhetorical patterns shape how writers
    organize and present arguments in L2. Restructuring these habits requires explicit
    attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 14: Greek speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: The study found significant results using a sound methodology. However,
      the small sample size represents a notable limitation.
    error: '*The study found significant results. And the methodology was sound. But
      some limitations exist. And the sample size was small.'
    explanation: Greek coordinates between sentences with 'and' and 'but'; English
      uses subordination and varied connectors for smoother flow.
  - correction: The government announced the policy, allocated funding, and expects
      results by 2026.
    error: '*The government announced the policy. The government also allocated funding.
      The government expects results by 2026.'
    explanation: Greek writing often repeats nouns for clarity; English uses pronouns
      and combines sentences to avoid repetition.
  description: 'Greek writers may use connectors in English that reflect Greek discourse
    patterns, including overuse of ''and'' (kai) and ''but'' (alla) at the start of
    sentences. Greek ''epi''si'' (moreover), ''omos'' (however), and ''epomenos''
    (consequently) may be used with frequencies or in positions that sound unnatural
    in English. Greek writers may also underuse pronoun reference, preferring to repeat
    nouns for clarity, which can make English writing feel repetitive. McManus (2022):
    Writing interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 14: Greek speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: This policy requires revision because [specific evidence].
    error: '*It is the considered opinion of the present writer that it would not
      be inappropriate to suggest that the aforementioned policy may possibly require
      some degree of revision.'
    explanation: Greek academic style favors elaborate hedging and nominalizations;
      English academic writing values directness and active constructions.
  - correction: 'The data suggest a clear trend: [specific finding].'
    error: '*We believe that one could argue the data might suggest a possible trend.'
    explanation: Greek academic writing uses extensive hedging to show respect for
      alternative views; English expects confident claims with appropriate qualification.
  description: 'Greek academic writing traditionally values a formal, elevated style
    with extensive use of nominalizations, passive constructions, and complex syntax
    influenced by Katharevousa (puristic Greek). When transferred to English, this
    can produce prose that sounds excessively formal or archaic. Greek writers may
    also overuse hedging and qualification, reflecting the Greek academic convention
    of showing respect for opposing views. The Greek first-person plural (''we'')
    may be overused where English expects ''I'' or impersonal constructions. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 14: Greek speakers. Cambridge
    University Press.'
citations:
- claim: Greek L1 speakers transfer phonological features (/θ/, /ð/ as native sounds),
    grammatical structures (no infinitive, article use), and writing conventions to
    English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Greek
  tier: 1
  reliability: B
  flagged: false
- claim: Greek has a definite article system similar to English but no infinitive
    (uses finite complement clauses instead) — this causes L1 transfer in verb complementation
    patterns
  source: Singleton (2016) Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters.
  tier: 1
  reliability: B
  flagged: false
- claim: Greek L1 speakers' errors in English reflect mother-tongue transfer including
    article overuse (Greek has articles but with different distribution), verb morphology
    simplification, and preposition calques. James's error typology classifies these
    as interlingual errors where partial L1-L2 structural overlap produces complex
    transfer patterns.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's corpus analysis shows that Greek L1 speakers' article overuse errors
    in English reflect register differences — Greek uses articles more extensively
    than English in certain constructions, and this transfer is more visible in academic
    prose where both languages deploy articles frequently.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5.4: Academic prose
    register'
  tier: 2
