      L1s transferring case-based strategies to English preposition use.'
language: Hungarian
language_code: hu
schema_version: '4.0'
sources:
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Hungarian
  relevance: Hungarian phonological and grammatical transfer patterns — agglutinative
    morphology, vowel harmony
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Support arguments with concrete evidence, data, and logical reasoning;
      use figurative language sparingly if at all
    error: '*Using metaphors and figurative language as primary argumentative tools
      in academic essays'
    explanation: Hungarian composition tradition values literary expression in argumentation;
      English academic writing prioritizes evidence-based reasoning over stylistic
      flourish
  - correction: State the thesis explicitly at the end of the introduction, then develop
      it with supporting evidence in body paragraphs
    error: '*Presenting the argument inductively (specific to general) rather than
      deductively (thesis to support)'
    explanation: Hungarian essays may build toward the conclusion; English essays
      are expected to state the thesis upfront and then prove it
  description: 'Hungarian rhetorical tradition, shaped by the ''fogalmazas'' (composition)
    and ''essze'' (essay) genres taught in Hungarian schools, places high value on
    stylistic elegance, figurative language, and emotional resonance. Hungarian argumentative
    essays often blend logical argumentation with literary expression, using metaphors,
    analogies, and personal voice as persuasive tools. The thesis may be presented
    indirectly through the accumulation of observations rather than stated as a clear
    proposition. Hungarian writers may also structure arguments inductively, building
    from specific observations to a general conclusion. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Hungarian speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Focus each paragraph on a single point; begin with a topic sentence
      that states that point clearly
    error: '*Writing paragraphs that lack a clear main idea or that try to cover too
      many points'
    explanation: Hungarian paragraph structure is more flexible and varied; English
      academic paragraphs are expected to be unified around a single idea stated at
      the outset
  - correction: Maintain relatively consistent paragraph length (80-150 words) in
      academic writing; let content determine length, not stylistic preference
    error: '*Varying paragraph length dramatically for stylistic effect (very short
      followed by very long)'
    explanation: Hungarian composition values stylistic variety in paragraph length;
      English academic writing favors consistency and substance over stylistic variation
  description: 'Hungarian paragraphs often follow a flexible structure influenced
    by the Hungarian ''fogalmazas'' tradition, which values variety and stylistic
    interest over rigid organizational templates. Paragraphs may be short and punchy
    or long and meandering, depending on the writer''s stylistic preferences. Hungarian
    writers may not consistently use topic sentences, instead allowing the main idea
    to emerge from the paragraph''s content. This can make English writing feel unfocused
    to readers accustomed to the English topic-sentence-first model. McManus (2022):
    Writing interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Hungarian speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: Use explicit transition phrases at the beginning of paragraphs to
      show how each new point connects to the previous one and to the thesis
    error: '*Omitting transitions between paragraphs, assuming the reader will follow
      the logical flow'
    explanation: Hungarian relies on word order and context to signal relationships;
      English requires explicit cohesive devices between paragraphs
  - correction: 'Use specific connectors: ''however,'' ''on the other hand,'' ''nevertheless''
      for contrast; ''therefore,'' ''as a result,'' ''consequently'' for cause'
    error: '*Using ''but'' for all contrastive relationships, ''so'' for all causal
      ones'
    explanation: Hungarian 'de' and 'tehat' cover broad semantic ranges; English requires
      more precise connector selection
  description: 'Hungarian writers may underuse explicit connectors in English, reflecting
    the Hungarian tendency to rely on contextual and pragmatic cues rather than explicit
    discourse markers. Hungarian uses fewer obligatory connectors than English, and
    logical relationships are often inferred from word order (focus-fronting) and
    context. When Hungarian writers do use connectors in English, they may choose
    ones that reflect Hungarian discourse patterns, such as overusing ''but'' (de)
    and ''so'' (tehat) as general-purpose connectors. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Hungarian speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: 'State claims confidently with appropriate hedging: ''The evidence
      suggests that...'' or ''This analysis indicates that...'''
    error: '*Using excessive hedging and self-deprecation: ''I am not an expert, but
      perhaps it could be suggested that...'''
    explanation: Hungarian academic culture values modesty and deference to authority;
      English academic writing expects writers to assert their analysis confidently
      while hedging appropriately
  - correction: 'Get to the point quickly: ''This essay examines...'' or ''The purpose
      of this analysis is to...'''
    error: '*Including elaborate introductory formulas: ''Before beginning the examination
      of this complex topic, it is necessary to first consider...'''
    explanation: Hungarian academic writing often includes ceremonial introductory
      language; English academic writing values directness and efficiency in introductions
  description: 'Hungarian academic writing has been influenced by both German academic
    traditions (through Austria-Hungary) and by the Hungarian literary essay tradition,
    creating a hybrid style that can be simultaneously overly formal and unexpectedly
    personal. Hungarian academic prose may include elaborate courtesy formulas, self-deprecating
    hedging, and references to the difficulty of the task. When transferred to English,
    this can sound either excessively deferential or inappropriately informal. Hungarian
    writers may also struggle with the English convention of confident, assertive
    academic voice. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Hungarian speakers. Cambridge
    University Press.'
citations:
- claim: Hungarian L1 speakers transfer phonological, grammatical, and writing patterns
    from their L1 to English, including [see language-specific patterns in this file]
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Hungarian
  tier: 1
  reliability: B
  flagged: false
- claim: Hungarian is a Uralic language (not Indo-European) with 18 cases, agglutinative
    morphology, vowel harmony, and no grammatical gender — typological distance from
    English is significant
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 1
  reliability: B
  flagged: false
- claim: Hungarian L1 speakers' errors in English reflect mother-tongue transfer from
    an agglutinative Uralic language including article omission, vowel harmony interference
    in pronunciation, and complex morphosyntactic transfer. James's error typology
    classifies these as interlingual errors from a typologically distinct L1.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's corpus analysis shows that Hungarian L1 speakers' article omission
    errors in English reflect the zero-article Hungarian system. These errors are
    more visible in academic prose where English article frequency is highest, and
    less visible in conversation where article omission is more common across all
    L1 groups.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5.4: Academic prose
      register'
  tier: 2
- claim: 'Abondolo, D. (1997) provides a comprehensive grammatical profile of Hungarian
    including: (1) Vowel system: 14-15 vowel phonemes with vowel harmony governing suffix
    selection (Ch. 28, lines 35711-35770); (2) Consonant system: palatal/non-palatal
    stop oppositions, sibilant/shibilant contrasts, extensive assimilation (Ch. 28, lines
    35802-35883); (3) Agglutinative morphology: verb stem + tense/mood + person/number
    suffixes, noun stem + number + possessor + case suffixes, three slots any of which
    may be zero (Ch. 28, lines 35886-36082); (4) 18+ grammatical cases: local (interior/surface/proximity
    x stationary/approach/depart) and non-local (accusative, dative, instrumental, etc.)
    (Ch. 28, lines 36083-36195, Table 28.3); (5) Definite article but no indefinite article,
    article used more broadly than English (Ch. 28, lines 36131-36160); (6) No grammatical
    gender (Ch. 28, throughout); (7) Topic-focus syntax with coverb positioning (Ch. 28,
    lines 36455-36479); (8) Lexicon: Uralic core + Turkic (~300 words, 5th-9th c.) +
    Slavonic (~500 words) + German/Latin/Romance layers + language renewal tradition
    (Ch. 28, lines 36253-36441).'
  source: "Abondolo, D. (1997) \"Hungarian\" in Comrie, B. (ed.) The World's Major Languages.
    Routledge. Ch. 28, pp. 771-804."
  tier: 1
  reliability: B
  flagged: false
phonology:
  vowel_system:
    description: 'Hungarian has 14-15 vowel phonemes: 7 short (i, e, a, o, u, u-with-umlaut,
      o-with-umlaut) and 7 long (i-acute, e-acute, a-acute, o-accent, u-accent, u-with-umlaut-accent,
      o-with-umlaut-accent), with two exceptions: e-acute is a long high e-sound (not
      a long version of open e), and a-acute is a long open unrounded a-sound (not
      rounded as in English caught). Some speakers distinguish an eighth short vowel
      e-with-diaeresis (as in English met).'
    esl_implications:
    - Hungarian vowel length is phonemic (distinguishes words); English vowel length
      is allophonic -- Hungarian learners may not attend to English vowel quality
      differences as length cues
    - Hungarian e is open (like English mat); English e is closer -- production errors
      expected
    - Hungarian a is slightly rounded (like English chalk); English a is unrounded
      -- subtle production difference
    - Front rounded vowels (u-with-umlaut, o-with-umlaut) have no English equivalents
      -- learners may substitute /u/ or /o/
    - Hungarian e-acute and a-acute differ phonetically from what their diacritics
      might suggest to English speakers
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Table 28.1, lines 35711-35752
    tier: 1
  vowel_harmony:
    description: Hungarian vowel harmony requires suffix vowels to match the front/back
      quality of the stem vowel. Front-vowel stems select front-vowel suffixes (e.g.
      szoer-toek 'you strain'), back-vowel stems select back-vowel suffixes (e.g.
      szuur-tok 'you pierce'). Stems with only i/i-acute vowels mostly take back-vowel
      suffixes. Oblique stem vowels also govern suffix selection (e.g. hiid-roel 'off
      the bridge', not *hiiid-roe-with-umlaut-l). Roundedness harmony also applies
      in certain suffixes.
    esl_implications:
    - Vowel harmony is absent in English -- Hungarian learners must learn that English
      suffixes do not change form based on stem vowels
    - L1 vowel harmony may cause learners to expect allomorphic variation in English
      suffixes where none exists
    - 'Transfer effect: learners may perceive English suffix variation (e.g. -s vs
      -es) as unpredictable, since Hungarian suffix variation is predictable by harmony
      rules'
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 35753-35770
    tier: 1
  consonant_system:
    description: 'Hungarian has voiced/voiceless oppositions including four affricates.
      Notable oppositions: palatal vs non-palatal stops (t vs ty, d vs gy, n vs ny),
      sibilant vs shibilant fricatives/affricates (s vs sz, z vs zs, c vs cs, dz vs
      dzs). Modern Hungarian j and ly (historically a palatal lateral) are pronounced
      alike. Extensive consonant assimilation occurs at morpheme boundaries: e.g.
      /t/+/ny/ palatalizes, /z/+/zs/ yields long zs, /z/+/s/ yields long ss.'
    esl_implications:
    - Hungarian palatalization contrasts (ty, gy, ny) have no English equivalents
      -- learners may palatalize English /t/, /d/, /n/ before front vowels
    - Consonant cluster assimilation is pervasive in Hungarian but restricted in English;
      learners may over-assimilate clusters in English
    - The j/ly merger means Hungarian learners may have difficulty with English /j/
      and /l/ sequences in all contexts
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 35802-35854, Table 28.2
    tier: 1
  common_phonological_errors:
    patterns:
    - pattern: Dental/alveolar confusion
      explanation: Hungarian t and d are dental; English t and d are alveolar. Learners
        may produce dental stops where English expects alveolar.
    - pattern: Final devoicing avoidance
      explanation: Hungarian has no final obstruent devoicing. Learners may fail to devoice
        final voiced stops in English.
    - pattern: Dental fricative substitution
      explanation: Hungarian has no dental fricatives. /theta/ typically replaced by /s/ or
        /t/; /eth/ by /d/.
    - pattern: W/V merger
      explanation: Hungarian has /v/ but /w/ is not a separate phoneme. Learners may use
        [v] for both English /w/ and /v/.
    - pattern: Sibilant epenthesis in initial clusters
      explanation: Hungarian often uses sibilant epenthesis before word-initial stop
        clusters (s-p, s-t, s-k). Learners may add initial vowels or change stop quality
        in English clusters like sp-, st-, sk-.
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 35802-35883
    tier: 1
morphology:
  agglutination:
    description: 'Hungarian is strongly agglutinative: verb and noun stems take multiple
      suffixes in fixed slots, each expressing a single grammatical meaning. Verb
      structure: stem + tense/mood suffix + person/number suffix. Noun structure:
      stem + number suffix (+ possessor suffix) + case suffix. Any slot may be zero.
      Example: hajooroek-i-m-on "ship-PL-my-on" = "on my ships". The plural suffix
      is -i- when a possessor suffix follows, -k- when no possessor suffix follows.'
    esl_implications:
    - English is analytic (separate words for grammatical meanings); learners must
      produce separate prepositions, articles, and auxiliary words instead of suffixes
    - 'Agglutination interference: learners may produce compact forms omitting function
      words (prepositions, articles, pronouns)'
    - The zero-suffix pattern reinforces article omission in English
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 35886-36082
    tier: 1
  case_system:
    description: 'Hungarian has 18+ grammatical cases. Local cases (9) form a systematic
      spatial array: interior (''in''), surface (''on''), proximity (''at''), each
      with stationary, approach, and depart subcases. Non-local cases include: accusative
      (-t), dative (-nak/-nek marks indirect object, possessor, and infinitival predicate),
      instrumental, causal/final, essive, translative.'
    esl_implications:
    - English uses prepositions for case meanings that Hungarian expresses via suffixes;
      learners may omit or use wrong prepositions
    - The dative marking possessors may cause transfer errors in English possessive
      constructions
    - 18-case system means Hungarian relies far less on word order; learners may not
      attend to English word order as a grammatical signal
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36083-36195, Table 28.3
    tier: 1
  article_system:
    description: 'Hungarian has a definite article (a/az, comparable to English the)
      but no indefinite article. The definite article is used more broadly than in
      English -- e.g. with proper nouns, generic nouns, and certain abstract nouns.
      No article is used for professions after the copula: orvos vagyok (doctor I-am)
      = "I am a doctor."'
    esl_implications:
    - Indefinite article (a/an) does not exist in Hungarian -> systematic omission
      in English (e.g. "I am teacher")
    - Definite article used more broadly than English -> overgeneralization with abstract
      nouns, proper names, generic statements
    - Zero article for professions after copula -> transfer of bare noun pattern
    - Learners must acquire the 4-way English article distinction (a/an/the/zero)
      from scratch
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36131-36160
    tier: 1
  verb_morphology:
    description: 'Hungarian verbs show definite/indefinite conjugation: verb suffixes
      encode not only the subject person/number but also (in some forms) the person
      of the object. Centrifugal forms (1st->2nd, 1st->3rd, 2nd->3rd) are unambiguous;
      centripetal forms are ambiguous as to object person. The present tense suffix
      is zero. Past, conditional, and subjunctive moods have extensive allomorphy.
      Coverbs (aspectual prefixes like meg-, el-, vissza-) change verb meaning and
      aspect.'
    esl_implications:
    - Definite/indefinite conjugation has no English parallel; learners must use word
      order and auxiliary verbs
    - Zero present tense suffix -> learners may omit English third-person -s ("he
      go")
    - Coverb + verb aspect marking differs fundamentally from English phrasal verbs
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 35886-36056
    tier: 1
  no_grammatical_gender:
    description: Hungarian has no grammatical gender. There is no gender agreement
      on adjectives, articles, or pronouns. The third person singular pronoun is gender-neutral
      (equivalent to he/she).
    esl_implications:
    - Learners have no L1 model for grammatical gender -- English he/she distinction
      must be acquired from scratch
    - 'Transfer: consistent use of "he" for all referents, or random gender pronoun
      assignment'
    - No gender-triggered adjective agreement errors expected (unlike Romance/Germanic
      L1 learners)
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. (Absence of gender agreement throughout inflectional description,
      lines 35884-36252)
    tier: 1
syntax:
  topic_focus:
    description: 'Hungarian sentence structure is organized by topic-focus articulation,
      not by grammatical relations (SOV/SVO). The focus position is immediately to
      the left of the finite verb. Topic position is sentence-initial. Example: "a
      pek elfutott" (the baker ran away) -- "the baker" is topic, "away" is focus.
      Moving the coverb changes focus: "a pek futott el" = "it is the baker who ran
      away" (focus = baker). Coverb in sentence-initial position topicalises: "el
      a pek futott" = "as for running away, the baker did it".'
    esl_implications:
    - English uses word order and stress for focus, not coverb repositioning; learners
      must learn English focus constructions (clefts, stress shift) from scratch
    - Topic-fronting in Hungarian is grammatically marked; learners may overuse English
      topic-fronting ("As for X, ...") in formal writing
    - Negation interacts with focus position in Hungarian -- a system absent in English
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36455-36479
    tier: 1
  word_order:
    description: 'Hungarian has relatively free word order driven by pragmatic factors
      (topic, focus, emphasis) rather than fixed SVO/SOV. Demonstratives alone agree
      in number and case with their head noun; adjectives do not: "ezekben a nagy
      goeroeg laadookbaan" (these-in the large Greek crates-in), where "large" and
      "Greek" lack the plural and inessive suffixes. Cumulative plural subjects may
      take singular predicates, especially with semantically coherent sets.'
    esl_implications:
    - Relatively free word order -> learners may assume English word order is equally
      flexible
    - Cumulative subjects with singular predicates -> learners may produce singular
      verbs with compound subjects in English ("the salt and pepper is...")
    - Lack of adjective agreement means no L1 model for determiner-noun agreement
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36446-36454
    tier: 1
  not_pro_drop:
    description: Hungarian is not a null-subject language; overt pronouns are used
      when needed for emphasis or clarity. Verb suffixes mark subject person/number
      but do not replace pronouns in all contexts.
    esl_implications:
    - Unlike Spanish or Italian learners, Hungarian learners are not prone to omitting
      English subject pronouns (pro-drop interference is minimal)
    - Verb-final person marking may occasionally cause subject pronoun omission when
      verb suffixes make the subject clear in Hungarian
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 35938-36015
    tier: 1
lexicon:
  uralic_core:
    description: 'The oldest inherited layer descends from common Ugric, Finno-Ugric,
      or Uralic lexical stock: hundreds of basic vocabulary items including kinship
      terms (fiuu/fia- ''son'', meny/menye- ''daughter-in-law'', vo/veje- ''son-in-law''),
      body parts (fej/feje- ''head'', szoem ''eye'', nyelv/nyelve- ''tongue''), natural
      phenomena (eeg/ege- ''sky'', hajnal ''dawn'', teel/tele- ''winter''), animals/hunting
      (hal/hala- ''fish'', haalo ''net''), and basic monomorphemic verbs (eeled/live,
      hal- ''die'', moegye/moeen- ''go'', joen/joeev- ''come'').'
    esl_implications:
    - Uralic core vocabulary has no cognates with English; learners cannot rely on
      L1-L2 lexical similarity for basic vocabulary
    - Kinship terms map differently (Hungarian has distinct terms for in-law relations;
      learners may underdifferentiate English kinship vocabulary)
    - Basic verbs have different argument structures in Hungarian; transitivity transfer
      errors expected
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36404-36418
    tier: 1
  turkic_loanwords:
    description: 'Approximately 300 Turkic loanwords entered during westward migration
      (5th-9th centuries), deeply embedded in basic vocabulary: words for south, time,
      wind, number, cause, witness, write, forgive, tent, broom, chair, fruit, grape,
      wine, bull, ox, calf, heifer, pig, pelican, arm, ankle, stomach, navel, beard,
      freckle. Additional thin layers from Pechenegs/Cumans (10th-13th c.) and Ottoman
      occupation (16th-17th c., ~30 words including pocket, demi-tasse, scourge, coffee).'
    esl_implications:
    - Turkic-origin basic vocabulary has no English cognates; no positive lexical
      transfer expected in these domains
    - Cultural concepts in borrowed terms (pastoral/tent vocabulary) may reflect different
      cultural schemas
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36369-36394
    tier: 1
  slavonic_loanwords:
    description: 'Approximately 500 Slavonic loanwords are central to basic vocabulary:
      bench, bottle, distilled spirits, clergyman, roast, brook, diaper, bedbug, spider,
      bare/deserted. Slavonic mediated Byzantine Christian and Roman Christian terminology:
      large public room, porch, palace, cross, grace, nun.'
    esl_implications:
    - Slavonic-origin everyday words have no English cognates but may have partial
      cognates with other Slavic-language learners L1s
    - Christian/ecclesiastical vocabulary from Slavonic layer may overlap with Latin-derived
      English terms (cross, grace, nun) -- potential for cognate recognition
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36351-36367
    tier: 1
  germanic_loanwords:
    description: 'German loans span 12th-19th centuries: duke, castle, dance, guild,
      citizen, siege (Old High German); lackey, wine-press, dozen, pistol (16th-17th
      c.); braid, powder, ground meat (18th-19th c.). Italian: luxurious, market-place,
      lance, course. Old French/Provencal: (pad)lock, wick, latch. Latin: church,
      mass, Host, angel, congregation (official language of Kingdom of Hungary 1001-mid-19th
      c.). Latin adverbs survive in colloquial Hungarian: "of course", "especially".'
    esl_implications:
    - German-origin words may partially overlap with English Germanic vocabulary (castle,
      dance, guild) -- potential for positive cognate recognition
    - Latin-origin religious and academic vocabulary maps well to English Latin-derived
      terms -- positive transfer expected
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36282-36349
    tier: 1
  iranian_loanwords:
    description: 'Three thin Iranian loanword layers from earliest migration stages:
      toll/customs and bazaar from Persian; bridge and woman (as opposed to girl)
      from Alanic (Old Ossete); cow, milk, felt, and perhaps linen from an unidentified
      Iranian language.'
    esl_implications:
    - Iranian-origin words are basic (cow, milk, bridge, woman) but have no English
      cognates
    - No positive transfer expected from this layer
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36396-36403
    tier: 1
  language_renewal:
    description: 'Hungarian has a distinctive tradition of conscious vocabulary creation
      (nyelvujitas, ''language renewal'') dating to the 18th-19th centuries. Reformers
      created new terms from native elements: e.g. ''back+sound'' = ''echo'' (David
      Baroti Szabo, 1739-1819), ''light+minded'' = ''heedless'' (Ferenc Kazinczy,
      1759-1831). Many coined terms were later replaced by European internationalisms.
      This tradition means Hungarian has fewer internationalisms than neighboring
      languages.'
    esl_implications:
    - Hungarian has calques (loan translations) from native morphemes where English
      uses internationalisms; learners must learn the English international forms
    - The language-renewal tradition means some Hungarian words look opaque to English
      speakers (not transparent like Romance/Germanic cognates)
    - Learners may produce calques when translating from Hungarian to English
    reliability: B
    source: Abondolo, D. (1997) "Hungarian" in The World's Major Languages. Ch. 28.
      Routledge. Lines 36420-36441
    tier: 1
