    - Odlin
    teacher_tips:
      exercises:
      - description: 20 sentences with Hungarian-influenced article errors.
        duration: 15
        name: Article Audit
        type: error-correction
      - description: Translate 15 Hungarian sentences focusing on articles.
        duration: 15
        name: HU Article Translation
        type: translation
      how_to_explain: 'Teach: English REQUIRES ''a/an'' after ''be'' for professions.'
      sequencing: 'Week 1: Articles with professions. Week 2: Definite vs indefinite.
        Week 3: Zero article. Week 4: Review.'
      where_to_start: Start with the profession pattern.
    tier: 1
    why_it_happens: 'Hungarian omits the indefinite article after ''to be'' for professions.
      Hungarian has a definite article ''a/az'' that is used more broadly than English
      ''the''. McManus (2022) explains that L2 speakers can learn new form-meaning
      mappings (like articles) that don''t exist in L1, but this requires extensive
      practice to become automatic. Online anticipatory processing (using articles
      to predict upcoming nouns) develops only with high proficiency and extended
      exposure, not from L1 transfer. McManus (2022) explains that L2 speakers can
      learn new form-meaning mappings that don''t exist in L1, but this requires extensive
      practice to become automatic. L2 learning involves creating new knowledge when
      L1-L2 differences exist AND developing selection mechanisms to manage competing
      knowledge sources (McManus 2022, Ch. 1). Online anticipatory processing develops
      only with high proficiency and extended exposure. Golden et al. (2017): Transfer
      is non-linear — functional fit between L1 and L2 systems matters more than mere
      formal similarity. English (Germanic) learners showed NO advantage over Slavic
      learners on Norwegian spatial prepositions. Gender system transfer is non-linear
      (L1 gender != automatic advantage). Conceptual transfer affects spatial relations,
      emotion language, and article use. Accuracy + text length account for 80% of
      writing ratings; cultural-rhetorical style accounts for the remaining 20%. Golden
      et al. (2017): Even L1s with article systems show non-linear transfer. Having
      articles helps but does not eliminate errors because specific article rules
      (definite/indefinite/zero) vary across languages. Transfer depends on functional
      fit of article usage rules, not just presence of articles in L1. Golden et al.
      (2017): L1s without grammatical gender must build gender assignment from scratch,
      but compensating strategies (e.g., Vietnamese classifiers for animacy/shape)
      may partially support acquisition. Vietnamese learners omit articles more but
      are accurate when present. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries. Odlin (Ch.3): Languages with
      rich case systems may show COVERT transfer — the absence of expected English
      prepositions reflects L1 influence. Finnish (15 cases) learners omit obligatory
      English prepositions because Finnish uses nominal case inflections instead.
      Similar patterns expected for other case-system L1s transferring case-based
      strategies to English preposition use.'
