sources:
- citation: 'Swan, M. & Smith (2001) Learner English, 2nd ed. Cambridge University Press. Ch. 6: Polish speakers'
  relevance: L1 interference patterns documented for this language group.
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Czech
  relevance: Czech phonological and grammatical transfer patterns — case system, word
    order, articles
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: State a clear thesis in the introduction and structure the essay as
      an argument with supporting evidence, not as an exploration of ideas
    error: '*Writing an exploratory, reflective essay when a thesis-driven argument
      is expected'
    explanation: The Czech 'esej' tradition values open-ended exploration; English
      academic writing expects a clear, defensible thesis from the outset
  - correction: Maintain a serious, formal tone in academic argumentative essays;
      save stylistic devices for creative or personal writing
    error: '*Using irony, understatement, or humor in academic argumentative writing'
    explanation: Czech essayistic tradition embraces irony and humor; English academic
      argumentative writing maintains a consistently serious register
  description: 'Czech rhetorical tradition, influenced by the Czech essayistic tradition
    (exemplified by writers like Capek and Kundera), values personal reflection, irony,
    and a conversational tone even in argumentative writing. Czech essays often adopt
    a more exploratory, dialogic structure where the writer thinks through the problem
    alongside the reader, rather than presenting a pre-formed thesis. The Czech ''esej''
    (essay) tradition blurs the line between argumentative and reflective writing,
    which can lead to essays that English readers perceive as lacking argumentative
    rigor. McManus (2022): Writing interference reflects learned attention from L1
    discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Czech speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Develop each main point fully within a paragraph of 5-10 sentences
      with a topic sentence, evidence, and analysis
    error: '*Writing many short paragraphs (2-3 sentences each) that feel underdeveloped'
    explanation: Czech prose style favors brevity and fragmentation; English academic
      paragraphs are expected to develop each point substantively
  - correction: Use transition sentences at the end or beginning of paragraphs to
      show how each point relates to the thesis and to adjacent points
    error: '*Failing to connect paragraphs to each other and to the overall thesis'
    explanation: Czech writing may rely on implicit connections between ideas; English
      writing expects explicit signaling of how each paragraph contributes to the
      argument
  description: 'Czech paragraphs tend to be shorter and more fragmented than English
    paragraphs, reflecting a stylistic preference for brevity and understatement.
    Czech writers may present ideas in a series of short, loosely connected paragraphs
    rather than developing each point fully within a single paragraph. This can make
    English writing feel choppy and underdeveloped. Conversely, when Czech writers
    attempt longer paragraphs, they may lack clear internal structure. McManus (2022):
    Writing interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Czech speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: 'Add appropriate transition words and phrases to show relationships
      between ideas: addition, contrast, cause, effect'
    error: '*Omitting connectors between sentences and paragraphs, creating a choppy,
      disconnected feel'
    explanation: Czech prose often omits conjunctions for stylistic effect; English
      academic writing requires explicit cohesive devices for clarity
  - correction: 'Use a wider range of connectors: ''however,'' ''nevertheless,'' ''furthermore,''
      ''in addition,'' ''consequently'''
    error: '*Overusing ''but'' and ''also'' as catch-all connectors'
    explanation: Czech 'ale' and 'také' cover a broad range of meanings; English requires
      more specific connector choices
  description: 'Czech writers often underuse explicit connectors, reflecting a Czech
    stylistic preference for implicit logical flow and paratactic sentence structures
    (juxtaposition without explicit linking). When connectors are used, Czech writers
    may rely on a limited set (''ale'' -> ''but,'' ''proto'' -> ''therefore,'' ''také''
    -> ''also'') that can become repetitive in English. The Czech tendency toward
    asyndeton (omitting conjunctions) can make English writing feel disjointed. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Czech speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: 'Use active, verb-based constructions: ''This essay analyzes...''
      or ''The analysis reveals...'''
    error: '*Using German-influenced nominalizations and passive constructions excessively:
      ''The undertaking of the analysis was performed'''
    explanation: Czech academic writing inherited German-style nominalizations; English
      academic writing favors active, direct expression
  - correction: Use sources to support your own argument; always explain how evidence
      relates to your thesis
    error: '*Summarizing sources without adding original analysis or argument'
    explanation: Czech academic tradition emphasizes demonstrating knowledge of sources;
      English academic writing expects the writer to construct and defend an original
      argument
  description: 'Czech academic writing has traditionally been influenced by German
    academic prose (nominalizations, complex syntax, impersonal constructions), but
    younger Czech writers increasingly adopt a more accessible style. Czech writers
    may oscillate between excessive formality (transferring German-influenced academic
    conventions) and excessive informality (reflecting the Czech cultural preference
    for egalitarian, direct communication). The Czech academic tradition also places
    less emphasis on original argumentation and more on demonstrating mastery of existing
    scholarship. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Czech speakers. Cambridge
    University Press.'
citations:
- claim: Czech L1 speakers transfer case system (7 cases), free word order, and lack
    of articles to English — producing errors in article usage, preposition choice,
    and word order
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Czech
  tier: 1
  reliability: B
  flagged: false
- claim: Czech, as a highly inflected Slavic language with rich case morphology, causes
    L1 transfer in English prepositional usage and article acquisition — typological
    distance predicts these specific difficulties
  source: Singleton (2016) Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters.
  tier: 1
  reliability: B
  flagged: false
- claim: Czech L1 speakers' errors in English article usage and word order reflect
    systematic mother-tongue interference. James's error typology distinguishes these
    interlingual errors from intralingual developmental errors, noting that zero-article
    L1s produce predictable article omission patterns in English.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that zero-article L1 speakers like Czech
    produce different article error patterns in speech versus writing. Academic prose
    demands higher article frequency than conversation, explaining why Czech L1 article
    omissions are more visible in formal written English.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5.4: Academic prose
    register'
  tier: 2
