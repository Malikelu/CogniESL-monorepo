  phonology:
    interference_patterns:
    - pattern: Pronunciation of final written consonants
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'elle reste' (final -s and -e are silent in French)
      example_gloss: she stays (final consonants silent)
      example_wrong: She stay. / She stai-suh.
      example_correct: She stays.
      explanation: 'Transfer from L1: Final written consonants in French (e.g., plural
        -s) are often not pronounced. French speakers may drop final -s in English,
        leading to errors like *She stay, *four apple, *differen.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Influence of spelling
        on pronunciation, point 4; § Consonant clusters, point 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omission of initial /h/
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: FR 'homme' (silent h in French)
      example_gloss: man (h silent)
      example_wrong: I haven't seen 'enry today.
      example_correct: I haven't seen Henry today.
      explanation: 'Transfer from L1: /h/ does not exist in French and is often dropped
        by French speakers in English, leading to errors like *I haven''t seen Henry
        today (with h-dropping).'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Consonants, point 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
