  false_friends:
    interference_patterns:
    - pattern: Confusion of actuellement (currently) with actually
      frequency: 5
      persistence: 4
      communicative_impact: 4
      example_l1: FR 'actuellement'
      example_gloss: currently / at present
      example_wrong: Actually, I live in Paris.
      example_correct: Currently, I live in Paris.
      explanation: 'Transfer from L1: French actuellement means currently/presently,
        not actually. This is a classic false friend.'
      citation: 'Swan & Smith 2001, Ch. ''French speakers'', § False and unreliable
        friends, list item: actual, actually'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Confusion of assister (attend) with assist
      frequency: 4
      persistence: 4
      communicative_impact: 4
      example_l1: FR 'assister à'
      example_gloss: attend / to be present at
      example_wrong: I will assist the meeting.
      example_correct: I will attend the meeting.
      explanation: 'Transfer from L1: French assister a means to attend/to be present
        at, not to assist/help. This is a high-impact false friend.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § False and unreliable friends
        (assister = attend, not assist)
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
