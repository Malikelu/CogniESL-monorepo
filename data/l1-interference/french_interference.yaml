  verb_tenses:
    interference_patterns:
    - pattern: Use of present perfect for recent past
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'J'ai mange'
      example_gloss: I have eaten
      example_wrong: I have eaten lunch' (when meaning simple past)
      example_correct: I ate lunch
      explanation: 'Transfer from L1: Use of present perfect for recent past.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of passe compose for all past
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: FR 'Je suis alle'
      example_gloss: I am gone
      example_wrong: I am gone to the store
      example_correct: I went to the store
      explanation: 'Transfer from L1: Use of passe compose for all past.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I have gone to the store yesterday.
      correct: I went to the store yesterday.
    - wrong: She has arrived last week.
      correct: She arrived last week.
    - wrong: We have finished the project on Monday.
      correct: We finished the project on Monday.
    why_it_happens: 'French uses passe compose (j''ai mange) for completed actions,
      which maps to both English simple past and present perfect. French learners
      may overuse present perfect when simple past is needed, especially with specific
      past time markers (yesterday, last week). McManus (2022, pp. 54-55) notes that
      French past tense system differs from English: French uses passé composé (perfect-like)
      vs imparfait (habitual past), and French learners transfer the French aspectual
      viewpoint system to English. French learners of English often overuse present
      perfect in preterite contexts because French passé composé is structurally similar
      but functionally different (McManus cites Collins 2002, Ayoun & Salaberry 2008).
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: Specific past time (yesterday, last week, in 2010) ->
        Simple Past. No specific time + present relevance -> Present Perfect. Words
        like ''yet'', ''already'', ''ever'', ''never'' -> usually Present Perfect.'
      where_to_start: Start with simple past (concrete, easier). Then introduce present
        perfect.
      sequencing: 'Week 1: Simple past with time markers. Week 2: Present perfect
        for experiences. Week 3: Present perfect with already/yet/just. Week 4: Contrastive
        practice.'
      exercises:
      - name: Tense Decision
        type: fill-in-the-blank
        description: 20 sentences with blank for past simple or present perfect. Students
          choose and explain.
        duration: 15
      - name: FR Tense Translation
        type: translation
        description: Translate 15 French passe compose sentences into correct English
          tense.
        duration: 15
      - name: Time Marker Sort
        type: matching
        description: Students match time expressions to the correct tense.
        duration: 10
      - name: Interview Activity
        type: oral-drill
        description: Students ask each other Have you ever...? questions.
        duration: 15
