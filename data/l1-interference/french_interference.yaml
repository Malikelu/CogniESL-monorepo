language: French
language_code: fr
schema_version: '4.0'
writing_interference:
- area: argumentative_essay
  description: 'French rhetorical tradition follows the ''plan dialectique'' (thesis-antithesis-synthesis)
    structure, which differs significantly from English argumentative essays. French
    writers are trained to present both sides of an argument before arriving at a
    synthesis, whereas English essays typically require the writer''s position in
    the thesis statement and defend it throughout. French ''dissertation'' style values
    intellectual balance and may seem indecisive to English readers. French writers
    may also begin with a broad philosophical question rather than a direct thesis,
    and may use the ''nous'' (we) form where English expects ''I'' or impersonal constructions.
    McManus (2022): Writing interference reflects learned attention from L1 discourse
    habits. L1 rhetorical patterns shape how writers organize and present arguments
    in L2. Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  common_errors:
  - error: '*One might ask: what is the purpose of education? Some say it is to prepare
      students for the workforce. Others argue it is for personal enrichment. Both
      perspectives have merit, and perhaps the truth lies somewhere in between.'
    correction: Education should primarily prepare students for the workforce. While
      personal enrichment is a valuable secondary benefit, the evidence shows that
      employment outcomes should be the central goal of educational policy.
    explanation: The French 'plan dialectique' trains writers to present both sides
      and synthesize. English argumentative essays require a clear, defensible thesis
      from the outset. The original reads like a French introduction that refuses
      to take a position.
  source: 'Swan & Smith (2001). Learner English, Ch. 6: French speakers. Cambridge
    University Press.'
- area: paragraph_structure
  description: 'French paragraphs follow a more elaborate structure than English,
    often beginning with a ''phrase d''attaque'' (opening hook) that is broader than
    a topic sentence. French paragraphs may develop through a series of sub-points
    connected by colons and semicolons, creating longer, more complex paragraphs than
    English typically allows. The French convention of ''paragraphe de transition''
    between major sections has no direct English equivalent. French writers may also
    use the ''chiasme'' (ABBA structure) for rhetorical effect, which can seem overly
    ornate in English. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*It is a truth universally acknowledged that education plays a fundamental
      role in society: it shapes minds, it builds character, it creates opportunities,
      it transforms communities, and it is therefore essential that we invest in it.'
    correction: Education plays a fundamental role in society by shaping minds and
      creating opportunities. Research consistently shows that investment in education
      yields significant social and economic returns.
    explanation: French paragraph style favors elaborate, multi-clause development
      with colons and semicolons. English paragraphs are typically shorter, with one
      main idea per paragraph and simpler sentence structures.
  source: 'Swan & Smith (2001). Learner English, Ch. 6: French speakers. Cambridge
    University Press.'
- area: cohesion_devices
  description: 'French writers tend to use a more limited set of connectors in English
    than they would in French, often defaulting to ''and'', ''but'', and ''so'' because
    the rich French connector system (cependant, neanmoins, toutefois, par consequent)
    has no direct one-to-one English equivalents. French ''en effet'' is frequently
    mistranslated as ''in effect'' rather than ''indeed'' or ''in fact''. French writers
    may also overuse ''on the other hand'' because French ''d''autre part'' is used
    more broadly than its English counterpart. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  common_errors:
  - error: '*The policy has some benefits. And it also has some drawbacks. But overall,
      it seems positive. And furthermore, the data supports this conclusion.'
    correction: The policy has both benefits and drawbacks. However, the overall impact
      appears positive, as the data supports this conclusion.
    explanation: French uses a wider range of nuanced connectors (d'une part...d'autre
      part, cependant, neanmoins) that French writers may simplify to basic English
      connectors, losing nuance and variety.
  source: 'Swan & Smith (2001). Learner English, Ch. 6: French speakers. Cambridge
    University Press.'
- area: academic_register
  description: 'French academic writing values elegance, abstraction, and intellectual
    sophistication, often employing longer sentences, more subordinate clauses, and
    a higher register than English academic writing. French writers may use abstract
    nouns and nominalizations where English prefers active verbs. The French convention
    of using the impersonal ''on'' (one/we) and ''il est'' (it is) constructions transfers
    to English, producing texts that sound overly formal or vague. French writers
    may also use more metaphors and figurative language than English academic style
    permits. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*One must consider the fact that the implementation of said policy has
      not been without its difficulties, and it would be remiss not to acknowledge
      the considerable efforts that have been undertaken.'
    correction: The policy implementation has faced significant difficulties. Nevertheless,
      the efforts made so far represent meaningful progress.
    explanation: French academic style favors abstraction, nominalization, and elaborate
      phrasing ('il serait remiss de ne pas...'). English academic writing values
      directness, active verbs, and concision.
  source: 'Swan & Smith (2001). Learner English, Ch. 6: French speakers. Cambridge
    University Press.'
grammar_points:
  articles:
    interference_patterns:
    - pattern: Omission of article before professions
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_l1: FR 'Elle est médecin'
      example_gloss: she is doctor
      example_wrong: She is doctor.
      example_correct: She is a doctor.
      explanation: 'Transfer from L1: French uses no article before names of professions
        in complement position (elle est medecin). English requires a/an.'
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'French speakers', § Articles, point 2
      reliability: B
    - pattern: Partitive article confusion
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'Je veux du pain'
      example_gloss: I want of-the bread
      example_wrong: I want of bread
      example_correct: I want bread' / 'I want some bread
      explanation: 'Transfer from L1: Partitive article confusion.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: French gender system processing routines transfer (Odlin Ch.8)
      frequency: 4
      persistence: 2
      communicative_impact: 2
      example_l1: French has grammatical gender (masc/fem)
      example_gloss: Processing routines from gender system available for transfer
        to other L2s
      example_wrong: In a new L2 with gender, not applying gender processing routines
        from L1
      example_correct: Applying french gender processing routines when learning any
        L2 with gender
      explanation: 'Odlin (Ch.8): Sabourin et al. (2006): German > Romance > English
        speakers in acquiring Dutch gender. Alhawary (2009): French speakers outperformed
        English speakers in Arabic gender. French speakers have a gender processing
        advantage when learning any additional language with gender.'
      etiology: positive_transfer
      flagged: true
      tier: 4
      reliability: B
    - pattern: 'Golden et al. (2017): Having L1 articles does NOT guarantee easy English
        article acquisition'
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: 'French: has article system'
      example_gloss: French has definite/indefinite articles but usage rules differ
        from English
      example_wrong: '''I am doctor'' / ''the life is beautiful'' (L1-specific article
        overuse/underuse)'
      example_correct: '''I am a doctor'' / ''Life is beautiful'''
      explanation: 'Golden et al. (2017): Even L1s with articles show non-linear transfer
        effects. Having an L1 article system helps but does not eliminate errors because
        the specific rules for article use (when to use definite, indefinite, or zero
        article) vary across languages. Swedish, French, Spanish, Arabic, and other
        article-bearing L1s all show context-specific article errors in English.'
      etiology: functional_fit_transfer
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Golden et al. (2017): L1 gender system does NOT guarantee L2 gender
        advantage — functional fit matters'
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: 'French: has grammatical gender'
      example_gloss: French has gender system but may differ in number of genders
        or assignment rules
      example_wrong: '''Applying L1 gender assignment rules to English/the target
        L2'''
      example_correct: Learning L2 gender assignment rules independently
      explanation: 'Golden et al. (2017) Ch.6 (Ragnhildstveit): Dutch/Spanish (2 genders)
        and German (3 genders) learners of Norwegian did NOT show an overall advantage
        over learners without gender. Gender transfer is non-linear: it depends on
        how L1 and L2 gender systems align functionally, not just whether L1 has gender.'
      etiology: functional_fit_transfer
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: She is doctor.
      correct: She is a doctor.
    - wrong: I want of bread.
      correct: I want some bread.
    - wrong: He is the best student of class.
      correct: He is the best student in the class.
    why_it_happens: 'French requires an article before professions (''elle est medecin''
      uses ''est'' without article in French but English requires ''a/an''). French
      also uses partitive articles (du, de la, des) that have no direct English equivalent.
      French learners may omit articles or transfer partitive constructions. McManus
      (2022) explains that L2 speakers can learn new form-meaning mappings (like articles)
      that don''t exist in L1, but this requires extensive practice to become automatic.
      Online anticipatory processing (using articles to predict upcoming nouns) develops
      only with high proficiency and extended exposure, not from L1 transfer. McManus
      (2022) explains that L2 speakers can learn new form-meaning mappings that don''t
      exist in L1, but this requires extensive practice to become automatic. L2 learning
      involves creating new knowledge when L1-L2 differences exist AND developing
      selection mechanisms to manage competing knowledge sources (McManus 2022, Ch.
      1). Online anticipatory processing develops only with high proficiency and extended
      exposure. Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney 1881,
      Sapir 1921). Post-behaviorist constructs — activation, automaticity, entrenchment
      — explain transfer patterns. Weinreich and Lado both focused on crosslinguistic
      similarities/differences; CAH (Contrastive Analysis Hypothesis) was coined by
      Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: English REQUIRES ''a/an'' after ''be'' for professions.
        Contrast: FR ''Elle est medecin'' -> EN ''She is a doctor''. For partitives,
        teach: ''du/de la/des'' = ''some'' or nothing in English.'
      where_to_start: Start with the profession pattern (highest frequency). Then
        teach partitive articles.
      sequencing: 'Week 1: Articles with professions. Week 2: Partitive articles.
        Week 3: Definite vs indefinite. Week 4: Article review.'
      exercises:
      - name: Article Audit
        type: error-correction
        description: 20 sentences with French-influenced article errors. Students
          correct.
        duration: 15
      - name: FR-to-EN Translation
        type: translation
        description: Translate 15 French sentences focusing on article differences.
        duration: 20
      - name: Article Decision Tree
        type: fill-in-the-blank
        description: Students complete a flowchart for article choice.
        duration: 10
      - name: Profession Flashcards
        type: matching
        description: Students match French professions with correct English forms
          (with a/an).
        duration: 10
    sources:
    - Swan & Smith "Learner English" Ch. 6 (French)
    - Parrott "Grammar for English Language Teachers"
    - McManus
    - Golden
    - Odlin
