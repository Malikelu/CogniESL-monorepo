  negation:
    interference_patterns:
    - pattern: Omission of do-support in negation
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: FR 'Je ne sais pas'
      example_gloss: I not know not
      example_wrong: I not know.
      example_correct: I do not know.
      explanation: 'Transfer from L1: The auxiliary do has no equivalent in French.
        French negation wraps the verb with ne...pas. French speakers may omit do-support
        entirely.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Questions and negatives;
        auxiliaries, point 1
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Post-verbal negation
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: FR 'Elle ne habite pas à Paris'
      example_gloss: She not lives not in Paris
      example_wrong: She lives not in Paris.
      example_correct: She does not live in Paris.
      explanation: 'Transfer from L1: French negation wraps the verb with ne...pas.
        French speakers may omit do/did and place not directly after the verb.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Questions and negatives;
        auxiliaries, point 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I not know the answer.
      correct: I do not know the answer.
    - wrong: She not likes coffee.
      correct: She does not like coffee.
    - wrong: They not have time.
      correct: They do not have time.
    why_it_happens: 'French negation wraps the verb with ''ne...pas'' (je ne sais
      pas). English uses ''do/does/did + not + base verb''. French learners may transfer
      the post-verbal negation pattern or omit do-support entirely. McManus (2022):
      The L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach the formula: do/does/did + not + base verb. Drill: I
        do not, you do not, he does not, she does not. Emphasize that ''not'' goes
        AFTER the auxiliary, not after the main verb.'
      where_to_start: Start with present simple negation. Then past simple. Then questions.
      sequencing: 'Week 1: Present simple negation. Week 2: Past simple negation.
        Week 3: Negative questions. Week 4: Review.'
      exercises:
      - name: Negation Transformation
        type: sentence-rewrite
        description: Students rewrite 15 affirmative sentences as negative using do-support.
        duration: 15
      - name: FR Negation Translation
        type: translation
        description: Translate 15 French ne...pas sentences into correct English.
        duration: 15
      - name: Error Correction
        type: error-correction
        description: 15 sentences with negation errors. Students correct.
        duration: 10
      - name: Negative Story
        type: composition
        description: Students write a short story using at least 5 different negative
          forms.
        duration: 15
    sources:
    - Swan & Smith "Learner English" Ch. 6
    - Parrott "Grammar for English Language Teachers"
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
