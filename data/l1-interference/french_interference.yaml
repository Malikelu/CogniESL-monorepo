  passive_voice:
    interference_patterns:
    - pattern: Use of reflexive where English uses passive
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_l1: FR 'Cela ne se fait pas'
      example_gloss: That not itself does not
      example_wrong: That does not do itself.
      example_correct: That is not done.
      explanation: 'Transfer from L1: French uses a reflexive pronoun (se) in many
        cases where English uses the passive voice.'
