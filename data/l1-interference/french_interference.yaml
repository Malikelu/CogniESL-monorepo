  tu_vous_distinction:
    interference_patterns:
    - pattern: tu-vous T-V distinction carries different weight than English you
      frequency: 4
      persistence: 3
      communicative_impact: 4
      example_l1: "FR tu (informal) vs vous (formal/plural)"
      example_gloss: tu = intimate/familiar you; vous = respectful/plural you
      example_wrong: Hey professor, can I talk to you?
      example_correct: Excuse me, Professor, could I speak with you?
      explanation: "French maintains a sharp T-V distinction (tu vs vous) where vous marks respect or distance in singular addressee contexts. English you makes no such distinction - formality is conveyed through word choice and grammar. French speakers may either overuse formal English constructions with professionals/elders (hyperformal one replacing I), or seem too direct because English lacks the pragmatic softening that vous provides. Waugh & Monville-Burston (2002): In spoken French, tu is gaining ground in all but the most formal situations, but the distinction remains pragmatically significant."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 3"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: on replaces nous in spoken French affecting English one
      frequency: 3
      persistence: 2
      communicative_impact: 3
      example_l1: FR 'On part en voyage' meaning we go on a trip
      example_gloss: on has replaced nous for first-person plural meaning
      example_wrong: One is not sure about the answer (meaning we are not sure)
      example_correct: We are not sure about the answer
      explanation: "French on has wholly replaced nous for the meaning 'we' in spoken French. French speakers may overuse English one as a translation of on, producing hyperformal or vague utterances where personal pronouns would be more natural. The pragmatic range of on (indefinite, general, personal) does not map cleanly onto any single English pronoun. Waugh & Monville-Burston (2002): On has neither an oblique nor a disjunctive form; within the verb phrase, the reflexive se is used."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 3"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: One might argue that education matters (where we is intended)
      correct: We might argue that education matters
    - wrong: Can you give me the book (to a professor, too direct)
      correct: Could you give me the book, Professor
    why_it_happens: "French T-V distinction (tu vs vous) encodes social distance and respect through pronoun choice. English uses the same pronoun you for all addressees, relying on word choice and grammar for politeness. French speakers must learn that English formality is managed through modal verbs (could, would), hedging (perhaps, possibly), and indirect structures - not pronoun change. Waugh & Monville-Burston (2002): The intimate forms (tu) are gaining ground in French but losing their strong meaning of intimacy for younger speakers."
    teacher_tips:
      how_to_explain: "Teach: English has ONE word for you (singular and plural, formal and informal). Formality is shown through word choice, not pronoun change. Compare FR tu (friend) vs vous (professor) with EN you for both. Drill polite requests with modals."
      where_to_start: Start with the concept that English uses the same you for everyone
      sequencing: "Direct vs polite requests; formal vs informal vocabulary; hedging devices; register practice"
      exercises:
      - name: Register Shifter
        type: sentence-rewrite
        description: Students rewrite direct requests as polite requests using modals and hedging
        duration: 15
      - name: TV Translation
        type: translation
        description: Translate French tu or vous sentences into appropriate English register
        duration: 15
      - name: Formal Email
        type: composition
        description: Students write an email to a professor using appropriate formal English
        duration: 20
      - name: Pragmatic Choices
        type: role-play
        description: Role-play scenarios requiring students to choose appropriate formality level
        duration: 15
    sources:
    - Swan & Smith "Learner English" Ch. 6
    - Waugh & Monville-Burston "The World's Major Languages" Ch.9
    source_count: 2
    source_type: textbook
    frequency: 4
    persistence: 3
    communicative_impact: 4
    flagged: false
    tier: 1
    source_rank: 1
    citations:
    - claim: French maintains T-V distinction (tu vs vous) where English uses you for all; on replaces nous in spoken French
      source: 'Waugh & Monville-Burston (2002) The World''s Major Languages, Ch.9: French. Routledge.'
      location: Section 3 (Pronouns - Spoken Language)
      tier: 2
    - claim: French tu is gaining ground in less formal situations, losing strong intimacy meaning
      source: 'Waugh & Monville-Burston (2002) The World''s Major Languages, Ch.9: French. Routledge.'
