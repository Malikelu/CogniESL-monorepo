      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of de for possession
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'le livre de Jean / la voiture de mon frère'
      example_gloss: the book of Jean / the car of my brother
