  modal_verbs:
    interference_patterns:
    - pattern: Use of to-infinitive after English modals
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'Je peux nager / Tu dois entrer'
      example_gloss: I can swim / You must enter
      example_wrong: I can to swim. / You must to enter your password first. / You
        should to try this new shampoo.
      example_correct: I can swim. / You must enter your password first. / You should
        try this new shampoo.
      explanation: 'Transfer from L1: French modal equivalents (pouvoir, devoir, savoir)
        are followed by a bare infinitive just like English modals, but French speakers
        are often taught that French infinitives correspond to English to-infinitives,
        leading them to insert to after English modals.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Modal verbs, point 1
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Confusion of must and should (devoir)
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'Tu demanderas à Eleanor si elle a des idées'
      example_gloss: You will-ask to Eleanor if she has ideas
      example_wrong: You must (to) ask Eleanor if she has any ideas.
      example_correct: You should ask Eleanor if she has any ideas.
      explanation: 'Transfer from L1: French uses the single verb devoir to cover
        both must (obligation) and should (advice). French speakers may say must when
        they mean should, and vice versa.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Modal verbs, point 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I can have some water?
      correct: May I have some water?
    - wrong: You must to go to the doctor.
      correct: You should go to the doctor.
    - wrong: She can to swim very well.
      correct: She can swim very well.
