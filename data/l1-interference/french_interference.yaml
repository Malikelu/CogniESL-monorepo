      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: English ''h'' is pronounced at the start of most words
        (hour, honest are exceptions). Most final consonants are pronounced in English.
        Practice: house, horse, happy (h pronounced). Hour, honest, honor (h silent).'
      where_to_start: Start with 'h' pronunciation. Then teach final consonant pronunciation.
      sequencing: 'Week 1: H pronunciation. Week 2: Final consonants. Week 3: TH sounds.
        Week 4: Review.'
      exercises:
      - name: H Pronunciation
        type: oral-drill
        description: Students practice 20 words with h, distinguishing pronounced
          vs silent.
        duration: 10
      - name: Final Consonant Practice
        type: oral-drill
        description: Students practice pronouncing final consonants in 20 words.
        duration: 10
      - name: Minimal Pairs
        type: matching
        description: 'Students distinguish: house/our, horse/orse, hit/it.'
        duration: 10
      - name: Dictation
        type: fill-in-the-blank
        description: Teacher dictates words with target sounds. Students write them.
        duration: 10
