      explanation: "French c'est + NP + que or qui cleft structures are highly frequent for focus marking. French speakers may transfer the pattern without the copula or produce non-English cleft forms. With pseudo-clefts (ce que... c'est), French speakers may reverse the information structure. Waugh & Monville-Burston (2002): The focus is extracted and highlighted by means of c'est + relative pronoun, while the rest constitutes the theme."
