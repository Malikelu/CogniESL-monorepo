      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_l1: FR 'comme moi'
      example_gloss: like me / as me
      example_wrong: He isn't at all as me.
      example_correct: He isn't at all like me.
      explanation: 'Transfer from L1: French uses the same word (comme) for both as
        and like when referring to similarity. French speakers may use as where English
        requires like.'
      citation: Swan & Smith 2001, Ch. 'French speakers', § Conjunctions, point 1
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of alors/donc as discourse fillers
      frequency: 3
      persistence: 2
      communicative_impact: 1
      example_l1: FR 'Alors, je pense que...'
      example_gloss: So, I think that...
      example_wrong: So, so, so... I think that...
      example_correct: Well, I think that... / I think that...
      explanation: 'Transfer from L1: French uses alors and donc as discourse fillers
