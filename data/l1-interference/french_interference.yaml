    - pattern: Use of conditionnel for unconfirmed information
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: FR 'Les pirates seraient membres du groupe extrémiste'
      example_gloss: The hijackers would-be members of-the group extremist
      example_wrong: The hijackers would be members of the extremist group.
      example_correct: The hijackers are thought to be / are allegedly members of
        the extremist group.
      explanation: 'Transfer from L1: French uses the conditional tense to indicate
