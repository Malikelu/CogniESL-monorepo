      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: After suggest, demand, require, important -> base form
        (no -s, no should). In modern English, ''I suggest that he go'' (formal) =
        ''I suggest that he should go'' (informal). For ''want'', use ''want + person
        + to + verb''.'
      where_to_start: Start with 'want + person + to + verb'. Then teach mandative
        subjunctive.
      sequencing: 'Week 1: Want/wish + person + to. Week 2: Suggest/demand/require
        + base form. Week 3: It is important that + base form. Week 4: Review.'
      exercises:
      - name: Subjunctive Transformation
        type: sentence-rewrite
        description: Students rewrite 10 sentences using correct subjunctive patterns.
        duration: 15
      - name: FR Subjunctive Translation
        type: translation
        description: Translate 15 French subjunctive sentences into correct English.
        duration: 15
      - name: Should or Base Form?
        type: error-correction
        description: 10 sentences where students choose between should and base form.
        duration: 10
      - name: Formal vs Informal
        type: sentence-rewrite
        description: Students rewrite 5 informal sentences in formal subjunctive form.
        duration: 10
