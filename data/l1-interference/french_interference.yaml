  presentative_il_y_a:
    interference_patterns:
    - pattern: il y a transfer to there is or are with agreement errors
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_l1: FR 'Il y a trois personnes' (il y a + plural, no agreement)
      example_gloss: there is three people (frozen form, no plural agreement in French)
      example_wrong: There is three people in the room
      example_correct: There are three people in the room
      explanation: "French il y a (literally it there has) is a frozen impersonal construction that does NOT agree with the noun that follows. Il y a is used for both singular and plural. French speakers transfer this non-agreement pattern to English, producing there is with plural nouns. Waugh & Monville-Burston (2002): Il y a is often reduced to /ja/ in speech. The construction il y a...qui is preferred in spoken French for presenting indefinite subjects."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 1"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: il y a literal translation as it has in English
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_l1: FR 'Il y a des gens qui parlent anglais'
      example_gloss: there are some people who speak English
      example_wrong: It has some people who speak English
      example_correct: There are some people who speak English
      explanation: "French uses il y a...qui (there is or are...who) as a presentative structure for indefinite subjects. French speakers may translate il y a literally as it has or it is there rather than the correct English existential there is or are. Waugh & Monville-Burston (2002): In ordinary speech, indefinite subjects are rarely found directly at the start of sentences. Speakers prefer Il y a quelqu'un qui a telephone."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 1(c)"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: There is many reasons to study
      correct: There are many reasons to study
    - wrong: It has a lot of people here
      correct: There are a lot of people here
    why_it_happens: "French il y a is a frozen existential construction that never agrees in number with the following noun. English there is or are requires agreement. Additionally, French il y a translates to English there is, not it has - but the literal components il (it) + y (there) + a (has) can mislead French speakers into literal translations. Waugh & Monville-Burston (2002): Il y a is the standard presentative construction for introducing new referents in French discourse."
    teacher_tips:
      how_to_explain: "Teach: FR il y a = EN there is or are (NOT it has). Drill agreement pattern: there is (singular) vs there are (plural). Contrast with French where il y a never changes."
      where_to_start: Start with there is or are agreement, then teach it has is NOT an equivalent of il y a
      sequencing: "There is or are agreement; it has vs there is; there is or are with relative clauses; review"
      exercises:
      - name: There Is There Are Drill
        type: fill-in-the-blank
        description: Students choose there is or there are for sentences with singular or plural nouns
        duration: 10
      - name: FR to EN Presentative
        type: translation
        description: Translate 15 French il y a sentences into English there is or are
        duration: 15
      - name: It Has vs There Is
        type: error-correction
        description: Students correct sentences where it has is incorrectly used for il y a
        duration: 15
