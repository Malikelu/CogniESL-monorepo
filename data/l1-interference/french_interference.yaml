  liaison_enchainement_complex:
    interference_patterns:
    - pattern: French CV syllable preference affects English consonant clusters
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: "FR petite amie /pətitami/ (CV syllabification across word boundary)"
      example_gloss: little friend-girl (no word boundary audible)
      example_wrong: "a boo-ok / a sto-ore (epenthetic vowel inserted)"
      example_correct: a book / a store
      explanation: "French strongly prefers CV syllables and uses enchainement - syllabifying across word boundaries. English allows complex consonant clusters and word-final consonants. French speakers may insert vowels to break up English consonant clusters, or link words inappropriately. Waugh & Monville-Burston (2002): The tendency in French is to have enchainement - not to make word boundaries within tightly bound groups of words. Stress falls on the final syllable of the phrasal group."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 2"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Liaison consonant insertion in English
      frequency: 2
      persistence: 2
      communicative_impact: 3
      example_l1: "FR les amis /le.za.mi/ (liaison z between les and amis)"
      example_gloss: the friends (liaison z-sound inserted)
      example_wrong: "the-z-people (liaison z inserted between article and noun)"
      example_correct: the people
      explanation: "French liaison pronounces a latent consonant (most commonly z, t, n) between words when the first ends in a consonant and the next begins with a vowel. French speakers may inappropriately insert liaison-like sounds in English. Waugh & Monville-Burston (2002): Des amis /de.za.mi/, mon ecole /mɔ̃.ne.kɔl/ - the most common liaison consonants are z, t, n."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 5"
      etiology: interlingual
      flagged: false
      tier: 4
      reliability: B
    - pattern: French final stress vs English word stress affecting rhythm
      frequency: 3
      persistence: 4
      communicative_impact: 3
      example_l1: French phrase stress on final syllable of the phrase
      example_gloss: stress on last syllable of phrase not on individual words
      example_wrong: "in-FLU-en-za (stress shifted to end of phrase)"
      example_correct: IN-flu-en-za (English stress on first syllable)
      explanation: "French is a phrase-stress language with stress on the final vowel of the phrasal group. English is a word-stress language. French speakers may shift stress to the end of English phrases or words. Waugh & Monville-Burston (2002): Stress in French is on the vowel in the last syllable of the phrasal group. Essentially, modern French is a final-stress, phrase-stress language."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 2"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: She be-LIEVES in the po-WER of education
      correct: She be-LIEVES in the POW-er of ed-u-CA-tion
    - wrong: He needs a boo-KS (epenthetic vowel before final s)
      correct: He needs books
    why_it_happens: "French syllabification ignores word boundaries (enchainement), creating CV syllables across words. French stress is phrase-final. Both conflict with English word-boundary-sensitive syllabification and lexical stress. French speakers apply L1 phonotactics to English, producing epenthetic vowels, inappropriate liaison consonants, and shifted stress. Waugh & Monville-Burston (2002): French has a preference for CV syllables. When a word ending in a consonant precedes a word beginning with a vowel, the consonant is syllabified with the next word."
    teacher_tips:
      how_to_explain: "Teach three rules: (1) English stress is on the word, not the end of the phrase. (2) English keeps word boundaries audible. (3) Do not add sounds between English words - no liaison. Drill word stress: IN-flu-ence not in-FLU-ence. Practice consonant clusters without epenthesis."
      where_to_start: Start with word stress placement, then consonant clusters, then liaison awareness
      sequencing: "Word stress; consonant clusters; linking across word boundaries; rhythm and intonation"
      exercises:
      - name: Stress Placement
        type: pronunciation
        description: Students mark stress on multisyllabic words and practice correct placement
        duration: 15
      - name: Consonant Cluster Practice
        type: pronunciation
        description: Students practice words with initial and final consonant clusters
        duration: 15
      - name: Liaison Awareness
        type: listening
        description: Students identify where English does or does not link words
        duration: 10
      - name: Phrase Rhythm
        type: pronunciation
        description: Students practice English rhythm with word stress not phrase-final stress
        duration: 15
