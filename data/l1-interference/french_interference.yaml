  adjective_placement:
    interference_patterns:
    - pattern: Post-nominal adjective placement
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_l1: FR 'une maison blanche'
      example_gloss: a house white
      example_wrong: a dress red / a lecture rather long / a request quite reasonable
      example_correct: a red car / a rather long lecture / a quite reasonable request
      explanation: 'Transfer from L1: Most attributive adjectives in French are placed
        after the noun. English places most adjectives before the noun.'
      citation: 'Swan & Smith 2001, Ch. ''French speakers'', § Word order: influence
        of French, point 1'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Post-nominal adjective with superlative
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'la femme la plus belle que je connais'
      example_gloss: the woman the most beautiful that I know
      example_wrong: She is the woman the most beautiful that I know.
      example_correct: She is the most beautiful woman that I know.
      explanation: 'Transfer from L1: French places most attributive adjectives after
        the noun and uses a post-nominal superlative structure (la plus belle). English
        places adjectives before the noun.'
      citation: 'Swan & Smith 2001, Ch. ''French speakers'', § Word order: influence
        of French, point 1'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: She bought a car red.
      correct: She bought a red car.
    - wrong: He has eyes blue.
      correct: He has blue eyes.
    - wrong: I need a pen new.
      correct: I need a new pen.
    why_it_happens: 'French typically places adjectives AFTER the noun (une maison
      blanche = a house white), unlike English which places most adjectives BEFORE
      the noun. Some French adjectives can go before or after with meaning changes.
      French learners transfer the post-nominal pattern. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach the English order: adjective + noun. French order: noun
        + adjective (usually). Drill: ''a big house'' (not ''a house big''), ''a red
        car'' (not ''a car red'').'
      where_to_start: 'Start with the basic rule: adjective before noun. Then teach
        the OSASCOMP order for multiple adjectives.'
      sequencing: 'Week 1: Single adjective before noun. Week 2: Multiple adjectives
        (OSASCOMP). Week 3: Adjectives that follow nouns (enough, alive). Week 4:
        Review.'
      exercises:
      - name: Adjective Swap
        type: sentence-rewrite
        description: Students rewrite 10 French-influenced phrases with adjectives
          before nouns.
        duration: 10
      - name: FR-to-EN Adjective Translation
        type: translation
        description: Translate 15 French noun phrases into correct English word order.
        duration: 15
      - name: Picture Description
        type: oral-drill
        description: Students describe pictures using correct adjective-noun order.
        duration: 10
      - name: Adjective Order
        type: sentence-rewrite
        description: Students arrange 10 sets of adjectives in correct English order.
        duration: 10
