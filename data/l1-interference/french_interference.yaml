      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of on instead of passive
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: FR 'On parle francais'
      example_gloss: one speaks French
      example_wrong: One speaks French here
      example_correct: French is spoken here
      explanation: 'Transfer from L1: Use of on instead of passive.'
