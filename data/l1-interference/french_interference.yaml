  plural_silent_marking:
    interference_patterns:
    - pattern: Plural s not pronounced in French except in liaison
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: "FR les amis /le.za.mi/ (plural z-sound only in liaison)"
      example_gloss: the friends (plural marked only via liaison z)
      example_wrong: "I have two friend / three book / many student"
      example_correct: I have two friends / three books / many students
      explanation: "French plural s is almost never pronounced except in liaison contexts before a vowel. French learners may omit English plural s because their L1 marks plurality primarily through the determiner (les, des, ces) rather than the noun. This is a phonological-spelling transfer. Waugh & Monville-Burston (2002): 'In the spoken language, this -s is not pronounced except in liaison contexts, where it is realized as /z/.'"
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 4"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Determiner-based plurality without noun marking
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: "FR des livres /de.liv/ (no plural sound on livres)"
      example_gloss: some books (plural marked by des not by sound on noun)
      example_wrong: I bought some book at the store
      example_correct: I bought some books at the store
      explanation: "In spoken French, pre-nominal determiners (des, les, ces) carry the plurality information through their own phonological form. The noun itself may have no audible plural marker. French speakers may transfer this strategy and rely on English determiners (some, two, these) to convey plurality, omitting the noun's -s ending."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 4"
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I have many friend
      correct: I have many friends
    - wrong: She bought three book
      correct: She bought three books
    - wrong: The child are playing
      correct: The children are playing
    why_it_happens: "French marks plural on the determiner (les, des, ces) rather than on the noun itself in spoken language. The French plural s is silent except in liaison. English requires the plural s or es on the noun itself. French learners must learn that English nouns must carry the plural marking even when the determiner already indicates plurality."
    teacher_tips:
      how_to_explain: "Teach: English requires plural s on the noun, even when some, two, many already indicate plurality. Contrast FR des livres /de.liv/ vs EN some books /sʌm bʊks/. Drill noun-final s as a spelling and pronunciation requirement."
      where_to_start: Start with regular plurals (-s, -es, -ies) and contrast with French silent plural
      sequencing: "Regular plurals; irregular plurals; determiner-noun agreement; review"
      exercises:
      - name: Plural Hearing
        type: listening
        description: Students listen to sentences and identify singular vs plural nouns
        duration: 10
      - name: Noun Ending Drill
        type: error-correction
        description: Students correct sentences with missing plural markers
        duration: 15
      - name: FR Plural Comparison
        type: translation
        description: Translate French noun phrases focusing on English plural marking
        duration: 15
    sources:
    - Swan & Smith "Learner English" Ch. 6
    - Waugh & Monville-Burston "The World's Major Languages" Ch.9
