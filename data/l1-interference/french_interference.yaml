  left_dislocation:
    interference_patterns:
    - pattern: Left dislocation with clitic resumption transferred to English
      frequency: 2
      persistence: 2
      communicative_impact: 2
      example_l1: "FR 'Pierre, cette fille, il n'arrete pas de lui telephoner'"
      example_gloss: Peter this girl he doesn't stop calling her
      example_wrong: Peter, this girl, he doesn't stop calling her
      example_correct: Peter doesn't stop calling this girl
      explanation: "French left dislocation (double marquage) moves NPs to the left periphery and repeats them with clitic pronouns. This is a natural spoken French discourse structure. French speakers may transfer it to English, producing ungrammatical sentences with a dislocated topic + pronoun resumption. Waugh & Monville-Burston (2002): One or several NPs can be moved to the left periphery and repeated by clitic pronouns or prefixes within the core (this resumption is called double marquage)."
      citation: "Waugh & Monville-Burston (2002) The World's Major Languages, Ch.9: French, Section 1(d)"
      etiology: interlingual
      flagged: true
      tier: 4
      reliability: B
    examples:
    - wrong: My brother, he works in London
      correct: My brother works in London
    - wrong: This problem, it is difficult to solve
      correct: This problem is difficult to solve
    why_it_happens: "French spoken discourse uses left dislocation as a topic-structuring device. The topic NP is fronted and a clitic pronoun resumes it in the main clause. English does not have this structure - left dislocation sounds like a speech error in English. Waugh & Monville-Burston (2002): Right dislocations are also possible, with the dislocated NP referred to as antitopic."
    teacher_tips:
      how_to_explain: "Teach: English does NOT repeat the topic with a pronoun. My brother, he works sounds like a mistake in English. Show the contrast: FR dislocation is grammatical in French but NOT in English. Teach correct English: just say My brother works in London."
      where_to_start: Start by showing the error (dislocation), then teach the direct English equivalent
      sequencing: "Topic-comment structure; avoiding pronoun resumption; written vs spoken English; review"
      exercises:
      - name: Dislocation Cleanup
        type: sentence-rewrite
        description: Students rewrite dislocated sentences in standard English
        duration: 15
      - name: FR to EN Dislocation
        type: translation
        description: Translate French left-dislocation sentences into standard English
        duration: 15
