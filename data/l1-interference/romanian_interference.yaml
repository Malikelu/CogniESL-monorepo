etiology:
- claim: 'Jarvis & Pavlenko (2008) identify eight conceptual domains where crosslinguistic
    influence occurs: objects, emotions, personhood, gender, number, time, space,
    and motion. L1 conceptual categories influence how L2 learners perceive and categorize
    reality.'
  conceptual_transfer: true
  factors_affecting_transfer:
  - proficiency_level
  - perceived_crosslinguistic_distance
  - recency_of_L2_use
  - markedness
  - L2_status_effect
  - cognitive_maturity
  - attention_to_language_form
  flagged: false
  reliability: B
  source: Jarvis & Pavlenko (2008) Crosslinguistic Influence in Language and Cognition.
    Routledge. Chapters 4-5.
  tier: 2
grammar_points:
  adverbs:
    citations:
    - claim: 'Grammar point: adverbs'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: 'Adverb placement varies: some languages place adjectives where English
        uses adverbs'
      location: See adverb entries
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: ELLs use adjectives where English requires adverbs (transfer from L1)
      location: p. 266
      source: 'Folse (2009) ''Keys to Teaching Grammar to English Language Learners:
        A Practical Handbook'', University of Michigan Press'
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    communicative_impact: 3
    examples:
    - correct: He runs very fast.
      wrong: He runs very fastly.
    flagged: false
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: He writes quickly
      example_gloss: Same form for adj/adv
      example_l1: ROMANIAN no -ly suffix
      example_wrong: '*He writes quick'
      explanation: 'Transfer from L1: Adjective vs adverb (romanian).'
      flagged: true
      frequency: 4
      pattern: Adjective vs adverb (romanian)
      persistence: 3
      reliability: B
      tier: 3
    persistence: 3
    source_count: 2
    source_rank: 2
    source_type: textbook
    sources: &id001
    - Swan & Smith "Learner English" (Romanian)
    - Parrott "Grammar for English Language Teachers"
    - McManus
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: 20 sentences with adverbs errors.
        duration: 15
        name: adverbs Audit
        type: error-correction
      - description: Translate 15 sentences focusing on adverbs.
        duration: 15
        name: adverbs Translation
        type: translation
      - description: 20 sentences practicing adverbs.
        duration: 10
        name: adverbs Practice
        type: fill-in-the-blank
      - description: A paragraph with 10 adverbs errors.
        duration: 15
        name: adverbs Error Hunt
        type: error-correction
      how_to_explain: 'Teach: Adjective describes a noun. Adverb describes a verb.
        Most adverbs add -ly.'
      sequencing: 'Week 1: adverbs. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      where_to_start: Start with the adverbs pattern.
    tier: 1
    why_it_happens: 'Romanian does not always distinguish adjectives from adverbs.
      English requires -ly. McManus (2022): The L1 is always active during L2 use
      cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation.'
