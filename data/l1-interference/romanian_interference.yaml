language: Romanian
language_code: ro
schema_version: '4.0'
sources:
- citation: 'Swan, M. & Smith (2001) Learner English, 2nd ed. Cambridge University Press. Ch. 4: Italian speakers'
  relevance: L1 interference patterns documented for this language group.
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Romanian
  relevance: Romanian phonological and grammatical transfer patterns — article enclitic,
    subjunctive
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: This essay argues that [specific claim]. Evidence from [source] demonstrates
      that [specific finding].
    error: '*Throughout human history, the question of how societies should organize
      themselves has preoccupied thinkers from Plato to the present day. This fundamental
      question touches upon the very nature of human existence and our collective
      aspirations for a better world.'
    explanation: Romanian essays favor broad philosophical openings; English essays
      require a concise introduction with a clear thesis.
  - correction: Research by [source] demonstrates that [specific finding], supporting
      the argument that [claim].
    error: '*As the great Romanian philosopher Eminescu wrote, ''Life is a fleeting
      shadow'' -- and so we must consider whether, in our modern context, the same
      wisdom applies to questions of social policy.'
    explanation: Romanian essays invoke literary authority; English academic writing
      requires empirical evidence from cited sources.
  description: 'Romanian rhetorical tradition, influenced by both Latin/French essayistic
    conventions and Eastern European academic practices, values elaborate, philosophical
    argumentation. Romanian essays often begin with broad, abstract framing and may
    delay the thesis in favor of extensive context. The Romanian ''eseu'' tradition,
    modeled on the French ''dissertation,'' may employ a dialectical structure (thesis-antithesis-synthesis)
    that presents multiple perspectives before arriving at a conclusion. Romanian
    writers may also use proverbs, literary references, and philosophical observations
    as argumentative strategies. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Romanian speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Divide into focused paragraphs of 80-150 words, each beginning with
      a clear topic sentence that states one main idea.
    error: '*A 200+ word paragraph with multiple sub-points, examples, and tangential
      observations without a clear unifying topic sentence.'
    explanation: Romanian paragraphs favor elaborate, multi-layered development; English
      paragraphs require a single unified idea with a clear topic sentence.
  - correction: State the main point first, then provide examples and evidence to
      support it.
    error: '*Paragraph develops through a series of examples and observations before
      stating the main point in the final sentence.'
    explanation: Romanian paragraphs may build toward a conclusion; English paragraphs
      state the point upfront.
  description: 'Romanian paragraphs tend to be longer and more elaborate than English
    paragraphs, reflecting the Romanian value of ''dezvoltare'' (development) in prose.
    Romanian writers may develop points through extensive use of examples, elaborations,
    and tangential observations, creating paragraphs that cover multiple related ideas.
    The topic sentence may appear at the end of the paragraph as a conclusion, and
    Romanian writers may include parenthetical observations that English considers
    off-topic. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Romanian speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: Although the policy was introduced to address poverty, the results
      were mixed, with some regions benefiting more than others.
    error: '*The policy was introduced. And it was meant to address poverty. But the
      results were mixed. And some regions benefited more.'
    explanation: Romanian coordinates between sentences with 'and' and 'but'; English
      uses subordination and varied connectors.
  - correction: These findings demonstrate the problem, indicate a need for reform,
      and suggest that action is required.
    error: '*This shows the problem. This indicates a need for reform. This suggests
      that action is required.'
    explanation: Romanian 'acesta' (this) is used as a general reference device; English
      requires more varied cohesive strategies.
  description: 'Romanian writers may use connectors in English that reflect Romanian
    discourse patterns, including overuse of ''and'' (si) and ''but'' (dar/insa) at
    the start of sentences. Romanian ''de asemenea'' (also), ''totusi'' (however),
    and ''prin urmare'' (consequently) may be directly transferred with incorrect
    frequency or placement. Romanian writers may also overuse demonstrative pronouns
    (''acesta'' = this) where English requires more varied cohesive devices. The Romanian
    tendency toward elaborate coordination can make English writing feel choppy. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Romanian speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: This investigation reveals findings that are significant for [field]
      because [specific reason].
    error: '*It is the humble opinion of the author that the present investigation
      has revealed certain findings which may, upon further reflection, prove to be
      of some significance for the field under consideration.'
    explanation: Romanian academic style favors elaborate hedging and nominalizations;
      English academic writing values directness and active constructions.
  - correction: Although the data have limitations, they support the conclusion that
      [specific claim].
    error: '*One might well ask: can it truly be said that the data, limited though
      they may be, adequately support the conclusions drawn?'
    explanation: Romanian academic writing uses rhetorical questions and elaborate
      hedging; English expects direct, confident claims with appropriate qualification.
  description: 'Romanian academic writing traditionally values a formal, elaborate
    style influenced by French academic conventions and the Romanian literary tradition.
    When transferred to English, this can produce prose that sounds overly ornate
    or indirect. Romanian writers may use extensive nominalizations, passive constructions,
    and complex syntax where English prefers active, direct expression. Romanian writers
    may also employ a more personal, engaging voice than English academic conventions
    permit, including rhetorical questions and subjective commentary. McManus (2022):
    Writing interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 19: Romanian speakers. Cambridge
    University Press.'
citations:
- claim: Romanian L1 speakers transfer phonological, grammatical, and writing patterns
    from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Romanian
  tier: 1
  reliability: B
  flagged: false
- claim: Romanian is a Romance language with enclitic definite articles, case system,
    and different tense-aspect usage — unique among Romance languages in its Balkan
    Sprachbund features
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning.
    Multilingual Matters.
  tier: 1
  reliability: B
  flagged: false
- claim: Romanian L1 speakers' errors in English include article usage transfer (Romanian
    has postpositive articles), pro-drop transfer, and case-to-preposition interference
    reflecting Romance L1 with Slavic contact features. James's error typology classifies
    these as interlingual errors from a unique Romance L1 with Balkan Sprachbund features.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that Romanian L1 speakers' article usage
    errors in English reflect the postpositive article system in Romanian. These transfer
    effects are more visible in academic prose where article frequency is highest
    and definite/indefinite distinctions are most critical.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5.4: Academic prose
    register'
  tier: 2
