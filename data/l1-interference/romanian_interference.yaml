      sequencing: 'Week 1: articles. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      where_to_start: Start with the articles pattern.
    tier: 1
    why_it_happens: 'Romanian omits the indefinite article after fi (to be) for professions.
      McManus (2022) explains that L2 speakers can learn new form-meaning mappings
      (like articles) that don''t exist in L1, but this requires extensive practice
      to become automatic. Online anticipatory processing (using articles to predict
      upcoming nouns) develops only with high proficiency and extended exposure, not
      from L1 transfer. McManus (2022) explains that L2 speakers can learn new form-meaning
      mappings that don''t exist in L1, but this requires extensive practice to become
      automatic. L2 learning involves creating new knowledge when L1-L2 differences
      exist AND developing selection mechanisms to manage competing knowledge sources
      (McManus 2022, Ch. 1). Online anticipatory processing develops only with high
      proficiency and extended exposure. Golden et al. (2017): Transfer is non-linear
      — functional fit between L1 and L2 systems matters more than mere formal similarity.
      English (Germanic) learners showed NO advantage over Slavic learners on Norwegian
      spatial prepositions. Gender system transfer is non-linear (L1 gender != automatic
      advantage). Conceptual transfer affects spatial relations, emotion language,
      and article use. Accuracy + text length account for 80% of writing ratings;
      cultural-rhetorical style accounts for the remaining 20%. Golden et al. (2017):
      Even L1s with article systems show non-linear transfer. Having articles helps
      but does not eliminate errors because specific article rules (definite/indefinite/zero)
      vary across languages. Transfer depends on functional fit of article usage rules,
      not just presence of articles in L1. Golden et al. (2017): Having L1 grammatical
      gender does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners
      of Norwegian did NOT show overall advantage over learners without gender. Gender
      transfer is non-linear: depends on number of genders, assignment rules, and
      functional alignment between systems. Odlin (Ch.2): "Transfer" term predates
      behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation,
      automaticity, entrenchment — explain transfer patterns. Weinreich and Lado both
      focused on crosslinguistic similarities/differences; CAH (Contrastive Analysis
      Hypothesis) was coined by Wardhaugh (1970), not Lado or Fries.'
