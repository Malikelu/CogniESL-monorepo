        and simple syllable structure (generally V or CV). English consonant clusters
        are difficult, and learners often break them by inserting short vowels (eg
        table as /teburu/). Key sound substitutions include - /l/ and /r/ both pronounced
        as a Japanese flap; /v/ as /b/; /th/ and /dh/ as /s/ and /z/; /t/ before /i/
        as /tsh/; /s/ before /i/ as /sh/. The full flavour of a Japanese accent is
        captured in the transcription of "The team who usually win have lost this
        year. They'll have to make a bigger effort in future."
