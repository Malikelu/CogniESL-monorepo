  determiners:
    interference_patterns:
    - pattern: Use of 'much' with countable nouns
      example_l1: Japanese quantifiers much/many and little/few can be predicative
      example_gloss: Japanese does not morphologically distinguish quantifiers for
        count vs. mass nouns
      example_wrong: Mountain is many. So vegetable field is few. / I have quite many
        English friends.
      example_correct: There are many mountains. So there are few vegetable fields.
        / I have quite a lot of English friends.
      explanation: Troublesome pairs of quantifiers include whole/all, all/every,
        several/any number of, far/a long way, long/a long time, much/a lot of, much/many,
        a bit/quite a bit, far/distant. Much/many and little/few in Japanese can be
        predicative, leading to errors like "Mountain is many. So vegetable field
        is few." Infelicitous collocations also arise, such as "I have quite many
        English friends."
