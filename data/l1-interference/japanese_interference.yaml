writing_interference:
  argumentative_essay:
    description: 'Japanese rhetorical tradition organizes essays according to ki-sho-ten-ketsu
      (introduction-development-turn-conclusion), a four-part structure derived from
      Chinese classical rhetoric. In this pattern, the "ten" (turn) section introduces
      a seemingly unrelated or tangential point before returning to the main argument,
      which can appear digressive or incoherent to English-language readers accustomed
      to linear thesis-support-conclusion organization. Swan & Smith (2001) note that
      the thesis statement in Japanese writing often comes at the end rather than
      the beginning, reflecting an inductive rhetorical philosophy. Japanese students
      writing English essays may therefore place their central claim in the final
      paragraph, may include sections that seem like unrelated tangents, and may leave
      readers uncertain of the writer''s position until the very end. Teachers should
      make the English deductive essay pattern explicit: introduce the thesis upfront,
      support it with evidence in body paragraphs, and restate it in the conclusion,
      explaining that this directness is a valued convention in English academic writing
      rather than a lack of subtlety. McManus (2022): Writing interference reflects
      learned attention from L1 discourse habits. L1 rhetorical patterns shape how
      writers organize and present arguments in L2. Restructuring these habits requires
      explicit attention-redirecting instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
  paragraph_structure:
    description: 'Japanese prose tends to organize paragraphs inductively, delaying
      the topic sentence until the end of the paragraph or omitting it entirely, with
      the reasoning and evidence presented first so the reader can draw the appropriate
      conclusion. Swan & Smith (2001) describe Japanese as a "reader-responsible"
      language, meaning the reader is expected to infer the writer''s intended meaning
      from context, implication, and suggestion rather than from explicit topic sentences
      and transitions. When Japanese L1 learners write English paragraphs, they often
      fail to include a clear opening topic sentence, placing supporting details before
      the main idea. The result can feel circular or poorly organized to English readers
      accustomed to "writer-responsible" paragraph structure where the topic sentence
      comes first. Teachers should model English paragraph structure explicitly, using
      graphic organizers or outlines that show the topic sentence at the top, followed
      by supporting and detail sentences. McManus (2022): Writing interference reflects
      learned attention from L1 discourse habits. L1 rhetorical patterns shape how
      writers organize and present arguments in L2. Restructuring these habits requires
      explicit attention-redirecting instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
  cohesion_devices:
    description: 'Japanese relies far more on contextual inference and shared knowledge
      between writer and reader than English does, resulting in fewer explicit cohesive
      devices such as "however," "therefore," "in addition," and "on the other hand."
      Swan & Smith (2001) observe that cohesion in Japanese is often achieved through
      particles, word order, and contextual cues rather than through overt connectors.
      The Japanese particles "wa" (topic marker) and "ga" (subject marker) carry important
      information about what is already known and what is new or contrasted, but these
      distinctions have no direct equivalent in English. Japanese learners may therefore
      produce English essays with underdeveloped connective tissue, omitting transition
      words that English paragraphs require for readability. Specific attention should
      be given to teaching additive, adversative, causal, and temporal connectors
      explicitly, as the L1 does not require them with the same frequency or in the
      same positions. McManus (2022): Writing interference reflects learned attention
      from L1 discourse habits. L1 rhetorical patterns shape how writers organize
      and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
      instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
  academic_register:
    description: 'Japanese academic writing conventions emphasize indirectness, collective
      perspective, and a reluctance to assert strong personal claims, reflecting cultural
      values that prize harmony, tentativeness, and deference to established knowledge.
      Swan & Smith (2001) note that hedging is deeply embedded in Japanese academic
      prose, with writers avoiding bold assertions or direct challenges to existing
      scholarship. What constitutes appropriate hedging differs between the two languages:
      a Japanese academic writer may consider it entirely proper to present claims
      with extensive qualifiers and indirect constructions, while the same level of
      hedging in English academic writing can be interpreted as weak argumentation.
      Self-assertion patterns also differ markedly; Japanese writers tend to minimize
      first-person pronouns and personal opinions, preferring passive constructions
      and impersonal statements. Teachers should provide explicit instruction in the
      conventions of English academic register, including when hedging is appropriate,
      how to make and support claims directly, and when first-person statements are
      acceptable in academic essays. McManus (2022): Writing interference reflects
      learned attention from L1 discourse habits. L1 rhetorical patterns shape how
      writers organize and present arguments in L2. Restructuring these habits requires
      explicit attention-redirecting instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
