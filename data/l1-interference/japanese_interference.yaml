    interference_patterns:
    - pattern: Consonant cluster difficulty and vowel epenthesis
      example_l1: Japanese syllable structure is very simple (generally vowel + consonant
        or vowel alone); few consonant clusters exist
      example_gloss: Japanese breaks up English consonant clusters by inserting short
        vowels
      example_wrong: table pronounced as /teburu/; match pronounced as /mat Ji/; berry
        for very; shin for thin; zen for then
