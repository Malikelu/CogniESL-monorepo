  passive_voice:
    interference_patterns:
    - pattern: Avoidance of passive voice (japanese)
      example_l1: Japanese has a suffixed passive, but its range of use differs from
        English
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Japanese passive suffix differs in range from English passive
      example_wrong: Usually the house of Japan makes in wood.
      example_correct: Houses in Japan are usually made of wood.
      explanation: 'Transfer from L1: Japanese has a suffixed passive, but its range
        of use differs from English. Inanimate subjects take a passive verb less readily
        in Japanese, so students may find it difficult to construct English passives.
        Also, a Japanese passive can be used where it is not possible in English (e.g.,
        "He was stolen his money" for "He had his money stolen").'
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Passives', point 1
      reliability: B
    examples:
    - wrong: Someone built this house in 1900.
      correct: This house was built in 1900.
    why_it_happens: 'Kuno (1973) Ch.4: Japanese ADVERSITY PASSIVE uses the same passive
      morpheme for INTRANSITIVE verbs: "John was fallen by rain" / "John was died
      by his wife" — impossible in English. Adversity passives mean the subject was
      adversely affected by the event. Japanese learners may overgeneralize English
      passive to intransitive contexts ("*I was rained on") from L1 transfer of this
      productive construction. Japanese uses passive less frequently than English.
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
