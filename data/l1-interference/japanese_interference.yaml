  articles_advanced:
    interference_patterns:
    - pattern: Definite article overgeneralization
      example_l1: Japanese has no article system; all nouns appear without articles
      example_gloss: Japanese nouns appear bare, with definiteness inferred from context
      example_wrong: We used to live in the big house in suburb of Fukuoka. A house
        was built of the wood.
      example_correct: We used to live in a big house in the suburbs of Fukuoka. The
        house was built of wood.
      explanation: Japanese has no article system at all. Learners at an elementary
        level produce errors like "in suburb of Fukuoka" and "built of the wood" because
        the concept of a/an vs the vs zero article is entirely foreign.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Number and the use
        of articles', point 2
      reliability: B
    - pattern: Article omission with abstract nouns
      example_l1: Japanese has no article system; abstract nouns appear without articles
      example_gloss: Japanese abstract nouns appear bare
      example_wrong: I usually spend Sunday by a river; the people who work in office
        need to relax in some countryside.
      example_correct: I usually spend Sundays by a river; people who work in offices
        need to relax in the countryside.
      explanation: Japanese has no article system, so learners struggle with article
        usage in English even at advanced levels. Many Japanese learners achieve creditable
        proficiency in all aspects of written English except for articles and the
        number-countability problem.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Number and the use
        of articles', point 3
      reliability: B
    - pattern: 'Golden et al. (2017): L1s without articles show more difficulty —
        confirmed across typologically diverse L1s'
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_l1: 'Japanese: no article system'
      example_gloss: Japanese expresses definiteness through context, word order,
        or classifiers
      example_wrong: '''I went to school'' / ''the school'' (article choice difficulty)'
      example_correct: '''I went to school'' (zero article for institutions) / ''I
        went to the school'' (specific)'
      explanation: 'Golden et al. (2017): Confirmation that any L1 group without articles
        will have MORE difficulty with English articles than L1s with articles (Odlin
        Ch.3 prediction confirmed). Vietnamese learners omit articles more but are
        accurate when present (classifier compensation effect). This non-linear transfer
        pattern shows article acquisition is about functional fit, not just L1-L2
        formal similarity.'
      etiology: conceptual_transfer
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Japanese L1 → English article difficulty: Odlin (Ch.3, Ch.5) group-level
        prediction confirmed'
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_l1: 'Japanese: no article system'
      example_gloss: Japanese has no articles; definiteness expressed through other
        means
      example_wrong: '''I went school'' / ''I like the life'' (article errors persistent)'
      example_correct: '''I went to school'' / ''I like life'''
      explanation: 'Odlin (Ch.3, Ch.5): Jarvis (1998) confirmed that L1 groups without
        articles (Finnish, Vietnamese, Korean, Japanese, etc.) have significantly
        MORE difficulty with English articles than groups with articles (Swedish,
        French, German). Group-level predictions hold: any L1 without articles will
        struggle. Golden et al. (2017) confirmed Vietnamese pattern: omit more but
        accurate when present.'
      etiology: negative_transfer
      flagged: true
      tier: 4
      reliability: B
    why_it_happens: 'Japanese article usage differs from English in several contexts,
      leading to overgeneralization or omission errors. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: English omits articles before school, church, bed, work,
        home (when used in their primary sense).'
      where_to_start: Start with the most common article errors.
      sequencing: 'Week 1: Articles with institutions. Week 2: Articles with abstract
        nouns. Week 3: Review.'
    flagged: false
    tier: 3
    exercises:
    - name: Article Choice
      type: fill-in-the-blank
      description: 20 sentences choosing correct article usage.
      duration: 10
