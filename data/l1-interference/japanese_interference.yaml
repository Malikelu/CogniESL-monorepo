  linking_words:
    interference_patterns:
    - pattern: Linking words (japanese)
      example_l1: Japanese conjunction 'to' can correspond to and, with, when, if,
        whenever, as, to, from; 'mo' corresponds to also, both...and, either...or,
        whether...or, even, though, -ever
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Japanese conjunctions map variously to multiple English equivalents
      example_wrong: I am working very hard. Because I want to succeed an exam. But
        I am afraid I can't succeed it. So I must be more diligence.
      example_correct: I am working very hard because I want to pass an exam. However,
        I am afraid I can't pass it, so I must be more diligent.
      explanation: 'Transfer from L1: English and Japanese conjunctions do not always
        have simple one-to-one equivalents. Japanese conjunctions often double as
        postpositions or particles. Learners may not appreciate the clause-combining
        role of English conjunctions, and there is a strong tendency to use them with
        one-clause sentences.'
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Conjunctions and complex
        sentences', point 1
      reliability: B
    examples:
    - wrong: But, I think we should go.
      correct: However, I think we should go.
    why_it_happens: 'Japanese discourse connectors differ from English. Japanese ''demo''
      functions as both ''but'' and ''however,'' and Japanese allows double conjunctions
      that are redundant in English. Learners may produce sentences like ''Although
      it rained, but we went out.'' This transfer occurs because discourse conventions
      are deeply embedded in L1. McManus (2022): The L1 is always active during L2
      use cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: ''However'' for formal writing. ''But'' for informal.'
