      tier: 4
  word_order:
    interference_patterns:
    - pattern: SOV word order transfer (Japanese is SOV)
      example_l1: Watashi wa kore o kakimashita.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I speaking-of this object-particle wrote (= I wrote this.)
      example_wrong: She didn't know the word, so she looked up it.
      example_correct: She didn't know the word, so she looked it up.
      explanation: 'Transfer from L1: Japanese is strictly SOV (Subject-Object-Verb)
        while English is SVO. Japanese postpositions follow nouns, and pronoun objects
        with phrasal verbs cause difficulty.'
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Word order', point
        1
      reliability: B
    - pattern: SOV word-order transfer from Japanese (Odlin Ch.4)
      frequency: 4
      persistence: 4
      communicative_impact: 4
      example_l1: Watashi wa hon o katta
      example_gloss: I [topic] book [object] bought
      example_wrong: '''I book bought'' (SOV transfer [Japanese -> English])'
      example_correct: '''I bought a book'' (SVO)'
      explanation: 'Odlin (Ch.4): Japanese is SOV and basic word order IS transferable.
        Hawaiian Pidgin English: Japanese SOV patterns (Nagara 1972; Bickerton & Givon
        1976). Verb-final utterances more common among LESS proficient speakers. Bamboo
        English: Japanese SOV influence (Hayashi 1972). Bickerton & Givon (1976):
        the LEAST proficient speakers show the MOST word-order transfer. Odlin refutes
        Zobl & Rutherford''s universal constraint with 11 counter-examples. Rutherford
        (1983) claimed Japanese learners "never" produce SOV in English, but his subjects
        were college-level -- not true beginners (English required pre-college in
        Japan). Observational bias.'
      etiology: substratum_transfer
      flagged: true
      tier: 4
      reliability: B
    examples:
    - wrong: Watashi wa hon o kaimashita.
      correct: I bought a book.
    why_it_happens: 'Kuno (1973) Ch.1: Japanese is a RIGID SOV language with strict
      Verb-Final Constraint (stronger than Turkish, Hindi, Persian). SOV-OSV ratio
      17:1. Japanese is POSTPOSITIONAL — 70+ postpositional particles express all
      case relations (no prepositions). WH-words do NOT prepose (Greenberg U12: SOV
      → no WH-movement): Japanese learners produce "*You bought what?" — wh-movement
      learned from scratch. Japanese is strictly SOV (Subject-Object-Verb) while English
      is SVO. In Japanese, the verb always comes at the end of the sentence. Japanese
      learners may transfer this pattern to English, producing sentences like ''I
      the book bought'' instead of ''I bought the book.'' This transfer occurs because
      word order is deeply automatized from L1 acquisition. McManus (2022): The L1
      is always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: English is ALWAYS Subject-Verb-Object.'
      where_to_start: Start with the word order pattern.
      sequencing: 'Week 1: word order. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: word_order Audit
        type: error-correction
        description: 20 sentences with word order errors.
        duration: 15
      - name: word_order Translation
        type: translation
        description: Translate 15 sentences focusing on word order.
        duration: 15
      - name: word_order Practice
        type: fill-in-the-blank
        description: 20 sentences practicing word order.
        duration: 10
      - name: word_order Error Hunt
        type: error-correction
        description: A paragraph with 10 word order errors.
        duration: 15
