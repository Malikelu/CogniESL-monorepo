  false_friends:
    interference_patterns:
    - pattern: Confusion of wasei-eigo (JP-EN false friends)
      example_l1: Japanese uses many English-derived words with modified or shifted
        meanings (wasei-eigo)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Japanese has adopted many English words with modified pronunciation
        and sometimes shifted meaning
      example_wrong: I bought this at the library. (= bookstore; Jap. toshokan means
        library but learners confuse it) / I live in a mansion. (= apartment; Jap.
        manshon means apartment block)
      example_correct: I bought this at the bookstore. / I live in an apartment.
      explanation: 'Transfer from L1: Japanese has adopted a large number of English
        words, but their pronunciation has often been so modified that they are no
        longer recognizable (emurushon=emulsion, torekkingu=trekking, ranchi=lunch,
        shiruba=silver, sabisu=service). Some are home-grown and unknown outside Japan
        (beddo-taun=dormitory town, kanningu=cheating). Students use these on the
        innocent assumption that they are current outside Japan.'
