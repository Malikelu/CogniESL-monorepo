  phonology:
    interference_patterns:
    - pattern: Confusion of /l/ and /r/ (Japanese lacks distinction)
      example_l1: Japanese /r/ (a flap almost like a short /d/)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Japanese has a single liquid phoneme realized as an alveolar
        flap, falling between English /l/ and /r/
      example_wrong: glamour for grammar; election for erection
      example_correct: grammar; erection
      explanation: 'Transfer from L1: Japanese does not distinguish /l/ and /r/ as
        separate phonemes. Japanese has a single sound (an alveolar flap almost like
        a short /d/) that falls between English /l/ and /r/. This causes confusion
        in pairs like glamour/grammar and election/erasure.'
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Consonants', point
        1
      reliability: B

    - pattern: Mora-timed rhythm (not stress-timed)
      example_l1: Japanese is mora-timed; each mora gets equal duration
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Japanese has moraic nasal, moraic obstruent, and long vowels each counting as two morae; English is stress-timed
      example_wrong: aBUSted with equal stress on all syllables, HOtel with wrong stress placement
      example_correct: aBUSted and HOtel with appropriate English stress timing
      explanation: "Transfer from L1: Japanese is a mora-timed language where each mora receives roughly equal duration (Shibatani 1990, The Languages of Japan, Ch.44, Phonology section). English is stress-timed, with stressed syllables longer and unstressed syllables reduced. Japanese learners apply mora timing to English, producing equal-duration syllables that sound flat to English ears. The moraic nasal and geminate consonants each count as one mora. Long vowels count as two morae. This rhythmic transfer causes stress placement errors and difficulty with English vowel reduction in unstressed syllables."
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Shibatani (1990) The Languages of Japan, Ch.44, Phonology
      reliability: B
    - pattern: Vowel devoicing of high vowels in voiceless environments
      example_l1: Japanese /i/ and /u/ devoice between voiceless consonants
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: High vowels /i/ and /u/ become voiceless when flanked by voiceless consonants or word-finally after voiceless consonants
      example_wrong: ski pronounced with full vowel; suit as /sut/; keep as /kiup/
      example_correct: ski /ski/; suit /su:t/; keep /ki:p/
      explanation: "Transfer from L1: Japanese high vowels /i/ and /u/ devoice when flanked by voiceless consonants or in word-final position after voiceless consonants (Shibatani 1990, The Languages of Japan, Ch.44, Phonology section). The unrounded /u/ is particularly susceptible. Japanese learners may devoice or drop these vowels in English. Accented high vowels do not devoice, and the rule is less frequent in slow speech."
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Shibatani (1990) The Languages of Japan, Ch.44, Phonology
      reliability: B
    - pattern: Palatalization and affrication before /i/
      example_l1: Japanese dental consonants palatalize before /i/
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: /s/ becomes [sh] before /i/; /t/ becomes [ch] before /i/; /z/ becomes [j] before /i/
      example_wrong: seat pronounced as /shit/; team pronounced as /chi:m/
      example_correct: seat /si:t/; team /ti:m/
      explanation: "Transfer from L1: Japanese dental consonants undergo pervasive palatalization and affrication before /i/ (Shibatani 1990, The Languages of Japan, Ch.44, Phonology section). /s/ becomes [sh], /t/ becomes [ch], /z/ becomes [j] before /i/. This causes Japanese learners to pronounce English ''seat'' as ''shit'', ''team'' as ''cheem''. The palatalized versions are allophonic in native Japanese vocabulary but become phonemic in Sino-Japanese words."
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Shibatani (1990) The Languages of Japan, Ch.44, Phonology
      reliability: B
    examples:
    - wrong: I have a rice of bread.
      correct: I have a loaf of bread.
    why_it_happens: 'Japanese phonology does not distinguish /l/ and /r/ as separate
      phonemes. Japanese has a single sound that falls between English /l/ and /r/.
      Japanese learners may confuse these sounds in English, producing ''fright''
      for ''flight'' or ''lice'' for ''rice.'' This error persists because the L1
      phonological system does not mark this distinction. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: /v/ vs /w/, /θ/ vs /t/.'
      where_to_start: Start with the phonology pattern.
      sequencing: 'Week 1: phonology. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
