  relative_clauses:
    interference_patterns:
    - pattern: Relative pronoun (japanese)
      example_l1: Tokyo in born I
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Tokyo in born I (= I, who was born in Tokyo...)
      example_wrong: This story reminds me of my memory which I was in the elementary
        school.
      example_correct: This story reminds me of when I was in elementary school.
      explanation: 'Transfer from L1: Relative pronouns do not exist in Japanese.
        Nouns are modified by complex phrases which come before the noun (prenominal
        relative clauses). Learners have serious difficulty with English relative
        pronouns and often avoid using them. Misunderstanding of relatives also leads
        to "which" being used as a general-purpose connector.'
      etiology: interlingual
      flagged: true
      tier: 3
      citation: Swan & Smith 2001, Ch. 'Japanese speakers', § 'Relatives', point 1
      reliability: B
    examples:
    - wrong: The man which I met is my boss.
      correct: The man who I met is my boss.
    why_it_happens: 'Kuno (1973) Ch.20-21: Japanese is LEFT-BRANCHING — genitives,
      adjectives, and relative clauses precede head nouns without relative pronouns.
      "Mary ga kaita hon" = "book that Mary wrote." English is RIGHT-BRANCHING. Japanese
      learners process English relative clauses in reverse structural direction from
      their L1, producing attachment and ordering difficulties. Japanese uses a universal
      relative pronoun. English distinguishes who/which/that. McManus (2022): The
      L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: For people -> who/that. For things -> that/which.'
      where_to_start: Start with the relative clauses pattern.
      sequencing: 'Week 1: relative clauses. Week 2: Practice. Week 3: Review. Week
        4: Mixed.'
