    from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Somali
  tier: 1
  reliability: B
  flagged: false
- claim: Somali is a Cushitic language with topic-comment structure, no articles,
    a complex tense-aspect system, and different word order
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 1
  reliability: B
  flagged: false
