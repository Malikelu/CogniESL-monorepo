language: Somali
language_code: so
schema_version: '4.0'
note: 'Data sourced from L1 Interference ESL Teacher Resources — Comparative Analysis
  of Cross-Linguistic Influence (S09). This is a reference survey document; specific
  Somali contrastive studies are limited. Tier ratings reflect S09 transfer matrix
  classifications (tier 4 = general reference, not primary Somali-specific research).
  Note: The /g/ devoicing pattern is flagged as "Uncertain / Needs research" — S09
  lacks Somali-specific phonology validation. Treat as hypothesis, not confirmed transfer.

  '
grammar_points:
  prepositions:
    interference_patterns:
    - pattern: Preposition substitution — Somali postpositions transferred to English
        with incorrect preposition choice or postposition-like structures
      example_l1: '*The girl the library she in she writes.'
      example_wrong: '*The girl the library she in she writes.'
      example_correct: The girl writes in the library.
      explanation: 'Somali possesses only four native postpositions with broad, highly
        generalized semantic meanings. These postpositions follow the noun (unlike
        English prepositions which precede it), and their broad semantic ranges make
        direct translation to English''s many specific prepositions (in, on, at, to,
        from, by, with, etc.) extremely difficult. Learners may produce word-order
        errors reflecting the postpositional structure, or substitute incorrect English
        prepositions due to the many-to-many mapping between Somali postpositions
        and English prepositions.

        '
      frequency: 4
      persistence: 4
      communicative_impact: 4
      etiology: interlingual
      flagged: true
      tier: 4
      reliability: B
    why_it_happens: 'Somali has only 4 native postpositions with broad, highly generalized
      semantic meanings. English has dozens of prepositions with specific, differentiated
      meanings. The structural difference (postpositions vs. prepositions) combined
      with the semantic mismatch (4 broad categories vs. many specific ones) creates
      systematic transfer difficulty. (L1 Interference ESL Teacher Resources, S09,
      Syntactic and Morphological Transfer Matrix: Prepositional Substitution).

      '
    teacher_tips:
      how_to_explain: 'Teach English prepositions as spatial concepts first (using
        diagrams and physical objects), then extend to temporal and abstract uses.
        Contrast with Somali postpositional structure explicitly.

        '
      where_to_start: 'Begin with the most common English prepositions (in, on, at,
        to, from) and their spatial meanings before moving to collocational uses.

        '
      sequencing: 'Week1: in/on/at (place). Week2: to/from (direction). Week3: by/with
        (instrumental). Week4: collocational prepositions (good at, interested in).'
    citations:
    - claim: Interference pattern for prepositions in Somali
      source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
        Ch. Somali
      tier: 1
  articles:
    interference_patterns:
    - pattern: Article omission or incorrect use
      example_wrong: '*He has job.'
      example_correct: He has a job.
      explanation: 'Somali has a definite article suffix (-ka/-ta/-ha) but no indefinite
        article. The definite article is a bound morpheme attached to the noun, not
        a separate word. English requires both definite (the) and indefinite (a/an)
        articles as separate words. Learners may omit indefinite articles entirely
        and struggle with the definite/indefinite distinction.

        '
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 4
      reliability: B
    why_it_happens: 'Somali has a definite article (suffix -ka/-ta/-ha) but no indefinite
      article. English requires both. The structural difference (bound suffix vs.
      independent word) and the absence of an indefinite article create transfer difficulty.
      (L1 Interference ESL Teacher Resources, S09, Syntactic and Morphological Transfer
      Matrix: Article Omission).

      '
    citations:
    - claim: Interference pattern for articles in Somali
      source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
        Ch. Somali
      tier: 1
  word_order:
    interference_patterns:
    - pattern: SOV word order transfer — Somali clitic pronouns in Verbal Group are
        in S-O-V order, with verb-final preference
      example_wrong: '*The man the book read.'
      example_correct: The man read the book.
      explanation: Somali has a Verbal Group (VGP) with rigid S-O-V clitic order inside
        it, while full noun phrases occur freely before or after the VGP (Saeed Ch.
        6.1). The underlying preference is for verb-final clause structure (Saeed
        Ch. 9.1). English requires fixed SVO order.
      frequency: 4
      persistence: 4
      communicative_impact: 4
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali clitic pronouns in the Verbal Group are in fixed S-O-V
      order, while full NPs occur outside the VGP in pragmatically-governed positions
      (Saeed Ch. 6.1, 7.2). English has fixed SVO with no clitic doubling system.
    citations:
    - claim: Somali Verbal Group has S-O-V clitic order with full NPs free outside
        the VGP; underlying preference for verb-final structure
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 6.1 (Verbal Group) and Ch.
        9.1 (Information Structure)
      tier: 1
  questions:
    interference_patterns:
    - pattern: No subject-auxiliary inversion in questions — Somali uses question
        particles without word order change
      example_wrong: '*You are coming? *What you want?'
      example_correct: Are you coming? What do you want?
      explanation: Somali polar questions are marked by particle ma replacing waa
        with no word order change (Saeed Ch. 7.5). Information questions use baa focus
        without inversion. English requires inversion in both types. Palmer (1968)
        confirms this as a major difficulty area for Somali students.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali marks questions with particles (ma, baa) rather than word
      order changes (Saeed Ch. 7.5). English requires subject-auxiliary inversion
      and wh-movement.
    citations:
    - claim: Somali polar questions use particle ma with no word order change; information
        questions use baa focus without inversion
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 7.5 (Questions)
      tier: 1
    - claim: English question formation (inversion, wh-movement, tag questions) is
        a major area of difficulty for Somali students
      source: 'Palmer, Joe Darwin (1968) Advanced English: Lessons in Grammar. Ministry
        of Education, Mogadiscio, Somali Republic. Ch. 1 (The Phrase-Structure of
        Simple Sentences)'
      tier: 1
  verbs_tense_aspect:
    interference_patterns:
    - pattern: Progressive used with stative verbs — Somali stative verbs do not occur
        in progressive forms
      example_wrong: '*I am knowing the answer. *She is having a car.'
      example_correct: I know the answer. She has a car.
      explanation: Somali stative verbs do not occur in progressive forms or imperatives
        (Saeed Ch. 4.3). Somali learners may overgeneralize the progressive to stative
        verbs in English.
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Future tense word order — Somali uses infinitive + auxiliary doon construction
      example_wrong: '*I go will to school.'
      example_correct: I will go to school.
      explanation: 'Somali future is an auxiliary construction: infinitive + present
        habitual of doon (Saeed Ch. 4.3). English uses modal auxiliary will before
        the base verb.'
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali has 12 verbal paradigms (Saeed Ch. 4.3). The future is
      periphrastic (infinitive + doon auxiliary). Progressive is not used with stative
      verbs.
    citations:
    - claim: Somali has 12 verbal paradigms; progressive not used with stative verbs;
        future is infinitive + doon auxiliary
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 4.3 (Verbs)
      tier: 1
    - claim: English verb inflection is a major area requiring pattern drills for
        Somali students
      source: 'Palmer, Joe Darwin (1968) Advanced English: Lessons in Grammar. Ministry
        of Education, Mogadiscio, Somali Republic. Ch. 5 (Verb Inflection) and Ch.
        6 (Verb Phrase Formatives)'
      tier: 1
  noun_phrase:
    interference_patterns:
    - pattern: Noun phrase word order — Somali places head noun first, then suffixed
        determiner, then adjective
      example_wrong: '*man the tall'
      example_correct: the tall man
      explanation: 'Somali noun phrases are head-initial: Noun + suffixed Determiner
        + Adjective + Relative Clause (Saeed Ch. 6.2). English is: Determiner + Adjective
        + Noun.'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali NP structure is N + suffixed determiner + adjective (Saeed
      Ch. 6.2). English requires Det + Adj + N.
    citations:
    - claim: 'Somali NP is head-initial: Noun + suffixed determiner + adjective; adjectives
        follow head noun'
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 6.2 (Noun Phrase)
      tier: 1
  relative_clauses:
    interference_patterns:
    - pattern: Relative pronoun omission or resumptive pronoun use — Somali has no
        relative pronoun
      example_wrong: '*The man who I saw him yesterday is my teacher.'
      example_correct: The man (who/that) I saw yesterday is my teacher.
      explanation: Somali restrictive relative clauses have no relative pronoun; the
        relativized position is marked by a gap (Saeed Ch. 8.1). English requires
        relative pronouns.
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali has no relative pronoun; relative clauses use a gap strategy
      (Saeed Ch. 8.1). Palmer (1968) Ch. 3 covers relative clauses extensively for
      Somali students.
    citations:
    - claim: Somali has no relative pronoun in restrictive relative clauses; uses
        gap strategy
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 8.1 (Restrictive Relative
        Clauses)
      tier: 1
    - claim: English relative clauses are taught extensively to Somali students, indicating
        a major interference area
      source: 'Palmer, Joe Darwin (1968) Advanced English: Lessons in Grammar. Ministry
        of Education, Mogadiscio, Somali Republic. Ch. 3 (Relative Clauses), Sections
        1-12'
      tier: 1
  copula_be:
    interference_patterns:
    - pattern: Copula omission — Somali has verbless equative sentences (no copula
        for A-is-B)
      example_wrong: '*He teacher. *She doctor.'
      example_correct: He is a teacher. She is a doctor.
      explanation: Somali has verbless equative sentences using only waa between subject
        and predicate — no copula verb (Saeed Ch. 7.3).
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali verbless equative sentences use only waa between subject
      and predicate (Saeed Ch. 7.3). English requires 'be' as a copula.
    citations:
    - claim: Somali has verbless equative sentences with no copula verb
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 7.3 (Verbless Declaratives)
      tier: 1
  negation:
    interference_patterns:
    - pattern: Negation without auxiliary do — Somali negates with particle ma, without
        do-support
      example_wrong: '*I not go. *She not like it.'
      example_correct: I do not go. She does not like it.
      explanation: Somali negation uses particle ma within the VGP; past negatives
        are invariable (Saeed Ch. 4.3, 7.2). English requires do-support.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    why_it_happens: Somali negation uses particle ma within the VGP (Saeed Ch. 4.3,
      7.2). English requires do-support.
    citations:
    - claim: Somali negation uses particle ma within the VGP; past negatives are invariable
      source: Saeed, John I. (1999) Somali. London Oriental and African Language Library,
        Vol. 10. John Benjamins Publishing Company. Ch. 4.3 (Verbs) and Ch. 7.2 (Declaratives)
      tier: 1
phonology_interference:
  consonant_gaps:
  - phoneme: /g/ — voiced velar plosive
    transfer_state: Partial transfer — exists in Somali but may weaken between vowels
    error_pattern: Possible weakening to fricative between vowels (allophonic)
    explanation: Somali /g/ exists in the inventory and is shared with English. However,
      Somali voiced plosives b, d, g may weaken to fricatives between vowels (Saeed
      Ch. 2.1).
    frequency: 1
    persistence: 1
    communicative_impact: 1
    tier: 1
  - phoneme: /q/ — uvular plosive
    transfer_state: Negative transfer — no English equivalent
    error_pattern: Substitution with /k/ or /g/; may be devoiced initially/finally
    explanation: Somali has a voiced uvular plosive with no English equivalent (Saeed
      Ch. 2.1). Somali learners may substitute English /k/ or /g/.
    frequency: 3
    persistence: 3
    communicative_impact: 2
    tier: 1
  - phoneme: /dh/ — retroflex plosive
    transfer_state: Negative transfer — no English equivalent
    error_pattern: Substitution with /d/ or /r/
    explanation: Somali has a voiced retroflex plosive (orthographic dh) with no English
      equivalent (Saeed Ch. 2.1).
    frequency: 3
    persistence: 3
    communicative_impact: 2
    tier: 1
  - phoneme: /x/ — voiceless pharyngeal fricative
    transfer_state: Negative transfer — no English equivalent
    error_pattern: Substitution with /h/ or /k/
    explanation: Somali has voiceless pharyngeal fricative (orthographic x) with no
      English equivalent (Saeed Ch. 2.1).
    frequency: 3
    persistence: 3
    communicative_impact: 2
    tier: 1
  - phoneme: /c/ — voiced pharyngeal fricative
    transfer_state: Negative transfer — no English equivalent
    error_pattern: Substitution with glottal stop, /h/, or vowel
    explanation: Somali has voiced pharyngeal fricative (orthographic c) with no English
      equivalent (Saeed Ch. 2.1). One of the most distinctive Somali sounds.
    frequency: 3
    persistence: 4
    communicative_impact: 3
    tier: 1
  - phoneme: glottal stop
    transfer_state: Partial transfer — phonemic in Somali, allophonic in English
    error_pattern: Omission or insertion of glottal stops in vowel-initial words
    explanation: Somali has a phonemic glottal stop occurring between vowels and word-finally
      (Saeed Ch. 2.1). English has it only as an allophone.
    frequency: 2
    persistence: 2
    communicative_impact: 1
    tier: 1
  vowel_system:
    description: Somali has 10 vowel phonemes (5 qualities by 2 ATR series) with phonemic
      vowel length
    key_differences:
    - 'Two ATR series: back [-ATR] and front [+ATR], each with 5 qualities (Saeed
      Ch. 2.2)'
    - Vowel length is phonemically distinctive (Saeed Ch. 2.2)
    - 'Vowel harmony: all vowels in a polysyllabic root must be in the same ATR series
      (Saeed Ch. 2.2)'
    - ATR harmony spreads across words within harmonic groups (Saeed Ch. 2.2)
    - Diphthongs also occur in back and front series (Saeed Ch. 2.2)
    esl_impact: Somali learners may have difficulty with English vowel quality distinctions,
      particularly tense/lax.
    tier: 1
  tone_and_stress:
    description: Somali is a tonal language with three contrastive tones — unlike
      English
    key_differences:
    - 'Three contrastive tones: High, Low, and Falling (Saeed Ch. 2.4)'
    - Tone bearing unit is the mora (Saeed Ch. 2.4)
    - 'Tone marks grammatical distinctions: gender, number, case, verb conjugation
      (Saeed Ch. 2.4)'
    - 'Stress is associated with tone: High = strong stress, Low = unstressed (Saeed
      Ch. 2.4)'
    - Questions use morphemes, not pitch changes (Saeed Ch. 2.4)
    esl_impact: Somali learners may have difficulty with English stress-timed rhythm
      and question intonation.
    tier: 1
  geminate_consonants:
    description: Somali has phonemically contrastive geminate consonants — absent
      from English
    key_differences:
    - Geminate consonants are phonemically contrastive (Saeed Ch. 2.1)
    - English has no phonemic geminates
    - Somali geminates occur in all positions
    esl_impact: Somali learners may not distinguish single vs. doubled consonants
      in English spelling.
    tier: 1
sources:
- Saeed, John I. (1999) Somali. London Oriental and African Language Library, Vol.
