vocabulary_interference:
  description: Somali vocabulary interference in English primarily involves false
    cognates from Arabic loanwords and conceptual mapping differences
  patterns:
  - pattern: Arabic loanword false friends — Somali has many Arabic loanwords that
      may be false cognates with English words of Arabic origin
    explanation: Somali has absorbed many Arabic loanwords through centuries of Islamic
      contact (Saeed Ch. 1.1; Larajasse Preface). Some share etymology with English
      words of Arabic origin but have diverged in meaning.
    frequency: 2
    persistence: 2
    communicative_impact: 2
    tier: 1
  - pattern: Noun class conceptual transfer — Somali gender system (masculine/feminine
      with polarity) may influence how learners conceptualize English nouns
    explanation: Somali grammatical gender is pervasive and affects determiners, subject-verb
      agreement, and clitic pronouns (Saeed Ch. 4.1, 6.1). Gender polarity in plurals
      has no English parallel.
    frequency: 2
    persistence: 2
    communicative_impact: 1
    tier: 1
  sources_cited:
  - 'Saeed, John I. (1999) Somali. Ch. 1.1 (Introduction) and Ch. 4.1 (Nouns: Gender)'
  - Larajasse, Evangeliste de (1897) A Practical Grammar of the Somali Language. Preface
etymology:
  primary_sources:
  - source_file: Saeed, John I. (1999) Somali. London Oriental and African Language
      Library, Vol. 10. John Benjamins Publishing Company.
    source_type: Research grammar based on 20 years of fieldwork in Somalia and Kenya
    tier: 1
    key_findings:
    - Tonal system (H/L/Falling) with mora-based tone bearing — unlike English stress/intonation
    - ATR vowel harmony with 10 vowel phonemes — no English equivalent
    - Pre-verbal adpositions rather than pre-nominal prepositions
    - Suffixed definite articles (ka/ta) with no indefinite article
    - 'Head-initial NP: N + Det + Adj — opposite to English'
    - No relative pronoun in relative clauses; gap strategy
    - Verbless equative sentences (no copula be)
    - VGP-internal S-O-V clitic order with free NP positioning
    - Questions marked by particles without inversion
    - Negation by particle ma without do-support
    - Gender polarity in plural nouns
    - 12 verbal paradigms; progressive not used with stative verbs
  - source_file: 'Larajasse, Evangeliste de and Sampont, Cyprien de (1897) A Practical
      Grammar of the Somali Language. London: Kegan Paul, Trench, Trubner & Co.'
    source_type: 19th-century missionary grammar
    tier: 2
    key_findings:
    - Definite article formed from vowels a, i, u with consonant supports
    - No indefinite article in Somali
    - Accent falls on the penultimate syllable
    - Consonants p, v, z do not exist in Somali
    - Somali construction differs from Arabic despite many Arabic loanwords
  - source_file: 'Palmer, Joe Darwin (1968) Advanced English: Lessons in Grammar.
      Ministry of Education, Mogadiscio, Somali Republic.'
    source_type: ESL grammar for advanced Somali students
    tier: 1
    key_findings:
    - English articles (a/an/the, some/any) — major difficulty for Somali learners
    - Relative clauses — extensive chapter for Somali students
    - Verb inflection (tenses, modals, passive) — multiple chapters
    - Question formation (inversion, wh-movement) — extensive exercises
etiology:
- claim: Somali is a Cushitic language of the Afroasiatic family, spoken by approximately
    12-15 million people in Somalia, Ethiopia, Kenya, and Djibouti.
  reliability: A
  source: 'Saeed, J.I. (1999) Somali. John Benjamins Publishing. Ch. 1: Introduction.'
  tier: 1
- claim: Somali basic word order is SOV (Subject-Object-Verb), with the verb appearing
    in final position. This differs from English SVO.
  reliability: A
  source: 'Saeed, J.I. (1999) Somali. John Benjamins Publishing. Ch. 6: The verbal
    group and noun phrase.'
  tier: 1
- claim: Somali has a complex system of verbal morphology with both prefix and suffix
    conjugation patterns.
  reliability: A
  source: 'Saeed, J.I. (1999) Somali. John Benjamins Publishing. Ch. 4.3: Verbs.'
  tier: 1
- claim: Somali has definite articles (ka/ta) but they are suffixed to the noun rather
    than preposed as in English.
  reliability: A
  source: 'Saeed, J.I. (1999) Somali. John Benjamins Publishing. Ch. 4.6.1: Definite
    articles.'
  tier: 1
