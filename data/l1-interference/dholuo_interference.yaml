vocabulary_interference:
  description: 'Dholuo vocabulary interference patterns in English. Sources: Okombo
    (1997) and Handbook of Kavirondo (1920).'
  patterns:
  - category: False cognates / semantic overlap
    patterns:
    - dholuo_word: kendo
      meaning: to marry (verb); marriage (noun)
      english_false_friend: kind
      explanation: Dholuo 'kendo' means 'to marry' or 'marriage'. It has no relation
        to English 'kind'. Learners may confuse these if relying on phonetic similarity.
      example_wrong: '*She is a kendo person.'
      example_correct: She is a kind person.
      frequency: 2
      persistence: 2
      tier: 1
      source: Handbook of the Kavirondo Language (1920), vocabulary sections
  - category: Lexical gaps
    patterns:
    - concept: Countability distinctions
      explanation: Dholuo nouns do not mark count vs. mass distinctions morphologically.
        The same noun form is used regardless of countability. English requires different
        determiners and forms for count (a book, two books) vs. mass (water, information).
        Learners may produce '*informations', '*furnitures', '*advices'.
      example_wrong: '*I need some informations.'
      example_correct: I need some information.
      frequency: 3
      persistence: 3
      tier: 1
      source: 'Okombo (1997) A Functional Grammar of Dholuo, Ch. 2.2.1: Nouns and
        Noun Phrases, pp. 21-22'
    - concept: Prepositions vs. adpositions
      explanation: Dholuo uses postpositions and case markers rather than English
        prepositions. The dative is marked with 'ni' (e.g., 'kelo buk ni japuonj'
        = 'bring book to teacher'). Learners may omit or misplace English prepositions.
      example_wrong: '*I gave the book the teacher.'
      example_correct: I gave the book to the teacher.
      frequency: 3
      persistence: 3
      tier: 1
      source: 'Handbook of the Kavirondo Language (1920), Chapter I: The Noun, Paragraph
        12: Cases, p. 7'
  sources:
  - 'Okombo (1997) A Functional Grammar of Dholuo, Ch. 2.2.1: Nouns and Noun Phrases'
  - 'Handbook of the Kavirondo Language (1920), Chapter I: The Noun; Chapter IV: The
    Verb'
