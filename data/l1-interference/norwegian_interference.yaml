      example_l1: Noen folk skyldaer alltid paa samfunnet for alt.
      example_wrong: Some people always blame the society for everything. / The horses
        were introduced into America by Spanish soldiers.
      explanation: The definite article occurs in Scandinavian languages before uncountable
        and plural nouns used in a general sense. In English it is normal to use no
        article in these cases (Swan & Smith 2001, Ch. "Speakers of Scandinavian languages",
        § Articles, point 1).
      flagged: true
      frequency: 4
      pattern: Definite article overgeneralization
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_gloss: a man with hat / a cat without tail
      example_l1: en mann med hatt / en katt uten hale
      example_wrong: a man with hat / a cat without tail
      explanation: Articles are commonly left out after the words for with and without,
        and in phrases like get an answer, take a seat, drive a car where Scandinavian
        languages use no article (Swan & Smith 2001, Ch. "Speakers of Scandinavian
        languages", § Articles, point 3).
      flagged: true
      frequency: 3
      pattern: Article omission with abstract nouns
      persistence: 2
      reliability: B
      tier: 3
    source_count: 4
    sources:
    - Swan & Smith (2001) Learner English
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      how_to_explain: 'Teach: English omits articles before school, church, bed, work,
        home (when used in their primary sense). No article for generic plurals/uncountables.'
      sequencing: 'Week 1: Articles with institutions. Week 2: Articles with abstract
        nouns. Week 3: Review.'
      where_to_start: Start with the most common article errors.
    tier: 3
    why_it_happens: 'Norwegian article usage differs from English: definite article
      is used with generic plurals/uncountables, and indefinite articles are omitted
      after with/without and in certain verb+noun phrases (Swan & Smith 2001, Ch.
      "Speakers of Scandinavian languages", § Articles, points 1, 3). McManus (2022):
      The L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
