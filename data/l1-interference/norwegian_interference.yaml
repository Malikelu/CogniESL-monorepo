  word_order:
    citations:
    - claim: 'Norwegian is a V2 (verb-second) language: in declarative sentences the finite verb must be the second constituent. When a non-subject element is fronted (e.g. an adverb), subject-verb inversion occurs: "I dag korer hun bilen" (today drives she the car). This contrasts with English where fronting an adverb does not trigger inversion ("Today she is driving the car"). Norwegian sentence adverbs (ikke, jo, nok, vel) follow the verb immediately in main clauses but precede the verb in subordinate clauses.'
      location: 'Haugen (1999) Ch.6, Syntax, pp. 150-155'
      source: Haugen (1999) World's Major Languages, Ch.6, Syntax
      tier: 1
    - claim: V2 word order transfer -- non-subject fronting causes subject-verb inversion
      location: 'Chapter: Speakers of Scandinavian languages, pp. 26, section Order of constituents,
        point 1'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: word order'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: Germanic languages and Chinese make rich use of compounding, unlike other
        languages
      location: p. 39
      source: 'Celce-Murcia & Larsen-Freeman (2015) ''The Grammar Book: Form, Meaning,
        and Use for English Language Teachers'', 3rd ed., National Geographic Learning/Cengage'
      tier: 2
    - claim: Norwegian is V2 in main clauses (p. 59)
      location: See relevant section
      source: 'Celce-Murcia & Larsen-Freeman (2015) ''The Grammar Book: Form, Meaning,
        and Use for English Language Teachers'', 3rd ed., National Geographic Learning/Cengage'
      tier: 2
    - claim: 'Word order varies: SOV, SVO, VSO, V2, free order — all cause transfer
        errors'
      location: See word order entries
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: Norwegian is V2 in main clauses (PEU word order entries)
      location: See relevant entry
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: 'ELLs transfer L1 word order: subject-verb inversion from Spanish, SOV
