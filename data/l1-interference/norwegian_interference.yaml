        hvis de har slaaet en annen person.
      example_wrong: The band plays now. / In Scandinavia we're putting people in
        prison if they have struck another person.
      explanation: Scandinavian languages have no progressive verb forms. Elementary
        students often generalise the English simple forms; intermediate students
        may overwork progressive forms as the result of intensive practice (Swan &
        Smith 2001, Ch. "Speakers of Scandinavian languages", § Progressive aspect).
