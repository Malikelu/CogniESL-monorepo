  passive_voice:
    citations:
    - claim: 'Norwegian has two passive constructions: (1) an analytic passive using bli + perfect participle (bli serget "be seen") and (2) a synthetic middle voice marked by -s (sanges "is sung") used for passive, reciprocal (motes "meet each other"), reflexive (trivs "enjoys oneself"), and deponent verbs. The middle voice is more restricted/marked. Norwegian also has a characteristic "inferential perfect" where a perfect tense with a specified past time implies inference rather than observed fact: "Hun har kort bilen i gar" means "I suppose she must have driven the car yesterday."'
      location: 'Haugen (1999) Ch.6, Morphology section 6 Verbs and Syntax sections 3-4'
      source: Haugen (1999) World's Major Languages, Ch.6
      tier: 1
    - claim: Passive expressed with -s suffix or bli(ve) auxiliary; transfer errors
        *It finds not, *He became killed
      location: 'Chapter: Speakers of Scandinavian languages, pp. 32, section Voice'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: passive voice'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: Passive voice availability and usage varies across languages
      location: See passive entries
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: ELLs avoid passive in contexts where L1 uses different structures
      location: p. 294
      source: 'Folse (2009) ''Keys to Teaching Grammar to English Language Learners:
        A Practical Handbook'', University of Michigan Press'
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    communicative_impact: 3
    examples:
    - correct: This house was built in 1900.
      wrong: Someone built this house in 1900.
    flagged: false
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_gloss: It finds not. / He became killed.
      example_l1: Det findes ikke. / Han blev draebdt.
      example_wrong: It finds not. (for It is not found.) / He became killed.
      explanation: 'Transfer from L1: In Scandinavian languages the passive is expressed
        with the suffix -s or with the auxiliary blive/bli (which can also mean become).
