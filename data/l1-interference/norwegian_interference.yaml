  false_friends:
    citations:
    - claim: 'Norwegian and English share many historically identical words whose meanings have diverged, creating "false friends." Examples from Scandinavian lexical studies: rolig means quiet in Danish and Norwegian but funny/amusing in Swedish; affaer means store/business in Swedish but affair in Danish/Norwegian; anledning means cause/reason in Swedish but opportunity/occasion in Danish/Norwegian; bloet means wet in Swedish but soft/weak in Danish and Norwegian. L1 Norwegian learners may systematically misidentify the register or meaning of English words that resemble Norwegian forms.'
      location: 'Haugen (1999) Ch.6, Lexicon, pp. 160-163'
      source: Haugen (1999) World's Major Languages, Ch.6, Lexicon
      tier: 1
    - claim: 'Extensive false friends list: actual, announce, fabric, history, gift,
        mean, novel, place, see, spare, will, etc.'
      location: 'Chapter: Speakers of Scandinavian languages, pp. 33-34, section False friends'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: false friends'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: False friends (cognates with different meanings) cause high-impact errors
      location: See vocabulary problem entries
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: False friends cause high-impact communication errors; must be taught
        explicitly
      location: p. 213
      source: 'Folse (2009) ''Keys to Teaching Grammar to English Language Learners:
        A Practical Handbook'', University of Michigan Press'
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    communicative_impact: 3
    examples:
    - correct: Currently, I work in a bank.
      wrong: Actually, I work in a bank.
    flagged: true
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_gloss: actual (= current interest) / announce (= advertise) / fabric
        (= factory) / history (= story)
      example_l1: aktuell / annonsere / fabrikk / historie
      example_wrong: Actually, I work in a bank. (= Currently) / I bought this at
        the library. (= bookstore)
      explanation: 'Transfer from L1: Norwegian and English share many cognates with
        shifted meanings. Key false friends include: actual (= of current interest),
        announce (= advertise), fabric (= factory), history (= story), gift (= poison),
        mean (= think/be of the opinion), novel (= short story), place (= room/space/square),
        see (= look), spare (= save), will (= want), and many more (Swan & Smith 2001,
        Ch. "Speakers of Scandinavian languages", § False friends, pp. 33-34).'
      flagged: true
      frequency: 4
      pattern: Confusion of NO-EN cognates
      persistence: 3
      reliability: B
      tier: 3
    persistence: 3
    source_count: 1
    source_rank: 1
    source_type: textbook
