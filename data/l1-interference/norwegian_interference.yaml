    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_gloss: Dickens has written many novels. / He left school in 1982.
      example_l1: Dickens har skrevet mange romaner. / Han forlot skolen i 1982.
      example_wrong: Dickens has written many novels. / He has left school in 1982.
      explanation: The Scandinavian present perfect can be used with definite past
        reference, leading to mistakes. English requires simple past with definite
        past time markers (Swan & Smith 2001, Ch. "Speakers of Scandinavian languages",
        § Tense, point 2).
      flagged: true
      frequency: 4
      pattern: Present perfect vs simple past confusion
      persistence: 4
      reliability: B
      tier: 3
    - communicative_impact: 3
      etiology: interlingual
      example_gloss: She doesn't come anyway. / We talk about it next week.
      example_l1: Hun kommer ikke uansett. / Vi snakker om det neste uke.
      example_wrong: She doesn't come anyway. / We talk about it next week. / By this
        time tomorrow I've finished sorting out the replies.
      explanation: In Scandinavian languages, future tenses are not used when the
        sense of the verb or accompanying adverbs already makes it clear that the
        reference is to the future. This leads students to use the simple present
        instead of the will future (Swan & Smith 2001, Ch. "Speakers of Scandinavian
        languages", § Tense, point 4).
      flagged: true
