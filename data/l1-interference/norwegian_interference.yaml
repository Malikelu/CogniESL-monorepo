    - communicative_impact: 3
      etiology: interlingual
      example_correct: I have not seen that.
      example_gloss: That have I not seen.
      example_l1: Det har jag ikke sett.
      example_wrong: That have I not seen.
      explanation: 'Transfer from L1: In Scandinavian languages, it is easy to begin
        a sentence with something other than the subject - which is then placed after
        the verb. In English, only adverbials are regularly fronted, and this does
        not generally cause subject-verb inversion (Swan & Smith 2001, Ch. "Speakers
