writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: 'The evidence supports a clear conclusion: [specific claim]. While
      some studies point in different directions, the preponderance of evidence from
      [sources demonstrates that [finding].'
    error: '*There are many valid perspectives on this issue, and reasonable people
      may disagree. Some studies suggest one approach, while others point in different
      directions. Ultimately, the evidence points in several directions, and it would
      be unwise to draw firm conclusions.'
    explanation: Norwegian essay tradition values balanced presentation of multiple
      views; English essays require a clear, defensible thesis with appropriate qualification.
  - correction: 'The data demonstrate a clear trend: [specific finding]. While alternative
      interpretations exist, the evidence strongly supports this conclusion.'
    error: '*It would seem that perhaps the data might suggest a possible trend, although
      one should not rule out other interpretations.'
    explanation: Norwegian academic writing uses extensive hedging to avoid overconfidence;
      English academic writing expects confident claims with measured qualification.
  description: 'Norwegian rhetorical tradition, shaped by the Scandinavian consensus-building
    culture and the Norwegian ''dugnad'' (community cooperation) ethos, values balanced,
    collaborative argumentation. Norwegian essays often present multiple perspectives
    with equal consideration before arriving at a conclusion, and may avoid strong,
    singular claims. Norwegian academic writing, influenced by the tradition of ''norsk
    sakprosa'' (Norwegian non-fiction), tends to prioritize accessibility and democratic
    engagement over authoritative argumentation. This can produce English essays that
    seem hedged or indecisive. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Norwegian section. Cambridge University Press.'
- area: paragraph_structure
  common_errors:
  - correction: 'Develop each point fully: introduce with a topic sentence, provide
      evidence, analyze the evidence, and connect to the thesis.'
    error: '*Short paragraphs (2-3 sentences) that make a claim without sufficient
      supporting evidence or analysis.'
    explanation: Norwegian prose style favors brevity; English academic paragraphs
      require substantive development with evidence and analysis.
  - correction: Use transition sentences at the beginning or end of paragraphs to
      show how each point relates to the thesis and to adjacent paragraphs.
    error: '*A series of paragraphs without clear connections, each making a point
      but not showing how points relate to each other or to the overall argument.'
    explanation: Norwegian writing often relies on implicit logical connections; English
      writing expects explicit signaling of how each paragraph contributes to the
      argument.
  description: 'Norwegian paragraphs tend to be concise and direct, reflecting the
    Scandinavian preference for functional, unadorned prose. Norwegian writers may
    produce English paragraphs that feel underdeveloped by English academic standards,
    with insufficient evidence, examples, or analysis. Norwegian writers may also
    rely on the reader to infer logical connections, underusing topic sentences and
    transition statements. The Norwegian ''sakprosa'' style values getting to the
    point quickly, which can make English essays feel rushed. McManus (2022): Writing
    interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Norwegian section. Cambridge University Press.'
- area: cohesion_devices
  common_errors:
  - correction: The study found significant results using a representative sample.
      However, methodological limitations mean the conclusions remain tentative.
    error: '*The study found significant results. And the sample was representative.
      But the methodology had limitations. And the conclusions are tentative.'
    explanation: Norwegian coordinates between sentences with 'and' and 'but'; English
      uses subordination and varied connectors for smoother logical flow.
  - correction: Since the policy was implemented, outcomes have improved, indicating
      that the policy has been successful.
    error: '*The policy was implemented. So the outcomes improved. So it is considered
      a success.'
    explanation: Norwegian 'sa' (so) is used more flexibly as a connector; English
      requires specific connectors for cause and effect.
  description: 'Norwegian writers may underuse explicit connectors in English, reflecting
    a Norwegian stylistic preference for implicit logical flow. Norwegian ''men''
    (but), ''og'' (and), and ''sa'' (so) are basic connectors that Norwegian writers
    may overuse as catch-all transitions. Norwegian ''nemlig'' (namely/for) and ''altsa''
    (therefore) may be transferred to English with incorrect usage. Norwegian writers
    may also overuse the conjunction ''og'' (and) to begin sentences, and may underuse
    subordination in favor of coordination. McManus (2022): Writing interference reflects
    learned attention from L1 discourse habits. L1 rhetorical patterns shape how writers
    organize and present arguments in L2. Restructuring these habits requires explicit
    attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Norwegian section. Cambridge University Press.'
- area: academic_register
  common_errors:
  - correction: This essay analyzes the data to evaluate the policy's effectiveness.
    error: '*This essay will check out the data and see whether the policy actually
      worked or not.'
    explanation: Norwegian academic style favors accessible, informal expression;
      English academic writing expects formal register.
  - correction: The policy failed because its design failed to account for [specific
      factor].
    error: '*The policy failed because it was badly designed.'
    explanation: Norwegian directness may produce overly casual academic prose; English
      expects measured, formal tone with specific evidence.
  description: 'Norwegian academic writing tends toward an accessible, egalitarian
    style influenced by Scandinavian cultural values of ''Janteloven'' (not standing
    out) and ''dugnad'' (community effort). Norwegian writers may use a more conversational
    tone in English academic writing than expected, including contractions and informal
    phrasing. The Norwegian tradition of ''dagligdagssprak'' (everyday language) in
    academic contexts can produce essays that lack the formal register expected in
    English academic writing. Norwegian writers may also underuse hedging where English
    expects it. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Norwegian section. Cambridge University Press.'
