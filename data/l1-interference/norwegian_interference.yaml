      example_wrong: He caused that the prisoners were put to death. (for He caused
        the prisoners to be put to death)
      explanation: The 'object + infinitive' structure is rare in Scandinavian languages,
        and students will tend to avoid it (Swan & Smith 2001, Ch. "Speakers of Scandinavian
        languages", § Complementation, point 3).
