etiology:
- claim: 'Jarvis & Pavlenko (2008) identify eight conceptual domains where crosslinguistic
    influence occurs: objects, emotions, personhood, gender, number, time, space,
    and motion. L1 conceptual categories influence how L2 learners perceive and categorize
    reality.'
  conceptual_transfer: true
  factors_affecting_transfer:
  - proficiency_level
  - perceived_crosslinguistic_distance
  - recency_of_L2_use
  - markedness
  - L2_status_effect
  - cognitive_maturity
  - attention_to_language_form
  flagged: false
  reliability: B
  source: Jarvis & Pavlenko (2008) Crosslinguistic Influence in Language and Cognition.
    Routledge. Chapters 4-5.
  tier: 2
grammar_points:
  adverbs:
    citations:
    - claim: Adverbs of manner similar to adjectives; *She spoke to me quite polite;
        *You don't sing very good; *I feel terribly
      location: 'Chapter: Speakers of Scandinavian languages, pp. 29, § Adjective
        or adverb?, points 1-2'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: adverbs'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: 'Adverb placement varies: some languages place adjectives where English
        uses adverbs'
      location: See adverb entries
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: ELLs use adjectives where English requires adverbs (transfer from L1)
      location: p. 266
      source: 'Folse (2009) ''Keys to Teaching Grammar to English Language Learners:
        A Practical Handbook'', University of Michigan Press'
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    communicative_impact: 3
    examples:
    - correct: He runs very fast.
      wrong: He runs very fastly.
    flagged: false
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_gloss: She spoke to me quite polite. / You don't sing very good.
      example_l1: Hun snakket ganske hoyflott til meg. / Du synger ikke veldig godt.
      example_wrong: She spoke to me quite polite. / You don't sing very good.
      explanation: 'Transfer from L1: Scandinavian adverbs of manner tend to be similar
        in form to adjectives, which leads to frequent mistakes. The opposite mistake
        can occur with look, sound, smell, taste, feel, which take adverbs (not adjectives)
        in Scandinavian: *I feel terribly (Swan & Smith 2001, Ch. "Speakers of Scandinavian
        languages", § Adjective or adverb?, points 1-2).'
      flagged: true
      frequency: 4
      pattern: Adjective vs adverb (norwegian)
      persistence: 3
      reliability: B
      tier: 3
    persistence: 3
    source_count: 2
    source_rank: 1
    source_type: textbook
    sources: &id001
    - Swan & Smith "Learner English" (Norwegian)
    - Parrott "Grammar for English Language Teachers"
    - McManus
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: 20 sentences with adverbs errors.
        duration: 15
        name: adverbs Audit
        type: error-correction
      - description: Translate 15 sentences focusing on adverbs.
        duration: 15
        name: adverbs Translation
        type: translation
      - description: 20 sentences practicing adverbs.
        duration: 10
        name: adverbs Practice
        type: fill-in-the-blank
      - description: A paragraph with 10 adverbs errors.
        duration: 15
        name: adverbs Error Hunt
        type: error-correction
      how_to_explain: 'Teach: Adjective describes a noun. Adverb describes a verb.
        Most adverbs add -ly.'
      sequencing: 'Week 1: adverbs. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      where_to_start: Start with the adverbs pattern.
    tier: 1
    why_it_happens: 'Norwegian does not always distinguish adjectives from adverbs
      morphologically. Also, sensory verbs take adverbs in Norwegian but adjectives
      in English (*I feel terribly) (Swan & Smith 2001, Ch. "Speakers of Scandinavian
      languages", § Adjective or adverb?, points 1-2). McManus (2022): The L1 is always
      active during L2 use cross-language co-activation is constant. Managing L1-L2
      competition requires inhibitory control (Green 1998 Inhibitory Control Model).
      This means L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation.'
  adverbs_advanced:
    citations:
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    examples:
    - correct: ''
      wrong: He speaks English good.
    - correct: ''
      wrong: She spoke to me quite polite.
    - correct: ''
      wrong: You don't sing very good.
    - correct: ''
      wrong: 'I feel terribly. (intended: terrible)'
    exercises:
    - description: 15 sentences choosing correct form.
      duration: 10
      name: Adjective or Adverb
      type: fill-in-the-blank
    flagged: false
    interference_patterns:
    - communicative_impact: 2
      etiology: interlingual
      example_gloss: You don't sing very good. / She spoke to me quite polite.
      example_l1: Du synger ikke veldig godt. / Hun snakket ganske hoyflott til meg.
      example_wrong: He speaks English good. / She spoke to me quite polite. / You
        don't sing very good.
      explanation: Scandinavian adverbs of manner tend to be similar in form to adjectives,
        which leads to frequent mistakes (Swan & Smith 2001, Ch. "Speakers of Scandinavian
        languages", § Adjective or adverb?, point 1).
      flagged: true
      frequency: 4
      pattern: Adjective used as adverb
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_gloss: I feel terribly.
      example_l1: Jeg foeler meg forferdelig.
      example_wrong: 'I feel terribly. (intended: terrible)'
      explanation: The opposite mistake can occur in sentences with the verbs look,
        sound, smell, taste, feel, which in most cases take adverbs, not adjectives,
        in Scandinavian languages (Swan & Smith 2001, Ch. "Speakers of Scandinavian
        languages", § Adjective or adverb?, point 2).
      flagged: true
      frequency: 3
      pattern: Adverb used with sensory verbs (opposite error)
      persistence: 3
      reliability: B
      tier: 3
    source_count: 4
    sources:
    - Swan & Smith (2001) Learner English
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      how_to_explain: 'Teach: Adjective describes a noun. Adverb describes a verb.
        Most adverbs add -ly. Good -> well (irregular). Sensory verbs (look, sound,
        smell, taste, feel) take adjectives in English.'
      sequencing: 'Week 1: -ly adverbs. Week 2: Exceptions (fast, hard, late). Week
        3: Good vs well. Week 4: Review.'
      where_to_start: Start with the -ly rule. Then teach exceptions.
    tier: 3
    why_it_happens: 'Norwegian may use the same form for adjectives and adverbs. English
      requires -ly for most adverbs. Sensory verbs take adverbs in Norwegian but adjectives
      in English (Swan & Smith 2001, Ch. "Speakers of Scandinavian languages", § Adjective
      or adverb?, points 1-2). McManus (2022): The L1 is always active during L2 use
      cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
  articles:
    citations:
    - claim: Omission of indefinite article after vaere (to be) for professions and
        complements
      location: 'Chapter: Speakers of Scandinavian languages, pp. 28, § Articles,
        point 2'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: articles'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: Article usage varies significantly across languages; many languages have
        no article system
      location: See articles entries 133-142
      source: Swan (2016) 'Practical English Usage', 4th ed., Oxford University Press
      tier: 2
    - claim: ELLs commonly omit indefinite article when descriptive adjectives come
        between determiner and noun
      location: p. 153
      source: 'Folse (2009) ''Keys to Teaching Grammar to English Language Learners:
        A Practical Handbook'', University of Michigan Press'
      tier: 2
    - claim: L2 article use requires extensive practice to become automatic (inhibitory
        control model)
      location: Ch. 1, pp. 4-7
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: L2 processing requires practice to become automatic; inhibitory control
        manages L1-L2 competition
      location: Ch. 1, pp. 4-11
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    communicative_impact: 3
    examples:
    - correct: I am a teacher.
      wrong: Jeg er laerer.
    flagged: false
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: He has been a teacher for many years. / As a member of the
        family he wanted to come.
      example_gloss: She is teacher.
      example_l1: Hun er laerer.
      example_wrong: He has been teacher for many years. / As member of the family
        he wanted to come.
      explanation: 'Transfer from L1: In subject or object complement function, the
        Scandinavian languages do not use the indefinite article when reference is
        non-specific (Swan & Smith 2001, Ch. "Speakers of Scandinavian languages",
        § Articles, point 2).'
      flagged: true
      frequency: 4
      pattern: Omission of indefinite article after a vaere (to be)
      persistence: 3
      reliability: B
      tier: 3
    persistence: 3
    source_count: 5
    source_rank: 1
    source_type: textbook
    sources: *id001
    teacher_tips:
      exercises:
      - description: 20 sentences with articles errors.
        duration: 15
        name: articles Audit
        type: error-correction
      - description: Translate 15 sentences focusing on articles.
        duration: 15
        name: articles Translation
        type: translation
      - description: 20 sentences practicing articles.
        duration: 10
        name: articles Practice
        type: fill-in-the-blank
      - description: A paragraph with 10 articles errors.
        duration: 15
        name: articles Error Hunt
        type: error-correction
      how_to_explain: 'Teach: English REQUIRES articles. ''A/an'' for first mention,
        ''the'' for specific.'
      sequencing: 'Week 1: articles. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      where_to_start: Start with the articles pattern.
    tier: 1
    why_it_happens: 'Norwegian omits the indefinite article after a vaere (to be)
      for professions and in complement function (Swan & Smith 2001, Ch. "Speakers
      of Scandinavian languages", § Articles, point 2). McManus (2022) explains that
      L2 speakers can learn new form-meaning mappings (like articles) that don''t
      exist in L1, but this requires extensive practice to become automatic. Online
      anticipatory processing (using articles to predict upcoming nouns) develops
      only with high proficiency and extended exposure, not from L1 transfer. McManus
      (2022) explains that L2 speakers can learn new form-meaning mappings that don''t
      exist in L1, but this requires extensive practice to become automatic. L2 learning
      involves creating new knowledge when L1-L2 differences exist AND developing
      selection mechanisms to manage competing knowledge sources (McManus 2022, Ch.
      1). Online anticipatory processing develops only with high proficiency and extended
      exposure. Golden et al. (2017): Transfer is non-linear — functional fit between
      L1 and L2 systems matters more than mere formal similarity. English (Germanic)
      learners showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
  articles_advanced:
    citations:
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
