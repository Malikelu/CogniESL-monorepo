  register_formality:
    citations:
    - claim: 'Norwegian has a formal/informal pronoun distinction: du (informal "you") vs De (formal "you," capitalized, identical to third-person plural). Danish and B-Norwegian use De for formal address; N-Norwegian and Swedish use the second-person plural forms (dykk/ni). After WWII, the informal du became dominant in most contexts. Norwegian learners may transfer the formal/informal register distinction into English, where "you" is used for all contexts, potentially leading to over-formality or under-formality in English interactions.'
