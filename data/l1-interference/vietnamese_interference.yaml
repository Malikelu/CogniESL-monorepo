      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: VN 'to hon'
      example_gloss: big more
      example_wrong: more big
      example_correct: bigger
      explanation: 'Transfer from L1: Use of hon (more) for all comparatives.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: This car is more big than that one.
      correct: This car is bigger than that one.
    - wrong: She is the most tall in the class.
      correct: She is the tallest in the class.
    - wrong: He is more old than me.
      correct: He is older than me.
    why_it_happens: 'Vietnamese forms comparatives with ''hon'' (more) + adjective
