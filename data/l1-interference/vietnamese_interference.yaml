  serial_verbs:
    interference_patterns:
    - pattern: Serial verb construction without conjunction (verb + verb in sequence)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN di hoc ve
      example_gloss: go study return
      example_wrong: I go study return
      example_correct: I go to study and come back
      explanation: 'Transfer from L1: Serial verb construction without conjunction
        or infinitive marker.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Direction verb (coverb) + action verb without preposition
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: VN chay ra
      example_gloss: run out
      example_wrong: I run out the house
      example_correct: I run out of the house
      explanation: 'Transfer from L1: Direction verb placed directly after action
        verb without preposition.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I go study come back
      correct: I go to study and come back.
    - wrong: He sleeping sitting
      correct: He fell asleep while sitting.
    why_it_happens: 'Vietnamese syntax allows serial verb constructions where multiple
      verbs appear in sequence without conjunctions: di hoc ve (go-study-return),
      ngu ngu (sleep-sit), chon chet (risk-die), an vao (eat-enter = eat with). Direction
      verbs (coverbs) like ra (exit), vao (enter), len (ascend), xuong (descend) combine
      directly with action verbs: chay ra (run out), di len (go up). This serial verb
      pattern transfers to English, producing sequences without required prepositions
      or conjunctions. Source: Nguyen Dinh-Hoa (1990). "Vietnamese." In B. Comrie
      (ed.), The World''s Major Languages. Routledge. Ch. 40. '
