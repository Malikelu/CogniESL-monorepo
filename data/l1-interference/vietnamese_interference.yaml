  subject_verb_agreement:
    interference_patterns:
    - pattern: Omission of third-person -s
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: VN 'Co ay di hoc'
      example_gloss: she go study
      example_wrong: She go to school
      example_correct: She goes to school
      explanation: 'Transfer from L1: Omission of third-person -s.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: No agreement with be
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN 'Chung toi la sinh vien'
      example_gloss: we are student
      example_wrong: We is students
      example_correct: We are students
      explanation: 'Transfer from L1: No agreement with be.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: She go to school every day.
      correct: She goes to school every day.
    - wrong: He like coffee.
      correct: He likes coffee.
    - wrong: They is happy.
      correct: They are happy.
    why_it_happens: 'Vietnamese verbs do not agree with subjects. The same verb form
      is used regardless of person or number: ''toi di'' (I go), ''anh ay di'' (he
      go), ''ho di'' (they go). English requires -s for third-person singular and
      different forms of ''be'' (am/is/are). This is one of the most persistent errors
      for Vietnamese speakers. McManus (2022): The L1 is always active during L2 use
      cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): L1s without article
      systems show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach the ''he/she/it rule'': add -s to the verb. Drill: I
        go, you go, he goes, she goes, it goes, we go, they go. For ''be'': I am,
        you are, he/she/it is, we are, they are.'
      where_to_start: Teach third-person -s with present simple. Then teach 'be' conjugation
        (am/is/are).
      sequencing: 'Week 1: Third-person -s. Week 2: Be conjugation. Week 3: Have/has.
        Week 4: Does/doesn''t in questions/negatives.'
      exercises:
      - name: Agreement Drill
        type: oral-drill
        description: 'Students describe a classmate using third-person -s: Linh wakes
          up at 6. She brushes her teeth. She eats breakfast.'
        duration: 10
      - name: Subject-Verb Match
        type: fill-in-the-blank
        description: 20 sentences where students choose the correct verb form.
        duration: 10
      - name: Error Correction
        type: error-correction
        description: 15 sentences with agreement errors. Students correct.
        duration: 10
      - name: Daily Routine Writing
        type: composition
        description: Students write about another person daily routine using third-person
          -s throughout.
        duration: 15
