    interference_patterns:
    - pattern: Use of adjective instead of adverb
      example_l1: VIETNAMESE no -ly suffix
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: Same form for adj/adv
      example_wrong: '*He writes quick'
      example_correct: He writes quickly
      explanation: 'Transfer from L1: Use of adjective instead of adverb.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: He runs very fastly.
