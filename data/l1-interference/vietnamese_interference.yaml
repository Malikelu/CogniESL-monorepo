  verb_tenses:
    interference_patterns:
    - pattern: Use of present tense for past events
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: VN 'Hom qua toi di cho'
      example_gloss: yesterday I go market
      example_wrong: Yesterday I go to the market
      example_correct: Yesterday I went to the market
      explanation: 'Transfer from L1: Use of present tense for past events.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of present tense for future
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN 'Ngay mai toi di'
      example_gloss: tomorrow I go
      example_wrong: Tomorrow I go
      example_correct: Tomorrow I will go
      explanation: 'Transfer from L1: Use of present tense for future.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: Last week I go to Hanoi.
      correct: Last week I went to Hanoi.
    - wrong: Tomorrow I visit my grandmother.
      correct: Tomorrow I will visit my grandmother.
    - wrong: Yesterday she cook dinner.
      correct: Yesterday she cooked dinner.
    why_it_happens: 'Vietnamese verbs do not conjugate for tense. Time is indicated
      by temporal adverbs (''hom qua'' = yesterday, ''ngay mai'' = tomorrow) or aspect
      markers (''da'' = past/completive, ''se'' = future). The verb form stays the
      same. Vietnamese learners must learn that English requires morphological verb
      changes for tense. Research on Norwegian L2 by Golden et al. (2017, Ch. 3) shows
      Vietnamese learners overuse the present perfect in preterite contexts because
      Vietnamese aspectual markers (especially ''da'') overlap functionally with the
      present perfect, leading learners to map Vietnamese aspect onto English tense
      inappropriately. This is NOT simply a tense-learning failure but a conceptual
      mapping issue from L1 aspect. Golden et al. (2017, Ch. 3) found that Vietnamese
      learners of Norwegian overuse the present perfect in preterite contexts because
      Vietnamese aspectual markers (especially ''da'') overlap functionally with the
      Norwegian/English perfect. This is a conceptual mapping issue, not merely a
      tense-learning failure. McManus (2022): The L1 is always active during L2 use
      cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney
      1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity, entrenchment
      — explain transfer patterns. Weinreich and Lado both focused on crosslinguistic
      similarities/differences; CAH (Contrastive Analysis Hypothesis) was coined by
      Wardhaugh (1970), not Lado or Fries. Odlin (Ch.3, Ch.5): Group-level predictions
      confirmed — L1 groups without articles (Finnish, Vietnamese, Korean, Japanese,
      etc.) have significantly MORE difficulty with English articles than groups with
      articles (Swedish, French, German). Jarvis (1998): Swedes almost never omit
      articles in reproduction tasks; Finns frequently use zero articles. Golden et
      al. (2017) confirmed Vietnamese pattern: omit more but accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach the concept: English verbs CHANGE form for time. Draw
        a timeline: past (went) -> present (go) -> future (will go). Emphasize that
        time words (yesterday, tomorrow) are not enough -- the verb must also change.'
      where_to_start: Teach past simple with regular -ed first. Then irregular past
        forms (go->went, eat->ate). Then future with 'will'.
      sequencing: 'Week 1: Past simple regular (-ed). Week 2: Past simple irregular.
        Week 3: Future with will. Week 4: Present vs past vs future contrast.'
      exercises:
      - name: Tense Transformation
        type: sentence-rewrite
        description: Students rewrite 15 present tense sentences in past and future.
        duration: 15
      - name: VN Time Marker Translation
        type: translation
        description: Translate 15 Vietnamese sentences with time markers into correct
          English tenses.
        duration: 20
      - name: Tense Timeline
        type: matching
        description: 'Students match 20 sentences to the correct time: past, present,
          or future.'
        duration: 10
      - name: Daily Journal
        type: composition
        description: Students write a journal entry about yesterday (past), today
          (present), and tomorrow (future).
        duration: 15
