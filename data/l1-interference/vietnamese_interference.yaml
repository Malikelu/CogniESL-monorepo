  prepositions:
    interference_patterns:
    - pattern: Transfer of Vietnamese preposition o (at/in/on)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN 'o nha'
      example_gloss: at home
      example_wrong: I at home' (missing be)
      example_correct: I am at home
      explanation: 'Transfer from L1: Transfer of Vietnamese preposition o (at/in/on).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omission of preposition with time
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: VN 'thu Hai'
      example_gloss: Monday
      example_wrong: I go Monday
      example_correct: I go on Monday
      explanation: 'Transfer from L1: Omission of preposition with time.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I at home.
      correct: I am at home.
    - wrong: She goes to school in Monday.
      correct: She goes to school on Monday.
    - wrong: We meet at the morning.
      correct: We meet in the morning.
    why_it_happens: 'Vietnamese prepositions differ from English. ''o'' covers at/in/on
      for locations. Vietnamese uses fewer prepositions and relies more on context.
      Time expressions often do not require prepositions: ''thu Hai'' (Monday) vs
      English ''on Monday''. Vietnamese learners omit or misuse prepositions. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach the at/in/on hierarchy: at = specific point (at home,
        at school), in = enclosed space (in the box, in the room), on = surface (on
        the table, on Monday). For time: at (clock), on (day), in (month/year).'
      where_to_start: Teach at/in/on for place first. Then teach time prepositions.
      sequencing: 'Week 1: At/in/on for place. Week 2: At/in/on for time. Week 3:
        Other prepositions (to, from, with, by). Week 4: Preposition review.'
      exercises:
      - name: Preposition Choice
        type: fill-in-the-blank
        description: 20 sentences where students choose the correct preposition.
        duration: 10
      - name: VN Preposition Translation
        type: translation
        description: Translate 15 Vietnamese sentences with correct English prepositions.
        duration: 15
      - name: Preposition Error Hunt
        type: error-correction
        description: A paragraph with 10 preposition errors. Students find and fix.
        duration: 15
      - name: Map Description
        type: oral-drill
        description: Students describe locations on a map using correct prepositions.
        duration: 10
