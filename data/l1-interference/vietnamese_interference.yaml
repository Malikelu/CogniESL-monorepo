  classifiers:
    interference_patterns:
    - pattern: Direct number + noun without article
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN 'mot con cho'
      example_gloss: one classifier dog
      example_wrong: one dog' (correct) but 'I want dog
      example_correct: I want a dog
      explanation: 'Transfer from L1: Direct number + noun without article.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I want dog.
      correct: I want a dog.
    - wrong: She has two cat.
      correct: She has two cats.
    why_it_happens: 'Vietnamese has a rich classifier system that partially compensates
      for the absence of articles. Classifiers are grammatically obligatory with numerals
      and chosen based on animateness, humanness/social position, and shape. Key classifiers:
      cay (stick-shaped: cay nen = candle), quyen (volumes/scrolls: quyen sach = book),
      tam (sheets: to giay = sheet of paper), con (animals: con cho = dog), cai (general
      inanimate: cai ban = table). With demonstratives, classifiers are often used:
      cai ban nay (this table), con bo ay (that cow). This means Vietnamese learners
      categorize nouns by shape/animacy rather than definiteness. Source: Nguyen Dinh-Hoa
      (1990). "Vietnamese." In B. Comrie (ed.), The World''s Major Languages. Routledge.
      Ch. 40. Vietnamese uses classifiers (cai, con, chien, quyen, etc.) between numbers
      and nouns. These classifiers have no English equivalent. Vietnamese learners
      may omit necessary English articles or plurals because the classifier system
      handles quantification in Vietnamese. McManus (2022): The L1 is always active
      during L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): L1s without article
      systems show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: Explain that English uses articles and plurals where Vietnamese
        uses classifiers. 'Mot con cho' = 'a dog' (not 'one classifier dog'). 'Ba
        con cho' = 'three dogs'.
      where_to_start: Teach the article system first (a/an/the). Then teach plurals.
        Contrast with Vietnamese classifier system.
      sequencing: 'Week 1: Articles (a/an/the). Week 2: Plurals (-s). Week 3: Quantifiers
        (many, much, a lot of). Week 4: Review.'
      exercises:
      - name: VN Classifier to EN Article
        type: translation
        description: Translate 15 Vietnamese classifier sentences into English with
          correct articles and plurals.
        duration: 15
      - name: Article + Plural Practice
        type: fill-in-the-blank
        description: 20 sentences where students add articles and plural markers.
        duration: 10
      - name: Classifier Comparison
        type: matching
        description: Students match Vietnamese classifier phrases with correct English
          equivalents.
        duration: 10
