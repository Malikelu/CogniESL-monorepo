      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: VN 'Ban co khong?'
      example_gloss: you yes no?
      example_wrong: You are happy or not?
      example_correct: Are you happy?
      explanation: 'Transfer from L1: Use of question particle without inversion.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of khong or a as question markers
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: VN 'Ban di khong?'
      example_gloss: you go not?
      example_wrong: You go not?
      example_correct: Do you go?
      explanation: 'Transfer from L1: Use of khong or a as question markers.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: You go to school not?
      correct: Do you go to school?
    - wrong: She is teacher or not?
      correct: Is she a teacher?
    - wrong: He likes coffee khong?
      correct: Does he like coffee?
    why_it_happens: 'Vietnamese forms questions by adding particles ''khong'' (not),
