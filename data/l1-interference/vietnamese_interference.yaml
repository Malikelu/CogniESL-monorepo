      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach two question types: (1) Yes/no questions: Do/Does/Did
        + subject + base verb? OR Be + subject? (2) Wh- questions: Wh- word + do/does/did
        + subject + base verb? Drill: ''You like coffee'' -> ''Do you like coffee?''
        NOT ''You like coffee?'''
      where_to_start: 'Teach yes/no questions with ''be'' first (easier: just invert).
        Then teach do/does/did questions.'
      sequencing: 'Week 1: Yes/no questions with be. Week 2: Yes/no questions with
        do/does/did. Week 3: Wh- questions. Week 4: Tag questions.'
      exercises:
      - name: Question Formation
        type: sentence-rewrite
        description: Students convert 15 statements to questions using correct inversion
          and do-support.
        duration: 15
      - name: VN Question Translation
        type: translation
        description: Translate 15 Vietnamese particle questions into correct English.
        duration: 15
      - name: Interview Activity
        type: oral-drill
        description: Students interview each other using wh- and yes/no questions.
        duration: 15
      - name: Question Error Correction
        type: error-correction
        description: 10 sentences with question formation errors. Students correct.
        duration: 10
