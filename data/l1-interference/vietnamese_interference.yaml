      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Different passive formation
      example_wrong: '*The letter David wrote'
      example_correct: The letter was written by David
      explanation: 'Transfer from L1: Avoidance of passive voice.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of active where passive is natural
      example_l1: VIETNAMESE different passive
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Different passive formation
      example_wrong: '*The letter David wrote'
      example_correct: The letter was written by David
      explanation: 'Transfer from L1: Use of active where passive is natural.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: My car stole yesterday.
      correct: My car was stolen yesterday.
    - wrong: This book wrote by a famous author.
      correct: This book was written by a famous author.
    - wrong: Someone broke the window.
      correct: The window was broken.
    why_it_happens: 'Vietnamese has a passive construction with ''bi'' (for adversative/negative
      events) and ''duoc'' (for positive events), but it is used much less frequently
      than English passive. Vietnamese prefers active constructions. Learners avoid
      passive or use it incorrectly. McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): L1s without article
      systems show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach the passive formula: be + past participle. Show when
        to use it: when the action is more important than the agent, when the agent
        is unknown, or in formal writing.'
      where_to_start: Teach the passive formula with simple present and past. Then
        teach when to use passive vs active.
      sequencing: 'Week 1: Passive formula (be + past participle). Week 2: Present
        and past passive. Week 3: When to use passive. Week 4: Passive in formal writing.'
      exercises:
      - name: Active to Passive
        type: sentence-rewrite
        description: Students convert 15 active sentences to passive voice.
        duration: 15
      - name: Passive to Active
        type: sentence-rewrite
        description: Students convert 10 passive sentences to active, adding an agent.
        duration: 10
      - name: VN Bi/Duoc Translation
        type: translation
        description: Translate 15 Vietnamese bi/duoc sentences into English passive.
        duration: 15
      - name: News Headlines
        type: composition
        description: Students write 5 news headlines using passive voice.
        duration: 10
