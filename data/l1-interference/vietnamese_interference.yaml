    why_it_happens: 'Vietnamese is an Austroasiatic (Mon-Khmer) language that developed
      tones historically: from a non-tonal language at the beginning of the Christian
      era to three tones by the sixth century, and all six tones by the twelfth century
      (Haudricourt 1954, cited in Nguyen Dinh-Hoa). The six tones (Table 40.3) are:
      ngang (high mid level), sac (high rising), huyen (low drawn out), hoi (mid low
      dipping-rising), nga (high rising glottalised), nang (low falling glottalised).
      Each syllable carries one obligatory toneme. Vietnamese syllable structure follows
      the formula (C1)(w)V1(V2)(C2) where C2 can only be a voiceless stop or nasal.
      Final consonant clusters do not exist; only single final consonants are permitted:
      p, t, c, ch, m, n, ng, nh. Voiceless stops are unexploded in final position.
      Vietnamese lacks dental fricatives (theta sounds). Source: Nguyen Dinh-Hoa (1990).
      "Vietnamese." In B. Comrie (ed.), The World''s Major Languages. Routledge. Ch.
      40. Vietnamese phonology has a limited set of final consonants. English final
      consonant clusters (tests, hands, asked) are systematically simplified. Vietnamese
      also lacks dental fricatives (th sounds), replacing them with /t/ and /d/. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
