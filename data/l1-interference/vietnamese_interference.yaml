      reliability: B
    - pattern: Monotone intonation in questions
      example_l1: VIETNAMESE different question formation
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Different interrogative structure
      example_wrong: '*You go? / *Where you go?'
      example_correct: Do you go? / Where do you go?
      explanation: 'Transfer from L1: Monotone intonation in questions.'
      etiology: interlingual
      flagged: true
