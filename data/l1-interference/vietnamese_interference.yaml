    why_it_happens: 'Vietnamese morphology relies on compounding (coordinate: nha
      cua = house-door = home; dependency: nuoc mat = water-eye = tears, tau bo =
      ship-crawl = tank) and reduplication (total: ba-ba = river turtle; partial with
      tonal modification: do-do = reddish). Compounds typically have modifier-modified
      order (the reverse of Chinese loan compounds). Vietnamese learners transfer
      compound patterns directly to English (''machine fly'' for airplane, ''water
      eye'' for tears). Source: Nguyen Dinh-Hoa (1990). "Vietnamese." In B. Comrie
      (ed.), The World''s Major Languages. Routledge. Ch. 40. '
