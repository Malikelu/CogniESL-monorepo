  relative_clauses:
    interference_patterns:
    - pattern: Omission of relative pronoun
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN 'nguoi den hom qua'
      example_gloss: person came yesterday
      example_wrong: The person came yesterday is my friend
      example_correct: The person who came yesterday is my friend
      explanation: 'Transfer from L1: Omission of relative pronoun.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: The person came yesterday is my friend.
      correct: The person who came yesterday is my friend.
    - wrong: The book I read was interesting.
      correct: The book that I read was interesting.
    - wrong: The man lives next door is a doctor.
      correct: The man who lives next door is a doctor.
    why_it_happens: 'Vietnamese uses ''ma'' as a relative pronoun, but it is often
      omitted in casual speech. Vietnamese relative clauses precede the noun (prenominal),
      while English relative clauses follow the noun (postnominal). Vietnamese learners
      may omit relative pronouns or place clauses before nouns. McManus (2022): The
      L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English relative clauses come AFTER the noun. Use ''who''
        for people, ''which'' for things, ''that'' for both. ''The person WHO came''
        (not ''The person came''). Drill: noun + who/which/that + clause.'
      where_to_start: Teach 'who' for people first. Then 'which' for things. Then
        'that' for both.
      sequencing: 'Week 1: Who for people. Week 2: Which for things. Week 3: That
        for both. Week 4: Omitting relative pronouns (when object).'
      exercises:
      - name: Relative Clause Formation
        type: sentence-rewrite
        description: Students combine 10 pairs of sentences using relative pronouns.
        duration: 15
      - name: VN Relative Translation
        type: translation
        description: Translate 15 Vietnamese relative clauses into correct English.
        duration: 15
      - name: Relative Pronoun Choice
        type: fill-in-the-blank
        description: 15 sentences where students choose who/which/that.
        duration: 10
      - name: Description Activity
        type: oral-drill
        description: Students describe people and things using relative clauses.
        duration: 10
