      style accounts for the remaining 20%. Golden et al. (2017): L1s without article
      systems show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English uses possessive adjectives BEFORE the noun.
        ''My house'' (not ''house of me''). For body parts and family: ''my mother'',
        ''his leg'' (not ''the mother'', ''the leg'').'
      where_to_start: Teach possessive adjectives with family members and body parts
        first.
      sequencing: 'Week 1: My/your/his/her with family. Week 2: Our/their with possessions.
        Week 3: Possessive adjectives vs possessive pronouns. Week 4: Review.'
      exercises:
      - name: Possessive Formation
        type: sentence-rewrite
        description: Students rewrite 10 cua phrases using possessive adjectives.
        duration: 10
      - name: Body Parts
        type: oral-drill
        description: 'Students describe injuries using possessives: I hurt my back,
          She broke her arm.'
        duration: 10
      - name: VN Cua Translation
        type: translation
        description: Translate 15 Vietnamese cua phrases into English possessives.
        duration: 15
      - name: Family Description
        type: composition
        description: Students describe their family using possessive adjectives.
        duration: 15
