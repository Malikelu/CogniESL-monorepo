  plurals:
    interference_patterns:
    - pattern: Omission of plural -s
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: VN 'hai con meo'
      example_gloss: two cat
      example_wrong: two cat
      example_correct: two cats
      explanation: 'Transfer from L1: Omission of plural -s.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of number + singular noun
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: VN 'nhieu nguoi'
      example_gloss: many person
      example_wrong: many person
      example_correct: many people
      explanation: 'Transfer from L1: Use of number + singular noun.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I have three dog.
      correct: I have three dogs.
    - wrong: She bought five book.
      correct: She bought five books.
    - wrong: There are many student in the class.
      correct: There are many students in the class.
    why_it_happens: 'Vietnamese nouns do not change form for plural. Plurality is
      expressed through classifiers and quantifiers: ''hai con meo'' (two classifier
      cat), ''nhieu nguoi'' (many person). The noun itself never changes. Vietnamese
      learners must learn that English requires morphological plural marking on the
      noun itself. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach the rule: number > 1 = noun + s. Use visual: one cat
        (picture of 1), two cats (picture of 2 with -s highlighted). Drill: 1 book,
        2 books, 3 books... 1 child, 2 children (irregular).'
      where_to_start: Teach regular plural -s first. Then -es (boxes, churches). Then
        irregulars (children, people, men, women).
      sequencing: 'Week 1: Regular plural -s. Week 2: Plural -es and -ies. Week 3:
        Irregular plurals. Week 4: Uncountable nouns (no plural).'
      exercises:
      - name: Plural Formation
        type: fill-in-the-blank
        description: 20 sentences with singular nouns. Students write the plural form.
        duration: 10
      - name: VN Classifier Translation
        type: translation
        description: Translate 15 Vietnamese sentences with classifiers into English
          plurals.
        duration: 15
      - name: Plural Error Hunt
        type: error-correction
        description: A paragraph with 10 plural errors. Students find and fix.
        duration: 15
      - name: Shopping List
        type: composition
        description: 'Students write a shopping list with quantities: 3 apples, 2
          loaves of bread, 1 milk.'
        duration: 10
    sources:
    - Swan & Smith "Learner English" (Vietnamese)
    - Parrott "Grammar for English Language Teachers"
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Nguyen Dinh-Hoa (1990). "Vietnamese." In B. Comrie (ed.), The World's Major Languages. Routledge. Ch. 40.
    source_count: 4
    source_type: textbook
    frequency: 5
    persistence: 5
