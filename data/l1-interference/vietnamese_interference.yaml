      style accounts for the remaining 20%. Golden et al. (2017): L1s without article
      systems show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach the rule: 1-2 syllable adjectives -> -er/-est (big ->
        bigger -> biggest). 3+ syllable adjectives -> more/most (beautiful -> more
        beautiful). Exceptions: good -> better -> best.'
      where_to_start: Teach the -er/-est rule with common short adjectives. Then teach
        more/most with long adjectives.
      sequencing: 'Week 1: -er/-est with short adjectives. Week 2: More/most with
        long adjectives. Week 3: Irregular comparatives. Week 4: Comparative structures
        (as...as, than).'
      exercises:
      - name: Comparative Formation
        type: sentence-rewrite
        description: Students rewrite 10 sentences, changing more + adj to -er where
          appropriate.
        duration: 10
      - name: Superlative Challenge
        type: fill-in-the-blank
        description: 15 sentences where students form the correct superlative.
        duration: 10
      - name: VN Comparative Translation
        type: translation
        description: Translate 15 Vietnamese comparative sentences into correct English.
        duration: 10
      - name: Comparison Paragraph
        type: composition
        description: Students write a paragraph comparing two things using at least
          5 comparatives.
        duration: 15
