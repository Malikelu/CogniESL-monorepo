citations:
- claim: Comprehensive L1 interference coverage across 22+ languages — each language
    entry documents interference patterns in phonology, grammar, writing, and vocabulary
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  tier: 1
  reliability: B
  flagged: false
- claim: Cross-linguistic influence in L1-L2 transfer is systematic and predictable
    based on typological distance between languages
  source: McManus, K. (2022) Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 1
  reliability: B
  flagged: false
- claim: James's Error Analysis framework provides the methodological foundation for
    this coverage analysis. His classification of errors by source (interlingual vs
    intralingual) and by level (substance, text, lexical, grammar, discourse) guides
    the systematic documentation of L1 interference patterns across languages.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 4: The Description of Errors, pp. 90-128: Error classification
    and error taxonomies'
  tier: 2

teaching_context:
  content: This coverage document maps L1 interference patterns across all 31 documented language groups.
    Use it to identify which grammar points are most affected by L1 transfer for specific
    language groups.
  source: Swan, M. & Smith, B. (2001). Learner English, 2nd ed. Cambridge University
    Press.
