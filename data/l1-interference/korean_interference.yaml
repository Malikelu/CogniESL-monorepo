  phonology_advanced:
    interference_patterns:
    - pattern: /ʃ/ (sh) assimilated to /s/ in final position
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"fish" becomes /fɪsi/'
      example_correct: fish /fɪʃ/
      explanation: Although /ʃ/ exists in Korean, it is difficult in many English
        environments. At end of word, Koreans add an epenthetic vowel.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /tʃ/ not found in final position; epenthetic vowel added
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"church" becomes /tʃətʃi/'
      example_correct: church /tʃɜːtʃ/
      explanation: /tʃ/ exists in Korean but not in final position; an epenthetic
        /i/ or /ə/ vowel is added.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /θ/ assimilated to /s/, /ð/ to /d/
      frequency: 4
      persistence: 5
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"thin" becomes "sin", "that" becomes "dat"'
      example_correct: thin /θɪn/, that /ðæt/
      explanation: No dental fricatives in Korean. Definite article often ignored
        when reading aloud.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Final /s/ and /z/ not pronounced in plurals and 3rd person singular
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: ''
      example_gloss: ''
      example_wrong: '"dogs" becomes /dɒg/, "runs" becomes /rʌn/'
      example_correct: dogs /dɒɡz/, runs /rʌnz/
      explanation: 'Due to Korean grammar, not phonological absence: Korean does not
        mark these distinctions in final position.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: No syllable stress or word stress in Korean
      frequency: 5
      persistence: 5
      communicative_impact: 5
      example_l1: ''
      example_gloss: ''
      example_wrong: Every syllable receives equal stress; English sounds "histrionic"
      example_correct: PHOtograph vs. phoTOgraphy vs. photoGRAPHic
      explanation: Korean employs neither syllable stress nor word stress. Every Korean
        word sounds flat. This creates an impression of monotony to English listeners.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Function words not reduced
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"to" always /tuː/, "the" always /ðiː/'
      example_correct: '"to" /tə/, "the" /ðə/ before consonants'
      explanation: Korean function words are almost never reduced. Learners give auxiliaries,
        prepositions, etc. their full written pronunciation.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Contracted forms avoided
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: ''
      example_gloss: ''
      example_wrong: '"I am going" always full form, never "I''m going"'
      example_correct: '"I''m going"'
      explanation: Korean learners reading English aloud avoid contractions and elisions,
        producing slow, staccato rhythm.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Rising/falling intonation overlaps with English but used differently
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: Emotional dimension of intonation underused
      example_correct: Appropriate intonation for requests, statements, questions
      explanation: Korean shares some intonation patterns with English but adds emotional
        dimension far less often.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Capitalization absent in Korean
      frequency: 3
      persistence: 4
      communicative_impact: 2
      example_l1: ''
      example_gloss: ''
      example_wrong: Failure to capitalize proper nouns and sentence-initial words
      example_correct: Paris, Monday, English
      explanation: Korean characters cannot be capitalized. Capitalization rules must
        be explicitly taught.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Punctuation conventions differ (comma rarely used, no possessive apostrophe)
      frequency: 3
      persistence: 4
      communicative_impact: 2
      example_l1: ''
      example_gloss: ''
      example_wrong: Missing commas; "Johns book" instead of "John's book"
      example_correct: John's book; I came, I saw, I conquered.
      explanation: Comma is rare in Korean (spaces fulfill comma functions). Possessive
        apostrophe does not exist; possession is marked by a noun suffix.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: 'Three-way obstruent distinction (laxed/aspirated/tensed) transferred'
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: ''
      example_gloss: ''
      example_wrong: 'Difficulty distinguishing Korean three-way stops transferred to English two-way voicing'
      example_correct: 'English voicing distinction (voiced vs. voiceless)'
      explanation: 'Korean three-way obstruent system (laxed, aspirated, tensed). English only has two-way. Over/under-differentiation of English stops results.'
      etiology: interlingual
      flagged: True
      tier: 2
      reliability: B
    examples:
    - wrong: '"fish" becomes /fɪsi/'
      correct: fish /fɪʃ/
    - wrong: '"church" becomes /tʃətʃi/'
      correct: church /tʃɜːtʃ/
    - wrong: '"thin" becomes "sin", "that" becomes "dat"'
      correct: thin /θɪn/, that /ðæt/
    - wrong: '"dogs" becomes /dɒg/, "runs" becomes /rʌn/'
