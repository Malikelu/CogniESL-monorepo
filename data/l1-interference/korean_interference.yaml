writing_interference:
  argumentative_essay:
    description: 'Korean rhetorical tradition, influenced by Chinese literary conventions,
      tends toward inductive argumentation in which evidence and reasoning precede
      the thesis, which may be delayed until the end of the essay or left partially
      implicit. Swan & Smith (2001) observe that Korean students are accustomed to
      a pattern in which the reader is expected to infer the writer''s position from
      a carefully constructed progression of ideas, rather than having it stated explicitly
      at the outset. When writing English essays, Korean L1 learners may therefore
      withhold their main argument until the concluding section, may present claims
      indirectly through accumulated evidence, or may rely on contextual cues rather
      than a clear thesis statement. Teachers should explain the deductive English
      essay convention clearly and provide scaffolded essay planning tools such as
      thesis-statement templates and outline structures that position the claim before
      the supporting evidence. McManus (2022): Writing interference reflects learned
      attention from L1 discourse habits. L1 rhetorical patterns shape how writers
      organize and present arguments in L2. Restructuring these habits requires explicit
      attention-redirecting instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
  paragraph_structure:
    description: 'Korean paragraphs tend to be organized inductively with topic sentences
      frequently delayed to the end or omitted entirely, and the overall paragraph
      structure may feel circular to English readers who expect a linear point-first
      organization. Swan & Smith (2001) note that Korean paragraphing conventions
      differ substantially from English; brevity is favored in Korean writing, and
      paragraphing is reserved for very formal documents. Korean L1 learners writing
      English may produce paragraphs that are shorter than expected, that build toward
      a point rather than leading with it, or that meander through multiple supporting
      points without a clear organizing topic sentence. Teachers should demonstrate
      English paragraph structure explicitly, showing how a strong topic sentence
      followed by specific evidence and a concluding sentence creates the expected
      "pyramid" shape in English academic writing. McManus (2022): Writing interference
      reflects learned attention from L1 discourse habits. L1 rhetorical patterns
      shape how writers organize and present arguments in L2. Restructuring these
      habits requires explicit attention-redirecting instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
  cohesion_devices:
    description: 'Korean uses connector patterns that differ significantly from English,
      with greater reliance on context, inference, and interpersonal shared knowledge
      rather than explicit overt cohesive markers between clauses and sentences. Swan
      & Smith (2001) note that Korean conjunction patterns do not map one-to-one onto
      English, and learners often underuse or misuse English connectors such as "moreover,"
      "consequently," "nevertheless," and "furthermore." Korean learners may produce
      English essays that feel choppy or underconnected, with ideas following one
      another without clear logical signposting. Teachers should provide explicit
      instruction in the four major categories of English cohesion—additive, adversative,
      causal, and temporal connectors—and practice embedding these within coherent
      essay paragraphs, explaining that in English academic prose the writer bears
      primary responsibility for making logical relationships between ideas explicit.
      McManus (2022): Writing interference reflects learned attention from L1 discourse
      habits. L1 rhetorical patterns shape how writers organize and present arguments
      in L2. Restructuring these habits requires explicit attention-redirecting instruction,
      not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
  academic_register:
    description: 'Korean academic writing is shaped by a complex honorific system
      and cultural conventions that govern formality, self-presentation, and the expression
      of claims in ways that differ markedly from English academic register. Swan
      & Smith (2001) explain that Korean is rich in vocabulary for respect and self-effacement,
      and the grammatical markers of formality far exceed those available in English.
      Korean L1 learners may struggle with the expectation in English academic writing
      that writers assert claims directly, use first-person perspective where appropriate,
      and hedge strategically rather than avoiding assertion altogether. The different
      formality and honorific conventions may cause Korean writers to sound either
      excessively formal or overly tentative in English academic prose. Teachers should
      clarify the conventions of English academic register, including the appropriate
      use of hedging language, when passive versus active voice is preferred, and
      how to present arguments with sufficient assertiveness while maintaining scholarly
      rigor. McManus (2022): Writing interference reflects learned attention from
      L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
      arguments in L2. Restructuring these habits requires explicit attention-redirecting
      instruction, not just error correction.'
    etiology: interlingual
    flagged: false
    tier: 2
    sources:
    - 'Swan & Smith (2001) "Learner English: A Teacher''s Guide to Interference and
      Other Problems", 2nd ed., Cambridge University Press'
