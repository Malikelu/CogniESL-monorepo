language: Korean
language_code: ko
schema_version: '4.0'
grammar_points:
  phonology:
    interference_patterns:
    - pattern: /ɔː/ and /ɒ/ merged as pure /o/
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: KO 고트
      example_gloss: goat
      example_wrong: caught and cot sound identical
      example_correct: caught /kɔːt/ vs. cot /kɒt/
      explanation: Korean has no distinction between /ɔː/ and /ɒ/; both are pronounced
        as a pure /o/.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /æ/ assimilated to /e/
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"hat" pronounced like "het"'
      example_correct: hat /hæt/ vs. het /het/
      explanation: No /æ/ vowel in Korean; learners assimilate it to /e/.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /ʌ/ (cup) falls between /kʌp/ and /kɑːp/
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_l1: ''
      example_gloss: ''
      example_wrong: '"cup" sounds between "cup" and "carp"'
      example_correct: cup /kʌp/ vs. carp /kɑːp/
      explanation: Korean /a/ is not lengthened, so "cup" falls between /kʌp/ and
        /kɑːp/.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /ɜː/ has no Korean equivalent
      frequency: 4
      persistence: 5
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"work" and "walk" confused'
      example_correct: work /wɜːk/ vs. walk /wɔːk/
      explanation: No Korean equivalent for /ɜː/; even advanced students confuse "work"
        and "walk".
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: No long/short vowel distinction
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"sit" and "seat" confused'
      example_correct: sit /sɪt/ vs. seat /siːt/
      explanation: Korean uses rising/falling intonation and pause instead of vowel
        length.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: Voiced/unvoiced consonants not distinct phonemes
      frequency: 4
      persistence: 5
      communicative_impact: 4
      example_l1: ''
      example_gloss: ''
      example_wrong: '"writing" and "riding" sound identical'
      example_correct: writing /ˈraɪtɪŋ/ vs. riding /ˈraɪdɪŋ/
      explanation: In Korean, a voiced consonant does not count as a different sound
        from its unvoiced equivalent.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /l/ and /r/ represented by same character
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_l1: ''
      example_gloss: ''
      example_wrong: '"particularly" becomes "bell bell dipikolt"'
      example_correct: particularly /pəˈtɪkjələli/
      explanation: Korean has a single phoneme covering both /l/ and /r/.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /v/ assimilated to /b/
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"very" becomes "berry"'
      example_correct: very /ˈveri/
      explanation: No /v/ in Korean; assimilated to /b/ in all positions.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /f/ assimilated to /p/
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"host families" becomes "host pamilies"'
      example_correct: host families
      explanation: No /f/ in Korean; assimilated to /p/. "Flay" becomes "pray".
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: /z/ assimilated to /dz/
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: '"zoo" becomes /dzuː/'
      example_correct: zoo /zuː/
      explanation: No /z/ in Korean; assimilated to /dz/.
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    - pattern: 'Consonant assimilation (nasalisation, labialisation) transferred to English'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: 'Korean nasalisation rules applied to English connected speech'
      example_correct: 'sink /sINk/, soup /su:p/ with unreleased final /p/'
      explanation: 'Korean has rich consonant assimilation: stops become nasals before nasals (k>N, t>n, p>m), plus labialisation, velarisation, palatalisation. Consonants unreleased word-final. Three phonation types: laxed, aspirated, tensed.'
      etiology: interlingual
      flagged: True
      tier: 2
      reliability: B
    - pattern: 'Syllable timing transferred (each syllable gets equal weight)'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_l1: ''
      example_gloss: ''
      example_wrong: 'PHOtograph and phoTOgraphy sound like equal-stress syllables'
      example_correct: 'Stress-timed English with reduced unstressed syllables'
      explanation: 'Korean is strictly syllable-timed with CV(C)(C) structure. Word-final clusters reduced. Flat syllable timing transfers to English stress-timing.'
      etiology: interlingual
      flagged: True
      tier: 2
      reliability: B
    examples:
    - wrong: I ride a bicycle.
      correct: I write a letter.
    - wrong: This is a pree.
      correct: This is a free.
    - wrong: I have dwo cats.
      correct: I have two cats.
    why_it_happens: 'Korean has a much smaller phonological inventory than English:
      8 simple vowels, 13 diphthongs and 19 consonants vs. English 22 vowels/diphthongs
      and 24 consonants. No long/short vowel distinction exists. Voiced and unvoiced
      consonants are not distinct phonemes. McManus (2022): The L1 is always active
      during L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation.'
    teacher_tips:
      how_to_explain: 'Focus on the articulatory differences: lip rounding for /ɔː/,
        tongue position for /æ/, and the absence of voiced/unvoiced distinction in
        Korean.'
      where_to_start: Start with /l/ vs /r/ distinction as it is the most frequent
        and persistent error.
      sequencing: 'Week 1: /l/ vs /r/. Week 2: /f/ vs /p/ and /v/ vs /b/. Week 3:
        Vowel length distinctions.'
    sources: &id001
    - 'Swan, M. & Smith, B. (2001). Learner English: A teacher''s guide to interference
      and other problems. Cambridge University Press. Korean section.'
    - Parrott, M. (2000). Grammar for English Language Teachers. Cambridge University
      Press.
    - McManus
    - Golden
    - Odlin
