      example_correct: "He is a doctor. / She is a doctor."
      example_gloss: "no gender marking; u = he/she (human only); inanimate plural uses 3rd singular verb endings"
      example_l1: "FA u = he or she (same pronoun); suffixes -am/-at/-as/-eman/-etan/-esan no gender"
      example_wrong: "It is my friend (using it for a human)"
      explanation: "Persian has no grammatical gender distinction. The pronoun u means both he and she (for humans only). Pronominal suffixes show no gender distinction at all. Animacy (not gender) is retained: u and ishan refer only to humans; inanimate plural subjects use third singular verb endings (Windfuhr 2009, Section 1). English requires gender-marked pronouns he/she/it."
      flagged: false
      frequency: 2
      pattern: "Gender pronoun confusion (he/she/it) - Persian L1 has no grammatical gender"
      persistence: 2
      reliability: B
      tier: 2
    persistence: 2
    source_count: 2
    source_rank: 1
    source_type: reference_grammar
    sources:
    - "Windfuhr (2009) Concise Encyclopedia of Languages of the World, Ch.25 Persian"
    - "McManus (2022) Crosslinguistic Influence and Second Language Learning"
    teacher_tips:
      how_to_explain: "Teach: Persian uses the SAME word for he and she. English requires different words. Drill: he for males, she for females, it for everything else."
      sequencing: "Week 1: He/she distinction with people. Week 2: It for objects/animals. Week 3: Practice pronoun choices. Week 4: Review."
      where_to_start: Start with people (he/she) vs non-people (it)
    tier: 2
    why_it_happens: "Persian has no grammatical gender and only one third-person human pronoun u (Windfuhr 2009, Section 1). English requires gender-marked pronouns. Persian learners may default to it or confuse he/she."

  no_future_tense:
    citations:
    - claim: "Persian lacks a grammatical future tense paradigm; uses modal xah- (to wish/want) + plain past stem for future reference (e.g., xah-am raft = I will go)"
      location: "Section 3.2 Verb System, lines 33648-33649 and charts pages 33656-33676"
      source: "Windfuhr, G.L. (2009) \"Persian\" in Brown, K. & Ogilvie, S. (eds.) Concise Encyclopedia of Languages of the World. Elsevier. Ch.25"
      tier: 1
    - claim: Inhibitory control model - L1 always active, requires cognitive management to select L2
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    communicative_impact: 2
    examples:
    - correct: "I will go tomorrow."
      wrong: "I want to go tomorrow. (intended as future)"
    flagged: false
    frequency: 3
    interference_patterns:
    - citation: "Windfuhr 2009 Ch.25, Section 3.2 Verb System, lines 33648-33653"
      communicative_impact: 2
      etiology: interlingual
      example_correct: "I will go tomorrow. / I am going to travel next week."
      example_gloss: "xah- + past stem (affirmative future construction)"
      example_l1: "FA xah-am raft = want-I go-pst = I will go"
      example_wrong: "I want to go tomorrow. (literal transfer of Persian future construction)"
      explanation: "Persian has no future tense. Future is expressed with xah- (to want/wish) + past stem (e.g., xah-am raft = I want-go = I will go). Windfuhr (2009) explicitly notes the absence of a future paradigm shows tense is not the primary vector in Persian. English has dedicated future forms (will, going to, present continuous). Persian learners may produce I want to go tomorrow for I will go tomorrow."
      flagged: false
      frequency: 3
      pattern: "Future expressed as want + verb due to L1 lacking future tense paradigm"
      persistence: 2
      reliability: B
      tier: 2
    persistence: 2
    source_count: 2
    source_rank: 1
    source_type: reference_grammar
    sources:
    - "Windfuhr (2009) Concise Encyclopedia of Languages of the World, Ch.25 Persian"
    - "McManus (2022) Crosslinguistic Influence and Second Language Learning"
    teacher_tips:
      how_to_explain: "Teach: English says I will go for future. Persian says the equivalent of I want to go but it means future. English needs will or going to."
      sequencing: "Week 1: Will for future. Week 2: Going to for future. Week 3: Present continuous for future. Week 4: Review."
      where_to_start: Start with will for future
    tier: 2
    why_it_happens: "Persian lacks a future tense paradigm (Windfuhr 2009 notes the absence of the future paradigm shows tense is not the primary vector). Uses xah- (want/wish) + past stem for future reference. This resembles English want to construction, causing transfer interference."

language: Persian
language_code: fa
schema_version: '4.0'
sources:
- citation: 'Swan, M. & Smith (2001) Learner English, 2nd ed. Cambridge University Press. Ch. 9: Farsi speakers'
  relevance: L1 interference patterns documented for this language group.
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Persian
  relevance: Persian phonological and grammatical transfer patterns — SOV word order,
    articles
- citation: Windfuhr, G.L. (2009) "Persian" in Brown, K. & Ogilvie, S. (eds.) Concise Encyclopedia of Languages of the World. Elsevier. Ch.25
  relevance: Comprehensive reference grammar of Persian — phonology, morphology (ezafe, plurals -ha/-an, gender loss), syntax (SOV, relative clauses, definiteness -ra), verb system (no future tense, evidentiality, compound verbs), Arabic script
total_grammar_points: 60
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: This problem can be solved through [specific solution] because [evidence].
    error: '*After much reflection on the nature of this problem and its many facets,
      one can see that the solution lies in unity.'
    explanation: Persian essays build gradually toward the point; English requires
      the thesis stated upfront.
  - correction: Research by [author] demonstrates that adversity correlates with personal
      growth.
    error: '*As Hafez wrote, ''The wound is the place where the Light enters us,''
      which shows that adversity leads to growth.'
    explanation: Persian writing privileges poetic and literary evidence; English
      academic writing requires empirical or scholarly citation.
  description: 'Persian (Farsi) argumentative writing is deeply influenced by a literary
    tradition that values poetic elaboration, indirectness, and rhetorical flourish.
    Thesis statements are often implied or placed late in the essay, after extensive
    contextualization and background. Persian writers may use analogies, metaphors,
    and literary allusions as primary evidence rather than empirical data. English
    argumentative essays require an explicit thesis in the introduction, linear logical
    development, and evidence grounded in facts, statistics, or cited research. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 10: Persian speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: A paragraph that opens with a topic sentence, provides 2-3 supporting
      details, and concludes by reinforcing the main idea.
    error: '*A paragraph that begins with a historical anecdote, moves to a personal
      reflection, and ends with a philosophical observation — all without a clear
      topic sentence.'
    explanation: Persian paragraph structure is associative and circular; English
      requires linear development from a stated topic sentence.
  - correction: The topic sentence should be the first sentence of the paragraph.
    error: '*The topic sentence appears as the last sentence of the paragraph.'
    explanation: Persian paragraphs often build inductively to a concluding insight;
      English paragraphs begin deductively with the main claim.
  description: 'Persian paragraphs tend to be longer and more expansive than English
    paragraphs, often containing multiple sub-ideas without a single controlling topic
    sentence. The topic sentence may appear at the end of the paragraph as a concluding
    insight rather than at the beginning as a guide. Persian writers may use a ''spiral''
    structure, circling around a theme from multiple angles, whereas English expects
    a linear structure with a clear topic sentence followed by supporting details.
    McManus (2022): Writing interference reflects learned attention from L1 discourse
    habits. L1 rhetorical patterns shape how writers organize and present arguments
    in L2. Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 10: Persian speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: After the government made the decision, public protests led to a policy
      change.
    error: '*The government made a decision and the people were unhappy and there
      were protests and the policy was changed.'
    explanation: Persian chains clauses with 'and'; English uses subordination to
      show cause and effect.
  - correction: Because the economy is weak, the government must act.
    error: '*The economy is weak. Pas the government must act.'
    explanation: '''Pas'' (so) as a sentence opener is a Persian discourse transfer;
      English requires subordinating conjunctions.'
  description: 'Persian writing tends toward parataxis — chaining clauses with ''and''
    (va) and ''but'' (amma/vali) — rather than using subordination. Persian discourse
    markers like ''pas'' (so), ''dar natije'' (as a result), and ''be hamin dalil''
    (for this reason) are frequently overused at sentence beginnings. Persian writers
    may underuse relative clauses and participial phrases, leading to choppy, repetitive
    sentence structures in English. McManus (2022): Writing interference reflects
    learned attention from L1 discourse habits. L1 rhetorical patterns shape how writers
    organize and present arguments in L2. Restructuring these habits requires explicit
    attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 10: Persian speakers. Cambridge
    University Press.'
- area: register_and_formality
  common_errors:
  - correction: This issue warrants further examination because [reason].
    error: '*It is with the utmost humility and deepest respect that this humble writer
      dares to suggest that perhaps the matter under consideration may warrant further
      examination.'
    explanation: Persian formal writing uses elaborate deference and self-deprecation;
      English academic writing values directness.
  - correction: 'The data indicate a clear trend: [specific finding].'
    error: '*One might possibly consider that it could be argued that the data perhaps
      indicates a trend.'
    explanation: Persian taarof conventions produce excessive hedging; English academic
      writing expects confident claims backed by evidence.
  description: 'Persian has a rich tradition of formal, ornate prose that values elaborate
    vocabulary, poetic diction, and rhetorical embellishment. Persian learners may
    produce English writing that is excessively formal, flowery, or indirect. The
    Persian convention of ''taarof'' (ritual politeness) leads to hedged claims and
    indirect argumentation. English academic writing expects concise, direct, and
    evidence-based prose. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 10: Persian speakers. Cambridge
    University Press.'
citations:
- claim: Persian L1 speakers transfer phonological, grammatical, and writing patterns
    from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Persian
  tier: 1
  reliability: B
  flagged: false
- claim: Persian is an SOV language with no articles, a different tense-aspect system,
    and Arabic script — typological differences predict specific English learning
    difficulties
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning.
    Multilingual Matters.
  tier: 1
  reliability: B
  flagged: false
- claim: Persian L1 speakers' errors in English include article usage patterns (Persian
    has a postpositive definite marker but no indefinite article), SOV word order
    transfer, and ezafe construction interference. James's error typology classifies
    these as interlingual errors from an Indo-Iranian L1 with mixed word order properties.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that Persian L1 speakers' word order transfer
    patterns in English differ by register. Persian SOV order and ezafe construction
    interference are more visible in formal written English where strict word order
    is expected.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5: Description of
    register categories'
  tier: 2
- claim: Windfuhr (2009) provides the definitive reference grammar overview of Persian, documenting key ESL-relevant features including SOV word order, no grammatical gender, ezafe construction, animacy-based plural markers (-ha/-an), postpositional definiteness marker -ra, no future tense paradigm, evidential verb forms, periphrastic passive, compound verbs (2000+ constructions), and Arabic script.
  source: "Windfuhr, G.L. (2009) \"Persian\" in Brown, K. & Ogilvie, S. (eds.) Concise Encyclopedia of Languages of the World. Elsevier. Ch.25"
  tier: 1
  reliability: B
  flagged: false
