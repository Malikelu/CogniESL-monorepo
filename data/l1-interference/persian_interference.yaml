    interference_patterns:
    - citation: Swan & Smith 2001, Ch. 'Farsi speakers', § Articles, point 1
      communicative_impact: 3
      etiology: interlingual
      example_correct: His father is a postman.
      example_gloss: father-of me postman is
      example_l1: FA 'pedar-e man post ast'
      example_wrong: His father is postman.
      explanation: 'Transfer from L1: Persian has no indefinite article; learners
        omit a/an before singular countable nouns.'
      flagged: true
      frequency: 5
      pattern: Omission of indefinite article
      persistence: 4
      reliability: B
      tier: 3
    - citation: Swan & Smith 2001, Ch. 'Farsi speakers', § Articles, point 8
      communicative_impact: 2
      etiology: interlingual
      example_correct: English people always talk about weather.
      example_gloss: people-of English always about weather talk do
      example_l1: FA 'mardom-e engilisi hamisah az 'abarat-e havā harf mizanand'
      example_wrong: English people always talk about the weather.
      explanation: 'Transfer from L1: Persian adds definite article where English
        uses zero article with general/abstract nouns.'
      flagged: true
      frequency: 4
      pattern: Overuse of definite article
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: functional_fit_transfer
      example_correct: '''I am a doctor'' / ''Life is beautiful'''
      example_gloss: Persian lacks a/an; uses -rā for definite objects; definiteness from context
      example_l1: 'Persian: lacks a/an; no article system like English'
      example_wrong: '''I am doctor'' / ''the life is beautiful'' (L1-specific article
        overuse/underuse)'
      explanation: 'Golden et al. (2017): Even L1s with articles show non-linear transfer
        effects. Having an L1 article system helps but does not eliminate errors because
        the specific rules for article use (when to use definite, indefinite, or zero
        article) vary across languages. Swedish, French, Spanish, Arabic, and other
        article-bearing L1s all show context-specific article errors in English.'
      flagged: true
      frequency: 4
      pattern: 'Golden et al. (2017): Having L1 articles does NOT guarantee easy English
        article acquisition'
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: conceptual_transfer
      example_correct: '''el libro'' / ''la mesa'''
      example_gloss: Persian does not mark gender on articles/adjectives
      example_l1: 'Persian: no grammatical gender'
      example_wrong: '''la libro'' / ''el mesa'' (Spanish gender assignment difficulty)'
      explanation: 'Golden et al. (2017) Ch.6 (Ragnhildstveit): Vietnamese (no gender,
        but classifier system) omits articles MORE but is accurate for gender WHEN
        using them — showing partial compensation. Having no L1 gender system means
        learning gender from scratch, but compensating cognitive strategies (classifiers,
        semantic categorization) may partially support acquisition.'
      flagged: true
      frequency: 4
      pattern: 'Golden et al. (2017): L1s without grammatical gender struggle with
        gender in gendered L2s — but may use compensating strategies'
      persistence: 3
      reliability: B
      tier: 3
