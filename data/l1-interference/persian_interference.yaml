      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    communicative_impact: 2
    examples:
    - correct: He runs very fast. / He runs very quickly.
      wrong: He runs very fastly.
    - correct: She speaks English well.
      wrong: She speaks English good.
    flagged: false
    frequency: 4
    interference_patterns:
    - citation: Swan & Smith 2001, Ch. 'Farsi speakers', § Adjectives and adverbs
      communicative_impact: 2
      etiology: interlingual
      example_correct: He drives very slowly.
      example_gloss: fast and fast(ly) same word
      example_l1: FA sari = fast (same form for adj and adv)
      example_wrong: He drives very slow.
      explanation: 'Transfer from L1: Persian does not always distinguish morphologically
        between adjectives and adverbs; the same word is often used for both.'
      flagged: true
      frequency: 4
      pattern: Use of adjective instead of adverb
      persistence: 3
      reliability: B
      tier: 3
    persistence: 3
    source_count: 5
