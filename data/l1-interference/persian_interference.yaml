        name: Article Decision Tree
        type: fill-in-the-blank
      how_to_explain: 'Teach: English REQUIRES ''a/an'' for singular countable nouns.
        Persian ''ketab'' (book) -> English ''a book''.'
      sequencing: 'Week 1: Indefinite articles. Week 2: Definite articles. Week 3:
        Zero article. Week 4: Review.'
      where_to_start: Start with the indefinite article pattern.
    tier: 1
    why_it_happens: 'Persian has no indefinite article. Definiteness is marked by
      context or the suffix ''-ra'' for specific direct objects. Persian learners
      may omit ''a/an'' or overuse ''the''. McManus (2022) explains that L2 speakers
      can learn new form-meaning mappings (like articles) that don''t exist in L1,
      but this requires extensive practice to become automatic. Online anticipatory
      processing (using articles to predict upcoming nouns) develops only with high
      proficiency and extended exposure, not from L1 transfer. McManus (2022) explains
      that L2 speakers can learn new form-meaning mappings that don''t exist in L1,
      but this requires extensive practice to become automatic. L2 learning involves
      creating new knowledge when L1-L2 differences exist AND developing selection
      mechanisms to manage competing knowledge sources (McManus 2022, Ch. 1). Online
      anticipatory processing develops only with high proficiency and extended exposure.
      Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921).
      Post-behaviorist constructs — activation, automaticity, entrenchment — explain
      transfer patterns. Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries. Odlin (Ch.4): SOV word order IS transferable to English SVO. The LEAST
      proficient speakers show the MOST transfer. Proficiency-sensitive pattern confirmed
      across 11 language contact situations (Hawaiian Pidgin English, Andean Spanish,
      Pidgin Fijian, Indo-Portuguese creole, etc.). Refutes Zobl & Rutherford''s claimed
      universal constraint. Word-order transfer more likely in informal/unfocused
      contexts.'
