      wrong: His father is postman.
    - correct: He plays the piano.
      wrong: He plays piano.
    - correct: The tiger is dangerous.
      wrong: Tiger is dangerous.
    - correct: Shall we go to the cinema?
      wrong: Shall we to cinema?
    - correct: I listen to the radio.
      wrong: I listen to radio.
    - correct: He is the best.
      wrong: He is best.
    - correct: I go to school every day.
      wrong: I go to the school every day.
    - correct: Most people think...
      wrong: Most of the people think...
    - correct: The rocket flew into space.
      wrong: The rocket flew into the space.
    - correct: Criminals are a danger to society.
      wrong: Criminals are a danger to the society.
    - correct: In spring nature is beautiful.
      wrong: In spring the nature is beautiful.
