- claim: Danish L1 speakers transfer Germanic grammatical patterns to English, producing
    both facilitation errors (from cognate structures) and interference errors (from
    divergent structures). James's error typology classifies these as interlingual
    errors, noting that related L1s produce distinctive error profiles compared to
    unrelated L1s.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's corpus comparison shows that Danish L1 speakers' transfer patterns
    in English reflect the relative similarity of Germanic registers. Danish academic
    writing conventions partially overlap with English, explaining why transfer effects
    are more visible in informal registers than in academic prose.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.3.4: Register and
    dialect distinctions'
  tier: 2
- claim: 'Danish is a mainland Scandinavian V2 language with suffixed definite articles (dagen, huset), stod accent, no verb person or number agreement, and analytic passive (blive + participle) - all causing specific L1 interference in English'
