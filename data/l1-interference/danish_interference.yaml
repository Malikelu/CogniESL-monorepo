writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Stricter regulation is necessary because market-based approaches have
      failed to address [specific problem]. Evidence from [source] demonstrates that
      regulatory intervention produces better outcomes.
    error: '*There are many perspectives on this issue, and each has its merits. Some
      argue for stricter regulation, while others favor a market-based approach. Both
      sides raise valid points, and perhaps the truth lies somewhere in between.'
    explanation: Danish essay tradition values balanced presentation of both sides;
      English argumentative essays require a clear, defensible thesis from the outset.
  - correction: The evidence supports this view. [Source] found that [specific finding].
    error: '*It could perhaps be suggested that maybe there might be some evidence
      to support this view.'
    explanation: Danish academic writing uses hedging to avoid assertiveness; English
      academic writing expects confident claims backed by evidence.
  description: 'Danish rhetorical tradition values consensus-building and collaborative
    reasoning, which can produce English essays that seem to avoid taking a strong
    position. Danish ''pro og kontra'' (pro and contra) essay structures present both
    sides of an argument with equal weight, often without committing to a clear thesis.
    Danish academic writing may delay the main argument in favor of extensive context,
    and the Danish cultural preference for ''Janteloven'' (not standing out) can result
    in hedged, understated claims where English academic writing expects confident,
    well-supported arguments. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Danish speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Develop each main point fully within a paragraph of 5-10 sentences,
      beginning with a clear topic sentence that states the main idea.
    error: '*Multiple short paragraphs (2-3 sentences each) that feel underdeveloped
      and lack clear topic sentences.'
    explanation: Danish prose style favors brevity and implicit main ideas; English
      academic paragraphs require explicit topic sentences and substantive development.
  - correction: Use transition sentences and linking phrases to show how each paragraph
      relates to the thesis and to adjacent paragraphs.
    error: '*Paragraphs that jump from one point to the next without transitions or
      clear connections.'
    explanation: Danish writing may rely on implicit connections; English writing
      expects explicit signaling of logical relationships.
  description: 'Danish paragraphs tend to be shorter and more concise than English
    paragraphs, reflecting a Scandinavian prose style that values directness and brevity.
    Danish writers may present ideas in a series of brief paragraphs, each making
    a single point without extensive development. This can make English writing feel
    choppy and underdeveloped. Danish writers may also underuse topic sentences, assuming
    the reader will infer the main point from context. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Danish speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: The policy has both benefits and drawbacks. However, the overall impact
      appears positive, as the data demonstrates.
    error: '*The policy has some benefits. And it also has some drawbacks. So overall
      it seems positive. And the data supports this conclusion.'
    explanation: Danish writing often begins sentences with 'and' and 'so'; English
      requires more varied and formal cohesive devices.
  - correction: Although the results were significant, the study had several limitations.
    error: '*The results were significant and and the study had limitations.'
    explanation: Danish 'og' (and) is used more flexibly than English 'and'; English
      requires specific connectors for contrast, cause, and addition.
  description: 'Danish writers may underuse explicit connectors in English, reflecting
    a Danish stylistic preference for implicit logical flow. The Danish ''men'' (but),
    ''og'' (and), and ''sa'' (so) are basic connectors that Danish writers may overuse
    as catch-all transitions. Danish ''nemlig'' (namely) and ''altsa'' (therefore)
    may be directly transferred to English with incorrect usage. Danish writers may
    also overuse the conjunction ''and'' to begin sentences, reflecting Danish discourse
    patterns. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Danish speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: This essay analyzes the data to demonstrate that the policy has been
      ineffective.
    error: '*This essay will look at the data and show that the policy doesn''t work.'
    explanation: Danish academic style favors accessible, informal expression; English
      academic writing expects formal register with passive or impersonal constructions.
  - correction: The policy is flawed because its design failed to account for [specific
      factor].
    error: '*The policy is wrong because the government didn''t think it through.'
    explanation: Danish directness may produce overly casual academic prose; English
      expects measured, formal tone with evidence-based claims.
  description: 'Danish academic writing tends toward an accessible, egalitarian style
    influenced by Scandinavian cultural values. Danish writers may use a more conversational
    tone in English academic writing than expected, including contractions and informal
    phrasing. The Danish tradition of ''folkelig'' (popular, accessible) communication
    can produce essays that lack the formal register expected in English academic
    contexts. Danish writers may also underuse hedging where English expects it, producing
    overly direct claims. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 12: Danish speakers. Cambridge
    University Press.'
