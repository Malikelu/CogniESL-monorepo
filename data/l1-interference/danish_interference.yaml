- claim: Danish and English are both Germanic languages with significant cognate vocabulary,
    but differences in phonology (stød, consonant reduction) and article systems cause
    specific L1 interference
  source: Singleton (2016) Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters.
  tier: 1
