language: Finnish
language_code: fi
schema_version: '4.0'
writing_interference:
- area: argumentative_essay
  description: 'Finnish rhetorical tradition values directness and conciseness, contrasting
    with English academic writing expectations. Finnish writers may produce English
    essays that appear blunt or underdeveloped by English standards, with less hedging
    and fewer explicit argumentative connectors than expected. Finnish argumentation
    often follows a pattern of presenting facts and evidence with minimal rhetorical
    framing; the reader is expected to draw conclusions from the evidence presented.
    This can make English essays feel incomplete or unsupported to English-speaking
    readers. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits.'
  common_errors:
  - error: '*Research shows that exercise is good. People who exercise live longer.'
    correction: A substantial body of research demonstrates a clear link between regular
      physical exercise and increased longevity. Specifically, a 2019 study published
      in the British Journal of Sports Medicine found that individuals who engaged
      in regular moderate exercise had a 20–30% lower risk of premature death compared
      to sedentary participants.
    explanation: 'Finnish writing often states conclusions directly with minimal rhetorical
      development. English academic essays expect explicit argumentative framing:
      hedging, elaboration, and specific evidentiary detail.'
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Finnish and Estonian speakers.
    Cambridge University Press.'
- area: paragraph_structure
  description: Finnish paragraphs tend to be shorter than English conventions expect,
    and Finnish writers may underdevelop paragraphs by English standards. Topic sentences
    may be absent or implied rather than explicitly stated. Finnish writing prioritizes
    allowing evidence to "speak for itself" rather than guiding the reader through
    each paragraph with explicit framing and analysis.
  common_errors:
  - error: '*Finland has good education. Teachers are well-trained. Students do well
      on PISA tests.'
    correction: Finland's education system is widely regarded as one of the world's
      most effective. This reputation rests on several factors, including rigorous
      teacher training programmes and consistently strong student performance on international
      assessments such as the PISA tests, where Finnish students regularly rank among
      the top performers globally.
    explanation: Finnish paragraph structure may present assertions sequentially with
      minimal connective tissue. English paragraphs require explicit topic sentences,
      development, and analytical integration of evidence within each paragraph.
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Finnish and Estonian speakers.
    Cambridge University Press.'
- area: rhetorical_tradition_and_register
  description: 'Branch (1997): Finnish academic writing values conciseness, directness,
    letting evidence speak for itself, and direct conclusions without extensive hedging.
    This contrasts with English academic conventions expecting hedging, explicit connectors,
    and elaborated topic sentences.'
  common_errors:
  - error: '''*The results show the method works.'' (blunt, no hedging)'
    correction: The results strongly suggest that the method is effective and could
      be widely adopted.
    explanation: Finnish tradition states conclusions directly. English expects hedging
      and explicit argumentative framing.
  - error: '''*The data is clear. The theory is wrong.'' (no connectors)'
    correction: However, the data clearly contradicts this theory, suggesting an alternative
      explanation may be needed.
    explanation: Finnish allows abrupt transitions. English expects explicit connectors
      (however, therefore).
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
grammar_interference:
- area: noun_system
  description: 'Finnish has 15 grammatical cases expressed through agglutinative suffixes
    rather than prepositions. Finnish has NO grammatical gender and NO articles (definite
    or indefinite). These absences cause systematic transfer: (1) Article omission
    is pervasive — Finnish learners of English must acquire articles from scratch
    with no L1 prototype. (2) Grammatical gender in English (he/she/it) requires learning
    from scratch — Finnish uses "hän" for both "he" and "she." (3) English prepositions
    must be learned individually since Finnish expresses spatial/temporal relations
    via case endings. Ilomäki (2005): Finnish learners'' errors with German articles
    were attributed to simplification rather than transfer, suggesting article difficulty
    is developmental as well as typological.'
  common_errors:
  - error: '*I went school yesterday.'
    correction: I went to school yesterday.
    explanation: English prepositions replace Finnish case endings. Finnish "menin
      kouluun" (I went school-to) uses the illative case (-un) where English requires
      the preposition "to."
  - error: '*Student is tired. / He is good student.'
    correction: The student is tired. / He is a good student.
    explanation: Finnish has no articles. Finnish "opiskelija on väsynyt" (student
      is tired) requires no article. English article use must be learned from scratch.
  - error: '''*She is doctor.'' (hän on lääkäri)'
    correction: She is a doctor.
    explanation: Finnish zero-article for professions transfers directly to English.
      Finnish "hän on lääkäri" maps onto English "*he/she is doctor" — both article
      omission and potential pronoun confusion (hän = he/she).
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Trinity College Dublin.'
- area: verb_system
  description: 'Finnish has no equivalent of the verb "to have" — possession is expressed
    with the adessive case + "on" (is). Finnish verbs do not encode person in the
    same way as English; the verb form stays mostly the same across persons (with
    some consonantal changes). Finnish has no separable verb prefixes (like German
    "an-", "ver-", "be-"). Finnish passive is formed with a single morpheme and is
    close in form to the base/infinitive, unlike English passive which requires auxiliary
    + past participle. Ilomäki (2005): Finnish learners of German struggled with separable
    prefixes because Finnish has no equivalent structure — this is a genuine gap,
    not negative transfer from a competitor.'
  common_errors:
  - error: '''*I have car.'' (Minulla on auto)'
    correction: I have a car.
    explanation: Finnish expresses possession as "on me there is a car" (minulla on
      auto). The copula + adessive structure transfers to English as subject omission
      or wrong word order.
  - error: '''*The house sold.'' / ''*The house is sell.'''
    correction: The house is being sold. / The house was sold.
    explanation: Finnish passive ("talo myydään" = house sells-PASSIVE) uses a single
      verb form. English be + past participle passive construction must be learned
      from scratch.
  - error: '''*She go yesterday.'' (forwent)'
    correction: She went yesterday.
    explanation: Finnish marks tense with a single suffix (-i- for past), not auxiliary
      changes. English irregular past forms require individual learning.
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Trinity College Dublin.'
- area: word_order
  description: 'Finnish word order is relatively FREE but tends toward SVO. Unlike
    rigid SOV languages (Japanese, Korean, Turkish), Finnish word order is governed
    by emphasis and information structure rather than grammatical position. Because
    Finnish uses 15 grammatical cases to mark grammatical roles, word order can be
    varied pragmatically without losing meaning. This is similar to German within
    the Germanic family. Ilomäki (2005): Finnish learners of German produced SVO-influenced
    errors in German subordinate clauses (where German requires verb-final/SOV order),
    showing Finnish SVO tendency transfers. Finnish learners may also produce word
    order errors in English constructions where word order is more rigid (e.g., subject-auxiliary
    inversion in questions)'
  common_errors:
  - error: '*Why you came late?'
    correction: Why did you come late?
    explanation: Finnish questions use WH-word + verb without auxiliary inversion
      ("miksi sinä tulit myöhään?"). English requires subject-auxiliary inversion
      with "do"-support.
  - error: '*The letter John wrote was long.'
    correction: The letter that John wrote was long.
    explanation: Finnish relative clauses use participial forms without relative pronouns.
      English requires "that/which/who" relativizers.
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Trinity College Dublin.'
- area: noun_compounding
  description: Finnish, like German, is a productive compounding language. English
    compounds are more restricted and less transparent. Finnish learners may over-create
    English compounds (following L1 pattern) or fail to recognize that English prefers
    multi-word expressions for concepts that Finnish expresses as single compound
    words.
  common_errors:
  - error: '''school building'' → ''schoolhouse'' (talo = house, koulu = school, koulutalo
      = school building)'
    correction: school building (multi-word, not compound in many cases where Finnish
      uses a single word)
    explanation: Finnish "koulutalo" (school-building) is a single compound word.
      English often uses two-word noun phrases rather than compounds, especially in
      formal writing.
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Trinity College Dublin.'
- area: case_system_detail
  description: 'Branch (1997): 15+ cases. Partitive marks incomplete/continuing action
    and partitive subjects with indefinite quantity. Adessive expresses possession:
    isalla on saari (father-on is island = father has an island). Consonant gradation
    affects ~85 declension classes. Numerals (except yksi) govern partitive singular:
    kaksi miesta = two man-PART.SG.'
  common_errors:
  - error: '''*I cold'' (minun on kylma)'
    correction: I am cold.
    explanation: 'Finnish adessive experiencer: minun on kylma. English requires BE
      + adjective.'
  - error: '''*Two man came'' (kaksi miesta tuli)'
    correction: Two men came.
    explanation: Numerals (except yksi) govern partitive singular. English requires
      plural 'men'.
  - error: '''*Glass is water'' (lasissa on maitoa)'
    correction: There is some water in the glass.
    explanation: Finnish existential uses inessive + on + partitive. English requires
      existential 'there is'.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
- area: possessive_suffixes
  description: 'Branch (1997): Finnish uses personal possessor suffixes (-ni, -si,
    -nsa/-Vn, -mme, -nne) attached to nouns after case suffixes: talossanikin = house-in-my-also.
    No parallel in English. 3rd person -nsa can co-occur with genitive pronoun (heidan
    talonsa = their house-their).'
  common_errors:
  - error: Word order errors with possession
    correction: Also in my house.
    explanation: Finnish talossanikin (house-in-my-also). English separates possessive
      into distinct word in fixed position.
  - error: '''*The house-their is big'' — double marking'
    correction: Their house is big.
    explanation: Finnish allows heidan talonsa (their house-their), leading to double-marking
      transfer in English.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
- area: word_order_and_focus
  description: 'Branch (1997): Finnish word order is pragmatically determined within
    SVO. Case system makes roles unambiguous, allowing free word order for emphasis.
    Yes/no questions use -ko/-ko suffixed to focused word. Differs from English where
    word order is grammatically determined.'
  common_errors:
  - error: '''*You are coming when?'''
    correction: When are you coming?
    explanation: Finnish WH-questions don't use auxiliary inversion. English requires
      subject-auxiliary inversion.
  - error: '''*Came John yesterday'' — verb-fronting'
    correction: John came yesterday.
    explanation: Finnish allows verb-initial for focus. English restricts verb-initial
      to specific constructions.
  - error: '''*Saw she him'' — SOV transfer'
    correction: She saw him.
    explanation: Finnish case markings permit SOV/OVS. English SVO is mandatory.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
- area: passive_and_impersonal
  description: 'Branch (1997): Finnish passive-impersonal is a single verb form used
    for: (1) impersonal statements (taalla puhutaan suomea = Finnish spoken here),
    (2) colloquial 1st person plural (me lahdetaan kotiin = we go home), (3) restricted
    passive with inferred human agent. More restricted than English be + past participle.'
  common_errors:
  - error: '''*Was came by John'' — auxiliary misuse'
    correction: John came. / It was brought by John.
    explanation: Finnish passive is one word (sanotaan = is-said). English be + past
      participle requires auxiliary.
  - error: Overgeneralizing impersonal to all English passives
    correction: Various passive constructions depend on context
    explanation: Branch notes the impersonal usage is a specific construction, not
      a general passive equivalent.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
vocabulary_interference:
- area: cognate_absence
  description: 'Finnish is a Finno-Ugric (Uralic) language, completely unrelated to
    English (Indo-European). There are virtually NO true cognates between Finnish
    and English. This means Finnish learners cannot rely on cognate recognition strategies
    that benefit learners from Romance, Germanic, or Slavic L1s. Ilomäki (2005): Finnish
    learners had more difficulty with English vocabulary than Swedish-speaking Finns,
    confirming Ringbom''s finding that language distance determines vocabulary acquisition
    speed.'
  common_errors:
  - error: '''*Doctor came.'' (no cognate for "doctor" in Finnish — lääkäri)'
    correction: The doctor came.
    explanation: Finnish "lääkäri" shares no form with English "doctor." Finnish learners
      must memorize English vocabulary without L1 cognate support, unlike Swedish/German/Dutch
      learners who recognize Latin-origin cognates.
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German; Ringbom (1987). The Role of the First Language in Foreign Language Learning.'
- area: vowel_harmony_spelling
  description: 'Finnish has vowel harmony: back vowels (a, o, u) and front vowels
    (ä, ö, y) cannot co-occur within a single non-compound word. Finnish also has
    transparent one-to-one letter-sound correspondence (perfect phoneme-grapheme mapping).
    This influences English spelling: Finnish learners may apply Finnish pronunciation
    rules to English spellings, particularly with French/Latin-origin words whose
    spelling does not follow Finnish phonotactic rules.'
  common_errors:
  - error: '''*Universitet'' (Finnish spelling of English "University")'
    correction: University
    explanation: Finnish "yliopisto" shares no form with English "University." But
      Finnish transparent spelling may lead learners to spell English words phonetically,
      producing errors like "universitet" (also influenced by Swedish).
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Trinity College Dublin.'
- area: third_language_transfer
  description: 'Finnish learners of English/German are typically multilingual (Finnish
    + Swedish + English). Ilomäki (2005): Finnish learners of German showed extensive
    lexical transfer not from Finnish but from Swedish and English — the related Germanic
    languages. This is psychotypological transfer: learners transfer from the L2 perceived
    as closest to the target language, even when it is not the native language. Finnish
    was barely used as a source of lexical transfer in Ilomäki''s study because Finnish
    is so distant from German.'
  common_errors:
  - error: '''*Familj'' (Swedish "familj" replacing English "family")'
    correction: family
    explanation: Finnish learners of English may borrow from Swedish (their L2) rather
      than Finnish (L1) because Swedish is closer to English. Ilomäki found Swedish-origin
      borrowings in Finnish learners' German production.
  source: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Trinity College Dublin.'
- area: etymology_and_derived_forms
  description: 'Branch (1997): Finnish has ~160 derivational suffixes making derivation
    highly productive. Finnish learners may underuse English derivational morphology
    and over-rely on compounding. Despite 6 loanword layers, 60-70% of modern Finnish
    text uses indigenous Finno-Ugric vocabulary.'
  common_errors:
  - error: '''*Sun-shine-light'' — over-compounding'
    correction: Sunlight / Sunshine
    explanation: Finnish compounding is highly productive and transparent. English
      compounding is more restricted and lexicalized.
  - error: Applying Finnish-style morpheme analysis to English derivation
    correction: Use standard English derivational analysis
    explanation: English derivational morphology is less systematic than Finnish (e.g.
      voittamattomuus = 5 transparent morphemes).
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
phonology_interference:
- area: segmental
  description: 'Finnish has a smaller consonant inventory than English. Key absent
    consonences include: /ð/ (this), /θ/ (think), and the voiced/voiceless distinction
    in stops (Finnish has voiceless stops only; "b, d, g" exist but are not truly
    voiced in the English sense). Finnish does not permit complex consonant clusters
    (CC-, -CC-) word-initially or word-finally. Finnish stress is always on the first
    syllable.'
  common_errors:
  - error: '''*dis'' for ''this''; ''*tink'' for ''think'''
    correction: this; think
    explanation: Finnish lacks dental fricatives /ð/ and /θ/. Learners substitute
      the nearest Finnish stops /d/ and /t/.
  - error: '''*psort'' for ''sport'' or cluster reduction ''sopot'''
    correction: sport
    explanation: Finnish does not allow word-initial consonant clusters. Learners
      either insert an epenthetic vowel (səport) or delete a consonant.
  - error: 'Stress on first syllable: ''*uniVERsity'' instead of ''uniVERsity'''
    correction: university (stress on second syllable)
    explanation: Finnish word stress is strictly first-syllable. English variable
      stress is learned from scratch.
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Finnish and Estonian speakers.
    Cambridge University Press.'
- area: consonant_gradation_and_phonology_transfer
  description: 'Branch (1997): Finnish consonant gradation (strong/weak alternation
    of stops k, p, t) has no parallel in English. Finnish syllable structure allows
    only single consonants at onset/coda - no CC clusters. Finnish /b, d, g/ in recent
    loans are not truly voiced. Main stress is strictly first-syllable with secondary
    stress on 3rd/5th syllables.'
  common_errors:
  - error: 'Epenthetic vowel insertion: /saport/ for ''sport'''
    correction: sport
    explanation: Finnish syllable structure allows only single consonants at onset.
      Word-initial CC clusters are impossible in Finnish phonotactics (Branch 1997).
  - error: 'First-syllable stress: /''university/'
    correction: university (stress on third syllable)
    explanation: Branch states Finnish main stress always falls on the first syllable.
      Transfers to English as uniform initial stress.
  - error: 'Final devoicing: /''bak/ for ''bag'''
    correction: bag
    explanation: Finnish has no voiced/voiceless stop opposition. Branch notes Finnish
      b, d, g in recent loans vary between foreign sound and voiceless Finnish equivalent.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
sources:
- citation: 'Ilomaki, A. (2005) Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German.'
  relevance: Finnish-English crosslinguistic influence study. Finnish is a Finno-Ugric
    language with 15 grammatical cases, no grammatical gender, no articles, and extensive
    agglutinative morphology. Finnish-to-English transfer patterns differ from Indo-European
    L1s due to the typological distance.
- citation: 'Ilomäki, A. (2005). Cross-linguistic Influence: A Cross-sectional Study
    with Particular Reference to Finnish-speaking and English-speaking Learners of
    German. Final Year Project, Trinity College Dublin.'
  relevance: 'Empirical study comparing Finnish-speaking (n=18) and English-speaking
    (n=17) learners of German (L3/L4). Found Finnish learners transferred from Swedish/English
    (not Finnish L1) due to psychotypological distance. Key Finnish-specific features:
    15 cases, no articles, no gender, free word order, no separable prefixes, agglutinative
    morphology, vowel harmony.'
- citation: 'Swan, M. & Smith, B. (2001). Learner English: A teacher''s guide to interference
    and other problems (2nd ed.). Cambridge University Press. Chapter 16: Finnish
    and Estonian speakers.'
  relevance: Reference guide to Finnish-speaking learners' English difficulties. Articles,
    prepositions, word order, consonants, stress, spelling, vocabulary cognate absence.
- citation: Ringbom, H. (1987). The Role of the First Language in Foreign Language
    Learning. Multilingual Matters.
  relevance: Foundational study on Finnish-speaking vs. Swedish-speaking Finns learning
    English. Swedish-speaking Finns acquired English vocabulary faster due to language
    distance; Finnish learners relied on L2 Swedish/English cognate strategies.
- citation: Yu, L. & Odlin, T. (eds) (2016) New Perspectives on Transfer in Second
    Language Learning. Multilingual Matters.
  relevance: 'S38 theoretical framework for finnish. Typological distance predicts
    article difficulty: L1s without articles show more omission errors (Luk & Shirai
    2009) | Positive transfer documented for L1s with articles (e.g., Swedish) vs.
    L1s without (e.g., Finnish)'
- citation: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Chapter 29.
  relevance: 'Definitive typological overview of Finnish: phonology (8+16 vowels,
    vowel harmony, 15 consonants, gradation), morphology (15+ cases, possessor suffixes,
    passive), syntax (SVO flexible, no articles), lexicon (6 etymological layers,
    160+ derivational suffixes, 60-70% indigenous vocabulary).'
citations:
- claim: Odlin (2022) studies Finnish learners of English in depth — Ch.3 documents
    article and preposition transfer patterns for Finnish (no articles, rich case
    system), Ch.4 documents word-order transfer (Finnish is discourse-configurational),
    and Ch.5-6 document focus construction transfer.
  flagged: false
  reliability: B
  source: Odlin, T. (2022). Explorations of Language Transfer. Multilingual Matters.
    Ch. 3, 4, 5-6
  tier: 1
- claim: Finnish L1 speakers transfer phonological, grammatical, and writing patterns
    from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Finnish
  tier: 1
  reliability: B
  flagged: false
- claim: Finnish is a Uralic language with 15 cases, no articles, no grammatical gender,
    agglutinative morphology, and vowel harmony - among the most typologically distant
    languages from English.
  source: McManus, K. (2022). Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 1
  reliability: B
  flagged: false
- claim: Finnish L1 speakers' errors in English article usage, preposition choice,
    and word order reflect mother-tongue transfer from an agglutinative Uralic language.
    James's error typology classifies these as interlingual errors arising from structural
    differences between Finnish (no articles, 15 cases) and English.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that Finnish L1 speakers' article errors
    in English are particularly visible in academic prose, which demands higher article
    frequency than conversation. The Finnish zero-article system creates systematic
    transfer effects that register-aware instruction can address.
  source: Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999). Longman
    Grammar of Spoken and Written English. Longman.
  tier: 2
- claim: 'Finnish has 8 monophthong and 16 diphthong phonemes with vowel harmony:
    all vowels in a word must be front or back. Vowel harmony determines suffix vowel
    selection (e.g. poydalla ''on the table'' but tuolilla ''on the chair''). Branch
    (1997) provides the definitive phonological description.'
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
  tier: 1
  reliability: B
  flagged: false
- claim: Finnish has 15 consonant phonemes with no voiced/voiceless stop opposition.
    Consonant gradation (strong/weak alternation of stops k, p, t) affects about 85
    declension classes. Finnish stress is strictly on the first syllable.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
  tier: 1
  reliability: B
  flagged: false
- claim: 'Finnish has approximately 15 grammatical cases: 3 general local (essive,
    partitive, translative), 6 specific local (inessive, elative, illative, adessive,
    ablative, allative), plus nominative, accusative, genitive, instructive, comitative,
    abessive. The adessive expresses possession (isalla on saari = father has an island).'
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
  tier: 1
  reliability: B
  flagged: false
- claim: Finnish has no definite or indefinite articles. Definiteness uses demonstratives
    (tama, tuo, se) and word order. Finnish has personal possessor suffixes (-ni,
    -si, -nsa/-Vn) attached directly to nouns. Numerals (except yksi) govern the partitive
    singular.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
  tier: 1
  reliability: B
  flagged: false
- claim: Finnish word order is pragmatically determined within SVO. The case system
    makes roles unambiguous, allowing flexible word order for emphasis. Finnish passive-impersonal
    is a single verb form used for impersonal statements, colloquial 1st person plural,
    and restricted passive with inferred human agent.
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
  tier: 1
  reliability: B
  flagged: false
- claim: 'Finnish lexicon: 6 etymological layers (Finno-Ugric core, Baltic, Germanic,
    Swedish, Slavonic, English). 60-70% of modern text uses indigenous vocabulary.
    160+ derivational suffixes enable highly productive word formation (e.g. voittamattomuus
    ''invincibility'' = 5 morphemes).'
  source: Branch, M. (1997). Finnish. In B. Comrie (ed.), The World's Major Languages.
    Routledge. Ch. 29.
  tier: 1
  reliability: B
  flagged: false
etiology:
- claim: Finnish is a Uralic language (Baltic-Finnic branch), completely unrelated
    to Indo-European languages. It is spoken by approximately 5.5 million people,
    primarily in Finland.
  reliability: A
  source: 'Comrie, B. (ed.) (2018) The World''s Major Languages, 3rd ed. Routledge.
    Ch. 29: Finnish (Branch).'
  tier: 1
- claim: Finnish basic word order is SVO but is relatively free due to rich case morphology.
    The grammatical roles are marked by case endings rather than word order.
  reliability: A
  source: 'Comrie, B. (ed.) (2018) The World''s Major Languages, 3rd ed. Routledge.
    Ch. 29: Finnish (Branch).'
  tier: 1
- claim: Finnish is highly agglutinative with 15 grammatical cases. There is no grammatical
    gender, no articles, and no equivalent of "have" — possession is expressed with
    the adessive case.
  reliability: A
