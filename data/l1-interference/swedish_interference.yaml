- claim: Swedish, like Danish and Norwegian, is a North Germanic language with cognate
    vocabulary but differs from English in phonology, article suffixation, and compound
    word formation
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning.
    Routledge.
  tier: 1
  reliability: B
  flagged: false
- claim: Swedish L1 speakers' errors in English include word order transfer (V2 rule
    interference), false cognates, and article usage patterns reflecting Germanic
    L1 transfer. James's error typology classifies these as interlingual errors from
    a closely related Germanic L1, noting that cognate structures produce subtle rather
    than gross transfer errors.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
