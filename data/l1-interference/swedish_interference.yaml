schema_version: '4.0'
sources:
- citation: 'Swan, M. & Smith (2001) Learner English, 2nd ed. Cambridge University Press. Ch. 5: Swedish speakers'
  relevance: L1 interference patterns documented for this language group.
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Swedish
  relevance: Swedish phonological and grammatical transfer patterns
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: The evidence supports [specific claim]. Although counterarguments
      exist, the preponderance of evidence from [source] demonstrates that [finding].
    error: '*There are many different perspectives on this issue, and each has its
      merits. Some researchers argue in favor, while others point out potential concerns.
      Both sides raise valid points, and it might be said that the truth lies somewhere
      in the middle.'
    explanation: Swedish essays present balanced perspectives without committing to
      a thesis; English essays require a clear, defensible position.
  - correction: 'The data demonstrate a positive trend: [specific finding]. While
      caution is warranted, the evidence supports this conclusion.'
    error: '*It is perhaps worth considering whether the data might not suggest a
      somewhat positive trend, although one should naturally be cautious about drawing
      too strong conclusions.'
    explanation: Swedish academic writing uses extensive hedging to avoid assertiveness;
      English expects confident claims with appropriate qualification.
  description: 'Swedish rhetorical tradition values consensus, egalitarianism, and
    balanced argumentation, reflecting the Swedish cultural principles of ''lagom''
    (just the right amount) and ''Janteloven'' (not standing out). Swedish essays
    often present both sides of an argument with careful balance, avoiding strong
    or controversial claims. Swedish academic writing, influenced by the tradition
    of ''folkbildning'' (popular education), prioritizes accessibility and democratic
    engagement. This can produce English essays that seem hedged, understated, or
    reluctant to commit to a clear position. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Swedish section. Cambridge University Press.'
- area: paragraph_structure
  common_errors:
  - correction: 'Develop each point fully: topic sentence, evidence, analysis, and
      connection to the thesis within each paragraph.'
    error: '*Multiple short paragraphs (2-3 sentences) that each make a claim without
      sufficient supporting evidence or analysis.'
    explanation: Swedish prose style favors brevity; English academic paragraphs require
      substantive development.
  - correction: Every paragraph should clearly relate to the thesis, with transitions
      that signal its role in the argument.
    error: '*Paragraphs that present facts without connecting them to the overall
      argument or showing how they support the thesis.'
    explanation: Swedish writing may rely on implicit connections; English writing
      expects explicit signaling of each paragraph's contribution.
  description: 'Swedish paragraphs tend to be concise and functional, reflecting the
    Scandinavian preference for direct, unadorned prose. Swedish writers may produce
    English paragraphs that feel underdeveloped, with insufficient evidence and analysis.
    Swedish writers may also assume the reader will infer logical connections, underusing
    topic sentences and transition statements. The Swedish ''sakprosa'' style values
    efficiency, which can make English essays feel sparse or lacking in depth. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Swedish section. Cambridge University Press.'
- area: cohesion_devices
  common_errors:
  - correction: The study found positive results using a sound methodology. However,
      despite the adequate sample size, some limitations remain.
    error: '*The study found positive results. And the methodology was sound. But
      there were some limitations. And the sample size was adequate.'
    explanation: Swedish coordinates between sentences with 'and' and 'but'; English
      uses subordination and varied connectors.
  - correction: The significant results support the hypothesis and contribute to the
      field.
    error: '*The results were significant. So the hypothesis was supported. So the
      study contributes to the field.'
    explanation: Swedish 'sa' (so) is used as a general connector; English requires
      specific logical connectors.
  description: 'Swedish writers may underuse explicit connectors in English, reflecting
    a Swedish stylistic preference for implicit logical flow. Swedish ''men'' (but),
    ''och'' (and), and ''sa'' (so) are basic connectors that Swedish writers may overuse
    as catch-all transitions. Swedish ''nämligen'' (namely) and ''alltsa'' (therefore)
    may be transferred to English with incorrect usage. Swedish writers may also overuse
    ''och'' (and) to begin sentences, reflecting Swedish discourse patterns. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Swedish section. Cambridge University Press.'
- area: academic_register
  common_errors:
  - correction: This essay analyzes the data to evaluate the policy's effectiveness.
    error: '*This essay will look at some data and see if we can figure out whether
      the policy actually worked.'
    explanation: Swedish academic style favors accessible, informal expression; English
      academic writing expects formal register.
  - correction: The policy failed because its design failed to account for [specific
      factor].
    error: '*The policy didn''t work because the people in charge didn''t think it
      through properly.'
    explanation: Swedish directness may produce overly casual academic prose; English
      expects measured, formal tone with specific evidence.
  description: 'Swedish academic writing tends toward an accessible, egalitarian style
    influenced by Scandinavian cultural values. Swedish writers may use a more conversational
    tone in English academic writing than expected, including contractions and informal
    phrasing. The Swedish tradition of ''folkbildning'' (popular education) values
    making knowledge accessible to all, which can produce essays that lack the formal
    register expected in English academic writing. Swedish writers may also underuse
    hedging where English expects it, producing overly direct claims. McManus (2022):
    Writing interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. Speakers of Scandinavian languages:
    Swedish section. Cambridge University Press.'
