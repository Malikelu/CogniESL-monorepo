      wrong: Jag ar lakare.
    flagged: false
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I'm reading a book
      example_gloss: Different article usage
      example_l1: SWEDISH different article system
      example_wrong: '*I read book / *I read the book'
      explanation: 'Transfer from L1: Omission of indefinite article after vara (to
        be).'
      flagged: true
      frequency: 4
      pattern: Omission of indefinite article after vara (to be)
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: positive_transfer
      example_correct: '''I am a doctor'''
      example_gloss: I am doctor [no article in Swedish with vara + profession]
      example_l1: Jag ar lakare
      example_wrong: '''I am doctor'' (omission after vara for professions)'
      explanation: 'Odlin (Ch.5): Swedish speakers have an advantage in English article
        acquisition because Swedish has obligatory articles like English. Jarvis (1998):
        Swedes almost never omit articles in English reproduction tasks. However,
        Swedish omits articles after vara for professions, causing negative transfer
        in this context.'
      flagged: true
      frequency: 5
      pattern: Swedish-English article cognates facilitate accuracy (Odlin Ch.5)
      persistence: 2
      reliability: B
      tier: 4
    persistence: 3
    source_count: 5
    source_rank: 1
    source_type: textbook
    sources: *id001
    teacher_tips:
      exercises:
      - description: 20 sentences with articles errors.
        duration: 15
        name: articles Audit
        type: error-correction
      - description: Translate 15 sentences focusing on articles.
        duration: 15
        name: articles Translation
        type: translation
      - description: 20 sentences practicing articles.
        duration: 10
        name: articles Practice
        type: fill-in-the-blank
      - description: A paragraph with 10 articles errors.
        duration: 15
        name: articles Error Hunt
        type: error-correction
      how_to_explain: 'Teach: English REQUIRES articles. ''A/an'' for first mention,
        ''the'' for specific.'
      sequencing: 'Week 1: articles. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      where_to_start: Start with the articles pattern.
    tier: 1
    why_it_happens: 'Swedish omits the indefinite article after vara (to be) for professions.
      McManus (2022) explains that L2 speakers can learn new form-meaning mappings
      (like articles) that don''t exist in L1, but this requires extensive practice
      to become automatic. Online anticipatory processing (using articles to predict
      upcoming nouns) develops only with high proficiency and extended exposure, not
      from L1 transfer. McManus (2022) explains that L2 speakers can learn new form-meaning
      mappings that don''t exist in L1, but this requires extensive practice to become
      automatic. L2 learning involves creating new knowledge when L1-L2 differences
      exist AND developing selection mechanisms to manage competing knowledge sources
      (McManus 2022, Ch. 1). Online anticipatory processing develops only with high
      proficiency and extended exposure. Golden et al. (2017): Transfer is non-linear
      — functional fit between L1 and L2 systems matters more than mere formal similarity.
      English (Germanic) learners showed NO advantage over Slavic learners on Norwegian
      spatial prepositions. Gender system transfer is non-linear (L1 gender != automatic
      advantage). Conceptual transfer affects spatial relations, emotion language,
      and article use. Accuracy + text length account for 80% of writing ratings;
      cultural-rhetorical style accounts for the remaining 20%. Golden et al. (2017):
      Even L1s with article systems show non-linear transfer. Having articles helps
      but does not eliminate errors because specific article rules (definite/indefinite/zero)
      vary across languages. Transfer depends on functional fit of article usage rules,
      not just presence of articles in L1. Golden et al. (2017): L1s without grammatical
      gender must build gender assignment from scratch, but compensating strategies
      (e.g., Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
