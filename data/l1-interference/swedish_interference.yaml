- claim: Swedish L1 speakers transfer phonological, grammatical, and writing patterns
    from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Swedish
  tier: 1
  reliability: B
