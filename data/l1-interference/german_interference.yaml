  possessives_advanced:
    interference_patterns:
    - pattern: Use of 'of' for possession (German von)
      example_l1: Ich fuhr mit dem Mann meiner Schwester. (von + dative)
      example_gloss: I went skiing with the husband of my sister.
      example_wrong: I went skiing with the husband of my sister. / The book of John
        is interesting.
      example_correct: I went skiing with my sister's husband. / John's book is interesting.
      explanation: 'Transfer from L1: German has an equivalent of the English possessive
        ''s structure, but it is mostly used with names. In other cases von (= of)
        is generally used.'
