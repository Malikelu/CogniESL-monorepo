  articles_advanced:
    interference_patterns:
    - pattern: Definite article overgeneralization with generic nouns
      example_l1: Die Menschen sind seltsame Tiere.
      example_gloss: The human beings are strange animals.
      example_wrong: The human beings are strange animals. / We all have to live in
        the society.
      example_correct: Human beings are strange animals. / We all have to live in
        society.
      explanation: 'Transfer from L1: In German, the definite article often accompanies
        nouns which are used in a generic sense. English omits the article for generic
        reference.'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Article omission after prepositions (with, without, as)
      example_l1: Ohne Auto kann man nicht dorthin kommen. / Ich sage dir das als
        Freund.
      example_gloss: Without car can one not there get. / I tell you this as friend.
      example_wrong: You can't get there without car. / I am telling you this as friend,
        not as boss.
      example_correct: You can't get there without a car. / I am telling you this
        as a friend, not as a boss.
      explanation: 'Transfer from L1: The indefinite article is often omitted after
        the German equivalents of with, without and as.'
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Capitalization of common nouns
      example_l1: German nouns are written with initial capital letters
      example_gloss: Ich kaufte mein Auto von einem Freund.
      example_wrong: I bought my Car from a Friend.
      example_correct: I bought my car from a friend.
      explanation: 'Transfer from L1: German nouns are written with initial capital
        letters, leading to capitalization of common nouns in English.'
      frequency: 3
      persistence: 2
      communicative_impact: 1
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Comma before subordinate clauses and infinitive complements
      example_l1: Ich denke, dass es einen Fehler gibt. / Ich hoffe, dich bald zu
        sehen.
      example_gloss: I think, that there a mistake is. / I hope, you soon to see.
      example_wrong: I think, that there has been a mistake. / She knew exactly, what
        he meant. / I hope, to see you soon. / He felt the need, to explain everything.
      example_correct: I think that there has been a mistake. / She knew exactly what
        he meant. / I hope to see you soon. / He felt the need to explain everything.
      explanation: 'Transfer from L1: German uses commas before all subordinate clauses
        and infinitive complements. English does not use commas in these positions.'
      frequency: 3
      persistence: 2
      communicative_impact: 1
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'German article usage differs from English in several contexts,
      leading to overgeneralization or omission errors. Golden et al. (2017, Ch. 6)
      found that German learners of Norwegian, despite having a similar three-gender
      system, do NOT show an advantage over learners without L1 gender systems. Perceived
      similarity can mislead learners into thinking there is nothing new to learn,
      producing false confidence. McManus (2022): The L1 is always active during L2
      use cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney
      1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity, entrenchment
      — explain transfer patterns. Weinreich and Lado both focused on crosslinguistic
      similarities/differences; CAH (Contrastive Analysis Hypothesis) was coined by
      Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: English omits articles before school, church, bed, work,
        home (when used in their primary sense).'
      where_to_start: Start with the most common article errors.
      sequencing: 'Week 1: Articles with institutions. Week 2: Articles with abstract
        nouns. Week 3: Review.'
    flagged: false
    tier: 3
    exercises:
    - name: Article Choice
      type: fill-in-the-blank
      description: 20 sentences choosing correct article usage.
      duration: 10
