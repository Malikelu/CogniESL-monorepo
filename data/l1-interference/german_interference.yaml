  negation:
    interference_patterns:
    - pattern: Use of nicht after the verb (no do-support)
      example_l1: Ich rauche nicht.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I smoke not.
      example_wrong: Thank you, I smoke not.
      example_correct: No thank you, I don't smoke.
      explanation: 'Transfer from L1: German negates by placing nicht after the verb.
        English requires do/does/did + not + base verb.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Modal verbs negated without do-support
      example_l1: Du musst das nicht sagen.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: You must that not say.
      example_wrong: You didn't must say that.
      example_correct: You mustn't say that. / You don't have to say that.
      explanation: 'Transfer from L1: German negates modal verbs in the same way as
        other verbs (placing nicht after). English uses modal + not (mustn''t, can''t).'
      etiology: interlingual
      flagged: true
