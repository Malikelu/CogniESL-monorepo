  conditionals:
    interference_patterns:
    - pattern: Use of would (würde) in both clauses of conditional
      example_l1: Wenn er mich fragen würde, würde ich ihm nichts sagen.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: If he me ask would, would I him nothing say.
      example_wrong: If he would ask me, I wouldn't tell him anything.
      example_correct: If he asked me, I wouldn't tell him anything.
      explanation: 'Transfer from L1: In spoken German conditional sentences, the
        auxiliary würde (roughly = would) may be used in both clauses. English never
        uses would in the if-clause.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of past subjunctive (one-word form) instead of conditional
      example_l1: Wenn sie mehr Zeit hätte, käme sie öfter. / Wenn ich das gewusst
        hätte, hätte ich es dir gesagt.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: If she more time had, came she more often. / If I that known
        had, had I it you told.
      example_wrong: If she had more time, she came more often. / If I had known,
        I had told you. / Tuesday were better for the meeting.
      example_correct: If she had more time, she would come more often. / If I had
        known, I would have told you. / Tuesday would be better for the meeting.
      explanation: 'Transfer from L1: German may use the past subjunctive (one-word
        form) instead of the conditional. Since German subjunctives often resemble
        English past tenses (käme/came, wäre/wäre, hätte/had), confusion is especially
        likely.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Conditional inversion (Had I known...) overgeneralized
      example_l1: Hätte ich das gewusst, hätte ich es dir gesagt.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Had I that known, had I it you told.
      example_wrong: Were I in charge, I had changed the times.
      example_correct: If I were in charge, I would change the times.
      explanation: 'Transfer from L1: Conditional meanings are expressed by inversion
        more freely in German than in English.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of so before main clause in conditionals
      example_l1: Wenn er um sechs käme, so könnten wir früher essen.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: If he at six came, so could we earlier eat.
      example_wrong: If he would come at six, so could we eat earlier.
      example_correct: If he came at six, we could eat earlier.
      explanation: 'Transfer from L1: German so is often used before the main clause
        in conditional sentences. English does not use so in this way.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
