      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I boil water.
      example_wrong: I cook water.
      example_correct: I boil water.
      explanation: 'Transfer from L1: German kochen = boil or cook. English distinguishes
        boil from cook.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: weil = because (not while)'
      example_l1: Ich bleibe, weil es regnet.
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_gloss: I stay, because it rains.
      example_wrong: I stay while it rains. (when meaning because)
      example_correct: I stay because it rains.
      explanation: 'Transfer from L1: German weil = because, not while. German während
        = while/during.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: glücklich = happy (not just lucky)'
      example_l1: Ich bin glücklich.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I am happy/lucky.
      example_wrong: I am lucky. (when meaning happy)
      example_correct: I am happy.
      explanation: 'Transfer from L1: German glücklich = happy or lucky. English distinguishes
        these.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: danke = no thank you (not just thank you)'
      example_l1: Möchten Sie Kaffee? - Nein, danke.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Would you like coffee? - No, thanks.
      example_wrong: (offering) Coffee? - Thank you. (meaning No, thank you)
      example_correct: (offering) Coffee? - No, thank you.
      explanation: 'Transfer from L1: German danke can mean No, thank you when declining
        an offer. This leads to misuse of Thank you in English.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: wenn = if/whenever (not when)'
      example_l1: Wenn es regnet, bleibe ich zu Hause.
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_gloss: If/when it rains, I stay at home.
      example_wrong: When it rains, I stay at home. (meaning If it rains)
      example_correct: If it rains, I stay at home.
      explanation: 'Transfer from L1: German wenn = if or whenever, not only when.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: kommen = come or go (not just come)'
      example_l1: Ich komme nach Hause. / Kommst du mit?
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I come home. / Come you along?
      example_wrong: I go home. (when kommen is used for movement toward speaker)
      example_correct: I am coming home.
      explanation: 'Transfer from L1: German kommen = come or go according to context.
        English distinguishes come (toward speaker) from go (away from speaker).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: bringen = bring or take (not just bring)'
      example_l1: Ich bringe das Buch.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I bring/take the book.
      example_wrong: I take the book. (when bringen is used for movement toward speaker)
      example_correct: I will bring the book.
      explanation: 'Transfer from L1: German bringen = bring or take according to
        context.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'False friend: gehen = go or walk (not just go)'
      example_l1: Ich gehe nach Hause.
      frequency: 2
      persistence: 2
      communicative_impact: 2
      example_gloss: I go/walk home.
      example_wrong: I walk home. (when gehen is used for general movement)
      example_correct: I am going home.
      explanation: 'Transfer from L1: German gehen = go or walk according to context.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I become a letter.
      correct: I get a letter.
    why_it_happens: 'German and English share cognates with shifted meanings. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: Create a list of common german-EN false friends.
      where_to_start: Start with the false friends pattern.
      sequencing: 'Week 1: false friends. Week 2: Practice. Week 3: Review. Week 4:
        Mixed.'
      exercises:
      - name: false_friends Audit
        type: error-correction
        description: 20 sentences with false friends errors.
        duration: 15
      - name: false_friends Translation
        type: translation
        description: Translate 15 sentences focusing on false friends.
        duration: 15
      - name: false_friends Practice
        type: fill-in-the-blank
        description: 20 sentences practicing false friends.
        duration: 10
      - name: false_friends Error Hunt
        type: error-correction
        description: A paragraph with 10 false friends errors.
        duration: 15
