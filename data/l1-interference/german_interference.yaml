  linking_words:
    interference_patterns:
    - pattern: Use of 'as' for 'like' (similarity)
      example_l1: Du siehst aus wie deine Schwester.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: You look out as your sister.
      example_wrong: You look as your sister.
      example_correct: You look like your sister.
      explanation: 'Transfer from L1: German has the same word (wie) for as and like
        (referring to similarity).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of 'in case' to mean 'if'
      example_l1: German falls = in case / if
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_gloss: German falls means in case or if
      example_wrong: Phone me in case you can't come.
      example_correct: Phone me if you can't come.
      explanation: 'Transfer from L1: The German word falls (literally in case) is
        used to mean if in certain contexts. This can lead to uses of in case which
        are not correct in British English.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: You look as your sister.
      correct: You look like your sister.
    why_it_happens: 'German discourse connectors differ from German. German ''aber''
      functions as both ''but'' and ''however.'' Learners may produce non-standard
      English sentences because the L1 discourse conventions transfer directly. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: ''However'' for formal writing. ''But'' for informal.'
      where_to_start: Start with the linking words pattern.
      sequencing: 'Week 1: linking words. Week 2: Practice. Week 3: Review. Week 4:
        Mixed.'
      exercises:
      - name: linking_words Audit
        type: error-correction
        description: 20 sentences with linking words errors.
        duration: 15
      - name: linking_words Translation
        type: translation
        description: Translate 15 sentences focusing on linking words.
        duration: 15
      - name: linking_words Practice
        type: fill-in-the-blank
        description: 20 sentences practicing linking words.
        duration: 10
      - name: linking_words Error Hunt
        type: error-correction
        description: A paragraph with 10 linking words errors.
        duration: 15
