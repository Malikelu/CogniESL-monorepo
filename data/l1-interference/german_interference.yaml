  gerund_infinitive:
    interference_patterns:
    - pattern: Confusion of gerund and infinitive (no English-like gerund in German)
      example_l1: Lachen = to laugh / laughing / laugh (all one form in German)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: German has no equivalent of the English noun-like use of -ing
      example_wrong: Instead of fight / to fight, they decided on talking / to talk.
        / I want start / starting work at once. / I came here with the hope to find
        a job. / I really must stop to smoke.
      example_correct: Instead of fighting, they decided to talk. / I want to start
        work at once. / I came here with the hope of finding a job. / I really must
        stop smoking.
      explanation: 'Transfer from L1: German has no equivalent of the English noun-like
        use of the -ing form (gerund). German Lachen can correspond to English to
        laugh, laughing, or the bare infinitive laugh. These are all therefore often
        confused.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of dass-clause instead of object + infinitive
      example_l1: Ich wollte, dass sie zu mir nach Hause kommt.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: I wanted, that she to me home comes.
      example_wrong: I wanted, that she came to my house.
      example_correct: I wanted her to come to my house.
      explanation: 'Transfer from L1: German uses a dass (that) clause where English
        uses object + infinitive.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I really must stop to smoke.
      correct: I really must stop smoking.
    why_it_happens: 'German uses infinitive after prepositions. English uses gerund.
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: After prepositions -> always gerund (-ing).'
      where_to_start: Start with the gerund infinitive pattern.
      sequencing: 'Week 1: gerund infinitive. Week 2: Practice. Week 3: Review. Week
        4: Mixed.'
