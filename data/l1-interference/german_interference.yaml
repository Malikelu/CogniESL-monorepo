  relative_clauses:
    interference_patterns:
    - pattern: Use of 'what' as relative pronoun
      example_l1: Das einzige, was er tun konnte... / Alles, was wir wollen... / Sein
        Angebot wurde abgelehnt, was ihn überraschte.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: The only, what he do could... / All, what we want... / His offer
        was rejected, what him surprised.
      example_wrong: The only thing what he could do... / All what we want... / His
        offer was rejected, what took him by surprise.
      example_correct: The only thing (that) he could do... / All (that) we want...
        / His offer was rejected, which took him by surprise.
      explanation: 'Transfer from L1: German was corresponds not only to what, but
        also to that (in certain cases) and to which when the antecedent is a clause.
        This leads to misuse of what in English.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of 'which' for people (no who/which distinction in German)
      example_l1: Die Leute, die dich heute Morgen besucht haben...
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: The people, which you this morning visited have...
      example_wrong: I know the people which came to see you this morning.
      example_correct: I know the people who came to see you this morning.
      explanation: 'Transfer from L1: German does not distinguish relative who and
        which. German die/das covers both.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Comma before restrictive relative clause (no restrictive/non-restrictive
        distinction)
      example_l1: German does not distinguish restrictive and non-restrictive relative
        clauses
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: German uses the same structure for both types
      example_wrong: Her mother, that lives in Paris... / My uncle, you met yesterday...
      example_correct: Her mother who lives in Paris... / My uncle (that) you met
        yesterday...
      explanation: 'Transfer from L1: Since there is no grammatical distinction in
        German between restrictive and non-restrictive relative clauses, beginners
        may not understand why structures with commas are ungrammatical.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Overuse of explicit object relative pronouns
      example_l1: German cannot drop object relative pronouns
      frequency: 2
      persistence: 2
      communicative_impact: 1
      example_gloss: German requires an explicit relative pronoun in object position
      example_wrong: the girl whom I am going to marry (overly formal)
      example_correct: the girl (that) I am going to marry / the girl I am going to
        marry
      explanation: 'Transfer from L1: German cannot drop object relative pronouns,
        so students tend to overuse explicit relative pronouns (whom) where English
        allows omission.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: The only thing what he could do...
      correct: The only thing (that) he could do...
