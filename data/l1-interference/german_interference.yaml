  questions:
    interference_patterns:
    - pattern: Subject-verb inversion without do-support
      example_l1: Wann hast du angefangen, Klavier zu spielen?
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: When started you to play the piano?
      example_wrong: When started you to play the piano?
      example_correct: When did you start to play the piano?
      explanation: 'Transfer from L1: German forms questions by simple inversion (no
        do-support). English requires do/does/did for most questions.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of nicht (not) after the verb for negation
      example_l1: Ich rauche nicht.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I smoke not.
      example_wrong: Thank you, I smoke not.
      example_correct: No thank you, I don't smoke.
      explanation: 'Transfer from L1: German negates by placing nicht after the verb.
        English requires do-support + not before the main verb.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of invariant tag no? / yes? instead of English question tags
      example_l1: Es wird spät, nicht wahr?
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: It's getting late, not true?
      example_wrong: It's getting late, no?
      example_correct: It's getting late, isn't it?
      explanation: 'Transfer from L1: German uses invariant tags (nicht wahr?, nicht?)
        for tag questions. English uses auxiliary-based question tags that agree with
        the main clause.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: When started you to play the piano?
      correct: When did you start to play the piano?
    why_it_happens: 'German forms questions with simple inversion (no do-support).
      English requires do-support. McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: Do/Does/Did + subject + base verb?'
      where_to_start: Start with the questions pattern.
      sequencing: 'Week 1: questions. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: questions Audit
        type: error-correction
        description: 20 sentences with questions errors.
        duration: 15
      - name: questions Translation
        type: translation
        description: Translate 15 sentences focusing on questions.
        duration: 15
      - name: questions Practice
        type: fill-in-the-blank
        description: 20 sentences practicing questions.
        duration: 10
      - name: questions Error Hunt
        type: error-correction
        description: A paragraph with 10 questions errors.
        duration: 15
