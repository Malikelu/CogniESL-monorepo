  conditionals_advanced:
    interference_patterns:
    - pattern: Use of would in if-clause
      example_l1: Wenn er mich fragen würde, würde ich ihm nichts sagen.
      example_gloss: If he me ask would, would I him nothing say.
      example_wrong: If I would have time, I would go. / If I would have known, I
        would have told you.
      example_correct: If I had time, I would go. / If I had known, I would have told
        you.
      explanation: 'Transfer from L1: In spoken German conditional sentences, the
        auxiliary würde (roughly = would) may be used in both clauses. English never
        uses ''would'' in the if-clause.'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Past subjunctive used instead of conditional (one-word forms)
      example_l1: Wenn sie mehr Zeit hätte, käme sie öfter.
      example_gloss: If she more time had-subjunctive, came-subjunctive she more often.
      example_wrong: If she had more time, she came more often. / Tuesday were better
        for the meeting.
      example_correct: If she had more time, she would come more often. / Tuesday
        would be better for the meeting.
      explanation: 'Transfer from L1: German may use the past subjunctive (one-word
        form) instead of the conditional. Since German subjunctives often resemble
        English past tenses (käme/came, wäre/were, hätte/had), confusion is especially
        likely.'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Conditional inversion overgeneralized
      example_l1: Wäre ich verantwortlich, hätte ich die Zeiten geändert.
      example_gloss: Were I responsible, had I the times changed.
      example_wrong: Were I in charge, I had changed the times.
      example_correct: If I were in charge, I would change the times.
      explanation: 'Transfer from L1: Conditional meanings are expressed by inversion
        more freely in German than in English.'
      frequency: 3
      persistence: 3
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of so before main clause in conditionals
      example_l1: Wenn er um sechs käme, so könnten wir früher essen.
      example_gloss: If he at six came, so could we earlier eat.
      example_wrong: If he would come at six, so could we eat earlier.
      example_correct: If he came at six, we could eat earlier.
      explanation: 'Transfer from L1: German so is often used before the main clause
        in conditional sentences.'
      frequency: 2
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'German conditional structures may allow conditional forms in
      both clauses. English strictly avoids ''would'' in if-clauses. McManus (2022):
      The L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: NO WOULD IN IF-CLAUSE. If + past, would + base. If +
        present, will + base.'
      where_to_start: Start with second conditional. Then teach first conditional.
