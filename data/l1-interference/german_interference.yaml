    interference_patterns:
    - pattern: Transfer of german prepositions
      example_l1: nach = to/after/according to; von = of/from/by; zu = to/at; an =
        at/on; vor = before/ago; mit = with; während = during/while; bei = at/by/near
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: German prepositions have multiple English equivalents
      example_wrong: I've known her since three years. / Can I have a piece from that
        cake? / a symphony from Beethoven / at Monday / on a party / The bus stop
        is before our house. / I arrived before ten minutes. / I spent the evening
        by John and Alice.
