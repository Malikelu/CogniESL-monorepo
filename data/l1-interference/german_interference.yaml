      correct: I bought it three years ago.
    - wrong: She was walking the road along.
      correct: She was walking along the road.
    - wrong: difficulty with "That's the woman I was talking about" or "Who did you
        buy that for?"
      correct: That's the woman I was talking about.
    - wrong: The in Britain with unusual excitement awaited budget...
      correct: The budget, awaited with unusual excitement in Britain...
