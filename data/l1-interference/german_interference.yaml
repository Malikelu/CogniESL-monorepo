  tense_aspect_advanced:
    interference_patterns:
    - pattern: Present perfect vs simple past confusion (German present perfect as
        conversational past)
      example_l1: Ich habe Mary gestern gesehen.
      example_gloss: I have Mary yesterday seen.
      example_wrong: I have seen Mary yesterday.
      example_correct: I saw Mary yesterday.
      explanation: 'Transfer from L1: The German form which resembles the present
        perfect is not used in exactly the same way — it often functions just as a
        conversational past tense. German speakers use present perfect with specific
        past time markers where English requires simple past.'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Simple past where English requires present perfect
      example_l1: Das deutsche Gefängnissystem hat sich in den letzten Jahren stark
        verbessert. (German uses simple past)
      example_gloss: The German prison system improved a lot in recent years.
      example_wrong: The German prison system improved a lot in recent years.
      example_correct: The German prison system has improved a lot in recent years.
      explanation: 'Transfer from L1: Conversely, the German past may be used where
        we would use a present perfect (for recent/relevant-to-present events).'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Lack of progressive forms in German
      example_l1: Was schaust du an? / Ich bin spät dran. Haben du lange gewartet?
      example_gloss: What look you at? / I am late. Have you long waited?
      example_wrong: What do you look at? / I'm sorry I'm late. Have you waited long?
      example_correct: What are you looking at? / I'm sorry I'm late. Have you been
        waiting long?
      explanation: 'Transfer from L1: German has no progressive forms. German speakers
        use simple present where English uses present progressive, and simple present
        perfect where English uses present perfect progressive.'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Present tense for how long (duration of present state)
      example_l1: Wie lange bist du in Deutschland? / Ich kenne sie seit wir Kinder
        waren.
      example_gloss: How long are you in Germany? / I know her since we children were.
      example_wrong: How long are you in Germany? / I know her since we were children.
      example_correct: How long have you been in Germany? / I have known her since
        we were children.
      explanation: 'Transfer from L1: To say how long a present state of affairs has
        been going on, German often uses a present tense where English uses a present
        perfect.'
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Present tense for future reference
      example_l1: Ich verspreche, ich bringe es morgen zurück.
      example_gloss: I promise, I bring it tomorrow back.
      example_wrong: I promise I bring it back tomorrow.
      example_correct: I promise I will bring it back tomorrow. / I promise to bring
        it back tomorrow.
      explanation: 'Transfer from L1: German uses the present tense extensively to
        refer to the future. English requires will or going to for future reference.'
      frequency: 3
      persistence: 3
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Perfect with sein (= be) for change-of-state verbs
      example_l1: Sie ist ausgegangen.
      example_gloss: She is gone out.
      example_wrong: She is gone out.
      example_correct: She has gone out. / She went out.
      explanation: 'Transfer from L1: German forms perfect tenses with sein (= be)
        for some intransitive verbs referring to change of state. English always uses
        have.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Confusion of had with German hat/hatte
      example_l1: Hat Andrew schon telefoniert? (German hat = has)
      example_gloss: Has Andrew already telephoned?
      example_wrong: Do you know if Andrew had telephoned yet?
      example_correct: Do you know if Andrew has telephoned yet?
      explanation: 'Transfer from L1: Because of the similarity of form, English had
        is often misused as an equivalent of German hat (= has) or hatte (which can
        mean would have).'
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'German tense-aspect system differs from English. Specific past
      time markers require simple past in English. Golden et al. (2017, Ch. 3, citing
      Karrer 1999) found that German learners of Norwegian produce inappropriate present
      perfect uses in preterite contexts because German Perfekt has expanded into
      preterite territory, and learners transfer this distribution. The Norwegian
      perfect cannot be used with definite time reference, but German perfect can.
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921).
      Post-behaviorist constructs — activation, automaticity, entrenchment — explain
      transfer patterns. Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: yesterday/last week/in 2010 -> Simple Past. ever/never/already/yet
        -> Present Perfect.'
      where_to_start: Start with simple past. Then teach present perfect. Then contrast.
      sequencing: 'Week 1: Simple past. Week 2: Present perfect. Week 3: Contrast.
        Week 4: Review.'
