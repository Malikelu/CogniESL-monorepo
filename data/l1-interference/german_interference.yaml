  phonology:
    interference_patterns:
    - pattern: Confusion of /v/ and /w/ (German has one phoneme in this area)
      example_l1: German /w/ sounds like English /v/
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: German w [labiodental approximant] overlaps English /v/ and /w/
      example_wrong: vine for wine (or less often wine for vine)
      example_correct: wine /waɪn/ vs vine /vaɪn/
      explanation: 'Transfer from L1: German has only one phoneme in the area of /v/
        and /w/. German /w/ is a labiodental approximant, causing confusion between
        English /v/ and /w/.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Devoicing of final voiced consonants (/z/, /v/, /b/, /d/, /g/)
      example_l1: Final devoicing is obligatory in German
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: German Tag /tak/, Rad /raːt/, Dieb /diːp/
      example_wrong: rice for rise; leaf for leave; pup for pub; set for said; dock
        for dog; etch for edge; beish for beige
      example_correct: rise /raɪz/; leave /liːv/; pub /pʌb/; said /sed/; dog /dɒɡ/;
        edge /eʤ/; beige /beɪʒ/
      explanation: 'Transfer from L1: Voiced obstruents (/z/, /v/, /b/, /d/, /g/)
        do not occur at the ends of words in German. German speakers devoice them
        in English final position.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Substitution of /s/ and /z/ for /θ/ and /ð/
      example_l1: German lacks dental fricatives /θ/ and /ð/
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: German speakers substitute /s/ for /θ/ and /z/ for /ð/
      example_wrong: useful for youthful; wizard for withered
      example_correct: youthful /ˈjuːθfʊl/; withered /ˈwɪðəd/
      explanation: 'Transfer from L1: /θ/ and /ð/ do not occur in German. Students
        replace them with /s/ and /z/.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Substitution of /ʃ/ and /tʃ/ for /ʒ/ and /dʒ/
      example_l1: /ʒ/ and /dʒ/ are rare in German
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: German speakers often realise them as /ʃ/ and /tʃ/
      example_wrong: mesher for measure; chain for Jane
      example_correct: measure /ˈmeʒə/; Jane /dʒeɪn/
      explanation: 'Transfer from L1: /ʒ/ and /dʒ/ are rare in German. German speakers
        often realise them as /ʃ/ and /tʃ/.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Confusion of /e/ and /æ/ (set vs sat)
      example_l1: German /e/ covers both English /e/ and /æ/
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: German does not distinguish /e/ and /æ/
      example_wrong: set pronounced like sat; sat pronounced like set
      example_correct: set /set/ vs sat /sæt/
      explanation: 'Transfer from L1: /e/ and /æ/ are often confused because German
        does not have the /æ/ phoneme.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Confusion of /ɔː/ and /əʊ/ (caught vs coat)
      example_l1: German /o/ covers both English /ɔː/ and /əʊ/
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Both may be pronounced as a close pure vowel /oː/
      example_wrong: caught pronounced like coat; coat pronounced like caught
      example_correct: caught /kɔːt/ vs coat /kəʊt/
      explanation: 'Transfer from L1: /ɔː/ and /əʊ/ are often confused. Both may be
        pronounced as a close pure vowel /oː/.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of glottal stops before initial vowels (juncture)
      example_l1: German uses glottal stops before vowel-initial words
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: in 7and 7out (German aus 7und 7ein)
      example_wrong: in-and-out with glottal breaks (staccato effect)
      example_correct: in-and-out smoothly linked
      explanation: 'Transfer from L1: A German word or syllable beginning with a vowel
        is often separated from what comes before by a glottal stop, creating a staccato
        effect.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Over-strong stress on weak forms (and, but, than, as, have, were)
      example_l1: German has few weak forms
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: German speakers may overstress function words
      example_wrong: and /ænd/ (strong form) in connected speech where /ən/ or /n/
        is expected
      example_correct: and /ən/ in connected speech
      explanation: 'Transfer from L1: German has few weak forms, so German speakers
        may overstress words like and, but, than, as, have, were, giving them their
        strong (written) pronunciations in all contexts.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Energetic articulation and different intonation (sounds peremptory)
      example_l1: German has more energetic articulation than English
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_gloss: Tenser vowels, more explosive stops, glottal stops
      example_wrong: Rising intonation in wh- questions (sounds hectoring)
      example_correct: Falling intonation in wh- questions
      explanation: 'Transfer from L1: More energetic articulation, tenser vowels,
        more explosive stops, and different intonation patterns can make German speakers
        sound peremptory in English. Wh- questions may have rising intonation that
        sounds hectoring.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: '"Dark" /l/ replaced by "clear" /l/'
      example_l1: '"Dark" /l/ does not exist in standard German'
      frequency: 3
      persistence: 3
      communicative_impact: 1
      example_gloss: German speakers may replace dark /l/ with clear /l/
      example_wrong: fill /fɪl/ with clear /l/; full /fʊl/ with clear /l/
      example_correct: fill /fɪɫ/ with dark /l/; full /fʊɫ/ with dark /l/
      explanation: 'Transfer from L1: ''Dark'' /l/ (as in fill, full) does not exist
        in standard German. Students may replace it with ''clear'' /l/ (as in light).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: vine for wine
      correct: wine /waɪn/
    why_it_happens: 'German /w/ sounds like English /v/, and German /v/ sounds like
      English /w/. This causes confusion. McManus (2022): The L1 is always active
      during L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: /v/ vs /w/, /θ/ vs /t/.'
      where_to_start: Start with the phonology pattern.
      sequencing: 'Week 1: phonology. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: phonology Audit
        type: error-correction
        description: 20 sentences with phonology errors.
        duration: 15
      - name: phonology Translation
        type: translation
        description: Translate 15 sentences focusing on phonology.
        duration: 15
      - name: phonology Practice
        type: fill-in-the-blank
        description: 20 sentences practicing phonology.
        duration: 10
      - name: phonology Error Hunt
        type: error-correction
        description: A paragraph with 10 phonology errors.
        duration: 15
