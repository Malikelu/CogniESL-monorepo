  modal_verbs:
    interference_patterns:
    - pattern: Use of can with languages (Ich kann Russisch)
      example_l1: Ich kann Russisch.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I can Russian.
      example_wrong: I can Russian.
      example_correct: I can speak Russian. / I speak Russian.
      explanation: 'Transfer from L1: German Ich kann (= I can) can be used with the
        name of a language to mean I can speak. English requires the verb speak.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of must for past obligation (Ich musste)
      example_l1: Gestern musste ich nach London fahren.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Yesterday musted I to London go.
      example_wrong: Yesterday I must go to London.
      example_correct: Yesterday I had to go to London.
      explanation: 'Transfer from L1: English must looks like the German past tense
        musste (= had to). German speakers may use must for past obligation.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of must be instead of must have been
      example_l1: Das muss interessant sein.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: That must interesting be.
      example_wrong: Did you? That must be interesting.
      example_correct: Did you? That must have been interesting.
      explanation: 'Transfer from L1: Must be may be used instead of must have been
        when referring to past events.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Confusion of muss nicht (don't have to) with must not
      example_l1: Ich muss nicht zeigen...
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I must not show...
      example_wrong: I mustn't show my passport as my identity card is enough.
      example_correct: I don't have to show my passport as my identity card is enough.
      explanation: 'Transfer from L1: German muss nicht = don''t have to or needn''t.
        It is not the same as must not (= prohibition).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of will to mean want (German wollen)
      example_l1: Sie weiß nicht, was sie will.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: She knows not, what she wants.
      example_wrong: She doesn't know what she will.
      example_correct: She doesn't know what she wants.
      explanation: 'Transfer from L1: German will means want(s), not will. This can
        lead to confusion between would and wanted (German wollte).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of shall for soll (is supposed to)
      example_l1: Er soll ein brillanter Musiker sein.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: He shall a brilliant musician be.
      example_wrong: He shall be a brilliant musician. (meaning He is supposed to
        be...)
      example_correct: He is supposed to be a brilliant musician.
      explanation: 'Transfer from L1: German soll (= is supposed to, is to, should)
        is sometimes mistranslated as shall, and sollte (= was supposed to) as should.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Modal verbs with do-support in questions/negatives
      example_l1: Kannst du schwimmen? / Du musst das nicht sagen.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Can you swim? / You must that not say.
      example_wrong: Do you can swim? / You didn't must say that.
      example_correct: Can you swim? / You mustn't say that.
      explanation: 'Transfer from L1: German modals form questions and negatives in
        the same way as other verbs (by inversion). This can lead to English modals
        being treated the same way (using do-support).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: I can Russian.
      correct: I can speak Russian.
    why_it_happens: 'German modals cover multiple English modals. McManus (2022):
      The L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach modal hierarchy: can, may, could, should, must.'
      where_to_start: Start with the modal verbs pattern.
      sequencing: 'Week 1: modal verbs. Week 2: Practice. Week 3: Review. Week 4:
        Mixed.'
      exercises:
      - name: modal_verbs Audit
        type: error-correction
        description: 20 sentences with modal verbs errors.
        duration: 15
      - name: modal_verbs Translation
        type: translation
        description: Translate 15 sentences focusing on modal verbs.
        duration: 15
      - name: modal_verbs Practice
        type: fill-in-the-blank
        description: 20 sentences practicing modal verbs.
        duration: 10
      - name: modal_verbs Error Hunt
        type: error-correction
        description: A paragraph with 10 modal verbs errors.
        duration: 15
