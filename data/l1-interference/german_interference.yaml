  adverbs:
    interference_patterns:
    - pattern: Adjective used as adverb (no -ly distinction in German)
      example_l1: gut = good/well; schrecklich = terrible/terribly
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: German adverb of manner is usually identical to the uninflected
        adjective
      example_wrong: She can drive very good. / He is very good-educated. / I was
        terrible impressed.
      example_correct: She can drive very well. / He is very well-educated. / I was
        terribly impressed.
      explanation: 'Transfer from L1: A German adverb of manner is usually identical
        in form with the uninflected adjective (gut = good/well; schrecklich = terrible/terribly).
        English requires -ly for most adverbs.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Dropping noun after adjective (understood noun)
      example_l1: Das Wichtigste ist, es allen sofort zu sagen.
      frequency: 2
      persistence: 2
      communicative_impact: 2
      example_gloss: The most important is, it everybody at once to say.
      example_wrong: The most important is, to tell everybody at once.
      example_correct: The most important thing is to tell everybody at once.
      explanation: 'Transfer from L1: A German noun may sometimes be dropped if it
        can be understood after an adjective. English requires the noun.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: She can drive very good.
      correct: She can drive very well.
