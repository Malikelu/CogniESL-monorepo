  word_order:
    interference_patterns:
    - pattern: V2 word order transfer (verb-second in main clauses)
      example_l1: Am Dienstag haben wir frei.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: On Tuesday have we free.
      example_wrong: On Tuesday have we a holiday.
      example_correct: On Tuesday we have a holiday.
      explanation: 'Transfer from L1: German is V2 (verb-second) in main clauses.
        If the subject is preceded by anything other than a conjunction, subject and
        verb invert. English is SVO.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Verb-final order in subordinate clauses
      example_l1: Ich fragte, ob meine Mutter Englisch spricht.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I asked, whether my mother English speaks.
      example_wrong: Did I tell you, that my mother English speaks?
      example_correct: Did I tell you that my mother speaks English?
      explanation: 'Transfer from L1: German places main verbs at the ends of subordinate
        clauses. English keeps SVO order in all clauses.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Infinitive and past participle at end of clause
      example_l1: Ich muss sofort meine Schwester anrufen.
      frequency: 4
      persistence: 2
      communicative_impact: 3
      example_gloss: I must at once my sister telephone.
      example_wrong: I must at once my sister telephone.
      example_correct: I must telephone my sister at once.
      explanation: 'Transfer from L1: German places infinitives and past participles
        at the ends of clauses. English keeps the verb phrase together.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Adverb separating verb from object
      example_l1: Du sprichst sehr gut Deutsch.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: You speak very well German.
      example_wrong: You speak very well German.
      example_correct: You speak German very well.
      explanation: 'Transfer from L1: German adverbs may separate a verb from its
        object. English keeps the object directly after the verb.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Sentence-initial direct object triggering inversion
      example_l1: Dieses Auto habe ich sehr gekauft.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: This car have I very cheap bought.
      example_wrong: This car have I very cheap bought.
      example_correct: I bought this car very cheaply.
      explanation: 'Transfer from L1: German allows a sentence to begin with the direct
        object, triggering subject-verb inversion. English does not.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: German uses word-order shifts + intensifiers where English uses clefts
        (Odlin Ch.6)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_l1: Es war nicht er, dem Duft folgte, sondern der Duft, ihn gefangen
        hatte
      example_gloss: It was not he, the scent followed, rather the scent, him captured
        had
      example_wrong: '''That this book caters to students shows the glossary...''
        (OVS from German focus)'
      example_correct: '''The glossary at the end of each chapter shows that this
        book caters to students.'''
      explanation: 'Odlin (Ch.6): German also uses word-order shifts and focus particles
        (gerade) where English uses clefts. Doherty (1999, 2001): translators cannot
        rely on formal similarities. A German postgraduate student produced OVS in
        English reflecting German focus patterns. Three formal types of focus constructions
        show crosslinguistic influence: (a) clefting, (b) word-order shifts, (c) focus
        particles.'
      etiology: pragmatic_transfer
      flagged: true
      tier: 4
      reliability: B
    examples:
    - wrong: On Tuesday have we a holiday.
      correct: On Tuesday we have a holiday.
    why_it_happens: 'German is V2 (verb-second) in main clauses and verb-final in
      subordinate clauses. English is SVO. Golden et al. (2017, Ch. 7) found that
      English-speaking learners of Norwegian — NOT German speakers — show an advantage
      with preposition stranding constructions. Norwegian stranding differs from both
      English and German, and only English speakers show target-like performance in
      stranding contexts that are congruent with English. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation.'
    teacher_tips:
      how_to_explain: 'Teach: English is ALWAYS Subject-Verb-Object.'
      where_to_start: Start with the word order pattern.
      sequencing: 'Week 1: word order. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: word_order Audit
        type: error-correction
        description: 20 sentences with word order errors.
        duration: 15
      - name: word_order Translation
        type: translation
        description: Translate 15 sentences focusing on word order.
        duration: 15
      - name: word_order Practice
        type: fill-in-the-blank
        description: 20 sentences practicing word order.
        duration: 10
      - name: word_order Error Hunt
        type: error-correction
        description: A paragraph with 10 word order errors.
        duration: 15
