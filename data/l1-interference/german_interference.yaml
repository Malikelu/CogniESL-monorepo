citations:
- claim: German L1 speakers transfer phonological, grammatical, and writing patterns
    from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. German
  tier: 1
  reliability: B
  flagged: false
- claim: German is a Germanic language with case system, verb-second word order, grammatical
    gender, and different article usage — close cognate relation but systematic structural
    differences from English
  source: Singleton (2016) Crosslinguistic Influence in Second Language Acquisition.
    Multilingual Matters.
  tier: 1
  reliability: B
  flagged: false
- claim: German L1 speakers' errors in English include word order transfer (German
    SOV/SVOV patterns), article overuse, and preposition calques. James's error typology
    classifies these as interlingual errors from a related Germanic L1, noting that
    cognate structures produce subtle rather than gross transfer errors.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register comparison shows that German L1 speakers' word order transfer
    errors in English differ by modality. German V2 rule interference is more visible
    in formal written registers where complex sentence structures trigger V2 patterns,
    while spoken English is more forgiving of word order variation.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5: Description of
    register categories'
  tier: 2
