  prepositions_advanced:
    interference_patterns:
    - pattern: Preposition transfer in verb phrases
      example_l1: sich erinnern an = remind; typisch für = typical for; voll mit =
        full with
      example_gloss: German uses different prepositions than English with certain
        verbs/adjectives
      example_wrong: I listen music. / dressed with a dark suit. / You remind me at
        your father. / That's typical for him. / full with water.
      example_correct: I listen to music. / dressed in a dark suit. / You remind me
        of your father. / That's typical of him. / full of water.
      explanation: 'Transfer from L1: German uses different prepositions than English,
        or omits prepositions where English requires them.'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Nach = according to (not just after)
      example_l1: Nach meinem Lehrer ist das richtig.
      example_gloss: After/according to my teacher is that correct.
      example_wrong: After my teacher, this is correct.
      example_correct: According to my teacher, this is correct.
      explanation: 'Transfer from L1: German nach (= after) can also mean according
        to.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Seit = for (not just since)
      example_l1: Ich kenne sie seit drei Jahren.
      example_gloss: I know her since/for three years.
      example_wrong: I've known her since three years.
      example_correct: I've known her for three years.
      explanation: 'Transfer from L1: German seit can mean since or for. English distinguishes
        since (point in time) from for (duration).'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Von = by (authorship)
      example_l1: ein Foto von meiner Mutter / eine Symphonie von Beethoven
      example_gloss: a photo from/by my mother / a symphony from/by Beethoven
      example_wrong: a photo from my mother / a symphony from Beethoven
      example_correct: a photo by my mother / a symphony by Beethoven
      explanation: 'Transfer from L1: German von = of or from, also by when talking
        about authorship.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: An = on (days)
      example_l1: am Montag
      example_gloss: on Monday
      example_wrong: at Monday
      example_correct: on Monday
      explanation: 'Transfer from L1: German an (= at/on) is used with days of the
        week. English uses on for days.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Vor = ago (not just before)
      example_l1: vor zehn Minuten / vor zehn Jahren
      example_gloss: before/ago ten minutes / before/ago ten years
      example_wrong: I arrived before ten minutes. / I married for ten years. (meaning
        I got married ten years ago)
      example_correct: I arrived ten minutes ago. / I got married ten years ago.
      explanation: 'Transfer from L1: German vor = before or in front of, also ago.
        English distinguishes these.'
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Mit = with (ages)
      example_l1: Mit 16 kann man Motorrad fahren.
      example_gloss: With 16 can one motorbike drive.
      example_wrong: With 16 you can ride a motorbike.
      example_correct: At 16 you can ride a motorbike. / When you are 16, you can
        ride a motorbike.
      explanation: 'Transfer from L1: German mit (= with) is used with ages. English
        uses at or when.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Während = while (not just during)
      example_l1: Sie rief an, während du weg warst.
      example_gloss: She phoned, while you away were.
      example_wrong: She phoned during you were out.
      example_correct: She phoned while you were out.
      explanation: 'Transfer from L1: German während = during or while. English distinguishes
        during (preposition) from while (conjunction).'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Bei = at (someone's place)
      example_l1: Ich verbrachte den Abend bei John und Alice.
      example_gloss: I spent the evening at John and Alice.
      example_wrong: I spent the evening by John and Alice.
      example_correct: I spent the evening at John and Alice's.
      explanation: 'Transfer from L1: German bei corresponds to a large number of
        prepositions in English depending on context — but rarely to by.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'Preposition usage is highly language-specific. German prepositions
      often don''t map 1:1 to English. McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
