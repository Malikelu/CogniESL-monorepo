        cake? / a symphony by Beethoven / on Monday / at a party / The bus stop is
        in front of our house. / I arrived ten minutes ago. / I spent the evening
        at John and Alice's.
      explanation: 'Transfer from L1: German prepositions often differ from English
        in ways that cause systematic errors. German prepositions frequently have
        multiple English equivalents that do not map 1:1.'
