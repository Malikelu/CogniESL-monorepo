  word_order_advanced:
    interference_patterns:
    - pattern: Adverb placement differences (ago precedes time expression)
      example_l1: Ich kaufe es vor drei Jahren.
      example_gloss: I buy it ago three years.
      example_wrong: I bought it ago three years.
      example_correct: I bought it three years ago.
      explanation: 'Transfer from L1: German vor (= ago) precedes an expression of
        time. English ago follows the time expression.'
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Entlang (= along) follows its noun
      example_l1: Sie ging die Straße entlang.
      example_gloss: She went the street along.
      example_wrong: She was walking the road along.
      example_correct: She was walking along the road.
      explanation: 'Transfer from L1: German entlang (= along) follows its noun. English
        along precedes its noun.'
      frequency: 2
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Preposition stranding at end of clause (not possible in German)
      example_l1: German does not strand prepositions at the ends of clauses
      example_gloss: German keeps prepositions with their objects
      example_wrong: difficulty with "That's the woman I was talking about" or "Who
        did you buy that for?"
      example_correct: That's the woman I was talking about. / Who did you buy that
        for?
      explanation: 'Transfer from L1: German does not strand prepositions at the ends
        of clauses, so students have trouble with preposition stranding in English
        questions and relative clauses.'
      frequency: 3
      persistence: 3
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Article separated from noun by complex participle phrase
      example_l1: Der in Großbritannien mit ungewöhnlicher Spannung erwartete Haushaltsplan...
      example_gloss: The in Britain with unusual excitement awaited budget...
      example_wrong: The in Britain with unusual excitement awaited budget...
      example_correct: The budget, awaited with unusual excitement in Britain...
      explanation: 'Transfer from L1: In German, an article may be separated from
        its noun by a complex participle phrase. English keeps article and noun together.'
      frequency: 2
      persistence: 1
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'German adverb placement rules differ from English. English places
      adverbs after ''be'' and before other verbs. Golden et al. (2017, Ch. 7) found
      that English-speaking learners of Norwegian — NOT German speakers — show an
      advantage with preposition stranding constructions. Norwegian stranding differs
      from both English and German, and only English speakers show target-like performance
      in stranding contexts that are congruent with English. McManus (2022): The L1
      is always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Odlin (Ch.2):
      "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: Adverbs go after ''be'' (I am always) and before other
        verbs (I always go).'
      where_to_start: Start with adverbs of frequency. Then teach other adverb types.
      sequencing: 'Week 1: Frequency adverbs. Week 2: Manner adverbs. Week 3: Time
        adverbs. Week 4: Review.'
    flagged: false
    tier: 3
    exercises:
    - name: Adverb Placement
