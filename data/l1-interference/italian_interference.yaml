    examples:
    - correct: I was travelling through Italy.
      wrong: I was travelling through the Italy.
    - correct: I think money is very important.
      wrong: I think the money is very important.
    - correct: I am speaking to you as a friend.
      wrong: I am speaking to you as friend.
    - correct: She lives in the mountains
      wrong: She lives in mountains
    - correct: I have a few friends.
      wrong: I have little friends. (when meaning 'a few')
    - correct: In the future, I will study more.
