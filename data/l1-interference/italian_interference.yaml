      name: Article Choice
      type: fill-in-the-blank
    flagged: false
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I was travelling through Italy. / My favourite colour is red.
        / After breakfast, we went to school.
      example_gloss: the Italy, the red, the breakfast
      example_l1: IT 'l'Italia', 'il rosso', 'la colazione'
      example_wrong: I was travelling through the Italy. / My favourite colour is
        the red. / After the breakfast, we went to school.
      explanation: 'Italian uses definite articles in contexts where English omits
        them: with countries (l''Italia), colours (il rosso), meals (la colazione),
        and institutions (school, church, bed).'
      flagged: true
      frequency: 4
      pattern: Definite article overgeneralization (countries, colours, meals)
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_correct: I think money is very important.
      example_gloss: the money is important
      example_l1: IT 'I soldi sono importanti'
      example_wrong: I think the money is very important.
      explanation: Italian uses the definite article with abstract/generic nouns ('i
        soldi' = the money). English omits the article for generic reference.
      flagged: true
      frequency: 3
      pattern: Article omission with abstract nouns (generic reference)
      persistence: 2
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_correct: I am speaking to you as a friend. / You can eat it with a spoon.
        / I studied English without a teacher.
      example_gloss: as friend, with spoon, without teacher
      example_l1: IT 'come amico', 'con cucchiaio', 'senza insegnante'
      example_wrong: I am speaking to you as friend. / You can eat it with spoon.
        / I studied English without teacher.
      explanation: Italian does not use the indefinite article after 'come' (as),
        'con' (with), and 'senza' (without). English requires 'a/an'.
      flagged: true
      frequency: 3
      pattern: Article omission after as, with, without
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_correct: She lives in the mountains / in the country.
      example_gloss: she-lives in mountains / in country
      example_l1: IT 'vive in montagna / in campagna'
      example_wrong: She lives in mountains / in country.
      explanation: Italian does not use articles in some common expressions referring
        to location ('in montagna', 'in campagna'). English requires 'the'.
      flagged: true
      frequency: 3
      pattern: Article omission with location expressions
      persistence: 2
      reliability: B
      tier: 3
    - communicative_impact: 2
