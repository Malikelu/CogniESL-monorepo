    - Golden
    - Odlin
    teacher_tips:
      how_to_explain: 'Teach: Many + countable (many books). Much + uncountable (much
        water). A lot of + both.'
      sequencing: 'Week 1: Many/much. Week 2: Few/little. Week 3: A lot of/plenty
        of. Week 4: Review.'
      where_to_start: Start with many/much. Then teach few/little. Then teach a lot
        of.
