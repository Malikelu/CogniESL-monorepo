      example_correct: I have a few friends.
      example_gloss: few/little (no distinction)
      example_l1: IT uses 'pochi'/'poco' for both
      example_wrong: I have little friends. (when meaning 'a few')
      explanation: Italian does not distinguish between few/little and a few/a little
