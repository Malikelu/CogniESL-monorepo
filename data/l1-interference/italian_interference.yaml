      wrong: Myself I call John.
    - correct: I broke my arm.
      wrong: I broke myself the arm.
    - correct: We will meet each other after dinner.
      wrong: We will meet us after dinner.
    - correct: In this region many shoes are produced.
      wrong: In this region you/he/it produces many shoes.
