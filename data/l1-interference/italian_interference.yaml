  reflexive_it:
    citations:
    - claim: 'Italian uses the clitic si for both reflexive and impersonal constructions. Reflexive si uses essere as auxiliary (Maria si è criticata ''Mary criticised herself''), while impersonal si can combine with plural predicate adjectives (si è ricchi ''one is rich''). The impersonal si extends to intransitive verbs (si parte domani ''one is leaving tomorrow'') with singular verb agreement, even with plural subjects.'
      location: 'Syntax (reflexive si and impersonal si), lines ~18220-18260'
      source: 'Vincent, N. (1997) in The World''s Major Languages, ed. B. Comrie, Routledge. Ch. 12, Syntax section.'
      tier: 1
