  tense_aspect_advanced:
    citations:
    - claim: 'Italian has a three-way past tense distinction: imperfect (cantava = habitual/incomplete), preterit (cantò = distant past, single completed action), and present perfect/passato prossimo (ha cantato = near past, current relevance). Vincent argues the imperfect is the unmarked past tense, deriving its precise value from context, while both the perfect and the preterit carry inbuilt aspectual value.'
      location: 'Syntax (The Verbal Group, aspect), lines ~18119-18149'
      source: 'Vincent, N. (1997) in The World''s Major Languages, ed. B. Comrie, Routledge. Ch. 12, Syntax section.'
      tier: 1
    - claim: 'Regional variation in Italian past tense use is significant: northern speakers rarely use the preterit (perfect subsumes both functions), while southern speakers often use only the preterit. This means Italian L1 learners from different regions may transfer different tense-aspect mappings to English.'
      location: 'Syntax (regional variation), lines ~18139-18149'
      source: 'Vincent, N. (1997) in The World''s Major Languages, ed. B. Comrie, Routledge. Ch. 12, Syntax section.'
