      pattern: Reflexive verb overuse (from Italian mi chiamo, mi lavo, mi vesto)
      persistence: 2
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_correct: I broke my arm.
      example_gloss: myself I-have broken the arm
      example_l1: IT 'Mi sono rotto il braccio'
      example_wrong: I broke myself the arm.
      explanation: Italian reflexive pronouns can be used as indirect objects in cases
        where English would use possessives ('mi sono rotto il braccio' = I broke
        myself the arm). English uses 'my arm'.
