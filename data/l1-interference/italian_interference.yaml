  pro_drop_it:
    citations:
    - claim: 'Italian is a pro-drop (null-subject) language — subject pronouns are grammatically unnecessary because verb endings encode person/number. Vincent notes that Italian allows subject extraction from embedded clauses (chi credi che verrà? ''who do you think will come?''), demonstrating the deep syntactic nature of the pro-drop parameter.'
      location: 'Syntax (The Sentence, word order), lines ~18374-18396'
      source: 'Vincent, N. (1997) in The World''s Major Languages, ed. B. Comrie, Routledge. Ch. 12, Syntax section.'
      tier: 1
    - claim: 'Italian allows post-verbal subjects with unaccusative/patient-subject verbs (è arrivato il trino ''the train has arrived''). This flexible word order, governed by theme-rheme (topic-comment) principles rather than strict SVO, transfers to English production.'
