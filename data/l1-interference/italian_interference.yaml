      example_correct: My name is John. / I get up at 6.00 every morning. / Take care
        of yourself.
      example_gloss: myself I-call Marco / myself I-wash / myself I-dress / myself
        I-sit
      example_l1: IT 'Mi chiamo Marco' / 'Mi lavo' / 'Mi vesto' / 'Mi siedo'
      example_wrong: Myself I call John. / I get myself up at 6.00 every morning.
        / Take care of you.
      explanation: Italian uses reflexive verbs where English uses simple verbs or
        passive constructions. 'Chiamarsi' = to be called, 'lavarsi' = to wash, 'vestirsi'
        = to dress, 'sedersi' = to sit down, 'alzarsi' = to get up. English does not
        use reflexive pronouns for these.
      flagged: true
