      location: Ch. 1, pp. 4-7
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: L2 processing requires practice to become automatic; inhibitory control
        manages L1-L2 competition
      location: Ch. 1, pp. 4-11
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus findings: conceptual transfer, non-linear gender
        effects, functional fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    communicative_impact: 3
    examples:
    - correct: I am a teacher.
      wrong: I am teacher.
    - correct: She is a doctor.
      wrong: She is doctor.
    flagged: false
    frequency: 5
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I am a teacher
      example_gloss: I-am teacher
      example_l1: IT 'sono insegnante'
      example_wrong: I am teacher
      explanation: 'Transfer from L1: Omission of indefinite article after essere.'
      flagged: true
      frequency: 5
      pattern: Omission of indefinite article after essere
      persistence: 4
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_correct: Dogs are useful pets.
      example_gloss: the dogs are animals useful
      example_l1: IT 'I canini sono animali utili'
      example_wrong: The dogs are useful pets.
      explanation: '"Transfer from L1: Italian uses definite article with generic
        nouns (e.g. ''i canini'' = the dogs). English omits the article for generic
        reference."'
      flagged: true
      frequency: 4
      pattern: Overuse of definite article with generic nouns
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: functional_fit_transfer
      example_correct: '''I am a doctor'' / ''Life is beautiful'''
      example_gloss: Italian has definite/indefinite articles but usage rules differ
        from English
      example_l1: 'Italian: has article system'
      example_wrong: '''I am doctor'' / ''the life is beautiful'' (L1-specific article
        overuse/underuse)'
      explanation: 'Golden et al. (2017): Even L1s with articles show non-linear transfer
        effects. Having an L1 article system helps but does not eliminate errors because
        the specific rules for article use (when to use definite, indefinite, or zero
        article) vary across languages. Swedish, French, Spanish, Arabic, and other
        article-bearing L1s all show context-specific article errors in English.'
      flagged: true
      frequency: 4
      pattern: 'Golden et al. (2017): Having L1 articles does NOT guarantee easy English
        article acquisition'
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: functional_fit_transfer
      example_correct: Learning L2 gender assignment rules independently
      example_gloss: Italian has gender system but may differ in number of genders
        or assignment rules
      example_l1: 'Italian: has grammatical gender'
      example_wrong: '''Applying L1 gender assignment rules to English/the target
        L2'''
      explanation: 'Golden et al. (2017) Ch.6 (Ragnhildstveit): Dutch/Spanish (2 genders)
        and German (3 genders) learners of Norwegian did NOT show an overall advantage
        over learners without gender. Gender transfer is non-linear: it depends on
        how L1 and L2 gender systems align functionally, not just whether L1 has gender.'
      flagged: true
      frequency: 3
      pattern: 'Golden et al. (2017): L1 gender system does NOT guarantee L2 gender
        advantage — functional fit matters'
      persistence: 3
      reliability: B
      tier: 3
    persistence: 4
    source_count: 5
    source_rank: 1
    source_type: textbook
    sources:
    - Swan & Smith "Learner English" Ch. 7 (Italian)
    - Parrott "Grammar for English Language Teachers"
    - McManus
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: 20 sentences with Italian-influenced article errors.
        duration: 15
        name: Article Audit
        type: error-correction
      how_to_explain: '"Teach: English REQUIRES ''a/an'' after ''be'' for professions."'
      sequencing: 'Week 1: Articles with professions. Week 2: Definite vs indefinite.
        Week 3: Review.'
      where_to_start: Start with the profession pattern.
    tier: 1
    why_it_happens: 'Italian omits the indefinite article after ''essere'' (to be)
      for professions. Italian also uses definite articles more broadly than English.
      McManus (2022) explains that L2 speakers can learn new form-meaning mappings
      (like articles) that don''t exist in L1, but this requires extensive practice
      to become automatic. Online anticipatory processing (using articles to predict
      upcoming nouns) develops only with high proficiency and extended exposure, not
      from L1 transfer. McManus (2022) explains that L2 speakers can learn new form-meaning
      mappings that don''t exist in L1, but this requires extensive practice to become
      automatic. L2 learning involves creating new knowledge when L1-L2 differences
      exist AND developing selection mechanisms to manage competing knowledge sources
      (McManus 2022, Ch. 1). Online anticipatory processing develops only with high
      proficiency and extended exposure. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
  articles_advanced:
    citations:
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
