      example_correct: We will meet each other after dinner. / We will see each other
        after dinner.
      example_gloss: each-other we-see after dinner
      example_l1: IT 'Ci vediamo dopo cena'
      example_wrong: We will meet us after dinner.
      explanation: Italian reflexive pronouns can express the idea of 'each other'
        ('ci vediamo' = we see each other). English uses 'each other' explicitly.
      flagged: true
      frequency: 2
