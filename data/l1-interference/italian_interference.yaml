      flagged: true
      frequency: 3
      pattern: few/little vs a few/a little confusion
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: interlingual
      example_correct: In the future, I will study more. / Last week was difficult.
      example_gloss: (Italian uses definite article)
      example_l1: IT uses articles with these expressions
      example_wrong: In the future, I will study more. / The last week was difficult.
      explanation: Italian uses articles with expressions like 'in futuro', 'la scorsa
