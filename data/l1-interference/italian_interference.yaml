- claim: Italian L1 speakers' errors in English include subject pronoun overuse (Italian
    allows pro-drop), article misuse, and false cognate errors reflecting Romance
    L1 transfer. James's error typology classifies these as interlingual errors where
    partial L1-L2 structural overlap produces complex transfer patterns.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that Italian L1 speakers' pro-drop transfer
