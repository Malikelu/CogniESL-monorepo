      wrong: I am eaten lunch.
    exercises:
    - description: 15 sentences choosing correct auxiliary.
      duration: 10
      name: Auxiliary Choice
      type: fill-in-the-blank
    flagged: false
    interference_patterns:
    - communicative_impact: 2
      etiology: interlingual
      example_correct: I have eaten lunch. / He has gone to the store. / I have cut
        myself.
      example_gloss: be gone vs have eaten
      example_l1: IT 'Sono andato' (I am gone) vs. 'Ho mangiato' (I have eaten)
      example_wrong: I am eaten lunch. / He is gone to the store. / I am cut myself.
      explanation: Italian uses 'essere' (be) as auxiliary for perfect tenses of intransitive
