etiology:
- claim: 'Jarvis & Pavlenko (2008) identify eight conceptual domains where crosslinguistic
    influence occurs: objects, emotions, personhood, gender, number, time, space,
    and motion. L1 conceptual categories influence how L2 learners perceive and categorize
    reality.'
  conceptual_transfer: true
  factors_affecting_transfer:
  - proficiency_level
  - perceived_crosslinguistic_distance
  - recency_of_L2_use
  - markedness
  - L2_status_effect
  - cognitive_maturity
  - attention_to_language_form
  flagged: false
  reliability: B
  source: Jarvis & Pavlenko (2008) Crosslinguistic Influence in Language and Cognition.
    Routledge. Chapters 4-5.
  tier: 2
- claim: 'Hindi-Urdu is an SOV, postpositional language with no article system, two
    genders, complex tense-aspect morphology (causal verbs, compound verbs), retroflex
    and aspirated consonant distinctions, and nasal vowels. Typological differences
    from English predict specific areas of interference: SOV word order transfer,
    postposition-for-preposition substitution, article omission, retroflex/dental
    consonant confusion, and compound verb simplification.'
  conceptual_transfer: true
  factors_affecting_transfer:
  - word_order_difference
  - absence_of_articles
  - postpositional_case_system
  - retroflex_aspiration_phonology
  - compound_verb_structures
  flagged: false
  reliability: B
  source: Kachru, Y. (2006) Hindi. John Benjamins. Ch. 22 in The World''s Major
    Languages (ed. Comrie). Phonology (lines 29454-29551), Morphology (lines 29834-30431),
    Syntax (lines 30443-30766).
  tier: 2
