    why_it_happens: 'Hindi has no article system. Definiteness is inferred from context
      or word order. Hindi learners struggle with English articles because the concept
      does not exist in Hindi. McManus (2022) explains that L2 speakers can learn
      new form-meaning mappings (like articles) that don''t exist in L1, but this
      requires extensive practice to become automatic. Online anticipatory processing
      (using articles to predict upcoming nouns) develops only with high proficiency
      and extended exposure, not from L1 transfer. McManus (2022) explains that L2
      speakers can learn new form-meaning mappings that don''t exist in L1, but this
      requires extensive practice to become automatic. L2 learning involves creating
      new knowledge when L1-L2 differences exist AND developing selection mechanisms
      to manage competing knowledge sources (McManus 2022, Ch. 1). Online anticipatory
      processing develops only with high proficiency and extended exposure. Golden
