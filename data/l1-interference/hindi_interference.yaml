  postpositions_hi:
    citations:
    - claim: 'Hindi-Urdu is a postpositional language — case markers (postpositions)
        follow the noun, unlike English prepositions which precede it. Key postpositions
        include ne (agentive), ko (accusative/dative), se (instrumental/ablative/comitative),
        me˜/pr (locative), kA (possessive/genitive), ke liye (benefactive), and locative
        postpositions (ke pas ''near'', ke samne ''in front of'', ke peeche ''behind'',
        ke bahar ''out'', ke andar ''inside''). This postpositional typology causes
        transfer errors where Hindi learners place case markers after English nouns
        or omit prepositions entirely.'
