  description: 'Hindi-Urdu forms compounds using Sanskrit sandhi rules (vowel coalescence,
    guna, vrddhi) that do not exist in English. Hindi learners may attempt to create
    English compounds using Sanskrit compounding principles, producing non-standard
    forms. Source: Kachru (2006) Hindi. The World''s Major Languages Ch.22, lines
    29705-29756 (guna and vrddhi compounding, verbal root alternation).'
