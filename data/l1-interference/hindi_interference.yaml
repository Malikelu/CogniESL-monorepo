    - Odlin
    teacher_tips:
      exercises:
      - description: 15 sentences where students choose between adjective and adverb
          form.
        duration: 10
        name: Adjective or Adverb?
        type: fill-in-the-blank
      how_to_explain: 'Teach: Adjective describes a noun. Adverb describes a verb.
        Most adverbs add -ly.'
      sequencing: 'Week 1: Adjective vs adverb. Week 2: Adding -ly. Week 3: Exceptions.
        Week 4: Review.'
      where_to_start: Start with the -ly rule.
    tier: 1
    why_it_happens: 'Hindi does not always distinguish morphologically between adjectives
      and adverbs. English requires -ly for most adverbs. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
      must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries. Odlin (Ch.4): SOV word order
      IS transferable to English SVO. The LEAST proficient speakers show the MOST
      transfer. Proficiency-sensitive pattern confirmed across 11 language contact
      situations (Hawaiian Pidgin English, Andean Spanish, Pidgin Fijian, Indo-Portuguese
      creole, etc.). Refutes Zobl & Rutherford''s claimed universal constraint. Word-order
      transfer more likely in informal/unfocused contexts. Odlin (Ch.3): Languages
      with rich case systems may show COVERT transfer — the absence of expected English
      prepositions reflects L1 influence. Finnish (15 cases) learners omit obligatory
      English prepositions because Finnish uses nominal case inflections instead.
      Similar patterns expected for other case-system L1s transferring case-based
      strategies to English preposition use. Odlin (Ch.5, Ch.6): Focus constructions
      (clefts, word-order shifts, focus particles) show crosslinguistic influence.
      Transfer depends on BOTH structural similarity AND frequency of L1 use. Languages
      with productive focus-fronting or distinctive cleft patterns will show transfer
      in English cleft usage. Affective meanings in focus constructions may be language-specific
      and difficult to translate.'
