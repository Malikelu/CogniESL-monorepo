phonology_interference:
- claim: HINDI retroflex consonants
  consonants:
  - ट (/ʈ/)
  - ठ (/ʈʰ/)
  - ड (/ɖ/)
  - ढ (/ɖʰ/)
  - ण (/ɳ/)
  description: 'Hindi has a retroflex consonant series (ट, ठ, ड, ढ, ण) produced with the
    tongue curled back against the palate. English /t/ and /d/ are alveolar (tongue on
    the ridge behind upper teeth). Hindi learners may substitute retroflex sounds for
    English alveolar sounds, producing a noticeable accent. Source: Kachru (2006) Hindi.
    The World''s Major Languages Ch.22, lines 29456-29468 (retroflexion feature).'
  examples:
  - correct: tea (alveolar t)
    wrong: tea (retroflex ʈ)
  - correct: dog (alveolar d)
    wrong: dog (retroflex ɖ)
  flagged: false
  frequency: 3
  persistence: 3
  reliability: B
  tier: 2
  order: 1
- claim: HINDI aspiration distinction
  description: 'Hindi-Urdu maintains a four-way distinction in plosives: voiceless
    unaspirated (p, t, ʈ, c, k), voiceless aspirated (pʰ, tʰ, ʈʰ, cʰ, kʰ), voiced
    unaspirated (b, d, ɖ, j, g), and voiced aspirated (bʱ, dʱ, ɖʱ, jʱ, gʱ). English
    only distinguishes voiceless/voiced. Hindi learners may over-aspirate English
    voiceless stops or fail to distinguish English minimal pairs. Source: Kachru (2006)
    Hindi. The World''s Major Languages Ch.22, lines 29460-29468 (aspiration feature).'
  examples:
  - correct: pin (aspirated pʰ at start)
    wrong: pin (unaspirated p)
  - correct: spin (unaspirated p)
    wrong: spin (aspirated pʰ)
  flagged: false
  frequency: 3
  persistence: 3
  reliability: B
  tier: 2
  order: 2
- claim: HINDI nasal vowels
  description: 'Hindi-Urdu has distinctive nasal vowels that contrast with oral vowels
    (e.g., ak "a plant" vs. ãk "draw"). English does not have phonemic nasal vowels,
    though vowels before nasal consonants become nasalized allophonically. Hindi learners
    may over-nasalize English vowels. Source: Kachru (2006) Hindi. The World''s Major
    Languages Ch.22, lines 29519-29522 (nasalization distinctive).'
  examples:
  - correct: 'ham (oral vowel)'
    wrong: 'hãm (nasalized vowel)'
  flagged: false
  frequency: 2
  persistence: 2
  reliability: B
  tier: 2
  order: 3

vocabulary_interference:
- claim: HINDI Sanskritised vs Persianised vs Englishised register lexicon
  description: 'Hindi-Urdu has three major lexical strata: Sanskrit-derived (tatsama,
    used in formal/Hindi literary register), Persian-Arabic-derived (used in formal/
    Urdu literary register), and colloquial Hindustani. English lacks this register-based
    lexical switching. Hindi learners may use Sanskritised or Persianised vocabulary
    in inappropriate English contexts, or transfer English loanwords from Indian English
    that are not standard in other varieties. Source: Kachru (2006) Hindi. The World''s
    Major Languages Ch.22, lines 29391-29756 (Lexicon/Register variation, Sanskritised
    vs Persianised styles, Englishised form).'
  examples:
  - correct: 'Hello (standard English greeting)'
    wrong: 'Pranam (Sanskrit formal greeting used in English)'
  - correct: 'Thank you'
    wrong: 'Shukriya (Persian-derived formal thank you used in English)'
  flagged: false
