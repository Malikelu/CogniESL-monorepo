writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: This issue requires immediate attention because [reason].
    error: '*After discussing many views and much background, finally I conclude that
      this issue is important and needs attention.'
    explanation: Hindi rhetorical tradition builds toward the conclusion gradually;
      English expects the thesis stated directly at the outset.
  - correction: Empirical evidence from [source] supports this argument.
    error: '*As the great poet said, ''Truth always wins,'' so we can see that my
      argument is correct.'
    explanation: Hindi essays often cite literary or scriptural authority; English
      academic writing privileges data and citation of research.
  description: 'Hindi argumentative writing follows a circular rhetorical pattern
    influenced by Sanskrit literary traditions. Writers tend to present multiple perspectives
    before stating their thesis, often placing the main claim near the conclusion
    rather than at the beginning. Paragraphs may include extensive background context
    before the topic sentence, and evidence is often drawn from proverbs, scriptures,
    or authoritative texts rather than empirical data. English argumentative essays
    expect an upfront thesis, linear progression, and evidence-based reasoning. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hindi speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Education is essential for economic development. For example, [one
      focused example].
    error: '*Paragraph starts with three examples about education, then a detail about
      family, then ends with ''So education is very important.'''
    explanation: The topic sentence (education is important) should open the paragraph,
      not close it.
  - correction: Each paragraph develops one central idea from start to finish.
    error: '*The topic sentence mentions one idea, but the middle of the paragraph
      shifts to a loosely related idea.'
    explanation: Hindi paragraph structure allows tangential expansion; English demands
      unity around one topic sentence.
  description: 'Hindi paragraphs often follow a spiral or inductive pattern, with
    the topic sentence appearing at the end after supporting details are elaborated.
    Hindi writers may include multiple loosely related ideas within a single paragraph,
    whereas English expects one central idea per paragraph introduced by a clear topic
    sentence. Concluding sentences in Hindi may introduce new sub-ideas rather than
    synthesizing what was said. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hindi speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: The government should act, and citizens must also take responsibility.
    error: '*The government should act. And also the people should care. And also
      we must do something.'
    explanation: Hindi coordinates with 'and' between sentences; English uses subordination
      and varied connectors.
  - correction: Because the weather was bad, we stayed home.
    error: '*The weather was bad. To we stayed home.'
    explanation: '''To'' (so/therefore) as a sentence opener is a Hindi discourse
      transfer; English requires subordinating conjunctions or semicolons.'
  description: 'Hindi writing tends toward overuse of conjunctions and repetitive
    connectors (aur, lekin, isliye = and, but, so) at the beginning of sentences.
    Hindi writers may underuse subordination, creating long chains of coordinate clauses.
    The Hindi discourse marker ''to'' (so/therefore) is overused as a sentence opener
    in English compositions. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hindi speakers. Cambridge
    University Press.'
- area: register_and_formality
  common_errors:
  - correction: This proposal is worth considering because [reason].
    error: '*It is respectfully submitted that the aforementioned proposal may kindly
      be considered.'
    explanation: Hindi formal writing uses elaborate deference; English academic writing
      values clarity and conciseness.
  - correction: The current policy is ineffective because [evidence].
    error: '*The thing is like, the policy is not working, so yeah.'
    explanation: Hindi informal register bleeds in; academic English requires neutral-to-formal
      tone.
  description: 'Hindi has a pronounced formal-informal distinction (aap/tum) that
    does not map onto English register conventions. Hindi learners may produce overly
    formal writing with elaborate honorific constructions or, conversely, inappropriately
    casual language when formality is expected. Idiomatic expressions and conventional
    academic phrasing in English may be underused. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hindi speakers. Cambridge
    University Press.'
