      tier: 3
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    communicative_impact: 3
    examples:
    - correct: He runs very fast.
      wrong: He runs very fastly.
    flagged: false
    frequency: 4
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: It looks/sounds beautiful. / I feel terrible.
      example_gloss: It sounds beautifully. / I feel terribly.
      example_l1: To brzmi pięknie. / Czuję się okropnie.
      example_wrong: It looks/sounds beautifully. / I feel terribly.
      explanation: 'Transfer from L1: Adverbs are sometimes used in Polish where English
        requires adjectives. Swan & Smith 2001, Ch. "Polish speakers", § Adjectives
        and adverbs, point 1. Stone (1993) notes that Polish adjectives agree in number,
        case, and gender with the nouns they modify (Ch.16, ll. 21567-21594) and the
        adverb/adjective distinction is less rigid than in English — Polish uses the
        same form for both predicative adjective and adverb functions (e.g. pięknie =
        "beautifully/beautiful"), which transfers to English as adjective-for-adverb
        substitution.'
      flagged: true
      frequency: 4
      pattern: Adjective vs adverb (polish)
      persistence: 3
      reliability: B
      tier: 3
    - communicative_impact: 2
      etiology: negative_transfer
      example_correct: '''Han går fort'' (Norwegian adverb)'
      example_gloss: He walks quickly [Polish adverb form = adjective neuter]
      example_l1: On idzie szybko (adverb = adjective form)
      example_wrong: '''Han går szybko'' (adjective/adverb confusion in Norwegian)'
      explanation: 'Golden et al. (2017) Ch.5 (Janik): Norwegian adverbial marking
        uses inflectional rather than derivational morphology. Polish uses -o/-e for
        adverbs (similar to adjective neuter ending), which creates confusion with
        Norwegian -t neuter adjective adverbial marking.'
      flagged: true
      frequency: 3
      pattern: Polish adjective-adverb distinction differs from Norwegian — negative
        transfer (Golden et al. Ch.5)
      persistence: 3
      reliability: B
      tier: 3
    persistence: 3
