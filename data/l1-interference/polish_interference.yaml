writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Begin with a focused introduction that presents the topic, provides
      necessary context, and states the thesis clearly
    error: '*Opening an essay with a broad philosophical quote or rhetorical question
      rather than a clear thesis'
    explanation: Polish 'rozprawka' tradition values literary openings and rhetorical
      flourish; English essays prioritize clarity and directness from the first sentence
  - correction: Support claims with specific evidence, data, or scholarly references
      rather than appeals to common sense or shared values
    error: '*Using emotional appeals and value judgments (''Everyone knows that...'',
      ''It is obvious that...'') as argumentative support'
    explanation: Polish argumentative tradition accepts appeals to shared values and
      authority; English academic writing requires evidence-based support
  description: 'Polish rhetorical tradition, shaped by the ''rozprawka'' (argumentative
    essay) genre taught in schools, emphasizes elaborate stylistic expression, rhetorical
    questions, and emotional appeals alongside logical argumentation. Polish essays
    often open with broad philosophical or literary references and may use a more
    circular, digressive structure than English essays. The thesis may be implied
    through the accumulation of arguments rather than stated explicitly. Polish writers
    may also rely on appeals to shared cultural values and authority rather than empirical
    evidence. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Polish speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: Keep each paragraph focused on a single point that directly supports
      the thesis; save anecdotes for introductions or conclusions if appropriate
    error: '*Including personal anecdotes or tangential observations within body paragraphs'
    explanation: Polish paragraph structure tolerates digression and personal voice;
      English paragraphs are expected to maintain strict focus on a single supporting
      point
  - correction: 'Use a clear structure: topic sentence, evidence/analysis, concluding/transition
      sentence'
    error: '*Writing paragraphs without a clear organizational structure (no topic
      sentence, no clear progression)'
    explanation: Polish paragraphs may develop organically; English paragraphs follow
      a more rigid organizational template
  description: 'Polish paragraphs tend to be structured around a central idea that
    is developed through elaboration, examples, and digressions rather than through
    a linear topic-sentence-to-support model. Polish writers may include personal
    reflections, additional context, or related observations within a single paragraph,
    creating a richness that English readers may perceive as unfocused. The topic
    sentence, if present, may appear in the middle or at the end of the paragraph.
    McManus (2022): Writing interference reflects learned attention from L1 discourse
    habits. L1 rhetorical patterns shape how writers organize and present arguments
    in L2. Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Polish speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: Use 'However,' 'Nevertheless,' 'Therefore,' or 'Consequently' for
      formal writing; reserve 'But' and 'So' for informal contexts
    error: '*Starting sentences with ''But'' or ''So'' in formal academic writing'
    explanation: Polish 'ale' and 'wiec' are standard sentence starters in Polish
      writing; their direct English equivalents are too informal for academic prose
  - correction: 'Specify the relationship: use ''moreover'' for addition, ''consequently''
      for result, ''whereas'' for contrast'
    error: '*Using ''and'' to connect ideas that require more specific logical connectors'
    explanation: Polish writing often uses 'i' (and) as a general connector; English
      academic writing expects precise signaling of logical relationships
  description: 'Polish writers often rely on a limited set of connectors transferred
    from Polish, leading to overuse of words like ''but,'' ''so,'' ''also,'' and ''however.''
    Polish academic writing traditionally uses fewer explicit connectors than English,
    relying more on implicit logical relationships and the reader''s ability to follow
    the argument. When Polish writers do use connectors in English, they may choose
    ones that are too informal for academic register or place them incorrectly. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Polish speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: 'Use simple, direct language: ''use,'' ''begin,'' ''explain.'' Choose
      precise words, not impressive-sounding ones'
    error: '*Using unnecessarily complex vocabulary to sound ''academic'': ''utilize''
      for ''use,'' ''commence'' for ''begin,'' ''elucidate'' for ''explain'''
    explanation: Polish academic tradition values lexical richness and formal vocabulary;
      English academic writing increasingly prizes clarity and accessibility
  - correction: Vary sentence length; break complex ideas into shorter, clearer sentences
    error: '*Writing very long, multi-clause sentences with extensive subordination'
    explanation: Polish syntax tolerates and values long, complex sentences; English
      academic writing favors clarity through shorter, well-structured sentences
  description: 'Polish academic writing traditionally values a highly elaborate, literary
    style with complex syntax, rich vocabulary, and rhetorical devices. This ''high
    style'' (wysoki styl) is considered the mark of educated writing. When transferred
    to English, this can produce prose that sounds overwrought, excessively formal,
    or unnecessarily complex. Polish writers may also struggle with the English convention
    of conciseness and the expectation that academic writing should be clear and accessible
    rather than demonstratively erudite. McManus (2022): Writing interference reflects
    learned attention from L1 discourse habits. L1 rhetorical patterns shape how writers
    organize and present arguments in L2. Restructuring these habits requires explicit
    attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Polish speakers. Cambridge
    University Press.'
