    tier: 1
    why_it_happens: 'Polish has no article system. Definiteness is inferred from context
      or word order rather than grammatical markers. Polish learners often omit articles
      entirely in English, producing sentences like ''I bought book yesterday'' instead
      of ''I bought a book.'' This occurs because Polish does not require speakers
      to mark definiteness grammatically. McManus (2022) explains that L2 speakers
      can learn new form-meaning mappings (like articles) that don''t exist in L1,
      but this requires extensive practice to become automatic. Online anticipatory
      processing (using articles to predict upcoming nouns) develops only with high
      proficiency and extended exposure, not from L1 transfer. McManus (2022) explains
      that L2 speakers can learn new form-meaning mappings that don''t exist in L1,
      but this requires extensive practice to become automatic. L2 learning involves
      creating new knowledge when L1-L2 differences exist AND developing selection
      mechanisms to manage competing knowledge sources (McManus 2022, Ch. 1). Online
      anticipatory processing develops only with high proficiency and extended exposure.
      Slavic speakers show a clear difficulty hierarchy for English articles: textual
      the (easiest) < structural the < nonreferential a < situational the < referential
      a (hardest). textual the is easiest because learners can track discourse referents;
      referential a is hardest because learners must conceptualize a specific entity
      new to the discourse; situational the is 2nd hardest because it requires encyclopedic/real-world
      knowledge. Ekiert & Han. In Slavic languages, definiteness
      is expressed through word order, verbal aspect (perfective vs imperfective),
      case marking, demonstratives, possessives, and pragmatic context rather than
      through articles. This means Slavic learners must not only learn article forms
      but also restructure how they conceptualize and signal definiteness. What appears
      to be an article error may actually reflect conceptual differences in how referents
      are construed (Tabakowska 1993, cited in Ekiert & Han).'
