- claim: Polish is a highly inflected Slavic language with 7 cases, no articles, flexible
    word order, and a complex aspectual system — significant typological distance
    from English
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning.
    Multilingual Matters.
  tier: 1
  reliability: B
