- claim: Polish L1 speakers' errors in English include article omission (Polish has
    no articles), consonant cluster simplification, and case-to-preposition transfer
    errors reflecting Slavic L1 transfer. James's error typology classifies these
    as interlingual errors from a richly inflected L1 with complex morphophonology.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that Polish L1 speakers' article omission
    errors in English are most visible in academic prose, which demands the highest
    article frequency. Polish's zero-article system creates systematic transfer effects
    that register-aware instruction can address.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (2021).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5.4: Academic prose
    register'
  tier: 2
