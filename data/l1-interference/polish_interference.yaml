    teacher_tips:
      exercises:
      - description: 20 sentences with adverbs errors.
        duration: 15
        name: adverbs Audit
        type: error-correction
      - description: Translate 15 sentences focusing on adverbs.
        duration: 15
        name: adverbs Translation
        type: translation
      - description: 20 sentences practicing adverbs.
        duration: 10
        name: adverbs Practice
        type: fill-in-the-blank
      - description: A paragraph with 10 adverbs errors.
        duration: 15
        name: adverbs Error Hunt
        type: error-correction
      how_to_explain: 'Teach: Adjective describes a noun. Adverb describes a verb.
        Most adverbs add -ly.'
      sequencing: 'Week 1: adverbs. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      where_to_start: Start with the adverbs pattern.
    tier: 1
    why_it_happens: 'Polish does not always distinguish adjectives from adverbs. English
      requires -ly. Golden et al. (2017, Ch. 5) found that Polish learners of Norwegian
      experience both positive and negative transfer in adjective inflection: Polish
      has rich adjective agreement (positive transfer for learning挪威语adjective-noun
      agreement) but English lacks it entirely, so English-speaking learners struggle
      more than Polish speakers. However, Polish speakers face negative transfer in
      predicative adjective position where Polish adjectives remain uninflected but
      Norwegian requires inflection. McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation.'
