      must conceptualize a specific entity new to the discourse; situational the is
      2nd hardest because it requires encyclopedic/real-world knowledge. Ekiert & Han. In Slavic languages, definiteness is expressed
      through word order, verbal aspect (perfective vs imperfective), case marking,
      demonstratives, possessives, and pragmatic context rather than through articles.
      This means Slavic learners must not only learn article forms but also restructure
      how they conceptualize and signal definiteness. What appears to be an article
      error may actually reflect conceptual differences in how referents are construed
      (Tabakowska 1993, cited in Ekiert & Han). McManus (2022): The L1 is always active
      during L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney
      1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity, entrenchment
      — explain transfer patterns. Weinreich and Lado both focused on crosslinguistic
      similarities/differences; CAH (Contrastive Analysis Hypothesis) was coined by
      Wardhaugh (1970), not Lado or Fries. Odlin (Ch.3): Languages with rich case
      systems may show COVERT transfer — the absence of expected English prepositions
      reflects L1 influence. Finnish (15 cases) learners omit obligatory English prepositions
      because Finnish uses nominal case inflections instead. Similar patterns expected
