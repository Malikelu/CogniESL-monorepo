  negation_niet:
    interference_patterns:
    - pattern: Placing negation directly after the verb (Dutch S-V-niet-O) instead
        of using do-support
      example_l1: Ik rook niet.
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_gloss: I smoke not.
      example_wrong: I smoke not.
      example_correct: I don't smoke.
      explanation: 'Transfer from L1: Placing negation directly after the verb (Dutch
        S-V-niet-O) instead of using do-support. Dutch has no do-support; negatives
        are formed by placing niet after the verb (Swan & Smith 2001, Ch. "Dutch speakers",
        § Grammar: Interrogative and negative structures, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Placing 'never' at the end of the sentence (Dutch 'nooit' position)
      example_l1: Ik rook nooit.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: I smoke never.
      example_wrong: I smoke never.
      example_correct: I never smoke.
      explanation: 'Transfer from L1: Placing ''never'' at the end of the sentence
        (Dutch ''nooit'' position). Dutch places nooit at clause end; English places
        never before the main verb (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
        Interrogative and negative structures, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Double negation (Dutch allows/requires it, English doesn't)
      example_l1: Ik heb haar gisteren niet gezien.
      frequency: 3
      persistence: 4
      communicative_impact: 3
      example_gloss: I have her yesterday not seen.
      example_wrong: I have her yesterday not seen.
      example_correct: I didn't see her yesterday.
      explanation: 'Transfer from L1: Dutch places niet before the first non-finite
        verbal element and has no do-support. Standard English uses single negation
        with do-support (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Interrogative
        and negative structures, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Negating with 'niet' before the object without do-support
      example_l1: Ik spreek niet Engels.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: I speak not English.
      example_wrong: I speak not English.
      example_correct: I don't speak English.
      explanation: 'Transfer from L1: Negating with ''niet'' before the object without
        do-support. Dutch negation is formed by placing niet after the finite verb;
        English requires do/does/did + not (Swan & Smith 2001, Ch. "Dutch speakers",
        § Grammar: Interrogative and negative structures, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I like not coffee.'' (Dutch: ''Ik hou niet van koffie'') Correct:
      ''I don''t like coffee.'''
    - 'Wrong: ''I go never to the gym.'' (Dutch: ''Ik ga nooit naar de sportschool'')
      Correct: ''I never go to the gym.'''
    - 'Wrong: ''I have nothing not seen.'' (Dutch double negation transfer) Correct:
      ''I haven''t seen anything.'''
    why_it_happens: 'Dutch negation is formed by placing ''niet'' after the verb:
      ''Ik drink niet koffie'' (I drink not coffee). English requires do-support:
      ''I do not drink coffee.'' Dutch has no equivalent of ''do/does/did'' as an
      auxiliary for negation. Dutch allows double negation in colloquial speech. The
      adverb ''nooit'' (never) typically appears at the end of the Dutch clause. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Start with the core difference: Dutch puts ''niet'' after the
        verb, English needs ''do/does/did + not'' before the main verb. Then address
        ''never'' placement and double negation.'
      where_to_start: 'Begin with simple present tense negation using ''do not/don''t.''
        Contrast: ''Ik werk niet'' -> ''I don''t work'' (NOT ''I work not'').'
      sequencing: 'Week 1: Do-support in negation. Week 2: ''Never'' placement. Week
        3: Double negation. Week 4: Combined practice.'
      exercises:
      - name: Do-Support Bootcamp
        type: transformation
        description: '15 affirmative sentences. Students negate each using correct
          English structure. Duration: 15 minutes.'
        duration: 15
      - name: Never in the Right Place
        type: sentence-rewrite
        description: '10 sentences with ''never'' in wrong (Dutch) position. Students
          rewrite correctly. Duration: 10 minutes.'
        duration: 10
      - name: Double Negation Detective
        type: error-correction
        description: '12 sentences, half with double negation errors. Students identify
          and fix wrong ones. Duration: 15 minutes.'
        duration: 15
      - name: Negation Translation Challenge
        type: translation
        description: 'Students translate 10 Dutch negative sentences into English.
          Duration: 20 minutes.'
        duration: 20
