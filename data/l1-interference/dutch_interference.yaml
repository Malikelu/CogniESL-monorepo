  fixed_expressions:
    interference_patterns:
    - pattern: Literal translation of Dutch idioms and fixed expressions
      example_l1: Ik ben het zat.
      frequency: 2
      persistence: 2
      communicative_impact: 2
      example_gloss: I am it sat.
      example_wrong: I am it sat.
      example_correct: I am fed up. / I have had enough.
      explanation: 'Transfer from L1: Literal translation of Dutch idioms and fixed
        expressions. Dutch ''zat zijn'' = to be fed up; word-for-word translation
        produces incomprehensible English (Swan & Smith 2001, Ch. "Dutch speakers",
        § Vocabulary: False friends).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using Dutch collocation patterns in English
      example_l1: Ik moet nog mijn huiswerk maken.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I must still my homework make.
      example_wrong: I still must make my homework.
      example_correct: I still have to do my homework.
      explanation: 'Transfer from L1: Using Dutch collocation patterns in English.
        Dutch uses ''maken'' (make) with homework; English uses ''do homework'' (Swan
        & Smith 2001, Ch. "Dutch speakers", § Vocabulary: False friends, ''make vs
        do'').'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I am it sat.'' (Dutch: ''Ik ben het zat'') Correct: ''I am fed up.''
      / ''I''ve had enough.'''
    - 'Wrong: ''I want to strong my English.'' (Dutch: ''Ik wil mijn Engels sterk
      maken'') Correct: ''I want to strengthen my English.'''
    - 'Wrong: ''He made a photo.'' (Dutch: ''Hij maakte een foto'') Correct: ''He
      took a photo.'''
    why_it_happens: 'Dutch has many fixed expressions and collocations that don''t
      translate literally to English. Dutch learners may translate these expressions
      word-for-word, producing errors like ''I am it sat'' (Ik ben het zat = I am
      fed up) or ''I want to strong my English'' (Ik wil mijn Engels sterk maken =
      I want to strengthen my English). McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: Explain that every language has fixed expressions that can't
        be translated word-for-word. Make a list of common Dutch expressions and their
        English equivalents. Emphasize that these must be learned as whole chunks.
      where_to_start: 'Begin with the most common Dutch-to-English false friend expressions:
        ''sterk maken'' = strengthen, ''een foto maken'' = take a photo, ''zat zijn''
        = be fed up.'
      sequencing: 'Week 1: Common Dutch-English false friend expressions. Week 2:
        Collocation patterns (make/take/do). Week 3: Idiomatic expressions. Week 4:
        Practice in context.'
      exercises:
      - name: Dutch Expression -> English Equivalent Matching
        type: matching
        description: '15 Dutch fixed expressions. Students match each with the correct
          English equivalent. Duration: 10 minutes.'
        duration: 10
      - name: Literal Translation Error Correction
        type: error-correction
        description: '10 English sentences with literal Dutch translations. Students
          identify and correct. Duration: 10 minutes.'
        duration: 10
      - name: Make/Take/Do Collocation Sort
        type: matching
        description: '20 activities. Students sort by whether they use ''make,'' ''take,''
          or ''do.'' Duration: 10 minutes.'
        duration: 10
      - name: Idiom Story Creation
        type: composition
        description: 'Students write a short story using 5 English idioms that have
          different Dutch equivalents. Duration: 15 minutes.'
        duration: 15
