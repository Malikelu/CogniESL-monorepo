  present_simple_vs_continuous:
    interference_patterns:
    - pattern: Using present simple for ongoing actions (Dutch has no continuous aspect)
      example_l1: Ik woonde in London op dat punt in mijn leven.
      frequency: 5
      persistence: 4
      communicative_impact: 2
      example_gloss: I lived in London at that point in my life.
      example_wrong: I lived in London at that point in my life.
      example_correct: I was living in London at that point in my life.
      explanation: 'Transfer from L1: Using present simple for ongoing actions. Dutch
        has no progressive verb forms and uses simple tenses for both habitual and
        ongoing actions (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Time,
        tense and aspect, D. Aspect).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'aan het + infinitive' and translating literally
      example_l1: Ik heb op dit moment veel problemen met John.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: I have at the moment much problems with John.
      example_wrong: I have a lot of trouble with John at the moment.
      example_correct: I am having a lot of trouble with John at the moment.
      explanation: 'Transfer from L1: Dutch uses the present tense for ongoing situations
        where English requires progressive. Dutch can use ''aan het + infinitive''
        as a lexical strategy but it is not a grammatical aspect (Swan & Smith 2001,
        Ch. "Dutch speakers", § Grammar: Time, tense and aspect, D. Aspect).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Overusing present simple for temporary situations
      example_l1: Waar was je gisteren mee bezig?
      frequency: 3
      persistence: 3
      communicative_impact: 1
      example_gloss: What were you yesterday with busy?
      example_wrong: What were you busy with yesterday?
      example_correct: What were you doing yesterday?
      explanation: 'Transfer from L1: Dutch expresses progressive meaning with adjectives
        and adverbs (''bezig zijn met'' = to be busy with) rather than verb morphology.
        English grammatically marks the progressive with be + -ing (Swan & Smith 2001,
        Ch. "Dutch speakers", § Grammar: Time, tense and aspect, D. Aspect).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I eat dinner now.'' (Dutch: ''Ik eet nu avondeten'') Correct: ''I
      am eating dinner now.'''
    - 'Wrong: ''She reads a book at the moment.'' (Dutch: ''Ze leest op dit moment
      een boek'') Correct: ''She is reading a book at the moment.'''
    - 'Wrong: ''I am at cooking.'' (Dutch: ''Ik ben aan het koken'') Correct: ''I
      am cooking.'''
    why_it_happens: 'Dutch has no grammatical continuous/progressive aspect. Dutch
      uses the simple present for both habitual and ongoing actions. Dutch CAN express
      ongoing action with ''aan het + infinitive'' (''Ik ben aan het lezen''), but
      this is a lexical strategy, not a grammatical aspect. English grammatically
      marks the continuous with ''be + -ing.'' McManus (2022): The L1 is always active
      during L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'English has TWO present tenses: Simple (habits, facts) and
        Continuous (happening NOW). Dutch has ONE. Address ''aan het'': ''Ik ben aan
        het lezen'' = ''I am reading'' (NOT ''I am at reading'').'
      where_to_start: 'Begin with the most common error: using simple present for
        actions happening now. Give 10 sentences with ''now,'' ''at the moment,''
        ''right now.'''
      sequencing: 'Week 1: Present Continuous for actions happening now. Week 2: Contrast
        with Present Simple for habits. Week 3: Stative verbs that DON''T use continuous.
        Week 4: Dutch ''aan het'' construction.'
      exercises:
      - name: Now or Always? Tense Choice
        type: fill-in-the-blank
        description: '20 sentences with time markers. Students choose between Present
          Simple and Present Continuous. Duration: 15 minutes.'
        duration: 15
      - name: Aan Het Translation Correction
        type: error-correction
        description: '10 English sentences with literal ''aan het'' translations.
          Students correct each one. Duration: 10 minutes.'
        duration: 10
      - name: 'Picture Description: What''s Happening Now?'
        type: oral-drill
        description: 'Show a busy scene picture. Students describe what people are
          doing using Present Continuous. Duration: 15 minutes.'
        duration: 15
      - name: 'Habit vs. Now: Sentence Pairs'
        type: sentence-rewrite
        description: '8 sentences in Present Simple. Students write a pair for each:
          one habit, one happening now. Duration: 15 minutes.'
        duration: 15
    sources:
