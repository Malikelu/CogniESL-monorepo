  perfectum_vs_imperfectum:
    interference_patterns:
    - pattern: Overuse of present perfect for completed past actions (Dutch perfectum
        is the default past tense)
      example_l1: Ik heb hem gisteren gezien.
      frequency: 5
      persistence: 4
      communicative_impact: 2
      example_gloss: I have him yesterday seen.
      example_wrong: I have seen him yesterday.
      example_correct: I saw him yesterday.
      explanation: 'Transfer from L1: Overuse of present perfect for completed past
        actions. Dutch uses the perfectum as the default past tense even with specific
        time references; English requires simple past (Swan & Smith 2001, Ch. "Dutch
        speakers", § Grammar: Time, tense and aspect, A. Past time).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using present perfect with specific past time references
      example_l1: Al mijn negentiende-eeuwse voorouders hebben hier gewoond.
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: All my nineteenth-century ancestors have here lived.
      example_wrong: All my nineteenth-century ancestors have lived here.
      example_correct: All my nineteenth-century ancestors lived here.
      explanation: 'Transfer from L1: Using present perfect with specific past time
        references. Dutch can use perfectum for past events without English present-perfect
        nuance (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Time, tense and
        aspect, A. Past time).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Underuse of present perfect for ongoing/relevant-to-present situations
      example_l1: Ik ken hem vijf jaar.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: I know him five years.
      example_wrong: I know him for five years.
      example_correct: I have known him for five years.
      explanation: 'Transfer from L1: Underuse of present perfect for ongoing/relevant-to-present
        situations. Dutch uses present tense for states continuing into the present;
        English requires present perfect (Swan & Smith 2001, Ch. "Dutch speakers",
        § Grammar: Time, tense and aspect, B. Present time).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I have seen that movie last week.'' (Dutch: ''Ik heb die film vorige
      week gezien'') Correct: ''I saw that movie last week.'''
    - 'Wrong: ''I live here since 2018.'' (Dutch: ''Ik woon hier sinds 2018'') Correct:
      ''I have lived here since 2018.'''
    - 'Wrong: ''I am here for 3 years.'' (Dutch: ''Ik ben hier 3 jaar'') Correct:
      ''I have been here for 3 years.'''
    why_it_happens: 'The Dutch perfectum functions as the default past tense in spoken
      Dutch, even with specific time references. English strictly requires simple
      past with specific time references. Conversely, Dutch uses the present tense
      for ongoing situations where English requires present perfect. This creates
