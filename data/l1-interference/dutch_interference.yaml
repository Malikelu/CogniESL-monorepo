  diminutives_nl:
    interference_patterns:
    - pattern: 'Overusing English -y/-ie diminutive forms based on Dutch -tje/-je pattern'
      frequency: 3
      persistence: 3
      communicative_impact: 1
      example_wrong: 'doggie is so cute (where standard English would use dog)'
      example_correct: 'the dog is so cute'
      explanation: 'Transfer from L1: Dutch diminutives (-tje, -je, -etje, -pje, -kje) are extremely frequent and semantically express a wide range of attitudes beyond small — affection, irony, condescension. The basic suffix -tje has variants -je (after obstruents), -etje (after liquids/nasals), -pje/-kje (assimilated). Dutch learners may overuse English diminutive forms (-y/-ie) because the Dutch diminutive is used far more broadly. (source 5).'
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: 'Forming English diminutives with incorrect or non-standard suffixes'
      frequency: 2
      persistence: 2
      communicative_impact: 1
      example_wrong: 'catty or horsie'
      example_correct: 'kitten or foal'
      explanation: 'Transfer from L1: Dutch has a productive and regular diminutive system applying to nearly all nouns (ei-eitje, aap-aapje, man-mannetje, maan-maantje, raam-raampje). English has no equivalent productive diminutive system — each lexical item is separate. Dutch learners may apply the Dutch rule of systematic diminutive formation to English, creating forms that do not exist. (source 5).'
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: 'Using diminutives with negative or pragmatic meanings not applicable in English'
      frequency: 2
      persistence: 2
      communicative_impact: 1
      example_wrong: 'big-ie for ironic large object'
      example_correct: 'huge'
      explanation: 'Transfer from L1: Dutch diminutives express negative and condescending attitudes in addition to the basic small meaning (e.g., mannetje can be diminutive or condescending). A variant -ie form is very common in spoken Dutch (meisje-meissie). Dutch learners may map these pragmatic nuances onto English -y/-ie suffixes that carry different connotations. (source 5).'
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    examples:
    - 'Dutch: ei-eitje (egg), aap-aapje (monkey), man-mannetje (man), koning-koninkje (king)'
    - 'Spoken Dutch -ie variant: meisje-meissie (girl)'
    - 'Adverb formation: zachtjes (softly), bleekjes (somewhat pale)'
    why_it_happens: 'The Dutch diminutive is one of the few really productive derivational suffixes of the modern language. Diminutives are very frequent and express negative attitudes (irony, condescension) besides the positive ones. English has no equivalent productive system — English diminutives (doggie, kitty) are lexical, not grammatical. Dutch learners may over-apply English -y/-ie suffixes to semantic contexts where they do not belong. (source 5).'
    teacher_tips:
      how_to_explain: 'Dutch has a mechanical rule: add -tje/-je to almost any noun to make it small/cute. English does not work this way — each animal has a separate word for its baby (kitten, puppy, calf). The -y/-ie ending in English is limited to a few informal words and does not productively create new ones. (source 5).'
      where_to_start: 'Start with animal vocabulary: Dutch auto-auto-tje English car (no diminutive). Show that English uses separate lexical items, not suffixation.'
      sequencing: 'Week 1: Dutch diminutive system overview. Week 2: English baby animals (kitten, puppy, foal, calf). Week 3: Informal English -y/-ie words. Week 4: Pragmatic differences (when diminutives are rude in English).'
      exercises:
      - name: 'Dutch-English Diminutive Translation'
        type: translation
        description: '15 Dutch nouns with their diminutives. Students translate both the base and diminutive, learning that English often needs two separate words. Duration: 15 minutes.'
        duration: 15
      - name: 'Diminutive or Full Form? Context Choice'
        type: fill-in-the-blank
        description: '10 sentences where students choose between informal diminutive form and standard English. Duration: 10 minutes.'
        duration: 10
    sources:
    - 'Kooij, J.G. (ed. Comrie, B.) (1990). Dutch, Ch.5 in The World''s Major Languages. London: Routledge.'
