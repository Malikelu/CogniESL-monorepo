  subjunctive_relict_nl:
    interference_patterns:
    - pattern: Using archaic subjunctive forms based on Dutch subjunctive remnants
      example_l1: God ziele hem.
      frequency: 1
      persistence: 1
      communicative_impact: 1
      example_gloss: God soul him.
      example_wrong: God soul him. (attempting archaic English)
      example_correct: God rest his soul.
      explanation: 'Transfer from L1: Using archaic subjunctive forms based on Dutch
        subjunctive remnants. Retained phrases (''God ziele hem,'' ''were hi alive'')
        may transfer to incorrect archaic English (Swan & Smith 2001, Ch. "Dutch speakers",
        § Grammar: General).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'were' incorrectly based on Dutch 'waren' (past tense of 'zijn')
      example_l1: Als ik hem zou zien, zou ik het hem vertellen.
      frequency: 3
      persistence: 2
      communicative_impact: 1
      example_gloss: If I him should see, should I it him tell.
      example_wrong: If I shall see him, I shall tell him.
      example_correct: If I see him, I will tell him.
      explanation: 'Transfer from L1: Dutch uses the equivalents of shall/should/would
        in conditional subclauses where English uses present tense. Dutch past tenses
        in hypotheticals transfer to English was instead of were (Swan & Smith 2001,
        Ch. "Dutch speakers", § Grammar: Conditionals, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''If I was rich...'' (informal; formal requires ''were'') Correct: ''If
      I were rich...'''
    - 'Wrong: ''I wish I was taller.'' (informal) Correct: ''I wish I were taller.''
      (formal)'
    why_it_happens: 'Dutch has largely lost its subjunctive mood, retaining only archaic
      remnants. However, Dutch uses the simple past tense (''was'') in hypothetical
      conditional sentences where English traditionally requires the subjunctive (''were'').
      Dutch learners therefore use ''was'' in formal hypothetical contexts where ''were''
      is expected. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Explain that English has a ''special past tense'' for unreal/hypothetical
        situations: ''If I WERE rich'' (not ''was''). Dutch uses the normal past tense
        (''was'') in these contexts. Note that ''was'' is widely accepted in informal
        English but ''were'' is expected in formal writing.'
      where_to_start: 'Begin with the most common context: ''If I were...'' (second
        conditional). Show that Dutch ''Als ik was...'' maps to English ''If I WERE...''
        (not ''was'').'
      sequencing: 'Week 1: Second conditional with ''were.'' Week 2: ''I wish I were...''
        and ''If only I were...'' Week 3: Formal vs. informal register. Week 4: Other
        subjunctive remnants.'
      exercises:
      - name: Was or Were? Hypothetical Judgment
        type: fill-in-the-blank
        description: '15 hypothetical sentences. Students choose between ''was'' and
          ''were.'' Duration: 10 minutes.'
        duration: 10
      - name: Second Conditional Translation
        type: translation
        description: '10 Dutch hypothetical sentences. Students translate into English
          using ''were.'' Duration: 15 minutes.'
        duration: 15
      - name: Formal vs. Informal Subjunctive
        type: sentence-rewrite
        description: '8 sentences using ''was'' in hypothetical contexts. Students
          rewrite for formal register using ''were.'' Duration: 10 minutes.'
        duration: 10
      - name: Subjunctive Recognition in Texts
        type: practice
        description: 'Students read a short text and identify all subjunctive forms.
          Duration: 15 minutes.'
        duration: 15
    sources:
    - Swan, M. & Smith, B. (2001). Learner English. Cambridge University Press.
    - 'Donaldson, B. (2008). Dutch: A Comprehensive Grammar. Routledge.'
    - Huddleston, R. & Pullum, G. (2002). The Cambridge Grammar of the English Language.
      Cambridge University Press.
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
