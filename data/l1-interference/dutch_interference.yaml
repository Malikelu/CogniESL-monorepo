  infinitive_clusters:
    interference_patterns:
    - pattern: Using bare infinitive after 'like', 'want', 'prefer' (Dutch uses bare
        infinitive)
      example_l1: Hij wil dat ik ga.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: He wants that I go.
      example_wrong: He wants that I go.
      example_correct: He wants me to go.
      explanation: 'Transfer from L1: Using bare infinitive or ''that + clause'' after
        verbs of wanting. Dutch uses ''dat + clause'' where English uses object +
        to-infinitive (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Non-finite
        forms, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'that + clause' instead of 'object + to-infinitive'
      example_l1: Ik heb altijd graag daarheen gegaan.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: I have always gladly there-to gone.
      example_wrong: I've always been glad to go there.
      example_correct: I've always loved going there.
      explanation: 'Transfer from L1: Dutch substitutes that-clauses or adjectival
        constructions for English infinitives and gerunds. Dutch has no equivalent
        of the English gerund (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
        Non-finite forms, points 1-2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using infinitive where English requires gerund
      example_l1: Ik zie uit naar van u te horen.
      frequency: 3
      persistence: 3
      communicative_impact: 1
      example_gloss: I look forward to from you to hear.
      example_wrong: I look forward to hear from you.
      example_correct: I look forward to hearing from you.
      explanation: 'Transfer from L1: Using infinitive where English requires gerund.
        Dutch has no gerund equivalent and substitutes to-infinitive, including after
        prepositions (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Non-finite
        forms, point 2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I want go.'' (Dutch: ''Ik wil gaan'') Correct: ''I want to go.'''
    - 'Wrong: ''I want that you come.'' (Dutch: ''Ik wil dat je komt'') Correct: ''I
      want you to come.'''
    - 'Wrong: ''I like eat pizza.'' (Dutch: ''Ik hou van pizza eten'') Correct: ''I
      like eating pizza.'' / ''I like to eat pizza.'''
    why_it_happens: 'Dutch uses the bare infinitive after modal-like verbs (''wil
      gaan'' = want go) where English requires the to-infinitive (''want to go'').
      Dutch also uses a ''dat + clause'' construction for verbs of wanting (''Ik wil
      dat je komt'' = I want that you come) where English uses object + to-infinitive
      (''I want you to come''). McManus (2022): The L1 is always active during L2
      use cross-language co-activation is constant. Managing L1-L2 competition requires
      inhibitory control (Green 1998 Inhibitory Control Model). This means L1 transfer
      is not a temporary phase but a permanent feature of multilingual cognition.
      Learners cannot "switch off" the L1; instead, they must develop mechanisms to
      manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Show two key differences: (1) Dutch bare infinitive after ''wil/moet/kan''
        -> English to-infinitive after ''want/must/can.'' (2) Dutch ''dat + clause''
        after verbs of wanting -> English ''object + to-infinitive.'''
      where_to_start: 'Begin with ''want + to-infinitive'' since it''s most frequent.
        Drill: ''Ik wil gaan'' -> ''I want TO gaan'' -> ''I want to go.'''
      sequencing: 'Week 1: Want/need/like + to-infinitive. Week 2: Want/ask/tell +
        object + to-infinitive. Week 3: Verbs that take gerund in English but infinitive
        in Dutch. Week 4: Mixed practice.'
      exercises:
      - name: To-Infinitive Insertion
        type: fill-in-the-blank
        description: '15 Dutch-style sentences with bare infinitives. Students add
          ''to'' where required. Duration: 10 minutes.'
        duration: 10
      - name: Dat-Clause to Object+To Transformation
        type: transformation
        description: '10 Dutch ''dat''-clauses after verbs of wanting. Students rewrite
          using English object + to-infinitive. Duration: 15 minutes.'
        duration: 15
      - name: Infinitive or Gerund? Dutch Context
        type: fill-in-the-blank
        description: '12 sentences where students choose between to-infinitive and
          gerund. Duration: 15 minutes.'
        duration: 15
      - name: Infinitive Cluster Error Correction
        type: error-correction
        description: 'A 150-word text with 8 infinitive/gerund errors. Students identify
          and correct. Duration: 15 minutes.'
        duration: 15
    sources:
