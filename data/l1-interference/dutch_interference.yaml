  verb_final_subordinate:
    interference_patterns:
    - pattern: Placing the verb at the end of subordinate clauses (Dutch SOV order)
      example_l1: Ik denk dat hij het boek gelezen heeft.
      frequency: 5
      persistence: 5
      communicative_impact: 3
      example_gloss: I think that he the book read has.
      example_wrong: I think that he the book read has.
      example_correct: I think that he has read the book.
      explanation: 'Transfer from L1: Placing the verb at the end of subordinate clauses
        (Dutch SOV order). In Dutch subordinate clauses, all verbs go to the end;
        English maintains SVO order (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
        Word order, B. Subclause).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Placing the past participle at the end of the clause after the auxiliary
      example_l1: Ik heb het boek gelezen.
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: I have the book read.
      example_wrong: I have the book read.
      example_correct: I have read the book.
      explanation: 'Transfer from L1: Placing the past participle at the end of the
        clause after the auxiliary. Dutch places the past participle at clause end
        after the auxiliary; English keeps auxiliary and participle together before
        the object (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Word order,
        A.2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Placing all verbs at the end of subordinate clauses in clusters
      example_l1: Ik moet mijn zus meteen zien.
      frequency: 4
      persistence: 5
      communicative_impact: 3
      example_gloss: I must my sister at once see.
      example_wrong: I must at once my sister see.
      example_correct: I must see my sister at once.
      explanation: 'Transfer from L1: Placing all verbs at the end of subordinate
        clauses in clusters. Dutch finite verb group separates from infinitives/participles,
        which go to clause end; English keeps the verbal group together (Swan & Smith
        2001, Ch. "Dutch speakers", § Grammar: Word order, A.2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I think that he the book has read.'' (Dutch: ''Ik denk dat hij het
      boek gelezen heeft'') Correct: ''I think that he has read the book.'''
