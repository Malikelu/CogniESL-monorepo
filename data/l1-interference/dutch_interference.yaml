  prepositions_en:
    interference_patterns:
    - pattern: Direct translation of Dutch prepositions that don't match English
      example_l1: Ik wacht op de bus.
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_gloss: I wait on the bus.
      example_wrong: I wait on the bus.
      example_correct: I am waiting for the bus.
      explanation: 'Transfer from L1: Direct translation of Dutch prepositions that
        don''t match English. Dutch uses ''op'' where English uses ''for'' (wachten
        op = wait for) (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Prepositions).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using wrong preposition with verbs of motion
      example_l1: Hij woont op nummer 9.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: He lives on number 9.
      example_wrong: He lives on number 9.
      example_correct: He lives at number 9.
      explanation: 'Transfer from L1: Using wrong preposition with verbs of motion
        and location. Dutch uses ''op'' for both location and direction where English
        distinguishes ''at'' (location) from ''to'' (direction) (Swan & Smith 2001,
        Ch. "Dutch speakers", § Grammar: Prepositions).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using wrong preposition with time expressions
      example_l1: Ik woon hier sinds vier jaar.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: I live here since four years.
      example_wrong: I've lived here since four years.
      example_correct: I've lived here for four years.
      explanation: 'Transfer from L1: Using wrong preposition with time expressions.
        Dutch ''sinds'' translates as either ''for'' or ''since''; learners tend to
        use ''since'' only (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Prepositions,
        point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omitting prepositions where English requires them
      example_l1: Ik luister muziek.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: I listen music.
      example_wrong: I listen music.
      example_correct: I listen to music.
      explanation: 'Transfer from L1: Omitting prepositions where English requires
        them. Dutch ''luisteren'' takes a direct object; English ''listen'' requires
        ''to'' (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Prepositions).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I wait on the bus.'' (Dutch: ''Ik wacht op de bus'') Correct: ''I
      am waiting for the bus.'''
    - 'Wrong: ''I listen music.'' (Dutch: ''Ik luister muziek'') Correct: ''I listen
      to music.'''
    - 'Wrong: ''I am good in math.'' (Dutch: ''Ik ben goed in wiskunde'') Correct:
      ''I am good at math.'''
    - 'Wrong: ''She married with him.'' (Dutch: ''Ze trouwde met hem'') Correct: ''She
      married him.'''
    why_it_happens: 'Dutch and English prepositions rarely map 1:1 despite both being
      Germanic. Dutch uses ''op'' where English uses ''for'' (wachten op = wait for),
      ''in'' where English uses ''at'' (goed in = good at), and ''met'' where English
      uses no preposition (trouwen met = marry). Some Dutch verbs take no preposition
