  modal_verbs_nl:
    interference_patterns:
    - pattern: Using 'must' for past obligation (Dutch 'moeten' doesn't change form)
      example_l1: Ik moest naar Londen gisteren.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I must (past) to London yesterday.
      example_wrong: I must go to London yesterday.
      example_correct: I had to go to London yesterday.
      explanation: 'Transfer from L1: Using ''must'' for past obligation. Dutch moest
        is the past tense of moeten, but English ''must'' has no past form; ''had
        to'' is required (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Modal
        verbs, point 2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'to' after modal verbs (confusion with Dutch 'te + infinitive')
      example_l1: Ik kan zwemmen.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: I can swim.
      example_wrong: I can to swim.
      example_correct: I can swim.
      explanation: 'Transfer from L1: Using ''to'' after modal verbs. Dutch modals
        (kunnen, moeten, mogen, willen, zullen) take bare infinitive, but Dutch also
        has ''te + infinitive'' after other verbs, causing confusion about English
        bare-infinitive rule after modals (Swan & Smith 2001, Ch. "Dutch speakers",
        § Grammar: Modal verbs, points 1-6).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Overusing 'shall' (Dutch 'zal' is broader than English 'shall')
