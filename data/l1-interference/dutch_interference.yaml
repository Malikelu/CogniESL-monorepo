  countability_en:
    interference_patterns:
    - pattern: Using plural -s with uncountable nouns (Dutch has different countability
        assignments)
      example_l1: geef me twee broodjes, alstublieft
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: give me two breads-DIM please
      example_wrong: Give me two breads, please.
      example_correct: Give me two loaves of bread, please. / Give me two rolls, please.
      explanation: 'Transfer from L1: Using plural -s with uncountable nouns. Dutch
        has different countability assignments; some nouns countable in Dutch are
        uncountable in English (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
        Countability and number, point 3).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'many' with uncountable nouns that are countable in Dutch
      example_l1: Ik heb veel informatie nodig.
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: I have much/many information need.
      example_wrong: I have many informations.
      example_correct: I have a lot of information.
      explanation: 'Transfer from L1: Using ''many'' with uncountable nouns that are
        countable in Dutch. Dutch does not use different quantifiers with countable
        and uncountable nouns (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
