  er_construction:
    interference_patterns:
    - pattern: Using 'there' where English requires a different structure
      example_l1: Er lagen twaalf boeken op zijn nachtkastje.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: There lay twelve books on his night table.
