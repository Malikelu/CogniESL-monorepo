  relative_clause_order:
    interference_patterns:
    - pattern: Using 'what' as a relative pronoun (Dutch 'wat' used after indefinites)
      example_l1: John ging naar Brussel, wat alles verklaart.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: John went to Brussels, what explains everything.
      example_wrong: John went to Brussels, what explains everything.
      example_correct: John went to Brussels, which explains everything.
      explanation: 'Transfer from L1: Using ''what'' as a relative pronoun. Dutch
        ''wat'' has much wider coverage than English what; it is used with clause
        antecedents, quantifier antecedents, and neuter nouns where English requires
        which (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Relative pronouns,
        point 3).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'which' for people (Dutch 'die' covers both people and things)
      example_l1: Een persoon die...
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: A person who/which...
      example_wrong: A person which...
      example_correct: A person who/that...
      explanation: 'Transfer from L1: Using ''which'' for people. Dutch does not have
        different relative pronouns for people and things (die/dat), leading to use
        of which with personal antecedents (Swan & Smith 2001, Ch. "Dutch speakers",
        § Grammar: Relative pronouns, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omitting relative pronoun where English requires it
      example_l1: De technologie waar hij op vertrouwde bleek onbetrouwbaar.
      frequency: 2
      persistence: 2
      communicative_impact: 1
      example_gloss: The technology where he on relied proved untrustworthy.
      example_wrong: The technology where he had relied on proved to be untrustworthy.
      example_correct: The technology (that/which) he had relied on proved to be untrustworthy.
      explanation: 'Transfer from L1: Dutch uses ''where-'' compounds (waarop, waarmee)
        as relative pronouns with prepositions, which learners may translate as English
        ''where'' + preposition. Contact clauses and preposition-stranding are unknown
        in Dutch (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Relative pronouns,
        points 4-5).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: B
    examples:
    - 'Wrong: ''The book what I read.'' (Dutch: ''Het boek dat ik las'' — but ''wat''
      used in some contexts) Correct: ''The book that I read.'''
    - 'Wrong: ''The man which speaks.'' (Dutch: ''De man die spreekt'') Correct: ''The
      man who speaks.'' / ''The man that speaks.'''
    - 'Wrong: ''Everything what I saw.'' (Dutch: ''Alles wat ik zag'') Correct: ''Everything
      that I saw.'''
    why_it_happens: 'Dutch relative pronouns (die, dat, wat) have different distributions
      from English (who, which, that). Dutch ''die'' is used for both people and things
      in certain contexts, leading to ''which'' for people. Dutch ''wat'' is used
      as a relative pronoun after indefinite pronouns (''alles wat'' = everything
      that), which learners may translate as ''what.'' McManus (2022): The L1 is always
      active during L2 use cross-language co-activation is constant. Managing L1-L2
      competition requires inhibitory control (Green 1998 Inhibitory Control Model).
      This means L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Show the key differences: (1) Dutch ''die'' for people -> English
        ''who'' (not ''which''). (2) Dutch ''wat'' after indefinites -> English ''that''
        (not ''what''). (3) English ''who'' for people, ''which'' for things, ''that''
        for both.'
      where_to_start: 'Begin with the ''who vs. which'' distinction. Drill: ''De man
        die...'' -> ''The man WHO...'' (NOT ''which'').'
      sequencing: 'Week 1: Who/which/that distinction. Week 2: ''What'' vs. ''that''
        after indefinite pronouns. Week 3: Restrictive vs. non-restrictive relative
        clauses. Week 4: Omitting relative pronouns.'
      exercises:
      - name: Who, Which, or That? Relative Pronoun Choice
        type: fill-in-the-blank
        description: '15 sentences with blanks. Students choose the correct relative
          pronoun. Duration: 10 minutes.'
        duration: 10
      - name: What vs. That After Indefinites
        type: error-correction
        description: '10 sentences with ''what'' used incorrectly after indefinite
          pronouns. Students correct to ''that.'' Duration: 10 minutes.'
        duration: 10
      - name: Relative Clause Translation
        type: translation
        description: '12 Dutch relative clauses. Students translate into English.
          Duration: 15 minutes.'
        duration: 15
      - name: Relative Pronoun Error Correction
        type: error-correction
        description: 'A 150-word text with 8 relative pronoun errors. Students identify
          and correct. Duration: 15 minutes.'
        duration: 15
