  dt_error:
    interference_patterns:
    - pattern: Omitting articles where English requires them (Dutch article-omission
        patterns)
      example_l1: Zij is professor, Buddhist en Zweedse.
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_gloss: She is professor, Buddhist and Swede.
      example_wrong: She is professor, Buddhist and Swede.
      example_correct: She is a professor, a Buddhist and a Swede.
      explanation: 'Transfer from L1: Omitting articles where English requires them.
        Dutch has no indefinite article in subject complements with countable nouns
        denoting profession, occupation, status, religion or nationality (Swan & Smith
        2001, Ch. "Dutch speakers", § Grammar: Articles, point 2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'a/an' with uncountable nouns based on Dutch gender assignment
      example_l1: een advies
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: an advice
      example_wrong: I need an advice.
      example_correct: I need some advice.
      explanation: 'Transfer from L1: Using ''a/an'' with uncountable nouns based
        on Dutch gender assignment. Dutch distinguishes countable/uncountable differently
        from English (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Countability
        and number, point 3).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using articles with proper nouns based on Dutch patterns
      example_l1: naar de kerk gaan
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: to go to the church
      example_wrong: to go to the church (meaning attending a service)
      example_correct: to go to church
      explanation: 'Transfer from L1: Using articles with proper nouns based on Dutch
        patterns. Dutch uses the article with church/school/prison/bed even for their
        primary activity meaning; English omits it (Swan & Smith 2001, Ch. "Dutch
        speakers", § Grammar: Articles, point 3).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I am teacher.'' (Dutch: ''Ik ben leraar'') Correct: ''I am a teacher.'''
    - 'Wrong: ''I need a advice.'' (Dutch: ''Ik heb een advies nodig'') Correct: ''I
      need some advice.'''
    - 'Wrong: ''He gave me good advices.'' (Dutch: ''Hij gaf me goede adviezen'')
      Correct: ''He gave me good advice.'''
    why_it_happens: 'Dutch has two grammatical genders — common (de) and neuter (het)
      — which determine the definite article. English has no grammatical gender system.
      Dutch omits articles in certain contexts where English requires them (professions
      after ''zijn/worden'': ''Ik ben leraar'' = ''I am a teacher''). The de/het distinction
      has no English equivalent. Even advanced Dutch learners make article errors.
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Start by explaining that Dutch has two genders (de/het) while
        English has one article ''the.'' Then show the bigger problem: Dutch often
        DROPS articles where English requires them. Write: ''Ik ben leraar'' -> NOT
        ''I am teacher'' but ''I am a TEACHER.'''
      where_to_start: 'Begin with the profession/identity pattern after ''to be'':
        Dutch drops the article, English requires ''a/an.'' Drill: ''Ik ben dokter''
        -> ''I am a doctor.'''
      sequencing: 'Week 1: Articles after ''to be'' with professions. Week 2: Indefinite
        article with countable nouns. Week 3: Zero article with uncountables. Week
        4: Definite article ''the.'''
