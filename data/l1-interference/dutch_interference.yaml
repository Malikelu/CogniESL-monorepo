  vowel_system_nl:
    interference_patterns:
    - pattern: "Confusing English vowel quality distinctions with Dutch vowel length system"
      frequency: 3
      persistence: 3
      communicative_impact: 1
      example_wrong: "the man (with Dutch-style short /a/ not English /æ/)"
      example_correct: "the man [ðə mæn]"
      explanation: "Transfer from L1: Dutch vowel system uses length as the primary distinction (maan vs man, boos vs bos, veel vs vel) whereas English uses vowel quality changes. Dutch learners may not perceive the English /æ/-/ɑː/ or /ɪ/-/iː/ distinctions because Dutch relies on length, not quality shifts. (source 5)."
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: "Mispronouncing English diphthongs using Dutch equivalents (ui [œʏ], ij/ei [eɪ])"
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_wrong: "house with Dutch [œʏ] (huis-like) instead of [aʊ]"
      example_correct: "house [haʊs]"
      explanation: "Transfer from L1: Dutch diphthongs [eɪ] (spelled ij/ei) and [œʏ] (ui) differ from English [eɪ] and [aʊ]. Dutch [eɪ] tends more open than English [eɪ]; Dutch [œʏ] has no English equivalent and is often mapped variably. (source 5)."
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: "Substituting full vowels for English schwa in unstressed syllables"
      frequency: 3
      persistence: 2
      communicative_impact: 1
      example_wrong: "water [ˈvatər] with full [a] not schwa [ə]"
      example_correct: "water [ˈwɔːtə]"
      explanation: "Transfer from L1: Dutch unstressed vowels are often reduced but not in word-final position. Dutch learners may not fully reduce English unstressed vowels to schwa, leading to over-clear unstressed syllables. Dutch has no exact equivalent of English schwa distribution. (source 5)."
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    examples:
    - "Dutch huis [hœʏs] mapped to English house [haʊs] — different diphthong quality"
    - "Dutch maan [maːn] vs man [man] — length distinction English learners must reinterpret as quality"
    why_it_happens: "Dutch has 16+ vowel phonemes including rounded front vowels (y, ʏ, œ) not found in English. The Dutch length-based vowel system contrasts with English quality-based distinctions. Dutch schwa occurs in a more restricted distribution than English, creating mapping difficulties. The Dutch vowel system is 'somewhat more complex' than English (source 5)."
    teacher_tips:
      how_to_explain: "Dutch uses vowel LENGTH as a key distinction; English uses QUALITY more. Minimal pairs: Dutch maan-man (length) vs English man-men (quality). Dutch has rounded front vowels (ui, uu) that map to different English sounds. (source 5)."
      where_to_start: "Start with the ui/uu mismatch: Dutch huis [hœʏs] sounds to English ears like 'hoyce' not 'house.' Then address the ij/ei vs English face/nice vowels."
      sequencing: "Week 1: Dutch diphthongs ui ≠ English ou/ow. Week 2: ij/ei vs English vowels. Week 3: Vowel length contrasts. Week 4: Schwa in unstressed syllables."
      exercises:
      - name: "Minimal Pair Listening: Dutch vs English Vowels"
        type: listening
        description: "12 word pairs contrasting Dutch-origin mispronunciations with correct English vowels. Students identify the correct pronunciation. Duration: 15 minutes."
        duration: 15
      - name: Diphthong Mapping Drill
        type: pronunciation
        description: "Students receive 10 Dutch words with ui/ij/eu and learn the correct English vowel for equivalent English words. Duration: 10 minutes."
        duration: 10
    sources:
    - "Kooij, J.G. (ed. Comrie, B.) (1990). 'Dutch', Ch.5 in The World's Major Languages. London: Routledge."
