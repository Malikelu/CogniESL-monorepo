  articles_advanced:
    interference_patterns:
    - pattern: Definite article overgeneralization
      example_l1: naar school gaan
      example_gloss: to school go
      example_wrong: I went to the school.
      example_correct: I went to school.
      explanation: Dutch uses definite articles in contexts where English omits them
        (school, church, bed).
      frequency: 4
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Article omission with abstract nouns
      example_l1: het leven in het moderne Brittannië
      example_gloss: the life in the modern Britain
      example_wrong: the life in modern Britain
      example_correct: life in modern Britain
      explanation: Dutch may use articles with abstract nouns where English omits
        them.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    why_it_happens: 'Dutch article usage differs from English in several contexts,
      leading to overgeneralization or omission errors. Golden et al. (2017, Ch. 6)
      found that Dutch learners of Norwegian — despite having a gender system (common/neuter)
      — did not show a clear advantage in L2 Norwegian gender assignment. Having L1
      gender is helpful but the specific gender mappings must still be learned, and
      Dutch two-gender system does not directly map to Norwegian three-gender system.
      McManus (2022) explains that L2 speakers can learn new form-meaning mappings
      that don''t exist in L1, but this requires extensive practice to become automatic.
      L2 learning involves creating new knowledge when L1-L2 differences exist AND
      developing selection mechanisms to manage competing knowledge sources (McManus
      2022, Ch. 1). Online anticipatory processing develops only with high proficiency
      and extended exposure. Odlin (Ch.2): "Transfer" term predates behaviorism (Whitney
      1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity, entrenchment
      — explain transfer patterns. Weinreich and Lado both focused on crosslinguistic
      similarities/differences; CAH (Contrastive Analysis Hypothesis) was coined by
      Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Teach: English omits articles before school, church, bed, work,
        home (when used in their primary sense).'
      where_to_start: Start with the most common article errors.
      sequencing: 'Week 1: Articles with institutions. Week 2: Articles with abstract
        nouns. Week 3: Review.'
