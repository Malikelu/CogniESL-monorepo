  dutch_vowels:
    interference_patterns:
    - pattern: Pronouncing English /ae/ (cat) as Dutch /e/
      example_l1: zit
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: sit
      example_wrong: seat pronounced as sit (/I/ too close)
      example_correct: sit with /ae/ vowel
      explanation: 'Transfer from L1: Pronouncing English /ae/ (cat) as Dutch /e/.
        Dutch has no vowel corresponding to /ae/, leading to confusion between pairs
        like set and sat or then and than (Swan & Smith 2001, Ch. "Dutch speakers",
        § Phonology: Vowels, point 2).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Pronouncing English /th/ (theta) as /t/ or /d/
      example_l1: dank
      frequency: 5
      persistence: 5
      communicative_impact: 3
      example_gloss: thank
      example_wrong: tank / tanke for thank
      example_correct: thank with dental fricative /th/
      explanation: 'Transfer from L1: Pronouncing English /th/ (theta) as /t/ or /d/.
        Dutch lacks the phoneme /th/; learners use /s/ or /t/ for theta and /z/ or
        /d/ for eth (Swan & Smith 2001, Ch. "Dutch speakers", § Phonology: Consonants,
        point 6).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Devoicing final consonants (Dutch devoices all final obstruents)
      example_l1: hond
      frequency: 4
      persistence: 5
      communicative_impact: 2
      example_gloss: dog (pronounced hont)
      example_wrong: leaf for leave / rice for rise
      example_correct: leave with final /v/ / rise with final /z/
      explanation: 'Transfer from L1: Devoicing final consonants. Dutch devoices all
        final obstruents: /b/->/p/, /d/->/t/, /v/->/f/, /z/->/s/. This leads to leaf
        for leave, rice for rise, etc. (Swan & Smith 2001, Ch. "Dutch speakers", §
        Phonology: Consonants, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I tink so.'' (Dutch: ''Ik denk so'' — no /th/) Correct: ''I think
      so.'''
    - 'Wrong: ''Dat is nice.'' (Dutch: ''Dat is leuk'' — /d/ for /th/) Correct: ''That
      is nice.'''
    - 'Wrong: ''He is a goot person.'' (Dutch: ''Het is goed'' — final devoicing)
      Correct: ''He is a good person.'''
    why_it_happens: 'Dutch phonology differs from English in several key ways. Dutch
      lacks the /ae/ vowel (as in ''cat''), the dental fricatives /th/ and /dh/ (as
      in ''think'' and ''this''), and has a systematic final devoicing rule where
      all voiced obstruents become voiceless at the end of syllables. Dutch speakers
      transfer these phonological patterns to English, producing characteristic pronunciation
      errors. These errors are highly persistent because phonological patterns are
      among the earliest acquired and most automatized aspects of language. McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Explain that Dutch and English have different sound systems.
        Focus on three key differences: (1) Dutch has no /th/ — use /t/ or /d/ instead.
        (2) Dutch has no /ae/ vowel — use /e/ instead. (3) Dutch devoices final consonants
        — ''bed'' sounds like ''bet.'' Use minimal pairs.'
      where_to_start: 'Begin with /th/ since it''s the most noticeable error. Practice
        the tongue-between-teeth position. Use minimal pairs: think/tink, this/dis.'
      sequencing: 'Week 1: /th/ sound. Week 2: /ae/ vowel. Week 3: Final devoicing.
        Week 4: Other vowel differences.'
      exercises:
      - name: Th-Sound Tongue Twisters
        type: oral-drill
        description: 'Students practice /th/ tongue twisters. Teacher monitors for
          /t/ or /d/ substitution. Duration: 10 minutes.'
        duration: 10
      - name: Minimal Pair Discrimination
        type: matching
        description: 'Students listen to 20 minimal pairs and identify which word
          they hear. Then practice producing both. Duration: 15 minutes.'
        duration: 15
      - name: Final Devoicing Awareness
        type: practice
        description: 'Students read 10 Dutch words with final voiced consonants and
          their English equivalents, practicing voicing. Duration: 10 minutes.'
        duration: 10
      - name: Pronunciation Recording and Self-Correction
        type: practice
        description: 'Students record themselves reading a passage with target sounds
          and identify their own errors. Duration: 15 minutes.'
        duration: 15
