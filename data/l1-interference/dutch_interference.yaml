  reflexive_van:
    interference_patterns:
    - pattern: Using reflexive pronouns where English doesn't require them
      example_l1: Hij scheert zich nooit nadat hij zich gewassen heeft.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: He shaves himself never after he himself washed has.
      example_wrong: He never shaves himself after he has washed himself.
      example_correct: He never shaves after he has washed.
      explanation: 'Transfer from L1: Using reflexive pronouns where English doesn''t
        require them. Dutch overuses reflexive pronouns with ''middle verbs'' (intransitive
        verbs for things people do to themselves) where English uses simple intransitives
        (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Reflexive pronouns).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omitting reflexive pronouns where English requires them
      example_l1: Wij vervelen ons.
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: We bore ourselves.
      example_wrong: We bore ourselves.
      example_correct: We are bored. / We get bored.
      explanation: 'Transfer from L1: Dutch reflexive verbs (zich vervelen = to be
        bored) correspond to non-reflexive English verbs. Dutch has more reflexive
        verbs than English (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Reflexive
        pronouns).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using body part constructions with possessive meaning
      example_l1: Zij vergat zichzelf.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: She forgot herself.
      example_wrong: She forgot herself.
      example_correct: She was absent-minded. / She forgot things.
      explanation: 'Transfer from L1: Dutch reflexive constructions often do not map
        to English reflexive forms. Dutch zich vergeten means ''to be absent-minded,''
        not ''to forget oneself'' (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
        Reflexive pronouns).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''I bore myself.'' (Dutch: ''Ik verveel me'' = I am bored) Correct:
      ''I am bored.'''
    - 'Wrong: ''I enjoy very much.'' (Dutch: ''Ik vermaak me erg'') Correct: ''I enjoy
      myself very much.'' / ''I have a great time.'''
    - 'Wrong: ''He hurt.'' (Dutch: ''Hij verwondde zich'') Correct: ''He hurt himself.'''
    why_it_happens: 'Dutch has a larger set of reflexive verbs than English. Many
      Dutch reflexive verbs correspond to non-reflexive English verbs: ''zich vervelen''
      = ''to be bored,'' ''zich vermaken'' = ''to enjoy oneself,'' ''zich herinneren''
      = ''to remember.'' Conversely, some Dutch verbs can optionally drop the reflexive
      pronoun where English requires it. McManus (2022): The L1 is always active during
      L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Show that Dutch has MORE reflexive verbs than English. Make
        a list: ''zich vervelen'' = ''to be bored'' (no reflexive), ''zich vermaken''
        = ''to enjoy oneself'' (reflexive).'
      where_to_start: 'Begin with Dutch reflexive verbs that are NOT reflexive in
        English: zich vervelen (be bored), zich voelen (feel), zich herinneren (remember).'
      sequencing: 'Week 1: Dutch reflexive verbs that are NOT reflexive in English.
        Week 2: Verbs reflexive in both languages. Week 3: Dutch reflexive verbs with
        no direct English equivalent. Week 4: Practice in context.'
      exercises:
      - name: Reflexive or Not? Dutch-English Verb Matching
        type: matching
        description: '20 Dutch reflexive verbs. Students find the correct English
          equivalent. Duration: 15 minutes.'
        duration: 15
      - name: Reflexive Pronoun Insertion
        type: fill-in-the-blank
        description: '12 English sentences with missing reflexive pronouns. Students
          add the correct pronoun. Duration: 10 minutes.'
        duration: 10
      - name: Daily Routine Translation
        type: translation
        description: 'Students translate a Dutch paragraph about a morning routine
          with 8 reflexive verbs. Duration: 20 minutes.'
        duration: 20
      - name: Reflexive Error Correction
        type: error-correction
        description: '10 English sentences with reflexive pronoun errors. Students
          identify and correct. Duration: 15 minutes.'
        duration: 15
