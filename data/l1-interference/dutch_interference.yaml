      example_wrong: She might go out every night when she was sixteen.
      example_correct: She was allowed to go out every night when she was sixteen.
      explanation: 'Transfer from L1: Confusion between Dutch mag/mocht and English
        may/might. Dutch mocht is the past tense of mogen (be allowed to), not the
