  passive_voice_nl:
    interference_patterns:
    - pattern: Using 'worden' (become) passive where English uses 'be' passive
      example_l1: De brief wordt geschreven.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: The letter becomes written.
      example_wrong: The letter becomes written.
      example_correct: The letter is being written.
      explanation: 'Transfer from L1: Using ''worden'' (become) passive where English
        uses ''be being''. Dutch uses worden for processual passive; English uses
        be + being + past participle (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar:
        Auxiliaries).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using 'zijn' passive for ongoing actions where English uses 'be being'
      example_l1: Het artikel is in een levendige stijl geschreven.
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: The article is in a racy style written.
      example_wrong: The article is written in a racy style.
      example_correct: The article is being written in a racy style.
      explanation: 'Transfer from L1: Using ''zijn'' passive for ongoing actions.
        Dutch ''is geschreven'' is ambiguous between state and process; English distinguishes
        ''is written'' (state) from ''is being written'' (process) (Swan & Smith 2001,
        Ch. "Dutch speakers", § Grammar: Auxiliaries).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Using present tense with past time reference in passive
      example_l1: Het rapport is gepubliceerd.
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: The report is published.
      example_wrong: The report is published (intended as past meaning).
      example_correct: The report has been published. / The report was published.
      explanation: 'Transfer from L1: Dutch speakers translate Dutch perfect passive
        (''is gepubliceerd'') as English present tense, thinking it conveys the same
        perfect meaning as Dutch. English requires has been/was + past participle
        (Swan & Smith 2001, Ch. "Dutch speakers", § Grammar: Auxiliaries).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - 'Wrong: ''The letter becomes written.'' (Dutch: ''De brief wordt geschreven'')
      Correct: ''The letter is being written.'''
    - 'Wrong: ''The book has wrote.'' (Dutch: ''Het boek is geschreven'' — wrong participle)
      Correct: ''The book has been written.'''
    - 'Wrong: ''The house is built last year.'' (Dutch: ''Het huis is vorig jaar gebouwd'')
      Correct: ''The house was built last year.'''
    why_it_happens: 'Dutch forms the passive with ''worden'' (become) for processual
      passive and ''zijn'' (be) for resultative/statal passive. English uses ''be''
      for both, distinguishing process with ''be being + participle'' from state with
      ''be + participle.'' Dutch learners struggle because Dutch ''is gebouwd'' covers
      both meanings. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): Having L1 grammatical gender
      does NOT guarantee L2 gender advantage. Dutch/Spanish/German learners of Norwegian
      did NOT show overall advantage over learners without gender. Gender transfer
      is non-linear: depends on number of genders, assignment rules, and functional
      alignment between systems. Odlin (Ch.2): "Transfer" term predates behaviorism
      (Whitney 1881, Sapir 1921). Post-behaviorist constructs — activation, automaticity,
      entrenchment — explain transfer patterns. Weinreich and Lado both focused on
      crosslinguistic similarities/differences; CAH (Contrastive Analysis Hypothesis)
      was coined by Wardhaugh (1970), not Lado or Fries.'
    teacher_tips:
      how_to_explain: 'Dutch has TWO passive auxiliaries: ''worden'' (process) and
        ''zijn'' (state). English uses ''be'' for both but adds ''being'' for process:
        ''is being built'' (process) vs. ''is built'' (state).'
      where_to_start: 'Begin with processual passive: Dutch ''worden'' -> English
        ''be being.'' Then address the state/process ambiguity.'
      sequencing: 'Week 1: Processual passive. Week 2: Resultative/statal passive.
        Week 3: Passive with modal verbs. Week 4: Passive in different tenses.'
      exercises:
      - name: Process vs. State Passive Sorting
        type: matching
        description: '15 Dutch passive sentences. Students classify each as process
          or state and translate. Duration: 15 minutes.'
        duration: 15
      - name: Passive Voice Transformation
        type: transformation
        description: '10 Dutch passive sentences in different tenses. Students translate
          into correct English passive. Duration: 15 minutes.'
        duration: 15
      - name: Passive Error Correction
        type: error-correction
        description: 'A 150-word text with 8 passive voice errors. Students identify
          and correct. Duration: 15 minutes.'
        duration: 15
      - name: Active to Passive with Dutch Context
        type: transformation
        description: 'Students receive 10 active Dutch sentences. They convert to
          English passive. Duration: 15 minutes.'
        duration: 15
    sources:
    - Swan, M. & Smith, B. (2001). Learner English. Cambridge University Press.
    - Cornelis, L. (1997). Passive and Perspective. John Benjamins.
    - 'Donaldson, B. (2008). Dutch: A Comprehensive Grammar. Routledge.'
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
