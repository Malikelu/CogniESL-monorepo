  consonant_final_devoicing:
    interference_patterns:
    - pattern: "Devoicing English voiced obstruents in word-final position (Dutch final devoicing rule)"
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_wrong: "I have a pet [pet] [pɛt]"
      example_correct: "I have a pet [pɛt] with voiced final /d/"
      explanation: "Transfer from L1: Dutch devoices all obstruents (plosives and fricatives) in word-final and syllable-final position. This led to minimal pairs like kruis-kruisen vs huis-huizen, where the surface contrast is only maintained in inflected forms. The rule is still operative — foreign words like Sidney are pronounced [sɪtni]. Dutch learners apply this rule to English, devoicing final /b, d, g, v, z/ to [p, t, k, f, s]. (source 5)."
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: "Failing to distinguish English word-final voiced vs voiceless obstruents"
      frequency: 3
      persistence: 4
      communicative_impact: 3
      example_wrong: "bed pronounced as bet [bɛt]"
      example_correct: "bed [bɛd] with final /d/"
      explanation: "Transfer from L1: Dutch has phonetically distinct voiceless-voiced opposition in plosives, but NOT in fricatives. For many Dutch speakers, the difference between /s/ and /z/ or /f/ and /v/ is one of tenseness rather than voicing. This carries over to English where Dutch learners struggle with minimal pairs like 'safe-save', 'rice-rice', 'leaf-leave'. (source 5)."
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: "Regressive voicing assimilation errors at word boundaries"
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_wrong: "big dog pronounced as [bɪk dɒg]"
      example_correct: "big dog [bɪg dɒg]"
      explanation: "Transfer from L1: Dutch has regressive voicing assimilation at morpheme boundaries and in sandhi (e.g., huisdeur [hœʏzdœːr]). But when the second obstruent is a fricative, assimilation is progressive: huisvuil [hœʏsfœʏl]. Dutch learners sometimes misapply these sandhi rules to English, creating unnatural voicing patterns. (source 5)."
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    examples:
    - "Dutch pond-Pfund vs English pound — final devoicing of /d/ to /t/"
    - "kruis-kruisen / huis-huizen — voicing contrast only in inflected forms"
    - "Foreign words: Sidney [sɪtni], Mazda [mɑzdɑ] — regressive assimilation"
    why_it_happens: "One of the most typical features of Dutch pronunciation is devoicing of all obstruents in word-final and syllable-final position. This rule is still actively applied to foreign borrowings. Dutch learners carry this over to English, where word-final voicing contrasts are phonemic and distinguish words like bed/bet, pig/pick, safe/save. (source 5)."
    teacher_tips:
      how_to_explain: "Dutch has a mechanical rule: all final obstruents become voiceless. English keeps voiced and voiceless sounds at the end of words. Practice minimal pairs: bed/bet, pig/pick, safe/save, cup/cab, leaf/leave. Have students hold a tissue — voiced sounds produce vibration, voiceless don't. (source 5)."
      where_to_start: "Start with the most perceptible contrast: final /d/ vs /t/ in bed/bet, had/hat, seed/seat. Use minimal pairs that are both common words."
      sequencing: "Week 1: Final stop consonants (b/p, d/t, g/k). Week 2: Final fricatives (f/v, s/z). Week 3: Voicing assimilation at boundaries. Week 4: Connected speech and foreign word pronunciation."
      exercises:
      - name: "Voicing Contrast Challenge: Final Sounds"
        type: listening
        description: "20 minimal pairs with final voiced vs voiceless obstruents. Students identify which word they hear. Duration: 15 minutes."
        duration: 15
      - name: Final Devoicing Correction Drill
        type: pronunciation
        description: "10 English sentences where Dutch learners typically devoice final consonants. Students practice correct pronunciation with voiced endings. Duration: 10 minutes."
        duration: 10
    sources:
    - "Kooij, J.G. (ed. Comrie, B.) (1990). 'Dutch', Ch.5 in The World's Major Languages. London: Routledge."
