    - claim: 'Hebrew has a definite article ha- (prefix + gemination of the next consonant) but no indefinite article. Definiteness is also marked by proper names, construct state, and nouns with possessive suffixes. Hebrew learners overuse the definite article and omit the indefinite article.'
      location: 'Ch. 34'
      source: Hetzron (1987) Hebrew, in Comrie (ed.) The World's Major Languages
