writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: Education is the most important investment a society can make because
      it produces [specific outcomes]. Evidence from [source] demonstrates [specific
      finding].
    error: '*Is education the most important investment a society can make? Many thinkers
      have debated this question throughout history. Some say yes, others say there
      are more pressing needs. In this essay, I will explore this fascinating question.'
    explanation: Hebrew rhetorical tradition opens with broad questions and multiple
      perspectives; English essays require a clear, specific thesis statement.
  - correction: Research by [source] confirms that character education programs produce
      measurable improvements in [specific outcome].
    error: '*As King Solomon wrote, ''The fear of the Lord is the beginning of wisdom''
      -- and so we must acknowledge that true education begins with moral values.'
    explanation: Hebrew essays may cite biblical or traditional texts as authoritative
      evidence; English academic writing references empirical research.
  description: 'Hebrew rhetorical tradition, influenced by the Talmudic tradition
    of argumentation (machloket l''shem shamayim -- argument for the sake of truth),
    values presenting multiple perspectives and engaging in dialectic. Hebrew essays
    may present arguments through a series of questions and counter-arguments, with
    the thesis emerging through the process of discussion rather than being stated
    upfront. Hebrew writers may use biblical or rabbinical references as authoritative
    evidence, and the Hebrew style of ''inyan gadol'' (big issue) may lead to overly
    broad, philosophical openings in English essays. McManus (2022): Writing interference
    reflects learned attention from L1 discourse habits. L1 rhetorical patterns shape
    how writers organize and present arguments in L2. Restructuring these habits requires
    explicit attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hebrew speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: State the main point in a topic sentence at the beginning of the paragraph,
      then support it with focused examples.
    error: '*Paragraph develops three parallel examples without a unifying topic sentence,
      leaving the reader to infer the main point.'
    explanation: Hebrew paragraphs may rely on accumulated parallelism to convey the
      main idea; English paragraphs require an explicit topic sentence.
  - correction: 'Combine into a single, focused statement: ''Education transforms
      societies by shaping minds and building futures [source].'''
    error: '*Sentences that repeat the same structure with slight variations: ''Education
      matters. Education shapes minds. Education builds futures. Education transforms
      societies.'''
    explanation: Hebrew prose values repetitive parallelism for rhetorical effect;
      English academic writing prefers varied sentence structures and concision.
  description: 'Hebrew paragraphs often develop through a series of parallel points
    connected by repetition and wordplay, reflecting the biblical literary tradition
    of parallelism. Hebrew writers may present ideas in clusters rather than in a
    linear sequence, with the main point emerging from the accumulation of related
    ideas. This can produce English paragraphs that feel repetitive or lack a clear
    topic sentence. Hebrew writers may also use longer, more complex sentences with
    multiple embedded clauses. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hebrew speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: Introduced in 2020 to address inequality, the policy produced mixed
      results, with some regions benefiting more than others.
    error: '*The policy was introduced in 2020. And it was meant to address inequality.
      And the results were mixed. And some regions benefited more than others.'
    explanation: Hebrew coordinates between sentences with 'and'; English uses subordination
      and varied sentence structures.
  - correction: Education is the foundation of society and a key driver of economic
      growth [source].
    error: '*Education is important. Education is also the foundation of society.
      Education is even the key to economic growth.'
    explanation: Hebrew repeats nouns for rhetorical emphasis; English combines ideas
      and uses pronoun reference for variety.
  description: 'Hebrew discourse relies heavily on explicit connectors and repetition
    for cohesion, reflecting the Hebrew literary tradition of ''kelal u''prat'' (general
    and specific) structures. Hebrew writers may overuse connectors like ''and'' (ve-),
    ''but'' (aval), and ''therefore'' (lachen) in English, and may begin many sentences
    with these conjunctions. Hebrew ''gam'' (also/even) and ''rak'' (only/just) may
    be overused or misused. Hebrew writers may also repeat key terms rather than using
    synonyms or pronoun reference. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hebrew speakers. Cambridge
    University Press.'
- area: academic_register
  common_errors:
  - correction: Alternative perspectives on this issue deserve consideration, although
      the evidence presented here supports the conclusion that [specific claim].
    error: '*Anyone who disagrees with this argument clearly doesn''t understand the
      facts.'
    explanation: Hebrew academic style values direct, passionate argumentation; English
      academic writing expects measured, respectful engagement with opposing views.
  - correction: The data indicate that the policy has failed to achieve its stated
      objectives [source].
    error: '*So basically, the data shows the policy is a total failure.'
    explanation: Hebrew academic writing may use colloquial expressions; English academic
      writing requires formal register and precise language.
  description: 'Hebrew academic writing blends formal and informal registers in ways
    that do not map onto English conventions. The Hebrew tradition of direct, passionate
    argumentation (influenced by Israeli communication culture) can produce English
    prose that seems too forceful or confrontational. Hebrew writers may also mix
    colloquial expressions with academic vocabulary, and the Hebrew convention of
    addressing the reader directly may produce inappropriate informality in English
    essays. McManus (2022): Writing interference reflects learned attention from L1
    discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 15: Hebrew speakers. Cambridge
    University Press.'
