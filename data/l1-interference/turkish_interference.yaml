language: Turkish
language_code: tr
schema_version: '4.0'
grammar_points:
  articles:
    interference_patterns:
    - pattern: Omission of all articles (Turkish has no articles)
      example_l1: '*I am student.'
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Turkish has no indefinite article for professions (Ben ogrenciyim
        = I student-am)
      example_wrong: '*I am student.'
      example_correct: I am a student.
      explanation: 'Transfer from L1: Turkish has no article system. Definiteness
        is inferred from context or word order. The indefinite article is sandwiched
        between adjective and noun in Turkish, and is not used for professions (Swan
        & Smith 2001, Ch. Turkish speakers, Grammar: Articles, point 1).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Golden et al. (2017): Having L1 articles does NOT guarantee easy English
        article acquisition'
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: 'Turkish: has NO article system'
      example_gloss: Turkish has NO articles; definiteness expressed through context or word order
      example_wrong: '''I am doctor'' / ''the life is beautiful'' (L1-specific article
        overuse/underuse)'
      example_correct: '''I am a doctor'' / ''Life is beautiful'''
      explanation: 'Golden et al. (2017): Even L1s with articles show non-linear transfer
        effects. Having an L1 article system helps but does not eliminate errors because
        the specific rules for article use (when to use definite, indefinite, or zero
        article) vary across languages. Swedish, French, Spanish, Arabic, and other
        article-bearing L1s all show context-specific article errors in English.'
      etiology: functional_fit_transfer
      flagged: true
      tier: 3
      reliability: B
    - pattern: 'Golden et al. (2017): L1s without grammatical gender struggle with
        gender in gendered L2s — but may use compensating strategies'
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_l1: 'Turkish: no grammatical gender'
      example_gloss: Turkish does not mark gender on articles/adjectives
      example_wrong: '''la libro'' / ''el mesa'' (Spanish gender assignment difficulty)'
      example_correct: '''el libro'' / ''la mesa'''
      explanation: 'Golden et al. (2017) Ch.6 (Ragnhildstveit): Vietnamese (no gender,
        but classifier system) omits articles MORE but is accurate for gender WHEN
        using them — showing partial compensation. Having no L1 gender system means
        learning gender from scratch, but compensating cognitive strategies (classifiers,
        semantic categorization) may partially support acquisition.'
      etiology: conceptual_transfer
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: Ben doktorum.
      correct: I am a doctor.
    why_it_happens: Turkish has no article system. Definiteness is inferred from context
      or word order rather than grammatical markers. Turkish learners often omit articles
      entirely in English, producing sentences like 'I bought book yesterday' instead
      of 'I bought a book.' This occurs because Turkish does not require speakers
      to mark definiteness grammatically. McManus (2022) explains that L2 speakers
      can learn new form-meaning mappings (like articles) that don't exist in L1,
      but this requires extensive practice to become automatic. Online anticipatory
      processing (using articles to predict upcoming nouns) develops only with high
      proficiency and extended exposure, not from L1 transfer. McManus (2022) explains
      that L2 speakers can learn new form-meaning mappings that don't exist in L1,
      but this requires extensive practice to become automatic. L2 learning involves
      creating new knowledge when L1-L2 differences exist AND developing selection
      mechanisms to manage competing knowledge sources (McManus 2022, Ch. 1). Online
      anticipatory processing develops only with high proficiency and extended exposure.
    teacher_tips:
      how_to_explain: 'Teach: English REQUIRES articles. ''A/an'' for first mention,
        ''the'' for specific.'
      where_to_start: Start with the articles pattern.
      sequencing: 'Week 1: articles. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: articles Audit
        type: error-correction
        description: 20 sentences with articles errors.
        duration: 15
      - name: articles Translation
        type: translation
        description: Translate 15 sentences focusing on articles.
        duration: 15
      - name: articles Practice
        type: fill-in-the-blank
        description: 20 sentences practicing articles.
        duration: 10
      - name: articles Error Hunt
        type: error-correction
        description: A paragraph with 10 articles errors.
        duration: 15
    sources: &id001
    - Swan & Smith "Learner English" (Turkish)
    - Parrott "Grammar for English Language Teachers"
