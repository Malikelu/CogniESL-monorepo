  phonology_kornfilt:
    interference_patterns:
    - pattern: Vowel harmony affects suffix pronunciation
      example_l1: evler (houses) vs. evler-den (from houses)
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: Turkish suffixes change vowel to match root vowel via backness and rounding harmony
      example_wrong: '*The plural is always -lar regardless of root vowel.'
      example_correct: 'The plural suffix alternates: -ler after front vowels (evler = houses), -lar after back vowels (atlar = horses).'
      explanation: 'Kornfilt (1997) "Turkish" (Routledge), Ch.30 in Comrie (ed.) "The World''s Major Languages": Turkish vowels undergo vowel harmony for backness and, if high, for rounding. The plural morpheme has allomorphs -lAr (back) and -lEr (front). Harmony propagates rightward; a non-round vowel breaks rounding harmony for all following vowels. Exceptional vowels (e.g., progressive -(I)yor) create new harmony domains from their position (pp. 38397-38414).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Syllable-final obstruent devoicing
      example_l1: kitap (book) → kitab-ı (book-ACC)
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: Final devoiced p becomes voiced b before vowel-initial suffix
      example_wrong: '*The word "kitap" is pronounced with [p] in all forms.'
      example_correct: kitap (nominative, [p]), kitab-ı (accusative, [b])
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has syllable-final oral stop devoicing. Stops devoice in syllable-final position but resurface as voiced before vowel-initial suffixes. Examples: kitap → kitab-ı, kireç → kirec-i (p. 38343-38348). This affects spelling transfer: Turkish learners may spell English words with final devoiced consonants.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Consonant cluster epenthesis in borrowed words
      example_l1: kral → k-iral (king), tren → t-iren (train)
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Turkish inserts a high vowel to break up initial consonant clusters
      example_wrong: '*I went by [tren].'
      example_correct: I went by train.
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish does not allow consonant clusters in initial position. Borrowings with initial clusters are broken up by an epenthesized high vowel that harmonizes with the following vowel: kral → k-iral, tren → t-ieren. Epenthesis also applies to syllable-final illegal clusters: hiss → his, raks → rak-s → rak (degemination) (pp. 38304-38336). Turkish learners may insert vowels before English initial clusters (e.g., *i-store).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Palatal and velar consonant allophones
      example_l1: bel (waist) vs. bal (honey); kör (blind) vs. kor (ember)
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: k, g, l have palatal allophones before front vowels and velar allophones before back vowels
      example_wrong: '*The k sound is always the same in all Turkish words.'
      example_correct: k is palatal [c] before front vowels (kor = blind), velar [k] before back vowels (kor = ember).
      explanation: "Kornfilt (1997) \"Turkish\", Ch.30: The consonants k, g, and l have two forms: palatal and velar. Distribution is generally determined by the backness/frontness of the tautosyllabic vowel. Borrowings may have unpredictable palatal variants with back vowels (e.g., kalp [heart] → accusative kalb-i, with palatal [c] before back vowel) (pp. 38224-38237). This may cause perceptual confusion for Turkish learners distinguishing English /k/ vs /tʃ/ or /l/ vs /ɫ/."
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Morpheme-initial voicing assimilation
      example_l1: gemi-ci (sailor), iz-ci (guide), sarap-çı (wine maker)
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Morpheme-initial obstruents assimilate in voicing to the preceding segment
      example_wrong: 'gem-ki (instead of gemi-ci), iz-gi (instead of iz-ci)'
      example_gloss_alt: Underlying voiced stops devoice after voiceless stops
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: A morpheme-initial obstruent assimilates in voicing to the preceding segment within the word. This rule applies after syllable-final stop devoicing: gemi + ci → gemi-ci (voiced after vowel), but kitap + çı → kitap-çı (voiceless after devoiced /p/) (p. 38383-38396). Turkish learners may transfer this assimilation pattern to English suffixes.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Word-final stress with exceptions
      example_l1: kitáp 'obór', Islánbul, Ánkara, límon
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Turkish default stress is word-final; many suffixes reject stress; borrowed stems and place names often have non-final stress
      example_wrong: '*I live in Ankára.'
      example_correct: I live in Ánkara.
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has word-final stress as default. Exceptional suffixes (e.g., past -DI, progressive -mA) reject stress, causing the preceding vowel to receive primary stress. Borrowed stems and place names are stressed on the antepenultimate syllable when it is a closed syllable, otherwise on the penultimate: Istánbul, Ánkara, Izmir, lokánta (pp. 38473-38515). Turkish learners may place English word stress on the final syllable by transfer.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    why_it_happens: 'Turkish phonology is governed by vowel harmony, syllable-final devoicing, and cluster epenthesis rules that have no direct equivalents in English. Kornfilt (1997) documents these as systematic phonological processes affecting all native and borrowed vocabulary. Transfer occurs because the L1 phonological system filters English sound patterns, leading to pronunciation errors and spelling difficulties.'
    teacher_tips:
      how_to_explain: 'Teach: Turkish vowels harmonize; consonants devoice at syllable end in spelling. Focus on minimal pairs: /k/ vs /g/ allophones, final devoicing in borrowed words.'
      where_to_start: Start with vowel harmony (suffix alternation). Then teach final devoicing. Then consonant cluster epenthesis.
      sequencing: 'Week 1: Vowel harmony (plural -lar/-ler). Week 2: Final devoicing. Week 3: Consonant clusters. Week 4: Stress patterns.'
      exercises:
      - name: Vowel Harmony Practice
        type: fill-in-the-blank
        description: 15 words with correct plural suffix (-lar or -ler).
        duration: 10
      - name: Devoicing Awareness
        type: listening
        description: 10 minimal pairs contrasting voiced/voicelessfinal consonants.
        duration: 10
