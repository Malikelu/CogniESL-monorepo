  prepositions:
    interference_patterns:
    - pattern: Transfer of turkish prepositions
      example_l1: Turkish has postpositions (equivalent of English prepositions follow
        the noun).
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Turkish uses postpositions after nouns; English uses prepositions
        before nouns
      example_wrong: '*in Saturday; *for learn English; *until the bank'
      example_correct: on Saturday; to learn English; outside the bank (or opposite
        the bank)
      explanation: 'Transfer from L1: Turkish uses postpositions rather than prepositions,
        and the system differs significantly. The equivalent of English prepositions
        follow the noun, and the equivalent of subordinating conjunctions follow their
        clauses (Swan & Smith 2001, Ch. Turkish speakers, Grammar: Prepositions, p.
        224).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Turkish case system influences English preposition use (Odlin Ch.3)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_l1: 'Turkish: uses case inflections for spatial/non-spatial relations'
      example_gloss: 6 cases (genitive, dative, accusative, locative, ablative, instrumental)
      example_wrong: '''I go school'' / ''I am home'' (preposition omission)'
      example_correct: '''I go to school'' / ''I am at home'''
      explanation: 'Odlin (Ch.3): Finnish learners omit English prepositions because
        Finnish uses nominal case inflections (15 cases) instead. This is COVERT transfer
        — the ABSENCE of something reflects L1 influence. Other case-system L1s similarly
        transfer case-based strategies to English preposition use.'
      etiology: covert_transfer
      flagged: true
      tier: 4
      reliability: B
    examples:
    - wrong: I am on home.
      correct: I am at home.
    why_it_happens: 'Turkish uses postpositions rather than prepositions, and the
      system differs significantly from English. Turkish learners may omit prepositions
      or use wrong ones in English. This occurs because Turkish spatial relationships
      are expressed with postpositions attached to nouns. McManus (2022): The L1 is
      always active during L2 use cross-language co-activation is constant. Managing
      L1-L2 competition requires inhibitory control (Green 1998 Inhibitory Control
      Model). This means L1 transfer is not a temporary phase but a permanent feature
      of multilingual cognition. Learners cannot "switch off" the L1; instead, they
