  lexicon_kornfilt:
    interference_patterns:
    - pattern: Arabic/Persian lexical borrowings with shifted meanings
      example_l1: aktüel (current, from French/Persian arabicized aktuel), fabrika (factory)
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Turkish borrowed heavily from Arabic and Persian; many words exist in English with different origins or meanings
      example_wrong: '*The aktüel situation (intending "current").'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has substantial Arabic and Persian vocabulary from the Ottoman period. The 1928 writing reform (adoption of Latin script) and subsequent language purification movements replaced many Arabic/Persian words with Turkic coinages. However, many borrowings persist and some are false friends with English. The only major lexical common ground between English and Turkish is borrowings from French (e.g., sempatik "nice," kontrol "check") (pp. 38039-38055, 38136-38161, 38185-38210). Turkish learners may use Arabic/Persian-origin Turkish words assuming English cognates.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: French-origin false friends
      example_l1: sempatik (nice), kontrol (check), pansuman (bandage), otobüs (bus)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Turkish and English share French borrowings but with shifted meanings
      example_wrong: '*He is very sympathetic (intending "nice/pleasant").'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: The shared lexical ground between Turkish and English is primarily French borrowings. Some are false friends: sempatik (Turkish "nice/pleasant" ≠ English "sympathetic"), kontrol (Turkish "check/inspection" ≠ English "control"), and others. These cause high-impact communication errors because the words look and sound similar but have different meanings (cited in Swan & Smith 2001, Vocabulary, p.225; Kornfilt notes the role of French borrowings in Turkish lexicon, p. 38185-38210).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Agglutinative compound formation
      example_l1: öğretmen-lik (teacher-NOM → the teaching profession), yaz-ım (write-NOM → typography)
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: Turkish uses derivational suffixes to create abstract nouns; English uses separate words or different morphology
      example_wrong: '*I study teacher-dom (transferring Turkish öğretmen-lik).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has productive derivational suffixes: -lAr (plural), -CI (professional: öğretmen-ci "teaching professional"), -lIk (abstract/professional: öğretmen-lik "teaching as a profession"), -sIz (without: ev-siz "homeless"), -mA (result/action nominal), -DIK (factive nominal), -(y)An (subject relativizer). These are highly productive and regular, unlike English derivational morphology which is less transparent. Turkish learners may create nonce English words by transferring suffix patterns (pp. 38538-38551).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    why_it_happens: 'The Turkish lexicon reflects centuries of contact with Arabic, Persian, and French. Kornfilt (1997) documents this multilingual lexical history and its consequences for modern Turkish vocabulary. False friends from French and the agglutinative word-formation system create predictable transfer errors in English.'
    teacher_tips:
      how_to_explain: 'Teach: Watch for French-origin words with different meanings in English. Common false friends: sempatik ≠ sympathetic, kontrol ≠ control. Teach English derivational patterns as separate lexical items.'
      where_to_start: Start with the most common French-origin false friends. Then teach Turkish compound formation contrast.
      sequencing: 'Week 1: Top 10 false friends. Week 2: Compounding contrast (agglutinative vs. separable). Week 3: Practice with context. Week 4: Review.'
      exercises:
      - name: False Friend Identification
        type: error-correction
        description: 15 sentences with false friend errors.
        duration: 10
      - name: Word Formation Contrast
        type: matching
        description: Match 10 Turkish agglutinative words to their English multi-word equivalents.
        duration: 10
