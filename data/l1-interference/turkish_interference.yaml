  word_order:
    interference_patterns:
    - pattern: SOV word order transfer (Turkish is SOV)
      example_l1: Ben dunu goruyorum.
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: I world-obj-see (I see the world) - Turkish SOV order
      example_wrong: '*I the world see.'
      example_correct: I see the world.
      explanation: 'Transfer from L1: Turkish is strictly SOV (Subject-Object-Verb)
        while English is SVO. The finite verb stands at the end of the Turkish sentence.
        All adjectivals precede their substantive (Swan & Smith 2001, Ch. Turkish
        speakers, Grammar: Word order, p. 218).'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: SOV transfer persists with unfamiliar verb phrases — chunk-learning
        mitigates it
      example_l1: O genelde yalan soyler
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: He usually lie tells (Turkish SOV order)
      example_wrong: '*He usually lie tells.'
      example_correct: He usually tells lies.
      explanation: 'Mede et al. (2014) found that 84% of beginner Turkish EFL learners
        accepted the SOV sentence "He usually lie tells" as correct in a Grammaticality
        Judgment Task. However, the same learners correctly identified SVO sentences
        they had learned as chunks — 100% accepted "I have a shower once a day" and
        94% correctly rejected "We every day TV watch". The study demonstrates that
        SOV transfer is strongest when the verb phrase is unfamiliar, while frequent,
        chunk-learned phrases are correctly produced in SVO. This has direct pedagogical
        implications: teaching verb-noun collocations as chunks may reduce SOV transfer
        faster than explicit syntactic instruction alone (Mede et al. 2014, ELT Research
        Journal 3(2), Results section, pp. 77-78).

        '
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: SOV word-order transfer from Turkish (Odlin Ch.4)
      frequency: 4
      persistence: 4
      communicative_impact: 4
      example_l1: Ben kitap aldim
      example_gloss: I book bought
      example_wrong: '''I book bought'' (SOV transfer [Turkish -> English])'
      example_correct: '''I bought a book'' (SVO)'
      explanation: 'Odlin (Ch.4): Turkish is SOV and basic word order IS transferable.
        Turkish is SOV but allows all 6 word-order permutations (Slobin 1982), making
        transfer documentation complex. Bickerton & Givon (1976): the LEAST proficient
        speakers show the MOST word-order transfer. Odlin refutes Zobl & Rutherford''s
        universal constraint with 11 counter-examples. Flexible word order in Turkish
        complicates clear isolation of transferred SOV patterns.'
      etiology: substratum_transfer
      flagged: true
      tier: 4
      reliability: B
    - pattern: Turkish SOV word-order transfer to English SVO (Odlin Ch.4)
      frequency: 4
      persistence: 4
      communicative_impact: 4
      example_l1: 'Turkish: SOV basic word order'
      example_gloss: 'Turkish: Subject-Object-Verb is basic order'
      example_wrong: '''I book bought'' (SOV transfer from Turkish)'
      example_correct: '''I bought a book'' (SVO)'
      explanation: 'Odlin (Ch.4): Basic word order IS transferable — refuting Zobl
        & Rutherford''s claimed universal constraint. Hawaiian Pidgin English shows
        SOV influence from Japanese/Korean speakers. The LEAST proficient speakers
        show the MOST word-order transfer. Swedish V2 transfer also attested. Word-order
        transfer is proficiency-sensitive and more likely in informal/unfocused contexts
        (Trévise 1986).'
      etiology: substratum_transfer
      flagged: true
      tier: 4
      reliability: B
    examples:
    - wrong: Ben kitap aldim.
      correct: I bought a book.
    - wrong: O genelde yalan soyler.
      correct: He usually tells lies.
    why_it_happens: "Turkish is strictly SOV (Subject-Object-Verb) while English is\
      \ SVO. In Turkish,\nthe verb always comes at the end of the sentence. Turkish\
      \ learners may transfer\nthis pattern to English, producing sentences like 'I\
      \ the book bought' instead of\n'I bought the book.' This transfer occurs because\
      \ word order is deeply automatized\nfrom L1 acquisition. Critically, Mede et\
      \ al. (2014) found that SOV transfer is not\nuniform — it is strongest with\
      \ unfamiliar verb phrases. Turkish EFL beginners who\nhad learned verb-noun\
      \ collocations as chunks (e.g., 'have a shower', 'brush teeth',\n'watch TV')\
      \ correctly used SVO order with those phrases. The study suggests that\nfrequency\
      \ of input determines whether L1 word order surfaces — familiar chunks\nbypass\
      \ the SOV transfer mechanism, while unfamiliar phrases trigger it (Mede et al.\n\
      2014, ELT Research Journal 3(2), Discussion, pp. 78-79).\n McManus (2022): The\
      \ L1 is always active during L2 use cross-language co-activation is constant.\
      \ Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory\
      \ Control Model). This means L1 transfer is not a temporary phase but a permanent\
      \ feature of multilingual cognition. Learners cannot \"switch off\" the L1;\
      \ instead, they must develop mechanisms to manage competing representations.\
      \ Domain-general learning mechanisms (memory, analogy, categorization) support\
      \ building new L2 form-meaning mappings. McManus (2022): Explicit/declarative\
      \ knowledge of L2 forms does not automatically translate to real-time processing\
      \ ability. The online-offline knowledge gap is well-documented: learners may\
      \ pass offline tests but fail in real-time comprehension/production. To bridge\
      \ this gap, extensive practice and repeated processing opportunities are needed\
      \ (DeKeyser 1997, 2017: automatization theory). Learners need massive structured\
      \ input floods that push attention to target features, not just explicit rule\
      \ explanation. Golden et al. (2017): Transfer is non-linear — functional fit\
      \ between L1 and L2 systems matters more than mere formal similarity. English\
      \ (Germanic) learners showed NO advantage over Slavic learners on Norwegian\
      \ spatial prepositions. Gender system transfer is non-linear (L1 gender != automatic\
      \ advantage). Conceptual transfer affects spatial relations, emotion language,\
      \ and article use. Accuracy + text length account for 80% of writing ratings;\
      \ cultural-rhetorical style accounts for the remaining 20%. Golden et al. (2017):\
      \ Even L1s with article systems show non-linear transfer. Having articles helps\
      \ but does not eliminate errors because specific article rules (definite/indefinite/zero)\
      \ vary across languages. Transfer depends on functional fit of article usage\
      \ rules, not just presence of articles in L1. Golden et al. (2017): L1s without\
      \ grammatical gender must build gender assignment from scratch, but compensating\
      \ strategies (e.g., Vietnamese classifiers for animacy/shape) may partially\
      \ support acquisition. Vietnamese learners omit articles more but are accurate\
      \ when present."
    teacher_tips:
      how_to_explain: 'Teach: English word order is always Subject-Verb-Object (SVO).
        Turkish is Subject-Object-Verb (SOV). Many learners make SOV errors with unfamiliar
        verbs but NATIVE-LIKE SVO with phrases they have learned as chunks. Strategy:
        teach verb-noun collocations as whole chunks (e.g., ''tell a lie'', ''watch
        TV'', ''eat breakfast'') so learners internalize the SVO pattern without conscious
        rule application.

        '
      where_to_start: Start with the word order pattern.
      sequencing: 'Week 1: word order. Week 2: Practice. Week 3: Review. Week 4: Mixed.'
      exercises:
      - name: word_order Audit
        type: error-correction
        description: 20 sentences with word order errors.
        duration: 15
      - name: word_order Translation
        type: translation
        description: Translate 15 sentences focusing on word order.
        duration: 15
      - name: word_order Practice
        type: fill-in-the-blank
        description: 20 sentences practicing word order.
        duration: 10
      - name: word_order Error Hunt
        type: error-correction
        description: A paragraph with 10 word order errors.
        duration: 15
      - name: Chunk-Based Word Order Drill
        type: matching
        description: 'Students match 15 common Turkish SOV sentences (e.g., ''O genelde
          yalan soyler'') with their correct English SVO equivalents (''He usually
          tells lies''). Then practice producing the English sentences from memory.
          Based on Mede et al. (2014) finding that chunk-learned phrases bypass SOV
          transfer.

          '
        duration: 15
