    - claim: Turkish has two distinct agreement paradigms (verbal vs nominal) with different suffix forms
      source: Kornfilt, J. (1997) Turkish. Routledge.
      location: pp. 38696-38861 (Agreement Markers section, Table 30.3)
      tier: 1
      reliability: A
    - claim: Turkish accusative case -(y)I marks only specific referential direct objects; non-specific objects have zero case marking
      source: Kornfilt, J. (1997) Turkish. Routledge.
      location: pp. 38914-38963 (Case system section)
      tier: 1
      reliability: A
    - claim: "Turkish is a pro-drop language: subjects and objects can be omitted when recoverable from context or agreement"
      source: Kornfilt, J. (1997) Turkish. Routledge.
      location: "pp. 39106-39132 (Syntax section: subject drop)"
      tier: 1
      reliability: A
    - claim: Turkish has no grammatical gender; pronouns do not distinguish masculine/feminine/neuter
      source: Kornfilt, J. (1997) Turkish. Routledge.
      location: p. 38698
      tier: 1
      reliability: A
  syntax_kornfilt:
    interference_patterns:
    - pattern: SOV word order with pre-verbal focus
      example_l1: Hasan kitab-ı çocuğ-a oku-du (Hasan book-ACC child-DAT read-PAST)
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_gloss: Turkish is SOV; the pre-verbal position is the focus position; sentence-initial is topic
      example_wrong: '*Hasan the book to-the-child read (Turkish word order).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish is a left-branching SOV language. The unmarked order is SOV, but word order is relatively free. The position immediately preceding the verb is the preferred focus position; sentence-initial position is the preferred topic position. New information and emphasis appear pre-verbally with intonational stress. This is distinct from English SVO where focus is marked by stress or cleft constructions (pp. 38996-39038). Turkish learners may place focused elements before the verb in English, producing unusual word orders for emphasis.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Nominalized embedded clauses instead of finite complement clauses
      example_l1: Ahmed-in ben-i sev-diğ-in]-i bil-iyor-um (Ahmet-GEN I-ACC love-F.ACT.NOM-3SG-ACC know-PROG-1SG)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Turkish embeds clauses via nominalization (-DIK for factive, -mA for action) rather than finite complementizers like "that"
      example_wrong: '*I know Ahmet loves-me-ACC (transferring nominalized structure).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish embedded clauses lack complementizers. Predicates are "nominalized" with -DIK (factive) or -mA (action/non-factive). Subjects of nominalized clauses are in the genitive case. The agreement markers on nominalized predicates come from the nominal paradigm. infinitival complements (-mAK) lack overt subjects. This is fundamentally different from English finite complement clauses with "that" (pp. 39106-39132, 39323-39472). Turkish learners may struggle with English complementizer "that," genitive subjects, and tense in subordinate clauses.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Yes/no question particle -mI with vowel harmony
      example_l1: Gör-üyor mu-sun? (see-PROG Q-2SG)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Turkish yes/no questions use particle -mI/-mi/-mu/-mü attached to the questioned constituent with vowel harmony
      example_wrong: '*You are coming? (intonation only, like Turkish, instead of "Are you coming?").'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Yes/no questions are formed by suffixing -mI (with vowel harmony: -mi, -mu, -mü) to the questioned constituent. When the whole sentence is questioned, it attaches to the verb before agreement markers. Constituent questions correspond to English clefted questions: Çocuğ-a kitab-ı kim ver-di? "Was it you who gave the book to the child?" The particle exhibits dual behavior: exception for word stress but regular for vowel harmony (pp. 39262-39321). Turkish learners may use intonation-only questions in English instead of do-support and inversion.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Pre-nominal relative clauses with gap
      example_l1: "[— gid-en] okul (go-REL school = the school that goes to)"
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Turkish relative clauses precede the head noun; the verb is nominalized; there is a gap for the relativized constituent
      example_wrong: '*The school that [—] go-to (transferring Turkish pre-nominal participle relative clause).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Relative clauses in Turkish precede their heads and lack complementizers. The basic morphology uses -DIK (for non-subject relativization) and -(y)An (for subject relativization). There is a gap for the relativized constituent. The predicate carries nominal agreement morphology. No relative pronouns exist. Examples: [Ahmed-in git-tiğ-i] okul "the school that Ahmet goes to" (accusative on nominalized verb); [okul-a gid-en] çocuk "the child that goes to school" (subject relativization with -(y)An) (pp. 39472-39514). Turkish learners may use "what" as a relative pronoun or place relative clauses after the noun with resumptive pronouns.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Postpositions instead of prepositions
      example_l1: Ahmet gibi (Ahmet like = like Ahmet), için (for)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Turkish uses postpositions after nouns; English uses prepositions before nouns
      example_wrong: '*I came Ahmet with (instead of "I came with Ahmet").'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish is left-branching: objects precede verbs, and postpositional objects precede the postposition. Some postpositions govern specific cases (e.g., genitive on pronouns: ben-im gibi "like me" but kadın gibi "like a woman" with nominative). This contrasts with English prepositions that precede the NP regardless of case. Turkish learners may place prepositions after nouns or use wrong case forms in prepositional phrases (pp. 39070-39104).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Transitive vs intransitive passive asymmetry
      example_l1: döv-ül-dü-k (hit-PASS-PAST-1PL) vs. *yardım ed-il-di-k
      frequency: 3
      persistence: 2
      communicative_impact: 2
      example_gloss: "Turkish has two passive types: transitive (full subject properties) and intransitive (awkward/impossible agentive phrases)"

      example_wrong: '*We were helped (intransitive passive transferring from Turkish which restricts this).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has two passive types. Transitive passive: derived from transitive verbs; patient becomes subject with full subject properties (nominative, agreement, etc.). Intransitive passive: derived from intransitive verbs; original objects do NOT become surface subjects, and agentive phrases are awkward/ungrammatical. Impersonal passives from objectless verbs are possible. This asymmetry has no parallel in English and may cause avoidance of passive with certain verbs (pp. 39133-39211).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    why_it_happens: 'Turkish syntax is SOV, left-branching, and uses nominalized embedded clauses, postpositions, and pre-nominal relative clauses — all documented by Kornfilt (1997). These typological features differ fundamentally from English SVO, right-branching, finite complement patterns. Transfer produces systematic word order, relative clause, question formation, and passive voice errors.'
    teacher_tips:
      how_to_explain: 'Teach: English is SVO and right-branching (relative clauses AFTER nouns). English uses "that" for embedded clauses. English uses DO for questions. English uses BE + past participle for passive.'
      where_to_start: Start with SVO word order (subject before verb). Then teach relative clauses after nouns. Then question formation with DO.
      sequencing: 'Week 1: SVO order. Week 2: Relative clauses (after noun). Week 3: Question formation (do-support). Week 4: Passive voice contrast.'
      exercises:
      - name: Word Order Correction
        type: sentence-rewrite
        description: 15 Turkish SOV sentences rewritten in English SVO.
        duration: 15
      - name: Relative Clause Placement
        type: matching
        description: Match 10 Turkish pre-nominal relative clauses to English post-nominal equivalents.
        duration: 10
    sources:
    - Kornfilt, J. (1997) Turkish. Routledge. (Ch.30 in Comrie, B. (ed.) The World's Major Languages)
