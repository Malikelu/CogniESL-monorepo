  morphology_kornfilt:
    interference_patterns:
    - pattern: Agglutinative suffix stacking
      example_l1: ev-ler-im-den (house-PL-my-from = from my houses)
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_gloss: Turkish stacks multiple suffixes on a single root; English uses separate words
      example_wrong: '*I came from my house-pl-my-from.'
      example_correct: I came from my houses.
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish morphology is agglutinative and suffixing. Derivational suffixes precede inflectional ones. The order is: root → derivational → plural → agreement (possessive) → case. Example: ev-ler-im-den (house-PL-1PL.POSS-ABL) = "from my houses." Each suffix has one function with few exceptions. English uses separate prepositions and determiners. Turkish learners may produce single complex words where English requires multiple words (p. 38519-38537).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Two agreement paradigms (verbal vs nominal)
      example_l1: gel-eceğ-im (come-FUT-1SG verbal) vs. araba-sı (car-3SG nominal)
      frequency: 4
      persistence: 3
      communicative_impact: 2
      example_gloss: "Turkish has two subject agreement paradigms: verbal for main clause predicates, nominal for possessive phrases and nominalized clauses"
      example_wrong: '*The verbal agreement suffix -Im is used on nouns.'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has two agreement paradigms. The verbal paradigm (-Im, -sIn, -, -Iz, -sInIz, -lAr) appears with main clause predicates. The nominal paradigm (-(I)m, -(I)n, -(s)I(n), -(I)mIz, -(I)nIz, -lArI(n)) appears on head nouns of possessive phrases and on nominalized verbs of gerundive/participial complements. The paradigms differ in third person (zero verbal vs. -(s)I(n) nominal) and plural marking (pp. 38696-38861). Turkish learners may confuse subject-verb agreement patterns in English due to this dual system.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Plural omitted with quantifiers
      example_l1: beş adam (five man) NOT *beş adam-lar (five man-PL)
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Turkish omits plural suffix when a quantifier expresses plurality
      example_wrong: '*I have five book-s (transferring Turkish beş kitap with English plural).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish does not mark plural on a noun when its quantifier clearly expresses plurality: beş adam (*adam-lar) "five men." This generalization holds irrespective of grammatical relation. Turkish also does not spread singular/plural or case onto modifiers: adjectives do not agree in number (p. 38796-38810). Turkish learners may transfer this to English, producing "five book" after quantifiers.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Specificity-based accusative case
      example_l1: Ali kitab-ı oku-du (Ali book-ACC read-PAST) vs. Ali kitap oku-du
      frequency: 5
      persistence: 4
      communicative_impact: 3
      example_gloss: Turkish accusative -(y)I marks only specific direct objects; non-specific objects have zero case
      example_wrong: '*I read the (specific marker) book yesterday (transferring accusative to all objects).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish has morphological case (nominative zero, accusative -(y)I, dative -(y)A, locative -DA, ablative -DAn, genitive -(n)I(n)). Crucially, the accusative and genitive appear only on specific/referential constituents. Non-specific objects have zero case: Ali bir kitap oku-du "Ali read a (non-specific) book" vs. Ali kitab-ı oku-du "Ali read the (specific) book." Non-specific constituents are rigidly limited to immediate pre-verbal position (pp. 38914-38963). Turkish learners may transfer this to article use: overusing "the" for specific reference or omitting articles for non-specific.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: No grammatical gender
      example_l1: o (he/she/it), Turkish has no gender distinctions
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Turkish has no grammatical gender; pronouns do not distinguish masculine/feminine/neuter
      example_wrong: '*She is a good doctor (correct English but Turkish learners may omit subject pronoun).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Gender is neither overtly expressed in nouns nor does it affect agreement in Turkish. The third person singular pronoun o covers "he," "she," and "it." This lack of gender transfer contrasts sharply with learners from gendered L1s. Turkish learners do not make gender-based pronoun errors but may struggle with English gender distinctions in writing (p. 38698-38699).'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    - pattern: Pro-drop (subject omission)
      example_l1: — okul-a gid-eceğ-im (school-DAT go-FUT-1SG)
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: Turkish subjects can be omitted; agreement suffixes identify person and number
      example_wrong: '*Am going to school (omitting subject).'
      explanation: 'Kornfilt (1997) "Turkish", Ch.30: Turkish is a pro-drop language: subjects can be unexpressed in finite clauses when the agreement suffixes uniquely identify person and number. Non-subjects can also be dropped when contextually recoverable, though more restricted. The rich agreement morphology licenses this. Stylistic preference favors omitting subjects when overtly present (pp. 39106-39132). Turkish learners frequently omit English subject pronouns ("*Am going," "*Is raining") due to transfer.'
      etiology: interlingual
      flagged: true
      tier: 1
      reliability: A
    why_it_happens: "Turkish morphology is agglutinative with rich suffixation, specificity-based case marking, no grammatical gender, and pro-drop -- all documented by Kornfilt (1997) as core typological features of Turkish. These features differ fundamentally from English analytic structure, producing systematic transfer effects in word formation, article use, subject expression, and pronoun choice."
    teacher_tips:
      how_to_explain: 'Teach: Turkish builds words with suffixes (one function each). English uses separate words. Turkish omits "the/a" based on specificity. Turkish can drop subjects; English cannot.'
      where_to_start: Start with subject pronouns (English REQUIRES them). Then specificity-based articles. Then suffix vs. separate word contrast.
      sequencing: 'Week 1: Subject pronouns (always required in English). Week 2: Articles (specific vs. non-specific). Week 3: Word formation contrast. Week 4: Review.'
      exercises:
      - name: Subject Pronoun Recovery
        type: fill-in-the-blank
        description: 15 Turkish sentences without subjects; add correct English subject.
        duration: 10
      - name: Specificity Article Choice
        type: fill-in-the-blank
        description: 20 sentences choosing between the/a/zero article based on specificity.
        duration: 15
