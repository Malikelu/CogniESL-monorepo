writing_interference:
- area: argumentative_essay
  description: 'Turkish argumentative writing follows a structure influenced by both
    Ottoman literary traditions and modern Turkish academic conventions. Turkish writers
    tend to present background context and multiple perspectives before stating their
    position, with the thesis often appearing in the second paragraph rather than
    the first. Turkish essays may use a ''general-to-specific'' organization where
    broad philosophical statements precede the specific argument. English argumentative
    essays expect an upfront thesis in the introduction, followed by linearly organized
    supporting paragraphs. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*Throughout history, many thinkers have debated this question. Some say
      one thing, others say another. After considering all views, I believe that [thesis].'
    correction: I argue that [thesis] because [reason]. While some believe [counter-argument],
      [rebuttal].
    explanation: Turkish essays present multiple perspectives before the thesis; English
      expects the thesis first, then addresses counter-arguments.
  - error: '*As Ataturk said, ''Peace at home, peace in the world,'' which shows that
      my argument is valid.'
    correction: Evidence from [source] supports this argument.
    explanation: Turkish writing often cites national figures or proverbs; English
      academic writing requires empirical or scholarly evidence.
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Turkish speakers. Cambridge
    University Press.'
- area: paragraph_structure
  description: 'Turkish paragraphs tend to be longer than English paragraphs and may
    contain multiple related ideas without a single controlling topic sentence. Turkish
    writers often use a ''chain'' structure where sentences are linked by conjunctions
    rather than organized around a central claim. The topic sentence, when present,
    may appear at the end of the paragraph as a conclusion rather than at the beginning
    as a guide. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*A paragraph that presents three examples, a counter-example, and a personal
      opinion — all without a clear topic sentence.'
    correction: A paragraph that opens with a topic sentence, provides 2-3 focused
      examples, and concludes by reinforcing the main idea.
    explanation: Turkish paragraph structure is expansive; English requires a single
      topic sentence with supporting details.
  - error: '*The paragraph ends with a new claim that should begin the next paragraph.'
    correction: End the paragraph with a concluding sentence that synthesizes the
      stated idea.
    explanation: Turkish paragraphs often introduce new ideas at the end; English
      paragraphs must stay unified and conclude by reinforcing the topic sentence.
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Turkish speakers. Cambridge
    University Press.'
- area: cohesion_devices
  description: 'Turkish is an agglutinative language with rich suffixation, so Turkish
    writers may underuse English connectors and transitional phrases, relying instead
    on context to signal relationships. Turkish discourse markers like ''ayrica''
    (moreover), ''bununla birlikte'' (however), and ''sonuc olarak'' (as a result)
    may be overused or used inappropriately in English. Turkish writers may also produce
    run-on sentences by chaining clauses with ''and'' (ve) rather than using subordination.
    McManus (2022): Writing interference reflects learned attention from L1 discourse
    habits. L1 rhetorical patterns shape how writers organize and present arguments
    in L2. Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  common_errors:
  - error: '*The policy was implemented. Ayrica the results were positive. Sonuc olarak
      we can say it worked.'
    correction: The policy was implemented, and the positive results demonstrate its
      effectiveness.
    explanation: Turkish discourse markers are transferred directly; English uses
      subordination and varied transitions.
  - error: '*The economy grew and unemployment fell and exports increased and foreign
      investment rose.'
    correction: As the economy grew, unemployment fell, exports increased, and foreign
      investment rose.
    explanation: Turkish chains clauses with 'and'; English uses subordination to
      show causal relationships.
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Turkish speakers. Cambridge
    University Press.'
- area: register_and_formality
  description: 'Turkish has a formal-informal distinction (siz/sen) that influences
    writing style. Turkish learners may produce writing that is either overly formal
    (using elaborate Ottoman-era vocabulary) or inappropriately direct. The Turkish
    convention of respectful indirectness in argumentation may lead to hedged claims.
    English academic writing expects a neutral, concise register with confident, evidence-backed
    assertions. McManus (2022): Writing interference reflects learned attention from
    L1 discourse habits. L1 rhetorical patterns shape how writers organize and present
    arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*It is with great respect and deepest consideration that this writer humbly
      submits that the matter may perhaps be worthy of attention.'
    correction: This issue deserves attention because [reason].
    explanation: Turkish formal writing uses elaborate deference; English academic
      writing values directness and conciseness.
  - error: '*The data shows the thing is bad and we must fix it now.'
    correction: The data indicate a significant problem that requires immediate intervention.
    explanation: Turkish directness may produce overly casual academic prose; English
      expects measured, formal tone.
  source: 'Swan & Smith (2001). Learner English, Ch. 20: Turkish speakers. Cambridge
    University Press.'
