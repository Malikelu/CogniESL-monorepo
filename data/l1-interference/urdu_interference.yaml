sources:
- citation: 'Swan, M. & Smith (2001) Learner English, 2nd ed. Cambridge University
    Press. Ch. 19: Hindi/Urdu speakers'
  relevance: L1 interference patterns documented for this language group.
- citation: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Hindi/Urdu
  relevance: Urdu phonological and grammatical transfer patterns — SOV word order,
    postpositions, light verbs
total_grammar_points: 51
writing_interference:
- area: argumentative_essay
  common_errors:
  - correction: This issue can be resolved by [specific argument].
    error: '*In the name of God, the most gracious, let us consider this matter from
      many angles before arriving at the truth.'
    explanation: Urdu essays often open with invocations and broad context; English
      expects a direct thesis statement.
  - correction: Research by [author] demonstrates that [evidence].
    error: '*As the wise have said, ''Patience is the key to success,'' which proves
      my point.'
    explanation: Urdu writing privileges proverbial and scriptural authority; English
      academic writing requires empirical or cited evidence.
  description: 'Urdu argumentative writing is shaped by Persian-Arabic rhetorical
    traditions that favor elaborate, ornate prose and circular argumentation. Thesis
    statements are often delayed or implied rather than stated explicitly at the outset.
    Writers may employ poetic allusions, Quranic references, or proverbs as evidence,
    and paragraphs frequently open with broad philosophical statements before narrowing
    to the specific argument. English argumentative essays demand a clear upfront
    thesis, linear logical progression, and evidence grounded in data or cited sources.
    McManus (2022): Writing interference reflects learned attention from L1 discourse
    habits. L1 rhetorical patterns shape how writers organize and present arguments
    in L2. Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Urdu speakers. Cambridge
    University Press.'
- area: paragraph_structure
  common_errors:
  - correction: A paragraph of 4-6 sentences, each supporting one stated topic sentence.
    error: '*A paragraph of 12 sentences covering three different aspects of the topic
      without a clear topic sentence.'
    explanation: Urdu paragraph structure is expansive and associative; English requires
      a single topic sentence with supporting details.
  - correction: End the paragraph with a concluding sentence that synthesizes the
      stated idea.
    error: '*The paragraph ends with a new idea that should be the topic of the next
      paragraph.'
    explanation: Urdu paragraphs often trail into new territory; English paragraphs
      must stay unified and conclude by reinforcing the topic sentence.
  description: 'Urdu paragraphs tend to be longer and more digressive than English
    paragraphs, often weaving multiple related ideas together without a single controlling
    topic sentence. The topic sentence, when present, may appear in the middle or
    at the end of the paragraph. Urdu writers may use a ''chain'' structure where
    each sentence loosely connects to the next rather than all sentences supporting
    one central claim. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Urdu speakers. Cambridge
    University Press.'
- area: cohesion_devices
  common_errors:
  - correction: Because the economy is weak, the government should act to help suffering
      citizens.
    error: '*The economy is weak and the people are suffering and the government should
      act and we must help.'
    explanation: Urdu chains clauses with 'and'; English uses subordination to show
      logical relationships.
  - correction: Because the policy failed, leaders must revise it.
    error: '*The policy failed. To the leaders must change it.'
    explanation: '''To'' (so/therefore) as a sentence opener is a Urdu discourse transfer;
      English requires subordinating conjunctions.'
  description: 'Urdu writing relies heavily on coordinate conjunctions (aur = and,
    lekin = but, magar = however) and tends to chain clauses with ''and'' rather than
    using subordination. Urdu discourse markers like ''to'' (so), ''kyunke'' (because),
    and ''isliye'' (therefore) are often overused at sentence beginnings. The Urdu
    preference for parataxis (coordinate clauses) over hypotaxis (subordinate clauses)
    leads to run-on sentences in English. McManus (2022): Writing interference reflects
    learned attention from L1 discourse habits. L1 rhetorical patterns shape how writers
    organize and present arguments in L2. Restructuring these habits requires explicit
    attention-redirecting instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Urdu speakers. Cambridge
    University Press.'
- area: register_and_formality
  common_errors:
  - correction: This issue is significant because [reason].
    error: '*It is humbly and respectfully brought to your kind attention that the
      matter under discussion is of considerable significance.'
    explanation: Urdu formal writing uses elaborate deference; English academic writing
      values directness and conciseness.
  - correction: 'The data suggest a clear trend: [specific finding].'
    error: '*Perhaps it might be considered that possibly the data could suggest a
      trend.'
    explanation: Urdu politeness conventions lead to excessive hedging; English academic
      writing expects confident, evidence-backed claims.
  description: 'Urdu has an elaborate system of honorifics and formality levels (aap/tum)
    that influences writing style. Urdu learners may produce excessively formal or
    flowery English prose, using archaic vocabulary and elaborate constructions. Conversely,
    they may struggle with the neutral, concise register expected in English academic
    writing. Directness in argumentation may be perceived as rude, leading to hedged
    or indirect claims. McManus (2022): Writing interference reflects learned attention
    from L1 discourse habits. L1 rhetorical patterns shape how writers organize and
    present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  source: 'Swan & Smith (2001). Learner English, Ch. 16: Urdu speakers. Cambridge
    University Press.'
