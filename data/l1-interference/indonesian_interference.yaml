  countability:
    interference_patterns:
    - pattern: Pluralization of uncountable nouns
      example_l1: dua susu, banyak furnitur
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: two milk, many furniture
      example_wrong: two milks / three bags of flours / many furnitures / a lot of
        butters
      example_correct: two glasses of milk / three bags of flour / a lot of furniture
        / a lot of butter
      explanation: Less proficient learners may pluralise English mass nouns. M/I
        nouns are not inflected for number and reduplication is used for plurals.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Abstract nouns treated as countable
      example_l1: lima tahun pengalaman, pendidikan sangat baik
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: five year experience, education very good
      example_wrong: some works to do / five year experiences / very good educations
      example_correct: some work to do / five years of experience / a very good education
      explanation: Abstract nouns which can be mass or count in English produce errors
        when learners treat them as countable.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Plural endings dropped after numbers or quantifiers
      example_l1: Dia punya tiga saudara perempuan dan dua saudara laki-laki
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: She has three sister and two brother
      example_wrong: She have three sister and two brother. / a number of boy / one
        of the man / a few doctor
      example_correct: She has three sisters and two brothers. / a number of boys
        / one of the men / a few doctors
      explanation: M/I nouns are not inflected for number. Plural endings are particularly
        likely to be dropped after numbers or plural quantifiers.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: two milks
      correct: two glasses of milk
    - wrong: many furnitures
      correct: a lot of furniture
    - wrong: She have three sister and two brother.
      correct: She has three sisters and two brothers.
    - wrong: a number of boy
      correct: a number of boys
    - wrong: five year experiences
      correct: five years of experience
    - wrong: The teacher gave too much corrections.
      correct: The teacher gave too many corrections.
    why_it_happens: 'M/I nouns are not inflected for number. Plurals are formed by
      reduplication (kucing-kucing = cats), though not after numerals. Learners drop
      English plural endings and may pluralise mass nouns. (Swan & Smith, pp. 282-283)
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English plurals add -s/-es. Mass nouns cannot be pluralised.
        After numbers, nouns must be plural. Common uncountables: homework, advice,
        information, furniture, luggage.'
      where_to_start: Start with regular plurals. Then teach mass/count distinction.
        Then quantifiers (much/many).
      sequencing: 'Week 1: Regular plurals. Week 2: Mass vs count nouns. Week 3: Quantifiers
        (much/many, few/little). Week 4: Review.'
