  phonology:
    interference_patterns:
    - pattern: /ae/ and /e/ conflated into /e/
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: hat -> /het/, ankle -> /enkal/, grammar -> /grems(r)/
      example_correct: hat -> /haet/, ankle -> /aenkl/, grammar -> /graem@r/
      explanation: Indonesian has only six vowels. /ae/ and /e/ are conflated into
        /e/.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Unaspirated /p, t, k/ (sound like /b, d, g/)
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: pin sounds like bin; tile sounds like dial; cot sounds like got;
        jump -> jum', sergeant -> saajaan, ask -> as'
      example_correct: pin (aspirated), tile (aspirated), cot (aspirated), jump, sergeant,
        ask
      explanation: /p, t, k/ are always unaspirated in M/I, making them sound close
        to /b, d, g/. In final position they are unreleased or omitted.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: /f/ replaced by /p/
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: prefer -> preper, favour -> pavour/papour, film -> pilam
      example_correct: prefer, favour, film
      explanation: /f/ in any position is frequently replaced by /p/ by less proficient
        speakers.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: /v/ replaced by /f/ or /p/
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: very -> fery/pery; final /v/ dropped
      example_correct: very
      explanation: /v/ is very rare in M/I; when used it occurs before vowels only.
        Students replace /v/ by /f/ or /p/, especially at the ends of words.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: /th/ -> /t/ and /dh/ -> /d/
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: thin -> tin, thought -> tot, thousand -> tousan; that -> dat,
        there -> dere
      example_correct: thin, thought, thousand, that, there
      explanation: Learners generally pronounce /th/ as /t/ and /dh/ as /d/.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Final voiced stops and fricatives dropped
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: bulb -> bul, old -> oul, hand -> haan
      example_correct: bulb, old, hand
      explanation: M/I words cannot end in voiced stops /b, d, g/ or the fricatives
        /v, z, sh/ or the affricates /ch, j/. Learners drop these sounds at the ends
        of English words.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Consonant cluster simplification or schwa insertion
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: N/A
      example_wrong: stand -> Stan, talked -> talk; film -> filom, project -> porojek,
        clinic -> klinik
      example_correct: stand, talked, film, project, clinic
      explanation: Relatively few consonant clusters are permitted in M/I. The most
        frequently occurring syllable structure is CVC. Students simplify clusters
        or insert a schwa vowel.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Syllable-timed rhythm; no reduction of function words
      example_l1: N/A (phonological)
      frequency: 4
      persistence: 4
      communicative_impact: 2
      example_gloss: N/A
      example_wrong: Slow, staccato rhythm; auxiliaries and prepositions given full
        pronunciation; contracted forms avoided
      example_correct: Natural English rhythm with reduced forms (I'm, don't, gonna)
      explanation: Most varieties of M/I have a syllable-timed rhythm. Function words
        are almost never reduced. Students give English auxiliary verbs and prepositions
        their full written pronunciation.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: hat -> /het/
      correct: hat -> /haet/
    - wrong: prefer -> preper
      correct: prefer
    - wrong: thin -> tin
      correct: thin
    - wrong: bulb -> bul
      correct: bulb
    - wrong: stand -> Stan
      correct: stand
    why_it_happens: 'The M/I and English phonological systems are very different.
      English has 22 vowels and diphthongs and 24 consonants. Indonesian has only
      six vowels and three diphthongs. M/I has 19 native consonants. M/I syllable
      structure is predominantly CVC with few consonant clusters. (Swan & Smith, pp.
      280-282) McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: Focus on sounds that don''t exist in M/I. Practice minimal
        pairs. Drill consonant clusters. Teach English rhythm and connected speech.'
      where_to_start: Start with the most problematic sounds (/f/ vs /p/, /v/, /th/,
        /dh/). Then consonant clusters. Then rhythm.
      sequencing: 'Week 1: /f/ vs /p/ and /v/. Week 2: /th/ and /dh/. Week 3: Consonant
        clusters. Week 4: Rhythm and connected speech.'
      exercises:
      - name: phonology Audit
        type: error-correction
        description: 20 sentences with phonology errors.
        duration: 15
      - name: phonology Translation
        type: translation
        description: Translate 15 sentences focusing on phonology.
        duration: 15
      - name: phonology Practice
        type: fill-in-the-blank
        description: 20 sentences practicing phonology.
        duration: 10
      - name: phonology Error Hunt
        type: error-correction
        description: A paragraph with 10 phonology errors.
        duration: 15
