  negation:
    interference_patterns:
    - pattern: Use of 'no' as negator (instead of 'not')
      example_l1: Dia tidak paham masalah saya
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: She not understand problems my
      example_wrong: She no understand my problems.
      example_correct: She does not understand my problems.
      explanation: M/I speakers use the negative particles no, not, never and not
        yet indiscriminately. Tidak is the general negator in M/I.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omission of do-support in negation
      example_l1: Saya tidak mau jadi guru
      frequency: 5
      persistence: 4
      communicative_impact: 4
      example_gloss: I not want become teacher
      example_wrong: I not want to be a teacher.
      example_correct: I do not want to be a teacher.
      explanation: M/I negation uses pre-verbal particles (tidak, belum). English
        requires do-support for negation of lexical verbs.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of 'never' for single past negation
      example_l1: Guru tidak datang ke kelas hari ini
      frequency: 3
      persistence: 3
      communicative_impact: 3
      example_gloss: Teacher not come to class today
      example_wrong: The teacher never come to class today.
      example_correct: The teacher did not come to class today.
      explanation: M/I speakers use negative particles indiscriminately, including
        never where English requires did not.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Use of 'not yet' without auxiliary
      example_l1: Dia belum selesaikan PR-nya
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: He not-yet finish homework-his
      example_wrong: He not yet finish his homework.
      example_correct: He has not yet finished his homework.
      explanation: Belum (not yet) is used as a pre-verbal particle in M/I without
        auxiliary verbs.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: She no understand my problems.
      correct: She does not understand my problems.
    - wrong: I not want to be a teacher after I graduate.
      correct: I do not want to be a teacher after I graduate.
    - wrong: The teacher never come to class today.
      correct: The teacher did not come to class today.
    - wrong: He not yet finish his homework.
      correct: He has not yet finished his homework.
    - wrong: I said no to do it again.
      correct: I said I would not do it again.
    why_it_happens: 'M/I uses pre-verbal negative particles (tidak, belum) without
      do-support. English requires do/does/did + not for negation of lexical verbs.
      M/I speakers use no, not, never and not yet indiscriminately. (Swan & Smith,
      p. 289) McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: do/does/did + not + base verb. M/I uses tidak before
        the verb; English needs the auxiliary do.'
      where_to_start: Start with do-support in negation. Then address no vs. not confusion.
      sequencing: 'Week 1: Do/does/did + not. Week 2: No vs. not. Week 3: Never vs.
        did not. Week 4: Review.'
      exercises:
      - name: negation Audit
        type: error-correction
        description: 20 sentences with negation errors from M/I learner writing.
        duration: 15
      - name: negation Translation
        type: translation
        description: Translate 15 sentences focusing on negation.
        duration: 15
      - name: negation Practice
        type: fill-in-the-blank
        description: 20 sentences practicing negation.
        duration: 10
      - name: negation Error Hunt
        type: error-correction
        description: A paragraph with 10 negation errors.
        duration: 15
