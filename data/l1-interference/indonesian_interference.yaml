      how_to_explain: 'Teach the backshift rule: present -> past, will -> would, tomorrow
        -> the next day. M/I keeps the original tense; English changes it.'
      where_to_start: Start with tense backshift. Then teach time/place reference
        changes.
      sequencing: 'Week 1: Tense backshift. Week 2: Time/place reference changes.
        Week 3: Question reporting. Week 4: Review.'
