      how_to_explain: Teach the 'he/she/it + verb-s' rule as non-negotiable. Drill
        with third-person subjects. Teach this/these and much/many distinctions.
      where_to_start: Start with third-person -s. Then demonstratives. Then quantifiers.
      sequencing: 'Week 1: Third-person -s. Week 2: Demonstratives (this/these). Week
        3: Quantifiers (much/many). Week 4: Review.'
