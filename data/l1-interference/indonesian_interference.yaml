  gerund_infinitive:
    interference_patterns:
    - pattern: Gerund/infinitive confusion (to + -ing)
      example_l1: Berlari sangat baik untuk kesehatan
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Running very good for health
      example_wrong: To running very good for your health. / My mother like to cooking
        not to sewing.
      example_correct: Running is very good for your health. / My mother likes cooking,
        not sewing.
      explanation: Gerunds and infinitives do not exist in M/I. The various English
        forms are often confused by learners.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
