  possessives:
    interference_patterns:
    - pattern: Possessive pronoun omission or wrong form
      example_l1: istri saya teman
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: my wife friend / wife-my friend
      example_wrong: my wife friend / my father name Jaid bin Omar / yours school
        bag
      explanation: Possessive relations in M/I can be shown by a bound pronoun -nya
        or by the free personal pronouns. Students find the English system very different.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Of-construction used instead of possessive 's
      example_l1: buku mereka
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: book them/their
      example_wrong: the book of them / their houses / the cat's tails
      explanation: M/I uses noun + possessor word order. Learners use 'of' constructions
        or omit the possessive marker.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: my wife friend
      correct: my wife's friend
    - wrong: my father name Jaid bin Omar.
      correct: my father's name is Jaid bin Omar.
    - wrong: yours school bag
      correct: your school bag
    - wrong: the book of them
      correct: their book
    - wrong: the cat's tails
      correct: the cat's tail
    why_it_happens: 'Possessive relations in M/I can be shown by a bound pronoun -nya
      or by the free personal pronouns dia (he/she/it) and mereka (they). Students
      have difficulty with the very different English system. (Swan & Smith, pp. 283-284)
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
