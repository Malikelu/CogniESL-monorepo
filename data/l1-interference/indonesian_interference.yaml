language: Indonesian
language_code: id
schema_version: '4.0'
writing_interference:
- area: argumentative_essay
  description: 'Indonesian/Malaysian rhetorical tradition follows the ''pemikiran
    melayu'' (Malay thought patterns) that value indirectness, harmony, and consensus.
    Indonesian essays often approach the main argument gradually, using extensive
    background context and avoiding direct confrontation. The Indonesian tradition
    of ''sungkat bertangkang'' (speaking obliquely) means that writers may state their
    thesis implicitly rather than explicitly. Indonesian academic writing often prioritizes
    demonstrating knowledge of sources over constructing an original argument, which
    can produce English essays that read as summaries rather than arguments. McManus
    (2022): Writing interference reflects learned attention from L1 discourse habits.
    L1 rhetorical patterns shape how writers organize and present arguments in L2.
    Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  common_errors:
  - error: '*There are many factors that contribute to this problem, and various experts
      have discussed this issue at length. In this paper, I would like to share some
      thoughts about what others have said regarding this important topic.'
    correction: This essay argues that the primary cause of [problem] is [specific
      factor]. Evidence from [source] demonstrates that [specific finding].
    explanation: Indonesian rhetorical tradition avoids direct thesis statements;
      English essays require a clear, specific thesis in the introduction.
  - error: '*According to Smith (2019), education is important. According to Jones
      (2020), education is valuable. According to Lee (2021), education matters.'
    correction: Research consensus confirms that education significantly impacts economic
      development (Smith, 2019; Jones, 2020; Lee, 2021). This evidence supports the
      argument that [specific claim].
    explanation: Indonesial academic writing often summarizes sources rather than
      using them to support an original argument.
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Indonesian/Malay speakers.
    Cambridge University Press.'
- area: paragraph_structure
  description: 'Indonesian paragraphs tend to be organized around themes rather than
    topic sentences, with the main idea implied through the accumulation of related
    ideas. Indonesian writers may include multiple loosely related points within a
    single paragraph, reflecting Indonesian discourse patterns that value breadth
    over focused development. Indonesian writers may also avoid explicit transitions
    between paragraphs, relying on the reader to follow the implicit logical flow.
    McManus (2022): Writing interference reflects learned attention from L1 discourse
    habits. L1 rhetorical patterns shape how writers organize and present arguments
    in L2. Restructuring these habits requires explicit attention-redirecting instruction,
    not just error correction.'
  common_errors:
  - error: '*A paragraph that lists several related ideas without a clear topic sentence,
      leaving the reader to determine the main point.'
    correction: Begin each paragraph with a clear topic sentence, then develop that
      single idea with supporting evidence.
    explanation: Indonesian paragraphs may rely on thematic accumulation; English
      paragraphs require an explicit topic sentence and unified development.
  - error: '*Several short paragraphs (2-3 sentences each) that each make one underdeveloped
      point.'
    correction: Combine related points into fully developed paragraphs of 5-10 sentences,
      each with a topic sentence, evidence, and analysis.
    explanation: Indonesian prose style favors brevity and implicit connections; English
      academic paragraphs require substantive development of each point.
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Indonesian/Malay speakers.
    Cambridge University Press.'
- area: cohesion_devices
  description: 'Indonesian writing tends toward paratactic structures (placing clauses
    side by side without explicit subordination), reflecting Indonesian discourse
    patterns. Indonesian writers may overuse ''and'' (dan), ''but'' (tapi/tetapi),
    and ''so'' (jadi/maka) as catch-all connectors in English. Indonesian ''yang''
    (which/that) constructions may produce awkward relative clauses. Indonesian writers
    may also repeat nouns rather than using pronouns, and may underuse lexical cohesion
    devices that English requires. McManus (2022): Writing interference reflects learned
    attention from L1 discourse habits. L1 rhetorical patterns shape how writers organize
    and present arguments in L2. Restructuring these habits requires explicit attention-redirecting
    instruction, not just error correction.'
  common_errors:
  - error: '*The government introduced the policy. And the policy was meant to reduce
      poverty. But the results were not as expected. So the government needs to revise
      the approach.'
    correction: Although the government introduced the policy to reduce poverty, the
      results fell short of expectations, necessitating a revised approach.
    explanation: Indonesian coordinates with simple conjunctions; English uses subordination
      and varied connectors for smoother logical flow.
  - error: '*The research was conducted by the team. The team used a survey method.
      The team found significant results.'
    correction: The research team used a survey method and found significant results.
    explanation: Indonesian writing repeats nouns for clarity; English combines sentences
      and uses pronouns for variety.
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Indonesian/Malay speakers.
    Cambridge University Press.'
- area: academic_register
  description: 'Indonesian academic writing tends toward formal register, using elaborate
    language that may sound excessively ceremonial in English. Indonesian writers
    may use passive constructions and impersonal forms to show respect and avoid asserting
    personal opinions directly. However, outside formal contexts, informal Indonesian
    communication styles may bleed into English writing, producing register inconsistencies.
    Indonesian writers may also overuse hedging phrases like ''it can be said that''
    or ''according to some experts'' to avoid committing to claims. McManus (2022):
    Writing interference reflects learned attention from L1 discourse habits. L1 rhetorical
    patterns shape how writers organize and present arguments in L2. Restructuring
    these habits requires explicit attention-redirecting instruction, not just error
    correction.'
  common_errors:
  - error: '*It is respectfully submitted that, based on the observations and considerations
      of various experts in the field, it could perhaps be argued that the proposed
      measures may possibly contribute to some degree of improvement.'
    correction: The proposed measures contribute to measurable improvement in [specific
      area] [source].
    explanation: Indonesian formal writing uses elaborate deference and hedging; English
      academic writing values clarity with appropriate qualification.
  - error: '*The policy kind of worked but there were some issues, so yeah, they need
      to fix it.'
    correction: While the policy achieved partial success, significant issues remain
      that require revision [source].
    explanation: Indonesian informal register bleeds into English academic writing;
      English requires consistent formal register.
  source: 'Swan & Smith (2001). Learner English, Ch. 18: Indonesian/Malay speakers.
    Cambridge University Press.'
grammar_points:
  articles:
    interference_patterns:
    - pattern: Omission of definite article (M/I has no articles)
      example_l1: ujian
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: exam
      example_wrong: How was exam?
      example_correct: How was the exam?
      explanation: M/I has no articles. Demonstratives ini/itu can overlap with 'the'
        but optionally, so learners drop the definite article.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Indefinite article omission before abstract/mass nouns
      example_l1: jumlah sekolah
      frequency: 4
      persistence: 3
      communicative_impact: 3
      example_gloss: number of schools
      example_wrong: number of schools
      example_correct: a number of schools
      explanation: Learners drop the indefinite article before nouns relating to mass,
        quantity, and abstract concepts.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Indefinite article overuse
      example_l1: hobi saya adalah tidur
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: my hobby is sleeping
      example_wrong: My hobbies is a sleeping when I have a problems.
      example_correct: My hobby is sleeping when I have problems.
      explanation: Learners may overuse the indefinite article in contexts where English
        does not require one.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Definite/indefinite article confusion
      example_l1: mereka harus menghadapi resesi ekonomi
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: they must face economic recession
      example_wrong: They have to deal with a economic recession.
      example_correct: They have to deal with the economic recession.
      explanation: The definite article may be used instead of the indefinite and
        vice versa.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Article with demonstrative + plural
      example_l1: Itu punya empat kaki
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: It has four legs
      example_wrong: It have the four legs.
      example_correct: It has four legs.
      explanation: Demonstratives are used with M/I reduplicated plurals, leading
        learners to use an inappropriate article with English plurals.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: How was exam?
      correct: How was the exam?
    - wrong: number of schools
      correct: a number of schools
    - wrong: They have to deal with a economic recession.
      correct: They have to deal with the economic recession.
    - wrong: It have the four legs.
      correct: It has four legs.
    - wrong: My hobbies is a sleeping when I have a problems.
      correct: My hobby is sleeping when I have problems.
    - wrong: They include the secondary school and a kindergarten.
      correct: They include a secondary school and a kindergarten.
    why_it_happens: 'M/I does not have articles. Demonstratives ini (this) and itu
      (that) can overlap with ''the'' but this use is optional. Learners thus drop
      or misuse articles. (Swan & Smith, pp. 285-286) McManus (2022) explains that
      L2 speakers can learn new form-meaning mappings (like articles) that don''t
      exist in L1, but this requires extensive practice to become automatic. Online
      anticipatory processing (using articles to predict upcoming nouns) develops
      only with high proficiency and extended exposure, not from L1 transfer. McManus
      (2022) explains that L2 speakers can learn new form-meaning mappings that don''t
      exist in L1, but this requires extensive practice to become automatic. L2 learning
      involves creating new knowledge when L1-L2 differences exist AND developing
      selection mechanisms to manage competing knowledge sources (McManus 2022, Ch.
      1). Online anticipatory processing develops only with high proficiency and extended
      exposure. Golden et al. (2017): Transfer is non-linear — functional fit between
      L1 and L2 systems matters more than mere formal similarity. English (Germanic)
      learners showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English REQUIRES articles. M/I has no article system,
        so learners must learn everything from scratch.'
      where_to_start: Start with the definite article omission pattern (most common).
      sequencing: 'Week 1: Definite article. Week 2: Indefinite article. Week 3: Article
        with plurals and mass nouns. Week 4: Review.'
      exercises:
      - name: articles Audit
        type: error-correction
        description: 20 sentences with articles errors from M/I learner writing.
        duration: 15
      - name: articles Translation
        type: translation
        description: Translate 15 sentences focusing on articles.
        duration: 15
      - name: articles Practice
        type: fill-in-the-blank
        description: 20 sentences practicing articles.
        duration: 10
      - name: articles Error Hunt
        type: error-correction
        description: A paragraph with 10 articles errors.
        duration: 15
    sources: &id001
    - Swan & Smith Learner English (Indonesian)
    - Parrott Grammar for English Language Teachers
    - McManus
    - Golden
    - Odlin
