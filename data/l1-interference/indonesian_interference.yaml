  modal_verbs:
    interference_patterns:
    - pattern: '''Can'' overused for multiple modal meanings'
      example_l1: Kamu bisa mengemudi, bukan?
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_gloss: You can drive, not
      example_wrong: You can drive, isn't it? / Can you lend me your car or not? /
        She can lend you her car.
      example_correct: You can drive, can't you? / Can you lend me your car? / She
        will lend you her car.
      explanation: The complex English modal system is drastically reduced in M/I
        to two main modals, can and must. Can takes on a wide range of uses (ability,
        permission, willingness, possibility).
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: '''Must be'' for certainty without inversion'
      example_l1: Pasti dia sakit
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Must he sick
      example_wrong: Must be he is sick. / Cannot be he so rich as this.
      example_correct: He must be sick. / He cannot be as rich as this.
      explanation: M/I word order for modal expressions differs. Learners place 'must
        be' at the beginning without inversion.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Modal avoidance; adverbs used instead
      example_l1: Mungkin Ahmad menelepon
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Maybe Ahmad calling-phone
      example_wrong: Maybe Ahmad calling on the phone. / I think Samy joking. / Surely
        that Fatimah.
      example_correct: That will be Ahmad calling on the phone. / Samy could be joking.
        / That has to be Fatimah.
      explanation: Learners may avoid modals altogether, using adverbs or ordinary
        verbs to express modal meanings.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: You can drive, isn't it?
      correct: You can drive, can't you?
    - wrong: Can you lend me your car or not?
      correct: Can you lend me your car?
    - wrong: He can't be sleeping all this time.
      correct: He can't have been sleeping all this time.
    - wrong: Must be he is sick.
      correct: He must be sick.
    - wrong: Cannot be he so rich as this.
      correct: He cannot be as rich as this.
    - wrong: Maybe Ahmad calling on the phone.
      correct: That will be Ahmad calling on the phone.
    - wrong: You must go see your professor.
      correct: You must go and see your professor.
    why_it_happens: 'The complex modal auxiliary system of standard English is drastically
      reduced in M/I to two main modals, can and must. Can in particular takes on
      a wide range of uses. Learners may also avoid modals altogether. (Swan & Smith,
      pp. 288-289) McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach modal hierarchy: can (ability/permission), may (permission/possibility),
        will (future/willingness), must (obligation/certainty), should (advice). M/I
        mainly uses ''bisa'' and ''harus''.'
      where_to_start: Start with can vs may vs will. Then must for certainty. Then
        modal avoidance patterns.
      sequencing: 'Week 1: can/may. Week 2: will/would. Week 3: must/should. Week
        4: Modal avoidance and adverbs.'
      exercises:
      - name: modal_verbs Audit
        type: error-correction
        description: 20 sentences with modal verbs errors from M/I learner writing.
        duration: 15
      - name: modal_verbs Translation
        type: translation
        description: Translate 15 sentences focusing on modal verbs.
        duration: 15
      - name: modal_verbs Practice
        type: fill-in-the-blank
        description: 20 sentences practicing modal verbs.
        duration: 10
      - name: modal_verbs Error Hunt
        type: error-correction
        description: A paragraph with 10 modal verbs errors.
        duration: 15
