  word_order:
    interference_patterns:
    - pattern: SVO but flexible; subject dropped and order reversed
      example_l1: Dari sekolah saya belajar bahasa Inggris
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: From school I learn English
      example_wrong: From school I learn English.
      example_correct: I learn English at school.
      explanation: M/I word order is SVO in formal contexts, but in casual speech
        the subject may be dropped and the word order reversed.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Topicalisation (fronting constituents for emphasis)
      example_l1: Jenis ini kami tidak punya
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Kind this we not have
      example_wrong: This kind we don't have.
      example_correct: We don't have this kind.
      explanation: M/I speakers frequently topicalise constituents by placing them
        at the beginning of sentences.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Pronoun copying (noun + repeated pronoun)
      example_l1: Ibu saya, dia mau saya bantu dia masak
      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: Mother my, she wants I help she cook
      example_wrong: My mother, she wants me to help her cook.
      example_correct: My mother wants me to help her cook.
      explanation: 'Pronoun copying: the subject or object is stated as a noun and
        then repeated in pronominalised form.'
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: From school I learn English.
      correct: I learn English at school.
    - wrong: This kind we don't have.
      correct: We don't have this kind.
    - wrong: Ten per cent off we give our customers.
      correct: We give our customers ten per cent off.
    - wrong: My homework I have to do first.
      correct: I have to do my homework first.
    - wrong: My mother, she wants me to help her cook.
      correct: My mother wants me to help her cook.
    - wrong: Some Europeans, they like to eat here.
      correct: Some Europeans like to eat here.
    - wrong: My sister and me, we always fight.
      correct: My sister and I always fight.
    why_it_happens: 'M/I word order is SVO in formal contexts, but in casual speech
      the subject may be dropped and the word order reversed. Topicalisation and pronoun
      copying are common M/I discourse features. (Swan & Smith, pp. 284-285) McManus
      (2022): The L1 is always active during L2 use cross-language co-activation is
      constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English is strictly SVO. Fronting for emphasis is rare.
        Do not repeat the subject as a pronoun after stating it as a noun.'
      where_to_start: Start with basic SVO order. Then address topicalisation and
        pronoun copying.
      sequencing: 'Week 1: SVO order. Week 2: Topicalisation errors. Week 3: Pronoun
        copying. Week 4: Review.'
      exercises:
      - name: word_order Audit
        type: error-correction
        description: 20 sentences with word order errors from M/I learner writing.
        duration: 15
      - name: word_order Translation
        type: translation
        description: Translate 15 sentences focusing on word order.
        duration: 15
      - name: word_order Practice
        type: fill-in-the-blank
        description: 20 sentences practicing word order.
        duration: 10
      - name: word_order Error Hunt
        type: error-correction
        description: A paragraph with 10 word order errors.
        duration: 15
