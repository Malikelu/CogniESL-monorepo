  questions:
    interference_patterns:
    - pattern: Wh-in-situ (no auxiliary inversion)
      example_l1: Ali beli apa?
      frequency: 5
      persistence: 4
      communicative_impact: 4
      example_gloss: Ali buy what
      example_wrong: Ali buy what?
      example_correct: What did Ali buy?
      explanation: M/I allows wh-in-situ questions (the wh-word stays in its original
        position). English requires auxiliary inversion and do-support.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Omission of do-support in questions
      example_l1: Kenapa kamu marah?
      frequency: 5
      persistence: 4
      communicative_impact: 4
      example_gloss: Why you angry
      example_wrong: Why you so angry?
      example_correct: Why are you so angry?
      explanation: M/I forms questions without do-support. English requires do/does/did
        for most questions (except with be and modals).
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Question tag reduction to isn't it? / is it?
      example_l1: Dia akan ingat, bukan?
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: She will remember, not
      example_wrong: She will remember, isn't it?
      example_correct: She will remember, won't she?
      explanation: English question tags tend to be reduced to only two forms (isn't
        it? and is it?), regardless of the auxiliary in the main clause.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: Ali buy what?
      correct: What did Ali buy?
    - wrong: What Ali buy?
      correct: What did Ali buy?
    - wrong: Why you so angry?
      correct: Why are you so angry?
    - wrong: Want to go where you?
      correct: Where do you want to go?
    - wrong: What that Ali buy?
      correct: What did Ali buy?
    - wrong: She will remember, isn't it?
      correct: She will remember, won't she?
    - wrong: They don't know you, is it?
      correct: They don't know you, do they?
    why_it_happens: 'M/I allows three question structures (in-situ, fully-moved, and
      focus) without do-support. English requires systematic auxiliary inversion.
      Question tags are reduced to two invariant forms. (Swan & Smith, pp. 288-289)
      McManus (2022): The L1 is always active during L2 use cross-language co-activation
      is constant. Managing L1-L2 competition requires inhibitory control (Green 1998
      Inhibitory Control Model). This means L1 transfer is not a temporary phase but
      a permanent feature of multilingual cognition. Learners cannot "switch off"
      the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: Do/Does/Did + subject + base verb? Wh- questions require
        inversion. Question tags must match the auxiliary in the main clause.'
      where_to_start: Start with yes/no questions and do-support. Then teach wh- questions.
        Then question tags.
      sequencing: 'Week 1: Do/does questions. Week 2: Wh- questions. Week 3: Question
        tags. Week 4: Review.'
      exercises:
      - name: questions Audit
        type: error-correction
        description: 20 sentences with questions errors from M/I learner writing.
        duration: 15
      - name: questions Translation
        type: translation
        description: Translate 15 sentences focusing on questions.
        duration: 15
      - name: questions Practice
        type: fill-in-the-blank
        description: 20 sentences practicing questions.
        duration: 10
      - name: questions Error Hunt
        type: error-correction
        description: A paragraph with 10 questions errors.
        duration: 15
