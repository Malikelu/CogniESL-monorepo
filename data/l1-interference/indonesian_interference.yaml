      frequency: 3
      persistence: 3
      communicative_impact: 2
      example_gloss: telephone, bankrupt, economy, industry, psychology
      example_wrong: talipon (spelling), ekonomi (spelling), psikologia (spelling)
      explanation: Lexical transfer or borrowing from English to M/I involves loanwords,
        blends and substitutions. Students may be misled by the M/I spelling of words.
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
    - pattern: Confusion of English word pairs with single M/I equivalent
      example_l1: tinggal (live/stay), bilang/minta/kata (tell/ask/say)
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: live/stay, tell/ask/say
      example_wrong: I've stayed in my village since I was born. / They tell me where
        is the canteen. / She sends her children to school every day.
      example_correct: I've lived in my village since I was born. / They ask me where
        the canteen is. / She takes her children to school every day.
      explanation: M/I learners have considerable problems distinguishing pairs of
        English words that have a single M/I equivalent (e.g., tinggal = live/stay).
      etiology: interlingual
      flagged: true
      tier: 2
      reliability: B
