      how_to_explain: 'Teach: In English, use ONE conjunction per clause. Although
        (NOT although...but). Because (NOT because...as a result). Keep parallel structure
        with and/or.'
      where_to_start: Start with conjunction duplication errors (although...but, because...as
        a result). Then teach parallel structure.
      sequencing: 'Week 1: Conjunction duplication. Week 2: Parallel structure. Week
        3: Complex sentence structure. Week 4: Review.'
