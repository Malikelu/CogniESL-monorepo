      how_to_explain: 'Teach: English prefers concise, idiomatic expressions. Avoid
        tautology (just merely = redundant). Learn common idioms and collocations.'
      where_to_start: Start with common tautology errors. Then teach idiomatic alternatives.
        Then vocabulary expansion.
      sequencing: 'Week 1: Tautology errors. Week 2: Idiomatic expressions. Week 3:
        Concise writing. Week 4: Review.'
