  copula_be:
    interference_patterns:
    - pattern: Omission of copula (to be)
      example_l1: Yusoff sangat gembira
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_gloss: Yusoff very happy
      example_wrong: Yusoff very happy. / His sisters very clever too. / They hardworking
        farmers.
      example_correct: Yusoff is/was very happy. / His sisters are very clever too.
        / They are hardworking farmers.
      explanation: Berada, adalah and ialah correspond to the English copula to be,
        but they are frequently optional. The copula is dropped in sentences expressing
        a condition or state.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Incorrect copula use (number/person errors)
      example_l1: Orang tua mereka tidak senang
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Parents their not happy
      example_wrong: Their parents not happy. / Their parent is not happy. / They
        was hardworking farmers.
      example_correct: Their parents are not happy. / Their parents are not happy.
        / They were hardworking farmers.
      explanation: Mother-tongue interference and confusion over which form is correct
        results in omission of forms of to be, or errors in their use.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
    - wrong: Yusoff very happy.
      correct: Yusoff is very happy.
    - wrong: His sisters very clever too.
      correct: His sisters are very clever too.
    - wrong: They hardworking farmers.
      correct: They are hardworking farmers.
    - wrong: Their parents not happy.
      correct: Their parents are not happy.
    why_it_happens: 'Berada, adalah and ialah correspond to the English copula to
      be, but they are frequently optional. The copula is dropped in sentences expressing
      a condition or state of existence. (Swan & Smith, pp. 287-288) McManus (2022):
      The L1 is always active during L2 use cross-language co-activation is constant.
      Managing L1-L2 competition requires inhibitory control (Green 1998 Inhibitory
      Control Model). This means L1 transfer is not a temporary phase but a permanent
      feature of multilingual cognition. Learners cannot "switch off" the L1; instead,
      they must develop mechanisms to manage competing representations. Domain-general
      learning mechanisms (memory, analogy, categorization) support building new L2
      form-meaning mappings. McManus (2022): Explicit/declarative knowledge of L2
      forms does not automatically translate to real-time processing ability. The
      online-offline knowledge gap is well-documented: learners may pass offline tests
      but fail in real-time comprehension/production. To bridge this gap, extensive
      practice and repeated processing opportunities are needed (DeKeyser 1997, 2017:
      automatization theory). Learners need massive structured input floods that push
      attention to target features, not just explicit rule explanation. Golden et
      al. (2017): Transfer is non-linear — functional fit between L1 and L2 systems
      matters more than mere formal similarity. English (Germanic) learners showed
      NO advantage over Slavic learners on Norwegian spatial prepositions. Gender
      system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): L1s without article systems
      show predictable difficulty patterns: higher omission rates but potentially
      higher accuracy when articles are used (Vietnamese classifier compensation effect).
      This confirms Odlin (Ch.3) prediction: any L1 without articles will have more
      difficulty than L1s with articles, but transfer effects are non-linear and may
      involve compensating cognitive strategies. Golden et al. (2017): L1s without
      grammatical gender must build gender assignment from scratch, but compensating
      strategies (e.g., Vietnamese classifiers for animacy/shape) may partially support
      acquisition. Vietnamese learners omit articles more but are accurate when present.'
    teacher_tips:
      how_to_explain: 'Teach: English ALWAYS needs a verb. After a subject + adjective,
        you need ''be'' (am/is/are/was/were). M/I can drop this; English cannot.'
      where_to_start: Start with subject + be + adjective. Then subject + be + noun.
        Then subject + be + location.
      sequencing: 'Week 1: am/is/are with adjectives. Week 2: was/were (past). Week
        3: be + noun/location. Week 4: Review.'
      exercises:
      - name: copula_be Audit
        type: error-correction
        description: 20 sentences with copula be errors from M/I learner writing.
        duration: 15
      - name: copula_be Translation
        type: translation
        description: Translate 15 sentences focusing on copula be.
        duration: 15
      - name: copula_be Practice
        type: fill-in-the-blank
        description: 20 sentences practicing copula be.
        duration: 10
      - name: copula_be Error Hunt
        type: error-correction
        description: A paragraph with 10 copula be errors.
        duration: 15
