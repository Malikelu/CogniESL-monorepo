  tense_aspect:
    interference_patterns:
    - pattern: Simple past for present perfect (sudah/telah/pernah)
      example_l1: Saya menulis surat kemarin
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_gloss: I write letter yesterday
      example_wrong: I write the letter yesterday. / I was write yesterday the letter.
        / I finished written the letter.
      example_correct: I wrote the letter yesterday. / I wrote the letter yesterday.
        / I finished writing the letter.
      explanation: M/I has nothing corresponding to the English distinction between
        simple past and present perfect. Sudah/telah/pernah indicates completion but
        maps to both.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Present tense with time adverb for progressive
      example_l1: Sekarang dia berenang
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Now he swim
      example_wrong: Now he swim. / He is swim at this time. / He swim right now.
      example_correct: He is swimming now. / He is swimming at this time. / He is
        swimming right now.
      explanation: M/I uses the temporal adverb sekarang (now) before or after a verb
        to signify an ongoing action. Learners transfer this to English without the
        -ing form.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Future time expressed without will/going to
      example_l1: Besok kamu datang
      frequency: 4
      persistence: 4
      communicative_impact: 3
      example_gloss: Tomorrow you come
      example_wrong: Tomorrow you come. / This book will we read. / They will to market
        on Sunday.
      example_correct: Tomorrow you will come. / We will read this book. / They will
        go to the market on Sunday.
      explanation: The aspectual particle akan in M/I indicates future time. Students
        have problems using and distinguishing the various English future forms.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    - pattern: Progressive/continuous without auxiliary
      example_l1: Mereka makan malam ini
      frequency: 5
      persistence: 5
      communicative_impact: 4
      example_gloss: They eat dinner this-night
      example_wrong: They eating their dinner tonight. / They coming back late tomorrow.
        / They waiting here since 2 o'clock past.
      example_correct: They are eating their dinner tonight. / They are coming back
        late tomorrow. / They have been waiting here since 2 o'clock.
      explanation: M/I expresses durative aspect using sedang/semasa/sewaktu/sementara
        with a verb. Learners use the English -ing form but drop the auxiliary.
      etiology: interlingual
      flagged: true
      tier: 3
      reliability: B
    examples:
