      location: Sec. 3, Morphology and Parts of Speech
      source: Steever in Comrie (ed.) World's Major Languages, Ch.37
      tier: 1
    communicative_impact: 3
    examples:
    - 'Wrong: ''I gave the book to him.'' (overuse of ''to'' where double-object is
      natural) Correct: ''I gave him the book.'''
    - 'Wrong: ''She is in bus.'' Correct: ''She is on the bus.'''
    - 'Wrong: ''Me and him went to store.'' Correct: ''He and I went to the store.'''
    - 'Wrong: ''I bought book from shop.'' Correct: ''I bought the book from the shop.'''
    flagged: false
    frequency: 4
    individually_assessed: true
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I gave him the book. / I gave the book to him.
      example_gloss: I him-to book gave
      example_l1: naan avanukku puththagam kodutthen (நான் அவனுக்கு புத்தகம் கொடுத்தேன்)
      example_wrong: I gave the book to him.
      explanation: Tamil uses the dative case marker -kku to mark the recipient, and
        the word order is typically Subject plus Dative plus Object plus Verb. English
        can use either double-object construction ('I gave him the book') or prepositional
        ('I gave the book to him'). Tamil speakers may overuse the 'to' construction
        because it maps more directly from the dative case.
      flagged: true
      frequency: 4
      pattern: Tamil dative case -kku transferred as 'to' but overgeneralized -> English
        uses word order and prepositions differently
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I bought the book.
      example_gloss: I book-accusative bought
      example_l1: naan puththagaththai vaanginen (நான் புத்தகத்தை வாங்கினேன்)
      example_wrong: I bought book.
      explanation: Tamil marks the direct object with the accusative suffix -ai. Since
        English has no case markers on common nouns, Tamil speakers may feel that
        the object is 'unmarked' and omit articles as well. The accusative case in
        Tamil also signals definiteness, which maps to English 'the.'
      flagged: true
      frequency: 4
      pattern: Tamil accusative case -ai omitted in English -> English uses word order,
        not case markers
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: The book is on the table.
      example_gloss: Book table-on is
      example_l1: puththagam mesayil irukkiradhu (புத்தகம் மேசையில் இருக்கிறது)
      example_wrong: Book is in table.
      explanation: Tamil uses the locative suffix -il for all surface contact (on,
        in, at). English distinguishes 'on' (surface), 'in' (enclosed), and 'at' (point
        location). Tamil speakers may use 'in' for all locative meanings because -il
        covers all of them.
      flagged: true
      frequency: 3
      pattern: Locative case -il transferred as 'in/on/at' with errors -> English
        preposition choice depends on spatial relationship
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: He saw me.
      example_gloss: Me he saw
      example_l1: enai avan paarththaan (என்னை அவன் பார்த்தான்)
      example_wrong: Me saw him.
      explanation: 'Tamil pronouns also change form for case (naan ''I'' -> ennai
        ''me''), but the mapping is not 1:1 with English. Tamil speakers may use the
        wrong English pronoun form, especially in coordinated structures: ''Me and
        him went'' instead of ''He and I went.'''
      flagged: true
      frequency: 3
      pattern: Pronoun case forms confused -> English pronouns retain case distinctions
        (I/me, he/him, she/her)
      persistence: 3
      reliability: B
      tier: 1
    notes: Tamil has 8 cases. The locative -il is particularly problematic as it maps
      to in/on/at.
    persistence: 4
    source_count: 7
    source_rank: 1
    source_type: literature
    sources:
    - 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
      and Other Problems (2nd ed.). Cambridge University Press.'
    - Lehmann, T. (1993). A Grammar of Modern Tamil. Pondicherry Institute of Linguistics
      and Culture.
    - Asher, R.E. (1982). Tamil. Lingua Descriptive Studies, North-Holland.
    - Murphy, R. (2019). English Grammar in Use (5th ed.). Cambridge University Press.
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: Create cards with Tamil case suffixes on one set (8 cards) and
          English prepositions on another set (15+ cards). Students match each Tamil
          case to its possible English preposition equivalents. Discuss cases where
          one Tamil case maps to multiple English prepositions. Then students write
          3 example sentences for each mapping.
        duration: 20
        name: Case-to-Preposition Mapping
        type: matching
      - description: 'Teacher describes scenes using Tamil locative constructions.
          Students draw what they hear, then write the correct English prepositional
          phrase. Example: ''The cat is -il the table'' becomes students draw and
          write ''The cat is on the table.'' 10 scenes total, progressing from simple
          to complex spatial relationships.'
        duration: 15
        name: Preposition Picture Dictation
        type: oral-drill
      - description: Give students a worksheet with 15 sentences containing pronoun
          case errors typical of Tamil speakers (e.g., 'Me and him went,' 'Between
          you and I,' 'She gave it to he'). Students correct each sentence and identify
          the grammatical role (subject, object, object of preposition) of each pronoun.
        duration: 10
        name: Pronoun Case Correction
        type: error-correction
      - description: Provide 10 Tamil sentences with case-marked nouns. Students must
          identify each case suffix, determine the correct English preposition (or
          word order), and translate the sentence. Include at least one sentence where
          the Tamil case maps to multiple possible English prepositions, requiring
          context to choose.
        duration: 15
        name: Tamil Case Translation
        type: translation
      how_to_explain: 'Draw a diagram on the board showing Tamil noun plus case suffix
        on one side and English noun plus preposition on the other. Say: ''In Tamil,
        you add a small piece to the END of the noun to show its job in the sentence.
        In English, you put a SMALL WORD BEFORE the noun instead.'' Show: mesai plus
        il = table plus on = ''on the table.'' Use physical objects: put a book ON
        a table, IN a box, AT a desk -- each time showing the Tamil suffix and the
        English preposition.'
      sequencing: 'Week 1: Locative case -- in/on/at with physical objects. Week 2:
        Dative case -- to/for with verbs of giving and telling. Week 3: Accusative
        case -- word order and article usage. Week 4: Instrumental and ablative cases
        -- with/from/by. Week 5: Pronoun case forms (I/me, he/him, she/her, we/us,
        they/them).'
      where_to_start: Begin with the locative case (-il) and the three English prepositions
        'in,' 'on,' 'at.' Use real objects in the classroom. Then move to the dative
        (-kku) and 'to/for.' Finally, cover the accusative (-ai) and its relationship
        to English articles and word order.
    tier: 1
    why_it_happens: 'Tamil is an agglutinative language with 8 grammatical cases marked
      by suffixes: nominative (unmarked), accusative (-ai), dative (-kku), instrumental
      (-aal), locative (-il), genitive (-udaiya/oda), vocative (-e), and ablative
      (-irundhu). Each suffix is added to the noun stem, and multiple suffixes can
      stack. English, by contrast, has almost no case marking on nouns (only possessive
      ''s and pronoun forms like I/me/him). English relies on word order and prepositions
      to express the same relationships that Tamil expresses through case suffixes.
      Tamil speakers must learn to translate case suffixes into prepositions, but
      the mapping is imperfect: one Tamil case may correspond to multiple English
      prepositions depending on context. The locative -il alone can mean ''in,'' ''on,''
      ''at,'' or ''upon'' in English. This many-to-many mapping causes persistent
      preposition errors. McManus (2022): The L1 is always active during L2 use cross-language
      co-activation is constant. Managing L1-L2 competition requires inhibitory control
      (Green 1998 Inhibitory Control Model). This means L1 transfer is not a temporary
      phase but a permanent feature of multilingual cognition. Learners cannot "switch
      off" the L1; instead, they must develop mechanisms to manage competing representations.
      Domain-general learning mechanisms (memory, analogy, categorization) support
      building new L2 form-meaning mappings. McManus (2022): Explicit/declarative
      knowledge of L2 forms does not automatically translate to real-time processing
      ability. The online-offline knowledge gap is well-documented: learners may pass
      offline tests but fail in real-time comprehension/production. To bridge this
      gap, extensive practice and repeated processing opportunities are needed (DeKeyser
      1997, 2017: automatization theory). Learners need massive structured input floods
      that push attention to target features, not just explicit rule explanation.
      Golden et al. (2017): Transfer is non-linear — functional fit between L1 and
      L2 systems matters more than mere formal similarity. English (Germanic) learners
      showed NO advantage over Slavic learners on Norwegian spatial prepositions.
      Gender system transfer is non-linear (L1 gender != automatic advantage). Conceptual
      transfer affects spatial relations, emotion language, and article use. Accuracy
      + text length account for 80% of writing ratings; cultural-rhetorical style
      accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries. Odlin (Ch.4): SOV word order IS transferable to English SVO. The LEAST
      proficient speakers show the MOST transfer. Proficiency-sensitive pattern confirmed
      across 11 language contact situations (Hawaiian Pidgin English, Andean Spanish,
      Pidgin Fijian, Indo-Portuguese creole, etc.). Refutes Zobl & Rutherford''s claimed
      universal constraint. Word-order transfer more likely in informal/unfocused
      contexts. Odlin (Ch.3): Languages with rich case systems may show COVERT transfer
      — the absence of expected English prepositions reflects L1 influence. Finnish
      (15 cases) learners omit obligatory English prepositions because Finnish uses
      nominal case inflections instead. Similar patterns expected for other case-system
      L1s transferring case-based strategies to English preposition use.'
