        -> perceived as heavy accent
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: Pronouncing 'think' with dental fricative /theta/
      example_gloss: fee (with aspirated stop /pʰ/ instead of fricative /f/)
      example_l1: phee (ஃபீ) for 'fee', thinku for 'think'
      example_wrong: Pronouncing 'think' as 'tink'
      explanation: Tamil has no labiodental fricative /f/ -- it is replaced by the
        aspirated bilabial stop /pʰ/. English 'fee' becomes 'phee.' Similarly, /theta/
        (think) is replaced by dental /t/, and /z/ (zoo) by /s/ or /dz/. The 'th'
        sounds are particularly challenging because Tamil has no dental fricatives
        at all.
      flagged: true
      frequency: 3
      pattern: Tamil lacks fricatives /f/, /theta/, /z/ -> substituted with native
        sounds
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 2
      etiology: interlingual
      example_correct: ship = /ɪ/ (short, lax) versus sheep = /iː/ (long, tense)
      example_gloss: better (with long vowels where English has short/lax vowels)
      example_l1: peetter (பீட்டர்) for 'better'
      example_wrong: Pronouncing 'ship' and 'sheep' identically with a long /i/
      explanation: Tamil distinguishes vowels by length (short versus long) but not
        by quality (tense versus lax). English distinguishes 'ship/sheep' by both
        length AND tongue position. Tamil speakers may use the same vowel quality
        for both, relying only on length, which can cause confusion between minimal
        pairs like ship/sheep, pull/pool, and full/fool.
      flagged: true
      frequency: 3
      pattern: Tamil vowel length distinction replaces English tense/lax distinction
        -> vowel quality errors
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: Pronouncing 'street' as /striːt/ -- three consonants in a row
        without extra vowels
      example_gloss: school (with epenthetic /ɪ/ before the cluster)
      example_l1: ischool or sakool for 'school'
      example_wrong: Pronouncing 'street' as 'istreet' or 'isrit'
      explanation: 'Tamil syllables typically follow a (C)V(C) pattern -- consonant
        clusters at the beginning of words are rare. English allows complex clusters
        like /str/ (street), /spl/ (splash). Tamil speakers often insert a short vowel
        (usually /ɪ/) before or within clusters to make them pronounceable in Tamil
        phonotactics: ''school'' becomes /ɪskuːl/, ''street'' becomes /ɪsriːt/.'
