        the ridge behind upper teeth
      example_gloss: tea (with retroflex /ʈ/ instead of alveolar /t/)
      example_l1: Tee (டீ) for 'tea'
      example_wrong: Pronouncing 'tea' with a retroflex /ʈ/ -- tongue curled back
        against the palate
      explanation: 'Tamil has a four-way distinction in stops: labial (p), dental
        (t), retroflex (T), and velar (k). English has a two-way distinction: voiceless
        (t) versus voiced (d). Tamil speakers use their retroflex T for English ''t''
        and ''d,'' producing a characteristically Indian English sound. The dental
        Tamil th is closer to English /t/ but still different because English /t/
        is alveolar, not dental.'
