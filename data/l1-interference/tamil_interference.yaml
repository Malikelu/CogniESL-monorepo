  article_usage:
    assessment: Expert-evaluated. Article omission is the most frequent and persistent
      error for Tamil learners. It rarely blocks communication but is a major marker
      of non-nativeness.
    citations:
    - claim: Interference pattern for article usage
      location: 'Chapter: Tamil speakers, pp. 243-250'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: article usage'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    - claim: Tamil has no formal article class; numeral oru 'one' functions as indefinite
        article; its absence with rational nouns conveys definiteness
      location: Sec. 3, Morphology and Parts of Speech
      source: Steever in Comrie (ed.) World's Major Languages, Ch.37
      tier: 1
    - claim: 'Irrational direct objects: nominative = indefinite, accusative = definite;
        definiteness is marked by case morphology, not by articles'
      location: Sec. 3, Morphology and Parts of Speech
      source: Steever in Comrie (ed.) World's Major Languages, Ch.37
      tier: 1
    communicative_impact: 2
    examples:
    - 'Wrong: ''I want to become engineer.'' Correct: ''I want to become an engineer.'''
    - 'Wrong: ''Please close door.'' Correct: ''Please close the door.'''
    - 'Wrong: ''The gold is expensive metal.'' Correct: ''Gold is an expensive metal.'''
    - 'Wrong: ''She gave me advice.'' Correct: ''She gave me some advice.'''
    flagged: false
    frequency: 5
    individually_assessed: true
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: He is a teacher.
      example_gloss: He student
      example_l1: avan maanavan (அவன் மாணவன்)
      example_wrong: He is teacher.
      explanation: Tamil has no article system. Definiteness is inferred from context,
        demonstratives (anda 'that'), or word order. English requires 'a/an' before
        singular countable nouns. Tamil speakers systematically omit articles, producing
        'I bought book' or 'She is doctor.'
      flagged: true
      frequency: 3
      pattern: Indefinite article 'a/an' omitted before singular countable nouns ->
        English requires an article
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: The book is on the table.
      example_gloss: Book table-on is
      example_l1: puththagam mesayil irukkiradhu (புத்தகம் மேசையில் இருக்கிறது)
      example_wrong: Book is on table.
      explanation: When Tamil speakers know which specific book and table they are
        referring to, they use no article because Tamil lacks them entirely. English
        requires 'the' for specific, known referents. This leads to bare noun phrases
        that sound telegraphic.
      flagged: true
      frequency: 3
      pattern: Definite article 'the' omitted when specificity is clear from context
        -> English still requires 'the'
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: Thiruvalluvar said that patience is the greatest virtue.
      example_gloss: Thiruvalluvar said
      example_l1: Thiruvalluvar koorinaar (திருவள்ளுவர் கூறினார்)
      example_wrong: The Thiruvalluvar said that the patience is the greatest virtue.
      explanation: Because Tamil speakers learn that English uses 'the' for specificity,
        they may overgeneralize it to proper nouns (the Gandhi, the India) and abstract
        nouns (the patience, the happiness) where English uses zero article.
      flagged: true
      frequency: 3
      pattern: Article 'the' overused with proper nouns and abstract nouns -> English
        does not use 'the' with most proper nouns
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: The tiger is a beautiful animal. / Tigers are beautiful animals.
      example_gloss: Tiger beautiful animal
      example_l1: puli azhagaaana vilangu (புலி அழகான விலங்கு)
      example_wrong: Tiger is beautiful animal.
      explanation: Tamil uses bare nouns for generic reference. English requires either
        'the + singular' or 'plural without article' for generic statements. Tamil
        speakers produce bare noun generics that sound incomplete in English.
      flagged: true
      frequency: 3
      pattern: Generic reference without article -> English requires 'the' or plural
        for generic reference
      persistence: 3
      reliability: B
      tier: 1
    notes: Tamil has zero articles. The closest equivalent is oru (one) for indefinite
      reference and demonstratives for definite reference.
    persistence: 5
    source_count: 7
    source_rank: 1
    source_type: literature
    sources:
    - 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
      and Other Problems (2nd ed.). Cambridge University Press.'
    - 'Master, P. (1997). The English article system: Acquisition, function, and pedagogy.
      System, 25(2), 215-232.'
    - Robertson, D. (2000). Variability in the use of the English article system by
      Chinese learners of English. Second Language Research, 16(2), 135-172.
    - 'Celce-Murcia, M. & Larsen-Freeman, D. (1999). The Grammar Book: An ESL/EFL
      Teacher''s Course (2nd ed.). Heinle & Heinle.'
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: 'Students walk around the classroom and write 10 sentences about
          objects they see, using correct articles. Example: ''There is ___ whiteboard
          at the front. ___ whiteboard is new.'' Partners check each other''s articles.
          Teacher circulates and provides feedback.'
        duration: 15
        name: 'Article Audit: Classroom Edition'
        type: fill-in-the-blank
      - description: Prepare 30 sentence strips with blanks where articles should
          go. Students work in pairs to place each sentence in the 'a/an' pile or
          'the' pile and fill in the correct article. Sentences progress from concrete/visible
          to abstract. Pairs compare answers and discuss disagreements.
        duration: 15
        name: A versus The Sorting Game
        type: matching
      - description: Provide 12 Tamil-style bare-noun sentences (e.g., 'I bought book
          from store near house'). Students must add all necessary articles and rewrite
          the sentences correctly. Then they compare with a partner and explain their
          article choices.
        duration: 15
        name: Article-Free to Article-Full
        type: transformation
      - description: Give students a 150-word essay written by a fictional Tamil learner.
          The essay has 15 article errors (omissions and overuses). Students must
          find each error, correct it, and explain why the article was wrong. Class
          discusses the most common patterns found.
        duration: 15
        name: Spot the Article Error
        type: error-correction
      how_to_explain: 'Say: ''In Tamil, you can say just book -- no extra word needed.
        In English, every singular countable noun needs a companion word -- either
        a or the. Think of it like this: a means ANY one (not specific), the means
        THIS one (specific, we both know which).'' Write on board: ''___ book is on
        ___ table.'' Ask: ''Which book? Which table?'' If specific then use the. If
        any book/table then use a. Use a bag of objects: hold up ''a pencil'' (any
        pencil) versus ''the pencil'' (this specific one).'
      sequencing: 'Week 1: Indefinite article a/an with singular countable nouns.
        Week 2: Definite article ''the'' with specific/known referents. Week 3: Zero
        article with plurals and uncountables. Week 4: Generic reference (the tiger
        / tigers). Week 5: Fixed expressions and exceptions (go to school, at home,
        by bus).'
      where_to_start: 'Start with the indefinite article ''a/an'' using classroom
        objects. Hold up objects: ''This is a pen. This is a book.'' Then introduce
        ''the'' by pointing: ''The door is open. The board is clean.'' Establish the
        ANY versus THAT distinction before moving to abstract uses.'
    tier: 1
    why_it_happens: 'Tamil has no article system whatsoever -- no definite article,
      no indefinite article, no partitive article. This is a fundamental typological
      gap. In Tamil, definiteness and specificity are conveyed through demonstratives
      (inda ''this'', anda ''that''), numeral ''one'' (oru for indefinite), or simply
      through context and shared knowledge. English, by contrast, has a complex article
      system that distinguishes between specific/definite (the), specific/indefinite
      (a/an), generic (the plus singular or bare plural), and mass/non-count (zero
      article). Tamil speakers face a triple challenge: they must learn that articles
      exist as a grammatical category, they must learn the complex rules governing
      when to use a versus an versus the versus zero, and they must develop the habit
      of inserting articles automatically, which requires years of practice. The error
      is highly persistent because article omission does not typically cause communication
      failure -- listeners can usually understand the meaning from context, so the
      error is rarely corrected naturally. McManus (2022): The L1 is always active
      during L2 use cross-language co-activation is constant. Managing L1-L2 competition
      requires inhibitory control (Green 1998 Inhibitory Control Model). This means
      L1 transfer is not a temporary phase but a permanent feature of multilingual
      cognition. Learners cannot "switch off" the L1; instead, they must develop mechanisms
      to manage competing representations. Domain-general learning mechanisms (memory,
      analogy, categorization) support building new L2 form-meaning mappings. McManus
      (2022): Explicit/declarative knowledge of L2 forms does not automatically translate
      to real-time processing ability. The online-offline knowledge gap is well-documented:
      learners may pass offline tests but fail in real-time comprehension/production.
      To bridge this gap, extensive practice and repeated processing opportunities
      are needed (DeKeyser 1997, 2017: automatization theory). Learners need massive
      structured input floods that push attention to target features, not just explicit
      rule explanation. Golden et al. (2017): Transfer is non-linear — functional
      fit between L1 and L2 systems matters more than mere formal similarity. English
      (Germanic) learners showed NO advantage over Slavic learners on Norwegian spatial
      prepositions. Gender system transfer is non-linear (L1 gender != automatic advantage).
      Conceptual transfer affects spatial relations, emotion language, and article
      use. Accuracy + text length account for 80% of writing ratings; cultural-rhetorical
      style accounts for the remaining 20%. Golden et al. (2017): Even L1s with article
      systems show non-linear transfer. Having articles helps but does not eliminate
      errors because specific article rules (definite/indefinite/zero) vary across
      languages. Transfer depends on functional fit of article usage rules, not just
      presence of articles in L1. Golden et al. (2017): L1s without grammatical gender
      must build gender assignment from scratch, but compensating strategies (e.g.,
      Vietnamese classifiers for animacy/shape) may partially support acquisition.
      Vietnamese learners omit articles more but are accurate when present. Odlin
      (Ch.2): "Transfer" term predates behaviorism (Whitney 1881, Sapir 1921). Post-behaviorist
      constructs — activation, automaticity, entrenchment — explain transfer patterns.
      Weinreich and Lado both focused on crosslinguistic similarities/differences;
      CAH (Contrastive Analysis Hypothesis) was coined by Wardhaugh (1970), not Lado
      or Fries. Odlin (Ch.4): SOV word order IS transferable to English SVO. The LEAST
      proficient speakers show the MOST transfer. Proficiency-sensitive pattern confirmed
      across 11 language contact situations (Hawaiian Pidgin English, Andean Spanish,
      Pidgin Fijian, Indo-Portuguese creole, etc.). Refutes Zobl & Rutherford''s claimed
      universal constraint. Word-order transfer more likely in informal/unfocused
      contexts. Odlin (Ch.3): Languages with rich case systems may show COVERT transfer
      — the absence of expected English prepositions reflects L1 influence. Finnish
      (15 cases) learners omit obligatory English prepositions because Finnish uses
      nominal case inflections instead. Similar patterns expected for other case-system
      L1s transferring case-based strategies to English preposition use.'
