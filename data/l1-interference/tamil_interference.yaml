  sov_word_order:
    assessment: Expert-evaluated. SOV-to-SVO transfer is the single most pervasive
      syntactic error for Tamil learners of English. It affects every sentence they
      produce and is highly persistent because word order is processed automatically.
    citations:
    - claim: Interference pattern for sov word order
      location: 'Chapter: Tamil speakers, pp. 243-250'
      source: 'Swan & Smith (2001) ''Learner English: A Teacher''s Guide to Interference
        and Other Problems'', 2nd ed., Cambridge University Press'
      tier: 1
    - claim: 'Grammar point: sov word order'
      location: See relevant grammar point section
      source: Parrott (2000) 'Grammar for English Language Teachers', Cambridge University
        Press
      tier: 2
    - claim: 'Inhibitory control model: L1 always active, requires cognitive management
        to select L2'
      location: Ch. 1-2
      source: McManus (2022) Crosslinguistic Influence and Second Language Learning
      tier: 3
    - claim: 'Norwegian learner corpus: conceptual transfer, non-linear gender, functional
        fit'
      location: Various chapters
      source: Golden et al. (2017) Crosslinguistic Influence and Distinctive Patterns
        of Language Learning
      tier: 3
    - claim: 'Language Transfer: Odlin — Explorations of Language Transfer'
      location: Chapters 2-8
      source: Odlin, T. Explorations of Language Transfer
      tier: 4
    - claim: SOV basic order; genitives precede nouns, main verbs precede auxiliaries,
        complements precede main clauses; verb at extreme right is almost fixed
      location: Sec. 4, Simple and Complex Sentences
      source: Steever in Comrie (ed.) World's Major Languages, Ch.37
      tier: 1
    - claim: Dative subjects used for mental/emotional states (avanukku ko-pam 'to-him
        anger'); dative subjects do not trigger agreement but can bind reflexives
      location: Sec. 4, Simple and Complex Sentences
      source: Steever in Comrie (ed.) World's Major Languages, Ch.37
      tier: 1
    communicative_impact: 4
    examples:
    - 'Wrong: ''I the letter wrote yesterday.'' Correct: ''I wrote the letter yesterday.'''
    - 'Wrong: ''She the children taught patiently.'' Correct: ''She taught the children
      patiently.'''
    - 'Wrong: ''He quickly ran and bought the book.'' Correct: ''He ran quickly and
      bought the book.'''
    - 'Wrong: ''I him gave the money.'' Correct: ''I gave him the money.'''
    flagged: false
    frequency: 5
    individually_assessed: true
    interference_patterns:
    - communicative_impact: 3
      etiology: interlingual
      example_correct: I ate rice.
      example_gloss: I ate vegetarian-food
      example_l1: naan saappitten saivam (நான் சாப்பிட்டேன் சைவம்)
      example_wrong: I rice ate.
      explanation: 'Tamil is a rigid SOV language: the verb always comes at the end.
        English is SVO. Tamil speakers often produce sentences like ''I rice ate''
        or ''She the book read.'' The error is most visible with direct/indirect object
        pairs: Tamil ''Naan avanukku kaattinaen puttakam'' (I him showed book) becomes
        ''I him showed the book'' instead of ''I showed him the book.'''
      flagged: true
      frequency: 3
      pattern: Tamil SOV word order transferred to English -> English requires SVO
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: She sang the song beautifully.
      example_gloss: She sang song-the
      example_l1: aval paadinaal paattai (அவள் பாடினாள் பாட்டை)
      example_wrong: She the song sang beautifully.
      explanation: In Tamil, the object precedes the verb and takes the accusative
        suffix -ai/-ei. English speakers expect Verb-Object order. Tamil learners
        may produce 'She the song sang' or place adverbs in unexpected positions because
        Tamil places adverbs before the verb phrase, not after.
      flagged: true
      frequency: 3
      pattern: Object placed before verb in English -> English requires verb before
        object complement
      persistence: 3
      reliability: B
      tier: 1
    - communicative_impact: 3
      etiology: interlingual
      example_correct: He ran to the store quickly.
      example_gloss: He ran quickly
      example_l1: avan oadinaan vegamaaga (அவன் ஓடினான் வேகமாக)
      example_wrong: He quickly ran to the store.
      explanation: Tamil places manner adverbs immediately before the final verb.
        English allows both pre-verbal and post-verbal adverb positions, but the rules
        are different. Tamil speakers may overuse pre-verbal placement or produce
        awkward post-verbal orders.
      flagged: true
      frequency: 3
      pattern: Post-verbal adverb placement transferred from Tamil -> English adverb
        placement rules differ
      persistence: 3
      reliability: B
      tier: 1
    notes: Tamil is rigidly SOV with case markers. English relies on word order for
      grammatical roles. This is the foundational interference pattern from which
      many others derive.
    persistence: 4
    source_count: 7
    source_rank: 1
    source_type: literature
    sources:
    - 'Swan, M. & Smith, B. (2001). Learner English: A Teacher''s Guide to Interference
      and Other Problems (2nd ed.). Cambridge University Press.'
    - Lehmann, T. (1993). A Grammar of Modern Tamil. Pondicherry Institute of Linguistics
      and Culture.
    - Annamalai, E. & Steever, S.B. (1998). Modern Tamil. In The Dravidian Languages,
      Routledge.
    - 'Celce-Murcia, M. & Larsen-Freeman, D. (1999). The Grammar Book: An ESL/EFL
      Teacher''s Course (2nd ed.). Heinle & Heinle.'
    - McManus (2022) Crosslinguistic Influence and Second Language Learning
    - Golden
    - Odlin
    teacher_tips:
      exercises:
      - description: Give students 15 color-coded word cards per set (Subject=Blue,
          Object=Green, Verb=Red, Adverb=Yellow). Call out a Tamil SOV sentence. Students
          arrange cards in Tamil order first, then physically rearrange to English
          SVO order and read the sentence aloud. Teacher checks and corrects. Each
          student completes all 15 sentences.
        duration: 20
        name: 'Card Shuffle: Tamil to English'
        type: transformation
      - description: Provide a short paragraph (8-10 sentences) written by a fictional
          Tamil learner. 7 sentences have SOV word order errors. Students identify
          each error, underline the misplaced word, and rewrite the sentence correctly.
          Discuss as a class why each error changes or confuses the meaning.
        duration: 15
        name: Word Order Error Hunt
        type: error-correction
      - description: Teacher reads Tamil sentences aloud (with English gloss). Students
          race to produce the correct English SVO sentence orally. First student to
          raise hand and produce a correct sentence gets a point. Use 20 sentences
          of increasing complexity. This builds automatic SVO production.
        duration: 15
        name: Live Translation Relay
        type: oral-drill
      - description: Give students a list of 10 Tamil sentences with word-by-word
          English glosses in SOV order. Students must rewrite each sentence in correct
          English SVO order WITHOUT looking at notes. After writing, they compare
          with a partner and discuss differences. Teacher provides correct versions
          for self-check.
        duration: 15
        name: Sentence Building with Constraints
        type: sentence-rewrite
      how_to_explain: 'Write two columns on the board. Left column: Tamil order (S-O-V).
        Right column: English order (S-V-O). Use a simple sentence: ''I / rice / ate''
        versus ''I / ate / rice.'' Say: ''In Tamil, the action word (verb) always
        comes LAST. In English, the action word comes in the MIDDLE, right after the
        person doing it. English uses WORD ORDER to show who did what to whom -- there
        are no case endings to help.'' Drill with physical movement: have students
        stand in line and rearrange themselves.'
      sequencing: 'Week 1: Simple SVO with one object (I eat rice). Week 2: SVO with
        adverbs (I eat rice quickly). Week 3: Ditransitive verbs (I gave him the book
        -- two objects). Week 4: Questions and inversion (Do you eat rice?). Week
        5: Complex sentences with subordinate clauses.'
      where_to_start: 'Begin with simple transitive sentences using high-frequency
        verbs: eat, read, write, buy, see. Use color-coded cards: blue for Subject,
        red for Verb, green for Object. Students physically rearrange cards from Tamil
        order to English order. Start with present tense to avoid additional complexity.'
    tier: 1
    why_it_happens: 'Tamil is a strictly head-final SOV language, meaning the verb
      always comes at the end of the clause. This is one of the most fundamental typological
      differences from English, which is SVO. In Tamil, the basic sentence structure
      is Subject plus Adverb plus Object plus Verb, and this order becomes the default
      cognitive habit from years of daily Tamil use. When Tamil speakers learn English,
      they must restructure their entire sentence planning strategy. The error is
      particularly persistent because word order is processed automatically -- speakers
      do not consciously choose where to place the verb. Additionally, Tamil uses
      case markers (like -ai for accusative) to mark grammatical roles, so word order
      is actually more flexible in Tamil than in English, where word order IS the
