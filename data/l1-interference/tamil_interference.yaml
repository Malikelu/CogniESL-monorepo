        in front of). Week 2: Directional prepositions (into, out of, toward, through).
        Week 3: Temporal prepositions (before, after, during, since, until). Week
        4: Abstract prepositions (about, for, with, without, despite). Week 5: Prepositional
        phrases and collocations.'
