    teacher_tips:
      exercises:
      - description: Provide 15 Tamil-style postpositional phrases (e.g., 'table under,'
          'house behind,' 'box inside'). Students must rewrite each as a correct English
          prepositional phrase (e.g., 'under the table,' 'behind the house,' 'inside
          the box'). Then use each phrase in a complete sentence.
        duration: 15
        name: Position Word Swap
        type: transformation
      - description: Hide 10 objects around the classroom. Give students clues using
          Tamil-style postpositional word order (e.g., 'The key is desk under'). Students
          must first convert the clue to correct English ('The key is under the desk')
          and then find the object. First team to find all 10 wins.
        duration: 20
        name: Classroom Treasure Hunt
        type: oral-drill
      - description: 'Give students 20 sentence pairs: one with Tamil postpositional
          order and one with correct English prepositional order. Students identify
          which is correct English and explain why. Include tricky cases where the
          postposition and preposition have different meanings.'
        duration: 10
        name: Preposition or Postposition
        type: matching
      - description: Students write a 6-sentence description of their bedroom or a
          room they know well, using at least 8 different prepositions correctly.
          Then they draw the room based on their description. Partners read each other's
          descriptions and try to draw the room without seeing the original. Compare
          drawings to check preposition accuracy.
        duration: 20
        name: Draw the Preposition
        type: composition
      how_to_explain: 'Hold up a book and place it on a table. Say: ''In Tamil, you
        say TABLE -- ON (noun first, position word second). In English, you say ON
        -- THE TABLE (position word first, noun second).'' Write the pattern: Tamil
        = NOUN plus POSTPOSITION. English = PREPOSITION plus NOUN. Use hand gestures:
        left hand = noun, right hand = position word. Show that Tamil puts the left
        hand first, English puts the right hand first.'
