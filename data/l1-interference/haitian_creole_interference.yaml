language: Haitian Creole
language_code: ht
schema_version: '4.0'
note: 'Data sourced from L1 Interference ESL Teacher Resources — Comparative Analysis
  of Cross-Linguistic Influence (S09). This is a reference survey document; specific
  Haitian Creole contrastive studies are limited. Tier ratings reflect S09 transfer
  matrix classifications (tier 4 = general reference, not primary HC-specific research).

  '
grammar_points:
  articles:
    interference_patterns:
    - pattern: Article omission or incorrect use
      example_wrong: '*He has job.'
      example_correct: He has a job.
      explanation: 'Haitian Creole has a definite article (a/an/la/lan) but its usage
        differs from English. The definite article follows the noun in Haitian Creole
        (postposed), unlike English where it precedes. Haitian Creole does not use
        an indefinite article in all the same contexts as English. Learners may omit
        English indefinite articles or place articles incorrectly due to L1 word order.

        '
      frequency: 3
      persistence: 3
      communicative_impact: 3
      etiology: interlingual
      flagged: true
      tier: 4
      reliability: B
    why_it_happens: 'Haitian Creole definite articles are postposed (follow the noun),
      unlike English preposed articles. The indefinite article system also differs.
      These structural differences cause word-order and article-omission errors. (L1
      Interference ESL Teacher Resources, S09, Syntactic and Morphological Transfer
      Matrix: Article Omission).

      '
    teacher_tips:
      how_to_explain: Explain the L1-specific error patterns and provide contrastive
        examples.
      where_to_start: Begin with the most frequent error pattern for this L1.
      exercises:
      - name: Contrastive Analysis
        type: translation
        duration: 15
    citations:
    - claim: Interference pattern for articles in Haitian Creole
      source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
        Ch. Caribbean creoles
      tier: 1
  plurality:
    interference_patterns:
    - pattern: Plural marking omission
      example_wrong: '*I have three book.*'
      example_correct: I have three books.
      explanation: Haitian Creole nouns are not inflected for plurality. The only
        plural marker is the plural definite article "yo." English requires -s/-es
        plural marking on nouns, which Haitian learners frequently omit.
      frequency: 4
      persistence: 4
      communicative_impact: 2
      etiology: interlingual
      reliability: B
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
    why_it_happens: Haitian Creole has no obligatory plural marking on nouns. The
      plural is only marked by the definite article "yo" and only when the noun is
      definite. This makes English plural -s marking entirely new and frequently omitted.
    citations:
    - claim: Haitian Creole nouns are not inflected for plurality. The only marker
        is the plural definite article "yo."
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
      reliability: B
  verb_agreement:
    interference_patterns:
    - pattern: Subject-verb agreement omission
      example_wrong: '*She go to school.*'
      example_correct: She goes to school.
      explanation: Haitian Creole verbs are completely invariant. Tense/aspect is
        marked by preverbal particles, not by verb inflection. English subject-verb
        agreement is entirely foreign.
      frequency: 5
      persistence: 5
      communicative_impact: 3
      etiology: interlingual
      reliability: B
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
    why_it_happens: Haitian Creole verbs never change form. English requires -s for
      3rd person singular and irregular forms for be/have/do.
    citations:
    - claim: Haitian Creole verbs are absolutely invariant. The verb "ale" (go) is
        the same for all persons.
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
      reliability: B
  tense_aspect:
    interference_patterns:
    - pattern: Simple past tense omission
      example_wrong: '*Yesterday I go to the store.*'
      example_correct: Yesterday I went to the store.
      explanation: Haitian Creole uses the unmarked verb form for past actions when
        context makes the time clear. English requires obligatory past tense marking.
      frequency: 5
      persistence: 5
      communicative_impact: 3
      etiology: interlingual
      reliability: B
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
    why_it_happens: Haitian marks tense/aspect with preverbal particles, not verb
      inflection. The simple past is especially problematic because Haitian can leave
      past tense unmarked.
    citations:
    - claim: 'Haitian Creole marks seven tense-aspect distinctions using preverbal
        particles: a, pral, ap, unmarked, fek, te, ta.'
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
      reliability: B
  pronouns:
    interference_patterns:
    - pattern: Pronoun case and gender errors
      example_wrong: '*Me go store.*'
      example_correct: I go to the store.
      explanation: Haitian Creole pronouns are uninflected for case (mwen = I/me/my)
        and have no gender distinction in 3rd person (li = he/she/it). English pronoun
        case and gender must be learned.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      reliability: B
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
    citations:
    - claim: Haitian Creole pronouns are uninflected. "Li" means he, she, and it.
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
      reliability: B
  negation:
    interference_patterns:
    - pattern: Do-support negation errors
      example_wrong: '*I no go.*'
      example_correct: I don't go. / I'm not going.
      explanation: Haitian Creole uses preverbal "pa" for negation. English requires
        do-support for most verbs, which is a completely new pattern.
      frequency: 4
      persistence: 4
      communicative_impact: 3
      etiology: interlingual
      reliability: B
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
    citations:
    - claim: Haitian Creole uses preverbal "pa" for negation, which maps onto multiple
        English negation patterns.
      source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
        Checklist. English Record, 21(4), pp.136-147.
      tier: 1
      reliability: B
phonology_interference:
  consonant_gaps:
  - pattern: /theta/ and /dh/ (th) absent in Haitian Creole
    substitution: /t/ for /theta/ (tree for three), /d/ for /dh/ (dis for this)
    explanation: Haitian Creole has no dental fricatives. Learners substitute /t/
      and /d/.
    reliability: B
    source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
      Checklist. English Record, 21(4), pp.136-147.
    tier: 1
  - pattern: 'H-absent: no /h/ sound for most speakers'
    substitution: Omission of initial /h/ (ouse for house)
    explanation: Most Haitian Creole speakers have no /h/ sound. Initial /h/ must
      be actively taught.
    reliability: B
    source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
      Checklist. English Record, 21(4), pp.136-147.
    tier: 1
  - pattern: /r/ realized as velar approximant, sounds like /w/
    substitution: /w/ for initial /r/ (wun for run)
    explanation: Haitian Creole /r/ has light velar friction that sounds /w/-like
      to English speakers.
    reliability: B
    source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
      Checklist. English Record, 21(4), pp.136-147.
    tier: 1
  vowel_system:
  - pattern: Pure vowels vs. English diphthongs
    explanation: Haitian Creole has 7 pure vowels with no diphthongal off-glide. English
      long vowels (/iy/, /ey/, /ow/, /uw/) have characteristic off-glides.
    reliability: B
    source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
      Checklist. English Record, 21(4), pp.136-147.
    tier: 1
  - pattern: Short vowel distinctions (/I/-/E/, /U/-/V/)
    explanation: Haitian /i/ and /u/ are tense, close to English /iy/ and /uw/. English
      short vowels /I/ and /U/ are lower and laxer, causing confusion.
    reliability: B
    source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
      Checklist. English Record, 21(4), pp.136-147.
    tier: 1
  syllable_structure:
  - pattern: Final consonant cluster difficulty
    explanation: Haitian Creole allows only simple syllable shapes. English final
      clusters (walked, ships, tests) are problematic.
    reliability: B
    source: Hall, R.M.R. & Hall, B.L. (1971) A Contrastive Haitian Creole-English
      Checklist. English Record, 21(4), pp.136-147.
    tier: 1
sources:
- 'L1 Interference ESL Teacher Resources — Comparative Analysis of Cross-Linguistic
  Influence: Best-in-Class Resources and L1 Interference Databases for English Language
  Educators. (S09)'
citations:
- claim: Haitian Creole L1 speakers transfer phonological, grammatical, and writing
    patterns from their L1 to English
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Ch. Haitian Creole
  tier: 1
  reliability: B
  flagged: false
- claim: Haitian Creole is a Creole language with no inflectional morphology, no articles,
    and different tense-aspect system — typological distance from English is significant
    in grammar structures
  source: McManus (2022) Crosslinguistic Influence and Second Language Learning. Routledge.
  tier: 1
  reliability: B
  flagged: false
- claim: Haitian Creole L1 speakers' errors in English reflect transfer from a creole
    language with different tense-aspect marking, no grammatical gender, and simplified
    morphology. James's error typology classifies these as interlingual errors, noting
    that creole L1s produce distinctive patterns compared to substrate/superstrate
    languages.
  source: 'James, C. (1998). Errors in Language Learning and Use: Exploring Error
    Analysis. Longman. Ch. 6: Diagnosing Errors, pp. 179-184: Mother-tongue influence
    and interlingual errors'
  tier: 2
- claim: Biber's register analysis shows that Haitian Creole L1 speakers' tense-aspect
    errors in English reflect the different aspectual systems across registers. Creole
    preverbal markers transfer differently to English progressive, perfect, and simple
    tense forms depending on register frequency patterns.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 5.1: Distribution of
    lexical verbs across registers'
  tier: 2
etiology:
- claim: Haitian Creole (Kreyòl ayisyen) is a French-based creole language spoken
    by approximately 10-12 million people, primarily in Haiti.
  reliability: A
  source: Hall, R.A. & Hall, B.L. (1971) A Contrastive Haitian Creole-English Checklist.
    English Record, 21(4), pp.136-147.
  tier: 1
- claim: Haitian Creole shares French vocabulary but has a distinct grammar influenced
    by West African languages (especially Fon and Ewe). Its basic word order is SVO.
  reliability: A
  source: Hall, R.A. & Hall, B.L. (1971) A Contrastive Haitian Creole-English Checklist.
    English Record, 21(4), pp.136-147.
  tier: 1
- claim: Haitian Creole has postposed definite articles (a/la/lan) rather than preposed
    articles as in English and French.
  reliability: A
  source: Hall, R.A. & Hall, B.L. (1971) A Contrastive Haitian Creole-English Checklist.
  tier: 1
- claim: Haitian Creole lacks grammatical gender and verb conjugation for person/number.
    Tense and aspect are marked by preverbal particles.
  reliability: A
  source: Hall, R.A. & Hall, B.L. (1971) A Contrastive Haitian Creole-English Checklist.
  tier: 1
