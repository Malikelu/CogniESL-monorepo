activities:
- description: Students predict an unknown word from sentence context, then see their
    guesses clustered around the target word with synonyms highlighted.
  level: A2-C1
  name: Clustering for vocabulary in context
  source: Peregoy & Boyle, Ch. 10, pp. 387-389
- description: Teacher selects key words, creates example sentences for prediction,
    then shows how surrounding words, headings, and author paraphrases provide meaning
    clues.
  level: B1-C1
  name: Contextual redefinition / preview in context
  source: Peregoy & Boyle, Ch. 10, pp. 387-388
- description: Students fill in a four-part narrative skeleton to track characters'
    goals, obstacles, and resolutions.
  level: A2-B2
  name: Story mapping (Somebody/Wanted/But/So)
  source: Peregoy & Boyle, Ch. 9, pp. 327-328
- description: Students create graphic summaries showing characters, settings, plot
    relationships, and multiple conflicts/resolutions using hierarchical branches,
    concentric circles, or other visual formats.
  level: B1-C1
  name: Cognitive mapping for complex narratives
  source: Peregoy & Boyle, Ch. 9, pp. 329-331
- description: Students identify whether a text uses compare/contrast, cause/effect,
    problem/solution, or enumerative structure, then complete an appropriate graphic
    organizer (Venn diagram, flow chart, structured overview).
  level: B1-C1
  name: Text structure identification with graphic organizers
  source: Peregoy & Boyle, Ch. 10, pp. 365-368
- description: 'Leticia Alvarez''s analogy: engine=introduction (shows where essay
    is going), train cars=paragraphs (each carries new information), signal words=connectors
    between cars, caboose=conclusion (looks back at where we have been).'
  level: B1-C1
  name: Train analogy for essay structure
  source: Peregoy & Boyle, Ch. 10, pp. 369-370
- description: Students read a short passage, summarize main idea and details, identify
    text structure using a graphic organizer, then plan and write a paragraph on the
    same topic using the same informational text structure.
  level: B1-C1
  name: Read STOP Write (text structure intervention)
  source: Peregoy & Boyle, Ch. 10, pp. 371
- description: 'Students categorize signal words by function (time/order: soon, when,
    finally; additive: in addition, moreover, also; cause/effect: as a result, because,
    since; conclusive: consequently, in summary, therefore; changing direction: nonetheless,
    despite, however).'
  level: B1-C1
  name: Cohesive tie categorization
  source: Peregoy & Boyle, Ch. 10, pp. 368-369
assessment:
  rubric_criteria:
  - Ability to infer word meanings from context clues
  - Recognition of informational text structure patterns
  - Identification of narrative elements (setting, character, conflict, resolution)
  - Use of cohesive ties to navigate text
  - Ability to use headings for preview and prediction
  - Transfer of text structure knowledge to own writing
  source: Peregoy & Boyle, Ch. 10, pp. 372-374, 387-389
  task_types:
  - Content-Area Reading Inventory (CARI) assessing vocabulary in context and text
    structure identification
  - Vocabulary clustering exercises showing ability to use context for word meaning
  - Story maps and cognitive maps showing text structure recognition
  - Graphic organizer completion (Venn diagrams, structured overviews) from text content
  - 'Read STOP Write tasks: identify text structure, complete graphic organizer, write
    paragraph using same structure'
  - Learning logs showing vocabulary acquisition from context
cefr_range: A2-C1
