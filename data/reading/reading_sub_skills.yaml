- claim: Reading sub-skills include phonological awareness, word recognition, vocabulary
    knowledge, syntactic parsing, text structure awareness, and inferencing
  flagged: false
  reliability: B
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed. Pearson.
    Ch. 9-11
  tier: 1
- claim: Text structure instruction (e.g., compare-contrast, cause-effect, problem-solution)
    significantly improves reading comprehension of expository texts
  flagged: false
  reliability: B
  source: 'Williams, J. P. (2018) Text structure instruction: The research base. In
    K. Millis et al. (Eds.), Deep Comprehension.'
  tier: 2
- claim: 'Oshima & Hogue''s writing textbooks emphasize how reading skills connect
    to effective writing: analyzing how writers organize information through paragraph
    and essay structures'
  flagged: false
  reliability: B
  source: 'Oshima & Hogue (2007) Introduction to Academic Writing, 3rd ed.. Pearson. Ch. 2:
    From Reading to Writing'
  tier: 2
- claim: Oshima & Hogue's approach to reading-for-writing connects reading comprehension
    to academic writing development. Their framework teaches learners to analyze text
    structure, identify organizational patterns, and apply these patterns in their
    own writing — making reading a foundation for academic literacy.
  source: Oshima, A. & Hogue, A. (2007). Introduction to Academic Writing, 3rd ed.
    Pearson Longman.
  tier: 2
common_difficulties:
- difficulty: Students cannot determine word meanings from context
  explanation: When students lack sufficient English vocabulary or syntactic knowledge,
    they cannot use surrounding context to infer the meaning of unfamiliar words.
    Cohesive ties like "nevertheless, moreover, and notwithstanding" are particularly
    difficult because they are abstract, referring to relationships between ideas
    rather than concrete objects or actions. Some students do not realize that authors
    deliberately paraphrase technical words with common phrases.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 10, pp. 387-388
  teaching_strategy: 'Teach students explicitly how authors help with vocabulary:
    surrounding words give clues, headings hint at meanings, and authors often paraphrase
    technical words. Use clustering to build guessing confidence. Provide bilingual
    dictionaries as a starting point, but note that relational words often do not
    translate directly between languages. Model how to use context in your own reading
    through think-alouds.'
- difficulty: Students are unaware of English text structure conventions
  explanation: Some students have never been explicitly taught how English texts are
    organized. Faustino, an advanced multilingual learner, had never heard of the
    five-paragraph essay. Text structure conventions vary across cultures -- what
    is considered appropriate organization in one language may differ from English
    patterns. Middle school and older students often ignore headings entirely, missing
    a key structural cue.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 10, pp. 365-370, 382-383
  teaching_strategy: Explicitly teach the four common informational text structures
    (attributive/enumerative, compare/contrast, problem/solution, cause/effect) and
    narrative elements (setting, characters, conflict, resolution). Use Leticia Alvarez's
    train analogy for essay organization. Use graphic organizers (Venn diagrams, structured
    overviews, maps) to make structure visible. Teach students to read headings and
    turn them into questions. Use the Read STOP Write process (Strong 2019, 2020)
    for detailed text structure instruction.
- difficulty: Students from different L1 backgrounds apply different rhetorical patterns
  explanation: Kaplan (2005) and Kubota (2010) note that different cultures structure
    texts in rather different ways. Students who are literate in their L1 may transfer
    L1 rhetorical patterns to English reading and writing, leading to organizational
    patterns that seem digressive or poorly structured to English-speaking teachers.
    This is particularly relevant for older multilingual learners with substantial
    L1 literacy.
  l1_groups: Chinese, Japanese, Korean, Arabic, Spanish, and others
  source: Peregoy & Boyle, Ch. 10, pp. 365-370
  teaching_strategy: Provide explicit explanations of English text structure conventions.
    Use visual-spatial strategies (graphic organizers, structured overviews) to make
    English patterns visible. Acknowledge and validate students' L1 rhetorical traditions
    while teaching English conventions as an additional tool. The train analogy and
    Somebody/Wanted/But/So story structure provide concrete, culturally accessible
    entry points.
definition: 'Reading sub-skills are the foundational abilities that enable effective
  reading comprehension. Peregoy & Boyle emphasize two that are particularly critical
  for multilingual learners: vocabulary in context (using surrounding words, headings,
  and text context to hypothesize and confirm the meaning of unfamiliar words) and
  text structure recognition (identifying organizational patterns like compare/contrast,
  cause/effect, problem/solution, and enumerative lists in informational texts, and
  narrative elements like setting, characters, conflict, and resolution in literary
  texts). These sub-skills are taught through strategies such as contextual redefinition,
  clustering, cohesive tie analysis, graphic organizers, and story mapping.'
description: The component skills that underpin reading comprehension, specifically
  (1) the ability to determine the meaning of unfamiliar words using contextual clues
  and the surrounding text, and (2) the ability to recognize and use the organizational
  patterns (text structures) of both informational and narrative texts. Peregoy &
  Boyle treat these as separate but interrelated sub-skills that must be explicitly
  taught to multilingual readers.
key_principles:
- explanation: 'Peregoy & Bouragingly advocate for teaching vocabulary through context
    rather than as isolated items to be memorized. They describe two related strategies:
    "contextual redefinition" and "preview in context." In practice, the teacher selects
    key words from a passage, creates example sentences that allow students to predict
    meanings from context, and shows students how surrounding words, headings, and
    author paraphrases provide clues. For example, technical words are often paraphrased
    with common phrases in subsequent clauses to ensure reader understanding.'
  principle: Vocabulary should be learned in context, not from isolated word lists
  reliability: B
  source: Peregoy & Boyle, Ch. 10, pp. 387-388
- explanation: Clustering to develop vocabulary in context is a strategy in which
    the teacher presents a sentence with a blank where a target word should be, then
    surrounds the blank with student guesses. After revealing the actual word, the
    teacher discusses which guesses were synonyms or related concepts. This helps
    students "hypothesize and confirm a word's meaning by the context of its use"
    and "gain confidence in guessing and confirming word meanings while introducing
    synonyms for a new vocabulary word."
  principle: Clustering builds a semantic net for new vocabulary
  reliability: B
  source: Peregoy & Boyle, Ch. 10, pp. 387-388
- explanation: Research indicates that readers use their knowledge of text structure
    to "store, retrieve, and summarize information they have read" (Schwartz et al.,
    2017; Strong, 2020). Text organization has a "profound effect on comprehension
    and memory" (Kendeou et al., 2011; Wolfe, 2005). When students recognize a compare/contrast
    structure, they know to look for similarities and differences. This structural
    awareness forms templates that predict upcoming information and provide a "conceptual
    net" for remembering content.
  principle: Knowledge of text structure is a powerful comprehension and memory tool
  reliability: B
  source: Peregoy & Boyle, Ch. 10, pp. 365-368
- explanation: 'Peregoy & Boyle distinguish between informational text structures
    (attributive/enumerative: main idea plus listed details signaled by first, second,
    third, in addition; compare/contrast signaled by similarly, in contrast, on the
    other hand; problem/solution signaled by the problem is, one solution; cause/effect
    signaled by because, as a result, therefore) and narrative text structures (setting,
    characters/protagonists, conflict/problem, resolution -- expandable to the Somebody/Wanted/But/So
    skeleton or more complex maps with multiple episodes, conflicts, and resolutions).
    Both types must be explicitly taught.'
  principle: Informational and narrative text structures differ and must both be taught
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 327-328; Ch. 10, pp. 365-368, 370-371
- explanation: 'Cohesive ties (signal words like first, second, moreover, nevertheless,
    as a result, consequently, despite) act as signposts showing how ideas relate.
    Peregoy & Boyle categorize them by function: time/order, additive, cause/effect,
    conclusive, and changing direction. Headings and subheadings serve a similar function,
    allowing students to preview content, generate questions, monitor comprehension,
    and make predictions about what will follow.'
  principle: Cohesive ties and headings serve as navigational signposts in text
  reliability: B
  source: Peregoy & Boyle, Ch. 10, pp. 368-369, 382-383
l1_interference:
- language: All L1s
  patterns:
  - correct_example: The student recognizes that English expository texts typically
      state the main idea first (topic sentence), followed by supporting details,
      and uses this pattern to predict and organize information.
    example_l1: Various
    example_wrong: A student expects the main argument to be stated at the end of
      an essay (as in their L1 convention) and skims past the topic sentence at the
      beginning, missing the key organizational signal.
    explanation: Because text structures vary across cultures, students' L1 reading
      strategies may not transfer well to English. Peregoy & Boyle recommend explicit
      instruction on English conventions alongside graphic organizers that make structure
      visible. The train analogy (engine=introduction, cars=paragraphs, caboose=conclusion)
      provides a concrete, culturally accessible model.
    pattern: L1 rhetorical structure transferred to English text comprehension
    source: Peregoy & Boyle, Ch. 10, pp. 365-370
- language: All L1s
  patterns:
  - correct_example: The student categorizes cohesive ties by function (time/order,
      additive, cause/effect, conclusive, changing direction) and uses them as signposts
      to navigate English text organization.
    example_l1: Various
    example_wrong: A student does not recognize that "moreover" signals an additional
      equal-weight point, or that "nevertheless" negates the previous statement, because
      their L1 uses different cohesive devices or places them differently.
    explanation: Cohesive ties are abstract and do not translate directly between
      languages. Peregoy & Boyle recommend categorizing them by signpost function
      and showing students how to use them in their own writing, where the student
      provides the meaning and the teacher helps convey it effectively through cohesive
      ties.
    pattern: L1 cohesive devices differ from English signal words
    source: Peregoy & Boyle, Ch. 10, pp. 368-369
- language: All L1s
  patterns:
  - correct_example: The student identifies setting, characters, conflict, and resolution
      in English narratives and uses story maps to track these elements, recognizing
      that English stories typically follow a problem-resolution arc.
    example_l1: Various
    example_wrong: A student does not recognize the Somebody/Wanted/But/So narrative
      pattern because stories in their L1 tradition may use different organizational
      principles (e.g., circular narratives, frame stories, or non-linear chronology).
    explanation: Narrative conventions vary across cultures. Peregoy & Boyle recommend
      explicit teaching of English literary elements (setting, characters, conflict,
      resolution) using story maps at varying levels of complexity -- from simple
      Somebody/Wanted/But/So for young readers to complex multi-episode maps for advanced
      students.
    pattern: L1 narrative structure differs from English story grammar
    source: Peregoy & Boyle, Ch. 9, pp. 327-328; Ch. 10, pp. 370-371
skill_area: reading_sub_skills
skill_name: Reading Sub-Skills (Vocabulary in Context, Text Structure Recognition)
sources:
  primary: 'Peregoy, S. F., & Boyle, O. F. (2023). Reading, Writing, and Learning
    in ESL: A Resource Book for Teaching K-12 Multilingual Learners (8th ed.). Pearson.
    Chapters 9-11.'
  secondary:
  - Strong, J. Z. (2020). Investigating a text structure intervention for reading.
    Reading Teacher.
  - 'Meyer, B. J. F., & Ray, M. N. (2011). Structure strategy interventions: Increasing
    reading comprehension of expository text. International Electronic Journal of
    Elementary Education, 4(1), 127-152.'
  - 'Williams, J. P. (2018). Text structure instruction: The research base. In K.
    Millis et al. (Eds.), Deep Comprehension.'
  - 'Tierney, R. J., & Readence, J. E. (2005). Reading Strategies and Practices: A
    Compendium (6th ed.). Allyn & Bacon.'
  - Halliday, M. A. K., & Hasan, R. (2014). Cohesion in English. Routledge.
sub_skills:
- description: Analyzing surrounding words, headings, sentence structure, and the
    broader text to infer the meaning of unfamiliar vocabulary without relying on
    a dictionary. Students learn to recognize when authors paraphrase technical words
    with common phrases, use headings to signal meaning, or embed definitions in appositives
    and relative clauses.
  examples:
  - A student encounters 'emancipation' in a Civil War text and uses context clues
    from subsequent text about 'freeing slaves' to infer the meaning.
  - 'A student guesses that ''chores'' means ''household tasks'' based on the sentence
    context: ''grandmother Ultima did many of the household chores normally assigned
    to them.'' Synonym guesses included ''work,'' ''cleaning,'' and ''jobs.'''
  - A student encounters the technical term 'photosynthesis' and uses the heading
    context ('How does photosynthesis work?') and the surrounding paragraph to build
    understanding before looking up the word.
  name: Using context to determine word meaning
  source: Peregoy & Boyle, Ch. 10, pp. 387-388
- description: A brainstorming strategy in which students predict an unknown word's
    meaning, then see their guesses clustered around the target word with synonyms
    and related terms highlighted.
  examples:
  - 'Ms. Marion presents a sentence from Bless Me, Ultima with ''chores'' omitted:
    the blank circle is surrounded by student guesses (work, cleaning, jobs, tasks,
    helping). After placing ''chores'' in the center, she discusses which guesses
    were synonyms.'
  - A social science passage about Lewis and Clark contains the word 'expedition'
    with a blank. The cluster includes student guesses like 'journey,' 'trip,' 'adventure,'
    'mission,' and 'exploration.'
  name: Clustering for vocabulary development
  source: Peregoy & Boyle, Ch. 10, pp. 387-389
- description: Identifying common organizational patterns in expository text (attributive/enumerative,
    compare/contrast, problem/solution, cause/effect) and using that recognition to
    predict, comprehend, and remember content.
  examples:
  - Recognizing that a passage uses a compare/contrast structure, a student anticipates
    that an essay comparing two schools will discuss how they are the same and how
    they are different (from the 'two schools' essay example in Ch. 9).
  - 'A student reads a recipe and immediately recognizes the enumerative list structure:
    title at top, numbered ingredients followed by instructions.'
  - 'A student identifies a business letter structure: date upper right, sender''s
    address upper left, salutation, formal content, signature last.'
  name: Recognizing informational text structure patterns
  source: Peregoy & Boyle, Ch. 10, pp. 365-368
- description: Identifying the elements of stories (setting, characters, conflict,
    resolution) at varying levels of complexity, from simple Somebody/Wanted/But/So
    maps to more complex multi-episode narratives with multiple conflicts and character
    development.
  examples:
  - 'Second graders map ''The Three Little Pigs'' using Somebody/Wanted/But/So, producing
    two versions: ''The Big Bad Wolf wanted to eat the pigs, but they boiled him in
    hot water, so the pigs lived happily ever after'' AND ''The three little pigs
    wanted to build strong houses, but the wolf blew the houses down, so they boiled
    him in water and lived happily ever after.'''
  - 'Students discuss story elements of The Great Gilly Hopkins (setting: foster homes;
    protagonist: Gilly; conflict: she must adjust to a new foster family; resolution:
    through her relationship with her foster mother).'
  name: Recognizing narrative literary structure
  source: Peregoy & Boyle, Ch. 9, pp. 327-328; Ch. 10, pp. 370-371
- description: Recognizing signal words that indicate relationships between ideas
    (time/order, additive, cause/effect, conclusive, changing direction) and using
    them to navigate text organization.
  examples:
  - A student sees 'first, second, third' and knows the text is presenting an enumerated
    list of equal-weight points supporting a main idea.
  - A student encounters 'nevertheless' and recognizes that the author is about to
    negate or minimize a previous statement.
  - A student reads 'as a result' and understands that a cause/effect relationship
    is being signaled -- the upcoming information will describe the effect of what
    was just discussed.
  name: Using cohesive ties as comprehension signposts
  source: Peregoy & Boyle, Ch. 10, pp. 368-369
- description: 'Reading fluency comprises three interrelated components: rate (the
    speed at which a reader processes text), accuracy (correct word recognition),
    and prosody (appropriate expression, phrasing, and intonation when reading aloud).
    Peregoy & Boyle connect fluency to the Simple View of Reading (Gough & Turner):
    decoding accuracy multiplied by linguistic comprehension equals reading comprehension.
    Fluency develops through extensive practice with texts at the student''s independent
    reading level (98-100% word recognition). Scaffolding levels from most to least
    support -- echo reading, choral reading, partner reading, independent reading
    (Figure 9.2) -- allow teachers to differentiate fluency instruction by ELP level.
    Reader''s theater is specifically highlighted as a fluency-building activity that
    combines reading with dramatic expression, making prosody practice engaging and
    purposeful.'
  examples:
  - 'Echo reading: the teacher reads a sentence with appropriate phrasing and expression,
    and students echo it back, matching the teacher''s prosody -- used with beginning
    readers.'
  - A reader's theater performance of a folktale allows intermediate students to rehearse
    and perform dramatic readings, developing both reading fluency and expressive
    prosody.
  - During guided reading, the teacher circulates and notes individual students' reading
    rate and accuracy, adjusting text difficulty to keep students within their instructional
    level.
  name: Fluency (rate, accuracy, prosody)
  source: Peregoy & Boyle, Ch. 9, pp. 307-309, 314-315, 384-385; Figure 9.2
- description: 'Vocabulary breadth refers to the number of words a reader knows, while
    vocabulary depth refers to how thoroughly a word is known -- including its multiple
    meanings, collocations, grammatical forms, connotations, and usage across contexts.
    Peregoy & Boyle emphasize that word knowledge is not binary (known/unknown) but
    exists on a continuum. They reference Beck et al.''s (2002) three-tier model:
    Tier 1 (everyday conversational words), Tier 2 (general academic/high-frequency
    cross-content words like ''analyze'' and ''summarize'' that are the primary target
    of instruction), and Tier 3 (domain-specific technical words like ''photosynthesis''
    best learned in context). Extensive reading builds breadth through repeated incidental
    encounters with many words, while intensive vocabulary instruction (clustering,
    contextual redefinition, word analysis) builds depth through explicit, multi-contextual
    engagement with fewer, more targeted words.'
  examples:
  - 'A student has heard the word ''run'' many times (breadth) but may not know all
    its meanings: run a race, run for office, a run in stockings, run a business (depth).'
  - The Vocabulary Self-Collection Strategy asks students to find and share new words
    from independent reading, building both breadth (new words) and depth (discussing
    meanings, contexts, and usage).
  - Tier 2 words like 'examine' receive focused, deep instruction because they appear
    across many content areas and are essential for academic success.
  name: Vocabulary breadth vs. depth
  source: Peregoy & Boyle, Ch. 7, pp. 219-222, 229-230
- description: 'Text structure recognition is the ability to identify and use the
    organizational patterns of both informational and narrative texts to predict,
    comprehend, remember, and summarize content. Peregoy & Boyle identify four key
    informational text structures: attributive/enumerative (main idea plus listed
    details, signaled by first, second, third, in addition), compare/contrast (similarly,
    however, on the other hand), cause/effect (because, as a result, therefore), and
    problem/solution (the problem is, one solution). For narrative texts, they teach
    story elements -- setting, characters, conflict, resolution -- using templates
    like Somebody/Wanted/But/So. Knowledge of text structure provides a "conceptual
    net" for remembering information and serves as a scaffold for both reading comprehension
    and writing in the same genres. Graphic organizers (Venn diagrams, structured
    overviews, flowcharts, story maps) make text structure visible and are among the
    most effective instructional tools.'
  examples:
  - A student sees 'on the other hand' and recognizes that a compare/contrast structure
    is beginning, so prepares to identify both similarities and differences.
  - 'Second graders map ''Beauty and the Beast'' using Somebody/Wanted/But/So: ''Belle
    wanted to save her father, but the Beast kept her prisoner, so she learned to
    love him and broke the spell.'''
  - 'Leticia Alvarez''s train analogy: engine=introduction, train cars=paragraphs
    with new information, signal words=connectors between cars, caboose=conclusion.'
  name: Text structure recognition
  source: Peregoy & Boyle, Ch. 9, pp. 327-328; Ch. 10, pp. 365-371
- description: Inference making is the cognitive process by which readers use background
    knowledge and textual clues to understand information that is not explicitly stated
    in the text. Peregoy & Boyle illustrate inferencing through the "Snow White" cloze
    passage (Figure 9.1), where readers fill in missing words based on fairy tale
    schema and English article knowledge, and through "The Boys' Arrows" passage experiment,
    where readers misread individual words because their background knowledge either
    supports or conflicts with the text's meaning. For multilingual learners, inference-making
    depends on both English language proficiency and culturally specific background
    knowledge -- a student who has never encountered fairy tales or American hunting
    culture may lack the schema needed to make correct inferences. Explicit instruction
    in using cohesive ties, cultural context, and prior knowledge scaffolds inference-making
    for these learners.
  examples:
  - A reader encounters 'tear' in 'The Boys' Arrows' and must infer from context whether
    it means teardrop or ripping -- their background knowledge of hunting activates
    the wrong schema initially.
  - Reading a passage about deforestation, a student infers that biodiversity loss
    is a consequence even if not explicitly stated, based on prior knowledge of ecosystems
    and the stated effects (soil erosion, climate change).
  - During the 'Snow White' cloze task, readers fill in 'winter' and 'her' based on
    knowledge of fairy tale conventions and English definite articles, demonstrating
    inference from genre knowledge and syntax.
  name: Inference making
  source: Peregoy & Boyle, Ch. 9, pp. 304-307
- description: Reading headings before the full text to gain an overview, generate
    questions, set a purpose for reading, and make predictions about content. This
    also enables comprehension monitoring -- if a heading promises three causes but
    the reader only finds two, they know to reread.
  examples:
  - A heading reads 'Three Environmental Dangers of Deforestation.' The student creates
    the question 'What are the three environmental dangers?' If only two are found
    in the text, the student recognizes the need to reread.
  - A student reads the heading 'Using a Dishwasher' before reading a jumbled procedural
    passage. The heading makes the otherwise confusing passage immediately comprehensible,
    showing how much information is conveyed by headings alone.
  - A student reads headings "Cleaning before Soap" and "Life without Soap" in a history-of-soap
    article and predicts the article will cover both hygiene before soap was invented
    and what life would be like without it.
  name: Using headings and subheadings for preview and prediction
  source: Peregoy & Boyle, Ch. 10, pp. 369, 382-383
teaching_approach:
  stages:
  - activities:
    - 'Pre-teach semantically related vocabulary in clusters rather than isolated
      lists (e.g., nautical terms: bow, fore, aft, mast taught together as a category)'
    - Use structured overviews or semantic maps to visually preview the organization
      of upcoming text
    - Preview headings and subheadings with students, modeling how to turn them into
      questions
    - Use anticipation guides that preview key structural elements of narrative texts
      (character, conflict, theme)
    source: Peregoy & Boyle, Ch. 10, pp. 379-382, 387-388
    stage: Pre-reading -- building vocabulary and activating text structure awareness
    teacher_tips: Whenever possible, illustrate vocabulary meanings with pictures
      or diagrams. Teach semantically related words together (e.g., nautical terms,
      desert vocabulary) to give students a category or cognitive 'net.' When information
      is meaningfully organized, it is easier to remember. Discuss text structure
      explicitly -- students may never have been taught these conventions.
  - activities:
    - 'Clustering for vocabulary in context: present sentences with target words omitted,
      students guess surrounding context, reveal target word, discuss synonyms'
    - 'Contextual redefinition: show students how surrounding words, headings, and
      author paraphrases provide word-meaning clues'
    - Students use headings to generate questions and monitor whether all question
      parts are answered
    - Students identify cohesive ties as signposts of text organization
    - Students use story maps or Somebody/Wanted/But/So to track narrative structure
      while reading
    source: Peregoy & Boyle, Ch. 10, pp. 382-383, 387-389
    stage: During reading -- applying context strategies and structural awareness
    teacher_tips: Clustering works well with both literary texts (novels like Bless
      Me, Ultima) and content-area informational texts (science, social studies).
      Don't overuse it -- Ms. Marion uses it occasionally but finds it excellent for
      building independence. Remind students that authors deliberately help readers
      with new vocabulary through context, headings, and paraphrasing.
  - activities:
    - Cognitive mapping that visually represents the text structure of what was read
    - Story mapping using hierarchical branch maps (characters, setting, plot) or
      more complex maps for longer narratives
    - Venn diagrams to consolidate compare/contrast understanding
    - Vocabulary journals where students record new words with context sentences
    - K-W-L completion demonstrating what was learned about text content
    - 'Write STOP Write (Strong 2019, 2020): students read a passage, summarize main
      idea and details, identify the text structure using a graphic organizer, then
      plan and write a paragraph using the same informational text structure'
    source: Peregoy & Boyle, Ch. 10, pp. 367-368, 369-370, 371; Ch. 11, pp. 399-400
    stage: Post-reading -- consolidating vocabulary and structure knowledge
    teacher_tips: Visual-spatial strategies like graphic organizers are among the
      best tools for teaching text structures. Use structured overviews for enumerative
      (list) patterns, Venn diagrams for compare/contrast, and maps for combinations
      of structures. Leticia Alvarez's train analogy for essay organization makes
      structure concrete and memorable for students.
