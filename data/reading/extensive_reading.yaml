activities:
- name: Sustained Silent Reading (SSR) with Response
  description: Students read self-selected texts for 15-20 minutes daily, then write
    brief responses in reading logs. Peregoy and Boyle recommend this for building
    fluency, vocabulary, and reading habits.
  level: A1-C1
  source: Peregoy and Boyle (2023) Ch.9, pp. 340-345
  type: reading, fluency
- description: Daily 15-20 minute blocks of uninterrupted sustained silent reading
    with self-selected material.
  level: A2-C1
  name: USSR / DEAR / OTTER
  source: Peregoy & Boyle, Ch. 9, pp. 314-315
- description: Students read multiple texts on the same topic of their choice to build
    vocabulary and expertise in that area.
  level: A2-C1
  name: Narrow reading on a chosen topic
  source: Peregoy & Boyle, Ch. 9, pp. 315-316
- description: Students count unknown words on the first page of a book; five unknown
    words means the book is likely too difficult for independent reading.
  level: A2-B2
  name: Five-finger exercise for book selection
  source: Peregoy & Boyle, Ch. 9, pp. 316-317
- description: Students informally share books they have enjoyed with classmates,
    building a reading community.
  level: A2-C1
  name: Book recommendation sharing
  source: Peregoy & Boyle, Ch. 9, pp. 314-315
assessment:
  rubric_criteria:
  - Volume of reading completed
  - Willingness to read independently
  - Ability to select appropriate-level books
  - Engagement and enjoyment during reading time
  source: Peregoy & Boyle, Ch. 9, pp. 314-317
  task_types:
  - Reading logs where students record titles and brief reactions
  - Informal book talks or sharing sessions
  - Optional book reports or creative projects (posters, role-plays)
  - Teacher observation during sustained silent reading
  - Tracking number of books/pages read over time
cefr_range: A2-C1
