common_difficulties:
- difficulty: Students choosing texts that are too difficult
  explanation: Students may select books beyond their independent reading level, leading
    to frustration and disengagement. Without guidance, students may choose books
    that look interesting but are at their frustration level.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 9, pp. 316-317
  teaching_strategy: Teach the five-finger exercise. Use Informal Reading Inventories
    to help determine reading levels. Provide leveled books and guide students toward
    appropriate choices while still honoring their interests and autonomy.
- difficulty: Limited access to diverse reading materials
  explanation: Some classrooms and schools lack sufficient books at varied reading
    levels, in students' home languages, or representing diverse cultures.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 9, pp. 315-316
  teaching_strategy: Use online leveled book collections, free digital libraries,
    comic books, graphic novels, and community library partnerships. Search for "free
    leveled books online" in English and Spanish. Engage with diversebooks.org for
    resources.
- difficulty: Students from cultures or backgrounds with limited print exposure
  explanation: Some students may not have extensive experience with reading for pleasure
    in any language and may not understand the purpose of extensive reading.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 9, pp. 317-318
  teaching_strategy: Provide frequent reminders of the many ways we use reading for
    practical purposes and enjoyment. Model reading yourself. Start with highly engaging,
    visually supported texts like comics and graphic novels.
definition: Extensive reading is an approach to reading instruction that encourages
  students to independently read a wide variety of self-selected material for general
  understanding, enjoyment, and overall language development. Unlike intensive reading,
  the goal is not detailed comprehension of short texts but rather the cumulative
  effect of reading large volumes of text. Peregoy & Boyle define it as reading in
  which students engage with "many mostly self-selected books" across a variety of
  genres and topics. The approach is closely related to Uninterrupted Sustained Silent
  Reading (USSR), also called Drop Everything and Read (DEAR) or Our Time to Enjoy
  Reading (OTTER), in which students read silently for 15-20 minutes daily. With extensive
  reading, post-reading activities may optionally be part of the program, but the
  primary emphasis is on the act of reading itself.
description: Low-pressure, high-volume reading in which students independently read
  large quantities of self-selected, mostly enjoyable material at or slightly below
  their instructional level, with minimal accountability or testing follow-up.
key_principles:
- explanation: The core of extensive reading is volume. Students read many books,
    magazines, comics, newspapers, or digital texts across a variety of genres and
    topics. Peregoy & Boyle emphasize that the purpose is "to get students to read
    a wide variety of material, thereby building their background knowledge, vocabulary,
    and general ELP while piquing their interest in reading about many topics across
    a variety of genres."
  principle: Students read large quantities of self-selected material
  reliability: B
  source: Peregoy & Boyle, Ch. 9, p. 314
- explanation: 'For extensive reading to work, students must choose books they can
    read on their own with high accuracy and comprehension. Peregoy & Boyle recommend
    the "five-finger exercise": students count unknown words on the first page, holding
    up one finger per unknown word. If they reach five, the book is likely too difficult
    for independent reading. Informal Reading Inventories (IRIs) can also help determine
    whether material is at a student''s independent level (high accuracy and comprehension
    without assistance), instructional level (requires teacher support), or frustration
    level (too difficult even with help).'
  principle: Material should be at or below the student's independent reading level
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 315-317
- explanation: Extensive reading is low-pressure. Students are not tested on every
    book. The goal is to build a love of reading, expand vocabulary incidentally,
    and develop background knowledge. Peregoy & Boyle note that students gain much
    through "incidental learning" from wide variety of reading, calling it "incidental
    erudition" -- even from reading mysteries, students can learn about medicine,
    law, government, and the environment.
  principle: Reading is primarily for enjoyment and general understanding, not detailed
    analysis
  reliability: B
  source: Peregoy & Boyle, Ch. 9, p. 315
- explanation: Unlike USSR, where students generally do no follow-up activities, extensive
    reading programs may include post-reading activities such as role-playing the
    story, designing a poster to advertise the book, copying interesting words and
    useful expressions in a journal, creating informational graphics, or sharing views
    with fellow students. In practice, teachers vary in how much follow-up they require.
  principle: Follow-up activities are optional and varied when used
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 314-315
- explanation: To provide an extensive reading program, students need access to lots
    of books and other material including digital texts, across a variety of interests
    and genres, and at various difficulty levels. Materials should address topics
    of interest to students and represent many backgrounds and cultures, including
    the students' own. Engaging students with school and community libraries is also
    helpful. Peregoy & Boyle provide specific guidelines including using leveled readers,
    award-winning books (Caldecott Medal, Newberry Medal), and diverse literature
    resources.
  principle: Access to abundant, diverse reading materials is essential
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 315-316
- explanation: Narrow reading (Krashen, 2004a) is an adjunct approach in which students
    read many texts on the same topic, preferably one of their own choosing. This
    builds vocabulary and background knowledge through repeated exposure to the same
    subject matter, making subsequent reading easier. Students become "experts" in
    an area, building academic self-esteem, and can share their knowledge with classmates.
  principle: Narrow reading complements extensive reading
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 315-316
- principle: Extensive reading builds fluency, vocabulary, and motivation through SSR/DEAR programs and strategy instruction like K-W-L.
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 314-317
l1_interference:
- language: All L1s
  patterns:
  - example_correct: The student comes to see reading as an enjoyable, self-directed
      activity that they choose to do in their free time.
    example_l1: Various
    example_wrong: A student may not engage with extensive reading because reading
      for personal enjoyment is not a valued practice in their home culture.
    explanation: Students from some cultural backgrounds may primarily associate reading
      with academic or religious purposes, not leisure. Teachers need to explicitly
      build a reading culture and help students discover the pleasure of self-selected
      reading.
    pattern: Different cultural norms around reading for pleasure
    source: Peregoy & Boyle, Ch. 9, pp. 314-318
skill_area: extensive_reading
skill_name: Extensive Reading
sources:
  primary: 'Peregoy, S. F., & Boyle, O. F. (2023). Reading, Writing, and Learning
    in ESL: A Resource Book for Teaching K-12 Multilingual Learners (8th ed.). Pearson.
    Chapter 9.'
  secondary:
  - Day, R. R. (2018). Extensive reading. In J. I. Liontas (Ed.), The TESOL Encyclopedia
    of English Language Teaching.
  - Krashen, S. (2004). The case for narrow reading. Language Magazine, 3(5), 17-19.
  - Jacobs, G., & Renandya, W. (2015). Making extensive reading even more student
    friendly. Indonesian JELT, 10(2), 101-111.
  - Nakanishi, T. (2015). A meta-analysis of extensive reading. TESOL Quarterly, 49(1),
    6-37.
sub_skills:
- description: Students choose their own reading materials based on interest and appropriate
    difficulty level, using strategies like the five-finger exercise.
  examples:
  - A third-grade student picks up a book and counts unknown words on the first page,
    holding up one finger per unknown word. If five fingers go up, the book is too
    hard.
  - A 16-year-old student reading at a fourth-grade level selects a leveled book with
    mature subject matter appropriate for their age.
  name: Self-selection of reading material
  source: Peregoy & Boyle, Ch. 9, pp. 316-317
- description: The ability to read independently and silently for an extended period
    (15-20 minutes), maintaining focus and engagement with self-selected material.
  examples:
  - 'USSR (Uninterrupted Sustained Silent Reading): a daily 15-20 minute block where
    the entire class reads self-selected material silently.'
  - 'DEAR (Drop Everything and Read): same concept, different name used in some schools.'
  - 'OTTER (Our Time to Enjoy Reading): another variation used in some classrooms.'
  name: Sustained silent reading
  source: Peregoy & Boyle, Ch. 9, pp. 314-315
- description: Picking up new vocabulary naturally through repeated encounters with
    words in context during extensive reading, rather than through direct instruction.
  examples:
  - A student reading a mystery novel incidentally learns domain-specific words related
    to medicine, law, and government.
  - A student reading many texts on dolphins (narrow reading) acquires marine biology
    vocabulary through repeated exposure.
  name: Incidental vocabulary acquisition
  source: Peregoy & Boyle, Ch. 9, p. 315
- description: Narrow reading is an adjunct to extensive reading in which students
    read multiple texts on the same topic, preferably one of their own choosing. Krashen
    (2004a) proposed this approach, arguing that the contextual repetition of vocabulary
    and concepts within a single topic area builds both vocabulary and background
    knowledge more efficiently than scattered reading. Students become "experts" in
    an area, building academic self-esteem, and can share their knowledge with classmates.
    Peregoy & Boyle recommend this as a complement to general extensive reading because
    encountering the same subject matter across multiple texts makes subsequent reading
    easier and more motivating.
  examples:
  - A student fascinated by marine biology reads several books and articles about
    dolphins, acquiring specialized vocabulary through repeated exposure.
  - A class conducts a unit on immigration, and each student chooses a different country
    to read about narrowly, then shares findings with the class.
  name: Narrow reading (Krashen)
  source: Peregoy & Boyle, Ch. 9, pp. 315-316
- description: 'Fluency development is a major benefit of extensive reading, encompassing
    reading rate (speed), accuracy (word recognition), and prosody (expression and
    phrasing). When students read large quantities of text at their independent level,
    their automaticity in word recognition increases, freeing up cognitive resources
    for comprehension. Peregoy & Boyle point out that oral language proficiency supports
    reading fluency: students who can "read with expression" when they perform reader''s
    theater demonstrate the link between oral and reading fluency. Repeated practice
    with self-selected, high-interest material allows fluency to develop naturally
    over time without the pressure of performance assessment.'
  examples:
  - A student who previously struggled with decoding begins to read more smoothly
    after several weeks of daily sustained silent reading with books at their independent
    level.
  - Echo reading (teacher reads, students echo) in guided reading builds prosody and
    automaticity as a scaffold toward fluent independent reading.
  name: Reading fluency development through extensive reading
  source: Peregoy & Boyle, Ch. 9, pp. 307-309, 314-315
- description: 'Self-selected reading programs designate a daily block of time (typically
    15-20 minutes) during which all students independently read material of their
    own choosing. Peregoy & Boyle describe several named variations -- USSR (Uninterrupted
    Sustained Silent Reading), DEAR (Drop Everything and Read), and OTTER (Our Time
    to Enjoy Reading) -- that all operate on the same principle: no interruptions,
    no accountability tests, no required follow-up. The teacher''s role is to provide
    a rich selection of books and model reading behavior themselves. The key instructional
    insight is that choice and autonomy increase motivation, which drives volume,
    which in turn drives proficiency gains.'
  examples:
  - A teacher sets aside 20 minutes each morning for USSR; the teacher reads their
    own book alongside students, modeling that reading is a valued activity.
  - During OTTER, a 16-year-old beginner reader chooses a graphic novel with age-appropriate
    content at a fourth-grade reading level.
  name: Self-selected reading programs (USSR/DEAR/OTTER)
  source: Peregoy & Boyle, Ch. 9, pp. 314-315
- description: Extensive reading is a powerful vehicle for incidental vocabulary acquisition.
    When students read large volumes of self-selected text, they encounter many words
    repeatedly in meaningful contexts, allowing word knowledge to accumulate gradually.
    Peregoy & Boyle call this "incidental learning" and describe how even reading
    mysteries can expose students to vocabulary from medicine, law, government, and
    the environment. The key mechanism is repeated encounters with the same word across
    different contexts, which deepens and broadens word knowledge over time. This
    is especially effective when combined with narrow reading, where topic-specific
    vocabulary recurs across multiple texts on the same subject.
  examples:
  - A student reading a series of mystery novels set in a hospital setting incidentally
    acquires medical terminology like 'diagnosis,' 'prognosis,' and 'symptoms' through
    repeated contextual encounters.
  - A student who reads many texts about cooking across different genres picks up
    food-related vocabulary (e.g., 'simmer,' 'knead,' 'marinate') without direct instruction.
  name: Vocabulary acquisition through extensive reading
  source: Peregoy & Boyle, Ch. 9, p. 315
- description: Accumulating knowledge about the world, different cultures, and various
    topics by reading widely across genres and subjects.
  examples:
  - A student who reads extensively about different cultures develops schema that
    supports comprehension of culturally diverse texts in school.
  - A student who reads many science-related articles builds background knowledge
    that makes future science texts easier to understand.
  name: Building background knowledge through wide reading
  source: Peregoy & Boyle, Ch. 9, pp. 314-315
teaching_approach:
  stages:
  - activities:
    - Establish a classroom library with books at multiple reading levels, genres,
      and topics
    - Include materials in students' first languages and English
    - Stock diverse books representing all students' backgrounds (resources like diversebooks.org)
    - Take students to the school or community library regularly
    - Provide access to digital texts, magazines, comics, newspapers, and graphic
      novels
    source: Peregoy & Boyle, Ch. 9, pp. 315-316
    stage: Setting up the extensive reading program
    teacher_tips: You cannot personally read every book, but you can read many elementary
      books in just a few hours. Students can also become resources for book recommendations.
      Look for award-winning books (Caldecott, Newberry, CLA Book of the Year) and
      use reputable review journals.
  - activities:
    - Set aside 15-20 minutes daily for sustained silent reading
    - Allow students to read self-selected material silently
    - Do not interrupt reading with comprehension questions or tests
    - Circulate to help students who are struggling to find appropriate material
    source: Peregoy & Boyle, Ch. 9, pp. 314-317
    stage: During extensive reading
    teacher_tips: 'Remember that students'' interest, enthusiasm, and prior knowledge
      of a topic may facilitate reading at a greater difficulty level than predicted
      by an IRI. Do not limit what students read based solely on general reading ability.
      Allow students to choose any appropriate reading material: books, magazines,
      comics, newspapers, etc.'
  - activities:
    - Students role-play a story they enjoyed
    - Students design a poster to advertise a book
    - Students copy interesting words and useful expressions into a journal
    - Students create informational graphics about what they read
    - Students share views with fellow students in informal book talks
    source: Peregoy & Boyle, Ch. 9, pp. 314-315
    stage: Optional post-reading extension
    teacher_tips: In practice, teachers don't always make fine distinctions among
      the different ways to encourage independent reading. Sometimes they have follow-up
      activities, sometimes they don't. But they all value and promote the act of
      reading for all students.
