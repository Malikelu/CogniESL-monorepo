activities:
- name: K-W-L Strategy
  description: Students record what they Know, what they Want to know, and what they
    Learned about a topic before, during, and after reading. Activates prior knowledge
    and sets purpose for reading.
  level: A2-C1
  source: Peregoy and Boyle (2023) Ch.11, pp. 410-411
  type: reading, comprehension
- description: Teacher-guided prediction cycle at stopping points in a text, teaching
    students to predict, confirm, and revise as reading progresses.
  level: A2-C1
  name: Directed Listening/Reading-Thinking Activity (DL-TA/DR-TA)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326, 331-333; Ch. 10, pp. 383-384
- description: Teacher and students alternate asking and answering questions about
    text sections, building independent questioning skills.
  level: B1-C1
  name: ReQuest Procedure (Reciprocal Questioning)
  source: Peregoy & Boyle, Ch. 10, pp. 385-387
- description: Before- and after-reading activity where students respond to opinion
    statements related to text themes, then compare views before and after reading.
  level: B1-C1
  name: Anticipation Guides
  source: Peregoy & Boyle, Ch. 10, pp. 381-382
- description: Students draw their predictions at each stopping point on a folded
    piece of paper, making thinking visible and providing a scaffold for beginning
    readers.
  level: A2-B2
  name: Prediction with drawings (DL-TA variation)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326
- description: Students write questions and notes during reading, creating a dialogue
    with the teacher about comprehension difficulties and insights.
  level: A2-C1
  name: Learning Logs with self-questioning
  source: Peregoy & Boyle, Ch. 10, pp. 390, 404-405
- description: Students turn each heading and subheading into a question before reading,
    then read to answer the question and monitor whether all parts are addressed.
  level: B1-C1
  name: Headings-to-Questions technique
  source: Peregoy & Boyle, Ch. 10, pp. 382-383
assessment:
  rubric_criteria:
  - Quality and specificity of predictions
  - Evidence of self-monitoring and rereading
  - Ability to generate meaningful questions from headings
  - Accurate identification of text structure
  - Use of background knowledge to support inferences
  - Post-reading comprehension and recall
  source: Peregoy & Boyle, Ch. 9, pp. 336-346; Ch. 10, pp. 372-374
  task_types:
  - Observing DL-TA/DR-TA prediction quality (teacher notes sophistication and revision
    of predictions)
  - Reviewing learning logs for evidence of self-questioning and metacognitive awareness
  - Evaluating ReQuest question quality (do questions promote comprehension?)
  - CARI assessment of comprehension skills applied to classroom texts
  - Analyzing miscue patterns from oral reading to identify reading strategies used
  - Reviewing cognitive maps for evidence of comprehension monitoring and text structure
    awareness
cefr_range: A2-C1
