common_difficulties:
- difficulty: Students make prediction errors due to different cultural background
    knowledge
  explanation: Peregoy & Boyle's "The Boys' Arrows" experiment shows how readers rely
    on background knowledge to predict and comprehend. When a reader's schema does
    not match the text's content, miscues occur -- reading "bow" as in bow-and-arrow
    instead of bow as in front of a ship, or "tear" as in teardrop instead of tearing.
    Multilingual learners may bring different cultural background knowledge that activates
    different schemas than the text assumes.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 9, pp. 305-307
  teaching_strategy: Pre-teach key cultural concepts before reading. Build background
    knowledge through visuals, realia, field trips (including virtual), and discussion.
    Encourage students to draw on their own experiences and discuss how different
    backgrounds lead to different interpretations. Validate different perspectives
    while guiding toward text comprehension.
- difficulty: Students do not spontaneously self-monitor comprehension
  explanation: Many struggling readers, including multilingual learners, read through
    a text without noticing when comprehension has broken down. They may not reread
    when a word does not make sense, or they may not recognize when the heading-generated
    question has not been fully answered.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 9, pp. 306-307; Ch. 10, pp. 371, 382-383, 390
  teaching_strategy: Explicitly teach self-monitoring through think-alouds where the
    teacher models their own metacognitive processes. Use strategies like turning
    headings into questions and checking whether all parts are answered. Assure students
    that good readers make inaccurate predictions and reread, and that prediction
    improves as the story progresses. Learning logs where students write down what
    confuses them also develop metacognitive awareness.
- difficulty: Students struggle with reciprocal questioning because they do not know
    what makes a good question
  explanation: In the ReQuest procedure, students need to generate meaningful questions,
    but many are accustomed to only answering teacher questions, not formulating their
    own. They may generate superficial or text-bound questions that do not promote
    deep comprehension.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 10, pp. 385-387
  teaching_strategy: 'Begin by modeling question-answer relationships explicitly.
    Lilly Chan''s example with the answer "peanut butter" helps students understand
    that questions must match answers logically. Then move to text-based ReQuest:
    teacher asks a question about the first section, students ask about the next,
    gradually building students'' understanding of what constitutes a question worth
    asking. Provide sentence stems if needed.'
definition: 'Reading strategies are the deliberate techniques readers apply to decode,
  comprehend, monitor, and respond to text. Peregoy & Boyle organize strategies into
  three temporal phases: prereading (building motivation, purpose, and background
  knowledge), during-reading (monitoring comprehension through self-questioning and
  purpose checking), and postreading (organizing and remembering information through
  writing and visual representations). Key strategies include prediction (DL-TA/DR-TA),
  inferencing (using background knowledge and linguistic cues to fill gaps), reciprocal
  questioning (ReQuest), using headings to set purpose, clustering for vocabulary
  in context, and metacognitive self-monitoring.'
description: Specific cognitive and metacognitive strategies that proficient readers
  use before, during, and after reading to construct meaning from text. Peregoy &
  Boyle emphasize explicit instruction in predicting, inferencing, self-monitoring,
  questioning strategies, and using text structure and background knowledge as tools
  for comprehension.
key_principles:
- explanation: Peregoy & Boyle demonstrate that proficient readers constantly predict
    what comes next in a text, using their background knowledge, linguistic knowledge,
    and text structure awareness. When predictions are wrong, they self-correct through
    rereading -- a metacognitive strategy. The DL-TA and DR-TA procedures explicitly
    teach this by having the teacher model and scaffold prediction at stopping points
    in a text. In the DL-TA example with Harold's Circus, Lisa Joiner draws and discusses
    predictions without judging them as right or wrong, teaching students that "good
    readers may make inaccurate predictions but that they improve as the story progresses."
  principle: Good readers make predictions while reading
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 305-307, 324-326, 331-333
- explanation: Inferences occur when readers use background knowledge and textual
    clues to understand information that is not explicitly stated. Peregoy & Boyle
    illustrate this through the "Snow White" cloze passage (Figure 9.1) where readers
    fill in missing words based on story knowledge, and through "The Boys' Arrows"
    passage where readers make prediction errors based on schema-driven expectations.
    For multilingual learners, inference-making depends on both linguistic proficiency
    and cultural background knowledge, which may differ from the text's assumptions.
  principle: Inferences bridge gaps between what the text says and what the reader
    understands
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 304-307
- explanation: Metacognition -- "thinking about thinking" -- is the ability to reflect
    on one's own comprehension process and take strategic action when understanding
    breaks down. Peregoy & Boyle describe strategies like rereading when a word does
    not fit the meaning, questioning oneself while reading ("What is the main idea
    here?"), and evaluating whether a purpose for reading has been met. Explicit instruction
    in metacognitive strategies during both literature and content-area reading helps
    students understand and remember what they read.
  principle: Metacognitive self-monitoring is essential for comprehension
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 306-307, 371
- explanation: Research on eye movement shows that good readers attend to almost every
    word and perceive almost every letter on a page (Schotter et al., 2012). Peregoy
    & Boyle illustrate this with the "The Boys' Arrows" passage, where a single misspelled
    letter ("caued" for "caused") slows reading fluency because the reader must double-check.
    However, they also show that readers scan for meaning efficiently, sometimes misreading
    words when background knowledge creates false expectations (e.g., reading "tear"
    as in teardrop instead of "tear" as in ripping).
  principle: Scanning and attention to detail characterize proficient reading
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 305-306
- explanation: 'Peregoy & Boyle present multiple questioning-based strategies for
    during-reading comprehension: DL-TA/DR-TA (prediction questions at stopping points),
    ReQuest (reciprocal teacher-student questioning), using headings to generate questions,
    and learning logs where students formulate questions about what they are learning.
    All center on modeling self-questioning to help students monitor understanding.
    These are "active comprehension strategies" (McLaughlin, 2012) that shift students
    from passive to active readers.'
  principle: Questioning strategies drive active comprehension
  reliability: B
  source: Peregoy & Boyle, Ch. 10, pp. 382-387
- principle: Reading is an interactive process combining bottom-up (decoding) and top-down (prior knowledge) processing. Effective instruction develops both automatic word recognition and strategic comprehension.
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 304-307
l1_interference:
- language: All L1s
  patterns:
  - correct_example: The student recognizes that English expository essays typically
      state the main idea first, followed by supporting details, and adjusts their
      prediction accordingly.
    example_l1: Various
    example_wrong: A student predicts the main idea will come at the end of an essay
      because that is the convention in their L1 rhetorical tradition, missing the
      topic sentence at the beginning.
    explanation: Because text structures vary across cultures (Kaplan, 2005), students'
      L1 rhetorical expectations can lead to misprediction in English texts. Peregoy
      & Boyle recommend explicit teaching of English text structure conventions (introduction-body-conclusion,
      topic sentence plus details) alongside graphic organizers that make structure
      visible.
    pattern: L1 discourse structure interferes with English text prediction
    source: Peregoy & Boyle, Ch. 10, pp. 365-370
- language: All L1s
  patterns:
  - correct_example: A student uses context clues to recognize that "Read to the boys"
      is an imperative command within the narrative (someone told the boys "Read this
      to the boys"), not a present-tense verb.
    example_l1: Various
    example_wrong: A student reads "Read to the boys" as "read" (present tense, like
      "reed") because the syntactic context is ambiguous -- the past tense would be
      spelled identically to the base form "read."
    explanation: Peregoy & Boyle's passage experiment demonstrates how syntactic knowledge
      drives predictions. Multilingual learners may apply L1 syntactic patterns that
      do not align with English, leading to systematic prediction errors. Instruction
      should make these syntactic patterns explicit.
    pattern: L1 syntactic knowledge causes miscues in English word prediction
    source: Peregoy & Boyle, Ch. 9, pp. 306-307
skill_area: reading_strategies
skill_name: Reading Strategies (Skimming, Scanning, Inference, Prediction)
sources:
  primary: 'Peregoy, S. F., & Boyle, O. F. (2023). Reading, Writing, and Learning
    in ESL: A Resource Book for Teaching K-12 Multilingual Learners (8th ed.). Pearson.
    Chapters 9-11.'
  secondary:
  - Stauffer, R. G. (1975). Directing the Reading-Thinking Process. Harper & Row.
  - 'Tierney, R. J., & Readence, J. E. (2005). Reading Strategies and Practices: A
    Compendium (6th ed.). Allyn & Bacon.'
  - Manzo, A. V. (1968). The ReQuest procedure. Journal of Reading, 11(3), 123-126.
  - Grabe, W., & Stoller, F. L. (2019). Teaching and Researching Reading (3rd ed.).
    Routledge.
sub_skills:
- description: Making predictions about what will come next based on the text read
    so far, then confirming or revising those predictions as more text is revealed.
    The Directed Listening-Thinking Activity (DL-TA) uses this with read-alouds; the
    Directed Reading-Thinking Activity (DR-TA) uses it with texts students read themselves.
  examples:
  - 'DL-TA with ''Harold''s Circus'' (picture book read aloud): Before reading, students
    discuss what troubles Harold might encounter at the circus. At each stopping point,
    Lisa asks students what they think Harold will draw next. Students draw their
    predictions on folded paper, then compare with the book''s illustrations.'
  - 'DR-TA with ''The Magician''s Apprentice'': After reading the title and learning
    what ''apprentice'' means, students predict what the story will be about. After
    reading that Julio wanted to make a tiger disappear, students predict what he
    will do when a circus comes to town.'
  name: Prediction and confirmation (DL-TA/DR-TA)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326, 331-333; Ch. 10, pp. 383-384
- description: Rapidly searching a text for a particular piece of information without
    reading every word. Peregoy & Boyle frame this as a purposeful reading behavior
    -- when looking for a football score in the newspaper, a reader scans differently
    than when reading for who scored touchdowns.
  examples:
  - A student scans a newspaper for a football score by looking for team names and
    numbers rather than reading every article.
  - A student scans a textbook index to find the page where 'photosynthesis' is discussed.
  name: Scanning for specific information
  source: Peregoy & Boyle, Ch. 10, pp. 382-383
- description: Using prior knowledge and contextual clues to understand information
    that is not directly stated in the text. Effective inferencing depends on both
    linguistic knowledge and cultural/conceptual background knowledge.
  examples:
  - Reading the 'Snow White' cloze passage, a reader fills in 'winter' and 'her' based
    on knowledge of fairy tale conventions and English articles.
  - Reading 'The Boys' Arrows,' a reader infers the passage is about hunting based
    on words like 'arrows,' 'hunting,' 'weapons,' and 'does,' even though some individual
    words are tricky.
  - A student reading about deforestation infers that biodiversity loss is an environmental
    danger even if the text only explicitly mentions soil erosion and climate change.
  name: Making inferences using background knowledge
  source: Peregoy & Boyle, Ch. 9, pp. 304-307
- description: The awareness of one's own comprehension process and the ability to
    take corrective action when understanding breaks down. This includes recognizing
    when a word was misread, when main ideas are unclear, or when the purpose for
    reading has not been met.
  examples:
  - A student misreads 'bow' in 'The Boys' Arrows' but then encounters context that
    does not fit (a girl, a note), prompting rereading and self-correction.
  - When reading a science chapter, a student turns the heading 'The Three Causes
    of the Civil War' into a question, reads the section, and realizes only two causes
    are discussed. The student then rereads to find the third cause.
  name: Self-monitoring and rereading (metacognition)
  source: Peregoy & Boyle, Ch. 9, pp. 306-307; Ch. 10, pp. 371, 382-383
- description: Metacognitive strategies involve the reader's conscious awareness of
    their own comprehension process and their ability to take corrective action when
    understanding breaks down. Peregoy & Boyle define metacognition as "thinking about
    thinking" -- readers ask themselves "Does this make sense?" "Did I find what I
    was looking for?" and "Do I need to reread?" Fix-up strategies include rereading
    when a word does not fit the meaning, adjusting reading rate (slowing down for
    complex math texts), recognizing when a heading-generated question has not been
    fully answered, and using context to resolve confusion. These strategies must
    be explicitly taught through teacher think-alouds and then practiced with gradual
    release of responsibility. The key insight is that proficient readers do not just
    decode text -- they continuously monitor and repair their own comprehension.
  examples:
  - A student misreads 'bow' in a hunting passage but encounters context that does
    not fit, prompting rereading and self-correction -- an act of metacognitive monitoring.
  - A student reads a heading stating 'Three Environmental Dangers of Deforestation,'
    generates a question, reads the section, realizes only two dangers are discussed,
    and rereads to find the third -- demonstrating both purpose-setting and comprehension
    monitoring.
  - 'A teacher models: ''Hmm, this sentence about emancipation doesn''t make sense.
    Let me reread the paragraph and look for clues about what it means to free slaves.'''
  name: Metacognitive strategies (comprehension monitoring and fix-up)
  source: Peregoy & Boyle, Ch. 9, pp. 306-307; Ch. 10, pp. 371, 382-383
- description: Predicting is a cognitive strategy in which readers use titles, headings,
    prior knowledge, and text structure awareness to anticipate what content or events
    will come next. Peregoy & Boyle emphasize that predicting is not a sign of poor
    reading but rather a hallmark of proficient reading -- good readers constantly
    predict and then confirm or revise. The DL-TA and DR-TA procedures formalize this
    strategy by having stopping points where students make explicit predictions before
    reading on. For multilingual learners, predictions may be shaped by cultural background
    knowledge that differs from the text's assumptions, which provides a valuable
    teaching opportunity. Teachers should avoid judging predictions as right or wrong
    and instead ask students to identify the textual clues that led to their predictions.
  examples:
  - 'Before reading a folktale, students predict the plot based on their knowledge
    of story structure and cultural conventions: ''There will be a problem and someone
    will solve it.'''
  - From the heading 'Cleaning before Soap,' a student predicts the article will explain
    how people stayed clean before soap was invented, then reads to confirm.
  name: Cognitive strategies (predicting)
  source: Peregoy & Boyle, Ch. 9, pp. 305-307, 324-326; Ch. 10, pp. 382-383
- description: 'Questioning is a cognitive strategy in which readers generate questions
    before and during reading to create purpose and drive active comprehension. Peregoy
    & Boyle describe several questioning-based approaches: using headings to form
    questions (turning ''Three Environmental Dangers'' into ''What are the three dangers?''),
    ReQuest reciprocal questioning, and learning logs where students write questions
    about what they are learning. The key instructional point is that students must
    be taught how to generate meaningful questions -- they often produce superficial
    text-bound questions at first. Teachers model question-answer relationships explicitly
    and scaffold with sentence stems until students can generate deep, comprehension-promoting
    questions independently.'
  examples:
  - A student turns the heading 'Life without Soap' into the question 'How did people
    manage without soap? Why was soap invented?' and reads to answer both.
  - 'In a learning log, a student writes: ''Question: Why did the Civil War start?
    The book says slavery, but I wonder if there were other causes too.'''
  name: Cognitive strategies (questioning)
  source: Peregoy & Boyle, Ch. 10, pp. 382-387, 390
- description: Summarizing is a cognitive strategy in which readers identify main
    ideas and key details, then re-present them concisely in their own words. Peregoy
    & Boyle describe summarizing as a post-reading activity that consolidates comprehension,
    often paired with mapping or graphic organizers. The Somebody/Wanted/But/So template
    is a summarizing tool for narrative texts, while cognitive maps summarize expository
    texts. In reciprocal teaching, one student serves as the summarizer for each section,
    identifying what is most important. Summarizing requires readers to distinguish
    essential from non-essential information, a skill that must be explicitly taught
    through modeling and guided practice, especially for multilingual learners who
    may focus on linguistically accessible but conceptually peripheral details.
  examples:
  - 'After reading a chapter, a student summarizes: ''The North and South had different
    economies -- the North was industrial, the South was agricultural and relied on
    slavery. This led to conflict.'''
  - 'Using Somebody/Wanted/But/So on ''The Three Little Pigs'': ''The three pigs wanted
    to live safely, but the wolf blew down their houses, so they built a brick house
    and outsmarted him.'''
  name: Cognitive strategies (summarizing)
  source: Peregoy & Boyle, Ch. 9, pp. 312-313, 327-328; Ch. 11, pp. 399-400
- description: Visualizing is a cognitive strategy in which readers create mental
    images or draw pictures based on the text to deepen comprehension and memory.
    Peregoy & Boyle reference visualizing as part of the broader set of comprehension
    strategies that make text come alive for readers. Illustrations, cognitive mapping,
    and even students drawing predictions (as in the DL-TA variation with folded paper)
    all engage visual representation. For multilingual learners, visualizing is particularly
    valuable because it creates a non-linguistic representation of meaning that can
    bridge gaps in English proficiency. The combination of visual and verbal processing
    strengthens encoding and recall.
  examples:
  - During DL-TA, students draw their predictions at each stopping point on a folded
    piece of paper, making their thinking visible before comparing with the book's
    illustrations.
  - After reading a description of a historical setting, students close their eyes
    and imagine what the scene looked like, sounds like, and felt like, then share
    their mental images.
  name: Cognitive strategies (visualizing)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326, 329-331
- description: 'Context clue strategies teach students to use surrounding words, headings,
    sentence structure, and author paraphrases to infer the meaning of unfamiliar
    vocabulary without resorting to a dictionary. Peregoy & Boyle describe contextual
    redefinition as a specific technique: the teacher selects key words, creates example
    sentences that allow students to predict meanings from context, then reveals the
    actual word and discusses which guesses were closest. Authors deliberately help
    readers by paraphrasing technical terms in subsequent clauses and by placing key
    vocabulary in headings. Students who develop strong context clue strategies become
    more independent readers, capable of inferring meanings from multiple textual
    sources rather than relying on single strategies.'
  examples:
  - Encountering 'emancipation' in a Civil War text, a student uses the subsequent
    clause 'freeing slaves' to infer the meaning.
  - 'A student guesses that ''chores'' means ''household tasks'' from the sentence
    context: ''grandmother Ultima did many of the household chores normally assigned
    to them.'''
  name: Vocabulary strategies (context clues)
  source: Peregoy & Boyle, Ch. 10, pp. 387-388
- description: Word analysis strategies teach students to break unfamiliar words into
    meaningful parts -- prefixes, suffixes, and roots -- to infer meaning independently.
    Peregoy & Boyle highlight teaching prefixes and suffixes as one of the key independent
    word-learning strategies for intermediate multilingual learners. This approach
    builds on cognate awareness (e.g., recognizing that 'examinar' in Spanish and
    'examine' in English share a root) and extends to systematic instruction of common
    affixes. For Romance language speakers, Latin-based roots provide a powerful bridge
    to academic English vocabulary. The five-component model (Duke et al.) includes
    explicit instruction, modeling, collaborative use, guided practice, and independent
    application of word analysis strategies.
  examples:
  - A student encounters 'unpredictable' and breaks it into un- (not) + predict (foretell)
    + -able (capable of), inferring 'not capable of being foretold.'
  - 'A Spanish-speaking student recognizes that ''photosynthesis'' contains Greek
    roots: photo- (light) + synthesis (putting together), and connects it to Spanish
    ''fotosintesis.'''
  name: Vocabulary strategies (word analysis -- prefixes, suffixes, roots)
  source: Peregoy & Boyle, Ch. 7, pp. 229-230; Ch. 10, pp. 387-388
- description: Taking turns asking and answering questions about sections of text,
    beginning with teacher modeling and gradually shifting responsibility to students.
  examples:
  - 'Mrs. Lopez models: from the heading ''Glucose,'' she generates the question ''What
    is glucose and what does it do?'' Students answer, then generate their own question
    for the next section ''What Is Photosynthesis?'' (revised to ''How does photosynthesis
    work and how does it relate to glucose?'').'
  - 'First-grade teacher Lilly Chan plays a ReQuest game with ''Fortunately'': she
    gives the answer ''peanut butter'' and students ask ''What goes good with jelly?''
    ''What is made out of stomped peanuts?'' Then they apply the procedure to the
    story, taking turns asking and answering questions about each section.'
  name: Reciprocal questioning (ReQuest)
  source: Peregoy & Boyle, Ch. 10, pp. 385-387
teaching_approach:
  stages:
  - activities:
    - 'Anticipation guides: students state opinions on themes before reading (e.g.,
      ''Having to move constantly from one foster family to another would make me
      angry'' before reading The Great Gilly Hopkins)'
    - 'Structured overviews: visual displays showing hierarchy of key concepts (e.g.,
      a structured overview of U.S. government branches)'
    - 'Pre-teaching key vocabulary through clustering (e.g., brainstorming words related
      to ''desert'': hot, wind, dry, sand, cactus, scorpions)'
    - 'K-W-L: students list what they Know and what they Want to know before reading'
    - 'Preview guides: students read headings, subheadings, and summaries to gain
      an overview before reading'
    source: Peregoy & Boyle, Ch. 10, pp. 377-382
    stage: Pre-reading -- activating background knowledge and setting purpose
    teacher_tips: State explicitly what you expect students to gain from a text and
      what you want them to do with what they have read. This helps students establish
      a purpose they can monitor. Use anticipation guides to motivate and create a
      before-and-after comparison opportunity.
  - activities:
    - 'DL-TA/DR-TA: stop at preselected points in the text and have students make
      predictions, then read to confirm'
    - 'Using headings to generate questions: turn each heading into a question, read
      to answer it'
    - 'ReQuest: reciprocal questioning with teacher modeling good questions first'
    - 'Learning logs: students write questions and notes while reading'
    - 'Jigsaw: cooperative groups where each student reads one section and teaches
      it to others'
    - 'Clustering for vocabulary in context: guess word meaning from surrounding context,
      then confirm'
    source: Peregoy & Boyle, Ch. 9, pp. 324-326; Ch. 10, pp. 382-390
    stage: During reading -- modeling and scaffolding active strategies
    teacher_tips: During DL-TA, avoid making judgments about students' predictions.
      They learn that making inaccurate predictions is acceptable and that even incorrect
      predictions get them more involved in the story. Model your own thinking aloud
      so students can see how experienced readers process text.
  - activities:
    - 'Cognitive mapping: graphic summaries of complex texts showing characters, settings,
      and plot relationships'
    - Story mapping using Somebody/Wanted/But/So structure for narrative texts
    - Venn diagrams for compare/contrast texts
    - Summarizing and rehearsing information with mapping
    - 'Literature response journals: writing informal comments about text'
    - 'K-W-L completion: students fill in what they Learned'
    - Written/oral collaborative research projects
    source: Peregoy & Boyle, Ch. 9, pp. 311-313, 327-329; Ch. 11, pp. 399-400, 408-409
    stage: Post-reading -- consolidating comprehension through response and organization
    teacher_tips: Provide varied response options so students do not always do the
      same type of post-reading activity. Options include reader's theater, illustrations,
      drama, storytelling, journals, story maps, puppet shows, timelines, dioramas,
      posters, and more.
