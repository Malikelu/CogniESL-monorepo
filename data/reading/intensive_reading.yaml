activities:
- name: Directed Reading-Thinking Activity (DR-TA)
  description: 'Teacher guides students through a Prediction-Read-Confirm cycle: students
    predict what a text will say, read a segment, confirm or revise predictions, and
    continue. Develops active reading and metacognitive awareness.'
  level: A2-C1
  source: Peregoy and Boyle (2023) Ch.9, pp. 324-326, 331-333
  type: reading, comprehension
- description: Small-group reading at instructional level with teacher scaffolding
    through echo, choral, partner, and independent reading.
  level: A2-C1
  name: Guided Reading with leveled groups
  source: Peregoy & Boyle, Ch. 9, pp. 309-312
- description: Teacher-directed prediction cycle with stopping points where students
    predict, read, confirm, and revise predictions for both narrative and informational
    texts.
  level: A2-C1
  name: Directed Reading-Thinking Activity (DR-TA)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326, 331-333; Ch. 10, pp. 383-384
- description: Reciprocal questioning between teacher and students to model and build
    independent questioning strategies during reading.
  level: B1-C1
  name: ReQuest Procedure
  source: Peregoy & Boyle, Ch. 10, pp. 385-387
- description: Before-during-after strategy where students record what they Know,
    what they Want to know, and what they Learned from a text.
  level: A2-C1
  name: K-W-L Strategy
  source: Peregoy & Boyle, Ch. 11, pp. 410-411
- description: Teacher-created assessment based on classroom texts, assessing key
    concepts and reading skills (main idea, compare/contrast, vocabulary in context)
    with actual course materials.
  level: B1-C1
  name: Content-Area Reading Inventory (CARI)
  source: Peregoy & Boyle, Ch. 10, pp. 372-374
assessment:
  rubric_criteria:
  - Comprehension of main ideas and supporting details
  - Ability to identify text structure
  - Use of cognitive and metacognitive strategies
  - Vocabulary acquisition from context
  - Ability to respond personally and critically to text
  - Quality of predictions and monitoring during reading
  source: Peregoy & Boyle, Ch. 9, pp. 336-346; Ch. 10, pp. 372-374
  task_types:
  - Content-Area Reading Inventories (CARI) to evaluate students on classroom texts
  - Story maps and cognitive maps to assess comprehension of narrative and informational
    texts
  - Learning logs and response journals
  - Miscue analysis to examine reading errors and self-correction patterns
  - Informal Reading Inventories (IRIs) to determine independent, instructional, and
    frustration levels
  - Project-based assessments (photo essays, collaborative research projects, posters)
cefr_range: A2-C1
