common_difficulties:
- difficulty: Students lack sufficient background knowledge for the text topic
  explanation: Multilingual learners may come from different educational systems,
    cultures, or life experiences that do not align with the assumed background knowledge
    of a text. A student who has never experienced snow, American government, or Western
    fairy tales may struggle with texts that assume this knowledge.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 9, pp. 305-306; Ch. 10, pp. 377-382
  teaching_strategy: 'Use prereading strategies to build background knowledge: field
    trips (including virtual), videos, simulation games, experiments, pre-teaching
    vocabulary, structured overviews, preview guides, and anticipation guides. For
    example, before reading about the U.S. government, use a structured overview to
    visually display the hierarchy of government branches.'
- difficulty: Students cannot identify the text structure of English informational
    texts
  explanation: Text structures vary across cultures. What is considered appropriate
    organization in one language may differ from English conventions. Some students
    may never have been explicitly taught how English texts are organized. Peregoy
    & Boyle note that Faustino, an advanced multilingual learner, had never heard
    of the five-paragraph essay structure and was relieved when it was explained.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 10, pp. 365-370
  teaching_strategy: 'Explicitly teach common informational text structures (attributive/enumerative,
    compare/contrast, problem/solution, cause/effect) using visual-spatial strategies
    like graphic organizers. Use Leticia Alvarez''s train analogy for essay organization:
    the engine is like the introduction, each train car carries new information like
    paragraphs, signal words link cars like cohesive ties link paragraphs, and the
    caboose looks back like a conclusion.'
- difficulty: Students struggle with cohesive ties and signal words
  explanation: Cohesive ties (nevertheless, moreover, notwithstanding, in addition,
    as a cause/effect) are abstract words that convey relationships between
    complex ideas. They do not refer to concrete objects or actions, making them difficult
    for multilingual learners. Students may not recognize that "nevertheless" signals
    negation of a previous statement or that "moreover" adds equal-weight information.
  l1_groups: all
  source: Peregoy & Boyle, Ch. 10, pp. 368-369
  teaching_strategy: 'Categorize cohesive ties by their signpost function (time/order:
    soon, when, finally; additive: in addition, moreover, also; cause/effect: as a
    result, because, since; consequently: in summary, therefore; changing direction:
    nonetheless, despite, however). Show students how to use these in their own writing
    and provide bilingual dictionaries for initial understanding.'
definition: 'Intensive reading involves teacher-supported, close reading of relatively
  short texts to develop detailed comprehension and analytical skills. Peregoy & Boyle
  describe it as the counterpart to extensive reading, in which students grow in English
  language proficiency while developing vocabulary, background knowledge, comprehension,
  and careful engagement with text. Intensive reading is characterized by structured
  support before, during, and after reading, using strategies such as guided reading,
  the Directed Reading-Thinking Activity (DR-TA), ReQuest (reciprocal questioning),
  and post-reading activities like mapping, summarizing, and K-W-L. Text difficulty
  is carefully considered: instructional-level text (90-98% word recognition accuracy,
  at least 70% comprehension with teacher assistance) is typically used.'
description: Detailed, careful reading of shorter texts in which the teacher guides
  students through pre-reading, during-reading, and post-reading stages to develop
  deep comprehension, vocabulary, text structure awareness, and the ability to analyze
  both informational and narrative texts.
key_principles:
- explanation: 'Effective intensive reading follows a three-stage structure. Before
    reading: introduce the text (title, author, illustrator), make predictions, pre-teach
    3-4 key academic vocabulary words, and introduce academic language structures.
    During reading: set purpose, circulate and help with word identification and comprehension,
    discuss purpose between portions. After reading: invite personal responses, discuss
    useful strategies, respond through writing, drama, or art, and note areas for
    further instruction.'
  principle: Reading is staged with explicit pre-reading, during-reading, and post-reading
    phases
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 310-312
- explanation: For guided/intensive reading, teachers select material at the students'
    instructional level -- text students can read with teacher assistance, typically
    with 90-98% word recognition accuracy and at least 70% comprehension. This contrasts
    with extensive reading (independent, easy text) and frustration-level text (too
    difficult even with help). However, Peregoy & Boyle caution that grade-level texts
    with differentiated support may be more appropriate than always using leveled
    texts, as over-reli on instructional-level text may not address grade-level standards.
  principle: Instructional-level text provides optimal challenge with support
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 307-308, 316
- explanation: Intensive reading explicitly teaches cognitive strategies (making inferences,
    predictions) and metacognitive strategies (self-monitoring, rereading when meaning
    breaks down). Peregoy & Boyle define metacognition as "thinking about thinking"
    -- reflecting on one's own comprehension process. Students learn to ask themselves
    "What is the main idea here?" and to recognize when they need to reread. Explicit
    instruction on these strategies during literature and content-area reading helps
    students understand and remember.
  principle: Students actively construct meaning through cognitive and metacognitive
    strategies
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 306-307, 10
- explanation: 'Reading comprehension is not a single skill but the integration of
    several types of knowledge: language knowledge, background knowledge, text structure
    awareness, decoding ability, and vocabulary. Peregoy & Boyle illustrate this with
    "The Boys'' Arrows" passage experiment, where readers misread words (bow, tear,
    read, minute, Does) because their background knowledge and syntactic expectations
    led them to predict incorrectly. Teaching must address all these sources.'
  principle: Multiple knowledge sources interact during comprehension
  reliability: B
  source: Peregoy & Boyle, Ch. 9, pp. 305-307
- explanation: One of the key elements of intensive reading instruction is teaching
    students to recognize organizational patterns such as compare/contrast, problem/solution,
    cause/effect, and enumerative (list) text structures. When students recognize
    a structure like compare/contrast, they know to look for similarities and differences.
    Familiarity with text structure patterns forms templates that permit prediction
    and provide a "conceptual net" for remembering information.
  principle: Text structure knowledge aids comprehension and memory
  reliability: B
  source: Peregoy & Boyle, Ch. 10, pp. 365-368
l1_interference:
- language: All L1s
  patterns:
  - example_correct: 'The student recognizes and uses the standard English expository
      structures: topic sentence with supporting details (enumerative), compare/contrast,
      problem/solution, and cause/effect patterns.'
    example_l1: Chinese, Japanese, Korean, Arabic, Spanish, and others
    example_wrong: A student organizes an essay using the discourse pattern typical
      of their first language, which may seem digressive or poorly organized to an
      English-speaking teacher.
    explanation: Kaplan (2005) and Kubota (2010) note that different cultures structure
      texts in rather different ways. Peregoy & Boyle recommend explicit explanations
      of English text structure conventions for older multilingual learners who have
      substantial L1 literacy. The train analogy and graphic organizers like Venn
      diagrams and structured overviews help make these patterns visible.
    pattern: Different text structure conventions across cultures
    source: Peregoy & Boyle, Ch. 10, pp. 365-370
- language: All L1s
  patterns:
  - correct_example: A student recognizes that 'bow' in a hunting context means the
      weapon, not the front of a ship, and self-corrects when the meaning does not
      fit.
    example_l1: Various
    example_wrong: A student with a hunting background reads 'bow' (rhyming with 'so')
      instead of 'bow' (rhyming with 'cow') when the context actually describes a
      bow and arrow, because their schema activates the more common meaning.
    explanation: Peregoy & Boyle's "The Boys' Arrows" experiment shows how background
      knowledge and syntactic expectations lead to prediction errors in reading. Multilingual
      students may bring different cultural background knowledge that activates different
      schemas. Explicit instruction on using both linguistic and conceptual background
      knowledge helps students make better predictions.
    pattern: Miscues from L1-influenced background knowledge during reading
    source: Peregoy & Boyle, Ch. 9, pp. 305-307
skill_area: intensive_reading
skill_name: Intensive Reading
sources:
  primary: 'Peregoy, S. F., & Boyle, O. F. (2023). Reading, Writing, and Learning
    in ESL: A Resource Book for Teaching K-12 Multilingual Learners (8th ed.). Pearson.
    Chapters 9-11.'
  secondary:
  - Stauffer, R. G. (1975). Directing the Reading-Thinking Process. Harper & Row.
  - Manzo, A. V. (1968). The ReQuest procedure. Journal of Reading, 11(3), 123-126.
  - Palincsar, A. S., & Brown, A. L. (1984). Reciprocal teaching of comprehension-fostering
    and comprehension-monitoring activities. Cognition and Instruction, 1(2), 117-175.
  - 'Ogle, D. M. (1986). K-W-L: A teaching model that develops active reading of expository
    text. The Reading Teacher, 39(6), 564-570.'
sub_skills:
- description: Teacher works with a small group of students at similar reading levels,
    supporting them as they read instructional-level text. The teacher differentiates
    support using echo reading, choral reading, partner reading, and independent reading.
  examples:
  - Teacher pre-teaches three key vocabulary words before students read a science
    article, then circulates to help individuals identify words and understand new
    contexts.
  - A teacher uses echo reading (teacher reads one to two sentences, students echo)
    with beginning readers, then transitions to choral reading, then partner reading,
    then independent reading for more advanced students.
  name: Guided reading with small groups
  source: Peregoy & Boyle, Ch. 9, pp. 309-312, 384-385
- description: The Directed Listening-Thinking Activity (DL-TA) and Directed Reading-Thinking
    Activity (DR-TA) scaffold students in making predictions at pre-set stopping points
    and monitoring whether predictions are confirmed as the text continues.
  examples:
  - 'Teacher Lisa Joiner uses DL-TA with ''Harold''s Circus'': students fold paper
    in quarters, draw predictions about what Harold will draw next at each stopping
    point, then compare with the actual pictures.'
  - 'DR-TA with ''The Magician''s Apprentice'': after reading the title, teacher asks
    what a magician''s apprentice is, students predict what will happen, read a portion,
    confirm or revise predictions, and continue.'
  name: Prediction and monitoring (DL-TA / DR-TA)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326, 331-333, 383-384
- description: A procedure in which teacher and students take turns asking and answering
    questions about sections of text, modeling good questioning strategies and building
    independent comprehension skills.
  examples:
  - 'Mrs. Lopez uses ReQuest with a photosynthesis chapter: she models generating
    a question from the heading ''Glucose,'' then students create questions for subsequent
    sections, taking turns throughout the chapter.'
  - 'First-grade teacher Lilly Chan uses ReQuest with the book ''Fortunately'': she
    gives an answer (''peanut butter'') and students ask the question (''What goes
    good with jelly?''), then they apply the procedure to the story.'
  name: Reciprocal questioning (ReQuest)
  source: Peregoy & Boyle, Ch. 10, pp. 385-387
- description: Activities after reading that reinforce comprehension and retention,
    including mapping, summarizing, Venn diagrams, and K-W-L.
  examples:
  - Students create a cognitive map to summarize the characters, setting, and plot
    of 'Beauty and the Beast.'
  - Students use a Venn diagram to compare and contrast the North and the South during
    the Civil War.
  - 'K-W-L strategy: before reading, students list what they Know and what they Want
    to know; after reading, they list what they Learned.'
  name: Post-reading comprehension strategies
  source: Peregoy & Boyle, Ch. 11, pp. 399-400, 410-411
- description: 'The DR-TA is a teacher-directed prediction cycle in which students
    read text silently in chunks, stopping at preselected points to make predictions
    about what will come next, then reading on to confirm or revise those predictions.
    Peregoy & Boyle emphasize three rules for the teacher during DR-TA: (1) do not
    judge predictions as right or wrong, (2) ask students to point to the textual
    clues that led to their predictions, and (3) keep the discussion moving to maintain
    engagement. The strategy can be used with both narrative texts (like folktales)
    and informational texts (using headings as scaffolding). The DL-TA (Directed Listening-Thinking
    Activity) is the read-aloud version for younger or less proficient readers, where
    the teacher reads aloud and stops for predictions.'
  examples:
  - With 'The Magician's Apprentice:' after reading the title, the teacher asks what
    an apprentice is, students predict what the apprentice will do, read a portion
    silently, confirm or revise predictions, and continue.
  - 'With a science article on deforestation: at each heading (e.g., ''Three Environmental
    Dangers''), students predict what the dangers might be before reading the section,
    then check their predictions.'
  name: DR-TA (Directed Reading-Thinking Activity)
  source: Peregoy & Boyle, Ch. 9, pp. 324-326, 331-333; Ch. 10, pp. 383-384
- description: ReQuest (Manzo, 1968) is a procedure in which teacher and students
    take turns asking and answering questions about sections of text, with the text
    remaining closed during the questioning phase to encourage prediction and active
    engagement. The teacher models good questioning by asking deep comprehension questions
    about the first section, then students generate questions for subsequent sections.
    Peregoy & Boyle highlight that students often struggle with question generation
    at first because they are accustomed only to answering teacher questions. The
    teacher must scaffold the process, making question-answer relationships explicit
    through modeling before students take over. The strategy works well with both
    narrative and informational texts.
  examples:
  - 'Mrs. Lopez models with the heading ''Glucose'': ''What is glucose and what does
    it do?'' Students answer, then generate their own question for the next heading
    ''What Is Photosynthesis?'''
  - 'Lilly Chan begins ReQuest with a game: she gives the answer ''peanut butter''
    and students generate questions (''What goes good with jelly?''). Then they apply
    reciprocal questioning to the story ''Fortunately.'''
  name: ReQuest procedure (reciprocal questioning with text closed)
  source: Peregoy & Boyle, Ch. 10, pp. 385-387
- description: K-W-L is a before-during-after strategy in which students record what
    they already Know about a topic before reading, what they Want to know, and after
    reading, what they Learned. Peregoy & Boyle cite Ogle (1986) and describe the
    K-W-L Plus variant, in which students organize their learned information using
    cognitive mapping after completion. The strategy activates prior knowledge, sets
    a purpose for reading (to answer the "Want to know" questions), and provides a
    concrete record of learning that students can reflect on. It is especially effective
    for content-area reading in science and social studies.
  examples:
  - Before reading about the Civil War, students list in the K column what they already
    know (e.g., 'It was between the North and South') and in the W column what they
    want to know (e.g., 'Why did it start?', 'How many people died?'). After reading,
    they fill in the L column with new information.
  - 'K-W-L Plus: after completing the K, W, and L columns, students create a cognitive
    map to visually organize what they learned.'
  name: KWL strategy (Know/Want to Know/Learned)
  source: Peregoy & Boyle, Ch. 11, pp. 410-411
- description: 'Reciprocal teaching (Palincsar & Brown, 1984) is a cooperative comprehension
    strategy in which students take on four rotating roles -- predictor, questioner,
    clarifier, and summarizer -- to lead a discussion about a text. Peregoy & Boyle
    place this as a post-reading activity that shifts responsibility for comprehension
    from teacher to students. Each student leads the group using one strategy: the
    predictor makes guesses about what comes next, the questioner generates questions
    about the text, the clarifier resolves confusing parts, and the summarizer identifies
    main ideas and key details. Over time, students internalize all four strategies
    as independent reading tools.'
  examples:
  - In a literature response group discussing a chapter of 'The Great Gilly Hopkins,'
    one student serves as the predictor (what will Gilly do next?), another as the
    questioner (why is Gilly so angry?), another as the clarifier (what does 'transient'
    mean?), and the fourth as the summarizer (the main events of this chapter were...).
  - Students rotate roles with each new text section until all members have practiced
    all four roles.
  name: Reciprocal teaching (predictor, questioner, clarifier, summarizer)
  source: Peregoy & Boyle, Ch. 11, pp. 399-400; Ch. 9, p. 313
- description: Think-alouds are a teacher-led strategy in which the teacher verbalizes
    their own thought process while reading, making the normally invisible cognitive
    and metacognitive strategies of proficient readers visible to students. Peregoy
    & Boyle describe this as essential for teaching metacognition because students
    need to see how experienced readers handle unfamiliar words, monitor comprehension,
    and use fix-up strategies. During a think-aloud, the teacher might say, "Hmm,
    this word 'read' -- does it rhyme with 'reed' or 'red'? Let me read ahead to figure
    it out," or "The heading asked three causes but I've only found one -- I need
    to reread this section." The five-component model (Duke et al.) explicitly includes
    think-alouds as the second step after description of the strategy.
  examples:
  - While reading 'The Boys' Arrows' aloud, the teacher pauses and says, 'I read 'bow'
    but that doesn't fit the context of a hunting story -- let me reread and check
    if it could mean something else.'
  - 'A teacher models comprehension monitoring: ''The heading promised three causes
    of the Civil War. I''ve found two so far. I''m going to slow down and pay close
    attention to find the third cause.'''
  name: Think-alouds for metacognitive modeling
  source: Peregoy & Boyle, Ch. 9, pp. 306-307; Ch. 10, pp. 371, 387-388
- description: Students learn to turn headings into questions before reading, creating
    a purpose that helps monitor comprehension.
  examples:
  - A heading says 'Three Environmental Dangers of Deforestation' -- students create
    the question 'What are the three environmental dangers?' and know they must find
    three dangers when they read.
  - A heading says 'Cleaning before Soap' -- students predict how people got clean
    before soap existed.
  name: Using headings and subheadings to generate questions
  source: Peregoy & Boyle, Ch. 10, pp. 382-383
teaching_approach:
  stages:
  - activities:
    - 'Introduce the text: title, author, illustrator'
    - Walk through pictures to build background and generate interest
    - Invite predictions about the text to set a purpose for reading
    - Pre-teach three to four key academic vocabulary words
    - Introduce relevant academic language structures; have students orally rehearse
    - Activate background knowledge through discussion, video, field trips, experiments,
      or simulations
    - Use anticipation guides or preview guides
    source: Peregoy & Boyle, Ch. 9, pp. 310-311; Ch. 10, pp. 377-382
    stage: Pre-reading
    teacher_tips: The purposes for prereading strategies are to motivate interest
      and build background knowledge, clarify the purpose for reading, and gain a
      general sense of the text organization and content. Always state explicitly
      what you expect students to gain from the text and what you want them to do
      with what they have read.
  - activities:
    - Set a purpose for reading a portion of text (silent or aloud based on student
      level)
    - Circulate and provide individualized help with word identification, punctuation,
      and vocabulary in context
    - Use DL-TA/DR-TA prediction cycles at stopping points
    - Model self-questioning and comprehension monitoring
    - Teach students to use headings to generate questions and check understanding
    - Use ReQuest reciprocal questioning to model active reading
    source: Peregoy & Boyle, Ch. 9, pp. 310-311; Ch. 10, pp. 382-387
    stage: During reading
    teacher_tips: Students need to ask themselves, 'Did I find what I was looking
      for?' If they have a clearly set purpose, they will be able to determine their
      success while reading. Use heterogeneous groups to pair beginning-level students
      with more proficient peers who can articulate meaning and provide access to
      difficult text.
  - activities:
    - 'Invite personal responses: favorite parts, main ideas, themes'
    - Brief explicit discussion of useful reading strategies applied
    - Literature response journals
    - Reader's theater or puppet shows
    - Story mapping or cognitive mapping
    - Summarizing and rehearsing information with mapping
    - 'Writing extensions: response sheets, creative writing, poster creation'
    source: Peregoy & Boyle, Ch. 9, pp. 311-313; Ch. 11, pp. 397-400
    stage: Post-reading
    teacher_tips: Provide a variety of response extensions so students experience
      different ways to interpret texts. Options include reader's theater, illustrations,
      drama, storytelling, response sheets, journals, story maps, puppet shows, timelines,
      Big Books, board games, dioramas, and more.
