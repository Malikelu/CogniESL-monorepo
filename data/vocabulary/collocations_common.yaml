activities:
- name: Collocation Matching
  description: Students match verbs with their typical noun collocations (make a decision,
    do research, take action).
  level: B1-C1
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
  type: vocabulary
cefr_range: B1-C2
citations:
- claim: Collocations are word combinations that frequently appear together — strong/weak,
    not *powerful/feable. Teaching collocations improves fluency and naturalness of
    expression
  flagged: false
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Units 10-15
  tier: 2
- claim: Collocations can be adjective+noun (strong coffee), verb+noun (make a decision),
    noun+verb (opportunity arises), adverb+adjective (highly likely), and verb+preposition
    (depend on)
  flagged: false
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Units 10-15
  tier: 2
- claim: Collocations are best taught in writing context. Folse's Great Writing series
    teaches collocations through authentic paragraph and essay writing tasks, showing
    learners how word combinations function in real written English.
  source: 'Folse, K. S. (2020). Great Writing 2: Great Paragraphs, 5th ed. National
    Geographic Learning/Cengage.'
  tier: 2
  reliability: B
  flagged: false
- claim: Biber's corpus research shows that collocational patterns vary significantly
    across registers — combinations common in academic writing are rare in conversation,
    and vice versa.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.5: Description of
    the register categories in the LSWE Corpus'
  tier: 2
  reliability: B
  flagged: false
collocations:
- collocation: make a decision
  type: verb + noun
  frequency: very high
  source: McCarthy and O'Dell (2008) Unit 10
- collocation: do research
  type: verb + noun
  frequency: very high
  source: McCarthy and O'Dell (2008) Unit 10
- collocation: take action
  type: verb + noun
  frequency: high
  source: McCarthy and O'Dell (2008) Unit 10
- collocation: strong evidence
  type: adjective + noun
  frequency: high
  source: McCarthy and O'Dell (2008) Unit 11
- collocation: key factor
  type: adjective + noun
  frequency: high
  source: McCarthy and O'Dell (2008) Unit 11
- collocation: highly unlikely
  type: adverb + adjective
