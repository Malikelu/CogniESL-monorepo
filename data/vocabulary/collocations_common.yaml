common_difficulties:
- difficulty: Direct L1 translation of collocations
  cause: Learners translate collocation patterns from L1
  solution: Teach collocations as chunks, not word-by-word translations
definition: ''
description: English has strong collocational patterns that differ from many other
  languages. McCarthy and O'Dell (2008) identify verb+noun (make a decision, do research),
  adjective+noun (strong evidence, key factor), and adverb+adjective (highly unlikely,
  bitterly disappointed) as the most frequent and important types for academic learners.
key_principles:
- principle: Teach words with their typical collocations, not in isolation
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
- principle: Learners need multiple exposures to recognize collocational patterns
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
