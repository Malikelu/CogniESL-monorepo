teaching_approach: Teach collocations as lexical chunks. Use corpus-based lists for
  frequency ordering. Practice through gap-fills and substitution drills.
word_formation: []
word_lists: []
teaching:
  methodology: Explicit instruction
  tips:
  - 'Parrott (2000) Ch. 9: Language is largely learned in chunks. Words should rarely be taught in isolation. Grammatical aspects of words determine what combinations can follow them.'
  - 'McCarthy & O''Dell (2008) Academic Vocabulary in Use Units 10-12: Academic collocations
    include noun+verb (research shows), adjective+noun (empirical data), verb+noun
    (conduct research), and prepositional phrases (in terms of, with regard to).'
