citations:
- claim: Academic vocabulary is discipline-neutral — these words appear across all
    academic fields and are distinct from specialist terminology
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Introduction, p. 6
  tier: 1
  reliability: B
  flagged: false
- claim: Many academic words are everyday words with specialized meanings — words
    like 'discipline', 'solid', and 'focus' have both everyday and academic uses
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Unit 1, p. 10
  tier: 1
  reliability: B
  flagged: false
- claim: Academic vocabulary is best learned through writing context. Folse's Great
    Writing series systematically teaches academic word choice, collocations, and
    register-appropriate vocabulary through authentic writing tasks.
  source: 'Folse, K. S. (2020). Great Writing 3: From Great Paragraphs to Great Essays,
    5th ed. National Geographic Learning/Cengage. Unit 1: Building Better Vocabulary'
  tier: 2
  reliability: B
  flagged: false
- claim: Biber's corpus analysis demonstrates that academic vocabulary shows distinct
    frequency patterns across registers, with academic prose using significantly different
    word frequency distributions than conversation or fiction.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 5: Distribution of
    lexical verbs and copula be across registers'
  tier: 2
  reliability: B
  flagged: false
teaching:
  methodology: Explicit instruction
  tips:
  - 'McCarthy & O''Dell (2008) Academic Vocabulary in Use. Units 1-9: Academic vocabulary
    includes key nouns (subject, theme, issue, theory), key verbs (discuss, examine,
    demonstrate, establish), key adjectives (relevant to, specific to), and key adverbs
    (comparatively, particularly, primarily). Teach word families and register pairs.'
