skill_area: academic_vocabulary
skill_name: Academic Vocabulary (Cross-Disciplinary)
cefr_range: B2-C2
sources:
  primary: McCarthy, M. & O'Dell, F. (2008). Academic Vocabulary in Use. Cambridge
    University Press.
  secondary:
  - 'Folse, K. S. (2020). Great Writing 3: From Great Paragraphs to Great Essays,
    5th ed. National Geographic Learning/Cengage. Units 1-3: Vocabulary Building in
    Writing Context'
description: '

  Core academic vocabulary used across all disciplines in academic speech and writing.

  Based on McCarthy & O''Dell (2008), selected from the Cambridge International Corpus.

  Covers key nouns, verbs, adjectives, adverbs, word combinations, functions, and
  academic life terms.

  '
key_principles:
- principle: Academic vocabulary is discipline-neutral
  explanation: These words are used across all academic fields, unlike specialist
    terminology which is subject-specific.
  source: McCarthy & O'Dell 2008, Introduction, p. 6
  reliability: B
- principle: Many academic words are everyday words with specialized meanings
  explanation: Words like 'discipline', 'underline', 'solid', 'pose', 'focus' have
    both everyday and academic uses. The academic meaning is often more abstract.
  source: 'McCarthy & O''Dell 2008, Unit 1: What is special about academic English?,
    p. 10'
  reliability: B
- principle: Academic language uses dense noun phrases
  explanation: Instead of spreading information across clauses, academic writing packs
    it into noun phrases (e.g., 'the accidental release of radiation over a 24-hour
    period').
  source: McCarthy & O'Dell 2008, Unit 1, p. 10
  reliability: B
- principle: Register awareness is essential
  explanation: Academic writing uses formal expressions (e.g., 'in sum', 'solely',
    'virtually') while spoken academic style may use informal language. Students must
    know which to use in writing.
  source: McCarthy & O'Dell 2008, Unit 1, p. 10
  reliability: B
- principle: Word families should be learned together
  explanation: Learning all forms of a word (noun, verb, adjective, adverb) helps
    students use vocabulary flexibly. E.g., accident (n.) → accidental (adj.) → accidentally
    (adv.).
  source: McCarthy & O'Dell 2008, Unit 1, p. 10
  reliability: B
- principle: Collocations are critical for natural academic English
  explanation: Academic English has fixed word combinations (e.g., 'cast doubt on',
    'put forward a theory', 'come to a conclusion'). Learning these as chunks is essential.
  source: McCarthy & O'Dell 2008, Units 10-16
  reliability: B
- principle: Vocabulary in writing context
  explanation: Folse emphasizes teaching vocabulary through writing tasks, showing
    learners how word choice, collocations, and register awareness develop through
    authentic writing practice rather than isolated word lists.
  source: 'Folse, K. S. (2020). Great Writing 3, 5th ed. Cengage. Unit 1: Building
    Better Vocabulary'
  reliability: B
sub_skills:
- name: Key academic nouns
  description: High-frequency nouns used to discuss ideas, research, and academic
    work (subject, theme, issue, theory, model, principle, aspect, feature, scope,
    pattern, degree)
  source: 'McCarthy & O''Dell 2008, Unit 2: Key nouns, p. 12'
- name: Key academic verbs
  description: Verbs for discussing research and ideas (attempt, establish, explain,
    identify, demonstrate, suggest, argue, conclude, define, interpret, evaluate)
  source: 'McCarthy & O''Dell 2008, Unit 3: Key verbs, p. 14'
- name: Key academic adjectives
  description: Adjectives for academic description (relevant, significant, abstract,
    complex, specific, appropriate, typical, potential, crucial, fundamental)
  source: 'McCarthy & O''Dell 2008, Unit 4: Key adjectives, p. 16'
- name: Key academic adverbs
  description: Adverbs for academic qualification (comparatively, eventually, simply,
    primarily, virtually, largely, merely, precisely, increasingly, relatively)
  source: 'McCarthy & O''Dell 2008, Unit 5: Key adverbs, p. 18'
- name: Phrasal verbs in academic English
  description: Phrasal verbs with academic meanings (put forward, go through, write
    up, carry out, set out, point out, make up, go into, look back over, go against)
  source: 'McCarthy & O''Dell 2008, Unit 6: Phrasal verbs, p. 20'
- name: Quantifying expressions
  description: Expressions for amounts and quantities (a substantial amount, in excess
    of, no fewer than, the majority of, a significant number of, to some extent, a
    wide range of)
  source: 'McCarthy & O''Dell 2008, Unit 7: Key quantifying expressions, p. 22'
- name: Words with several meanings
  description: Common words with distinct academic meanings (set, accommodate, issue,
    shed light on, remain in the dark, battle, heated debate, pivotal role, collate)
  source: 'McCarthy & O''Dell 2008, Unit 8: Words with several meanings, p. 24'
- name: Metaphors and idioms in academic English
  description: Metaphorical language common in academic discourse (shed light on,
    remain in the dark, the battle against, heated debate, pivotal role, solid evidence,
    firmly established)
  source: 'McCarthy & O''Dell 2008, Unit 9: Metaphors and idioms, p. 26'
- name: Noun collocations
  description: Nouns and their typical collocates (research into, dissertation on,
    rationale for, progress towards, effect on, emphasis on, attitude to/towards,
    insight into)
  source: McCarthy & O'Dell 2008, Units 10, 15
- name: Adjective + noun combinations
  description: Common academic adjective-noun pairings (empirical data, rigorous methodology,
    principal cause, potential problem, fundamental difference, widespread support,
    major concern)
  source: McCarthy & O'Dell 2008, Unit 11, p. 28
- name: Verb + noun combinations
  description: Common academic verb-noun pairings (conduct research, compile data,
    raise an issue, draw a conclusion, put forward a theory, challenge a hypothesis,
    meet criteria)
  source: McCarthy & O'Dell 2008, Unit 12, p. 30
- name: Prepositional phrases
  description: Fixed prepositional phrases in academic English (in terms of, with
    regard to, in addition to, with the exception of, in conjunction with, on behalf
    of, for the most part, at this point)
  source: McCarthy & O'Dell 2008, Units 13, 16
- name: Reporting verbs
  description: Verbs for reporting others' ideas (state, claim, assert, contend, argue,
    suggest, imply, demonstrate, prove, observe, note, emphasize, highlight, pinpoint,
    cast doubt on, question)
  source: McCarthy & O'Dell 2008, Unit 32, p. 72
- name: Cause and effect language
  description: Nouns, verbs, and expressions for causation (trigger, give rise to,
    chain reaction, contribute to, result in, lead to, stem from, account for, determine,
    influence, affect, effect, consequence, outcome, impact)
  source: McCarthy & O'Dell 2008, Unit 30, p. 68
- name: Comparison and contrast language
  description: Expressions for comparing and contrasting (similarly, whereas, unlike,
    in comparison with, compared to/with, conversely, on the other hand, in contrast,
    distinction, parallel, overlap)
  source: McCarthy & O'Dell 2008, Unit 44, p. 96
- name: Organizing writing
  description: Signposting language for academic texts (firstly, secondly, finally,
    at this point, we now turn to, as we saw in, the following, respectively, the
    former, the latter)
  source: McCarthy & O'Dell 2008, Unit 39, p. 86
- name: Presenting an argument
  description: Language for developing and qualifying arguments (furthermore, moreover,
    however, nevertheless, albeit, provided that, despite the fact, having said that,
    even so, the extent to which)
  source: McCarthy & O'Dell 2008, Unit 38, p. 84
- name: Evaluation and emphasis
  description: Language for evaluating and emphasizing (comprehensive, fundamental,
    ground-breaking, crucial, significant, seminal, noteworthy, borne out by, flawed,
    incompatible, limited)
  source: McCarthy & O'Dell 2008, Unit 49, p. 106
- name: Summary and conclusion
  description: Language for concluding (to sum up, in summary, in conclusion, to conclude,
    to recapitulate, in short, in the final analysis, on balance, the main points)
  source: McCarthy & O'Dell 2008, Unit 50, p. 108
- name: Describing change
  description: Verbs and adjectives for change (increase, decrease, decline, fluctuate,
    modify, convert, recover, diminish, refine, restore, gradual, sudden, marked,
    perceptible, dramatic)
  source: McCarthy & O'Dell 2008, Unit 48, p. 104
- name: Describing problems
  description: Language for discussing problems (arise, experience difficulties, pose
    a challenge, deal with, tackle, address, resolve, overcome, contradiction, inconsistency,
    shortcoming, error)
  source: McCarthy & O'Dell 2008, Unit 45, p. 98
- name: Degrees of certainty
  description: Expressions for tentativity and certainty (it would seem, there is
    some evidence, it may be the case, it is undoubtedly true, it is evident, apparently,
    presumably, allegedly, reportedly, in the absence of evidence)
  source: McCarthy & O'Dell 2008, Unit 37, p. 82
- name: Points of view
  description: Language for discussing perspectives (objective, subjective, biased,
    impartial, prejudiced, rational, standpoint, stance, ideology, philosophy, hold
    views, adopt a position, shift position)
  source: McCarthy & O'Dell 2008, Unit 36, p. 80
- name: Research methods
  description: Vocabulary for describing research (carry out, employ, methodology,
    apparatus, procedure, experiment, pilot study, case study, survey, observation,
    replicate, variable, phenomenon)
  source: McCarthy & O'Dell 2008, Unit 41, p. 90
- name: Classifying
  description: Language for classification (category, type, component, feature, structure,
    hierarchy, nature, consist of, belong to, fall into, allocate, devise, distinct
    from)
  source: McCarthy & O'Dell 2008, Unit 42, p. 92
- name: Making connections
  description: Language for expressing links (correlate with, be associated with,
    be related to, correspond to, equivalent to, linked to, connected to, interaction,
    interplay, mutual, bond, relationship)
  source: McCarthy & O'Dell 2008, Unit 43, p. 94
- name: Describing situations
  description: Language for situations and constraints (context, circumstances, environment,
    presence, absence, status, infrastructure, constraint, restriction, confined to,
    stable, finite, integral)
  source: McCarthy & O'Dell 2008, Unit 46, p. 100
- name: Processes and procedures
  description: Language for processes (procedure, stage, step, application, simulation,
    behaviour, conduct, select, verify, supplement, unify, automate, display, export,
    input)
  source: McCarthy & O'Dell 2008, Unit 47, p. 102
- name: Talking about meaning
  description: Language for discussing meaning (define, denote, connote, infer, comprehend,
    interpret, ambiguous, transparent, coherent, terminology, glossary, nuance, perspective,
    discourse)
  source: McCarthy & O'Dell 2008, Unit 34, p. 76
- name: Research aims
  description: Language for expressing aims (goal, objective, purpose, intention,
    strategy, target, priority, motive, aim to, with the intention of, further the
    understanding of, instigate)
  source: McCarthy & O'Dell 2008, Unit 35, p. 78
- name: Analysis of results
  description: Language for analyzing data (deduce, weigh up, outweigh, come to a
    conclusion, draw a conclusion, reach a conclusion, critical, constitute, predict,
    account for, variable, insight)
  source: McCarthy & O'Dell 2008, Unit 33, p. 74
- name: Time expressions
  description: Academic time vocabulary (century, decade, era, phase, stage, concurrent,
    contemporary, subsequent, successive, temporary, prior to, in the near future,
    in the distant future, at the moment, nowadays)
  source: McCarthy & O'Dell 2008, Unit 29, p. 66
- name: Numbers and statistics
  description: Vocabulary for numerical data (tally, estimate, calculate, approximate,
    random, representative, continuous, discrete, mode, median, average, standard
    deviation, correlate, proportion, ratio, distribution)
  source: McCarthy & O'Dell 2008, Units 25, 26
- name: Graphs and diagrams
  description: Vocabulary for visual data (pie chart, bar chart, graph, plot, axis,
    intersect, adjacent, segment, peak, decline, row, column, cross-section, flowchart,
    key/legend)
  source: McCarthy & O'Dell 2008, Unit 27, p. 62
- name: Facts, evidence and data
  description: Vocabulary for evidence (distort the facts, hard evidence, empirical
    data, conflicting evidence, draw on, body of literature, primary source, secondary
    source, acknowledge, give credit, quotation, paraphrase)
  source: McCarthy & O'Dell 2008, Units 23, 24
- name: Academic institutions
  description: Vocabulary for university life (entry requirements, referee, student
    loan, tuition fees, grant, scholarship, student union, tutorial, research student,
    dormitory, supervisor, dissertation, credits, defer, assessment)
  source: McCarthy & O'Dell 2008, Units 17-22
- name: Word formation
  description: Prefixes and suffixes common in academic English (un-, mis-, pre-,
    post-, inter-, multi-, non-, re-, anti-, -tion, -ment, -ity, -ness, -able, -less,
    -ful, -ous, -ive)
  source: 'McCarthy & O''Dell 2008, Reference 5: Word formation, p. 128'
- name: Formal vs. informal academic vocabulary
  description: Pairs showing formal and informal alternatives (try/attempt, in short/in
    sum, only/solely, almost/virtually, mainly/primarily, get/obtain, give/deliver,
    look at/examine)
  source: McCarthy & O'Dell 2008, Reference 1, p. 116
activities:
- activity: Formal/informal vocabulary matching
  description: Given a neutral/informal word, find the formal academic equivalent
    (try→attempt, in short→in sum). Develops register awareness.
  source: McCarthy & O'Dell 2008, Unit 1 exercises, p. 11
- activity: Word family completion tables
  description: Given a noun, provide the verb, adjective, and adverb forms. Builds
    word family knowledge.
  source: McCarthy & O'Dell 2008, Unit 1 exercises, p. 11
- activity: Collocation matching
  description: Match nouns with their typical verb collocates (conduct + research,
    raise + an issue, draw + a conclusion). Develops chunk-based vocabulary.
  source: McCarthy & O'Dell 2008, Units 10-12 exercises
- activity: Phrasal verb to formal synonym substitution
  description: Rewrite sentences replacing phrasal verbs with formal single-word synonyms
    (carry out→conduct, put forward→present). Develops academic writing style.
  source: McCarthy & O'Dell 2008, Unit 6 exercises, p. 21
- activity: 'Error correction: adjective + preposition patterns'
  description: Identify and correct preposition errors with academic adjectives (typical
    *for→of, relevant *with→to). Targets common L1 transfer.
  source: McCarthy & O'Dell 2008, Unit 4 exercises, p. 17
- activity: Quantifying expression gap-fill
  description: Complete sentences with appropriate quantifying expressions (a substantial
    amount, in excess of, no fewer than). Develops precision.
  source: McCarthy & O'Dell 2008, Unit 7 exercises, p. 23
- activity: Multiple meaning word analysis
  description: Given a word with several academic meanings (set, issue, point), identify
    which meaning is used in context. Develops polysemy awareness.
  source: McCarthy & O'Dell 2008, Unit 8 exercises, p. 25
- activity: Academic function language sorting
  description: Sort vocabulary by academic function (presenting arguments, comparing,
    describing change, evaluating). Develops functional organization.
  source: McCarthy & O'Dell 2008, Units 38-50
collocations:
- pattern: verb + noun (academic)
  examples:
  - collocation: conduct/carry out research
    example: The team conducted research into the causes of the disease.
    source: McCarthy & O'Dell 2008, Unit 12, p. 30
  - collocation: compile data
    example: The researchers compiled data from multiple sources.
    source: McCarthy & O'Dell 2008, Unit 12, p. 30
  - collocation: raise an issue
    example: The report raises several important issues.
    source: McCarthy & O'Dell 2008, Unit 12, p. 30
  - collocation: put forward a view/an argument
    example: Smith (2014) puts forward a compelling argument for reform.
    source: McCarthy & O'Dell 2008, Unit 12, p. 30
  - collocation: draw a conclusion
    example: From this evidence, we can draw a clear conclusion.
    source: McCarthy & O'Dell 2008, Unit 12, p. 30
  - collocation: challenge a hypothesis
    example: Recent findings challenge the dominant hypothesis in the field.
    source: McCarthy & O'Dell 2008, Unit 12, p. 30
- pattern: adjective + noun (academic)
  examples:
  - collocation: empirical data
    example: The empirical data strongly supports the theory.
    source: McCarthy & O'Dell 2008, Unit 11, p. 28
  - collocation: rigorous methodology
    example: The research used a rigorous methodology tested on many occasions.
    source: McCarthy & O'Dell 2008, Unit 11, p. 28
  - collocation: principal cause
    example: The principal cause of the failure was a sudden temperature change.
    source: McCarthy & O'Dell 2008, Unit 11, p. 28
  - collocation: potential problem
    example: We noted a potential problem with the experimental design.
    source: McCarthy & O'Dell 2008, Unit 11, p. 28
  - collocation: fundamental difference
    example: There is a fundamental difference between the two approaches.
    source: McCarthy & O'Dell 2008, Unit 11, p. 28
- pattern: noun + preposition (academic)
  examples:
  - collocation: research into
    example: Recent research into climate change has yielded alarming results.
    source: McCarthy & O'Dell 2008, Units 10, 15
  - collocation: dissertation on
    example: Her dissertation on urban planning won a national award.
    source: McCarthy & O'Dell 2008, Unit 15
  - collocation: attitude to/towards
    example: Students showed a positive attitude towards the new method.
    source: McCarthy & O'Dell 2008, Unit 15
  - collocation: insight into
    example: The study provides valuable insight into consumer behavior.
    source: McCarthy & O'Dell 2008, Unit 10
- pattern: verb + preposition (academic)
  examples:
  - collocation: focus on
    example: This paper focuses on the economic aspects of migration.
    source: McCarthy & O'Dell 2008, Unit 14
  - collocation: account for
    example: How do we account for these unexpected results?
    source: McCarthy & O'Dell 2008, Unit 14
  - collocation: consist of
    example: The sample consisted of 200 undergraduate students.
    source: McCarthy & O'Dell 2008, Unit 14
common_difficulties:
- difficulty: 'Confusing ''affect'' (verb: influence) and ''effect'' (verb: bring
    about / noun: result)'
  example_wrong: '*The burning of fossil fuels has negatively effected the global
    climate.'
  example_correct: The burning of fossil fuels has negatively affected the global
    climate.
  explanation: Affect is a verb meaning 'influence'. Effect as a verb means 'make
    happen'. As a noun, effect means 'result'. One of the most common academic vocabulary
    errors.
  source: McCarthy & O'Dell 2008, Unit 3 p. 14, Unit 30 p. 68
  reliability: B
- difficulty: Using 'typical for' instead of 'typical of'
  example_wrong: '*It is typical for the disease to start with a rash.'
  example_correct: It is typical of the disease to start with a rash.
  explanation: The adjective 'typical' collocates with 'of', not 'for'. Common preposition
    error from L1 transfer.
  source: McCarthy & O'Dell 2008, Unit 4 p. 16
  reliability: B
- difficulty: Using 'relevant with' instead of 'relevant to'
  example_wrong: '*This discussion is not relevant with the topic.'
  example_correct: This discussion is not relevant to the topic.
  explanation: '''Relevant'' collocates with ''to'', not ''with''.'
  source: McCarthy & O'Dell 2008, Unit 4 p. 16
  reliability: B
- difficulty: Using 'appropriate about' instead of 'appropriate to/for'
  example_wrong: '*This methodology is not appropriate about the research.'
  example_correct: This methodology is not appropriate for the research.
  explanation: '''Appropriate'' collocates with ''to'' or ''for'', not ''about''.'
  source: McCarthy & O'Dell 2008, Unit 4 p. 16
  reliability: B
- difficulty: Using 'eventually' to mean 'perhaps/possibly'
  example_wrong: '*We will eventually discover life on other planets.'
  example_correct: We will perhaps/possibly discover life on other planets.
  explanation: '''Eventually'' means ''in the end, after some time''. It does NOT
    mean ''perhaps'' or ''possibly''. Common false friend.'
  source: McCarthy & O'Dell 2008, Unit 5 p. 18
  reliability: B
- difficulty: Confusing 'most' (superlative) and 'mostly' (mainly)
  example_wrong: '*Heinrich''s experiments were most successful. [intending ''mainly'']'
  example_correct: Heinrich's experiments were mostly successful.
  explanation: '''Most'' as an adverb means ''more than all others'' (superlative).
    ''Mostly'' means ''mainly, almost completely''. Not interchangeable.'
  source: McCarthy & O'Dell 2008, Unit 5 p. 18
  reliability: B
- difficulty: Using singular noun after 'one of...'
  example_wrong: '*One of the respondent said that he recycled less.'
  example_correct: One of the respondents said that he recycled less.
  explanation: After 'one of...', the noun must be plural.
  source: McCarthy & O'Dell 2008, Unit 7 p. 22
  reliability: B
- difficulty: Confusing 'few' (negative) and 'a few' (positive)
  example_wrong: '*Few people responded. [intending ''some people responded'']'
  example_correct: A few people responded.
  explanation: '''Few'' has negative tone (not many). ''A few'' has positive tone
    (some). Same for ''little'' vs ''a little''.'
  source: McCarthy & O'Dell 2008, Unit 7 p. 22
  reliability: B
- difficulty: '''Research'' is uncountable; using ''researches'' as plural'
  example_wrong: '*They carried out some interesting researches.'
  example_correct: They carried out some interesting research. / They carried out
    some interesting studies.
  explanation: '''Research'' is uncountable. For plural: use ''studies'', ''research
    studies'', or ''pieces of research''.'
  source: McCarthy & O'Dell 2008, Unit 2 p. 12
  reliability: B
- difficulty: Confusing 'primarily' (mainly) and 'ultimately' (finally)
  example_wrong: '*The study is ultimately concerned with urban alienation. [intending
    ''mainly'']'
  example_correct: The study is primarily concerned with urban alienation.
  explanation: '''Primarily'' means ''mainly''. ''Ultimately'' means ''finally, after
    other things''.'
  source: McCarthy & O'Dell 2008, Unit 5 p. 18
  reliability: B
- difficulty: Using 'a large deal' instead of 'a great deal'
  example_wrong: '*A large deal of money was spent on the project.'
  example_correct: A great deal of money was spent on the project.
  explanation: 'Correct: ''a great deal of'' (informal) or ''a large amount of'' (neutral).
    ''A large deal'' is not idiomatic.'
  source: McCarthy & O'Dell 2008, Unit 7 p. 22
  reliability: B
- difficulty: Using 'characteristic from' instead of 'characteristic of'
  example_wrong: '*The use of metaphors is characteristic from the writer''s style.'
  example_correct: The use of metaphors is characteristic of the writer's style.
  explanation: '''Characteristic'' collocates with ''of'', not ''from''.'
  source: McCarthy & O'Dell 2008, Unit 4 p. 16
  reliability: B
definition: Academic vocabulary refers to the set of words and phrases used across
  academic disciplines for reading, writing, and discussing scholarly content. It
  excludes highly specialized technical terms unique to specific fields.
l1_interference: []
teaching_approach:
  core_method: Vocabulary notebook with contextual recording
  description: 'McCarthy & O''Dell recommend learners keep a vocabulary notebook recording:
    (1) examples in use, (2) collocations, (3) register/grammar notes, (4) L1 connections,
    (5) word family members, (6) extended uses.'
  key_techniques:
  - technique: Learn words in context, not isolation
    explanation: Recording example sentences helps learners understand how words are
      actually used.
    source: McCarthy & O'Dell 2008, To the student and the teacher, p. 8
  - technique: Record word combinations, not just individual words
    explanation: Academic English is full of fixed combinations (conduct research,
      raise an issue). Learning chunks is more efficient.
    source: McCarthy & O'Dell 2008, Units 10-16
  - technique: Build word family knowledge
    explanation: Learning all forms of a word (investigate/investigation/investigative)
      helps flexible use in different grammatical contexts.
    source: McCarthy & O'Dell 2008, Unit 1 p. 10
  - technique: 'Distinguish register: formal vs. informal academic vocabulary'
    explanation: Learners must know which words suit academic writing (attempt, in
      sum) vs. spoken style (try, basically).
    source: McCarthy & O'Dell 2008, Unit 1 p. 10, Reference 1 p. 116
  source: McCarthy & O'Dell 2008, To the student and the teacher, pp. 6-9
word_formation: []
word_lists:
- word: subject
  part_of_speech: noun
  definition: The thing which is being discussed, considered, or studied.
  example: She wrote an article on the subject of class.
  collocations:
  - on the subject of
  - change the subject
  word_family:
  - subjective
  - subjectively
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: theme
  part_of_speech: noun
  definition: The main subject of a talk, book, film, or discussion.
  example: The theme of the poem is emigration.
  collocations:
  - central theme
  - recurring theme
  - theme of
  word_family:
  - thematic
  - thematically
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: issue
  part_of_speech: noun
  definition: An important subject or problem that people are thinking or talking
    about.
  example: There was a lively debate on the issue of globalisation.
  collocations:
  - raise an issue
  - address an issue
  - key issue
  - political issue
  word_family: []
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: theory
  part_of_speech: noun
  definition: A formal statement of the rules on which a subject of study is based,
    or an opinion or explanation that accounts for a situation.
  example: Einstein's theory of gravitation has been questioned recently.
  collocations:
  - theory of
  - theoretical framework
  - develop a theory
  - challenge a theory
  word_family:
  - theoretical
  - theoretically
  - theorist
  - theorize
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: model
  part_of_speech: noun
  definition: A simplified representation of a system or process, used for discussion,
    calculation, or prediction.
  example: The model of climate change presented in the Stern Review seems to be becoming
    a reality.
  collocations:
  - model of
  - develop a model
  - theoretical model
  - Marxist model
  word_family:
  - model (verb)
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: principle
  part_of_speech: noun
  definition: A basic idea or rule that explains how something happens or works; a
    fundamental truth or proposition.
  example: Human behaviour is based on the principle of least effort.
  collocations:
  - underlying principle
  - basic principle
  - principle of
  - in principle
  word_family: []
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: aspect
  part_of_speech: noun
  definition: One individual part or feature of a situation, problem, or subject.
  example: Repetition is an important aspect of speech development in children.
  collocations:
  - aspect of
  - important aspect
  - key aspect
  - consider an aspect
  word_family: []
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: feature
  part_of_speech: noun
  definition: A typical quality or important part of something.
  example: Automatic backup is a feature of the new software.
  collocations:
  - feature of
  - key feature
  - distinctive feature
  - main feature
  word_family: []
  register: neutral
  source: McCarthy & O'Dell 2008, Unit 2, p. 12
  reliability: B
- word: scope
  part_of_speech: noun
