activities:
- name: False Friends Awareness
  description: Students compare L1-English false cognates and practice using the correct
    English form.
  level: B1-C2
  source: Swan & Smith (2001) Learner English
  type: vocabulary
cefr_range: A2-C2
citations:
- claim: L1 vocabulary interference occurs when learners transfer word meanings, false
    friends, and collocation patterns from their native language to English
  flagged: false
  reliability: B
  source: 'Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Introduction: Cross-linguistic Influence'
  tier: 1
- claim: False friends (cognates with different meanings) are a major source of vocabulary
    errors — e.g., Spanish 'embarazada' (pregnant) vs. English 'embarrassed'
  flagged: false
  reliability: B
  source: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
    Spanish chapter
  tier: 1
- claim: L1 vocabulary interference includes false friends and collocation transfer.
    Folse's Great Writing series addresses these patterns through contrastive vocabulary
    exercises that highlight L1-L2 differences in word meaning and usage.
  source: Folse, K. S. (2020). Great Writing Foundations, 5th ed. National Geographic
    Learning/Cengage.
  tier: 2
  reliability: B
  flagged: false
- claim: Cross-cultural prototype structures for concrete noun categories differ between
    English and Vietnamese. Nguyen Nhung (2024) found that Vietnamese speakers rank
    sparrow > pigeon for BIRD and motorbike > car for VEHICLE, while English speakers
    rank robin first for BIRD and car first for VEHICLE. These culturally-specific
    prototype structures affect vocabulary acquisition depth and lexical activation.
  flagged: false
  reliability: B
  source: Nguyen, T. N. (2024). A Contrastive Analysis of English and Vietnamese Prototype
    Structures. VNU Journal of Foreign Studies, 40(3), 105-119.
  tier: 2
- claim: Biber's register analysis shows that L1 vocabulary transfer patterns differ
    by modality — speakers transfer different vocabulary features in speech versus
    writing because register-specific frequency distributions differ.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.3.4: The relative
    importance of register and dialect differences'
  tier: 2
  reliability: B
  flagged: false
collocations: []
common_difficulties:
- difficulty: False cognates transfer
  cause: L1 words that look similar but mean something different in English
  solution: Explicit false friends lists for each L1, contrastive exercises
definition: ''
description: Vocabulary transfer can be positive (cognates with same meaning) or negative
  (false friends, different collocational patterns, differing semantic boundaries).
  Each L1 has specific vocabulary transfer patterns.
key_principles:
- principle: Explicitly teach false friends and cognate awareness for each L1 group
  reliability: B
  source: Swan & Smith (2001) Learner English
- principle: Compare L1 and English word formation patterns to predict transfer errors
  reliability: B
  source: Swan & Smith (2001) Learner English
- principle: 'McCarthy & O''Dell (2008) Academic Vocabulary in Use: L1 transfer affects
    vocabulary through false cognates, collocation patterns that differ from L1, and
    word family knowledge gaps. Academic vocabulary acquisition requires explicit
    attention to register (formal/informal pairs) and cultural conceptual differences.'
l1_interference: []
skill_area: vocabulary_l1_interference
skill_name: L1 Vocabulary Interference
sources:
  primary: Swan & Smith (2001) Learner English, 2nd ed. Cambridge University Press.
  secondary:
  - Folse, K. S. (2020). Great Writing Foundations, 5th ed. National Geographic Learning/Cengage.
    Word Formation and L1 Vocabulary Transfer
sub_skills:
- False friend recognition
- Collocation awareness
- Semantic mapping
- Cognate strategy use
teaching_approach: Create L1-specific false friends lists. Teach cognate awareness
  strategies. Use contrastive exercises highlighting L1-L2 differences.
