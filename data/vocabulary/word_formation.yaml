activities:
- name: Prefix and Suffix Builder
  description: Students learn common prefixes (un-, re-, pre-, dis-) and suffixes
    (-tion, -ness, -able) and practice forming new words.
  level: B1-C1
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
  type: vocabulary
cefr_range: B1-C2
citations:
- claim: 'English word formation includes: affixation (prefixes and suffixes), compounding
    (two words combine), conversion (word changes class without changing form), and
    clipping/blending'
  flagged: false
  reliability: B
  source: 'McCarthy & O''Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Units 1-3: Word Formation'
  tier: 2
- claim: Understanding word families (e.g., produce, production, productive, productivity)
    helps learners expand vocabulary exponentially by recognizing morphological patterns
  flagged: false
  reliability: B
  source: 'McCarthy & O''Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Unit 1: Word Families'
  tier: 2
- claim: Word formation patterns (prefixes, suffixes, compounding) are taught most
    effectively in writing context. Folse's approach teaches affixation and word families
    through paragraph writing tasks where learners must use different word forms accurately.
  source: 'Folse, K. S. (2020). Great Writing 3: From Great Paragraphs to Great Essays,
    5th ed. National Geographic Learning/Cengage. Unit 3: Grammar: Word Forms'
  tier: 2
  reliability: B
  flagged: false
- claim: Biber's cross-register analysis shows that word formation patterns (affixation,
    compounding) distribute differently across registers, with academic prose showing
    higher rates of derivational morphology than conversation.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 7.6: Semantic domains
    of word formation across registers'
  tier: 2
  reliability: B
  flagged: false
collocations: []
common_difficulties:
- difficulty: Wrong affix choice
  cause: Applying L1 derivation patterns to English
  solution: Systematic teaching of English affix patterns with L1 contrastive analysis
definition: ''
description: English word formation draws on Germanic and Latinate roots. McCarthy
  and O'Dell (2008) document the most frequent prefixes (un-, re-, in-, dis- account
  for 58% of all prefixed words) and suffixes (-tion, -ness, -able, -ment, -ly).
key_principles:
- principle: Teach common prefixes and suffixes systematically to help learners decode
    new vocabulary
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
- principle: 'Show how word families connect: a noun, verb, adjective, and adverb
    from the same root'
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
l1_interference: []
skill_area: []
skill_name: Word Formation
sources:
  primary: 'McCarthy & O''Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Units 1-3: Word formation'
  secondary:
  - 'Folse, K. S. (2020). Great Writing 3: From Great Paragraphs to Great Essays,
    5th ed. National Geographic Learning/Cengage. Unit 3: Word Forms and Suffixes'
sub_skills:
- Prefix knowledge
- Suffix knowledge
- Root awareness
- Compounding
- Conversion (word class change)
teaching_approach: Teach common affixes in groups by meaning. Show how affixes change
  word class. Practice forming words from roots.
word_formation:
- affix: un-
  meaning: not
  frequency: very high
  examples:
  - unable
  - unnecessary
  - unlikely
  source: McCarthy and O'Dell (2008) Reference 5
- affix: re-
  meaning: again
  frequency: very high
  examples:
  - renew
  - rebuild
  - reconsider
  source: McCarthy and O'Dell (2008) Reference 5
- affix: -tion/-sion
  meaning: noun (action/state)
  frequency: very high
  examples:
  - information
  - decision
  - creation
  source: McCarthy and O'Dell (2008) Reference 5
- affix: -ly
  meaning: adverb
  frequency: very high
  examples:
  - quickly
  - carefully
  - highly
  source: McCarthy and O'Dell (2008) Reference 5
word_lists: []
teaching:
  methodology: Explicit instruction
  tips:
  - 'McCarthy & O''Dell (2008) Academic Vocabulary in Use: Word families help decode
    vocabulary (theory/theoretical/theorize). Prefixes (re-, pre-, mis-), suffixes
    (-tion, -ment, -ity, -ize, -able), and compounds are productive patterns in academic
    English.'
