activities:
- name: Vocabulary Notebook System
  description: Teach students a systematic method for recording new words with definition,
    example sentence, collocations, and personal connection.
  level: A2-C1
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
  type: vocabulary
cefr_range: A1-C2
citations:
- claim: 'Effective vocabulary learning strategies include: using vocabulary notebooks
    with context sentences, word cards with L1 translations, semantic mapping, and
    regular review schedules'
  flagged: false
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Introduction, pp. 6-9
  tier: 2
- claim: Words learned in context through reading and listening are retained longer
    than words learned from isolated lists
  flagged: false
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use. Cambridge University
    Press. Teaching Approach
  tier: 2
- claim: Vocabulary learning strategies in the Folse approach emphasize learning words
    through writing practice, contextualized repetition, and building word families
    within authentic writing tasks rather than isolated memorization.
  source: 'Folse, K. S. (2020). Great Writing 1: Great Sentences for Great Paragraphs,
    5th ed. National Geographic Learning/Cengage.'
  tier: 2
  reliability: B
  flagged: false
- claim: Biber's corpus-based research demonstrates that register awareness is essential
    for vocabulary learning — learners need to recognize that word frequency and usage
    patterns differ between spoken and written English.
  source: 'Biber, D., Johansson, S., Leech, G., Conrad, S., & Finegan, E. (1999).
    Grammar of Spoken and Written English. John Benjamins. Ch. 1.2.1: Register distribution'
  tier: 2
  reliability: B
  flagged: false
collocations: []
common_difficulties:
- difficulty: Surface-level learning
  cause: Memorizing word lists without depth of knowledge
  solution: 'Teach deep processing: multiple encounters, varied contexts, active use'
definition: ''
description: 'Research shows that vocabulary is best learned through: (1) multiple
  encounters in varied contexts, (2) active retrieval practice, (3) semantic mapping
  and association, (4) spaced repetition, and (5) use in meaningful communication.'
key_principles:
- principle: Use a vocabulary notebook to record new words with definitions, example
    sentences, and collocations
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
- principle: Review previously learned words at increasing intervals (spaced repetition)
  reliability: B
  source: McCarthy & O'Dell (2008) Academic Vocabulary in Use
- principle: 'McCarthy & O''Dell (2008) Academic Vocabulary in Use: Effective vocabulary
    learning strategies include using word families (learning all forms of a word),
    recording collocations (not just individual words), using the Academic Word List,
    and regular recycling. Vocabulary notebooks should include example sentences and
    register information.'
