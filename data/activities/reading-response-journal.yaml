teaching_tips:
- context: Students may struggle with the "connection" section, writing only surface-level
    responses.
  tip: Model a personal connection yourself first. Show how a text connects to your
    own life, culture, or experience. Depth matters more than length.
- context: Lower-level students may not know how to formulate questions about a text.
  tip: Provide question stems such as "Why did the author..." and "What would happen
    if..." to help generate genuine questions.
- tip: In TBL, reading tasks should involve personal engagement with text content.
    Response journals encourage learners to process texts for meaning. (Willis 1996,
    Ch. 5.1)
  context: TBL methodology
