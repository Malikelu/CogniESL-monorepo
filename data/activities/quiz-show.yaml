teaching_tips:
- context: Question difficulty
  tip: Write 100-point questions that test recognition (easy) and 500-point questions that require production or explanation (hard). This ensures all levels participate.
- context: Steal mechanic
  tip: After a wrong answer, give other teams 15 seconds to discuss before stealing. This keeps all teams engaged even when it is not their turn.
