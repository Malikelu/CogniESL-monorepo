- adaptation: Spanish "todos" (all) and "la mayoría de" (most) function similarly
    to English. Note that "todos" requires "los/las" with specific referents, similar
    to English "all the".
  language: Spanish
  priority: low
- adaptation: Arabic uses "كل" (all) and "معظم" (most) with different grammatical
    patterns including idafa constructions. Contrast with English determiner + noun
    order.
  language: Arabic
  priority: low
- adaptation: Mandarin "所有" (all) and "大多数" (most) function as pre-nominal determiners.
    Mandarin does not require articles, making the English "all the" vs "most" distinction
    novel for these learners.
  language: Mandarin
  priority: low
