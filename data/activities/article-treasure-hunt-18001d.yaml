name: Article Treasure Hunt
prepTime: low
requiresTech: false
script:
- '"Read this article. Every time you see a, an, or the -- highlight it. Then explain
  WHY that article is used."'
- '"For example: ''I saw a dog'' -- ''a'' because it''s the first mention. ''The dog
  was big'' -- ''the'' because we already know which dog."'
- '"After labeling, compare with your partner. Where do you disagree? Let''s discuss."'
