teaching_tips:
- Use authentic texts (news, blogs) rather than textbook examples so students encounter
  real article usage patterns.
- The inductive approach works well for article rules which are complex and context-dependent.
  Avoid pre-teaching rules.
- Prepare for exceptions (the Amazon vs. Mississippi River). Build in time for discussion
  of gray areas.
- 'Use the "Expanding headlines" procedure: give students English-language newspaper
  headlines and ask them to insert a/an/the where appropriate. Headlines omit articles
  systematically, so students must reconstruct them based on the underlying noun phrase
  structure. Discuss cases where the, a/an, or zero article are all possible and what
  difference each makes to meaning. (Ur, Penny 1988 section 3.1)'
