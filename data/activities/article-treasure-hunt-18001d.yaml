    Spanish uses definite articles with abstract nouns where English uses zero article.
    Common L1 error: overusing "the" with generic nouns.'
  language: Spanish
  priority: high
- adaptation: 'Arabic has a definite article "al-" but no indefinite article equivalent
    to "a/an". Common L1 error: omitting indefinite articles ("I want book"). Explicit
    article insertion practice needed.'
  language: Arabic
  priority: high
- adaptation: 'Mandarin has no articles. L1 transfer errors are almost exclusively
