teaching_tips:
- context: Setup
  tip: 'Fold A4 paper into eighths (fold in half three times, then refold into a concertina/zigzag).
    Each player writes on one panel, folds it over to hide their contribution, then passes
    to the next player. The last player reads the complete story aloud.'
- context: Story structure
  tip: 'Use the classic formula: (1) time, (2) place, (3) man met woman, (4) he said,
    (5) she said, (6) the consequence was, (7) and then. This produces unpredictable,
    often humorous narratives.'
