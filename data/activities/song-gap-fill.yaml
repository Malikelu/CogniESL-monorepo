description: Song Gap Fill -- a listening activity. Choose a song with clear lyrics
  related to your lesson. Create a lyric sheet with 15-20 words blanked out. Give
  students the gapped sheet. Let them read and predict what words might fit. Play
  the song multiple times for students to fill in and confirm the missing words.
differentiation:
  extension: Remove more words including function words. Use faster songs.
  support: Remove fewer words. Provide a word bank. Use slower songs.
