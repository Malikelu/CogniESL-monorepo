teaching_tips:
- context: Scaffolding difficulty
  tip: Start with the most obvious error types (S for spelling, P for punctuation)
    before moving to grammar errors. This builds confidence and ensures all students
    can participate.
- context: Error analysis
  tip: After pairs compare corrections, ask them to explain WHY each error is wrong
    — not just what the correct form is. This develops metalinguistic awareness.
- context: Diagnostic use
  tip: The categorization step ("How many of each type?") is valuable data. Track
    which error types are hardest for your class and prioritize those in future lessons.
- context: Error classification
  tip: Use James's four-way classification (slips, mistakes, errors, solecisms) to prioritize correction. Slips and mistakes are self-correctable with prompting; errors require targeted instruction. Not all deviance needs the same response.
- context: Diagnostic response strategy
  tip: >-
    Distinguish errors from mistakes when giving feedback. Errors are competence gaps
    that cannot be fixed by correction alone. Mistakes are performance lapses that
    students CAN correct if the deviance is pointed out. Ask students to self-correct first:
    if they can it was a mistake; if they cannot it is an error requiring explicit
    instruction (James, C. 1998, Ch. 3, pp. 77-84).
- context: Scaffolding correction with graduated prompts
  tip: >-
    Use James distinction between first-order and second-order mistakes to scaffold help.
    For first-order mistakes, simply signal that something is wrong and let students
    self-correct. For second-order mistakes, point to the exact location and hint at the
    nature of the deviance. This graduated approach keeps students in productive
    struggle rather than giving away answers (James, C. 1998, Ch. 3, pp. 82-83).




