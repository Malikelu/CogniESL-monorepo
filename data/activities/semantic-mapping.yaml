description: Students build vocabulary networks by placing a central word in the middle
  of a map and brainstorming related words organized into semantic categories (rooms,
  furniture, actions, adjectives, collocations). Develops word association skills,
  deepens lexical knowledge, and provides a visual reference that grows throughout
  the unit.
differentiation:
  extension: Challenge students to include idioms. Have them write a short text using
    words from their map.
  support: Provide a starter map with some branches filled in. Use more concrete words.
