teaching_tips:
- 'Wright''s (2006) word-association game: each learner says a word they associate
  with the word given by the preceding learner (e.g., water, tap, kitchen, grandma,
  wolf). Interrupt to ask "Why?" — this probes the semantic connection and generates
  spontaneous explanation practice.'
- 'Encourage learners to use the formula "When I hear X, I think of Y" to make their
  associations explicit. This helps less confident learners participate and gives
  the teacher a window into their semantic networks.'
- Start with concrete, high-frequency words (house, water, happy) and gradually move
  to abstract words (freedom, time, success). Abstract words generate richer and
  more varied associations.
- 'Wright''s "Personal lists" variation: give learners 10 random words and ask them
  to create their own association chain, explaining the connection between each pair.
  This turns a group activity into individual creative work.'
- Word association reveals gaps in vocabulary networks. If a learner cannot think of
  any word associated with "house," it signals a need for vocabulary building around
  that semantic domain. Use these gaps to guide future lessons.
- 'Keep the game fast-paced. The challenge is to make quick associative leaps. If a
  learner hesitates too long, another learner can jump in with "Why did you say that
  word?" to keep the conversation moving.'
