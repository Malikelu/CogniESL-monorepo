id: photo-prompts
instructions:
- Show an interesting photo on the screen.
- 'Round 1: Students describe what they see.'
- 'Round 2: Students speculate. Who is this person? What happened before? What will
  happen next?'
- 'Round 3: Students create a story.'
- Show 2-3 different photos. Vary the task each time.
- 'Discuss: What vocabulary was most useful?'
keywords:
- photo
- description
- speculation
- storytelling
- visual
l1_enhanced:
- language: Spanish
  adaptation: Spanish speakers may overuse 'estar' for temporary states when describing
    photos. Contrast 'She looks happy' (ser/estar choice) with 'She is in a happy
    place'. Provide visual state-change examples.
  priority: medium
- language: Arabic
  adaptation: Arabic speakers may struggle with English article usage in photo descriptions
    ('a woman' vs 'the woman'). Use photo context to practice first mention (a) vs.
    subsequent mention (the).
  priority: medium
- language: Mandarin
  adaptation: 'Mandarin speakers may produce topic-comment structures (''This photo,
    I see a man''). Drill SVO order: ''I see a man in this photo.'''
  priority: medium
l1_specific: []
materials:
- Interesting photos (projected)
name: Photo Prompts
prepTime: low
requiresTech: true
script:
- '"At this photo. What can you see? Describe it in as much detail as possible."'
- Now speculate. Who is this person? What happened before this photo?
setupInstructions: Find 3-5 interesting, thought-provoking photos. They should be
  rich in detail.
skill_areas:
- speaking
- grammar
sources:
- name: Wright, A. (2005). Pictures for Language Learning. Cambridge University Press.
  relevance: Photo-based language teaching methodology
- name: Harmer, J. (2015). The Practice of English Language Teaching, 5th ed. Pearson.
  relevance: Warm-up activity design and multi-round task structuring
targetStructures:
- verb-tenses
- adjectives
- speaking-fluency
teaching_tips:
- context: Warm-up / Speaking
  tip: Choose photos with cultural diversity to spark richer discussion. Photos with
    ambiguous narratives encourage speculation and higher-order thinking.
- context: Differentiation
  tip: 'For A1-A2: provide sentence frames (''I can see...'', ''This person looks...'').
    For B2-C1: push for complex structures (''The way she is positioned suggests...'').'
- context: Grammar integration
  tip: Use Round 1 to elicit adjective_order naturally ('a tall young woman with long
    dark hair'). Use Round 2-3 to practice verb_tenses ('She might have been waiting',
    'She will probably leave soon').
