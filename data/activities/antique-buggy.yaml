teaching_tips:
- tip: "Klippel's communicative fluency approach emphasizes that activities should create genuine information gaps where students truly need to communicate to complete a task. Describing unusual objects or situations creates authentic communicative need (Klippel 1984, Ch. 2.4: Jigsaw tasks)."
  context: Genuine information gaps
- tip: "Klippel notes that the best communicative activities combine language practice with fun and excitement, and that students should not know exactly what will happen next (Klippel 1984, p. 31)."
  context: Fun and excitement
- Physical objects work better than photos for this activity. Handling real objects
  engages multiple senses and makes comparisons concrete.
- Pre-teach 8-10 comparative adjectives before the activity. Write them on the board
  with the old/new object pairs as visual anchors.
- Extend by having students predict future versions using "will" for speculation.
  This naturally practices future tense and speculative language.
