- historical language
- technology vocabulary
- superlatives
l1_enhanced:
- adaptation: Spanish comparatives use a similar structure (mas...que = more...than),
    so positive transfer is strong. Watch for "more big" instead of "bigger" (comparative
    formation) and overuse of "used to" for past states that require past simple.
  language: Spanish
  priority: high
- adaptation: Arabic comparatives use a different morphological pattern (af'al form).
    No direct equivalent of "used to" for past habits. Past habitual expressed with
    past tense plus temporal markers. Timeline visuals help.
  language: Arabic
  priority: high
- adaptation: Mandarin has no comparative morphology (uses bi3 construction). No past
    habitual marker equivalent to "used to". Provide explicit practice with "used to"
    for past habits vs. past simple for completed actions.
  language: Mandarin
  priority: high
