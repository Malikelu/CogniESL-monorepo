teaching_tips:
- Choose sentences that target specific phonological contrasts (e.g., /l/ vs /r/, /θ/
    vs /s/) to diagnose common listening difficulties for specific L1 groups.
- After revealing the original sentence, have students analyze WHERE the message broke
    down — this metacognitive step helps them identify their own listening weak spots.
- Keep sentences between 8-12 words. Shorter sentences are too easy; longer ones become
    noise. The goal is a message long enough to challenge but short enough to trace errors.
