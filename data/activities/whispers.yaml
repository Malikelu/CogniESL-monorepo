l1_enhanced:
- adaptation: Japanese and Korean speakers often confuse /l/ and /r/ in listening. Prepare sentences with l/r contrasts (e.g., "The light is on the right"). Use whisper chain errors to diagnose specific phoneme pairs.
  language: Japanese
  priority: high
- adaptation: Arabic speakers may struggle with consonant clusters in English (e.g., "strengths"). Use these as diagnostic sentences in the whisper chain to identify cluster simplification patterns.
  language: Arabic
  priority: high
- adaptation: Spanish speakers may insert epenthetic vowels before initial /s/ clusters (e.g., "eschool" for "school"). Listen for this pattern in the whispered output and address in feedback.
  language: Spanish
  priority: medium
