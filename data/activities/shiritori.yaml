l1_enhanced:
- adaptation: Spanish speakers may find this game easier due to the high frequency
    of Spanish words ending in vowels, which gives many options for starting letters.
    Challenge them with consonant-ending categories.
  language: Spanish
  priority: low
- adaptation: Arabic is written right-to-left and words are often consonant-skeleton
    based. The last-letter rule may feel unnatural — practice identifying the final
    letter of English words explicitly before starting.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may categorize words differently based on character
    frequency rather than alphabetical order. Pre-teach the concept of "last letter"
    in English spelling before playing.
  language: Mandarin
  priority: medium
