teaching_tips:
- tip: 'Prepare a "debate phrase bank" on the board before starting: argument frames
    ("The main reason is..."), agreement ("I agree with X that..."), disagreement
    ("I see it differently because..."), and conclusion ("In my opinion...").'
  context: Language support
- tip: Keep rounds short (3 minutes per side) to maintain energy. Use a visible timer
    so students learn to organize their arguments within time constraints.
  context: Time management
- tip: After round 1, give 2 minutes for students to note what went well and what
    language they need for the next round. This builds strategic competence between
    rounds.
  context: Between-round reflection
- tip: In TBL, tasks with clear goals and outcomes motivate learners. The planning
    stage before each round helps students prepare and improve. (Willis 1996, Ch.
    4.3)
  context: TBL methodology
