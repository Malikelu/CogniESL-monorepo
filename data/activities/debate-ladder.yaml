l1_enhanced:
- adaptation: Spanish speakers may benefit from explicit teaching of English debate
    connectors (however, nevertheless, on the other hand) which do not have direct
    1:1 equivalents in Spanish discourse markers.
  language: Spanish
  priority: medium
- adaptation: 'Arabic speakers may prefer elaborate oral argumentation styles. Teach
    concise English argument frames: "My first point is... My second point is... In
    conclusion..." to help structure contributions.'
  language: Arabic
  priority: medium
- adaptation: 'L1 pragmatic transfer from Mandarin may lead to avoiding direct confrontation.
    Practice competitive debate language explicitly: "I challenge that point because..."
    and "My opponent claims... but the evidence shows..."'
  language: Mandarin
  priority: medium
