citations:
- claim: Conditional chain activities develop mastery of mixed conditionals (past
    condition + present result) through meaningful practice in a communicative, low-pressure
    format.
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
  tier: 2
  reliability: B
  flagged: false
- claim: In a chain activity, one student suggests a conditional result ("If I had
    a million dollars, I would buy a yacht"), the next student takes that result and
    re-forms it into a condition with a further result ("If I had a yacht, there might
    be a storm and it would sink"), continuing the chain around the room. Students
    can also do this in writing, passing papers around for a "chains of events" display.
  source: Ur (1988) Grammar Practice Activities, Cambridge University Press, Section
    6.3 Chains of events
  tier: 2
  reliability: B
  flagged: false
