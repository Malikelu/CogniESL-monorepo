teaching_tips: 'The chain format works with all conditional types -- first (If I have...
  I will...), second (If I had... I would...), third (If I had done... I would have...),
  and mixed. Each student takes the result of the previous conditional and uses it
  as the condition for a new one. Students can also write chains: each student gets
  a sheet, copies the condition, fills in a result, and passes it on.'
