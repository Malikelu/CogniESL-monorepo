l1_enhanced:
- adaptation: Spanish speakers have a more consistent vowel system and may not notice English vowel reductions in connected speech. Focus listening on unstressed syllables.
  language: Spanish
  priority: high
- adaptation: Arabic has fewer vowel phonemes and syllable-timed rhythm. English stress-timed rhythm may be unfamiliar. Provide explicit rhythm practice before recording.
  language: Arabic
  priority: high
- adaptation: Mandarin uses lexical tones, so speakers may try to apply tone patterns to English intonation. Explain the difference between word-level tone and sentence-level intonation.
  language: Mandarin
  priority: high
