teaching_tips:
- context: Presentation structure
  tip: Before the activity, model a 2-minute example presentation. Show students how
    to organize an introduction, main points, and conclusion in simple language.
- context: Audience feedback
  tip: Give the audience a simple feedback form (clarity, content, delivery) so feedback
    is constructive rather than vague.
- tip: Project presentations are part of the TBL report stage. Public performance
    motivates students to improve accuracy. (Willis 1996, Ch. 4.4)
  context: TBL methodology
