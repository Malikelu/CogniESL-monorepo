l1_enhanced:
- adaptation: Spanish-speaking students may benefit from L1 brainstorming before presenting.
    Allow 2 minutes of L1 discussion before switching to English for the presentation.
  language: Spanish
  priority: medium
- adaptation: Arabic-speaking students may be unfamiliar with Western-style audience
    Q&A. Model question-answer interactions explicitly before the activity.
  language: Arabic
