teaching_tips:
- tip: Pre-teach 3-5 key vocabulary words from the audio that students will need to
    recognize. This reduces cognitive load during listening and improves comprehension.
  source: Peregoy & Boyle (2023)
- tip: After the first listen, have students compare answers in pairs before the second
    play. This builds anticipation and focuses attention on missed details.
  source: Underhill (1994)
