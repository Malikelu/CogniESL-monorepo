requiresTech: true
script:
- '"Before we listen, read through your questions. What information are you listening
  for? Names? Numbers? Places?"'
- '"Ready? Listen carefully and answer as many questions as you can."'
- '"Let''s listen again. Check your answers and fill in any you missed."'
- '"Now let''s review. What strategies helped you catch the details? Was it easier
  the second time?"'
