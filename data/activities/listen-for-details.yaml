l1_enhanced:
- adaptation: 'Spanish speakers may have difficulty distinguishing English vowel
    length (e.g., ship vs. sheep, cut vs. cat). Provide minimal pair practice before
    the listening task to sharpen phonemic awareness.'
  language: Spanish
  priority: medium
- adaptation: 'Arabic speakers may struggle with English consonant clusters (e.g.,
    "str-" in "street," "spl-" in "splash"). Pre-teach key vocabulary with cluster
    practice to improve word recognition during listening.'
  language: Arabic
  priority: medium
- adaptation: 'Mandarin speakers rely on tone for word identification. English uses
    stress and intonation instead. Practice word-level stress patterns for key vocabulary
    before listening.'
  language: Mandarin
  priority: medium
