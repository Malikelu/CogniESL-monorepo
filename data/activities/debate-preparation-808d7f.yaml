teaching_tips:
- tip: 'Provide an argument template for each team: Claim (We believe that...), Evidence
    (For example... / Research shows that...), Reasoning (This matters because...).
    Give teams 15 minutes to complete one template per argument.'
  context: Argument structure scaffolding
- tip: 'For the counterargument task, teach the "They say... But... Therefore..."
    frame: "The other team will say... But we think... Therefore our position is stronger
    because..."'
  context: Counterargument preparation
- tip: Have teams do a 2-minute "practice debate" with another team before the real
    debate. This reveals weak arguments and missing language while there is still
    time to improve.
  context: Rehearsal technique
- tip: The planning stage in TBL is where students prepare arguments, consult resources,
    and rehearse. Essential for building accuracy. (Willis 1996, Ch. 4.3)
  context: TBL methodology
