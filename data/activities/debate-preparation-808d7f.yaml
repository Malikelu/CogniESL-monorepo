l1_enhanced:
- adaptation: Spanish speakers may structure arguments differently in L1 (more narrative,
    less linear). Teach the English claim-evidence-reasoning structure explicitly
    with a visual organizer.
  language: Spanish
  priority: medium
- adaptation: Arabic speakers may use rhetorical repetition for emphasis in L1. While
    this is effective in Arabic, English academic writing tends toward concision.
    Help students adapt their argument style for English debates.
  language: Arabic
  priority: medium
- adaptation: 'Building from dance-freeze l1_enhanced: Mandarin speakers may omit
