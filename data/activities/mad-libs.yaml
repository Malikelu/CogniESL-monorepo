teaching_tips:
- tip: 'Before starting, do a quick warm-up where students brainstorm 3 words for each part of speech. This activates vocabulary and ensures faster-paced rounds.'
  source: Peregoy & Boyle (2023)
- tip: 'After reading the completed story, use the humor as a teaching moment: ask students "Why doesn''t this make sense?" to reinforce that word categories must match their syntactic slot.'
  source: Peregoy & Boyle (2023)


