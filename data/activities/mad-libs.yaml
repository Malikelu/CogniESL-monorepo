l1_enhanced:
- adaptation: Spanish speakers typically understand adjective-noun order but may place
    adjectives before the noun in English (Spanish allows both positions). Highlight
    that English adjectives almost always precede the noun.
  language: Spanish
  priority: medium
- adaptation: 'Arabic has a different adjective-noun order (adjective follows noun)
    and adverbs are less morphologically distinct. Provide explicit word-order practice
    for English adjective-noun and adverb-verb patterns.'
  language: Arabic
  priority: medium
- adaptation: Mandarin uses word order and particles rather than inflection for tense
    and number. Since Mad Libs targets parts of speech (not inflection), highlight
    that English word order determines grammatical function.
  language: Mandarin
  priority: medium
l1_specific: []
materials:
- Mad Libs story templates (printed or projected)
- Word category cards (optional)
name: Mad Libs
prepTime: low
requiresTech: false
script:
- '"I need a noun -- any noun! Table? Okay, I will use table. Now I need an adjective.
  Happy? Great! Now a verb in past tense. Ran? Perfect!"'
- '"Here is the story: The happy table ran quickly to the store and bought a large
  elephant. See why that is funny? A table cannot run!"'
- '"Let us do another one. Give me a plural noun... shoes! Give me an adverb... beautifully!"'
setupInstructions: Prepare 2-3 Mad Libs story templates with 8-12 blanks each. Each
  blank should be labeled with the required part of speech (noun, verb, adjective,
  adverb, plural noun, past tense verb, etc.). Print or project the template. Keep
  the story hidden from students until all blanks are filled.
