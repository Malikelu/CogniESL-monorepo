    The Modern Language Journal, 53(1), 3-17
targetStructures:
- speaking-fluency
teaching_tips:
- 'Tip: TPR is especially effective for kinesthetic learners and beginners. Do not force
    students to speak before they are ready -- comprehension precedes production.'
- 'Tip: Keep the energy positive and playful. Students who make mistakes should keep
    participating. The goal is movement and vocabulary uptake, not perfection.'
