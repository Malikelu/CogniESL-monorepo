l1_enhanced:
- adaptation: Some gestures may carry different meanings across cultures. Brief students
    that gestures should be respectful and classroom-appropriate. In some cultures, pointing
    with fingers is considered rude -- use open palms instead.
  language: Arabic
  priority: medium
- adaptation: TPR works well across all L1 backgrounds because it bypasses translation.
    For Mandarin speakers, the physical movement anchors vocabulary without requiring
    written characters.
  language: Mandarin
  priority: low
