description: A speaking activity that reduces anxiety through anonymous opinion sharing.
  Students write opinions on slips of paper without names. The teacher reads them
  aloud and the class discusses. Designed to encourage participation from shy students
  who might not speak up in open discussion.
differentiation:
  extension: Require 2-3 sentences with reasons. After reading, have students debate.
  support: Provide sentence starters. Use simpler questions.
