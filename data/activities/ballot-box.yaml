teaching_tips:
- tip: 'Klippel describes opinion polling activities where students anonymously submit opinions and the class discusses the results. She notes that anonymous formats reduce anxiety and encourage honest expression of views (Klippel 1984, Ch. 2.5: Questioning activities).'
  context: Klippel (1984)
- tip: 'Klippel emphasizes that activities where students express personal opinions create genuine communicative need because students truly want to know what their classmates think (Klippel 1984, p. 51).'
  context: Klippel (1984)
- Anonymity is the key feature. Emphasize that names must not be written. This
  reduces anxiety and encourages honest opinions including controversial ones.
- For sensitive topics, this format is especially useful. Students can express
  opinions they would not dare to state openly.
- Provide sentence frames for lower levels. For higher levels, require supporting
  reasons with discourse markers (because, however, on the other hand).
