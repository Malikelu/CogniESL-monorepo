l1_enhanced:
- adaptation: 'Spanish has formal/informal registers for expressing opinions (tu/usted).
    English lacks this distinction, which can cause over-formalization. Provide opinion
    expression frames at different registers.'
  language: Spanish
  priority: medium
- adaptation: Arabic diglossia (MSA vs dialect) affects opinion expression. Students
    may feel more confident expressing opinions in dialect. Anonymity helps bridge
    this gap.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may prefer indirect opinion expression. The anonymous
    ballot box format helps bypass cultural reluctance to state opinions directly.
    Provide sentence frames for hedging.
  language: Mandarin
  priority: medium
