teaching_tips: 'A second tag question activity: give pairs of students short written
  dialogues and ask them to insert tag questions where characters are expecting agreement
  or sympathy ("Nice day, isn''t it?" / "You like it here, don''t you?"). Pairs then
  perform both versions of the dialogue to highlight how tags change the tone to show
  expectation of agreement.'
