teaching_tips:
- tip: "Klippel's communicative approach emphasizes creating a supportive atmosphere where students feel free to express personal views without fear of correction. Activities that elicit personal responses work best when the focus is on communication rather than accuracy (Klippel 1984, p. 58)."
  context: Supportive atmosphere
- tip: "Klippel notes that warming-up activities revealing something about each student's personality help build group cohesion and make subsequent cooperative activities more effective (Klippel 1984, p. 12)."
  context: Group cohesion
