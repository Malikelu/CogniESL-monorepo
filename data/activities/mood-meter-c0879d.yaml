name: Mood Meter
prepTime: low
requiresTech: false
script:
- "Let's check in. On the board I have a mood meter from Very Happy to Very Sad. Where are you right now? Hold up 1-5 fingers."
- "You're a 4 -- Happy! Can you tell us why? Use 'I am happy because...' or 'I feel good because...'"
- "Great. And who's a different number? You're a 2 -- a bit low. What would help you feel better today?"
