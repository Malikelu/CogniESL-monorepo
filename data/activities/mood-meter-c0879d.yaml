description: 'Mood Meter -- a socio-emotional check-in activity. Draw a simple meter on the board with 5 levels: Very Happy, Happy, OK, Sad, Very Sad. Ask students to rate their current mood and explain their feeling in English using "I feel...because..." and "I am...because..." structures.'
