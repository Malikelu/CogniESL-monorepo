l1_enhanced:
- adaptation: Spanish speakers may use direct translation of cultural terms that do
    not carry over (e.g., "quinceanera," "dia de los muertos"). Encourage students
    to explain cultural concepts in their own words rather than translate directly.
  language: Spanish
  priority: high
- adaptation: Arabic speakers may be more reserved in interview settings, especially
    with opposite-gender partners. Allow students to choose their interview partner
    and provide question stems to reduce anxiety. Some cultural topics (religion,
    politics) may be sensitive — let students choose which questions to answer.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may struggle with English question formation in real-time
    conversation (subject-auxiliary inversion). Provide question stems on the handout
    so students can focus on content rather than form during the interview.
  language: Mandarin
  priority: high
- adaptation: 'Spanish speakers may confuse present perfect and past simple. Provide
    explicit contrast: "he comido" (present perfect) vs "comí" (past simple).'
  language: Spanish
  priority: high
- adaptation: Arabic has perfective/imperfective aspect rather than tense. Provide
    timeline visuals to illustrate English tense system.
  language: Arabic
  priority: high
- adaptation: Mandarin has no verb inflection for tense. Tense is indicated by time
    words (yesterday, now) and aspect markers (le, zhe). Provide explicit verb conjugation
    practice.
  language: Mandarin
  priority: high
