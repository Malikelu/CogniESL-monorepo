teaching_tips:
- tip: Before the interview, brainstorm culturally appropriate questions as a class.
    Remind students to ask follow-up questions ("Why?" "Can you tell me more?") to
    develop conversational depth.
  context: Pre-activity preparation
- tip: During the writing phase, remind students to use both direct quotes ("Maria
    said, 'In my country...'") and reported speech ("Maria explained that in her country...").
    This naturally practices multiple grammar structures.
  context: Writing phase grammar integration
- tip: The partner accuracy check is essential — it gives the interviewee ownership
    and motivates the interviewer to listen carefully. Make it clear that factual
    accuracy (not grammar) is being checked at this stage.
  context: Accountability and listening
- tip: Interview tasks involving comparing experiences are a core TBL type. They generate
    genuine communication. (Willis 1996, Ch. 2.2)
  context: TBL methodology
