teaching_tips:
- tip: Start with 2-3 familiar genres before introducing unfamiliar ones. News reports
    and fairy tales are good anchors because students already know the conventions.
    The key teaching moment is the class comparison discussion — this is where register
    awareness develops.
- tip: Exposure to multiple genres is important in TBL. Learners need a balanced range
    of text types and topics. (Willis 1996, Ch. 5.2)
  context: TBL methodology
