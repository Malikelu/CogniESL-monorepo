teaching_tips:
- Pre-teach the key adjectives (smooth, rough, hard, soft, heavy, light, round, flat)
    with real objects before starting the game. This ensures all students can participate
    even if their vocabulary is limited.
- For weaker classes, allow the describer to say "It's like a..." (simile) if they
    cannot find the exact adjective. This keeps the game flowing and reduces anxiety.
- Use gloves to make identifying objects by touch more challenging. This forces students
    to use more precise descriptive language (texture, temperature, ridges) rather than
    just shape.
- Don't show the objects beforehand. Let students discover them through touch — this
    makes the game more challenging and motivates richer description.
- The primary aim is to help all students participate. If the objects are too easy to
    identify by touch, choose similar items (pens and pencils, coins of different
    denominations, plastic bags vs. paper bags, screws vs. nails).
- On the use of language: pairs and groups provide ideal conditions for intensive
    practice but mistakes may occur. The greatest mistake is not to speak at all.
    Otherwise, interrupt only if communication breaks down, and only to rephrase
    rather than to correct.
