l1_enhanced:
- adaptation: Spanish speakers may describe objects using adjective-noun order (e.g.,
    "suave y redondo" before the noun). Remind students that in English, adjectives
    precede the noun. Provide sentence frames on the board.
  language: Spanish
  priority: medium
- adaptation: Arabic speakers may not have equivalent vocabulary for some texture words
    (e.g., "rough," "smooth"). Pre-teach key adjectives with visual/tactile examples
    before the activity.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may struggle with yes/no question formation (English
    requires subject-auxiliary inversion). Provide question starters on the board and
    model several examples before starting.
  language: Mandarin
  priority: medium
