description: Multimedia Presentation -- an integrated-skills activity. Groups choose
  a topic related to their unit. They research and gather information (10 minutes).
  Groups create a multimedia presentation (20 minutes) with title slide, content slides
  with images, conclusion, and sources. Each group presents (3-4 minutes) while the
  audience takes notes and prepares questions.
differentiation:
  extension: Require interactive elements (polls, quizzes). Have students include
    a video clip or audio recording.
  support: Provide a presentation template. Allow simpler topics. Require fewer slides.
