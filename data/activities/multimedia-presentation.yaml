l1_enhanced:
- adaptation: Spanish speakers may struggle with discourse markers in presentations
    (however, moreover, in conclusion). Provide a reference sheet of common presentation
    connectors.
  language: Spanish
  priority: high
- adaptation: Arabic speakers may transfer Arabic rhetorical patterns to English presentations.
    Teach linear structure through explicit framing.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may use indirect topic introduction rather than direct
    thesis statements. Practice opening presentations with a clear main point.
  language: Mandarin
  priority: medium
