teaching_tips:
- tip: 'Klippel describes ranking exercises where students must agree on an order of importance or preference, noting that these activities naturally elicit interactive language like agreeing, disagreeing, and giving reasons (Klippel 1984, Ch. 3.1: Ranking exercises).'
  context: Klippel (1984)
- tip: 'Klippel notes that ranking exercises work best when students first rank items individually, then must agree on a group ranking, creating genuine discussion and negotiation (Klippel 1984, p. 58).'
  context: Klippel (1984)
