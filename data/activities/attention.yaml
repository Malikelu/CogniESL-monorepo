l1_enhanced:
- adaptation: 'Spanish imperatives have formal/informal forms (tu/usted). Students
    may over-formalize in English. TPR helps bypass this by focusing on action, not
    form choice.'
  language: Spanish
  priority: high
- adaptation: 'Arabic imperatives are gender-marked. English imperatives are
    gender-neutral, which is a simplification for Arabic speakers. TPR works well
    because it bypasses explicit grammar.'
  language: Arabic
  priority: high
- adaptation: 'Mandarin has no imperative morphology. TPR is highly effective because
    it pairs physical action with language, bypassing L1 transfer issues.'
  language: Mandarin
  priority: high
