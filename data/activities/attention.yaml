teaching_tips:
- tip: Start with the slowest possible pace so all students can follow. Gradually increase speed only when the whole class is succeeding. This builds confidence and ensures no student is left behind.
- tip: After the activity, have students recall all the commands used. Write them on the board and drill pronunciation. This transitions from listening to speaking practice.
- tip: For large classes, divide into two groups facing each other so you can observe all students. Students who make errors sit out briefly, then rejoin -- this keeps the game moving while maintaining accountability.
- tip: Start with commands students already know (stand up, sit down) before introducing new vocabulary. Success rate should be high to maintain energy.
- tip: Deliberately make a mistake yourself and have students correct you. This builds confidence and adds humor.
- tip: For large classes, use the "last one out" rule carefully. Keep elimination rounds short (one turn only) so students rejoin quickly and stay engaged.
