teaching_tips:
- context: Error types
  tip: "Use James's distinction between overt and covert errors: overt errors (wrong verb forms like goed) are easy for listeners to catch; covert errors (wrong article, awkward collocation) may sound fine to less experienced learners. Gradually introduce more covert errors to develop higher-level monitoring skills."
- context: Categorizing deliberate errors
  tip: >-
    After the activity, ask students to categorize the errors they found using James
    four-way classification: slips (easy to spot and self-correct), mistakes (noticeable
    once pointed out), errors (reflect genuine gaps in knowledge), or solecisms (break
    prescriptive rules). This builds metalinguistic awareness and helps students understand
    that not all errors are equal -- some reflect learning in progress while others are
    simple oversights (James, C. 1998, Ch. 3, pp. 81-84).

