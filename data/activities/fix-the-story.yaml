- claim: "James distinguishes overt errors (superficially ill-formed, easy to detect) from covert errors (well-formed but not matching speaker intention, harder to catch). In Fix the Story, obvious grammatical errors like goed are overt errors; more subtle errors like wrong article usage or collocation may function as covert errors for learners."
