citations:
- claim: Simon Says is a Total Physical Response (TPR) game in which learners must
    only follow commands prefaced by "Simon says." Commands without the trigger phrase
    should be ignored. Players who obey a command without "Simon says" or fail to obey
    one with it track their mistakes and keep playing.
