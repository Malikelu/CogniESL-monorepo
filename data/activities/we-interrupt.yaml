teaching_tips:
- tip: "Klippel emphasizes that communicative activities should create genuine surprise and spontaneity. Activities where students must respond unpredictably to unexpected prompts create authentic communicative urgency (Klippel 1984, Ch. 2.3: Guessing games)."
  context: Surprise and spontaneity
- tip: "Klippel notes that the best fluency activities combine language practice with fun and excitement, and that students should be actively participating most of the time (Klippel 1984, p. 32)."
  context: Active participation
