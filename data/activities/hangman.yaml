teaching_tips:
- context: Sensitivity
  tip: 'If the hangman image is inappropriate for your context, alternatives include writing
    "I AM THE WINNER" or "NEXT TIME LUCKY" letter by letter as mistakes are made, or simply
    playing with 12 dashes as the countdown.'
- context: Pair variation
  tip: 'Hangman works well in pairs, giving more learners active practice time.'
