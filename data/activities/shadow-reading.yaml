- intonation
- stress
l1_enhanced:
- adaptation: Spanish speakers may struggle with English vowel reduction in connected
    speech. Shadowing helps develop awareness of how unstressed syllables are shortened
    and centralized in natural English speech.
  language: Spanish
  priority: high
- adaptation: Arabic speakers read right-to-left and may struggle with English left-to-right
    eye movement during reading-aloud. Use a pointer or finger to guide tracking.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may apply tonal patterns to English phrases. Use
    shadowing to develop awareness of English intonation contours (rising for questions,
    falling for statements).
  language: Mandarin
  priority: high
