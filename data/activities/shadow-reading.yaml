description: 'Shadow Reading -- a pronunciation activity. Select a short audio recording
  at your students'' level. Prepare transcripts. First listen: Students listen and
  follow along. They mark stressed words. Second listen: Students read aloud at the
  same time as the speaker. This is shadowing. Third listen: Students shadow again,
  focusing on intonation. Students practice shadowing in pairs.'
differentiation:
  extension: Use faster speech. Challenge students to shadow without the transcript.
  support: Use slower recordings. Focus on one aspect at a time.
