materials:
- Simple safe items for experiments (e.g., water, food coloring, small objects to drop)
name: Zero Conditional Experiments
prepTime: medium
requiresTech: false
script:
- '"Simple cause-effect (heat water = boil)."'
- '"Zero conditional sentences."'
- '"Findings to class."'
skill_areas:
