targetStructures:
- conditionals
teaching_tips:
- When reviewing the zero conditional, emphasize the "always true" / general truth meaning. Have students distinguish it from the first conditional (specific future possibility) with clear examples.
- For the experiment portion, pre-test all materials to ensure they work as expected. Have backup examples ready.
- Encourage students to test their zero conditional statements — if a statement is disproven by the experiment, it is not a good zero conditional.



sources:
  - Ur, Penny (1988) Grammar Practice Activities: A Practical Guide for Teachers. Cambridge University Press
