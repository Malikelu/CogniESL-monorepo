citations:
- claim: Timeline activities visually practice the relationship between past simple
    and past perfect sequencing, helping learners internalize tense-aspect distinctions
    through chronological ordering.
  flagged: false
  reliability: B
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed. Ch. 1
  tier: 2
- claim: 'Timeline-based narration activities help students practise the relationship
    between past simple and past perfect through chronological ordering. Students
    receive event cards (e.g., "The Titanic sank in 1912", "World War II ended in
    1945") and must arrange them in order, then narrate using both tenses: "The Titanic
    had already sunk before World War I started."'
  source: Ur (1988) Grammar Practice Activities, Cambridge University Press -- narrative
    tense sequencing activities
  tier: 2
  reliability: B
  flagged: false
description: Students receive cards with historical events or story events and must
  place them in chronological order while narrating the sequence using past simple
  and past perfect. Visualizes the relationship between the two past tenses.
differentiation:
  extension: Use 12-15 cards with less obvious ordering. Require students to write
    a full paragraph using both tenses. Have them create their own timeline events
    for another group to order.
  support: Use only 5-6 cards with very obvious chronological order. Provide the dates
    on the cards. Use simpler past simple sentences without requiring past perfect.
