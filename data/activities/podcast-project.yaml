description: 'Podcast Project -- an integrated-skills activity. Groups choose a topic
  related to their unit. They research and plan their podcast (15 minutes). Groups
  write a script: introduction, main content, interview or discussion, conclusion
  (15 minutes).'
differentiation:
  extension: Require interviews with real people. Add editing and music. Have groups
    create a series of episodes.
  support: Provide a script template. Allow shorter podcasts (2-3 minutes). Assign
    simpler topics.
