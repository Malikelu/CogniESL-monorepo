teaching_tips:
- context: Preparation
  tip: Test all puzzles before class. A puzzle that takes you 3 minutes may take students
    10. Adjust difficulty or time limits accordingly.
- context: During the activity
  tip: If a team is stuck for more than 3 minutes at a station, offer a hint. The
    goal is engagement, not frustration. Prepare 2-3 hints per station in advance.
- context: Post-activity review
  tip: The post-activity review is essential — go through any puzzle that stumped
    multiple teams. This is where the targeted grammar review happens.
