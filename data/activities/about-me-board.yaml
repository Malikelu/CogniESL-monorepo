exampleSnippet:
  execution:
  - The teacher displays 5-6 personal items (ticket stub, photo, souvenir) on a table
    or board. Students take turns asking questions about each item. The teacher answers
    naturally, modeling extended responses. Students then share one thing they learned
    about the teacher.
  teacherDialogue:
  - '"Welcome! I''ve put some things on the board that are important to me. Your job
    is to ask me questions to find out their stories. For example: ''What is that?''
    ''Where did you get it?'' ''How long have you had it?'' Ready? Start asking!"'
  - '"Great question, Maria! This is a ticket from a concert I went to in 2010. I
    saw my favorite band with my best friend. Now, who has another question?"'
  topic: question forms
