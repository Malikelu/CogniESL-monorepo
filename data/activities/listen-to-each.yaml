teaching_tips:
- tip: Before starting, model a good follow-up question vs. a surface-level one. Show
    how "Why did you...?" gets more detail than "Did you like it?"
  source: Peregoy & Boyle (2023) Ch. 5
- tip: Encourage Student B to jot down keywords while listening, not full sentences.
    This trains selective attention and prevents writing from competing with listening.
  source: Underhill (1994)
