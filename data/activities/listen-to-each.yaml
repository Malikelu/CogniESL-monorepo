l1_enhanced:
- adaptation: 'Spanish speakers may omit subject pronouns in English questions (e.g.,
  "Did go?" instead of "Did you go?"). Provide explicit practice with subject-verb
  structure in WH-questions.'
  language: Spanish
  priority: medium
- adaptation: 'Arabic speakers may struggle with English question intonation (rising
  for yes/no, falling for WH-questions). Model and drill question intonation patterns
  before the activity.'
  language: Arabic
  priority: medium
- adaptation: 'Mandarin questions are formed by adding "ma" or using A-not-A structure,
  not by inversion. Provide explicit practice with English auxiliary-fronting in
  questions.'
  language: Mandarin
  priority: medium
