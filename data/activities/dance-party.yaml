teaching_tips:
- tip: 'Before playing the song, pre-teach key body-part vocabulary with a quick
    "touch your..." drill. This ensures students can follow the actions even if they
    do not yet know all the words from the lyrics.'
  context: Vocabulary preparation
- tip: 'For the first round, demonstrate all actions yourself while students watch.
    Only ask students to join in on round 2. This reduces anxiety and gives them
    time to process the language.'
  context: Scaffolding participation
- tip: 'After the song, ask students to recall the actions in sequence: "First we
    touched our ... then our ..." This practices past tense and sequencing language
    in a natural context.'
  context: Post-activity language focus
