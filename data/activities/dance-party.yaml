l1_enhanced:
- adaptation: 'Spanish speakers may have difficulty with English word stress in
    body-part vocabulary (e.g., SHOULders vs Spanish homBROS). Use clapping on
    stressed syllables to reinforce stress patterns during the song.'
  language: Spanish
  priority: medium
- adaptation: 'Arabic speakers may struggle with the /p/ vs /b/ distinction in body
    words. Use minimal pair practice before the song if needed.'
  language: Arabic
  priority: medium
- adaptation: 'Mandarin speakers may omit final consonants in body-part words. The
    song rhythm helps reinforce final consonant production through connected speech.'
  language: Mandarin
  priority: medium
