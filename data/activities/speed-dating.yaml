teaching_tips:
- tip: "Klippel describes rotation activities where students work with multiple partners in sequence, noting that this format ensures everyone practices speaking with different interlocutors and prevents any one student from dominating (Klippel 1984, Ch. 2.4: Jigsaw tasks)."
  context: Rotation format
- tip: "Klippel emphasizes that communicative activities work best when students do not know exactly what their partner will say, creating genuine information gaps and authentic communication (Klippel 1984, p. 40)."
  context: Information gap
