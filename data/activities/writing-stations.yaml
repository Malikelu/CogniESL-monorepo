teaching_tips:
- Set clear expectations before starting: students should write continuously at each
    station, not plan-and-stop.
- Use a visible timer so students can track their own pace.
- Encourage students to pick one piece to develop for homework — the revision step
  is where the real learning happens.
- For C1/C2 levels, add a peer feedback station as a 5th rotation.
- tip: In TBL, writing tasks should have a clear audience and purpose. Students plan,
    draft, and revise - the planning stage is where much learning happens. (Willis
    1996, Ch. 4.5)
  context: TBL methodology
writing_genre: multi-genre
