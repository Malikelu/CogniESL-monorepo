l1_enhanced:
- adaptation: Null subject languages (Spanish, Mandarin) may omit subject pronouns
    in English discussion. Remind students that English requires explicit subjects.
  language: Spanish
  priority: high
- adaptation: Arabic is written right-to-left. Allow extra time for reading English
    problem scenarios. Provide left-to-right reading guides.
  language: Arabic
  priority: medium
- adaptation: Mandarin relative clauses precede the noun (prenominal). English relative
    clauses follow the noun (postnominal). Provide structural comparison when students
    write proposals.
  language: Mandarin
  priority: high
