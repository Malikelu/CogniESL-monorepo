name: Infinitive Gerund Battle
prepTime: low
requiresTech: false
script:
- '"Today we are going to battle! The question is: gerund or infinitive? Some verbs
  can take both, but the meaning changes. Let me show you: ''I stopped smoking'' means
  I quit. But ''I stopped to smoke'' means I paused what I was doing so I could have
  a cigarette. Same verb, different form, very different meaning!"'
- '"Here are 10 verbs that can take either form. Work with your partner. For each
  verb, create two sentences — one with a gerund, one with an infinitive — and explain
  the meaning difference."'
- '"Now let us hear from each pair. Class, vote: which pair best showed the meaning
  difference?"'
- '"Write a rule summary in your notebooks: which verbs take gerunds, which take infinitives,
  and which change meaning?"'
