l1_enhanced:
- adaptation: Spanish speakers may use the infinitive where English requires a gerund
    (e.g., "I enjoy to swim" instead of "I enjoy swimming"). Spanish uses the infinitive
    after many verbs that take gerunds in English. Provide explicit verb pattern lists.
  language: Spanish
  priority: high
- adaptation: Arabic has no direct equivalent of the English gerund. Verbal nouns
    (masdar) are used differently and don't have the same syntactic distribution.
    Students may avoid gerunds entirely or use finite clauses instead. Practice converting
    finite clauses to gerund structures.
  language: Arabic
  priority: high
- adaptation: Mandarin has no infinitive/gerund distinction — verb forms don't change.
    All verb complements use the same bare form. Students may struggle with the concept
    that English has two complement forms with different meanings. Use visual contrast
    charts showing gerund vs infinitive patterns.
  language: Mandarin
  priority: high
