teaching_tips:
- 'Use the "Opinion questionnaire" technique to practise verb+-ing patterns: have
  students circulate with questionnaires targeting verbs like enjoy, mind, dislike.
  After collecting responses, students report findings (e.g., "20% of our class enjoy
  smoking"). This combines grammar practice with genuine communication. (Ur, Penny
  1988 section 14.2)'
- 'Use the "Opinion questionnaire" technique to practise verb+-ing patterns: have
  students circulate with questionnaires targeting verbs like enjoy, mind, dislike.
  After collecting responses, students report findings (e.g., "20% of our class enjoy
  smoking"). This combines grammar practice with genuine communication. (Ur, Penny
  1988 section 14.2)'
- tip: Start with the most dramatic meaning-change pairs (stop, remember, forget)
    before moving to subtler ones (try, regret, go on). The contrast is more memorable
    when the meaning difference is large.
- tip: Create a classroom poster with three columns listing verbs that take gerund
    only, infinitive only, and both (meaning changes). Students add to it throughout
    the course.
- tip: Common error to watch for — Spanish speakers saying 'I enjoy to swim' (transfer
    from Spanish 'nadar' as infinitive after 'disfrutar'). Drill the pattern explicitly.
