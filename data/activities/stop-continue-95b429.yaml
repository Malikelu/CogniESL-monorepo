name: Stop/Continue
prepTime: none
requiresTech: false
script:
- 'Give each student a slip of paper with three boxes: STOP, CONTINUE, START.'
- '"Write one thing we should STOP doing as a class. One thing to CONTINUE. One thing
  to START. No names -- completely anonymous."'
- Collect all slips. Shuffle and read responses aloud.
- '"STOP: 3 people said we go too fast during grammar explanations. CONTINUE: 5 people
  liked the group warm-ups. START: 4 people want more speaking practice."'
- 'Discuss: "Which suggestions can we act on right now? Let''s make a class agreement."'
- Post the class agreement on the wall. Revisit in 2 weeks.
