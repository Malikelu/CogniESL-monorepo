teaching_tips:
- tip: "Klippel emphasizes that fluency activities should reduce the strain on individual students. Timed speaking activities work best when students have a clear topic and when the focus is on communicating ideas rather than perfect accuracy (Klippel 1984, Ch. 2: Questions and answers)."
  context: Fluency focus
- tip: "Klippel notes that pair work is the least threatening format for speaking because everybody is talking at the same time and each student has only one listener (Klippel 1984, p. 12)."
  context: Pair work safety
