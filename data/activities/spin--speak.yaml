l1_enhanced:
- adaptation: Spanish speakers may self-monitor heavily due to L1-L2 structural differences.
    The timed, low-stakes format reduces overthinking.
  language: Spanish
  priority: medium
- adaptation: Arabic speakers may pause extensively due to VSO vs SVO word order transfer.
    The keep-going encouragement specifically targets fluency over accuracy.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may struggle with topicalization in extemporaneous
    speech. Provide pre-speaking thinking time (10 seconds) as scaffolding.
  language: Mandarin
  priority: medium
