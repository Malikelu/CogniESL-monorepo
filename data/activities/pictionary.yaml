teaching_tips:
- context: Vocabulary level
  tip: Start with concrete nouns, then introduce abstract categories. Idioms work
    well at B2+ but need pre-teaching.
- context: Drawing constraints
  tip: The 'no letters' rule usually produces more drawing but can be relaxed for
    A1 learners. The 'no gestures' rule is hardest — save it for higher levels.
- context: Post-game review
  tip: 'After the game, ask: Which words were easy? Which were hard? Why? This metacognitive
    step reinforces vocabulary learning.'
