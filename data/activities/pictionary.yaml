l1_enhanced:
- language: Spanish
  adaptation: Spanish-English cognates can make cognate-based words (elephant/elefante)
    too easy. Include false friends to increase challenge at B1+.
  priority: low
- language: Arabic
  adaptation: 'Arabic speakers may want to write letters instead of draw. Re-enforce
    the oral/gestural mode explicitly: ''No writing — use your imagination!'''
  priority: medium
- language: Mandarin
  adaptation: Mandarin speakers may depend heavily on L1 translation chains. Encourage
    English-only guessing by awarding bonus points for rapid, untranslated guesses.
  priority: medium
