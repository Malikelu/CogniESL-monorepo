l1_enhanced:
- adaptation: Spanish-speaking students may benefit from L1 scaffolding during the
    writing stage. Allow drafting key sentences in Spanish first, then translating
    to English.
  language: Spanish
  priority: medium
- adaptation: Arabic-speaking students may need explicit instruction on English paragraph
    structure (topic sentence, supporting details). Provide a visual paragraph template.
  language: Arabic
  priority: medium
