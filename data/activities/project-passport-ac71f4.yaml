teaching_tips:
- context: Project stages
  tip: Use the passport template as a progress tracker. Students should not advance
    to the next stage until their partner stamps the current one. This builds accountability
    and peer learning.
- context: Editing stage
  tip: Provide a simple editing checklist (grammar, clarity, word count). This focuses
    peer review and prevents vague feedback.
- tip: Multi-stage projects are TBL creative tasks. They involve brainstorming, researching,
    drafting, and presenting. (Willis 1996, Ch. 2.2)
  context: TBL methodology
