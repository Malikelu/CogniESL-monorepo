teaching_tips:
- tip: "Start with just subject + verb + tense (3 dice). Once students are comfortable, add a fourth category (adverbs, objects, or negative forms). Common mistake: students produce grammatically correct but pragmatically odd sentences — use these as teaching moments about natural usage, not just form."
