teaching_tips:
- context: When assigning sections, give stronger readers the more complex sections
    and shorter/simpler sections to struggling readers. This ensures all students
    can become "experts."
  tip: Teach students to identify discourse markers (however, then, because, after
    that) in their section. These markers help them understand how their part connects
    to the whole text.
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
- context: After experts teach their sections, have the group reconstruct the text's
    sequence without looking at the original. This checks whether students understood
    the logical flow.
  tip: Encourage experts to use their own words when teaching, not read directly from
    the text. This promotes summarization skills and ensures they've processed the
    content.
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
- tip: Jigsaw reading tasks encourage natural reading strategies - learners read to
    extract specific information they need to share. (Willis 1996, Ch. 5.4)
  context: TBL methodology
