description: Timed Writing -- a writing fluency activity. Give students a writing
  prompt related to your lesson. Set a timer for 5, 10, or 15 minutes. Students write
  continuously without stopping, erasing, or looking up words. The goal is fluency
  and volume, not perfection.
differentiation:
  extension: Use longer time (15 minutes). Require a minimum word count. Have students
    revise their timed writing after the activity.
  support: Use shorter time (5 minutes). Provide a sentence starter. Allow students
    to write in their L1 if they get stuck.
