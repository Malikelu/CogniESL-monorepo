l1_enhanced:
- adaptation: Spanish speakers may produce longer, more elaborate sentences in timed
    writing due to L1 rhetorical preferences. Teach that English academic writing
    values conciseness and direct topic sentences.
  language: Spanish
  priority: medium
- adaptation: Arabic speakers may struggle with the "no stopping" constraint because
    Arabic rhetorical style favors elaborate development of ideas paired with wa (and).
    Encourage simplification and shorter sentences.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may need explicit modeling of English paragraph structure
    (topic sentence, supporting details, conclusion) before timed writing, as Chinese
    paragraph organization follows different conventions.
  language: Mandarin
  priority: medium
