l1_enhanced:
- adaptation: Japanese and Korean learners may struggle with English SVO word order
    (their languages use SOV). Provide explicit contrastive examples.
  language: Japanese
  priority: high
- adaptation: Arabic speakers may struggle with English SVO order (Arabic uses VSO
    and SVO). Provide word-order templates and visual sentence frames.
  language: Arabic
  priority: high
- adaptation: Spanish speakers are familiar with SVO but may place time expressions
    differently (at the beginning rather than end of sentence). Highlight English
    end-position preference for time adverbials.
  language: Spanish
  priority: medium
