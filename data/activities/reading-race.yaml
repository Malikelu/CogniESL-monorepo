l1_enhanced:
- adaptation: Pair Spanish-speaking students to compare cognates that may appear in
    English texts, using them as scanning shortcuts.
  language: Spanish
  priority: low
- adaptation: Arabic is written right-to-left. Allow extra time for left-to-right
    scanning. Provide a reading guide (ruler or finger) to track lines.
  language: Arabic
  priority: medium
- adaptation: Mandarin readers may be accustomed to character-based processing. Encourage
    word-level rather than letter-by-letter scanning for English texts.
  language: Mandarin
  priority: medium
