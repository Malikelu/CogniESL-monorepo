teaching_tips:
- context: Some teams may finish much faster than others.
  tip: Have a second set of harder questions ready for fast finishers. This keeps
    all teams working and prevents early winners from disengaging.
- context: Students may guess line numbers instead of actually finding answers.
  tip: Require teams to underline the answer in the text. This ensures they are actually
    reading, not just scanning randomly.
- tip: Timed reading tasks build fluency. Good readers adjust their speed according
    to purpose - fast for overview, slow for detail. (Willis 1996, Ch. 5.3)
  context: TBL methodology
