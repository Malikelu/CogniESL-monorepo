- adaptation: Arabic has root-pattern morphology (e.g., k-t-b for writing-related words). Use
    root-based word groups to connect categorization to Arabic linguistic awareness.
  language: Arabic
  priority: medium
- adaptation: Mandarin words are primarily monosyllabic. Categorization by semantic field (not
    by visual similarity) is key for Chinese learners.
  language: Mandarin
  priority: medium
