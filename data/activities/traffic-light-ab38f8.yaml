name: Traffic Light
prepTime: low
requiresTech: false
script:
- '"We are going to use a traffic light system to check your understanding. Green means I understand well. Yellow means I have some questions. Red means I do not understand. Everyone show me green — hold up 3 fingers. Good! Now yellow — 2 fingers. Red — 1 finger. Perfect."'
- '"OK, let me explain the grammar point... Now show me — green, yellow, or red? Look around the room... most of you are green, great! If you are red, do not worry — I am going to pair you with a green student who can help explain it."'
- '"At the end of class, I want you to write down one thing that was red or yellow for you. I will look at these and we will review them next class."'
