- adaptation: Arabic speakers may produce VSO order in spoken English. Cold-calling
    via randomizer targets spontaneous accuracy.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may avoid answering with full sentences. Require minimum
    3-word answers to build sentence-level fluency.
  language: Mandarin
  priority: medium
