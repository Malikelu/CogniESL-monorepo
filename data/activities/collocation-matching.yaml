teaching_tips: |
  - Use Wright's (2006) matching card typology: collocations (fatal/ accident, play/
    football, listen/carefully), synonyms (big/large, happy/glad), L1-English
    pairs, opposites (hot/cold, fast/slow), word-picture pairs, gapped
    sentence/missing words, and definition/word pairs.
  - Start students with the basic card-matching format: each pair of cards
    relates to each other. Students match pairs to show they know the
    connection. After matching, students say the pair aloud.
  - Once familiar, use the "Pelmanism" (memory game) variant: lay cards face
    down in neat rows. Students take turns turning over two cards, trying to
    find the matching combination (e.g., make/decision, fatal/accident). They
    must name the pair when they turn them over.
  - Don't let pairs of students work together on collocations. Let each
    learner try to match the pairs independently — the point of the game is
    to challenge and test, not to pool knowledge. After the matching, group
    discussion can clarify difficulties.
  - Target specific subclasses of collocations for each round: verb+noun
    (make a decision, do homework), adjective+noun (heavy rain, fatal
    accident), adverb+verb (listen carefully, speak fluently). This helps
    students see the combinatorial patterns.
  - After matching, have students use each collocation in an original sentence.
    This moves from recognition to production and reveals whether students truly
    understand the word combination.
  - Collocations are often idiomatic and non-compositional (we say "make a
    mistake" not "do a mistake"). Pre-teach that these are fixed word
    partnerships that must be learned as chunks — the meaning cannot always be
    predicted from the individual words.
  - The matching cards are good for pair and small-group work. If playing
    Pelmanism (memory game), groups of three or four work best. Use about 10
    pairs (20 cards) per group.
