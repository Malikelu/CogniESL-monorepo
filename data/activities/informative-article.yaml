l1_enhanced:
- adaptation: Spanish speakers may avoid passive voice in writing because Spanish
    uses reflexive constructions more frequently (e.g., 'Se descubrió el café' = 'Coffee
    was discovered'). Provide explicit contrast between the Spanish reflexive and
    English passive.
  language: Spanish
  priority: high
- adaptation: Arabic has a morphological passive (Form VII verbs) that differs from
    English periphrastic passive. However, Arabic passive is used less frequently
    in informative writing. Provide Arabic-to-English translation practice with the
    fact cards before students write.
  language: Arabic
  priority: medium
- adaptation: Mandarin Chinese uses passive 被 (bèi) primarily for adverse events,
    not neutral informative writing. Students may resist using English passive for
    neutral facts because the Mandarin equivalent feels negative or unnatural. Explain
    that English passive is neutral and standard in academic writing.
  language: Mandarin
  priority: high
