teaching_tips:
- tip: Before starting, review passive voice formation with 2-3 examples relevant
    to the topic (e.g., 'Coffee is grown in Brazil. It was discovered in Ethiopia.').
    Students need the structure fresh in mind before writing.
- tip: During the exchange phase, have students underline every passive sentence in
    the article they receive. This makes them actively notice the target structure
    during reading, not just writing.
- tip: For the debrief, write 3-4 passive sentences from student work on the board
    (anonymously) and have the class identify which facts they convey. This reinforces
    that passive voice is a tool for presenting factual information.
- tip: In TBL, the report stage often involves producing a polished written document
    drafted collaboratively and finalized for an audience. (Willis 1996, Ch. 4.5)
  context: TBL methodology
writing_genre: paragraph
