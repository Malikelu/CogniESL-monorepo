description: Informative Article -- a writing activity. Assign a topic to the class
  (e.g., 'The History of Coffee' or 'How Smartphones Changed the World'). Give each
  group a set of fact cards with different information about the topic. Groups write
  informative articles using their facts, then exchange articles to check for missing
  facts and add them. Practices passive voice, informative writing structure, and
  collaborative editing.
differentiation:
  extension: Challenge groups to include at least 5 passive sentences and to use a
    variety of tenses in passive voice. Require groups to write a concluding paragraph
    synthesizing all the facts.
  support: 'Provide sentence frames for passive voice: ''___ was ___ by ___.'' ''___
    is ___ in ___.'' Provide a list of linking words for informative writing. Allow
    groups to use a mix of active and passive voice.'
