id: service-project
instructions:
- 'Groups identify a need in the school or community. Examples: create a guide for
  new students, organize a book drive, make signs for the school.'
- 'Groups write a project proposal: What will you do? Why? What do you need? What
  is the timeline?'
- Teacher approves proposals. Groups carry out their projects over several class periods.
- 'Groups document their work: take photos, write reports, create presentations.'
- Groups present their projects to the class or school.
- 'Discuss: What did you learn? What was challenging? How did you use English in a
  real-world context?'
- 'Reflect: How can you continue to use English to help your community?'
keywords:
- service project
- community
- real-world
- project-based
- presentation
l1_enhanced:
- adaptation: Spanish speakers may benefit from bilingual brainstorming in early planning
    stages. Allow L1 use for initial idea generation, then transition to English for
    the proposal and presentation.
  language: Spanish
  priority: medium
- adaptation: Arabic speakers may be unfamiliar with Western-style group project dynamics.
    Provide clear role assignments and structured templates for proposals.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may expect more teacher direction. Scaffold the project
    planning process with checkpoints and explicit expectations at each stage.
  language: Mandarin
  priority: medium
