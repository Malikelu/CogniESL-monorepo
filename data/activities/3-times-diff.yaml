teaching_tips:
- tip: "Klippel describes The same or different? as a jigsaw pair work activity where students have similar but not identical materials and must describe them to find differences without seeing each other's sheets (Klippel 1984, Ch. 2.4: Jigsaw tasks, Activity 27)."
  context: Jigsaw pair work
- tip: "Klippel emphasizes that pair work activities where students cannot see each other's materials create genuine information gaps that force authentic communication (Klippel 1984, p. 40)."
  context: Information gap
