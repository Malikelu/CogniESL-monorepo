teaching_tips:
- context: Topic guidance
  tip: 'Tell the class the topic area (e.g., animals, food) before drawing begins. This
    narrows the search space and supports lower-level learners.'
- context: Relay dynamics
  tip: 'Key difference from standard Pictionary: the relay format means all teams
    are drawing simultaneously. Set clear start/end signals (whistle, timer visible
    to all).'
- context: Team size
  tip: Teams of 4 work best. Fewer = too many turns per person; more = waiting time
    reduces engagement.
- context: Word card management
  tip: Guessed cards go to the bottom of the pile, not removed. This means teams can
    re-encounter words, reinforcing learning through repetition.
