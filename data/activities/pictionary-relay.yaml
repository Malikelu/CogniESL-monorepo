l1_enhanced:
- language: Spanish
  adaptation: Spanish relay communication norms (rapid turn-taking) generally transfer
    well to English relay games.
  priority: low
- language: Arabic
  adaptation: In Arabic team discussions, multiple overlapping speakers is normal.
    Channel this energy into rapid guessing rather than sequential turns.
  priority: low
- language: Mandarin
  adaptation: Mandarin speakers may wait to be called on rather than call out guesses.
    Encourage the game culture of spontaneous, overlapping guesses.
  priority: low
