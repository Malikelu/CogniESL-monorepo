teaching_tips:
- context: Students may feel anxious about reading speed comparisons.
  tip: Emphasize personal improvement over class ranking. Each student compares their
    own first and second readings, not their score against others.
- context: Students may sacrifice comprehension for speed on the first read.
  tip: Before timing, tell students they will discuss reading strategies afterward.
    Knowing they need to reflect on HOW they read encourages strategic reading, not
    just fast reading.
- tip: TBL aims to develop flexible readers who can adjust speed and strategy according
    to text type and purpose. (Willis 1996, Ch. 5.3)
  context: TBL methodology
