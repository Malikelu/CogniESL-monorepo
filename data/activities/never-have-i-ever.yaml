l1_enhanced:
- adaptation: Spanish speakers may confuse present perfect and past simple. Provide
    explicit contrast and drill the "Never have I ever + past participle" frame until
    automatized before starting the game.
  language: Spanish
  priority: high
- adaptation: Arabic has perfective/imperfective aspect rather than tense distinctions.
    Speakers may default to past simple. Emphasize that English present perfect connects
    past experiences to the present moment. Use timeline visuals.
  language: Arabic
  priority: high
- adaptation: Mandarin marks aspect with particles (le, guo) rather than verb inflection.
    Map guo (experiential aspect) to English present perfect for positive transfer.
    Provide explicit past participle drilling.
  language: Mandarin
  priority: high
