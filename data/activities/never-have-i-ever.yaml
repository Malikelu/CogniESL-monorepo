teaching_tips:
- tip: "Klippel includes questioning activities like Find someone who... where students circulate and ask questions to find classmates matching certain descriptions. These activities force students to talk to everyone and practice question formation (Klippel 1984, Ch. 2.5: Questioning activities, Activity 42)."
  context: Questioning activity
- Drill the sentence frame "Never have I ever + past participle" before starting.
    Write 5-6 examples on the board and have the class chorally practice. This prevents
    students from producing errors like "Never have I ever went" during the game.
- After each statement, prompt follow-up questions ("When did you...?" "How was it?")
    to practice past simple in a natural context. This extends the activity and provides
    grammar contrast practice.
