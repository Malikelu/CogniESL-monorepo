teaching_tips:
- Model the activity first by sharing your own "wise word" from a previous lesson. This
    shows students that the goal is genuine reflection, not performance.
- For lower levels, allow students to write their wise word in L1 first, then translate
    or paraphrase. The thinking matters more than the English output in the first rounds.
- Over time, collect wise words into a class "wisdom wall" or shared document. Revisiting
    previous wise words at the start of each class reinforces learning and builds community.
