exampleSnippet:
  execution:
  - 'Video: ''The Happy Secret to Better Work'' by Shawn Achor (7 minutes).'
  - 'Summary: Shawn Achor argues that happiness fuels success, not the other way around. He
    presents research showing that when the brain works positively, performance improves. He suggests daily
    habits like writing down three gratitudes to retrain the brain for optimism.'
  teacherDialogue:
  - '"Do not try to write everything down. Focus on the main points and key examples."'
  - '"Your summary should answer: What did the speaker believe? What evidence did
    they give?"'
