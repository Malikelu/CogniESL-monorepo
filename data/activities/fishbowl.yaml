teaching_tips:
- tip: "Klippel describes the 'fishbowl' arrangement where elected speakers from each group sit in the middle of a circle and present their group's results in turn while the rest of the class observes. This format allows ideas from all groups to be shared efficiently (Klippel 1984, Ch. 3.1: Ranking exercises, No. 48: Guide)."
