l1_enhanced:
- adaptation: 'Spanish speakers may be accustomed to more direct, passionate argumentation
    styles. Teach hedging language ("It could be argued that...", "Some people believe...")
    as a way to soften claims in English academic debate, which values qualification over
    directness.'
  language: Spanish
  priority: high
- adaptation: 'Arabic rhetorical traditions often use repetition and parallel structure
    for persuasion, which differs from English argumentation that values conciseness
    and evidence. Provide explicit models of English argument structure: claim → evidence
    → reasoning.'
  language: Arabic
  priority: high
- adaptation: 'Mandarin speakers may be less accustomed to direct disagreement in
    classroom settings. Establish debate norms explicitly: "In this activity, you are
    arguing a position — it does not mean you personally believe it." Provide sentence
    stems for polite disagreement ("I see your point, but...").'
  language: Mandarin
  priority: high
