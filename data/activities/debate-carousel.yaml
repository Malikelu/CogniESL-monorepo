teaching_tips:
- tip: "Klippel notes that discussing one's opinions in a foreign language is both difficult and stimulating, so it is important to create a supportive atmosphere where students feel free to express views without being corrected for everything they say (Klippel 1984, Ch. 3: Discussions and Decisions)."
  context: Discussion atmosphere
- tip: "Klippel describes fishbowl-style discussion arrangements where an inner group discusses while outer observers take notes, then switch roles, ensuring all students practice both speaking and listening (Klippel 1984, Ch. 3.1: Ranking exercises)."
  context: Fishbowl technique
- tip: 'Before the first debate round, teach or review argument frames: "I believe
    that...", "The reason is...", "On the other hand...", "I disagree because...". Write
    these on the board as a reference during the activity.'
  context: Language scaffolding
- tip: 'The note-taking role is important — it gives the outer circle a purpose and
    develops listening-for-detail skills. After the debate, ask observers to summarize
    the strongest argument they heard before revealing their own opinion.'
  context: Observer role and listening skills
- tip: 'For the second round, give the new inner circle a different topic but the
    same time limit. The repetition of the format (not the content) builds fluency
    and confidence with the debate structure.'
  context: Second round variation
