l1_enhanced:
- adaptation: Spanish adjective order differs from English (noun + adjective rather than adjective + noun). Provide explicit practice reversing L1 order e.g. "casa big" -> "big house".
  language: Spanish
  priority: high
- adaptation: Arabic adjectives follow the noun and agree in definiteness. Remind students English adjectives precede the noun and don't take articles.
  language: Arabic
  priority: high
- adaptation: Mandarin classifiers (measure words) can confuse learners when mapping to English noun phrases. Focus on English OSASCOMP order without classifier equivalents.
  language: Mandarin
  priority: medium
