teaching_tips:
- context: Minimal pair selection
  tip: Choose minimal pairs that target sounds your specific students struggle with. Survey common errors from your class before creating cards.
- context: Checking answers
  tip: When checking the winning card, pronounce each word clearly and have the class repeat. This turns the checking phase into a pronunciation drill.
