l1_enhanced:
- adaptation: Arabic speakers may struggle with /p/ vs /b/ distinction (no /p/ phoneme
    in Arabic). Include minimal pair pin/bin cards.
  language: Arabic
  priority: high
- adaptation: Spanish speakers may confuse /b/ and /v/ (both realized as [b] in Spanish).
    Include minimal pair bet/vet cards.
  language: Spanish
  priority: high
