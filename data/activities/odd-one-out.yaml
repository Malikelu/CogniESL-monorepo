teaching_tips:
- Prepare word sets in advance with clear category contrasts. Start with concrete
    categories (food, animals) before moving to abstract ones (emotions, verbs).
- Encourage multiple valid answers to develop critical thinking. If students can
    justify their choice with a valid category, accept it even if it differs from
    your answer key.
- Do not reveal the "correct" answer until the discussion is finished. Saying the
    answer too early inhibits discussion and shuts down creative thinking.
- Try Variation "They're all odd!": ask learners to explain why EACH word could be
    the odd one out for a different reason (e.g., mouse is not useful to people;
    fish swims in the sea; knife is not a creature). This extends the activity and
    forces deeper analysis.
- For more challenging rounds, use word sets with multiple layers of categorization:
    spelling, pronunciation, meaning, register, or collocation patterns. This pushes
    learners beyond obvious semantic categories.
- Once learners are familiar with the game, ask them to compile their own sets of
    words containing an odd-one-out. These sets can then be used in peer-to-peer
    classwork.
