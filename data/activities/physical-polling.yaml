teaching_tips:
- tip: 'Klippel describes activities where students physically move to show their opinions (e.g., standing in different corners), noting that kinesthetic elements increase engagement and reduce self-consciousness about speaking (Klippel 1984, Ch. 2.5: Questioning activities).'
  context: Klippel (1984)
- tip: 'Klippel emphasizes that communicative activities should be organized so that as many students as possible are actively participating most of the time (Klippel 1984, p. 32).'
  context: Klippel (1984)
- context: Setup
  tip: Establish movement rules BEFORE the first statement (e.g., right wall = agree,
    left = disagree, middle = unsure). Do one practice round with a silly statement.
- context: Modals integration
  tip: 'Target modal usage explicitly: ''Students MUST give a reason when they share.
    They COULD use hedging: I think perhaps..., It might be that...''.'
- context: Extension
  tip: Have students physically move if they change their mind during discussion.
    This makes opinion shifts visible and rewards persuasion skills.
