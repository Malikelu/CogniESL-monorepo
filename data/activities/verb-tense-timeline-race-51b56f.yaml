- adaptation: Arabic has perfective/imperfective aspect rather than tense. Provide
    timeline visuals to illustrate English tense system.
  language: Arabic
  priority: high
- adaptation: Mandarin has no verb inflection for tense. Tense is indicated by time
    words (yesterday, now) and aspect markers (le, zhe). Provide explicit verb conjugation
    practice.
  language: Mandarin
  priority: high
