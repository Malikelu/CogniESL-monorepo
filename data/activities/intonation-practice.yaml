description: 'Intonation Practice -- a pronunciation activity. Draw intonation arrows
  on the board: rising (up arrow) for yes/no questions, falling (down arrow) for statements
  and wh-questions, rising-falling for ....'
differentiation:
  extension: Include contrastive stress (I didn't say HE stole it vs. I didn't say
    he STOLE it). Have students create their own intonation patterns.
  support: Focus on one pattern at a time. Use exaggerated intonation. Provide hand
    gestures.
