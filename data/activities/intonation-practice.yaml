teaching_tips:
- context: Use hand gestures to make intonation visible — students trace the melody in the air as they speak. This kinesthetic element helps learners who struggle to hear pitch differences.
  tip: Start with exaggerated intonation (big rises, big falls) then gradually reduce to natural speech. Students often need the "cartoon version" before they can produce natural intonation.
  source: Underhill (1994) Sound Foundations, Ch. 3
- context: When students mark intonation on paper, have them use arrows above each word rather than just at the end of the sentence. This trains awareness of sentence stress and prominence.
  tip: Contrastive stress is one of the most teachable intonation features. Use minimal pairs like "I didn't say HE stole it" vs "I didn't say he STOLE it" to show how stress changes meaning.
  source: Underhill (1994) Sound Foundations, Ch. 5
