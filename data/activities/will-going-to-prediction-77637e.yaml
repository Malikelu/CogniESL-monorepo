l1_enhanced:
- adaptation: 'Spanish uses a single future form (ir a + infinitive) for both plans
    and spontaneous decisions. Provide explicit contrast: ''Voy a estudiar'' (going
    to = plan) vs ''Estudiare'' (will = spontaneous prediction). Map this to English
    going to vs will.'
  language: Spanish
  priority: high
- adaptation: Arabic uses distinct particles for future (sa- and sawfa) but the semantic
    distinction does not map neatly onto English will/going to. Provide explicit instruction
    on the English evidence-based vs spontaneous distinction.
  language: Arabic
  priority: high
- adaptation: Mandarin has no morphological future tense. Future meaning is conveyed
    through time words (mingtian = tomorrow) and context. Learners may overuse will
    for all future meanings. Practice choosing going to for plans and evidence-based
    predictions.
  language: Mandarin
  priority: high
