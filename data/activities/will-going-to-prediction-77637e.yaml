teaching_tips:
- Use visual cues for evidence-based predictions (pointing at dark clouds, a packed
  suitcase) vs. spontaneous decisions (picking up a phone, responding to a sudden
  situation). The visual scaffolding helps learners internalize the distinction.
- Include tricky borderline cases (e.g., "I'll help you" — spontaneous or planned?)
  to generate discussion. Not every situation fits neatly into one category, and that
  ambiguity is a good teaching moment.
- After the activity, have students write 3 personal predictions using "going to"
  (based on current evidence) and 3 using "will" (spontaneous intentions). This personalizes
  the grammar and makes the distinction memorable.
- For prediction activities, the distinction between will (spontaneous, general predictions)
  and going to (plans, evidence-based predictions) can be sharpened by giving students
  visual evidence (dark clouds = going to rain) vs. spontaneous choices (I think I'll
  have coffee). The horoscope activity format provides a fun, low-pressure context
  for practising both forms.
