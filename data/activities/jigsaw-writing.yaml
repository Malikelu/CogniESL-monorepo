teaching_tips:
- context: When groups edit their combined story, focus on whether the sequence makes
    sense, whether transitions are needed between paragraphs, and whether pronoun
    references are clear.
  tip: Give students an editing checklist in three parts. First, add at least 2 transition
    words. Second, check that every pronoun clearly refers to one person. Third, make
    sure the tenses are consistent throughout.
  source: Oshima & Hogue (2006) Introduction to Academic Writing, 3rd ed., Ch. 2
- context: During the debrief, have groups share their most important editing decision.
    This makes the editing process visible and helps students internalize cohesion
    strategies.
  tip: Each group naturally writes in a slightly different style. This is expected.
    The editing phase is where students learn to create a unified voice. Have them
    discuss what changes they made and why.
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
- tip: 'Collaborative writing in TBL: discuss content, draft notes, write first draft,
    exchange with another pair for suggestions, then redraft. (Willis 1996, Ch. 4.5)'
  context: TBL methodology
