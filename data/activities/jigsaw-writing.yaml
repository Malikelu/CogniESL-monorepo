- adaptation: Arabic has VSO word order and long-distance agreement. Transitions between
    paragraphs may feel disjointed — highlight English SVO consistency and explicit
    linking words between paragraphs.
  language: Arabic
  priority: high
- adaptation: Mandarin topic-comment structure differs from English subject-predicate.
