teaching_tips:
- tip: 'Use a real or oversized band-aid for the modeling step — the humor and novelty
    helps retention. Students remember the "surgery" and associate it with contraction formation.'
  context: Modeling and engagement
- tip: 'After the activity, collect all contraction band-aids and post them on a "Surgery
    Success Board." This creates a reference wall students can consult during writing.'
  context: Follow-up and reference
- tip: 'For students who struggle with apostrophe rules, emphasize that the apostrophe
    ALWAYS goes where the missing letter(s) were. Do one example slowly: "she would"
    → remove "w,o,u,l,d" from "would" → "she" + "''" + ""d" = "she''d".'
  context: Apostrophe placement instruction
