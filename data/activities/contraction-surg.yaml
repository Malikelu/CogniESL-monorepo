l1_enhanced:
- adaptation: 'Mandarin and Arabic do not have contraction systems like English.
    Mandarin speakers may struggle with the concept that two words can merge into one
    written form. Arabic speakers may find apostrophe placement confusing as Arabic
    script works differently. Provide explicit visual mapping: full form → contracted
    form, letter by letter.'
  language: Mandarin
  priority: high
- adaptation: 'Spanish has some contraction patterns (del, al) but they work
    differently from English contractions. Spanish speakers may overgeneralize the
    concept. Show parallel examples: Spanish "del" (de + el) vs English "it''s" (it + is)
    to highlight cross-linguistic differences.'
  language: Spanish
  priority: medium
- adaptation: 'Spanish speakers may confuse present perfect and past simple. Provide
    explicit contrast: "he comido" (present perfect) vs "comí" (past simple).'
  language: Spanish
  priority: high
- adaptation: Arabic has perfective/imperfective aspect rather than tense. Provide
    timeline visuals to illustrate English tense system.
  language: Arabic
  priority: high
- adaptation: Mandarin has no verb inflection for tense. Tense is indicated by time
    words (yesterday, now) and aspect markers (le, zhe). Provide explicit verb conjugation
    practice.
  language: Mandarin
  priority: high
