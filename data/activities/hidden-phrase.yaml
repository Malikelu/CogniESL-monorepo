teaching_tips:
- tip: "Klippel recommends using topic cards to structure the conversation. Suggested
    topics include Watching TV, Family life, Travelling, Fashion, and Keeping fit. Each
    student receives a sentence card with a common expression (e.g. 'I really think it's
    old-fashioned to get married', 'But I like children', 'I've never been to Tokyo')
    that they must naturally incorporate into the conversation."
  source: Klippel (1984) Keep Talking, Activity 26
- tip: Award points for both correctly guessing the opponent's hidden sentence and for
    successfully using your own sentence without detection. This dual scoring system
    motivates both careful listening and natural speech production.
  source: Klippel (1984) Keep Talking, Activity 26
