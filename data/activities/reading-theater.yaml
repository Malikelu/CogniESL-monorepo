teaching_tips:
- context: Students may feel self-conscious reading in funny voices.
  tip: Demonstrate yourself first. Read a sentence as a news reporter, then as a sports
    commentator. Your willingness to be silly gives students permission to try.
- context: Some rounds may be too easy or too hard depending on the text.
  tip: Choose texts with dialogue or multiple characters for the dialogue round. Choose
    descriptive texts for the dramatic reading round. Match text type to reading style.
- tip: Reading theater combines reading practice with the TBL report stage principle
    of presenting to an audience. (Willis 1996, Ch. 4.4)
  context: TBL methodology
