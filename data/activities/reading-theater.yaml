l1_enhanced:
- adaptation: Pair Spanish-speaking students to compare how emotion and formality
    are conveyed through voice in English vs Spanish.
  language: Spanish
  priority: low
- adaptation: Arabic speakers may struggle with /p/ vs /b/ distinction (no /p/ phoneme
    in Arabic). Include minimal pin/bin pairs during oral reading practice.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may carry L1 tonal patterns into English reading.
    Focus on how English uses pitch for emotion and emphasis rather than to distinguish
    word meaning.
  language: Mandarin
  priority: medium
