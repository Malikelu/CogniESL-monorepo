id: my-strengths
instructions:
- 'Model the activity: ''I''m good at remembering vocabulary. My tip is: you should
  review new words every day for 10 minutes.'''
- 'Each student shares their strength and tip: ''I''m good at cooking. You could try
  following a recipe step by step.'''
- 'Other students can ask follow-up questions: ''What''s your favorite recipe?'' ''How
  did you learn?'''
- Optionally, collect all tips on a 'class advice board' for future reference.
keywords:
- advice
- strengths
- self-reflection
- modal verbs
- speaking
- confidence
l1_enhanced:
- adaptation: Spanish speakers often use "deber" (must) for both strong obligation and advice, which maps onto both "must" and "should" in English. Clarify that "should" is softer advice while "must" implies strong obligation or necessity.
  language: Spanish
  priority: high
- adaptation: Arabic speakers may struggle with the distinction between "should" (advice) and "could" (suggestion/possibility). Provide explicit contrastive examples.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may not distinguish between "should" and "could" as both can be translated as keyi. Provide contextual practice showing strength of advice vs. possibility.
  language: Mandarin
  priority: medium
l1_specific: []
materials:
- None
name: My Strengths
prepTime: none
requiresTech: false
script:
- '"I''ll start. I''m good at remembering vocabulary. My tip is: you should review
  new words every day for 10 minutes. Now it''s your turn!"'
- '"Remember: use ''should'' for stronger advice and ''could'' for a softer suggestion.
  ''You should try this'' vs. ''You could try this.''"'
- '"Great tip! Now class, ask a follow-up question: ''How did you learn that?'' ''Can
  you give an example?''"'
setupInstructions: No materials needed. Prepare your own example to model the activity.
skill_areas:
- speaking
sources:
- 'Klippel, F. (1984) Keep Talking: Communicative Fluency Activities for Language Teaching. Cambridge University Press.'
targetStructures:
- verb-modals
- verb-tenses
teaching_tips:
- tip: "Klippel describes personal sharing activities as important for building the group cohesion necessary for communicative work. When students know something about each other, they are less reluctant to cooperate in further activities (Klippel 1984, Ch. 2.1: Warming-up exercises)."
  context: Personal sharing
- tip: "Klippel emphasizes that activities should be organized to guarantee maximum active participation -- pair and group work formats ensure more speaking time per student than whole-class formats (Klippel 1984, p. 32)."
  context: Participation formats
