l1_enhanced:
- adaptation: 'Spanish uses "normalmente" (usually), "siempre" (always), "nunca" (never)
    in similar positions to English but with more flexibility in placement. Highlight
    the fixed English position: before main verb, after "be".'
  language: Spanish
  priority: high
- adaptation: Arabic frequency expressions often use time-adverbials rather than single-word
    frequency adverbs. Help English learners map Arabic time expressions (كل يوم /
    في العادة) to English frequency adverbs.
  language: Arabic
  priority: high
- adaptation: Mandarin frequency adverbs (常常, 总是, 从来不) generally precede the verb
    like English, but placement with "是" (shì / to be) differs. Explicitly contrast
    Mandarin and English positions.
  language: Mandarin
  priority: high
