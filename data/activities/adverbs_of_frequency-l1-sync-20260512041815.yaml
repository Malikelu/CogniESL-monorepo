teaching_tips:
- context: 'Practice design: clear objectives and active language use'
  tip: Always define a clear objective that students can understand in a few words,
    with a tangible result (a list, a solution, a story, a picture). The task should
    require active language use and provide repeated exposure to the structure being
    practised.
  source: 'Ur, Penny (1988) Grammar Practice Activities: A Practical Guide for Teachers.
    Cambridge University Press.'
- context: Frequency adverbs via surveys and information gaps
  tip: 'Use the "Frequency survey" approach: have students circulate and ask each
    other "How often do you...?" then report using full sentences (e.g., "Maria always
    drinks coffee"). For a less controlled alternative, use "What do you do when...?"
    where students suggest things they always/usually/sometimes do in different life
    situations. The information gap motivates genuine communication.'
  source: Ur, Penny (1988) Grammar Practice Activities section 2.3 Frequency surveys,
    section 2.4 What do you do when...?. Cambridge University Press.
