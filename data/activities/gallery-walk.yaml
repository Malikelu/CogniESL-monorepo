teaching_tips:
- tip: Require sticky-note comments to be questions or suggestions, not just "nice
    work." This pushes reading and critical thinking.
- tip: The gallery walk works best when groups have genuinely different subtopics
    — overlap reduces reading motivation and produces repetitive language.
- tip: Gallery walk activities increase student interaction. Willis emphasizes the
    need for more equal opportunities for interaction. (Willis 1996, Ch. 1.4)
  context: TBL methodology
