description: 'Peer Editing Workshop -- a writing activity. Students write a short
  text (100-150 words). This is their first draft. Give each student a peer editing
  checklist: grammar, spelling, punctuation, vocabulary, organization, and clarity.
  Students exchange papers, mark errors, and provide suggestions. Partners discuss
  feedback and revise their drafts.'
differentiation:
  extension: Require editors to also comment on style, tone, and word choice.
  support: Provide a simpler checklist. Allow students to focus on just 2-3 error
    types.
