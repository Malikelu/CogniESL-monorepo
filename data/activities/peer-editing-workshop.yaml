teaching_tips:
- Provide a clear editing checklist (grammar, spelling, punctuation, vocabulary, organization)
  before students begin peer review.
- Teach constructive feedback language: instead of \"this is wrong,\" model \"have
    you considered checking the tense here?\"
- tip: In TBL, the planning stage includes exchanging drafts for feedback, then redrafting.
    This collaborative process challenges learners current language system. (Willis
    1996, Ch. 4.5)
  context: TBL methodology
