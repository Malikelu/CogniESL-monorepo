teaching_tips:
- tip: "Klippel describes interview activities where students prepare questions and interview each other in pairs, then report findings to the class. Interviews are less threatening than monologues because the pressure is shared (Klippel 1984, Ch. 2.2: Interviews)."
  context: Interview structure
- tip: "Klippel suggests varying interview activities by specifying question forms or topics in advance, and by having students report their findings back to the class (Klippel 1984, p. 42)."
  context: Reporting back
