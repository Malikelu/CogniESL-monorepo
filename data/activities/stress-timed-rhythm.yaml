- adaptation: Arabic speakers may struggle with /p/ vs /b/ distinction (no /p/ phoneme
    in Arabic). Include minimal pin/bin pairs.
  language: Arabic
  priority: high
- adaptation: Mandarin is syllable-timed, not stress-timed. Students may struggle with
    reducing function words. Practice clapping on content words while whispering function
    words to feel the rhythm contrast.
  language: Mandarin
  priority: high
