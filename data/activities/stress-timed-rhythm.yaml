teaching_tips:
- 'Tip: Many L1s (Spanish, French, Mandarin, Japanese) are syllable-timed, not stress-timed.
    Students may initially give equal weight to every syllable. Use physical movement (clapping,
    stamping) to make the stress-timed rhythm visceral before moving to speech.'
- 'Tip: Start with very short 3-4 word sentences and build up. If students struggle with
    reduction, focus on stress placement first and add reduction later.'
