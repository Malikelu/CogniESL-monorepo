teaching_tips: For picture-based preposition activities, use visual materials that
  differ only in object position (e.g., cat ON the table vs cat UNDER the table).
  This creates a genuine reason for students to use precise prepositional descriptions.
  Having one student describe while the other guesses creates an information gap focused
  on preposition accuracy.
