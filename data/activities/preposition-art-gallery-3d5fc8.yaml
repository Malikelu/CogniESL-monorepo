citations:
- claim: 'Students can practise prepositions of place by describing pictures for a
    partner to identify: give students similar pictures with minor positional differences
    (e.g., "on the table" vs "under the tree"), have one describe their picture using
    prepositional phrases while the other listens and identifies which picture is
    being described. This creates an information gap focused on accurate use of in,
    on, under, between, behind, near, beside.'
  source: Ur (1988) Grammar Practice Activities, Cambridge University Press, Section
