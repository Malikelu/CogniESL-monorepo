l1_enhanced:
- adaptation: Spanish speakers may struggle with English passive voice (less common
    in Spanish news writing). Provide a mini-lesson on converting active to passive
    before the writing phase.
  language: Spanish
  priority: high
- adaptation: Arabic news writing uses different rhetorical structures. Arabic speakers
    may write in a circular rather than linear format. Provide a clear news report
    template (headline, lead, body, conclusion) to scaffold the writing.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may omit articles and tense markers in English writing.
    Emphasize that English news reports require explicit tense marking and articles.
    Provide a checklist for self-editing.
  language: Mandarin
  priority: medium
