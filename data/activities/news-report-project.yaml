teaching_tips:
- Provide a news report template (headline, lead paragraph, body with quotes, conclusion)
  before the writing phase. This scaffolds the genre structure and ensures all groups
  include the target grammar (passive voice, reported speech, past simple).
- During the research phase, have groups identify 2-3 facts that can be converted
  into passive voice or reported speech. This pre-selects grammar targets and makes
  the writing phase more focused.
- tip: Creative TBL tasks work best when published for real audiences. (Willis 1996,
    Ch. 4.5)
  context: TBL methodology
