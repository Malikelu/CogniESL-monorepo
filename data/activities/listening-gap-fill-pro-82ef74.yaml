script:
- '"First, read through the transcript. Look at the blanks -- what kind of words
  might go there? A noun? A verb? Discuss with your partner."'
- '"Now listen. Fill in as many blanks as you can."'
- '"Let''s listen again. Check your answers and fill in any you missed. Then compare
  with your partner."'
- '"Okay, let''s review together. Which words were hardest to catch? Why?"'
