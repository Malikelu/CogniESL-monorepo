teaching_tips:
- tip: 'Choose gap-fill targets that exemplify connected speech (contractions, elisions,
    liaisons). This raises awareness of natural speech patterns, not just vocabulary
    recognition.'
  source: Underhill (1994)
- tip: 'After reviewing answers, play the audio one more time with the full transcript
    visible. Students hear how connected speech creates the missing sounds they struggled
    with.'
  source: Underhill (1994)
