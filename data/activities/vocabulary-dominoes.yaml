sources:
- Wright, A., Betteridge, D. & Buckby, M. (2006). Games for Language Learning, 3rd ed.
    Cambridge University Press.
targetStructures:
- vocabulary
teaching_tips:
- 'Use a variety of matching-pair types as described by Wright (2006): word-to-definition,
  word-to-synonym, word-to-picture, mother-tongue word-to-English word, gapped
  sentence-to-missing word, opposites (big/small), and collocations (fatal accident,
  play football, listen carefully). Don''t limit to just one type — variety challenges
  different aspects of vocabulary knowledge.'
- Get the learners to make their own cards. This is time-saving for the teacher
    and more involving for the learners — it doubles the vocabulary exposure.
- After the domino game, have students check their matchings against an answer
    sheet. Use this as a moment to discuss WHY certain words go together
    (collocation patterns) or why certain definitions are more precise than others.
- For pair work, provide about 10 pairs (20 cards) per pair. Each pair should have
    the same set. Let them compete to finish first — the first to call "Finished!"
    must then be able to explain each matching pair to the class.
- 'Begin with the basic matching format before introducing the "Pelmanism" (memory
  game). In Pelmanism, cards are laid face down and players take turns flipping two,
  trying to find pairs. Adding this challenge once learners already know the cards
  shifts the focus from recognition to recall.'
