l1_enhanced:
- adaptation: Spanish speakers tend to give equal stress to all syllables (syllable-timed
    rhythm). Use clapping exercises to highlight English stress-timed rhythm and
    the contrast between stressed and unstressed syllables.
  language: Spanish
  priority: high
- adaptation: Arabic speakers may struggle with /p/ vs /b/ distinction (no /p/ phoneme
    in Arabic). Include minimal pair practice with stress patterns (e.g., ''PIN'' vs ''BIN'').
  language: Arabic
  priority: high
- adaptation: Mandarin is tonal and syllable-timed. English stress patterns may be
    confused with tone. Use visual stress marks and clapping to distinguish word-level
    stress from sentence-level stress.
  language: Mandarin
  priority: high
