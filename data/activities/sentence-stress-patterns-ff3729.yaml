script:
- '"Listen to this sentence: I WANT to GO to the STORE. Clap on the loud words: WANT, GO, STORE."'
- '"Now you try. Read the sentence and clap on the stressed words."'
- '"Partner A, read the sentence. Partner B, mark which words are stressed. Then switch."'
- '"How does stress change meaning? Listen: I didn''t say HE stole it. vs I didn''t say he STOLE it. Different meaning!"'
