teaching_tips:
- context: Reading strategy instruction
  tip: Before the task, explicitly teach the difference between skimming (reading
    quickly for gist) and scanning (reading quickly for specific information). Model
    both strategies with a sample text on the board, showing how your eyes move differently
    for each.
- context: Text selection
  tip: Use texts with clear visual signposts (headings, bold words, numbers, capital
    letters) so learners can practice targeted scanning rather than reading every
    word.
- tip: TBL text-based tasks develop natural reading strategies like skimming and scanning.
    We rarely read every word - we process text according to purpose. (Willis 1996,
    Ch. 5.2-5.3)
  context: TBL methodology
