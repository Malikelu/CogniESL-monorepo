l1_enhanced:
- adaptation: Some students may be uncomfortable with certain gestures due to cultural
    or religious reasons. Allow students to choose their own gesture freely. Avoid gestures
    that involve pointing at others, which is considered rude in some cultures.
  language: Arabic
  priority: medium
- adaptation: Students may need help with English name pronunciation. Use this activity
    to practice saying names clearly. For Mandarin speakers, the /θ/ and /ð/ sounds
    in "the" and "this" may need extra practice during the "Hello, [name]!" response.
  language: Mandarin
  priority: low
l1_specific: []
