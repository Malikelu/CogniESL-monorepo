sources:
- Krashen, S. (1982) Principles and Practice in Second Language Acquisition. Pergamon
targetStructures:
- speaking-fluency
teaching_tips:
- 'Tip: This activity lowers the affective filter on day one. The gesture component
    reduces speaking anxiety because students are focused on movement, not just language.'
- 'Tip: For large classes, do the name-gesture chain in small groups rather than whole-class
    to keep the pace lively and ensure everyone participates.'
