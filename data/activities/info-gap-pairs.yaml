l1_enhanced:
- adaptation: "Spanish speakers may confuse present perfect and past simple in question formation (\"Have you went?\" instead of \"Did you go?\"). Provide explicit contrast of present perfect vs past simple question patterns. Include both tenses in the information gap worksheets."
  language: Spanish
  priority: high
- adaptation: Arabic has perfective/imperfective aspect rather than tense. Arabic question formation uses different particles than English auxiliaries. Provide timeline visuals to illustrate English tense system and practice WH-question formation with each tense.
  language: Arabic
  priority: high
- adaptation: Mandarin has no verb inflection for tense. Tense is indicated by time words (yesterday, now) and aspect markers (le, zhe). Mandarin question formation uses question particles (ma, ne) rather than auxiliary inversion. Provide explicit English question formation practice with tense-specific auxiliaries.
  language: Mandarin
  priority: high
