teaching_tips:
- tip: Before starting, model the activity with one pair of students so the whole class sees what "no showing sheets" and "ask questions to fill blanks" looks like. This prevents the common confusion where students just read their sheets aloud.
- tip: Create worksheets where Partner A has times/dates that Partner B needs (schedules) and Partner B has names/events that Partner A needs. This naturally forces question formation in the target structures.
- tip: During the debrief, write 3-4 student-generated questions on the board and have the class identify which are well-formed. Peer evaluation of question quality raises awareness of structure.
