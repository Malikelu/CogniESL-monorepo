description: Phonics Sound Race -- a pronunciation activity. Write a target sound
  on the board (e.g., /th/, /sh/, /ch/). Say a word containing the sound. Students
  must write the letter or letter combination that makes that sound. Students race
  to the board to write their answer. First correct answer scores a point.
differentiation:
  extension: Require students to produce not just the spelling but a new word containing
    the target sound. Add a "dictation" variant where students write full words dictated
    by the teacher.
  support: Display the target sound IPA symbol on the board alongside example words.
    Allow students to whisper answers to a partner before writing on the board.
