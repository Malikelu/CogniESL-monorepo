l1_enhanced:
- adaptation: Spanish speakers may substitute /b/ for /v/ (both written as "b" or "v" in Spanish). Use tongue twisters with /v/ and /b/ contrasts.
  language: Spanish
  priority: high
- adaptation: Arabic lacks /p/ and /v/ phonemes. Arabic speakers may substitute /b/ for /p/ and /f/ for /v/. Use tongue twisters targeting these contrasts.
  language: Arabic
  priority: high
- adaptation: Mandarin lacks voiced/voiceless fricative contrasts in final position. Focus on /s/ vs /z/ and /f/ vs /v/ drills with tongue twisters.
  language: Mandarin
  priority: high
