teaching_tips:
- context: 'Practice design: clear objectives and active language use'
  tip: Always define a clear objective that students can understand in a few words,
    with a tangible result (a list, a solution, a story, a picture). The task should
    require active language use and provide repeated exposure to the structure being
    practised.
  source: 'Ur, Penny (1988) Grammar Practice Activities: A Practical Guide for Teachers.
    Cambridge University Press.'
- context: Indirect speech via quotation quiz and newspaper reporting
  tip: 'Use the "Quotation quiz" procedure: give students indirect-speech quotations
    and have them guess the original speaker. For extended practice, have students
    interview each other about hobbies or experiences, then write newspaper-style
    reports using reported speech.'
  source: Ur, Penny (1988) Grammar Practice Activities section 13.1 Reading reports,
    section 13.3 Quotation quiz, section 13.2 Reporting interviews. Cambridge University
    Press.
