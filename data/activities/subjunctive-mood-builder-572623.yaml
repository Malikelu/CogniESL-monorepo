l1_enhanced:
- adaptation: Spanish has a productive subjunctive mood -- leverage L1 transfer. Have
    Spanish speakers notice similarities between Spanish subjunctive and English mandative
    subjunctive.
  language: Spanish
  priority: high
- adaptation: Arabic has no morphological subjunctive. The mandative subjunctive (I
    suggest that he study) may feel unfamiliar. Provide explicit pattern drilling.
  language: Arabic
  priority: medium
- adaptation: Mandarin has no subjunctive mood. Modality is expressed through particles
    and context. Explicit instruction on English subjunctive as a grammatical form
    is essential.
  language: Mandarin
  priority: medium
