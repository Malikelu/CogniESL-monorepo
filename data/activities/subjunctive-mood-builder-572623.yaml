script:
- 'Let''s talk about wishes. I wish I were a bird! (spread arms like wings) I wish
  I could fly. Everyone try: I wish I were a bird!'
- 'Now demands. I suggest that he study more. Not ''studies'' -- STUDY. The subjunctive
  uses the base form. I suggest that she go. Try it!'
- 'Quick practice! Situation 1: Your friend is always late. Say: I suggest that he
  arrive on time! Everyone!'
