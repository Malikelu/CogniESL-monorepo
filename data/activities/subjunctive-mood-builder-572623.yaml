teaching_tips:
- 'Tip: Teach two subjunctive patterns separately: (1) Formulaic/wish subjunctive (I wish
    I were / If I were you) and (2) Mandative subjunctive (I suggest that he study). Many
    textbooks conflate these but they have different formality levels and L1 transfer patterns.'


