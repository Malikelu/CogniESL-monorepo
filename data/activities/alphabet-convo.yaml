- adaptation: Arabic speakers whose L1 has fewer vowels in certain positions may
    find vowel-heavy letters (A, E, I) easier than consonant-heavy letters (Q, X,
    Z). Monitor and adjust time limits.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may benefit from explicit practice with English word-initial
    sounds not found in Mandarin (e.g., /θ/, /v/). Use especially challenging letters
    to target these sounds.
  language: Mandarin
  priority: low
