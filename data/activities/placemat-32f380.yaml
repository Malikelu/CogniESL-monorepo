teaching_tips:
- context: Setup
  tip: Use A3 paper minimum. Larger is better — students need room to write. Consider
    pre-printing section labels if time is tight.
- context: Time management
  tip: Give 5-7 minutes for individual sections, then 3 minutes for the center. The
    center 'most important thing' step requires negotiation — model this beforehand.
- context: Follow-up
  tip: The gallery walk (rotating placemats) is where the real learning happens. Give
    sticky notes for comments/questions so the original writers get peer feedback.
