teaching_tips:
- context: Before playing, ensure students can produce at least 3 inversion patterns from memory. Write the patterns on the board as a reference during the first round.
  tip: Remind students that inversion after negative adverbs is formal/literary. In everyday speech, people rarely use it. This helps them understand register appropriateness.
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed., Ch. 25
- context: If students struggle to convert sentences in the tennis game, allow them to first write the inverted form before speaking. This reduces cognitive load and builds confidence.
  tip: 'Drill the word order: negative adverb + auxiliary + subject + main verb. Have students practice with "Never have I...", "Not only did she...", and "Hardly had we...".'
  source: Celce-Murcia & Larsen-Freeman (2015) The Grammar Book, 3rd ed., Ch. 25


