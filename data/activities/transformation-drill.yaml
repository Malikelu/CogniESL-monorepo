citations:
- claim: Transformation exercises are a controlled form of practice (active manipulation
    of forms). While useful for raising awareness of structural relationships, they
    should not be the only form of practice. Teachers should move from transformation
    to communicative activities where the same structures are used for genuine information
    exchange, opinion gap, or problem-solving purposes.
  source: Ur (1988) Grammar Practice Activities, Cambridge University Press -- Guidelines
    on Practice (transformation as one technique among many)
  tier: 2
  reliability: B
  flagged: false
- claim: 'Sentence transformation activities practice changing between grammatical forms such as active to passive or direct to reported'
  source: 'Watcyn-Jones, P. (1981) Grammar Games and Activities. Penguin Books, Miscellaneous activities section, Activities 83-115, Activities 94-95, Right word wrong place 1-2'
  tier: 3
  reliability: B
  flagged: false
description: Students transform sentences from one form to another (active to passive,
  direct to reported, positive to negative, statement to question). Fast-paced grammar
  practice.
differentiation:
  extension: Use complex transformations (active perfect passive, reported questions).
    Combine multiple transformations.
  support: Use simpler transformations (positive to negative). Provide the first word
    of the answer. Do fewer items.
