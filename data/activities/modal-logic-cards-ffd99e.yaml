name: Modal Logic Cards
prepTime: low
requiresTech: false
script:
- '"Draw one scenario card and one modal card. Now make a sentence: ''They must be
  late for work.'' Does it make sense? Why?"'
- '"What about ''They might miss the bus''? Could that work too? Which modals express
  deduction? Which express possibility?"'
- '"Now you try -- draw two cards and make a sentence. Share it with the class. Discuss:
  does the logic fit?"'
