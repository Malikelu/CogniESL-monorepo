teaching_tips: 'The key distinction for modals of deduction: must (certainty something
  is true), can''t (certainty something is not true), could/might (possibility). Using
  photos or visual evidence makes the deduction process concrete -- students point
  at evidence and say what they think must/might/can''t be true.'
