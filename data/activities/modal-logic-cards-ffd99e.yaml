l1_enhanced:
- adaptation: Spanish speakers may map "poder" onto both "can" and "could" but struggle
    with epistemic uses of modals ("He must be tired"). Provide practice with deduction
    modals (must, might, can't) vs. ability modals (can, could).
  language: Spanish
  priority: high
- adaptation: Arabic has a different modal system where obligation and possibility
    are expressed through particles rather than auxiliary verbs. Provide explicit
    practice with English modal verb forms.
  language: Arabic
  priority: medium
- adaptation: Mandarin uses separate words for ability (hui, neng), possibility (keneng/yao),
    and obligation (yinggai, bixu) rather than a single modal verb system. Help students
    map these to English modals.
  language: Mandarin
  priority: medium
