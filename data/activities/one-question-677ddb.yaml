l1_enhanced:
- adaptation: Spanish-speaking beginners may struggle to formulate questions in English.
    Allow L1 questions initially, then model English reformulation.
  language: Spanish
  priority: high
- adaptation: Arabic speakers may be hesitant to ask questions publicly due to cultural
    norms around teacher authority. Anonymous format is particularly beneficial for Arabic-speaking
    students.
  language: Arabic
  priority: high
- adaptation: Mandarin-speaking students may expect teacher-directed instruction and be
    unfamiliar with student-initiated questioning. Frame as "helping the teacher help you."
  language: Mandarin
  priority: medium
