differentiation:
  extension: Have students categorize questions by topic before answering -- this builds
    metacognition and helps identify knowledge gaps. Return questions in next class.
  support: Provide sentence frames for question formation ("I don't understand ___,"
    "Can you explain ___ again?"). Allow drawing instead of writing.
