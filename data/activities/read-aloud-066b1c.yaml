- pronunciation
teaching_tips:
- context: Modeling
  tip: Read the text aloud with exaggerated expression, pausing at punctuation, and
    emphasizing stressed words. Students imitate your prosody, not just pronunciation.
- context: Feedback focus
  tip: 'Alternate what you compliment and suggest. First reader: praise pronunciation,
    suggest pausing. Second reader: praise pausing, suggest intonation. This prevents
    overwhelming students with corrections.'
- tip: In TBL, reading aloud can be part of the report stage where students share
    their findings or written work. (Willis 1996, Ch. 4.4)
  context: TBL methodology
sources:
- Peregoy, S. & Boyle, O. (2023). Reading, Writing, and Learning in ESL, 8th ed. Pearson.
- Willis, J. (1996) A Framework for Task-Based Learning. Longman.
