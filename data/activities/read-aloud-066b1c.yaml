name: Read Aloud
prepTime: low
requiresTech: false
script:
- '"Today we will practice reading aloud. I will read a short text first, then you
  will take turns reading paragraphs aloud."'
- '"Listen carefully to my pronunciation, stress, and intonation. Ready? Let me read
  the first paragraph."'
- '"Excellent reading! Now focus on sentence stress and natural pausing. Try reading
  it again with more expression."'
