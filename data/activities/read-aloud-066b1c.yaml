l1_enhanced:
- adaptation: Arabic is written right-to-left. When reading English text aloud, use
    a finger or pointer to track left-to-right progression.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may carry over tonal pitch patterns into English sentence
    intonation. Practice falling intonation for statements and rising for yes/no questions.
  language: Mandarin
  priority: medium
