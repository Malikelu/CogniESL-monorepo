l1_enhanced:
- adaptation: Pair Spanish-speaking students to discuss expression and intonation
    patterns in L1 vs L2 oral reading.
  language: Spanish
  priority: low
- adaptation: Arabic speakers may struggle with /p/ vs /b/ distinction (no /p/ phoneme
    in Arabic). Include minimal pin/bin pairs during rehearsal.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may carry L1 tonal patterns into English intonation.
    Focus on sentence-level stress and emotion-based pitch changes.
  language: Mandarin
  priority: medium
