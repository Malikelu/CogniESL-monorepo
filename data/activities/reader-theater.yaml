teaching_tips:
- context: Students may feel shy performing in front of the class.
  tip: Start with small-group performances before whole-class. Let groups choose their
    audience — another small group rather than the full class.
- context: Lower-level students may struggle with expression.
  tip: Model expressive reading yourself first. Use exaggerated emotion to show what
    "reading with expression" sounds like. It is okay to be dramatic.
- tip: Reader theater combines reading practice with the TBL report stage principle
    of presenting to an audience. (Willis 1996, Ch. 4.4)
  context: TBL methodology
