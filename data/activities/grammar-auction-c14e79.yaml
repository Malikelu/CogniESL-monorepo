teaching_tips:
- tip: Prepare a mix of 60% correct and 40% incorrect sentences. For auction to work, some errors should be subtle (e.g., present perfect vs past simple) so teams must discuss. After auctioning, always review every sentence regardless of bidding — this is the real teaching moment.
