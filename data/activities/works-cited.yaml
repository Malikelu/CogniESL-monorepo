description: Works Cited Challenge -- a writing activity. Give students a short text
  that includes both original writing and information from other sources (some cited,
  some not). Students work in pairs to identify which information needs a citation
  and which is common knowledge or original. Discuss as a class why citations matter.
differentiation:
  extension: Require full MLA or APA formatting. Have students research sources and
    create a complete works cited page for a short essay.
  support: 'Provide a checklist: ''Does this sentence have a specific fact, a quote,
    or data? If yes, it needs a citation.'' Use a simplified citation format.'
