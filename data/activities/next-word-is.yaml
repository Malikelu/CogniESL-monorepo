l1_enhanced:
- adaptation: Spanish speakers may predict words based on L1 collocation patterns
    that differ from English. After reveal, briefly discuss why the English collocation
    differs from what they might expect.
  language: Spanish
  priority: low
- adaptation: Arabic speakers may struggle with English connected speech (linking,
    elision). After prediction, replay the segment at slower speed to highlight
    how words connect.
  language: Arabic
  priority: medium
- adaptation: Mandarin is syllable-timed while English is stress-timed. Speakers may
    miss word boundaries in connected speech. Provide a transcript for the first
    listen, then remove it for subsequent pause points.
  language: Mandarin
  priority: medium
