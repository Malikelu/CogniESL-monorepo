teaching_tips:
- Choose audio with clear, natural speech. The first 2-3 pause points should be
    easy (highly predictable) to build confidence. Gradually increase difficulty.
- After each prediction, ask students to explain their reasoning ("What clue helped
    you?"). This develops metacognitive awareness of how grammar, collocation, and
    context work together to create predictability.
