citations:
- claim: 'A "Quotation quiz" activity: give students brief indirect-quotation items
    (e.g., "Who told Pharaoh to let his people go?") and have them reconstruct the
    original direct quote. Individually or in groups, students then prepare two or
    three of their own indirect quotes for classmates to quiz each other on, converting
    between direct and reported speech in both directions.'
  source: Ur (1988) Grammar Practice Activities, Cambridge University Press, Section
    13.3 Quotation quiz
