teaching_tips: When practising indirect speech through an interview-and-report format,
  have one student volunteer for an interview at the front of the class (about a hobby,
  experience, or future plan). The rest of the class then writes down what was said
  in indirect speech, as if writing a newspaper report. Groups can combine their data
  into fuller reports.
