teaching_tips:
- tip: "Klippel describes Most Names (guessing game where students have name tags on their backs and ask yes/no questions) as a warming-up activity that gets students talking to everyone in the class (Klippel 1984, Ch. 2.3: Guessing games, Activity 20)."
  context: Guessing game
- tip: "Klippel notes that guessing games combine language practice with fun and excitement, and are liked by students of all ages because the suspense creates genuine communicative urgency (Klippel 1984, p. 31)."
  context: Communicative urgency
- Model the difference between open questions ("Tell me about myself") and yes/no questions
    ("Am I alive?") before starting. Many learners default to open questions, which reduces
    the deductive challenge.
- For lower levels, allow "Are you...?" questions as well as "Am I...?" to keep the game
    accessible. Restrict to "Am I...?" only at B1+ where question formation is being practiced.
- After the game, have students reflect on which questions were most efficient for narrowing
    down possibilities. This builds metacognitive question-formation skills.
