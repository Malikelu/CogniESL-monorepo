- claim: Guessing games where one player has information and others must guess by asking yes/no questions are a core communicative technique. Hadfield describes these as activities where the player with the information deliberately withholds it, while others guess what it might be. The holder can only answer yes or no, forcing questioners to use deductive reasoning and precise question forms.
  source: 'Hadfield, J. (1990) Intermediate Communication Games. Longman/Pearson. Introduction: Guessing games.'
