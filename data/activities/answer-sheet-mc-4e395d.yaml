l1_enhanced:
- adaptation: If MC questions are about verb tenses, provide a quick timeline visual
    on the board before students begin. Spanish speakers often confuse present perfect
    and past simple.
  language: Spanish
  priority: low
- adaptation: Arabic speakers relying on aspect rather than tense may benefit from
    a brief reminder. English verb form indicates time reference, not completion.
  language: Arabic
  priority: low
- adaptation: Mandarin speakers should check that they are reading all four options
    carefully. In Mandarin, context often makes the answer obvious. In English, distractors
    can be subtle.
  language: Mandarin
  priority: low
