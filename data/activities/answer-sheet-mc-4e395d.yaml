teaching_tips:
- context: During the quiz
  tip: Introduce a time limit for answering (e.g. two minutes per question or a total time for the quiz). The time pressure makes the activity brisker and more motivating for students.
  source: 'Ur, Penny (1988) Grammar Practice Activities, Cambridge University Press. Section 15.7: Quizzes'
- context: Follow-up
  tip: As a written follow-up, have students compose their own quiz questions with answers to exchange with peers. The act of writing good questions and plausible distractors deepens their understanding of the grammar points.
  source: 'Ur, Penny (1988) Grammar Practice Activities, Cambridge University Press. Section 15.7: Quizzes'
