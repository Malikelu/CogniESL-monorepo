script:
- '"Today we are going to check what we have learned with a quick quiz. You have 10
  minutes to answer 10-15 multiple choice questions. Choose the ONE best answer for
  each."'
- '"Remember: go with your first instinct. Do not spend too long on any one question.
  If you are stuck, move on and come back."'
- '"Time is up! Let us check the answers. For each question, I will ask someone
  to explain WHY that answer is correct. Who wants to start?"'
- '"Most of you got questions 1-5 right — great work on [concept]. Question 8 was
  tricky. Let me explain why the answer is [correct option]..."'
- '"Collect your answer sheets. I will look at them to see if there is anything we
  need to review tomorrow."'
