teaching_tips:
- tip: Model the letter format on the board first — show how to open (Dear Future
    Me), body paragraphs (present life, goals, predictions), and close (sign-off with
    current date).
- tip: The "seal and return" element creates genuine audience and purpose. If possible,
    actually return the letters at the end of the term — this is the most powerful
    part of the activity.
- tip: In TBL, writing should communicate something real to someone. Letters to future
    selves create genuine purpose and audience. (Willis 1996, Ch. 4.5)
  context: TBL methodology
writing_genre: letter
