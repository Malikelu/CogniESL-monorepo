teaching_tips:
- tip: Start each round with easier personal questions (name, hometown, hobbies) before moving to grammar-focused questions. This builds confidence and warms up the student in the hot seat.
- tip: For shy classes, allow the student in the hot seat to choose who asks the question. This reduces anxiety while maintaining spontaneous speaking practice.
- tip: Use the discussion phase to highlight any grammar errors you heard — not by naming the student, but by putting the sentence on the board for class correction.
