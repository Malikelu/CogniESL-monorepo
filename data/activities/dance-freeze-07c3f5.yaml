l1_enhanced:
- adaptation: 'Spanish speakers may confuse present continuous ("I am wearing blue")
    with simple present ("I wear blue") when describing their frozen pose. Provide
    a quick model: "Right now, in this moment, I am wearing..." to reinforce the
    temporary/ongoing meaning.'
  language: Spanish
  priority: medium
- adaptation: 'Arabic speakers may struggle with English prepositions of place
    ("on my head" vs "in my head" vs "at my head"). Use the physical poses to make
    preposition meanings concrete — touch your head and say "My hand IS ON my head."
    This embodied approach helps cement spatial prepositions.'
  language: Arabic
  priority: high
- adaptation: 'Mandarin speakers may omit the copula ("I wearing blue" instead of
    "I am wearing blue") since Mandarin does not use a linking verb for adjectives.
    The physical context makes the copula meaning clear: "I AM wearing... I AM standing...
    I AM..."'
  language: Mandarin
  priority: high
- adaptation: Pair Spanish-speaking students for L1 contrastive discussions. Provide
    bilingual glossaries for key terms.
  language: Spanish
  priority: low
- adaptation: Arabic speakers may be unfamiliar with "freeze" as a classroom command.
    Demonstrate with a clear physical gesture before starting. Pair with an English-speaking
    partner for the first round.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may not have direct L1 transfer for English body-part vocabulary, as Mandarin often uses different body-part metaphors or compounds. Allow L1 comparison during the debrief to reinforce new vocabulary.
  language: Mandarin
  priority: low
