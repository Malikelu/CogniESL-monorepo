citations:
- claim: Warm-up activities that involve movement and play lower the affective filter
    and encourage participation from reluctant speakers. The freeze-and-describe format
    provides a natural context for practicing present continuous, body vocabulary, and
    prepositions of place.
  flagged: false
  reliability: B
  source: 'Peregoy, S. & Boyle, O. (2023). Reading, Writing, and Learning in ESL,
    8th ed. Pearson. Ch. 5: Oral English Development for Multilingual Learners —
    oral games and movement-based speaking activities.'
  tier: 2
- claim: Total Physical Response (TPR) techniques, where students respond to language
    through movement, are effective for vocabulary development and for lowering anxiety.
    Warm-up activities that combine language practice with physical engagement are
    especially effective for kinesthetic learners at lower levels.
  flagged: false
