teaching_tips:
- tip: 'Start with body parts vocabulary if students do not yet know the words. Do a
    quick "touch your..." warm-up (touch your head, shoulders, knees, toes) before
    the music begins.'
  context: Vocabulary preparation
- tip: 'For the description round, scaffold with sentence frames: "My [body part] is
    [preposition] my [body part]." Write these on the board so lower-level students
    can participate.'
  context: Scaffolding for lower levels
- tip: 'Each round, add a grammar constraint to recycle target structures: Round 1
    = body parts only; Round 2 = add colors ("I am wearing blue"); Round 3 = add
    prepositions ("My hand is on my head"); Round 4 = full sentences.'
  context: Progressive complexity
- context: Activity setup
  tip: Before starting, demonstrate the "freeze" command clearly. Play a short round
    where students practice freezing without any language output first.
- context: Scaffolding language output
  tip: In early rounds, accept single-word responses. Only require full sentences
    in later rounds once students have built confidence.
- context: Debrief and consolidation
  tip: The debrief "What structures did we use?" is where real learning happens. Write
    student responses on the board for a class-generated grammar reference.
