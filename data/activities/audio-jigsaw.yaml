teaching_tips:
- Pre-teach key vocabulary from all clips before listening. This prevents vocabulary
  gaps from blocking comprehension of the specific clip each student hears.
- After the first round, have students retell their clip to a partner who heard a
  different clip. This doubles speaking practice and checks comprehension.
- For B1 groups, provide gap-fill note-taking sheets. For B2/C1, use open note-taking
  to encourage capturing nuance and speaker attitude.
