teaching_tips:
- tip: Before starting, model each role with a short sample text. Show what a good
    Discussion Director question sounds like vs. a simple yes/no question.
  source: Peregoy & Boyle (2023) Ch. 9
- tip: The Connector role is often the weakest. Provide sentence frames like "This
    reminds me of..." or "In my experience..." to help students make real-world links.
  source: Peregoy & Boyle (2023) Ch. 9
- tip: Literature circles combine reading with meaningful interaction around texts.
    Students discuss content and process meaning together. (Willis 1996, Ch. 5.1)
  context: TBL methodology
