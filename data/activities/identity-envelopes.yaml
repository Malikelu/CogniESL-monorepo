teaching_tips:
- tip: Pre-teach the three levels of certainty (must be = 95% sure, might/could = 50% sure, can''t be = impossible) before the activity. Use a probability line on the board.
- tip: For lower levels, provide a sentence frame handout. Remove frames as students gain confidence.
- tip: After the activity, do a meta-discussion comparing how different languages express certainty. This raises cross-linguistic awareness of epistemic modality.
- tip: Before starting, pre-teach/review the three modal verbs of deduction (must, might, could) with a certainty scale on the board (100% = must, 50% = might, 30% = could). Refer groups to this scale during the activity.
- tip: Model the difference between "must be" (strong evidence) and "might/could be" (weak evidence) with one example item before groups begin. The biggest student error is overusing "must" for all deductions.
- tip: After presentations, have groups discuss which modal they chose for each clue and why — this makes the certainty distinction explicit and gives speaking practice.
