l1_enhanced:
- adaptation: Spanish speakers may overuse "must" for all deductions. Teach the three-way distinction explicitly — "must" (near certain), "might" (possible), "could" (possible). Provide a visual scale diagram.
  language: Spanish
  priority: high
- adaptation: Arabic has no direct equivalent of English epistemic modals. Use must/might/could all translate to Arabic particles that don't distinguish certainty levels. Provide explicit certainty-level mapping chart.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers tend to use "must" for all speculations because 必须 (bìxū) and 应该 (yīnggāi) cover a narrower range than English must/might/could. Drill the three-way contrast with visual probability scales.
  language: Mandarin
  priority: medium
