teaching_tips:
- tip: 'The magic of story chain is that errors become part of the story. When a student
    makes a mistake, the class corrects it together — this is collaborative error
    correction, not teacher correction. For C1 classes, add constraints: each sentence
    must include an adverbial clause or a passive construction.'
- context: Chain story technique for narrative grammar practice
  tip: 'Use the "Chain story" technique: give each student a past-tense verb cue.
    Begin improvising a story, then stop - a student must continue, incorporating
    their assigned verb. For written practice, have students pass papers with each
    adding one sentence. The advantage of the written chain is that the whole result
    is available at the end for reading aloud.'
  source: Ur, Penny (1988) Grammar Practice Activities section 23.3 Chain story. Cambridge
    University Press.
