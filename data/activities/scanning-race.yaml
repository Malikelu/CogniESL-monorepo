l1_enhanced:
- adaptation: Arabic is written right-to-left. Allow extra time for reading English
    text. Provide left-to-right reading guides.
  language: Arabic
  priority: medium
- adaptation: Japanese includes kanji, hiragana, and katakana scripts. Scanning English
    text requires recognizing word shapes rather than character-based reading. Practice
    identifying keywords by shape (capital letters, numbers).
  language: Japanese
  priority: medium
- adaptation: Mandarin readers are accustomed to character-based rather than word-based
    text. Explicitly teach the concept of "skimming" vs "scanning" in English, focusing
    on numbers, capital letters, and keywords.
  language: Mandarin
  priority: medium
