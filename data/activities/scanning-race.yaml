teaching_tips:
- context: Text selection
  tip: Use authentic texts students encounter in real life (menus, timetables, ads).
    This builds transferable skills and increases motivation.
- context: Strategy instruction
  tip: Before starting, explicitly teach scanning strategies such as looking for numbers,
    capital letters, keywords, and headings. Model scanning on the board with a sample
    text.
- tip: Scanning tasks develop the ability to locate specific information quickly -
    a key real-life reading strategy. (Willis 1996, Ch. 5.3)
  context: TBL methodology
