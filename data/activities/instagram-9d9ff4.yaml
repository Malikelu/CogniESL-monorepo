description: 'Instagram -- a review activity. Show an example of an Instagram post that summarizes a topic visually (photo + short caption). Explain the task: students will create an Instagram-style post summarizing the days lesson. They can draw or write. Each post must include a visual element (drawing or diagram) and a caption (2-3 sentences max). Students share in small groups, then the best posts go on the board. Practices summarization, visual representation of knowledge, and concise writing.'
