teaching_tips:
- tip: Show 2-3 strong examples of Instagram summary posts before students create their own. Include one that is too long and discuss why it doesn't work - this helps students internalize the conciseness requirement.
- tip: The 8-minute time limit is intentional. If students have too much time, captions become paragraphs. Emphasize that constraint breeds creativity.
- tip: During the gallery walk, have students use sticky notes to "like" posts with specific comments ("Great use of passive voice here" or "This captures the main point clearly"). This makes evaluation concrete rather than superficial.
