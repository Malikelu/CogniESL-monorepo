script:
- '"Look at this Instagram post about our topic. It has a picture and a short caption — just 2-3 sentences summarizing the key idea. Your turn!"'
- '"Create your own Instagram post about todays lesson. Draw a visual and write a short caption. Remember: 2-3 sentences maximum."'
- '"You have 8 minutes. Go!"'
- '"Finish up! Now share your post with your group. Put a sticky note on the one you think summarizes best."'
- '"Lets look at the top posts. What makes a good summary?"'
