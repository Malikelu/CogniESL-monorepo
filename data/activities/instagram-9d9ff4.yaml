l1_enhanced:
- adaptation: Pair Spanish-speaking students for peer feedback using L1 if needed, then switch to English for the final post. Provide key summary vocabulary in English-Spanish.
  language: Spanish
  priority: low
- adaptation: Arabic is written right-to-left. For the visual/caption post, allow Arabic-speaking students to orient their post layout right-to-left if they prefer - the visual element is language-neutral.
  language: Arabic
  priority: medium
- adaptation: Mandarin is tonal. For this writing-focused activity, ensure Mandarin speakers understand that the caption should be concise (2-3 sentences max) - Mandarin writing tends toward longer connective phrases. Provide sentence starters for conciseness.
  language: Mandarin
  priority: medium
