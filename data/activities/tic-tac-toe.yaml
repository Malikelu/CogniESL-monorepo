- team competition
- grid game
l1_enhanced:
- adaptation: Spanish speakers may overuse present perfect where past simple is needed (he comido vs comí). Include both tenses in game squares for contrastive practice.
  language: Spanish
  priority: high
- adaptation: Arabic speakers may struggle with past tense verb forms since Arabic marks aspect (perfective/imperfective) rather than tense. Include explicit verb conjugation prompts in game squares.
  language: Arabic
  priority: high
- adaptation: Mandarin speakers may omit tense markers since Mandarin has no verb inflection. Include verb tense transformation prompts (change this to past tense) in game squares.
  language: Mandarin
  priority: high
