teaching_tips:
- 'Tip: Substitution tables are controlled practice -- the teacher decides the grammar.
  Students manipulate the components. This is the bridge between presentation and
  free production.'
- 'Tip: Include at least 2-3 combinations that are grammatically impossible (e.g.,
  present perfect + yesterday). Having students identify WHY they don''t work develops
  metalinguistic awareness.'
