- tip: Use a visible timeline on the board. Mark specific future times and have students
    place their actions on it — this makes the "in progress at a specific time" concept
    visual.
- tip: Contrast explicitly — "I will eat dinner" (decision/intention) vs. "I will
    be eating dinner" (already in progress at that moment). Use the timeline to show
    the difference.
