teaching_tips:
- context: 'Practice design: clear objectives and active language use'
  tip: Always define a clear objective that students can understand in a few words,
    with a tangible result (a list, a solution, a story, a picture). The task should
    require active language use and provide repeated exposure to the structure being
    practised.
  source: 'Ur, Penny (1988) Grammar Practice Activities: A Practical Guide for Teachers.
    Cambridge University Press.'
- context: Future tenses via trip planning simulation
  tip: 'Use a trip planning simulation: give students data about a trip (brochures,
    maps, equipment lists) and have them create itineraries using the target future
    form. The more explicit the preliminary data, the more controlled the exercise;
    using only a map requires more spontaneous production.'
  source: Ur, Penny (1988) Grammar Practice Activities section 9.7 Plans for a trip.
    Cambridge University Press.
