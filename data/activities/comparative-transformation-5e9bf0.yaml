teaching_tips:
- context: 'Practice design: clear objectives and active language use'
  tip: Always define a clear objective that students can understand in a few words,
    with a tangible result (a list, a solution, a story, a picture). The task should
    require active language use and provide repeated exposure to the structure being
    practised.
  source: 'Ur, Penny (1988) Grammar Practice Activities: A Practical Guide for Teachers.
    Cambridge University Press.'
- context: Comparative and superlative practice via real-world contexts
  tip: Use advertisements as authentic materials for comparative/superlative practice
    - they naturally contain forms like "the best coffee" and "faster than ever."
    For a brainstorming approach, give students three objects and ask them to find
    as many points of comparison as possible in 3-4 minutes, competing in small groups.
  source: Ur, Penny (1988) Grammar Practice Activities section 5.1 Looking at advertisements,
    section 5.3 Brainstorming comparisons. Cambridge University Press.
