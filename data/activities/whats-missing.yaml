l1_enhanced:
- adaptation: Speakers of languages without a direct equivalent of English articles (Arabic, Mandarin, Japanese) may omit articles when naming items. Provide explicit practice with "a pen / the pen" when describing missing items.
  language: Arabic
  priority: high
- adaptation: Some languages name colors after objects (e.g., Mandarin 橙 chéng = orange fruit). When describing missing items, learners may mix color and noun order. Model clear "adjective + noun" patterns.
  language: Mandarin
  priority: medium
