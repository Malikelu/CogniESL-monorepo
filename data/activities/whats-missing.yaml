name: What is Missing?
prepTime: low
requiresTech: false
script:
- '"Look at these items. You have 30 seconds to memorize them. Ready? Go."'
- '"Close your eyes. No peeking! ... Okay, open! What is missing?"'
- '"Yes! The blue pen is gone. Can you describe it? It is a blue pen with a cap."'
setupInstructions: Gather 6-10 common classroom items (pen, book, eraser, ruler, phone,
  water bottle, keys, notebook, marker, scissors). Alternatively, draw or project
  pictures of items on the board.
skill_areas:
- vocabulary
sources:
- McCarthy & O'Dell (2008) Academic Vocab in Use
targetStructures:
- vocabulary
teaching_tips:
- Start with concrete, high-frequency items (pen, book, keys) before moving to abstract
    or less common vocabulary. This scaffolds the activity for lower levels.
- Use the activity as a diagnostic: if students struggle to recall items, it signals
    vocabulary gaps that need explicit instruction.
- After identifying the missing item, push for full sentences ("The red pen is missing"
    not just "pen") to practice article + adjective + noun order.
