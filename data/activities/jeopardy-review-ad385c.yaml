teaching_tips:
- context: Prepare questions at different difficulty levels (100-500) so all students can contribute. Include some easy questions to keep lower-level students engaged.
  tip: After each question, briefly explain the answer even for correct responses. This turns every question into a mini-teaching moment and ensures learning happens during the game.
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
- context: If a team gives a wrong answer, don't just say "incorrect." Ask the other teams if they can correct it. This keeps all teams engaged even when it's not their turn.
  tip: Consider removing point deductions for wrong answers with lower-level classes. The goal is review and learning, not competition. Teams can still earn points for correct answers.
  source: Peregoy & Boyle (2023) Reading, Writing, and Learning in ESL, 8th ed.
