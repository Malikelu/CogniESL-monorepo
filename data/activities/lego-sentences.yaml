teaching_tips:
- context: Tactile sentence building with physical materials
  tip: 'Use the "Describe and arrange" technique: give students Lego bricks or Cuisenaire
    rods. One student arranges their materials in a secret pattern, then gives instructions
    to a partner who must recreate the arrangement. The student giving instructions
    only - no pointing or showing.'
  source: Ur, Penny (1988) Grammar Practice Activities section 25.4 Describe and arrange.
    Cambridge University Press.
