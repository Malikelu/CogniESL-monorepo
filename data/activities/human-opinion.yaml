l1_enhanced:
- adaptation: Spanish speakers may transfer Spanish discourse markers (sin embargo, no obstante) directly as literal equivalents. Teach English contrastive markers (however, on the other hand, but) explicitly — they are not always direct translations.
  language: Spanish
  priority: medium
- adaptation: Arabic rhetorical style often uses repetition and elaboration for persuasion, while English debate values concise, structured arguments. Help Arabic-speaking students organize claims into premise-conclusion structure.
  language: Arabic
  priority: medium
- adaptation: Mandarin speakers may hesitate to express strong disagreement directly, as direct confrontation can be considered impolite. Frame the activity as academic practice — "we are practicing arguing, not fighting." Normalize disagreement in English academic culture.
  language: Mandarin
  priority: high
