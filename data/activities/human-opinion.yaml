teaching_tips:
- tip: 'Klippel includes questioning activities where students survey classmates about opinions and report findings. She notes that these activities work best when students must record answers and report back, giving them a genuine communicative purpose (Klippel 1984, Ch. 2.5: Questioning activities).'
  context: Klippel (1984)
- tip: 'Klippel notes that opinion-based activities are motivating because students are genuinely interested in what their peers think, creating authentic communicative situations (Klippel 1984, p. 51).'
  context: Klippel (1984)
- tip: Start with low-statement statements (e.g., "Pizza is the best food") before moving to more challenging ones ("Homework should be banned"). Students need to warm up to expressing opinions before tackling complex topics.
- tip: Teach the phrase "I used to think X, but now I think Y" for students who change their position. This gives them a grammatical framework for acknowledging persuasion.
- tip: After the activity, have students write a short paragraph defending their position. This extends the speaking practice into writing and reinforces discourse markers (firstly, moreover, however, in conclusion).
